      '<div class="bar"><i class="fill" style="width:'+(Math.min(c,3)/3*75)+'%"></i>'+l.st.map(function(t,i){var dn=i<c||(s==='done'&&i===3);return '<div class="st '+(dn?'done':i===c?'cur':'')+'"><div class="d">'+(dn?'✓':i+1)+'</div><span>'+t+'</span></div>';}).join('')+'</div></header><div class="sec">';
    /* ① 의뢰 */
    var it=itemLines(),c1s=cState(0,s),o1=S.open.c1||c1s==='cur';
    h+='<div class="card '+c1s+(o1?' open':'')+'">'+head('c1',0,s,manual?l.c1M:l.c1T,r&&r.submitted_at?l.c1S(fTs(r.submitted_at)):'')+'<div class="cb"><div class="kv">'+
      (it.length?'<span>'+l.kItem+'</span><b>'+esc(it.join('\n'))+'</b>':'')+(addr()?'<span>'+l.kAddr+'</span><b>'+esc(addr())+'</b>':'')+(r&&r.remarks?'<span>'+l.kMemo+'</span><b>'+esc(r.remarks)+'</b>':'')+'</div>'+
      (c1s==='cur'?'<div class="note"><span>🕐</span><span>'+l.c1Note+'</span></div><button type="button" class="sbtn" data-x="nt">'+l.c1Ask+'</button>':'')+'</div></div>';
    /* ② 예약 신청 */
    var c2s=cState(1,s),o2=S.open.c2||c2s==='cur',sl=S.bk?slots():[];
    var c2sub=c2s==='next'?l.c2Wait:(b.booking_date&&(s!=='bk'&&s!=='gone')?fD(b.booking_date)+' '+fT(b.booking_time):(s==='gone'?'':l.c2Cur(sl.length)));
    h+='<div class="card '+c2s+(o2?' open':'')+'">'+head('c2',1,s,l.c2T,c2sub);
    if(c2s!=='next'){h+='<div class="cb">';
      if(s==='bk'||(s==='bkd'&&S.re)){
        var rf=b.resched_from&&b.resched_from.date&&s==='bk'?b.resched_from:null;   // 🔁 관리자가 확정 일정을 취소하고 새 후보를 보낸 경우
        if(rf)h+='<div class="note"><span>🔁</span><span>'+l.rsN(fD(rf.date)+' '+esc(fT(rf.time)))+'</span></div><div style="height:10px"></div>';
        if(!sl.length)h+='<div class="note bad"><span>⚠️</span><span>'+l.noSlot+'</span></div>';
        else{
          h+='<div class="dl">'+sl.map(function(x){var t=ymdD(x.d),sel=S.pick&&S.pick.d===x.d;
            return '<div class="dc'+(sel?' sel':'')+'"><div class="db"><span class="m">'+(en()?MN[t.getMonth()]:(t.getMonth()+1)+'월')+'</span><span class="d">'+t.getDate()+'</span><span class="w">'+W[t.getDay()][en()?1:0]+'</span></div><div class="ts">'+
              x.t.map(function(tt){var ps=isPast(x.d,tt),tk=!ps&&isTaken(x.d,tt),on=sel&&S.pick.t===tt;
                return '<button type="button" class="t'+(on?' on':'')+'" data-d="'+esc(x.d)+'" data-t="'+esc(tt)+'"'+(ps||tk?' disabled':'')+'>'+esc(fT(tt))+(ps?'<span class="fl">'+l.past+'</span>':tk?'<span class="fl">'+l.full+'</span>':'')+'</button>';}).join('')+'</div></div>';}).join('')+'</div>'+
            '<button type="button" class="pbtn" data-x="book"'+(S.pick&&!S.busy?'':' disabled')+'>'+(S.busy?'…':S.pick?'📅 '+fD(S.pick.d)+' '+esc(fT(S.pick.t))+' · '+l.c2Go:l.c2Pick)+'</button>';
          if(s==='bkd')h+='<button type="button" class="sbtn" data-x="keep">'+l.c2Cancel+'</button>';
        }
      }else if(s==='gone'){
        h+='<div class="note bad"><span>⚠️</span><span>'+l.sub.gone+'</span></div><a class="sbtn" href="'+esc(waUrl())+'" target="_blank" rel="noopener">'+l.dock.gone+'</a>';
      }else{
        h+='<div class="kv"><span>'+l.c2Done+'</span><b>'+fD(b.booking_date)+' '+esc(fT(b.booking_time))+'</b></div>'+
          (s==='bkd'?'<div class="note"><span>⏳</span><span>'+l.c2WaitN+'</span></div>'+(slots().length?'<button type="button" class="sbtn" data-x="re">'+l.c2Re+'</button>':''):'');
      }
      h+='</div>';}
    h+='</div>';
    /* ③ 확정 */
    var c3s=cState(2,s),o3=S.open.c3||c3s==='cur';
    h+='<div class="card '+c3s+(o3?' open':'')+'">'+head('c3',2,s,l.c3T,c3s==='next'?l.c3S:fD(b.booking_date)+' '+esc(fT(b.booking_time)));
    if(c3s!=='next'){
      h+='<div class="cb"><div class="big"><small>'+l.visit+'</small><b>'+fD(b.booking_date)+'</b><span>'+esc(fT(b.booking_time))+(/전후|around|approx/i.test(fT(b.booking_time))?'':l.around)+'</span></div>'+
        '<div class="wp"><b>'+l.wpT+'</b><p>'+l.wpP+'</p><ul><li>'+l.wpCo+' · '+esc(VISIT.company)+'</li><li>'+l.wpCar+' · '+esc(VISIT.cars.join(' · '))+'</li><li>'+l.wpSt(VISIT.staff.length)+'</li></ul>'+
        '<div class="row2"><button type="button" class="sbtn" data-x="copy">'+l.wpCopy+'</button><a class="sbtn" href="'+esc(wpUrl())+'">'+l.wpOpen+'</a></div></div>'+
        (c3s==='cur'?'<button type="button" class="sbtn" data-x="nt">'+l.chg+'</button>':'')+'</div>';}
    h+='</div>';
    /* ④ 완료 */
    var c4s=cState(3,s);
    h+='<div class="card '+c4s+' open">'+head('c4',3,s,l.c4T,c4s==='next'?l.c4S:'')+(c4s!=='next'?'<div class="cb"><div class="note ok"><span>🧾</span><span>'+l.c4Note+'</span></div>'+(CID?'<a class="thx" href="'+esc(myUrl())+'"><b>'+l.myB+'</b><span>'+l.myS+'</span></a>':'')+'</div>':'')+'</div>';
    h+=ntBox();
    h+='</div><div class="foot">'+l.ft+'</div>';
    var _fx=document.activeElement&&document.activeElement.id==='ntx';
    app.innerHTML=h;window.scrollTo(0,y);
    var _t=document.getElementById('ntx');if(_t){_t.addEventListener('input',function(){S.ntv=_t.value;});_t.addEventListener('focus',function(){S.ntOn=true;});if(_fx)_t.focus({preventScroll:true});}
    /* 하단 */
    var a=s==='bk'||s==='bkd'?'<button type="button" class="a" data-x="dk">'+l.dock[s]+'</button>':s==='bkc'?'<a class="a" href="'+esc(wpUrl())+'">'+l.dock.bkc+'</a>':(s==='gone'?'<a class="a" href="'+esc(waUrl())+'" target="_blank" rel="noopener">'+l.dock[s]+'</a>':'<button type="button" class="a" data-x="nt">'+l.ntT+'</button>');
    var bb=CID?'<a class="b" href="'+esc(myUrl())+'">'+l.dockMy+'</a>':(s==='bk'||s==='bkd'||s==='bkc'?'<button type="button" class="b" data-x="nt">'+l.dockQ+'</button>':'');
    di.style.gridTemplateColumns=bb?'1.4fr 1fr':'1fr';di.innerHTML=a+bb;dock.hidden=false;
  }
  var _tt=0;function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(_tt);_tt=setTimeout(function(){t.classList.remove('on');},2400);}
  function copyTxt(t){try{if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);}catch(e){}
    return new Promise(function(ok){var a=document.createElement('textarea');a.value=t;a.setAttribute('readonly','');a.style.cssText='position:fixed;top:-99px;opacity:0';document.body.appendChild(a);a.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(a);ok();});}
  function book(){
    if(!S.pick||S.busy||!S.bkId)return;var l=L(),b=S.bk||{},wasBooked=b.status==='booked';
    S.busy=true;render();
    fetch('/api/booking',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:S.bkId,booking_date:S.pick.d,booking_time:S.pick.t,
      booking_items:String(b.booking_items||''),booking_items_struct:String(b.booking_items_struct||b.prefill_items_struct||''),booking_memo:String(b.booking_memo||''),edit:wasBooked})})
     .then(function(r){return r.json().then(function(j){return {s:r.status,j:j};},function(){return {s:r.status,j:null};});})
     .then(function(x){S.busy=false;
       if(x.s===200&&x.j&&x.j.ok){S.bk=Object.assign({},S.bk,{status:'booked',booking_date:S.pick.d,booking_time:S.pick.t});S.re=false;S.pick=null;render();window.scrollTo({top:0,behavior:'smooth'});toast(l.okBook);return;}
       if(x.j&&x.j.error==='slot-taken'){toast(l.taken);S.pick=null;load(true);return;}
       if(x.j&&x.j.error==='slot-past'){toast(l.pastT);S.pick=null;render();return;}
       toast(l.fail);render();})
     .catch(function(){S.busy=false;toast(l.fail);render();});
  }
  document.addEventListener('click',function(e){
    var lb=e.target.closest('.lang button');if(lb){S.lang=lb.dataset.l;render();return;}
    var ch=e.target.closest('.ch');if(ch){var k=ch.dataset.k,i={c1:0,c2:1,c3:2,c4:3}[k];if(cState(i,stage())==='done'){S.open[k]=!S.open[k];render();}return;}
    var tb=e.target.closest('.t[data-t]');if(tb&&!tb.disabled){S.pick={d:tb.dataset.d,t:tb.dataset.t};render();return;}
    var x=e.target.closest('[data-x]');if(!x)return;var a=x.dataset.x;
    if(a==='book')book();
    else if(a==='nt')ntGo();
    else if(a==='nts')ntSend();
    else if(a==='re'){S.re=true;render();}
    else if(a==='keep'){S.re=false;S.pick=null;render();}
    else if(a==='copy'){copyTxt(wpText()).then(function(){toast(L().copied);});}
    else if(a==='dk'){if(stage()==='bkd'&&!S.re&&slots().length){S.re=true;render();}var c=document.querySelector('.card.cur');if(c)c.scrollIntoView({behavior:'smooth',block:'start'});}
  });
  /* 불러오기 — 의뢰서 · 예약 ID → 예약(후보 날짜 · 마감) */
  function getJ(u){return fetch(u,{cache:'no-store'}).then(function(r){if(r.status>=500)throw new Error('5xx');return r.json();});}
  function load(quiet){
    var tries=0;
    (function go(){
      getJ('/api/job?j='+encodeURIComponent(J)).then(function(j){
        if(!j||!j.ok)throw new Error('nf');
        S.req=j.req||null;S.bkId=j.bk_id||'';
        if(!S.lang0){S.lang0=1;var ql=(q.get('lang')||'').toLowerCase();if(ql!=='en'&&ql!=='ko'&&S.req&&S.req.lang==='en')S.lang='en';}
        if(!S.bkId){S.bk=null;S.loaded=true;render();return;}
        return getJ('/api/booking?id='+encodeURIComponent(S.bkId)).then(function(k){
          if(!k||!k.ok||!k.doc)throw new Error('nf');
          var nb=k.doc;S.taken=k.taken||{};
          if(!S.bk&&!q.get('lang')&&(nb.customer_lang==='en'))S.lang='en';
          S.bk=nb;S.loaded=true;render();
        });
      }).catch(function(e){if(e.message==='5xx'&&tries++<2){setTimeout(go,800);return;}if(!quiet){S.err='load';render();}});
    })();
  }
  render();
  if(!J){S.err='bad';render();}else load(false);
  /* 30초마다 새로 확인 — 관리자가 확정하면 화면이 저절로 바뀝니다 (고르는 중에는 멈춤) */
  setInterval(function(){if(document.visibilityState!=='visible'||S.busy||S.pick||S.re||!S.loaded||S.ntOn||S.ntBusy||(S.ntv||'').trim())return;load(true);},30000);
})();
</script>
