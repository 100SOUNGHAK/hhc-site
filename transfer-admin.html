<style>
:root{
  --navy:#0E2350;--navy2:#16346E;--pri:#2563EB;--pri-bg:#EFF6FF;
  --ink:#14192A;--ink2:#5A6478;--ink3:#98A1B4;--line:#E4E9F2;--soft:#F6F8FC;
  --ok:#0E9B63;--ok-bg:#ECFDF5;--warn:#B45309;--warn-bg:#FFF7ED;--red:#DC2626;--red-bg:#FEF2F2;--gold:#B98A16;--gold-bg:#FEF9EC;
  --e1:0 1px 2px rgba(11,24,51,.09),0 5px 12px -3px rgba(11,24,51,.14);
  --e2:0 1px 2px rgba(11,24,51,.10),0 8px 16px -4px rgba(11,24,51,.16),0 26px 44px -14px rgba(11,24,51,.34);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--soft);color:var(--ink);padding:14px;max-width:1060px;margin:0 auto;word-break:keep-all}
button{font-family:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.hdr{background:linear-gradient(120deg,#0B1833,#1b2f58);border-radius:14px;padding:14px 18px;color:#fff;display:flex;align-items:center;gap:10px;margin-bottom:12px;
  box-shadow:0 3px 8px rgba(6,18,45,.25),0 14px 30px -14px rgba(6,18,45,.6)}
.hdr .lg{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.1)}
.hdr h1{font-size:17px;font-weight:900}
.hdr .hs{font-size:11px;font-weight:700;color:#B9C7E2}
.hdr .sp{flex:1}
.fb-dot{width:8px;height:8px;border-radius:50%;background:#64748b}
.fb-dot.on{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.8)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:10px;scrollbar-width:none}
.chip{flex:none;font-size:13px;font-weight:800;border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:999px;padding:8px 14px;white-space:nowrap}
.chip b{margin-left:4px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.hot b{color:var(--red)}.chip.on.hot b{color:#FCA5A5}
.srch{width:100%;font:inherit;font-size:15px;font-weight:600;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;margin-bottom:12px}
.srch:focus{outline:none;border-color:var(--pri)}
.list{display:grid;gap:10px}
@media (min-width:760px){.list{grid-template-columns:1fr 1fr}}
.card{background:#fff;border-radius:14px;padding:14px 15px;box-shadow:var(--e1);cursor:pointer;transition:transform .14s}
.card:active{transform:scale(.99)}
.card.new{box-shadow:0 0 0 2px #F0B429,var(--e1)}
.r1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kd{font-size:12px;font-weight:900;padding:3px 9px;border-radius:999px}
.kd.t{background:var(--pri-bg);color:#1d4ed8}.kd.v{background:var(--gold-bg);color:var(--gold)}
.pill{font-size:11.5px;font-weight:850;padding:3px 9px;border-radius:999px}
.pill.new{background:#FEF3C7;color:#92400E}.pill.checking{background:var(--pri-bg);color:#1d4ed8}.pill.done{background:var(--ok-bg);color:var(--ok)}.pill.cancel{background:#F1F3F7;color:var(--ink3)}
.r1 .tm{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink3)}
.nm{margin-top:8px;font-size:16.5px;font-weight:900;letter-spacing:-.02em}
.nm small{font-size:13px;font-weight:700;color:var(--ink2);margin-left:6px}
.sm{margin-top:5px;font-size:14px;font-weight:700;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.sm .am{color:var(--ink)}
.empty{grid-column:1/-1;background:#fff;border-radius:14px;padding:38px 20px;text-align:center;color:var(--ink2);font-size:14.5px;line-height:1.6;box-shadow:var(--e1)}
.empty b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px}
/* 상세 */
.dim{position:fixed;inset:0;z-index:40;background:rgba(10,20,40,.45);display:none;align-items:flex-end;justify-content:center}
.dim.on{display:flex}
.sheet{width:100%;max-width:620px;max-height:92vh;overflow-y:auto;background:var(--soft);border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
@media (min-width:760px){.dim{align-items:center}.sheet{border-radius:20px;max-height:88vh}}
.sh-hd{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;padding:14px 16px;background:linear-gradient(120deg,#0B1833,#1b2f58);color:#fff}
.sh-hd b{flex:1;font-size:16px;font-weight:900}
.sh-hd .x{width:34px;height:34px;border-radius:10px;border:0;color:#fff;background:rgba(255,255,255,.12);font-size:16px}
.box{margin:12px 14px 0;background:#fff;border-radius:14px;padding:14px 15px;box-shadow:var(--e1)}
.box h4{font-size:13px;font-weight:900;color:var(--ink3);margin-bottom:8px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:14.5px}
.kv span{color:var(--ink3);font-weight:700}
.kv b{font-weight:800;word-break:break-all}
.vt{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
.vt th{font-size:12px;color:var(--ink3);text-align:left;font-weight:800;padding:6px 4px;border-bottom:1px solid var(--line)}
.vt td{padding:8px 4px;border-bottom:1px solid var(--line);font-weight:700}
.vt tfoot td{border:0;font-weight:900}
.vt .r{text-align:right}
.tin{margin-top:14px;padding:12px 13px;border-radius:12px;background:var(--gold-bg)}
.tin-h{font-size:13.5px;font-weight:900;color:var(--gold)}
.tin-h small{display:block;font-size:11.5px;font-weight:700;color:var(--ink2)}
.tin-r{margin-top:10px;padding-top:10px;border-top:1px dashed #EADFC0}
.tin-r:first-of-type{border-top:0;padding-top:0}
.tin-r>b{display:block;font-size:14.5px}
.tin-bs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tin-b.kk{background:#FEE500;border-color:#F2D600;color:#3C1E1E}
.tin-lb{flex:1 1 100%;font-size:12.5px;font-weight:850;color:#1d4ed8}
.tin-lb small{font-weight:700;color:var(--ok)}
.tin-s{display:block;white-space:normal;font-size:11.5px;font-weight:800;color:var(--warn)}
.tin-s.ok{color:var(--ok)}
.tin-s.no{color:var(--ink3)}
.tin-b{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:850;color:var(--ink)}
.tin-b.wa{background:#E7F7EE;border-color:#BEE8D0;color:#0B7A43}
.tin-n{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px;padding:8px 10px;border-radius:10px;background:#fff;border-left:3px solid #C7D7FB}
.tin-b.nw{background:var(--pri-bg);border-color:#C7D7FB;color:#1d4ed8}
.tin-b small{font-weight:700;color:var(--ok)}
.tin-w{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--warn)}
.vt .rs{margin-top:2px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.ct{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--soft);margin-top:8px}
.ct div{flex:1;font-size:14px;font-weight:800}
.ct small{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
.ct .bal{font-size:16px;font-weight:900;color:var(--navy)}
.nomatch{font-size:13.5px;color:var(--ink2);font-weight:600}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ab{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:850;color:var(--ink);text-decoration:none}
.ab.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.ab.wa{background:#E7F7EE;border-color:#BEE8D0;color:#0B7A43}
.ab:active{transform:scale(.98)}
.stx{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stx button{min-height:42px;border-radius:11px;border:1.5px solid var(--line);background:#fff;font-size:13px;font-weight:850;color:var(--ink2)}
.stx button.on{background:var(--navy);border-color:var(--navy);color:#fff}
textarea.memo{width:100%;min-height:76px;font:inherit;font-size:14.5px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;resize:vertical}
textarea.memo:focus{outline:none;border-color:var(--pri)}
.memo-s{margin-top:8px;display:flex;justify-content:flex-end}
.memo-s button{border:0;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:850;background:var(--navy);color:#fff}
.del{display:block;margin:16px auto 0;border:0;background:none;color:var(--red);font-size:13.5px;font-weight:800}
.guide{font-size:13.5px;color:var(--ink2);line-height:1.6}
.guide b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;background:#0B1833;color:#fff;font-size:14px;font-weight:800;padding:11px 18px;border-radius:12px;box-shadow:var(--e2);display:none}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="hdr"><div class="lg">🔁</div><div><h1>양도 · 상품권 전환 신청</h1><div class="hs">고객이 /transfer 신청서로 접수한 내역</div></div><div class="sp"></div><span class="fb-dot" id="fb-dot" title="연결 상태"></span></div>
<div class="chips" id="chips"></div>
<input class="srch" id="q" type="search" placeholder="이름 · 콘도 · 전화 · 접수번호 · 계약번호 검색" autocomplete="off">
<div class="list" id="list"><div class="empty">불러오는 중…</div></div>
<div class="dim" id="dim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, initializeFirestore, persistentLocalCache, persistentMultipleTabManager } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
function hhcFastDb(app){
  try{return initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager(),cacheSizeBytes:150*1024*1024}),experimentalAutoDetectLongPolling:true});}
  catch(e){return getFirestore(app);}
}
const FIREBASE_CFG={
  apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",
  authDomain:"happywork-packageplan.firebaseapp.com",
  projectId:"happywork-packageplan",
  storageBucket:"happywork-packageplan.firebasestorage.app",
  messagingSenderId:"101289103022",
  appId:"1:101289103022:web:d81aca7f3747dd26df673f"
};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:0,maximumFractionDigits:2});
const pn=p=>{p=String(p||'').replace(/\D/g,'');if(p.indexOf('60')===0)p=p.slice(2);return p.replace(/^0+/,'');};
const nn=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
const ST={new:'새 신청',checking:'확인 중',done:'처리 완료',cancel:'취소'};
const RS={home:'✈️ 귀국',abroad:'🌏 타 국가 이주'};
let db=null,ALL=[],CT=[],curF='open',openId=null;

function when(iso){const d=new Date(iso);if(isNaN(d))return '';const t=Date.now()-d;
  if(t<3600e3)return Math.max(1,Math.round(t/60e3))+'분 전';if(t<86400e3)return Math.round(t/3600e3)+'시간 전';
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function amtTxt(r){
  if(r.kind==='transfer')return r.amt_mode==='part'?'RM '+fmt(r.t_total!=null?r.t_total:r.amt)+(Array.isArray(r.recipients)&&r.recipients.length>1?' · '+r.recipients.length+'명':''):'잔액 전부';
  return r.v_mode==='split'?'RM '+fmt(r.v_total)+' · '+(r.v_count||0)+'장':'잔액 전부 1장';
}
/* 계약 잔액 — admin.html ncBalance 와 같은 계산 (참고용) */
function bal(c){
  const total=(parseFloat(c.amount_paid)||0)+(parseFloat(c.bonus_credit)||0)+(parseFloat(c.special_bonus_credit)||0);
  let h=[];try{h=typeof c.usage_history==='string'?JSON.parse(c.usage_history||'[]'):(c.usage_history||[]);}catch(e){}
  const s=k=>h.reduce((a,u)=>a+(parseFloat(u[k])||0),0);
  return total-s('amount')+s('discount')+s('carryover');
}
/* 신청과 맞는 계약 찾기 — 계약번호 > 전화번호 > 이름 */
function matchCt(r){
  const no=nn(r.contract_no).replace(/-/g,''),p=pn(r.phone),n=nn(r.name);
  let m=[];
  if(no)m=CT.filter(c=>nn(c.contract_no).replace(/-/g,'')===no);
  if(!m.length&&p.length>=7)m=CT.filter(c=>pn(c.phone)===p);
  if(!m.length&&n)m=CT.filter(c=>nn(c.name)===n);
  return m.sort((a,b)=>(a.status==='ended')-(b.status==='ended'));
}
function counts(){const c={open:0,new:0,checking:0,done:0,cancel:0,all:ALL.length};
  ALL.forEach(r=>{c[r.status]=(c[r.status]||0)+1;if(r.status==='new'||r.status==='checking')c.open++;});return c;}
function paintChips(){
  const c=counts(),F=[['open','진행 중'],['new','새 신청'],['checking','확인 중'],['done','처리 완료'],['cancel','취소'],['all','전체']];
  $('chips').innerHTML=F.map(f=>'<button type="button" class="chip'+(curF===f[0]?' on':'')+(f[0]==='new'&&c.new?' hot':'')+'" data-f="'+f[0]+'">'+f[1]+'<b>'+(c[f[0]]||0)+'</b></button>').join('');
}
function paint(){
  paintChips();
  const q=nn($('q').value);
  const rows=ALL.filter(r=>{
    if(curF==='open'&&!(r.status==='new'||r.status==='checking'))return false;
    if(curF!=='open'&&curF!=='all'&&r.status!==curF)return false;
    if(!q)return true;
    return [r.name,r.condo,r.phone,r.ref,r.contract_no,r.to_name,r.to_phone].concat((r.recipients||[]).map(x=>x.name+' '+x.phone+' '+x.condo)).some(x=>nn(x).indexOf(q)>=0);
  });
  if(!rows.length){
    $('list').innerHTML='<div class="empty">'+(ALL.length?'<b>조건에 맞는 신청이 없습니다</b>위의 「전체」를 눌러 지난 신청을 보세요.'
      :'<b>아직 접수된 신청이 없습니다</b>고객이 /transfer 안내장에서 신청하면 여기에 보이고 앱 알림이 울립니다.')+'</div>';return;
  }
  $('list').innerHTML=rows.map(r=>{
    const t=r.kind==='transfer';
    return '<div class="card'+(r.status==='new'?' new':'')+'" data-id="'+r.__id+'"><div class="r1">'+
      '<span class="kd '+(t?'t':'v')+'">'+(t?'🔁 양도':'🎁 상품권 전환')+'</span><span class="pill '+esc(r.status)+'">'+(ST[r.status]||r.status)+'</span>'+tinCnt(r)+
      '<span class="tm">'+when(r.submitted_at)+'</span></div>'+
      '<div class="nm">'+esc(r.name)+'<small>'+esc(r.condo)+'</small></div>'+
      '<div class="sm">'+(t?'<span>→ '+esc(r.to_name)+'</span>':'')+'<span class="am num">'+amtTxt(r)+'</span><span>'+(RS[r.reason]||'')+(r.leave_date?' · '+r.leave_date.slice(5).replace('-','/')+' 출국':'')+'</span></div></div>';
  }).join('');
}
function waLink(phone,msg){let p=String(phone||'').replace(/\D/g,'');if(p.indexOf('0')===0)p='6'+p;return 'https://wa.me/'+p+'?text='+encodeURIComponent(msg);}
function openSheet(id){
  const r=ALL.find(x=>x.__id===id);if(!r)return;openId=id;
  const t=r.kind==='transfer',en=r.lang==='en',ms=matchCt(r);
  const msg=en?('Hello '+r.name+', this is Happy Home Care. We have received your '+(t?'balance transfer':'e-voucher conversion')+' application ('+(r.ref||'')+'). We will check your remaining balance and get back to you shortly.')
    :('안녕하세요 '+r.name+'님, 해피홈케어입니다. 회원권 잔액 '+(t?'양도':'상품권 전환')+' 신청('+(r.ref||'')+')을 접수했습니다. 남은 잔액을 확인한 뒤 다시 연락드리겠습니다.');
  const sub=x=>[x.condo,x.phone].filter(Boolean).map(esc).join(' · ');
  const vt=(!t&&r.v_mode==='split'&&Array.isArray(r.vouchers))?'<table class="vt"><thead><tr><th>장당 금액 × 장수</th><th>받는 분</th><th class="r">합계</th></tr></thead><tbody>'+
    r.vouchers.map(v=>'<tr><td class="num">RM '+fmt(v.amt)+' × '+v.qty+'</td><td>'+esc(v.to||'본인')+(sub(v)?'<div class="rs">'+sub(v)+'</div>':'')+'</td><td class="r num">RM '+fmt(v.amt*v.qty)+'</td></tr>').join('')+
    '</tbody><tfoot><tr><td colspan="2">상품권 합계 · '+(r.v_count||0)+'장</td><td class="r num">RM '+fmt(r.v_total)+'</td></tr></tfoot></table>':'';
  // 양도 받는 분 (여러 명 · 2026-11-23) — 예전 신청(to_name·to_phone 만 있는 것)도 한 줄로 보여 줍니다
  const RC=t?(Array.isArray(r.recipients)&&r.recipients.length?r.recipients:[{name:r.to_name,phone:r.to_phone,amt:r.amt}]):[];
  const rt=t?'<table class="vt"><thead><tr><th>받는 분</th><th class="r">양도 금액</th></tr></thead><tbody>'+
    RC.map(x=>'<tr><td>'+esc(x.name||'')+(x.phone?' <a href="'+waLink(x.phone,'')+'" target="_blank" rel="noopener" title="왓츠앱" style="text-decoration:none">💬</a>':'')+(sub(x)?'<div class="rs">'+sub(x)+'</div>':'')+'</td><td class="r num">'+(r.amt_mode==='part'?'RM '+fmt(x.amt):'잔액 전부')+'</td></tr>').join('')+
    '</tbody>'+(r.amt_mode==='part'&&RC.length>1?'<tfoot><tr><td>양도 합계 · '+RC.length+'명</td><td class="r num">RM '+fmt(r.t_total)+'</td></tr></tfoot>':'')+'</table>'+
    // 📨 양도받는 분 안내장 (/transfer-in) — 받는 분마다 왓츠앱으로 보내기 · 미리 보기 (2026-11-23)

/* 보낼 문구 — w: 'tin' 양도받는 분 안내장 · 'in' 받는 분께 완료 카드뉴스 · 'out' 양도인께 동의 카드뉴스 */

  return {url,phone:r.phone||'',btn:en?'View cards':'카드뉴스 보기',msg:en
    ?('Hello '+r.name+', this is Happy Home Care 😊\n\n✅ *'+(x.name||'')+' has agreed to the transfer*\nWe will now prepare the transfer contract and settle your contract.\n\n📰 See what remains 👉 '+url+SIG)
    :('안녕하세요 '+r.name+'님, 해피홈케어입니다 😊\n\n✅ *'+(x.name||'')+'님이 양도에 동의하셨습니다*\n이제 양도양수 계약서를 작성하고 기존 계약을 정리해 드리겠습니다.\n\n📰 남은 진행 순서를 카드로 확인해 보세요 👉 '+url+SIG)};

/* 📨 받는 분별 안내장 상태 — ✅ 동의(tin_ok) > 📨 보냄 · 미확인(tin_sent) > 아직 안 보냄 */
function tinSt(r,i){
  const ok=r.tin_ok&&r.tin_ok[String(i)],sent=r.tin_sent&&r.tin_sent[String(i)];
  return ok?'<small class="tin-s ok">✅ 동의 '+when(ok)+'</small>':sent?'<small class="tin-s">📨 미확인 · '+when(sent)+' 보냄</small>':'<small class="tin-s no">아직 안 보냄</small>';
}
/* 📰 동의 완료 카드뉴스 (/transfer-news) — 받는 분이 동의한 줄에만: 받는 분께 완료 안내 · 양도인께 동의 알림 (2026-11-23) */
function newsRow(r,i,x){
  if(!(r.tin_ok&&r.tin_ok[String(i)]))return '';
  const si=r.tnews_in&&r.tnews_in[String(i)],so=r.tnews_out&&r.tnews_out[String(i)];
  const bt=(w)=>'<button type="button" class="tin-b wa" data-send="'+w+'" data-ch="wa" data-i="'+i+'">💬 왓츠앱</button><button type="button" class="tin-b kk" data-send="'+w+'" data-ch="kk" data-i="'+i+'">💛 카톡</button>'+
    '<button type="button" class="tin-b" data-newsv="'+i+'" data-w="'+w+'" title="카드뉴스 미리 보기">👁</button>';
  return '<div class="tin-n"><span class="tin-lb">📰 받는 분께 완료 안내'+(si?' <small>✓ '+when(si)+' 보냄</small>':'')+'</span>'+bt('in')+'</div>'+
    '<div class="tin-n"><span class="tin-lb">📰 '+esc(r.name||'양도인')+'님께 동의 알림'+(so?' <small>✓ '+when(so)+' 보냄</small>':'')+'</span>'+bt('out')+'</div>';
}
function tinCnt(r){
  if(r.kind!=='transfer')return '';
  const n=(Array.isArray(r.recipients)&&r.recipients.length)?r.recipients.length:1,ok=Object.keys(r.tin_ok||{}).length,sent=Object.keys(r.tin_sent||{}).length;
  if(!sent&&!ok)return '';
  return '<span class="pill '+(ok>=n?'done':'checking')+'">받는 분 동의 '+ok+'/'+n+'</span>';
}
/* 📨 양도받는 분 안내장 주소 — 신청 문서에 토큰(tk) · 맞는 계약(ct_id)이 없으면 만들어 저장합니다 */
async function tinLink(r,i){
  try{
    const up={};
    if(!r.tk){const a=new Uint8Array(15);crypto.getRandomValues(a);up.tk=Array.from(a,v=>'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[v%56]).join('')+'x'+Date.now().toString(36);up.tk=up.tk.replace(/[^A-Za-z0-9]/g,'').slice(0,32);}
    const m=matchCt(r)[0];if(m&&m.__id!==r.ct_id)up.ct_id=m.__id;
    if(Object.keys(up).length){await updateDoc(doc(db,'transfer_reqs',r.__id),up);Object.assign(r,up);}
    return 'https://happyhomecare.com.my/transfer-in?k='+r.tk+'&i='+i+(r.lang==='en'?'&lang=en':'');
  }catch(e){toast('안내장 주소를 만들지 못했습니다: '+e.message);return '';}
}
function goTab(tab,copy){

  try{if(window.parent&&window.parent!==window&&window.parent.activate){window.parent.activate(tab);return;}}catch(e){}
  location.href=tab==='coupon'?'coupon-admin.html':'admin.html';
}

  }

    }else window.open(waLink(m.phone,m.msg),'_blank');

<script>
/* ══ 허브(staffapp.html) 안에서 열렸을 때 「화면 살아있음」 신호 — review-admin.html 과 같은 코드 ══ */
(function(){
  if(window.top===window.self)return;
  var ready=false,KEY='hhc_wd:'+location.pathname,n=0;
  try{n=parseInt(sessionStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  function post(m){try{window.parent.postMessage(m,'*');}catch(e){}}
  window.__hhcReady=function(){if(ready)return;ready=true;try{sessionStorage.removeItem(KEY);}catch(e){}post({hhcReady:1});};
  window.addEventListener('message',function(e){var d=e&&e.data;if(d&&d.hhcPing)post({hhcPong:1,ready:ready});});
  post({hhcHello:1});
  setTimeout(function(){
    if(ready)return;
    if(navigator.onLine===false||document.visibilityState!=='visible'){post({hhcStuck:1,soft:1});return;}
    post({hhcStuck:1});
  },40000);
})();
</script>
