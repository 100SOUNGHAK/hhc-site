<div class="hdr"><div class="lg">🔁</div><div><h1>양도 · 상품권 전환 신청</h1><div class="hs">고객이 /transfer 신청서로 접수한 내역</div></div><div class="sp"></div><span class="fb-dot" id="fb-dot" title="연결 상태"></span></div>

<input class="srch" id="q" type="search" placeholder="이름 · 콘도 · 전화 · 접수번호 · 계약번호 검색" autocomplete="off">

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, initializeFirestore, persistentLocalCache, persistentMultipleTabManager } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
function hhcFastDb(app){
  try{return initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager(),cacheSizeBytes:150*1024*1024}),experimentalAutoDetectLongPolling:true});}
  catch(e){return getFirestore(app);}
}
const FIREBASE_CFG={
  apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",
  authDomain:"happywork-packageplan.firebaseapp.com",
  projectId:"happywork-packageplan",
  storageBucket:"happywork-packageplan.firebasestorage.app",
  messagingSenderId:"101289103022",
  appId:"1:101289103022:web:d81aca7f3747dd26df673f"
};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:0,maximumFractionDigits:2});
const pn=p=>{p=String(p||'').replace(/\D/g,'');if(p.indexOf('60')===0)p=p.slice(2);return p.replace(/^0+/,'');};
const nn=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
const ST={new:'새 신청',checking:'확인 중',done:'처리 완료',cancel:'취소'};
const RS={home:'✈️ 귀국',abroad:'🌏 타 국가 이주'};
let db=null,ALL=[],CT=[],curF='open',openId=null;

function when(iso){const d=new Date(iso);if(isNaN(d))return '';const t=Date.now()-d;
  if(t<3600e3)return Math.max(1,Math.round(t/60e3))+'분 전';if(t<86400e3)return Math.round(t/3600e3)+'시간 전';
  return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function amtTxt(r){
  if(r.kind==='transfer')return r.amt_mode==='part'?'RM '+fmt(r.t_total!=null?r.t_total:r.amt)+(Array.isArray(r.recipients)&&r.recipients.length>1?' · '+r.recipients.length+'명':''):'잔액 전부';
  return r.v_mode==='split'?'RM '+fmt(r.v_total)+' · '+(r.v_count||0)+'장':'잔액 전부 1장';
}
/* 계약 잔액 — admin.html ncBalance 와 같은 계산 (참고용) */
function bal(c){
  const total=(parseFloat(c.amount_paid)||0)+(parseFloat(c.bonus_credit)||0)+(parseFloat(c.special_bonus_credit)||0);
  let h=[];try{h=typeof c.usage_history==='string'?JSON.parse(c.usage_history||'[]'):(c.usage_history||[]);}catch(e){}
  const s=k=>h.reduce((a,u)=>a+(parseFloat(u[k])||0),0);
  return total-s('amount')+s('discount')+s('carryover');
}
/* 신청과 맞는 계약 찾기 — 계약번호 > 전화번호 > 이름 */
function matchCt(r){
  const no=nn(r.contract_no).replace(/-/g,''),p=pn(r.phone),n=nn(r.name);
  let m=[];
  if(no)m=CT.filter(c=>nn(c.contract_no).replace(/-/g,'')===no);
  if(!m.length&&p.length>=7)m=CT.filter(c=>pn(c.phone)===p);
  if(!m.length&&n)m=CT.filter(c=>nn(c.name)===n);
  return m.sort((a,b)=>(a.status==='ended')-(b.status==='ended'));
}
function counts(){const c={open:0,new:0,checking:0,done:0,cancel:0,all:ALL.length};
  ALL.forEach(r=>{c[r.status]=(c[r.status]||0)+1;if(r.status==='new'||r.status==='checking')c.open++;});return c;}
function paintChips(){
  const c=counts(),F=[['open','진행 중'],['new','새 신청'],['checking','확인 중'],['done','처리 완료'],['cancel','취소'],['all','전체']];
  $('chips').innerHTML=F.map(f=>'<button type="button" class="chip'+(curF===f[0]?' on':'')+(f[0]==='new'&&c.new?' hot':'')+'" data-f="'+f[0]+'">'+f[1]+'<b>'+(c[f[0]]||0)+'</b></button>').join('');
}
function paint(){
  paintChips();
  const q=nn($('q').value);
  const rows=ALL.filter(r=>{
    if(curF==='open'&&!(r.status==='new'||r.status==='checking'))return false;
    if(curF!=='open'&&curF!=='all'&&r.status!==curF)return false;
    if(!q)return true;
    return [r.name,r.condo,r.phone,r.ref,r.contract_no,r.to_name,r.to_phone].concat((r.recipients||[]).map(x=>x.name+' '+x.phone+' '+x.condo)).some(x=>nn(x).indexOf(q)>=0);
  });
  if(!rows.length){
    $('list').innerHTML='<div class="empty">'+(ALL.length?'<b>조건에 맞는 신청이 없습니다</b>위의 「전체」를 눌러 지난 신청을 보세요.'
      :'<b>아직 접수된 신청이 없습니다</b>고객이 /transfer 안내장에서 신청하면 여기에 보이고 앱 알림이 울립니다.')+'</div>';return;
  }
  $('list').innerHTML=rows.map(r=>{

async function saveEdit(){
  edRead();edErr('');
  const r=ALL.find(x=>x.__id===EDIT);if(!r)return;
  const t=r.kind==='transfer';
  if(!W.name.trim())return edErr('계약자 이름을 입력해 주세요.');
  const up={name:W.name.trim(),condo:W.condo.trim(),phone:W.phone.trim(),contract_no:W.contract_no.trim(),reason:W.reason==='abroad'?'abroad':'home',
    leave_date:/^\d{4}-\d{2}-\d{2}$/.test(W.leave_date)?W.leave_date:'',remarks:W.remarks.trim()};
  const drop=[];   // 동의 기록을 지울 받는 분 이름
  if(t){
    if(W.amt_mode==='all'&&W.rc.length>1)return edErr('「잔액 전부」는 받는 분 1명만 가능합니다. 「금액 정해서」로 바꾸거나 받는 분을 줄여 주세요.');
    const rc=[];
    for(let k=0;k<W.rc.length;k++){const x=W.rc[k],n='받는 분 '+(k+1);
      const o={name:x.name.trim(),condo_name:x.condo_name.trim(),unit:x.unit.trim(),phone:x.phone.trim()};
      o.condo=(o.condo_name+' '+o.unit).trim();
      if(!o.name||!o.condo_name||!o.unit)return edErr(n+'의 이름 · 콘도명 · 동호수를 모두 입력해 주세요.');
      if(dg(o.phone).length<9)return edErr(n+'의 전화번호를 확인해 주세요(9자리 이상).');
      if(W.amt_mode==='part'){o.amt=Math.round((parseFloat(x.amt)||0)*100)/100;if(!(o.amt>0))return edErr(n+'의 양도 금액을 입력해 주세요.');}
      rc.push(o);}
    // 받는 분 번호에 묶인 기록 다시 맞추기 + 동의한 분 내용이 바뀌었는지
    const OLD=(Array.isArray(r.recipients)&&r.recipients.length)?r.recipients:[{name:r.to_name,phone:r.to_phone,amt:r.amt}];
    const maps={};RMAPS.forEach(f=>{if(r[f]&&typeof r[f]==='object')maps[f]={};});
    W.rc.forEach((x,k)=>{
      if(x._o==null)return;
      Object.keys(maps).forEach(f=>{const v=r[f][String(x._o)];if(v)maps[f][String(k)]=v;});
      const a=OLD[x._o]||{},b=rc[k];
      const changed=nn(a.name)!==nn(b.name)||nn(a.condo||((a.condo_name||'')+' '+(a.unit||'')))!==nn(b.condo)||pn(a.phone)!==pn(b.phone)||
        (r.amt_mode||'all')!==W.amt_mode||(W.amt_mode==='part'&&Math.abs((parseFloat(a.amt)||0)-b.amt)>0.005);
      if(changed&&maps.tin_ok&&maps.tin_ok[String(k)]){drop.push(b.name);['tin_ok','tin_sent','tnews_in','tnews_out'].forEach(f=>{if(maps[f])delete maps[f][String(k)];});}
    });
    if(drop.length&&!confirm(drop.join(', ')+'님은 이미 양도에 동의했습니다.\n이름 · 콘도 · 전화 · 금액이 바뀌어 동의 기록을 지웁니다. 저장 후 안내장을 다시 보내 동의를 받아 주세요.\n\n저장할까요?'))return;
    Object.assign(up,maps,{amt_mode:W.amt_mode,recipients:rc,to_name:rc[0].name+(rc.length>1?' 외 '+(rc.length-1)+'명':''),to_phone:rc[0].phone,
      t_total:W.amt_mode==='part'?Math.round(rc.reduce((a,x)=>a+x.amt,0)*100)/100:null});
  }else{
    up.v_mode=W.v_mode;
    if(W.v_mode==='split'){
      const vs=[];
      for(let k=0;k<W.vc.length;k++){const v=W.vc[k],n='상품권 '+(k+1)+'번 줄';
        const o={amt:Math.round((parseFloat(v.amt)||0)*100)/100,qty:parseInt(v.qty)||0,to:v.to.trim(),condo_name:v.condo_name.trim(),unit:v.unit.trim(),phone:v.phone.trim()};
        o.condo=(o.condo_name+' '+o.unit).trim();
        if(!(o.amt>0&&o.qty>0))return edErr(n+'의 장당 금액 · 장수를 확인해 주세요.');
        if(!o.to||!o.condo_name||!o.unit)return edErr(n+'의 받는 분 이름 · 콘도명 · 동호수를 모두 입력해 주세요.');
        if(dg(o.phone).length<9)return edErr(n+'의 전화번호를 확인해 주세요(9자리 이상).');
        vs.push(o);}
      Object.assign(up,{vouchers:vs,v_total:Math.round(vs.reduce((a,v)=>a+v.amt*v.qty,0)*100)/100,v_count:vs.reduce((a,v)=>a+v.qty,0)});
    }else Object.assign(up,{vouchers:[],v_total:null,v_count:null});
  }
  // 맞는 계약 다시 찾기 (계약자 정보를 고쳤을 수 있음) — 못 찾으면 기존 연결 유지
  const m=matchCt(Object.assign({},r,up))[0];if(m)up.ct_id=m.__id;
  const at=new Date().toISOString();
  up.edited_at=at;up.updated_at=at;
  up.edit_log=(Array.isArray(r.edit_log)?r.edit_log:[]).concat([{at:at,by:(window.HHCAuth&&typeof HHCAuth.email==='string'&&HHCAuth.email)||'',dropped_ok:drop}]).slice(-30);
  const btn=document.querySelector('[data-esave]');if(btn){btn.disabled=true;btn.textContent='저장 중…';}
  try{await updateDoc(doc(db,'transfer_reqs',EDIT),up);Object.assign(r,up);const id=EDIT;EDIT=null;openSheet(id);$('sheet').scrollTop=0;
    toast(drop.length?'수정했습니다 — '+drop.join(', ')+'님께 안내장을 다시 보내 주세요':'신청 내용을 수정했습니다');}
  catch(e){if(btn){btn.disabled=false;btn.textContent='💾 수정 저장';}edErr('저장 실패: '+(e.message||e));}
}

function tinCnt(r){
  if(r.kind!=='transfer')return '';
  const n=(Array.isArray(r.recipients)&&r.recipients.length)?r.recipients.length:1,ok=Object.keys(r.tin_ok||{}).length,sent=Object.keys(r.tin_sent||{}).length;

    (ctn?'<span class="pill '+(ctn>=n?'done':'checking')+'">계약서 '+ctn+'/'+n+'</span>':'');

/* 📨 양도받는 분 안내장 주소 — 신청 문서에 토큰(tk) · 맞는 계약(ct_id)이 없으면 만들어 저장합니다 */
async function tinLink(r,i){
  try{
    const up={};
    if(!r.tk){const a=new Uint8Array(15);crypto.getRandomValues(a);up.tk=Array.from(a,v=>'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[v%56]).join('')+'x'+Date.now().toString(36);up.tk=up.tk.replace(/[^A-Za-z0-9]/g,'').slice(0,32);}
    const m=matchCt(r)[0];if(m&&m.__id!==r.ct_id)up.ct_id=m.__id;
    if(Object.keys(up).length){await updateDoc(doc(db,'transfer_reqs',r.__id),up);Object.assign(r,up);}
    return 'https://happyhomecare.com.my/transfer-in?k='+r.tk+'&i='+i+(r.lang==='en'?'&lang=en':'');
  }catch(e){toast('안내장 주소를 만들지 못했습니다: '+e.message);return '';}
}

});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!EDIT)closeSheet();});
$('q').addEventListener('input',paint);

try{
  const app=initializeApp(FIREBASE_CFG);db=hhcFastDb(app);
  onSnapshot(collection(db,'transfer_reqs'),snap=>{
    window.__hhcReady&&window.__hhcReady();
    ALL=snap.docs.map(d=>Object.assign({__id:d.id},d.data()||{})).sort((a,b)=>String(b.submitted_at||'').localeCompare(String(a.submitted_at||'')));
    $('fb-dot').classList.add('on');paint();
    if(openId&&$('dim').classList.contains('on')&&!EDIT){const keep=$('memo')?$('memo').value:null;const sc=$('sheet').scrollTop;openSheet(openId);if(keep!=null)$('memo').value=keep;$('sheet').scrollTop=sc;}
  },err=>{$('list').innerHTML='<div class="empty"><b>신청 내역을 불러오지 못했습니다</b>'+esc(err.message)+'</div>';});
  // 계약 목록 — 신청과 맞는 계약 · 잔액 표시용 (읽기만)
  onSnapshot(collection(db,'contracts'),snap=>{CT=snap.docs.map(d=>Object.assign({__id:d.id},d.data()||{}));if(openId&&!EDIT)openSheet(openId);},()=>{});
}catch(e){$('list').innerHTML='<div class="empty"><b>연결에 실패했습니다</b>'+esc(e.message)+'</div>';}
</script>
<script>
/* ══ 허브(staffapp.html) 안에서 열렸을 때 「화면 살아있음」 신호 — review-admin.html 과 같은 코드 ══ */
(function(){
  if(window.top===window.self)return;
  var ready=false,KEY='hhc_wd:'+location.pathname,n=0;
  try{n=parseInt(sessionStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  function post(m){try{window.parent.postMessage(m,'*');}catch(e){}}
  window.__hhcReady=function(){if(ready)return;ready=true;try{sessionStorage.removeItem(KEY);}catch(e){}post({hhcReady:1});};
  window.addEventListener('message',function(e){var d=e&&e.data;if(d&&d.hhcPing)post({hhcPong:1,ready:ready});});
  post({hhcHello:1});
  setTimeout(function(){
    if(ready)return;
    if(navigator.onLine===false||document.visibilityState!=='visible'){post({hhcStuck:1,soft:1});return;}
    post({hhcStuck:1});
  },40000);
})();
</script>
