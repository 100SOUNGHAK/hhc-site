<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>간편 견적 계산기 | 해피홈케어</title>
<meta name="description" content="필요한 품목과 수량만 고르면 예상 금액을 바로 확인할 수 있는 해피홈케어 간편 견적 계산기입니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="간편 견적 계산기 | 해피홈케어">
<meta property="og:description" content="품목 · 수량만 고르면 예상 금액 바로 확인 · Quick estimate calculator">
<meta property="og:image" content="https://happyhomecare.com.my/og-calc.jpg">
<meta name="theme-color" content="#0f2540">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f2540;color:#e3c98a;
  font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;font-size:15px;font-weight:700;text-align:center}
a{color:#fff}
</style>
<script>
/* 전자명함 「안내 링크 보내기」용 짧은 주소 — 홈페이지 간편 견적 계산기를 펼쳐서 엽니다 (2026-11-20)
   /calc → /home?open=calc   ·   /calc?lang=en → 영문 */
(function(){
  var en = /[?&]lang=en(&|$)/i.test(location.search);
  var fc = /[?&]from=card(&|$)/i.test(location.search);   /* 전자명함에서 열면 「← 명함으로」 버튼 */
  location.replace('/home?open=calc' + (en ? '&lang=en' : '') + (fc ? '&from=card' : ''));
})();
</script>
</head>
<body>
<p>견적 계산기로 이동하는 중…<br><br><a href="/home?open=calc">바로 이동하기</a></p>
</body>
</html>
