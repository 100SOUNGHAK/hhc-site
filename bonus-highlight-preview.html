<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>무상적립 강조 미리보기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600&family=Pretendard&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0f2540; --teal-600:#0f766e; --teal-50:#eaf6f4;
    --gold-500:#c9a44c; --gold-300:#e3c98a; --cream-100:#f3ede0;
    --ink-600:#4d5866; --ink-400:#8891a0; --line:#e6e0d2;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Pretendard',-apple-system,sans-serif;background:#faf8f3;color:var(--ink-600);padding:24px 14px 60px;}
  h1,h2,h3{font-family:'Noto Serif KR',serif;}
  .wrap{max-width:420px;margin:0 auto;}
  .label{text-align:center;font-size:12px;font-weight:700;color:var(--ink-400);letter-spacing:.08em;text-transform:uppercase;margin:26px 0 10px;}
  .tier-card{background:#fff;border-radius:18px;padding:26px 22px;border:1px solid var(--line);position:relative;overflow:hidden;margin-bottom:6px;}
  .tier-card.recommended{border-color:var(--teal-600);}
  .tier-name{font-size:19px;font-weight:600;color:var(--navy-900);margin-bottom:2px;}
  .tier-sub{font-size:11px;letter-spacing:.1em;color:var(--gold-500);font-weight:700;margin-bottom:14px;}
  .tier-price{font-size:24px;font-weight:700;color:var(--navy-900);margin-bottom:2px;}
  .tier-price span{font-size:12.5px;font-weight:500;color:var(--ink-400);}

  /* BEFORE */
  .tier-bonus-old{background:var(--teal-50);color:var(--teal-600);font-size:12.5px;font-weight:700;padding:8px 12px;border-radius:8px;margin:14px 0 18px;text-align:center;}

  /* AFTER — enhanced */
  .tier-bonus-new{
    position:relative;
    background:linear-gradient(120deg,var(--gold-300),var(--gold-500));
    color:#fff;
    font-size:14.5px;
    font-weight:800;
    padding:11px 14px;
    border-radius:10px;
    margin:16px 0 18px;
    text-align:center;
    box-shadow:0 8px 18px -6px rgba(201,164,76,.55);
    display:flex;align-items:center;justify-content:center;gap:6px;
    letter-spacing:.01em;
  }
  .tier-bonus-new .icon{font-size:16px;}

  .tier-total{font-size:13px;color:var(--ink-600);margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--cream-100);}
  .tier-total b{color:var(--navy-900);font-size:15px;}
  .tier-card ul{list-style:none;margin:0;padding:0;font-size:13px;}
  .tier-card li{padding:7px 0;border-top:1px solid var(--cream-100);display:flex;gap:8px;color:var(--ink-600);}
  .tier-card li::before{content:"✓";color:var(--teal-600);font-weight:700;}

  .note{text-align:center;font-size:11.5px;color:var(--ink-400);margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">

  <div class="label">이전 (Before)</div>
  <div class="tier-card">
    <div class="tier-name">골드</div>
    <div class="tier-sub">GOLD</div>
    <div class="tier-price">RM 5,000 <span>납부금액</span></div>
    <div class="tier-bonus-old">+ RM 750 무상적립</div>
    <div class="tier-total">총 사용 가능 금액 <b>RM 5,750</b></div>
    <ul>
      <li>로얄 등급 혜택 전체 포함</li>
      <li>주차비용 · 예약보증금 면제</li>
    </ul>
  </div>

  <div class="label">개선 후 (After)</div>
  <div class="tier-card recommended">
    <div class="tier-name">골드</div>
    <div class="tier-sub">GOLD</div>
    <div class="tier-price">RM 5,000 <span>납부금액</span></div>
    <div class="tier-bonus-new"><span class="icon">🎁</span>+ RM 750 무상적립</div>
    <div class="tier-total">총 사용 가능 금액 <b>RM 5,750</b></div>
    <ul>
      <li>로얄 등급 혜택 전체 포함</li>
      <li>주차비용 · 예약보증금 면제</li>
    </ul>
  </div>
  <p class="note">골드 배지 + 그림자 + 굵은 글씨로 눈에 띄게, 🎁 아이콘으로 "혜택"임을 직관적으로 전달</p>

</div>
</body>
</html>
