<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>해피홈케어 쿠폰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pagebg:#EDEFF4;--gold:#c9a44c;--gold2:#e8cf8a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:var(--pagebg);color:#1a1a2e;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.wrap{max-width:420px;width:100%}

/* ══ 딥 네이비 포일 카드 ══ */
.gift{position:relative;border-radius:24px;overflow:hidden;color:#fff;
  background:
   radial-gradient(120% 90% at 12% -5%, #1b3c63 0%, rgba(27,60,99,0) 58%),
   radial-gradient(90% 70% at 108% 106%, rgba(201,164,76,.20) 0%, rgba(201,164,76,0) 60%),
   linear-gradient(170deg,#0B1B2F 0%,#050C17 100%);
  border:1px solid rgba(201,164,76,.42);
  box-shadow:0 34px 64px -30px rgba(5,12,23,.85),0 0 0 1px rgba(255,255,255,.03) inset}
.gu{position:absolute;top:-120px;right:-120px;width:330px;height:330px;pointer-events:none;
  background:repeating-radial-gradient(circle at 50% 50%,rgba(201,164,76,.16) 0 1px,rgba(201,164,76,0) 1px 10px);
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 40%,transparent 72%);mask-image:radial-gradient(circle at 50% 50%,#000 40%,transparent 72%)}
.foil{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#8a6f2b,#c9a44c 18%,#f4e3ae 42%,#c9a44c 68%,rgba(201,164,76,0));background-size:220% 100%;animation:foilmv 5.5s linear infinite;z-index:3}
@keyframes foilmv{to{background-position:-220% 0}}

.g-body{padding:26px 24px 0;position:relative;z-index:2}
.g-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.g-logo{width:34px;height:34px;border:1px solid rgba(201,164,76,.75);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif KR',serif;font-size:15px;color:var(--gold2);flex-shrink:0;background:radial-gradient(circle at 32% 26%,rgba(232,207,138,.2),transparent 70%)}
.g-bt b{font-size:13.5px;font-weight:800;letter-spacing:-.01em;display:block}
.g-bt span{font-size:7.5px;letter-spacing:.15em;color:#7f95b1;font-weight:600}
.g-no{margin-left:auto;text-align:right;font-size:8px;letter-spacing:.14em;color:#7f95b1;font-weight:700}
.g-no i{display:block;font-style:normal;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--gold2);letter-spacing:.08em;margin-top:2px}
.g-type{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.g-type .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,164,76,.55))}
.g-type .ln:last-child{background:linear-gradient(90deg,rgba(201,164,76,.55),transparent)}
.g-type em{font-style:normal;font-size:13.5px;font-weight:900;letter-spacing:.16em;color:var(--gold2);white-space:nowrap}
.g-amt{font-family:'Noto Serif KR',serif;font-size:56px;font-weight:700;line-height:1.05;text-align:center;letter-spacing:-.02em;word-break:break-all;
  background:linear-gradient(104deg,#a5822f 0%,#e8cf8a 26%,#fff6dd 44%,#e8cf8a 62%,#a5822f 100%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:shine 6s linear infinite;filter:drop-shadow(0 3px 12px rgba(201,164,76,.28))}
@keyframes shine{to{background-position:-260% 0}}
.g-amt small{font-family:inherit;font-size:22px;font-weight:600;letter-spacing:0;margin-right:5px;vertical-align:8px}
.g-cond{margin:15px auto 0;display:table;max-width:100%;font-size:11.5px;font-weight:600;color:#e5d5ab;background:rgba(201,164,76,.13);border:1px solid rgba(201,164,76,.32);padding:6px 15px;border-radius:100px;text-align:center;line-height:1.5}
.g-perf{position:relative;height:34px;margin-top:22px}
.g-perf::before{content:"";position:absolute;top:50%;left:20px;right:20px;border-top:2px dashed rgba(255,255,255,.22)}
.g-perf i{position:absolute;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--pagebg);box-shadow:0 0 0 1px rgba(201,164,76,.3) inset}
.g-perf i.l{left:-12px}.g-perf i.r{right:-12px}
.g-body2{padding:0 24px 24px;position:relative;z-index:2}
.g-info{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:15px;padding:5px 15px}
.g-info .ir{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.g-info .ir:last-child{border-bottom:none}
.g-info .ir span{font-size:10px;font-weight:700;letter-spacing:.09em;color:#8ba3c0;flex-shrink:0}
.g-info .ir b{font-size:13px;font-weight:700;color:#f0f5fb;text-align:right;letter-spacing:-.01em}
.g-cw{margin-top:13px;border:1.5px dashed rgba(201,164,76,.5);border-radius:15px;background:rgba(201,164,76,.06);padding:11px 12px 12px;text-align:center}
.g-cw .cl{font-size:8px;font-weight:900;letter-spacing:.2em;color:#a58c55;margin-bottom:5px}
.g-cw .cd{font-family:ui-monospace,Menlo,monospace;font-size:18px;font-weight:800;letter-spacing:.11em;color:var(--gold2);word-break:break-all}
.g-qr{margin-top:13px;background:#fff;border-radius:16px;padding:15px 12px 11px;text-align:center}
.qrb{position:relative;width:132px;height:132px;margin:0 auto}
.qrb .qr-in{width:132px;height:132px;display:flex;align-items:center;justify-content:center}
.qrb img,.qrb canvas{width:132px;height:132px;display:block;border-radius:3px}
.qrb i{position:absolute;width:15px;height:15px;border:2.5px solid #0d1f38;border-radius:2px;pointer-events:none}
.qrb i.tl{top:-7px;left:-7px;border-right:none;border-bottom:none;border-top-left-radius:5px}
.qrb i.tr{top:-7px;right:-7px;border-left:none;border-bottom:none;border-top-right-radius:5px}
.qrb i.bl{bottom:-7px;left:-7px;border-right:none;border-top:none;border-bottom-left-radius:5px}
.qrb i.rb{bottom:-7px;right:-7px;border-left:none;border-top:none;border-bottom-right-radius:5px}
.g-qr-lbl{font-size:9.5px;color:#5b6478;margin-top:11px;line-height:1.55;font-weight:600}
.gift.used .g-qr,.gift.exp .g-qr{opacity:.22;filter:grayscale(1)}
.g-status{margin-top:13px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:12.5px;font-weight:800;padding:12px;border-radius:13px;letter-spacing:-.01em;text-align:center}
.g-status.ok{background:linear-gradient(120deg,rgba(16,185,129,.22),rgba(16,185,129,.11));color:#7cf0c0;border:1px solid rgba(16,185,129,.34)}
.g-status.used{background:rgba(255,255,255,.07);color:#93a6bd;border:1px solid rgba(255,255,255,.12)}
.g-status.exp{background:linear-gradient(120deg,rgba(231,76,60,.22),rgba(231,76,60,.1));color:#ffaba1;border:1px solid rgba(231,76,60,.32)}
.g-terms{margin-top:15px;padding-top:13px;border-top:1px dashed rgba(255,255,255,.16)}
.g-terms-t{font-size:8.5px;font-weight:900;letter-spacing:.2em;color:var(--gold);margin-bottom:6px}
.g-terms div:not(.g-terms-t){font-size:10.5px;color:#93a6bd;line-height:1.75;padding-left:12px;position:relative}
.g-terms div:not(.g-terms-t)::before{content:"·";position:absolute;left:3px;color:var(--gold);font-weight:900}
.g-ft{margin-top:15px;text-align:center;font-size:9.5px;color:#75899f;font-weight:600;letter-spacing:.01em}

.g-stamp{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,12,23,.74);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);z-index:5}
.g-stamp span{font-family:'Noto Serif KR',serif;font-size:31px;font-weight:700;color:#fff;border:3px solid rgba(255,255,255,.9);border-radius:14px;padding:11px 30px;transform:rotate(-11deg);letter-spacing:.06em;opacity:.94}
.gift.used .g-stamp,.gift.exp .g-stamp{display:flex}

.contact{margin-top:16px;text-align:center}
.contact a{display:inline-flex;align-items:center;gap:7px;background:#25D366;color:#fff;font-weight:700;font-size:12.5px;padding:11px 22px;border-radius:100px;text-decoration:none;box-shadow:0 12px 26px -12px rgba(37,211,102,.6)}
.center-msg{text-align:center;color:#6b7280;font-size:13px;padding:40px 10px}
.spin{width:26px;height:26px;border:3px solid #d5dae8;border-top-color:#c9a44c;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="center-msg"><div class="spin"></div>쿠폰을 불러오는 중...</div>
  <div id="err" class="center-msg" style="display:none">쿠폰을 찾을 수 없습니다.<br>링크를 다시 확인해 주세요.</div>

  <div class="gift" id="gift" style="display:none">
    <div class="g-stamp"><span id="stampTxt">사용완료</span></div>
    <div class="gu"></div><div class="foil"></div>

    <div class="g-body">
      <div class="g-brand">
        <div class="g-logo">H</div>
        <div class="g-bt"><b id="gBrand">해피홈케어</b><span>HAPPY WORKS SERVICES SDN. BHD.</span></div>
        <div class="g-no">No.<i id="gNo">—</i></div>
      </div>
      <div class="g-type"><span class="ln"></span><em id="gType">GIFT VOUCHER · 상품권</em><span class="ln"></span></div>
      <div class="g-amt" id="gAmt"></div>
      <div class="g-cond" id="gDesc" style="display:none"></div>
    </div>

    <div class="g-perf"><i class="l"></i><i class="r"></i></div>

    <div class="g-body2">
      <div class="g-info">
        <div class="ir"><span id="lblTo">받는 분</span><b id="gName">—</b></div>
        <div class="ir" id="rowExp" style="display:none"><span id="lblExp">유효기간</span><b id="gExp"></b></div>
        <div class="ir"><span id="lblIss">발급일</span><b id="gIss">—</b></div>
      </div>
      <div class="g-cw"><div class="cl">COUPON CODE</div><div class="cd" id="gCode">—</div></div>
      <div class="g-qr">
        <div class="qrb"><div class="qr-in" id="qrBox"></div><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="rb"></i></div>
        <div class="g-qr-lbl" id="qrLbl">매장 제시용 QR · 직원이 스캔하면 확인 화면이 열립니다</div>
      </div>
      <div class="g-status ok" id="gStatus"></div>
      <div class="g-terms">
        <div class="g-terms-t" id="lblTerms">유 의 사 항</div>
        <div id="term1">서비스당 1장 사용 가능합니다.</div>
        <div id="term2">본 쿠폰은 무단 양도가 불가합니다.</div>
      </div>
      <div class="g-ft" id="gFt">쿠폰 확인 hhc-3p8.pages.dev/coupon · 📞 +60 17-247 2774</div>
    </div>
  </div>

  <div class="contact" id="contact" style="display:none">
    <a href="https://wa.me/60172472774" target="_blank" rel="noopener" id="waBtn">📞 문의 · WhatsApp</a>
  </div>
</div>

<script>
var LANG=(new URLSearchParams(location.search).get('lang')||'ko')==='en'?'en':'ko';
var T={
  ko:{gift:'GIFT VOUCHER · 상품권',disc:'DISCOUNT COUPON · 할인권',to:'받는 분',exp:'유효기간',iss:'발급일',until:' 까지',
      ok:'✅ 사용 가능한 쿠폰입니다',used:'이미 사용된 쿠폰입니다',expd:'유효기간이 지난 쿠폰입니다',
      stampUsed:'사용완료',stampExp:'기간만료',terms:'유 의 사 항',
      t1:'서비스당 1장 사용 가능합니다.',t2:'본 쿠폰은 무단 양도가 불가합니다.',
      qr:'매장 제시용 QR · 직원이 스캔하면 확인 화면이 열립니다',nameSfx:' 님',
      brand:'해피홈케어',noLimit:'제한 없음',
      ft:'쿠폰 확인 hhc-3p8.pages.dev/coupon · 📞 +60 17-247 2774',
      contact:'📞 문의 · WhatsApp'},
  en:{gift:'GIFT VOUCHER',disc:'DISCOUNT COUPON',to:'TO',exp:'VALID UNTIL',iss:'ISSUED',until:'',
      ok:'✅ This coupon is valid',used:'This coupon has already been used',expd:'This coupon has expired',
      stampUsed:'USED',stampExp:'EXPIRED',terms:'T E R M S',
      t1:'One coupon per service.',t2:'This coupon is not transferable.',
      qr:'Show this QR at service · staff scan opens verification',nameSfx:'',
      brand:'Happy Home Care',noLimit:'No limit',
      ft:'Verify: hhc-3p8.pages.dev/coupon · 📞 +60 17-247 2774',
      contact:'📞 Contact · WhatsApp'}
};
var t=T[LANG];
function gid(id){return document.getElementById(id);}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

window.__renderCoupon=function(c){
  gid('loading').style.display='none';
  if(!c){gid('err').style.display='block';return;}
  gid('gift').style.display='block';
  gid('contact').style.display='block';
  gid('gType').textContent=c.type==='discount'?t.disc:t.gift;
  gid('gAmt').innerHTML=(function(){
    var v=String(c.value||'');
    var m=v.match(/^RM\s*([\d,.]+)$/i);
    if(m)return '<small>RM</small>'+m[1];
    var p=v.match(/^([\d,.]+)\s*%$/);
    if(p)return p[1]+'<small style="margin-right:0;margin-left:4px">%</small>';
    return v;
  })();
  if(c.cond){gid('gDesc').style.display='table';gid('gDesc').textContent=c.cond;}
  gid('gName').textContent=(c.name||'—')+t.nameSfx;
  if(c.expiry){gid('rowExp').style.display='flex';gid('gExp').textContent=c.expiry+t.until;}
  gid('gIss').textContent=c.issuedAt||'—';
  gid('gCode').textContent=c.code||'—';
  gid('gNo').textContent=(c.code||'').split('-').pop()||'—';
  gid('lblTo').textContent=t.to;gid('lblExp').textContent=t.exp;gid('lblIss').textContent=t.iss;
  gid('lblTerms').textContent=t.terms;gid('term1').textContent=t.t1;gid('term2').textContent=t.t2;
  gid('qrLbl').textContent=t.qr;
  gid('gBrand').textContent=t.brand;gid('gFt').textContent=t.ft;gid('waBtn').textContent=t.contact;

  var st='ok';
  if(c.status==='used')st='used';
  else if(c.expiry&&c.expiry<today())st='exp';
  var g=gid('gift'),s=gid('gStatus');
  if(st==='used'){
    g.classList.add('used');gid('stampTxt').textContent=t.stampUsed;
    s.className='g-status used';s.textContent=t.used+(c.usedAt?' ('+c.usedAt+')':'');
  }else if(st==='exp'){
    g.classList.add('exp');gid('stampTxt').textContent=t.stampExp;
    s.className='g-status exp';s.textContent=t.expd;
  }else{
    s.className='g-status ok';s.textContent=t.ok;
  }
  renderQR();
};
window.__renderFail=function(){gid('loading').style.display='none';gid('err').style.display='block';};

function renderQR(){
  var box=gid('qrBox');
  function fallback(){box.innerHTML='<div style="font-family:ui-monospace,monospace;font-size:12px;color:#0d1f38;font-weight:800;padding:20px 6px;word-break:break-all">'+gid('gCode').textContent+'</div>';}
  if(typeof QRCode!=='undefined'){
    try{new QRCode(box,{text:location.href.split('#')[0],width:132,height:132,colorDark:'#0d1f38',correctLevel:QRCode.CorrectLevel.M});return;}catch(e){}
  }
  fallback();
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

(async function(){
  var id=new URLSearchParams(location.search).get('id');
  if(!id){window.__renderFail();return;}
  try{
    var app=initializeApp({
      apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",
      authDomain:"happywork-packageplan.firebaseapp.com",
      projectId:"happywork-packageplan",
      storageBucket:"happywork-packageplan.firebasestorage.app",
      messagingSenderId:"553635350672",
      appId:"1:553635350672:web:e601b74b96b83e0d4d2b83"
    });
    var db=getFirestore(app);
    var snap=await getDoc(doc(db,'coupons',id));
    if(!snap.exists()){window.__renderFail();return;}
    window.__renderCoupon(Object.assign({_id:id},snap.data()));
  }catch(e){window.__renderFail();}
})();
</script>
</body>
</html>
