<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>해피홈케어 쿠폰</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy-950:#081221;--navy-800:#14304f;--gold-500:#c9a44c;--gold-300:#e8cf8a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#eef0f5;color:#1a1a2e;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px}
.wrap{max-width:420px;width:100%}
.gift{position:relative;border-radius:18px;overflow:hidden;background:radial-gradient(130% 120% at 15% 0%,var(--navy-800) 0%,var(--navy-950) 60%);color:#fff;padding:26px 24px 22px;box-shadow:0 30px 60px -28px rgba(8,18,33,.7);border:1px solid rgba(201,164,76,.5)}
.gift::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-500),var(--gold-300),transparent)}
.gift::after{content:"";position:absolute;top:-70px;right:-70px;width:220px;height:220px;border-radius:50%;border:44px solid rgba(201,164,76,.12);pointer-events:none}
.g-brand{display:flex;align-items:center;gap:9px;margin-bottom:18px}
.g-logo{width:30px;height:30px;border:1px solid var(--gold-500);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gold-300);font-family:serif;font-size:14px}
.g-brand b{font-size:13px}
.g-brand span{font-size:8.5px;letter-spacing:.14em;color:#8ba0ba;display:block;margin-top:1px}
.g-type{font-size:10.5px;letter-spacing:.3em;color:var(--gold-300);font-weight:700;margin-bottom:6px}
.g-amt{font-family:'Noto Serif KR',serif;font-size:44px;font-weight:700;line-height:1.1;background:linear-gradient(120deg,var(--gold-300),var(--gold-500));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;word-break:break-all}
.g-desc{font-size:12px;color:#b9c7d9;margin-top:6px}
.g-div{border-top:2px dashed rgba(255,255,255,.2);margin:18px -24px;position:relative}
.g-div::before,.g-div::after{content:"";position:absolute;top:-11px;width:22px;height:22px;border-radius:50%;background:#eef0f5}
.g-div::before{left:-11px}.g-div::after{right:-11px}
.g-row{display:flex;justify-content:space-between;font-size:11.5px;color:#9fb2c8;margin-top:5px}
.g-row b{color:#dbe5f0;font-weight:700}
.g-code{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:800;letter-spacing:.12em;color:var(--gold-300);text-align:center;background:rgba(255,255,255,.06);border:1px dashed rgba(201,164,76,.5);border-radius:10px;padding:10px;margin-top:14px}
.g-qr{margin-top:14px;text-align:center;background:#fff;border-radius:12px;padding:14px 10px 10px}
.g-qr .qr-in{display:flex;justify-content:center}
.g-qr img,.g-qr canvas{width:130px;height:130px}
.g-qr-lbl{font-size:9.5px;color:#6b7280;margin-top:7px;line-height:1.5}
.gift.used .g-qr,.gift.exp .g-qr{opacity:.25;filter:grayscale(1)}
.g-stamp{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(8,18,33,.72);z-index:5}
.g-stamp span{font-family:'Noto Serif KR',serif;font-size:34px;font-weight:700;color:#fff;border:3px solid #fff;border-radius:14px;padding:10px 30px;transform:rotate(-12deg);opacity:.92}
.gift.used .g-stamp,.gift.exp .g-stamp{display:flex}
.g-status{margin-top:14px;text-align:center;font-size:12px;font-weight:800;padding:9px;border-radius:10px}
.g-status.ok{background:rgba(16,185,129,.18);color:#6ee7b7}
.g-status.used{background:rgba(255,255,255,.1);color:#9fb2c8}
.g-status.exp{background:rgba(231,76,60,.16);color:#f5a8a0}
.g-terms{margin-top:14px;border-top:1px dashed rgba(255,255,255,.18);padding-top:11px}
.g-terms-t{font-size:9px;letter-spacing:.18em;color:var(--gold-500);font-weight:800;margin-bottom:5px}
.g-terms div:not(.g-terms-t){font-size:10.5px;color:#9fb2c8;line-height:1.7;padding-left:11px;position:relative}
.g-terms div:not(.g-terms-t)::before{content:"·";position:absolute;left:2px;color:var(--gold-500);font-weight:800}
.contact{margin-top:14px;text-align:center}
.contact a{display:inline-flex;align-items:center;gap:7px;background:#25D366;color:#fff;font-weight:700;font-size:12.5px;padding:11px 22px;border-radius:100px;text-decoration:none;box-shadow:0 12px 26px -12px rgba(37,211,102,.6)}
.center-msg{text-align:center;color:#6b7280;font-size:13px;padding:40px 10px}
.spin{width:26px;height:26px;border:3px solid #d5dae8;border-top-color:#c9a44c;border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="center-msg"><div class="spin"></div>쿠폰을 불러오는 중...</div>
  <div id="err" class="center-msg" style="display:none">쿠폰을 찾을 수 없습니다.<br>링크를 다시 확인해 주세요.</div>

  <div class="gift" id="gift" style="display:none">
    <div class="g-stamp"><span id="stampTxt">사용완료</span></div>
    <div class="g-brand"><div class="g-logo">H</div><div><b>해피홈케어</b><span>HAPPY WORKS SERVICES SDN. BHD.</span></div></div>
    <div class="g-type" id="gType">GIFT VOUCHER · 상품권</div>
    <div class="g-amt" id="gAmt"></div>
    <div class="g-desc" id="gDesc" style="display:none"></div>
    <div class="g-div"></div>
    <div class="g-row"><span id="lblTo">받는 분</span><b id="gName">—</b></div>
    <div class="g-row" id="rowExp" style="display:none"><span id="lblExp">유효기간</span><b id="gExp"></b></div>
    <div class="g-row"><span id="lblIss">발급일</span><b id="gIss">—</b></div>
    <div class="g-code" id="gCode">—</div>
    <div class="g-qr"><div class="qr-in" id="qrBox"></div><div class="g-qr-lbl" id="qrLbl">매장 제시용 QR — 직원이 스캔하면 확인 화면이 열립니다</div></div>
    <div class="g-status ok" id="gStatus"></div>
    <div class="g-terms">
      <div class="g-terms-t" id="lblTerms">유의사항</div>
      <div id="term1">서비스당 1장 사용 가능합니다.</div>
      <div id="term2">본 쿠폰은 무단 양도가 불가합니다.</div>
    </div>
  </div>

  <div class="contact" id="contact" style="display:none">
    <a href="https://wa.me/60172472774" target="_blank" rel="noopener">📞 문의 · WhatsApp</a>
  </div>
</div>

<script>
var LANG=(new URLSearchParams(location.search).get('lang')||'ko')==='en'?'en':'ko';
var T={
  ko:{gift:'GIFT VOUCHER · 상품권',disc:'DISCOUNT COUPON · 할인권',to:'받는 분',exp:'유효기간',iss:'발급일',until:' 까지',
      ok:'✅ 사용 가능한 쿠폰입니다',used:'이미 사용된 쿠폰입니다',expd:'유효기간이 지난 쿠폰입니다',
      stampUsed:'사용완료',stampExp:'기간만료',terms:'유의사항',
      t1:'서비스당 1장 사용 가능합니다.',t2:'본 쿠폰은 무단 양도가 불가합니다.',
      qr:'매장 제시용 QR — 직원이 스캔하면 확인 화면이 열립니다',nameSfx:' 님'},
  en:{gift:'GIFT VOUCHER',disc:'DISCOUNT COUPON',to:'To',exp:'Valid until',iss:'Issued',until:'',
      ok:'✅ This coupon is valid',used:'This coupon has already been used',expd:'This coupon has expired',
      stampUsed:'USED',stampExp:'EXPIRED',terms:'TERMS',
      t1:'One coupon per service.',t2:'This coupon is not transferable.',
      qr:'Show this QR at service — staff scan opens verification',nameSfx:''}
};
var t=T[LANG];
function gid(id){return document.getElementById(id);}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

window.__renderCoupon=function(c){
  gid('loading').style.display='none';
  if(!c){gid('err').style.display='block';return;}
  gid('gift').style.display='block';
  gid('contact').style.display='block';
  gid('gType').textContent=c.type==='discount'?t.disc:t.gift;
  gid('gAmt').innerHTML=(function(){
    var v=String(c.value||'');
    var m=v.match(/^RM\s*([\d,.]+)$/i);
    if(m)return '<small style="font-size:20px">RM</small> '+m[1];
    return v;
  })();
  if(c.cond){gid('gDesc').style.display='block';gid('gDesc').textContent=c.cond;}
  gid('gName').textContent=(c.name||'—')+t.nameSfx;
  if(c.expiry){gid('rowExp').style.display='flex';gid('gExp').textContent=c.expiry+t.until;}
  gid('gIss').textContent=c.issuedAt||'—';
  gid('gCode').textContent=c.code||'—';
  gid('lblTo').textContent=t.to;gid('lblExp').textContent=t.exp;gid('lblIss').textContent=t.iss;
  gid('lblTerms').textContent=t.terms;gid('term1').textContent=t.t1;gid('term2').textContent=t.t2;
  gid('qrLbl').textContent=t.qr;

  var st='ok';
  if(c.status==='used')st='used';
  else if(c.expiry&&c.expiry<today())st='exp';
  var g=gid('gift'),s=gid('gStatus');
  if(st==='used'){
    g.classList.add('used');gid('stampTxt').textContent=t.stampUsed;
    s.className='g-status used';s.textContent=t.used+(c.usedAt?' ('+c.usedAt+')':'');
  }else if(st==='exp'){
    g.classList.add('exp');gid('stampTxt').textContent=t.stampExp;
    s.className='g-status exp';s.textContent=t.expd;
  }else{
    s.className='g-status ok';s.textContent=t.ok;
  }
  renderQR();
};
window.__renderFail=function(){gid('loading').style.display='none';gid('err').style.display='block';};

function renderQR(){
  var box=gid('qrBox');
  function fallback(){box.innerHTML='<div style="font-family:ui-monospace,monospace;font-size:12px;color:#0d1f38;font-weight:800;padding:20px 6px;word-break:break-all">'+gid('gCode').textContent+'</div>';}
  if(typeof QRCode!=='undefined'){
    try{new QRCode(box,{text:location.href.split('#')[0],width:130,height:130,colorDark:'#0d1f38',correctLevel:QRCode.CorrectLevel.M});return;}catch(e){}
  }
  fallback();
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

(async function(){
  var id=new URLSearchParams(location.search).get('id');
  if(!id){window.__renderFail();return;}
  try{
    var app=initializeApp({
      apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",
      authDomain:"happywork-packageplan.firebaseapp.com",
      projectId:"happywork-packageplan",
      storageBucket:"happywork-packageplan.firebasestorage.app",
      messagingSenderId:"553635350672",
      appId:"1:553635350672:web:e601b74b96b83e0d4d2b83"
    });
    var db=getFirestore(app);
    var snap=await getDoc(doc(db,'coupons',id));
    if(!snap.exists()){window.__renderFail();return;}
    window.__renderCoupon(Object.assign({_id:id},snap.data()));
  }catch(e){window.__renderFail();}
})();
</script>
</body>
</html>
