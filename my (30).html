<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Home Care · 마이페이지</title>
<meta name="theme-color" content="#0B1833">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Happy Home Care">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{--bg:#F2F4F9;--ink:#1a2233;--ink2:#4b5563;--ink3:#8a94a6;--bdr:#e3e8f0;--pri:#2563eb;--pri-bg:#eff6ff;--ok:#059669;--ok-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fff7e6;--vio:#7c3aed;--vio-bg:#f5f3ff;
--navy:#0B1833;--teal:#0BB5A4;--indigo:#4F6EF7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.page{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 40px rgba(11,24,51,.08)}
/* hero */
.hero{background:linear-gradient(150deg,#0B1833 0%,#16264a 55%,#1d3a63 100%);padding:calc(18px + env(safe-area-inset-top)) 20px 56px;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(79,110,247,.35),transparent 70%);top:-80px;right:-60px}
.hero:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(11,181,164,.28),transparent 70%);bottom:-50px;left:-40px}
.hh{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.hh .mark{width:27px;height:27px;border-radius:8px;background:linear-gradient(150deg,var(--indigo),var(--teal));display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff}
.hh b{color:#fff;font-size:13.5px;font-weight:800}
.lang{margin-left:auto;display:flex;gap:4px}
.lang button{border:none;cursor:pointer;font-family:inherit;font-size:10.5px;font-weight:800;padding:5px 11px;border-radius:13px;background:rgba(255,255,255,.12);color:#aebadb}
.lang button.on{background:#fff;color:#0B1833}
.who{position:relative;z-index:1;margin-top:22px;display:flex;align-items:center;gap:14px}
.ava{width:54px;height:54px;border-radius:50%;background:linear-gradient(150deg,var(--indigo),var(--teal));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;box-shadow:0 8px 20px rgba(79,110,247,.4);flex-shrink:0}
.nm{color:#fff;font-size:20px;font-weight:900;letter-spacing:-.01em}
.sub{color:#8fa0c9;font-size:11.5px;margin-top:2px}
.mem{display:inline-flex;align-items:center;gap:5px;margin-top:8px;background:linear-gradient(120deg,rgba(232,168,56,.18),rgba(232,168,56,.06));border:1px solid rgba(232,168,56,.45);color:#f3cd7e;font-size:11px;font-weight:800;border-radius:20px;padding:4px 12px}
.body{padding:0 15px calc(20px + env(safe-area-inset-bottom));margin-top:-34px;position:relative;z-index:2}
/* 잔액카드가 없을 때(계약 1건) : 히어로와 겹치지 않게 평평하게 */
.hero.flat{padding-bottom:24px;border-radius:0 0 22px 22px}
.body.nb{margin-top:0;padding-top:16px}
.body.nb>.sec:first-child{margin-top:0}
/* balance */
.balcard{background:#fff;border-radius:18px;padding:17px;box-shadow:0 10px 30px rgba(11,24,51,.10)}
.balcard .lb{font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:.06em}
.balcard .val{font-size:28px;font-weight:900;letter-spacing:-.02em;margin-top:2px}
.balcard .val small{font-size:14px;font-weight:800;color:var(--ink3)}
.bar{height:7px;border-radius:6px;background:#EEF1F7;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--indigo));transition:width .6s}
.bar-lb{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);font-weight:700;margin-top:5px}
.balrow{display:flex;margin-top:13px;border-top:1px dashed var(--bdr);padding-top:12px}
.balrow div{flex:1;text-align:center}
.balrow .k{font-size:9.5px;color:var(--ink3);font-weight:700}
.balrow .v{font-size:13.5px;font-weight:900;margin-top:1px}
/* sections */
.sec{margin-top:17px}
.sh{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:900;margin-bottom:8px;padding:0 2px}
.sh .n{margin-left:auto;font-size:10px;font-weight:800;background:#fff;border:1px solid var(--bdr);color:var(--ink2);border-radius:10px;padding:2px 9px}
.card{background:#fff;border-radius:15px;padding:13px 14px;box-shadow:0 3px 14px rgba(11,24,51,.06);margin-bottom:9px;display:flex;gap:11px;align-items:center;text-decoration:none;color:inherit}
.card:active{transform:scale(.985)}
.cico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.cico.iv{background:var(--ok-bg)}.cico.ip{background:var(--warn-bg)}.cico.ct{background:var(--pri-bg)}
.cm{flex:1;min-width:0}
.cm .t{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cm .d{font-size:11px;color:var(--ink3);margin-top:2px}
.chip{font-size:9px;font-weight:800;border-radius:5px;padding:2px 6px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:#fef2f2;color:#dc2626}.chip.blue{background:var(--pri-bg);color:var(--pri)}.chip.vio{background:var(--vio-bg);color:var(--vio)}
.go{flex-shrink:0;font-size:10.5px;font-weight:800;color:var(--pri);background:var(--pri-bg);border-radius:8px;padding:7px 11px;white-space:nowrap}
.amt{font-size:13px;font-weight:900;white-space:nowrap}
/* voucher */
.vcard{display:block;text-decoration:none;background:linear-gradient(120deg,#4c2f8f,#7c3aed 60%,#a855f7);border-radius:15px;padding:15px 17px;color:#fff;box-shadow:0 8px 22px rgba(124,58,237,.35);position:relative;overflow:hidden;margin-bottom:9px}
.vcard:before{content:'';position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);top:-50px;right:-30px}
.vcard.used{filter:grayscale(.8);opacity:.72}
.vcard .stb{position:absolute;top:11px;right:13px;font-size:9px;font-weight:900;border-radius:12px;padding:3px 9px;background:rgba(255,255,255,.92);z-index:1}
.vcard .stb.ok{color:#059669}
.vcard .stb.used{color:#64748b}
.card.dim{opacity:.65;background:#f8fafc}
.vcard .vt{font-size:10px;font-weight:800;opacity:.8;letter-spacing:.08em}
.vcard .vv{font-size:21px;font-weight:900;margin-top:2px}
.vcard .vd{font-size:10.5px;opacity:.9;margin-top:7px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.vcard .code{font-family:monospace;font-weight:700;background:rgba(255,255,255,.15);border-radius:6px;padding:2px 8px}
/* cta / foot */
.cta{display:flex;gap:8px;margin-top:12px}
.cta a{flex:1;text-align:center;font-size:12.5px;font-weight:800;border-radius:13px;padding:13px;text-decoration:none}
.cta .wa{background:#22c55e;color:#fff;box-shadow:0 6px 16px rgba(34,197,94,.35)}
/* 서비스 의뢰 — 마이페이지 대표 액션 카드 */
.rqc{display:block;margin-top:20px;padding:17px 18px;border-radius:16px;text-decoration:none;background:linear-gradient(125deg,#0BB5A4 0%,#0d9488 55%,#0f766e 100%);color:#fff;box-shadow:0 10px 24px rgba(11,181,164,.35);position:relative;overflow:hidden}
.rqc:before{content:'';position:absolute;right:-30px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15)}
.rqc:after{content:'';position:absolute;right:22px;bottom:-40px;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.09)}
.rqc .rqbd{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.06em;border-radius:100px;padding:3px 9px;position:relative;margin-bottom:8px}
.rqc .rqt{font-size:16px;font-weight:900;letter-spacing:-.02em;position:relative;display:flex;align-items:center;gap:7px}
.rqc .rqs{font-size:11px;color:#d6fbf5;margin-top:4px;line-height:1.55;position:relative}
.rqc .rqb{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#fff;color:#0d7d72;font-size:12px;font-weight:900;border-radius:11px;padding:9px 16px;position:relative;box-shadow:0 4px 12px rgba(6,78,71,.25)}
.rqc .rqb b{transition:transform .18s}
.rqc:active{transform:scale(.985)}
/* ══ 예약 신청 (관리자가 만든 예약 링크) ══ */
.bkc{display:block;padding:17px 18px;border-radius:16px;text-decoration:none;background:linear-gradient(125deg,#312e81 0%,#4338ca 55%,#4F6EF7 100%);color:#fff;position:relative;overflow:hidden;animation:bkGlow 2.6s ease-in-out infinite}
@keyframes bkGlow{0%,100%{box-shadow:0 10px 24px rgba(67,56,202,.38)}50%{box-shadow:0 12px 32px rgba(79,110,247,.62)}}
.bkc:before{content:'';position:absolute;right:-30px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.bkc:after{content:'';position:absolute;right:22px;bottom:-40px;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.08)}
.bkc .bkbd{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.06em;border-radius:100px;padding:3px 9px;position:relative;margin-bottom:8px}
.bkc .bkt{font-size:16px;font-weight:900;letter-spacing:-.02em;position:relative}
.bkc .bks{font-size:11.5px;color:#dbe2ff;margin-top:4px;line-height:1.6;position:relative;word-break:keep-all}
.bkc .bki{position:relative;margin-top:9px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:7px 11px;font-size:11.5px;font-weight:800}
.bkc .bkb{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#fff;color:#3730A3;font-size:12.5px;font-weight:900;border-radius:11px;padding:10px 17px;position:relative;box-shadow:0 4px 12px rgba(20,17,80,.3)}
.bkc:active{transform:scale(.985)}
.bkm{display:block;background:#fff;border:1px solid var(--bdr);border-left:5px solid #F2B23E;border-radius:14px;padding:13px 15px;text-decoration:none;color:var(--ink);box-shadow:0 3px 12px rgba(11,24,51,.06);margin-top:8px}
.bkm.ok{border-left-color:#18B26B}
.bkm-tp{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.bkm-st{font-size:10.5px;font-weight:900;color:#b45309;background:#FFF7ED;border-radius:100px;padding:3px 9px}
.bkm.ok .bkm-st{color:#0f766e;background:#ECFDF5}
.bkm-dt{margin-left:auto;font-size:11.5px;font-weight:900;color:var(--ink2);font-variant-numeric:tabular-nums}
.bkm-t{font-size:13.5px;font-weight:900;letter-spacing:-.01em}
.bkm-s{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.6;font-weight:700;word-break:keep-all}
.bkm-go{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:900;color:var(--pri, #4F6EF7)}
.pmx-hd.bk{background:linear-gradient(135deg,#312e81,#4338ca 55%,#4F6EF7)}
.pmx-bank.bk{background:#EEF2FF;border-color:#C7D2FE}
.pmx-bank.bk .k{color:#4338CA}
.pmx-bank.bk .v{color:#1e1b4b}
.pmx-ok.bk{background:linear-gradient(135deg,#312e81,#4F6EF7);box-shadow:0 8px 20px -8px rgba(79,110,247,.65)}
.pmx-later{width:100%;margin-top:8px;padding:11px;border:none;background:none;color:var(--ink3);font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
/* 상품권/할인권 팝업 — 황금색 */
.pmx-hd.cp{background:linear-gradient(135deg,#6b4700,#b8860b 50%,#e6b422)}
.pmx-bank.cp{background:#FFFBEB;border-color:#FDE68A}
.pmx-bank.cp .k{color:#92400e}
.pmx-bank.cp .v{color:#4a3000}
.pmx-msg .am.cp{color:#8a6300}
.pmx-ok.cp{background:linear-gradient(135deg,#6b4700,#c9950b);box-shadow:0 8px 20px -8px rgba(184,134,11,.6)}
.pmx-more{margin-top:9px;font-size:11px;font-weight:800;color:#92400e;text-align:center}
/* 예약 확정 카드 안 : 매니지먼트 작업방문등록 안내 */
.bkvr{margin-top:9px;border-top:1px dashed var(--bdr);padding-top:9px}
.bkvr-t{font-size:11px;font-weight:900;color:#b45309;line-height:1.6;word-break:keep-all}
.bkvr-bx{margin-top:7px;background:#F7F9FF;border:1px solid #DCE4F5;border-radius:11px;padding:9px 11px}
.bkvr-h{font-size:10.5px;font-weight:900;color:#3730A3;margin-bottom:6px}
.bkvr-r{display:flex;gap:8px;font-size:11px;padding:2px 0;align-items:baseline}
.bkvr-r .k{flex:none;width:62px;font-weight:800;color:var(--ink3);font-size:10.5px}
.bkvr-r .v{font-weight:800;color:var(--ink);line-height:1.7;word-break:break-word}
.bkvr-r .v i{font-style:normal;color:var(--ink3);font-variant-numeric:tabular-nums;margin-left:5px;letter-spacing:.02em}
.bkvr-cp{width:100%;margin-top:8px;padding:9px;border:1px solid #C7D2FE;background:#EEF2FF;color:#3730A3;font-family:inherit;font-size:11.5px;font-weight:900;border-radius:10px;cursor:pointer}
.bkvr-cp:active{transform:scale(.985)}
.hp{display:block;margin-top:12px;padding:16px 18px;border-radius:16px;text-decoration:none;background:linear-gradient(125deg,#0B1833 0%,#1d3260 100%);color:#fff;box-shadow:0 8px 22px rgba(11,24,51,.28);position:relative;overflow:hidden}
.hp:before{content:'';position:absolute;right:-28px;top:-28px;width:110px;height:110px;border-radius:50%;background:rgba(79,110,247,.28)}
.hp .hpt{font-size:14.5px;font-weight:900;letter-spacing:-.01em;position:relative}
.hp .hps{font-size:11px;color:#b9c6e8;margin-top:4px;line-height:1.5;position:relative}
.hp .hpb{display:inline-flex;align-items:center;gap:6px;margin-top:11px;background:#fff;color:#0B1833;font-size:11.5px;font-weight:800;border-radius:10px;padding:8px 14px;position:relative}
.foot{padding:18px 14px 6px;text-align:center;font-size:10px;color:var(--ink3);line-height:1.7}
.foot b{color:var(--ink2)}
.empty-page{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink3);font-size:14px;padding:30px;text-align:center}
.spin{width:30px;height:30px;border:3px solid var(--bdr);border-top-color:var(--indigo);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ══ v3 섹션 허브 박스 (인보이스 / 점검보고서) ══ */
.hub{border-radius:19px;padding:16px 16px 15px;position:relative;box-shadow:0 9px 24px rgba(11,24,51,.24);color:#fff}
.hubbg{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.hubbg:before{content:'';position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1);top:-70px;right:-50px}
.hubbg:after{content:'';position:absolute;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.07);bottom:-50px;right:24px}
.hub.iv{background:linear-gradient(135deg,#101f45,#1f3f95 55%,#3268da)}
.hub.ip{background:linear-gradient(135deg,#053b37,#0a7a70 55%,#12b0a1)}
.hubw{position:relative;z-index:1}
.hubt{display:flex;align-items:center;gap:11px}
.hubic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.19);border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.hubtt{font-size:16.5px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
.hubts{font-size:9px;font-weight:800;letter-spacing:.12em;opacity:.68;margin-top:3px}
.hubst{margin-left:auto;font-size:9.5px;font-weight:900;border-radius:20px;padding:5px 11px;background:rgba(255,255,255,.95);color:#0f172a;white-space:nowrap;flex-shrink:0;align-self:flex-start}
.hubst.ok{color:#047857}.hubst.bad{color:#dc2626}.hubst.warn{color:#b45309}
.hubg{display:flex;gap:8px;margin-top:14px}
.hubb{flex:1;min-width:0;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:14px;padding:10px 12px}
.hubb .k{display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:800;opacity:.78;letter-spacing:.02em;white-space:nowrap}
.hubb .v{font-size:19px;font-weight:900;letter-spacing:-.025em;margin-top:5px;line-height:1.1;white-space:nowrap}
.hubb .v small{font-size:11.5px;font-weight:800;opacity:.82;margin-left:2px}
.hubb .s{font-size:9.5px;font-weight:700;opacity:.72;margin-top:3px;white-space:nowrap}
.hubal{display:flex;align-items:center;gap:7px;margin-top:9px;background:rgba(255,255,255,.96);border-radius:13px;padding:10px 13px;font-size:11.5px;font-weight:800;color:#b45309}
.hubal.bad{color:#dc2626}
.hubal .am{margin-left:auto;font-weight:900;font-size:13.5px;letter-spacing:-.02em;white-space:nowrap}
.hubbtn{width:100%;margin-top:12px;background:rgba(255,255,255,.97);color:#0B1833;border:0;font-family:inherit;font-size:12.5px;font-weight:900;letter-spacing:-.01em;border-radius:13px;padding:14px 12px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 5px 14px rgba(6,14,35,.26)}
.hubbtn .ar{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:#0B1833;color:#fff;font-size:8px;transition:transform .24s ease}
.hubbtn.open .ar{transform:rotate(180deg)}
.hubbtn:active{transform:scale(.985)}
.hubls{display:none}
.hubls.open{display:block;margin-top:12px;animation:hubIn .26s ease}
@keyframes hubIn{from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none}}
.hubcap{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:900;color:var(--ink2);padding:0 3px 9px}
.hubcap:before{content:'';width:3px;height:12px;border-radius:3px;background:var(--indigo)}
.hubls.ipl .hubcap:before{background:var(--teal)}
.hubcap .c{margin-left:auto;font-size:9.5px;font-weight:800;color:var(--ink3)}
.hubcls{width:100%;background:#fff;border:1px solid var(--bdr);color:var(--ink2);font-family:inherit;font-size:12px;font-weight:900;letter-spacing:-.01em;border-radius:13px;padding:13px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;box-shadow:0 3px 12px rgba(11,24,51,.08)}
.hubcls .up{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;font-size:7px}
.hubcls:active{transform:scale(.985)}
/* ══ 청구 금액 안내 ══ */
@keyframes pyxPulse{0%,100%{box-shadow:0 12px 28px -10px rgba(194,65,12,.55),0 0 0 0 rgba(245,158,11,.5)}55%{box-shadow:0 12px 28px -10px rgba(194,65,12,.55),0 0 0 10px rgba(245,158,11,0)}}
.pyx{position:relative;border-radius:18px;padding:15px 16px 14px;background:linear-gradient(135deg,#7c2d12,#c2410c 52%,#ea8c00);color:#fff;overflow:hidden;animation:pyxPulse 2.8s ease-out infinite}
.pyx:before{content:'';position:absolute;right:-46px;top:-46px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.1)}
.pyx-hd{position:relative;display:flex;align-items:center;gap:9px}
.pyx-ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.pyx-t{font-size:15.5px;font-weight:900;letter-spacing:-.01em}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pn(p){p=String(p||'').replace(/[^0-9]/g,'');if(p.indexOf('60')===0)p=p.slice(2);return p.replace(/^0+/,'');}
function nn(n){return String(n||'').toLowerCase().replace(/\s+/g,'');}
function fmt(v){const n=parseFloat(v)||0;return n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmt0(v){const n=parseFloat(v)||0;return n.toLocaleString('en-MY',{maximumFractionDigits:0});}
function invTotal(inv){
  if(inv.grand!=null)return parseFloat(inv.grand)||0;
  if(inv.total!=null)return parseFloat(inv.total)||0;
  let t=0;(inv.items||[]).forEach(it=>{t+=(parseFloat(it.qty)||1)*(parseFloat(it.price)||0);});
  return t;
}
// 기결제(일부 결제) 합계 — paidAmount 우선, 없으면 payments[] 합산
function invPaid(inv){
  if(inv.paidAmount!=null)return parseFloat(inv.paidAmount)||0;
  let t=0;(inv.payments||[]).forEach(p=>{t+=parseFloat(p&&p.amt)||0;});
  return t;
}
// 실제 청구(잔여) 금액 = 총액 - 기결제
function invDue(inv){return Math.max(0,invTotal(inv)-invPaid(inv));}

function p2(n){return String(n).length<2?'0'+n:String(n);}
// 날짜 문자열(2026-07-12 / 2026.07.12) → Date. 실패하면 null
function dparse(s){const m=String(s==null?'':s).match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d.getTime())?null:d;}
function dfmt(s){const d=dparse(s);return d?(d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate())):String(s==null?'':s);}
const WD_KO=['일','월','화','수','목','금','토'],WD_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function wdLb(s){const d=dparse(s);if(!d)return '';return LANG==='ko'?(WD_KO[d.getDay()]+'요일'):WD_EN[d.getDay()];}
function today0(){const t=new Date();t.setHours(0,0,0,0);return t;}
// 경과 일수(양수=지난 날짜) / 남은 일수(양수=아직 유효)
function daysAgo(s){const d=dparse(s);if(!d)return null;return Math.round((today0()-d)/86400000);}
function daysLeft(s){const d=dparse(s);if(!d)return null;return Math.round((d-today0())/86400000);}

    appId:"1:553635350672:web:e601b74b96b83e0d4d2b83"
  });
  const db=getFirestore(app);
  const snap=await getDoc(doc(db,'customers',CID));
  if(!snap.exists())throw new Error('not-found');
  const m=snap.data()||{};
  // 📅 포인트 적립 적용시작일 (관리자 설정 · 발행일 기준)
  let _ptStart='';
  try{const ps=await getDoc(doc(db,'settings','points'));if(ps&&ps.exists&&ps.exists())_ptStart=String((ps.data()||{}).pt_start||'');}catch(e){}
  const keys=[nn(m.name)].concat((m.aliases||[]).map(nn)).filter(Boolean);
  const mp=pn(m.phone);
  // ── 총괄 고객관리에서 수기로 연결(ca_link)한 문서도 함께 보여줍니다 ──
  //  · 문서에 ca_link 가 있으면 그 값이 이 고객을 가리킬 때만 포함합니다.
  //    (고객명·연락처가 달라도 포함 / 다른 고객에게 연결된 문서는 이름이 같아도 제외)
  //  · ca_link 가 없으면 기존처럼 이름·연락처로 찾습니다.
  const MYK=['m:'+CID,'k:'+nn(m.name)+'#'+pn(m.phone)];
  const linked=x=>MYK.indexOf(x&&x.ca_link)>=0;
  // ca_links (배열) = 원래 고객은 그대로 두고 「추가로」 함께 보여줄 고객들 (중복 연결)
  const inMyLinks=x=>{
    const ls=(x&&Array.isArray(x.ca_links))?x.ca_links:[];
    for(let i=0;i<ls.length;i++){if(MYK.indexOf(ls[i])>=0)return true;}
    return false;
  };
  const hit=(name,phone,x)=>{
    if(inMyLinks(x))return true;
    if(x&&x.ca_link)return linked(x);
    return (mp&&pn(phone)===mp)||(!!name&&keys.includes(nn(name)));
  };
  async function fetchColl(n){try{const s=await getDocs(collection(db,n));return s.docs.map(d=>{const x=d.data()||{};x.__id=d.id;return x;});}catch(e){return [];}}
  const [invs,insps,cts,cps,bks,qts]=await Promise.all([
    VIS.includes('iv')?fetchColl('invoices'):[],
    VIS.includes('ip')?fetchColl('inspections'):[],
    VIS.includes('ct')?fetchColl('contracts'):[],
    VIS.includes('cp')?fetchColl('coupons'):[],
    fetchColl('bookings'),   // 예약 신청 — 관리자가 만든 예약 링크는 v= 설정과 무관하게 항상 확인
    fetchColl('quotes')      // 🧾 견적서 — 항상 확인
  ]);
  DATA={
    m,ptStart:_ptStart,
    invoices:invs.filter(x=>hit(x.customer&&x.customer.name,x.customer&&x.customer.phone,x)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),
    inspections:insps.filter(x=>hit(x.client,x.phone,x)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')),
    contracts:cts.filter(x=>hit(x.name,x.phone,x)),
    coupons:cps.filter(x=>inMyLinks(x)||(x.ca_link?linked(x):(keys.includes(nn(x.name))||keys.includes(nn(x.receiver))))),
    // 예약 : 작성 대기(waiting) · 확인 중(booked) · 확정(confirmed) 만
    bookings:bks.filter(x=>hit(x.customer_name,x.customer_phone,x)&&['waiting','booked','confirmed'].indexOf(x.status)>=0)
      .sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||''))),
    // 🧾 견적서 — 고객명·연락처 일치 + 수동 연결(ca_link/ca_links) 포함
    quotes:qts.filter(x=>hit(x.client,x.phone,x)).sort((a,b)=>String(b.issueDate||'').localeCompare(String(a.issueDate||'')))
  };
}

function balCalc(c){
  const paid=parseFloat(c.amount_paid)||0,bonus=(parseFloat(c.bonus_credit)||0)+(parseFloat(c.special_bonus_credit)||0);
  const total=paid+bonus;
  let h=[];try{h=typeof c.usage_history==='string'?JSON.parse(c.usage_history||'[]'):(c.usage_history||[]);}catch(e){}
  const used=h.reduce((s,u)=>s+(parseFloat(u.amount)||0),0);
  const disc=h.reduce((s,u)=>s+(parseFloat(u.discount)||0),0);
  const carry=h.reduce((s,u)=>s+(parseFloat(u.carryover)||0),0);
  const svcCnt=h.filter(u=>(parseFloat(u.amount)||0)>0).length;
  return {paid,bonus,total,netUsed:Math.max(0,used-disc-carry),remain:total-used+disc+carry,cnt:svcCnt};
}

// ═══ 💎 포인트 적립 (RM100 당 RM1) ═══
// 🧰 실비 항목(자재비용·설치자재비용·에어컨구매비용) 적립 제외 「시작일」
//    별도 상수를 두지 않고 「적립 적용시작일(settings/points · pt_start)」을 그대로 따른다.
//    → 관리자가 총괄 고객관리에서 📅 적용시작일을 바꾸면 제외 규칙 시점도 함께 움직인다.
//    → 시작일 이전 발행분은 애초에 적립 대상이 아니므로 과거 적립금은 영향받지 않는다.
function ptExclFrom(){return String((typeof DATA!=='undefined'&&DATA&&DATA.ptStart)||'');}
// 적립 기준액 : 세금·주차비용·최소청구·추가비용 제외 (품목 소계 − 전체 할인 − 상품/할인권)
// 실비 항목(자재비용·설치자재비용·에어컨구매비용)과 회원제상품 가입금액도 제외
// 패키지 회원은 회원적립잔액(creditUse) 차감 「전」 금액 기준
function ptBase(x,pkg){
  // 🧰 실비 항목 제외 규칙은 「적립 적용시작일」 이후 발행분에만 적용 (과거 인보이스 적립금 보존)
  const _pf=ptExclFrom();
  const _newRule = !_pf || String(x.date||'') >= _pf;
  let sub=0;(x.items||[]).forEach(it=>{
    const _c=String(it.cat||''),_s=String(it.subcat||''),_n=String(it.name||'');
    // 📦 package plan(회원제상품 · 가정용/매장용) 가입금액은 적립 대상에서 제외
    if(/^회원제상품/.test(_c)||/^회원제상품/.test(_s)||/package\s*plan/i.test(_n))return;
    // 🧰 자재비용 · 설치자재비용 · 에어컨구매(구입)비용
    if(_newRule){
      if(/자재/.test(_c)||/자재/.test(_s)||/(구매|구입)\s*비용/.test(_c)||/(구매|구입)\s*비용/.test(_s))return;
      if(/자재비/.test(_n)||/에어컨\s*(구매|구입)/.test(_n)||/material/i.test(_n))return;
    }
    const amt=(parseFloat(it.price)||0)*(parseFloat(it.qty)||1);
    const d=it.discType==='pct'?amt*((parseFloat(it.discVal)||0)/100):(parseFloat(it.discVal!=null?it.discVal:it.disc)||0);
    sub+=amt-d;
  });
  const dv=parseFloat(x.discVal)||0;
  const disc=x.discType==='pct'?dv/100*sub:dv;
  const credit=parseFloat(x.creditUse)||0;
  const voucher=parseFloat(x.voucherAmt)||0;
  const ptsUse=parseFloat(x.pointUse)||0;
  let b=sub-disc-voucher-ptsUse;
  if(!(pkg||credit>0))b-=credit;
  return Math.max(0,b);
}
function ptEarn(base){return Math.floor((parseFloat(base)||0)/100);}
// 견적 합계 — 기본 합계 + 고객이 선택한 에어컨 옵션 금액
function qtTotal(x){const b=parseFloat(x&&x.baseTotal)||0;const c=(x&&x.customerChoice&&parseFloat(x.customerChoice.price))||0;return b+c;}

      const disc=x.type==='discount';
      const stb=active?('✓ '+L.active):(exp?L.expiredB:L.usedv);
      const dday=(active&&dl!=null&&dl<=30)?'<b class="dday'+(dl<=7?' warn':'')+'">D-'+dl+'</b>':'';
      let sub='';
      if(x.name) sub+=esc(x.name);
      if(x.cond) sub+=(sub?'<br>':'')+'📌 '+esc(x.cond);
      if(x.receiver) sub+=(sub?'<br>':'')+'🎁 '+L.recv+' '+esc(x.receiver);
      h+='<a class="vc2 '+(disc?'disc':'gift')+(active?'':' off')+'" target="_blank" rel="noopener" href="'+BASE+'/coupon.html?id='+encodeURIComponent(x.__id)+(LANG==='en'?'&lang=en':'')+'">'+
         '<div class="vtop2"><span class="vstb'+(active?'':' off')+'">'+stb+'</span>'+
         '<span class="vkind">'+(disc?L.kDisc:L.kGift)+'</span>'+
         '<div class="vval2">'+esc(x.value||'')+'</div>'+
         (sub?'<div class="vsub2">'+sub+'</div>':'')+'</div>'+
         '<div class="vperf"></div>'+
         '<div class="vbot2"><div><div class="vk">'+L.expiry+'</div><div class="vv2">'+(esc(dfmt(x.expiry))||'—')+dday+'</div></div>'+
         '<div><div class="vk">CODE</div><div class="vcode2">'+esc(x.code||'')+'</div></div>'+
         '<span class="vgo">'+L.cpGo+'</span></div></a>';
    });
    h+='</div>';
  }
  // ── 🧾 견적서 (v= 설정과 무관하게 항상 표시) ──
  if(DATA.quotes&&DATA.quotes.length){
    const qL=LANG==='en'
      ?{t:'Quotations',valid:'\u2705 Valid',expired:'\u23F9 Expired',until:'Valid until',amt:'Quote Total',go:'View quotation \u2192',validN:'Valid',expN:'Expired'}
      :{t:'\uACAC\uC801\uC11C',valid:'\u2705 \uC720\uD6A8',expired:'\u23F9 \uAE30\uD55C \uB9CC\uB8CC',until:'\uC720\uD6A8\uAE30\uD55C',amt:'\uACAC\uC801 \uAE08\uC561',go:'\uACAC\uC801\uC11C \uBCF4\uAE30 \u2192',validN:'\uC720\uD6A8',expN:'\uB9CC\uB8CC'};
    const _qtd=(function(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());})();
    const _qexp=x=>!!(x.validUntil&&String(x.validUntil)<_qtd);
    const vN=DATA.quotes.filter(x=>!_qexp(x)).length;
    h+='<div class="sec"><div class="sh">\uD83E\uDDFE '+qL.t+'<span class="n">'+qL.validN+' '+vN+' \u00b7 '+qL.expN+' '+(DATA.quotes.length-vN)+'</span></div>';
    DATA.quotes.slice(0,20).forEach(x=>{
      const exp=_qexp(x);
      const rs=fmt(qtTotal(x)).split('.');
      h+='<a class="ncard" target="_blank" rel="noopener"'+(exp?' style="opacity:.62"':'')+' href="'+BASE+'/quote.html?id='+encodeURIComponent(x.__id)+'&lang='+LANG+'">'+
         '<span class="stripe '+(exp?'warn':'ok')+'"></span><div class="nbody">'+
         '<div class="nrow1"><div class="ntile '+(exp?'warn':'ok')+'">\uD83E\uDDFE</div>'+
         '<div style="flex:1;min-width:0"><div class="nid">'+esc(x.qno||dfmt(x.issueDate)||'')+'</div>'+
         '<div class="ndate">'+esc(dfmt(x.issueDate)||'')+(x.subject?' \u00b7 '+esc(x.subject):'')+'</div></div>'+
         '<span class="nst '+(exp?'warn':'ok')+'">'+(exp?qL.expired:qL.valid)+'</span></div>'+
         (x.validUntil?'<div class="npd"><span class="t">'+qL.until+' '+esc(dfmt(x.validUntil))+'</span></div>':'')+
         '<div class="nfoot"><div><div class="nlb">'+qL.amt+'</div>'+
         '<div class="nam"><span class="cu">RM</span>'+rs[0]+'.'+(rs[1]||'00')+'</div></div>'+
         '<span class="nbtn">'+qL.go+'</span></div></div></a>';
    });
    h+='</div>';
  }
  // ── cta / foot ──
  // 의뢰 요청서에 고객정보(이름·연락처·주소)를 함께 넘겨 자동 입력되게 한다 (고객이 수정 가능)
  const rqQ='?lang='+LANG+'&nm='+encodeURIComponent(m.name||'')+'&ph='+encodeURIComponent(m.phone||'')+'&ad='+encodeURIComponent(m.addr||'');
  h+='<a class="rqc" href="'+BASE+'/request.html'+rqQ+'" target="_blank" rel="noopener">'+
     '<span class="rqbd">✦ '+L.rqBadge+'</span>'+
     '<div class="rqt">📋 '+L.rqT+'</div><div class="rqs">'+L.rqS+'</div>'+
     '<span class="rqb">'+L.rqB+' <b>→</b></span></a>';
  h+='<a class="hp" href="'+BASE+'/service-info'+(LANG==='en'?'?lang=en':'')+'" target="_blank" rel="noopener">'+
     '<div class="hpt">🏠 '+L.hpT+'</div><div class="hps">'+L.hpS+'</div>'+
     '<span class="hpb">'+L.hpB+' <b>→</b></span></a>';
  h+='<div class="cta"><a class="wa" href="https://wa.me/60172472774" target="_blank" rel="noopener">'+L.wa+'</a></div>';
  // ── 홈 화면 설치 안내 (이미 앱으로 열었으면 표시하지 않음) ──
  if(!IS_APP){
    h+='<div class="a2hs"><div class="t">'+L.a2T+'</div><div class="s">'+L.a2S+'</div>';
    if(IS_IOS){
      h+='<div class="a2hs-how">'+
         '<div class="a2hs-st"><span class="n">1</span><span>'+L.a2i1+'</span></div>'+
         '<div class="a2hs-st"><span class="n">2</span><span>'+L.a2i2+'</span></div>'+
         '<div class="a2hs-st"><span class="n">3</span><span>'+L.a2i3+'</span></div></div>';
    }else if(IS_SAMSUNG&&/^https?:$/.test(location.protocol)){
      // 삼성 인터넷 → Chrome 으로 열어 설치 (intent: 링크, Chrome 미설치 시 원래 주소로 폴백)
      const chr='intent://'+location.host+location.pathname+location.search+
        '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(location.href)+';end';
      h+='<a class="a2hs-btn" style="display:block;text-align:center;text-decoration:none" href="'+esc(chr)+'">'+L.a2sBtn+'</a>'+
         '<div class="a2hs-how">'+
         '<div class="a2hs-st"><span class="n">1</span><span>'+L.a2s1+'</span></div>'+
         '<div class="a2hs-st"><span class="n">2</span><span>'+L.a2s2+'</span></div>'+
         '<div class="a2hs-st"><span class="n">3</span><span>'+L.a2s3+'</span></div></div>';
    }else{
      h+='<button type="button" class="a2hs-btn" id="a2hs-btn"'+(_a2hsEv?'':' style="display:none"')+'>'+L.a2Btn+'</button>'+
         '<div class="a2hs-how" id="a2hs-how"'+(_a2hsEv?' style="display:none"':'')+'>'+
         '<div class="a2hs-st"><span class="n">1</span><span>'+L.a2a1+'</span></div>'+
         '<div class="a2hs-st"><span class="n">2</span><span>'+L.a2a2+'</span></div></div>';
    }
    h+='</div>';
  }
  h+='<div class="foot"><b>Happy Works Services Sdn. Bhd.</b> (1278908-M)<br>📞 +60 17-247 2774 · happyhomecare<br>'+L.foot+'</div>';
  h+='</div>';
  document.getElementById('page').innerHTML=h;
  document.getElementById('l-ko').onclick=()=>{LANG='ko';render();};
  document.getElementById('l-en').onclick=()=>{LANG='en';render();};
  ['iv','ip'].forEach(k=>{
    const b=document.getElementById('hub-btn-'+k),ls=document.getElementById('hub-list-'+k);
    if(!b||!ls)return;
    const hub=b.closest('.hub');
    // 주의: scrollIntoView 는 overflow 를 가진 조상 박스 내부까지 스크롤시켜
    //       제목이 박스 위로 밀려 잘리는 문제가 있어 window 스크롤만 사용한다.
    const go=el=>{try{const y=el.getBoundingClientRect().top+window.scrollY-12;window.scrollTo({top:y<0?0:y,behavior:'smooth'});}catch(e){}};
    const setSt=()=>{
      b.classList.toggle('open',OPEN[k]);
      const t=b.querySelector('.bt');
      if(t)t.textContent=b.getAttribute(OPEN[k]?'data-c':'data-o');
      ls.classList.toggle('open',OPEN[k]);
    };
    b.onclick=()=>{
      OPEN[k]=!OPEN[k];setSt();
      if(OPEN[k])setTimeout(()=>go(hub),80);   // 열면 박스 상단이 화면 위로 오게
    };
    const c=document.getElementById('hub-cls-'+k);
    if(c)c.onclick=()=>{
      OPEN[k]=false;setSt();
      setTimeout(()=>go(hub),60);              // 하단에서 닫으면 박스 위치로 복귀
    };
  });
  // 💎 포인트 내역 접기/펼치기
  const ptb=document.getElementById('pt-btn'),ptl=document.getElementById('pt-list');
  if(ptb&&ptl){
    ptb.onclick=()=>{
      OPEN.pt=!OPEN.pt;
      ptl.classList.toggle('open',OPEN.pt);
      const s=ptb.querySelector('span');
      if(s)s.textContent=ptb.getAttribute(OPEN.pt?'data-c':'data-o');
    };
  }
  // 종료된 계약 접기/펼치기
  const ecb=document.getElementById('ec-btn'),ecl=document.getElementById('ec-list');
  if(ecb&&ecl){
    ecb.onclick=()=>{
      OPEN.ec=!OPEN.ec;
      ecb.classList.toggle('open',OPEN.ec);
      ecl.classList.toggle('open',OPEN.ec);
      const t=ecb.querySelector('.bt'),Lx=T[LANG];
      if(t)t.textContent=(OPEN.ec?Lx.ctEndClose:Lx.ctEndOpen).replace('{n}',ecl.children.length);
    };
  }
  // 작업방문등록 정보 복사 (확정 카드는 <a> 라서 기본 이동을 막고 복사만 한다)
  document.querySelectorAll('.bkvr-cp').forEach(b=>{
    b.onclick=ev=>{
      ev.preventDefault();ev.stopPropagation();
      const t=bkVisitRegText(),Lx=T[LANG];
      const ok=()=>{const o=b.textContent;b.textContent=Lx.bkVrOk;setTimeout(()=>{b.textContent=o;},1600);};
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>prompt(Lx.bkVrPr,t));
      else prompt(Lx.bkVrPr,t);
    };
  });
  // 앱 설치 버튼 (Android Chrome 등 beforeinstallprompt 지원 브라우저)
  const ab=document.getElementById('a2hs-btn');
  if(ab)ab.onclick=async()=>{
    if(!_a2hsEv)return;
    _a2hsEv.prompt();
    try{await _a2hsEv.userChoice;}catch(e){}
    _a2hsEv=null;
  };
}

(async()=>{
  try{
    if(!CID)throw new Error('no-id');
    await load();
    render();
    showBkPopup();    // 작성 대기 예약 신청이 있으면 먼저 안내 → 닫으면 청구 금액 팝업 (각 1회)
  }catch(e){
    document.getElementById('page').innerHTML='<div class="empty-page"><div style="font-size:34px">🔎</div><div>'+T[LANG].notfound+'</div></div>';
  }
})();
</script>
</body>
</html>
