:root{--n:#0E2350;--n2:#16346E;--bl:#2563EB;--ink:#14192A;--ink2:#5A6478;--ink3:#98A1B4;
  --line:#E4E9F2;--soft:#F6F8FC;--ok:#0E9B63;--red:#DC2626;--gold:#B98A16}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#EEF1F7;color:var(--ink);font-size:14px}
.qa{max-width:520px;margin:0 auto;padding:10px 12px calc(90px + env(safe-area-inset-bottom))}

/* ── 상단 고정바 ── */
#qa-top{position:sticky;top:0;z-index:60;background:linear-gradient(140deg,#0E2350,#16346E);color:#fff;
  display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  box-shadow:0 4px 16px -6px rgba(6,18,45,.7)}
#qa-top .ti{font-size:15.5px;font-weight:900;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#qa-top .lgb{display:flex;gap:4px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
#qa-top .lgb button{border:none;background:none;color:#C6D5F5;font-family:inherit;font-size:11.5px;font-weight:900;
  border-radius:999px;padding:5px 11px;cursor:pointer}
#qa-top .lgb button.on{background:#fff;color:#0E2350}

/* ── 브랜드 줄 ── */
.brand{display:flex;align-items:center;gap:10px;padding:11px 3px 12px}
.brand .lg{width:40px;height:40px;border-radius:12px;flex:none;background:#fff;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--gold)}
.brand .bnm{font-size:15px;font-weight:900;letter-spacing:-.02em;flex:1;min-width:0}
.brand .bnm span{display:block;font-size:9px;color:var(--ink3);font-weight:700;letter-spacing:.06em;margin-top:2px}
.brand .ino{font-size:11.5px;font-weight:800;color:var(--ink3);white-space:nowrap}

/* ── 히어로 (남색 요약 카드) ── */
.hero{background:linear-gradient(140deg,#0E2350,#16346E 65%,#1D4090);color:#fff;border-radius:16px;
  padding:16px 16px 14px;margin-bottom:11px;
  box-shadow:0 3px 8px rgba(6,18,45,.3),0 18px 34px -14px rgba(6,18,45,.7)}
.qh-t{display:flex;gap:12px;align-items:flex-start}
.qh-l{flex:1;min-width:0}
.qh-k{font-size:10px;font-weight:800;letter-spacing:.14em;color:#9FB6E8}
.qh-n{font-size:19px;font-weight:900;letter-spacing:-.02em;margin-top:4px;line-height:1.25;word-break:break-word}
.qh-r{flex:none;text-align:right;padding-left:13px;border-left:1px solid rgba(255,255,255,.18);max-width:56%}
.qh-rk{font-size:11px;font-weight:800;color:#BBCCEF}
.qh-rv{font-size:24px;font-weight:900;letter-spacing:-.035em;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qh-rv i{font-style:normal;font-size:13px;font-weight:800;color:#BBCCEF;margin-right:2px}
.qpill{display:inline-block;margin-top:9px;font-size:11px;font-weight:900;border-radius:999px;padding:5px 12px;
  background:var(--ok);color:#fff}
.qpill.exp{background:#E5484D}
.qpill.wait{background:#F0B429;color:#3A2A00}
.qpill.cf{background:#4C7DF0}
.qh-m{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.15);
  border-radius:11px;overflow:hidden;margin-top:13px}
.qh-m>div{background:rgba(255,255,255,.06);padding:9px 8px;min-width:0}
.qh-m .k{font-size:9.5px;font-weight:800;color:#A9BEE9}
.qh-m .v{font-size:12px;font-weight:900;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qh-s{margin-top:9px;font-size:11.5px;font-weight:700;color:#D7E2F8;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.13);border-radius:10px;padding:8px 11px;line-height:1.5;word-break:break-word}

/* ── 공통 카드 ── */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:11px;overflow:hidden;
  box-shadow:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.16)}
.chd{display:flex;align-items:center;gap:7px;padding:12px 14px;border-bottom:1px solid var(--line);
  font-size:13.5px;font-weight:900;letter-spacing:-.02em}

/* ── 금액 구성 ── */
.abody{padding:5px 14px 12px}
.brk{padding-top:4px}
.brk-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:12.5px;
  padding:6px 0;color:var(--ink2);font-weight:700}
.brk-row .bl{min-width:0;display:flex;align-items:baseline;gap:6px}
.brk-row .bl .bnum{font-size:9.5px;font-weight:800;color:var(--ink3);flex-shrink:0}
.brk-row .bl .bname{word-break:keep-all}
.brk-row .bl .bqty{font-size:10px;color:var(--ink3);white-space:nowrap}
.brk-row .bv{font-weight:900;white-space:nowrap;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.brk-row .bv .was{display:block;font-size:9.5px;font-weight:600;color:var(--ink3);text-decoration:line-through;margin-top:0}
.brk-row.pend .bname,.brk-row.pend .bv{color:#B08A2E;font-weight:600;font-style:italic}
/* 상위(합계) 줄과 그 아래 세부 줄 */
.brk-row.par .bname{font-weight:900;color:var(--ink)}
.brk-row.par .bv{font-weight:900}
.brk-row.sub{padding:4px 0 4px 15px;font-size:12px;position:relative}
.brk-row.sub:before{content:'';position:absolute;left:4px;top:11px;width:5px;height:1px;background:#C9D3E4}
.brk-row.sub .bname{font-weight:700;color:var(--ink2)}
.brk-row.sub .bv{font-weight:800;color:var(--ink2)}
.totdisc{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 3px;
  padding:9px 12px;background:#FDEDED;border:1px solid #F5C2C2;border-radius:10px;
  font-size:12.5px;font-weight:900;color:#C0392B}
.totdisc .dv{font-size:14px;white-space:nowrap}
.qtot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;
  background:linear-gradient(140deg,#0E2350,#16346E);color:#fff}
.qtot .k{font-size:12.5px;font-weight:900}
.qtot .v{font-size:21px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* ── 항목 섹션 카드 ── */
.qsec{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:11px;overflow:hidden;
  box-shadow:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.16)}
.qsec .sh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.qsec .sh .ic{width:26px;height:26px;border-radius:8px;background:var(--soft);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.qsec .sh b{font-size:13.5px;font-weight:900;letter-spacing:-.02em}
.qsec .sh .ssum{margin-left:auto;font-size:13px;font-weight:900;color:var(--bl);text-align:right;font-variant-numeric:tabular-nums}
.sh .ssum .was{display:block;font-size:9.5px;font-weight:600;color:var(--ink3);text-decoration:line-through;margin-top:1px}
.qtbl{width:100%;border-collapse:collapse;font-size:12.5px}
.qtbl td{padding:11px 14px;border-bottom:1px solid #F0F3F8;vertical-align:top;font-weight:700}
.qtbl td.r{text-align:right;font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums}
.qtbl td .note{display:block;font-size:10.5px;color:var(--ink3);margin-top:3px;font-weight:600;line-height:1.5}
/* 비고 — 관리자가 입력한 경우에만 표시됩니다 */
.qtbl td .memo{display:block;font-size:10.5px;color:var(--ink2);margin-top:6px;font-weight:600;line-height:1.55;padding:1px 0 1px 9px;border-left:2px solid #D7E0F0;word-break:keep-all}
.qtbl td.r .was{display:block;font-size:9.5px;font-weight:600;color:var(--ink3);text-decoration:line-through;margin-top:1px}
.qtbl tr:last-child td{border-bottom:none}
.disc{display:flex;justify-content:space-between;font-size:12.5px;color:var(--red);font-weight:900;
  padding:11px 14px;border-top:1px dashed var(--line);background:#fff;border-radius:0 0 14px 14px;margin-top:-11px;margin-bottom:11px}

/* ── 에어컨 모델 선택 ── */
.acsel{background:#fff;border:1.5px solid var(--bl);border-radius:14px;overflow:hidden;margin-bottom:11px;
  box-shadow:0 1px 2px rgba(37,99,235,.08),0 10px 22px -10px rgba(37,99,235,.35)}
.acsel .ahd2{background:#EAF1FF;padding:11px 14px;display:flex;align-items:center;gap:7px;border-bottom:1px solid #D9E5FB}
.acsel .ahd2 b{font-size:13px;font-weight:900;color:#173A8C;letter-spacing:-.02em}
.acsel .ahd2 span{margin-left:auto;font-size:9.5px;color:var(--bl);background:#fff;border-radius:999px;
  padding:3px 9px;font-weight:900;white-space:nowrap}
.opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid #F0F3F8;cursor:pointer;transition:.12s}
.opt:last-of-type{border-bottom:none}
.opt .rad{width:19px;height:19px;border-radius:50%;border:2px solid #C4CCDE;flex-shrink:0;position:relative}
.opt.on{background:#F4F8FF}
.opt.on .rad{border-color:var(--bl)}
.opt.on .rad:after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--bl)}
.opt .oi{flex:1;min-width:0}
.opt .oi .bn2{font-size:13px;font-weight:900;letter-spacing:-.01em}
.opt .oi .bn2 .tag{display:inline-block;font-size:8.5px;font-weight:900;padding:1.5px 6px;border-radius:8px;margin-left:5px;vertical-align:1px}
.opt .oi .bn2 .tag.inv{background:#E0F2FE;color:#0369A1}
.opt .oi .bn2 .tag.non{background:#F0F2F8;color:#667}
.opt .oi .bn2 .tag.rec{background:#FDF0D2;color:#8A6D1F}
.opt .oi .sub2{font-size:10.5px;color:var(--ink3);margin-top:2px;font-weight:700}
.opt .op{font-size:13.5px;font-weight:900;color:var(--bl);white-space:nowrap;font-variant-numeric:tabular-nums}
.opt.none .bn2{color:var(--ink2);font-weight:700}
.confirmbar{background:#EAF1FF;padding:11px 14px;display:flex;align-items:center;gap:9px;border-top:1px solid #D9E5FB}
.confirmbar .msg{flex:1;font-size:10.5px;color:#3B57B4;line-height:1.55;font-weight:700}
.confirmbar .cb{background:linear-gradient(140deg,#2563EB,#1740B8);color:#fff;font-size:12px;font-weight:900;

.confirmbar.done{background:#ECFDF5;border-top-color:#C9EEDC}
.confirmbar.done .msg{color:#0A7A4A}

/* ── 안내사항 · 유효기간 ── */
.notice{background:#FFFDF6;border:1px solid #F0E3BC;border-radius:14px;padding:13px 14px;margin-bottom:11px;
  box-shadow:0 1px 2px rgba(14,35,80,.05),0 8px 18px -10px rgba(14,35,80,.12)}
.notice b{font-size:12.5px;font-weight:900;display:block;margin-bottom:8px;color:#6E5310}
.notice p{font-size:11px;color:var(--ink2);line-height:1.7;padding-left:13px;position:relative;margin-bottom:4px;font-weight:600}
.notice p:before{content:'·';position:absolute;left:3px;color:var(--gold);font-weight:900}
.valid{display:block;background:#FFF6E4;border:1px solid #F0DFA8;border-radius:12px;
  padding:12px 13px;font-size:11.5px;color:#8A6608;font-weight:700;line-height:1.6;margin-bottom:11px}
.valid.expired{background:#FEF2F2;border-color:#F5C2C2;color:#B91C1C}
.valid b{font-weight:900}

/* ── 연락처 카드 ── */
.ft{display:flex;gap:11px;align-items:center;padding:13px 14px}
.ft .fi{width:36px;height:36px;border-radius:50%;background:var(--n);color:#fff;flex:none;

.ft .ft1{font-size:12px;font-weight:900}
.ft .ft2{font-size:11.5px;color:var(--ink2);font-weight:700;margin-top:2px}
.ft .ft2 a{color:var(--bl);font-weight:900;text-decoration:none}

/* ── 하단 버튼바 ── */
#qa-bar{position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:520px;margin:0 auto;display:flex;gap:9px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-top:1px solid #E4E9F2;box-shadow:0 -14px 30px -16px rgba(14,35,80,.45)}
#qa-bar button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;
  font-size:14px;font-weight:900;border-radius:13px;padding:13px 8px;cursor:pointer;border:1.5px solid #2563EB;
  background:#fff;color:#2563EB;transition:transform .14s}
#qa-bar button.prim{background:linear-gradient(140deg,#2563EB,#1740B8);color:#fff;border-color:transparent;
  box-shadow:0 6px 16px -6px rgba(37,99,235,.7)}
#qa-bar button:active{transform:translateY(2px)}

/* ── 로딩 · 오류 ── */
.center{display:flex;align-items:center;justify-content:center;min-height:70vh;flex-direction:column;gap:12px;
  color:var(--ink2);font-size:14px;padding:20px;text-align:center;font-weight:700}
.spin{width:26px;height:26px;border:3px solid #C4CCDE;border-top-color:var(--bl);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media print{
  body{background:#fff}
  #qa-top,#qa-bar,.confirmbar{display:none!important}
  .qa{max-width:100%;padding:0}
  .card,.qsec,.acsel,.hero,.notice{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .opt{page-break-inside:avoid}
}

var _SEK=Object.keys(SUBJ_EN).sort(function(a,b){return b.length-a.length;});
function subjEn(txt){
  var t=String(txt||'');
  if(!/[\uAC00-\uD7A3]/.test(t))return t;
  for(var i=0;i<_SEK.length;i++){if(t.indexOf(_SEK[i])>=0)t=t.split(_SEK[i]).join(SUBJ_EN[_SEK[i]]);}
  t=t.replace(/(\d+)\s*\uB300(?![\uAC00-\uD7A3])/g,function(m,q){return q+(q==='1'?' unit':' units');});
  t=t.replace(/(\d+)\s*\uAC1C(?![\uAC00-\uD7A3])/g,function(m,q){return q+(q==='1'?' item':' items');});
  return t.replace(/\s{2,}/g,' ').trim();
}
function subjOf(Q,isEn){
  var ko=Q.subject||'';

function groupSel(i){

  const g=acGroups[i];const key=selArr[i];

  const disc=Q.discount||0;
  const itemDiscTotal=Object.keys(sectGross).reduce((a,k)=>a+Math.max(0,sectGross[k]-sectSum[k]),0);
  const totalDisc=itemDiscTotal+disc;
  const nonZero=Object.keys(sectSum).filter(k=>sectSum[k]>0).length;
  let brkHtml='';
  if(totalDisc>0.004)brkHtml+='<div class="totdisc"><span>🎁 '+(isEn?'Total Discount':'총 할인금액')+'</span><span class="dv">− RM '+fmtN(totalDisc)+'</span></div>';
  {
    let rowsHtml='';
    const brkHtml0=brkHtml; brkHtml='';
    // 총 인건비(기본+추가) · 총 자재비용(자재+기타)으로 묶어 보여줍니다.
    // 한쪽만 있는 경우에는 같은 금액이 두 줄로 반복되지 않도록 그 항목 이름으로 한 줄만 표시합니다.
    const PARENTS=[
      {icon:'\uD83D\uDD27',ko:'총 인건비',en:'Total Labor',keys:['base','extra']},
      {icon:'\uD83E\uDDF0',ko:'총 자재비용',en:'Total Materials',keys:['material','etc']}
    ];
    const wasTag=(net,gross)=>gross>net+0.004?'<span class="was">'+fmtN(gross)+'</span>':'';
    PARENTS.forEach(P=>{
      const kids=P.keys.filter(k=>sectSum[k]>0.004);
      if(!kids.length)return;
      if(kids.length===1){
        const k=kids[0];
        brkHtml+='<div class="brk-row"><div class="bl"><span class="bname">'+SECT_META[k].icon+' '+(isEn?SECT_META[k].en:SECT_META[k].ko)+
          '</span></div><div class="bv">'+fmtN(sectSum[k])+wasTag(sectSum[k],sectGross[k])+'</div></div>';
        return;
      }
      const pSum=P.keys.reduce((a,k)=>a+sectSum[k],0);
      const pGross=P.keys.reduce((a,k)=>a+sectGross[k],0);
      brkHtml+='<div class="brk-row par"><div class="bl"><span class="bname">'+P.icon+' '+(isEn?P.en:P.ko)+
        '</span></div><div class="bv">'+fmtN(pSum)+wasTag(pSum,pGross)+'</div></div>';
      kids.forEach(k=>{
        brkHtml+='<div class="brk-row sub"><div class="bl"><span class="bname">'+(isEn?SECT_META[k].en:SECT_META[k].ko)+
          '</span></div><div class="bv">'+fmtN(sectSum[k])+wasTag(sectSum[k],sectGross[k])+'</div></div>';
      });
    });
    if(acOn){
      brkHtml+='<div class="brk-row par"><div class="bl"><span class="bname">❄️ '+t.brkProd+'</span></div><div class="bv">'+(!allChosen()&&acPrice===0?'—':fmtN(acPrice))+'</div></div>';
      // 에어컨 선택 그룹별 상세 (들여쓰기)
      acGroups.forEach((g,i)=>{
        const s=groupSel(i);
        const num=acGroups.length>1?(circled2[i]||(i+1)):'';
        const gTag=(num?num+' ':'')+g.hp+'HP';
        if(!selArr[i]){
          brkHtml+='<div class="brk-row pend sub"><div class="bl"><span class="bnum">'+gTag+'</span><span class="bname">'+(isEn?'Select a model below':'아래에서 모델을 선택해 주세요')+'</span></div><div class="bv">—</div></div>';
        }else if(selArr[i]==='__none__'){
          brkHtml+='<div class="brk-row sub"><div class="bl"><span class="bnum">'+gTag+'</span><span class="bname">'+t.acNone2+'</span></div><div class="bv">—</div></div>';
        }else{
          brkHtml+='<div class="brk-row sub"><div class="bl"><span class="bnum">'+gTag+'</span><span class="bname">'+esc(s.label)+'</span>'+(s.qty>1?'<span class="bqty">'+fmtN(s.price)+' × '+s.qty+(isEn?' units':'대')+'</span>':'')+'</div><div class="bv">'+fmtN(s.amount)+'</div></div>';
        }
      });
    }
    if(disc>0)brkHtml+='<div class="brk-row"><div class="bl"><span class="bname" style="color:#c0392b">'+t.discount+'</span></div><div class="bv" style="color:#c0392b">− '+fmtN(disc)+'</div></div>';
    rowsHtml=brkHtml; brkHtml=brkHtml0;
    // 줄이 하나뿐이면 바로 아래 「최종 견적금액」과 같은 값이 반복되므로 접습니다.
    const rowN=(rowsHtml.match(/class="brk-row/g)||[]).length;
    if(rowN>1||acOn||disc>0)brkHtml+='<div class="brk">'+rowsHtml+'</div>';
  }
  const amtSub='';

  // 상태 배지 — 만료 > 선택확정 > 모델선택 대기 > 유효
  let pill;
  if(expired)pill='<span class="qpill exp">'+(isEn?'EXPIRED':'유효기간 만료')+'</span>';
  else if(acOn&&isConfirmed)pill='<span class="qpill cf">✓ '+t.confirmedTag+'</span>';
  else if(acOn&&!allChosen())pill='<span class="qpill wait">'+(isEn?'Select a model':'모델 선택 대기')+'</span>';
  else pill='<span class="qpill">'+(isEn?'VALID':'유효한 견적서')+'</span>';

  document.getElementById('doc').innerHTML=
    '<div id="qa-top"><div class="ti">'+(isEn?'Quotation':'견적서')+'</div>'+
      '<div class="lgb"><button id="lk" class="'+(lang==='ko'?'on':'')+'">한국어</button><button id="le" class="'+(lang==='en'?'on':'')+'">EN</button></div></div>'+
    '<div class="qa">'+
      '<div class="brand"><div class="lg">HHC</div>'+
        '<div class="bnm">Happy Home Care<span>HAPPY WORKS SERVICES SDN. BHD.</span></div>'+
        '<div class="ino">'+esc(Q.qno||'')+'</div></div>'+
      '<div class="hero"><div class="qh-t">'+
        '<div class="qh-l"><div class="qh-k">QUOTATION'+(isEn?'':' · 견적서')+'</div>'+
          '<div class="qh-n">'+esc(Q.client||'—')+'</div>'+pill+'</div>'+
        '<div class="qh-r"><div class="qh-rk">'+t.final+'</div>'+
          '<div class="qh-rv"><i>RM</i><span id="amt-v">'+fmtN(finalTotal)+'</span></div></div></div>'+
        '<div class="qh-m">'+
          '<div><div class="k">📄 '+(isEn?'QUOTE NO.':'견적번호')+'</div><div class="v">'+esc(Q.qno||'—')+'</div></div>'+
          '<div><div class="k">🗓 '+(isEn?'ISSUED':'발행일')+'</div><div class="v">'+esc(Q.issueDate||'—')+'</div></div>'+
          '<div><div class="k">⏳ '+(isEn?'VALID UNTIL':'유효기한')+'</div><div class="v">'+esc(Q.validUntil||'—')+'</div></div></div>'+
        (Q.subject?'<div class="qh-s">📌 '+esc(subjOf(Q,isEn))+'</div>':'')+
      '</div>'+
      '<div class="card"><div class="chd">💰 <b>'+(isEn?'Amount Breakdown':'금액 구성')+'</b></div>'+
        (brkHtml?'<div class="abody">'+brkHtml+'</div>':'')+
        '<div class="qtot"><span class="k">'+t.final+'</span><span class="v">RM '+fmtN(finalTotal)+'</span></div></div>'+
      acHtml+
      secHtml+
      ((Q.notices||[]).length?('<div class="notice"><b>'+t.notice+'</b>'+(Q.notices||[]).map(n=>'<p>'+esc(isEn?(NOTICE_EN[n]||n):n)+'</p>').join('')+'</div>'):'')+
      '<div class="valid'+(expired?' expired':'')+'">'+(expired?t.expMsg:('⏳ '+t.validMsg(Q.validDays||7,Q.validUntil||'')))+'</div>'+
      '<div class="card ft"><div class="fi">📞</div><div>'+
        '<div class="ft1">Happy Works Services Sdn. Bhd.</div>'+
        '<div class="ft2"><a href="tel:+60172472774">+60 17-247 2774</a></div></div></div>'+
    '</div>'+
    '<div id="qa-bar"><button onclick="window.print()">'+t.print+'</button>'+
      '<button class="prim" onclick="window.print()">'+t.pdf+'</button></div>';

  // 이벤트
  document.getElementById('lk').onclick=()=>{lang='ko';render();};
  document.getElementById('le').onclick=()=>{lang='en';render();};
  document.querySelectorAll('.opt').forEach(o=>{
    if(!o.dataset.k)return; // 컴팩트(확정 표시) 행은 클릭 불가
    o.addEventListener('click',()=>{
      selArr[parseInt(o.dataset.g,10)]=o.dataset.k;
      render();
    });
  });
  const cbtn=document.getElementById('confirm-btn');
  if(cbtn)cbtn.onclick=confirmChoice;
  const chbtn=document.getElementById('change-btn');
  if(chbtn)chbtn.onclick=()=>{acEditing=true;render();};
}

async function confirmChoice(){
  if(!allChosen())return;
  const t=T[lang];
  const btn=document.getElementById('confirm-btn');
  btn.disabled=true;btn.textContent=t.confirming;
  const selections=acGroups.map((g,i)=>{
    const s=groupSel(i);
    return {key:selArr[i],hp:g.hp,qty:g.qty||1,label:s.label||(lang==='en'?'No AC purchase':'에어컨 구입 없음'),price:s.price,amount:s.amount};
  });
  const summary=acSummary()||(lang==='en'?'No AC purchase':'에어컨 구입 없음');
  // label/price는 관리자 목록 호환용 (합계 요약)
  const choice={selections:selections,label:summary,price:acTotal(),at:new Date().toISOString()};
  try{
    await updateDoc(doc(DB,'quotes',quoteId),{customerChoice:choice});
    Q.customerChoice=choice;
    acEditing=false;
    render();
    // 관리자 이메일 알림 (의뢰/예약과 동일한 EmailJS 템플릿 재사용) — 실패해도 확정은 유지
    try{
      if(window.emailjs){
        const circ=['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
        const lines=selections.map((s,i)=>
          (selections.length>1?(circ[i]||(i+1))+' ':'')+s.hp+'HP'+(s.qty>1?'×'+s.qty+'대':'')+' : '+s.label+(s.amount>0?' — RM '+s.amount.toLocaleString('en-US'):''));
        const finalAmt=(Q.baseTotal||0)+acTotal();
        await emailjs.send('service_wf4f4eg','template_mu63ahr',{
          customer_name:Q.client||'—',
          customer_phone:Q.phone||'—',
          customer_address:Q.subject||'—',
          booking_date:'[견적서 에어컨 선택 확정 / Quotation AC Confirmed]',
          booking_time:'견적번호 '+(Q.qno||quoteId),
          booking_items:lines.join('\n'),
          booking_memo:'최종 견적금액: RM '+finalAmt.toLocaleString('en-US')+' (기본 '+(Q.baseTotal||0).toLocaleString('en-US')+' + 에어컨 '+acTotal().toLocaleString('en-US')+')',
          submitted_at:new Date().toLocaleString('ko-KR')
        },'O99J6X4SGYUPMfGQy');
        console.log('관리자 알림 이메일 발송 완료');
      }
    }catch(mailErr){console.warn('알림 이메일 발송 실패 (확정은 저장됨):',mailErr);}
  }catch(e){
    btn.disabled=false;btn.textContent=t.confirm;
    alert((lang==='en'?'Failed to send selection: ':'선택 전달 실패: ')+e.message);
  }
}
</script>
