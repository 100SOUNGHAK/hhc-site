<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Home Care · Quotation</title>
<style>
:root{--navy:#0F1729;--indigo:#4F6EF7;--il:#eef1fe;--gold:#E8A838;--green:#10b981;--gray:#6b7280;--bdr:rgba(0,0,0,.09);--bg:#f0f2f8;--txt:#0f172a;--txt2:#475569}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
.page{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 40px rgba(15,23,41,.08)}
.qhd{background:linear-gradient(150deg,#0F1729,#1d2b4f);color:#fff;padding:22px 18px 18px}
.qhd .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:8px}
.qhd .brand{display:flex;gap:9px;align-items:center}
.qhd .blogo{width:36px;height:36px;background:linear-gradient(150deg,#4F6EF7,#22c1a3);border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
.qhd .bn{font-size:13px;font-weight:700;line-height:1.3}
.qhd .bn span{display:block;font-size:8.5px;color:#8fa0c9;font-weight:400;letter-spacing:.05em}
.qhd .qt{text-align:right}
.qhd .qt h1{font-size:22px;letter-spacing:.13em;font-weight:800}
.qhd .qt span{font-size:9.5px;color:var(--gold);letter-spacing:.1em}
.langsw{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:14px;overflow:hidden;font-size:10px;margin-bottom:8px;float:right}
.langsw button{padding:5px 11px;font-weight:700;border:none;background:transparent;color:#aab4d0;font-family:inherit}
.langsw button.on{background:var(--gold);color:#3d2c00}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;clear:both}
.qcell{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:8px 11px}
.qcell .l{font-size:8.5px;color:#8fa0c9;letter-spacing:.08em;margin-bottom:2px}
.qcell .v{font-size:12px;font-weight:600;word-break:break-all}
.qcell .v.gold{color:var(--gold)}
.qbody{padding:15px 15px 20px;display:flex;flex-direction:column;gap:13px}
.amount{background:linear-gradient(135deg,#fdf6e8,#fbeecf);border:1px solid #f0d9a0;border-radius:14px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.amount .l{font-size:12.5px;font-weight:700;color:#8a6d1f;min-width:0}
.amount .l span{display:block;font-size:10px;font-weight:400;color:#b09346;margin-top:2px;word-break:keep-all}
.amount .v{font-size:24px;font-weight:800;color:#9c6d00;white-space:nowrap}
.amount .v i{font-style:normal;font-size:12px;margin-right:3px;color:#b09346}
.qsec .sh{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.qsec .sh .ic{width:23px;height:23px;border-radius:7px;background:var(--il);display:flex;align-items:center;justify-content:center;font-size:11px}
.qsec .sh b{font-size:13px}
.qsec .sh .ssum{margin-left:auto;font-size:12px;font-weight:800;color:var(--indigo)}
.qtbl{width:100%;border-collapse:collapse;font-size:12px}
.qtbl td{padding:8px 6px;border-bottom:1px solid #f0f2f7;vertical-align:top}
.qtbl td.r{text-align:right;font-weight:700;white-space:nowrap}
.qtbl td .note{display:block;font-size:10px;color:var(--gray);margin-top:1px}
.qtbl tr:last-child td{border-bottom:none}
.disc{display:flex;justify-content:space-between;font-size:12.5px;color:#dc2626;font-weight:700;padding:8px 6px;border-top:1px dashed var(--bdr)}
.notice{background:#f8f9fc;border:1px solid var(--bdr);border-radius:12px;padding:12px 13px}
.notice b{font-size:12px;display:block;margin-bottom:7px}
.notice p{font-size:11px;color:var(--txt2);line-height:1.65;padding-left:13px;position:relative;margin-bottom:4px}
.notice p:before{content:'·';position:absolute;left:3px;color:var(--indigo);font-weight:800}
.valid{display:flex;align-items:center;gap:8px;background:#fff7ed;border:1px solid #fed7aa;border-radius:11px;padding:11px 13px;font-size:11.5px;color:#9a3412;font-weight:600;line-height:1.5}
.valid.expired{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
.qfoot{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.qfoot .c{font-size:10.5px;color:#8fa0c9;line-height:1.55}
.qfoot .c a{color:#cfe0ff;text-decoration:none}
.qfoot .btns{display:flex;gap:6px;flex-shrink:0}
.qfoot .fb{padding:9px 13px;border-radius:9px;font-size:11.5px;font-weight:700;border:none;font-family:inherit}
.qfoot .fb.g{background:var(--gold);color:#3d2c00}
.qfoot .fb.o{background:transparent;border:1px solid rgba(255,255,255,.3);color:#dfe6f5}
/* 에어컨 선택 */
.acsel{background:#fff;border:1.5px solid var(--indigo);border-radius:14px;overflow:hidden}
.acsel .ahd2{background:var(--il);padding:11px 13px;display:flex;align-items:center;gap:7px}
.acsel .ahd2 b{font-size:13px;color:#2c3e8f}
.acsel .ahd2 span{margin-left:auto;font-size:9.5px;color:#5568c9;background:#fff;border-radius:10px;padding:3px 8px;font-weight:700;white-space:nowrap}
.opt{display:flex;align-items:center;gap:10px;padding:12px 13px;border-bottom:1px solid #f0f2f7;cursor:pointer;transition:.12s}
.opt:last-of-type{border-bottom:none}
.opt .rad{width:19px;height:19px;border-radius:50%;border:2px solid #c6cbe0;flex-shrink:0;position:relative}
.opt.on{background:#f6f8ff}
.opt.on .rad{border-color:var(--indigo)}
.opt.on .rad:after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--indigo)}
.opt .oi{flex:1;min-width:0}
.opt .oi .bn2{font-size:13px;font-weight:700}
.opt .oi .bn2 .tag{display:inline-block;font-size:8.5px;font-weight:800;padding:1.5px 6px;border-radius:8px;margin-left:5px;vertical-align:1px}
.opt .oi .bn2 .tag.inv{background:#e0f2fe;color:#0369a1}
.opt .oi .bn2 .tag.non{background:#f0f2f8;color:#667}
.opt .oi .bn2 .tag.rec{background:#fdf0d2;color:#8a6d1f}
.opt .oi .sub2{font-size:10px;color:var(--gray);margin-top:1px}
.opt .op{font-size:13.5px;font-weight:800;color:var(--indigo);white-space:nowrap}
.opt.none .bn2{color:var(--gray);font-weight:600}
.confirmbar{background:var(--il);padding:11px 13px;display:flex;align-items:center;gap:9px}
.confirmbar .msg{flex:1;font-size:10.5px;color:#4356b0;line-height:1.5}
.confirmbar .cb{background:var(--indigo);color:#fff;font-size:12px;font-weight:700;padding:10px 15px;border-radius:9px;white-space:nowrap;border:none;font-family:inherit}
.confirmbar .cb:disabled{opacity:.55}
.confirmbar.done{background:#ecfdf5}
.confirmbar.done .msg{color:#0a7a4a}
.center{display:flex;align-items:center;justify-content:center;min-height:70vh;flex-direction:column;gap:12px;color:var(--txt2);font-size:14px;padding:20px;text-align:center}
.spin{width:26px;height:26px;border:3px solid #c6cbe0;border-top-color:var(--indigo);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{
  body{background:#fff}
  .page{box-shadow:none;max-width:100%}
  .langsw,.qfoot .btns,.confirmbar .cb{display:none!important}
  .acsel .opt{page-break-inside:avoid}
}
</style>
</head>
<body>
<div class="page">
  <div id="state-loading" class="center"><div class="spin"></div><div>견적서를 불러오는 중...<br>Loading quotation...</div></div>
  <div id="state-error" class="center" style="display:none">
    <div style="font-size:32px">📄</div>
    <div id="err-msg">견적서를 찾을 수 없습니다.<br>Quotation not found.</div>
  </div>
  <div id="doc" style="display:none"></div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FIREBASE_CFG={
  apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",
  authDomain:"happywork-packageplan.firebaseapp.com",
  projectId:"happywork-packageplan",
  storageBucket:"happywork-packageplan.firebasestorage.app",
  messagingSenderId:"101289103022",
  appId:"1:101289103022:web:d81aca7f3747dd26df673f"
};

const params=new URLSearchParams(location.search);
const quoteId=params.get('id');
let lang=(params.get('lang')==='en')?'en':'ko';
let Q=null,DB=null,selArr=[];   // selArr[i] = 그룹 i의 선택 key ('__none__' 포함)
let acGroups=[];                // 정규화된 유닛 그룹 목록

const GROUP_META={
  product:{ko:'에어컨 구입비용',en:'AC Unit Purchase',icon:'❄️',order:0},
  install:{ko:'설치 작업 · 인건비',en:'Installation Labor',icon:'🔩',order:1},
  repair:{ko:'수리 작업 · 인건비',en:'Repair Labor',icon:'🔧',order:2},
  clean:{ko:'청소 서비스',en:'Cleaning Service',icon:'🧽',order:3},
  callout:{ko:'출장점검 비용',en:'Call-out Inspection',icon:'🚗',order:4},
  material:{ko:'자재 비용',en:'Materials',icon:'📦',order:5},
  custom:{ko:'기타 항목',en:'Other Items',icon:'📝',order:6}
};
const T={
  ko:{quo:'견 적 서 · AC INSTALLATION/REPAIR',no:'QUOTATION NO.',issued:'발행일 · ISSUED',cust:'고객 · CUSTOMER',valid:'유효기한 · VALID',until:'까지',
    final:'최종 견적금액',base:'기본 견적',acAdd:'에어컨',acNone2:'에어컨 구입 없음',
    acTitle:'에어컨 구입 — 모델을 선택해 주세요',wall:'벽걸이형',rec:'★ 추천',
    noneOpt:'에어컨 구입 없이 진행',noneSub:'설치 작업만 진행합니다',
    selMsg:'모델을 선택하시면 최종 금액이 자동 계산되며,<br>선택 내용은 업체에 자동 전달됩니다.',
    confirm:'✓ 이 모델로 선택 확정',confirming:'전달 중...',
    done:'✓ 선택이 전달되었습니다. 변경하려면 다른 모델을 선택 후 다시 확정해 주세요.',
    discount:'할인',notice:'📋 견적서 안내사항',
    validMsg:function(d,u){return '본 견적서는 발행일로부터 <b>'+d+'일간</b> 유효합니다 ('+u+' 까지)';},
    expMsg:'⚠ 본 견적서의 유효기간이 만료되었습니다. 최신 견적은 아래 연락처로 문의해 주세요.',
    print:'🖨 인쇄',pdf:'📄 PDF 저장',qty:'수량'},
  en:{quo:'QUOTATION · AC INSTALLATION/REPAIR',no:'QUOTATION NO.',issued:'ISSUED',cust:'CUSTOMER',valid:'VALID UNTIL',until:'',
    final:'Final Quotation Amount',base:'Base quote',acAdd:'AC unit',acNone2:'No AC purchase',
    acTitle:'AC Unit — Please select a model',wall:'Wall-mounted',rec:'★ Recommended',
    noneOpt:'Proceed without AC purchase',noneSub:'Installation work only',
    selMsg:'Select a model to see the final amount.<br>Your choice is sent to us automatically.',
    confirm:'✓ Confirm this model',confirming:'Sending...',
    done:'✓ Your selection has been sent. To change it, pick another model and confirm again.',
    discount:'Discount',notice:'📋 Quotation Notes',
    validMsg:function(d,u){return 'This quotation is valid for <b>'+d+' days</b> from the issue date (until '+u+')';},
    expMsg:'⚠ This quotation has expired. Please contact us for an updated quotation.',
    print:'🖨 Print',pdf:'📄 Save PDF',qty:'Qty'}
};
// 기본 안내문구 한→영 (관리자가 수정하지 않은 표준 문구는 영어로 표시)
const NOTICE_EN={
  '기본 설치 인건비에는 배관 진공 작업(VACUUMING) 및 냉매 추가 충전이 포함됩니다.':'Basic installation labor includes piping vacuuming and refrigerant top-up.',
  '최종 청구 금액은 현장 조건 및 실제 사용 자재에 따라 다소 차이가 있을 수 있습니다.':'The final amount may vary slightly depending on site conditions and actual materials used.',
  '에어컨 본체·자재 비용은 주문 확정 시 선결제, 잔금은 작업 완료 후 결제해 주시면 됩니다.':'AC unit and material costs are prepaid upon order confirmation; the balance is payable after completion.',
  '출장점검 비용은 에어컨 1대 기준이며, 추가 점검 시 대당 RM50이 추가됩니다.':'Call-out inspection covers one AC unit; additional units are RM50 each.',
  '점검 결과에 따라 수리 또는 부품 교체가 필요한 경우 별도 견적이 제공됩니다.':'If repair or part replacement is needed, a separate quotation will be provided.',
  '정품 부품 가격은 별도 문의 바랍니다.':'Please enquire separately for genuine part prices.',
  '청소 작업 시 전원 및 배수 사용이 필요합니다.':'Power and drainage access are required for cleaning work.',
  '오염도가 심한 경우 추가 비용이 발생할 수 있습니다.':'Additional charges may apply for heavily soiled units.',
  '이전 설치 시 기존 배관 재사용 가능 여부는 현장 확인 후 결정됩니다.':'Reusability of existing piping for relocation is determined after on-site inspection.',
  '자재 가격 변동에 따라 최종 단가는 실제 구매 시점 기준으로 적용됩니다.':'Final material prices are based on actual purchase-time market rates.'
};
const fmtN=n=>Number(n||0).toLocaleString('en-US');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function showError(msg){
  document.getElementById('state-loading').style.display='none';
  document.getElementById('state-error').style.display='flex';
  if(msg)document.getElementById('err-msg').innerHTML=msg;
}

if(!quoteId){showError();}
else{
  try{
    const app=initializeApp(FIREBASE_CFG);
    DB=getFirestore(app);
    getDoc(doc(DB,'quotes',quoteId)).then(snap=>{
      if(!snap.exists()){showError();return;}
      Q=snap.data();
      // 유닛 그룹 정규화 (구 스키마: 단일 그룹 → groups 배열로)
      if(Q.acSelect){
        acGroups=Q.acSelect.groups||[{hp:Q.acSelect.hp,qty:1,options:Q.acSelect.options||[],recommended:Q.acSelect.recommended||'',includeNone:Q.acSelect.includeNone}];
        acGroups=acGroups.filter(g=>(g.options||[]).length);
      }
      // 초기 선택: 고객이 이미 확정한 선택 > 추천 모델 > 미선택
      const savedSel=(Q.customerChoice&&Q.customerChoice.selections)?Q.customerChoice.selections:
        (Q.customerChoice&&Q.customerChoice.key?[{key:Q.customerChoice.key}]:null);
      selArr=acGroups.map((g,i)=>{
        if(savedSel&&savedSel[i]&&savedSel[i].key)return savedSel[i].key;
        return g.recommended||null;
      });
      document.getElementById('state-loading').style.display='none';
      document.getElementById('doc').style.display='block';
      render();
    }).catch(e=>showError('로딩 실패: '+esc(e.message)));
  }catch(e){showError('연결 실패: '+esc(e.message));}
}

function groupOpt(g,key){
  return (g.options||[]).find(x=>(x.key||x.brand+'|'+x.type)===key)||null;
}
function groupSel(i){
  // 그룹 i의 선택 결과 {key,label,price,qty,amount} (미선택/구입없음 → price 0)
  const g=acGroups[i];const key=selArr[i];
  if(!g||!key||key==='__none__')return {key:key||null,label:null,price:0,qty:g?g.qty||1:1,amount:0};
  const o=groupOpt(g,key);
  if(!o)return {key:key,label:null,price:0,qty:g.qty||1,amount:0};
  const qty=g.qty||1;
  return {key:key,label:o.brand+' '+(o.type==='inv'?'INVERTER':'NON-INV'),price:o.price,qty:qty,amount:o.price*qty};
}
function acTotal(){
  let t=0;acGroups.forEach((g,i)=>{t+=groupSel(i).amount;});
  return t;
}
function acSummary(){
  const parts=[];
  acGroups.forEach((g,i)=>{
    const s=groupSel(i);
    if(s.label)parts.push(s.label+(s.qty>1?'×'+s.qty:''));
  });
  return parts.join(' + ');
}
function allChosen(){
  // 모든 그룹이 선택(또는 구입없음)되어야 확정 가능
  return acGroups.every((g,i)=>!!selArr[i]);
}

function render(){
  const t=T[lang];
  const isEn=lang==='en';
  const expired=Q.validUntil&&Q.validUntil<new Date().toISOString().slice(0,10);
  const acOn=acGroups.length>0;
  const acPrice=acTotal();
  const finalTotal=(Q.baseTotal||0)+acPrice;

  // 그룹별 항목
  const groups={};
  (Q.items||[]).forEach(it=>{
    const g=GROUP_META[it.group]?it.group:'custom';
    (groups[g]=groups[g]||[]).push(it);
  });
  let secHtml='';
  Object.keys(GROUP_META).sort((a,b)=>GROUP_META[a].order-GROUP_META[b].order).forEach(g=>{
    if(!groups[g])return;
    const sum=groups[g].reduce((s,it)=>s+(it.amount||it.qty*it.price||0),0);
    let rows='';
    groups[g].forEach(it=>{
      const nm=isEn?(it.nameEn||it.name):it.name;
      const nt=isEn?(it.noteEn||''):(it.note||'');
      const qtyTxt=(it.qty&&it.qty!==1)||it.unit?(fmtN(it.qty)+' '+(it.unit||'×')+' × RM '+fmtN(it.price)):'';
      const noteAll=[nt,qtyTxt].filter(Boolean).join(' · ');
      rows+='<tr><td>'+esc(nm)+(noteAll?'<span class="note">'+esc(noteAll)+'</span>':'')+'</td><td class="r">'+fmtN(it.amount||it.qty*it.price)+'</td></tr>';
    });
    secHtml+='<div class="qsec"><div class="sh"><div class="ic">'+GROUP_META[g].icon+'</div><b>'+(isEn?GROUP_META[g].en:GROUP_META[g].ko)+'</b><div class="ssum">'+fmtN(sum)+'</div></div><table class="qtbl">'+rows+'</table></div>';
  });
  if(Q.discount>0)secHtml+='<div class="disc"><span>'+t.discount+'</span><span>− '+fmtN(Q.discount)+'</span></div>';

  // AC 선택 블록 (유닛 그룹별)
  let acHtml='';
  if(acOn){
    const circled=['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
    let groupsHtml='';
    acGroups.forEach((g,i)=>{
      const recKey=g.recommended||'';
      const qty=g.qty||1;
      const gLabel=(acGroups.length>1?((circled[i]||(i+1))+' '):'')+g.hp+'HP'+(qty>1?' × '+qty+(isEn?' units':'대'):'');
      let opts='';
      (g.options||[]).forEach(o=>{
        const key=o.key||o.brand+'|'+o.type;
        const on=selArr[i]===key;
        opts+='<div class="opt'+(on?' on':'')+'" data-g="'+i+'" data-k="'+esc(key)+'">'+
          '<div class="rad"></div><div class="oi"><div class="bn2">'+esc(o.brand)+
          '<span class="tag '+(o.type==='inv'?'inv':'non')+'">'+(o.type==='inv'?'INVERTER':'NON-INV')+'</span>'+
          (recKey===key?'<span class="tag rec">'+t.rec+'</span>':'')+
          '</div><div class="sub2">'+esc(g.hp)+'HP · '+t.wall+(qty>1?' · '+fmtN(o.price)+' × '+qty:'')+'</div></div>'+
          '<div class="op">'+fmtN(o.price*qty)+'</div></div>';
      });
      if(g.includeNone!==false){
        opts+='<div class="opt none'+(selArr[i]==='__none__'?' on':'')+'" data-g="'+i+'" data-k="__none__">'+
          '<div class="rad"></div><div class="oi"><div class="bn2">'+t.noneOpt+'</div><div class="sub2">'+t.noneSub+'</div></div>'+
          '<div class="op" style="color:#aab">—</div></div>';
      }
      groupsHtml+='<div class="ahd2">❄️ <b>'+(isEn?'AC Unit ':'에어컨 ')+esc(gLabel)+'</b><span>'+(isEn?'Select a model':'모델 선택')+'</span></div>'+opts;
    });
    // 확정 상태: 저장된 선택과 현재 선택이 동일한가
    const savedKeys=(Q.customerChoice&&Q.customerChoice.selections)?Q.customerChoice.selections.map(s=>s.key):null;
    const chosen=savedKeys&&savedKeys.length===selArr.length&&savedKeys.every((k,i)=>k===selArr[i]);
    acHtml='<div class="acsel">'+groupsHtml+
      '<div class="confirmbar'+(chosen?' done':'')+'" id="confirm-bar">'+
      '<div class="msg" id="confirm-msg">'+(chosen?t.done:t.selMsg)+'</div>'+
      '<button class="cb" id="confirm-btn"'+(allChosen()?'':' disabled')+'>'+t.confirm+'</button></div></div>';
  }

  const summary=acSummary();
  const allNone=acOn&&acGroups.every((g,i)=>selArr[i]==='__none__');
  const amtSub=acOn?
    (t.base+' '+fmtN(Q.baseTotal)+(acPrice>0?(' + '+t.acAdd+' '+fmtN(acPrice)+(summary?' ('+summary+')':'')):(allNone?' · '+t.acNone2:'')))
    :(Q.subject||'');

  document.getElementById('doc').innerHTML=
    '<div class="qhd">'+
      '<div class="langsw"><button id="lk" class="'+(lang==='ko'?'on':'')+'">한국어</button><button id="le" class="'+(lang==='en'?'on':'')+'">EN</button></div>'+
      '<div class="top" style="clear:none">'+
        '<div class="brand"><div class="blogo">HHC</div><div class="bn">Happy Home Care<span>HAPPY WORKS SERVICES SDN. BHD.</span></div></div>'+
        '<div class="qt"><h1>QUOTATION</h1><span>'+t.quo+'</span></div>'+
      '</div>'+
      '<div class="qgrid">'+
        '<div class="qcell"><div class="l">'+t.no+'</div><div class="v">'+esc(Q.qno||'')+'</div></div>'+
        '<div class="qcell"><div class="l">'+t.issued+'</div><div class="v">'+esc(Q.issueDate||'')+'</div></div>'+
        '<div class="qcell"><div class="l">'+t.cust+'</div><div class="v">'+esc(Q.client||'')+'</div></div>'+
        '<div class="qcell"><div class="l">'+t.valid+'</div><div class="v gold">'+esc(Q.validUntil||'')+' '+t.until+'</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="qbody">'+
      '<div class="amount"><div class="l">'+t.final+(amtSub?'<span id="amt-sub">'+esc(amtSub)+'</span>':'')+'</div><div class="v"><i>RM</i><span id="amt-v">'+fmtN(finalTotal)+'</span></div></div>'+
      acHtml+
      secHtml+
      ((Q.notices||[]).length?('<div class="notice"><b>'+t.notice+'</b>'+(Q.notices||[]).map(n=>'<p>'+esc(isEn?(NOTICE_EN[n]||n):n)+'</p>').join('')+'</div>'):'')+
      '<div class="valid'+(expired?' expired':'')+'">'+(expired?t.expMsg:('⏳ '+t.validMsg(Q.validDays||7,Q.validUntil||'')))+'</div>'+
    '</div>'+
    '<div class="qfoot">'+
      '<div class="c">Happy Works Services Sdn. Bhd.<br>📞 <a href="tel:+60172472774">+60 17-247 2774</a></div>'+
      '<div class="btns"><button class="fb o" onclick="window.print()">'+t.print+'</button><button class="fb g" onclick="window.print()">'+t.pdf+'</button></div>'+
    '</div>';

  // 이벤트
  document.getElementById('lk').onclick=()=>{lang='ko';render();};
  document.getElementById('le').onclick=()=>{lang='en';render();};
  document.querySelectorAll('.opt').forEach(o=>{
    o.addEventListener('click',()=>{
      selArr[parseInt(o.dataset.g,10)]=o.dataset.k;
      render();
    });
  });
  const cbtn=document.getElementById('confirm-btn');
  if(cbtn)cbtn.onclick=confirmChoice;
}

async function confirmChoice(){
  if(!allChosen())return;
  const t=T[lang];
  const btn=document.getElementById('confirm-btn');
  btn.disabled=true;btn.textContent=t.confirming;
  const selections=acGroups.map((g,i)=>{
    const s=groupSel(i);
    return {key:selArr[i],hp:g.hp,qty:g.qty||1,label:s.label||(lang==='en'?'No AC purchase':'에어컨 구입 없음'),price:s.price,amount:s.amount};
  });
  const summary=acSummary()||(lang==='en'?'No AC purchase':'에어컨 구입 없음');
  // label/price는 관리자 목록 호환용 (합계 요약)
  const choice={selections:selections,label:summary,price:acTotal(),at:new Date().toISOString()};
  try{
    await updateDoc(doc(DB,'quotes',quoteId),{customerChoice:choice});
    Q.customerChoice=choice;
    render();
  }catch(e){
    btn.disabled=false;btn.textContent=t.confirm;
    alert((lang==='en'?'Failed to send selection: ':'선택 전달 실패: ')+e.message);
  }
}
</script>
</body>
</html>
