<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Home Care · Quotation</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>try{emailjs.init('O99J6X4SGYUPMfGQy');}catch(e){}</script>
<style>
/* ══════════════════════════════════════════════════════
   고객용 견적서 — 앱 스타일 (인보이스·계약서와 동일한 디자인 언어)
   · 남색 히어로 + 흰색 카드 + 상단 고정바 + 하단 버튼바
   ══════════════════════════════════════════════════════ */
:root{--n:#0E2350;--n2:#16346E;--bl:#2563EB;--ink:#14192A;--ink2:#5A6478;--ink3:#98A1B4;
  --line:#E4E9F2;--soft:#F6F8FC;--ok:#0E9B63;--red:#DC2626;--gold:#B98A16}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#EEF1F7;color:var(--ink);font-size:14px}
.qa{max-width:520px;margin:0 auto;padding:10px 12px calc(90px + env(safe-area-inset-bottom))}

/* ── 상단 고정바 ── */
#qa-top{position:sticky;top:0;z-index:60;background:linear-gradient(140deg,#0E2350,#16346E);color:#fff;
  display:flex;align-items:center;gap:9px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  box-shadow:0 4px 16px -6px rgba(6,18,45,.7)}
#qa-top .ti{font-size:15.5px;font-weight:900;letter-spacing:-.02em;flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#qa-top .lgb{display:flex;gap:4px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
#qa-top .lgb button{border:none;background:none;color:#C6D5F5;font-family:inherit;font-size:11.5px;font-weight:900;
  border-radius:999px;padding:5px 11px;cursor:pointer}
#qa-top .lgb button.on{background:#fff;color:#0E2350}

/* ══ 2026-11-13 재디자인 — 한눈에 보이는 고급 견적서 ══════════════════════
   · 히어로: 고객명 → 대상 작업 → 큰 최종금액 → 할인 전/후 → 유효기간 막대
   · 금액 구성: 비율 막대 + 범례(인건비 남색 · 자재 파랑 · 제품 금색)
   · 상세 내역: 한 카드 안에 구분별 묶음 · 안내사항 · 연락 버튼 */
:root{--e1:0 1px 2px rgba(11,24,51,.07),0 6px 14px -6px rgba(11,24,51,.16);
  --e2:0 1px 2px rgba(11,24,51,.10),0 8px 16px -4px rgba(11,24,51,.16),0 26px 44px -14px rgba(11,24,51,.34);
  --c1:#0E2350;--c2:#3B6FE0;--c3:#C9A44C}
body{background:#EEF1F7;font-size:15px}

/* ── 브랜드 줄 ── */
.brand{display:flex;align-items:center;gap:11px;padding:14px 4px 14px}
.brand .lg{width:42px;height:42px;border-radius:12px;flex:none;background:#fff;color:var(--gold);
  display:flex;align-items:center;justify-content:center;box-shadow:var(--e1)}
.brand .bnm{font-size:16px;font-weight:900;letter-spacing:-.02em;flex:1;min-width:0}
.brand .bnm span{display:block;font-size:9.5px;color:var(--ink3);font-weight:700;letter-spacing:.04em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .ino{font-size:12px;font-weight:800;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ── 히어로 ── */
.hero{position:relative;overflow:hidden;background:linear-gradient(150deg,#0B1D44 0%,#0E2350 45%,#1A3C80 100%);color:#fff;
  border-radius:20px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:0 3px 8px rgba(6,18,45,.28),0 22px 40px -16px rgba(6,18,45,.75)}
.hero:before{content:"";position:absolute;right:-70px;top:-90px;width:230px;height:230px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,164,76,.22),rgba(201,164,76,0) 70%);pointer-events:none}
.hero:after{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(227,201,138,.65),transparent)}
.qv-top{position:relative;display:flex;align-items:center;gap:8px}
.qv-k{font-size:10.5px;font-weight:800;letter-spacing:.16em;color:#E3C98A;flex:1;min-width:0}
.qpill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:900;border-radius:999px;padding:5px 11px;
  background:rgba(14,155,99,.18);color:#7FE3B6;border:1px solid rgba(127,227,182,.35);white-space:nowrap}
.qpill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.qpill.exp{background:rgba(229,72,77,.2);color:#FFB4B6;border-color:rgba(255,180,182,.4)}
.qpill.wait{background:rgba(240,180,41,.18);color:#FFD77A;border-color:rgba(255,215,122,.4)}
.qpill.cf{background:rgba(96,140,255,.22);color:#B9CCFF;border-color:rgba(185,204,255,.4)}
.qv-c{position:relative;font-size:22px;font-weight:900;letter-spacing:-.03em;line-height:1.25;margin-top:10px;word-break:break-word}
.qv-s{position:relative;font-size:13.5px;font-weight:600;color:#C9D6F2;line-height:1.5;margin-top:5px;word-break:keep-all}
.qv-amt{position:relative;margin-top:16px;padding:14px 15px 13px;border-radius:14px;
  background:linear-gradient(158deg,rgba(255,255,255,.14),rgba(255,255,255,.05) 55%,rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 14px 26px -18px rgba(4,12,26,.9)}
.qv-ak{font-size:12px;font-weight:800;color:#AFC2EC}
.qv-av{font-size:36px;font-weight:900;letter-spacing:-.04em;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.qv-av i{font-style:normal;font-size:16px;font-weight:800;color:#E3C98A;margin-right:5px;letter-spacing:0}
.qv-sv{display:flex;align-items:center;flex-wrap:wrap;gap:6px 9px;margin-top:9px;font-size:12.5px;font-weight:700}
.qv-sv s{color:#8FA3CF;font-variant-numeric:tabular-nums}
.qv-sv b{background:#E3C98A;color:#3A2A05;border-radius:999px;padding:3px 10px;font-weight:900;font-size:12px;white-space:nowrap}
.qv-acn{margin-top:8px;font-size:12px;color:#FFD77A;font-weight:700;line-height:1.5}
.qv-m{position:relative;display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:10px;margin-top:14px}
.qv-m .k{font-size:11px;font-weight:700;color:#93A8D6}
.qv-m .v{font-size:13px;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.qv-vd{position:relative;margin-top:13px}
.qv-vd .tr{height:5px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}
.qv-vd .fl{height:100%;border-radius:5px;background:linear-gradient(90deg,#E3C98A,#C9A44C)}
.qv-vd.exp .fl{background:#E5484D}
.qv-vd .tx{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:11.5px;font-weight:700;color:#AFC2EC}
.qv-vd .tx b{color:#fff;font-weight:900}
.qv-vd.exp .tx b{color:#FFB4B6}

/* ── 만료 안내 ── */
.qv-exp{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:14px 15px;margin-bottom:14px;box-shadow:var(--e1)}
.qv-exp .t{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--ink2);line-height:1.5}
.qv-exp .t b{display:block;color:var(--red);font-size:14.5px;font-weight:900;margin-bottom:1px}
.qv-exp a{flex:none;background:var(--n);color:#fff;text-decoration:none;font-size:13px;font-weight:900;border-radius:12px;padding:11px 13px;white-space:nowrap}

/* ── 공통 카드 ── */
.card{background:#fff;border-radius:16px;margin-bottom:14px;overflow:hidden;box-shadow:var(--e1)}
.chd{display:flex;align-items:baseline;gap:8px;padding:16px 16px 4px;font-size:16px;font-weight:900;letter-spacing:-.025em}
.chd small{font-size:12px;font-weight:700;color:var(--ink3);letter-spacing:0}
.chd .r{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink3)}

/* ── 금액 구성 ── */
.abody{padding:10px 16px 6px}
.qv-bar{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--soft);gap:2px;margin:4px 0 12px}
.qv-bar i{display:block;height:100%;min-width:6px}
.qv-bar i.pend{background:repeating-linear-gradient(135deg,#EFE4C7 0 5px,#F8F1DF 5px 10px)}
.brk-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;font-size:14.5px;color:var(--ink);font-weight:700;border-top:1px solid #EEF1F6}
.brk-row:first-child{border-top:0}
.brk-row .bl{min-width:0;display:flex;align-items:center;gap:9px}
.brk-row .dot{width:10px;height:10px;border-radius:3px;flex:none}
.brk-row .bname{word-break:keep-all}
.brk-row .pct{font-size:11.5px;font-weight:700;color:var(--ink3);margin-left:2px;font-variant-numeric:tabular-nums}
.brk-row .bnum{font-size:11px;font-weight:800;color:var(--ink3);flex-shrink:0}
.brk-row .bqty{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.brk-row .bv{font-weight:900;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.brk-row .bv .was{display:block;font-size:11px;font-weight:600;color:var(--ink3);text-decoration:line-through}
.brk-row.sub{border-top:0;padding:3px 0 6px 19px;font-size:13px}
.brk-row.sub .bname{color:var(--ink2);font-weight:600}
.brk-row.sub .bv{color:var(--ink2);font-weight:700}
.brk-row.pend .bname,.brk-row.pend .bv{color:#A6801F;font-weight:700}
.brk-row.dc .bname,.brk-row.dc .bv{color:var(--ok)}
.qtot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:6px 10px 10px;padding:14px 14px;border-radius:13px;
  background:linear-gradient(140deg,#0E2350,#16346E);color:#fff;box-shadow:0 10px 20px -12px rgba(6,18,45,.8)}
.qtot .k{font-size:13.5px;font-weight:800;color:#C9D6F2}
.qtot .v{font-size:22px;font-weight:900;letter-spacing:-.035em;font-variant-numeric:tabular-nums;white-space:nowrap}
.qtot .v i{font-style:normal;font-size:13px;color:#E3C98A;margin-right:4px}

/* ── 상세 내역 (한 카드 안 구분별 묶음) ── */
.qsec{padding:6px 16px 4px}
.qsec+.qsec{border-top:8px solid #F3F5F9}
.qsec .sh{display:flex;align-items:center;gap:9px;padding:10px 0 6px}
.qsec .sh .ic{width:30px;height:30px;border-radius:9px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:14px;flex:none}
.qsec .sh b{font-size:15px;font-weight:900;letter-spacing:-.02em}
.qsec .sh .ssum{margin-left:auto;font-size:15px;font-weight:900;color:var(--n);text-align:right;font-variant-numeric:tabular-nums}
.sh .ssum .was{display:block;font-size:11px;font-weight:600;color:var(--ink3);text-decoration:line-through}
.qtbl{width:100%;border-collapse:collapse;font-size:14px}
.qtbl td{padding:11px 0;border-top:1px solid #EEF1F6;vertical-align:top;font-weight:700;line-height:1.45}
.qtbl td.r{text-align:right;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;padding-left:12px}
.qtbl td .note{display:block;font-size:12px;color:var(--ink3);margin-top:3px;font-weight:600;line-height:1.5}
.qtbl td .memo{display:block;font-size:12.5px;color:var(--ink2);margin-top:7px;font-weight:600;line-height:1.55;background:var(--soft);border-radius:9px;padding:7px 10px;word-break:keep-all}
.qtbl td.r .was{display:block;font-size:11px;font-weight:600;color:var(--ink3);text-decoration:line-through}

/* ── 에어컨 모델 선택 ── */
.acsel{background:#fff;border-radius:16px;overflow:hidden;margin-bottom:14px;box-shadow:0 0 0 1.5px rgba(37,99,235,.55),0 12px 26px -12px rgba(37,99,235,.45)}
.acsel.ok{box-shadow:0 0 0 1.5px rgba(14,155,99,.45),var(--e1)}
.acsel .ahd2{background:linear-gradient(180deg,#F1F6FF,#EAF1FF);padding:13px 16px;display:flex;align-items:center;gap:8px}
.acsel.ok .ahd2{background:linear-gradient(180deg,#F1FBF6,#E9F8F0)}
.acsel .ahd2 b{font-size:14.5px;font-weight:900;color:#173A8C;letter-spacing:-.02em}
.acsel.ok .ahd2 b{color:#0A6B43}
.acsel .ahd2 span{margin-left:auto;font-size:11px;color:var(--bl);background:#fff;border-radius:999px;padding:4px 10px;font-weight:900;white-space:nowrap;box-shadow:0 1px 2px rgba(14,35,80,.08)}
.acsel.ok .ahd2 span{color:var(--ok)}
.opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid #F0F3F8;cursor:pointer;transition:background .14s}
.opt:active{background:#F4F8FF}
.opt .rad{width:22px;height:22px;border-radius:50%;border:2px solid #C4CCDE;flex-shrink:0;position:relative;transition:border-color .14s}
.opt.on{background:#F6F9FF}
.opt.on .rad{border-color:var(--bl)}
.opt.on .rad:after{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--bl)}
.acsel.ok .opt.on{background:#fff}
.acsel.ok .opt.on .rad{border-color:var(--ok)}
.acsel.ok .opt.on .rad:after{background:var(--ok)}
.opt .oi{flex:1;min-width:0}
.opt .oi .bn2{font-size:15px;font-weight:900;letter-spacing:-.01em}
.opt .oi .bn2 .tag{display:inline-block;font-size:10px;font-weight:900;padding:2px 7px;border-radius:999px;margin-left:6px;vertical-align:2px}
.opt .oi .bn2 .tag.inv{background:#E0F2FE;color:#0369A1}
.opt .oi .bn2 .tag.non{background:#F0F2F8;color:#5A6478}
.opt .oi .bn2 .tag.rec{background:#FBF1D9;color:#8A6D1F}
.opt .oi .sub2{font-size:12.5px;color:var(--ink3);margin-top:3px;font-weight:600}
.opt .op{font-size:16px;font-weight:900;color:var(--ink);white-space:nowrap;font-variant-numeric:tabular-nums}
.opt.on .op{color:var(--bl)}
.acsel.ok .opt.on .op{color:var(--ink)}
.opt.none .bn2{color:var(--ink2);font-weight:700}
.confirmbar{background:#F4F8FF;padding:12px 16px;display:flex;align-items:center;gap:10px;border-top:1px solid #E1EAFB}
.confirmbar .msg{flex:1;font-size:12.5px;color:#3B57B4;line-height:1.55;font-weight:700}
.confirmbar .cb{background:linear-gradient(140deg,#2563EB,#1740B8);color:#fff;font-size:13.5px;font-weight:900;
  padding:12px 15px;border-radius:13px;white-space:nowrap;border:none;font-family:inherit;cursor:pointer;
  box-shadow:0 6px 14px -6px rgba(37,99,235,.7);transition:transform .14s}
.confirmbar .cb:active{transform:scale(.96)}
.confirmbar .cb:disabled{opacity:.45;box-shadow:none}
.confirmbar.done{background:#F1FBF6;border-top-color:#D5F0E2}
.confirmbar.done .msg{color:#0A7A4A}
.confirmbar.done .cb{background:#fff;color:var(--n);box-shadow:0 0 0 1.5px #D5DEEC}

/* ── 안내사항 ── */
.notice{padding:4px 16px 12px}
.notice p{font-size:13.5px;color:var(--ink2);line-height:1.65;padding:9px 0 9px 22px;position:relative;font-weight:600;border-top:1px solid #EEF1F6}
.notice p:first-child{border-top:0}
.notice p:before{content:'';position:absolute;left:4px;top:16px;width:7px;height:7px;border-radius:50%;background:var(--c3)}

/* ── 연락처 ── */
.ft{display:flex;gap:12px;align-items:center;padding:15px 16px}
.ft .fi{width:42px;height:42px;border-radius:12px;background:var(--n);color:#E3C98A;flex:none;display:flex;align-items:center;justify-content:center}
.ft .ft0{flex:1;min-width:0}
.ft .ft1{font-size:14px;font-weight:900;letter-spacing:-.01em}
.ft .ft2{font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:2px}
.ft-b{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 16px}
.ft-b a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:13px;font-size:14px;font-weight:900;text-decoration:none;transition:transform .14s}
.ft-b a:active{transform:scale(.97)}
.ft-b .tel{background:var(--soft);color:var(--n)}
.ft-b .wa{background:#E7F7EE;color:#0A7A4A}

/* ── 하단 버튼바 ── */
#qa-bar{position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:520px;margin:0 auto;display:flex;gap:9px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-top:1px solid #E4E9F2;box-shadow:0 -14px 30px -16px rgba(14,35,80,.45)}
#qa-bar button,#qa-bar a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;text-decoration:none;
  font-size:15px;font-weight:900;border-radius:13px;min-height:50px;padding:0 8px;cursor:pointer;border:0;
  background:var(--soft);color:var(--n);transition:transform .14s}
#qa-bar .prim{background:linear-gradient(140deg,#0E2350,#1A3C80);color:#fff;box-shadow:0 8px 18px -8px rgba(6,18,45,.8)}
#qa-bar button:active,#qa-bar a:active{transform:scale(.97)}

/* ── 로딩 · 오류 ── */
.center{display:flex;align-items:center;justify-content:center;min-height:70vh;flex-direction:column;gap:12px;
  color:var(--ink2);font-size:14px;padding:20px;text-align:center;font-weight:700}
.spin{width:26px;height:26px;border:3px solid #C4CCDE;border-top-color:var(--bl);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

@media print{
  body{background:#fff}
  #qa-top,#qa-bar,.confirmbar{display:none!important}
  .qa{max-width:100%;padding:0}
  .card,.qsec,.acsel,.hero,.notice{box-shadow:none;break-inside:avoid;page-break-inside:avoid}
  .qv-act{display:none!important}
}
/* ── 데스크탑 (넓은 화면): 왼쪽 요약 고정 + 오른쪽 상세 2단 ── */
.qv-act{display:none}
@media (min-width:960px){
  body{font-size:15px}
  #qa-top{padding-left:max(24px,calc(50% - 540px));padding-right:max(24px,calc(50% - 540px))}
  #qa-top .ti{font-size:17px}
  .qa{max-width:1128px;padding:8px 24px 48px}
  .brand{padding:22px 2px 18px}
  .qv-cols{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:24px;align-items:start}
  .hero{padding:24px 24px 20px}
  .qv-c{font-size:26px}
  .qv-av{font-size:44px}
  .qv-act{display:flex;gap:10px}
  .qv-act button,.qv-act a{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;text-decoration:none;
    font-size:15px;font-weight:900;border-radius:13px;min-height:50px;padding:0 10px;cursor:pointer;border:0;background:#fff;color:var(--n);box-shadow:var(--e1);transition:transform .14s,box-shadow .14s}
  .qv-act .prim{background:linear-gradient(140deg,#0E2350,#1A3C80);color:#fff;box-shadow:0 8px 18px -8px rgba(6,18,45,.8)}
  .qv-act button:hover,.qv-act a:hover{transform:translateY(-1px)}
  #qa-bar{display:none}
  .opt:hover{background:#F8FAFF}
  .ft-b a:hover{filter:brightness(.97)}
}
@media (prefers-reduced-motion:reduce){
  .qv-act button,.qv-act a{transition:none}
  .opt,.opt .rad,.confirmbar .cb,.ft-b a,#qa-bar button,#qa-bar a{transition:none}
  .opt{page-break-inside:avoid}
}

//  snap.exists() / snap.data() 모양은 예전 그대로라 아래 코드는 바뀌지 않습니다.
function apiDoc(t,id,_try){
  _try=_try||0;
  return fetch('/api/doc?t='+t+'&id='+encodeURIComponent(id),{cache:'no-store'}).then(function(r){
    return r.json().catch(function(){return null;}).then(function(j){
      if(r.status===404||(j&&j.error==='not-found'))return {exists:function(){return false;},data:function(){return null;}};
      if(!r.ok||!j||!j.ok){
        // 서버 쪽 일시 오류(5xx)는 0.8초 뒤 최대 2번 더 시도합니다
        if(r.status>=500&&_try<2)return new Promise(function(res){setTimeout(res,800);}).then(function(){return apiDoc(t,id,_try+1);});
        throw new Error((j&&j.error)||('http '+r.status));
      }
      var d=j.doc||{};delete d.__id;
      return {exists:function(){return true;},data:function(){return d;},extra:j};
    });
  },function(e){ if(_try<2)return new Promise(function(res){setTimeout(res,800);}).then(function(){return apiDoc(t,id,_try+1);}); throw e; });
}

var _SEK=Object.keys(SUBJ_EN).sort(function(a,b){return b.length-a.length;});
function subjEn(txt){
  var t=String(txt||'');
  if(!/[\uAC00-\uD7A3]/.test(t))return t;
  for(var i=0;i<_SEK.length;i++){if(t.indexOf(_SEK[i])>=0)t=t.split(_SEK[i]).join(' '+SUBJ_EN[_SEK[i]]+' ');}   // 붙여 쓴 말도 띄어서 (교체수리 → replacement repair)
  t=t.replace(/\(\s+/g,'(').replace(/\s+\)/g,')');
  t=t.replace(/(\d+)\s*\uB300(?![\uAC00-\uD7A3])/g,function(m,q){return q+(q==='1'?' unit':' units');});
  t=t.replace(/(\d+)\s*\uAC1C(?![\uAC00-\uD7A3])/g,function(m,q){return q+(q==='1'?' item':' items');});
  t=t.replace(/\s{2,}/g,' ').trim();
  // 사전으로 다 바꾸지 못해 한글이 섞여 남으면(반쪽 번역) 원문을 그대로 보여 줍니다
  return /[\uAC00-\uD7A3]/.test(t)?String(txt||''):t;
}

function rtTranslate(ko){
  if(_rtAsk[ko])return;_rtAsk[ko]=1;
  fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=en&dt=t&q='+encodeURIComponent(ko))

function enOf(ko,manual,auto){
  ko=String(ko||'').trim();
  if(!KO_RE.test(ko))return ko;
  if(manual&&String(manual).trim())return String(manual).trim();
  if(NOTICE_EN[ko])return NOTICE_EN[ko];
  if(auto&&String(auto).trim()&&!KO_RE.test(auto))return String(auto).trim();
  var d=subjEn(ko);if(!KO_RE.test(d))return d;
  if(_rtEn[ko])return _rtEn[ko];
  rtTranslate(ko);
  return ko;
}

  const v=(lang==='en')?(g.formEn||''):(g.formKo||'');
  if(v)return v;
  const M={wall:[t.wall,t.wall],cassette:['천정형 (카세트)','Ceiling Cassette'],duct:['매립형 (덕트)','Ducted']};
  const e=M[g.form||'wall'];
  return e?(lang==='en'?e[1]:e[0]):t.wall;
}
function groupSel(i){
  // 그룹 i의 선택 결과 {key,label,price,qty,amount} (미선택/구입없음 → price 0)
  const g=acGroups[i];const key=selArr[i];
  if(!g||!key||key==='__none__')return {key:key||null,label:null,price:0,qty:g?g.qty||1:1,amount:0};
  const o=groupOpt(g,key);
  if(!o)return {key:key,label:null,price:0,qty:g.qty||1,amount:0};
  const qty=g.qty||1;
  return {key:key,label:o.brand+' '+(o.type==='inv'?'INVERTER':'NON-INV'),price:o.price,qty:qty,amount:o.price*qty};
}
function acTotal(){
  let t=0;acGroups.forEach((g,i)=>{t+=groupSel(i).amount;});
  return t;
}
function acSummary(){
  const parts=[];
  acGroups.forEach((g,i)=>{
    const s=groupSel(i);
    if(s.label)parts.push(s.label+(s.qty>1?'×'+s.qty:''));
  });
  return parts.join(' + ');
}
function allChosen(){
  // 모든 그룹이 선택(또는 구입없음)되어야 확정 가능
  return acGroups.every((g,i)=>!!selArr[i]);
}

      acHtml+
      (secHtml?'<div class="card"><div class="chd">'+(isEn?'Details':'상세 내역')+'<small>'+itemN+(isEn?(itemN===1?' item':' items'):'개 항목')+'</small></div>'+secHtml+'</div>':'')+
      (nts.length?'<div class="card"><div class="chd">'+(isEn?'Terms & Notes':'안내사항')+'</div><div class="notice">'+nts.map(n=>'<p>'+esc(n)+'</p>').join('')+'</div></div>':'')+
      '<div class="card"><div class="ft"><div class="fi"><svg class="hhc-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g fill="currentColor"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg></div><div class="ft0">'+
        '<div class="ft1">'+(isEn?'Questions about this quote?':'견적 내용이 궁금하신가요?')+'</div>'+
        '<div class="ft2">+60 17-247 2774</div></div></div>'+
        '<div class="ft-b"><a class="tel" href="tel:+60172472774">📞 '+(isEn?'Call':'전화')+'</a><a class="wa" href="'+waUrl+'" target="_blank" rel="noopener">💬 WhatsApp</a></div></div>'+
      '</div></div>'+
    '</div>'+
    '<div id="qa-bar"><button onclick="window.print()">'+t.pdf+'</button>'+
      '<a class="prim" href="'+waUrl+'" target="_blank" rel="noopener">💬 '+(isEn?'Ask on WhatsApp':'WhatsApp 문의')+'</a></div>';

  // 이벤트
  document.getElementById('lk').onclick=()=>{lang='ko';render();};
  document.getElementById('le').onclick=()=>{lang='en';render();};
  document.querySelectorAll('.opt').forEach(o=>{
    if(!o.dataset.k)return; // 컴팩트(확정 표시) 행은 클릭 불가
    o.addEventListener('click',()=>{
      selArr[parseInt(o.dataset.g,10)]=o.dataset.k;
      render();
    });
  });
  const cbtn=document.getElementById('confirm-btn');
  if(cbtn)cbtn.onclick=confirmChoice;
  const chbtn=document.getElementById('change-btn');
  if(chbtn)chbtn.onclick=()=>{acEditing=true;render();};
  try{window.HDOC&&HDOC.refresh();}catch(e){}
}

// ══ 인쇄 · PDF 문서 양식 (A4) ═══════════════════════════════════
// 화면(앱 카드)은 그대로 두고, 인쇄·PDF 저장·PDF 공유 때만 이 양식으로 바뀝니다.
function buildQuoteDoc(){
  if(!Q||!window.HDOC)return '';
  const H=window.HDOC,e=esc,isEn=lang==='en';
  const L=(ko,en)=>isEn?en:ko;
  // 금액: 소수가 있으면 두 자리까지 (337.5 → 337.50)
  const fm=n=>{n=Math.round((Number(n)||0)*100)/100;return Number.isInteger(n)?fmtN(n):n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
  const RM=n=>'RM '+fm(n);
  const expired=Q.validUntil&&Q.validUntil<new Date().toISOString().slice(0,10);
  const acOn=acGroups.length>0;
  const SM={base:[ '기본 인건비','Basic Labor'],extra:['추가 인건비','Additional Labor'],material:['자재 비용','Materials'],etc:['기타 비용','Other Costs']};
  const sectOf=it=>{
    if(it.sect&&SM[it.sect])return it.sect;
    if(it.group==='material')return 'material';
    if(it.group==='install'||it.group==='repair'||it.group==='clean')return 'base';
    return 'etc';
  };
  const gross=it=>(parseFloat(it.qty)||1)*(parseFloat(it.price)||0);
  const dAmt=it=>{const dv=parseFloat(it.discVal)||0;if(dv<=0)return 0;const g=gross(it);return it.discType==='amt'?Math.min(dv,g):g*Math.min(dv,100)/100;};
  const net=it=>(it.amount!=null?it.amount:Math.max(0,gross(it)-dAmt(it)))||0;
  const items=Q.items||[];
  const hasDisc=items.some(it=>dAmt(it)>0);
  const cols=[{h:L('항목','Description')},{h:L('수량','Qty'),c:'c',w:'72px'},{h:L('단가','Unit Price'),c:'r',w:'88px'}]
    .concat(hasDisc?[{h:L('할인','Discount'),c:'r',w:'76px'}]:[]).concat([{h:L('금액','Amount'),c:'r',w:'92px'}]);
  const rows=[],sectSum={},sectGross={};
  ['base','extra','material','etc'].forEach(k=>{
    const list=items.filter(it=>sectOf(it)===k);
    if(!list.length)return;
    const s=list.reduce((a,it)=>a+net(it),0);sectSum[k]=s;sectGross[k]=list.reduce((a,it)=>a+gross(it),0);
    rows.push({g:L(SM[k][0],SM[k][1]),r:RM(s)});
    list.forEach(it=>{
      const nm=isEn?enOf(it.name,(it.nameEn&&!KO_RE.test(it.nameEn))?it.nameEn:'',it.nameEnAuto):it.name;
      const nt=isEn?enOf(it.note||'',(it.noteEn&&!KO_RE.test(it.noteEn))?it.noteEn:'',it.noteEnAuto):(it.note||'');
      const un=it.unit?(isEn?unitEn(it.unit,it.qty):it.unit):'';
      const da=dAmt(it);
      const r=['<span class="nm">'+e(nm||'—')+'</span>'+(nt?'<span class="sb">'+e(nt)+'</span>':''),
        e(String(it.qty||1)+(un?' '+un:'')),fm(it.price||0)];
      if(hasDisc)r.push(da>0?'<span class="dc">− '+(it.discType==='amt'?fm(da):fm(it.discVal)+'%')+'</span>':'<span class="mu">—</span>');
      r.push('<b>'+fm(net(it))+'</b>');
      rows.push(r);
    });
  });
  // 에어컨 구입 (모델 선택형)
  let acBlock='';const acSel=acTotal();
  if(acOn){
    const ar=[];
    acGroups.forEach((g,i)=>{
      const qty=g.qty||1,sel=selArr[i];
      ar.push({g:(acGroups.length>1?(i+1)+'. ':'')+e(g.hp)+'HP '+e(acFormLb(g))+(qty>1?' × '+qty+L('대',' units'):''),
        r:sel?(sel==='__none__'?L('구입 없음','No purchase'):RM(groupSel(i).amount)):L('선택 대기','Pending')});
      (g.options||[]).forEach(o=>{
        const key=o.key||o.brand+'|'+o.type,on=sel===key;
        const tag=(o.type==='inv'?'INVERTER':'NON-INVERTER')+((g.recommended||'')===key?' · '+L('추천','Recommended'):'');
        const r={cls:on?'':'off',c:['<span class="ck">'+(on?'✓':'')+'</span><span class="nm">'+e(o.brand||'')+'</span><span class="sb" style="display:inline;margin-left:6px">'+tag+'</span>',
          String(qty),fm(o.price||0)]};
        if(hasDisc)r.c.push('');
        r.c.push(on?'<b>'+fm((o.price||0)*qty)+'</b>':'<span class="mu">'+fm((o.price||0)*qty)+'</span>');
        ar.push(r);
      });
    });
    acBlock=H.sec(L('에어컨 구입 — 모델 선택','AC Unit Purchase — Model Options'),
      L('✓ 표시 모델 기준으로 합계가 계산됩니다','Total is based on the ✓ selected model'),H.table(cols,ar));
  }
  // 합계
  // 구분별 소계는 표 안에 이미 있으므로 여기서는 반복하지 않습니다
  const sr=[];
  const disc=Q.discount||0;
  const itemsNet=Object.keys(sectSum).reduce((a,k)=>a+sectSum[k],0);
  if(acOn||disc>0){
    sr.push([L('작업 · 자재 소계','Work & Materials'),fm(itemsNet)]);
    if(acOn)sr.push([L('에어컨 구입','AC Unit'),acSel?fm(acSel):'—']);
  }
  if(disc>0)sr.push([L('할인','Discount'),'− '+fm(disc),'m']);
  const itemDisc=Object.keys(sectGross).reduce((a,k)=>a+Math.max(0,sectGross[k]-sectSum[k]),0);
  const totDisc=itemDisc+disc;
  const finalTotal=(Q.baseTotal||0)+acSel;
  const after=totDisc>0.004?'<div class="hx-sv"><span>'+L('총 할인금액','Total Savings')+'</span><span>− '+RM(totDisc)+'</span></div>':'';
  const sumBlock=H.sums(sr,[L('최종 견적금액','TOTAL (MYR)'),RM(finalTotal)],after);
  // 안내사항 · 유효기한
  const nts=noticesOf(Q,isEn);
  const validTx=expired?L('본 견적서는 유효기간이 지났습니다. 최신 견적은 아래 연락처로 문의해 주세요.','This quotation has expired. Please contact us for an updated quotation.')
    :L('발행일로부터 '+(Q.validDays||7)+'일간 유효합니다 ('+(Q.validUntil||'')+' 까지).','Valid for '+(Q.validDays||7)+' days from the issue date (until '+(Q.validUntil||'')+').');
  const noteBlock=H.notes([
    nts.length?{t:L('안내사항','Terms & Notes'),x:H.list(nts.map(n=>e(n))),cls:'w'}:null,
    {t:L('유효기한','Validity'),x:e(validTx)},
    {t:L('문의 · 예약','Enquiry & Booking'),x:'WhatsApp / Tel +60 17-247 2774<br>happyhomecare.com.my',cls:'g'}
  ]);
  const st=expired?['bad',L('유효기간 만료','Expired')]:((acOn&&Q.customerChoice)?['ok',L('선택 확정','Confirmed')]:['info',L('유효','Valid')]);
  return H.doc({
    word:'QUOTATION',wordSub:L('견적서','Service Quotation'),
    meta:[[L('견적번호','Quote No.'),e(Q.qno||'—')],[L('발행일','Issued'),e(Q.issueDate||'—')],
          [L('유효기한','Valid Until'),e(Q.validUntil||'—')],[L('상태','Status'),'<span class="hx-st '+st[0]+'">'+st[1]+'</span>']],
    parties:[{l:L('고객','Prepared For'),n:e(Q.client||'—'),d:[Q.subject?(L('대상 작업 : ','Subject: ')+e(subjOf(Q,isEn))):'']},
             {l:L('발행','From'),n:'HAPPY WORKS SERVICES SDN. BHD.',d:['Tel +60 17-247 2774','129 BJ Jayaone, 46200 Petaling Jaya, Selangor']}],
    blocks:[items.length?H.sec(L('견적 내역','Quotation Details'),'',H.table(cols,rows)):'',acBlock,sumBlock,noteBlock],
    sign:[{l:L('고객 확인 (서명 / 날짜)','Customer Acceptance (Signature / Date)')},{l:L('발행처','Issued by'),n:'Happy Home Care'}],
    thanks:L('감사합니다','Thank you')
  });
}
window.HDOC_BUILD=buildQuoteDoc;

async function confirmChoice(){
  if(!allChosen())return;
  const t=T[lang];
  const btn=document.getElementById('confirm-btn');
  btn.disabled=true;btn.textContent=t.confirming;
  const selections=acGroups.map((g,i)=>{
    const s=groupSel(i);
    return {key:selArr[i],hp:g.hp,qty:g.qty||1,label:s.label||(lang==='en'?'No AC purchase':'에어컨 구입 없음'),price:s.price,amount:s.amount};
  });
  const summary=acSummary()||(lang==='en'?'No AC purchase':'에어컨 구입 없음');
  // label/price는 관리자 목록 호환용 (합계 요약)
  const choice={selections:selections,label:summary,price:acTotal(),at:new Date().toISOString()};
  try{
    // (2026-11-09) 고객 선택은 서버 창구 /api/quote 로 저장
    await fetch('/api/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:quoteId,choice:choice})})
      .then(r=>r.json().then(j=>{if(!r.ok||!j||!j.ok)throw new Error((j&&j.error)||('http '+r.status));}));
    Q.customerChoice=choice;
    acEditing=false;
    render();
    // 관리자 이메일 알림 (의뢰/예약과 동일한 EmailJS 템플릿 재사용) — 실패해도 확정은 유지
    try{
      if(window.emailjs){
        const circ=['①','②','③','④','⑤','⑥','⑦','⑧','⑨'];
        const lines=selections.map((s,i)=>
          (selections.length>1?(circ[i]||(i+1))+' ':'')+s.hp+'HP'+(s.qty>1?'×'+s.qty+'대':'')+' : '+s.label+(s.amount>0?' — RM '+s.amount.toLocaleString('en-US'):''));
        const finalAmt=(Q.baseTotal||0)+acTotal();
        await emailjs.send('service_wf4f4eg','template_mu63ahr',{
          customer_name:Q.client||'—',
          customer_phone:Q.phone||'—',
          customer_address:Q.subject||'—',
          booking_date:'[견적서 에어컨 선택 확정 / Quotation AC Confirmed]',
          booking_time:'견적번호 '+(Q.qno||quoteId),
          booking_items:lines.join('\n'),
          booking_memo:'최종 견적금액: RM '+finalAmt.toLocaleString('en-US')+' (기본 '+(Q.baseTotal||0).toLocaleString('en-US')+' + 에어컨 '+acTotal().toLocaleString('en-US')+')',
          submitted_at:new Date().toLocaleString('ko-KR')
        },'O99J6X4SGYUPMfGQy');
        console.log('관리자 알림 이메일 발송 완료');
      }
    }catch(mailErr){console.warn('알림 이메일 발송 실패 (확정은 저장됨):',mailErr);}
  }catch(e){
    btn.disabled=false;btn.textContent=t.confirm;
    alert((lang==='en'?'Failed to send selection: ':'선택 전달 실패: ')+e.message);
  }
}
