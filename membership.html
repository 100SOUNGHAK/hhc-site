<style>

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Noto Sans KR',sans-serif;color:#161d27;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 60% at 100% 0,rgba(201,164,76,.16),transparent 60%),radial-gradient(90% 50% at 0 100%,rgba(15,118,110,.08),transparent 60%),#faf7f0;min-height:100vh;min-height:100dvh}
.mc{max-width:1000px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:16px}
.mc-top{display:flex;align-items:center;gap:10px}
.mc-top .lg{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#173a5e,#0f2540);color:#e3c98a;
  box-shadow:0 1px 2px rgba(8,23,43,.15),0 8px 16px -8px rgba(8,23,43,.5)}
.mc-top .lg svg{width:22px;height:22px}
.mc-top .nm{flex:1;min-width:0;font-size:16px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.mc-top .nm small{display:block;font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#8891a0;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-lang{display:flex;padding:3px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 1px #e8e2d4}
.mc-lang button{border:0;background:none;font-family:inherit;font-size:12px;font-weight:800;color:#8891a0;padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.mc-lang button.on{background:#0f2540;color:#fff}
.mc-acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.mc-acts a,.mc-acts button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:12px 6px;border-radius:16px;border:0;cursor:pointer;
  font-family:inherit;font-size:13px;font-weight:800;color:#0f2540;text-decoration:none;text-align:center;background:#fff;
  box-shadow:0 1px 2px rgba(8,23,43,.08),0 8px 18px -10px rgba(8,23,43,.3);transition:transform .14s ease}
.mc-acts a:active,.mc-acts button:active{transform:translateY(2px)}
.mc-acts .i{font-size:22px;line-height:1}
.mc-acts .wa{background:linear-gradient(145deg,#2ee06a,#1eb055);color:#fff}
.mc-foot{margin-top:4px;text-align:center;font-size:11px;line-height:1.7;color:#8891a0;font-weight:600}
.mc-foot b{display:block;color:#4d5866;font-size:11.5px;letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){.mc-acts a,.mc-acts button{transition:none}}

/* 팝업 · 배너 (홈페이지 요금표 · 멤버십과 같은 모양) */
/* ═══ HHC 서비스 요금표 (pt-) — 배너 → 품목 → 서비스별 가격 ═══ */
.pt-root{--pn:#0f2540;--pn9:#08172b;--pt7:#0b5f59;--pt6:#0f766e;--pg5:#c9a44c;--pg3:#e3c98a;--pg1:#f4e7c4;--pg05:#fbf5e6;
  --pink:#161d27;--pink6:#4d5866;--pink4:#8891a0;--pline:#ece6d8;--ppaper:#fdfcf9;--pr:#c0392b;
  --pe1:0 1px 2px rgba(8,23,43,.10),0 6px 14px -6px rgba(8,23,43,.28);
  --pe2:0 1px 2px rgba(8,23,43,.12),0 10px 22px -8px rgba(8,23,43,.38),0 30px 60px -24px rgba(8,23,43,.55);
  position:relative;color:var(--pink);font-variant-numeric:tabular-nums;scroll-margin-top:90px}
.pt-root *{box-sizing:border-box}
.pt-root button{font-family:inherit}
.pt-stage{animation:ptIn .22s cubic-bezier(.22,.61,.36,1)}
@keyframes ptIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ① 첫 화면 배너 */
.pt-ban{position:relative;display:grid;grid-template-columns:1.1fr .9fr;width:100%;min-height:340px;border:0;padding:0;text-align:left;cursor:pointer;
  border-radius:26px;overflow:hidden;background:var(--pn9);color:#fff;box-shadow:var(--pe2);transition:transform .16s ease,box-shadow .16s ease}
.pt-ban:active{transform:translateY(2px) scale(.996)}
.pt-ban .ph{position:relative;order:2;background-size:cover;background-position:center 28%;min-height:240px}
.pt-ban .ph:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--pn9) 0%,rgba(8,23,43,.55) 30%,rgba(8,23,43,0) 65%)}
.pt-ban .tx{position:relative;z-index:1;padding:34px 30px 30px 34px;display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(120% 100% at 0 0,rgba(201,164,76,.16),transparent 55%),linear-gradient(160deg,#0f2540,#08172b 70%)}
.pt-ban .lb{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;color:var(--pg3);letter-spacing:.02em}
.pt-ban .lb i{width:22px;height:2px;border-radius:2px;background:var(--pg5)}
.pt-ban h3{margin:0;font-family:'Noto Serif KR',serif;font-weight:600;font-size:30px;line-height:1.32;letter-spacing:-.035em;text-wrap:balance}
.pt-ban h3 em{font-style:normal;color:var(--pg3)}
.pt-ban p{margin:0;font-size:14px;line-height:1.65;color:rgba(255,255,255,.72);max-width:34ch}
.pt-ban .pv{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:4px}
.pt-ban .pv span{display:flex;align-items:center;gap:8px;min-width:0;padding:9px 11px;border-radius:13px;
  background:linear-gradient(158deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16)}
.pt-ban .pv span>i{font-style:normal;font-size:16px;flex:none}
.pt-ban .pv span>b{display:block;font-size:12px;font-weight:700;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-ban .pv span>b em{display:block;font-style:normal;font-size:14px;font-weight:800;color:#fff;margin-top:1px}
.pt-ban .go{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;margin-top:6px;padding:14px 20px;border-radius:14px;
  background:linear-gradient(145deg,#e3c98a,#c9a44c 60%,#b08d3a);color:#1d1606;font-size:15px;font-weight:900;
  box-shadow:0 8px 18px -8px rgba(201,164,76,.8)}
.pt-ban .go b{font-size:18px;line-height:1}
.pt-ban .ft{font-size:11.5px;color:rgba(255,255,255,.5);font-weight:600}

/* 🪟 팝업 (품목 · 상세) */
html.pt-lock,html.pt-lock body{overflow:hidden}
.pt-mod{position:fixed;inset:0;z-index:9600;display:none;align-items:center;justify-content:center;padding:24px}
.pt-mod.on{display:flex}
.pt-mbd{position:absolute;inset:0;background:rgba(4,12,26,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.pt-msh{position:relative;display:flex;flex-direction:column;width:min(1120px,100%);height:min(900px,100%);border-radius:26px;overflow:hidden;
  background:linear-gradient(165deg,#08172b,#0f2540 55%,#12314f);box-shadow:0 30px 80px -20px rgba(0,0,0,.7);animation:ptPop .22s cubic-bezier(.22,.61,.36,1)}
@keyframes ptPop{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pt-msh:focus{outline:none}
.pt-mtop{flex:none;display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(8,23,43,.6)}
.pt-mtop .t{flex:1;min-width:0}
.pt-mtop .t b{display:block;font-size:18px;font-weight:800;color:#fff;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-mtop .t span{display:block;font-size:12px;color:rgba(255,255,255,.6);font-weight:600;margin-top:1px}
.pt-mic{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;background:rgba(255,255,255,.08)}
.pt-x{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:12px;cursor:pointer;font-family:inherit;
  border:0;background:#fff;color:#0f2540;font-size:13px;font-weight:900;box-shadow:0 4px 12px -4px rgba(0,0,0,.5)}
.pt-x span{font-size:12px}
.pt-x:active{transform:translateY(1px)}
.pt-x:focus:not(:focus-visible){outline:none}
.pt-mbody{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:20px 22px 28px;scroll-margin-top:0}
.pt-mbody .pt-cta.d{margin-top:4px}
.pt-intro{margin:0 2px 16px;font-size:13.5px;color:rgba(255,255,255,.65);font-weight:600}
@media (max-width:640px){
  .pt-mod{padding:0}
  .pt-msh{width:100%;height:100%;border-radius:0}
  .pt-mtop{padding:calc(10px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px))}
  .pt-mtop .t b{font-size:16.5px}
  .pt-mbody{padding:16px max(14px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
}
@media (prefers-reduced-motion:reduce){.pt-msh{animation:none}}

/* 공통 머리줄 (뒤로 · 제목) */
.pt-hd{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.pt-bk{flex:none;display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 10px;border-radius:12px;cursor:pointer;
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:800}
.pt-bk b{font-size:20px;line-height:1;margin-top:-2px}
.pt-bk:active{transform:translateY(1px)}
.pt-hd .t{min-width:0}
.pt-hd .t b{display:block;font-size:20px;font-weight:800;color:#fff;letter-spacing:-.03em}
.pt-hd .t span{display:block;font-size:12.5px;color:rgba(255,255,255,.6);font-weight:600;margin-top:2px}

/* ② 품목 고르기 */
.pt-grp{margin-top:22px}
.pt-grp:first-of-type{margin-top:0}
.pt-gh{display:flex;align-items:center;gap:10px;margin:0 2px 10px;font-size:13px;font-weight:800;color:var(--pg3)}
.pt-gh i{flex:1;height:1px;background:rgba(255,255,255,.12)}
.pt-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pt-it{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:132px;padding:15px 15px 13px;border:0;border-radius:18px;
  background:var(--ppaper);color:var(--pink);text-align:left;cursor:pointer;box-shadow:var(--pe1);transition:transform .14s ease,box-shadow .14s ease}
.pt-it:active{transform:translateY(2px) scale(.99)}
.pt-it .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:21px;background:var(--pg05);
  box-shadow:inset 0 0 0 1px var(--pg1);margin-bottom:6px}
.pt-it .nm{font-size:15.5px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.pt-it .sb{font-size:11.5px;color:var(--pink4);font-weight:600;line-height:1.45}
.pt-it .pr{margin-top:auto;padding-top:6px;font-size:13px;font-weight:700;color:var(--pink6)}
.pt-it .pr b{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;color:var(--pt7);letter-spacing:-.02em}
.pt-it .ar{position:absolute;right:14px;top:14px;font-size:18px;color:#c7ccd6;font-weight:700}
.pt-it .dc{position:absolute;right:12px;top:13px;font-size:10.5px;font-weight:900;color:#fff;background:var(--pr);border-radius:999px;padding:3px 8px}

/* 한 품목뿐인 묶음 — 넓은 타일 */
.pt-it.wide{grid-column:1/-1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"ic nm" "ic sb" "ty ty";column-gap:14px;align-items:center}
.pt-it.wide .ic{grid-area:ic;margin:0;width:50px;height:50px;font-size:24px}
.pt-it.wide .nm{grid-area:nm;align-self:end;font-size:17px}
.pt-it.wide .sb{grid-area:sb;align-self:start}
.pt-it .tys{grid-area:ty;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:12px}
.pt-it .tys i{font-style:normal;display:flex;flex-direction:column;gap:2px;padding:9px 10px;border-radius:12px;background:#f5f1e6;font-size:12px;font-weight:700;color:var(--pink6);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-it .tys i b{font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700;color:var(--pt7)}
.pt-cta.m{display:none}
/* ③ 품목 상세 */
.pt-det{display:grid;grid-template-columns:.8fr 1.2fr;border-radius:26px;overflow:hidden;background:var(--ppaper);box-shadow:var(--pe2)}
.pt-side{position:relative;padding:28px 26px 24px;color:#fff;display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(110% 80% at 100% 0,rgba(201,164,76,.18),transparent 60%),linear-gradient(165deg,#173a5e,#0f2540 55%,#08172b)}
.pt-side .phx{margin:-28px -26px 4px;height:170px;background-size:cover;background-position:center 35%;position:relative}
.pt-side .phx:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,37,64,0) 35%,#132f4f 100%)}
.pt-side .hic{width:50px;height:50px;border-radius:15px;display:flex;align-items:center;justify-content:center;font-size:25px;
  background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.pt-side h4{margin:0;font-family:'Noto Serif KR',serif;font-weight:600;font-size:26px;letter-spacing:-.03em;line-height:1.25}
.pt-side h4 small{display:block;font-family:inherit;font-size:12px;font-weight:700;color:var(--pg3);letter-spacing:.04em;margin-top:6px}
.pt-side .ds{margin:0;font-size:13.5px;line-height:1.65;color:rgba(255,255,255,.74)}
.pt-side .rg{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:13px 15px;border-radius:15px;
  background:linear-gradient(158deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14)}
.pt-side .rg span{font-size:12px;font-weight:700;color:rgba(255,255,255,.6)}
.pt-side .rg b small{font-family:'Pretendard Variable','Pretendard','Noto Sans KR',sans-serif;font-size:13px;font-weight:700;color:rgba(255,255,255,.7)}
.pt-side .rg b{font-family:'Noto Serif KR',serif;font-size:24px;font-weight:700;color:var(--pg3);letter-spacing:-.02em}
.pt-side .rg i{font-style:normal;font-size:12px;color:rgba(255,255,255,.6);font-weight:600}
.pt-seg{display:flex;padding:4px;border-radius:13px;background:rgba(0,0,0,.22);gap:4px}
.pt-seg button{flex:1;border:0;border-radius:10px;padding:10px 8px;background:none;color:rgba(255,255,255,.7);font-size:13px;font-weight:800;cursor:pointer}
.pt-seg button.on{background:#fff;color:var(--pn);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.pt-cta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;padding-top:6px}
.pt-cta.one{grid-template-columns:1fr}
.pt-cta a{display:flex;align-items:center;justify-content:center;gap:6px;padding:13px 10px;border-radius:13px;font-size:13.5px;font-weight:900;text-decoration:none;text-align:center}
.pt-cta .a1{background:linear-gradient(145deg,#e3c98a,#c9a44c 60%,#b08d3a);color:#1d1606;box-shadow:0 8px 18px -8px rgba(201,164,76,.8)}
.pt-cta .a2{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}

.pt-main{padding:22px 26px 24px;min-width:0}
.pt-types{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:6px;margin-bottom:12px}
.pt-types button{border:1px solid var(--pline);background:#fff;color:var(--pink6);border-radius:12px;padding:10px 4px;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-types button.on{background:var(--pn);border-color:var(--pn);color:#fff;box-shadow:0 6px 14px -6px rgba(15,37,64,.6)}
.pt-cap{display:flex;align-items:baseline;gap:8px;margin:4px 2px 4px;font-size:12.5px;font-weight:700;color:var(--pink4)}
.pt-cap b{font-size:15px;font-weight:800;color:var(--pink)}
.pt-sv{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:0 14px;padding:17px 2px;border-bottom:1px solid var(--pline)}
.pt-sv .pt-tb{grid-column:1/-1}
.pt-sv:last-of-type{border-bottom:0}
.pt-sv .x{flex:1;min-width:0}
.pt-sv .x b{font-size:16px;font-weight:800;letter-spacing:-.025em}
.pt-sv .x .tg{display:inline-block;vertical-align:2px;margin-left:7px;font-size:10.5px;font-weight:900;border-radius:999px;padding:3px 8px;background:var(--pt6);color:#fff}
.pt-sv .x .tg.hot{background:var(--pr)}
.pt-sv .x p{margin:4px 0 0;font-size:13px;line-height:1.55;color:var(--pink6)}

    try{if(!(history.state&&history.state.hhcPk)){history.pushState({hhcPk:1},'');pushed=true;}}catch(e){}
    setTimeout(function(){try{mod.querySelector('.pt-msh').focus({preventScroll:true});}catch(e){}},30);
  }
  function closeMod(fromPop){
    if(!isOn())return;
    mod.classList.remove('on');document.documentElement.classList.remove('pt-lock');
    if(!fromPop&&pushed){pushed=false;try{if(history.state&&history.state.hhcPk)history.back();}catch(e){}}
    pushed=false;
    try{if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});}catch(e){}
  }
  window.addEventListener('popstate',function(){if(isOn())closeMod(true);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&isOn())closeMod(false);});
  function topHTML(){
    var en=S.lang==='en',t=S.stage==='tier'?TIERS[S.i]:null;
    return (t?'<button type="button" class="pt-bk" data-pk="list"><b>‹</b>'+(en?'All tiers':'등급 목록')+'</button>':'<span class="pt-mic">👑</span>')+
      '<div class="t"><b>'+(t?esc(nm(t))+(en?' membership':' 멤버십'):(en?'Happy membership':'해피 멤버십 패키지'))+'</b>'+
      '<span>'+(t?(en?'Benefits by tier':'등급별 혜택 · 이용 한도'):(en?'Tiers & benefits':'등급 · 혜택 · 이용 방법'))+'</span></div>'+
      '<button type="button" class="pt-x" data-pkx="1" aria-label="'+(en?'Close':'닫기')+'"><span>✕</span>'+(en?'Close':'닫기')+'</button>';
  }
  function render(){
    if(root)root.innerHTML=banHTML();
    if(isOn()){
      mod.setAttribute('aria-label',S.lang==='en'?'Happy membership':'해피 멤버십 패키지');
      mTop.innerHTML=topHTML();mBody.innerHTML=S.stage==='tier'?tierHTML():listHTML();
    }
  }
  function go(stage,i){
    S.stage=stage;if(i!=null&&!isNaN(i))S.i=i;
    openMod();render();try{mBody.scrollTop=0;}catch(e){}
  }
  function onClick(e){
    var t=e.target&&e.target.closest?e.target:null;if(!t)return;
    var b=t.closest('[data-pk],[data-pkx]');if(!b)return;
    if(b.hasAttribute('data-pkx')){closeMod(false);return;}
    go(b.getAttribute('data-pk'),b.hasAttribute('data-i')?+b.getAttribute('data-i'):null);
  }
  window.HHCPackage={
    mount:function(el,lang){S.lang=lang==='en'?'en':'ko';root=el;el.addEventListener('click',onClick);render();},
    init:function(lang){S.lang=lang==='en'?'en':'ko';},
    setLang:function(lang){S.lang=lang==='en'?'en':'ko';render();},
    open:function(i){if(i==null)go('list');else go('tier',i);},
    close:function(){closeMod(false);}
  };
})();

</script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var LANG=String(q.get('lang')||'').toLowerCase()==='en'?'en':'ko';
  var T={ko:{wa:'상담하기',tier:'등급 · 혜택 보기',home:'홈페이지',title:'해피 멤버십 패키지 안내 | Happy Home Care',
            msg:'안녕하세요. 해피 멤버십 패키지 상담 원합니다.'},
         en:{wa:'Enquire',tier:'Tiers & benefits',home:'Website',title:'Happy Membership Packages | Happy Home Care',
            msg:'Hello, I would like to ask about the Happy membership package.'}};
  function apply(){
    var t=T[LANG];document.documentElement.lang=LANG;document.title=t.title;
    document.querySelectorAll('[data-t]').forEach(function(e){var k=e.getAttribute('data-t');if(t[k]!=null)e.textContent=t[k];});
    document.querySelectorAll('[data-lg]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-lg')===LANG);});
    document.getElementById('mcWa').href='https://wa.me/60172472774?text='+encodeURIComponent(t.msg);
    document.getElementById('mcHome').href='https://happyhomecare.com.my/home'+(LANG==='en'?'?lang=en':'')+'#membership';
    if(window.HHCPackage)HHCPackage.setLang(LANG);
  }
  HHCPackage.mount(document.getElementById('pkb'),LANG);
  document.getElementById('mcTier').addEventListener('click',function(){HHCPackage.open();});
  document.querySelectorAll('[data-lg]').forEach(function(b){b.addEventListener('click',function(){
    LANG=b.getAttribute('data-lg');
    try{var u=new URL(location.href);if(LANG==='en')u.searchParams.set('lang','en');else u.searchParams.delete('lang');history.replaceState(history.state,'',u.toString());}catch(e){}
    apply();});});
  apply();
})();
</script>

<style>
.hhcbk{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));

</style>
<button type="button" class="hhcbk" id="hhcBackToCard"><i>&#8592;</i><span>명함으로</span></button>
<script>
(function(){
  try{
    var q = new URLSearchParams(location.search);
    var en = String(q.get('lang') || '').toLowerCase() === 'en';
    var fromCard = q.get('from') === 'card' || (document.referrer || '').indexOf('/namecard') > -1;
    if(!fromCard) return;

    var b = document.getElementById('hhcBackToCard');
    if(!b) return;
    b.querySelector('span').textContent = en ? 'Back to card' : '명함으로';
    b.setAttribute('aria-label', en ? 'Back to the digital name card' : '전자명함으로 돌아가기');
    b.classList.add('on');

    /* 화면 아래에 고정된 바(예약 제출 바 등)가 있으면 그만큼 위로 띄운다 */
    function lift(){
      var vh = window.innerHeight, max = 0;
      var els = document.querySelectorAll('body > *, body > * > *');
      for(var i = 0; i < els.length; i++){
        var el = els[i];
        if(el === b) continue;
        var cs = getComputedStyle(el);
        if(cs.position !== 'fixed' || cs.display === 'none' || cs.visibility === 'hidden') continue;
        var r = el.getBoundingClientRect();
        if(r.height > 0 && r.height < 170 && Math.abs(r.bottom - vh) < 6 && r.width > 120){
          if(r.height > max) max = r.height;
        }
      }
      b.style.bottom = 'calc(' + (14 + max) + 'px + env(safe-area-inset-bottom))';
    }
    lift();
    setTimeout(lift, 900);
    window.addEventListener('resize', lift);

    b.addEventListener('click', function(){
      if(history.length > 1){ history.back(); }
      else { location.href = '/namecard' + (en ? '?lang=en' : ''); }
    });
  }catch(e){}
})();
</script>
