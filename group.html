     '<div class="hp-top"><span class="hp-mark">'+mark()+'</span>'+
       '<div class="hp-nm"><b>'+(en?'Happy Home Care':'해피홈케어')+'</b><span>HAPPY WORKS SERVICES SDN. BHD.</span></div>'+
       '<div class="lgb" role="group" aria-label="Language"><button type="button" data-l="ko" class="'+(en?'':'on')+'">한국어</button><button type="button" data-l="en" class="'+(en?'on':'')+'">EN</button></div></div>'+
     '<span class="hp-pill">'+L.pill+'</span>'+
     '<h1 class="hp-h1">'+esc(L.h1a)+'<em>'+esc(L.h1b)+'</em></h1>'+
     '<p class="hp-lead">'+esc(L.lead)+'</p>'+
     '<div class="hp-rate">'+(L.rWas?'<span class="was">'+L.rWas+'</span>':'')+
       '<div class="eq"><span class="a">'+esc(L.rA)+'</span><span class="ar">→</span><span class="b">'+esc(L.rB)+'<small>'+esc(L.rBs)+'</small></span></div><p>'+esc(L.rS)+'</p></div>'+
     '<div class="hp-chips">'+L.chips.map(function(c){return '<span><i aria-hidden="true" style="font-style:normal">'+c[0]+'</i>'+esc(c[1])+'</span>';}).join('')+'</div>'+
     '</header>';
  h+='<main class="hp-body">';
  h+='<section class="hp-sec"><h2 class="hp-h2"><i>01</i>'+esc(L.s1)+'</h2><div class="hp-grid">'+
     L.bens.map(function(b){return '<div class="hp-ben"><span class="ic" aria-hidden="true">'+b[0]+'</span><b>'+esc(b[1])+'</b><p>'+esc(b[2])+'</p></div>';}).join('')+'</div></section>';
  var ex='';
  if(L.exType==='check'){
    ex='<div class="hp-chk">'+L.ex.map(function(x){return '<div><i aria-hidden="true">✓</i><span><b>'+esc(x[0])+'</b>'+(x[1]?'<small>'+esc(x[1])+'</small>':'')+'</span></div>';}).join('')+'</div>';
  }else{
    ex='<div class="hp-flow">'+L.ex.map(function(x,i){return (i?'<span class="ar" aria-hidden="true">→</span>':'')+'<div class="bx'+(i===L.ex.length-1?' t':'')+'"><small>'+esc(x[0])+'</small><b>'+esc(x[1])+'</b></div>';}).join('')+'</div>';
  }
  h+='<section class="hp-sec"><h2 class="hp-h2"><i>02</i>'+esc(L.s2)+'</h2><div class="hp-steps">'+
     L.steps.map(function(s,i){return '<div class="hp-step"><span class="no">'+(i+1)+'</span><div><b>'+esc(s[0])+'</b><p>'+s[1]+'</p></div></div>';}).join('')+'</div>'+
     '<div class="hp-ex"><h3>'+esc(L.exT)+'</h3>'+ex+'</div>'+
     '<ul class="hp-note">'+L.notes.map(function(n){return '<li>'+n+'</li>';}).join('')+'</ul></section>';
  h+='</main>';
  h+='<footer class="hp-ft"><div class="q">'+esc(L.ftQ)+'</div>'+
     '<a class="tel" href="tel:'+TEL+'">'+TEL_D+'</a><div class="ch">'+esc(L.ftCh)+'</div>'+
     '<div class="acts"><a class="wa" href="https://wa.me/'+TEL.replace(/\D/g,'')+'?text='+encodeURIComponent(L.waMsg)+'" target="_blank" rel="noopener">💬 '+esc(L.bWa)+'</a>'+
     '<a class="web" href="'+SITE+'/request'+ls+'">📅 '+esc(L.bBook)+'</a></div>'+
     '<div class="co"><a href="'+SITE+'/home'+ls+'" style="color:inherit;text-decoration:underline;text-underline-offset:3px">happyhomecare.com.my</a> · HAPPY WORKS SERVICES SDN. BHD. (1278908-M)</div></footer>';
  document.getElementById('app').innerHTML=h;
  document.querySelectorAll('[data-l]').forEach(function(b){
    b.addEventListener('click',function(){
      if(LANG===b.dataset.l) return;
      LANG=b.dataset.l;
      try{var u=new URL(location.href); if(LANG==='en') u.searchParams.set('lang','en'); else u.searchParams.delete('lang'); history.replaceState(null,'',u);}catch(e){}
      render();
      var bk=document.querySelector('#hhcBackToCard span'); if(bk) bk.textContent=LANG==='en'?'Back to card':'명함으로';

}
render();
})();
</script>

<!-- ── 전자명함에서 넘어온 방문자에게만 보이는 되돌아가기 버튼 ────────── -->
<style>
.hhcbk{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:9990;display:none;align-items:center;gap:8px;padding:11px 17px 11px 13px;border-radius:999px;
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:14px;font-weight:700;letter-spacing:-.01em;color:#fdfcf9;
  background:linear-gradient(150deg,#173a5e,#0f2540);border:1px solid rgba(227,201,138,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 6px rgba(4,12,26,.35),0 14px 28px -12px rgba(4,12,26,.8);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .16s cubic-bezier(.22,.61,.36,1),background .16s cubic-bezier(.22,.61,.36,1)}
.hhcbk.on{display:inline-flex}
.hhcbk:active{transform:translateY(1px);background:linear-gradient(150deg,#1d4870,#122c4d)}
.hhcbk i{font-style:normal;color:#e3c98a;font-size:16px;line-height:1}
@media (prefers-reduced-motion:reduce){.hhcbk{transition:none}}
@media print{.hhcbk{display:none!important}}
</style>
<button type="button" class="hhcbk" id="hhcBackToCard"><i>&#8592;</i><span>명함으로</span></button>
<script>
(function(){
  try{
    var q = new URLSearchParams(location.search);
    var en = String(q.get('lang') || '').toLowerCase() === 'en';
    var fromCard = q.get('from') === 'card' || (document.referrer || '').indexOf('/namecard') > -1;
    if(!fromCard) return;

    var b = document.getElementById('hhcBackToCard');
    if(!b) return;
    b.querySelector('span').textContent = en ? 'Back to card' : '명함으로';
    b.setAttribute('aria-label', en ? 'Back to the digital name card' : '전자명함으로 돌아가기');
    b.classList.add('on');

    /* 화면 아래에 고정된 바(예약 제출 바 등)가 있으면 그만큼 위로 띄운다 */
    function lift(){
      var vh = window.innerHeight, max = 0;
      var els = document.querySelectorAll('body > *, body > * > *');
      for(var i = 0; i < els.length; i++){
        var el = els[i];
        if(el === b) continue;
        var cs = getComputedStyle(el);
        if(cs.position !== 'fixed' || cs.display === 'none' || cs.visibility === 'hidden') continue;
        var r = el.getBoundingClientRect();
        if(r.height > 0 && r.height < 170 && Math.abs(r.bottom - vh) < 6 && r.width > 120){
          if(r.height > max) max = r.height;
        }
      }
      b.style.bottom = 'calc(' + (14 + max) + 'px + env(safe-area-inset-bottom))';
    }
    lift();
    setTimeout(lift, 900);
    window.addEventListener('resize', lift);

    b.addEventListener('click', function(){
      if(history.length > 1){ history.back(); }
      else { location.href = '/namecard' + (en ? '?lang=en' : ''); }
    });
  }catch(e){}
})();
</script>
