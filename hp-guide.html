<style>
:root{
  --navy-950:#08172b;--navy-900:#0f2540;--navy-800:#173a5e;
  --teal-700:#0f766e;--teal-600:#14958a;--teal-50:#eaf6f4;
  --gold-700:#8f6f28;--gold-600:#b08d3a;--gold-500:#c9a44c;--gold-300:#e3c98a;--gold-100:#f4e7c4;--gold-50:#fbf5e6;
  --ink-900:#161d27;--ink-700:#333d4b;--ink-600:#4d5866;--ink-400:#8891a0;
  --line:#ece6d8;--cream:#faf7f0;--ease:cubic-bezier(.22,.61,.36,1);
  --e2:0 1px 2px rgba(11,24,51,.10),0 8px 16px -4px rgba(11,24,51,.16),0 26px 44px -14px rgba(11,24,51,.30);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Noto Sans CJK KR',sans-serif;background:var(--cream);color:var(--ink-900);
  -webkit-font-smoothing:antialiased;word-break:keep-all;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.hpg{max-width:520px;margin:0 auto}
.sf{font-family:'Noto Serif KR','Noto Serif CJK KR',Georgia,serif}
.gtx{background:linear-gradient(180deg,#fff4d2,#f3d991 40%,#e0bd68 75%,#c9a44c);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ── 히어로 ── */
.hpg-hero{position:relative;overflow:hidden;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 26px;
  background:radial-gradient(420px 300px at 90% 10%,rgba(20,149,138,.28),transparent 70%),linear-gradient(170deg,#13305a 0%,#0c2040 55%,#08172b 100%)}
.hpg-hero .ph{position:absolute;right:-50px;top:56px;width:230px;height:200px;opacity:.85;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 60%),linear-gradient(0deg,transparent,#000 30%);mask-image:linear-gradient(90deg,transparent,#000 60%);}
.hpg-hero .ph img{width:100%;height:100%;object-fit:cover;object-position:85% 55%}
.hpg-top{position:relative;display:flex;align-items:center;gap:10px}
.hpg-logo{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(160deg,#1d4374,#0c2040);border:1px solid rgba(243,222,160,.8)}
.hpg-logo svg{width:20px;height:20px;fill:#e3c98a}
.hpg-top b{font-size:12px;letter-spacing:.2em;color:var(--gold-300);font-weight:800}
.hpg-lang{margin-left:auto;display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.1)}
.hpg-lang button{border:0;background:none;color:#c8d3e6;font:inherit;font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;cursor:pointer}
.hpg-lang button.on{background:#fff;color:var(--navy-900)}
.hpg-hero h1{position:relative;margin-top:34px;font-size:30px;line-height:1.28;font-weight:800;letter-spacing:-.04em}
.hpg-hero h1 .sf{font-size:38px;font-weight:700}
.hpg-hero p{position:relative;margin-top:10px;font-size:15px;line-height:1.6;color:#d3dcea;max-width:245px}
.hpg-chips{position:relative;margin-top:16px;display:flex;flex-wrap:wrap;gap:6px}
.hpg-chips span{font-size:12.5px;font-weight:700;color:#e6ecf5;padding:6px 11px 6px 8px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(227,201,138,.3);display:flex;align-items:center;gap:6px}
.hpg-chips span::before{content:"✓";display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:linear-gradient(180deg,#ecd08c,#c9a44c);color:#1b1406;font-size:10px;font-weight:900}

/* ── 3가지 큰 버튼 (목차) ── */
.hpg-ways{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px;margin-top:-6px;position:relative;z-index:2}
.hpg-way{display:block;text-decoration:none;color:var(--ink-900);background:#fff;border-radius:16px;padding:12px 8px 12px;text-align:center;box-shadow:var(--e2);transition:transform .16s var(--ease)}
.hpg-way:active{transform:translateY(2px)}
.hpg-way .coin{width:44px;height:44px;margin:0 auto;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 30%,#f6e3a8,#e3c98a 35%,#c9a44c 75%,#b08d3a);box-shadow:0 2px 0 #8f6f28,0 6px 10px rgba(14,35,80,.25),inset 0 2px 3px rgba(255,255,255,.6)}
.hpg-way .coin svg{width:22px;height:22px;stroke:#2a2008;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hpg-way em{display:block;margin-top:8px;font-style:normal;font-size:22px;font-weight:900;letter-spacing:-.03em;color:var(--navy-900)}
.hpg-way em small{font-size:12px;margin-right:2px;color:var(--gold-700)}
.hpg-way b{display:block;font-size:12.5px;font-weight:700;color:var(--ink-600);margin-top:1px}

/* ── 섹션 ── */
.hpg-sec{margin:22px 14px 0;background:#fff;border-radius:22px;overflow:hidden;box-shadow:var(--e2)}
.hpg-sec[hidden]{display:none}
.hpg-sh{display:flex;align-items:center;gap:10px;padding:18px 18px 0}
.hpg-no{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900;color:#1b1406;
  background:radial-gradient(circle at 38% 30%,#fff2c7,#d9b664 60%,#a98634);box-shadow:0 2px 0 #8f6f28}
.hpg-sh small{display:block;font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--teal-700)}
.hpg-sh h2{font-size:21px;font-weight:900;letter-spacing:-.04em}
.hpg-sh .amt{margin-left:auto;font-size:26px;font-weight:900;color:var(--navy-900);letter-spacing:-.03em;white-space:nowrap}
.hpg-sh .amt small{font-size:13px;color:var(--gold-700);display:inline;letter-spacing:0;margin-right:2px}

/* 그림 무대 */
.hpg-art{position:relative;margin:14px 14px 0;height:168px;border-radius:16px;overflow:hidden;
  background:radial-gradient(260px 160px at 50% 40%,rgba(227,201,138,.22),transparent 70%),linear-gradient(170deg,#13305a,#0c2040 60%,#08172b)}
.coinB{position:absolute;border-radius:50%;display:grid;place-items:center;text-align:center;color:#2a2008;font-weight:900;line-height:1.05;
  background:radial-gradient(circle at 38% 28%,#fff6d6,#f1d897 30%,#d6b25c 70%,#b9923d);box-shadow:inset 0 2px 3px rgba(255,255,255,.7),inset 0 -6px 10px rgba(110,80,20,.45),0 5px 0 #7d5f22,0 14px 20px rgba(0,4,12,.6)}
.paper{position:absolute;background:linear-gradient(180deg,#fffdf8,#f3eee2);border-radius:12px;color:var(--ink-900);box-shadow:0 2px 4px rgba(0,0,0,.25),0 16px 24px -8px rgba(0,4,12,.8)}
.arr{position:absolute;color:var(--gold-300)}
.arr svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}

/* 단계 */
.hpg-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:16px 14px 4px;position:relative}
.hpg-steps::before{content:"";position:absolute;left:18%;right:18%;top:38px;border-top:2px dashed #e3d6b4}
.hpg-step{position:relative;text-align:center}
.hpg-step i{display:grid;place-items:center;width:46px;height:46px;margin:0 auto;border-radius:14px;background:var(--navy-900);box-shadow:0 4px 10px rgba(14,35,80,.25);position:relative}
.hpg-step i svg{width:23px;height:23px;stroke:#e3c98a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hpg-step i em{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;color:#1b1406;background:linear-gradient(180deg,#f3dea0,#c9a44c)}
.hpg-step b{display:block;margin-top:8px;font-size:13.5px;font-weight:800;letter-spacing:-.03em;line-height:1.35}
.hpg-step span{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-400);line-height:1.35}

/* 표 · 안내 */
.hpg-ex{margin:12px 14px 0;border-radius:14px;background:var(--gold-50);border:1px solid #efe2bd;overflow:hidden}
.hpg-ex div{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:14px;font-weight:600;color:var(--ink-700);border-top:1px solid #f1e6c8}
.hpg-ex div:first-child{border-top:0}
.hpg-ex b{font-weight:900;color:var(--navy-900);font-variant-numeric:tabular-nums}
.hpg-ex b em{font-style:normal;color:var(--teal-700)}
.hpg-note{margin:12px 14px 0;font-size:13px;line-height:1.6;color:var(--ink-600)}
.hpg-note li{list-style:none;position:relative;padding-left:14px;margin-top:4px}
.hpg-note li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--gold-500)}
.hpg-note b{color:var(--ink-900)}
.hpg-tip{margin:12px 14px 0;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--teal-50);font-size:13.5px;line-height:1.55;color:var(--ink-700)}
.hpg-tip i{flex:none;font-style:normal;font-size:12px;font-weight:900;color:#fff;background:var(--teal-700);border-radius:999px;padding:2px 8px;margin-top:1px}
.hpg-act{display:flex;gap:8px;padding:16px 14px 18px}
.hpg-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:48px;border-radius:13px;text-decoration:none;font-size:14.5px;font-weight:800;letter-spacing:-.02em;transition:transform .14s var(--ease)}
.hpg-btn:active{transform:translateY(2px)}
.hpg-btn.g{color:#1b1406;background:linear-gradient(180deg,#f8e6b0,#d9b664);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 0 #9a7a30}
.hpg-btn.o{color:var(--navy-900);background:#fff;border:1.5px solid var(--line)}

/* 합계 · 사용법 */
.hpg-sum{margin:22px 14px 0;border-radius:22px;padding:20px 18px;color:#fff;text-align:center;
  background:linear-gradient(170deg,#13305a,#0c2040 60%,#08172b);box-shadow:var(--e2)}
.hpg-sum small{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--gold-300)}
.hpg-sum .eq{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.hpg-sum .eq span{display:block;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);font-size:12px;color:#c8d3e6;font-weight:600;line-height:1.3}
.hpg-sum .eq span b{display:block;font-size:17px;color:#fff;font-weight:900}
.hpg-sum .eq i{font-style:normal;color:var(--gold-300);font-weight:900}
.hpg-sum .tot{margin-top:12px;font-size:15px;color:#d3dcea;font-weight:600}
.hpg-sum .tot b{font-size:40px;font-weight:700;margin-left:6px}
.hpg-use{margin:14px 14px 0;background:#fff;border-radius:22px;padding:18px;box-shadow:var(--e2)}
.hpg-use h3{font-size:17px;font-weight:900;letter-spacing:-.03em}
.hpg-use ul{margin-top:10px;display:grid;gap:8px}
.hpg-use li{list-style:none;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.5;color:var(--ink-700)}
.hpg-use li i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:900;color:#1b1406;background:linear-gradient(180deg,#f3dea0,#c9a44c);margin-top:1px}
.hpg-foot{text-align:center;margin:22px 0 10px;font-size:12px;color:var(--ink-400)}

/* 하단 고정 */
.hpg-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(250,247,240,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.hpg-bar .in{max-width:520px;margin:0 auto;display:flex;gap:8px}
.hpg-bar a{display:flex;align-items:center;justify-content:center;gap:6px;height:50px;border-radius:13px;text-decoration:none;font-size:15px;font-weight:800}
.hpg-bar .wa{flex:0 0 auto;padding:0 16px;color:#fff;background:#1fb85a}
.hpg-bar .bk{flex:1;color:#fff;background:var(--navy-900)}
.hpg-bar .bk em{font-style:normal;color:var(--gold-300)}

/* 칸 강조 (#pay 등으로 들어왔을 때) */
@keyframes hpgGlow{0%,100%{box-shadow:var(--e2)}50%{box-shadow:0 0 0 4px rgba(201,164,76,.55),var(--e2)}}
.hpg-sec.flash{animation:hpgGlow 1.1s var(--ease) 2}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hpg-sec.flash{animation:none;box-shadow:0 0 0 3px rgba(201,164,76,.55),var(--e2)}.hpg-way,.hpg-btn{transition:none}}
</style>
</head>
<body>
<div class="hpg">

 <header class="hpg-hero">
  <div class="ph"><img src="/mp-bg-points.jpg" alt=""></div>
  <div class="hpg-top">
   <span class="hpg-logo"><svg viewBox="0 0 100 100"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></svg></span>
   <b>HAPPY POINT</b>
   <div class="hpg-lang"><button data-l="ko">한국어</button><button data-l="en">EN</button></div>
  </div>
  <h1><span class="sf gtx" data-k="h1a"></span><br><span data-k="h1b"></span></h1>
  <p data-k="lead"></p>
  <div class="hpg-chips"><span data-k="c1"></span><span data-k="c2"></span><span data-k="c3"></span></div>
 </header>

 <nav class="hpg-ways">
  <a class="hpg-way" href="#pay"><span class="coin"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h3"/></svg></span><em>1%</em><b data-k="w1"></b></a>
  <a class="hpg-way" href="#refer" id="hpg-w2"><span class="coin"><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-3.3 2.7-6 6-6s6 2.7 6 6M10 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg></span><em><small>RM</small><span data-v="pts"></span></em><b data-k="w2"></b></a>
  <a class="hpg-way" href="#review" id="hpg-w3"><span class="coin"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5-4.7-4.6 6.5-.9z"/></svg></span><em><small>RM</small><span data-v="rev"></span></em><b data-k="w3"></b></a>
 </nav>

 <!-- ① 결제 1% -->
 <section class="hpg-sec" id="pay">
  <div class="hpg-sh"><span class="hpg-no">1</span><div><small data-k="p_k"></small><h2 data-k="p_t"></h2></div><div class="amt">1%</div></div>
  <div class="hpg-art">
   <div class="paper" style="left:22px;top:24px;width:124px;height:120px;padding:12px 12px;transform:rotate(-4deg)">
    <div style="font-size:10px;font-weight:900;letter-spacing:.12em;color:#b08d3a">INVOICE</div>
    <div style="margin-top:6px;height:6px;width:80%;border-radius:3px;background:#ebe5d6"></div><div style="margin-top:5px;height:6px;width:60%;border-radius:3px;background:#ebe5d6"></div>
    <div style="margin-top:14px;font-size:10px;font-weight:800;color:#8891a0" data-k="p_paid"></div>
    <div style="font-size:21px;font-weight:900;color:#0f2540;letter-spacing:-.03em">RM 1,000</div>
   </div>
   <div class="arr" style="left:158px;top:66px;width:40px;height:40px"><svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
   <div style="position:absolute;left:156px;top:104px;width:46px;text-align:center;font-size:12px;font-weight:900;color:#e3c98a">× 1%</div>
   <div class="coinB" style="left:214px;top:28px;width:110px;height:110px;font-size:13px"><span>RM<br><b style="font-size:34px">10</b></span></div>
  </div>
  <div class="hpg-steps">
   <div class="hpg-step"><i><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18"/></svg><em>1</em></i><b data-k="p_s1"></b><span data-k="p_s1d"></span></div>
   <div class="hpg-step"><i><svg viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><em>2</em></i><b data-k="p_s2"></b><span data-k="p_s2d"></span></div>
   <div class="hpg-step"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M10 8h3a2 2 0 0 1 0 4h-3V8zm0 4v4"/></svg><em>3</em></i><b data-k="p_s3"></b><span data-k="p_s3d"></span></div>
  </div>
  <div class="hpg-ex">
   <div><span data-k="p_e1"></span><b>RM 5</b></div>
   <div><span data-k="p_e2"></span><b>RM 10</b></div>
   <div><span data-k="p_e3"></span><b><em>RM 30</em></b></div>
  </div>
  <ul class="hpg-note"><li data-k="p_n1"></li><li data-k="p_n2"></li></ul>
  <div class="hpg-tip"><i>TIP</i><span data-k="p_tip"></span></div>
  <div class="hpg-act"><a class="hpg-btn o" href="/points" data-hl="points" data-k="more"></a></div>
 </section>

 <!-- ② 친구 소개 -->
 <section class="hpg-sec" id="refer">
  <div class="hpg-sh"><span class="hpg-no">2</span><div><small data-k="r_k"></small><h2 data-k="r_t"></h2></div><div class="amt"><small>RM</small><span data-v="pts"></span></div></div>
