     agH:'내용 확인 및 동의',agP:'상기 <b>양도 내용과 계약 조건</b>을 이해하고 동의하신다면 아래 <b>「내용 이해 및 동의하기」</b> 버튼을 눌러 주세요.',

     cfNo:'취소',cfYes:'동의합니다',cfIng:'저장 중…',cfErr:'저장하지 못했습니다. 잠시 후 다시 눌러 주시거나 문의해 주세요.',
     waMsg:function(d){return '안녕하세요, 해피홈케어 회원권 잔액 양도 안내 관련 문의드립니다.\n· 받는 분: '+d.to.name+'\n· 양도하시는 분: '+d.from+'\n· 접수번호: '+(d.ref||'');},
     when:function(iso){var x=new Date(iso);return isNaN(x)?'':(x.getMonth()+1)+'월 '+x.getDate()+'일 '+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0');},
     loading:'양도 내용을 불러오는 중입니다…',errH:'안내장을 열 수 없습니다',errP:'링크가 만료되었거나 잘못되었습니다. 왓츠앱으로 알려 주시면 다시 보내 드립니다.',errWa:'💬 왓츠앱으로 문의',
     ft:'HAPPY WORKS SERVICES SDN. BHD. · 해피홈케어'},
   en:{title:'Membership Balance Transfer',brand:'HAPPY MEMBERSHIP',kick:'BALANCE TRANSFER',
     h1:function(n){return 'Dear '+esc(n)+',<br><em>a membership balance is coming to you</em>';},
     sub:function(f){return 'You are taking over '+esc(f)+'\'s Happy Membership balance with the same contract terms.';},
     cardLb:'BALANCE TRANSFERRED',tag:'🔁 Transferred',stNew:'In progress · we will send your contract after confirming',stDone:'Completed · use it on your MY PAGE',
     sumH:'Transfer details',kFrom:'From',kTo:'To',kProp:'Service property',kAmt:'Amount',kAll:'Full remaining balance',kAsOf:function(d){return 'as of '+new Date(d+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});},
     ctH:'Contract you take over',kNo:'Original contract no.',kPkg:'Tier',kType:'Type',home:'Home',biz:'Business',kDate:'Original contract date',
     note:'The final balance is confirmed on the day we process the transfer.',noteAll:'For a full-balance transfer, the balance on the processing day is the final amount.',
     benH:'Benefits you take over',benN:'Free service quantities continue with what remains on the original contract.',
     tmH:'Key contract terms',
     terms:[['💳','Prepaid credit','Each service is deducted from the balance at the standard price at the time of use.'],
       ['⏳','No expiry','You can use it until the balance runs out.'],
       ['🔒','No refunds','No cash refunds. If you return home or move abroad, tell us in advance and the balance can be transferred or converted into e-vouchers.'],
       ['🎁','Benefits','Additional services and benefits may change for business reasons; we will let you know in advance.']],
     stH:'What happens next',
     steps:[['Request received','We have received the transfer request.'],['Review and agree','Check the recipient, amount and terms, then tap "I understand and agree".'],
       ['Contract sent','After confirming, we send your new contract and MY PAGE link on WhatsApp.'],['Use it on MY PAGE','Check your balance, book and see invoices on MY PAGE.']],
     agH:'Review and agree',agP:'If you understand and agree to the <b>transfer details and contract terms</b> above, please tap <b>"I understand and agree"</b> below.',
     agS:'Once you agree, we will confirm and send your transfer contract and MY PAGE link. If anything is wrong, please contact us instead.',
     agDone:function(t){return '✅ Agreed · '+t;},
     ok:'✅ I understand and agree',okDone:'✓ Agreed',q:'💬 Ask us',
     cfH:'Do you agree to the following?',cfTo:'To',cfFrom:'From',cfAmt:'Amount',cfP:'I understand the transfer details and contract terms (prepaid credit · standard-price deduction · no expiry · no refunds · benefits may change) and agree to take over this balance.',
     cfNo:'Cancel',cfYes:'I agree',cfIng:'Saving…',cfErr:'Could not save. Please try again shortly or contact us.',

     when:function(iso){var x=new Date(iso);return isNaN(x)?'':x.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0');},
     loading:'Loading the transfer details…',errH:'This page cannot be opened',errP:'The link may have expired or be incorrect. Message us on WhatsApp and we will send it again.',errWa:'💬 Message us on WhatsApp',
     ft:'HAPPY WORKS SERVICES SDN. BHD. · Happy Home Care'}
  };
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function rm(n){return 'RM '+(Number(n)||0).toLocaleString('en-MY',{minimumFractionDigits:0,maximumFractionDigits:2});}
  function L(){return T[S.lang];}
  var LOGO='<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#e3c98a"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M8 50 L50 22 L92 50 L84 58 L50 36 L16 58Z"/></g></svg>';
  function top(){var en=S.lang==='en';return '<div class="ti-top"><div class="ti-logo">'+LOGO+'</div><div class="ti-brand"><b>Happy Home Care</b><small>'+L().brand+'</small></div>'+
    '<div class="ti-lang" role="group" aria-label="Language"><button type="button" data-l="ko" class="'+(en?'':'on')+'">한국어</button><button type="button" data-l="en" class="'+(en?'on':'')+'">EN</button></div></div>';}
  function render(){
    var l=L(),en=S.lang==='en',d=S.d,dock=document.getElementById('dock');
    document.documentElement.lang=en?'en':'ko';document.title=l.title+' | Happy Home Care';
    if(!d){
      document.getElementById('app').innerHTML='<header class="ti-hero" style="padding-bottom:18px">'+top()+'</header>'+
        (S.err?'<div class="ti-msg"><div class="ic">🔗</div><h3>'+l.errH+'</h3><p>'+l.errP+'</p></div>':'<div class="ti-msg"><div class="ti-spin"></div><p>'+l.loading+'</p></div>');
      if(S.err){dock.hidden=false;var w=document.getElementById('bOk');w.hidden=true;var qq=document.getElementById('bQ');qq.textContent=l.errWa;qq.href='https://wa.me/'+TEL;dock.querySelector('.in').style.gridTemplateColumns='1fr';}
      return;
    }
    var c=d.contract||{},pk=PKG[c.pkg],tier=pk?(en?pk[1]:pk[0]):'',done=d.status==='done';
    var bens=(c.benefits||[]).filter(function(k){return BEN[k];}).map(function(k){return BEN[k][en?1:0];}).filter(function(x,i,a){return a.indexOf(x)===i;});
    var amt=rm(d.amount);
    document.getElementById('app').innerHTML=
     '<header class="ti-hero">'+top()+
       '<div class="ti-kick">'+l.kick+'</div><h1 class="ti-h1">'+l.h1(d.to.name)+'</h1><p class="ti-sub">'+l.sub(d.from)+'</p>'+
       '<div class="ti-stage" aria-hidden="true"><div class="ti-card"><div class="c-r1"><span>HAPPY HOME CARE</span><span>'+esc(pk?pk[1].replace(/ \(Business\)/,'').toUpperCase():'MEMBER')+'</span></div>'+
         '<div class="c-chip"></div><div class="c-lb">'+l.cardLb+'</div><div class="c-am num">'+amt+'</div>'+
         '<div class="c-nm">'+esc(String(d.to.name||'').toUpperCase())+'</div><div class="c-tag">'+l.tag+'</div></div></div>'+
       '<div class="ti-st'+(done?' done':'')+'"><i></i>'+(done?l.stDone:l.stNew)+'</div></header>'+
     '<section class="ti-sec"><div class="ti-sh"><h2>'+l.sumH+'</h2></div><div class="ti-box"><div class="ti-kv">'+
       '<span>'+l.kFrom+'</span><b>'+esc(d.from)+'</b><span>'+l.kTo+'</span><b>'+esc(d.to.name)+'</b>'+
       (d.to.condo?'<span>'+l.kProp+'</span><b>'+esc(d.to.condo)+'</b>':'')+'<hr>'+
       '<span>'+l.kAmt+'</span><b class="big num">'+amt+'</b>'+
       '<span></span><b style="font-size:13px;color:var(--ink-400);font-weight:700">'+(d.amt_mode==='all'?l.kAll+' · ':'')+l.kAsOf(d.as_of)+'</b>'+
     '</div><p class="ti-note">'+(d.amt_mode==='all'?l.noteAll:l.note)+'</p></div></section>'+
     '<section class="ti-sec"><div class="ti-sh"><h2>'+l.ctH+'</h2></div><div class="ti-box"><div class="ti-kv">'+
       (c.no?'<span>'+l.kNo+'</span><b class="num">'+esc(c.no)+'</b>':'')+(tier?'<span>'+l.kPkg+'</span><b>'+esc(tier)+'</b>':'')+
       (c.type?'<span>'+l.kType+'</span><b>'+(c.type==='business'||/biz/.test(c.pkg)?l.biz:l.home)+'</b>':'')+
       (c.date?'<span>'+l.kDate+'</span><b class="num">'+esc(c.date)+'</b>':'')+'</div>'+
       (bens.length?'<div style="margin-top:16px"><div style="font-size:13px;font-weight:800;color:var(--ink-400);margin-bottom:8px">'+l.benH+'</div>'+
         bens.map(function(b){return '<span class="ti-chip"><i>✓</i>'+esc(b)+'</span>';}).join('')+'<p class="ti-note" style="margin-top:4px">'+l.benN+'</p></div>':'')+
     '</div></section>'+
     '<section class="ti-sec"><div class="ti-sh"><h2>'+l.tmH+'</h2></div><div class="ti-box"><ul class="ti-tl">'+
       l.terms.map(function(t){return '<li><div class="ic">'+t[0]+'</div><div><b>'+t[1]+'</b><p>'+t[2]+'</p></div></li>';}).join('')+'</ul></div></section>'+
     '<section class="ti-sec"><div class="ti-sh"><h2>'+l.stH+'</h2></div><div class="ti-box"><ol class="ti-steps">'+
       l.steps.map(function(s,i){return '<li class="'+(i===0||done||(i===1&&d.agreed_at)?'ok':'')+'"><b>'+s[0]+'</b><p>'+s[1]+'</p></li>';}).join('')+'</ol></div></section>'+
     '<section class="ti-sec" id="agree"><div class="ti-sh"><h2>'+l.agH+'</h2></div><div class="ti-box ti-agree"><p>'+l.agP+'</p><small>'+l.agS+'</small>'+
       (d.agreed_at?'<div class="ok">'+l.agDone(l.when(d.agreed_at))+'</div>':'')+'</div></section>'+
     '<footer class="ti-ft">'+l.ft+(d.ref?' · '+esc(d.ref):'')+'</footer>'+
     '<div class="ti-cf" id="cf" role="dialog" aria-modal="true"><div class="sh"><h3>'+l.cfH+'</h3><div class="kv">'+
       '<div><span>'+l.cfTo+'</span><b>'+esc(d.to.name)+'</b></div><div><span>'+l.cfFrom+'</span><b>'+esc(d.from)+'</b></div><div><span>'+l.cfAmt+'</span><b class="num">'+amt+'</b></div></div>'+
       '<p>'+l.cfP+'</p><div class="er" id="cfErr" hidden>'+l.cfErr+'</div><div class="bt"><button type="button" class="no" data-cf="no">'+l.cfNo+'</button><button type="button" class="yes" data-cf="yes">'+l.cfYes+'</button></div></div></div>';
    dock.hidden=false;
    var ok=document.getElementById('bOk');ok.hidden=false;ok.textContent=d.agreed_at?l.okDone:l.ok;ok.disabled=!!d.agreed_at;ok.classList.toggle('done',!!d.agreed_at);
    var qq=document.getElementById('bQ');qq.textContent=l.q;qq.href='https://wa.me/'+TEL+'?text='+encodeURIComponent(l.waMsg(d));
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest('button[data-l]');if(b){S.lang=b.dataset.l;render();return;}
    if(e.target.closest('#bOk')){if(S.d&&!S.d.agreed_at)document.getElementById('cf').classList.add('on');return;}
    var cf=document.getElementById('cf');
    if(cf&&(e.target===cf||e.target.closest('[data-cf="no"]'))){cf.classList.remove('on');return;}
    var y=e.target.closest('[data-cf="yes"]');if(y)agree(y);
  });
  /* ✅ 내용 이해 및 동의 → 서버에 동의 시각 저장 (관리자 앱 알림 · 신청 상세에 「동의」 표시) */
  function agree(btn){
    var l=L();btn.disabled=true;btn.textContent=l.cfIng;document.getElementById('cfErr').hidden=true;
    fetch('/api/transfer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({op:'agree',k:k,i:i})})
      .then(function(r){return r.json();})
      .then(function(j){if(!j||!j.ok)throw new Error('x');S.d.agreed_at=j.agreed_at||new Date().toISOString();render();
        var a=document.getElementById('agree');if(a&&a.scrollIntoView)a.scrollIntoView({block:'center',behavior:'smooth'});})
      .catch(function(){btn.disabled=false;btn.textContent=l.cfYes;document.getElementById('cfErr').hidden=false;});
  }
  render();
  var k=q.get('k')||'',i=q.get('i')||'0';
  if(!/^[A-Za-z0-9]{16,40}$/.test(k)){S.err='bad';render();return;}
  fetch('/api/transfer?k='+encodeURIComponent(k)+'&i='+encodeURIComponent(i),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(j){if(!j||!j.ok)throw new Error((j&&j.error)||'err');if(!LANG_SET)S.lang=j.lang==='en'?'en':'ko';S.d=j;render();})
    .catch(function(){S.err='load';render();});
})();
</script>
