<style>
:root{
 --navy-950:#08172b;--navy-900:#0f2540;--navy-800:#173a5e;--n:#0E2350;
 --teal-700:#0b5f59;--teal-600:#0f766e;--teal-500:#14958a;
 --gold-700:#8f6f28;--gold-600:#b08d3a;--gold-500:#c9a44c;--gold-300:#e3c98a;--gold-50:#fbf5e6;
 --ink:#161d27;--ink2:#4d5866;--ink3:#8891a0;--line:#ece6d8;--paper:#f7f4ee;--card:#fff;
 --bl:#2563EB;--ok:#0E9B63;
 --e1:0 1px 2px rgba(11,24,51,.07),0 6px 14px -6px rgba(11,24,51,.16);
 --e2:0 1px 2px rgba(11,24,51,.08),0 10px 22px -8px rgba(11,24,51,.22),0 28px 48px -22px rgba(11,24,51,.3);
 --ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);font-family:'Pretendard Variable','Pretendard','Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font-family:inherit}

.pg{max-width:520px;margin:0 auto;background:var(--paper);min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}

/* ── 히어로 ── */
.hero{position:relative;overflow:hidden;color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 26px;
 background:radial-gradient(120% 90% at 100% 0%,rgba(201,164,76,.22),transparent 55%),linear-gradient(160deg,#173a5e 0%,#0f2540 45%,#08172b 100%)}
.hero:after{content:'';position:absolute;right:-90px;bottom:-120px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(227,201,138,.16)}
.hd{display:flex;align-items:center;gap:10px}
.lg{width:38px;height:38px;border-radius:11px;flex:none;background:linear-gradient(145deg,#f1dca6,#c9a44c);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px -4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.hd .b1{font-size:15px;font-weight:900;letter-spacing:-.01em}
.hd .b2{font-size:9px;font-weight:800;letter-spacing:.08em;white-space:nowrap;color:#a9bbd6;margin-top:2px}
.lgb{margin-left:auto;display:flex;gap:3px;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.lgb button{white-space:nowrap;border:none;background:none;color:#c6d5f5;font-size:11.5px;font-weight:900;border-radius:999px;padding:5px 10px;cursor:pointer}
.lgb button.on{background:#fff;color:var(--n)}
.bkl{display:inline-flex;align-items:center;gap:4px;margin-top:16px;font-size:12.5px;font-weight:800;color:#dce6fa;text-decoration:none;
 background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:6px 12px}
.bkl[hidden]{display:none}
.bkl+.ey{margin-top:14px}
.ey{margin-top:24px;font-size:11px;font-weight:900;letter-spacing:.22em;color:var(--gold-500)}
.h1{margin-top:8px;font-size:30px;line-height:1.22;font-weight:900;letter-spacing:-.035em}
.h1 em{font-style:normal;color:var(--gold-300)}
.lead{margin-top:10px;font-size:15px;line-height:1.6;color:#c9d5e8;font-weight:500}
.from{display:inline-flex;align-items:baseline;gap:6px;margin-top:16px;padding:9px 16px;border-radius:999px;background:linear-gradient(140deg,#f3e0ae,#c9a44c);color:#2b1f05;
 box-shadow:0 8px 20px -10px rgba(201,164,76,.9),inset 0 1px 0 rgba(255,255,255,.6);font-size:13px;font-weight:800}
.from b{font-size:22px;font-weight:900;letter-spacing:-.02em}
/* 핵심 버튼 — 금색 큰 카드 (2026-11-16 눈에 잘 띄게) */
.cta{position:relative;z-index:1;margin-top:20px;width:100%;display:flex;align-items:center;gap:14px;border:none;cursor:pointer;text-align:left;overflow:hidden;
 background:linear-gradient(135deg,#f8e7b6 0%,#e6c26f 48%,#c9a44c 100%);border-radius:20px;padding:18px 16px 18px 16px;
 box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 14px 34px -12px rgba(201,164,76,.85),0 4px 10px -4px rgba(0,0,0,.45);transition:transform .16s var(--ease)}
.cta:active{transform:translateY(2px) scale(.995)}
.cta:after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:ctaShine 3.6s ease-in-out infinite}
@keyframes ctaShine{0%,55%{left:-60%}85%,100%{left:130%}}
.cta .ic{position:relative;width:50px;height:50px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:#0f2540;box-shadow:0 6px 14px -6px rgba(8,23,43,.9)}
.cta .ic:before{content:'';position:absolute;inset:-5px;border-radius:50%;border:2px solid rgba(15,37,64,.45);animation:ctaRing 2.4s ease-out infinite}
@keyframes ctaRing{0%{transform:scale(.85);opacity:.9}100%{transform:scale(1.25);opacity:0}}
.cta .ic svg{stroke:#e3c98a}
.cta .tag{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:.06em;color:#fff;background:#0f2540;border-radius:999px;padding:3px 8px;margin-bottom:5px}
.cta .c1{display:block;font-size:18.5px;font-weight:900;color:#0f2540;letter-spacing:-.03em;line-height:1.25}
.cta .c2{font-size:13px;font-weight:700;color:#5a4316;margin-top:3px}
.cta .ar{margin-left:auto;flex:none;width:34px;height:34px;border-radius:50%;background:#0f2540;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;line-height:1}
.cta.done{background:linear-gradient(135deg,#ffffff,#f1f4fa)}
.cta.done .c2{color:var(--teal-600);font-weight:800}
.cta.done .ic:before,.cta.done:after{animation:none;opacity:0}
/* ── 섹션 ── */
.sec{padding:26px 16px 0}
.sh{display:flex;align-items:baseline;gap:8px;margin:0 4px 12px}
.sh .k{font-size:10.5px;font-weight:900;letter-spacing:.18em;color:var(--gold-600)}
.sh h2{font-size:19px;font-weight:900;letter-spacing:-.03em}
.sh .r{margin-left:auto;font-size:12px;font-weight:700;color:var(--ink3)}
.card{background:var(--card);border-radius:18px;box-shadow:var(--e2)}
/* 구역 */
.zr{display:flex;align-items:center;gap:12px;padding:14px 16px;position:relative;transition:background .25s}
.zr+.zr{border-top:1px solid #f0ece2}
.zb{width:40px;height:40px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:17px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.zr .m{flex:1;min-width:0}
.zr .d{font-size:16px;font-weight:900;letter-spacing:-.02em}
.zr .a{font-size:12.5px;font-weight:600;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zr .bar{height:5px;border-radius:3px;background:#efeff2;margin-top:8px;overflow:hidden}
.zr .bar i{display:block;height:100%;border-radius:3px}
.zr .p{text-align:right;flex:none}
.zr .p small{font-size:12px;font-weight:800;color:var(--ink3);margin-right:2px}
.zr .p b{font-size:26px;font-weight:900;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.zr .mine{display:none;position:absolute;right:14px;top:-9px;font-size:10.5px;font-weight:900;color:#3A2A00;background:linear-gradient(140deg,#f3e0ae,#c9a44c);border-radius:999px;padding:3px 9px;box-shadow:0 4px 10px -4px rgba(176,141,58,.8)}
.zr.on{background:linear-gradient(90deg,rgba(201,164,76,.16),rgba(201,164,76,.03))}
.zr.on .mine{display:block}
.zr:first-child.on{border-radius:18px 18px 0 0}.zr:last-child.on{border-radius:0 0 18px 18px}
.note{margin-top:12px;background:var(--gold-50);border:1px solid #efe2bf;border-radius:16px;padding:12px 16px}
.note li{list-style:none;position:relative;padding:4px 0 4px 14px;font-size:14px;font-weight:600;color:#4a3d1c;line-height:1.5}
.note li:before{content:'';position:absolute;left:1px;top:12px;width:5px;height:5px;border-radius:50%;background:var(--gold-600)}
.note b{font-weight:900;color:#2b1f05}
/* 진행 순서 */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;position:relative}
.steps:before{content:'';position:absolute;left:12%;right:12%;top:30px;height:2px;background:repeating-linear-gradient(90deg,#d8cfb9 0 6px,transparent 6px 11px)}
.st{position:relative;background:#fff;border-radius:16px;padding:14px 6px 12px;text-align:center;box-shadow:var(--e1)}
.st .n{width:32px;height:32px;margin:0 auto;border-radius:50%;background:var(--navy-900);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center}
.st:last-child .n{background:var(--teal-600)}
.st .t{margin-top:9px;font-size:13.5px;font-weight:900;letter-spacing:-.03em}
.st .s{margin-top:3px;font-size:11px;font-weight:600;color:var(--ink3);line-height:1.35}
/* 보증 */
.wr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.w{border-radius:16px;padding:14px 8px;text-align:center;background:#fff;box-shadow:var(--e1)}
.w .t{font-size:12px;font-weight:800;color:var(--ink3)}
.w .v{margin-top:6px;font-size:17px;line-height:1.25;font-weight:900;color:var(--teal-600);letter-spacing:-.03em}
.w .s{margin-top:5px;font-size:11.5px;font-weight:700;color:var(--ink3)}
.w.pk{background:linear-gradient(155deg,#173a5e,#0f2540 60%,#08172b);box-shadow:var(--e2)}
.w.pk .t{color:#a9bbd6}.w.pk .v{color:var(--gold-300)}.w.pk .s{color:#a9bbd6}
.warn{margin-top:10px;display:flex;gap:8px;align-items:flex-start;background:#fff;border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);line-height:1.5;box-shadow:var(--e1)}
.warn b{color:var(--ink);font-weight:900}
.foot{padding:22px 20px 6px;text-align:center;font-size:11.5px;color:var(--ink3);font-weight:600;line-height:1.6}

/* ── 하단바 ── */
.btm{position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:520px;margin:0 auto;display:flex;gap:9px;
 padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);
 backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);border-top:1px solid #ebe6da;box-shadow:0 -14px 30px -16px rgba(14,35,80,.4)}
.btm button,.btm a{text-decoration:none;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:900;border-radius:13px;padding:14px 8px;cursor:pointer;
 border:1.5px solid #d9d2c1;background:#fff;color:var(--n);transition:transform .14s}
.btm button.prim,.btm a.prim{flex:1.8;background:linear-gradient(140deg,#2563EB,#1740B8);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(37,99,235,.7)}
.btm button:active,.btm a:active{transform:translateY(2px)}

/* ── 비용 확인 창 ── */
.ov{position:fixed;inset:0;z-index:80;background:rgba(8,23,43,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.ov.open{opacity:1;pointer-events:auto}
.sht{position:fixed;left:0;right:0;bottom:0;z-index:90;max-width:520px;margin:0 auto;height:94vh;height:94dvh;background:var(--paper);border-radius:22px 22px 0 0;
 display:flex;flex-direction:column;transform:translateY(105%);visibility:hidden;transition:transform .34s var(--ease),visibility 0s .34s;box-shadow:0 -20px 50px -10px rgba(0,0,0,.45)}
.sht.open{transform:none;visibility:visible;transition:transform .34s var(--ease),visibility 0s}
.sht .grab{width:40px;height:4px;border-radius:2px;background:#d4cdbd;margin:8px auto 0;flex:none}
.sht .top{display:flex;align-items:center;gap:10px;padding:10px 16px 12px;flex:none}
.sht .top .t1{font-size:18px;font-weight:900;letter-spacing:-.03em}
.sht .top .t2{font-size:12px;font-weight:600;color:var(--ink3);margin-top:1px}
.sht .x{margin-left:auto;width:36px;height:36px;border-radius:50%;border:none;background:#ebe5d8;color:var(--ink2);font-size:18px;font-weight:900;cursor:pointer}
.sht .body{flex:1;overflow-y:auto;padding:0 16px 16px;-webkit-overflow-scrolling:touch}
.sht .ft{flex:none;display:flex;gap:9px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #ebe6da}
.sht .ft a{text-decoration:none;display:flex;align-items:center;justify-content:center;flex:1;font-size:15px;font-weight:900;border-radius:13px;padding:14px 8px;cursor:pointer;border:1.5px solid #d9d2c1;background:#fff;color:var(--n)}
.sht .ft a.prim{flex:1.6;background:linear-gradient(140deg,#2563EB,#1740B8);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(37,99,235,.7)}
.sht .ft a.dis{pointer-events:none;opacity:.4;box-shadow:none}
/* 결과 */
.res{display:none;position:relative;overflow:hidden;color:#fff;border-radius:18px;padding:16px;margin-bottom:12px;
 background:radial-gradient(110% 90% at 100% 0%,rgba(201,164,76,.26),transparent 55%),linear-gradient(155deg,#173a5e,#0f2540 60%,#08172b);box-shadow:var(--e2)}
.res.show{display:block;animation:pop .4s var(--ease)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.res .k{font-size:11px;font-weight:800;letter-spacing:.12em;color:#a9bbd6}
.res .r1{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:6px}
.res .v{font-size:38px;font-weight:900;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.res .v small{font-size:16px;font-weight:800;color:#dce6fa;margin-right:4px}
.res .mex{display:inline-block;vertical-align:middle;margin-left:10px;font-size:13px;font-weight:900;letter-spacing:0;color:#063d36;background:#7fe3c9;border-radius:999px;padding:5px 11px}
.res .mexn{margin-top:8px;font-size:12.5px;font-weight:700;color:#9fe8d6}
.res .mexn s{color:#a9bbd6;margin-left:4px}
.res .zp{font-size:13px;font-weight:900;border-radius:999px;padding:7px 13px;background:linear-gradient(140deg,#f3e0ae,#c9a44c);color:#2b1f05}
.res .m{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:14px;border-radius:12px;overflow:hidden;background:rgba(255,255,255,.14)}
.res .m>div{background:rgba(255,255,255,.06);padding:9px 11px;min-width:0}
.res .m .k2{font-size:10.5px;font-weight:800;color:#a9bbd6}
.res .m .v2{font-size:14px;font-weight:900;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .adr{margin-top:10px;font-size:13px;font-weight:700;color:#dce6fa;display:flex;gap:6px;align-items:flex-start;line-height:1.45}
.res .adr button{margin-left:auto;flex:none;border:1px solid rgba(255,255,255,.3);background:none;color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:4px 10px;cursor:pointer}
.qty{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14)}
.qty .ql{font-size:14px;font-weight:800}.qty .qs{font-size:11.5px;color:#a9bbd6;font-weight:600;margin-top:2px}
.stp{display:flex;align-items:center;background:rgba(255,255,255,.12);border-radius:12px;padding:3px}
.stp button{width:38px;height:38px;border:none;border-radius:10px;background:#fff;font-size:20px;font-weight:900;color:var(--n);cursor:pointer}
.stp button:disabled{opacity:.35}
.stp b{min-width:46px;text-align:center;font-size:17px;font-weight:900}
/* 주소 · 지도 */
.ab{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--e1)}
.ab .h{font-size:15px;font-weight:900;letter-spacing:-.02em}
.ab .s{font-size:12.5px;font-weight:500;color:var(--ink2);margin-top:3px;line-height:1.5}
.adr-in{position:relative;margin-top:10px}
.adr-in input{width:100%;font-size:16px;font-weight:700;color:var(--ink);border:1.5px solid #e4e0d6;border-radius:12px;padding:13px 40px 13px 40px;background:#faf8f3;outline:none;transition:border-color .15s,background .15s}
.adr-in input:focus{border-color:var(--bl);background:#fff}
.adr-in .sg{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.6}
.adr-in .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:none;background:#e9e4d9;color:var(--ink2);width:24px;height:24px;border-radius:50%;font-size:14px;font-weight:900;cursor:pointer;display:none}
.mapw{position:relative;margin-top:10px;height:300px;border-radius:14px;overflow:hidden;background:#EEF0EC;touch-action:none;user-select:none;-webkit-user-select:none}

 const rq=new URLSearchParams({t:'insp'});
 if(res&&chosen){if(chosen.named)rq.set('nm',chosen.name);
  // 고른 위치를 요청서 「방문 위치」로도 넘김 (ll=위도,경도 · lp=구글 장소 ID · ln=위치 이름)
  rq.set('ll',chosen.lat.toFixed(6)+','+chosen.lng.toFixed(6));if(/^p:/.test(chosen.key||''))rq.set('lp',chosen.key.slice(2));rq.set('ln',chosen.named?chosen.name:((chosen.addr||'').split(',').slice(0,2).join(',').trim()||chosen.name));rq.set('q',qty);if(chosen.addr)rq.set('ad',chosen.addr);
  rq.set('fz',L==='en'?('[Fee check] Zone '+z.z+' · '+res.km.toFixed(1)+' km · '+qty+' unit(s) · '+(fr==='mem'?'package member — visit fee waived':fr==='war'?'free check ('+WARD+' days after cleaning '+dE(WAR)+')':'est. RM'+tot)):('[출장점검 비용 확인] '+z.z+'구역 · '+res.km.toFixed(1)+'km · 에어컨 '+qty+'대 · '+(fr==='mem'?'패키지 회원 출장점검비 면제':fr==='war'?WARD+'일 이내 무상점검 (에어컨 세척 '+dK(WAR)+')':'예상 RM'+tot)));}
 if(L==='en')rq.set('lang','en');
 const rqUrl='/request?'+rq.toString();
 $('f-req').textContent=t.req;$('f-req').href=rqUrl;$('b-req').href=rqUrl;
 const r=$('res');
 if(res){r.classList.add('show');
  r.innerHTML='<div class="k">'+t.rk+'</div><div class="r1"><div class="v"><small>RM</small>'+tot+(fr?'<span class="mex">'+(fr==='mem'?t.memEx:t.warEx)+'</span>':'')+'</div><span class="zp">'+t.zone(z.z)+'</span></div>'
   +(fr?'<div class="mexn">✓ '+(fr==='mem'?t.memNote:t.warNote(WAR))+' <s>RM'+full+'</s></div>':'')
   +'<div class="m"><div><div class="k2">'+t.dist+'</div><div class="v2">'+res.km.toFixed(1)+' km</div></div><div><div class="k2">'+t.time+'</div><div class="v2">'+res.minutes+' '+t.min+'</div></div></div>'
   +'<div class="adr"><span>📍</span><span>'+esc(chosen?chosen.name:'')+'</span><button id="rchg">'+t.change+'</button></div>'
   +'<div class="qty"><div><div class="ql">'+t.qty+'</div><div class="qs">'+t.qtyS+'</div></div><div class="stp"><button id="qm"'+(qty<=1?' disabled':'')+' aria-label="minus">−</button><b>'+qty+(t.unit?' '+t.unit:'')+'</b><button id="qp" aria-label="plus">+</button></div></div>';
  $('qm').onclick=()=>{if(qty>1){qty--;render()}};$('qp').onclick=()=>{if(qty<20){qty++;render()}};
  $('rchg').onclick=()=>{$('adr').focus();$('adr').select()};
 }else{r.classList.remove('show');r.innerHTML=''}
 mapUI();
}

/* ── 「← 돌아가기」 — 홈페이지·에어컨 안내장·전자명함에서 들어왔을 때만 (from=home|ac|card) ── */
const FROM={home:{h:'/home',ko:'← 홈페이지',en:'← Home'},ac:{h:'/ac-guides',ko:'← 에어컨 안내장',en:'← Air-con guides'},card:{h:'/namecard',ko:'← 명함으로',en:'← Name card'}}[QS.get('from')]||null;
function backUI(){const b=$('bkl');if(!FROM){b.hidden=true;return}b.hidden=false;b.textContent=FROM[L];
 b.href=FROM.h+(L==='en'?(FROM.h.indexOf('?')>-1?'&':'?')+'lang=en':'')}
$('bkl').addEventListener('click',e=>{try{if(document.referrer&&new URL(document.referrer).origin===location.origin&&history.length>1){e.preventDefault();history.back()}}catch(_){}});

/* ── 창 열기·닫기 ── */
function openSheet(){$('ov').classList.add('open');$('sht').classList.add('open');document.body.style.overflow='hidden';boot();
 if(!res&&!$('adr').value)setTimeout(()=>$('adr').focus(),380)}
function closeSheet(){$('ov').classList.remove('open');$('sht').classList.remove('open');document.body.style.overflow='';
 if(res)setTimeout(()=>{const z=document.querySelector('.zr.on');z&&z.scrollIntoView({behavior:'smooth',block:'center'})},350)}
$('cta').onclick=openSheet;$('sx').onclick=closeSheet;$('ov').onclick=closeSheet;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

function mapUI(){
 const t=T[L];
 let tip=t.tip0;if(searching)tip=t.searching;else if(cands.length)tip=t.tipN(cands.length);else if(chosen)tip=t.tipDone;else if($('adr').value.trim().length>=3&&map)tip=t.tipNone;
 $('mtip').innerHTML=tip;$('mtip').style.display=ready?'block':'none';
 const sh=$('msheet');
 if(active&&!(chosen&&chosen.key===active.key)){sh.style.display='block';
  sh.innerHTML='<div class="s1">'+esc(active.custom&&!active.name?t.myPin:active.name)+'</div><div class="s2">'+esc(active.addr||'')+'</div><button id="cfm">'+t.choose+'</button>';
  $('cfm').onclick=()=>confirmPick(active)}
 else sh.style.display='none';
 // 검색 결과 목록 (1곳 이상) — 누르면 지도에서 강조, 「이 위치로 선택」으로 바로 확정
 const ls=$('lst');
 if(cands.length){ls.style.display='block';
  ls.innerHTML='<div class="lh">'+t.listH(cands.length)+'</div>'+cands.map((c,i)=>'<div class="it'+(active===c?' on':'')+'" data-i="'+i+'" role="button" tabindex="0"><span class="no">'+(i+1)+'</span><div><div class="t1">'+esc(c.name)+'</div><div class="t2">'+esc(c.addr)+'</div><button class="go" data-go="1">'+t.choose+'</button></div></div>').join('');
  ls.querySelectorAll('.it').forEach(el=>el.onclick=ev=>{const c=cands[+el.dataset.i];if(ev.target.dataset.go){confirmPick(c);return}
   setActive(c);if(map){map.panTo({lat:c.lat,lng:c.lng});if(map.getZoom()<15)map.setZoom(15)}})}
 else{ls.style.display='none';ls.innerHTML=''}
}

/* ── 구글 지도 ── */
const PIN=(c,big)=>{const w=big?34:28,h=big?46:38;
 return {url:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="-12 -34 24 35"><path d="M0 0C-2-7-11-12-11-21A11 11 0 1 1 11-21C11-12 2-7 0 0Z" fill="'+c+'" stroke="#fff" stroke-width="1.6"/><circle cy="-21" r="4.2" fill="#fff"/></svg>'),
  scaledSize:new google.maps.Size(w,h),anchor:new google.maps.Point(w/2,h),labelOrigin:new google.maps.Point(w/2,h+11)}};
const LBL=(txt,c)=>({text:txt.length>26?txt.slice(0,25)+'…':txt,color:c,fontWeight:'800',fontSize:'12px',className:'vf-ml'});

async function boot(){
 if(booted)return;booted=true;
 let cfg=null;
 try{cfg=await (await fetch('/api/travel?cfg=1',{cache:'no-store'})).json()}catch(_){}
 if(!cfg||!cfg.ready||!cfg.key){$('off').style.display='flex';return}
 window.__vfInit=initMap;
 const s=document.createElement('script');
 s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(cfg.key)+'&v=weekly&libraries=places&language='+(L==='en'?'en':'ko')+'&region=MY&loading=async&callback=__vfInit';
 s.async=true;s.onerror=()=>{$('off').style.display='flex'};document.head.appendChild(s);
}
function initMap(){
 ready=true;
 map=new google.maps.Map($('gmap'),{center:KL,zoom:11,mapTypeId:mtGet(),disableDefaultUI:true,zoomControl:true,
  zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_BOTTOM},gestureHandling:'greedy',clickableIcons:true});
 mtBtn();
 geocoder=new google.maps.Geocoder();
 map.addListener('click',onMapClick);
 mapUI();
 if($('adr').value.trim().length>=3)search();
}
// 지도/위성 전환 (2026-11-16) — 기본 위성(hybrid), 마지막 고른 것 기억 · 버튼은 오른쪽 위(안내·결과 칸과 겹치지 않게)
function mtGet(){try{const v=localStorage.getItem('hhc_map_type');if(v==='roadmap'||v==='hybrid')return v}catch(_){}return 'hybrid'}
function mtBtn(){
 const b=document.createElement('button');b.type='button';b.className='vf-mt';
 const draw=()=>{const sat=map.getMapTypeId()==='hybrid';b.innerHTML=sat?'🗺️<span>'+(L==='en'?'Map':'지도')+'</span>':'🛰️<span>'+(L==='en'?'Satellite':'위성')+'</span>'};
 b.onclick=()=>{const v=map.getMapTypeId()==='hybrid'?'roadmap':'hybrid';map.setMapTypeId(v);try{localStorage.setItem('hhc_map_type',v)}catch(_){}draw()};
 draw();map.controls[google.maps.ControlPosition.RIGHT_TOP].push(b);
}
function clearCands(){mkC.forEach(m=>m.setMap(null));mkC=[];cands=[]}
function setActive(c){
 active=c;
 if(mkActive){mkActive.setMap(null);mkActive=null}
 mkC.forEach(m=>{const on=c&&m.__c===c;m.setIcon(PIN(on?'#C5221F':'#EA4335',on));m.setZIndex(on?20:10)});
 if(c&&c.custom&&map)mkActive=new google.maps.Marker({map,position:{lat:c.lat,lng:c.lng},icon:PIN('#C5221F',true),zIndex:30});
 mapUI();
}
async function search(){
 clearTimeout(timer);timer=null;
 const q=$('adr').value.trim();if(q.length<3||!map)return;
 const my=++seq;searching=true;showErr('');mapUI();
 try{
  const {Place}=await google.maps.importLibrary('places');
  const r=await Place.searchByText({textQuery:q,fields:['id','displayName','formattedAddress','location'],
   locationBias:{center:KL,radius:50000},region:'my',language:L==='en'?'en':'ko',maxResultCount:6});
  if(my!==seq)return;
  clearCands();setActive(null);
  const ps=r.places||[];
  ps.forEach((p,i)=>{const c={key:'p:'+p.id,named:true,name:(p.displayName||'').trim()||p.formattedAddress,addr:p.formattedAddress||'',lat:p.location.lat(),lng:p.location.lng()};
   const m=new google.maps.Marker({map,position:{lat:c.lat,lng:c.lng},icon:PIN('#EA4335'),label:LBL((ps.length>1?(i+1)+'. ':'')+c.name,'#B3261E'),zIndex:10});
   m.__c=c;m.addListener('click',()=>setActive(c));mkC.push(m);cands.push(c)});
  if(cands.length===1){map.panTo({lat:cands[0].lat,lng:cands[0].lng});map.setZoom(16);setActive(cands[0])}
  else if(cands.length){const b=new google.maps.LatLngBounds();cands.forEach(c=>b.extend({lat:c.lat,lng:c.lng}));map.fitBounds(b,{top:70,bottom:40,left:30,right:60})}
 }catch(e){if(my===seq)showErr(T[L].errNet)}
 finally{if(my===seq){searching=false;mapUI()}}
}
async function onMapClick(e){
 if(!e.latLng)return;
 const c={key:'m:'+e.latLng.toUrlValue(5),custom:true,name:'',addr:'',lat:e.latLng.lat(),lng:e.latLng.lng()};
 if(e.placeId){e.stop&&e.stop();
  try{const {Place}=await google.maps.importLibrary('places');const p=new Place({id:e.placeId});await p.fetchFields({fields:['displayName','formattedAddress','location']});
   c.key='p:'+e.placeId;c.name=p.displayName||'';c.addr=p.formattedAddress||'';if(p.location){c.lat=p.location.lat();c.lng=p.location.lng()}}catch(_){}
 }
 setActive(c);
 if(!c.addr){try{const g=await geocoder.geocode({location:{lat:c.lat,lng:c.lng},language:L==='en'?'en':'ko'});
  const best=(g.results||[])[0];if(best&&active===c){c.addr=best.formatted_address;mapUI()}}catch(_){}}
}
async function confirmPick(c){
 const t=T[L];document.querySelectorAll('#cfm,.it .go').forEach(b=>b.disabled=true);$('ldT').textContent=t.load;$('ld').style.display='flex';showErr('');
 try{
  const r=await fetch('/api/travel?lat='+c.lat.toFixed(6)+'&lng='+c.lng.toFixed(6),{cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(!d.ok){showErr(d.error==='no-route'||d.error==='bad-location'?t.errRoute:t.errNet);mapUI();return}
  // 목록·장소(이름 있는 곳)에서 고르면 요청서 고객명에 넣고, 지도 빈 곳을 눌러 고르면 고객명은 고객이 직접 적음 (2026-11-16)
 c.named=!!String(c.name||'').trim();
 if(!c.name)c.name=(c.addr||'').split(',')[0]||t.myPin;
  chosen=c;res={km:d.km,minutes:d.minutes};active=null;
  if(mkActive){mkActive.setMap(null);mkActive=null}
  mkC.forEach(m=>m.setMap(null));mkC=[];cands=[];
  drawRoute(d.path||[],c);
  $('adr').value=c.name;$('clr').style.display='block';
  render();
  $('sbody').scrollTo({top:0,behavior:'smooth'});
 }catch(_){showErr(t.errNet);mapUI()}
 finally{$('ld').style.display='none'}
}
function clearRoute(){[line,lineBg,mkChosen,mkOrigin].forEach(x=>x&&x.setMap(null));line=lineBg=mkChosen=mkOrigin=null}
function drawRoute(path,c){
 clearRoute();
 const pts=path.map(p=>({lat:p[0],lng:p[1]}));
 if(pts.length>1){
  lineBg=new google.maps.Polyline({map,path:pts,strokeColor:'#fff',strokeWeight:8,strokeOpacity:1,zIndex:1});
  line=new google.maps.Polyline({map,path:pts,strokeColor:'#1A73E8',strokeWeight:5,strokeOpacity:1,zIndex:2});
  mkOrigin=new google.maps.Marker({map,position:pts[0],zIndex:40,label:LBL(T[L].origin,'#0E2350'),
   icon:{url:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#0f2540" stroke="#fff" stroke-width="7"/><g fill="#e3c98a" transform="translate(23 23) scale(0.54)"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg>'),
    scaledSize:new google.maps.Size(30,30),anchor:new google.maps.Point(15,15),labelOrigin:new google.maps.Point(15,40)}});
 }
 mkChosen=new google.maps.Marker({map,position:{lat:c.lat,lng:c.lng},icon:PIN('#1A73E8',true),label:LBL(c.name,'#174EA6'),zIndex:50});
 const b=new google.maps.LatLngBounds();b.extend({lat:c.lat,lng:c.lng});pts.forEach(p=>b.extend(p));
 map.fitBounds(b,{top:70,bottom:40,left:40,right:70});
}

/* ── 입력 ── */
$('adr').addEventListener('input',()=>{const v=$('adr').value;$('clr').style.display=v?'block':'none';clearTimeout(timer);
 if(v.trim().length<3){timer=null;mapUI();return}timer=setTimeout(search,700)});
$('adr').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search();$('adr').blur()}});
$('clr').onclick=()=>{$('adr').value='';$('clr').style.display='none';if(map){clearCands();setActive(null)}showErr('');mapUI();$('adr').focus()};
document.querySelectorAll('.lgb button').forEach(b=>b.onclick=()=>{L=b.dataset.l;render();
 const u=new URL(location.href);if(L==='en')u.searchParams.set('lang','en');else u.searchParams.delete('lang');history.replaceState(null,'',u)});
// ?a=주소 로 열면 창을 열고 그 주소부터 찾아 줌
// 출장점검 면제 확인(패키지 회원 · 30일 이내 무상점검) — 고객관리 발송 링크(c=고객 ID)로 열었을 때만
{const c=(QS.get('c')||'').trim();if(c){fetch('/api/travel?mem=1&c='+encodeURIComponent(c),{cache:'no-store'}).then(r=>r.json()).then(d=>{if(d&&(d.exempt||d.warranty)){MEM=!!d.exempt;WAR=d.warranty?String(d.last||''):'';WARD=d.days===7?7:30;render()}}).catch(()=>{})}}
{const a=(QS.get('a')||'').trim();if(a){$('adr').value=a;$('clr').style.display='block';setTimeout(openSheet,300)}}
render();
</script>
</body>
</html>
