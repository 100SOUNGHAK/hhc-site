  '출장점검비는 <b>점검·원인 진단</b> 비용입니다. 수리 인건비, 냉매, 부품은 점검 후 별도 안내드립니다.',
  '콘도 방문 주차비는 별도입니다 (2시간 이내 RM10).',
  '<b>패키지 회원</b>은 계약기간 내 출장점검이 무상입니다.',
  '서비스 후 30일 이내 1회는 무상점검이 적용됩니다 (기본세척은 7일 이내).'],
 wa:'💬 문의',req:'출장점검 신청하기',
 waMsg:(a,z,f,n)=>'안녕하세요, 출장점검 문의드립니다.\n주소: '+a+'\n'+z+'구역 · 에어컨 '+n+'대 · 예상 RM'+f,
 waMsg0:'안녕하세요, 출장점검 비용 문의드립니다.'},
en:{title:'Check Your Inspection Fee',brand:'Happy Home Care',
 heroK:'INSPECTION VISIT FEE',heroEmpty:'Enter your address and choose your home on the map<br>to see the visit fee for your distance.',
 dist:'Distance',time:'Est. drive',addr:'Address',zone:z=>'Zone '+z,min:'min',
 adrH:'Your address',adrS:'Type your condo name or address and the map moves there. Tap your home on the map to choose it.',ph:'e.g. Solaris Mont Kiara',
 tip0:'Type an address and the map moves there. You can also tap the map to drop a pin.',
 tipN:n=>'<b>'+n+' results</b> — tap the pin for your home.',
 tipNone:'No results. Move the map and tap your home directly.',
 tipDone:'✓ Selected — tap the map again to change it.',
 choose:'Choose this location',myPin:'Pinned location',origin:'Happy Home Care (Desa ParkCity)',reselect:'Change',
 searching:'Searching Google Maps…',load:'Calculating distance with Google Maps…',
 off:'Fee check by address is not available right now.<br>Please see the zone table below or send us your address via 💬 Ask us.',
 errRoute:'We could not find a route to this spot. Please tap closer to a road.',
 errNet:'Connection problem. Please choose the location again.',
 feeH:'Estimated fee',qty:'Air conditioners',qtyS:'Fee covers 1 unit · +RM50 per extra unit',unit:'',
 base:z=>'Visit fee (Zone '+z+')',extra:n=>'Extra inspection × '+n,total:'Total',waitRow:'Choose your address to see the fee.',
 zH:'Fee by zone',zr:['Within 14 km','Within 29 km','Within 49 km','Over 49 km'],
 nH:'Please note',
 notes:['Distance is the <b>Google Maps driving route</b> from our base in Desa ParkCity.',
  'The visit fee covers <b>inspection and diagnosis</b>. Repair labour, refrigerant and parts are quoted after the inspection.',
  'Condo visitor parking is charged separately (RM10 for up to 2 hours).',
  '<b>Package members</b> get free inspection visits during their contract.',
  'One free inspection within 30 days of a service (7 days for basic cleaning).'],
 wa:'💬 Ask us',req:'Request inspection',
 waMsg:(a,z,f,n)=>'Hello, I would like an on-site inspection.\nAddress: '+a+'\nZone '+z+' · '+n+' air-con unit(s) · est. RM'+f,
 waMsg0:'Hello, I have a question about the inspection fee.'}};

const QS=new URLSearchParams(location.search);
let L=QS.get('lang')==='en'?'en':'ko';
let qty=1,res=null,chosen=null,active=null,cands=[],searching=false,ready=false;
let map=null,geocoder=null,mkC=[],mkActive=null,mkChosen=null,mkOrigin=null,line=null,lineBg=null,timer=null,seq=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const zoneOf=km=>ZONES.find(z=>km<=z.max);
const fmt=n=>'RM'+n.toLocaleString('en-MY');

function render(){
 const t=T[L];document.documentElement.lang=L;document.title=(L==='ko'?'출장점검 비용 확인하기':'Check Your Inspection Fee')+' | Happy Home Care';
 document.querySelectorAll('.vf-lgb button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
 $('t-title').textContent=t.title;$('t-brand').textContent=t.brand;$('t-adrH').textContent=t.adrH;$('t-adrS').textContent=t.adrS;
 $('adr').placeholder=t.ph;$('t-feeH').textContent=t.feeH;$('t-qty').textContent=t.qty;$('t-qtyS').textContent=t.qtyS;
 $('qv').textContent=qty+(t.unit?' '+t.unit:'');$('qm').disabled=qty<=1;$('t-zH').textContent=t.zH;$('t-nH').textContent=t.nH;
 $('notes').innerHTML=t.notes.map(n=>'<li>'+n+'</li>').join('');$('off').innerHTML=t.off;
 const z=res?zoneOf(res.km):null,tot=z?z.fee+(qty-1)*EXTRA:0;
 // 히어로
 $('hero').innerHTML=!res
  ?'<div class="k">'+t.heroK+'</div><div class="em">'+t.heroEmpty+'</div>'+zbar(null)
  :'<div class="k">'+t.heroK+'</div><div class="r1"><div class="v"><small>RM</small>'+tot.toLocaleString('en-MY')+'</div><span class="vf-zp">'+t.zone(z.z)+'</span></div>'
   +'<div class="m"><div><div class="k2">'+t.dist+'</div><div class="v2">'+res.km.toFixed(1)+' km</div></div>'
   +'<div><div class="k2">'+t.time+'</div><div class="v2">'+res.minutes+' '+t.min+'</div></div>'
   +'<div><div class="k2">'+t.addr+'</div><div class="v2">'+esc(chosen?chosen.name:'')+'</div></div></div>'+zbar(res.km);
 // 금액
 if(!res)$('rows').innerHTML='<div class="vf-hint" style="margin-top:12px">'+t.waitRow+'</div>';
 else $('rows').innerHTML='<div class="vf-row"><span>'+t.base(z.z)+'</span><span class="v">'+fmt(z.fee)+'</span></div>'
  +(qty>1?'<div class="vf-row"><span>'+t.extra(qty-1)+'</span><span class="v">'+fmt((qty-1)*EXTRA)+'</span></div>':'')
  +'<div class="vf-row tot"><span>'+t.total+'</span><span class="v">'+fmt(tot)+'</span></div>';
 $('ztb').innerHTML=ZONES.map((o,i)=>'<tr class="'+(z&&z.z===o.z?'on':'')+'"><td><span class="zb">'+o.z+'</span></td><td>'+t.zr[i]+'</td><td class="r">'+fmt(o.fee)+'</td></tr>').join('');
 // 하단 버튼
 const a=chosen?(chosen.addr||chosen.name):'';
 $('b-wa').textContent=t.wa;$('b-req').textContent=t.req;
 $('b-wa').href='https://wa.me/'+WA+'?text='+encodeURIComponent(res?t.waMsg(a,z.z,tot,qty):t.waMsg0);
 const rq=new URLSearchParams();if(chosen&&chosen.name)rq.set('nm',chosen.name);   // 의뢰서 「콘도명」 칸에 미리 채움if(L==='en')rq.set('lang','en');
 $('b-req').href='/request'+(rq.toString()?'?'+rq:'');
 mapUI();
}
function zbar(km){
 const on=km==null?-1:ZONES.findIndex(z=>km<=z.max),pct=km==null?null:Math.min(km,65)/65*100;
 return '<div class="vf-zbar"><div class="trk">'+ZONES.map((z,i)=>'<i class="'+(i===on?'on':'')+'"></i>').join('')+'</div>'
  +(pct!=null?'<span class="pin" style="left:'+pct+'%"></span>':'')
  +'<div class="lb">'+ZONES.map((z,i)=>'<span class="'+(i===on?'on':'')+'">'+z.z+' · '+(i<3?z.max+'km':'49km+')+'</span>').join('')+'</div></div>';
}
function mapUI(){
 const t=T[L];
 let tip=t.tip0;if(chosen)tip=t.tipDone;else if(searching)tip=t.searching;else if(cands.length)tip=t.tipN(cands.length);else if($('adr').value.trim().length>=3&&map)tip=t.tipNone;
 $('mtip').innerHTML=tip;$('mtip').style.display=ready?'block':'none';
 const sh=$('sheet');
 if(active&&!(chosen&&chosen.key===active.key)){
  sh.style.display='block';
  sh.innerHTML='<div class="s1">'+esc(active.custom&&!active.name?t.myPin:active.name)+'</div><div class="s2">'+esc(active.addr||'')+'</div><button id="cfm">'+t.choose+'</button>';
  $('cfm').onclick=()=>confirmPick(active);
 }else sh.style.display='none';
 const pk=$('picked');
 if(chosen){pk.style.display='flex';pk.innerHTML='<span style="font-size:18px">📍</span><div><div class="p1">'+esc(chosen.name)+'</div><div class="p2">'+esc(chosen.addr&&chosen.addr!==chosen.name?chosen.addr:'')+'</div></div><button id="rsel">'+t.reselect+'</button>';
  $('rsel').onclick=()=>{chosen=null;res=null;clearRoute();render();$('vf-map').scrollIntoView({behavior:'smooth',block:'center'})}}
 else pk.style.display='none';
}
function showErr(m){const e=$('err');e.textContent=m||'';e.style.display=m?'block':'none'}

/* ── 구글 지도 ── */
const PIN=(c,big)=>{const w=big?34:28,h=big?46:38;
 return {url:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="-12 -34 24 35"><path d="M0 0C-2-7-11-12-11-21A11 11 0 1 1 11-21C11-12 2-7 0 0Z" fill="'+c+'" stroke="#fff" stroke-width="1.6"/><circle cy="-21" r="4.2" fill="#fff"/></svg>'),
  scaledSize:new google.maps.Size(w,h),anchor:new google.maps.Point(w/2,h),labelOrigin:new google.maps.Point(w/2,h+11)}};
const LBL=(txt,c)=>({text:txt.length>26?txt.slice(0,25)+'…':txt,color:c,fontWeight:'800',fontSize:'12px',className:'vf-ml'});

async function boot(){
 render();
 let cfg=null;
 try{cfg=await (await fetch('/api/travel?cfg=1',{cache:'no-store'})).json()}catch(_){}
 if(!cfg||!cfg.ready||!cfg.key){$('off').style.display='flex';return}
 window.__vfInit=initMap;
 const s=document.createElement('script');
 s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(cfg.key)+'&v=weekly&libraries=places&language='+(L==='en'?'en':'ko')+'&region=MY&loading=async&callback=__vfInit';
 s.async=true;s.onerror=()=>{$('off').style.display='flex'};
 document.head.appendChild(s);
}
function initMap(){
 ready=true;
 map=new google.maps.Map($('vf-map'),{center:KL,zoom:11,disableDefaultUI:true,zoomControl:true,
  zoomControlOptions:{position:google.maps.ControlPosition.RIGHT_BOTTOM},gestureHandling:'greedy',clickableIcons:true});
 geocoder=new google.maps.Geocoder();
 map.addListener('click',onMapClick);
 // 이 행이 영문 일부에만 남는 한글을 막기 위해 map 스타일 라벨은 손대지 않음 (구글 기본)
 const style=document.createElement('style');style.textContent='.vf-ml{text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}';document.head.appendChild(style);
 mapUI();
 const a=(QS.get('a')||'').trim();
 if(a){$('adr').value=a;$('clr').style.display='block';search()}
}
function clearCands(){mkC.forEach(m=>m.setMap(null));mkC=[];cands=[]}
function setActive(c){
 active=c;
 if(mkActive){mkActive.setMap(null);mkActive=null}
 mkC.forEach(m=>{const on=c&&m.__c===c;m.setIcon(PIN(on?'#C5221F':'#EA4335',on));m.setZIndex(on?20:10)});
 if(c&&c.custom){mkActive=new google.maps.Marker({map,position:{lat:c.lat,lng:c.lng},icon:PIN('#C5221F',true),zIndex:30})}
 mapUI();
}
async function search(){
 clearTimeout(timer);timer=null;
 const q=$('adr').value.trim();if(q.length<3||!map)return;
 const my=++seq;searching=true;showErr('');mapUI();
 try{
  const {Place}=await google.maps.importLibrary('places');
  const r=await Place.searchByText({textQuery:q,fields:['id','displayName','formattedAddress','location'],
   locationBias:{center:KL,radius:50000},region:'my',language:L==='en'?'en':'ko',maxResultCount:6});
  if(my!==seq)return;
  clearCands();setActive(null);
  (r.places||[]).forEach(p=>{const c={key:'p:'+p.id,name:(p.displayName||'').trim()||p.formattedAddress,addr:p.formattedAddress||'',lat:p.location.lat(),lng:p.location.lng()};
   const m=new google.maps.Marker({map,position:{lat:c.lat,lng:c.lng},icon:PIN('#EA4335'),label:LBL(c.name,'#B3261E'),zIndex:10});
   m.__c=c;m.addListener('click',()=>setActive(c));mkC.push(m);cands.push(c)});
  if(cands.length===1){map.panTo({lat:cands[0].lat,lng:cands[0].lng});map.setZoom(16);setActive(cands[0])}
  else if(cands.length){const b=new google.maps.LatLngBounds();cands.forEach(c=>b.extend({lat:c.lat,lng:c.lng}));map.fitBounds(b,{top:70,bottom:40,left:30,right:60})}
 }catch(e){if(my===seq)showErr(T[L].errNet)}
 finally{if(my===seq){searching=false;mapUI()}}
}
async function onMapClick(e){
 if(!e.latLng)return;
 const c={key:'m:'+e.latLng.toUrlValue(5),custom:true,name:'',addr:'',lat:e.latLng.lat(),lng:e.latLng.lng()};
 if(e.placeId){e.stop&&e.stop();
  try{const {Place}=await google.maps.importLibrary('places');const p=new Place({id:e.placeId});await p.fetchFields({fields:['displayName','formattedAddress','location']});
   c.key='p:'+e.placeId;c.name=p.displayName||'';c.addr=p.formattedAddress||'';if(p.location){c.lat=p.location.lat();c.lng=p.location.lng()}}catch(_){}
 }
 setActive(c);
 if(!c.addr){try{const g=await geocoder.geocode({location:{lat:c.lat,lng:c.lng},language:L==='en'?'en':'ko'});
  const best=(g.results||[])[0];if(best&&active===c){c.addr=best.formatted_address;mapUI()}}catch(_){}}
}
async function confirmPick(c){
 const t=T[L];$('cfm')&&($('cfm').disabled=true);$('t-load').textContent=t.load;$('load').style.display='flex';showErr('');
 try{
  const r=await fetch('/api/travel?lat='+c.lat.toFixed(6)+'&lng='+c.lng.toFixed(6),{cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(!d.ok){showErr(d.error==='no-route'||d.error==='bad-location'?t.errRoute:t.errNet);$('cfm')&&($('cfm').disabled=false);return}
  if(!c.name)c.name=(c.addr||'').split(',')[0]||t.myPin;
  chosen=c;res={km:d.km,minutes:d.minutes};active=null;
  if(mkActive){mkActive.setMap(null);mkActive=null}
  mkC.forEach(m=>m.setMap(m.__c===c?null:map));
  drawRoute(d.path||[],c);
  if(!c.custom||c.key.startsWith('p:')){$('adr').value=c.name;$('clr').style.display='block'}
  render();
  setTimeout(()=>window.scrollTo({top:0,behavior:'smooth'}),700);
 }catch(_){showErr(t.errNet);$('cfm')&&($('cfm').disabled=false)}
 finally{$('load').style.display='none'}
}
function clearRoute(){[line,lineBg,mkChosen,mkOrigin].forEach(x=>x&&x.setMap(null));line=lineBg=mkChosen=mkOrigin=null}
function drawRoute(path,c){
 clearRoute();
 const pts=path.map(p=>({lat:p[0],lng:p[1]}));
 if(pts.length>1){
  lineBg=new google.maps.Polyline({map,path:pts,strokeColor:'#fff',strokeWeight:8,strokeOpacity:1,zIndex:1});
  line=new google.maps.Polyline({map,path:pts,strokeColor:'#1A73E8',strokeWeight:5,strokeOpacity:1,zIndex:2});
  mkOrigin=new google.maps.Marker({map,position:pts[0],zIndex:40,label:LBL(T[L].origin,'#0E2350'),
   icon:{url:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#0f2540" stroke="#fff" stroke-width="7"/><g fill="#e3c98a" transform="translate(23 23) scale(0.54)"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg>'),
    scaledSize:new google.maps.Size(30,30),anchor:new google.maps.Point(15,15),labelOrigin:new google.maps.Point(15,40)}});
 }
 mkChosen=new google.maps.Marker({map,position:{lat:c.lat,lng:c.lng},icon:PIN('#1A73E8',true),label:LBL(c.name,'#174EA6'),zIndex:50});
 const b=new google.maps.LatLngBounds();b.extend({lat:c.lat,lng:c.lng});pts.forEach(p=>b.extend(p));
 map.fitBounds(b,{top:70,bottom:40,left:40,right:70});
}

/* ── 입력 · 버튼 ── */
$('adr').addEventListener('input',()=>{const v=$('adr').value;$('clr').style.display=v?'block':'none';clearTimeout(timer);
 if(v.trim().length<3){timer=null;return}timer=setTimeout(search,700)});
$('adr').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();search();$('adr').blur()}});
$('clr').onclick=()=>{$('adr').value='';$('clr').style.display='none';if(map){clearCands();setActive(null)}chosen=null;res=null;clearRoute();showErr('');render();$('adr').focus()};
$('qm').onclick=()=>{if(qty>1){qty--;render()}};
$('qp').onclick=()=>{if(qty<20){qty++;render()}};
document.querySelectorAll('.vf-lgb button').forEach(b=>b.onclick=()=>{L=b.dataset.l;render();
 const u=new URL(location.href);if(L==='en')u.searchParams.set('lang','en');else u.searchParams.delete('lang');history.replaceState(null,'',u)});
boot();
</script>
</body>
</html>
