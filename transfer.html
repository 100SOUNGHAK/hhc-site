.tf-done{padding:56px 24px 24px;text-align:center}
.tf-done .ck{width:84px;height:84px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:40px;color:var(--navy-950);
  background:linear-gradient(145deg,#f7e8bd,var(--gold-500));box-shadow:0 14px 30px -12px rgba(201,164,76,.9)}
@media (prefers-reduced-motion:no-preference){.tf-done .ck{animation:tfPop .5s var(--ease) both}}
@keyframes tfPop{from{transform:scale(.5);opacity:0}}
.tf-done h3{margin-top:18px;font-size:23px;font-weight:850;letter-spacing:-.03em}
.tf-done p{margin-top:8px;font-size:15.5px;color:var(--ink-600)}
.tf-done .no{display:inline-block;margin-top:14px;padding:6px 14px;border-radius:999px;font-size:14px;font-weight:800;background:var(--gold-50);color:var(--gold-700)}
.tf-done .sm{margin:22px auto 0;max-width:360px;text-align:left;padding:16px;border-radius:18px;background:var(--paper);box-shadow:var(--e1);font-size:14.5px;color:var(--ink-700)}
.tf-done .sm div{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.tf-done .sm span{color:var(--ink-400);flex:none}
.tf-done .sm b{text-align:right}

@media print{.tf{display:none!important}}

    else if(mt){F.tr[+mt[2]][{n:'name',c:'condo',p:'phone',a:'amt'}[mt[1]]]=t.value;var s2=document.getElementById('tf-tsum'),w=tTotal();if(s2)s2.textContent=L().tN(fmt(w.a),w.n);var o2=document.getElementById('tf-tover');if(o2)o2.hidden=!(BAL&&w.a>BAL+0.005);}
    else F[k]=t.value;
    var f=t.closest('.tf-f');if(f&&f.classList.contains('bad')){f.classList.remove('bad');clearErr();}
  });
  el.addEventListener('change',function(e){if(e.target.id==='tf-agree'){F.agree=e.target.checked;var a=e.target.closest('.tf-sec');if(a&&a.classList.contains('bad')){a.classList.remove('bad');clearErr();}}});
  el.addEventListener('click',function(e){
    var b=e.target.closest('button,[data-close]');if(!b)return;
    if(b.dataset.close){close();return;}
    if(b.dataset.kind){F.kind=b.dataset.kind;if(window.TW)TW.setMode(F.kind);el.querySelectorAll('[data-kind]').forEach(function(x){x.classList.toggle('on',x.dataset.kind===F.kind);});
      document.getElementById('tf-s4').innerHTML=s4HTML();return;}
    if(b.dataset.seg){F[b.dataset.seg]=b.dataset.v;
      if(b.dataset.seg==='amtMode'&&b.dataset.v==='all')F.tr=F.tr.slice(0,1);
      if(b.dataset.seg==='reason'){b.parentNode.querySelectorAll('button').forEach(function(x){x.classList.toggle('on',x===b);});b.closest('.tf-sec').classList.remove('bad');clearErr();}
      else document.getElementById('tf-s4').innerHTML=s4HTML();return;}
    if(b.dataset.addtr){F.tr.push(newTr());F.amtMode='part';document.getElementById('tf-s4').innerHTML=s4HTML();
      var tn=el.querySelectorAll('[data-k^="tn"]');if(tn.length)tn[tn.length-1].focus();return;}
    if(b.dataset.rmt){F.tr.splice(+b.dataset.rmt,1);document.getElementById('tf-s4').innerHTML=s4HTML();return;}
    if(b.dataset.me){var v=F.rows[+b.dataset.me];v.name=F.name;v.condo=F.condo;v.phone=F.phone;document.getElementById('tf-s4').innerHTML=s4HTML();clearErr();return;}
    if(b.dataset.addrow){F.rows.push(newV());document.getElementById('tf-s4').innerHTML=s4HTML();
      var ins=el.querySelectorAll('[data-k^="va"]');if(ins.length)ins[ins.length-1].focus();return;}
    if(b.dataset.rm){F.rows.splice(+b.dataset.rm,1);document.getElementById('tf-s4').innerHTML=s4HTML();return;}
    if(b.id==='tf-send')submit();
  });
  function clearErr(){err='';var x=document.getElementById('tf-err');if(x)x.classList.remove('on');}
  function digits(p){return String(p||'').replace(/\D/g,'');}
  function check(){
    var l=L().e;
    if(!F.reason)return ['reason',l.reason];
    if(!F.name.trim())return ['name',l.name];
    if(!F.condo.trim())return ['condo',l.condo];
    if(digits(F.phone).length<9)return ['phone',l.phone];
    if(F.kind==='t'){
      for(var i=0;i<F.tr.length;i++){var r=F.tr[i];
        if(!r.name.trim())return ['tn'+i,l.tName];
        if(!r.condo.trim())return ['tc'+i,l.tCondo];
        if(digits(r.phone).length<9)return ['tp'+i,l.tPhone];
        if(F.amtMode==='part'&&!(num(r.amt)>0))return ['ta'+i,l.amt];}
    }else if(F.vMode==='split'){
      if(!(vTotal().n>0))return ['va0',l.rows];
      for(var j=0;j<F.rows.length;j++){var v=F.rows[j];
        if(!(num(v.amt)>0&&Math.floor(num(v.qty))>0))return ['va'+j,l.rows];
        if(!String(v.name).trim())return ['vn'+j,l.vName];
        if(!String(v.condo).trim())return ['vc'+j,l.vCondo];
        if(digits(v.phone).length<9)return ['vp'+j,l.vPhone];}
    }
    if(!F.agree)return ['agree',l.agree];
    return null;
  }
  function showErr(k,msg){
    err=msg;var box=document.getElementById('tf-err');box.textContent=msg;box.classList.add('on');
    var f=el.querySelector('.tf-f[data-f="'+k+'"]')||el.querySelector('[data-f="'+k+'"]');
    if(f){f.classList.add('bad');var inp=k==='reason'?null:f.querySelector('input');(f.scrollIntoView&&f.scrollIntoView({block:'center',behavior:'smooth'}));if(inp&&inp.type!=='checkbox')setTimeout(function(){inp.focus({preventScroll:true});},300);}
  }
  async function submit(){
    if(busy)return;
    var c=check();if(c){showErr(c[0],c[1]);return;}
    err='';document.getElementById('tf-err').classList.remove('on');
    var vt=vTotal();
    var data={kind:F.kind==='t'?'transfer':'voucher',reason:F.reason,leave_date:F.leave,name:F.name.trim(),condo:F.condo.trim(),phone:F.phone.trim(),contract_no:F.no.trim(),
      remarks:F.remarks.trim(),lang:lang(),agree:true};
    if(BAL){data.bal_shown=BAL;if(BD)data.bal_date=BD;}
    var tt=tTotal();
    if(F.kind==='t'){data.amt_mode=F.amtMode;
      data.recipients=F.tr.map(function(r){var o={name:r.name.trim(),condo:r.condo.trim(),phone:r.phone.trim()};if(F.amtMode==='part')o.amt=num(r.amt);return o;});}
    else{data.v_mode=F.vMode;if(F.vMode==='split')data.vouchers=F.rows.filter(function(r){return num(r.amt)>0&&Math.floor(num(r.qty))>0;})
      .map(function(r){return {amt:num(r.amt),qty:Math.floor(num(r.qty)),to:String(r.name||'').trim(),condo:String(r.condo||'').trim(),phone:String(r.phone||'').trim()};});}
    busy=true;var sb=document.getElementById('tf-send');sb.disabled=true;sb.textContent=L().sending;
    try{
      var r=await fetch('/api/transfer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
      var j=await r.json().catch(function(){return {};});
      if(!r.ok||!j.ok)throw new Error(j.error||('http '+r.status));
      done={kind:F.kind,reason:F.reason,to_name:F.tr.map(function(r){return r.name.trim();}).join(', '),amt_mode:F.amtMode,t_total:tt.a,t_count:tt.n,v_mode:F.vMode,v_total:vt.a,v_count:vt.n,ref:j.ref||''};
      busy=false;paint();el.scrollTop=0;
      F.remarks='';F.tr=[newTr()];F.rows=[newV()];F.agree=false;
    }catch(e){
      busy=false;sb.disabled=false;sb.textContent=L().send;showErr('',L().e.net);
    }
  }
  document.getElementById('bWa').addEventListener('click',function(e){e.preventDefault();open();});
  if(location.hash==='#apply')setTimeout(open,50);
})();
</script>
