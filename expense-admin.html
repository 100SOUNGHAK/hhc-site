<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Happy Home Care 비용청구서</title>
<style>
:root{
  --navy:#0F1729;--indigo:#4F6EF7;--il:#eef1fe;--gold:#E8A838;--green:#10b981;--gbg:#d1fae5;--red:#ef4444;--rbg:#fee2e2;--abg:#fef3c7;--amber:#d97706;--gray:#6b7280;--bdr:rgba(0,0,0,.09);--sf:#fff;--bg:#f4f6fb;--txt:#0f172a;--txt2:#475569;--r:12px;--bb:64px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{background:var(--bg);color:var(--txt);padding-bottom:calc(var(--bb) + 20px)}
input,select,textarea{font-family:inherit;font-size:14px;padding:9px 11px;border:0.5px solid #dde1ee;border-radius:8px;background:#f8f9fc;color:var(--txt);width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--indigo);background:#fff}
textarea{resize:vertical}
button{font-family:inherit;cursor:pointer}
.hd{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.hd-l{display:flex;align-items:center;gap:9px}
.hd-logo{width:30px;height:30px;background:linear-gradient(160deg,#0BB5A4,#0D9488);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.hd-title{font-size:14px;font-weight:700}
.tabs{display:flex;background:#fff;border-bottom:0.5px solid var(--bdr);position:sticky;top:56px;z-index:40}
.tab{flex:1;text-align:center;padding:12px 4px;border:none;background:none;font-size:12.5px;font-weight:600;color:var(--gray);border-bottom:2.5px solid transparent}
.tab.active{color:var(--indigo);border-bottom-color:var(--indigo)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--sf);border:0.5px solid var(--bdr);border-radius:var(--r);margin-bottom:14px;overflow:hidden;box-shadow:0 1px 2px rgba(16,30,60,.03)}
.card-hdr{padding:13px 16px;background:#f8f9fc;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.card-body{padding:14px 16px}
.f{margin-bottom:10px}
.f:last-child{margin-bottom:0}
.lb{font-size:11px;color:var(--gray);font-weight:600;margin-bottom:4px;display:block}
.fg{display:flex;gap:8px}
.fg.c2>.f{flex:1}
.btn-add{width:100%;padding:10px;border:1.5px dashed var(--indigo);background:var(--il);color:var(--indigo);border-radius:9px;font-size:13px;font-weight:700}
.total-box{background:var(--navy);border-radius:var(--r);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.total-lbl{font-size:12px;color:rgba(255,255,255,.6)}
.total-val{font-size:19px;font-weight:800;color:#fff}
.btn{padding:11px 16px;border-radius:9px;font-size:13px;font-weight:700;border:none;cursor:pointer}
.bp{background:var(--indigo);color:#fff}
.bgh{background:#f1f3f8;color:var(--txt2)}
.br{background:var(--rbg);color:var(--red)}
.bfu{width:100%}
.row-fg{display:flex;gap:8px}
.row-fg>.btn{flex:1}
.list-card{background:var(--sf);border:0.5px solid var(--bdr);border-radius:var(--r);padding:14px;margin-bottom:10px;cursor:pointer}
.list-title{font-size:14px;font-weight:700;color:var(--txt)}
.list-sub{font-size:11.5px;color:var(--gray);margin-top:3px}
.list-amt{font-size:15px;font-weight:800;color:var(--navy);margin-top:6px}
.list-actions{display:flex;gap:6px;margin-top:10px}
.list-actions button{flex:1;padding:7px;font-size:11.5px;border-radius:7px;border:none}
.empty{text-align:center;padding:40px 20px;color:var(--gray);font-size:13px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:999;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.year-tabs{display:flex;gap:8px;flex-wrap:wrap;padding:0 0 12px}
.yt{padding:6px 14px;border-radius:20px;border:0.5px solid var(--bdr);background:#fff;font-size:12px;font-weight:600;color:var(--gray)}
.yt.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.hidden{display:none!important}
.pending-item{background:#f8f9fc;border-radius:9px;padding:10px 12px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.pending-item.sel{background:var(--il);border:1.5px solid var(--indigo)}
.pi-info{flex:1;min-width:0}
.pi-date{font-size:11px;color:var(--gray)}
.pi-cat{font-size:12.5px;font-weight:600;color:var(--txt);margin-top:1px}
.pi-amt{font-size:13px;font-weight:700;color:var(--navy);flex-shrink:0}
</style>
</head>
<body>

<div class="hd">
  <div class="hd-l"><div class="hd-logo">H</div><div class="hd-title" id="hd-title-lbl">비용청구서</div></div>
  <div style="display:flex;align-items:center;gap:8px">
    <button onclick="setUILang('ko')" id="ui-lang-ko" style="background:rgba(255,255,255,.15);color:#fff;border:none;padding:5px 10px;border-radius:14px;font-size:10.5px;font-weight:700">한글</button>
    <button onclick="setUILang('en')" id="ui-lang-en" style="background:none;color:rgba(255,255,255,.6);border:none;padding:5px 10px;border-radius:14px;font-size:10.5px;font-weight:700">EN</button>
    <div id="fb-status" style="font-size:10px;color:rgba(255,255,255,.5)">연결 중...</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" id="tb-entry" onclick="Tab('entry')">항목 등록</button>
  <button class="tab" id="tb-gen" onclick="Tab('gen')">청구서 생성</button>
  <button class="tab" id="tb-list" onclick="Tab('list')">청구 이력</button>
  <button class="tab" id="tb-acc" onclick="Tab('acc')">회계 정리</button>
</div>

<div class="wrap">

  <div id="tab-entry">
    <div class="card">
      <div class="card-hdr">항목 등록</div>
      <div class="card-body">
        <div class="fg c2">
          <div class="f"><label class="lb">일자</label><input id="qi-date" type="date"></div>
          <div class="f"><label class="lb">품목</label><select id="qi-cat" onchange="onQiCatChange()"></select></div>
        </div>
        <div id="qi-cat-custom-wrap" class="hidden f">
          <label class="lb">직접 입력한 품목명</label><input id="qi-cat-custom" placeholder="품목명 입력">
        </div>
        <div class="fg c2">
          <div class="f"><label class="lb">금액</label><input id="qi-amount" type="number" min="0" step="0.5" placeholder="0"></div>
          <div class="f"><label class="lb">비고</label><input id="qi-note" type="text" placeholder="선택 입력"></div>
        </div>
        <button class="btn-add" onclick="quickAddItem()">+ 항목 등록</button>
      </div>
    </div>

    <div class="card">
      <div class="card-hdr"><span>미청구 항목</span><span id="pending-count" style="font-size:11px;color:var(--gray);font-weight:600">0건</span></div>
      <div class="card-body">
        <div class="row-fg" style="margin-bottom:10px">
          <button class="yt active" id="pend-srt-desc" onclick="sortPending('date_desc')" style="flex:1">최신순</button>
          <button class="yt" id="pend-srt-asc" onclick="sortPending('date_asc')" style="flex:1">과거순</button>
          <button class="yt" id="pend-srt-cat" onclick="sortPending('cat')" style="flex:1">품목별</button>
        </div>
        <div id="pending-list"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-hdr"><span id="claimed-hdr-lbl">청구완료 항목</span><span id="claimed-count" style="font-size:11px;color:var(--gray);font-weight:600">0건</span></div>
      <div class="card-body">
        <div id="claimed-list"></div>
      </div>
    </div>
  </div>

  <div id="tab-gen" class="hidden">
    <div class="card">
      <div class="card-hdr">청구대상기간 선택</div>
      <div class="card-body">
        <div class="fg c2">
          <div class="f"><label class="lb">시작일</label><input id="gen-period-start" type="date"></div>
          <div class="f"><label class="lb">종료일</label><input id="gen-period-end" type="date"></div>
        </div>
        <button class="btn-add" onclick="generatePreview()">해당 기간 항목 불러오기</button>
      </div>
    </div>

    <div id="gen-preview-wrap" class="hidden">
      <div class="card">
        <div class="card-hdr"><span>포함될 항목</span><span id="gen-item-count" style="font-size:11px;color:var(--gray);font-weight:600">0건</span></div>
        <div class="card-body">
          <div class="row-fg" style="margin-bottom:10px">
            <button class="yt active" id="gen-srt-desc" onclick="sortGenCandidates('date_desc')" style="flex:1">최근순</button>
            <button class="yt" id="gen-srt-asc" onclick="sortGenCandidates('date_asc')" style="flex:1">과거순</button>
            <button class="yt" id="gen-srt-cat" onclick="sortGenCandidates('cat')" style="flex:1">품목별</button>
          </div>
          <div id="gen-item-list"></div>
        </div>
      </div>

      <div class="total-box">
        <span class="total-lbl">총 청구금액</span>
        <span class="total-val" id="gen-total-val">RM 0.00</span>
      </div>

      <div class="card">
        <div class="card-hdr">청구서 정보</div>
        <div class="card-body">
          <div class="f"><label class="lb">제목</label><input id="gen-title" placeholder="예: 7월 현장 경비 청구"></div>
          <div class="f"><label class="lb">청구일자</label><input id="gen-claim-date" type="date"></div>
          <div class="f">
            <label class="lb">입금계좌</label>
            <select id="gen-bank-select" onchange="onBankSelectChange()"></select>
          </div>
          <div id="new-bank-form" class="hidden" style="background:#f8f9fc;border-radius:9px;padding:11px;margin-top:8px">
            <div class="f"><label class="lb">은행명</label><input id="nb-bank" placeholder="예: Maybank"></div>
            <div class="f"><label class="lb">계좌번호</label><input id="nb-num" placeholder="예: 1234567890"></div>
            <div class="f"><label class="lb">예금주</label><input id="nb-name" placeholder="예: HAPPY WORKS SERVICES SDN.BHD."></div>
            <button class="btn-add" onclick="saveNewBankAccount()">계좌 저장</button>
          </div>
        </div>
      </div>

      <div class="row-fg" style="margin-bottom:10px">
        <button class="yt active" id="lang-ko" onclick="setLang('ko')" style="flex:1">한국어</button>
        <button class="yt" id="lang-en" onclick="setLang('en')" style="flex:1">English</button>
      </div>

      <div class="row-fg" style="margin-bottom:10px">
        <button class="btn bgh bfu" onclick="printClaim(null)">인쇄 미리보기</button>
        <button class="btn bfu" style="background:#25D366;color:#fff" onclick="sendWA(null)">왓츠앱 미리보기</button>
      </div>
      <div class="row-fg" style="margin-bottom:20px">
        <button class="btn bp bfu" onclick="createClaim()" id="btn-create">청구서 생성 (항목 청구완료 처리)</button>
      </div>
    </div>
  </div>

  <div id="tab-list" class="hidden">
    <div class="year-tabs" id="year-tabs"></div>
    <div class="row-fg" style="margin-bottom:14px">
      <button class="btn bgh bfu" onclick="exportCSV()" id="csv-btn-lbl">CSV 내보내기 (선택 연도 전체)</button>
    </div>
    <div id="claim-list"></div>
  </div>

  <div id="tab-acc" class="hidden">
    <div class="year-tabs" id="acc-year-tabs"></div>
    <div class="row-fg" style="margin-bottom:14px">
      <button class="btn bgh bfu" onclick="exportAccCSV()" id="acc-csv-btn-lbl">CSV 내보내기 (선택 연도 전체)</button>
    </div>
    <div class="total-box">
      <span class="total-lbl" id="acc-total-lbl">선택 연도 총 청구금액</span>
      <span class="total-val" id="acc-year-total">RM 0.00</span>
    </div>
    <div class="card">
      <div class="card-hdr" id="acc-month-hdr">월별 청구 현황</div>
      <div class="card-body" id="acc-month-body"></div>
    </div>
    <div class="card">
      <div class="card-hdr" id="acc-cat-hdr">품목별 합계</div>
      <div class="card-body" id="acc-cat-body"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<div id="view-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center">
  <div style="background:#fff;width:100%;max-width:640px;max-height:92vh;border-radius:16px 16px 0 0;overflow-y:auto;padding:0">
    <div style="position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:0.5px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;z-index:2">
      <span style="font-weight:700;font-size:15px">청구서 보기</span>
      <button onclick="document.getElementById('view-modal').classList.add('hidden')" style="background:none;border:none;font-size:22px;color:var(--gray)">&times;</button>
    </div>
    <div id="view-body" style="padding:18px"></div>
    <div style="padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-top:0.5px solid var(--bdr)">
      <div class="row-fg">
        <button class="btn bgh bfu" onclick="printClaim(currentViewId)">인쇄</button>
        <button class="btn bfu" style="background:#25D366;color:#fff" onclick="sendWA(currentViewId)">왓츠앱</button>
      </div>
      <div class="row-fg">
        <button class="btn bgh bfu" onclick="downloadImage(currentViewId)">이미지 저장</button>
        <button class="btn bgh bfu" onclick="downloadPDF(currentViewId)">PDF 저장</button>
      </div>
    </div>
  </div>
</div>

<div id="edit-claim-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:flex-end;justify-content:center">
  <div style="background:#fff;width:100%;max-width:640px;max-height:92vh;border-radius:16px 16px 0 0;overflow-y:auto;padding:0">
    <div style="position:sticky;top:0;background:#fff;padding:14px 16px;border-bottom:0.5px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;z-index:2">
      <span style="font-weight:700;font-size:15px">청구서 수정</span>
      <button onclick="document.getElementById('edit-claim-modal').classList.add('hidden')" style="background:none;border:none;font-size:22px;color:var(--gray)">&times;</button>
    </div>
    <div style="padding:16px">
      <div class="f"><label class="lb">제목</label><input id="ec-title"></div>
      <div class="f"><label class="lb">포함된 항목</label><div id="ec-item-list"></div></div>
      <div style="background:#f8f9fc;border-radius:9px;padding:11px;margin-top:8px">
        <div class="lb" style="margin-bottom:6px">+ 새 항목 추가</div>
        <div class="fg c2">
          <div class="f"><input id="ec-new-date" type="date"></div>
          <div class="f"><select id="ec-new-cat"></select></div>
        </div>
        <div class="fg c2">
          <div class="f"><input id="ec-new-amount" type="number" min="0" step="0.5" placeholder="금액"></div>
          <div class="f"><input id="ec-new-note" placeholder="비고 (선택)"></div>
        </div>
        <button class="btn-add" onclick="addEcItem()">항목 추가</button>
      </div>
      <div class="total-box" style="margin-top:14px">
        <span class="total-lbl">수정 후 총액</span>
        <span class="total-val" id="ec-total-val">RM 0.00</span>
      </div>
      <button class="btn bp bfu" onclick="saveEditClaim()" style="margin-bottom:20px">수정 내용 저장</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
var FB_CFG={apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",authDomain:"happywork-packageplan.firebaseapp.com",projectId:"happywork-packageplan",storageBucket:"happywork-packageplan.firebasestorage.app",messagingSenderId:"101289103022",appId:"1:101289103022:web:d81aca7f3747dd26df673f"};
firebase.initializeApp(FB_CFG);
var DB=firebase.firestore();

var CATS=['유류비','차량관리비','교통비','식대','자재비','커튼세탁비','비품 및 장비','통신비','전기료','수도료','임대료(29 Kepong)','임대료(139 Nadia)','직원급여','기타'];
var CATS_EN={'유류비':'Fuel','차량관리비':'Vehicle Maintenance','교통비':'Transport','식대':'Meals','자재비':'Materials','커튼세탁비':'Curtain Cleaning','비품 및 장비':'Supplies & Equipment','통신비':'Communication','전기료':'Electricity','수도료':'Water','임대료(29 Kepong)':'Rent (29 Kepong)','임대료(139 Nadia)':'Rent (139 Nadia)','직원급여':'Staff Salary','기타':'Others'};
var curLang='ko';
var allItems=[];
var claims=[];
var genItems=[];
var genCandidates=[];
var genSelectedIds={};
var genSortMode='date_desc';
var bankAccounts=[];
var currentViewId=null;
var selYear=new Date().getFullYear();

function $(id){return document.getElementById(id);}
function val(id){var e=$(id);return e?e.value:'';}
function setVal(id,v){var e=$(id);if(e)e.value=v;}
function showToast(msg){var t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('show');},2500);}
function fmtAmt(n){return 'RM '+Number(n||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function mdFromDate(ds){if(!ds)return'';var p=ds.split('-');return p.length===3?p[1]+'/'+p[2]:ds;}
function fillCatSelect(id){var el=$(id);if(!el)return;el.innerHTML=CATS.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('')+'<option value="__custom__">+ 직접입력</option>';}
window.onQiCatChange=function(){
  var v=val('qi-cat');
  $('qi-cat-custom-wrap').classList.toggle('hidden',v!=='__custom__');
};
function getQiCatValue(){
  var v=val('qi-cat');
  if(v==='__custom__')return val('qi-cat-custom').trim();
  return v;
}

window.Tab=function(t){
  $('tab-entry').classList.toggle('hidden',t!=='entry');
  $('tab-gen').classList.toggle('hidden',t!=='gen');
  $('tab-list').classList.toggle('hidden',t!=='list');
  $('tab-acc').classList.toggle('hidden',t!=='acc');
  $('tb-entry').classList.toggle('active',t==='entry');
  $('tb-gen').classList.toggle('active',t==='gen');
  $('tb-list').classList.toggle('active',t==='list');
  $('tb-acc').classList.toggle('active',t==='acc');
  if(t==='entry'){renderPendingList();renderClaimedList();}
  if(t==='list'){renderYearTabs();renderClaimList();}
  if(t==='acc'){renderAccYearTabs();renderAccounting();}
};

async function quickAddItem(){
  var date=val('qi-date')||todayStr();
  var cat=getQiCatValue()||CATS[0];
  var amount=parseFloat(val('qi-amount'))||0;
  var note=val('qi-note').trim();
  if(!cat){showToast('품목을 입력해 주세요');return;}
  if(amount<=0){showToast('금액을 입력해 주세요');return;}
  try{
    await DB.collection('expense_items').add({date:date,cat:cat,amount:amount,note:note,claimed:false,claimId:null,createdAt:new Date().toISOString()});
    setVal('qi-amount','');setVal('qi-note','');setVal('qi-cat-custom','');
    setVal('qi-date',todayStr());
    showToast('항목 등록됨');
  }catch(e){console.error(e);showToast('등록 실패: '+e.message);}
}
window.quickAddItem=quickAddItem;

async function deletePendingItem(id){
  if(!confirm('이 항목을 삭제할까요?'))return;
  try{await DB.collection('expense_items').doc(id).delete();showToast('삭제됨');}
  catch(e){showToast('삭제 실패');}
}

function renderGenPreview(){

  $('gen-item-count').textContent=selCount+' / '+genCandidates.length+'건 선택';

  var html='';

  genCandidates.forEach(function(it){
    if(genSortMode==='cat'&&it.cat!==lastCat){

      '<div class="pi-info">'+
        '<div class="pi-cat">'+it.cat+'</div>'+

      '</div>'+

window.toggleGenCategoryGroup=function(safeId){

async function createClaim(){
  var selected=getSelectedGenItems();
  if(!selected.length){showToast('포함할 항목을 1건 이상 선택해 주세요');return;}
  var title=val('gen-title').trim();
  if(!title){showToast('제목을 입력해 주세요');return;}
  var total=selected.reduce(function(s,i){return s+(parseFloat(i.amount)||0);},0);
  var data={
    title:title,
    periodStart:val('gen-period-start'),
    periodEnd:val('gen-period-end'),
    claimDate:val('gen-claim-date')||todayStr(),
    items:selected.map(function(i){return{date:i.date,cat:i.cat,amount:i.amount,note:i.note};}),
    itemIds:selected.map(function(i){return i._id;}),
    bankInfo:getSelectedBankInfo(),
    total:total,
    createdAt:new Date().toISOString()
  };
  var btn=$('btn-create');btn.disabled=true;btn.textContent='생성 중...';
  try{
    var ref=await DB.collection('expense_claims').add(data);
    var savedId=ref.id;
    var batch=DB.batch();
    selected.forEach(function(i){
      batch.update(DB.collection('expense_items').doc(i._id),{claimed:true,claimId:savedId});
    });
    await batch.commit();
    showToast('청구서 생성 완료');
    claims.unshift(Object.assign({_id:savedId},data));
    genCandidates=[];genSelectedIds={};
    setVal('gen-period-start','');setVal('gen-period-end','');setVal('gen-title','');
    setVal('gen-bank-select','');$('new-bank-form').classList.add('hidden');
    $('gen-preview-wrap').classList.add('hidden');
    viewClaim(savedId);
  }catch(e){
    console.error(e);showToast('생성 실패: '+e.message);
  }
  btn.disabled=false;btn.textContent='청구서 생성 (항목 청구완료 처리)';
}

var _trCache={};
function tr(text){
  return new Promise(function(resolve){
    if(!text){resolve('');return;}
    if(curLang!=='en'){resolve(text);return;}
    if(_trCache[text]){resolve(_trCache[text]);return;}
    fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=en&dt=t&q='+encodeURIComponent(text))
      .then(function(r){return r.json();})
      .then(function(j){
        var out=(j&&j[0])?j[0].map(function(seg){return seg[0];}).join(''):text;
        _trCache[text]=out;resolve(out);
      }).catch(function(){resolve(text);});
  });
}

async function buildClaimText(id){
  var d=getClaimData(id);
  if(!d)return'';
  var isEn=curLang==='en';
  var title=d.title||(isEn?'(No title)':'(제목 없음)');
  if(isEn)title=await tr(title);
  var lines=[];
  lines.push((isEn?'Expense Claim: ':'비용청구서: ')+title);
  if(d.periodStart&&d.periodEnd)lines.push((isEn?'Claim Period: ':'청구대상기간: ')+d.periodStart+' ~ '+d.periodEnd);
  lines.push((isEn?'Claim Date: ':'청구일자: ')+(d.claimDate||'—'));
  lines.push('');
  for(var i=0;i<d.items.length;i++){
    var it=d.items[i];
    var cat=isEn?(CATS_EN[it.cat]||it.cat):it.cat;
    var note=it.note?await tr(it.note):'';
    lines.push('- '+mdFromDate(it.date)+' '+cat+' - '+fmtAmt(it.amount)+(note?' ('+note+')':''));
  }
  lines.push('');
  lines.push((isEn?'Total Claimed: ':'총 청구금액: ')+fmtAmt(d.total));
  if(d.bankInfo){
    lines.push('');
    lines.push((isEn?'Deposit Account: ':'입금계좌: ')+d.bankInfo.bankName+' '+d.bankInfo.accountNum+' ('+d.bankInfo.accountName+')');
  }
  return lines.join('\n');
}

  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Expense Claim</title><style>body{padding:32px;max-width:700px;margin:0 auto}table{width:100%}td,th{padding:8px 10px;font-size:12px;border-bottom:1px solid #e2e8f0}</style></head><body>'+bodyHtml+'</body></html>';
  var w=window.open('','_blank');
  w.document.write(html);
  w.document.close();
  setTimeout(function(){w.print();},400);
}
window.printClaim=printClaim;

var editClaimId=null;
var editClaimItems=[];

window.openEditClaim=function(id){
  var c=claims.find(function(x){return x._id===id;});
  if(!c)return;
  editClaimId=id;
  setVal('ec-title',c.title||'');
  var itemIds=c.itemIds||[];
  editClaimItems=(c.items||[]).map(function(it,idx){
    return {date:it.date,cat:it.cat,amount:it.amount,note:it.note,_srcItemId:itemIds[idx]||null,_isNew:false};
  });
  fillCatSelect('ec-new-cat');
  setVal('ec-new-date',todayStr());
  renderEcItems();
  $('edit-claim-modal').classList.remove('hidden');
};

function renderEcItems(){
  var el=$('ec-item-list');
  if(!editClaimItems.length){el.innerHTML='<div class="empty">항목이 없습니다</div>';}
  else{
    el.innerHTML=editClaimItems.map(function(it,idx){
      return '<div class="pending-item">'+
        '<div class="pi-info">'+
          '<div class="pi-cat">'+it.cat+(it._isNew?' <span style="color:#0D9488;font-size:10px">(신규)</span>':'')+'</div>'+
          '<div class="pi-date">'+mdFromDate(it.date)+(it.note?' · '+it.note:'')+'</div>'+
        '</div>'+
        '<div class="pi-amt">'+fmtAmt(it.amount)+'</div>'+
        '<button onclick="removeEcItem('+idx+')" style="background:none;border:none;color:var(--red);font-size:15px;padding:2px 4px">×</button>'+
      '</div>';
    }).join('');
  }
  var total=editClaimItems.reduce(function(s,i){return s+(parseFloat(i.amount)||0);},0);
  $('ec-total-val').textContent=fmtAmt(total);
}
window.removeEcItem=function(idx){
  editClaimItems.splice(idx,1);
  renderEcItems();
};
window.addEcItem=function(){
  var date=val('ec-new-date')||todayStr();
  var cat=val('ec-new-cat')||CATS[0];
  var amount=parseFloat(val('ec-new-amount'))||0;
  var note=val('ec-new-note').trim();
  if(amount<=0){showToast('금액을 입력해 주세요');return;}
  editClaimItems.push({date:date,cat:cat,amount:amount,note:note,_srcItemId:null,_isNew:true});
  setVal('ec-new-amount','');setVal('ec-new-note','');
  renderEcItems();
};

async function saveEditClaim(){
  if(!editClaimId)return;
  var title=val('ec-title').trim();
  if(!title){showToast('제목을 입력해 주세요');return;}
  var c=claims.find(function(x){return x._id===editClaimId;});
  var originalItemIds=(c&&c.itemIds)||[];
  var keptItemIds=editClaimItems.filter(function(i){return i._srcItemId;}).map(function(i){return i._srcItemId;});
  var removedItemIds=originalItemIds.filter(function(id){return keptItemIds.indexOf(id)<0;});
  try{
    var batch=DB.batch();
    // 삭제된 항목 -> 미청구로 복원
    removedItemIds.forEach(function(iid){
      batch.update(DB.collection('expense_items').doc(iid),{claimed:false,claimId:null});
    });
    await batch.commit();
    // 새로 추가된 항목 -> expense_items 문서 생성
    for(var i=0;i<editClaimItems.length;i++){
      if(editClaimItems[i]._isNew){
        var ref=await DB.collection('expense_items').add({date:editClaimItems[i].date,cat:editClaimItems[i].cat,amount:editClaimItems[i].amount,note:editClaimItems[i].note,claimed:true,claimId:editClaimId,createdAt:new Date().toISOString()});
        editClaimItems[i]._srcItemId=ref.id;
        editClaimItems[i]._isNew=false;
      }
    }
    var total=editClaimItems.reduce(function(s,i){return s+(parseFloat(i.amount)||0);},0);
    var newItemIds=editClaimItems.map(function(i){return i._srcItemId;});
    var newItems=editClaimItems.map(function(i){return{date:i.date,cat:i.cat,amount:i.amount,note:i.note};});
    await DB.collection('expense_claims').doc(editClaimId).update({title:title,items:newItems,itemIds:newItemIds,total:total});
    showToast('청구서가 수정되었습니다');
    $('edit-claim-modal').classList.add('hidden');
  }catch(e){
    console.error(e);showToast('수정 실패: '+e.message);
  }
}
window.saveEditClaim=saveEditClaim;

async function delClaim(id){
  if(!confirm('이 청구서를 삭제할까요? (포함된 항목은 다시 미청구 상태로 돌아갑니다)'))return;
  try{
    var c=claims.find(function(x){return x._id===id;});
    if(c&&c.itemIds&&c.itemIds.length){
      var batch=DB.batch();
      c.itemIds.forEach(function(iid){
        batch.update(DB.collection('expense_items').doc(iid),{claimed:false,claimId:null});
      });
      await batch.commit();
    }
    await DB.collection('expense_claims').doc(id).delete();
    showToast('삭제되었습니다 (항목은 미청구로 복원됨)');
  }catch(e){showToast('삭제 실패');}
}
window.delClaim=delClaim;

function renderYearTabs(){
  var years=Array.from(new Set(claims.map(function(c){return(c.claimDate||'').slice(0,4);}).filter(Boolean))).sort(function(a,b){return b-a;});
  if(!years.length)years=[String(new Date().getFullYear())];
  if(years.indexOf(String(selYear))<0)selYear=parseInt(years[0]);
  var suf=curLang==='en'?'':'년';
  $('year-tabs').innerHTML=years.map(function(y){return '<button class="yt'+(parseInt(y)===selYear?' active':'')+'" onclick="setYear('+y+')">'+y+suf+'</button>';}).join('');
}
window.setYear=function(y){selYear=parseInt(y);renderYearTabs();renderClaimList();};

var accSelYear=new Date().getFullYear();
function renderAccYearTabs(){
  var years=Array.from(new Set(claims.map(function(c){return(c.claimDate||'').slice(0,4);}).filter(Boolean))).sort(function(a,b){return b-a;});
  if(!years.length)years=[String(new Date().getFullYear())];
  if(years.indexOf(String(accSelYear))<0)accSelYear=parseInt(years[0]);
  var suf=curLang==='en'?'':'년';
  $('acc-year-tabs').innerHTML=years.map(function(y){return '<button class="yt'+(parseInt(y)===accSelYear?' active':'')+'" onclick="setAccYear('+y+')">'+y+suf+'</button>';}).join('');
}
window.setAccYear=function(y){accSelYear=parseInt(y);renderAccYearTabs();renderAccounting();};

function renderAccounting(){
  var isEn=curLang==='en';
  var yc=claims.filter(function(c){return(c.claimDate||'').startsWith(String(accSelYear));});
  var yearTotal=yc.reduce(function(s,c){return s+(c.total||0);},0);
  $('acc-year-total').textContent=fmtAmt(yearTotal);

  var monthNames=isEn?['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']:['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  var monthTotals={};
  yc.forEach(function(c){
    var m=(c.claimDate||'').slice(5,7);
    if(!m)return;
    if(!monthTotals[m])monthTotals[m]={total:0,count:0};
    monthTotals[m].total+=(c.total||0);
    monthTotals[m].count+=1;
  });
  var monthKeys=Object.keys(monthTotals).sort(function(a,b){return b-a;});
  var mb=$('acc-month-body');
  if(!monthKeys.length){mb.innerHTML='<div class="empty">'+(isEn?'No data':'데이터 없음')+'</div>';}
  else{
    mb.innerHTML=monthKeys.map(function(mk){
      var mi=parseInt(mk)-1;
      return '<div>'+
        '<div class="pending-item" style="cursor:pointer" onclick="toggleAccMonthDetail(\''+mk+'\')">'+
          '<div class="pi-info"><div class="pi-cat">'+monthNames[mi]+'</div><div class="pi-date">'+(isEn?monthTotals[mk].count+' claims':'청구서 '+monthTotals[mk].count+'건')+'</div></div>'+
          '<div class="pi-amt">'+fmtAmt(monthTotals[mk].total)+'</div>'+
        '</div>'+
        '<div id="acc-month-detail-'+mk+'" class="hidden" style="margin:-3px 0 7px 12px;padding-left:8px;border-left:2px solid var(--bdr)"></div>'+
      '</div>';
    }).join('');
  }

  // 품목별 합계
  var catTotals={};
  var catItemsByCat={};
  yc.forEach(function(c){
    (c.items||[]).forEach(function(it){
      var cat=it.cat||'기타';
      catTotals[cat]=(catTotals[cat]||0)+(parseFloat(it.amount)||0);
      if(!catItemsByCat[cat])catItemsByCat[cat]=[];
      catItemsByCat[cat].push(Object.assign({claimTitle:c.title},it));
    });
  });
  var catKeys=Object.keys(catTotals).sort(function(a,b){return catTotals[b]-catTotals[a];});
  var cb=$('acc-cat-body');
  if(!catKeys.length){cb.innerHTML='<div class="empty">'+(isEn?'No data':'데이터 없음')+'</div>';}
  else{
    cb.innerHTML=catKeys.map(function(cat){
      var safeId=cat.replace(/[^\w가-힣]/g,'_');
      var catLabel=isEn?(CATS_EN[cat]||cat):cat;
      return '<div>'+
        '<div class="pending-item" style="cursor:pointer" onclick="toggleAccCatDetail(\''+safeId+'\')">'+
          '<div class="pi-info"><div class="pi-cat">'+catLabel+'</div></div>'+
          '<div class="pi-amt">'+fmtAmt(catTotals[cat])+'</div>'+
        '</div>'+
        '<div id="acc-cat-detail-'+safeId+'" class="hidden" style="margin:-3px 0 7px 12px;padding-left:8px;border-left:2px solid var(--bdr)"></div>'+
      '</div>';
    }).join('');
  }

  window._accMonthClaims=yc;
  window._accCatItems=catItemsByCat;
}

window.toggleAccMonthDetail=function(mk){
  var el=$('acc-month-detail-'+mk);if(!el)return;
  var opening=el.classList.contains('hidden');
  el.classList.toggle('hidden');
  el.dataset.filled='';
  if(opening){
    var isEn=curLang==='en';
    var yc=(window._accMonthClaims||[]).filter(function(c){return(c.claimDate||'').slice(5,7)===mk;});
    el.innerHTML=yc.map(function(c){
      return '<div style="padding:6px 0;font-size:12px;color:var(--txt2);cursor:pointer" onclick="viewClaim(\''+c._id+'\')">'+c.title+' — '+fmtAmt(c.total)+' <span style="color:var(--gray);font-size:10.5px">('+(c.claimDate||'')+')</span></div>';
    }).join('')||'<div class="empty" style="padding:10px 0">'+(isEn?'No records':'내역 없음')+'</div>';
    el.dataset.filled='1';
  }
};
window.toggleAccCatDetail=function(safeId){
  var el=$('acc-cat-detail-'+safeId);if(!el)return;
  var opening=el.classList.contains('hidden');
  el.classList.toggle('hidden');
  el.dataset.filled='';
  if(opening){
    var isEn=curLang==='en';
    var cat=Object.keys(window._accCatItems||{}).find(function(c){return c.replace(/[^\w가-힣]/g,'_')===safeId;});
    var items=(window._accCatItems||{})[cat]||[];
    el.innerHTML=items.map(function(it){
      return '<div style="padding:6px 0;font-size:12px;color:var(--txt2)">'+mdFromDate(it.date)+' · '+fmtAmt(it.amount)+(it.note?' · '+it.note:'')+' <span style="color:var(--gray);font-size:10.5px">('+it.claimTitle+')</span></div>';
    }).join('')||'<div class="empty" style="padding:10px 0">'+(isEn?'No records':'내역 없음')+'</div>';
    el.dataset.filled='1';
  }
};

function renderClaimList(){
  var el=$('claim-list');
  var isEn=curLang==='en';
  var yc=claims.filter(function(c){return(c.claimDate||'').startsWith(String(selYear));});
  yc.sort(function(a,b){return(b.claimDate||'').localeCompare(a.claimDate||'');});
  if(!yc.length){el.innerHTML='<div class="empty">'+(isEn?'No claims for '+selYear:selYear+'년 청구서 없음')+'</div>';return;}
  el.innerHTML=yc.map(function(c){
    var period=(c.periodStart||'')&&(c.periodEnd||'')?mdFromDate(c.periodStart)+' ~ '+mdFromDate(c.periodEnd):'';
    return '<div class="list-card" onclick="viewClaim(\''+c._id+'\')">'+
      '<div class="list-title">'+(c.title||(isEn?'(No title)':'(제목 없음)'))+'</div>'+
      '<div class="list-sub">'+(period?(isEn?'Period '+period+' · ':'대상기간 '+period+' · '):'')+(isEn?'Claim date ':'청구일 ')+(c.claimDate||'—')+' · '+(c.items||[]).length+(isEn?' items':'건')+'</div>'+
      '<div class="list-amt">'+fmtAmt(c.total)+'</div>'+
      '<div class="list-actions" onclick="event.stopPropagation()">'+
        '<button style="background:var(--gbg);color:var(--green)" onclick="viewClaim(\''+c._id+'\')">'+(isEn?'View':'보기')+'</button>'+
        '<button style="background:var(--il);color:var(--indigo)" onclick="openEditClaim(\''+c._id+'\')">'+(isEn?'Edit':'수정')+'</button>'+
        '<button class="br" onclick="delClaim(\''+c._id+'\')">'+(isEn?'Delete':'삭제')+'</button>'+
      '</div>'+
    '</div>';
  }).join('');
}

function exportAccCSV(){
  var yc=claims.filter(function(c){return(c.claimDate||'').startsWith(String(accSelYear));});
  if(!yc.length){showToast('내보낼 데이터가 없습니다');return;}
  var monthNames=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  var monthTotals={};
  var catTotals={};
  yc.forEach(function(c){
    var m=(c.claimDate||'').slice(5,7);
    if(m){if(!monthTotals[m])monthTotals[m]={total:0,count:0};monthTotals[m].total+=(c.total||0);monthTotals[m].count+=1;}
    (c.items||[]).forEach(function(it){
      var cat=it.cat||'기타';
      catTotals[cat]=(catTotals[cat]||0)+(parseFloat(it.amount)||0);
    });
  });
  var rows=[['== 월별 청구 현황 =='],['월','청구서 건수','합계']];
  Object.keys(monthTotals).sort().forEach(function(mk){
    rows.push([monthNames[parseInt(mk)-1],monthTotals[mk].count,monthTotals[mk].total]);
  });
  rows.push([]);
  rows.push(['== 품목별 합계 ==']);
  rows.push(['품목','합계']);
  Object.keys(catTotals).sort(function(a,b){return catTotals[b]-catTotals[a];}).forEach(function(cat){
    rows.push([cat,catTotals[cat]]);
  });
  rows.push([]);
  rows.push(['== 청구 상세 내역 ==']);
  rows.push(['청구서 제목','청구일자','청구대상기간','일자','품목','금액','비고']);
  yc.forEach(function(c){
    var period=(c.periodStart||'')&&(c.periodEnd||'')?c.periodStart+' ~ '+c.periodEnd:'';
    (c.items||[]).forEach(function(it){
      rows.push([c.title||'',c.claimDate||'',period,mdFromDate(it.date),it.cat||'',it.amount||0,it.note||'']);
    });
  });
  var csv=rows.map(function(r){
    return r.map(function(v){
      var s=String(v==null?'':v);
      return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
    }).join(',');
  }).join('\n');
  var blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='회계정리_'+accSelYear+'.csv';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('CSV 다운로드 완료');
}
window.exportAccCSV=exportAccCSV;
