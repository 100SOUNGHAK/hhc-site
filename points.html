  function tick(){if(!AUTO||!VIS)return;if(K>=STEP.length-1){TM=setTimeout(function(){K=0;upd();TM=setTimeout(tick,700);},2400);return;}K++;upd();TM=setTimeout(tick,650);}
  if(!RM_&&window.IntersectionObserver){if(IO)IO.disconnect();
    IO=new IntersectionObserver(function(es){var v=es[0].isIntersecting;if(v&&!VIS){VIS=true;if(AUTO){clearTimeout(TM);TM=setTimeout(tick,500);}}else if(!v){VIS=false;clearTimeout(TM);}},{threshold:.55});IO.observe(box);}
  document.querySelectorAll('[data-l]').forEach(function(b){b.addEventListener('click',function(){if(LANG===b.dataset.l)return;LANG=b.dataset.l;
    try{var u=new URL(location.href);if(LANG==='en')u.searchParams.set('lang','en');else u.searchParams.delete('lang');history.replaceState(null,'',u);}catch(e){}
    VIS=false;render();if(window.hhcBkLabel)window.hhcBkLabel(LANG==='en');});});
}
render();
try{fetch('/api/refcfg',{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(d){
  if(!d||!d.ok)return;var a={on:d.on!==false,pts:+d.pts||0,newOn:d.newOn!==false,newPts:+d.newPts||0},c=typeof d.revPts==='number'?{on:d.revOn!==false,pts:d.revPts}:RV;
  try{localStorage.setItem('hhc_refcfg',JSON.stringify(a));localStorage.setItem('hhc_revcfg',JSON.stringify(c));}catch(e){}
  if(JSON.stringify(a)!==JSON.stringify(RC)||JSON.stringify(c)!==JSON.stringify(RV)){RC=a;RV=c;VIS=false;render();}
}).catch(function(){});}catch(e){}
})();
</script>

<!-- ── 전자명함에서 넘어온 방문자에게만 보이는 되돌아가기 버튼 ────────── -->
<style>
.hhcbk{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:9990;display:none;align-items:center;gap:8px;padding:11px 17px 11px 13px;border-radius:999px;
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:14px;font-weight:700;letter-spacing:-.01em;color:#fdfcf9;
  background:linear-gradient(150deg,#173a5e,#0f2540);border:1px solid rgba(227,201,138,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 6px rgba(4,12,26,.35),0 14px 28px -12px rgba(4,12,26,.8);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .16s cubic-bezier(.22,.61,.36,1),background .16s cubic-bezier(.22,.61,.36,1)}
.hhcbk.on{display:inline-flex}
.hhcbk:active{transform:translateY(1px);background:linear-gradient(150deg,#1d4870,#122c4d)}
.hhcbk i{font-style:normal;color:#e3c98a;font-size:16px;line-height:1}
@media (prefers-reduced-motion:reduce){.hhcbk{transition:none}}
@media print{.hhcbk{display:none!important}}
</style>
<button type="button" class="hhcbk" id="hhcBackToCard"><i>&#8592;</i><span>명함으로</span></button>
<script>
(function(){
  try{
    var q = new URLSearchParams(location.search);
    var en = String(q.get('lang') || '').toLowerCase() === 'en';
    /* ← 돌아가기 (2026-11-27) — 우리 화면(홈페이지 · 이벤트 · 전자명함 · 마이페이지 · 다른 안내장)에서 넘어왔으면 표시.
       왓츠앱 등 바깥 링크로 바로 연 경우(이전 화면 없음)는 숨김. */
    var rf = '', rfp = '';
    try{ var ru = new URL(document.referrer || ''); if(ru.origin === location.origin){ rf = document.referrer; rfp = ru.pathname.toLowerCase(); } }catch(_e){}
    var fromCard = q.get('from') === 'card' || rfp.indexOf('/namecard') > -1 || rfp === '/nc' || rfp === '/nce';
    var fromEv = q.get('from') === 'event' || rfp.indexOf('/event') === 0;
    if(!fromCard && !rf && !fromEv) return;
    var LB = fromCard ? ['명함으로','Back to card','전자명함으로 돌아가기','Back to the digital name card']
      : fromEv ? ['이벤트로','Back to offers','이벤트 안내로 돌아가기','Back to the offers page']
      : (rfp === '/' || rfp.indexOf('/home') === 0) ? ['홈페이지로','Back to home','홈페이지로 돌아가기','Back to the home page']
      : rfp.indexOf('/my') === 0 ? ['마이페이지로','Back to My Page','마이페이지로 돌아가기','Back to My Page']
      : ['돌아가기','Back','이전 화면으로 돌아가기','Back to the previous page'];

    var b = document.getElementById('hhcBackToCard');
    if(!b) return;
    window.hhcBkLabel = function(isEn){ b.querySelector('span').textContent = isEn ? LB[1] : LB[0]; b.setAttribute('aria-label', isEn ? LB[3] : LB[2]); };
    window.hhcBkLabel(en);
    b.classList.add('on');

    /* 화면 아래에 고정된 바(예약 제출 바 등)가 있으면 그만큼 위로 띄운다 */
    function lift(){
      var vh = window.innerHeight, max = 0;
      var els = document.querySelectorAll('body > *, body > * > *');
      for(var i = 0; i < els.length; i++){
        var el = els[i];
        if(el === b) continue;
        var cs = getComputedStyle(el);
        if(cs.position !== 'fixed' || cs.display === 'none' || cs.visibility === 'hidden') continue;
        var r = el.getBoundingClientRect();
        if(r.height > 0 && r.height < 170 && Math.abs(r.bottom - vh) < 6 && r.width > 120){
          if(r.height > max) max = r.height;
        }
      }
      b.style.bottom = 'calc(' + (14 + max) + 'px + env(safe-area-inset-bottom))';
    }
    lift();
    setTimeout(lift, 900);
    window.addEventListener('resize', lift);

    b.addEventListener('click', function(){
      if(rf && history.length > 1){ history.back(); }
      else if(rf){ location.href = rf; }
      else { location.href = (fromEv ? '/event' : '/namecard') + (en ? '?lang=en' : ''); }
    });
  }catch(e){}
})();
</script>

</body>
