  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

  function doc(d){
    var c=Object.assign({},CO,d.co||{});
    var h='<div class="hx">';
    if(d.stamp)h+='<div class="hx-wmk '+(d.stamp.cls||'ok')+'">'+esc(d.stamp.t)+'</div>';
    h+='<div class="hx-hd"><div class="hx-br"><div class="hx-lg">'+(d.logo?'<img src="'+esc(d.logo)+'" alt="">':LOGO)+'</div>'+
       '<div><div class="hx-bn">Happy Home Care</div><div class="hx-bs">'+esc(c.name)+'</div></div></div>'+
       '<div class="hx-wd"><div class="hx-wm">'+esc(d.word)+'</div>'+(d.wordSub?'<div class="hx-ws">'+esc(d.wordSub)+'</div>':'')+'</div></div>'+
       '<div class="hx-gl"></div>';
    if(d.meta&&d.meta.length)h+='<div class="hx-meta">'+d.meta.map(function(m){
      return '<div><div class="hx-k">'+m[0]+'</div><div class="hx-v">'+m[1]+'</div></div>';}).join('')+'</div>';
    if(d.parties&&d.parties.length)h+='<div class="hx-pt">'+d.parties.map(function(p){
      return '<div><div class="hx-pl">'+p.l+'</div><div class="hx-pn">'+p.n+'</div>'+
        ((p.d||[]).filter(Boolean).length?'<div class="hx-pd">'+p.d.filter(Boolean).join('<br>')+'</div>':'')+
        (p.chip?'<span class="hx-chip">'+p.chip+'</span>':'')+'</div>';}).join('')+'</div>';
    (d.blocks||[]).forEach(function(b){if(b)h+=b;});
    if(d.sign)h+=sign(d.sign);
    h+='<div class="hx-ft"><div><b>'+esc(c.name)+'</b>'+(c.reg?' ('+esc(c.reg)+')':'')+'<br>'+
       [c.addr,'Tel '+c.phone,c.web].filter(Boolean).map(esc).join(' · ')+'</div>'+
       '<div class="hx-ty">'+esc(d.thanks||'Thank you')+'</div></div>';
    return h+'</div>';
  }
  function sec(title,right,inner){
    return '<div class="hx-sec"><div class="hx-sh"><span>'+title+'</span>'+(right?'<small>'+right+'</small>':'')+'</div>'+inner+'</div>';
  }
  // cols: [{h:'Description',c:''|'r'|'c'}]  rows: [[cell,...]] · {g:'그룹', r:'오른쪽'} · {cls:'off',c:[...]}
  function table(cols,rows,cls){
    var h='<table class="hx-t'+(cls?' '+cls:'')+'">';
    if(cols)h+='<thead><tr>'+cols.map(function(c){return '<th class="'+(c.c||'')+'"'+(c.w?' style="width:'+c.w+'"':'')+'>'+c.h+'</th>';}).join('')+'</tr></thead>';
    h+='<tbody>'+rows.map(function(r){
      if(r&&r.g!=null)return '<tr class="g"><td colspan="'+(cols?cols.length-1:1)+'">'+r.g+'</td><td class="r">'+(r.r||'')+'</td></tr>';
      var cells=Array.isArray(r)?r:r.c,cl=Array.isArray(r)?'':(r.cls||'');
      return '<tr'+(cl?' class="'+cl+'"':'')+'>'+cells.map(function(v,i){
        var cc=cols&&cols[i]?cols[i].c||'':'';return '<td class="'+cc+'">'+v+'</td>';}).join('')+'</tr>';
    }).join('')+'</tbody></table>';
    return h;
  }
  // rows: [[라벨,값,'m'|'s'|'']]  total:[라벨,값]
  function sums(rows,total,after){
    return '<div class="hx-sw"><div class="hx-sm">'+(rows||[]).map(function(r){
      return '<div class="hx-sr'+(r[2]?' '+r[2]:'')+'"><span>'+r[0]+'</span><b>'+r[1]+'</b></div>';}).join('')+
      (total?'<div class="hx-tot"><span>'+total[0]+'</span><b>'+total[1]+'</b></div>':'')+(after||'')+'</div></div>';
  }
  // boxes: [{t:'제목',x:'본문 html',cls:'g'|'w'|'g w'}]
  function notes(boxes){
    boxes=(boxes||[]).filter(Boolean);
    if(!boxes.length)return '';
    return '<div class="hx-nt">'+boxes.map(function(b){
      return '<div class="hx-nb'+(b.cls?' '+b.cls:'')+'"><div class="hx-nh">'+b.t+'</div><div class="hx-nx">'+b.x+'</div></div>';}).join('')+'</div>';
  }
  // arr: [{l:'라벨', n:'이름', img:'서명이미지', d:'날짜'}]
  // 번호 목록 (html2canvas 가 목록 번호를 엇나가게 그려서 번호를 직접 씁니다)
  function list(arr){return '<div class="hx-ol">'+(arr||[]).map(function(x,i){return '<div class="hx-li"><i>'+(i+1)+'.</i><span>'+x+'</span></div>';}).join('')+'</div>';}
  function sign(arr){
    return '<div class="hx-sg">'+arr.map(function(s){
      if(!s)return '<div></div>';
      return '<div><div class="im">'+(s.img?'<img src="'+esc(s.img)+'" alt="">':'')+'</div>'+
        '<div class="ln"><span>'+s.l+(s.n?'<br><b>'+s.n+'</b>':'')+'</span><span>'+(s.d||'')+'</span></div></div>';}).join('')+'</div>';
  }

  function ensureCss(){
    if(document.getElementById('hdoc-css'))return;
    var st=document.createElement('style');st.id='hdoc-css';st.textContent=CSS;
    (document.head||document.documentElement).appendChild(st);
  }
  function refresh(){
    ensureCss();
    if(typeof window.HDOC_BUILD!=='function'||!document.body)return false;
    var html='';
    try{html=window.HDOC_BUILD()||'';}catch(e){try{console.warn('[HDOC]',e);}catch(_){}}
    var root=document.getElementById('hdoc-root');
    if(!html){if(root)root.innerHTML='';document.documentElement.classList.remove('hdoc-ready');return false;}
    if(!root){root=document.createElement('div');root.id='hdoc-root';}
    if(root.parentNode!==document.body||document.body.lastElementChild!==root)document.body.appendChild(root);
    root.innerHTML=html;
    document.documentElement.classList.add('hdoc-ready');
    return true;
  }
  function mode(on){
    var ok=on?refresh():false;
    Array.prototype.forEach.call(document.querySelectorAll('[data-hdoc-hide]'),function(el){el.removeAttribute('data-hdoc-hide');});
    if(on&&ok&&document.body)Array.prototype.forEach.call(document.body.children,function(el){
      if(el.id!=='hdoc-root'&&el.tagName!=='SCRIPT'&&el.tagName!=='STYLE')el.setAttribute('data-hdoc-hide','1');
    });
    document.documentElement.classList.toggle('pdfdoc',!!on);
    return true;
  }
  ensureCss();
  window.HDOC={CSS:CSS,esc:esc,doc:doc,sec:sec,table:table,sums:sums,notes:notes,list:list,sign:sign,refresh:refresh,mode:mode,CO:CO};
  window.hhcDocMode=mode;
  window.addEventListener('beforeprint',function(){refresh();});
})();
</script>

<body>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';

const FIREBASE_CFG={

const P=new URLSearchParams(location.search);
const RID=P.get('id');
let lang=(P.get('lang')==='en')?'en':'ko';
let M=null;

const T={

    done:'방문완료',wait:'진행 중',sym:'요청 내용 (증상)',res:'진단 및 처리 결과',photos:'현장 사진',zoom:'사진을 누르면 크게 볼 수 있습니다',
    resWait:'방문 후 진단 결과가 입력되면 이곳에 표시됩니다.',cust:'고객',pdf:'📄 PDF 저장',ask:'💬 문의하기',
    thanks:'이용해 주셔서 감사합니다',nf:'보고서를 찾을 수 없습니다.<br>Report not found.',ph:'장',
    dTitle:'방문 결과 보고서',dTag:'Service Visit Report',dIssue:'요청 내용 (증상)',dRes:'진단 및 처리 결과',dPh:'현장 사진',
    dCust:'고객',dFrom:'서비스 제공',dSign:'고객 확인 (서명 / 날짜)',dTech:'담당',dNote:'안내',

    thanks:'Thank you for choosing us',nf:'Report not found.',ph:'',
    dTitle:'Service Visit Report',dTag:'Service Visit Report',dIssue:'Reported Issue',dRes:'Diagnosis & Result',dPh:'Site Photos',
    dCust:'Customer',dFrom:'Service Provider',dSign:'Customer Acknowledgement (Signature / Date)',dTech:'Serviced by',dNote:'Note',
    dNoteX:'If the same issue occurs again after the visit, please let us know at the contact below and we will get back to you promptly.'}
};
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const LOGO='<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg>';
// 영문 화면 — 영문 입력이 있으면 영문, 없으면 한국어 원문
function tx(ko,en){return (lang==='en'&&en&&String(en).trim())?String(en):String(ko||'');}
function dfmt(d){
  const m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m)return d||'—';
  if(lang==='en'){const MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return (+m[3])+' '+MO[+m[2]-1]+' '+m[1];}
  return m[1]+'.'+m[2]+'.'+m[3];
}
function rno(m,id){
  const d=String(m.visit_date||m.req_date||'').replace(/[^0-9]/g,'').slice(2,8);
  return 'RP-'+(d||'000000')+'-'+String(id||'').slice(0,4).toUpperCase();
}
function photos(m){return (m.result_photos||[]).filter(p=>p&&(p.url||p.thumb));}
function who(m){const c=String(m.condo||'').trim(),n=String(m.name||'').trim();return c&&n?(c+' ('+n+')'):(c||n||'—');}

function render(){

    '<div class="rpa">'+
      '<div class="brand"><div class="lg">'+LOGO+'</div><div class="bnm">Happy Home Care<span>HAPPY WORKS SERVICES SDN. BHD.</span></div><div class="ino">'+esc(rno(m,RID))+'</div></div>'+

      '<div class="card res"><div class="chd"><span class="ic">✅</span>'+t.res+'</div>'+
        (res?'<div class="cbd">'+esc(res)+'</div>':'<div class="cbd mute">'+t.resWait+'</div>')+'</div>'+
      (ps.length?'<div class="card"><div class="chd"><span class="ic">📷</span>'+t.photos+'<span class="cnt">'+ps.length+t.ph+'</span></div>'+
        '<div class="ph'+(ps.length===1?' one':'')+'">'+ps.map((p,i)=>'<figure data-i="'+i+'"><img src="'+esc(p.thumb||p.url)+'" alt="" loading="lazy"><figcaption>'+esc(tx(p.cap,p.cap_en))+'</figcaption></figure>').join('')+'</div>'+
        '<div class="zhint">'+t.zoom+'</div></div>':'')+
      '<div class="card"><div class="ft"><div class="fi">📞</div><div><div class="ft1">Happy Works Services Sdn. Bhd.</div>'+
        '<div class="ft2"><a href="tel:+60172472774">+60 17-247 2774</a></div><div class="ft3">'+t.thanks+'</div></div></div></div>'+
    '</div>'+
    '<div id="rp-bar"><button onclick="window.print()">'+t.pdf+'</button><a class="prim" href="https://wa.me/60172472774?text='+encodeURIComponent('[Happy Home Care] '+rno(m,RID)+' ')+'" target="_blank" rel="noopener">'+t.ask+'</a></div>';

  document.getElementById('le').onclick=()=>{lang='en';render();};

function lbOpen(i){const p=photos(M)[i];if(!p)return;document.getElementById('lb-img').src=p.url||p.thumb;document.getElementById('lb-cap').textContent=tx(p.cap,p.cap_en);document.getElementById('lb').classList.add('on');}

// ══ 인쇄 · PDF 문서 양식 (A4) — 인보이스 · 견적서 · 계약서와 같은 양식 ══
window.HDOC_BUILD=function(){
  if(!M||!window.HDOC)return '';
  const H=window.HDOC,t=T[lang],m=M,ps=photos(m),done=m.status==='done',res=tx(m.result,m.result_en);
  const blocks=[];
  const box=(x,cls)=>'<div class="hx-nt" style="margin-top:7px"><div class="hx-nb w'+(cls?' '+cls:'')+'"><div class="hx-nx" style="font-size:11px;color:#14192A">'+x+'</div></div></div>';

  if(ps.length)blocks.push(H.sec(t.dPh,ps.length+(lang==='en'?(ps.length===1?' photo':' photos'):'장'),

  blocks.push(H.notes([{t:t.dNote,x:esc(t.dNoteX)+'<br>WhatsApp / Tel +60 17-247 2774',cls:'w'}]));
  return H.doc({
    word:'SERVICE REPORT',wordSub:lang==='en'?'Visit Report':t.dTitle,

    sign:[{l:t.dSign},{l:t.dTech,n:'Happy Home Care'}],
    thanks:lang==='en'?'Thank you':'감사합니다'
  });
};

function fail(msg){document.getElementById('st-load').style.display='none';document.getElementById('st-err').style.display='flex';if(msg)document.getElementById('err-msg').innerHTML=msg;}

const DEMO={condo:'GEO LAKE A-08-08',name:'김민수',status:'done',req_date:'2026-10-28',visit_date:'2026-10-30',visit_time:'14:00',
  symptom:'거실 에어컨에서 물이 떨어지고 냉방이 약함',symptom_en:'Water dripping from the living room AC and weak cooling',
  result:'드레인 배관이 슬러지로 막혀 실내기 물받이에 물이 넘쳤습니다.\n· 드레인 배관 고압 세척 및 배수 테스트 완료\n· 냉매 압력 정상 (토출 온도 차 11.8°C)\n· 필터 오염이 심해 세척 후 재장착\n→ 6개월마다 정기 세척을 권장드립니다.',
  result_en:'The drain pipe was clogged with sludge, causing the drain pan to overflow.\n· Drain pipe flushed and drainage test completed\n· Refrigerant pressure normal (temperature difference 11.8°C)\n· Heavily soiled filter cleaned and refitted\n→ We recommend regular cleaning every 6 months.',
  result_photos:[]};

if(P.get('demo')==='1'){
  M=DEMO;try{const ph=JSON.parse(P.get('ph')||'null');if(ph)M.result_photos=ph;}catch(e){}
  show();
}else if(!RID){fail();}
else{
  try{
    const app=initializeApp(FIREBASE_CFG),db=getFirestore(app);
    getDoc(doc(db,'memos',RID)).then(s=>{
      if(!s.exists()){fail();return;}
      M=s.data()||{};
      if(M.kind==='curtain'&&!M.result){fail();return;}
      show();
    }).catch(e=>fail('불러오기 실패: '+esc(e.message)));
  }catch(e){fail('연결 실패: '+esc(e.message));}
}
