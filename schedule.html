<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1833">
<title>일정 캘린더 — Happy Home Care</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0B1633;--navy2:#16234A;
  --teal:#0FB5A4;--teal-lt:#E4FBF6;--teal-dk:#0A6B60;--teal-deep:#0C8577;
  --g:#EDF1F8;--w:#fff;--ln:#E6ECF5;--ln2:#F0F4FA;
  --tx:#131A2B;--tx2:#57617A;--tx3:#98A1B5;
  --ok:#0E9E6E;--okbg:#E6F8F1;
  --bd:#E5484D;--bdbg:#FEECEC;
  --amber:#E08600;--amber-lt:#FDF3E0;
  --purple:#8B5CF6;--purple-lt:#EDE9FE;--purple-dk:#5B21B6;
  --blue:#3B72F6;--blue-lt:#E8F0FE;--blue-dk:#1A56DB;
  --r1:10px;--r2:14px;--r3:20px;
  --sh-sm:0 1px 2px rgba(16,26,51,.06);
  --sh:0 6px 18px -8px rgba(16,26,51,.18);
  --sh-lg:0 18px 40px -16px rgba(16,26,51,.30);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Pretendard',-apple-system,'Noto Sans KR',sans-serif;background:var(--g);color:var(--tx);display:flex;flex-direction:column;font-size:15px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}

/* ── 앱 ── */
.app{display:none;flex-direction:column;height:100%}
.app.on{display:flex}

/* 헤더 */
.hdr{background:linear-gradient(120deg,var(--navy),var(--navy2));padding:calc(11px + var(--safe-top)) 15px 11px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 4px 18px -6px rgba(11,22,51,.5);position:relative;z-index:5}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-mark{width:34px;height:34px;background:var(--teal);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;box-shadow:0 4px 12px -2px rgba(15,181,164,.55)}
.hdr-name{font-size:14.5px;font-weight:700;color:#fff;letter-spacing:-.02em}
.hdr-sub{font-size:9.5px;color:rgba(255,255,255,.5);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:7px}
.view-toggle{display:flex;background:rgba(255,255,255,.12);border-radius:11px;padding:3px;gap:2px}
.view-btn{padding:6px 12px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;background:transparent;color:rgba(255,255,255,.6);transition:.15s}
.view-btn.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.lang-toggle{display:flex;background:rgba(255,255,255,.12);border-radius:20px;padding:3px}
.lang-btn{padding:6px 11px;border-radius:16px;border:none;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;background:transparent;color:rgba(255,255,255,.6);transition:.15s}
.lang-btn.on{background:#fff;color:var(--navy)}

/* 월 네비 */
.nav-bar{background:var(--w);border-bottom:1px solid var(--ln);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.nav-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--ln);background:var(--g);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx2);transition:.15s}
.nav-btn:active{background:var(--teal-lt);color:var(--teal-deep);transform:scale(.94)}
.nav-center{display:flex;align-items:center;gap:11px}
.nav-month{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.today-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--teal);background:var(--teal-lt);color:var(--teal-dk);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.today-btn:active{transform:scale(.95)}

/* ── 월 뷰 캘린더 ── */
.month-view{flex:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.cal-wrap{background:var(--w);border-bottom:1px solid var(--ln);flex-shrink:0;padding:2px 6px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day-name{padding:8px 0 6px;text-align:center;font-size:11px;font-weight:700;color:var(--tx3)}
.day-name:first-child{color:#E5484D}
.day-name:last-child{color:#3B72F6}
.cal-day{height:62px;background:var(--w);cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;gap:3px;position:relative;transition:.12s;border-radius:12px}
.cal-day:active{background:var(--teal-lt)}
.cal-day.today .day-num{background:var(--teal);color:#fff;border-radius:11px;font-weight:800;box-shadow:0 4px 10px -3px rgba(15,181,164,.6)}
.cal-day.sel{background:var(--teal-lt);box-shadow:inset 0 0 0 2px var(--teal)}
.cal-day.other-m{background:transparent}
.cal-day.other-m .day-num{color:#C4CCDC}
.cal-day.sun .day-num{color:#E5484D}
.cal-day.sat .day-num{color:#3B72F6}
.day-num{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;flex-shrink:0}
.day-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:34px}
.day-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dot-b{background:#0FB5A4}
.dot-m{background:var(--purple)}
.dot-h{background:#E5484D}
.dot-gg{background:#3B72F6}
.day-cnt{font-size:8px;font-weight:700;color:var(--tx3)}
.today-summary{background:linear-gradient(120deg,var(--navy),var(--navy2));margin:10px 15px;border-radius:16px;padding:14px 17px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:var(--sh)}
.today-summary-date{font-size:11px;color:rgba(255,255,255,.55);font-weight:600}
.today-summary-txt{font-size:14px;font-weight:700;color:#fff;margin-top:3px;letter-spacing:-.01em}
.day-count-badge{margin-top:3px;font-size:9px;font-weight:800;border-radius:7px;padding:2px 6px;line-height:1.4}
.legend-bar{display:flex;gap:15px;flex-wrap:wrap;padding:11px 15px;border-top:1px solid var(--ln);font-size:12px;color:var(--tx2);font-weight:600}
.leg{display:flex;align-items:center;gap:6px}
.leg-dot{width:11px;height:11px;border-radius:4px}

/* 일정 패널 */
.day-panel{flex:1;padding-bottom:calc(88px + var(--safe-bot))}
.day-hdr{position:sticky;top:0;z-index:10;background:rgba(237,241,248,.92);backdrop-filter:blur(8px);padding:13px 16px 9px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between}
.day-hdr-date{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.day-hdr-cnt{font-size:11.5px;color:var(--tx3);margin-top:1px;font-weight:600}
.share-row{display:flex;gap:6px}
.share-btn{padding:7px 12px;border-radius:20px;border:none;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.share-btn:active{transform:scale(.95)}

/* ── 주 뷰 ── */
.week-view{flex:1;display:none;flex-direction:column;overflow:hidden}
.week-view.on{display:flex}
.week-hdr{display:grid;grid-template-columns:44px repeat(7,1fr);background:var(--w);border-bottom:1px solid var(--ln);flex-shrink:0}
.week-hdr-empty{border-right:1px solid var(--ln)}
.week-day-hdr{padding:8px 2px;text-align:center;border-right:1px solid var(--ln2);cursor:pointer}
.week-day-hdr:last-child{border-right:none}
.week-day-name{font-size:9.5px;font-weight:700;color:var(--tx3)}
.week-day-num{width:30px;height:30px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;margin:3px auto 0;color:var(--tx)}
.week-day-num.today{background:var(--teal);color:#fff;font-weight:800}
.week-day-num.sel{background:var(--navy);color:#fff}
.week-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.week-grid{display:grid;grid-template-columns:44px repeat(7,1fr);padding-bottom:60px}
.time-col{border-right:1px solid var(--ln2)}
.time-slot{height:54px;border-bottom:1px solid var(--ln2);display:flex;align-items:flex-start;justify-content:flex-end;padding:2px 6px 0 0}
.time-lbl{font-size:9.5px;color:var(--tx3);margin-top:-1px;font-weight:600}
.week-col{border-right:1px solid var(--ln2);position:relative}
.week-col:last-child{border-right:none}
.week-cell{height:54px;border-bottom:1px solid var(--ln2);position:relative}
.week-event{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 6px;font-size:10px;font-weight:700;overflow:hidden;cursor:pointer;line-height:1.35;z-index:1;box-shadow:var(--sh-sm)}
.week-event.type-b{background:#CCF2EE;color:#085048;border-left:3px solid #0FB5A4}
.week-event.type-m{background:var(--purple-lt);color:#5B21B6;border-left:3px solid var(--purple)}
.week-event.type-h{background:#FFE1E3;color:#9F1239;border-left:3px solid #E5484D}
.week-event.type-gg{background:#E8F0FE;color:#1A56DB;border-left:3px solid #3B72F6}
.week-event.type-r{background:#FFEFD5;color:#92400E;border-left:3px solid #F59E0B}
.week-now-line{position:absolute;left:0;right:0;height:2px;background:var(--bd);z-index:2;pointer-events:none}
.week-now-dot{position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bd)}

/* 일정 아이템 */
.sch-list{padding:8px 12px}
.sch-item{display:flex;gap:12px;padding:14px 15px;margin-bottom:9px;align-items:flex-start;background:var(--w);border:1px solid var(--ln);border-radius:15px;box-shadow:var(--sh-sm)}
.sch-bar{width:4px;border-radius:3px;align-self:stretch;min-height:34px;flex-shrink:0}
.sch-time-col{width:52px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.sch-ts{font-size:12.5px;font-weight:800;color:var(--tx)}
.sch-te{font-size:10.5px;color:var(--tx3);font-weight:600}
.sch-body{flex:1;min-width:0}
.sch-type{display:inline-flex;padding:2px 9px;border-radius:8px;font-size:9.5px;font-weight:800;margin-bottom:5px;letter-spacing:.02em}
.sch-ttl{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:4px;line-height:1.4}
/* 고객이 있는 일정 : 제목(고객명)을 눌러 총괄 고객관리 상세로 이동 */
.sch-cn{cursor:pointer;border-bottom:1.5px dotted rgba(29,78,216,.45)}
.sch-cn:active{opacity:.55}
.sch-ca{background:#E7EEFF!important}
.mg-badge{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800;vertical-align:middle;letter-spacing:-.01em;white-space:nowrap}
.mg-vvip{background:#fef9c3;color:#a16207}
.mg-pkg{background:#eff6ff;color:#2563eb}
.mg-etc{background:#f5f3ff;color:#7c3aed}
/* 📞 연락 경로 표시 (W=WhatsApp · K=카카오톡 · O=기타) — 관리 화면 전용 */
.chb{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;margin-left:6px;
     border-radius:6px;border:1.5px solid transparent;font-size:10.5px;font-weight:900;line-height:1;
     cursor:pointer;vertical-align:middle;padding:0;font-family:inherit}
.chb.w{background:#22c55e;border-color:#22c55e;color:#fff}
.chb.k{background:#FEE500;border-color:#F5DC00;color:#3C1E1E}
.chb.o{background:#64748b;border-color:#64748b;color:#fff}
.chb.n{background:#fff;border-color:#cbd5e1;border-style:dashed;color:#cbd5e1;font-size:11px}
#chmenu{position:fixed;z-index:9999;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;
        box-shadow:0 12px 34px rgba(11,24,51,.18);padding:6px;min-width:186px;font-family:inherit}
#chmenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:none;
        padding:9px 9px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--tx);cursor:pointer;font-family:inherit}
#chmenu button:hover{background:#f1f5f9}
#chmenu i{font-style:normal;width:17px;text-align:center;font-weight:900}
#chmenu .ch-t{font-size:10px;font-weight:800;color:#94a3b8;padding:3px 9px 6px}
#chmenu .ch-sep{height:1px;background:#e2e8f0;margin:5px 4px}
.sch-ttl-condo{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:5px;line-height:1.25;letter-spacing:-.02em}
.sch-sub{font-size:12px;color:var(--tx2);line-height:1.7}
.sch-auto{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:8px;font-size:9.5px;font-weight:700;background:var(--g);color:var(--tx3);margin-top:6px}
.sch-acts{display:flex;flex-wrap:wrap;gap:5px;width:73px;flex:none;justify-content:flex-end;align-content:flex-start}
.sch-edit{flex-shrink:0;width:34px;height:34px;border-radius:10px;border:none;background:var(--g);color:var(--tx2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.sch-edit:active{transform:scale(.9)}
.sch-del{width:34px;height:34px;border-radius:10px;border:none;background:var(--bdbg);color:var(--bd);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.translating{opacity:.5;font-style:italic}
.copy-ok{display:none;text-align:center;margin:0 12px 8px;padding:9px;border-radius:10px;background:var(--okbg);color:var(--ok);font-size:11.5px;font-weight:700}

/* 빈 날짜 */
.empty-day{padding:44px 16px;text-align:center;color:var(--tx3)}
.empty-ico{font-size:46px;margin-bottom:14px}
.empty-txt{font-size:15px;font-weight:700;color:var(--tx2);margin-bottom:5px}
.empty-sub{font-size:12.5px}


/* FAB */
.fab{position:fixed;bottom:calc(22px + var(--safe-bot));right:18px;width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;border:none;font-size:30px;cursor:pointer;box-shadow:0 12px 28px -8px rgba(15,181,164,.65);display:none;align-items:center;justify-content:center;z-index:100}
.fab:active{transform:scale(.9)}

/* 모달 */
.modal-ov{position:fixed;inset:0;background:rgba(11,22,51,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal-ov.open{display:flex}
.modal-sheet{background:var(--w);border-radius:24px 24px 0 0;padding:18px 18px calc(22px + var(--safe-bot));width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh-lg)}
.modal-handle{width:40px;height:5px;background:var(--ln);border-radius:3px;margin:0 auto 16px}
.modal-ttl{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:3px;letter-spacing:-.02em}
.modal-sub{font-size:12.5px;color:var(--tx3);margin-bottom:18px;font-weight:600}
.field{margin-bottom:14px}
.flbl{font-size:11px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.field input,.field textarea{width:100%;padding:13px 14px;border:1.5px solid var(--ln);border-radius:12px;font-size:16px;font-family:inherit;color:var(--tx);background:var(--g);-webkit-appearance:none;transition:.15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--teal);background:var(--w);box-shadow:0 0 0 4px rgba(15,181,164,.12)}
.field textarea{resize:none;height:94px;line-height:1.6}
.type-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.type-btn{padding:12px 2px;border-radius:12px;border:1.5px solid var(--ln);font-size:11px;font-weight:700;cursor:pointer;text-align:center;background:var(--g);color:var(--tx2);font-family:inherit;transition:.15s;white-space:nowrap}
.type-btn.on{border-color:var(--teal);background:var(--teal-lt);color:var(--teal-dk)}
.t2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* ══════════ 📅 예약 일정 — 품목 선택 (예약 등록 화면과 동일 구성) ══════════ */
.rv-sec{border:1.5px solid var(--ln);border-radius:14px;padding:12px;background:var(--ln2);margin-bottom:14px}
.rv-sec-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
.rv-sec-h .cnt{margin-left:auto;min-width:22px;height:20px;border-radius:100px;background:var(--ok);color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 8px;text-transform:none;letter-spacing:0}
.rv-sec-h .cnt.show{display:inline-flex}
.spick-it{display:flex;align-items:center;gap:9px;background:var(--w);border:1.5px solid var(--ln);border-radius:11px;padding:9px 11px;margin-bottom:7px;flex-wrap:wrap}
.spick-it .ic{width:32px;height:32px;border-radius:9px;background:var(--teal-lt);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.spick-it .nm{flex:1;min-width:0}
.spick-it .nm b{font-size:13px;font-weight:700;display:block;line-height:1.35;word-break:keep-all}
.spick-it .nm span{font-size:10px;color:var(--tx3)}
.spick-it .free-in{width:100%;margin-top:7px;padding:9px 11px;background:#fff;border:1.5px solid var(--ln);border-radius:9px;font-size:14px;outline:none}
.spick-it .free-in:focus{border-color:var(--teal)}
.sqty{display:flex;align-items:center;border:1.5px solid var(--ln);border-radius:9px;overflow:hidden;height:32px;background:#fff;flex:none}
.sqty button{width:28px;height:100%;border:none;background:var(--g);font-size:15px;font-weight:800;color:var(--teal-deep);cursor:pointer;padding:0;font-family:inherit}
.sqty b{width:30px;text-align:center;font-weight:800;font-size:13px}
.spick-x{width:24px;height:24px;border-radius:50%;background:var(--bdbg);color:var(--bd);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex:none;font-family:inherit}
.spick-empty{text-align:center;padding:14px 10px;font-size:12px;color:var(--tx3);background:var(--w);border:1px dashed var(--ln);border-radius:11px;margin-bottom:9px;line-height:1.7}
.sbig-pick{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(120deg,var(--teal),var(--teal-deep));color:#fff;font-size:13.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 8px 20px -8px rgba(15,181,164,.55);font-family:inherit}
.sbig-pick:active{transform:scale(.98)}
.spick-note{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px;padding:9px 11px;background:#FFF7E6;border:1px solid #F0DBA6;border-left:3px solid #E0A82E;border-radius:10px;font-size:11px;line-height:1.6;color:#7A5710;font-weight:600;word-break:keep-all}
.spick-note .ic{flex:none;font-size:12px;line-height:1.4}
/* 품목 피커 시트 */
.skbg{position:fixed;inset:0;background:rgba(8,18,33,.55);z-index:320}
.skbg.hidden{display:none}
.sk{position:fixed;left:0;right:0;bottom:0;top:7%;background:#fff;border-radius:20px 20px 0 0;z-index:321;display:flex;flex-direction:column;overflow:hidden;max-width:560px;margin:0 auto}
.sk.hidden{display:none}
.sk-h{padding:11px 15px 0;flex-shrink:0;border-bottom:1px solid var(--ln)}
.sk-grab{width:38px;height:4px;border-radius:3px;background:#d5dae8;margin:0 auto 9px}
.sk-t{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.sk-t b{font-size:15px;font-weight:800;color:var(--navy)}

function hhcFastDb(app){

}

// ── 🔗 발송 주소 단축 ────────────────────────────────────────────
// 메시지에 들어가는 긴 happyhomecare 주소를 짧은 주소(/r?k=키)로 바꿉니다.
// 인보이스·계약서에서 이미 쓰던 단축 저장소(shorts · r.html)를 그대로 씁니다.
//  · 같은 주소는 항상 같은 키를 재사용합니다 (저장소에서 먼저 찾음)
//  · 새 키는 4자리로 만들고, 이미 쓰는 키와 겹치면 자릿수를 늘려 다시 만듭니다
//  · 단축에 실패하면 원래 주소를 그대로 보냅니다 (발송이 막히는 일은 없음)
const HHC_SHORT_BASE='https://happyhomecare.com.my/r?k=';
const _hhcShortCache={};
async function hhcShortUrl(url){
  url=String(url||'');
  if(_hhcShortCache[url])return _hhcShortCache[url];
  if(url.length<=40)return url;                                   // 이미 짧은 주소
  if(!/^https:\/\/(www\.)?happyhomecare\.com\.my\//.test(url))return url;
  if(/\/r(\.html)?\?k=/.test(url))return url;                     // 이미 단축된 주소
  try{
    const col=collection(db,'shorts');
    const ex=await getDocs(query(col,where('url','==',url)));
    let key='';
    if(!ex.empty){key=ex.docs[0].data().key;}
    else{
      for(let n=4;n<=8&&!key;n++){
        const k=Math.random().toString(36).slice(2,2+n);
        if(k.length<n)continue;
        const dup=await getDocs(query(col,where('key','==',k)));
        if(dup.empty){await addDoc(col,{key:k,url:url,created:new Date().toISOString()});key=k;}
      }
      if(!key)return url;
    }
    return (_hhcShortCache[url]=HHC_SHORT_BASE+key);
  }catch(e){return url;}
}
// 문구 전체에서 긴 주소를 찾아 모두 짧은 주소로 (실패한 주소는 원문 유지)
async function hhcShortLinks(text){
  text=String(text==null?'':text);
  const found=text.match(/https:\/\/(?:www\.)?happyhomecare\.com\.my\/[^\s'"<>)\]]+/g)||[];
  const uniq=found.filter((u,i)=>found.indexOf(u)===i);
  for(const u of uniq){
    const s=await hhcShortUrl(u);
    if(s!==u)text=text.split(u).join(s);
  }
  return text;
}

function hccNN(n){return String(n||'').toLowerCase().replace(/\s+/g,'');}

}
function hccNameHit(c,nn){if(!nn)return false;if(hccNN(c.name)===nn)return true;return (c.aliases||[]).some(function(a){return hccNN(a)===nn;});}
window.HHCC_upsert=async function(name,phone,extra){

    var list=await hccLoad();

    var now=new Date().toISOString();

};

window.HHCC_check=async function(name,phone){

        if(a==='use_existing'){res({phone:m.phone,action:'use_existing'});return;}
        if(a==='use_new'){hccPropagate(m,phone);res({phone:phone,action:'use_new'});return;}
        res({phone:phone,action:'separate'});
      });
    });
  }catch(e){return {phone:phone,action:'keep'};}
};

// HHCC v2 — 고객정보 자동 채움 · 전 프로그램 동기화
//  · HHCC_find   : 연락처/이름/별칭/기호무시/부분일치 순으로 고객 찾기
//  · HHCC_fill   : 비어 있는 값(특히 연락처)을 고객 마스터에서 채움
//  · HHCC_autofill : 입력칸에 연결 — 고객명 입력을 마치면 연락처 자동 표시
//  · hccSyncAsk  : 「무엇이 어디에 반영되는지」 보여주고 확인받는 창
//  · hccPropagate: 확인 후 계약서·인보이스·점검보고서·예약·일정·의뢰·견적·메모장 일괄 반영
// ═══════════════════════════════════════════════════════════════════
var HCC_JOBS=[
  {c:'contracts',  lbl:'계약서',     ic:'📑', p:'phone',          n:['name']},
  {c:'invoices',   lbl:'인보이스',   ic:'💳', p:'customer.phone', n:['customer.name']},
  {c:'inspections',lbl:'점검보고서', ic:'🔍', p:'phone',          n:['client']},
  {c:'bookings',   lbl:'예약',       ic:'🛎️', p:'customer_phone', n:['customer_name']},
  {c:'schedules',  lbl:'일정',       ic:'📅', p:'customer_phone', n:['customer_name']},
  {c:'requests',   lbl:'의뢰',       ic:'📨', p:'phone',          n:[], key:function(x){return ((x.condo_name||x.condo||'')+' '+(x.condo_unit||'')).trim();}},
  {c:'quotes',     lbl:'견적서',     ic:'📄', p:'phone',          n:['client']},
  {c:'memos',      lbl:'메모장',     ic:'📝', p:'phone',          n:['name','condo']}
];
function hccPick(o,path){var a=String(path||'').split('.'),v=o;for(var i=0;i<a.length;i++){if(v==null)return '';v=v[a[i]];}return v==null?'':v;}
// 기호·공백을 모두 뺀 비교키 (RESIDENSI22 A-18-03 ↔ residensi22a1803)
function hccKey(s){return String(s==null?'':s).toLowerCase().replace(/[^0-9a-z가-힣]/g,'');}
// 사람이 지운 값(******, ---, 미상 등)은 「연락처 없음」으로 본다
function hccIsPhoneish(s){return !/[a-zA-Z\uAC00-\uD7A3]/.test(String(s==null?'':s));}
function hccPhoneOk(p){return hccIsPhoneish(p)&&hccPN(p).length>=6;}

// ── 고객 찾기 (여러 단계) ──────────────────────────────────────────
window.HHCC_find=async function(name,phone){
  try{
    var list=await hccLoad();
    var pn=hccPN(phone),nn=hccNN(name),kk=hccKey(name),m=null;
    if(hccPhoneOk(phone))m=list.find(function(c){return hccPN(c.phone)===pn;})||null;
    if(!m&&nn)m=list.find(function(c){return hccNN(c.name)===nn;})||null;
    if(!m&&nn)m=list.find(function(c){return (c.aliases||[]).some(function(a){return hccNN(a)===nn;});})||null;
    if(!m&&kk)m=list.find(function(c){return hccKey(c.name)===kk||(c.aliases||[]).some(function(a){return hccKey(a)===kk;});})||null;
    // ⚠️ 「부분 포함」 찾기는 쓰지 않습니다 — 「RESIDENSI 22」처럼 콘도명만으로 등록된 고객이
    //    같은 콘도의 다른 호수(RESIDENSI 22 A-18-03)와 같은 사람으로 잡혀, 의뢰 고객정보를 고치면
    //    엉뚱한 고객의 연락처가 채워지거나 다른 고객 상세에 연결되는 문제가 있었습니다.
    return m;
  }catch(e){return null;}
};
// ── 비어 있는 고객정보를 마스터에서 채우기 ────────────────────────
window.HHCC_fill=async function(info){
  info=info||{};
  var out={name:String(info.name||'').trim(),phone:String(info.phone||'').trim(),
           addr:String(info.addr||'').trim(),email:String(info.email||'').trim(),
           filled:[],master:null};
  if(!hccPhoneOk(out.phone))out.phone='';
  var m=await window.HHCC_find(out.name,out.phone);
  if(!m)return out;
  out.master=m;
  if(!out.phone&&hccPhoneOk(m.phone)){out.phone=String(m.phone).trim();out.filled.push('연락처');}
  if(!out.name&&m.name){out.name=m.name;out.filled.push('고객명');}
  if(!out.addr&&m.addr){out.addr=m.addr;out.filled.push('주소');}
  if(!out.email&&m.email){out.email=m.email;out.filled.push('이메일');}
  return out;
};
// ── 입력칸 연결 : 고객명을 다 쓰면 등록된 연락처를 자동으로 채운다 ──
window.HHCC_autofill=function(nameSel,phoneSel,opt){
  opt=opt||{};
  function el(s){return typeof s==='string'?document.querySelector(s):s;}
  var nEl=el(nameSel),pEl=el(phoneSel);
  if(!nEl||!pEl)return;
  var busy=false;
  async function go(){
    if(busy)return;
    var cur=String(pEl.value||'').trim();
    if(hccPhoneOk(cur))return;                       // 이미 제대로 된 번호가 있으면 그대로 둔다
    var nm=String(nEl.value||'').trim();
    if(opt.extra){var ex=el(opt.extra);if(ex&&ex.value)nm=(nm+' '+String(ex.value).trim()).trim();}
    if(hccKey(nm).length<3)return;
    busy=true;
    try{
      var m=await window.HHCC_find(nm,'');
      if(m&&hccPhoneOk(m.phone)){
        pEl.value=String(m.phone).trim();
        try{pEl.dispatchEvent(new Event('input',{bubbles:true}));pEl.dispatchEvent(new Event('change',{bubbles:true}));}catch(_){}
        hccHint(pEl,'📞 등록된 연락처를 불러왔습니다 · '+(m.name||''));
      }
    }catch(e){}
    busy=false;
  }
  nEl.addEventListener('blur',go);
  if(opt.extra){var ex2=el(opt.extra);if(ex2)ex2.addEventListener('blur',go);}
  pEl.addEventListener('focus',function(){if(!hccPhoneOk(pEl.value))go();});
};
function hccHint(el,msg){
  try{
    if(typeof toast==='function'){toast(msg);return;}
    hccCSS();
    var b=document.createElement('div');b.className='hcc-hint';b.textContent=msg;
    document.body.appendChild(b);
    setTimeout(function(){b.classList.add('out');},2200);
    setTimeout(function(){b.remove();},2700);
  }catch(e){}
}

// ── 어디에 몇 건이 걸려 있는지 세기 ───────────────────────────────
async function hccScan(oldPhone,oldName){
  var oldPN=hccPN(oldPhone),oldKK=hccKey(oldName),found=[];
  for(var i=0;i<HCC_JOBS.length;i++){
    var job=HCC_JOBS[i];
    try{
      var snap=await hccGetAll(job.c);
      var hits=[];
      snap.docs.forEach(function(d){
        var x=d.data()||{};
        if(oldPN&&oldPN.length>=6&&hccPN(hccPick(x,job.p))===oldPN){hits.push({id:d.id,f:'',x:x});return;}
        if(!oldKK||oldKK.length<3)return;
        // 이름이 같아도 「다른 연락처」가 적힌 문서는 다른 고객(같은 콘도의 다른 호수 등)일 수 있으므로 건드리지 않습니다
        //  · 이전 연락처가 있는 경우 : 연락처가 같은 문서만 (위에서 처리) → 이름으로는 연락처 없는 문서만
        //  · 이전 연락처가 없는 경우 : 이름이 같고 연락처도 없는 문서만
        if(hccPhoneOk(hccPick(x,job.p)))return;
        if(job.key){try{if(hccKey(job.key(x))===oldKK){hits.push({id:d.id,f:'',x:x});return;}}catch(e0){}}
        var fs=job.n||[];
        for(var q=0;q<fs.length;q++){
          if(hccKey(hccPick(x,fs[q]))===oldKK){hits.push({id:d.id,f:fs[q],x:x});return;}
        }
      });
      if(hits.length)found.push({job:job,hits:hits});
    }catch(e){}
  }
  return found;
}
// ── 확인 창 : 무엇이 → 무엇으로, 어디에 몇 건 ────────────────────
function hccSyncAsk(prev,next,found){
  return new Promise(function(res){
    hccCSS();
    var total=found.reduce(function(a,b){return a+b.hits.length;},0);
    var rows=found.map(function(f){
      return '<div class="hcc-row"><span>'+f.job.ic+' '+f.job.lbl+'</span><b>'+f.hits.length+'건</b></div>';
    }).join('')||'<div class="hcc-row hcc-none">다른 프로그램에는 이 고객 기록이 없습니다</div>';
    var cmp='';
    if(hccNN(prev.name)!==hccNN(next.name)&&next.name)
      cmp+='<div class="hcc-cmp2"><small>고객명</small><div><b>'+hccEsc(prev.name||'—')+'</b><i>→</i><b class="hcc-new">'+hccEsc(next.name)+'</b></div></div>';
    if(hccPN(prev.phone)!==hccPN(next.phone))
      cmp+='<div class="hcc-cmp2"><small>연락처</small><div><b>'+hccEsc(prev.phone||'—')+'</b><i>→</i><b class="hcc-new">'+hccEsc(next.phone||'—')+'</b></div></div>';
    var old=document.getElementById('hhcc-mask');if(old)old.remove();
    var mk=document.createElement('div');mk.id='hhcc-mask';
    mk.innerHTML='<div id="hhcc-box"><div class="hhcc-h">🔄 고객정보가 바뀌었습니다</div><div class="hhcc-b">'+
      '<p class="hhcc-p">바뀐 내용을 다른 프로그램에도 함께 반영할까요?</p>'+cmp+
      '<div class="hcc-list"><div class="hcc-list-h">함께 바뀌는 기록 · 모두 '+total+'건</div>'+rows+'</div>'+
      '<button type="button" class="hhcc-opt hcc-prim" data-a="all"><b>모든 프로그램에 반영</b><span>위 '+total+'건의 고객명·연락처가 새 정보로 함께 바뀝니다.</span></button>'+
      '<button type="button" class="hhcc-opt" data-a="here"><b>이 화면만 변경</b><span>지금 저장하는 기록만 바꾸고 나머지는 그대로 둡니다.</span></button>'+
      '</div><div class="hhcc-f"><button type="button" class="hhcc-x" data-a="cancel">취소</button></div></div>';
    document.body.appendChild(mk);
    mk.addEventListener('click',function(ev){
      var b=ev.target.closest?ev.target.closest('[data-a]'):null;if(!b)return;
      mk.remove();res(b.getAttribute('data-a'));
    });
  });
}
// ── 실제 일괄 반영 ────────────────────────────────────────────────
// 이름은 「이전 이름이 실제로 들어 있던 칸」에만 씁니다.
// (메모장처럼 고객명·콘도명 두 칸이 있는 경우 엉뚱한 칸을 덮어쓰지 않도록)
async function hccApply(found,next,prevName){
  var done=0,pk=hccKey(prevName);
  for(var i=0;i<found.length;i++){
    var f=found[i];
    for(var k=0;k<f.hits.length;k++){
      var h=f.hits[k],upd={},fs=f.job.n||[];
      if(hccPhoneOk(next.phone))upd[f.job.p]=next.phone;
      if(next.name){
        var nf=h.f;
        if(!nf&&pk){for(var q=0;q<fs.length;q++){if(hccKey(hccPick(h.x,fs[q]))===pk){nf=fs[q];break;}}}
        if(!nf){for(var q2=0;q2<fs.length;q2++){if(!hccPick(h.x,fs[q2])){nf=fs[q2];break;}}}
        if(nf)upd[nf]=next.name;
      }
      if(!Object.keys(upd).length)continue;
      try{await hccWriteAny(f.job.c,h.id,upd);done++;}catch(e){}
    }
  }
  return done;
}
// ── 고객 마스터 기준 동기화 (연락처·고객명 모두) ──────────────────
//    ask=false 로 부르면 확인 없이 바로 반영합니다.
window.HHCC_sync=async function(prev,next,ask){
  prev=prev||{};next=next||{};
  var phCh=hccPhoneOk(prev.phone)&&hccPhoneOk(next.phone)&&hccPN(prev.phone)!==hccPN(next.phone);
  var nmCh=!!(hccKey(prev.name)&&hccKey(next.name)&&hccKey(prev.name)!==hccKey(next.name));
  if(!phCh&&!nmCh)return {changed:false,applied:0};
  var found=await hccScan(prev.phone,prev.name);
  var ans=(ask===false)?'all':await hccSyncAsk(prev,next,found);
  if(ans==='cancel')return {changed:true,applied:0,cancel:true};
  if(ans!=='all')return {changed:true,applied:0};
  var n=await hccApply(found,next,prev.name);
  // 고객 마스터도 갱신 (이전 이름은 별칭으로 남긴다)
  try{
    var m=await window.HHCC_find(prev.name,prev.phone);
    // 이름으로만 찾아진 고객이 「다른 연락처」를 갖고 있으면 다른 사람입니다 — 그 고객의 이름·연락처를 바꾸지 않습니다
    if(m&&hccPhoneOk(m.phone)&&hccPhoneOk(prev.phone)&&hccPN(m.phone)!==hccPN(prev.phone))m=null;
    if(m&&m._docId){
      var upd={updated_at:new Date().toISOString()};
      if(hccPhoneOk(next.phone))upd.phone=next.phone;
      if(next.name&&hccNN(next.name)!==hccNN(m.name)){
        upd.name=next.name;
        var al=(m.aliases||[]).slice();
        if(m.name&&!al.some(function(a){return hccNN(a)===hccNN(m.name);}))al.push(m.name);
        upd.aliases=al;m.aliases=al;
      }
      await hccWrite(m._docId,upd);
      if(upd.phone)m.phone=upd.phone;
      if(upd.name)m.name=upd.name;
    }
  }catch(e){}
  HHCC_TS=0; // 캐시 새로고침
  hccHint(document.body,'🔄 다른 프로그램 '+n+'건에 반영했습니다');
  return {changed:true,applied:n};
};

async function hccPropagate(m,newPhone){
  try{
    if(!m)return;
    var found=await hccScan(m.phone,m.name);
    var n=await hccApply(found,{phone:newPhone,name:''},m.name);
    if(m._docId){try{await hccWrite(m._docId,{phone:newPhone,updated_at:new Date().toISOString()});}catch(e3){}}
    m.phone=newPhone;HHCC_TS=0;
    hccHint(document.body,'🔄 다른 프로그램 '+n+'건의 연락처를 바꿨습니다');
  }catch(e){}
}

// ═══════════════════════════════════════════════════════════
var HHCG_PH={},HHCG_NM={},HHCG_CPH={},HHCG_CNM={},HHCG_ON=false;
// 📞 연락 경로 표시 (W=WhatsApp · K=카카오톡 · O=기타) — 총괄 고객관리와 같은 값(customers.ca_ch)을 씁니다.
// 아무 기능도 하지 않는 표시 전용이며 관리 화면에만 보입니다 (공유 메시지·일정표 이미지에는 들어가지 않습니다).
var HHCH_PH={},HHCH_NM={},HHCH_IDPH={},HHCH_IDNM={};
var HHCH_LOCPH={},HHCH_LOCNM={}; // 📍 고객관리 고객 위치 (customers.loc · 연락처 / 이름·별칭) — 길 안내에 씀 (2026-11-17)
var CH_LB={W:'💬 WhatsApp',K:'💛 카카오톡',O:'🌐 기타'};
function chOK(v){v=String(v||'').toUpperCase();return CH_LB[v]?v:'';}
var HHCG_PKG={silver:'실버',royal:'로얄',gold:'골드',diamond:'다이아',titanium:'티타늄',special:'스페셜해피홈'};
function hhcgPN(p){p=String(p||'').replace(/[^0-9]/g,'');if(p.indexOf('60')===0)p=p.slice(2);return p.replace(/^0+/,'');}
function hhcgNN(n){return String(n||'').toLowerCase().replace(/\s+/g,'');}
function hhcgEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hhcgPkgLabel(pid){
  if(!pid)return '';
  var biz=/-biz$/.test(String(pid)),base=HHCG_PKG[String(pid).replace(/-biz$/,'')]||pid;
  return base+(biz?'(사업)':'');
}
// customers · contracts 를 실시간 구독해 등급표를 항상 최신 상태로 유지
function hhcgWatch(onChange){
  if(HHCG_ON||!db)return;HHCG_ON=true;
  try{
    onSnapshot(collection(db,'customers'),function(snap){
      var ph={},nm={},chp={},chn={},idp={},idn={},lp={},ln={};
      snap.docs.forEach(function(d){
        var c=d.data()||{},g=String(c.member||'').trim();
        var p0=hhcgPN(c.phone),ns=[c.name].concat(c.aliases||[]);
        if(c.loc&&isFinite(c.loc.lat)&&isFinite(c.loc.lng)){if(p0.length>=6&&!lp[p0])lp[p0]=c.loc;ns.forEach(function(a){var k=hhcgNN(a);if(k&&!ln[k])ln[k]=c.loc;});}
        // 📞 연락 경로 표시 + 고객 문서 ID (등급이 없는 고객도 포함해야 하므로 먼저 담는다)
        var cv=chOK(c.ca_ch);
        if(p0){if(!idp[p0])idp[p0]=d.id;if(cv&&!chp[p0])chp[p0]=cv;}
        ns.forEach(function(a){var k=hhcgNN(a);if(!k)return;if(!idn[k])idn[k]=d.id;if(cv&&!chn[k])chn[k]=cv;});
        if(!g)return;
        if(p0&&!ph[p0])ph[p0]=g;
        ns.forEach(function(a){var k=hhcgNN(a);if(k&&!nm[k])nm[k]=g;});
      });
      HHCG_PH=ph;HHCG_NM=nm;
      HHCH_PH=chp;HHCH_NM=chn;HHCH_IDPH=idp;HHCH_IDNM=idn;HHCH_LOCPH=lp;HHCH_LOCNM=ln;
      if(onChange)try{onChange();}catch(e){}
    },function(){});
    onSnapshot(collection(db,'contracts'),function(snap){
      var ph={},nm={};
      snap.docs.forEach(function(d){
        var c=d.data()||{};
        var g=c.package_id?('패키지 - '+hhcgPkgLabel(c.package_id)):'패키지(계약)';
        var p=hhcgPN(c.phone);if(p&&!ph[p])ph[p]=g;
        var k=hhcgNN(c.name);if(k&&!nm[k])nm[k]=g;
      });
      HHCG_CPH=ph;HHCG_CNM=nm;
      if(onChange)try{onChange();}catch(e){}
    },function(){});
  }catch(e){}
}
function memberGrade(name,phone){
  var p=hhcgPN(phone),n=hhcgNN(name);
  if(p&&HHCG_PH[p])return HHCG_PH[p];
  if(n&&HHCG_NM[n])return HHCG_NM[n];
  if(p&&HHCG_CPH[p])return HHCG_CPH[p];
  if(n&&HHCG_CNM[n])return HHCG_CNM[n];
  return '';
}
// 고객명 옆에 붙일 회원등급 배지 HTML (등급 없으면 빈 문자열)
function gradeBadge(name,phone){
  var g=memberGrade(name,phone);
  if(!g)return '';
  if(g.toUpperCase()==='VVIP')return '<span class="mg-badge mg-vvip">👑 VVIP</span>';
  if(/^패키지/.test(g))return '<span class="mg-badge mg-pkg">📦 '+hhcgEsc(g)+'</span>';
  return '<span class="mg-badge mg-etc">'+hhcgEsc(g)+'</span>';
}
// 예약 시간 표기 — 내부 저장값이 "오후 2시|14:00" 형태면 뒤의 24시간 표기(14:00)를 쓴다.
// (예전에는 숫자만 남겨 "214:0" 처럼 깨져 보였다)
function bkTime(v){
  var t=String(v||'').trim();
  if(!t)return '';
  if(t.indexOf('|')>=0){var a=t.split('|');t=String(a[1]||a[0]||'').trim();}
  var m=/(\d{1,2}):(\d{2})/.exec(t);
  if(m)return String(m[1]).padStart(2,'0')+':'+m[2];
  return t.replace(/[^0-9:]/g,'').slice(0,5);
}

// 일정 항목에서 고객명을 뽑아 등급 배지를 만든다.
// 예약 자동반영 일정은 customer_name, 직접입력 일정은 제목 앞부분("고객명 — 내용")을 쓴다.
function schGrade(s){
  if(!s)return '';
  var nm=s.customer_name||'';
  if(!nm&&s.title)nm=String(s.title).split(' — ')[0].trim();
  return gradeBadge(nm,s.customer_phone||'');
}

// ── 📞 연락 경로 표시 (W · K · O) ─────────────────────────
// 총괄 고객관리에서 고른 값을 그대로 보여주며, 여기서 눌러 바꿀 수도 있습니다.
// 고객이 있는 일정인지 — 예약(자동반영·직접입력) 이거나 고객정보가 들어있는 일정만 해당됩니다.
// (휴일 · 직접입력 · 구글 캘린더 일정에는 연락 경로를 표시하지 않습니다)
function schHasCust(s){return !!s&&(schIsBk(s.type)||!!s.customer_name||!!s.customer_phone);}
function schName(s){
  if(!s)return '';
  var nm=s.customer_name||'';
  // 예약 일정은 제목이 곧 고객명입니다 (그 외 일정의 제목은 고객명이 아니므로 쓰지 않습니다)
  if(!nm&&schIsBk(s.type)&&s.title)nm=String(s.title).split(' — ')[0].trim();
  return nm;
}
function chValue(name,phone){
  var p=hhcgPN(phone),n=hhcgNN(name);
  if(p&&HHCH_PH[p])return HHCH_PH[p];
  if(n&&HHCH_NM[n])return HHCH_NM[n];
  return '';
}
function chDocId(name,phone){
  var p=hhcgPN(phone),n=hhcgNN(name);
  if(p&&HHCH_IDPH[p])return HHCH_IDPH[p];
  if(n&&HHCH_IDNM[n])return HHCH_IDNM[n];
  return '';
}
function schCh(s){
  if(!schHasCust(s))return '';                 // 고객이 없는 일정(휴일 · 직접입력 등)은 표시하지 않는다
  var nm=schName(s),ph=s.customer_phone||'';
  if(!nm&&!ph)return '';
  var v=chValue(nm,ph),cls=v?v.toLowerCase():'n';
  var tt=v?('연락 경로 : '+CH_LB[v]+' (눌러서 변경)'):'연락 경로 표시 (눌러서 선택)';
  return '<button type="button" class="chb '+cls+'" title="'+hhcgEsc(tt)+'" onclick="schChMenu(event,this,\''+s._id+'\')">'+(v||'＋')+'</button>';
}
function schChClose(){var m=document.getElementById('chmenu');if(m)m.remove();}
document.addEventListener('click',schChClose);
window.addEventListener('scroll',schChClose,true);
window.schChMenu=function(ev,btn,id){
  ev.stopPropagation();ev.preventDefault();
  schChClose();
  var it=getMerged(selDate).find(function(x){return x._id===id;});
  if(!it){showToast('일정 정보를 찾을 수 없습니다');return;}
  var cur=chValue(schName(it),it.customer_phone||'');
  var m=document.createElement('div');m.id='chmenu';
  m.innerHTML='<div class="ch-t">📞 연락 경로 표시</div>'+
    ['W','K','O'].map(function(k){
      return '<button onclick="schChSet(\''+id+'\',\''+k+'\')"><i>'+k+'</i>'+CH_LB[k]+(cur===k?' ✓':'')+'</button>';
    }).join('')+
    '<div class="ch-sep"></div>'+
    '<button onclick="schChSet(\''+id+'\',\'\')"><i>–</i>표시 없음'+(cur?'':' ✓')+'</button>';
  document.body.appendChild(m);
  var r=btn.getBoundingClientRect(),w=m.offsetWidth||186,h=m.offsetHeight||190;
  var x=Math.min(r.left,window.innerWidth-w-8),y=r.bottom+6;
  if(x<8)x=8;
  if(y+h>window.innerHeight-8)y=Math.max(8,r.top-h-6);
  m.style.left=x+'px';m.style.top=y+'px';
};
window.schChSet=async function(id,v){
  schChClose();
  v=chOK(v);
  var it=getMerged(selDate).find(function(x){return x._id===id;});
  if(!it)return;
  var nm=schName(it),ph=it.customer_phone||'';
  if(!schHasCust(it)||(!nm&&!ph)){showToast('고객 정보가 없는 일정입니다');return;}
  try{
    var mid=chDocId(nm,ph);
    if(!mid){   // 고객 마스터에 없는 고객이면 먼저 등록한다 (총괄 고객관리와 같은 방식)
      var now=new Date().toISOString();
      var ref=await addDoc(collection(db,'customers'),{id:'c'+Date.now(),name:nm,phone:ph,member:'',email:'',addr:it.customer_address||'',memo:'',aliases:[],created_at:now,updated_at:now});
      mid=ref.id;
    }
    await updateDoc(doc(db,'customers',mid),{ca_ch:v,updated_at:new Date().toISOString()});
    // 화면 즉시 반영 (실시간 구독으로도 곧 갱신됩니다)
    var p=hhcgPN(ph),n=hhcgNN(nm);
    if(p){if(v)HHCH_PH[p]=v;else delete HHCH_PH[p];HHCH_IDPH[p]=mid;}
    if(n){if(v)HHCH_NM[n]=v;else delete HHCH_NM[n];HHCH_IDNM[n]=mid;}
    renderDay(selDate);
    showToast(v?('📞 '+CH_LB[v]+' 로 표시됩니다'):'📞 연락 경로 표시를 지웠습니다');
  }catch(err){showToast('저장 실패: '+err.message);}
};

async function initApp(){
  showLoading(true);
  try{
    const app=initializeApp(FIREBASE_CFG);
    db=hhcFastDb(app);
    hhcgWatch(refresh);   // 회원등급표 실시간 구독

    onSnapshot(collection(db,'schedules'),snap=>{
      window.__hhcReady&&window.__hhcReady();
      // 화면은 항상 한국어로 엽니다 (영어는 EN 버튼을 눌렀을 때만)
      schedules={};
      RAW_SCH=snap.docs.map(d=>Object.assign({},d.data(),{_id:d.id}));
      snap.docs.forEach(d=>{
        const dat=Object.assign({},d.data(),{_id:d.id,source:'manual'});
        // 확정 예약이 자동 생성한 미러 일정(booking_id 보유)은 bookings 컬렉션에서 이미 표시되므로 제외 → 중복 방지
        if(dat.booking_id)return;
        if(!schedules[dat.date])schedules[dat.date]=[];
        schedules[dat.date].push(dat);
      });
      sortAll(schedules);
      refresh();findOrphans();
      if(window._schOpenId)setTimeout(schTryOpen,200);
    });

    onSnapshot(collection(db,'bookings'),snap=>{
      bookings={};BK_ALL={};bkReady=true;
      snap.docs.forEach(d=>{
        const b=Object.assign({},d.data(),{_id:d.id});
        BK_ALL[d.id]={date:String(b.booking_date||'').slice(0,10),
                      name:String(b.customer_name||'').trim(),status:String(b.status||'')};
        if(b.status!=='confirmed'||!b.booking_date)return;
        if(!bookings[b.booking_date])bookings[b.booking_date]=[];
        bookings[b.booking_date].push({
          _id:'bk_'+b._id,source:'booking',
          date:b.booking_date,
          title:b.customer_name||b.customer_address||(curLang==='en'?'Booking':'예약'),
          time_s:bkTime(b.booking_time),
          time_e:'',type:'booking',
          memo:[
            b.booking_items?'🔧 '+b.booking_items:'',
            b.booking_memo?'📝 '+b.booking_memo:''
          ].filter(Boolean).join('\n'),
          real_booking_id:b._id,
          customer_name:b.customer_name||'',
          customer_phone:b.customer_phone||'',
          customer_lang:b.customer_lang||'ko',
          customer_address:b.customer_address||'',
          loc:(b.customer_loc&&isFinite(b.customer_loc.lat))?b.customer_loc:((b.loc&&isFinite(b.loc.lat))?b.loc:null),   // 📍 예약 위치는 customer_loc (2026-11-17 수정)
          sch_slot:(typeof b.sch_slot==='number')?b.sch_slot:null,
          sch_ovok:b.sch_ovok===true,
          booking_date:b.booking_date
        });
      });
      sortAll(bookings);
      refresh();findOrphans();
    });

    // 메모장(수리요청) — 자동 등록된 「🛠 수리」 일정의 원본 확인용
    onSnapshot(collection(db,'memos'),snap=>{
      MEMO_IDS=new Set(snap.docs.map(d=>d.id));mmReady=true;findOrphans();
    },()=>{mmReady=true;});

    showLoading(false);
    const t=myNow();
    selDate=fmt(t);
    renderNav();renderCal();renderDay(selDate);
    setTimeout(schTryOpen,400);   // 「열기·수정」으로 들어온 일정이 있으면 그 날짜로 이동
  }catch(e){showLoading(false);alert('Firebase 오류: '+e.message);}
}

function sortAll(map){Object.keys(map).forEach(dt=>{map[dt].sort((a,b)=>(a.time_s||'').localeCompare(b.time_s||''));});}

/* ═══ 🧹 원본이 삭제된 자동 일정 찾기 ═══
   「예약·메모와 연결된 번호(booking_id · memo_id)를 가지고 있는데 그 원본이 없는」
   일정만 골라냅니다. 연결 번호가 없는 일정은 직접 만든 일정일 수 있으므로
   어떤 경우에도 자동 정리 대상에 넣지 않습니다. */
function findOrphans(){
  if(!bkReady)return;
  orphanIds=RAW_SCH.filter(function(s2){
    if(s2.booking_id)return !BK_ALL[s2.booking_id];
    if(s2.memo_id)return mmReady&&!MEMO_IDS.has(s2.memo_id);
    return false;
  }).map(function(s2){return s2._id;});
  renderOrphanBar();
}
function renderOrphanBar(){
  const bar=document.getElementById('orphan-bar');
  if(!bar)return;
  if(!orphanIds.length||window._orphanHide){bar.style.display='none';bar.innerHTML='';return;}
  bar.style.display='block';
  bar.style.cssText='display:block;margin:0 14px 10px;background:#FFF7ED;border:1.5px solid #FDBA74;'+
    'border-radius:12px;padding:11px 13px;font-size:13px;font-weight:800;color:#9A3412;line-height:1.6';
  bar.innerHTML='🧹 예약·메모가 삭제되었는데 캘린더에 남아 있는 자동 일정 <b>'+orphanIds.length+'건</b>이 있습니다.'+
    '<div style="margin-top:8px;display:flex;gap:7px;flex-wrap:wrap">'+
    '<button type="button" id="orphan-go" style="font-family:inherit;font-size:12.5px;font-weight:900;border:none;'+
      'background:#EA580C;color:#fff;border-radius:9px;padding:9px 15px;cursor:pointer">🧹 지금 정리하기</button>'+
    '<button type="button" id="orphan-x" style="font-family:inherit;font-size:12.5px;font-weight:800;border:1.5px solid #FDBA74;'+
      'background:#fff;color:#9A3412;border-radius:9px;padding:9px 13px;cursor:pointer">나중에</button></div>';
  bar.querySelector('#orphan-x').onclick=function(){window._orphanHide=true;renderOrphanBar();};
  bar.querySelector('#orphan-go').onclick=cleanOrphans;
}
async function cleanOrphans(){
  if(!orphanIds.length)return;
  const names=RAW_SCH.filter(function(s2){return orphanIds.indexOf(s2._id)>=0;})
    .slice(0,8).map(function(s2){return '· '+String(s2.date||'')+'  '+String(s2.title||'');}).join('\n');
  if(!confirm('원본이 삭제된 자동 일정 '+orphanIds.length+'건을 정리할까요?\n\n'+names+
    (orphanIds.length>8?('\n… 외 '+(orphanIds.length-8)+'건'):'')+
    '\n\n· 직접 만든 일정은 지워지지 않습니다.\n· 되돌릴 수 없습니다.'))return;
  showLoading(true);
  let ok=0;
  for(const id of orphanIds){
    try{await deleteDoc(doc(db,'schedules',id));ok++;}catch(e){}
  }
  showLoading(false);
  showToast('🧹 자동 일정 '+ok+'건을 정리했습니다');
}
// 📅 직접 추가한 「예약」 일정도 예약확정 건과 동일하게 취급 (색상·집계·고객 버튼)
function schIsBk(t){return t==='booking'||t==='reserve';}
function getMerged(ds){return [...(bookings[ds]||[]),...(schedules[ds]||[])].sort((a,b)=>(a.time_s||'').localeCompare(b.time_s||''));}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getWeekStart(d){const day=d.getDay();const s=new Date(d);s.setDate(d.getDate()-day);return s;}

// ── 📎 총괄 고객관리 등에서 「열기·수정」으로 들어온 경우 ──
//    해당 일정의 날짜로 이동해 목록에서 잠시 강조합니다. (그 자리에서 ✏️ 수정 가능)
window._schOpenId=(function(){try{return new URLSearchParams(location.search).get('open')||'';}catch(e){return '';}})();
async function schTryOpen(){
  const k=window._schOpenId;if(!k)return;
  const hit=RAW_SCH.find(function(s2){return s2._id===k;});
  if(!hit)return;                        // 아직 못 불러왔으면 다음 갱신 때 다시 시도
  window._schOpenId='';
  const ds=String(hit.date||'').slice(0,10);
  if(ds){
    const d=new Date(ds+'T00:00:00');
    if(!isNaN(d.getTime())){curY=d.getFullYear();curM=d.getMonth();weekStart=getWeekStart(d);}
    selDate=ds;
    renderNav();renderCal();
    await renderDay(ds);
  }
  setTimeout(function(){
    const el=document.querySelector('.sch-item[data-id="'+k.replace(/"/g,'')+'"]');
    if(!el)return;
    try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}
    el.classList.add('sx-flash');setTimeout(function(){el.classList.remove('sx-flash');},3000);
  },300);
}

function refresh(){
  renderNav();
  renderCal();if(selDate)renderDay(selDate);
  if(document.getElementById('sx-fs').classList.contains('on'))sxRenderFS();
}

// ── 뷰 전환 (주 보기는 전체 화면 달력의 「주」로 엽니다)
window.setView=function(v){
  if(v==='week'){sxOpenFS('w');return;}
  curView='month';refresh();
};

// ── 네비 : 「11월 2026」
function renderNav(){
  const MO_EN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('nav-month-lbl').innerHTML=curLang==='en'
    ?(MO_EN[curM]+'<small>'+curY+'</small>'):((curM+1)+'월<small>'+curY+'</small>');
  const tb=document.getElementById('today-btn');
  tb.textContent=curLang==='en'?'Today':'오늘';
  tb.classList.toggle('hi',!!selDate&&selDate!==myDateStr());
}

window.prevPeriod=function(){if(curM===0){curY--;curM=11;}else curM--;refresh();};
window.nextPeriod=function(){if(curM===11){curY++;curM=0;}else curM++;refresh();};
window.goToday=function(){
  const t=myNow();curY=t.getFullYear();curM=t.getMonth();weekStart=getWeekStart(t);

function sxEn(){return curLang==='en';}

function sxEsc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sxM(t){const m=/^(\d{1,2}):(\d{2})/.exec(String(t||''));return m?(+m[1])*60+(+m[2]):null;}
function sxHM(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function sxDur(m){return curLang==='en'?(m>=60?Math.floor(m/60)+'h'+(m%60?' '+m%60+'m':''):m+'m'):(m>=60?Math.floor(m/60)+'시간'+(m%60?' '+m%60+'분':''):m+'분');}

function sxList(ds){return getMerged(ds).filter(s=>s.type!=='holiday');}

/* 시간 겹침 — 끝 시간이 둘 다 있으면 시간이 겹칠 때, 없으면 시작 시간이 전후 1시간 이내일 때(예약관리 알림과 같은 기준) */
/* 겹침 허용 — 직접 만든 일정은 schedules.ovok, 예약 일정은 bookings.sch_ovok = true
   허용한 일정이 끼어 있는 겹침은 경고하지 않고, 같은 슬롯에 함께 놓습니다(달력에는 표시 안 함). */
function sxOk(s){return s.source==='booking'?s.sch_ovok===true:s.ovok===true;}
function sxPair(a,b){const as=sxM(a.time_s),bs=sxM(b.time_s);if(as==null||bs==null)return false;
  const ae=sxM(a.time_e),be=sxM(b.time_e);
  return (ae!=null&&be!=null&&ae>as&&be>bs)?(as<be&&bs<ae):Math.abs(as-bs)<=60;}
function sxConf(list){const r=new Set();
  for(let i=0;i<list.length;i++)for(let j=i+1;j<list.length;j++){
    const a=list[i],b=list[j];if(sxOk(a)||sxOk(b))continue;
    if(sxPair(a,b)){r.add(i);r.add(j);}}
  return r;}
function sxSlotOf(t){const m=sxM(t);if(m==null)return -1;return m<660?0:m<780?1:m<900?2:3;}
/* 직접 넣은 슬롯(추가 슬롯 → 빈 슬롯 옮기기) — 일정 시간은 그대로, 표시 칸만 지정
   직접 만든 일정은 schedules.slot, 예약 일정은 bookings.sch_slot 에 0~3 으로 저장 */
function sxOv(s){const v=s.source==='booking'?s.sch_slot:s.slot;return (typeof v==='number'&&v>=0&&v<4)?v:-1;}
function sxSlots(ds,list){list=list||sxList(ds);const base=[null,null,null,null],extra=[],used=new Set();
  list.forEach((s,i)=>{const k=sxOv(s);if(k>=0&&base[k]===null){base[k]=i;used.add(i);}});
  list.forEach((s,i)=>{if(used.has(i))return;const k=sxSlotOf(s.time_s);if(k>=0&&base[k]===null)base[k]=i;else extra.push(i);});
  const join=[[],[],[],[]];
  for(let x=extra.length-1;x>=0;x--){const i=extra[x],a=list[i];
    for(let k=0;k<4;k++){const j=base[k];if(j===null)continue;const b=list[j];
      if((sxOk(a)||sxOk(b))&&sxPair(a,b)){join[k].unshift(i);extra.splice(x,1);break;}}}
  for(let k=0;k<(SX_ADDX[ds]||0);k++)extra.push(null);
  return {base,extra,join};}
function sxBars(ds){const l=sxList(ds);if(!l.length)return '';const sl=sxSlots(ds,l),n=sl.extra.filter(x=>x!==null).length;
  return '<span class="sx-lb">'+sl.base.map(i=>i===null?'<i class="e"></i>':'<i class="sx-'+sxKind(l[i])+'"></i>').join('')+(n?'<b>+'+n+'</b>':'')+'</span>';}
function sxIsDone(ds,s){const td=myDateStr();if(ds<td)return true;if(ds>td)return false;const e=sxEnd(s),n=myNow();return e!=null&&e<=n.getHours()*60+n.getMinutes();}
/* 이름과 장소 — 같은 이름(대부분)이면 한 번만, 다를 때만 장소 줄을 따로 */
function sxNorm(v){return String(v||'').toLowerCase().replace(/[^0-9a-z가-힣]/g,'');}
function sxPlace(s,title){
  const t=sxNorm(title||s.title),c=[s.customer_address,s.customer_name].map(x=>String(x||'').trim()).filter(Boolean);
  for(const x of c){const n=sxNorm(x);if(n&&n!==t&&!t.includes(n)&&!n.includes(t))return x;}
  return '';}
/* 메모 첫 줄이 「🔧 품목」이면 품목 칩으로, 아니면 짧은 메모로 */
function sxMemoParts(memo){const lines=String(memo||'').split('\n').map(x=>x.trim()).filter(Boolean);let chips=[],rest=[];
  lines.forEach(l=>{if(!chips.length&&/^🔧/.test(l))chips=l.replace(/^🔧\s*/,'').split(/\s*[,·\/]\s*/).filter(Boolean).slice(0,4);else rest.push(l.replace(/^📝\s*/,''));});
  return {chips,rest};}
// 📍 길 안내 위치: 예약·일정에 저장된 위치 > (예약·예약형·수리 일정이면) 고객관리 고객 위치 > 주소 글자 (2026-11-17 · 수리 2026-11-18)
function sxLoc(s){
  if(s.loc&&isFinite(s.loc.lat))return s.loc;
  if(s.customer_loc&&isFinite(s.customer_loc.lat))return s.customer_loc;
  if(s.source==='booking'||s.type==='reserve'||s.type==='repair'||s.memo_id){   // 🛠 수리 일정도 고객관리 고객 위치 사용 (2026-11-18)
    var p=hhcgPN(s.customer_phone),l=(p.length>=6&&HHCH_LOCPH[p])||HHCH_LOCNM[hhcgNN(s.customer_name)];
    if(l&&isFinite(l.lat))return l;
  }

function sxNavUrl(s){
  {const _l=sxLoc(s);if(_l)s={...s,loc:_l};}
  if(s.loc&&isFinite(s.loc.lat))return 'https://www.google.com/maps/dir/?api=1&destination='+s.loc.lat+','+s.loc.lng+(s.loc.pid?'&destination_place_id='+encodeURIComponent(s.loc.pid):'')+'&travelmode=driving&dir_action=navigate';
  const q=String(s.customer_address||s.title||'').trim();if(!q)return '';

function sxFind(id){for(const k in bookings){const h=(bookings[k]||[]).find(x=>x._id===id);if(h)return h;}for(const k in schedules){const h=(schedules[k]||[]).find(x=>x._id===id);if(h)return h;}return null;}
function sxShort(s){let n=String(schCleanItem(s).title||'').split(/ — |·/)[0].trim();if(/[가-힣]/.test(n))return n;const w=n.split(/\s+/);return /^\d/.test(w[0])&&w[1]?w[0]+' '+w[1]:(w[0]||'');}

  const first=new Date(curY,curM,1).getDay(),last=new Date(curY,curM+1,0).getDate(),prevLast=new Date(curY,curM,0).getDate();
  let h=wk.map((w,i)=>'<div class="sx-cw'+(i===0?' sun':'')+'">'+w+'</div>').join('');
  for(let i=0;i<first;i++)h+='<div class="sx-cd o"><span class="n sx-num">'+(prevLast-first+1+i)+'</span></div>';
  for(let d=1;d<=last;d++){
    const ds=sxDs(curY,curM,d),dow=(first+d-1)%7,l=sxList(ds),hol=MYH[ds],off=sxHols(ds);
    let c='sx-cd';if(dow===0)c+=' sun';if(ds<td)c+=' past';if(ds===td)c+=' today';if(ds===selDate)c+=' sel';

    h+='<button class="'+c+'" onclick="sxPick(\''+ds+'\')"'+(hol&&hol.length?' title="'+sxEsc(hol.map(x=>curLang==='en'?x.en:x.ko).join(', '))+'"':'')+'><span class="n sx-num">'+d+'</span>'

async function translateText(text){
  if(!text||curLang==='ko')return text;
  if(translCache[text])return translCache[text];
  const key=localStorage.getItem('hhc_ak')||'';
  if(!key){return text;}
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:800,
        messages:[{role:'user',content:'Translate the following text to English. Return ONLY the translated text, nothing else. Keep emojis, symbols and line breaks exactly as they are:\n\n'+text}]
      })
    });
    const data=await res.json();
    if(data.error){console.warn('Translation error:',data.error.message);return text;}
    const translated=data.content?.[0]?.text||text;
    translCache[text]=translated;
    return translated;
  }catch(e){console.warn('Translation failed:',e);return text;}
}

// 번역 일괄 처리 — 여러 필드를 한 번에
async function translateItem(s){
  if(curLang==='ko')return s;
  const key=localStorage.getItem('hhc_ak')||'';
  if(!key)return s;
  try{
    // 제목과 메모를 구분자로 묶어 한 번에 번역 (API 호출 최소화)
    const combined='[TITLE]'+s.title+'[/TITLE]'+(s.memo?'[MEMO]'+s.memo+'[/MEMO]':'');
    const cacheKey='item:'+combined;
    if(translCache[cacheKey]){
      const cached=translCache[cacheKey];
      return Object.assign({},s,{title:cached.title,memo:cached.memo});
    }
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:800,
        messages:[{role:'user',content:'Translate the following Korean schedule data to English. Keep emojis, symbols (📍📞🔧📝), and line breaks exactly. Return in exact same format with [TITLE] and [MEMO] tags:\n\n'+combined}]
      })
    });
    const data=await res.json();
    if(data.error){console.warn('Translation error:',data.error.message);return s;}
    const result=data.content?.[0]?.text||combined;
    const titleMatch=result.match(/\[TITLE\]([\s\S]*?)\[\/TITLE\]/);
    const memoMatch=result.match(/\[MEMO\]([\s\S]*?)\[\/MEMO\]/);
    const translTitle=titleMatch?titleMatch[1].trim():s.title;
    const translMemo=memoMatch?memoMatch[1].trim():s.memo;
    translCache[cacheKey]={title:translTitle,memo:translMemo};
    return Object.assign({},s,{title:translTitle,memo:translMemo});
  }catch(e){console.warn('Translation failed:',e);return s;}
}


// 🧹 일정 항목 표시 정리 — 저장된 내용은 그대로 두고 화면·이미지에서만 「가정용/매장용」을 뺍니다
function schCleanTxt(t){
  if(t==null||t==='')return t;
  return String(t).split('\n').map(function(l){
    return l.replace(/\s*\(\s*(가정용|매장용|Home|Commercial)\s*\)/gi,'').replace(/(가정용|매장용)/g,'').replace(/[ \t]{2,}/g,' ').replace(/\(\s+/g,'(').trim();
  }).join('\n');
}
// 「콘도명 (콘도명)」처럼 괄호 안이 앞 글과 같은 제목은 한 번만 보여 줍니다(예전에 저장된 메모장 일정 포함)
function schDedupTitle(t){
  if(!t)return t;
  const m=String(t).match(/^(.*?)\s*\(([^()]+)\)\s*$/);if(!m)return t;
  const n=x=>x.toLowerCase().replace(/\s+/g,' ').trim();
  return n(m[1]).endsWith(n(m[2]))?m[1].trim():t;
}
function schCleanItem(s){return Object.assign({},s,{title:schDedupTitle(schCleanTxt(s.title)),memo:schCleanTxt(s.memo)});}
// 🔤 영어 일정표 이미지용 줄임말 (AC · Wall · Cassette · FCU · Outdoor · WC(Top) · WC(Front) · Dryer · MC · Sofa · CT)
const SCH_ABBR=[
  [/(통돌이\s*세탁기|top[- ]?load(?:ing|er)?\s*(?:type\s*)?(?:washing\s*machines?|washers?)?)/gi,'WC(Top)'],
  [/(드럼\s*세탁기|(?:front[- ]?load(?:ing|er)?\s*(?:\(\s*drum\s*\))?|drum(?:[- ]type)?)\s*(?:washing\s*machines?|washers?)?)/gi,'WC(Front)'],
  [/(세탁기|washing\s*machines?|washers?)/gi,'WC'],
  [/(건조기|tumble\s*dryers?|drying\s*machines?|clothes\s*dryers?|dryers?)/gi,'Dryer'],
  [/(매트리스|mattress(?:es)?)/gi,'MC'],
  [/(쇼파|소파|sofas?|couch(?:es)?)/gi,'Sofa'],
  [/(커튼|curtains?)/gi,'CT'],
  [/(실외기|outdoor\s*units?|outdoor\s*condensers?|condensers?)/gi,'Outdoor'],
  [/(벽걸이형?|wall[- ]?mounted(?:\s*type)?|wall[- ]type|split\s*wall)/gi,'Wall'],
  [/(천정형\s*\(\s*카세트\s*\)|천정형|카세트|ceiling\s*cassette(?:\s*type)?|cassette(?:\s*type)?|ceiling[- ](?:mounted|type))/gi,'Cassette'],
  [/(매립형\s*\(\s*덕트\s*\)|매립형|덕트형|ducted\s*\(\s*concealed\s*\)|concealed\s*\(\s*ducted\s*\)|FCU\s*[·\/]\s*duct(?:\s*type)?|concealed(?:\s*type)?|ducted(?:\s*type)?|built[- ]in(?:\s*type)?|recessed(?:\s*type)?)/gi,'FCU'],
  [/(에어컨|air[- ]?conditioners?|air[- ]?cons?|aircons?|A\/C)/gi,'AC'],
  [/\b(home[- ]use|household|residential|commercial|for\s+(?:home|store|shop)\s+use|store[- ]use|shop[- ]use)\b\s*/gi,''],
  [/\bAC\s+AC\b/g,'AC'],
  // 「WC (1 unit/WC(Front))」 → 「WC(Front) (1 unit)」
  [/\bWC\s*\(\s*((?:[^()\/]|\(s\))*?)\s*\/\s*(WC\((?:Top|Front)\))\s*\)/g,'$2 ($1)'],
  [/[ \t]{2,}/g,' ']
];
function schAbbrEn(t){if(t==null||t==='')return t;let r=String(t);SCH_ABBR.forEach(function(a){r=r.replace(a[0],a[1]);});return r.split('\n').map(function(l){return l.trim();}).join('\n');}

// ── 방문 안내 메시지 3종 템플릿 ──
// tpl: 'pre'(예약 방문 안내) | 'tomorrow'(내일 방문 안내) | 'today'(금일 방문 안내)
// 📅⏰ 일자·방문시간 문구 만들기 — 예약 안내와 수리 안내가 함께 사용합니다
//    dKo 「8월 22일(토)」 · dEn 「Aug 22 (Sat)」 · tKo 「오전 9시 전후」 · tEn 「around 9 AM」
function vrDT(dateStr,timeS){
  var dKo='',dEn='';
  if(dateStr){
    var p=String(dateStr).split('-');
    if(p.length===3){
      var mn=parseInt(p[1],10),dy=parseInt(p[2],10);
      var monEn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mn-1]||'';
      var d=new Date(dateStr+'T00:00:00');
      var wk='',wkEn='';
      if(!isNaN(d)){
        wk=['일','월','화','수','목','금','토'][d.getDay()];
        wkEn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
      }
      dKo=mn+'월 '+dy+'일'+(wk?'('+wk+')':'');
      dEn=monEn+' '+dy+(wkEn?' ('+wkEn+')':'');
    }
  }
  // ⏰ 방문시간 : 「오전 9시 전후」 · 「오후 1시 30분 전후」 / 영문 「around 9 AM」
  var tKo='',tEn='';
  if(timeS){
    var tm=String(timeS).match(/^(\d{1,2}):(\d{2})/);
    if(tm){
      var h=parseInt(tm[1],10),mi=parseInt(tm[2],10);
      var h12=h%12;if(h12===0)h12=12;
      tKo=(h<12?'오전 ':'오후 ')+h12+'시'+(mi?' '+mi+'분':'')+' 전후';
      tEn='around '+h12+(mi?':'+String(mi).padStart(2,'0'):'')+(h<12?' AM':' PM');
    }
  }
  return {dKo:dKo,dEn:dEn,tKo:tKo,tEn:tEn};
}

var VR_SDKS=['https://t1.kakaocdn.net/kakao_js_sdk/2.7.5/kakao.min.js',
             'https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js',

var _vrLoad=null;
function vrKkLoad(){
  if(window.Kakao)return Promise.resolve(window.Kakao);
  if(_vrLoad)return _vrLoad;
  _vrLoad=new Promise(function(res,rej){
    var i=0;
    (function next(){
      if(i>=VR_SDKS.length){rej(new Error('sdk'));return;}
      var sc=document.createElement('script');
      sc.src=VR_SDKS[i++];sc.async=true;
      sc.onload=function(){window.Kakao?res(window.Kakao):next();};
      sc.onerror=function(){try{sc.remove();}catch(_){}next();};
      document.head.appendChild(sc);
    })();
  });

}
async function vrKkKey(force){

// 카카오 텍스트형 카드는 200자까지만 보여 줍니다.
//  · 주소 줄과 그 짝인 「📱 MY PAGE」 제목 줄은 카드의 「마이페이지 열기」 버튼이 대신하므로 걷어냅니다.
//  · 그래도 넘치면 회사명·연락처 서명부터 덜어냅니다 (카드 하단에 이미 표시됩니다).
function vrKkText(m){
  var t=String(m||'').replace(/\*([^*\n]+)\*/g,'$1')   // 카카오는 굵은 글씨(*…*)를 지원하지 않습니다
    .replace(/^.*https?:\/\/\S+.*$/gm,'')
    .replace(/^\s*📱\s*(MY ?PAGE|My Page|마이페이지)\s*$/gim,'')
    .replace(/[ \t]+$/gm,'').replace(/\n{3,}/g,'\n\n').trim();
  var MAX=195,len=function(x){return Array.from(x).length;};
  if(len(t)>MAX){
    t=t.split('\n').filter(function(x){
      return !(/📞\s*\+?\s*60[\s-]*17[\s-]*247[\s-]*2774/.test(x)||/^\s*Happy Home Care\s*$/i.test(x));
    }).join('\n').replace(/\n{3,}/g,'\n\n').trim();
  }
  if(len(t)>MAX)t=t.split('\n').filter(function(x){return !/^\s*(감사합니다|Thank you)/.test(x);}).join('\n').trim();
  if(len(t)>MAX)t=Array.from(t).slice(0,MAX-1).join('').replace(/\s+\S*$/,'')+'…';
  return t;
}

var _mvMapsP=null;
function mvMaps(){   // 지역명 변환(Geocoder)용 구글 지도 — 영문 지역명으로 받습니다
  if(window.google&&google.maps&&google.maps.Geocoder)return Promise.resolve(true);
  if(_mvMapsP)return _mvMapsP;
  _mvMapsP=fetch('/api/travel?cfg=1',{cache:'no-store'}).then(r=>r.json()).then(cfg=>{
    if(!cfg||!cfg.ready||!cfg.key)throw new Error('maps-off');
    return new Promise((res,rej)=>{
      window.__hhcMvInit=()=>res(true);
      const sc=document.createElement('script');
      sc.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(cfg.key)+'&v=weekly&language=en&region=MY&loading=async&callback=__hhcMvInit';
      sc.async=true;sc.onerror=()=>rej(new Error('maps-off'));
      document.head.appendChild(sc);
    });
  }).catch(e=>{_mvMapsP=null;throw e;});
  return _mvMapsP;
}
function mvHere(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation){rej(new Error('geo-none'));return;}
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
      e=>rej(new Error(e&&e.code===1?'geo-denied':'geo-fail')),
      {enableHighAccuracy:true,timeout:15000,maximumAge:60000});
  });
}
// 지역명: 동네(neighborhood) > 구역(sublocality) > 도시(locality) 순서로 가장 먼저 나오는 이름
async function mvArea(pt){
  await mvMaps();
  const gc=new google.maps.Geocoder();
  const r=await gc.geocode({location:pt});
  const res=(r&&r.results)||[];
  for(const ty of ['neighborhood','sublocality_level_1','sublocality','locality','administrative_area_level_2']){
    for(const x of res){
      const c=(x.address_components||[]).find(a=>(a.types||[]).indexOf(ty)>=0);
      if(c&&c.long_name&&!/^\d+$/.test(c.long_name))return c.long_name;
    }
  }
  return '';
}
async function mvEta(pt,item){
  const L=sxLoc(item);
  let q='/api/travel?eta=1&olat='+pt.lat.toFixed(6)+'&olng='+pt.lng.toFixed(6);
  if(L)q+='&lat='+(+L.lat).toFixed(6)+'&lng='+(+L.lng).toFixed(6);
  else{
    const a=String(item.customer_address||'').trim();
    if(!a)throw new Error('no-dest');
    q+='&daddr='+encodeURIComponent(a);
  }
  const r=await fetch(q,{cache:'no-store'});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.ok)throw new Error(d.error||('eta-'+r.status));
  return {min:d.minutes,km:d.km,dest:L?(L.name||''):String(item.customer_address||'')};
}

async function mvInfo(item){
  const out={area:'',gmin:null,total:null,km:null,dest:'',err:''};
  let pt;
  try{pt=await mvHere();}catch(e){out.err=e.message;return out;}
  const [a,t]=await Promise.allSettled([mvArea(pt),mvEta(pt,item)]);
  if(a.status==='fulfilled')out.area=a.value;
  if(t.status==='fulfilled'){out.gmin=t.value.min;out.total=t.value.min+MV_EXTRA;out.km=t.value.km;out.dest=t.value.dest;}
  else out.err=(t.reason&&t.reason.message)||'eta';
  if(!out.area&&!out.err)out.err='area';
  return out;
}

      <textarea id="visit-msg-box" rows="9" style="width:100%;box-sizing:border-box;background:#f5f6f8;border:1px solid #e5e7eb;border-radius:10px;padding:12px;font-size:12px;color:#333;line-height:1.8;resize:vertical;font-family:inherit;margin-bottom:11px"></textarea>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px">
        <button id="visit-wa-btn" style="flex:1;padding:10px;border:none;border-radius:8px;background:#25D366;color:#fff;font-size:13px;font-weight:600;cursor:pointer">${waLabel}</button>
        <button id="visit-kakao-btn" style="flex:1.25;padding:10px;border:none;border-radius:8px;background:#FEE500;color:#3A1D1D;font-size:13px;font-weight:700;cursor:pointer">💛 ${kakaoLabel}</button>
      </div>
      <button id="visit-copy-btn" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;color:#6b7280;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:10px">📋 ${copyLabel}</button>
      <div id="visit-kakao-ok" style="display:none;text-align:center;padding:8px;background:#E0F9F5;color:#085048;border-radius:6px;font-size:12px;font-weight:600;margin-bottom:8px">${copiedLabel}</div>
      <button id="visit-close-btn" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;background:transparent;color:#333;font-size:13px;font-weight:500;cursor:pointer">${closeLabel}</button>
    </div>`;
  document.body.appendChild(modal);

  let curTpl=defTpl;
  function setTpl(tpl){
    document.querySelectorAll('#visit-tpl-row button').forEach(b=>{
      const on=b.dataset.tpl===tpl;
      b.style.background=on?'#0BB5A4':'#fff';
      b.style.color=on?'#fff':'#6b7280';
      b.style.borderColor=on?'#0BB5A4':'#e5e7eb';
    });
    curTpl=tpl;
    document.getElementById('visit-mv').style.display=mvIsCalc(tpl)?'flex':'none';
    document.getElementById('visit-dlw').style.display=mvIsCalc(tpl)?'flex':'none';
    if(mvIsCalc(tpl)){
      document.getElementById('visit-dlw-l').textContent=(tpl==='delayW')
        ?(lang==='en'?'🛠 Job time left':'🛠 작업 남은 시간')
        :(lang==='en'?'➕ Extra time':'➕ 여유 시간');
      document.getElementById('visit-dlw-n').value=mvExtraOf(tpl);
    }
    if(mvIsCalc(tpl)){mvShow();return;}
    if(tpl==='arrive'){document.getElementById('visit-msg-box').value=getArrivedMsg(name,lang)+vrTailNoMy();return;}
    document.getElementById('visit-msg-box').value=
      (isRepair?getRepairReminderMsg(name,dateStr,lang,tpl,timeS,symptom)
               :getVisitReminderMsg(name,dateStr,lang,tpl,timeS))+vrTailNoMy();
  }
  // 🚗 이동중 — 지금 위치·소요시간을 계산해 문구에 넣습니다 (한 번 계산하면 이 창에서는 다시 씀)
  const EN=(lang==='en');
  let mv=null,mvBusy=false;
  function mvFill(){
    if(!mvIsCalc(curTpl))return;
    const box=document.getElementById('visit-msg-box');
    const X=mvExtraOf(curTpl),TOT=(mv&&mv.gmin!=null)?mv.gmin+X:null;
    box.value=(curTpl==='move'?getMovingMsg(name,lang,mv&&mv.area,TOT)
              :getDelayMsg(name,lang,curTpl==='delayW'?'work':'traffic',TOT))+vrTailNoMy();
    const st=document.getElementById('visit-mv-t');
    if(mvBusy){st.innerHTML='⏳ '+(EN?'Getting your location and Google Maps driving time…':'지금 위치와 구글맵 이동 시간을 확인하는 중…');return;}
    if(!mv)return;
    let h='';
    if(mv.area)h+='📍 '+(EN?'Now: ':'지금 위치: ')+'<b>'+mvEsc(mv.area)+'</b>';
    if(mv.gmin!=null)h+=(h?'<br>':'')+'🚗 '+(EN?'Google Maps ':'구글맵 ')+mv.gmin+(EN?' min':'분')+(mv.km?' ('+mv.km+'km)':'')+' + '+X+(EN?' min = ':'분 = ')+'<b>'+TOT+(EN?' min':'분')+'</b>'
      +(mv.dest?'<span style="color:#9A8550"> → '+mvEsc(mv.dest)+'</span>':'');
    if(mv.err&&!(mv.err==='area'&&curTpl!=='move'))h+=(h?'<br>':'')+'<span style="color:#B42318">⚠ '+mvEsc(mvErrText(mv.err,EN))+'</span>';
    st.innerHTML=h;
  }
  async function mvShow(force){
    if(mv&&!force){mvFill();return;}
    if(mvBusy)return;
    mvBusy=true;mvFill();
    try{mv=await mvInfo(item);}catch(e){mv={area:'',gmin:null,total:null,err:(e&&e.message)||'eta'};}
    mvBusy=false;mvFill();
  }
  document.getElementById('visit-mv-re').addEventListener('click',()=>mvShow(true));
  // ➕ 더하는 시간(분) — 이동중·지연(교통)은 여유 시간, 지연(작업)은 작업 남은 시간.
  //    바꾸면 합계·문구가 바로 다시 계산됩니다 (위치는 다시 찾지 않음) · 버튼별로 따로 기억, 창을 새로 열면 기본값
  for(const k in MV_EXTRA_DEF)MV_EXTRA_NOW[k]=MV_EXTRA_DEF[k];
  const dlwN=document.getElementById('visit-dlw-n');
  const dlwSet=v=>{v=Math.max(0,Math.min(600,Math.round(+v||0)));if(mvIsCalc(curTpl))MV_EXTRA_NOW[curTpl]=v;mvFill();return v;};
  dlwN.addEventListener('input',()=>{if(dlwN.value!=='')dlwSet(dlwN.value);});
  dlwN.addEventListener('change',()=>{dlwN.value=dlwSet(dlwN.value);});
  document.querySelectorAll('#visit-dlw button[data-dlw]').forEach(b=>b.addEventListener('click',()=>{
    dlwN.value=dlwSet(mvExtraOf(curTpl)+(+b.dataset.dlw));
  }));
  document.querySelectorAll('#visit-tpl-row button').forEach(b=>{
    b.addEventListener('click',()=>setTpl(b.dataset.tpl));
  });
  setTpl(defTpl);
  // 🔗 마이페이지 주소를 짧은 주소로 — 준비되면 문구 속 주소만 바꿔치기
  hhcShortUrl(VR_URL).then(sv=>{
    if(sv&&sv!==VR_URL){
      const box=document.getElementById('visit-msg-box');
      if(box)box.value=box.value.split(VR_URL).join(sv);
      VR_URL=sv;
    }
  });

  const getMsg=()=>document.getElementById('visit-msg-box').value;
  // 📤 수리 일정에서 보낸 안내는 메모장(수리요청) 발송 이력에도 남깁니다
  const logSend=(txt,ch)=>{
    if(!isRepair||!item.memo_id)return;
    vrLogMemoSend(item.memo_id,txt,ch,curTpl==='now'?1:2);
  };
  // 💬 왓츠앱 — 마이페이지 발송과 같은 형식(주소 포함) + 고객 번호로 바로 열립니다
  document.getElementById('visit-wa-btn').addEventListener('click',()=>{
    const t=vrWaText(getMsg());
    window.open(vrWaUrl(VR_PH,t),'_blank');
    logSend(t,'whatsapp');
  });
  // 💛 카카오톡 카드 발송 — 「마이페이지 열기」 버튼이 붙은 카드로 나갑니다
  //    누르자마자 「고객명」을 복사해 둡니다 → 카카오 공유창 검색칸에 붙여넣어 대화방을 바로 찾습니다.
  //    (복사는 다른 기다림보다 먼저 해야 휴대폰 브라우저가 막지 않습니다 · 메시지 전체는 「메시지 복사」 버튼)
  //    수리 일정 제목 「콘도(고객명)」 이면 괄호 안 고객명을 씁니다.
  document.getElementById('visit-kakao-btn').addEventListener('click',async()=>{
    const m=getMsg();
    const _pm=String(name||'').match(/\(([^()]+)\)\s*$/);
    const kkNm=String(item.customer_name||(_pm?_pm[1]:name)||'').trim();
    if(kkNm&&kkNm!=='고객'){
      try{navigator.clipboard.writeText(kkNm).catch(()=>{});}catch(_){}
      const tip=document.getElementById('visit-kakao-ok');
      if(tip){
        const _o=tip.textContent;
        tip.textContent=(lang==='en'?'💛 "'+kkNm+'" copied · paste it into the KakaoTalk search box'
                                     :'💛 「'+kkNm+'」 이름이 복사되었습니다 · 공유창 검색칸에 붙여넣으세요');
        tip.style.display='block';
        setTimeout(()=>{tip.style.display='none';tip.textContent=_o;},4500);
      }
    }
    // 🖼 예약 방문 안내(사전·내일·당일)만 예약 확정 그림 카드 — 이동중·도착·지연 같은 짧은 알림은 지금처럼 글 카드 (2026-11-20)
    //    (클립보드에는 위에서 복사한 고객 이름을 그대로 둡니다 → copy:false)
    const ok=(['pre','tomorrow','today'].indexOf(curTpl)>=0&&window.hhcKkCard)
      ?await hhcKkCard({msg:m,url:VR_URL,img:'og-confirmed.jpg',btn:lang==='en'?'Open MY PAGE':'마이페이지 열기',en:lang==='en',copy:false,btn2:false})
      :(curTpl==='arrive')
      ?await vrKkSend(m,vrBase()+'/home'+(lang==='en'?'?lang=en':''),lang==='en',(lang==='en'?'Happy Home Care':'해피홈케어'))
      :await vrKkSend(m,VR_URL,lang==='en');
    if(ok!==false)logSend(vrWaText(m),'kakao');
  });
  document.getElementById('visit-copy-btn').addEventListener('click',()=>{
    const t=vrWaText(getMsg()).replace(/\*([^*\n]+)\*/g,'$1');   // 복사(카카오 등)는 굵은 글씨 별표를 뗍니다
    navigator.clipboard.writeText(t).then(()=>{
      const ok=document.getElementById('visit-kakao-ok');
      ok.style.display='block';setTimeout(()=>ok.style.display='none',3000);
      logSend(t,'other');
    }).catch(()=>prompt('복사 후 붙여넣기:',getMsg()));
  });
  document.getElementById('visit-close-btn').addEventListener('click',()=>modal.remove());
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
};

// ── 일정표 이미지 생성 (2026-11 개편: 타임라인 · 오전/오후 · 장소 강조 · 여유/겹침 표시) ──
window.buildCaptureHTML=function(list,dateStr,ds){
  const isEn=curLang==='en';
  const esc=function(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');};
  const F='Pretendard,-apple-system,\'Noto Sans KR\',sans-serif';
  // 종류별 표시 (색은 뜻이 있는 곳 — 번호 동그라미와 종류 배지 — 에만 씀)
  const KIND=function(s){
    if(schIsBk(s.type))return s.type==='reserve'
      ?{c:'#2563EB',bg:'#E7EEFD',fg:'#1E40AF',k:'bk',l:isEn?'Booking':'예약'}
      :{c:'#0F766E',bg:'#DDF3EF',fg:'#0B5F59',k:'bk',l:isEn?'Confirmed':'예약확정'};
    if(s.type==='holiday')return{c:'#DC2626',bg:'#FDE7E7',fg:'#9F1239',k:'hol',l:isEn?'Holiday':'휴일'};
    if(s.type==='repair')return{c:'#D97706',bg:'#FDF0DC',fg:'#92400E',k:'rp',l:isEn?'Repair':'수리'};
    if(s.type==='google')return{c:'#16346E',bg:'#E8ECF5',fg:'#16346E',k:'etc',l:isEn?'Calendar':'캘린더'};
    return{c:'#16346E',bg:'#E8ECF5',fg:'#16346E',k:'etc',l:isEn?'Internal':'내부일정'};
  };
  const toMin=function(t){const m=/(\d{1,2}):(\d{2})/.exec(String(t||''));return m?(+m[1])*60+(+m[2]):null;};
  const dur=function(m){const h=Math.floor(m/60),r=m%60;return isEn?((h?h+'h':'')+(r?(h?' ':'')+r+'m':'')):((h?h+'시간':'')+(r?(h?' ':'')+r+'분':''));};
  // 방문장소(=고객명) · 작업내용 · 참고 메모로 나눔
  //  - 예약: 제목 = 고객명(방문장소). 직접 예약은 「이름 — 주소」라 앞부분만
  //  - 수리: 「🛠 콘도 (이름)」 → 콘도만
  //  - 캘린더·내부: 메모의 📍 장소가 있으면 그것이 방문장소, 제목은 작업내용
  //  - 🏠 주소 · ※ 자동등록 안내 줄은 이미지에서 뺌
  const parse=function(s){
    const strip=function(t){return String(t||'').replace(/^\s*(🛠|🧺|📅|🔧|📝|📞|📍|🏠)️?\s*/,'').trim();};
    let title=strip(s.title).replace(/^커튼 재설치\s*·\s*/,'');
    const loc=[],work=[],note=[];
    String(s.memo||'').split('\n').forEach(function(l){
      const t=l.trim();if(!t)return;
      if(/^📍/.test(t))loc.push(strip(t));
      else if(/^🔧/.test(t))work.push(strip(t));
      else if(/^🏠/.test(t)||/^※/.test(t))return;
      else note.push(/^📝/.test(t)?strip(t):t);
    });
    let place=title, job=work.join(' · ');
    if(schIsBk(s.type))place=title.split(' — ')[0].trim();
    else if(s.type==='repair')place=title.replace(/\s*\([^()]*\)\s*$/,'').trim()||title;
    else if(loc.length){place=loc.join(' · ');job=job?title+' · '+job:title;}
    return{place:place,job:job,note:note};
  };
  const all=(list||[]).slice();
  const banners=all.filter(function(s){return s.type==='holiday';});
  const items=all.filter(function(s){return s.type!=='holiday';});
  const untimed=items.filter(function(s){return toMin(s.time_s)==null;});
  const timed=items.filter(function(s){return toMin(s.time_s)!=null;});
  const am=timed.filter(function(s){return toMin(s.time_s)<720;});
  const pm=timed.filter(function(s){return toMin(s.time_s)>=720;});

  let no=0;
  const card=function(s,prevEnd){
    no++;
    const k=KIND(s), pr=parse(s);
    const st=toMin(s.time_s), en=toMin(s.time_e);
    let gap='';
    if(prevEnd!=null&&st!=null){
      if(st<prevEnd)gap='<div style="margin:0 0 10px 112px;font-size:13px;font-weight:700;color:#B45309">⚠ '+(isEn?'Overlaps with previous ('+dur(prevEnd-st)+')':'앞 일정과 '+dur(prevEnd-st)+' 겹침')+'</div>';
      else if(st-prevEnd>=60)gap='<div style="margin:0 0 10px 112px;font-size:13px;font-weight:600;color:#98A1B4">'+(isEn?dur(st-prevEnd)+' free':dur(st-prevEnd)+' 여유')+'</div>';
    }
    const durTxt=(st!=null&&en!=null&&en>st)?dur(en-st):'';
    return gap+'<div style="display:flex;align-items:flex-start;margin-bottom:12px">'
      // 시간
      +'<div style="width:76px;flex-shrink:0;text-align:right;padding-top:14px">'
        +(s.time_s?'<div style="font-size:21px;font-weight:800;color:#14192A;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1">'+esc(s.time_s)+'</div>':'<div style="font-size:15px;font-weight:700;color:#98A1B4;line-height:1.2">'+(isEn?'TBD':'미정')+'</div>')
        +(s.time_e?'<div style="font-size:13px;font-weight:600;color:#98A1B4;margin-top:6px;font-variant-numeric:tabular-nums">~ '+esc(s.time_e)+'</div>':'')
      +'</div>'
      // 번호
      +'<div style="width:36px;flex-shrink:0;display:flex;justify-content:center;padding-top:11px">'
        +'<div style="width:24px;height:24px;border-radius:999px;background:'+k.c+';color:#fff;font-size:12px;font-weight:800;line-height:24px;text-align:center;box-shadow:0 0 0 4px #fff">'+no+'</div>'
      +'</div>'
      // 내용 카드
      +'<div style="flex:1;min-width:0;background:#fff;border-radius:14px;padding:15px 18px 16px;box-shadow:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.16)">'
        +'<div style="display:flex;align-items:flex-start;gap:10px">'
          +'<div style="flex:1;min-width:0;font-size:23px;font-weight:800;color:#0E2350;line-height:1.3;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere">'+esc(pr.place)+'</div>'
          +'<span style="flex-shrink:0;margin-top:3px;display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:800;background:'+k.bg+';color:'+k.fg+'">'+k.l+'</span>'
        +'</div>'
        +(pr.job?'<div style="margin-top:8px;font-size:17px;font-weight:700;color:#14192A;line-height:1.45;overflow-wrap:anywhere">'+esc(pr.job)+'</div>':'')
        // 참고 메모·전화번호·소요 시간은 이미지에 넣지 않음 (2026-11-09 대표님 요청)
      +'</div>'
    +'</div>';
  };
  const section=function(label,arr){
    if(!arr.length)return '';
    let prevEnd=null, h='';
    arr.forEach(function(s){h+=card(s,prevEnd);const e=toMin(s.time_e)!=null?toMin(s.time_e):toMin(s.time_s);if(e!=null)prevEnd=Math.max(prevEnd==null?0:prevEnd,e);});
    return '<div style="margin-top:22px">'
      +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
        +'<div style="font-size:14px;font-weight:800;color:#16346E">'+label+'</div>'
        +'<div style="font-size:13px;font-weight:600;color:#98A1B4">'+(isEn?arr.length+(arr.length>1?' items':' item'):arr.length+'건')+'</div>'
        +'<div style="flex:1;height:1px;background:#DCE3EE"></div>'
      +'</div>'
      +'<div style="position:relative">'
        +'<div style="position:absolute;left:93px;top:18px;bottom:18px;width:2px;background:#DCE3EE"></div>'
        +'<div style="position:relative">'+h+'</div>'
      +'</div></div>';
  };

  // ── 머리글: 날짜 크게 + 건수 + 하루 시간 범위 + 종류별 건수
  let big=dateStr, sub='';
  const p=String(ds||'').split('-');
  if(p.length===3){
    const dt=new Date(+p[0],+p[1]-1,+p[2]), dw=dt.getDay();
    const KO=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];
    const EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
    big=isEn?(MO[+p[1]-1]+' '+(+p[2])):((+p[1])+'월 '+(+p[2])+'일');
    sub=isEn?(EN[dw]+', '+p[0]):(KO[dw]+' · '+p[0]);
  }
  const starts=timed.map(function(s){return toMin(s.time_s);});
  const ends=timed.map(function(s){return toMin(s.time_e)!=null?toMin(s.time_e):toMin(s.time_s);});
  const hm=function(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
  const span=starts.length?(hm(Math.min.apply(null,starts))+' – '+hm(Math.max.apply(null,ends))):'';
  const cntBy={};items.forEach(function(s){const k=KIND(s);cntBy[k.l]=(cntBy[k.l]||0)+1;});
  const chips=Object.keys(cntBy).map(function(l){return '<span style="display:inline-block;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:13px;font-weight:700;color:#fff;margin:0 6px 6px 0">'+l+' '+cntBy[l]+'</span>';}).join('');
  const cnt=items.length;

  const head='<div style="background:linear-gradient(135deg,#0E2350,#16346E);padding:24px 30px 22px;color:#fff;position:relative;overflow:hidden">'
    +'<div style="position:absolute;right:-90px;top:-110px;width:240px;height:240px;border-radius:999px;background:rgba(201,164,76,.07)"></div>'
