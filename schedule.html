<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1833">
<title>일정 캘린더 — Happy Home Care</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0B1633;--navy2:#16234A;
  --teal:#0FB5A4;--teal-lt:#E4FBF6;--teal-dk:#0A6B60;--teal-deep:#0C8577;
  --g:#EDF1F8;--w:#fff;--ln:#E6ECF5;--ln2:#F0F4FA;
  --tx:#131A2B;--tx2:#57617A;--tx3:#98A1B5;
  --ok:#0E9E6E;--okbg:#E6F8F1;
  --bd:#E5484D;--bdbg:#FEECEC;
  --amber:#E08600;--amber-lt:#FDF3E0;
  --purple:#8B5CF6;--purple-lt:#EDE9FE;--purple-dk:#5B21B6;
  --blue:#3B72F6;--blue-lt:#E8F0FE;--blue-dk:#1A56DB;
  --r1:10px;--r2:14px;--r3:20px;
  --sh-sm:0 1px 2px rgba(16,26,51,.06);
  --sh:0 6px 18px -8px rgba(16,26,51,.18);
  --sh-lg:0 18px 40px -16px rgba(16,26,51,.30);
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{font-family:'Pretendard',-apple-system,'Noto Sans KR',sans-serif;background:var(--g);color:var(--tx);display:flex;flex-direction:column;font-size:15px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}

/* ── 앱 ── */
.app{display:none;flex-direction:column;height:100%}
.app.on{display:flex}

/* 헤더 */
.hdr{background:linear-gradient(120deg,var(--navy),var(--navy2));padding:calc(11px + var(--safe-top)) 15px 11px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 4px 18px -6px rgba(11,22,51,.5);position:relative;z-index:5}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-mark{width:34px;height:34px;background:var(--teal);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;box-shadow:0 4px 12px -2px rgba(15,181,164,.55)}
.hdr-name{font-size:14.5px;font-weight:700;color:#fff;letter-spacing:-.02em}
.hdr-sub{font-size:9.5px;color:rgba(255,255,255,.5);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:7px}
.view-toggle{display:flex;background:rgba(255,255,255,.12);border-radius:11px;padding:3px;gap:2px}
.view-btn{padding:6px 12px;border-radius:8px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;background:transparent;color:rgba(255,255,255,.6);transition:.15s}
.view-btn.on{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.lang-toggle{display:flex;background:rgba(255,255,255,.12);border-radius:20px;padding:3px}
.lang-btn{padding:6px 11px;border-radius:16px;border:none;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;background:transparent;color:rgba(255,255,255,.6);transition:.15s}
.lang-btn.on{background:#fff;color:var(--navy)}

/* 월 네비 */
.nav-bar{background:var(--w);border-bottom:1px solid var(--ln);padding:10px 15px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.nav-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--ln);background:var(--g);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx2);transition:.15s}
.nav-btn:active{background:var(--teal-lt);color:var(--teal-deep);transform:scale(.94)}
.nav-center{display:flex;align-items:center;gap:11px}
.nav-month{font-size:18px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.today-btn{padding:7px 14px;border-radius:20px;border:1px solid var(--teal);background:var(--teal-lt);color:var(--teal-dk);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.today-btn:active{transform:scale(.95)}

/* ── 월 뷰 캘린더 ── */
.month-view{flex:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.cal-wrap{background:var(--w);border-bottom:1px solid var(--ln);flex-shrink:0;padding:2px 6px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.day-name{padding:8px 0 6px;text-align:center;font-size:11px;font-weight:700;color:var(--tx3)}
.day-name:first-child{color:#E5484D}
.day-name:last-child{color:#3B72F6}
.cal-day{height:62px;background:var(--w);cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;gap:3px;position:relative;transition:.12s;border-radius:12px}
.cal-day:active{background:var(--teal-lt)}
.cal-day.today .day-num{background:var(--teal);color:#fff;border-radius:11px;font-weight:800;box-shadow:0 4px 10px -3px rgba(15,181,164,.6)}
.cal-day.sel{background:var(--teal-lt);box-shadow:inset 0 0 0 2px var(--teal)}
.cal-day.other-m{background:transparent}
.cal-day.other-m .day-num{color:#C4CCDC}
.cal-day.sun .day-num{color:#E5484D}
.cal-day.sat .day-num{color:#3B72F6}
.day-num{width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;flex-shrink:0}
.day-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:34px}
.day-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.dot-b{background:#0FB5A4}
.dot-m{background:var(--purple)}
.dot-h{background:#E5484D}
.dot-gg{background:#3B72F6}
.day-cnt{font-size:8px;font-weight:700;color:var(--tx3)}
.today-summary{background:linear-gradient(120deg,var(--navy),var(--navy2));margin:10px 15px;border-radius:16px;padding:14px 17px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:var(--sh)}
.today-summary-date{font-size:11px;color:rgba(255,255,255,.55);font-weight:600}
.today-summary-txt{font-size:14px;font-weight:700;color:#fff;margin-top:3px;letter-spacing:-.01em}
.day-count-badge{margin-top:3px;font-size:9px;font-weight:800;border-radius:7px;padding:2px 6px;line-height:1.4}
.legend-bar{display:flex;gap:15px;flex-wrap:wrap;padding:11px 15px;border-top:1px solid var(--ln);font-size:12px;color:var(--tx2);font-weight:600}
.leg{display:flex;align-items:center;gap:6px}
.leg-dot{width:11px;height:11px;border-radius:4px}

/* 일정 패널 */
.day-panel{flex:1;padding-bottom:calc(88px + var(--safe-bot))}
.day-hdr{position:sticky;top:0;z-index:10;background:rgba(237,241,248,.92);backdrop-filter:blur(8px);padding:13px 16px 9px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between}
.day-hdr-date{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.day-hdr-cnt{font-size:11.5px;color:var(--tx3);margin-top:1px;font-weight:600}
.share-row{display:flex;gap:6px}
.share-btn{padding:7px 12px;border-radius:20px;border:none;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
.share-btn:active{transform:scale(.95)}

/* ── 주 뷰 ── */
.week-view{flex:1;display:none;flex-direction:column;overflow:hidden}
.week-view.on{display:flex}
.week-hdr{display:grid;grid-template-columns:44px repeat(7,1fr);background:var(--w);border-bottom:1px solid var(--ln);flex-shrink:0}
.week-hdr-empty{border-right:1px solid var(--ln)}
.week-day-hdr{padding:8px 2px;text-align:center;border-right:1px solid var(--ln2);cursor:pointer}
.week-day-hdr:last-child{border-right:none}
.week-day-name{font-size:9.5px;font-weight:700;color:var(--tx3)}
.week-day-num{width:30px;height:30px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;margin:3px auto 0;color:var(--tx)}
.week-day-num.today{background:var(--teal);color:#fff;font-weight:800}
.week-day-num.sel{background:var(--navy);color:#fff}
.week-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.week-grid{display:grid;grid-template-columns:44px repeat(7,1fr);padding-bottom:60px}
.time-col{border-right:1px solid var(--ln2)}
.time-slot{height:54px;border-bottom:1px solid var(--ln2);display:flex;align-items:flex-start;justify-content:flex-end;padding:2px 6px 0 0}
.time-lbl{font-size:9.5px;color:var(--tx3);margin-top:-1px;font-weight:600}
.week-col{border-right:1px solid var(--ln2);position:relative}
.week-col:last-child{border-right:none}
.week-cell{height:54px;border-bottom:1px solid var(--ln2);position:relative}
.week-event{position:absolute;left:2px;right:2px;border-radius:6px;padding:3px 6px;font-size:10px;font-weight:700;overflow:hidden;cursor:pointer;line-height:1.35;z-index:1;box-shadow:var(--sh-sm)}
.week-event.type-b{background:#CCF2EE;color:#085048;border-left:3px solid #0FB5A4}
.week-event.type-m{background:var(--purple-lt);color:#5B21B6;border-left:3px solid var(--purple)}
.week-event.type-h{background:#FFE1E3;color:#9F1239;border-left:3px solid #E5484D}
.week-event.type-gg{background:#E8F0FE;color:#1A56DB;border-left:3px solid #3B72F6}
.week-event.type-r{background:#FFEFD5;color:#92400E;border-left:3px solid #F59E0B}
.week-now-line{position:absolute;left:0;right:0;height:2px;background:var(--bd);z-index:2;pointer-events:none}
.week-now-dot{position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bd)}

/* 일정 아이템 */
.sch-list{padding:8px 12px}
.sch-item{display:flex;gap:12px;padding:14px 15px;margin-bottom:9px;align-items:flex-start;background:var(--w);border:1px solid var(--ln);border-radius:15px;box-shadow:var(--sh-sm)}
.sch-bar{width:4px;border-radius:3px;align-self:stretch;min-height:34px;flex-shrink:0}
.sch-time-col{width:52px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.sch-ts{font-size:12.5px;font-weight:800;color:var(--tx)}
.sch-te{font-size:10.5px;color:var(--tx3);font-weight:600}
.sch-body{flex:1;min-width:0}
.sch-type{display:inline-flex;padding:2px 9px;border-radius:8px;font-size:9.5px;font-weight:800;margin-bottom:5px;letter-spacing:.02em}
.sch-ttl{font-size:14px;font-weight:600;color:var(--tx);margin-bottom:4px;line-height:1.4}
/* 고객이 있는 일정 : 제목(고객명)을 눌러 총괄 고객관리 상세로 이동 */
.sch-cn{cursor:pointer;border-bottom:1.5px dotted rgba(29,78,216,.45)}
.sch-cn:active{opacity:.55}
.sch-ca{background:#E7EEFF!important}
.mg-badge{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:800;vertical-align:middle;letter-spacing:-.01em;white-space:nowrap}
.mg-vvip{background:#fef9c3;color:#a16207}
.mg-pkg{background:#eff6ff;color:#2563eb}
.mg-etc{background:#f5f3ff;color:#7c3aed}
/* 📞 연락 경로 표시 (W=WhatsApp · K=카카오톡 · O=기타) — 관리 화면 전용 */
.chb{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;margin-left:6px;
     border-radius:6px;border:1.5px solid transparent;font-size:10.5px;font-weight:900;line-height:1;
     cursor:pointer;vertical-align:middle;padding:0;font-family:inherit}
.chb.w{background:#22c55e;border-color:#22c55e;color:#fff}
.chb.k{background:#FEE500;border-color:#F5DC00;color:#3C1E1E}
.chb.o{background:#64748b;border-color:#64748b;color:#fff}
.chb.n{background:#fff;border-color:#cbd5e1;border-style:dashed;color:#cbd5e1;font-size:11px}
#chmenu{position:fixed;z-index:9999;background:#fff;border:1.5px solid #e2e8f0;border-radius:12px;
        box-shadow:0 12px 34px rgba(11,24,51,.18);padding:6px;min-width:186px;font-family:inherit}
#chmenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;background:none;
        padding:9px 9px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--tx);cursor:pointer;font-family:inherit}
#chmenu button:hover{background:#f1f5f9}
#chmenu i{font-style:normal;width:17px;text-align:center;font-weight:900}
#chmenu .ch-t{font-size:10px;font-weight:800;color:#94a3b8;padding:3px 9px 6px}
#chmenu .ch-sep{height:1px;background:#e2e8f0;margin:5px 4px}
.sch-ttl-condo{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:5px;line-height:1.25;letter-spacing:-.02em}
.sch-sub{font-size:12px;color:var(--tx2);line-height:1.7}
.sch-auto{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:8px;font-size:9.5px;font-weight:700;background:var(--g);color:var(--tx3);margin-top:6px}
.sch-acts{display:flex;flex-wrap:wrap;gap:5px;width:73px;flex:none;justify-content:flex-end;align-content:flex-start}
.sch-edit{flex-shrink:0;width:34px;height:34px;border-radius:10px;border:none;background:var(--g);color:var(--tx2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.sch-edit:active{transform:scale(.9)}
.sch-del{width:34px;height:34px;border-radius:10px;border:none;background:var(--bdbg);color:var(--bd);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.translating{opacity:.5;font-style:italic}

/* 빈 날짜 */
.empty-day{padding:44px 16px;text-align:center;color:var(--tx3)}
.empty-ico{font-size:46px;margin-bottom:14px}
.empty-txt{font-size:15px;font-weight:700;color:var(--tx2);margin-bottom:5px}
.empty-sub{font-size:12.5px}

/* 공유 */
.msg-section{margin:12px;background:var(--w);border:1px solid var(--ln);border-radius:15px;overflow:hidden;box-shadow:var(--sh-sm)}
.msg-hdr{padding:11px 15px;border-bottom:1px solid var(--ln);font-size:10.5px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em}
.msg-body{padding:12px 15px;font-size:12px;color:var(--tx2);line-height:1.95;white-space:pre-wrap;font-family:inherit;max-height:200px;overflow-y:auto;background:var(--g)}
.msg-btns{display:flex;gap:9px;padding:12px 15px;border-top:1px solid var(--ln)}
.msg-btn{flex:1;padding:12px;border:none;border-radius:11px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.msg-btn:active{transform:scale(.98)}
.copy-ok{display:none;text-align:center;padding:9px;background:var(--okbg);color:var(--ok);font-size:11.5px;font-weight:700}

/* FAB */
.fab{position:fixed;bottom:calc(22px + var(--safe-bot));right:18px;width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));color:#fff;border:none;font-size:30px;cursor:pointer;box-shadow:0 12px 28px -8px rgba(15,181,164,.65);display:none;align-items:center;justify-content:center;z-index:100}
.fab:active{transform:scale(.9)}

/* 모달 */
.modal-ov{position:fixed;inset:0;background:rgba(11,22,51,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
.modal-ov.open{display:flex}
.modal-sheet{background:var(--w);border-radius:24px 24px 0 0;padding:18px 18px calc(22px + var(--safe-bot));width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:var(--sh-lg)}
.modal-handle{width:40px;height:5px;background:var(--ln);border-radius:3px;margin:0 auto 16px}
.modal-ttl{font-size:18px;font-weight:800;color:var(--navy);margin-bottom:3px;letter-spacing:-.02em}
.modal-sub{font-size:12.5px;color:var(--tx3);margin-bottom:18px;font-weight:600}
.field{margin-bottom:14px}
.flbl{font-size:11px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:7px}
.field input,.field textarea{width:100%;padding:13px 14px;border:1.5px solid var(--ln);border-radius:12px;font-size:16px;font-family:inherit;color:var(--tx);background:var(--g);-webkit-appearance:none;transition:.15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--teal);background:var(--w);box-shadow:0 0 0 4px rgba(15,181,164,.12)}
.field textarea{resize:none;height:94px;line-height:1.6}
.type-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.type-btn{padding:12px 2px;border-radius:12px;border:1.5px solid var(--ln);font-size:11px;font-weight:700;cursor:pointer;text-align:center;background:var(--g);color:var(--tx2);font-family:inherit;transition:.15s;white-space:nowrap}
.type-btn.on{border-color:var(--teal);background:var(--teal-lt);color:var(--teal-dk)}
.t2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* ══════════ 📅 예약 일정 — 품목 선택 (예약 등록 화면과 동일 구성) ══════════ */
.rv-sec{border:1.5px solid var(--ln);border-radius:14px;padding:12px;background:var(--ln2);margin-bottom:14px}
.rv-sec-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
.rv-sec-h .cnt{margin-left:auto;min-width:22px;height:20px;border-radius:100px;background:var(--ok);color:#fff;font-size:11px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 8px;text-transform:none;letter-spacing:0}
.rv-sec-h .cnt.show{display:inline-flex}
.spick-it{display:flex;align-items:center;gap:9px;background:var(--w);border:1.5px solid var(--ln);border-radius:11px;padding:9px 11px;margin-bottom:7px;flex-wrap:wrap}
.spick-it .ic{width:32px;height:32px;border-radius:9px;background:var(--teal-lt);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.spick-it .nm{flex:1;min-width:0}
.spick-it .nm b{font-size:13px;font-weight:700;display:block;line-height:1.35;word-break:keep-all}
.spick-it .nm span{font-size:10px;color:var(--tx3)}
.spick-it .free-in{width:100%;margin-top:7px;padding:9px 11px;background:#fff;border:1.5px solid var(--ln);border-radius:9px;font-size:14px;outline:none}
.spick-it .free-in:focus{border-color:var(--teal)}
.sqty{display:flex;align-items:center;border:1.5px solid var(--ln);border-radius:9px;overflow:hidden;height:32px;background:#fff;flex:none}
.sqty button{width:28px;height:100%;border:none;background:var(--g);font-size:15px;font-weight:800;color:var(--teal-deep);cursor:pointer;padding:0;font-family:inherit}
.sqty b{width:30px;text-align:center;font-weight:800;font-size:13px}
.spick-x{width:24px;height:24px;border-radius:50%;background:var(--bdbg);color:var(--bd);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex:none;font-family:inherit}
.spick-empty{text-align:center;padding:14px 10px;font-size:12px;color:var(--tx3);background:var(--w);border:1px dashed var(--ln);border-radius:11px;margin-bottom:9px;line-height:1.7}
.sbig-pick{width:100%;padding:13px;border:none;border-radius:12px;background:linear-gradient(120deg,var(--teal),var(--teal-deep));color:#fff;font-size:13.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;box-shadow:0 8px 20px -8px rgba(15,181,164,.55);font-family:inherit}
.sbig-pick:active{transform:scale(.98)}
.spick-note{display:flex;gap:8px;align-items:flex-start;margin:0 0 8px;padding:9px 11px;background:#FFF7E6;border:1px solid #F0DBA6;border-left:3px solid #E0A82E;border-radius:10px;font-size:11px;line-height:1.6;color:#7A5710;font-weight:600;word-break:keep-all}
.spick-note .ic{flex:none;font-size:12px;line-height:1.4}
/* 품목 피커 시트 */

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getFirestore,collection,doc,addDoc,updateDoc,deleteDoc,onSnapshot,getDocs,getDoc,setDoc, query, where } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
// ── 🔗 발송 주소 단축 ────────────────────────────────────────────
// 메시지에 들어가는 긴 happyhomecare 주소를 짧은 주소(/r?k=키)로 바꿉니다.
// 인보이스·계약서에서 이미 쓰던 단축 저장소(shorts · r.html)를 그대로 씁니다.
//  · 같은 주소는 항상 같은 키를 재사용합니다 (저장소에서 먼저 찾음)
//  · 새 키는 4자리로 만들고, 이미 쓰는 키와 겹치면 자릿수를 늘려 다시 만듭니다
//  · 단축에 실패하면 원래 주소를 그대로 보냅니다 (발송이 막히는 일은 없음)
const HHC_SHORT_BASE='https://happyhomecare.com.my/r?k=';
const _hhcShortCache={};
async function hhcShortUrl(url){
  url=String(url||'');
  if(_hhcShortCache[url])return _hhcShortCache[url];
  if(url.length<=40)return url;                                   // 이미 짧은 주소
  if(!/^https:\/\/(www\.)?happyhomecare\.com\.my\//.test(url))return url;
  if(/\/r(\.html)?\?k=/.test(url))return url;                     // 이미 단축된 주소
  try{
    const col=collection(db,'shorts');
    const ex=await getDocs(query(col,where('url','==',url)));
    let key='';
    if(!ex.empty){key=ex.docs[0].data().key;}
    else{
      for(let n=4;n<=8&&!key;n++){
        const k=Math.random().toString(36).slice(2,2+n);
        if(k.length<n)continue;
        const dup=await getDocs(query(col,where('key','==',k)));
        if(dup.empty){await addDoc(col,{key:k,url:url,created:new Date().toISOString()});key=k;}
      }
      if(!key)return url;
    }
    return (_hhcShortCache[url]=HHC_SHORT_BASE+key);
  }catch(e){return url;}
}
// 문구 전체에서 긴 주소를 찾아 모두 짧은 주소로 (실패한 주소는 원문 유지)
async function hhcShortLinks(text){
  text=String(text==null?'':text);
  const found=text.match(/https:\/\/(?:www\.)?happyhomecare\.com\.my\/[^\s'"<>)\]]+/g)||[];
  const uniq=found.filter((u,i)=>found.indexOf(u)===i);
  for(const u of uniq){
    const s=await hhcShortUrl(u);
    if(s!==u)text=text.split(u).join(s);
  }
  return text;
}
// 다른 스크립트 블록(window.* 핸들러)에서도 쓸 수 있게 공개
try{window.hhcShortUrl=hhcShortUrl;window.hhcShortLinks=hhcShortLinks;}catch(_e){}

// ── 말레이시아(쿠알라룸푸르) 기준 시각 ──────────────────────────
// 접속 기기의 시간대와 관계없이 항상 UTC+8(말레이시아, 서머타임 없음) 기준으로
// '오늘/현재 시각'을 계산합니다.
const MY_TZ='Asia/Kuala_Lumpur';
const MY_TZ_OFFSET=8*60; // 분
function myNow(){const n=new Date();return new Date(n.getTime()+(n.getTimezoneOffset()+MY_TZ_OFFSET)*60000);}
function myDateStr(d){const t=d||myNow();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function myFmtDT(v){if(!v)return '—';const d=new Date(v);if(isNaN(d.getTime()))return '—';
  try{return d.toLocaleString('ko-KR',{timeZone:MY_TZ});}catch(e){return myNow().toLocaleString('ko-KR');}}

let db=null;

var HHCC_LIST=[],HHCC_TS=0;
function hccPN(p){p=String(p||'').replace(/[^0-9]/g,'');if(p.indexOf('60')===0)p=p.slice(2);return p.replace(/^0+/,'');}
function hccNN(n){return String(n||'').toLowerCase().replace(/\s+/g,'');}
function hccWrite(id,upd){return updateDoc(doc(db,'customers',id),upd);}
function hccWriteAny(cl,id,upd){return updateDoc(doc(db,cl,id),upd);}
function hccGetAll(cl){return getDocs(collection(db,cl));}
function hccAddNew(nd){return addDoc(collection(db,'customers'),nd);}
async function hccLoad(force){
  if(!force&&HHCC_LIST.length&&(Date.now()-HHCC_TS)<60000)return HHCC_LIST;
  try{var snap=await hccGetAll('customers');
    HHCC_LIST=snap.docs.map(function(d){var x=d.data()||{};x._docId=d.id;return x;});
    HHCC_TS=Date.now();
  }catch(e){}

var HCC_JOBS=[

  {c:'invoices',   lbl:'인보이스',   ic:'💳', p:'customer.phone', n:['customer.name']},

window.HHCC_find=async function(name,phone){
  try{
    var list=await hccLoad();
    var pn=hccPN(phone),nn=hccNN(name),kk=hccKey(name),m=null;
    if(hccPhoneOk(phone))m=list.find(function(c){return hccPN(c.phone)===pn;})||null;
    if(!m&&nn)m=list.find(function(c){return hccNN(c.name)===nn;})||null;
    if(!m&&nn)m=list.find(function(c){return (c.aliases||[]).some(function(a){return hccNN(a)===nn;});})||null;
    if(!m&&kk)m=list.find(function(c){return hccKey(c.name)===kk||(c.aliases||[]).some(function(a){return hccKey(a)===kk;});})||null;
    if(!m&&kk&&kk.length>=6)m=list.find(function(c){
      var k=hccKey(c.name);
      if(k&&k.length>=6&&(k.indexOf(kk)>=0||kk.indexOf(k)>=0))return true;
      return (c.aliases||[]).some(function(a){var q=hccKey(a);return q&&q.length>=6&&(q.indexOf(kk)>=0||kk.indexOf(q)>=0);});

window.HHCC_fill=async function(info){

  if(!out.name&&m.name){out.name=m.name;out.filled.push('고객명');}
  if(!out.addr&&m.addr){out.addr=m.addr;out.filled.push('주소');}
  if(!out.email&&m.email){out.email=m.email;out.filled.push('이메일');}

// ── 입력칸 연결 : 고객명을 다 쓰면 등록된 연락처를 자동으로 채운다 ──
window.HHCC_autofill=function(nameSel,phoneSel,opt){
  opt=opt||{};

  var nEl=el(nameSel),pEl=el(phoneSel);
  if(!nEl||!pEl)return;
  var busy=false;
  async function go(){
    if(busy)return;
    var cur=String(pEl.value||'').trim();
    if(hccPhoneOk(cur))return;                       // 이미 제대로 된 번호가 있으면 그대로 둔다
    var nm=String(nEl.value||'').trim();
    if(opt.extra){var ex=el(opt.extra);if(ex&&ex.value)nm=(nm+' '+String(ex.value).trim()).trim();}
    if(hccKey(nm).length<3)return;
    busy=true;
    try{
      var m=await window.HHCC_find(nm,'');
      if(m&&hccPhoneOk(m.phone)){
        pEl.value=String(m.phone).trim();
        try{pEl.dispatchEvent(new Event('input',{bubbles:true}));pEl.dispatchEvent(new Event('change',{bubbles:true}));}catch(_){}
        hccHint(pEl,'📞 등록된 연락처를 불러왔습니다 · '+(m.name||''));

  }

// ── 어디에 몇 건이 걸려 있는지 세기 ───────────────────────────────
async function hccScan(oldPhone,oldName){
  var oldPN=hccPN(oldPhone),oldKK=hccKey(oldName),found=[];
  for(var i=0;i<HCC_JOBS.length;i++){
    var job=HCC_JOBS[i];
    try{
      var snap=await hccGetAll(job.c);
      var hits=[];
      snap.docs.forEach(function(d){
        var x=d.data()||{};
        if(oldPN&&oldPN.length>=6&&hccPN(hccPick(x,job.p))===oldPN){hits.push({id:d.id,f:'',x:x});return;}
        if(!oldKK||oldKK.length<3)return;
        if(job.key){try{if(hccKey(job.key(x))===oldKK){hits.push({id:d.id,f:'',x:x});return;}}catch(e0){}}
        var fs=job.n||[];
        for(var q=0;q<fs.length;q++){
          if(hccKey(hccPick(x,fs[q]))===oldKK){hits.push({id:d.id,f:fs[q],x:x});return;}
        }
      });
      if(hits.length)found.push({job:job,hits:hits});
    }catch(e){}
  }
  return found;
}
// ── 확인 창 : 무엇이 → 무엇으로, 어디에 몇 건 ────────────────────

      '<button type="button" class="hhcc-opt hcc-prim" data-a="all"><b>모든 프로그램에 반영</b><span>위 '+total+'건의 고객명·연락처가 새 정보로 함께 바뀝니다.</span></button>'+
      '<button type="button" class="hhcc-opt" data-a="here"><b>이 화면만 변경</b><span>지금 저장하는 기록만 바꾸고 나머지는 그대로 둡니다.</span></button>'+

// ── 실제 일괄 반영 ────────────────────────────────────────────────
// 이름은 「이전 이름이 실제로 들어 있던 칸」에만 씁니다.
// (메모장처럼 고객명·콘도명 두 칸이 있는 경우 엉뚱한 칸을 덮어쓰지 않도록)
async function hccApply(found,next,prevName){
  var done=0,pk=hccKey(prevName);
  for(var i=0;i<found.length;i++){
    var f=found[i];
    for(var k=0;k<f.hits.length;k++){
      var h=f.hits[k],upd={},fs=f.job.n||[];
      if(hccPhoneOk(next.phone))upd[f.job.p]=next.phone;
      if(next.name){
        var nf=h.f;
        if(!nf&&pk){for(var q=0;q<fs.length;q++){if(hccKey(hccPick(h.x,fs[q]))===pk){nf=fs[q];break;}}}
        if(!nf){for(var q2=0;q2<fs.length;q2++){if(!hccPick(h.x,fs[q2])){nf=fs[q2];break;}}}
        if(nf)upd[nf]=next.name;
      }
      if(!Object.keys(upd).length)continue;
      try{await hccWriteAny(f.job.c,h.id,upd);done++;}catch(e){}
    }
  }
  return done;
}
// ── 고객 마스터 기준 동기화 (연락처·고객명 모두) ──────────────────

  try{
    var m=await window.HHCC_find(prev.name,prev.phone);
    if(m&&m._docId){
      var upd={updated_at:new Date().toISOString()};
      if(hccPhoneOk(next.phone))upd.phone=next.phone;
      if(next.name&&hccNN(next.name)!==hccNN(m.name)){
        upd.name=next.name;
        var al=(m.aliases||[]).slice();
        if(m.name&&!al.some(function(a){return hccNN(a)===hccNN(m.name);}))al.push(m.name);
        upd.aliases=al;m.aliases=al;
      }
      await hccWrite(m._docId,upd);
      if(upd.phone)m.phone=upd.phone;
      if(upd.name)m.name=upd.name;
    }
  }catch(e){}
  HHCC_TS=0; // 캐시 새로고침
  hccHint(document.body,'🔄 다른 프로그램 '+n+'건에 반영했습니다');
  return {changed:true,applied:n};
};

async function hccPropagate(m,newPhone){
  try{
    if(!m)return;
    var found=await hccScan(m.phone,m.name);
    var n=await hccApply(found,{phone:newPhone,name:''},m.name);
    if(m._docId){try{await hccWrite(m._docId,{phone:newPhone,updated_at:new Date().toISOString()});}catch(e3){}}
    m.phone=newPhone;HHCC_TS=0;
    hccHint(document.body,'🔄 다른 프로그램 '+n+'건의 연락처를 바꿨습니다');
  }catch(e){}
}

// 회원등급 배지 (HHCG) — 총괄 고객관리(customer-admin.html)와 동일 표기
//  · customers.member 가 1순위, 없으면 contracts.package_id 로 「패키지 - ○○」 추정
//  · 매칭은 연락처(숫자만 · 60/0 제거) 우선 → 없으면 이름/별칭
//  · 등급이 없는 고객은 아무것도 표시하지 않는다 (기존 화면 그대로)
// ═══════════════════════════════════════════════════════════
var HHCG_PH={},HHCG_NM={},HHCG_CPH={},HHCG_CNM={},HHCG_ON=false;
// 📞 연락 경로 표시 (W=WhatsApp · K=카카오톡 · O=기타) — 총괄 고객관리와 같은 값(customers.ca_ch)을 씁니다.
// 아무 기능도 하지 않는 표시 전용이며 관리 화면에만 보입니다 (공유 메시지·일정표 이미지에는 들어가지 않습니다).
var HHCH_PH={},HHCH_NM={},HHCH_IDPH={},HHCH_IDNM={};
var CH_LB={W:'💬 WhatsApp',K:'💛 카카오톡',O:'🌐 기타'};
function chOK(v){v=String(v||'').toUpperCase();return CH_LB[v]?v:'';}
var HHCG_PKG={silver:'실버',royal:'로얄',gold:'골드',diamond:'다이아',titanium:'티타늄',special:'스페셜해피홈'};
function hhcgPN(p){p=String(p||'').replace(/[^0-9]/g,'');if(p.indexOf('60')===0)p=p.slice(2);return p.replace(/^0+/,'');}
function hhcgNN(n){return String(n||'').toLowerCase().replace(/\s+/g,'');}
function hhcgEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function hhcgPkgLabel(pid){
  if(!pid)return '';
  var biz=/-biz$/.test(String(pid)),base=HHCG_PKG[String(pid).replace(/-biz$/,'')]||pid;
  return base+(biz?'(사업)':'');
}
// customers · contracts 를 실시간 구독해 등급표를 항상 최신 상태로 유지
function hhcgWatch(onChange){
  if(HHCG_ON||!db)return;HHCG_ON=true;
  try{
    onSnapshot(collection(db,'customers'),function(snap){
      var ph={},nm={},chp={},chn={},idp={},idn={};
      snap.docs.forEach(function(d){
        var c=d.data()||{},g=String(c.member||'').trim();
        var p0=hhcgPN(c.phone),ns=[c.name].concat(c.aliases||[]);
        // 📞 연락 경로 표시 + 고객 문서 ID (등급이 없는 고객도 포함해야 하므로 먼저 담는다)
        var cv=chOK(c.ca_ch);
        if(p0){if(!idp[p0])idp[p0]=d.id;if(cv&&!chp[p0])chp[p0]=cv;}
        ns.forEach(function(a){var k=hhcgNN(a);if(!k)return;if(!idn[k])idn[k]=d.id;if(cv&&!chn[k])chn[k]=cv;});
        if(!g)return;
        if(p0&&!ph[p0])ph[p0]=g;
        ns.forEach(function(a){var k=hhcgNN(a);if(k&&!nm[k])nm[k]=g;});
      });
      HHCG_PH=ph;HHCG_NM=nm;
      HHCH_PH=chp;HHCH_NM=chn;HHCH_IDPH=idp;HHCH_IDNM=idn;
      if(onChange)try{onChange();}catch(e){}
    },function(){});
    onSnapshot(collection(db,'contracts'),function(snap){
      var ph={},nm={};
      snap.docs.forEach(function(d){
        var c=d.data()||{};
        var g=c.package_id?('패키지 - '+hhcgPkgLabel(c.package_id)):'패키지(계약)';
        var p=hhcgPN(c.phone);if(p&&!ph[p])ph[p]=g;
        var k=hhcgNN(c.name);if(k&&!nm[k])nm[k]=g;
      });
      HHCG_CPH=ph;HHCG_CNM=nm;
      if(onChange)try{onChange();}catch(e){}
    },function(){});
  }catch(e){}
}
function memberGrade(name,phone){
  var p=hhcgPN(phone),n=hhcgNN(name);
  if(p&&HHCG_PH[p])return HHCG_PH[p];
  if(n&&HHCG_NM[n])return HHCG_NM[n];
  if(p&&HHCG_CPH[p])return HHCG_CPH[p];
  if(n&&HHCG_CNM[n])return HHCG_CNM[n];
  return '';
}
// 고객명 옆에 붙일 회원등급 배지 HTML (등급 없으면 빈 문자열)
function gradeBadge(name,phone){
  var g=memberGrade(name,phone);
  if(!g)return '';
  if(g.toUpperCase()==='VVIP')return '<span class="mg-badge mg-vvip">👑 VVIP</span>';
  if(/^패키지/.test(g))return '<span class="mg-badge mg-pkg">📦 '+hhcgEsc(g)+'</span>';
  return '<span class="mg-badge mg-etc">'+hhcgEsc(g)+'</span>';
}
// 예약 시간 표기 — 내부 저장값이 "오후 2시|14:00" 형태면 뒤의 24시간 표기(14:00)를 쓴다.
// (예전에는 숫자만 남겨 "214:0" 처럼 깨져 보였다)
function bkTime(v){
  var t=String(v||'').trim();
  if(!t)return '';
  if(t.indexOf('|')>=0){var a=t.split('|');t=String(a[1]||a[0]||'').trim();}
  var m=/(\d{1,2}):(\d{2})/.exec(t);
  if(m)return String(m[1]).padStart(2,'0')+':'+m[2];
  return t.replace(/[^0-9:]/g,'').slice(0,5);
}

// 일정 항목에서 고객명을 뽑아 등급 배지를 만든다.
// 예약 자동반영 일정은 customer_name, 직접입력 일정은 제목 앞부분("고객명 — 내용")을 쓴다.

  if(!s)return '';
  var nm=s.customer_name||'';
  if(!nm&&s.title)nm=String(s.title).split(' — ')[0].trim();
  return gradeBadge(nm,s.customer_phone||'');

// ── 📞 연락 경로 표시 (W · K · O) ─────────────────────────
// 총괄 고객관리에서 고른 값을 그대로 보여주며, 여기서 눌러 바꿀 수도 있습니다.
// 고객이 있는 일정인지 — 예약(자동반영·직접입력) 이거나 고객정보가 들어있는 일정만 해당됩니다.
// (휴일 · 직접입력 · 구글 캘린더 일정에는 연락 경로를 표시하지 않습니다)
function schHasCust(s){return !!s&&(schIsBk(s.type)||!!s.customer_name||!!s.customer_phone);}
function schName(s){
  if(!s)return '';
  var nm=s.customer_name||'';
  // 예약 일정은 제목이 곧 고객명입니다 (그 외 일정의 제목은 고객명이 아니므로 쓰지 않습니다)
  if(!nm&&schIsBk(s.type)&&s.title)nm=String(s.title).split(' — ')[0].trim();
  return nm;
}
function chValue(name,phone){
  var p=hhcgPN(phone),n=hhcgNN(name);
  if(p&&HHCH_PH[p])return HHCH_PH[p];
  if(n&&HHCH_NM[n])return HHCH_NM[n];

}
function chDocId(name,phone){
  var p=hhcgPN(phone),n=hhcgNN(name);
  if(p&&HHCH_IDPH[p])return HHCH_IDPH[p];
  if(n&&HHCH_IDNM[n])return HHCH_IDNM[n];

}
function schCh(s){
  if(!schHasCust(s))return '';                 // 고객이 없는 일정(휴일 · 직접입력 등)은 표시하지 않는다
  var nm=schName(s),ph=s.customer_phone||'';
  if(!nm&&!ph)return '';
  var v=chValue(nm,ph),cls=v?v.toLowerCase():'n';

  return '<button type="button" class="chb '+cls+'" title="'+hhcgEsc(tt)+'" onclick="schChMenu(event,this,\''+s._id+'\')">'+(v||'＋')+'</button>';

function sortAll(map){Object.keys(map).forEach(dt=>{map[dt].sort((a,b)=>(a.time_s||'').localeCompare(b.time_s||''));});}

/* ═══ 🧹 원본이 삭제된 자동 일정 찾기 ═══
   「예약·메모와 연결된 번호(booking_id · memo_id)를 가지고 있는데 그 원본이 없는」
   일정만 골라냅니다. 연결 번호가 없는 일정은 직접 만든 일정일 수 있으므로
   어떤 경우에도 자동 정리 대상에 넣지 않습니다. */
function findOrphans(){
  if(!bkReady)return;
  orphanIds=RAW_SCH.filter(function(s2){
    if(s2.booking_id)return !BK_ALL[s2.booking_id];
    if(s2.memo_id)return mmReady&&!MEMO_IDS.has(s2.memo_id);
    return false;
  }).map(function(s2){return s2._id;});
  renderOrphanBar();
}
function renderOrphanBar(){
  const bar=document.getElementById('orphan-bar');
  if(!bar)return;
  if(!orphanIds.length||window._orphanHide){bar.style.display='none';bar.innerHTML='';return;}
  bar.style.display='block';
  bar.style.cssText='display:block;margin:0 14px 10px;background:#FFF7ED;border:1.5px solid #FDBA74;'+
    'border-radius:12px;padding:11px 13px;font-size:13px;font-weight:800;color:#9A3412;line-height:1.6';
  bar.innerHTML='🧹 예약·메모가 삭제되었는데 캘린더에 남아 있는 자동 일정 <b>'+orphanIds.length+'건</b>이 있습니다.'+
    '<div style="margin-top:8px;display:flex;gap:7px;flex-wrap:wrap">'+
    '<button type="button" id="orphan-go" style="font-family:inherit;font-size:12.5px;font-weight:900;border:none;'+
      'background:#EA580C;color:#fff;border-radius:9px;padding:9px 15px;cursor:pointer">🧹 지금 정리하기</button>'+
    '<button type="button" id="orphan-x" style="font-family:inherit;font-size:12.5px;font-weight:800;border:1.5px solid #FDBA74;'+
      'background:#fff;color:#9A3412;border-radius:9px;padding:9px 13px;cursor:pointer">나중에</button></div>';
  bar.querySelector('#orphan-x').onclick=function(){window._orphanHide=true;renderOrphanBar();};
  bar.querySelector('#orphan-go').onclick=cleanOrphans;
}
async function cleanOrphans(){

  const names=RAW_SCH.filter(function(s2){return orphanIds.indexOf(s2._id)>=0;})
    .slice(0,8).map(function(s2){return '· '+String(s2.date||'')+'  '+String(s2.title||'');}).join('\n');
  if(!confirm('원본이 삭제된 자동 일정 '+orphanIds.length+'건을 정리할까요?\n\n'+names+
    (orphanIds.length>8?('\n… 외 '+(orphanIds.length-8)+'건'):'')+
    '\n\n· 직접 만든 일정은 지워지지 않습니다.\n· 되돌릴 수 없습니다.'))return;
  showLoading(true);
  let ok=0;
  for(const id of orphanIds){
    try{await deleteDoc(doc(db,'schedules',id));ok++;}catch(e){}
  }
  showLoading(false);
  showToast('🧹 자동 일정 '+ok+'건을 정리했습니다');
}
// 📅 직접 추가한 「예약」 일정도 예약확정 건과 동일하게 취급 (색상·집계·고객 버튼)
function schIsBk(t){return t==='booking'||t==='reserve';}
function getMerged(ds){return [...(bookings[ds]||[]),...(schedules[ds]||[])].sort((a,b)=>(a.time_s||'').localeCompare(b.time_s||''));}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getWeekStart(d){const day=d.getDay();const s=new Date(d);s.setDate(d.getDate()-day);return s;}

// ── 📎 총괄 고객관리 등에서 「열기·수정」으로 들어온 경우 ──
//    해당 일정의 날짜로 이동해 목록에서 잠시 강조합니다. (그 자리에서 ✏️ 수정 가능)
window._schOpenId=(function(){try{return new URLSearchParams(location.search).get('open')||'';}catch(e){return '';}})();
async function schTryOpen(){
  const k=window._schOpenId;if(!k)return;
  const hit=RAW_SCH.find(function(s2){return s2._id===k;});
  if(!hit)return;                        // 아직 못 불러왔으면 다음 갱신 때 다시 시도
  window._schOpenId='';
  const ds=String(hit.date||'').slice(0,10);
  if(ds){
    const d=new Date(ds+'T00:00:00');
    if(!isNaN(d.getTime())){curY=d.getFullYear();curM=d.getMonth();weekStart=getWeekStart(d);}
    selDate=ds;
    renderNav();renderCal();
    await renderDay(ds);
  }
  setTimeout(function(){
    const el=document.querySelector('.sch-item[data-id="'+k.replace(/"/g,'')+'"]');
    if(!el)return;
    try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){}
    el.style.transition='box-shadow .3s';
    el.style.boxShadow='0 0 0 3px rgba(37,99,235,.55)';
    setTimeout(function(){el.style.boxShadow='';},4000);
  },300);
}

function refresh(){

  renderTodaySummary();

function renderTodaySummary(){
  const el=document.getElementById('today-summary-txt');
  const dateEl=document.getElementById('today-summary-date');
  if(!el||!dateEl)return;
  const now=myNow();
  const ds=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const months=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const wdays=['일','월','화','수','목','금','토'];
  dateEl.textContent=`오늘 · ${months[now.getMonth()]} ${now.getDate()}일 (${wdays[now.getDay()]})`;
  const list=getMerged(ds);
  if(!list.length){el.textContent='일정 없음';return;}
  const bCnt=list.filter(s=>schIsBk(s.type)).length;
  const gCnt=list.filter(s=>s.type==='google').length;
  const hCnt=list.filter(s=>s.type==='holiday').length;
  const rCnt=list.filter(s=>s.type==='repair').length;
  const mCnt=list.filter(s=>!schIsBk(s.type)&&s.type!=='holiday'&&s.type!=='google'&&s.type!=='repair').length;
  const parts=[];
  if(bCnt)parts.push(`예약확정 ${bCnt}건`);
  if(rCnt)parts.push(`🛠 수리 ${rCnt}건`);
  if(mCnt)parts.push(`직접입력 ${mCnt}건`);
  if(gCnt)parts.push(`구글 캘린더 ${gCnt}건`);
  if(hCnt)parts.push(`휴일/기타 ${hCnt}건`);
  el.textContent=parts.join(' · ');
}

window.goToday=function(){

// ── 월 뷰 캘린더
function renderCal(){
  const grid=document.getElementById('cal-grid');
  const hdrs=Array.from(grid.querySelectorAll('.day-name'));
  grid.innerHTML='';hdrs.forEach(h=>grid.appendChild(h));

  const today=myNow();
  const first=new Date(curY,curM,1).getDay();
  const last=new Date(curY,curM+1,0).getDate();
  const prevLast=new Date(curY,curM,0).getDate();

  for(let i=0;i<first;i++){
    const d=document.createElement('div');d.className='cal-day other-m';
    const dn=document.createElement('div');dn.className='day-num';dn.textContent=prevLast-first+1+i;
    d.appendChild(dn);grid.appendChild(d);
  }
  for(let d2=1;d2<=last;d2++){
    const ds=curY+'-'+String(curM+1).padStart(2,'0')+'-'+String(d2).padStart(2,'0');
    const dow=(first+d2-1)%7;
    const cell=document.createElement('div');
    let cls='cal-day';
    if(dow===0)cls+=' sun';if(dow===6)cls+=' sat';
    if(today.getFullYear()===curY&&today.getMonth()===curM&&today.getDate()===d2)cls+=' today';
    if(selDate===ds)cls+=' sel';
    cell.className=cls;
    cell.onclick=(function(s){return function(){
      selDate=s;renderCal();renderDay(s);
      document.getElementById('day-panel').scrollTop=0;
    };})(ds);
    const dn=document.createElement('div');dn.className='day-num';dn.textContent=d2;cell.appendChild(dn);
    const list=getMerged(ds);
    if(list.length){
      const bCnt=list.filter(s=>schIsBk(s.type)).length;
      const hCnt=list.filter(s=>s.type==='holiday').length;
      const gCnt=list.filter(s=>s.type==='google').length;
      const rCnt=list.filter(s=>s.type==='repair').length;
      const mCnt=list.length-bCnt-hCnt-gCnt-rCnt;
      let bg='#CCF2EE',fg='#085048'; // 기본: 예약확정 색상
      const maxCnt=Math.max(bCnt,hCnt,gCnt,rCnt,mCnt);
      if(maxCnt===hCnt&&hCnt>0){bg='#FFE4E6';fg='#9F1239';}
      else if(maxCnt===gCnt&&gCnt>0){bg='#E8F0FE';fg='#1A56DB';}
      else if(maxCnt===rCnt&&rCnt>0&&bCnt===0){bg='#FFEFD5';fg='#92400E';}
      else if(maxCnt===mCnt&&mCnt>0&&bCnt===0){bg='#EDE9FE';fg='#5B21B6';}
      const cnt=document.createElement('div');
      cnt.className='day-count-badge';
      cnt.style.background=bg;cnt.style.color=fg;
      cnt.textContent=(curLang==='en'?list.length+(list.length>1?' items':' item'):list.length+'건');
      cell.appendChild(cnt);
    }
    grid.appendChild(cell);
  }
  const rem=(7-((first+last)%7))%7;
  for(let j=1;j<=rem;j++){
    const dc=document.createElement('div');dc.className='cal-day other-m';
    const dn=document.createElement('div');dn.className='day-num';dn.textContent=j;
    dc.appendChild(dn);grid.appendChild(dc);
  }
}

// ── 주 뷰
function renderWeek(){
  const HOURS=24;
  const SLOT_H=52;
  const DAY_NAMES_KO=['일','월','화','수','목','금','토'];
  const DAY_NAMES_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today=myNow();
  const todayStr=fmt(today);

  // 헤더
  const hdr=document.getElementById('week-hdr');
  hdr.innerHTML='<div class="week-hdr-empty"></div>';
  for(let i=0;i<7;i++){
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
    const ds=fmt(d);
    const col=document.createElement('div');col.className='week-day-hdr';
    col.onclick=(function(s){return function(){selDate=s;setView('month');curY=new Date(s).getFullYear();curM=new Date(s).getMonth();renderCal();renderDay(s);};})(ds);
    const dn=document.createElement('div');dn.className='week-day-name';dn.textContent=curLang==='en'?DAY_NAMES_EN[d.getDay()]:DAY_NAMES_KO[d.getDay()];
    const dd=document.createElement('div');dd.className='week-day-num'+(ds===todayStr?' today':'')+(ds===selDate?' sel':'');dd.textContent=d.getDate();
    col.appendChild(dn);col.appendChild(dd);hdr.appendChild(col);
  }

  // 그리드
  const grid=document.getElementById('week-grid');grid.innerHTML='';
  // 시간 컬럼
  const timeCol=document.createElement('div');timeCol.className='time-col';
  for(let h=0;h<HOURS;h++){
    const slot=document.createElement('div');slot.className='time-slot';
    if(h>0){const lbl=document.createElement('div');lbl.className='time-lbl';lbl.textContent=String(h).padStart(2,'0')+':00';slot.appendChild(lbl);}
    timeCol.appendChild(slot);
  }
  grid.appendChild(timeCol);

  // 요일 컬럼
  for(let i=0;i<7;i++){
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
    const ds=fmt(d);
    const col=document.createElement('div');col.className='week-col';col.style.position='relative';
    // 셀
    for(let h=0;h<HOURS;h++){
      const cell=document.createElement('div');cell.className='week-cell';
      cell.onclick=(function(s,hr){return function(){
        selDate=s;openModal();
        document.getElementById('f-ts').value=String(hr).padStart(2,'0')+':00';
      };})(ds,h);
      col.appendChild(cell);
    }
    // 현재 시간 선
    if(ds===todayStr){
      const now=myNow();
      const pct=(now.getHours()*60+now.getMinutes())/(HOURS*60);
      const line=document.createElement('div');line.className='week-now-line';line.style.top=(pct*HOURS*SLOT_H)+'px';
      const dot=document.createElement('div');dot.className='week-now-dot';line.appendChild(dot);col.appendChild(line);
    }
    // 이벤트 배치
    const list=getMerged(ds);
    list.forEach(s=>{
      if(!s.time_s)return;
      const [sh,sm]=(s.time_s||'00:00').split(':').map(Number);
      const [eh,em]=(s.time_e||String(sh+1).padStart(2,'0')+':00').split(':').map(Number);
      const top=(sh*60+sm)/(HOURS*60)*HOURS*SLOT_H;
      const height=Math.max(((eh*60+em)-(sh*60+sm))/(HOURS*60)*HOURS*SLOT_H,28);
      const ev=document.createElement('div');
      ev.className='week-event type-'+(schIsBk(s.type)?'b':s.type==='holiday'?'h':s.type==='google'?'gg':s.type==='repair'?'r':'m');
      ev.style.cssText=`top:${top}px;height:${height}px`;
      ev.textContent=s.time_s.slice(0,5)+' '+s.title;
      ev.onclick=e=>{e.stopPropagation();selDate=ds;setView('month');curY=d.getFullYear();curM=d.getMonth();renderCal();renderDay(ds);};
      col.appendChild(ev);
    });
    grid.appendChild(col);
  }
  // 현재 시간으로 스크롤
  const now=myNow();
  const scrollY=Math.max((now.getHours()-2)*SLOT_H,0);
  setTimeout(()=>{const wb=document.querySelector('.week-body');if(wb)wb.scrollTop=scrollY;},50);
}

// ── 번역 함수
async function translateText(text){
  if(!text||curLang==='ko')return text;
  if(translCache[text])return translCache[text];
  const key=localStorage.getItem('hhc_ak')||'';
  if(!key){return text;}
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:800,
        messages:[{role:'user',content:'Translate the following text to English. Return ONLY the translated text, nothing else. Keep emojis, symbols and line breaks exactly as they are:\n\n'+text}]
      })
    });
    const data=await res.json();
    if(data.error){console.warn('Translation error:',data.error.message);return text;}
    const translated=data.content?.[0]?.text||text;
    translCache[text]=translated;
    return translated;
  }catch(e){console.warn('Translation failed:',e);return text;}
}

// 번역 일괄 처리 — 여러 필드를 한 번에
async function translateItem(s){
  if(curLang==='ko')return s;
  const key=localStorage.getItem('hhc_ak')||'';
  if(!key)return s;
  try{
    // 제목과 메모를 구분자로 묶어 한 번에 번역 (API 호출 최소화)
    const combined='[TITLE]'+s.title+'[/TITLE]'+(s.memo?'[MEMO]'+s.memo+'[/MEMO]':'');
    const cacheKey='item:'+combined;
    if(translCache[cacheKey]){
      const cached=translCache[cacheKey];
      return Object.assign({},s,{title:cached.title,memo:cached.memo});
    }
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:800,
        messages:[{role:'user',content:'Translate the following Korean schedule data to English. Keep emojis, symbols (📍📞🔧📝), and line breaks exactly. Return in exact same format with [TITLE] and [MEMO] tags:\n\n'+combined}]
      })
    });
    const data=await res.json();
    if(data.error){console.warn('Translation error:',data.error.message);return s;}
    const result=data.content?.[0]?.text||combined;
    const titleMatch=result.match(/\[TITLE\]([\s\S]*?)\[\/TITLE\]/);
    const memoMatch=result.match(/\[MEMO\]([\s\S]*?)\[\/MEMO\]/);
    const translTitle=titleMatch?titleMatch[1].trim():s.title;
    const translMemo=memoMatch?memoMatch[1].trim():s.memo;
    translCache[cacheKey]={title:translTitle,memo:translMemo};
    return Object.assign({},s,{title:translTitle,memo:translMemo});
  }catch(e){console.warn('Translation failed:',e);return s;}
}

// ── 일정 패널
async function renderDay(ds){
  const parts=ds.split('-');
  const days_ko=['일','월','화','수','목','금','토'];
  const days_en=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months_en=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dow=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2])).getDay();
  const dateStr=curLang==='en'
    ?(days_en[dow]+', '+months_en[parseInt(parts[1])-1]+' '+parseInt(parts[2])+', '+parts[0])
    :(parts[0]+'년 '+parseInt(parts[1])+'월 '+parseInt(parts[2])+'일 ('+days_ko[dow]+')');
  document.getElementById('day-hdr-date').textContent=dateStr;
  document.getElementById('modal-sub').textContent=dateStr;
  const list=getMerged(ds);
  document.getElementById('day-hdr-cnt').textContent=curLang==='en'?list.length+' schedule(s)':'일정 '+list.length+'개';
  document.getElementById('share-row').style.display=list.length?'flex':'none';

  const content=document.getElementById('day-content');
  if(!list.length){
    content.innerHTML='<div class="empty-day"><div class="empty-ico">📅</div><div class="empty-txt">'+(curLang==='en'?'No schedules':'일정이 없습니다.')+'</div><div class="empty-sub">'+(curLang==='en'?'Tap + to add':'+ 버튼으로 추가')+'</div></div>';
    return;
  }

  // 번역 처리
  // 번역 (한 번에 처리)
  const displayList=await Promise.all(list.map(s=>translateItem(s)));

  let html='<div class="sch-list">';
  list.forEach((s,idx)=>{
    const ds2=displayList[idx];
    const barColor=schIsBk(s.type)?'#0BB5A4':s.type==='holiday'?'#DC2626':s.type==='google'?'#4285F4':s.type==='repair'?'#F59E0B':'#8B5CF6';
    const typeBg=schIsBk(s.type)?'background:#CCF2EE;color:#085048':s.type==='holiday'?'background:#FFE4E6;color:#9F1239':s.type==='google'?'background:#E8F0FE;color:#1A56DB':s.type==='repair'?'background:#FFEFD5;color:#92400E':'background:#EDE9FE;color:#5B21B6';
    const typeLabel=s.type==='reserve'?(curLang==='en'?'📅 Booking':'📅 예약'):curLang==='en'?(schIsBk(s.type)?'Confirmed':s.type==='holiday'?'Holiday':s.type==='google'?'Google':s.type==='repair'?'🛠 Repair':'Internal'):(schIsBk(s.type)?'예약확정':s.type==='holiday'?'휴일':s.type==='google'?'구글 캘린더':s.type==='repair'?'🛠 수리':'직접입력');
    const isAuto=s.source==='booking';
    // 액션 버튼 (최대 4개 → 2열로 접힘)
    const acts=(!isAuto?`<button class="sch-edit" onclick="editItem('${s._id}')">✏️</button><button class="sch-del" onclick="deleteItem('${s._id}')">×</button>`:'')
      +(schHasCust(s)?`<button class="sch-edit" style="color:#085048" onclick="sendVisitReminder('${s._id}')" title="${s.type==='repair'?'수리 방문 안내 메시지 발송':'방문 안내 메시지 발송'}">💬</button>`:'')
      // 👤 총괄 고객관리 바로가기 — 예약 일정뿐 아니라 고객정보가 들어있는 직접입력·수리 일정에도 표시한다
      +(schHasCust(s)?`<button class="sch-edit sch-ca" style="color:#1d4ed8" onclick="openCustomerAdmin('${s._id}')" title="이 고객의 총괄 고객관리 상세 열기">👤</button>`:'');
    html+=`<div class="sch-item" data-id="${s._id}">
      <div class="sch-bar" style="background:${barColor}"></div>

        ${ds2.memo?`<div class="sch-sub">${ds2.memo.replace(/\n/g,'<br>')}</div>`:''}
        ${isAuto?`<div class="sch-auto">📋 ${curLang==='en'?'Auto from booking':'예약시스템 자동반영'}</div>`:''}
      </div>
      ${acts?`<div class="sch-acts">${acts}</div>`:''}
    </div>`;
  });
  html+='</div>';

  // 이미지 저장/공유용 데이터 보관
  window._dayImageData={ds:ds,list:displayList,dateStr:dateStr};

  // 공유 메시지 (번역 포함)

// tpl: 'pre'(예약 방문 안내) | 'tomorrow'(내일 방문 안내) | 'today'(금일 방문 안내)
// 📅⏰ 일자·방문시간 문구 만들기 — 예약 안내와 수리 안내가 함께 사용합니다
//    dKo 「8월 22일(토)」 · dEn 「Aug 22 (Sat)」 · tKo 「오전 9시 전후」 · tEn 「around 9 AM」
function vrDT(dateStr,timeS){
  var dKo='',dEn='';
  if(dateStr){
    var p=String(dateStr).split('-');
    if(p.length===3){
      var mn=parseInt(p[1],10),dy=parseInt(p[2],10);
      var monEn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mn-1]||'';
      var d=new Date(dateStr+'T00:00:00');
      var wk='',wkEn='';
      if(!isNaN(d)){
        wk=['일','월','화','수','목','금','토'][d.getDay()];
        wkEn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
      }
      dKo=mn+'월 '+dy+'일'+(wk?'('+wk+')':'');
      dEn=monEn+' '+dy+(wkEn?' ('+wkEn+')':'');
    }
  }
  // ⏰ 방문시간 : 「오전 9시 전후」 · 「오후 1시 30분 전후」 / 영문 「around 9 AM」
  var tKo='',tEn='';
  if(timeS){
    var tm=String(timeS).match(/^(\d{1,2}):(\d{2})/);
    if(tm){
      var h=parseInt(tm[1],10),mi=parseInt(tm[2],10);
      var h12=h%12;if(h12===0)h12=12;
      tKo=(h<12?'오전 ':'오후 ')+h12+'시'+(mi?' '+mi+'분':'')+' 전후';
      tEn='around '+h12+(mi?':'+String(mi).padStart(2,'0'):'')+(h<12?' AM':' PM');
    }
  }
  return {dKo:dKo,dEn:dEn,tKo:tKo,tEn:tEn};
}

var VR_SDKS=['https://t1.kakaocdn.net/kakao_js_sdk/2.7.5/kakao.min.js',

// 카카오 텍스트형 카드는 200자까지만 보여 줍니다.
//  · 주소 줄과 그 짝인 「📱 MY PAGE」 제목 줄은 카드의 「마이페이지 열기」 버튼이 대신하므로 걷어냅니다.
//  · 그래도 넘치면 회사명·연락처 서명부터 덜어냅니다 (카드 하단에 이미 표시됩니다).
function vrKkText(m){
  var t=String(m||'')
    .replace(/^.*https?:\/\/\S+.*$/gm,'')
    .replace(/^\s*📱\s*(MY ?PAGE|My Page|마이페이지)\s*$/gim,'')
    .replace(/[ \t]+$/gm,'').replace(/\n{3,}/g,'\n\n').trim();
  var MAX=195,len=function(x){return Array.from(x).length;};
  if(len(t)>MAX){
    t=t.split('\n').filter(function(x){
      return !(/📞\s*\+?\s*60[\s-]*17[\s-]*247[\s-]*2774/.test(x)||/^\s*Happy Home Care\s*$/i.test(x));
    }).join('\n').replace(/\n{3,}/g,'\n\n').trim();
  }
  if(len(t)>MAX)t=t.split('\n').filter(function(x){return !/^\s*(감사합니다|Thank you)/.test(x);}).join('\n').trim();
  if(len(t)>MAX)t=Array.from(t).slice(0,MAX-1).join('').replace(/\s+\S*$/,'')+'…';
  return t;
}

// ── 🌐 고객에게 보내는 주소는 「항상 정식 도메인」으로 만듭니다 ──
//    관리자가 옛 주소(hhc-3p8.pages.dev)나 www· .my 주소로 화면을 열어 두었더라도

//    (localhost·file: 등 시험 환경에서는 지금 주소를 그대로 씁니다)
function hhcOrigin(){
  try{
    if(location.protocol==='file:')return 'https://happyhomecare.com.my';
    var h=location.hostname||'';
    if(h==='localhost'||h==='127.0.0.1'||h==='::1'||/^192\.168\./.test(h)||/^10\./.test(h))
      return location.origin;
    return 'https://happyhomecare.com.my';
  }catch(e){return 'https://happyhomecare.com.my';}
}
function vrBase(){
  try{
    if(location.protocol==='file:')return 'https://happyhomecare.com.my';
    return hhcOrigin()+location.pathname.replace(/[^/]*$/,'').replace(/\/$/,'');
  }catch(e){return 'https://happyhomecare.com.my';}
}

  let name=item.customer_name||'고객';
  let dateStr=item.booking_date||item.date||'';
  let lang=curLang==='en'?'en':'ko';

    const parts=String(item.title).replace(/^🛠\s*/,'').split(' — ');

  if(!dateStr&&item.type!=='repair'&&!item.memo_id){alert('예약 날짜를 찾을 수 없습니다');return;}

  const timeS=item.time_s||item.booking_time||'';
  // 🛠 메모장(수리요청)에서 자동 등록된 일정 — 수리 전용 문구·마이페이지 위치를 사용합니다
  const isRepair=(item.type==='repair'||!!item.memo_id);
  const symptom=isRepair?vrSymptom(item):'';
  // 📱 마이페이지 주소 · 고객 연락처 — 왓츠앱 본문과 카카오 카드 버튼이 함께 사용합니다
  const VR_PH=item.customer_phone||item.phone||'';
  let VR_URL=vrMyLink(name,VR_PH,lang==='en',isRepair?'mm':'bk');
  const title=isRepair
    ?(lang==='en'?'🛠 Repair Visit Message':'🛠 수리 방문 안내 메시지')
    :(lang==='en'?'💬 Visit Reminder Message':'💬 방문 안내 메시지');
  const subtitle=lang==='en'?`Choose a template and send to ${name}`:`템플릿 선택 후 ${name}님께 전송해 주세요`;
  const closeLabel=lang==='en'?'Close':'닫기';
  const waLabel=lang==='en'?'Send via WhatsApp':'WhatsApp 전송';
  const kakaoLabel=lang==='en'?'Send via KakaoTalk':'카카오톡 발송';
  const copyLabel=lang==='en'?'Copy':'메시지 복사';
  const copiedLabel=lang==='en'?'✓ Copied! Paste in KakaoTalk':'✓ 복사됨! 카카오톡에 붙여넣기 하세요';
  const tplLabels=isRepair
    ?(lang==='en'
      ?[{k:'now',l:'⚡ Now'},{k:'pre',l:'📅 Advance'},{k:'tomorrow',l:'🌙 Tomorrow'},{k:'today',l:'☀️ Today'}]
      :[{k:'now',l:'⚡ 지금 방문'},{k:'pre',l:'📅 사전 안내'},{k:'tomorrow',l:'🌙 내일 방문'},{k:'today',l:'☀️ 당일 안내'}])
    :(lang==='en'
      ?[{k:'pre',l:'📅 Advance'},{k:'tomorrow',l:'🌙 Tomorrow'},{k:'today',l:'☀️ Today'}]
      :[{k:'pre',l:'📅 사전 안내'},{k:'tomorrow',l:'🌙 내일 방문'},{k:'today',l:'☀️ 당일 안내'}]);
  // 예약일 기준 기본 템플릿 자동 선택: 당일→'today', 내일→'tomorrow', 그 외→'pre'
  let defTpl='pre';
  try{
    const today=myNow();today.setHours(0,0,0,0);
    const bd=new Date(dateStr+'T00:00:00');
    const diff=Math.round((bd-today)/86400000);
    if(diff===0)defTpl='today';else if(diff===1)defTpl='tomorrow';
  }catch(e){}
  if(isRepair&&!dateStr)defTpl='now';   // 방문 예정일이 없는 수리요청 → 「지금 방문」 문구

  const existing=document.getElementById('visit-msg-modal');
  if(existing)existing.remove();
  const modal=document.createElement('div');
  modal.id='visit-msg-modal';
  modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  const chipBase='flex:1;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;border:1.5px solid #e5e7eb;background:#fff;color:#6b7280;font-family:inherit;white-space:nowrap';
  modal.innerHTML=`
    <div style="background:#fff;border-radius:20px;padding:22px;max-width:440px;width:100%;box-shadow:0 8px 32px rgba(0,0,0,.14)">
      <div style="font-size:15px;font-weight:700;color:var(--navy);margin-bottom:4px">${title}</div>
      <div style="font-size:12px;color:#8a8f9a;margin-bottom:11px">${subtitle}</div>
      <div style="display:flex;gap:6px;margin-bottom:10px" id="visit-tpl-row">
        ${tplLabels.map(t=>`<button data-tpl="${t.k}" style="${chipBase}">${t.l}</button>`).join('')}
      </div>
      <textarea id="visit-msg-box" rows="9" style="width:100%;box-sizing:border-box;background:#f5f6f8;border:1px solid #e5e7eb;border-radius:10px;padding:12px;font-size:12px;color:#333;line-height:1.8;resize:vertical;font-family:inherit;margin-bottom:11px"></textarea>
      <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px">
        <button id="visit-wa-btn" style="flex:1;padding:10px;border:none;border-radius:8px;background:#25D366;color:#fff;font-size:13px;font-weight:600;cursor:pointer">${waLabel}</button>
        <button id="visit-kakao-btn" style="flex:1.25;padding:10px;border:none;border-radius:8px;background:#FEE500;color:#3A1D1D;font-size:13px;font-weight:700;cursor:pointer">💛 ${kakaoLabel}</button>
      </div>
      <button id="visit-copy-btn" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;color:#6b7280;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:10px">📋 ${copyLabel}</button>
      <div id="visit-kakao-ok" style="display:none;text-align:center;padding:8px;background:#E0F9F5;color:#085048;border-radius:6px;font-size:12px;font-weight:600;margin-bottom:8px">${copiedLabel}</div>
      <button id="visit-close-btn" style="width:100%;padding:9px;border:1px solid #e5e7eb;border-radius:8px;background:transparent;color:#333;font-size:13px;font-weight:500;cursor:pointer">${closeLabel}</button>
    </div>`;
  document.body.appendChild(modal);

  let curTpl=defTpl;
  function setTpl(tpl){
    document.querySelectorAll('#visit-tpl-row button').forEach(b=>{
      const on=b.dataset.tpl===tpl;
      b.style.background=on?'#0BB5A4':'#fff';
      b.style.color=on?'#fff':'#6b7280';
      b.style.borderColor=on?'#0BB5A4':'#e5e7eb';
    });
    curTpl=tpl;
    document.getElementById('visit-msg-box').value=
      (isRepair?getRepairReminderMsg(name,dateStr,lang,tpl,timeS,symptom)
               :getVisitReminderMsg(name,dateStr,lang,tpl,timeS))+vrTail(VR_URL,lang==='en');
  }
  document.querySelectorAll('#visit-tpl-row button').forEach(b=>{
    b.addEventListener('click',()=>setTpl(b.dataset.tpl));
  });
  setTpl(defTpl);
  // 🔗 마이페이지 주소를 짧은 주소로 — 준비되면 문구 속 주소만 바꿔치기
  hhcShortUrl(VR_URL).then(sv=>{
    if(sv&&sv!==VR_URL){
      const box=document.getElementById('visit-msg-box');
      if(box)box.value=box.value.split(VR_URL).join(sv);
      VR_URL=sv;
    }
  });

  const getMsg=()=>document.getElementById('visit-msg-box').value;
  // 📤 수리 일정에서 보낸 안내는 메모장(수리요청) 발송 이력에도 남깁니다
  const logSend=(txt,ch)=>{
    if(!isRepair||!item.memo_id)return;
    vrLogMemoSend(item.memo_id,txt,ch,curTpl==='now'?1:2);
  };
  // 💬 왓츠앱 — 마이페이지 발송과 같은 형식(주소 포함) + 고객 번호로 바로 열립니다
  document.getElementById('visit-wa-btn').addEventListener('click',()=>{
    const t=vrWaText(getMsg());
    window.open(vrWaUrl(VR_PH,t),'_blank');
    logSend(t,'whatsapp');
  });
  // 💛 카카오톡 카드 발송 — 「마이페이지 열기」 버튼이 붙은 카드로 나갑니다
  document.getElementById('visit-kakao-btn').addEventListener('click',async()=>{

  });
  document.getElementById('visit-copy-btn').addEventListener('click',()=>{
    const t=vrWaText(getMsg());
    navigator.clipboard.writeText(t).then(()=>{
      const ok=document.getElementById('visit-kakao-ok');
      ok.style.display='block';setTimeout(()=>ok.style.display='none',3000);
      logSend(t,'other');
    }).catch(()=>prompt('복사 후 붙여넣기:',getMsg()));
  });
  document.getElementById('visit-close-btn').addEventListener('click',()=>modal.remove());
  modal.addEventListener('click',e=>{if(e.target===modal)modal.remove();});
};

function buildMsg(ds,list,dateStr){
  const lines=['📅 '+dateStr+' '+(curLang==='en'?'Schedule':'일정')+'\n'];
  list.forEach(s=>{
    const tStr=s.time_s?(s.time_e?s.time_s+' ~ '+s.time_e:s.time_s):'';
    lines.push('⏰ '+(tStr?tStr+'  ':'')+s.title);
    if(s.memo){s.memo.split('\n').forEach(m=>{if(m.trim())lines.push(m.trim());});}
    lines.push('');
  });
  lines.push('──────────────');
  lines.push(curLang==='en'?`${list.length} schedule(s) · Happy Home Care · +60 17-247 2774`:`총 ${list.length}건 · Happy Home Care · 📞 +60 17-247 2774`);
  return lines.join('\n');
}

window.saveDayImage=async function(){
  const d=window._dayImageData;
  const isEn=curLang==='en';
  if(!d||!d.list||!d.list.length){showToast(isEn?'Select a date with schedules':'일정이 있는 날짜를 선택하세요');return;}
  if(typeof html2canvas==='undefined'){showToast(isEn?'Image library not loaded':'이미지 기능 로드 실패 (인터넷 확인)');return;}
  const stage=document.getElementById('capture-stage');
  stage.innerHTML=window.buildCaptureHTML(d.list,d.dateStr);
  const node=stage.firstElementChild;
  showLoading(true);
  try{
    if(document.fonts&&document.fonts.ready){try{await document.fonts.ready;}catch(e){}}
    const canvas=await html2canvas(node,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
    const fname='HHC_'+(isEn?'Schedule_':'일정_')+d.ds+'.png';
    const finish=function(){showLoading(false);const ok=document.getElementById('img-ok');if(ok){ok.style.display='block';setTimeout(()=>ok.style.display='none',2500);}};
    canvas.toBlob(async function(blob){
      if(!blob){showLoading(false);showToast(isEn?'Image failed':'이미지 생성 실패');return;}
      const file=new File([blob],fname,{type:'image/png'});
      // 모바일: 네이티브 공유 시트(WhatsApp/카카오 등)로 이미지 직접 전송
      if(navigator.canShare&&navigator.canShare({files:[file]})){
        try{ showLoading(false); await navigator.share({files:[file],title:'HHC '+(isEn?'Schedule':'일정'),text:d.dateStr}); return; }
        catch(e){ if(e&&e.name==='AbortError'){return;} }
      }
      // 데스크톱/미지원: 다운로드
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
      finish();
    },'image/png');
  }catch(e){showLoading(false);showToast((isEn?'Image failed: ':'이미지 생성 실패: ')+(e&&e.message||''));}
};

const SK_L={
  ko:{title:'🛒 품목 선택',search:'품목·서비스 검색',cntLbl:'담은 품목',ok:'확인',noResult:'검색 결과가 없습니다',

    freeT:'기타 (직접 입력)',freeD:'목록에 없는 요청을 직접 적어주세요',freePh:'요청 내용 입력 (예: 방충망 보수)',
    qty:'수량',rm:'빼기',cnt:function(n){return n+'개';},unit:'대',other:'기타서비스'},
  en:{title:'🛒 Select Items',search:'Search items & services',cntLbl:'Items added',ok:'Done',noResult:'No results found',
    empty:'No items added yet.\nTap the "Select Items" button above.',
    freeT:'Other (Custom)',freeD:'Describe a request not in the list',freePh:'Enter your request (e.g. mosquito net repair)',

let skPicked=[];      // {key,catId,grp:[ko,en]|null,svc:[ko,en]|null,free,text,qty}
let skCat='ac_home';

const skQ=x=>document.getElementById(x);
function skEn(){return curLang==='en';}
function skL(){return SK_L[skEn()?'en':'ko'];}
function skCatOf(id){return SK_CATS.find(c=>c.id===id);}
function skTr(pair){return pair?(skEn()?pair[1]:pair[0]):'';}
function skCatName(c){return skEn()?c.en:c.ko;}
function skEsc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function skKey(catId,grp,svc){return catId+'|'+(grp?grp[0]:'')+'|'+(svc?svc[0]:'');}
function skTitleOf(p){
  if(p.free)return p.text||skL().freeT;
  const g=skTr(p.grp);
  return (g?g+' · ':'')+skTr(p.svc);
}
function skTotal(){return skPicked.reduce((a,p)=>a+p.qty,0);}
function skCatCnt(id){return skPicked.filter(p=>p.catId===id).reduce((a,p)=>a+p.qty,0);}
function skNoteHtml(c,cls){return c&&c.note?'<div class="'+(cls||'sk-note')+'"><span class="ic">💡</span><span>'+skEsc(skTr(c.note))+'</span></div>':'';}

// 선택된 품목 목록 (모달 안)
function skRenderPicked(){
  const l=skL(),el=skQ('rv-picked');
  if(!el)return;
  if(!skPicked.length){
    el.innerHTML='<div class="spick-empty">'+skEsc(l.empty).replace(/\n/g,'<br>')+'</div>';
  }else{
    const notes=SK_CATS.filter(c=>c.note&&skPicked.some(p=>p.catId===c.id)).map(c=>skNoteHtml(c,'spick-note')).join('');
    el.innerHTML=notes+skPicked.map((p,i)=>{
      const c=skCatOf(p.catId);
      const freeIn=p.free?'<input class="free-in" data-i="'+i+'" value="'+skEsc(p.text)+'" placeholder="'+skEsc(l.freePh)+'">':'';
      return '<div class="spick-it"><span class="ic">'+c.ic+'</span>'+
        '<div class="nm"><b>'+skEsc(skTitleOf(p))+'</b><span>'+skEsc(skCatName(c))+'</span></div>'+
        '<div class="sqty"><button type="button" data-qm="'+i+'">−</button><b>'+p.qty+'</b><button type="button" data-qp="'+i+'">＋</button></div>'+
        '<button type="button" class="spick-x" data-x="'+i+'">✕</button>'+freeIn+'</div>';
    }).join('');
  }
  const n=skTotal(),cnt=skQ('rv-cnt');
  if(cnt){cnt.textContent=l.cnt(n);cnt.classList.toggle('show',n>0);}
  el.querySelectorAll('[data-qm]').forEach(b=>b.onclick=()=>{const i=+b.dataset.qm;if(skPicked[i].qty>1)skPicked[i].qty--;else skPicked.splice(i,1);skRenderPicked();});
  el.querySelectorAll('[data-qp]').forEach(b=>b.onclick=()=>{const i=+b.dataset.qp;if(skPicked[i].qty<99)skPicked[i].qty++;skRenderPicked();});
  el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{skPicked.splice(+b.dataset.x,1);skRenderPicked();});
  el.querySelectorAll('.free-in').forEach(inp=>{inp.oninput=()=>{skPicked[+inp.dataset.i].text=inp.value;};});
}

function skRenderRail(){
  skQ('sk-rail').innerHTML=SK_CATS.map(c=>{
    const n=skCatCnt(c.id);
    return '<button type="button" class="sk-rl'+(c.id===skCat?' on':'')+'" data-cat="'+c.id+'">'+
      '<span class="cnt">'+(n||'')+'</span><span class="ic">'+c.ic+'</span>'+
      '<span class="t">'+skEsc(skCatName(c)).replace('(','<br>(')+'</span></button>';
  }).join('');
  skQ('sk-rail').querySelectorAll('.sk-rl').forEach(b=>b.onclick=()=>{skCat=b.dataset.cat;skQ('sk-q').value='';skRenderRail();skRenderList();skQ('sk-list').scrollTop=0;});
}
function skFind(key){return skPicked.find(p=>p.key===key);}
function skRowHtml(c,grp,svc){
  const key=skKey(c.id,grp,svc),p=skFind(key),l=skL();
  const sub=grp?skTr(grp):skCatName(c);
  let h='<div class="sk-row'+(p?' on':'')+'" data-key="'+skEsc(key)+'">'+
    '<div class="sk-row-main"><div class="nm"><b>'+skEsc(skTr(svc))+'</b><span>'+skEsc(sub)+'</span></div>'+
    '<button type="button" class="addb">'+(p?'✓':'＋')+'</button></div>';
  if(p)h+='<div class="ed"><span class="lb">'+l.qty+'</span><div class="sqty"><button type="button" class="qm">−</button><b>'+p.qty+'</b><button type="button" class="qp">＋</button></div><button type="button" class="rm">✕ '+l.rm+'</button></div>';
  return h+'</div>';
}
function skFreeRowHtml(c){
  const l=skL();
  return '<div class="sk-row" data-free="'+c.id+'"><div class="sk-row-main"><div class="nm"><b>'+skEsc(l.freeT)+'</b><span>'+skEsc(l.freeD)+'</span></div><button type="button" class="addb">＋</button></div></div>';
}
window.skRenderList=function(){
  const l=skL(),q=(skQ('sk-q').value||'').trim().toLowerCase(),el=skQ('sk-list');
  let h='';
  if(q){
    let found=0;
    SK_CATS.forEach(c=>{
      const rows=[];
      c.groups.forEach(g=>{(g.svcs||[]).forEach(svc=>{
        const hay=(c.ko+' '+c.en+' '+(g.ko||'')+' '+(g.en||'')+' '+svc[0]+' '+svc[1]).toLowerCase();
        if(hay.indexOf(q)>=0)rows.push(skRowHtml(c,(g.ko?[g.ko,g.en]:null),svc));
      });});
      if(rows.length){h+='<div class="sk-grp">'+c.ic+' '+skEsc(skCatName(c))+'</div>'+skNoteHtml(c)+rows.join('');found+=rows.length;}
    });
    if(!found)h='<div class="sk-empty">'+skEsc(l.noResult)+'</div>';
  }else{
    const c=skCatOf(skCat);
    h+=skNoteHtml(c);
    c.groups.forEach(g=>{
      h+='<div class="sk-grp">'+skEsc(g.ko?skTr([g.ko,g.en]):skCatName(c))+'</div>';
      (g.svcs||[]).forEach(svc=>{h+=skRowHtml(c,(g.ko?[g.ko,g.en]:null),svc);});
    });
    if(c.free)h+=skFreeRowHtml(c);
  }
  el.innerHTML=h;
  skBind();
};
function skBind(){
  skQ('sk-list').querySelectorAll('.sk-row').forEach(row=>{
    const key=row.dataset.key,freeCat=row.dataset.free;
    const p=key?skFind(key):null;
    if(freeCat){
      row.querySelector('.sk-row-main').onclick=()=>{
        skPicked.push({key:'free|'+Date.now(),catId:freeCat,free:true,text:'',qty:1});
        skRenderRail();skFoot();window.skClose();
        setTimeout(()=>{const ins=document.querySelectorAll('#rv-picked .free-in');if(ins.length)ins[ins.length-1].focus();},60);
      };
      return;
    }
    if(!p){
      row.querySelector('.sk-row-main').onclick=()=>{
        const c=skCatOf(key.split('|')[0]);
        let gp=null,sp=null;
        c.groups.forEach(g=>{(g.svcs||[]).forEach(svc=>{if(skKey(c.id,(g.ko?[g.ko,g.en]:null),svc)===key){gp=g.ko?[g.ko,g.en]:null;sp=svc;}});});
        skPicked.push({key,catId:c.id,grp:gp,svc:sp,qty:1});
        skRenderRail();window.skRenderList();skFoot();
      };
    }else{
      const qm=row.querySelector('.qm'),qp=row.querySelector('.qp'),rm=row.querySelector('.rm');
      if(qm)qm.onclick=e=>{e.stopPropagation();if(p.qty>1)p.qty--;else skPicked=skPicked.filter(x=>x!==p);skRenderRail();window.skRenderList();skFoot();};
      if(qp)qp.onclick=e=>{e.stopPropagation();if(p.qty<99)p.qty++;skRenderRail();window.skRenderList();skFoot();};
      if(rm)rm.onclick=e=>{e.stopPropagation();skPicked=skPicked.filter(x=>x!==p);skRenderRail();window.skRenderList();skFoot();};
    }
  });
}
function skFoot(){skQ('sk-cnt').textContent=skL().cnt(skTotal());}
window.skOpen=function(){
  const l=skL();
  skQ('sk-title').textContent=l.title;skQ('sk-q').placeholder=l.search;
  skQ('sk-cnt-lbl').textContent=l.cntLbl;skQ('sk-ok').textContent=l.ok;
  skQ('sk-bg').classList.remove('hidden');skQ('sk-sheet').classList.remove('hidden');
  document.body.classList.add('sk-lock');
  skQ('sk-q').value='';
  skRenderRail();window.skRenderList();skFoot();
  skQ('sk-list').scrollTop=0;
};
window.skClose=function(){
  skQ('sk-bg').classList.add('hidden');skQ('sk-sheet').classList.add('hidden');
  document.body.classList.remove('sk-lock');
  skRenderPicked();
};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!skQ('sk-sheet').classList.contains('hidden'))window.skClose();});

// 선택 품목 → 표시 문자열 / 구조화 데이터 (예약 등록과 동일한 포맷)
function skItemsText(){
  const l=skL(),en=skEn();
  return skPicked.map(p=>{
    const c=skCatOf(p.catId);
    const name=p.free?(p.text||'').trim():skCatName(c);
    const svcPart=p.free?l.other:skTitleOf(p);
    return name+'('+(en?p.qty+' '+l.unit:p.qty+l.unit)+'/'+svcPart+')';
  }).join(', ');
}
function skStruct(){
  return skPicked.map(p=>({catId:p.catId,grpKo:p.grp?p.grp[0]:null,svcKo:p.svc?p.svc[0]:null,free:!!p.free,text:p.free?(p.text||'').trim():'',qty:p.qty}));
}
function skLoadStruct(raw){
  skPicked=[];
  let arr=[];
  try{arr=typeof raw==='string'?JSON.parse(raw||'[]'):(raw||[]);}catch(e){arr=[];}
  (arr||[]).forEach(o=>{
    const c=skCatOf(o.catId);if(!c)return;
    if(o.free){skPicked.push({key:'free|'+Math.random().toString(36).slice(2),catId:c.id,free:true,text:o.text||'',qty:o.qty||1});return;}
    let gp=null,sp=null;
    c.groups.forEach(g=>{(g.svcs||[]).forEach(svc=>{
      if((g.ko||null)===(o.grpKo||null)&&svc[0]===o.svcKo){gp=g.ko?[g.ko,g.en]:null;sp=svc;}
    });});
    if(sp)skPicked.push({key:skKey(c.id,gp,sp),catId:c.id,grp:gp,svc:sp,qty:o.qty||1});
  });
}

window.saveItem=async function(){
  const title=document.getElementById('f-title').value.trim();
  if(!title){showToast(curLang==='en'?(curType==='reserve'?'Enter customer name':'Enter title'):(curType==='reserve'?'고객명을 입력하세요':'제목을 입력하세요'));return;}
  const rawMemo=document.getElementById('f-memo').value.trim();
  let fields;
  if(curType==='reserve'){
    // 📅 예약 일정 — 예약 등록과 동일한 필드 구성으로 저장 (총괄 고객관리 · 방문안내 메시지와 호환)
    const addr=document.getElementById('f-rv-addr').value.trim();
    const phone=document.getElementById('f-rv-phone').value.trim();
    const bdate=document.getElementById('f-rv-date').value;
    const btime=document.getElementById('f-rv-time').value;
    if(!bdate){showToast(curLang==='en'?'Select a booking date':'예약일을 선택하세요');return;}
    if(!skPicked.length){showToast(curLang==='en'?'Add at least one item':'품목을 담아주세요');return;}
    const emptyFree=skPicked.find(p=>p.free&&!(p.text||'').trim());
    if(emptyFree){showToast(curLang==='en'?'Describe the custom item':'직접 입력 품목의 내용을 적어주세요');return;}
    const itemsTxt=skItemsText();
    fields={
      date:bdate,
      title:addr?(title+' — '+addr):title,
      time_s:btime||'09:00',time_e:'',
      type:'reserve',
      memo:[addr?'🏠 '+addr:'', itemsTxt?'🔧 '+itemsTxt:'', rawMemo?'📝 '+rawMemo:''].filter(Boolean).join('\n'),
      customer_name:title,customer_phone:phone,customer_address:addr,customer_lang:'ko',
      booking_date:bdate,booking_time:btime,
      booking_items:itemsTxt,
      booking_items_struct:JSON.stringify(skStruct()),
      request_memo:rawMemo
    };
  }else{
    fields={
      date:selDate,title,
      time_s:document.getElementById('f-ts').value,
      time_e:document.getElementById('f-te').value,
      type:curType,
      memo:rawMemo
    };
  }
  try{
    showLoading(true);
    if(editingId){
      await updateDoc(doc(db,'schedules',editingId),fields);
    }else{
      fields.created_at=new Date().toISOString();
      await addDoc(collection(db,'schedules'),fields);
    }
    showLoading(false);window.closeModal();showToast(curLang==='en'?'✓ Saved':'✓ 저장됨');
  }catch(e){showLoading(false);alert(e.message);}
};

  // 번역 테스트
  if(lang==='en'){

      alert('API 키가 없습니다. 페이지를 새로고침 후 다시 로그인하세요.');
      return;
    }
    try{
      showLoading(true);
      const testRes=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-api-key':key,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body:JSON.stringify({
          model:'claude-sonnet-4-6',max_tokens:50,
          messages:[{role:'user',content:'Say "OK" in English only.'}]
        })
      });
      const testData=await testRes.json();
      showLoading(false);
      if(testData.error){
        alert('번역 API 오류: '+testData.error.message+'\n\nAPI 키를 확인하세요.');
        curLang='ko';
        document.getElementById('btn-ko').className='lang-btn on';
        document.getElementById('btn-en').className='lang-btn';
        return;
      }
      showToast('✓ 번역 API 연결됨');
    }catch(e){
      showLoading(false);
      alert('번역 API 연결 실패: '+e.message);
      curLang='ko';
      document.getElementById('btn-ko').className='lang-btn on';
      document.getElementById('btn-en').className='lang-btn';
      return;
    }
  }
  document.getElementById('btn-ko').className='lang-btn'+(lang==='ko'?' on':'');
  document.getElementById('btn-en').className='lang-btn'+(lang==='en'?' on':'');
  document.getElementById('leg-b').textContent=lang==='en'?'Confirmed':'예약확정';
  document.getElementById('leg-r').textContent=lang==='en'?'🛠 Repair':'🛠 수리';
  document.getElementById('leg-m').textContent=lang==='en'?'Internal':'직접입력';
  document.getElementById('leg-h').textContent=lang==='en'?'Holiday':'휴일';
  refresh();if(selDate)renderDay(selDate);
};

// ── 유틸
function showLoading(v){document.getElementById('loading').classList.toggle('on',v);}
// 📅 일정의 예약 고객 → 총괄 고객관리(customer-admin.html) 해당 고객 상세로 이동
// 관리자 허브(staff-app) 안에서 열려 있으면 허브의 「고객관리」 탭으로 전환해서 열고,
// 단독 창으로 열려 있으면 새 탭으로 엽니다. (모바일에서 새 탭이 쌓이지 않도록)
window.openCustomerAdmin=function(id){
  const list=getMerged(selDate);
  const it=list.find(x=>x._id===id);
  if(!it){showToast('일정 정보를 찾을 수 없습니다');return;}
  // 연락처·고객명을 함께 넘깁니다 (customer-admin 은 「연락처|이름」 형식을 받습니다).
  // 연락처가 「+60」처럼 불완전하면 이름으로 찾도록 연락처 후보에서 뺍니다.
  const ph=(it.customer_phone||'').trim();
  const phOk=!/[a-zA-Z가-힣]/.test(ph)&&ph.replace(/[^0-9]/g,'').replace(/^60/,'').replace(/^0+/,'').length>=6;
  const parts=[];
  if(phOk)parts.push(ph);
  const nm=schName(it)||(it.customer_name||'').trim();
  if(nm)parts.push(nm);
  if(it.memo_id&&it.title){          // 메모장 일정: 제목 「🛠 콘도명 (고객명)」의 두 값도 후보로
    const tt=String(it.title).replace(/^[^0-9A-Za-z가-힣]+/,'').replace(/^커튼 재설치\s*·\s*/,'').trim();
    const mm=tt.match(/^(.*?)\s*\((.*?)\)\s*$/);
    if(mm){parts.push(mm[2].trim());parts.push(mm[1].trim());}
    else if(tt&&tt!=='수리 방문'&&tt!=='커튼 재설치')parts.push(tt);
  }
  const key=parts.filter(function(v,i,a){return v&&a.indexOf(v)===i;}).join('|');
  if(!key){showToast('고객 정보가 없는 일정입니다');return;}
  const url='customer-admin.html?open='+encodeURIComponent(key);
  let done=false;
  const fallback=function(){if(done)return;done=true;window.open(url,'_blank');};
  try{
    if(window.parent&&window.parent!==window){
      const ack=function(ev){if(ev&&ev.data&&ev.data.hhcOpenCustomerOk){done=true;window.removeEventListener('message',ack);}};
      window.addEventListener('message',ack);
      window.parent.postMessage({hhcOpenCustomer:key},'*');
      showToast('👤 고객관리에서 여는 중...');
      setTimeout(function(){window.removeEventListener('message',ack);fallback();},600);
      return;
    }
  }catch(e){}
  fallback();
};
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000);}

// 초기 실행
initApp();
renderNav();
</script>
<script>
/* ══ 허브(staffapp.html) 안에서 열렸을 때 「화면 살아있음」 신호 ══════════════
   · 열리자마자 hhcHello, 데이터가 처음 도착하면 hhcReady 를 허브로 보냅니다.
   · 15초 안에 데이터가 오지 않으면(앱을 켠 직후 통신이 걸린 상태) 스스로 새로고침 — 최대 2회.
     그래도 안 되면 허브에 hhcStuck 을 알려 「다시 불러오기」 안내를 띄우게 합니다.
   · 허브가 hhcPing 을 보내면 현재 상태(hhcPong)로 답합니다.
   ※ 허브 밖에서 단독으로 열었을 때는 아무 동작도 하지 않습니다. */
(function(){
  if(window.top===window.self)return;
  var ready=false,KEY='hhc_wd:'+location.pathname,n=0;
  try{n=parseInt(sessionStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  function post(m){try{window.parent.postMessage(m,'*');}catch(e){}}
  window.__hhcReady=function(){if(ready)return;ready=true;try{sessionStorage.removeItem(KEY);}catch(e){}post({hhcReady:1});};
  window.addEventListener('message',function(e){var d=e&&e.data;if(d&&d.hhcPing)post({hhcPong:1,ready:ready});});
  post({hhcHello:1});
  setTimeout(function(){
    if(ready)return;
    if(navigator.onLine===false||document.visibilityState!=='visible'){post({hhcStuck:1,soft:1});return;}
    if(n>=2){post({hhcStuck:1});return;}
    try{sessionStorage.setItem(KEY,String(n+1));}catch(e){}
    location.reload();
  },15000);
})();
</script>
