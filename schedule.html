<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1833">
<title>일정 캘린더 — Happy Home Care</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0B1833;--teal:#0BB5A4;--teal-lt:#E0F9F5;--teal-dk:#085048;
  --g:#F2F5FB;--w:#fff;--ln:#E8EDF6;
  --tx:#1A2035;--tx2:#5C6478;--tx3:#9AA0B0;
  --ok:#059669;--okbg:#ECFDF5;
  --bd:#DC2626;--bdbg:#FEF2F2;
  --purple:#8B5CF6;--purple-lt:#EDE9FE;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--g);color:var(--tx);display:flex;flex-direction:column}

/* 로그인 없음 */

/* ── 앱 ── */
.app{display:none;flex-direction:column;height:100%}
.app.on{display:flex}

/* 헤더 */
.hdr{background:var(--navy);padding:calc(10px + var(--safe-top)) 14px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-logo{display:flex;align-items:center;gap:8px}
.hdr-mark{width:30px;height:30px;background:var(--teal);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.hdr-name{font-size:13px;font-weight:600;color:#fff}
.hdr-sub{font-size:9px;color:rgba(255,255,255,.4)}
.hdr-right{display:flex;align-items:center;gap:8px}
.view-toggle{display:flex;background:rgba(255,255,255,.1);border-radius:8px;padding:2px;gap:2px}
.view-btn{padding:5px 10px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:rgba(255,255,255,.5)}
.view-btn.on{background:rgba(255,255,255,.2);color:#fff}
.lang-toggle{display:flex;background:rgba(255,255,255,.1);border-radius:20px;padding:2px}
.lang-btn{padding:4px 9px;border-radius:16px;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:rgba(255,255,255,.5)}
.lang-btn.on{background:#fff;color:var(--navy)}

/* 월 네비 */
.nav-bar{background:var(--w);border-bottom:0.5px solid var(--ln);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.nav-btn{width:34px;height:34px;border-radius:50%;border:0.5px solid var(--ln);background:var(--g);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.nav-btn:active{background:var(--teal-lt)}
.nav-center{display:flex;align-items:center;gap:10px}
.nav-month{font-size:16px;font-weight:700;color:var(--navy)}
.today-btn{padding:5px 12px;border-radius:20px;border:0.5px solid var(--teal);background:var(--teal-lt);color:var(--teal-dk);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}

/* ── 월 뷰 캘린더 ── */
.month-view{flex:1;display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.cal-wrap{background:var(--w);border-bottom:0.5px solid var(--ln);flex-shrink:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0.5px;background:var(--ln)}
.day-name{padding:6px 0;text-align:center;font-size:10px;font-weight:600;color:var(--tx3);background:var(--g)}
.day-name:first-child{color:#DC2626}
.day-name:last-child{color:#3B5BDB}
.cal-day{height:56px;background:var(--w);cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:5px 2px 3px;gap:1.5px;position:relative;transition:background .12s}
.cal-day:active{background:var(--teal-lt)}
.cal-day.today .day-num{background:var(--teal);color:#fff;border-radius:50%;font-weight:700}
.cal-day.sel{background:#F0FDF9}
.cal-day.sel::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2.5px;background:var(--teal)}
.cal-day.other-m{background:#FAFAFA}
.cal-day.other-m .day-num{color:#C8D0E0}
.cal-day.sun .day-num{color:#DC2626}
.cal-day.sat .day-num{color:#3B5BDB}
.day-num{width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.day-dots{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:34px}
.day-dot{width:4.5px;height:4.5px;border-radius:50%;flex-shrink:0}
.dot-b{background:#0BB5A4}
.dot-m{background:var(--purple)}
.dot-h{background:#DC2626}
.dot-gg{background:#4285F4}
.day-cnt{font-size:8px;font-weight:700;color:var(--tx3)}
.legend-bar{display:flex;gap:12px;flex-wrap:wrap;padding:6px 14px;border-top:0.5px solid var(--ln);font-size:10px;color:var(--tx2)}
.leg{display:flex;align-items:center;gap:4px}
.leg-dot{width:8px;height:8px;border-radius:2px}

/* 일정 패널 (슬라이드 업) */
.day-panel{flex:1;padding-bottom:calc(80px + var(--safe-bot))}
.day-hdr{position:sticky;top:0;z-index:10;background:var(--g);padding:10px 16px 6px;border-bottom:0.5px solid var(--ln);display:flex;align-items:center;justify-content:space-between}
.day-hdr-date{font-size:14px;font-weight:700;color:var(--navy)}
.day-hdr-cnt{font-size:11px;color:var(--tx3)}
.share-row{display:flex;gap:6px}
.share-btn{padding:5px 10px;border-radius:20px;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}

/* ── 주 뷰 ── */
.week-view{flex:1;display:none;flex-direction:column;overflow:hidden}
.week-view.on{display:flex}
.week-hdr{display:grid;grid-template-columns:40px repeat(7,1fr);background:var(--w);border-bottom:0.5px solid var(--ln);flex-shrink:0}
.week-hdr-empty{border-right:0.5px solid var(--ln)}
.week-day-hdr{padding:6px 2px;text-align:center;border-right:0.5px solid var(--ln);cursor:pointer}
.week-day-hdr:last-child{border-right:none}
.week-day-name{font-size:9px;font-weight:600;color:var(--tx3)}
.week-day-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;margin:2px auto 0;color:var(--tx)}
.week-day-num.today{background:var(--teal);color:#fff;font-weight:700}
.week-day-num.sel{background:var(--navy);color:#fff}
.week-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.week-grid{display:grid;grid-template-columns:40px repeat(7,1fr);padding-bottom:60px}
.time-col{border-right:0.5px solid var(--ln)}
.time-slot{height:52px;border-bottom:0.5px solid #F0F4FB;display:flex;align-items:flex-start;justify-content:flex-end;padding:2px 5px 0 0}
.time-lbl{font-size:9px;color:var(--tx3);margin-top:-1px}
.week-col{border-right:0.5px solid var(--ln);position:relative}
.week-col:last-child{border-right:none}
.week-cell{height:52px;border-bottom:0.5px solid #F0F4FB;position:relative}
.week-event{position:absolute;left:2px;right:2px;border-radius:4px;padding:2px 5px;font-size:10px;font-weight:600;overflow:hidden;cursor:pointer;line-height:1.35;z-index:1}
.week-event.type-b{background:#CCF2EE;color:#085048;border-left:2.5px solid #0BB5A4}
.week-event.type-m{background:var(--purple-lt);color:#5B21B6;border-left:2.5px solid var(--purple)}
.week-event.type-h{background:#FFE4E6;color:#9F1239;border-left:2.5px solid #DC2626}
.week-event.type-gg{background:#E8F0FE;color:#1A56DB;border-left:2.5px solid #4285F4}
.week-now-line{position:absolute;left:0;right:0;height:2px;background:var(--bd);z-index:2;pointer-events:none}
.week-now-dot{position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bd)}

/* 일정 아이템 */
.sch-list{padding:4px 0}
.sch-item{display:flex;gap:10px;padding:11px 16px;border-bottom:0.5px solid var(--ln);align-items:flex-start;background:var(--w)}
.sch-bar{width:3px;border-radius:2px;align-self:stretch;min-height:30px;flex-shrink:0}
.sch-time-col{width:52px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.sch-ts{font-size:11px;font-weight:600;color:var(--tx)}
.sch-te{font-size:10px;color:var(--tx3)}
.sch-body{flex:1;min-width:0}
.sch-type{display:inline-flex;padding:1px 7px;border-radius:8px;font-size:9px;font-weight:700;margin-bottom:3px}
.sch-ttl{font-size:13px;font-weight:500;color:var(--tx);margin-bottom:3px;line-height:1.4}
.sch-ttl-condo{font-size:16px;font-weight:800;color:var(--tx);margin-bottom:4px;line-height:1.3}
.sch-sub{font-size:11px;color:var(--tx2);line-height:1.65}
.sch-auto{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:600;background:var(--g);color:var(--tx3);margin-top:4px}
.sch-edit{flex-shrink:0;width:24px;height:24px;border:none;background:none;color:var(--tx3);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sch-del{width:28px;height:28px;border-radius:50%;border:none;background:var(--bdbg);color:var(--bd);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.translating{opacity:.5;font-style:italic}

/* 빈 날짜 */
.empty-day{padding:36px 16px;text-align:center;color:var(--tx3)}
.empty-ico{font-size:40px;margin-bottom:12px}
.empty-txt{font-size:14px;font-weight:500;color:var(--tx2);margin-bottom:4px}
.empty-sub{font-size:12px}

/* 공유 */
.msg-section{margin:10px 12px;background:var(--w);border:0.5px solid var(--ln);border-radius:12px;overflow:hidden}
.msg-hdr{padding:9px 14px;border-bottom:0.5px solid var(--ln);font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.msg-body{padding:10px 14px;font-size:11px;color:var(--tx2);line-height:1.9;white-space:pre-wrap;font-family:inherit;max-height:180px;overflow-y:auto;background:var(--g)}
.msg-btns{display:flex;gap:8px;padding:10px 14px;border-top:0.5px solid var(--ln)}
.msg-btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.copy-ok{display:none;text-align:center;padding:8px;background:var(--okbg);color:var(--ok);font-size:11px;font-weight:600}

/* FAB */
.fab{position:fixed;bottom:calc(20px + var(--safe-bot));right:18px;width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(11,181,164,.4);display:none;align-items:center;justify-content:center;z-index:100}
.fab:active{transform:scale(.92)}

/* 모달 */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-ov.open{display:flex}
.modal-sheet{background:var(--w);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + var(--safe-bot));width:100%;max-height:92vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--ln);border-radius:2px;margin:0 auto 14px}
.modal-ttl{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:3px}
.modal-sub{font-size:12px;color:var(--tx3);margin-bottom:16px}
.field{margin-bottom:13px}
.flbl{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px 13px;border:0.5px solid var(--ln);border-radius:10px;font-size:14px;font-family:inherit;color:var(--tx);background:var(--g);-webkit-appearance:none}
.field textarea{resize:none;height:90px}
.type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.type-btn{padding:10px 6px;border-radius:9px;border:1.5px solid var(--ln);font-size:12px;font-weight:600;cursor:pointer;text-align:center;background:var(--g);color:var(--tx2);font-family:inherit}
.type-btn.on{border-color:var(--teal);background:var(--teal-lt);color:var(--teal-dk)}
.t2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btns{display:flex;gap:8px;margin-top:6px}
.btn-cancel{flex:1;padding:14px;border:0.5px solid var(--ln);border-radius:10px;background:transparent;color:var(--tx2);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-save-m{flex:2;padding:14px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

/* 유틸 */
.loading{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:300;display:none;align-items:center;justify-content:center}
.loading.on{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--ln);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:calc(90px + var(--safe-bot));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:500;z-index:400;display:none;white-space:nowrap}
.toast.on{display:block}
</style>
</head>
<body>

<!-- 로그인 없음 -->

<!-- 앱 -->
<div class="app on" id="app">
  <!-- 헤더 -->
  <div class="hdr">
    <div class="hdr-logo">
      <div class="hdr-mark">HHC</div>
      <div><div class="hdr-name">일정 캘린더</div><div class="hdr-sub">Happy Home Care</div></div>
    </div>
    <div class="hdr-right">
      <div class="view-toggle">
        <button class="view-btn on" id="vbtn-month" onclick="setView('month')">月</button>
        <button class="view-btn" id="vbtn-week" onclick="setView('week')">週</button>
      </div>
      <div class="lang-toggle">
        <button class="lang-btn on" id="btn-ko" onclick="setLang('ko')">한국어</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" id="btn-ak" onclick="changeApiKey()" title="번역 API 키 변경">🔑</button>
      </div>
    </div>
  </div>

  <!-- 월/주 네비 -->
  <div class="nav-bar">
    <button class="nav-btn" onclick="prevPeriod()">‹</button>
    <div class="nav-center">
      <div class="nav-month" id="nav-month-lbl"></div>
      <button class="today-btn" id="today-btn" onclick="goToday()">오늘</button>
    </div>
    <button class="nav-btn" onclick="nextPeriod()">›</button>
  </div>

  <!-- 월 뷰 -->
  <div class="month-view" id="month-view">
    <div class="cal-wrap">
      <div class="cal-grid" id="cal-grid">
        <div class="day-name">일</div><div class="day-name">월</div><div class="day-name">화</div>
        <div class="day-name">수</div><div class="day-name">목</div><div class="day-name">금</div><div class="day-name">토</div>
      </div>
      <div class="legend-bar">
        <div class="leg"><div class="leg-dot" style="background:#CCF2EE"></div><span id="leg-b">예약확정</span></div>
        <div class="leg"><div class="leg-dot" style="background:var(--purple-lt)"></div><span id="leg-m">직접입력</span></div>
        <div class="leg"><div class="leg-dot" style="background:#FFE4E6"></div><span id="leg-h">휴일</span></div>
      </div>
    </div>
    <div class="day-panel" id="day-panel">
      <div class="day-hdr">
        <div><div class="day-hdr-date" id="day-hdr-date">날짜를 선택하세요</div><div class="day-hdr-cnt" id="day-hdr-cnt"></div></div>
        <div class="share-row" id="share-row" style="display:none">
          <button class="share-btn" style="background:#25D366;color:#fff" onclick="shareWA()">💬 WA</button>
          <button class="share-btn" style="background:#FEE500;color:#3A1D1D" onclick="shareKakao()">📋 카카오</button>
        </div>
      </div>
      <div id="day-content"><div class="empty-day"><div class="empty-ico">📅</div><div class="empty-txt">날짜를 선택하세요</div></div></div>
    </div>
  </div>

  <!-- 주 뷰 -->
  <div class="week-view" id="week-view">
    <div class="week-hdr" id="week-hdr">
      <div class="week-hdr-empty"></div>
    </div>
    <div class="week-body">
      <div class="week-grid" id="week-grid"></div>
    </div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" style="display:flex" onclick="openModal()">＋</button>

<!-- 입력 모달 -->
<div class="modal-ov" id="modal-ov" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-ttl" id="modal-ttl">일정 추가</div>
    <div class="modal-sub" id="modal-sub"></div>
    <div class="field">
      <div class="flbl">종류</div>
      <div class="type-grid">
        <div class="type-btn on" data-type="booking" onclick="setType(this)">🔧 방문</div>
        <div class="type-btn" data-type="manual" onclick="setType(this)">📋 내부</div>
        <div class="type-btn" data-type="holiday" onclick="setType(this)">🚫 휴일</div>
      </div>
    </div>
    <div class="field"><div class="flbl">제목</div><input id="f-title" type="text" placeholder="예: 김민준 에어컨 청소"></div>
    <div class="t2">
      <div class="field"><div class="flbl">시작</div><input id="f-ts" type="time" value="09:00"></div>
      <div class="field"><div class="flbl">종료</div><input id="f-te" type="time"></div>
    </div>
    <div class="field"><div class="flbl">메모 (콘도명·품목·추가요청)</div><textarea id="f-memo" placeholder="Seni A-16-05&#10;에어컨 3대 · 필터 교체 요청"></textarea></div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save-m" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<div class="loading" id="loading"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getFirestore,collection,doc,addDoc,updateDoc,deleteDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FIREBASE_CFG={
  apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",
  authDomain:"happywork-packageplan.firebaseapp.com",
  projectId:"happywork-packageplan",
  storageBucket:"happywork-packageplan.firebasestorage.app",
  messagingSenderId:"101289103022",
  appId:"1:101289103022:web:d81aca7f3747dd26df673f"
};

let db=null;
let schedules={};  // Firestore schedules
let bookings={};   // confirmed bookings
let translCache={};// 번역 캐시

let curY=new Date().getFullYear(),curM=new Date().getMonth();
let weekStart=getWeekStart(new Date());
let selDate='';
let curLang='ko';
let curView='month';
let curType='booking';

// ── 로그인
// 로그인 없이 바로 시작
if(!localStorage.getItem('hhc_ak')){
  const ak=prompt('번역 API 키를 입력하세요 (건너뛰면 번역 기능 비활성화):','');
  if(ak&&ak.trim()){localStorage.setItem('hhc_ak',ak.trim());}
}

window.changeApiKey=function(){
  const cur=localStorage.getItem('hhc_ak')||'';
  const masked=cur?cur.slice(0,10)+'···'+cur.slice(-4):'(설정 안 됨)';
  const ak=prompt('번역 API 키 변경\n현재 키: '+masked+'\n\n새 키를 입력하세요 (비워두고 확인하면 삭제):',cur);
  if(ak===null)return;
  if(ak.trim()){
    localStorage.setItem('hhc_ak',ak.trim());
    showToast('✓ API 키가 저장되었습니다');
  }else{
    localStorage.removeItem('hhc_ak');
    showToast('API 키가 삭제되었습니다');
  }
};

async function initApp(){
  showLoading(true);
  try{
    const app=initializeApp(FIREBASE_CFG);
    db=getFirestore(app);

    onSnapshot(collection(db,'schedules'),snap=>{
      schedules={};
      snap.docs.forEach(d=>{
        const dat=Object.assign({},d.data(),{_id:d.id,source:'manual'});
        if(!schedules[dat.date])schedules[dat.date]=[];
        schedules[dat.date].push(dat);
      });
      sortAll(schedules);
      refresh();
    });

    onSnapshot(collection(db,'bookings'),snap=>{
      bookings={};
      snap.docs.forEach(d=>{
        const b=Object.assign({},d.data(),{_id:d.id});
        if(b.status!=='confirmed'||!b.booking_date)return;
        if(!bookings[b.booking_date])bookings[b.booking_date]=[];
        bookings[b.booking_date].push({
          _id:'bk_'+b._id,source:'booking',
          date:b.booking_date,
          title:b.customer_name||b.customer_address||(curLang==='en'?'Booking':'예약'),
          time_s:b.booking_time?b.booking_time.replace(/[^0-9:]/g,'').slice(0,5):'',
          time_e:'',type:'booking',
          memo:[
            b.booking_items?'🔧 '+b.booking_items:'',
            b.booking_memo?'📝 '+b.booking_memo:''
          ].filter(Boolean).join('\n'),
        });
      });
      sortAll(bookings);
      refresh();
    });

    showLoading(false);
    const t=new Date();
    selDate=fmt(t);
    renderNav();renderCal();renderDay(selDate);
  }catch(e){showLoading(false);alert('Firebase 오류: '+e.message);}
}

function sortAll(map){Object.keys(map).forEach(dt=>{map[dt].sort((a,b)=>(a.time_s||'').localeCompare(b.time_s||''));});}
function getMerged(ds){return [...(bookings[ds]||[]),...(schedules[ds]||[])].sort((a,b)=>(a.time_s||'').localeCompare(b.time_s||''));}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function getWeekStart(d){const day=d.getDay();const s=new Date(d);s.setDate(d.getDate()-day);return s;}

function refresh(){
  renderNav();
  if(curView==='month'){renderCal();if(selDate)renderDay(selDate);}
  else{renderWeek();}
}

// ── 네비
function renderNav(){

window.prevPeriod=function(){

  else{weekStart.setDate(weekStart.getDate()-7);}
  refresh();
};
window.nextPeriod=function(){
  if(curView==='month'){if(curM===11){curY++;curM=0;}else curM++;}
  else{weekStart.setDate(weekStart.getDate()+7);}
  refresh();
};
window.goToday=function(){
  const t=new Date();curY=t.getFullYear();curM=t.getMonth();weekStart=getWeekStart(t);
  selDate=fmt(t);refresh();renderDay(selDate);

};

// ── 월 뷰 캘린더
function renderCal(){
  const grid=document.getElementById('cal-grid');
  const hdrs=Array.from(grid.querySelectorAll('.day-name'));
  grid.innerHTML='';hdrs.forEach(h=>grid.appendChild(h));

  const today=new Date();
  const first=new Date(curY,curM,1).getDay();
  const last=new Date(curY,curM+1,0).getDate();
  const prevLast=new Date(curY,curM,0).getDate();

  for(let i=0;i<first;i++){
    const d=document.createElement('div');d.className='cal-day other-m';
    const dn=document.createElement('div');dn.className='day-num';dn.textContent=prevLast-first+1+i;
    d.appendChild(dn);grid.appendChild(d);
  }
  for(let d2=1;d2<=last;d2++){
    const ds=curY+'-'+String(curM+1).padStart(2,'0')+'-'+String(d2).padStart(2,'0');
    const dow=(first+d2-1)%7;
    const cell=document.createElement('div');
    let cls='cal-day';
    if(dow===0)cls+=' sun';if(dow===6)cls+=' sat';
    if(today.getFullYear()===curY&&today.getMonth()===curM&&today.getDate()===d2)cls+=' today';
    if(selDate===ds)cls+=' sel';
    cell.className=cls;
    cell.onclick=(function(s){return function(){
      selDate=s;renderCal();renderDay(s);
      document.getElementById('day-panel').scrollTop=0;
    };})(ds);
    const dn=document.createElement('div');dn.className='day-num';dn.textContent=d2;cell.appendChild(dn);
    const list=getMerged(ds);
    if(list.length){
      const dots=document.createElement('div');dots.className='day-dots';
      list.slice(0,8).forEach(s=>{
        const dot=document.createElement('span');
        dot.className='day-dot dot-'+(s.type==='booking'?'b':s.type==='holiday'?'h':s.type==='google'?'gg':'m');
        dots.appendChild(dot);
      });
      cell.appendChild(dots);
      const cnt=document.createElement('div');cnt.className='day-cnt';
      cnt.textContent=curLang==='en'?list.length+(list.length>1?' items':' item'):list.length+'건';
      cell.appendChild(cnt);
    }
    grid.appendChild(cell);
  }
  const rem=(7-((first+last)%7))%7;
  for(let j=1;j<=rem;j++){
    const dc=document.createElement('div');dc.className='cal-day other-m';
    const dn=document.createElement('div');dn.className='day-num';dn.textContent=j;
    dc.appendChild(dn);grid.appendChild(dc);
  }
}

// ── 주 뷰
function renderWeek(){
  const HOURS=24;
  const SLOT_H=52;
  const DAY_NAMES_KO=['일','월','화','수','목','금','토'];
  const DAY_NAMES_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today=new Date();
  const todayStr=fmt(today);

  // 헤더
  const hdr=document.getElementById('week-hdr');
  hdr.innerHTML='<div class="week-hdr-empty"></div>';
  for(let i=0;i<7;i++){
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
    const ds=fmt(d);
    const col=document.createElement('div');col.className='week-day-hdr';
    col.onclick=(function(s){return function(){selDate=s;setView('month');curY=new Date(s).getFullYear();curM=new Date(s).getMonth();renderCal();renderDay(s);};})(ds);
    const dn=document.createElement('div');dn.className='week-day-name';dn.textContent=curLang==='en'?DAY_NAMES_EN[d.getDay()]:DAY_NAMES_KO[d.getDay()];
    const dd=document.createElement('div');dd.className='week-day-num'+(ds===todayStr?' today':'')+(ds===selDate?' sel':'');dd.textContent=d.getDate();
    col.appendChild(dn);col.appendChild(dd);hdr.appendChild(col);
  }

  // 그리드
  const grid=document.getElementById('week-grid');grid.innerHTML='';
  // 시간 컬럼
  const timeCol=document.createElement('div');timeCol.className='time-col';
  for(let h=0;h<HOURS;h++){
    const slot=document.createElement('div');slot.className='time-slot';
    if(h>0){const lbl=document.createElement('div');lbl.className='time-lbl';lbl.textContent=String(h).padStart(2,'0')+':00';slot.appendChild(lbl);}
    timeCol.appendChild(slot);
  }
  grid.appendChild(timeCol);

  // 요일 컬럼
  for(let i=0;i<7;i++){
    const d=new Date(weekStart);d.setDate(weekStart.getDate()+i);
    const ds=fmt(d);
    const col=document.createElement('div');col.className='week-col';col.style.position='relative';
    // 셀
    for(let h=0;h<HOURS;h++){
      const cell=document.createElement('div');cell.className='week-cell';
      cell.onclick=(function(s,hr){return function(){
        selDate=s;openModal();
        document.getElementById('f-ts').value=String(hr).padStart(2,'0')+':00';
      };})(ds,h);
      col.appendChild(cell);
    }
    // 현재 시간 선
    if(ds===todayStr){
      const now=new Date();
      const pct=(now.getHours()*60+now.getMinutes())/(HOURS*60);
      const line=document.createElement('div');line.className='week-now-line';line.style.top=(pct*HOURS*SLOT_H)+'px';
      const dot=document.createElement('div');dot.className='week-now-dot';line.appendChild(dot);col.appendChild(line);
    }
    // 이벤트 배치
    const list=getMerged(ds);
    list.forEach(s=>{
      if(!s.time_s)return;
      const [sh,sm]=(s.time_s||'00:00').split(':').map(Number);
      const [eh,em]=(s.time_e||String(sh+1).padStart(2,'0')+':00').split(':').map(Number);
      const top=(sh*60+sm)/(HOURS*60)*HOURS*SLOT_H;
      const height=Math.max(((eh*60+em)-(sh*60+sm))/(HOURS*60)*HOURS*SLOT_H,28);
      const ev=document.createElement('div');
      ev.className='week-event type-'+(s.type==='booking'?'b':s.type==='holiday'?'h':s.type==='google'?'gg':'m');
      ev.style.cssText=`top:${top}px;height:${height}px`;
      ev.textContent=s.time_s.slice(0,5)+' '+s.title;
      ev.onclick=e=>{e.stopPropagation();selDate=ds;setView('month');curY=d.getFullYear();curM=d.getMonth();renderCal();renderDay(ds);};
      col.appendChild(ev);
    });
    grid.appendChild(col);
  }
  // 현재 시간으로 스크롤
  const now=new Date();
  const scrollY=Math.max((now.getHours()-2)*SLOT_H,0);
  setTimeout(()=>{const wb=document.querySelector('.week-body');if(wb)wb.scrollTop=scrollY;},50);
}

// ── 번역 함수
async function translateText(text){
  if(!text||curLang==='ko')return text;
  if(translCache[text])return translCache[text];
  const key=localStorage.getItem('hhc_ak')||'';
  if(!key){return text;}
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:800,
        messages:[{role:'user',content:'Translate the following text to English. Return ONLY the translated text, nothing else. Keep emojis, symbols and line breaks exactly as they are:\n\n'+text}]
      })
    });
    const data=await res.json();
    if(data.error){console.warn('Translation error:',data.error.message);return text;}
    const translated=data.content?.[0]?.text||text;
    translCache[text]=translated;
    return translated;
  }catch(e){console.warn('Translation failed:',e);return text;}
}

// 번역 일괄 처리 — 여러 필드를 한 번에
async function translateItem(s){
  if(curLang==='ko')return s;
  const key=localStorage.getItem('hhc_ak')||'';
  if(!key)return s;
  try{
    // 제목과 메모를 구분자로 묶어 한 번에 번역 (API 호출 최소화)
    const combined='[TITLE]'+s.title+'[/TITLE]'+(s.memo?'[MEMO]'+s.memo+'[/MEMO]':'');
    const cacheKey='item:'+combined;
    if(translCache[cacheKey]){
      const cached=translCache[cacheKey];
      return Object.assign({},s,{title:cached.title,memo:cached.memo});
    }
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':key,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-6',max_tokens:800,
        messages:[{role:'user',content:'Translate the following Korean schedule data to English. Keep emojis, symbols (📍📞🔧📝), and line breaks exactly. Return in exact same format with [TITLE] and [MEMO] tags:\n\n'+combined}]
      })
    });
    const data=await res.json();
    if(data.error){console.warn('Translation error:',data.error.message);return s;}
    const result=data.content?.[0]?.text||combined;
    const titleMatch=result.match(/\[TITLE\]([\s\S]*?)\[\/TITLE\]/);
    const memoMatch=result.match(/\[MEMO\]([\s\S]*?)\[\/MEMO\]/);
    const translTitle=titleMatch?titleMatch[1].trim():s.title;
    const translMemo=memoMatch?memoMatch[1].trim():s.memo;
    translCache[cacheKey]={title:translTitle,memo:translMemo};
    return Object.assign({},s,{title:translTitle,memo:translMemo});
  }catch(e){console.warn('Translation failed:',e);return s;}
}

// ── 일정 패널
async function renderDay(ds){
  const parts=ds.split('-');
  const days_ko=['일','월','화','수','목','금','토'];
  const days_en=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months_en=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dow=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2])).getDay();
  const dateStr=curLang==='en'
    ?(days_en[dow]+', '+months_en[parseInt(parts[1])-1]+' '+parseInt(parts[2])+', '+parts[0])
    :(parts[0]+'년 '+parseInt(parts[1])+'월 '+parseInt(parts[2])+'일 ('+days_ko[dow]+')');
  document.getElementById('day-hdr-date').textContent=dateStr;
  document.getElementById('modal-sub').textContent=dateStr;
  const list=getMerged(ds);
  document.getElementById('day-hdr-cnt').textContent=curLang==='en'?list.length+' schedule(s)':'일정 '+list.length+'개';
  document.getElementById('share-row').style.display=list.length?'flex':'none';

  const content=document.getElementById('day-content');
  if(!list.length){
    content.innerHTML='<div class="empty-day"><div class="empty-ico">📅</div><div class="empty-txt">'+(curLang==='en'?'No schedules':'일정이 없습니다.')+'</div><div class="empty-sub">'+(curLang==='en'?'Tap + to add':'+ 버튼으로 추가')+'</div></div>';
    return;
  }

  // 번역 처리
  // 번역 (한 번에 처리)
  const displayList=await Promise.all(list.map(s=>translateItem(s)));

  let html='<div class="sch-list">';
  list.forEach((s,idx)=>{
    const ds2=displayList[idx];
    const barColor=s.type==='booking'?'#0BB5A4':s.type==='holiday'?'#DC2626':s.type==='google'?'#4285F4':'#8B5CF6';
    const typeBg=s.type==='booking'?'background:#CCF2EE;color:#085048':s.type==='holiday'?'background:#FFE4E6;color:#9F1239':s.type==='google'?'background:#E8F0FE;color:#1A56DB':'background:#EDE9FE;color:#5B21B6';
    const typeLabel=curLang==='en'?(s.type==='booking'?'Confirmed':s.type==='holiday'?'Holiday':s.type==='google'?'Google':'Internal'):(s.type==='booking'?'예약확정':s.type==='holiday'?'휴일':s.type==='google'?'구글 캘린더':'직접입력');
    const isAuto=s.source==='booking';
    html+=`<div class="sch-item">
      <div class="sch-bar" style="background:${barColor}"></div>
      <div class="sch-time-col"><div class="sch-ts">${s.time_s||'—'}</div>${s.time_e?`<div class="sch-te">~${s.time_e}</div>`:''}</div>
      <div class="sch-body">
        <div class="sch-type" style="${typeBg}">${typeLabel}</div>
        <div class="sch-ttl${isAuto?' sch-ttl-condo':''}">${ds2.title}</div>
        ${ds2.memo?`<div class="sch-sub">${ds2.memo.replace(/\n/g,'<br>')}</div>`:''}
        ${isAuto?`<div class="sch-auto">📋 ${curLang==='en'?'Auto from booking':'예약시스템 자동반영'}</div>`:''}
      </div>
      ${!isAuto?`<button class="sch-edit" onclick="editItem('${s._id}')">✏️</button><button class="sch-del" onclick="deleteItem('${s._id}')">×</button>`:''}
    </div>`;
  });
  html+='</div>';

  // 공유 메시지 (번역 포함)
  const msg=buildMsg(ds,displayList,dateStr);
  html+=`<div class="msg-section">
    <div class="msg-hdr">${curLang==='en'?'Share Message':'공유 메시지'}</div>
    <div class="msg-body" id="msg-body">${msg}</div>
    <div class="msg-btns">
      <button class="msg-btn" style="background:#25D366;color:#fff" onclick="shareWA()">💬 WhatsApp</button>
      <button class="msg-btn" style="background:#FEE500;color:#3A1D1D" onclick="shareKakao()">📋 ${curLang==='en'?'Copy':'카카오 복사'}</button>
    </div>
    <div id="copy-ok" class="copy-ok">${curLang==='en'?'✓ Copied!':'✓ 복사됨!'}</div>
  </div>
  <div style="padding:8px 14px 4px">
    <button onclick="openModal()" style="width:100%;padding:10px;border:1.5px dashed var(--teal);border-radius:10px;background:var(--teal-lt);color:var(--teal-dk);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">
      ${curLang==='en'?'+ Add Schedule':'+ 일정 추가'}
    </button>
  </div>`;
  content.innerHTML=html;
}

function buildMsg(ds,list,dateStr){
  const lines=['📅 '+dateStr+' '+(curLang==='en'?'Schedule':'일정')+'\n'];
  list.forEach(s=>{
    const tStr=s.time_s?(s.time_e?s.time_s+' ~ '+s.time_e:s.time_s):'';
    lines.push('⏰ '+(tStr?tStr+'  ':'')+s.title);
    if(s.memo){s.memo.split('\n').forEach(m=>{if(m.trim())lines.push(m.trim());});}
    lines.push('');
  });
  lines.push('──────────────');
  lines.push(curLang==='en'?`${list.length} schedule(s) · Happy Home Care · +60 17-247 2774`:`총 ${list.length}건 · Happy Home Care · 📞 +60 17-247 2774`);
  return lines.join('\n');
}

// ── 언어
window.setLang=async function(lang){
  curLang=lang;translCache={};
  // 번역 테스트
  if(lang==='en'){
    const key=localStorage.getItem('hhc_ak')||'';
    if(!key){
      alert('API 키가 없습니다. 페이지를 새로고침 후 다시 로그인하세요.');
      return;
    }
    try{
      showLoading(true);
      const testRes=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'x-api-key':key,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'
        },
        body:JSON.stringify({
          model:'claude-sonnet-4-6',max_tokens:50,
          messages:[{role:'user',content:'Say "OK" in English only.'}]
        })
      });
      const testData=await testRes.json();
      showLoading(false);
      if(testData.error){
        alert('번역 API 오류: '+testData.error.message+'\n\nAPI 키를 확인하세요.');
        curLang='ko';
        document.getElementById('btn-ko').className='lang-btn on';
        document.getElementById('btn-en').className='lang-btn';
        return;
      }
      showToast('✓ 번역 API 연결됨');
    }catch(e){
      showLoading(false);
      alert('번역 API 연결 실패: '+e.message);
      curLang='ko';
      document.getElementById('btn-ko').className='lang-btn on';
      document.getElementById('btn-en').className='lang-btn';
      return;
    }
  }
  document.getElementById('btn-ko').className='lang-btn'+(lang==='ko'?' on':'');
  document.getElementById('btn-en').className='lang-btn'+(lang==='en'?' on':'');
  document.getElementById('leg-b').textContent=lang==='en'?'Confirmed':'예약확정';
  document.getElementById('leg-m').textContent=lang==='en'?'Internal':'직접입력';
  document.getElementById('leg-h').textContent=lang==='en'?'Holiday':'휴일';
  refresh();if(selDate)renderDay(selDate);
};

// ── 유틸
function showLoading(v){document.getElementById('loading').classList.toggle('on',v);}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000);}

// 초기 실행
initApp();
renderNav();
</script>
</body>
</html>
