<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1833">
<title>일정 캘린더 — Happy Home Care</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --navy:#0B1833;--teal:#0BB5A4;--teal-lt:#E0F9F5;--teal-dk:#085048;
  --g:#F2F5FB;--w:#fff;--ln:#E8EDF6;
  --tx:#1A2035;--tx2:#5C6478;--tx3:#9AA0B0;
  --ok:#059669;--okbg:#ECFDF5;
  --bd:#DC2626;--bdbg:#FEF2F2;
  --purple:#8B5CF6;--purple-lt:#EDE9FE;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--g);color:var(--tx);display:flex;flex-direction:column}

/* ── 로그인 화면 ── */
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:32px;gap:20px}
.login-logo{width:64px;height:64px;background:var(--navy);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;color:var(--teal);margin-bottom:4px}
.login-ttl{font-size:20px;font-weight:700;color:var(--navy);text-align:center}
.login-sub{font-size:12px;color:var(--tx3);text-align:center}
.login-input{width:100%;padding:13px 16px;border:0.5px solid var(--ln);border-radius:12px;font-size:16px;font-family:inherit;background:var(--w);color:var(--tx);text-align:center;letter-spacing:.2em}
.login-btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--navy);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.login-err{font-size:12px;color:var(--bd);text-align:center;display:none}

/* ── 앱 화면 ── */
.app-screen{display:none;flex-direction:column;height:100%}
.app-screen.on{display:flex}

/* 상단 헤더 */
.top-hdr{background:var(--navy);color:#fff;padding:calc(10px + var(--safe-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.top-logo{display:flex;align-items:center;gap:8px}
.top-logo-mark{width:30px;height:30px;background:var(--teal);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.top-logo-name{font-size:13px;font-weight:600;color:#fff}
.top-logo-sub{font-size:9px;color:rgba(255,255,255,.45)}
.lang-toggle{display:flex;background:rgba(255,255,255,.1);border-radius:20px;padding:2px}
.lang-btn{padding:4px 10px;border-radius:16px;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:rgba(255,255,255,.5)}
.lang-btn.on{background:#fff;color:var(--navy)}

/* 월 네비 */
.cal-nav-bar{background:var(--w);border-bottom:0.5px solid var(--ln);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.cal-nav-btn{width:34px;height:34px;border-radius:50%;border:0.5px solid var(--ln);background:var(--g);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.cal-nav-btn:active{background:var(--teal-lt)}
.cal-month-lbl{font-size:16px;font-weight:700;color:var(--navy)}
.today-btn{padding:5px 12px;border-radius:20px;border:0.5px solid var(--teal);background:var(--teal-lt);color:var(--teal-dk);font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}

/* 캘린더 */
.cal-wrap{background:var(--w);border-bottom:0.5px solid var(--ln);flex-shrink:0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:0.5px;background:var(--ln)}
.cal-day-name{padding:6px 0;text-align:center;font-size:10px;font-weight:600;color:var(--tx3);background:var(--g)}
.cal-day-name:first-child{color:#DC2626}
.cal-day-name:last-child{color:#3B5BDB}
.cal-day{min-height:64px;background:var(--w);cursor:pointer;display:flex;flex-direction:column;padding:4px 3px 3px;gap:1px;position:relative}
.cal-day:active{background:var(--teal-lt)}
.cal-day.today .cal-dn{background:var(--teal);color:#fff;border-radius:50%;font-weight:700}
.cal-day.sel{background:var(--teal-lt)}
.cal-day.sel::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--teal)}
.cal-day.other-m{background:#FAFAFA}
.cal-day.other-m .cal-dn{color:#C8D0E0}
.cal-day.sun .cal-dn{color:#DC2626}
.cal-day.sat .cal-dn{color:#3B5BDB}
.cal-dn{width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;margin-bottom:1px;flex-shrink:0}
.cal-chip{border-radius:3px;padding:1px 4px;font-size:8.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.5}
.chip-booking{background:#CCF2EE;color:#085048}
.chip-manual{background:var(--purple-lt);color:#5B21B6}
.chip-holiday{background:#FFE4E6;color:#9F1239}
.cal-more{font-size:8px;color:var(--tx3);padding:0 3px}

/* 범례 */
.legend{display:flex;gap:12px;flex-wrap:wrap;padding:7px 14px;border-top:0.5px solid var(--ln);font-size:10px;color:var(--tx2)}
.leg-item{display:flex;align-items:center;gap:4px}
.leg-dot{width:8px;height:8px;border-radius:2px}

/* 일정 패널 */
.day-panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(80px + var(--safe-bot))}
.day-hdr{position:sticky;top:0;z-index:10;background:var(--g);padding:10px 16px 6px;border-bottom:0.5px solid var(--ln);display:flex;align-items:center;justify-content:space-between}
.day-hdr-left{}
.day-hdr-date{font-size:15px;font-weight:700;color:var(--navy)}
.day-hdr-cnt{font-size:11px;color:var(--tx3);margin-top:1px}
.share-row{display:flex;gap:6px}
.share-btn{padding:6px 11px;border-radius:20px;border:none;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-wa{background:#25D366;color:#fff}
.btn-kk{background:#FEE500;color:#3A1D1D}

/* 일정 아이템 */
.sch-list{padding:4px 0}
.sch-item{display:flex;gap:10px;padding:11px 16px;border-bottom:0.5px solid var(--ln);align-items:flex-start;background:var(--w)}
.sch-item:last-child{border-bottom:none}
.sch-bar{width:3px;border-radius:2px;align-self:stretch;min-height:32px;flex-shrink:0}
.sch-time-col{width:52px;flex-shrink:0;display:flex;flex-direction:column;gap:2px;padding-top:2px}
.sch-time-s{font-size:11px;font-weight:600;color:var(--tx)}
.sch-time-e{font-size:10px;color:var(--tx3)}
.sch-body{flex:1;min-width:0}
.sch-type-lbl{display:inline-flex;padding:1px 7px;border-radius:8px;font-size:9px;font-weight:700;margin-bottom:3px}
.sch-ttl{font-size:13px;font-weight:500;color:var(--tx);margin-bottom:3px;line-height:1.4}
.sch-sub{font-size:11px;color:var(--tx2);line-height:1.65}
.sch-del{width:28px;height:28px;border-radius:50%;border:none;background:var(--bdbg);color:var(--bd);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.sch-booking-badge{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:600;background:var(--g);color:var(--tx3);margin-top:3px}

/* 빈 날짜 */
.empty-day{padding:36px 16px;text-align:center;color:var(--tx3)}
.empty-day-ico{font-size:40px;margin-bottom:12px}
.empty-day-txt{font-size:14px;font-weight:500;margin-bottom:4px;color:var(--tx2)}
.empty-day-sub{font-size:12px}

/* 공유 메시지 */
.msg-section{margin:10px 12px;background:var(--w);border:0.5px solid var(--ln);border-radius:12px;overflow:hidden}
.msg-hdr{padding:9px 14px;border-bottom:0.5px solid var(--ln);font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em}
.msg-box{padding:10px 14px;font-size:11px;color:var(--tx2);line-height:1.9;white-space:pre-wrap;font-family:inherit;max-height:180px;overflow-y:auto;background:var(--g)}
.msg-btns{display:flex;gap:8px;padding:10px 14px;border-top:0.5px solid var(--ln)}
.msg-btn{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.copy-ok{display:none;text-align:center;padding:8px;background:var(--okbg);color:var(--ok);font-size:11px;font-weight:600}

/* FAB */
.fab{position:fixed;bottom:calc(20px + var(--safe-bot));right:18px;width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(11,181,164,.4);display:flex;align-items:center;justify-content:center;z-index:100}
.fab:active{transform:scale(.92)}

/* 입력 모달 */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal-ov.open{display:flex}
.modal-sheet{background:var(--w);border-radius:20px 20px 0 0;padding:16px 16px calc(20px + var(--safe-bot));width:100%;max-height:92vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:var(--ln);border-radius:2px;margin:0 auto 14px}
.modal-ttl{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:3px}
.modal-date-sub{font-size:12px;color:var(--tx3);margin-bottom:16px}
.field{margin-bottom:13px}
.field-lbl{font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:12px 13px;border:0.5px solid var(--ln);border-radius:10px;font-size:14px;font-family:inherit;color:var(--tx);background:var(--g);-webkit-appearance:none}
.field textarea{resize:none;height:90px}
.type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.type-btn{padding:10px 6px;border-radius:9px;border:1.5px solid var(--ln);font-size:12px;font-weight:600;cursor:pointer;text-align:center;background:var(--g);color:var(--tx2);font-family:inherit}
.type-btn.on{border-color:var(--teal);background:var(--teal-lt);color:var(--teal-dk)}
.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal-btns{display:flex;gap:8px;margin-top:6px}
.btn-cancel{flex:1;padding:14px;border:0.5px solid var(--ln);border-radius:10px;background:transparent;color:var(--tx2);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-save-modal{flex:2;padding:14px;border:none;border-radius:10px;background:var(--navy);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

/* 로딩 */
.loading{position:fixed;inset:0;background:rgba(255,255,255,.7);z-index:300;display:none;align-items:center;justify-content:center}
.loading.on{display:flex}
.spinner{width:36px;height:36px;border:3px solid var(--ln);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 토스트 */
.toast{position:fixed;bottom:calc(90px + var(--safe-bot));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:20px;font-size:12px;font-weight:500;z-index:400;display:none;white-space:nowrap}
.toast.on{display:block}
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login-screen" id="login-screen">
  <div class="login-logo">HHC</div>
  <div class="login-ttl">일정 캘린더</div>
  <div class="login-sub">Happy Home Care · Schedule</div>
  <input type="password" class="login-input" id="login-pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="login-btn" onclick="doLogin()">로그인</button>
  <div class="login-err" id="login-err">비밀번호가 올바르지 않습니다</div>
</div>

<!-- 앱 -->
<div class="app-screen" id="app-screen">
  <!-- 헤더 -->
  <div class="top-hdr">
    <div class="top-logo">
      <div class="top-logo-mark">HHC</div>
      <div>
        <div class="top-logo-name">일정 캘린더</div>
        <div class="top-logo-sub">Happy Home Care</div>
      </div>
    </div>
    <div class="lang-toggle">
      <button class="lang-btn on" id="btn-ko" onclick="setLang('ko')">한국어</button>
      <button class="lang-btn" id="btn-en" onclick="setLang('en')">English</button>
    </div>
  </div>

  <!-- 월 네비 -->
  <div class="cal-nav-bar">
    <button class="cal-nav-btn" onclick="prevMonth()">‹</button>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="cal-month-lbl" id="cal-month-lbl"></div>
      <button class="today-btn" id="today-btn" onclick="goToday()">오늘</button>
    </div>
    <button class="cal-nav-btn" onclick="nextMonth()">›</button>
  </div>

  <!-- 캘린더 -->
  <div class="cal-wrap">
    <div class="cal-grid" id="cal-grid">
      <div class="cal-day-name">일</div><div class="cal-day-name">월</div>
      <div class="cal-day-name">화</div><div class="cal-day-name">수</div>
      <div class="cal-day-name">목</div><div class="cal-day-name">금</div>
      <div class="cal-day-name">토</div>
    </div>
    <div class="legend">
      <div class="leg-item"><div class="leg-dot" style="background:#CCF2EE"></div><span id="leg-booking">예약확정</span></div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--purple-lt)"></div><span id="leg-manual">직접입력</span></div>
      <div class="leg-item"><div class="leg-dot" style="background:#FFE4E6"></div><span id="leg-holiday">휴일</span></div>
    </div>
  </div>

  <!-- 일정 패널 -->
  <div class="day-panel" id="day-panel">
    <div class="day-hdr">
      <div class="day-hdr-left">
        <div class="day-hdr-date" id="day-hdr-date">날짜를 선택하세요</div>
        <div class="day-hdr-cnt" id="day-hdr-cnt"></div>
      </div>
      <div class="share-row" id="share-row" style="display:none">
        <button class="share-btn btn-wa" onclick="shareWA()">💬 WA</button>
        <button class="share-btn btn-kk" onclick="shareKakao()">📋 카카오</button>
      </div>
    </div>
    <div id="day-content">
      <div class="empty-day">
        <div class="empty-day-ico">📅</div>
        <div class="empty-day-txt">날짜를 선택하세요</div>
      </div>
    </div>
  </div>
</div>

<!-- FAB -->
<button class="fab" id="fab" style="display:none" onclick="openModal()">＋</button>

<!-- 입력 모달 -->
<div class="modal-ov" id="modal-ov" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-ttl" id="modal-ttl">일정 추가</div>
    <div class="modal-date-sub" id="modal-date-sub"></div>
    <div class="field">
      <div class="field-lbl" id="lbl-type">종류</div>
      <div class="type-grid">
        <div class="type-btn on" data-type="booking" onclick="setType(this)">🔧 방문</div>
        <div class="type-btn" data-type="manual" onclick="setType(this)">📋 내부</div>
        <div class="type-btn" data-type="holiday" onclick="setType(this)">🚫 휴일</div>
      </div>
    </div>
    <div class="field">
      <div class="field-lbl" id="lbl-title">제목</div>
      <input id="f-title" type="text" placeholder="예: 김민준 에어컨 청소" onkeydown="if(event.key==='Enter')document.getElementById('f-memo').focus()">
    </div>
    <div class="time-grid">
      <div class="field"><div class="field-lbl" id="lbl-start">시작 시간</div><input id="f-time-s" type="time" value="09:00"></div>
      <div class="field"><div class="field-lbl" id="lbl-end">종료 시간</div><input id="f-time-e" type="time" value="13:00"></div>
    </div>
    <div class="field">
      <div class="field-lbl" id="lbl-memo">메모</div>
      <textarea id="f-memo" placeholder="주소 · 연락처 · 품목 등"></textarea>
    </div>
    <div class="modal-btns">
      <button class="btn-cancel" id="btn-cancel" onclick="closeModal()">취소</button>
      <button class="btn-save-modal" id="btn-save-modal" onclick="saveItem()">저장</button>
    </div>
  </div>
</div>

<!-- 로딩 -->
<div class="loading" id="loading"><div class="spinner"></div></div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getFirestore,collection,doc,addDoc,deleteDoc,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FIREBASE_CFG={
  apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",
  authDomain:"happywork-packageplan.firebaseapp.com",
  projectId:"happywork-packageplan",
  storageBucket:"happywork-packageplan.firebasestorage.app",
  messagingSenderId:"101289103022",
  appId:"1:101289103022:web:d81aca7f3747dd26df673f"
};
const PW='hhc2024';  // 비밀번호 (원하시면 변경)

let db=null;
let schedules={};   // {date:[{_id,title,time_s,time_e,type,memo,source}]}
let bookings={};    // confirmed bookings by date
let curY=new Date().getFullYear(),curM=new Date().getMonth();
let selDate='';
let curLang='ko';
let curType='booking';

// ── 로그인
function doLogin(){
  const pw=document.getElementById('login-pw').value;
  const err=document.getElementById('login-err');
  if(pw===PW){
    err.style.display='none';
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app-screen').classList.add('on');
    document.getElementById('fab').style.display='flex';
    initApp();
  } else {
    err.style.display='block';
  }
}
window.doLogin=doLogin;
document.getElementById('login-pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

async function initApp(){
  showLoading(true);
  try{
    const app=initializeApp(FIREBASE_CFG);
    db=getFirestore(app);
    // schedules 구독
    onSnapshot(collection(db,'schedules'),snap=>{
      schedules={};
      snap.docs.forEach(d=>{
        const dat=Object.assign({},d.data(),{_id:d.id,source:'manual'});
        if(!schedules[dat.date])schedules[dat.date]=[];
        schedules[dat.date].push(dat);
      });
      sortAll(schedules);
      renderCal();
      if(selDate)renderDay(selDate);
    });
    // bookings 구독 — confirmed만
    onSnapshot(collection(db,'bookings'),snap=>{
      bookings={};
      snap.docs.forEach(d=>{
        const b=Object.assign({},d.data(),{_id:d.id});
        if(b.status!=='confirmed'||!b.booking_date)return;
        if(!bookings[b.booking_date])bookings[b.booking_date]=[];
        bookings[b.booking_date].push({
          _id:'bk_'+b._id,
          source:'booking',
          booking_ref:b._id,
          date:b.booking_date,
          title:b.customer_name||(curLang==='en'?'Customer':'고객'),
          time_s:b.booking_time?b.booking_time.replace(/[^0-9:]/g,'').slice(0,5):'',
          time_e:'',
          type:'booking',
          memo:[
            b.customer_address?'📍 '+b.customer_address:'',
            b.customer_phone?'📞 '+b.customer_phone:'',
            b.booking_items?'🔧 '+b.booking_items:'',
            b.booking_memo?'📝 '+b.booking_memo:''
          ].filter(Boolean).join('\n'),
        });
      });
      sortAll(bookings);
      renderCal();
      if(selDate)renderDay(selDate);
    });
    showLoading(false);
    // 오늘 자동 선택
    const t=new Date();
    const todayDs=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
    selDate=todayDs;
    renderCal();
    renderDay(todayDs);
  }catch(e){
    showLoading(false);
    alert('Firebase 연결 실패: '+e.message);
  }
}

function sortAll(map){
  Object.keys(map).forEach(dt=>{
    map[dt].sort((a,b)=>(a.time_s||'').localeCompare(b.time_s||''));
  });
}

// ── 날짜별 통합 일정 (bookings + schedules 합치기)
function getMerged(ds){
  const bkList=(bookings[ds]||[]);
  const schList=(schedules[ds]||[]);
  const all=[...bkList,...schList];
  all.sort((a,b)=>(a.time_s||'').localeCompare(b.time_s||''));
  return all;
}

// ── 캘린더 렌더
function renderCal(){
  const months_ko=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const months_en=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const lbl=document.getElementById('cal-month-lbl');
  if(lbl)lbl.textContent=curLang==='en'?(months_en[curM]+' '+curY):(curY+'년 '+months_ko[curM]);

  const grid=document.getElementById('cal-grid');
  const headers=Array.from(grid.querySelectorAll('.cal-day-name'));
  grid.innerHTML='';
  headers.forEach(h=>grid.appendChild(h));

  const today=new Date();
  const first=new Date(curY,curM,1).getDay();
  const last=new Date(curY,curM+1,0).getDate();
  const prevLast=new Date(curY,curM,0).getDate();

  for(let i=0;i<first;i++){
    const d=document.createElement('div');d.className='cal-day other-m';
    const dn=document.createElement('div');dn.className='cal-dn';dn.textContent=prevLast-first+1+i;
    d.appendChild(dn);grid.appendChild(d);
  }
  for(let d2=1;d2<=last;d2++){
    const ds=curY+'-'+String(curM+1).padStart(2,'0')+'-'+String(d2).padStart(2,'0');
    const dow=(first+d2-1)%7;
    const cell=document.createElement('div');
    let cls='cal-day';
    if(dow===0)cls+=' sun';if(dow===6)cls+=' sat';
    if(today.getFullYear()===curY&&today.getMonth()===curM&&today.getDate()===d2)cls+=' today';
    if(selDate===ds)cls+=' sel';
    cell.className=cls;
    cell.onclick=(function(s){return function(){selDate=s;renderCal();renderDay(s);document.getElementById('day-panel').scrollTop=0;};})(ds);

    const dn2=document.createElement('div');dn2.className='cal-dn';dn2.textContent=d2;
    cell.appendChild(dn2);

    const list=getMerged(ds);
    list.slice(0,2).forEach(s=>{
      const chip=document.createElement('div');
      chip.className='cal-chip chip-'+(s.type==='booking'?'booking':s.type==='holiday'?'holiday':'manual');
      chip.textContent=(s.time_s?s.time_s.slice(0,5)+' ':'')+s.title;
      cell.appendChild(chip);
    });
    if(list.length>2){
      const more=document.createElement('div');more.className='cal-more';more.textContent='+'+(list.length-2)+(curLang==='en'?' more':'개');
      cell.appendChild(more);
    }
    grid.appendChild(cell);
  }
  const remain=(7-((first+last)%7))%7;
  for(let j=1;j<=remain;j++){
    const dc=document.createElement('div');dc.className='cal-day other-m';
    const dn3=document.createElement('div');dn3.className='cal-dn';dn3.textContent=j;
    dc.appendChild(dn3);grid.appendChild(dc);
  }
}

// ── 일정 패널 렌더
function renderDay(ds){
  const parts=ds.split('-');
  const days_ko=['일','월','화','수','목','금','토'];
  const days_en=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months_en=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dow=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2])).getDay();

  const dateStr=curLang==='en'
    ?(days_en[dow]+', '+months_en[parseInt(parts[1])-1]+' '+parseInt(parts[2])+', '+parts[0])
    :(parts[0]+'년 '+parseInt(parts[1])+'월 '+parseInt(parts[2])+'일 ('+days_ko[dow]+')');
  document.getElementById('day-hdr-date').textContent=dateStr;
  document.getElementById('modal-date-sub').textContent=dateStr;

  const list=getMerged(ds);
  document.getElementById('day-hdr-cnt').textContent=curLang==='en'?list.length+' schedule(s)':'일정 '+list.length+'개';
  document.getElementById('share-row').style.display=list.length?'flex':'none';

  const content=document.getElementById('day-content');
  if(!list.length){
    content.innerHTML='<div class="empty-day">'
      +'<div class="empty-day-ico">📅</div>'
      +'<div class="empty-day-txt">'+(curLang==='en'?'No schedules':'이 날짜의 일정이 없습니다.')+'</div>'
      +'<div class="empty-day-sub">'+(curLang==='en'?'Tap + to add a schedule':'+ 버튼으로 일정을 추가하세요')+'</div>'
      +'</div>';
    return;
  }

  let html='<div class="sch-list">';
  list.forEach(s=>{
    const barColor=s.type==='booking'?'#0BB5A4':s.type==='holiday'?'#DC2626':'#8B5CF6';
    const typeBg=s.type==='booking'?'background:#CCF2EE;color:#085048':s.type==='holiday'?'background:#FFE4E6;color:#9F1239':'background:#EDE9FE;color:#5B21B6';
    const typeLabel=curLang==='en'?(s.type==='booking'?'Confirmed':s.type==='holiday'?'Holiday':'Internal'):(s.type==='booking'?'예약확정':s.type==='holiday'?'휴일':'직접입력');
    const isBookingRef=s.source==='booking';
    const delBtn=isBookingRef?'':`<button class="sch-del" onclick="deleteItem('${s._id}')">×</button>`;
    html+=`<div class="sch-item">
      <div class="sch-bar" style="background:${barColor}"></div>
      <div class="sch-time-col">
        <div class="sch-time-s">${s.time_s||'—'}</div>
        ${s.time_e?`<div class="sch-time-e">~${s.time_e}</div>`:''}
      </div>
      <div class="sch-body">
        <div class="sch-type-lbl" style="${typeBg}">${typeLabel}</div>
        <div class="sch-ttl">${s.title}</div>
        ${s.memo?`<div class="sch-sub">${s.memo.replace(/\n/g,'<br>')}</div>`:''}
        ${isBookingRef?`<div class="sch-booking-badge">📋 ${curLang==='en'?'From booking system':'예약시스템 자동반영'}</div>`:''}
      </div>
      ${delBtn}
    </div>`;
  });
  html+='</div>';

  // 공유 메시지
  const msg=buildMsg(ds,list,dateStr);
  html+=`<div class="msg-section">
    <div class="msg-hdr">${curLang==='en'?'Share Message':'공유 메시지'}</div>
    <div class="msg-box" id="msg-box">${msg}</div>
    <div class="msg-btns">
      <button class="msg-btn" style="flex:1;padding:10px;border:none;border-radius:8px;background:#25D366;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit" onclick="shareWA()">💬 WhatsApp</button>
      <button class="msg-btn" style="flex:1;padding:10px;border:none;border-radius:8px;background:#FEE500;color:#3A1D1D;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit" onclick="shareKakao()">📋 ${curLang==='en'?'Copy (Kakao)':'카카오 복사'}</button>
    </div>
    <div id="copy-ok" class="copy-ok">${curLang==='en'?'✓ Copied! Paste in KakaoTalk':'✓ 복사됨! 카카오톡에 붙여넣기'}</div>
  </div>
  <div style="padding:8px 14px 4px">
    <button onclick="openModal()" style="width:100%;padding:10px;border:1.5px dashed var(--teal);border-radius:10px;background:var(--teal-lt);color:var(--teal-dk);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">
      ${curLang==='en'?'+ Add Schedule':'+ 일정 추가'}
    </button>
  </div>`;

  content.innerHTML=html;
}

function buildMsg(ds,list,dateStr){
  const lines=[];
  lines.push('📅 '+dateStr+' '+(curLang==='en'?'Schedule':'일정')+'\n');
  list.forEach(s=>{
    const tStr=s.time_s?(s.time_e?s.time_s+' ~ '+s.time_e:s.time_s):'';
    lines.push('⏰ '+(tStr?tStr+'  ':'')+s.title);
    if(s.memo){
      s.memo.split('\n').forEach(m=>{if(m.trim())lines.push(m.trim());});
    }
    lines.push('');
  });
  lines.push('──────────────');
  lines.push(curLang==='en'?`${list.length} schedule(s) · Happy Home Care · +60 17-247 2774`:`총 ${list.length}건 · Happy Home Care · 📞 +60 17-247 2774`);
  return lines.join('\n');
}

// ── 공유
window.shareWA=function(){
  const box=document.getElementById('msg-box');
  if(box)window.open('https://wa.me/?text='+encodeURIComponent(box.textContent),'_blank');
};
window.shareKakao=function(){
  const box=document.getElementById('msg-box');
  if(!box)return;
  navigator.clipboard.writeText(box.textContent).then(()=>{
    const ok=document.getElementById('copy-ok');
    if(ok){ok.style.display='block';setTimeout(()=>ok.style.display='none',2500);}
  }).catch(()=>prompt('복사:',box.textContent));
};

// ── 삭제 (직접입력만)
window.deleteItem=async function(id){
  if(!confirm(curLang==='en'?'Delete this schedule?':'이 일정을 삭제할까요?'))return;
  try{
    showLoading(true);
    await deleteDoc(doc(db,'schedules',id));
    showLoading(false);
    showToast(curLang==='en'?'Deleted':'삭제됨');
  }catch(e){showLoading(false);}
};

// ── 모달
window.openModal=function(){
  if(!selDate){showToast(curLang==='en'?'Select a date first':'날짜를 먼저 선택하세요');return;}
  document.getElementById('f-title').value='';
  document.getElementById('f-memo').value='';
  document.getElementById('f-time-s').value='09:00';
  document.getElementById('f-time-e').value='13:00';
  curType='booking';
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('on',b.dataset.type==='booking'));
  document.getElementById('modal-ov').classList.add('open');
  setTimeout(()=>document.getElementById('f-title').focus(),300);
};
window.closeModal=function(){document.getElementById('modal-ov').classList.remove('open');};
window.setType=function(btn){
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');curType=btn.dataset.type;
};
window.saveItem=async function(){
  const title=document.getElementById('f-title').value.trim();
  if(!title){showToast(curLang==='en'?'Enter a title':'제목을 입력하세요');return;}
  const data={
    date:selDate,title,
    time_s:document.getElementById('f-time-s').value,
    time_e:document.getElementById('f-time-e').value,
    type:curType,
    memo:document.getElementById('f-memo').value.trim(),
    created_at:new Date().toISOString()
  };
  try{
    showLoading(true);
    await addDoc(collection(db,'schedules'),data);
    showLoading(false);
    window.closeModal();
    showToast(curLang==='en'?'✓ Saved':'✓ 저장됨');
  }catch(e){showLoading(false);alert(e.message);}
};

// ── 언어
window.setLang=function(lang){
  curLang=lang;
  document.getElementById('btn-ko').className='lang-btn'+(lang==='ko'?' on':'');
  document.getElementById('btn-en').className='lang-btn'+(lang==='en'?' on':'');
  // 범례
  document.getElementById('leg-booking').textContent=lang==='en'?'Confirmed':'예약확정';
  document.getElementById('leg-manual').textContent=lang==='en'?'Internal':'직접입력';
  document.getElementById('leg-holiday').textContent=lang==='en'?'Holiday':'휴일';
  document.getElementById('today-btn').textContent=lang==='en'?'Today':'오늘';
  renderCal();
  if(selDate)renderDay(selDate);
};

// ── 월 이동
window.prevMonth=function(){if(curM===0){curY--;curM=11;}else curM--;renderCal();};
window.nextMonth=function(){if(curM===11){curY++;curM=0;}else curM++;renderCal();};
window.goToday=function(){
  const t=new Date();curY=t.getFullYear();curM=t.getMonth();
  const ds=curY+'-'+String(curM+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  selDate=ds;renderCal();renderDay(ds);document.getElementById('day-panel').scrollTop=0;
};

// ── 유틸
function showLoading(v){document.getElementById('loading').classList.toggle('on',v);}
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),2000);
}
</script>
