<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#0B1833">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --navy:#0B1833;--navy2:#16264a;--indigo:#4F6EF7;--teal:#0BB5A4;--gold:#E8A838;
  --bg:#F5F6F8;--ln:#E5E7EB;
  --safe-top:env(safe-area-inset-top);--safe-bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard",'Noto Sans KR',sans-serif;background:var(--bg);display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── 상단 브랜드 바 ── */
.hdr{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 100%);padding:calc(10px + var(--safe-top)) 16px 11px;flex-shrink:0;display:flex;align-items:center;gap:10px}
.hdr-mark{width:30px;height:30px;background:linear-gradient(150deg,var(--indigo),var(--teal));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 3px 10px rgba(79,110,247,.35)}
.hdr-ttl{color:#fff;font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.hdr-sub{font-size:8.5px;font-weight:500;color:#8fa0c9;letter-spacing:.07em;margin-top:1px}
#bell-test{margin-left:auto;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.2);
  background:rgba(255,255,255,.1);font-size:15px;cursor:pointer;color:#fff;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;padding:0}
#bell-test:active{transform:scale(.94)}
.vtag{font-size:9px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.04em}
.hdr-cur{font-size:11px;color:#c9d4ee;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);padding:5px 12px;border-radius:16px;font-weight:600;white-space:nowrap}

/* ══ 메뉴 — 1줄: 큰 갈래 5개(고객·일정·예약·청구·기타) · 2줄: 그 갈래의 화면들 ══
   눌러야 열리는 드롭다운 대신, 선택한 갈래의 화면을 항상 두 번째 줄에 펼쳐 둡니다.
   지금 어디에 있고 무엇을 더 볼 수 있는지 한눈에 보입니다. */
.tabbar{background:#fff;border-bottom:0.5px solid var(--ln);flex-shrink:0;
  box-shadow:0 2px 12px rgba(11,24,51,.05);position:relative;z-index:5}
.g-row{display:flex;gap:5px;padding:8px 8px 6px;overflow-x:auto;scrollbar-width:none}
.g-row::-webkit-scrollbar{display:none}
.gb{flex:1 0 auto;min-width:64px;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 12px;border:1.5px solid transparent;background:none;border-radius:13px;
  font-family:inherit;font-size:14px;font-weight:900;letter-spacing:-.02em;color:#39415a;
  cursor:pointer;position:relative;transition:background .16s,color .16s;white-space:nowrap}
.gb .g-ico{font-size:18px;line-height:1}
.gb:hover{background:#f2f4fa}
.gb.on{background:linear-gradient(140deg,#0E2350,#1b2f58);color:#fff;
  box-shadow:0 3px 7px rgba(6,18,45,.25),0 9px 20px -9px rgba(6,18,45,.6)}
.s-row{display:flex;gap:5px;align-items:center;padding:0 8px 8px;overflow-x:auto;scrollbar-width:none}
.s-row::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;padding:9px 14px;
  border:1.5px solid var(--ln);background:#fff;border-radius:999px;font-family:inherit;
  cursor:pointer;color:#39415a;position:relative;transition:all .14s;white-space:nowrap}
.tab-ico{font-size:14px;line-height:1}
.tab-lbl{font-size:12.5px;font-weight:800;white-space:nowrap;letter-spacing:-.01em}
.tab:active{transform:translateY(1px)}
.tab.active{border-color:#0E2350}
@media(max-width:640px){
  .gb{min-width:56px;padding:10px 8px;font-size:13px}
  .gb .g-ico{font-size:16px}
  .tab{padding:8px 12px}
  .tab-lbl{font-size:12px}
}
/* ── 새 의뢰·예약 알림 배지 ── */
.abdg{position:absolute;top:-5px;right:-3px;min-width:18px;height:18px;border-radius:10px;background:#EF4444;color:#fff;
  font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;
  box-shadow:0 2px 8px rgba(239,68,68,.55);animation:abdgPop .3s ease;z-index:2}
@keyframes abdgPop{from{transform:scale(.3)}60%{transform:scale(1.25)}to{transform:scale(1)}}
/* ── 알림 토스트 (메시지 알림처럼 우측 상단에 표시) ── */
.ntoast{position:fixed;top:calc(96px + var(--safe-top));right:12px;z-index:400;background:#fff;
  border:1.5px solid #FCA5A5;border-left:6px solid #EF4444;border-radius:14px;
  box-shadow:0 16px 44px rgba(11,24,51,.32);padding:12px 15px;display:flex;gap:11px;align-items:center;
  cursor:pointer;animation:ntIn .4s cubic-bezier(.2,.9,.3,1.2);max-width:330px}
.ntoast .ic{width:38px;height:38px;border-radius:11px;background:#FEF2F2;display:flex;align-items:center;
  justify-content:center;font-size:18px;flex-shrink:0;animation:ntRing 1.1s ease infinite}
.ntoast b{display:block;font-size:13.5px;font-weight:800;color:#0B1833;letter-spacing:-.02em}
.ntoast span{display:block;font-size:11px;color:#8A8F9A;font-weight:600;margin-top:2px}
.ntoast .x{margin-left:4px;border:none;background:none;color:#B9BFCB;font-size:15px;cursor:pointer;padding:4px}
@keyframes ntIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes ntRing{0%,100%{transform:rotate(0)}12%{transform:rotate(-14deg)}24%{transform:rotate(12deg)}36%{transform:rotate(-8deg)}48%{transform:rotate(6deg)}60%{transform:rotate(0)}}
/* ── 알림 켜기 배너 ── */
#notif-bar{flex-shrink:0;display:flex;align-items:center;gap:9px;background:#FFF8EC;border-bottom:1px solid #F5C56B;
  padding:8px 12px;font-size:12px;font-weight:700;color:#8A5A00;line-height:1.5}
#notif-bar .bic{font-size:15px;flex-shrink:0}
#notif-bar .btxt{flex:1;min-width:0}
#notif-bar button{flex-shrink:0;border:none;background:#E8A838;color:#3d2c00;font-family:inherit;font-size:12px;
  font-weight:800;border-radius:9px;padding:8px 14px;cursor:pointer;box-shadow:0 2px 8px rgba(232,168,56,.4)}
#notif-bar button:active{transform:scale(.97)}
#notif-bar .bx{background:none;box-shadow:none;color:#C9A45C;font-size:14px;padding:6px 8px}
/* ── 알림 허용 방법 안내 모달 ── */
#permhelp{position:fixed;inset:0;z-index:500;background:rgba(11,24,51,.55);display:flex;align-items:center;justify-content:center;padding:18px}
#permhelp .box{background:#fff;border-radius:18px;max-width:360px;width:100%;padding:20px 18px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
#permhelp h3{font-size:15.5px;font-weight:800;color:#0B1833;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
#permhelp p{font-size:12px;color:#5b6478;line-height:1.7;margin-top:8px;word-break:keep-all}
#permhelp .step{display:flex;gap:9px;align-items:flex-start;background:#F5F7FB;border-radius:12px;padding:10px 12px;margin-top:8px}
#permhelp .step .n{width:20px;height:20px;border-radius:50%;background:var(--indigo);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
#permhelp .step div{font-size:12px;color:#39415a;font-weight:600;line-height:1.6;word-break:keep-all}
#permhelp .step b{color:#0B1833}
#permhelp .cls{width:100%;margin-top:14px;border:none;background:var(--indigo);color:#fff;font-family:inherit;font-size:13.5px;font-weight:800;border-radius:11px;padding:12px;cursor:pointer}
.tab.active{background:#0E2350;border-color:#0E2350;color:#fff;box-shadow:0 4px 12px -4px rgba(14,35,80,.5)}
.tab.active .tab-lbl{color:#fff}

/* ── 컨텐츠 ── */
.stage{flex:1;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;display:none}
.pane.active{display:block}
.pane iframe{width:100%;height:100%;border:none;display:block}
.pane-empty{height:100%;display:flex;align-items:center;justify-content:center}
.spinner{width:32px;height:32px;border:3px solid var(--ln);border-top-color:var(--indigo);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<style>
/* ══ 모바일·가로모드 개선 ══ */
@media (max-width:820px){
  input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}
}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
@media (orientation:landscape) and (max-height:520px){
  .hdr{padding-top:calc(4px + var(--safe-top));padding-bottom:5px}
  .hdr-ttl{font-size:13px}
  .hdr-sub{display:none}
  .g-row{padding:4px 6px 3px}
  .gb{padding:6px 10px;font-size:12px}
  .s-row{padding:0 6px 5px}
  .tab{padding:5px 10px}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-mark">HHC</div>
  <div><div class="hdr-ttl">Happy Home Care</div><div class="hdr-sub">ADMIN CONSOLE</div></div>
  <button id="bell-test" title="알림 테스트" type="button">🔔</button>
  <span class="vtag">v4</span>
  <div class="hdr-cur" id="hdr-title">스케줄</div>
</div>

<div class="tabbar" id="tabbar">
  <div class="g-row" id="grow"></div>
  <div class="s-row" id="srow"></div>
</div>

<div class="stage" id="stage">
  <div class="pane" data-pane="customers"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="memo"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="schedule"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="request"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="booking"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="invoice"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="inspect"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="contract"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="coupon"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="expense"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="quote"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="homepage"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="reviews"><div class="pane-empty"><div class="spinner"></div></div></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// 메뉴 구성 — 갈래(1줄) 안에 화면(2줄)이 있습니다.
//  · 화면 src 파일명이 서버의 실제 파일명과 다르면 여기만 수정하세요.
//  · 화면 id(data-tab)는 예전 주소(#invoice 등)·저장된 탭과 그대로 호환됩니다.
// ═══════════════════════════════════════════════════════════
var MENU=[
  {gid:'cust', gname:'고객', gicon:'👥', items:[
    {id:'customers',name:'고객관리',   icon:'👥', src:'customer-admin.html'}
  ]},
  {gid:'plan', gname:'일정', gicon:'📅', items:[
    {id:'schedule', name:'스케줄',     icon:'📅', src:'schedule.html'},
    {id:'memo',     name:'메모장',     icon:'📝', src:'memo-admin.html'}
  ]},
  {gid:'book', gname:'예약', gicon:'🗓️', items:[
    {id:'request',  name:'의뢰관리',   icon:'📥', src:'request-admin.html'},
    {id:'booking',  name:'예약관리',   icon:'🗓️', src:'booking-admin.html'}
  ]},
  {gid:'bill', gname:'청구', gicon:'💳', items:[
    {id:'invoice',  name:'인보이스',   icon:'💳', src:'hhc-invoice.html'},
    {id:'inspect',  name:'점검보고서', icon:'🔧', src:'inspect-admin.html'},
    {id:'contract', name:'계약',       icon:'📑', src:'admin.html'},
    {id:'coupon',   name:'상품·할인권', icon:'🎫', src:'coupon-admin.html'},
    {id:'quote',    name:'견적서',     icon:'🧾', src:'quote-admin.html'}
  ]},
  {gid:'etc',  gname:'기타', gicon:'📂', items:[
    {id:'expense',  name:'비용청구',   icon:'💰', src:'expense-admin.html'},
    {id:'homepage', name:'홈페이지',   icon:'🏠', src:'home.html'},
    {id:'reviews',  name:'리뷰관리',   icon:'⭐', src:'review-admin.html'}
  ]}
];
var FLAT=[];
MENU.forEach(function(g){g.items.forEach(function(c){c._g=g.gid;FLAT.push(c);});});
var GRP_OF={};FLAT.forEach(function(c){GRP_OF[c.id]=c._g;});

// 탭별 iframe은 한 번만 로드 후 유지 — 탭을 오가도 작성 중인 내용이 보존됨
var loaded={};
var LS_KEY='hhc_hub_tab';
var LS_GLAST='hhc_hub_glast';      // 갈래별 마지막 화면 {gid:tabId}
function glast(){try{return JSON.parse(localStorage.getItem(LS_GLAST)||'{}')||{};}catch(e){return {};}}

/* 1줄 — 갈래 버튼 */
(function buildGroups(){
  var host=document.getElementById('grow');
  MENU.forEach(function(g){
    var b=document.createElement('button');
    b.className='gb';b.id='gb-'+g.gid;b.type='button';
    b.innerHTML='<span class="g-ico">'+g.gicon+'</span>'+g.gname;
    b.addEventListener('click',function(){
      var last=glast()[g.gid];
      var t=g.items.find(function(c){return c.id===last;})||g.items[0];
      activate(t.id);
    });
    host.appendChild(b);
  });
})();
/* 2줄 — 선택한 갈래의 화면 알약 */
function buildSubs(gidSel){
  var g=MENU.find(function(x){return x.gid===gidSel;})||MENU[0];
  var host=document.getElementById('srow');host.innerHTML='';
  g.items.forEach(function(c){
    var b=document.createElement('button');
    b.className='tab';b.type='button';
    b.dataset.tab=c.id;b.dataset.title=c.name;b.dataset.src=c.src;
    b.innerHTML='<span class="tab-ico">'+c.icon+'</span><span class="tab-lbl">'+c.name+'</span>';
    b.addEventListener('click',function(){activate(c.id);});
    host.appendChild(b);
  });
}
function activate(tab,silent){
  var m=FLAT.find(function(x){return x.id===tab;});
  if(!m)return;
  buildSubs(m._g);
  document.querySelectorAll('.gb').forEach(function(g){g.classList.toggle('on',g.id==='gb-'+m._g);});
  document.querySelectorAll('.tab[data-tab]').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab);});
  document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('active',p.dataset.pane===tab);});
  var g=MENU.find(function(x){return x.gid===m._g;});
  document.getElementById('hdr-title').textContent=g.gname+' · '+m.name;
  document.title='HHC 관리자 · '+m.name;
  window.__hhcActiveTab=tab;
  if(window.__hhcAlertClear)window.__hhcAlertClear(tab);

  if(!loaded[tab]){
    loaded[tab]=true;
    var pane=document.querySelector('.pane[data-pane="'+tab+'"]');
    var ifr=document.createElement('iframe');
    ifr.src=m.src;
    ifr.setAttribute('allow','clipboard-write; clipboard-read');
    pane.innerHTML='';
    pane.appendChild(ifr);
  }
  try{
    localStorage.setItem(LS_KEY,tab);
    var gl=glast();gl[m._g]=tab;localStorage.setItem(LS_GLAST,JSON.stringify(gl));
  }catch(e){}
  if(!silent){try{history.replaceState(null,'','#'+tab);}catch(e){}}
  if(window.__hhcRefreshBadges)window.__hhcRefreshBadges();   // 2줄을 다시 그렸으니 알림 배지 복원
  var sb2=document.querySelector('.tab[data-tab="'+tab+'"]');
  if(sb2&&sb2.scrollIntoView)sb2.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  var gb2=document.getElementById('gb-'+m._g);
  if(gb2&&gb2.scrollIntoView)gb2.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'});
}
window.activate=activate;

// 의뢰관리·예약목록 등에서 「👤 고객정보」를 누르면 고객관리 탭으로 전환해 해당 고객 상세를 연다
function hubOpenCustomer(key){
  var url='customer-admin.html?open='+encodeURIComponent(key);
  var fresh=!loaded['customers'];
  activate('customers');
  var pane=document.querySelector('.pane[data-pane="customers"]');
  var ifr=pane?pane.querySelector('iframe'):null;
  if(!ifr)return;
  if(fresh){ifr.src=url;return;}          // 이제 막 만들어진 화면 → 주소로 바로 열기
  var ok=false;
  function ack(ev){if(ev&&ev.data&&ev.data.hhcOpenCustomerDone){ok=true;window.removeEventListener('message',ack);}}
  window.addEventListener('message',ack);
  try{ifr.contentWindow.postMessage({hhcOpenCustomer:key},'*');}catch(e){}
  setTimeout(function(){window.removeEventListener('message',ack);if(!ok)ifr.src=url;},600);
}
window.addEventListener('message',function(e){
  var d=e&&e.data;
  if(!d||!d.hhcOpenCustomer)return;
  try{if(e.source&&e.source.postMessage)e.source.postMessage({hhcOpenCustomerOk:1},'*');}catch(err){}
  hubOpenCustomer(String(d.hhcOpenCustomer));
});

// 시작 탭: URL 해시 > 마지막 사용 탭 > 스케줄
function validTab(t){return FLAT.some(function(m){return m.id===t;});}
var start=(location.hash||'').replace('#','');
if(!validTab(start)){
  try{start=localStorage.getItem(LS_KEY)||'';}catch(e){start='';}
}
if(!validTab(start))start='schedule';
activate(start,true);

window.addEventListener('hashchange',function(){
  var h=(location.hash||'').replace('#','');
  if(validTab(h))activate(h,true);
});
</script>

<!-- ══ 새 의뢰·예약신청 실시간 알림 : 배지 표시 + 알림음 ══ -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, onSnapshot, doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const CFG={apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",authDomain:"happywork-packageplan.firebaseapp.com",
  projectId:"happywork-packageplan",storageBucket:"happywork-packageplan.firebasestorage.app",
  messagingSenderId:"101289103022",appId:"1:101289103022:web:d81aca7f3747dd26df673f"};

let db=null;
try{db=getFirestore(initializeApp(CFG));}catch(e){}

// ── 이미 본 문서 기억 (새로고침해도 같은 건으로 다시 울리지 않음) ──
function loadSeen(k){try{return new Set(JSON.parse(localStorage.getItem(k)||'[]'));}catch(e){return new Set();}}
function saveSeen(k,set){try{localStorage.setItem(k,JSON.stringify([...set].slice(-600)));}catch(e){}}
const SEEN={requests:loadSeen('hhc_alert_rq'),bookings:loadSeen('hhc_alert_bk2')};
const PEND={request:0,booking:0};
// 이전 실행 이력이 있는지 (있으면 앱이 닫혀 있던 사이 도착한 건도 알림)
const INIT=(function(){try{var v=localStorage.getItem('hhc_alert_init')==='1';localStorage.setItem('hhc_alert_init','1');return v;}catch(e){return false;}})();
function recentDoc(d){var t=Date.parse(d.booked_at||d.submitted_at||'')||0;return t>0&&(Date.now()-t)<72*3600*1000;}

// ── 알림음 (파일 없이 웹오디오 2음 차임) — 브라우저 정책상 첫 터치 이후부터 소리가 납니다 ──
let AC=null;
function primeAudio(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
document.addEventListener('pointerdown',primeAudio,{capture:true});
document.addEventListener('keydown',primeAudio,{capture:true});

// ── 시스템 알림(안드로이드 알림창 · 앱 아이콘 알림 점) 준비 ──
let SWREG=null;
// ── 서버 푸시 구독: 앱이 완전히 꺼져 있어도 알림을 받기 위한 기기 등록 ──
const VAPID_PUB='BE5OUy5k4wwsty8t7vBJ1IH-9LMpqzKI66QAV78Z39lGhYRBImjekMHVyJMhqUDsHJvvwIIVbb-YT-gRtwL5O74';
function b64ToU8(s){s=(s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/');var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
// ── 앱을 열면 알림창에 쌓인 알림과 아이콘 배지를 자동으로 지움 ──
function clearSysNotifs(){
  try{
    if(navigator.clearAppBadge)navigator.clearAppBadge().catch(function(){});
    if(SWREG&&SWREG.getNotifications)SWREG.getNotifications().then(function(list){
      list.forEach(function(n){try{n.close();}catch(e){}});
    }).catch(function(){});
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible')clearSysNotifs();
});
function setupPush(){
  try{
    if(!db||!SWREG||!SWREG.pushManager||notifPerm()!=='granted')return;
    SWREG.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(VAPID_PUB)}).then(function(sub){
      var j=sub.toJSON();
      var id=(j.endpoint||'').replace(/[^a-zA-Z0-9]/g,'').slice(-48)||'dev';
      setDoc(doc(db,'push_subs',id),{endpoint:j.endpoint,keys:j.keys,
        ua:(navigator.userAgent||'').slice(0,120),updated_at:new Date().toISOString()}).catch(function(){});
      window.__hhcPushOK=true;
    }).catch(function(e){window.__hhcPushErr=String(e&&e.name||e);});
  }catch(e){}
}
if('serviceWorker' in navigator&&location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').then(r=>{SWREG=r;setupPush();clearSysNotifs();}).catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{
    if(e.data&&e.data.hhcOpenTab&&window.activate)window.activate(e.data.hhcOpenTab);
  });
}
// ── 알림 권한: 화면 대부분이 내부 프레임이라 터치가 앱 본체에 닿지 않을 수 있어
//    ① 시작 시 자동 요청을 시도하고 ② 확실한 방법으로 「알림 켜기」 배너 버튼을 제공합니다 ──
function notifPerm(){try{return ('Notification' in window)?Notification.permission:'unsupported';}catch(e){return 'unsupported';}}
function grantFeedback(){
  setupPush();
  try{
    showSys('🔔 알림이 켜졌습니다',{body:'새 의뢰·예약신청이 오면 이렇게 알려드립니다',icon:'icon-admin-192.png',
      badge:'icon-admin-192.png',tag:'hhc-alert-hello',vibrate:[220,110,220]});
    ding();
  }catch(e){}
}
function askNotifPerm(fromUser){
  try{
    var st=notifPerm();
    if(st==='granted'){updateNotifBar();return;}
    if(st==='denied'){if(fromUser)showPermHelp('denied');return;}
    Notification.requestPermission().then(function(r){
      updateNotifBar();
      if(r==='granted')grantFeedback();
      // 팝업이 표시되지 않고 조용히 무시되었거나(default 유지) 거부된 경우 — 직접 켜는 방법 안내
      else if(fromUser)showPermHelp(r);
    });
  }catch(e){if(fromUser)showPermHelp('error');}
}
function showPermHelp(state){
  var old=document.getElementById('permhelp');if(old)old.remove();
  var d=document.createElement('div');d.id='permhelp';
  d.innerHTML='<div class="box">'+
    '<h3>🔔 알림을 직접 켜 주세요</h3>'+
    '<p>'+(state==='denied'
      ?'이 사이트의 알림이 <b>차단</b>되어 있어 팝업이 뜨지 않습니다. 아래 방법으로 직접 허용해 주세요.'
      :'브라우저가 알림 요청 팝업을 띄우지 않는 상태입니다. 아래 방법으로 직접 허용해 주세요.')+'</p>'+
    '<div class="step"><span class="n">1</span><div>휴대폰 <b>설정 → 애플리케이션</b>에서 <b>「HHC 관리자」</b>(또는 Chrome)를 찾습니다</div></div>'+
    '<div class="step"><span class="n">2</span><div><b>알림</b> 메뉴에서 <b>허용</b>으로 바꿉니다</div></div>'+
    '<div class="step"><span class="n">3</span><div>또는 <b>Chrome</b>으로 이 주소를 연 뒤 주소창의 <b>자물쇠 🔒 → 권한 → 알림 → 허용</b></div></div>'+
    '<div class="step"><span class="n">4</span><div>앱을 완전히 닫았다가 다시 열면 적용됩니다</div></div>'+
    '<button class="cls">확인</button></div>';
  d.querySelector('.cls').onclick=function(){d.remove();};
  d.addEventListener('click',function(e){if(e.target===d)d.remove();});
  document.body.appendChild(d);
}
function updateNotifBar(){
  var st=notifPerm();
  var bar=document.getElementById('notif-bar');
  if(st==='granted'||st==='unsupported'){if(bar)bar.remove();return;}
  if(!bar){
    bar=document.createElement('div');bar.id='notif-bar';
    var nav=document.querySelector('.tabbar');
    nav.parentNode.insertBefore(bar,nav.nextSibling);
  }
  if(st==='default'){
    bar.innerHTML='<span class="bic">🔔</span><span class="btxt">새 의뢰·예약 알림을 받으려면 알림을 켜 주세요</span>'+
      '<button id="nb-on">알림 켜기</button><button class="bx" id="nb-x">✕</button>';
    bar.querySelector('#nb-on').onclick=function(){
      this.textContent='요청 중...';
      var self=this;
      setTimeout(function(){self.textContent='알림 켜기';},1500);
      askNotifPerm(true);
    };
  }else{ // denied
    bar.innerHTML='<span class="bic">🔕</span><span class="btxt">알림이 차단되어 있습니다 — 브라우저 주소창 옆 자물쇠(또는 ⋮ 메뉴) → 사이트 설정 → 알림에서 「허용」으로 바꿔 주세요</span>'+
      '<button class="bx" id="nb-x">✕</button>';
  }
  bar.querySelector('#nb-x').onclick=function(){bar.remove();};
}
document.addEventListener('pointerdown',function(){askNotifPerm(false);},{capture:true,once:true});
// 시작 시: 배너 표시 + 자동 요청 시도 (브라우저가 허용하는 경우 즉시 팝업)
setTimeout(function(){updateNotifBar();askNotifPerm(false);setupPush();},900);
// ── 🔔 알림 테스트 버튼: 기기에서 알림이 실제로 뜨는지 즉시 확인 ──
var bell=document.getElementById('bell-test');
if(bell)bell.addEventListener('click',function(){
  primeAudio();
  var st=notifPerm();
  // ① 앱 내 알림 경로 점검: 토스트 + 알림음 (+ 다른 탭이면 배지)
  alertHit('request','🔔 알림 테스트',1);
  // ② 시스템 알림(상단바) 점검 + 푸시 기기 등록 확인
  if(st==='granted'){
    setupPush();
    showSys('🔔 테스트 알림',{body:'알림이 정상 동작합니다 — 새 의뢰·예약도 이렇게 도착합니다',
      icon:'icon-admin-192.png',badge:'icon-admin-192.png',tag:'hhc-alert-test',vibrate:[220,110,220]});
  }else{
    askNotifPerm(true);
  }
});
function appBadge(n){
  try{
    if(!('setAppBadge' in navigator))return;
    if(n>0)navigator.setAppBadge(n);else navigator.clearAppBadge();
  }catch(e){}
}
function showSys(title,opt,tab){
  // ① 등록된 서비스워커 → ② 준비 중인 서비스워커 → ③ 직접 생성 순으로 시도
  try{
    if(SWREG&&SWREG.showNotification){SWREG.showNotification(title,opt);return;}
    if('serviceWorker' in navigator&&location.protocol==='https:'){
      navigator.serviceWorker.ready.then(function(r){r.showNotification(title,opt);})
        .catch(function(){try{new Notification(title,opt);}catch(e){}});
      return;
    }
    var nt=new Notification(title,opt);
    nt.onclick=function(){try{window.focus();}catch(e){};if(tab&&window.activate)window.activate(tab);nt.close();};
  }catch(e){}
}
function sysNotify(tab,kind,n,force){
  window.__hhcNotif=(window.__hhcNotif||0)+1;
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    showSys(kind+' '+n+'건 도착',{body:'눌러서 바로 확인하세요',icon:'icon-admin-192.png',badge:'icon-admin-192.png',
      tag:'hhc-alert-'+tab,renotify:true,vibrate:[220,110,220],data:{tab:tab}},tab);
  }catch(e){}
}
function ding(){
  window.__hhcDing=(window.__hhcDing||0)+1;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    if(!AC)return;
    if(AC.state==='suspended'){AC.resume().catch(()=>{});}
    const t=AC.currentTime;
    [[880,0],[1174.66,.16]].forEach(p=>{
      const o=AC.createOscillator(),g=AC.createGain();
      o.type='sine';o.frequency.value=p[0];
      g.gain.setValueAtTime(0,t+p[1]);
      g.gain.linearRampToValueAtTime(.35,t+p[1]+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+p[1]+.55);
      o.connect(g);g.connect(AC.destination);
      o.start(t+p[1]);o.stop(t+p[1]+.6);
    });
  }catch(e){}
}

// ── 배지 표시 ──
function setBadge(el,n){
  if(!el)return;
  let b=el.querySelector('.abdg');
  if(n>0){
    if(!b){b=document.createElement('span');b.className='abdg';el.appendChild(b);}
    b.textContent=n>99?'99+':n;
  }else if(b)b.remove();
}
function refreshUI(){
  // 1줄 「예약」 갈래 버튼 + (예약 갈래가 열려 있으면) 2줄 의뢰·예약 알약에 배지 표시
  setBadge(document.getElementById('gb-book'),PEND.request+PEND.booking);
  setBadge(document.querySelector('.tab[data-tab="request"]'),PEND.request);
  setBadge(document.querySelector('.tab[data-tab="booking"]'),PEND.booking);
  const tot=PEND.request+PEND.booking;
  const base=document.title.replace(/^\(\d+\+?\) /,'');
  document.title=(tot>0?'('+tot+') ':'')+base;
}
window.__hhcRefreshBadges=refreshUI;   // 탭 전환으로 2줄이 다시 그려질 때 배지 복원용

// ── 알림 토스트 ──
let toastTimer=null;
function showToast(tab,kind,n){
  const old=document.querySelector('.ntoast');if(old)old.remove();
  clearTimeout(toastTimer);
  const d=document.createElement('div');d.className='ntoast';
  d.innerHTML='<span class="ic">'+(tab==='request'?'📥':'🗓️')+'</span>'+
    '<div><b>'+kind+' '+n+'건 도착</b><span>눌러서 바로 확인하세요</span></div>'+
    '<button class="x" aria-label="닫기">✕</button>';
  d.addEventListener('click',function(e){
    if(e.target.closest('.x')){d.remove();return;}
    d.remove();
    if(window.activate)window.activate(tab);
  });
  document.body.appendChild(d);
  toastTimer=setTimeout(function(){d.remove();},10000);
}

// ── 감시 ──
function alertHit(tab,kind,n){
  if(n<=0)return;
  if(window.__hhcActiveTab===tab&&!document.hidden){showToast(tab,kind,n);ding();return;}   // 그 화면을 보는 중 — 토스트·알림음만
  PEND[tab]+=n;
  refreshUI();
  appBadge(PEND.request+PEND.booking);   // 홈 화면 앱 아이콘 배지 (지원 기기)
  showToast(tab,kind,n);
  ding();
  // 앱이 뒤로 가 있거나 화면이 꺼져 있으면 안드로이드 알림창으로도 표시 (아이콘에 알림 점)
  if(document.hidden||window.__hhcForceNotif)sysNotify(tab,kind,n);
}
function watch(collName,tab,kind,pred){
  if(!db)return;
  let ready=false;
  const key=collName==='requests'?'hhc_alert_rq':'hhc_alert_bk2';
  try{
    onSnapshot(collection(db,collName),snap=>{
      if(!ready){
        ready=true;
        // 대상 상태(pred)인 문서만 기억 — 예약이 '대기'였다가 나중에 '신청완료'로 바뀌면 새 알림으로 감지
        let fresh=0;
        snap.docs.forEach(dc=>{
          const d=dc.data()||{};
          if(!pred(d))return;
          if(INIT&&!SEEN[collName].has(dc.id)&&recentDoc(d))fresh++;   // 앱이 닫혀 있는 동안(72시간 내) 도착한 건
          SEEN[collName].add(dc.id);
        });
        saveSeen(key,SEEN[collName]);
        if(fresh>0)alertHit(tab,kind,fresh);
        return;
      }
      let fresh=0;
      const chs=(snap.docChanges&&snap.docChanges())||[];
      chs.forEach(ch=>{
        if(ch.type!=='added'&&ch.type!=='modified')return;
        const d=ch.doc.data()||{};
        if(!pred(d))return;
        if(SEEN[collName].has(ch.doc.id))return;
        SEEN[collName].add(ch.doc.id);
        fresh++;
      });
      if(fresh>0){
        saveSeen(key,SEEN[collName]);
        alertHit(tab,kind,fresh);
      }
    },function(err){
      // 연결 실패(권한 등)를 조용히 삼키지 않고 한 번 표시 — 원인 파악용
      if(window.__hhcWatchErr)return;window.__hhcWatchErr=String(err&&err.code||err||'error');
      try{
        var d=document.createElement('div');d.className='ntoast';
        d.innerHTML='<span class="ic">⚠️</span><div><b>알림 연결 실패</b><span>'+window.__hhcWatchErr+'</span></div>';
        d.addEventListener('click',function(){d.remove();});
        document.body.appendChild(d);setTimeout(function(){d.remove();},12000);
      }catch(e){}
    });
  }catch(e){}
}
// 의뢰관리: 새 의뢰요청서 도착
watch('requests','request','📥 새 의뢰요청',()=>true);
// 예약관리: 고객이 예약 신청을 완료(신청완료 상태)한 건
watch('bookings','booking','🗓️ 새 예약신청',d=>String(d.status||'')==='booked');

// 해당 탭을 열면 배지 해제
window.__hhcAlertClear=function(tab){
  clearSysNotifs();
  if(tab==='request'||tab==='booking'){PEND[tab]=0;}
  refreshUI();
  appBadge(PEND.request+PEND.booking);
  primeAudio();   // 탭 전환도 사용자 제스처 — 알림음 재생 준비
};
window.__hhcTestAlert=alertHit;   // 표시 점검용
</script>
