<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Happy Home Care 관리자</title>
<link rel="manifest" href="/staff-app-manifest.json">
<meta name="theme-color" content="#0B1833">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HHC 관리자">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" href="/icon-192.png">
<style>
:root{
  --navy:#0B1833;--navy2:#16264a;--indigo:#4F6EF7;--teal:#0BB5A4;--gold:#E8A838;
  --bg:#F5F6F8;--ln:#E5E7EB;
  --safe-top:env(safe-area-inset-top);--safe-bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard",'Noto Sans KR',sans-serif;background:var(--bg);display:flex;flex-direction:column;height:100vh;height:100dvh}

/* ── 상단 브랜드 바 ── */
.hdr{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 100%);padding:calc(10px + var(--safe-top)) 16px 11px;flex-shrink:0;display:flex;align-items:center;gap:10px}
.hdr-mark{width:30px;height:30px;background:linear-gradient(150deg,var(--indigo),var(--teal));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;box-shadow:0 3px 10px rgba(79,110,247,.35)}
.hdr-ttl{color:#fff;font-size:15.5px;font-weight:800;letter-spacing:-.01em}
.hdr-sub{font-size:8.5px;font-weight:500;color:#8fa0c9;letter-spacing:.07em;margin-top:1px}
.hdr-cur{margin-left:auto;font-size:11px;color:#c9d4ee;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);padding:5px 12px;border-radius:16px;font-weight:600;white-space:nowrap}

/* ── 탭 바 ── */
.tabbar{display:flex;background:#fff;border-bottom:0.5px solid var(--ln);flex-shrink:0;padding:7px 6px 6px;gap:3px;overflow-x:auto;scrollbar-width:none;box-shadow:0 2px 12px rgba(11,24,51,.05);position:relative;z-index:5}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:56px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border:none;background:none;border-radius:12px;font-family:inherit;cursor:pointer;color:#8A8F9A;position:relative;transition:all .16s}
.tab-ico{font-size:17px;line-height:1;filter:grayscale(.25);transition:filter .16s}
.tab-lbl{font-size:8.5px;font-weight:700;white-space:nowrap}
.tab.active{background:linear-gradient(120deg,var(--indigo),#3a56d4);color:#fff;box-shadow:0 4px 12px rgba(79,110,247,.35)}
.tab.active .tab-ico{filter:none}
.tab.active .tab-lbl{color:#fff}
.tab .new{position:absolute;top:1px;right:3px;font-size:7px;font-weight:800;background:var(--gold);color:#3d2c00;padding:1px 4px;border-radius:6px}

/* ── 컨텐츠 ── */
.stage{flex:1;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;display:none}
.pane.active{display:block}
.pane iframe{width:100%;height:100%;border:none;display:block}
.pane-empty{height:100%;display:flex;align-items:center;justify-content:center}
.spinner{width:32px;height:32px;border:3px solid var(--ln);border-top-color:var(--indigo);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>

<style>
/* ══ 모바일·가로모드 개선 ══ */
@media (max-width:820px){
  input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}
}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
@media (orientation:landscape) and (max-height:520px){
  .hdr{padding-top:calc(4px + var(--safe-top));padding-bottom:5px}
  .hdr-ttl{font-size:13px}
  .hdr-sub{display:none}
  .tabbar{padding:4px 6px 3px;gap:2px}
  .tab{flex-direction:row;gap:5px;padding:6px 6px;min-width:auto}
  .tab-ico{font-size:14px}
  .tab-lbl{font-size:10px}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-mark">HHC</div>
  <div><div class="hdr-ttl">Happy Home Care</div><div class="hdr-sub">ADMIN CONSOLE</div></div>
  <div class="hdr-cur" id="hdr-title">스케줄</div>
</div>

<div class="tabbar" id="tabbar">
  <button class="tab" data-tab="schedule" data-title="스케줄" data-src="schedule.html">
    <span class="tab-ico">📅</span><span class="tab-lbl">스케줄</span>
  </button>
  <button class="tab" data-tab="request" data-title="의뢰관리" data-src="request-admin.html">
    <span class="tab-ico">📥</span><span class="tab-lbl">의뢰관리</span>
  </button>
  <button class="tab" data-tab="booking" data-title="예약관리" data-src="booking-admin.html">
    <span class="tab-ico">🗓️</span><span class="tab-lbl">예약관리</span>
  </button>
  <button class="tab" data-tab="invoice" data-title="인보이스" data-src="hhc-invoice.html">
    <span class="tab-ico">💳</span><span class="tab-lbl">인보이스</span>
  </button>
  <button class="tab" data-tab="inspect" data-title="점검보고서" data-src="inspect-admin.html">
    <span class="tab-ico">🔧</span><span class="tab-lbl">점검보고서</span>
  </button>
  <button class="tab" data-tab="contract" data-title="계약" data-src="admin.html">
    <span class="tab-ico">📑</span><span class="tab-lbl">계약</span>
  </button>
  <button class="tab" data-tab="expense" data-title="비용청구" data-src="expense-admin.html">
    <span class="tab-ico">💰</span><span class="tab-lbl">비용청구</span>
  </button>
  <button class="tab" data-tab="quote" data-title="견적서" data-src="quote-admin.html">
    <span class="tab-ico">🧾</span><span class="tab-lbl">견적서</span><span class="new">NEW</span>
  </button>
</div>

<div class="stage" id="stage">
  <div class="pane" data-pane="schedule"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="request"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="booking"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="invoice"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="inspect"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="contract"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="expense"><div class="pane-empty"><div class="spinner"></div></div></div>
  <div class="pane" data-pane="quote"><div class="pane-empty"><div class="spinner"></div></div></div>
</div>

<script>
// 탭별 iframe은 한 번만 로드 후 유지 — 탭을 오가도 작성 중인 내용이 보존됨
var loaded={};
var LS_KEY='hhc_hub_tab';

function activate(tab,silent){
  var btn=document.querySelector('.tab[data-tab="'+tab+'"]');
  if(!btn)return;
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab);});
  document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('active',p.dataset.pane===tab);});
  document.getElementById('hdr-title').textContent=btn.dataset.title;
  document.title='HHC 관리자 · '+btn.dataset.title;

  if(!loaded[tab]){
    loaded[tab]=true;
    var pane=document.querySelector('.pane[data-pane="'+tab+'"]');
    var ifr=document.createElement('iframe');
    ifr.src=btn.dataset.src;
    ifr.setAttribute('allow','clipboard-write; clipboard-read');
    pane.innerHTML='';
    pane.appendChild(ifr);
  }
  try{localStorage.setItem(LS_KEY,tab);}catch(e){}
  if(!silent){try{history.replaceState(null,'','#'+tab);}catch(e){}}
  // 활성 탭이 보이도록 스크롤 (탭이 많아 가로 스크롤될 때)
  if(btn.scrollIntoView)btn.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}

document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){activate(b.dataset.tab);});
});

// 시작 탭: URL 해시 > 마지막 사용 탭 > 스케줄
var start=(location.hash||'').replace('#','');
if(!document.querySelector('.tab[data-tab="'+start+'"]')){
  try{start=localStorage.getItem(LS_KEY)||'';}catch(e){start='';}
}
if(!document.querySelector('.tab[data-tab="'+start+'"]'))start='schedule';
activate(start,true);

window.addEventListener('hashchange',function(){
  var h=(location.hash||'').replace('#','');
  if(document.querySelector('.tab[data-tab="'+h+'"]'))activate(h,true);
});
</script>

</body>
</html>
