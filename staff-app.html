<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Happy Home Care 관리자</title>
<style>
:root{
  --navy:#0B1833;--teal:#0BB5A4;--teal-lt:#E0F9F5;--teal-dk:#085048;
  --bg:#F5F6F8;--ln:#E5E7EB;
  --safe-top:env(safe-area-inset-top);--safe-bot:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Pretendard",sans-serif;background:var(--bg);display:flex;flex-direction:column;height:100vh;height:100dvh}

.hdr{background:var(--navy);padding:calc(10px + var(--safe-top)) 16px 12px;flex-shrink:0;display:flex;align-items:center;gap:10px}
.hdr-mark{width:28px;height:28px;background:var(--teal);border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff;flex-shrink:0}
.hdr-ttl{color:#fff;font-size:16px;font-weight:700}

.stage{flex:1;position:relative;overflow:hidden}
.pane{position:absolute;inset:0;display:none}
.pane.active{display:block}
.pane iframe{width:100%;height:100%;border:none;display:block}
.pane-empty{height:100%;display:flex;align-items:center;justify-content:center}
.spinner{width:32px;height:32px;border:3px solid var(--ln);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.tabbar{display:flex;background:#fff;border-bottom:0.5px solid var(--ln);flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px 7px;border:none;background:none;font-family:inherit;cursor:pointer;color:#8A8F9A;position:relative;min-width:0}
.tab.active{color:var(--teal-dk)}
.tab.active::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2.5px;background:var(--teal)}
.tab-ico{font-size:17px;line-height:1}
.tab-lbl{font-size:9px;font-weight:600;white-space:nowrap}
.tab.active .tab-lbl{color:var(--teal-dk)}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-mark">HHC</div>
  <div class="hdr-ttl" id="hdr-title">스케줄</div>
</div>

<div class="tabbar">
  <button class="tab active" data-tab="schedule" data-title="스케줄" data-src="schedule.html">
    <span class="tab-ico">📅</span><span class="tab-lbl">스케줄</span>
  </button>
  <button class="tab" data-tab="booking" data-title="예약관리" data-src="booking-admin.html">
    <span class="tab-ico">🗓️</span><span class="tab-lbl">예약관리</span>
  </button>
  <button class="tab" data-tab="inspect" data-title="점검보고서" data-src="inspect-admin.html">
    <span class="tab-ico">🔧</span><span class="tab-lbl">점검보고서</span>
  </button>
  <button class="tab" data-tab="invoice" data-title="인보이스" data-src="hhc-invoice.html">
    <span class="tab-ico">🧾</span><span class="tab-lbl">인보이스</span>
  </button>
  <button class="tab" data-tab="contract" data-title="계약" data-src="admin.html">
    <span class="tab-ico">📄</span><span class="tab-lbl">계약</span>
  </button>
  <button class="tab" data-tab="request" data-title="의뢰관리" data-src="request-admin.html">
    <span class="tab-ico">📋</span><span class="tab-lbl">의뢰관리</span>
  </button>
</div>

<div class="stage" id="stage">
  <div class="pane active" data-pane="schedule">
    <div class="pane-empty"><div class="spinner"></div></div>
  </div>
  <div class="pane" data-pane="booking">
    <div class="pane-empty"><div class="spinner"></div></div>
  </div>
  <div class="pane" data-pane="inspect">
    <div class="pane-empty"><div class="spinner"></div></div>
  </div>
  <div class="pane" data-pane="invoice">
    <div class="pane-empty"><div class="spinner"></div></div>
  </div>
  <div class="pane" data-pane="contract">
    <div class="pane-empty"><div class="spinner"></div></div>
  </div>
  <div class="pane" data-pane="request">
    <div class="pane-empty"><div class="spinner"></div></div>
  </div>
</div>

<script>
var loaded={};

function activate(tab){
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('active',b.dataset.tab===tab);});
  document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('active',p.dataset.pane===tab);});
  var btn=document.querySelector('.tab[data-tab="'+tab+'"]');
  document.getElementById('hdr-title').textContent=btn.dataset.title;

  if(!loaded[tab]){
    loaded[tab]=true;
    var pane=document.querySelector('.pane[data-pane="'+tab+'"]');
    var ifr=document.createElement('iframe');
    ifr.src=btn.dataset.src;
    pane.innerHTML='';
    pane.appendChild(ifr);
  }
}

document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click',function(){activate(b.dataset.tab);});
});

// 첫 진입 시 기본 탭(스케줄)만 로드
activate('schedule');
</script>

</body>
</html>
