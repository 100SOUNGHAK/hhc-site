<style>

}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--soft);color:var(--ink);word-break:keep-all;font-size:15px}
button,input,select,textarea{font-family:inherit}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
.hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hdr .lg{width:40px;height:40px;border-radius:12px;background:linear-gradient(145deg,var(--navy2),var(--navy));display:grid;place-items:center;font-size:20px;box-shadow:var(--e1)}
.hdr h1{font-size:18px;letter-spacing:-.02em}
.hdr .hs{font-size:12px;color:var(--ink3)}
.sp{flex:1}
.fb-dot{width:8px;height:8px;border-radius:50%;background:#64748b}

.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.tools input{flex:1;min-width:0;height:42px;border:1.5px solid var(--line);border-radius:11px;padding:0 12px;font-size:15px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}

.chip{flex:none;border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer}
.chip i{font-style:normal;color:var(--ink3);margin-left:3px}
.chip.on{background:var(--navy);color:#fff;box-shadow:none}.chip.on i{color:#9fb3dc}

.card{background:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.16);cursor:pointer;transition:transform .14s}
.card+.card{margin-top:10px}
.card:active{transform:scale(.99)}
.card .top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .nm{font-size:16px;font-weight:800;letter-spacing:-.01em}
.card .nm small{font-size:12px;font-weight:600;color:var(--ink3);margin-left:6px}
.card .sm{font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 10px}
.card .rp{margin-top:8px;font-size:13px;padding:8px 10px;border-radius:10px}
.card .rp.ok{background:var(--ok-bg);color:#065F46}.card .rp.no{background:var(--red-bg);color:#991B1B}
.card .dt{margin-left:auto;font-size:12px;color:var(--ink3);white-space:nowrap}

.cs{position:relative}
.cs-list{position:absolute;left:0;right:0;top:100%;z-index:5;background:#fff;border-radius:12px;box-shadow:var(--e2);margin-top:4px;max-height:260px;overflow:auto;display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function optTotal(o){let s=0,has=false;(o.lines||[]).forEach(l=>{if(l.amt===''||l.amt==null)return;has=true;if(!l.waived)s+=Number(l.amt)||0;});return has?Math.round(s*100)/100:null;}
function optSaved(o){return (o.lines||[]).reduce((a,l)=>a+(l.waived?(Number(l.amt)||0):0),0);}
function rand(n){const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',u=new Uint8Array(n);crypto.getRandomValues(u);return Array.from(u,x=>A[x%A.length]).join('');}
function newRef(){const d=myDate();return 'RP-'+d.slice(5,7)+d.slice(8,10)+'-'+String(Math.floor(1000+Math.random()*9000));}

function partSum(r){return (r.parts||[]).map(p=>p.name).filter(Boolean).join(' · ');}
function amtSum(r){const os=r.options||[];if(!os.length)return '';
  if(os.length===1){const t=optTotal(os[0]);return t==null?'견적 별도':'RM '+fmt(t);}
  return os.length+'가지 안';}
function dshort(iso){if(!iso)return '';const d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function paint(){
  const q=$('q').value.trim().toLowerCase();
  const cnt={all:0,wait:0,agreed:0,declined:0,draft:0};
  const isWait=r=>r.status==='sent'||r.status==='viewed';
  ALL.forEach(r=>{if(r.status==='cancel')return;cnt.all++;if(isWait(r))cnt.wait++;if(cnt[r.status]!=null&&r.status!=='all')cnt[r.status]++;});
  $('chips').innerHTML=[['all','전체'],['wait','회신 대기'],['agreed','진행 동의'],['declined','진행 안 함'],['draft','작성 중'],['cancel','취소']].map(([k,nm])=>
    '<button class="chip'+(FILTER===k?' on':'')+'" data-f="'+k+'">'+nm+(cnt[k]!=null?'<i>'+cnt[k]+'</i>':'')+'</button>').join('');
  const rows=ALL.filter(r=>{
    if(FILTER==='all'&&r.status==='cancel')return false;
    if(FILTER==='wait'&&!isWait(r))return false;
    if(FILTER!=='all'&&FILTER!=='wait'&&r.status!==FILTER)return false;
    if(!q)return true;
    return [r.cust&&r.cust.name,r.cust&&r.cust.condo,r.cust&&r.cust.phone,r.ref,partSum(r),r.unit&&r.unit.name].join(' ').toLowerCase().indexOf(q)>=0;
  });
  if(!rows.length){$('list').innerHTML=ALL.length?'<div class="empty"><b>조건에 맞는 의향서가 없습니다</b>다른 분류를 눌러 보세요.</div>':'<div class="empty"><b>아직 수리 의향서가 없습니다</b>아래 「＋ 새 수리 의향서」로 첫 안내서를 만들어 보세요.</div>';return;}
  $('list').innerHTML=rows.map(r=>{
    const rp=r.reply||{},os=r.options||[];
    let rb='';
    if(r.status==='agreed')rb='<div class="rp ok">✅ <b>진행 동의</b> · '+(os.length>1&&rp.opt!=null?String.fromCharCode(65+rp.opt)+'안 ':'')+esc(rp.opt_title||'')+(rp.total!=null?' · RM '+fmt(rp.total):'')+' · '+dshort(rp.at)+
      (rp.prepay?'<br>💳 선입금 RM '+fmt(rp.prepay)+' · '+(r.pay_ok_at?'<b>입금 확인</b>':'<b style="color:#B45309">입금 대기</b>'):'')+'</div>';
    if(r.status==='declined')rb='<div class="rp no">✋ <b>진행 안 함</b> · '+dshort(rp.at)+(rp.remark?'<br>“'+esc(rp.remark)+'”':'')+'</div>';
    return '<div class="card" data-id="'+r.__id+'"><div class="top"><span class="pill '+esc(r.status)+'">'+(ST[r.status]||r.status)+'</span>'+
      '<span style="font-size:12px;color:var(--ink3)">'+esc(r.ref||'')+'</span><span class="dt">'+dshort(r.sent_at||r.updated_at||r.created_at)+'</span></div>'+
      '<div class="nm">'+esc((r.cust&&r.cust.name)||'(고객 미입력)')+'<small>'+esc((r.cust&&r.cust.condo)||'')+'</small></div>'+
      '<div class="sm"><span>'+esc([r.unit&&r.unit.name,r.unit&&r.unit.loc].filter(Boolean).join(' · ')||'')+'</span><span>'+esc(partSum(r))+'</span><span class="num"><b>'+esc(amtSum(r))+'</b></span>'+
      (r.status==='viewed'&&r.viewed_at?'<span>👀 '+dshort(r.viewed_at)+' 열람</span>':'')+'</div>'+rb+'</div>';
  }).join('');
}

    if(o.prepay_amt!=null&&o.prepay_amt!==''){const a=parseFloat(String(o.prepay_amt).replace(/[^0-9.]/g,''));o.prepay_amt=isFinite(a)&&a>0?Math.round(a*100)/100:'';}
    el.querySelectorAll('.ln').forEach(ln=>{const l=o.lines[+ln.dataset.l];if(!l)return;
      l.label=ln.querySelector('[data-lf=label]').value.trim();

      l.waived=ln.querySelector('[data-lf=waived]').checked;});});

function repaint(keepScroll){const b=$('ed-body'),st=b.scrollTop;edPaint();if(keepScroll!==false)b.scrollTop=st;}

/* ── 자동 작성 ── */
function josa(w,a,b){const s=String(w||'').replace(/[\s)\]]+$/,''),c=s.charCodeAt(s.length-1);if(!(c>=0xAC00&&c<=0xD7A3))return w+a+'('+b+')';return w+(((c-0xAC00)%28)?a:b);}
function autoHead(r){
  const p=r.parts.map(x=>x.name).filter(Boolean);
  if(r.headline)return r.headline;
  if(!p.length)return '';
  const nm=p.slice(0,2).map(x=>x.replace(/\s*\(.*\)\s*/,'')).join(' · ')+(p.length>2?' 외 '+(p.length-2)+'건':'');
  return nm+' 수리 계획을 안내드립니다';
}
function autoOpinion(r){
  const L=[],nm=[r.unit.loc,r.unit.name].filter(Boolean).join(' ')||'고객님 제품';
  if(r.diagnosis)L.push(josa(nm,'은','는')+' 점검 결과 '+r.diagnosis.replace(/[.。]?\s*$/,'')+'.');
  else if(r.symptom)L.push(josa(nm,'은','는')+' '+r.symptom.replace(/[.。]?\s*$/,'')+' 증상이 확인되었습니다.');
  const pr=r.parts.filter(p=>p.name);
  if(pr.length){const act={replace:'교체',repair:'수리',refill:'충전',check:'점검',clean:'세척'};
    const grp={};pr.forEach(p=>{const a=act[p.act]||'교체';(grp[a]=grp[a]||[]).push(p.name.replace(/\s*\(.*\)\s*/,''));});
    const ph=Object.keys(grp).map(a=>grp[a].join(' · ')+' '+a).join(', ');L.push('정상 작동을 위해 '+josa(ph,'이','가')+' 필요합니다.');}
  const os=r.options;
  if(os.length===1){const o=os[0],t=optTotal(o),sv=optSaved(o),wl=(o.lines||[]).filter(l=>l.waived&&l.label);
    if(t!=null)L.push((o.title?josa(o.title.replace(/\s+$/,''),'으로','로').replace(/\(로\)$/,'')+' 진행하시면 ':'')+(r.fixed?'청구금액은':'예상 비용은')+' RM '+fmt(t)+'입니다.'+(sv>0?' ('+wl.map(l=>l.label).join('·')+' RM '+fmt(sv)+' 면제)':''));
    else L.push('정확한 비용은 확인 후 따로 안내드리겠습니다.');}
  else if(os.length>1){const rec=os.findIndex(o=>o.rec);
    L.push('총 '+os.length+'가지 방법을 안내드립니다.'+(rec>=0?' 저희는 '+String.fromCharCode(65+rec)+'안('+(os[rec].title||'')+')을 권해 드립니다.':' 상황에 맞는 방법을 골라 주세요.'));}
  const k=r.note_keys;
  if(k.indexOf('compat')>=0)L.push('호환 부품 특성상 수리 후 정상 작동을 장담할 수 없는 점을 고려하시어 진행 여부를 결정해 주시기 바랍니다.');
  else if(k.indexOf('old')>=0)L.push('사용 기간이 오래된 제품인 점을 고려하시어 수리와 교체 중 결정해 주시기 바랍니다.');
  L.push('내용을 확인하신 후 회신 주시면 방문 일정을 안내드리겠습니다.');
  return L.join('\n');
}

/* ── 영어 번역 (저장할 때) ── */
const TRC={};
async function tr1(s){
  s=String(s||'');if(!s||!hasKo(s))return s;if(DICT[s])return DICT[s];if(TRC[s])return TRC[s];
  try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),7000);
    const j=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=en&dt=t&q='+encodeURIComponent(s),{signal:ctl.signal}).then(x=>x.json());clearTimeout(tm);
    const out=(j&&j[0]||[]).map(x=>x[0]).join('');if(out){TRC[s]=out;return out;}}catch(e){}
  return '';
}
async function buildEn(r){
  const en={unit:{},parts:[],options:[],notes:[]};const jobs=[];
  const put=(obj,key,s)=>{jobs.push(tr1(s).then(x=>{if(x)obj[key]=x;}));};
  ['headline','lead','symptom','diagnosis','opinion'].forEach(k=>put(en,k,r[k]));
  ['name','model','loc'].forEach(k=>put(en.unit,k,r.unit[k]));
  r.parts.forEach((p,i)=>{en.parts[i]={};put(en.parts[i],'name',p.name);put(en.parts[i],'note',p.note);});
  r.options.forEach((o,i)=>{const oe=en.options[i]={lines:[]};['title','desc','days','warranty'].forEach(k=>put(oe,k,o[k]));(o.lines||[]).forEach((l,j)=>{oe.lines[j]={};put(oe.lines[j],'label',l.label);});});
  r.notes.forEach((n,i)=>{const pre=NOTES.find(x=>x.ko===n);if(pre)en.notes[i]=pre.en;else jobs.push(tr1(n).then(x=>{en.notes[i]=x||n;}));});
  await Promise.all(jobs);
  return en;
}

/* ── 저장 ── */
function clean(r){
  const o=JSON.parse(JSON.stringify(r));
  o.parts=o.parts.filter(p=>p.name);
  o.options=o.options.map(x=>Object.assign(x,{lines:(x.lines||[]).filter(l=>l.amt!==''&&l.amt!=null)}));   // 금액을 비운 줄은 고객 화면에 안 보냄 (전부 비우면 「견적 별도 안내」)
  const vd=Number(o.valid_days)||0;
  o.valid_until=vd?myDate(Date.now()+vd*864e5):'';
  if(o.valid_until&&o.sent_at)o.valid_until=myDate(Date.parse(o.sent_at)+vd*864e5);
  delete o.__id;
  return o;
}
function check(r,forSend){
  if(!r.cust.name)return '고객 이름을 입력해 주세요';
  if(forSend&&!r.cust.phone)return '전화번호(왓츠앱)를 입력해 주세요';
  if(!r.options.length||!r.options.some(o=>o.title||(o.lines||[]).some(l=>l.label)))return '수리 계획안을 하나 이상 입력해 주세요';
  if(r.options.length>1&&r.options.some(o=>!o.title))return '계획안이 여러 개면 각 계획 이름을 입력해 주세요';
  return '';
}

  if(SAVING)return null;collect();

  if(b)b.innerHTML='<span>'+(ED.fixed?'최종 청구금액':'예상 청구금액')+(sv>0?' <small style="color:var(--gold)">(RM '+fmt(sv)+' 면제)</small>':'')+'</span><b class="num">'+(t==null?'견적 별도 안내':'RM '+fmt(t))+'</b>';});}
$('ed').addEventListener('click',async e=>{
  const cs=e.target.closest('[data-cid]');
  if(cs){const c=(CUSTS||[]).find(x=>x.id===cs.dataset.cid);if(c){collect();ED.cust={id:c.id,name:c.name,phone:c.phone,condo:c.condo};if(c.lang==='en')ED.lang='en';DIRTY=true;repaint();}return;}
  const pk=e.target.closest('.pk button');
  if(pk){collect();const box=pk.parentElement.dataset.pk,txt=pk.textContent.replace(/^＋\s*/,'');DIRTY=true;
    if(box==='unit')ED.unit.name=ED.unit.name===txt?'':txt;
    if(box==='loc')ED.unit.loc=ED.unit.loc===txt?'':txt;
    if(box==='part'){const pr=PARTS.find(x=>x[0]===txt);ED.parts.push({name:pk.dataset.free?'':txt,act:pr&&pr[2]==='gas'?'refill':'replace',note:'',k:pr?pr[2]:'auto'});}
    if(box==='line'){const o=ED.options[+pk.parentElement.dataset.o];o.lines.push({label:txt,amt:'',waived:false});}
    repaint();
    if(box==='part'&&pk.dataset.free){const l=document.querySelectorAll('#parts [data-pf=name]');if(l.length)l[l.length-1].focus();}
    return;}
  const sg=e.target.closest('#f-lang button,#f-valid button');
  if(sg){collect();if(sg.dataset.l)ED.lang=sg.dataset.l;if(sg.dataset.d!=null)ED.valid_days=+sg.dataset.d;DIRTY=true;repaint();return;}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='unlink'){collect();ED.cust.id='';repaint();return;}
  if(act==='pdel'){collect();ED.parts.splice(+a.dataset.i,1);DIRTY=true;repaint();return;}
  if(act==='oadd'){collect();ED.options.push({title:'',desc:'',rec:false,days:'',warranty:'',lines:[{label:'부품비',amt:'',waived:false},{label:'교체 인건비',amt:'',waived:false}]});DIRTY=true;repaint();return;}
  if(act==='odel'){collect();if(!confirm(String.fromCharCode(65+ +a.dataset.o)+'안을 지울까요?'))return;ED.options.splice(+a.dataset.o,1);DIRTY=true;repaint();return;}
  if(act==='oup'){collect();const i=+a.dataset.o;[ED.options[i-1],ED.options[i]]=[ED.options[i],ED.options[i-1]];DIRTY=true;repaint();return;}
  if(act==='orec'){collect();const i=+a.dataset.o,on=!ED.options[i].rec;ED.options.forEach(o=>o.rec=false);ED.options[i].rec=on;DIRTY=true;repaint();return;}
  if(act==='ldel'){collect();ED.options[+a.dataset.o].lines.splice(+a.dataset.l,1);DIRTY=true;repaint();return;}
  if(act==='cnadd'){const d=document.createElement('div');d.className='cnote';d.innerHTML='<input class="fi" data-cn placeholder="안내 사항 입력"><button class="xbtn" data-act="cndel">✕</button>';$('cnotes').appendChild(d);d.querySelector('input').focus();DIRTY=true;return;}
  if(act==='cndel'){a.parentElement.remove();collect();DIRTY=true;return;}
  if(act==='auto'){collect();const cur=$('f-op').value.trim();if(cur&&!confirm('지금 쓴 종합 의견을 자동 작성 내용으로 바꿀까요?'))return;
    $('f-op').value=autoOpinion(ED);if(!$('f-head').value.trim())$('f-head').value=autoHead(ED);DIRTY=true;toast('입력 내용으로 의견을 작성했습니다 — 고쳐 써도 됩니다');return;}
  if(act==='reopen'){if(!confirm('고객 회신을 지우고 다시 회신을 받을까요? (기록은 관리자 메모에 남깁니다)'))return;
    const rp=ED.reply||{},memo=(ED.admin_note?ED.admin_note+'\n':'')+'['+new Date().toLocaleString('ko-KR')+' 회신 초기화] 이전 회신: '+(ED.status==='agreed'?'진행 동의':'진행 안 함')+(rp.opt_title?' · '+rp.opt_title:'')+(rp.remark?' · '+rp.remark:'');
    try{await updateDoc(doc(db,'repair_plans',EDID),{status:'sent',reply:null,replied_at:'',snap:null,pay_ok_at:'',admin_note:memo});Object.assign(ED,{status:'sent',reply:null,pay_ok_at:'',admin_note:memo});edPaint();toast('다시 회신을 받을 수 있습니다');}catch(er){toast('실패: '+er.message);}return;}
  if(act==='payok'){const on=!ED.pay_ok_at;if(!confirm(on?'선입금 입금을 확인했나요? 고객 화면에 「입금 확인」이 표시됩니다.':'입금 확인을 취소할까요?'))return;
    const v=on?nowIso():'';try{await updateDoc(doc(db,'repair_plans',EDID),{pay_ok_at:v});ED.pay_ok_at=v;edPaint();toast(on?'입금 확인으로 기록했습니다':'취소했습니다');}catch(er){toast('실패: '+er.message);}return;}
  if(act==='call'){const p=String(ED.cust.phone||'').replace(/\D/g,'');window.open('https://wa.me/'+(p.indexOf('60')===0?p:p.indexOf('0')===0?'6'+p:'60'+p),'_blank');return;}
});
$('dim').addEventListener('click',async e=>{
  if(e.target.id==='dim'){closeSheet();return;}
  const s=e.target.closest('[data-send]');if(s){doSend(s.dataset.send);return;}
  const pl=e.target.closest('#pv-lang button');if(pl){PVLANG=pl.dataset.l;document.querySelectorAll('#pv-lang button').forEach(b=>b.classList.toggle('on',b===pl));if(PVF)PVF.contentWindow.postMessage({rplan:Object.assign(pvData(),{en:ED.en||null}),lang:PVLANG},'*');return;}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='shclose'){closeSheet();return;}
  if(act==='dup'){collect();const c=JSON.parse(JSON.stringify(ED));['status','tk','ref','sent_at','viewed_at','views','last_view_at','reply','replied_at','created_at','updated_at','send_count','last_sent_at','last_sent_via','en','valid_until','snap','pay_ok_at','memo_id'].forEach(k=>delete c[k]);
    closeSheet();openEd(null,Object.assign(c,{status:'draft'}));DIRTY=true;toast('복사했습니다 — 고객과 내용을 고쳐 저장하세요');return;}
  if(act==='cancel'){if(!confirm('이 의향서를 취소할까요? 고객 링크가 더 이상 열리지 않습니다.'))return;try{await updateDoc(doc(db,'repair_plans',EDID),{status:'cancel',cancel_prev:ED.status,updated_at:nowIso()});closeSheet();closeEd(true);toast('취소했습니다');}catch(er){toast('실패: '+er.message);}return;}
  if(act==='uncancel'){try{await updateDoc(doc(db,'repair_plans',EDID),{status:ED.cancel_prev||'draft',updated_at:nowIso()});closeSheet();closeEd(true);toast('되돌렸습니다');}catch(er){toast('실패: '+er.message);}return;}
  if(act==='del'){if(!confirm('삭제할까요? 되돌릴 수 없습니다.'))return;try{await deleteDoc(doc(db,'repair_plans',EDID));closeSheet();closeEd(true);toast('삭제했습니다');}catch(er){toast('실패: '+er.message);}return;}
});
document.addEventListener('click',e=>{if(!e.target.closest('.cs')){const L=$('cs-list');if(L)L.classList.remove('on');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('dim').classList.contains('on'))closeSheet();}});

/* ══ 시작 ═════════════════════════════════════════════════════ */
const QS=new URLSearchParams(location.search);
let OPENED=false;
function startOpen(){
  if(OPENED)return;
  const od=QS.get('open');
  if(od){if(ALL.some(x=>x.__id===od)){OPENED=true;openEd(od);}return;}
  if(QS.get('new')==='1'){OPENED=true;const mid=QS.get('memo')||'';
    // 메모장 수리요청에서 왔고 그 건으로 만든 의향서가 이미 있으면 그것을 엶 (취소된 것 제외)
    const ex=mid?ALL.find(x=>x.memo_id===mid&&x.status!=='cancel'):null;
    if(ex){openEd(ex.__id);toast('이 수리요청으로 만든 의향서를 열었습니다');return;}
    openEd(null,{cust:{id:QS.get('cid')||'',name:QS.get('name')||'',phone:QS.get('phone')||'',condo:QS.get('condo')||''},memo_id:mid,symptom:QS.get('sym')||'',diagnosis:QS.get('diag')||''});DIRTY=true;}
}
try{
  const app=initializeApp(FIREBASE_CFG);db=hhcFastDb(app);
  onSnapshot(collection(db,'repair_plans'),snap=>{
    window.__hhcReady&&window.__hhcReady();
    ALL=snap.docs.map(d=>Object.assign({__id:d.id},d.data()||{})).sort((a,b)=>String(b.replied_at||b.sent_at||b.updated_at||b.created_at||'').localeCompare(String(a.replied_at||a.sent_at||a.updated_at||a.created_at||'')));
    $('fb-dot').classList.add('on');paint();startOpen();
    // 보고 있는 의향서에 고객 회신이 들어오면 바로 반영 (작성 중인 내용은 그대로)
    if(EDID&&ED&&!DIRTY){const r=ALL.find(x=>x.__id===EDID);if(r&&(r.status!==ED.status||r.viewed_at!==ED.viewed_at||r.pay_ok_at!==ED.pay_ok_at)){Object.assign(ED,{status:r.status,reply:r.reply,viewed_at:r.viewed_at,views:r.views,pay_ok_at:r.pay_ok_at});edPaint();}}
  },err=>{$('list').innerHTML='<div class="empty"><b>목록을 불러오지 못했습니다</b>'+esc(err.message)+'</div>';});
}catch(e){$('list').innerHTML='<div class="empty"><b>연결에 실패했습니다</b>'+esc(e.message)+'</div>';}
window.__rpTest={openEd,collect,autoOpinion,autoHead,msgText,get ED(){return ED;},setAll(a){ALL=a;paint();}};
</script>
<script>
/* ══ 허브(staffapp.html) 안에서 열렸을 때 「화면 살아있음」 신호 — transfer-admin.html 과 같은 코드 ══ */
(function(){
  if(window.top===window.self)return;
  var ready=false,KEY='hhc_wd:'+location.pathname,n=0;
  try{n=parseInt(sessionStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  function post(m){try{window.parent.postMessage(m,'*');}catch(e){}}
  window.__hhcReady=function(){if(ready)return;ready=true;try{sessionStorage.removeItem(KEY);}catch(e){}post({hhcReady:1});};
  window.addEventListener('message',function(e){var d=e&&e.data;if(d&&d.hhcPing)post({hhcPong:1,ready:ready});});
  post({hhcHello:1});
  setTimeout(function(){
    if(ready)return;
    if(navigator.onLine===false||document.visibilityState!=='visible'){post({hhcStuck:1,soft:1});return;}
    post({hhcStuck:1});
  },40000);
})();
</script>
