<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>상품권 / 할인권 이용 안내 — 해피홈케어</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pagebg:#EDEFF4;--gold:#c9a44c;--gold2:#e8cf8a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:var(--pagebg);color:#1a1a2e;line-height:1.6;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px}
.wrap{max-width:420px;width:100%}
.page{position:relative;border-radius:24px;overflow:hidden;color:#dfe7f2;
  background:
   radial-gradient(120% 90% at 12% -5%, #1b3c63 0%, rgba(27,60,99,0) 58%),
   radial-gradient(90% 70% at 108% 106%, rgba(201,164,76,.20) 0%, rgba(201,164,76,0) 60%),
   linear-gradient(170deg,#0B1B2F 0%,#050C17 100%);
  border:1px solid rgba(201,164,76,.42);
  box-shadow:0 34px 64px -30px rgba(5,12,23,.85);
  padding:26px 22px 24px}
.foil{position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#8a6f2b,#c9a44c 18%,#f4e3ae 42%,#c9a44c 68%,rgba(201,164,76,0));background-size:220% 100%;animation:foilmv 5.5s linear infinite}
@keyframes foilmv{to{background-position:-220% 0}}
.lang-sw{display:flex;justify-content:flex-end;gap:6px;margin-bottom:12px}
.lang-sw button{border:1px solid rgba(201,164,76,.4);background:rgba(255,255,255,.04);color:#a9b8c9;font-size:10.5px;font-weight:700;padding:5px 11px;border-radius:100px;cursor:pointer;font-family:inherit}
.lang-sw button.on{background:var(--gold);color:#1a1a2e;border-color:var(--gold)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.logo{width:34px;height:34px;border:1px solid rgba(201,164,76,.75);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Serif KR',serif;font-size:15px;color:var(--gold2);flex-shrink:0;background:radial-gradient(circle at 32% 26%,rgba(232,207,138,.2),transparent 70%)}
.bt b{font-size:13.5px;font-weight:800;color:#fff;display:block}
.bt span{font-size:7.5px;letter-spacing:.15em;color:#7f95b1;font-weight:600}
.hd{text-align:center;margin-bottom:18px}
.hd .t{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:700;color:var(--gold2);text-shadow:0 0 16px rgba(232,207,138,.35)}
.hd .s{font-size:8.5px;letter-spacing:.18em;color:#7f95b1;font-weight:700;margin-top:4px}
.hd .ln{display:flex;align-items:center;gap:10px;margin-top:12px}
.hd .ln i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,164,76,.55))}
.hd .ln i:last-child{background:linear-gradient(90deg,rgba(201,164,76,.55),transparent)}
.hd .ln em{font-style:normal;font-size:10px;color:var(--gold);letter-spacing:.1em;font-weight:800}
.sec{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);border-radius:15px;padding:14px 15px;margin-bottom:11px}
.sec .st{font-size:13px;font-weight:800;color:var(--gold2);margin-bottom:7px}
.sec p{font-size:12px;color:#c3cfdd;line-height:1.85;margin-bottom:7px}
.sec p:last-child{margin-bottom:0}
.sec p b{color:#e8cf8a;font-weight:700}
.sec p.warn{color:#e5d5ab;background:rgba(201,164,76,.1);border:1px solid rgba(201,164,76,.25);border-radius:9px;padding:7px 11px;font-size:11.5px}
.num{display:flex;gap:10px;margin-bottom:11px}
.num:last-child{margin-bottom:0}
.num i{flex-shrink:0;width:21px;height:21px;border-radius:50%;background:rgba(201,164,76,.16);border:1px solid rgba(201,164,76,.4);color:var(--gold2);font-size:11px;font-weight:800;font-style:normal;display:flex;align-items:center;justify-content:center;margin-top:2px}
.num .nb b{display:block;font-size:12.5px;color:#f0f5fb;font-weight:700;margin-bottom:1px}
.num .nb span{font-size:11.5px;color:#a9b8c9;line-height:1.75;display:block}
.num .nb .sub-warn{color:#e5d5ab;font-size:11px}
.notice{border:1.5px dashed rgba(201,164,76,.4);border-radius:15px;background:rgba(201,164,76,.06);padding:13px 15px;margin-bottom:4px}
.notice .st{font-size:12.5px;font-weight:800;color:var(--gold2);margin-bottom:5px}
.notice p{font-size:11.5px;color:#c3cfdd;line-height:1.8}
.ft{margin-top:15px;text-align:center;font-size:9.5px;color:#75899f;font-weight:600}
.actions{margin-top:16px;display:flex;flex-direction:column;gap:9px}
.back{display:flex;align-items:center;justify-content:center;gap:7px;background:#fff;color:#0F2040;font-weight:800;font-size:12.5px;padding:12px;border-radius:100px;text-decoration:none;border:1px solid #dde1ee;cursor:pointer;font-family:inherit;width:100%}
.wa{display:flex;align-items:center;justify-content:center;gap:7px;background:#25D366;color:#fff;font-weight:700;font-size:12.5px;padding:12px;border-radius:100px;text-decoration:none;box-shadow:0 12px 26px -12px rgba(37,211,102,.6)}
</style>
</head>
<body>
<div class="wrap">
  <div class="lang-sw">
    <button id="lang-ko-btn" onclick="setLang('ko')">한국어</button>
    <button id="lang-en-btn" onclick="setLang('en')">English</button>
  </div>
  <div class="page">
    <div class="foil"></div>
    <div class="brand">
      <div class="logo">H</div>
      <div class="bt"><b id="brandName">해피홈케어</b><span>HAPPY WORKS SERVICES SDN. BHD.</span></div>
    </div>
    <div class="hd">
      <div class="t" id="pgTitle">📌 상품권 / 할인권 이용 안내</div>
      <div class="s" id="pgSub">GIFT VOUCHER · DISCOUNT COUPON GUIDE</div>
      <div class="ln"><i></i><em id="pgGuideTag">GUIDE</em><i></i></div>
    </div>

    <div class="sec">
      <div class="st" id="giftT">💳 상품권 안내</div>
      <p id="giftP1"></p>
      <p id="giftP2"></p>
    </div>

    <div class="sec">
      <div class="st" id="discT">🏷 할인권 안내</div>
      <p id="discP1"></p>
      <p class="warn" id="discP2"></p>
    </div>

    <div class="sec">
      <div class="st" id="termsT">✅ 이용 유의사항</div>
      <div class="num"><i>1</i><div class="nb"><b id="term1T"></b><span id="term1S"></span></div></div>
      <div class="num"><i>2</i><div class="nb"><b id="term2T"></b><span id="term2S"></span></div></div>
      <div class="num"><i>3</i><div class="nb"><b id="term3T"></b><span id="term3S"></span></div></div>
      <div class="num"><i>4</i><div class="nb"><b id="term4T"></b><span id="term4S"></span></div></div>
      <div class="num"><i>5</i><div class="nb"><b id="term5T"></b><span id="term5S"></span></div></div>
    </div>

    <div class="notice">
      <div class="st" id="noticeT">📢 안내사항</div>
      <p id="noticeP"></p>
    </div>

    <div class="ft" id="ft"></div>
  </div>

  <div class="actions">
    <button class="back" id="backBtn" onclick="if(history.length>1)history.back();else location.href='coupon.html'"></button>
    <a class="wa" id="waBtn" href="https://wa.me/60172472774" target="_blank" rel="noopener"></a>
  </div>
</div>

<script>
var T={
  ko:{
    brand:'해피홈케어',pgTitle:'📌 상품권 / 할인권 이용 안내',pgSub:'GIFT VOUCHER · DISCOUNT COUPON GUIDE',pgGuideTag:'GUIDE',
    giftT:'💳 상품권 안내',
    giftP1:'본 상품권은 액면금액의 <b>10% 할인된 금액</b>으로 구매하실 수 있으며, 유효기간 내 언제든지 당사의 서비스를 이용할 수 있는 실속형 서비스 상품권입니다.',
    giftP2:'🎁 가족, 친구, 지인에게 감사의 마음을 전하는 선물용으로도 활용하실 수 있습니다.',
    discT:'🏷 할인권 안내',
    discP1:'할인권은 당사에서 진행하는 프로모션(할인 행사) 기간에 고객님께 제공되는 혜택입니다.',
    discP2:'※ 할인권은 양도 및 양수가 불가능합니다.',
    termsT:'✅ 이용 유의사항',
    term1T:'서비스 이용',term1S:'본 쿠폰은 당사의 모든 서비스에 사용 가능합니다.',
    term2T:'사용 한도',term2S:'서비스 1회 이용 시 최대 2장까지 사용할 수 있습니다.',
    term3T:'유효기간',term3S:'본 쿠폰은 유효기간 내에서만 사용 가능하며, 유효기간이 지난 쿠폰은 사용할 수 없습니다.',
    term4T:'양도·양수',term4S:'본 쿠폰은 등록된 고객 본인만 사용 가능합니다.<br>다만, 사전에 당사에 양도·양수 변경 신청을 하시면 사용자를 변경할 수 있습니다.<br><span class="sub-warn">※ 변경 신청은 구매(양도) 고객 본인만 가능합니다.</span>',
    term5T:'사용 가능일',term5S:'본 쿠폰은 발행 당일에는 사용할 수 없습니다.',
    noticeT:'📢 안내사항',
    noticeP:'본 쿠폰은 환불 및 취소가 불가능하며, 현금으로 교환되지 않습니다. 사용 후 발생한 잔액은 환불되지 않으며 자동 소멸됩니다.<br>기타 이용 문의는 Happy HomeCare 고객센터로 문의해 주시기 바랍니다.',
    ft:'Happy HomeCare · hhc-3p8.pages.dev · 📞 +60 17-247 2774',
    back:'← 내 쿠폰으로 돌아가기',wa:'📞 고객센터 문의 · WhatsApp'
  },
  en:{
    brand:'Happy Home Care',pgTitle:'📌 Gift Voucher / Discount Coupon Guide',pgSub:'GIFT VOUCHER · DISCOUNT COUPON GUIDE',pgGuideTag:'GUIDE',
    giftT:'💳 Gift Voucher',
    giftP1:'This gift voucher can be purchased at <b>10% off its face value</b>, and can be used for our services at any time within its validity period — great value for everyday use.',
    giftP2:'🎁 It also makes a thoughtful gift for family, friends, or anyone you\'d like to thank.',
    discT:'🏷 Discount Coupon',
    discP1:'Discount coupons are benefits provided to customers during our promotional (discount) campaigns.',
    discP2:'※ Discount coupons cannot be transferred or received by another person.',
    termsT:'✅ Terms of Use',
    term1T:'Service Use',term1S:'This coupon can be used for any of our services.',
    term2T:'Usage Limit',term2S:'Up to 2 coupons may be used per single service visit.',
    term3T:'Validity Period',term3S:'This coupon is valid only within its validity period; coupons past their validity date cannot be used.',
    term4T:'Transfer',term4S:'This coupon can only be used by the registered customer.<br>However, the user may be changed if a transfer request is submitted to us in advance.<br><span class="sub-warn">※ Only the purchaser (transferring customer) may submit a transfer request.</span>',
    term5T:'Usable Date',term5S:'This coupon cannot be used on the day it is issued.',
    noticeT:'📢 Notice',
    noticeP:'This coupon cannot be refunded, cancelled, or exchanged for cash. Any remaining balance after use is not refunded and will automatically expire.<br>For further inquiries, please contact Happy HomeCare customer service.',
    ft:'Happy HomeCare · hhc-3p8.pages.dev · 📞 +60 17-247 2774',
    back:'← Back to My Coupon',wa:'📞 Contact Us · WhatsApp'
  }
};
function gid(id){return document.getElementById(id);}
var LANG=(new URLSearchParams(location.search).get('lang')||'ko')==='en'?'en':'ko';
function setLang(l){
  LANG=l;
  var url=new URL(location.href);
  url.searchParams.set('lang',l);
  history.replaceState(null,'',url);
  render();
}
function render(){
  var t=T[LANG];
  document.documentElement.lang=LANG;
  gid('brandName').textContent=t.brand;
  gid('pgTitle').textContent=t.pgTitle;
  gid('pgSub').textContent=t.pgSub;
  gid('pgGuideTag').textContent=t.pgGuideTag;
  gid('giftT').textContent=t.giftT;
  gid('giftP1').innerHTML=t.giftP1;
  gid('giftP2').textContent=t.giftP2;
  gid('discT').textContent=t.discT;
  gid('discP1').textContent=t.discP1;
  gid('discP2').textContent=t.discP2;
  gid('termsT').textContent=t.termsT;
  for(var i=1;i<=5;i++){gid('term'+i+'T').textContent=t['term'+i+'T'];gid('term'+i+'S').innerHTML=t['term'+i+'S'];}
  gid('noticeT').textContent=t.noticeT;
  gid('noticeP').innerHTML=t.noticeP;
  gid('ft').textContent=t.ft;
  gid('backBtn').textContent=t.back;
  gid('waBtn').textContent=t.wa;
  gid('lang-ko-btn').classList.toggle('on',LANG==='ko');
  gid('lang-en-btn').classList.toggle('on',LANG==='en');
}
render();
</script>
</body>
</html>
