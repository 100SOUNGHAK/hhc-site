<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Happy Home Care · 이동 중</title>
<script>
/* ── 예전 주소 연결용 ────────────────────────────────────────────
   이 파일은 화면이 아니라 「길 안내」입니다.
   예전에 보낸 링크·즐겨찾기·QR코드가 이 주소를 가리키고 있어서,
   실제 화면인 coupon-info.html 로 그대로 넘겨 줍니다.
   ?view=... 같은 뒷부분도 함께 넘어가므로 인보이스·보고서가 정상적으로 열립니다.
   ※ 이 파일은 다시 고칠 필요가 없습니다. 화면 내용은 coupon-info.html 하나만 관리하시면 됩니다.
   ────────────────────────────────────────────────────────────── */
location.replace('coupon-info.html'+location.search+location.hash);
</script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,system-ui,sans-serif;
  background:#F6F8FC;color:#5A6478;text-align:center;padding:24px}
.b{background:#fff;border:1px solid #E4E9F2;border-radius:16px;padding:26px 28px;
  box-shadow:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.16)}
.t{font-size:15px;font-weight:800;color:#14192A;margin-bottom:6px}
.s{font-size:13px;line-height:1.7}
a{display:inline-block;margin-top:14px;background:#0E2350;color:#fff;text-decoration:none;
  font-size:13.5px;font-weight:800;border-radius:12px;padding:11px 20px}
</style>
</head>
<body>
<div class="b">
  <div class="t">화면을 여는 중입니다…</div>
  <div class="s">잠시만 기다려 주세요.<br>자동으로 넘어가지 않으면 아래를 눌러 주세요.</div>
  <a href="coupon-info.html" id="go">계속하기 →</a>
</div>
<script>
// 스크립트가 막힌 환경에서도 뒷부분(?view=... 등)이 유지되도록 링크를 맞춰 둡니다
try{document.getElementById('go').href='coupon-info.html'+location.search+location.hash;}catch(e){}
</script>
</body>
</html>
