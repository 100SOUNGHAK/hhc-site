<style>
:root{
  --navy-950:#08172b;--navy-900:#0f2540;--navy-800:#173a5e;
  --teal-700:#0f766e;
  --gold-700:#8f6f28;--gold-600:#b08d3a;--gold-500:#c9a44c;--gold-300:#e3c98a;--gold-50:#fbf5e6;
  --ink-900:#161d27;--ink-700:#333d4b;--ink-600:#4d5866;--ink-400:#8891a0;
  --line:#ece6d8;--cream:#faf7f0;--paper:#fdfcf9;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:#eef0f4;color:var(--ink-900);line-height:1.6;font-size:15px;letter-spacing:-.01em;word-break:keep-all}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.pg{max-width:520px;margin:0 auto;background:var(--cream);min-height:100vh;overflow:hidden;box-shadow:0 0 60px rgba(8,23,43,.1);
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* ── 머리 ── */
.pmh{position:relative;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 20px 64px;
  background:radial-gradient(90% 60% at 88% 0%,rgba(201,164,76,.22),transparent 62%),
             linear-gradient(170deg,var(--navy-950),var(--navy-900) 58%,#12314f)}
.pmh-top{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.pmh-top svg{width:30px;height:30px;flex:none}
.pmh-top b{font-size:12.5px;font-weight:800;letter-spacing:.08em;color:var(--gold-300)}
.lgb{margin-left:auto;display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.lgb button{min-width:40px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;color:rgba(255,255,255,.7)}
.lgb button.on{background:var(--gold-300);color:var(--navy-950)}
.pmh small{display:block;font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--gold-300);opacity:.9;margin-bottom:8px}
.pmh h1{font-size:26px;line-height:1.32;font-weight:850;letter-spacing:-.035em}

/* ── 방문 시간 카드 (머리 위로 겹침) ── */
.pmt{position:relative;margin:-44px 16px 0;padding:20px 20px 18px;border-radius:20px;background:var(--paper);
  box-shadow:0 1px 2px rgba(11,24,51,.10),0 8px 16px -4px rgba(11,24,51,.16),0 26px 44px -14px rgba(11,24,51,.34);
  display:flex;align-items:center;gap:16px}
.pmt-ic{width:58px;height:58px;flex:none;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(150deg,#173a5e,#0f2540);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 6px 14px -6px rgba(8,23,43,.6)}
.pmt-ic svg{width:32px;height:32px}
.pmt-lb{font-size:12px;font-weight:700;color:var(--ink-400)}
.pmt-tm{font-size:30px;font-weight:850;letter-spacing:-.04em;line-height:1.15;color:var(--navy-900);font-variant-numeric:tabular-nums}
.pmt-tm span{font-size:17px;font-weight:800;color:var(--gold-700);margin-left:4px;letter-spacing:-.02em}
.pmt-sb{font-size:12.5px;font-weight:650;color:var(--ink-600);margin-top:2px}

/* ── 안내 글 ── */
.pmb{margin:22px 16px 0;padding:22px 20px 20px;border-radius:18px;background:#fff;
  box-shadow:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.16)}
.pmb p{font-size:15.5px;line-height:1.78;color:var(--ink-700)}
.pmb p+p{margin-top:14px}
.pmb .hi{color:var(--ink-900);font-weight:750}
.pmb .tm{color:var(--navy-900);font-weight:850;background:linear-gradient(transparent 62%,rgba(227,201,138,.55) 0)}
.pmb .why{display:flex;gap:10px;margin:14px 0 14px;padding:13px 14px;border-radius:13px;background:var(--gold-50)}
.pmb .why i{font-style:normal;font-size:17px;line-height:1.5}
.pmb .why span{font-size:13.5px;line-height:1.6;color:var(--ink-600);font-weight:600}
.pmb .alt{display:flex;gap:10px;margin:12px 0 14px;padding:12px 14px;border-radius:13px;background:#eaf6f4}
.pmb .alt i{font-style:normal;font-size:16px;line-height:1.5}
.pmb .alt span{font-size:13.5px;line-height:1.6;color:#0b5f59;font-weight:700}
.pms{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:10px}
.pms svg{width:26px;height:26px;flex:none}
.pms b{display:block;font-size:14px;font-weight:800;color:var(--navy-900)}
.pms small{font-size:11.5px;color:var(--ink-400)}

/* ── 하단 고정 ── */
.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(250,247,240,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line)}
.cta .in{max-width:496px;margin:0 auto}
.cta a{display:flex;align-items:center;justify-content:center;gap:7px;min-height:50px;border-radius:14px;font-size:15px;font-weight:850;
  color:#fff;background:var(--teal-700);box-shadow:0 8px 18px -8px rgba(15,118,110,.7);transition:transform .14s var(--ease)}
.cta a:active{transform:scale(.97)}
.cta svg{width:18px;height:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.lgb,.cta{display:none}.pg{box-shadow:none;padding-bottom:0}}
</style>
<script src="/hhc-protect.js"></script>
</head>
<body>
<div class="pg">
  <header class="pmh">
    <div class="pmh-top">
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#173a5e"/><g fill="#e3c98a" transform="translate(20 20) scale(0.6)"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg>
      <b>HAPPY HOME CARE</b>
      <div class="lgb" role="group" aria-label="Language"><button type="button" data-l="ko">한국어</button><button type="button" data-l="en">EN</button></div>
    </div>
    <small id="kick"></small>
    <h1 id="ttl"></h1>
  </header>

  <section class="pmt">
    <div class="pmt-ic"><svg viewBox="0 0 24 24" fill="none" stroke="#e3c98a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg></div>
    <div>
      <div class="pmt-lb" id="tLb"></div>
      <div class="pmt-tm" id="tTm"></div>
      <div class="pmt-sb" id="tSb"></div>
    </div>
  </section>

  <section class="pmb">
    <p class="hi" id="p1"></p>
    <div class="why"><i>📍</i><span id="why"></span></div>
    <p id="p2"></p>
    <div class="alt"><i>🔄</i><span id="alt"></span></div>
    <p id="p3"></p>
    <div class="pms">
      <svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#0f2540"/><g fill="#e3c98a" transform="translate(20 20) scale(0.6)"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg>
      <div><b id="sg"></b><small>HAPPY WORKS SERVICES SDN. BHD.</small></div>
    </div>
  </section>
</div>
<div class="cta"><div class="in"><a id="bWa" href="#" target="_blank" rel="noopener"></a></div></div>
<script>
(function(){
var TEL='60172472774';
var q=new URLSearchParams(location.search);
var LANG=(q.get('lang')||'ko').toLowerCase()==='en'?'en':'ko';
var T={
 ko:{title:'방문 시간 양해 안내', kick:'VISIT TIME NOTICE', ttl:'방문 시간 안내드리며<br>양해 부탁드립니다',
     tLb:'안내드리는 방문 시간', tTm:'오후 3:30<span>전후</span>', tSb:'그날의 마지막 방문 시간대',
     p1:'죄송합니다, 고객님.',
     p2:'부득이하게 오후 마지막 방문 시간대인 <span class="tm">오후 3시 30분 전후</span>로 안내드릴 수 있는 점 너른 양해 부탁드립니다.',
     why:'고객님께서 계신 지역은 이동 거리가 다소 멀고, 인근 지역과 연계하여 방문할 수 있는 일정이 많지 않아 오전 방문 일정 배정이 어렵습니다.',
     alt:'인근 지역에 연계할 수 있는 일정이 생기는 경우에는 그 외 시간도 가능합니다.',
     p3:'고객님께서 원하시는 시간에 맞춰드리지 못하고 제한된 일정으로 안내드리는 점 다시 한번 죄송합니다.',
     sg:'해피홈케어 드림', wa:'왓츠앱으로 문의하기', waMsg:'안녕하세요, 방문 시간 안내 관련 문의드립니다.'},
 en:{title:'Visit time — our apologies', kick:'VISIT TIME NOTICE', ttl:'About your visit time —<br>our sincere apologies',
     tLb:'Visit time we can offer', tTm:'Around 3:30<span>PM</span>', tSb:'Our last visit slot of the day',
     p1:'We are sorry.',
     p2:'We can only offer you our last afternoon slot, <span class="tm">around 3:30 PM</span>. Thank you kindly for your understanding.',
     why:'Your area is quite far from our route, and there are few other visits nearby we can combine it with, so we are unable to schedule a morning visit.',
     alt:'If we have another visit nearby that we can combine, other times may also be possible.',
     p3:'We apologise once again for not being able to match the time you preferred and for offering only a limited schedule.',
     sg:'Happy Home Care', wa:'Ask us on WhatsApp', waMsg:'Hello, I have a question about my visit time.'}
};
var WA='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2Z"/></svg>';
function $(i){ return document.getElementById(i); }
function render(){
  var L=T[LANG];
  document.documentElement.lang=LANG;
  document.title=L.title+' | Happy Home Care';
  document.querySelectorAll('[data-l]').forEach(function(b){ b.classList.toggle('on', b.dataset.l===LANG); });
  ['kick','ttl','tLb','tTm','tSb','p1','p2','why','alt','p3','sg'].forEach(function(k){ $(k).innerHTML=L[k]; });
  var wa=$('bWa'); wa.innerHTML=WA+'<span>'+L.wa+'</span>';
  wa.href='https://wa.me/'+TEL+'?text='+encodeURIComponent(L.waMsg);
}
document.querySelectorAll('[data-l]').forEach(function(b){
  b.addEventListener('click',function(){
    if(LANG===b.dataset.l) return;
    LANG=b.dataset.l;
    try{var u=new URL(location.href); if(LANG==='en') u.searchParams.set('lang','en'); else u.searchParams.delete('lang'); history.replaceState(null,'',u);}catch(e){}
    render();
    var bk=document.querySelector('#hhcBackToCard span'); if(bk) bk.textContent=LANG==='en'?'Back to card':'명함으로';
  });
});
render();
})();
</script>
<!-- ── 전자명함에서 넘어온 방문자에게만 보이는 되돌아가기 버튼 (moveout.html 과 같은 방식) ── -->
<style>
.hhcbk{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:9990;display:none;align-items:center;gap:8px;padding:11px 17px 11px 13px;border-radius:999px;
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:14px;font-weight:700;letter-spacing:-.01em;color:#fdfcf9;
  background:linear-gradient(150deg,#173a5e,#0f2540);border:1px solid rgba(227,201,138,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 6px rgba(4,12,26,.35),0 14px 28px -12px rgba(4,12,26,.8);
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.hhcbk.on{display:inline-flex}
.hhcbk i{font-style:normal;color:#e3c98a;font-size:16px;line-height:1}
@media print{.hhcbk{display:none!important}}
</style>
<button type="button" class="hhcbk" id="hhcBackToCard"><i>&#8592;</i><span>명함으로</span></button>
<script>
(function(){
  try{
    var q = new URLSearchParams(location.search);
    if(q.get('pv') === '1' || q.get('embed') === '1') return;
    var en = String(q.get('lang') || '').toLowerCase() === 'en';
    var fromCard = q.get('from') === 'card' || (document.referrer || '').indexOf('/namecard') > -1 || /\/nce?(\?|$)/.test(document.referrer || '');
    if(!fromCard) return;
    var b = document.getElementById('hhcBackToCard'); if(!b) return;
    b.querySelector('span').textContent = en ? 'Back to card' : '명함으로';
    b.classList.add('on');
    function lift(){ var c = document.querySelector('.cta'); var h = c ? c.getBoundingClientRect().height : 0;
      b.style.bottom = 'calc(' + (14 + h) + 'px + env(safe-area-inset-bottom))'; }
    lift(); setTimeout(lift, 600); window.addEventListener('resize', lift);
    b.addEventListener('click', function(){
      if(history.length > 1){ history.back(); }
      else { location.href = '/namecard' + (en ? '?lang=en' : ''); }
    });
  }catch(e){}
})();
</script>
</body>
</html>
