/* ✨ 상단 회원권 · 포인트 카드 — 3D 금속 카드 (2026-11-18) */
.mstage{position:relative;margin-top:16px;padding-bottom:14px;perspective:1000px}
.mstage:after{content:'';position:absolute;left:12%;right:12%;bottom:0;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0));filter:blur(4px);z-index:0}
.mcard{margin-top:0!important;height:206px!important;border-radius:20px!important;z-index:1;transform-style:preserve-3d;
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(0)!important;transition:transform .5s cubic-bezier(.22,.61,.36,1),box-shadow .5s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1.5px rgba(227,201,138,.65),
    0 1px 0 #E3C98A,0 2px 0 #C9A44C,0 3px 0 #B08D3A,0 4px 0 #8F6F28,0 5px 0 #6E5418,
    0 18px 26px -8px rgba(0,0,0,.65),0 40px 60px -24px rgba(0,0,0,.8),0 0 46px -8px rgba(227,201,138,.38)!important}
.mcard.pc{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1.5px rgba(227,201,138,.6),
    0 1px 0 #E3C98A,0 2px 0 #C9A44C,0 3px 0 #B08D3A,0 4px 0 #8F6F28,0 5px 0 #6E5418,
    0 18px 26px -8px rgba(0,0,0,.6),0 40px 60px -24px rgba(0,0,0,.75),0 0 46px -8px rgba(126,224,195,.35)!important}
.mcard:active{--rx:2deg}
.mcard .shn{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;mix-blend-mode:screen;
  background:linear-gradient(112deg,rgba(255,255,255,0) 30%,rgba(255,240,200,.30) 45%,rgba(255,255,255,.08) 52%,rgba(255,255,255,0) 62%);background-size:280% 100%;background-position:var(--sx,130%) 0;animation:mcShn 6s ease-in-out infinite}
@keyframes mcShn{0%,60%{background-position:130% 0}100%{background-position:-60% 0}}
.mcard .glr{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;background:radial-gradient(120% 70% at var(--gx,20%) -10%,rgba(255,255,255,.22),rgba(255,255,255,0) 55%)}
.mcard .chip2{position:absolute;right:22px;top:62px;width:40px;height:30px;border-radius:7px;z-index:3;
  background:linear-gradient(135deg,#F6E3A8 0%,#C9A44C 45%,#E7CF8E 70%,#A9842F 100%);box-shadow:inset 0 0 0 1px rgba(90,60,0,.3),0 2px 4px rgba(0,0,0,.4)}
.mcard .chip2:before{content:'';position:absolute;inset:7px 10px;border:1px solid rgba(90,60,0,.35);border-radius:3px}
.mcard .v{filter:drop-shadow(0 1px 0 #7a5c17) drop-shadow(0 4px 6px rgba(0,0,0,.55))!important;font-size:36px!important}
.mcard .t span{text-shadow:0 1px 0 rgba(0,0,0,.6)}
.mcard>*:not(.shn):not(.glr):not(.chip2):not(.rim){position:relative;z-index:3}
.mcard>.pb{position:absolute!important}
/* 회원권 카드 : 정면에서 좌우로 천천히 돌아감 (손가락으로 만지면 따라 기울고, 떼면 다시 천천히 움직임) */
@property --ry{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --rx{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --gx{syntax:'<percentage>';inherits:false;initial-value:20%}
.mcard:not(.live){animation:mcSway 7.5s ease-in-out infinite;transition:box-shadow .5s!important}
@keyframes mcSway{0%,100%{--ry:-10deg;--rx:1.5deg;--gx:12%}50%{--ry:10deg;--rx:-1.5deg;--gx:88%}}
@property --ma{syntax:'<angle>';inherits:false;initial-value:0deg}
.mcard .rim{position:absolute!important;inset:0;border-radius:inherit;padding:1.8px;z-index:4;pointer-events:none;
  background:conic-gradient(from var(--ma),rgba(227,201,138,.18) 0deg,#FFF4CF 38deg,#E3C98A 62deg,rgba(227,201,138,.18) 110deg,rgba(227,201,138,.18) 200deg,#F6E3A8 238deg,#C9A44C 258deg,rgba(227,201,138,.18) 300deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:mcRim 6s linear infinite}
@keyframes mcRim{to{--ma:360deg}}
.mstage:before{content:'';position:absolute;left:4%;right:4%;top:8%;bottom:4%;border-radius:32px;z-index:0;pointer-events:none;
  background:radial-gradient(60% 65% at 50% 55%,rgba(227,201,138,.55),rgba(227,201,138,0) 72%);filter:blur(20px);animation:mcGlow 4.5s ease-in-out infinite}
.mstage:has(.pc):before{background:radial-gradient(60% 65% at 50% 55%,rgba(126,224,195,.45),rgba(126,224,195,0) 72%)}
@keyframes mcGlow{0%,100%{opacity:.5;transform:scale(.97)}50%{opacity:1;transform:scale(1.02)}}
.mcard .t span{background:linear-gradient(90deg,#F3DFA6,#FFF8E1 45%,#C9A44C 70%,#F3DFA6);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;text-shadow:none!important;filter:drop-shadow(0 1px 0 rgba(0,0,0,.55));animation:mcFoil 5s ease-in-out infinite}
@keyframes mcFoil{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.mcard .v{font-size:38px!important}
@media (prefers-reduced-motion:reduce){.mcard{transform:none!important;animation:none!important}.mcard .shn,.mcard .rim,.mstage:before,.mcard .t span{animation:none}}
/* 엄지 영역: 아래 고정 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(250,249,246,0),var(--paper) 30%)}
.dock-in{max-width:448px;margin:0 auto;display:flex;gap:8px}
.dock .ib{width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;color:var(--n);box-shadow:0 1px 2px rgba(11,24,51,.08),0 8px 18px -10px rgba(11,24,51,.35);flex:none}
.dock .bk{flex:1;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:850;color:#3B2A06;
  background:linear-gradient(180deg,#F3DFA6,#C9A44C);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 12px 22px -10px rgba(140,100,20,.7)}
button:active{transform:scale(.97)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,8px);opacity:0;background:rgba(14,35,80,.94);color:#fff;font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:14px;transition:.22s;pointer-events:none;white-space:nowrap;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.mcard{transform:none}}

/* 기존 마이페이지 포인트 창(ptx) — 전체 화면으로 */
.ptx-ov{position:fixed;inset:0;z-index:120;display:flex;justify-content:center;background:rgba(8,20,45,.55);opacity:0;transition:opacity .22s}
.ptx-ov.on{opacity:1}
.ptx{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;overflow:hidden;background:#f4f7fb;transform:translateY(30px);transition:transform .32s cubic-bezier(.22,.8,.28,1);font-family:Pretendard,system-ui,sans-serif;color:#14192a;letter-spacing:-.02em}
.ptx-ov.on .ptx{transform:none}
.ptx-hd{position:relative;isolation:isolate;flex-shrink:0;color:#fff;padding:calc(14px + env(safe-area-inset-top)) 20px 18px;background:linear-gradient(150deg,#0b5f59,#0f766e 60%,#14958a);box-shadow:inset 0 -1px 0 rgba(0,0,0,.12)}
.ptx-hd:before{content:"";position:absolute;z-index:-1;inset:0 0 0 38%;background:url(mp-bg-points.jpg) right center/cover no-repeat;opacity:.42;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 60%);mask-image:linear-gradient(90deg,transparent 0,#000 60%)}
.ptx-hd:after{content:"";position:absolute;z-index:-1;inset:0;pointer-events:none;background:linear-gradient(158deg,rgba(255,255,255,.18) 0,rgba(255,255,255,0) 40%),linear-gradient(rgba(0,0,0,0) 50%,rgba(4,40,38,.32))}
.ptx-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ptx-tt span{display:block;font-size:15.5px;font-weight:900}
.ptx-tt em{display:block;font-style:normal;font-size:11.5px;font-weight:700;opacity:.78;margin-top:2px}
.ptx-x0{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.ptx-k{margin-top:16px;font-size:11.5px;font-weight:800;opacity:.8}
.ptx-v{display:block;width:fit-content;margin-top:2px;font-size:38px;font-weight:900;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums;background:linear-gradient(#fff6da 0%,#ffe29a 38%,#e9b94a 62%,#f7d27a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 1px 0 #9a7322) drop-shadow(0 3px 5px rgba(0,0,0,.45))}
.ptx-v small{font-size:20px}
.ptx-bar{margin-top:14px;height:8px;border-radius:9px;background:rgba(0,0,0,.26);box-shadow:inset 0 2px 3px rgba(0,0,0,.4),0 1px 0 rgba(255,255,255,.14);overflow:hidden}
.ptx-bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(#fff0c2 0%,#f2c96a 45%,#c99a2e 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 8px rgba(242,201,106,.55)}
.ptx-bl{margin-top:6px;text-align:right;font-size:10.5px;font-weight:800;opacity:.82}
.ptx-st{display:grid;grid-template-columns:1fr 1fr .7fr;gap:8px;margin-top:12px}
.ptx-st>div{padding:9px 11px;border-radius:12px;background:linear-gradient(158deg,rgba(255,255,255,.17),rgba(255,255,255,.07));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.ptx-st span{display:block;font-size:10.5px;font-weight:800;opacity:.8;white-space:nowrap}
.ptx-st b{display:block;margin-top:2px;font-size:15px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.ptx-st .e b{color:#b6f5da}.ptx-st .u b{color:#ffd0d0}
.ptx-tabs{flex-shrink:0;display:flex;gap:6px;padding:12px 16px 10px;background:#f4f7fb}
.ptx-tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px 6px;border-radius:999px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:900;color:#5a6478;background:#fff;border:1px solid #e4e9f2;box-shadow:0 1px 2px rgba(14,35,80,.05)}
.ptx-tabs button i{font-style:normal;font-size:11px;font-weight:900;min-width:20px;padding:1px 6px;border-radius:999px;background:#eef2f8;color:#5a6478}
.ptx-tabs button.on{background:#0e2350;border-color:#0e2350;color:#fff;box-shadow:0 1px 2px rgba(14,35,80,.2),0 6px 14px -6px rgba(14,35,80,.5)}
.ptx-tabs button.on i{background:rgba(255,255,255,.18);color:#f3d89a}
.ptx-bd{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 16px calc(22px + env(safe-area-inset-bottom))}
.ptx-mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 4px 8px}
.ptx-mh:first-child{margin-top:4px}
.ptx-mh b{font-size:13px;font-weight:900}
.ptx-mh i{font-style:normal;font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:#e7f7ef;color:#0e7a4f}
.ptx-r{display:grid;grid-template-columns:46px minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 14px 11px 11px;margin-bottom:8px;background:#fff;border-radius:15px;box-shadow:0 1px 2px rgba(14,35,80,.06),0 8px 18px -10px rgba(14,35,80,.22);animation:ptxIn .32s cubic-bezier(.22,.8,.28,1) both}
@keyframes ptxIn{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
.ptx-d{height:50px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ptx-d b{font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.ptx-d span{margin-top:4px;font-size:10.5px;font-weight:800;opacity:.75}
.ptx-r.earn .ptx-d{background:linear-gradient(#eaf7f4,#d9f0eb);color:#0b5f59;box-shadow:inset 0 0 0 1px #cbe8e1}
.ptx-x{min-width:0}
.ptx-x b{display:block;font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptx-x span{display:block;margin-top:3px;font-size:11.5px;font-weight:600;color:#7a8498;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.ptx-a{text-align:right}
.ptx-a b{display:block;font-size:15.5px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap;color:#0e9b63}
.ptx-a span{display:block;margin-top:3px;font-size:10.5px;font-weight:700;color:#98a1b4;white-space:nowrap}
.ptx-none{margin:18px 0 8px;padding:26px 18px;text-align:center;font-size:13px;font-weight:700;line-height:1.6;color:#5a6478;background:#fff;border-radius:15px;border:1px dashed #d5dce8;word-break:keep-all}
.ptx-in{margin-top:14px;background:#fff;border-radius:14px;box-shadow:0 1px 2px rgba(14,35,80,.05)}
.ptx-in .sm{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:13px 15px 8px;font-size:12.5px;font-weight:900;color:#0e2350}
.ptx-in .sm span{font-size:11px;font-weight:800;color:#8f6f28;background:#fbf5e6;border-radius:999px;padding:3px 9px;white-space:nowrap}
.ptx-in>div:last-child{padding:0 15px 14px;font-size:12px;line-height:1.7;color:#5a6478;word-break:keep-all}
.ptx-in .key{display:block;margin:2px 0 6px;padding:9px 11px;border-radius:10px;background:#E7F6EF;color:#0B6B45;font-weight:800}
@media (prefers-reduced-motion:reduce){.ptx,.ptx-ov{transition:none}.ptx-r{animation:none}}

function repaint(title,body,foot){const sh=stack[1];if(!sh)return false;sh.querySelector('.shx-h b').innerHTML=title;const b=sh.querySelector('.shx-b'),y=b.scrollTop;b.innerHTML=body;b.scrollTop=y;const f=sh.querySelector('.shx-f');if(f)f.innerHTML=foot||'';return true;}

    case 'fee':el=q('#sec-fee');break;
    case 'ap':el=q('#a2hs-card');break;
  }
  if(open){setTimeout(()=>{try{open();}catch(e){}},200);return;}
  if(!el)return;
  const center=()=>{const r=el.getBoundingClientRect(),y=r.top+scrollY-Math.max(60,(innerHeight-r.height)/2);try{scrollTo({top:Math.max(0,y),behavior:'smooth'});}catch(e){scrollTo(0,Math.max(0,y));}};
  center();setTimeout(center,650);
  setTimeout(()=>{
    el.classList.add('hi-focus');
    const chip=document.createElement('span');chip.className='hi-chip';const en=LANG==='en';
    if(FOCUS==='rw')el.classList.add('rw-hit');
    chip.textContent=FOCUS==='rw'?('💎 '+(FOCUS_PA?(en?'RM '+FOCUS_PA+' added':'RM '+FOCUS_PA+' 적립되었습니다'):(en?'Points added':'적립금이 추가되었습니다')))
      :FOCUS==='sv'?(en?'📌 Request here':'📌 여기서 바로 의뢰하세요'):(en?'📌 Please check here':'📌 여기를 확인해 주세요');
    let ov='';try{ov=getComputedStyle(el).overflow;}catch(e){}
    if(ov==='hidden'||ov==='clip'||ov==='auto'||/auto|hidden/.test(getComputedStyle(el).overflowX||'')){el.classList.add('hi-inset');chip.classList.add('inset');}
    el.appendChild(chip);setTimeout(()=>el.classList.add('done'),8300);
  },620);
  setTimeout(()=>{const off=()=>{hiClear();['pointerdown','touchstart'].forEach(ev=>removeEventListener(ev,off,true));};['pointerdown','touchstart'].forEach(ev=>addEventListener(ev,off,true));setTimeout(off,20000);},1200);
}

nd on rescheduling (based on the confirmed visit date)","feeR1":"More than 2 weeks left","feeR2":"3 days – 2 weeks left","feeR3":"Within 3 days","feeR4":"Within 1 day","feeRNo":"No refund","feePkg":"Package members are exempt from the minimum charge, parking fee and booking deposit.","noidApp":"<b>The app was installed without your customer link.</b><br><span style=\"font-size:13.5px;line-height:1.6;display:block;margin-top:8px\">Please open your MY PAGE link from WhatsApp in <b>Safari</b> again,<br>then tap Share (↑) → <b>Add to Home Screen</b> to reinstall.<br>(You can delete the current icon.)</span>","a2T":"📱 Install the Happy HomeCare App","a2S":"Install once and open your page anytime from a home-screen icon — no link needed.","a2Btn":"📱 Install Now","a2go":"Tap the button and your phone will show an install dialog — tap \"Install\" and the icon appears on your home screen!","a2kBtn":"🌐 Open in Default Browser (Chrome)","a2k1":"App installation is limited inside KakaoTalk, so we open your default browser","a2k2":"On the opened page, tap \"📱 Install Now\" — done!","a2dT":"✅ App installed","a2dS":"Open it anytime from the Happy HomeCare icon on your home screen.","a2i1":"Tap the Share button at the bottom of Safari","a2i2":"Choose \"Add to Home Screen\"","a2i3":"Tap \"Add\" at the top right — done!","a2a1":"Open the browser menu ( ⋮ )","a2a2":"Choose \"Add to Home screen\" or \"Install app\"","a2sBtn":"🌐 Open in Chrome to Install","a2s1":"Tap the button above to open this page in Chrome","a2s2":"On the page opened in Chrome, tap \"📱 Install Now\" — done!","a2s3":"Installing directly from Samsung Internet triggers a security warning, so Chrome is recommended"}};
// ── PWA : 홈 화면 설치 ──
const IS_APP=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
// iOS 판별은 UA 문자열만 믿지 않습니다 — 「데스크탑 웹사이트 요청」·추적 방지 설정 등으로 UA 에 iPhone 이
// 빠지면 Android 용 manifest 가 연결되어, 홈 화면 앱이 고객번호(c=) 없는 주소로 열리는 문제가 있었습니다.

//  · MacIntel + 터치 = iPadOS / 데스크탑 모드 iPhone
const IS_IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)
  ||(typeof navigator.standalone!=='undefined')
  ||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

//  · 카카오톡·삼성 인터넷에서 기본 브라우저로 넘어올 때 주소에 install=1 을 실어 보내고,
//    새로 열린 브라우저는 이 표시를 보고 설치 창구를 화면 위에 바로 띄웁니다.
//  · 앱 설치 안내 발송(f=ap)으로 열려도 똑같이 바로 띄웁니다.
function a2InstallSearch(){
  const q=new URLSearchParams(location.search);
  q.set('install','1');
  return '?'+q.toString();
}
// ── 🌐 고객에게 보내는 주소는 「항상 정식 도메인」으로 만듭니다 ──
//    관리자가 옛 주소(hhc-3p8.pages.dev)나 www· .my 주소로 화면을 열어 두었더라도
//    발송 메시지의 링크는 happyhomecare.com.my 로 통일됩니다.
//    (localhost·file: 등 시험 환경에서는 지금 주소를 그대로 씁니다)
function hhcOrigin(){
  try{
    if(location.protocol==='file:')return 'https://happyhomecare.com.my';
    var h=location.hostname||'';
    if(h==='localhost'||h==='127.0.0.1'||h==='::1'||/^192\.168\./.test(h)||/^10\./.test(h))
      return location.origin;
    return 'https://happyhomecare.com.my';
  }catch(e){return 'https://happyhomecare.com.my';}
}
function a2InstallUrl(){return hhcOrigin()+location.pathname+a2InstallSearch()+location.hash;}
function a2mClose(){

}

      '<div class="a2hs-st"><span class="n">2</span><span>'+L.a2s2+'</span></div></div>';
  }else{
    // Android Chrome 등 — 버튼 한 번이면 휴대폰 설치창이 뜹니다
    body='<button type="button" class="a2hs-btn pulse" id="a2m-install">'+L.a2Btn+'</button>'+

// ══ 📱 「지금 설치하기」 → 큰 단계 안내 팝업 (2026-11-16) ══════════════════════
//  · 안드로이드(설치창 있음) : 휴대폰 설치창과 함께 위쪽에 「설치를 눌러 주세요」 → 설치하면 「설치 완료」
//  · 안드로이드(설치창 없음) : ⋮ 메뉴 → 홈 화면에 추가 → 설치 — 3단계 그림 안내 (오른쪽 위 ⋮ 자리에 손가락)
//  · 아이폰(Safari)          : 공유(↑) → 홈 화면에 추가 → 추가 — 3단계 그림 안내 (아래 공유 버튼 자리에 손가락)
//  · 마이페이지 설치 카드 · 설치 오버레이(install=1) 두 곳의 버튼이 함께 씁니다
async function a2Install(btn){
  a2mClose();
  if(IS_IOS){igOpen('ios');return;}
  if(btn)btn.disabled=true;
  // 설치 이벤트가 아직 도착 전이면 잠시(최대 3.5초) 기다립니다 — 페이지가 열리자마자 눌러도 동작하게
  let waited=0;
  while(!_a2hsEv&&waited<3500){await new Promise(r=>setTimeout(r,250));waited+=250;}
  if(!_a2hsEv){if(btn)btn.disabled=false;igOpen('and');return;}   // 설치창을 지원하지 않는 브라우저
  igOpen('prompt');
  _a2hsEv.prompt();
  let ch=null;try{ch=await _a2hsEv.userChoice;}catch(e){}
  _a2hsEv=null;if(btn)btn.disabled=false;
  if(ch&&ch.outcome==='accepted'){a2hsDone();igOpen('done');}
  else igClose();
}

function toEn(t){
  t=String(t||'');
  if(!/[\uAC00-\uD7A3]/.test(t))return t;      // 이미 영문이면 그대로
  // 단어 사이에 띄어쓰기가 없어도 붙지 않게 앞뒤로 한 칸씩 띄워 바꿉니다 (예: 교체수리 → replacement repair)
  for(var i=0;i<_RPK.length;i++){if(t.indexOf(_RPK[i])>=0)t=t.split(_RPK[i]).join(' '+RP_EN[_RPK[i]]+' ');}
  t=t.replace(/(\d+)\s*\uB300(?![\uAC00-\uD7A3])/g,function(m,q){return q+(q==='1'?' unit':' units');});
  t=t.replace(/(\d+)\s*\uAC1C(?![\uAC00-\uD7A3])/g,function(m,q){return q+(q==='1'?' item':' items');});
  t=t.replace(/\(\s+/g,'(').replace(/\s+\)/g,')');
  // 남은 한국어 조사·어미를 정리합니다
  t=t.replace(/[\uAC00-\uD7A3]+/g,' ')
     .replace(/\s{2,}/g,' ')
     .replace(/\s+([,.])/g,'$1')
     .replace(/\s*·\s*/g,' · ')
     .replace(/^[\s·,]+|[\s·,]+$/g,'')
     .trim();
  return t;
}

function dparse(s){const m=String(s==null?'':s).match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d.getTime())?null:d;}
function bkTimeLb(t){
  t=String(t==null?'':t);
  if(LANG!=='en'&&t.indexOf('|')>=0)return t.split('|')[0].trim();   // 「13:30 전후|Around 13:30」 → 한국어 쪽만
  if(LANG!=='en'||!t)return t;
  if(t.indexOf('|')>=0)return t.split('|')[1].trim()||t.split('|')[0].trim();
  var m=t.match(/^\s*(.+?)\s*전후\s*$/);
  if(m)return 'Around '+m[1];
  return t.replace(/오전\s*/g,'').replace(/오후\s*/g,'')
          .replace(/(\d{1,2})\s*시\s*(\d{1,2})\s*분/g,'$1:$2')
          .replace(/(\d{1,2})\s*시/g,'$1:00')
          .replace(/전후/g,'').trim();
}
function bkMinutes(t){
  t=String(t==null?'':t);
  if(!t)return null;
  const pm=/오후|PM|P\.M\./i.test(t), am=/오전|AM|A\.M\./i.test(t);
  let h=null,mi=0;
  const m1=t.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if(m1){h=parseInt(m1[1],10);mi=parseInt(m1[2],10);}
  else{
    const m2=t.match(/(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/);
    if(m2){h=parseInt(m2[1],10);mi=m2[2]?parseInt(m2[2],10):0;}
  }
  if(h==null||isNaN(h)||isNaN(mi))return null;
  if(pm&&h<12)h+=12;
  if(am&&h===12)h=0;
  if(h>23||mi>59)return null;
  return h*60+mi;
}

function bkHideAt(x){
  const d=dparse(x&&x.booking_date);
  if(!d)return null;
  const t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0,0);
  const mm=bkMinutes(x&&x.booking_time);
  if(mm==null)t.setDate(t.getDate()+1);
  else t.setMinutes(mm);
  return t.getTime();
}

// 고객명 한 줄 맞춤 : 넘치면 0.5px씩 줄여 한 줄에 맞춤(최소 15px, 그래도 넘치면 … 처리)
function nmFit(){const e=document.querySelector('.wel .nm');if(!e)return;e.style.fontSize='';
  let f=parseFloat(getComputedStyle(e).fontSize)||26;while(e.scrollWidth>e.clientWidth+1&&f>15){f-=.5;e.style.fontSize=f+'px';}}
addEventListener('resize',()=>{clearTimeout(nmFit._t);nmFit._t=setTimeout(nmFit,120);});
try{document.fonts&&document.fonts.ready.then(nmFit);}catch(e){}
function mcTilt(){const m=document.querySelector('.mcard');if(!m||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  // 손가락·마우스로 만지는 동안만 그 방향으로 기울고(.live), 떼면 1.2초 뒤 다시 천천히 좌우로 돌아갑니다
  let tm=null;
  m.onpointermove=e=>{clearTimeout(tm);m.classList.add('live');const r=m.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;m.style.setProperty('--ry',(x*16).toFixed(2)+'deg');m.style.setProperty('--rx',(-y*10).toFixed(2)+'deg');m.style.setProperty('--gx',((x+.5)*100).toFixed(0)+'%');m.style.setProperty('--sx',(100-(x+.5)*120).toFixed(0)+'%');};
  m.onpointerleave=m.onpointerup=m.onpointercancel=()=>{clearTimeout(tm);tm=setTimeout(()=>{['--ry','--rx','--gx','--sx'].forEach(k=>m.style.removeProperty(k));m.classList.remove('live');},1200);};}
let PMPOS='care',TLN=2,ALN=2,IVN=4,SELM=false,SEL=[];
function bkTitle(it){const segs=String(it).split(/\),\s*/);const s0=segs[0];const nm=s0.split('(')[0];const m=s0.match(/\((\d+대)(?:\/([^)]*))?/g);const last=m?m[m.length-1].replace(/^\(/,''):'';const [cnt,meth]=last.split('/');return nm+(cnt&&/대/.test(cnt)?' '+cnt:'')+(meth?' · '+meth.split('·').pop().trim():'')+(segs.length>1?' 외 '+(segs.length-1)+'건':'');}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-almore]')){e.stopPropagation();const y=scrollY;ALN=999;render();scrollTo(0,y);return;}
  if(e.target.closest('[data-alless]')){e.stopPropagation();ALN=2;render();const h=[...document.querySelectorAll('.h h2')].find(x=>/확인이 필요해요|Needs your attention/.test(x.textContent));if(h)scrollTo({top:h.getBoundingClientRect().top+scrollY-12});return;}
  if(e.target.closest('[data-more]')){e.stopPropagation();const y=scrollY;TLN=999;render();scrollTo(0,y);return;}
  if(e.target.closest('[data-less]')){e.stopPropagation();TLN=2;render();const h=[...document.querySelectorAll('.h h2')].find(x=>/서비스 이력|Service history/.test(x.textContent));if(h)scrollTo({top:h.getBoundingClientRect().top+scrollY-12});return;}
  if(e.target.closest('[data-goiv]')){e.stopPropagation();const el=document.getElementById('s-iv');if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-12,behavior:'smooth'});return;}
  if(e.target.closest('[data-ivmore]')){e.stopPropagation();IVN=99;render();return;}
  const sm=e.target.closest('[data-selm]');if(sm){e.stopPropagation();SELM=!SELM;SEL=[];const y=scrollY;render();scrollTo(0,y);return;}
  const pk=e.target.closest('[data-pick]');if(pk){e.stopPropagation();const n=pk.dataset.pick;SEL=SEL.includes(n)?SEL.filter(x=>x!==n):SEL.concat(n);const y=scrollY;render();scrollTo(0,y);return;}
},true);
document.addEventListener('click',e=>{const l=e.target.closest('[data-l]');if(l){LANG=l.dataset.l;render();return;}const a=e.target.closest('[data-a]');if(a){SX.setRet(null);SX.act(a.dataset.a,a);return;}if(e.target.closest('[data-t]'))toast();});
document.addEventListener('DOMContentLoaded',boot);

</script>
<script>
/* 🛡 관리자 휴대폰 안내 줄 (2026-11-23) — PIN_OTHER 가 있을 때(관리자 기기 + 앱 고객이 다른 고객)만 보입니다. 고객 휴대폰에는 뜨지 않음. */
(function(){

  function show(){

    const s=document.createElement('style');
    s.textContent='#pin-bar{position:fixed;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:9600;background:#0B1833;color:#fff;border:1px solid rgba(227,201,138,.55);border-radius:14px;padding:10px 12px;box-shadow:0 10px 28px rgba(11,24,51,.35);font-size:12.5px;line-height:1.5;display:flex;gap:9px;align-items:center}'+
      '#pin-bar .t{flex:1;min-width:0}#pin-bar b{color:#E3C98A}#pin-bar button{border:0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:12px;cursor:pointer}'+
      '#pin-bar .go{background:#E3C98A;color:#0B1833}#pin-bar .x{background:rgba(255,255,255,.12);color:#fff;padding:8px 9px}';
    document.head.appendChild(s);
    const b=document.createElement('div');b.id='pin-bar';
    b.innerHTML='<div class="t">🛡 <b>관리자 휴대폰</b> · 설치된 마이페이지 앱은 다른 고객으로 유지됩니다 (이 고객으로 바뀌지 않음)</div>'+
      '<button type="button" class="go">이 고객으로 앱 바꾸기</button><button type="button" class="x" aria-label="닫기">✕</button>';
    b.querySelector('.go').onclick=function(){myPinSave();PIN_OTHER='';b.innerHTML='<div class="t">✅ 설치된 마이페이지 앱을 이 고객으로 바꿨습니다</div>';setTimeout(function(){b.remove();},2200);};
    b.querySelector('.x').onclick=function(){b.remove();};
    document.body.appendChild(b);
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',show);else show();
})();
</script>
