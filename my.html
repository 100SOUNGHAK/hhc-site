<!-- ═══ 문서 뷰어 오버레이 — 닫으면 마이페이지로 그대로 복귀 ═══ -->
<div id="mv-wrap">
  <div id="mv-bar">
    <button id="mv-back">←</button>
    <span id="mv-ttl">문서</span>
    <button id="mv-x">✕ 닫기</button>
  </div>
  <div id="mv-body"><div id="mv-load">불러오는 중...</div></div>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   앱 안에서 문서 열기 (새 탭 금지)

   왜 필요한가 :
    · 카카오톡·왓츠앱의 인앱 브라우저는 target="_blank" 로 열린 창의 「✕」를 누르면
      새로 열린 문서뿐 아니라 인앱 브라우저 전체가 닫힙니다 → 마이페이지까지 사라짐
    · 홈 화면에 설치한 앱(PWA)에서도 새 탭이 앱 밖으로 나가 버려 돌아올 수 없습니다
   그래서 같은 사이트 주소는 모두 이 오버레이(iframe) 안에서 열고,
   「✕ 닫기」 · 「←」 · 휴대폰 뒤로가기 로 항상 마이페이지로 돌아옵니다.
   ───────────────────────────────────────────────────────────── */
(function(){
  var EN=(new URLSearchParams(location.search).get('lang')==='en');
  var stack=[];             // 문서 이동 기록 (문서 안에서 또 문서를 열 때)
  var isOpen=false, pushed=false;
  var wrap,bar,body,ttlEl,backEl;

  function g(id){return document.getElementById(id);}
  function T(ko,en){return EN?en:ko;}

  // 문서 종류별 제목
  function titleOf(url){
    var f=String(url).split('?')[0].split('#')[0].split('/').pop().toLowerCase();
    var M={
      'hhc-invoice.html':T('🧾 인보이스','🧾 Invoice'),
      'hhcinvoice.html' :T('🧾 인보이스','🧾 Invoice'),
      'inspect.html'    :T('🔧 점검 보고서','🔧 Inspection Report'),
      'install.html'    :T('🔩 설치 보고서','🔩 Installation Report'),
      'washer.html'     :T('🧺 세탁기 보고서','🧺 Washer Report'),
      'admin.html'      :T('📑 계약서 · 이용내역','📑 Contract · Usage'),
      'coupon.html'     :T('🎫 상품권 · 할인권','🎫 Voucher'),
      'quote.html'      :T('🧾 견적서','🧾 Quotation'),
      'booking.html'    :T('📅 예약 확인','📅 Booking'),
      'request.html'    :T('📝 서비스 의뢰','📝 Service Request'),
      'home.html'       :T('🏠 가격 · 서비스 안내','🏠 Prices & Services'),
      'home'            :T('🏠 가격 · 서비스 안내','🏠 Prices & Services')
    };
    return M[f]||T('📄 문서','📄 Document');
  }

  // 이 사이트 안의 주소인지 (외부 링크 · 전화 · 왓츠앱은 그대로 둔다)
  function internal(href){
    if(!href)return false;
    if(/^(tel:|mailto:|sms:|javascript:|blob:|data:)/i.test(href))return false;
    if(href.charAt(0)==='#')return false;
    var u;
    try{u=new URL(href,location.href);}catch(e){return false;}
    if(u.protocol!=='http:'&&u.protocol!=='https:')return false;
    if(u.origin===location.origin)return true;
    return /(^|\.)hhc-3p8\.pages\.dev$/i.test(u.hostname) || /(^|\.)happyhomecare\.com\.my$/i.test(u.hostname);
  }

  function paint(){
    ttlEl.textContent=stack.length?stack[stack.length-1].t:T('문서','Document');
    backEl.classList.toggle('on',stack.length>1);
    g('mv-x').textContent=T('✕ 닫기','✕ Close');
  }

  function load(url){
    body.innerHTML='<div id="mv-load">'+T('불러오는 중...','Loading...')+'</div>';
    var f=document.createElement('iframe');
    f.setAttribute('title',T('문서 보기','Document'));
    f.setAttribute('allow','clipboard-write; clipboard-read');
    f.onload=function(){
      var l=g('mv-load');if(l)l.classList.add('off');
      hook(f);
    };
    f.src=url;
    body.appendChild(f);
  }

  // 문서 페이지가 스스로 창을 닫거나 새 탭을 열려고 하면 가로채서
  // 앱이 아니라 이 오버레이 안에서만 처리되도록 한다
  function hook(f){
    var cw;
    try{cw=f.contentWindow;}catch(e){return;}
    if(!cw)return;
    try{cw.close=function(){window.mvClose();};}catch(e){}
    try{cw.history.back=function(){window.mvBack();};}catch(e){}
    try{cw.open=function(u){ if(internal(u))mvPush(String(u)); else try{window.open(u,'_blank','noopener');}catch(e){} return null; };}catch(e){}
    try{
      cw.document.addEventListener('click',function(ev){
        var a=ev.target&&ev.target.closest?ev.target.closest('a[href]'):null;
        if(!a)return;
        var href=a.getAttribute('href')||'';
        if(!internal(href))return;                 // 왓츠앱·전화 링크는 그대로
        if(a.target!=='_blank')return;             // 같은 화면 안 이동은 그대로
        ev.preventDefault();ev.stopPropagation();
        mvPush(a.href);
      },true);
      cw.document.addEventListener('keydown',function(k){if(k.key==='Escape')window.mvClose();});
    }catch(e){}
  }

  function mvPush(url){
    stack.push({u:url,t:titleOf(url)});
    paint();load(url);
  }

  window.mvOpen=function(url,title){
    wrap=g('mv-wrap');if(!wrap)return false;
    bar=g('mv-bar');body=g('mv-body');ttlEl=g('mv-ttl');backEl=g('mv-back');
    stack=[{u:url,t:title||titleOf(url)}];
    paint();load(url);
    wrap.classList.add('open');
    isOpen=true;
    document.body.style.overflow='hidden';
    // 휴대폰 뒤로가기로도 닫히도록 기록을 하나 남긴다
    try{history.pushState({mv:1},'');pushed=true;}catch(e){pushed=false;}
    return false;
  };
  window.mvBack=function(){
    if(stack.length>1){stack.pop();paint();load(stack[stack.length-1].u);}
    else window.mvClose();
  };
  window.mvClose=function(fromPop){
    if(!isOpen)return;
    isOpen=false;stack=[];
    if(wrap)wrap.classList.remove('open');
    if(body)body.innerHTML='<div id="mv-load">'+T('불러오는 중...','Loading...')+'</div>';
    document.body.style.overflow='';
    // 남겨 둔 기록은 우리가 만든 것이 확실할 때만 되돌린다.
    // (문서가 기록을 더 쌓은 경우 무리하게 뒤로 가면 앱 밖으로 나가 버린다)
    if(!fromPop&&pushed){
      pushed=false;
      try{if(history.state&&history.state.mv)history.back();}catch(e){}
    }else pushed=false;
  };
  window.addEventListener('popstate',function(){if(isOpen)window.mvClose(true);});
  document.addEventListener('keydown',function(k){if(k.key==='Escape'&&isOpen)window.mvClose();});

  // 마이페이지 안의 모든 「새 탭」 링크를 오버레이로 돌린다
  document.addEventListener('click',function(ev){
    if(ev.defaultPrevented)return;
    if(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.button===1)return;   // PC의 새 탭 열기는 그대로 허용
    var a=ev.target&&ev.target.closest?ev.target.closest('a[href]'):null;
    if(!a)return;
    if(a.getAttribute('target')!=='_blank')return;
    var href=a.getAttribute('href')||'';
    if(!internal(href))return;                                       // 왓츠앱 등 외부는 그대로 새 탭
    ev.preventDefault();
    window.mvOpen(a.href,a.getAttribute('data-mvt')||'');
  },true);

  // 버튼 연결
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.getElementById('mv-back'),x=document.getElementById('mv-x');
    if(b)b.onclick=function(){window.mvBack();};
    if(x)x.onclick=function(){window.mvClose();};
  });
  (function bind(){
    var b=document.getElementById('mv-back'),x=document.getElementById('mv-x');
    if(b)b.onclick=function(){window.mvBack();};
    if(x)x.onclick=function(){window.mvClose();};
  })();
})();
</script>

<div id="sh-ov"><div id="sh-bx"></div></div>
<script>
/* ─────────────────────────────────────────────────────────────
   📤 문서 PDF 공유
    인보이스·점검보고서·견적서 카드의 「PDF 공유」 버튼을 누르면
     ① 해당 문서를 보이지 않는 화면에서 지금 언어 그대로 그려서
     ② PDF 파일로 만든 뒤
     ③ 휴대폰 공유창(왓츠앱·카카오톡·메일 등)으로 바로 보냅니다.
    파일 공유를 지원하지 않는 브라우저(PC 등)에서는 PDF를 내려받은 뒤
    왓츠앱 링크·문서 링크를 함께 안내합니다.
   ───────────────────────────────────────────────────────────── */
(function(){
  var EN=(new URLSearchParams(location.search).get('lang')==='en');
  function T(ko,en){return EN?en:ko;}
  function ov(){return document.getElementById('sh-ov');}
  function box(){return document.getElementById('sh-bx');}
  function shShow(html){box().innerHTML=html;ov().classList.add('on');}
  function shHide(){ov().classList.remove('on');box().innerHTML='';}
  window.shHide=shHide;
  ov().addEventListener('click',function(e){if(e.target===ov())shHide();});

  function busy(msg,sub){
    shShow('<div class="sp"></div><div class="t1">'+msg+'</div><div class="t2">'+(sub||'')+'</div>');
  }
  // 외부 스크립트를 특정 창(iframe) 안에 넣는다
  function loadIn(w,src){
    return new Promise(function(res,rej){
      var s=w.document.createElement('script');s.src=src;s.onload=res;
      s.onerror=function(){rej(new Error('load fail'));};
      w.document.head.appendChild(s);
    });
  }
  function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}

  // 숨긴 화면에서 문서를 그려 PDF(Blob)로 만든다
  async function makePdf(url){
    var fr=document.createElement('iframe');
    fr.setAttribute('aria-hidden','true');
    fr.style.cssText='position:fixed;left:-10000px;top:0;width:560px;height:1200px;border:0;opacity:0;pointer-events:none';
    document.body.appendChild(fr);
    try{
      await new Promise(function(res,rej){
        var done=false;
        fr.onload=function(){if(!done){done=true;res();}};
        setTimeout(function(){if(!done){done=true;res();}},15000);
        fr.src=url;
      });
      var w=fr.contentWindow;
      await sleep(2600);                                   // 문서가 데이터를 불러올 시간
      // 화면 전용 요소(상단바·하단바 등 고정 배치)는 PDF에서 제외
      try{
        var d=w.document;
        Array.prototype.forEach.call(d.querySelectorAll('*'),function(el){
          var cs=w.getComputedStyle(el);
          if(cs.position==='fixed'||cs.position==='sticky')el.style.display='none';
        });
        d.body.style.background='#fff';
        var pad=d.querySelector('.iva,.cxa');if(pad)pad.style.paddingBottom='8px';
      }catch(e){}
      await sleep(400);
      await loadIn(w,'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      await loadIn(w,'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      var body=w.document.body;
      var cv=await w.html2canvas(body,{scale:2,useCORS:true,allowTaint:false,backgroundColor:'#ffffff',
        windowWidth:560,width:560,height:body.scrollHeight,scrollX:0,scrollY:0,logging:false});
      var JS=(w.jspdf&&w.jspdf.jsPDF)||w.jsPDF;
      var pdf=new JS('p','mm','a4');
      var pw=210,ph=297,mg=8,iw=pw-mg*2;
      var ratio=iw/cv.width;                                // 캔버스 px → mm
      var pageH=Math.floor((ph-mg*2)/ratio);                // 한 쪽에 담기는 캔버스 높이(px)
      var y=0,first=true;
      while(y<cv.height){
        var hh=Math.min(pageH,cv.height-y);
        var pc=w.document.createElement('canvas');
        pc.width=cv.width;pc.height=hh;
        pc.getContext('2d').drawImage(cv,0,y,cv.width,hh,0,0,cv.width,hh);
        if(!first)pdf.addPage();
        pdf.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',mg,mg,iw,hh*ratio);
        first=false;y+=hh;
      }
      return pdf.output('blob');
    }finally{
      setTimeout(function(){try{fr.remove();}catch(e){}},300);
    }
  }

  /* 📄 PDF 공유 언어
     인보이스·점검보고서는 받는 쪽(고객·업체·보험사 등)이 열어보는 문서이므로
     내 화면이 한국어여도 **영어를 기본값**으로 만들어 보냅니다.
     견적서(qt)는 지금처럼 화면 언어를 그대로 따릅니다. */
  var PDF_EN_ALWAYS={iv:1,ip:1};
  function shLang(kind){ return PDF_EN_ALWAYS[kind]?'en':(EN?'en':'ko'); }
  // 주소의 lang 값을 원하는 언어로 바꿔준다
  function withLang(url,lg){
    try{ var u=new URL(url,location.href); u.searchParams.set('lang',lg); return u.toString(); }
    catch(e){
      return /[?&]lang=/.test(url) ? url.replace(/([?&]lang=)[^&]*/,'$1'+lg)
                                   : url+(url.indexOf('?')>=0?'&':'?')+'lang='+lg;
    }
  }

  function fname(kind,id,lg){
    var k={iv:'Invoice',ip:'Report',qt:'Quotation'}[kind]||'Document';
    var sfx=(String(lg||(EN?'en':'ko')).toLowerCase()==='ko')?'KO':'EN';
    return 'HHC_'+k+'_'+String(id||'').replace(/[^A-Za-z0-9_-]/g,'')+'_'+sfx+'.pdf';
  }

  document.addEventListener('click',function(ev){
    var b=ev.target&&ev.target.closest?ev.target.closest('.shb'):null;
    if(!b)return;
    ev.preventDefault();ev.stopPropagation();
    var kind=b.getAttribute('data-shk'),id=b.getAttribute('data-shi'),
        title=b.getAttribute('data-sht'),url=b.getAttribute('data-shu');
    shareDoc(kind,id,title,url);
  },true);

  async function shareDoc(kind,id,title,url){
    var lg=shLang(kind);          // iv·ip = 항상 en
    url=withLang(url,lg);         // PDF 원본·대체 링크 모두 이 언어로
    var nm=fname(kind,id,lg);
    var txt='Happy Home Care · '+title;
    busy(T('PDF 만드는 중...','Creating PDF...'),T('문서를 불러와 PDF로 변환하고 있습니다. 잠시만 기다려 주세요.','Loading the document and converting it to PDF. This may take a few seconds.'));
    var blob=null;
    try{blob=await makePdf(url);}catch(e){blob=null;}
    if(blob){
      var file=null;
      try{file=new File([blob],nm,{type:'application/pdf'});}catch(e){}
      if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
        try{
          shHide();
          await navigator.share({files:[file],title:title,text:txt});
          return;
        }catch(e){ if(e&&e.name==='AbortError')return; }
      }
      // 파일 공유 미지원 → 내려받은 뒤 안내
      try{
        var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nm;
        document.body.appendChild(a);a.click();
        setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},4000);
      }catch(e){}
      shShow('<div class="t1">'+T('✅ PDF가 저장되었습니다','✅ PDF saved')+'</div>'+
        '<div class="t2">'+T('저장된 PDF를 왓츠앱·카카오톡에서 첨부해 보내실 수 있습니다.','You can now attach the saved PDF in WhatsApp, email or any app.')+'</div>'+
        '<div class="acts">'+
        '<a class="wa" href="https://wa.me/?text='+encodeURIComponent(txt+'\n'+url)+'" target="_blank" rel="noopener">💬 '+T('왓츠앱으로 링크 보내기','Send link on WhatsApp')+'</a>'+
        '<button onclick="shHide()">'+T('닫기','Close')+'</button></div>');
      return;
    }
    // PDF 변환 실패 → 링크 공유로 대체
    if(navigator.share){
      try{shHide();await navigator.share({title:title,text:txt,url:url});return;}catch(e){ if(e&&e.name==='AbortError')return; }
    }
    shShow('<div class="t1">'+T('링크로 공유하기','Share by link')+'</div>'+
