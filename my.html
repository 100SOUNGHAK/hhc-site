<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--bg:#F2F4F9;--ink:#1a2233;--ink2:#4b5563;--ink3:#8a94a6;--bdr:#e3e8f0;--pri:#2563eb;--pri-bg:#eff6ff;--ok:#059669;--ok-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fff7e6;--vio:#7c3aed;--vio-bg:#f5f3ff;
--navy:#0B1833;--teal:#0BB5A4;--indigo:#4F6EF7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.page{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 40px rgba(11,24,51,.08)}
/* hero */
.hero{background:linear-gradient(150deg,#0A1730 0%,#122448 58%,#17325E 100%);padding:calc(18px + env(safe-area-inset-top)) 20px 56px;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,76,.16),transparent 68%);top:-90px;right:-70px}
.hero:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.06),transparent 70%);bottom:-60px;left:-50px}
.hh{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.hh .mark{width:27px;height:27px;border-radius:8px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#E3C98A}
.hh b{color:#fff;font-size:13.5px;font-weight:800}
.lang{margin-left:auto;display:flex;gap:4px}
.lang button{border:none;cursor:pointer;font-family:inherit;font-size:10.5px;font-weight:800;padding:5px 11px;border-radius:13px;background:rgba(255,255,255,.12);color:#aebadb}
.lang button.on{background:#fff;color:#0B1833}
.who{position:relative;z-index:1;margin-top:22px;display:flex;align-items:center;gap:14px}
.ava{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.26);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.24),0 8px 20px rgba(4,12,26,.42);flex-shrink:0}
.nm{color:#fff;font-size:20px;font-weight:900;letter-spacing:-.01em}
.sub{color:#8fa0c9;font-size:11.5px;margin-top:2px}
.mem{display:inline-flex;align-items:center;gap:5px;margin-top:8px;background:linear-gradient(120deg,rgba(232,168,56,.18),rgba(232,168,56,.06));border:1px solid rgba(232,168,56,.45);color:#f3cd7e;font-size:11px;font-weight:800;border-radius:20px;padding:4px 12px}
.body{padding:0 15px calc(20px + env(safe-area-inset-bottom));margin-top:-34px;position:relative;z-index:2}
/* 히어로 상태 요약 칩 — 누르면 해당 섹션으로 이동 */
.hqs{position:relative;z-index:1;display:flex;gap:8px;margin-top:15px;flex-wrap:wrap}
.hq{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:-.01em;color:#DCE4F5;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.17);border-radius:999px;padding:7px 13px;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);transition:transform .14s ease}
.hq:active{transform:scale(.96)}
.hq b{font-variant-numeric:tabular-nums;font-weight:900}
.hq.due{background:rgba(220,38,38,.20);border-color:rgba(252,165,165,.42);color:#FECACA}
.hq.ok{background:rgba(14,155,99,.17);border-color:rgba(110,231,183,.36);color:#A7F3D0}
.hq.gd{background:rgba(201,164,76,.16);border-color:rgba(227,201,138,.4);color:#EDDCB0}
@media (prefers-reduced-motion:reduce){.hq{transition:none}}
/* 잔액카드가 없을 때(계약 1건) : 히어로와 겹치지 않게 평평하게 */
.hero.flat{padding-bottom:24px;border-radius:0 0 22px 22px}
.body.nb{margin-top:0;padding-top:16px}
.body.nb>.sec:first-child{margin-top:0}
/* balance */
.balcard{background:#fff;border-radius:18px;padding:17px;box-shadow:0 10px 30px rgba(11,24,51,.10)}
.balcard .lb{font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:.06em}
.balcard .val{font-size:28px;font-weight:900;letter-spacing:-.02em;margin-top:2px}
.balcard .val small{font-size:14px;font-weight:800;color:var(--ink3)}
.bar{height:7px;border-radius:6px;background:#EEF1F7;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--indigo));transition:width .6s}
.bar-lb{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);font-weight:700;margin-top:5px}
.balrow{display:flex;margin-top:13px;border-top:1px dashed var(--bdr);padding-top:12px}
.balrow div{flex:1;text-align:center}
.balrow .k{font-size:9.5px;color:var(--ink3);font-weight:700}
.balrow .v{font-size:13.5px;font-weight:900;margin-top:1px}
/* sections */
.sec{margin-top:17px}
.sh{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:900;margin-bottom:8px;padding:0 2px}
.sh .n{margin-left:auto;font-size:10px;font-weight:800;background:#fff;border:1px solid var(--bdr);color:var(--ink2);border-radius:10px;padding:2px 9px}
.card{background:#fff;border-radius:15px;padding:13px 14px;box-shadow:0 3px 14px rgba(11,24,51,.06);margin-bottom:9px;display:flex;gap:11px;align-items:center;text-decoration:none;color:inherit}
.card:active{transform:scale(.985)}
.cico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.cico.iv{background:var(--ok-bg)}.cico.ip{background:var(--warn-bg)}.cico.ct{background:var(--pri-bg)}
.cm{flex:1;min-width:0}
.cm .t{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cm .d{font-size:11px;color:var(--ink3);margin-top:2px}
.chip{font-size:9px;font-weight:800;border-radius:5px;padding:2px 6px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:#fef2f2;color:#dc2626}.chip.blue{background:var(--pri-bg);color:var(--pri)}.chip.vio{background:var(--vio-bg);color:var(--vio)}
.go{flex-shrink:0;font-size:10.5px;font-weight:800;color:var(--pri);background:var(--pri-bg);border-radius:8px;padding:7px 11px;white-space:nowrap}
.amt{font-size:13px;font-weight:900;white-space:nowrap}
/* voucher */
.vcard{display:block;text-decoration:none;background:linear-gradient(120deg,#0b5f59,#0f766e 60%,#14958a);border-radius:15px;padding:15px 17px;color:#fff;box-shadow:0 8px 22px rgba(15,118,110,.35);position:relative;overflow:hidden;margin-bottom:9px}
.vcard:before{content:'';position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);top:-50px;right:-30px}
.vcard.used{filter:grayscale(.8);opacity:.72}
.vcard .stb{position:absolute;top:11px;right:13px;font-size:9px;font-weight:900;border-radius:12px;padding:3px 9px;background:rgba(255,255,255,.92);z-index:1}
.vcard .stb.ok{color:#059669}
.vcard .stb.used{color:#64748b}
.card.dim{opacity:.65;background:#f8fafc}
.vcard .vt{font-size:10px;font-weight:800;opacity:.8;letter-spacing:.08em}
.vcard .vv{font-size:21px;font-weight:900;margin-top:2px}
.vcard .vd{font-size:10.5px;opacity:.9;margin-top:7px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.vcard .code{font-family:monospace;font-weight:700;background:rgba(255,255,255,.15);border-radius:6px;padding:2px 8px}
/* cta / foot */
.cta{display:flex;gap:8px;margin-top:12px}
.cta a{flex:1;text-align:center;font-size:12.5px;font-weight:800;border-radius:13px;padding:13px;text-decoration:none}
.cta .wa{background:#22c55e;color:#fff;box-shadow:0 6px 16px rgba(34,197,94,.35)}
/* 💡 추가비용 안내 — 「추가비용 안내」 메시지로 들어왔을 때만 보여 줍니다 */
.feec{background:#fff;border:1px solid var(--bdr);border-radius:16px;margin-top:12px;overflow:hidden;
  box-shadow:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.18)}
.feeh{display:flex;align-items:center;gap:11px;padding:14px 16px;color:#fff;
  background:linear-gradient(140deg,#0E2350,#16346E 65%,#1D4090)}
.feeh .fi{width:36px;height:36px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:17px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24)}
.feeh .ft{font-size:15px;font-weight:900;letter-spacing:-.02em}
.feeh .fs{font-size:11px;font-weight:700;color:#B9CBEF;margin-top:3px;line-height:1.5;word-break:keep-all}
.feeb{padding:6px 16px 14px}
.fee1{padding:12px 0;border-bottom:1px dashed var(--bdr)}
.fee1:last-child{border-bottom:none}
.fee1 .fk{font-size:13px;font-weight:900;letter-spacing:-.01em;color:var(--ink)}
.fee1 .fv{font-size:12px;font-weight:700;color:var(--ink2);line-height:1.75;margin-top:5px;word-break:keep-all}
.fee1 .fcap{font-size:10.5px;font-weight:800;color:var(--ink3);margin-top:10px}
.ftab{margin-top:6px;border:1px solid var(--bdr);border-radius:10px;overflow:hidden}
.ftab>div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 11px;
  font-size:11.5px;font-weight:800;border-bottom:1px solid var(--bdr);background:var(--soft,#F6F8FC)}
.ftab>div:last-child{border-bottom:none}
.ftab .k{color:var(--ink2)}
.ftab .v{color:#0E9B63;font-weight:900;font-variant-numeric:tabular-nums}
.ftab .no .v{color:#DC2626}
.feepk{margin-top:12px;background:#FEF9EC;border:1px solid #EBD9A6;border-radius:11px;padding:10px 12px;
  font-size:11.5px;font-weight:800;color:#7A5B10;line-height:1.65;word-break:keep-all}
/* 서비스 의뢰 — 마이페이지 대표 액션 카드 */
.rqc{display:block;margin-top:20px;padding:17px 18px;border-radius:16px;text-decoration:none;background:linear-gradient(125deg,#0BB5A4 0%,#0d9488 55%,#0f766e 100%);color:#fff;box-shadow:0 10px 24px rgba(11,181,164,.35);position:relative;overflow:hidden}
.rqc:before{content:'';position:absolute;right:-30px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.15)}
.rqc:after{content:'';position:absolute;right:22px;bottom:-40px;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.09)}
.rqc .rqbd{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.06em;border-radius:100px;padding:3px 9px;position:relative;margin-bottom:8px}
.rqc .rqt{font-size:16px;font-weight:900;letter-spacing:-.02em;position:relative;display:flex;align-items:center;gap:7px}
.rqc .rqs{font-size:11px;color:#d6fbf5;margin-top:4px;line-height:1.55;position:relative}
.rqc .rqb{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#fff;color:#0d7d72;font-size:12px;font-weight:900;border-radius:11px;padding:9px 16px;position:relative;box-shadow:0 4px 12px rgba(6,78,71,.25)}
.rqc .rqb b{transition:transform .18s}
.rqc:active{transform:scale(.985)}
/* ══ 예약 신청 (관리자가 만든 예약 링크) ══ */
.bkc{display:block;padding:17px 18px;border-radius:16px;text-decoration:none;background:linear-gradient(125deg,#312e81 0%,#4338ca 55%,#4F6EF7 100%);color:#fff;position:relative;overflow:hidden;animation:bkGlow 2.6s ease-in-out infinite}
@keyframes bkGlow{0%,100%{box-shadow:0 10px 24px rgba(67,56,202,.38)}50%{box-shadow:0 12px 32px rgba(79,110,247,.62)}}
.bkc:before{content:'';position:absolute;right:-30px;top:-34px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.14)}
.bkc:after{content:'';position:absolute;right:22px;bottom:-40px;width:78px;height:78px;border-radius:50%;background:rgba(255,255,255,.08)}
.bkc .bkbd{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:9.5px;font-weight:900;letter-spacing:.06em;border-radius:100px;padding:3px 9px;position:relative;margin-bottom:8px}
.bkc .bkt{font-size:16px;font-weight:900;letter-spacing:-.02em;position:relative}
.bkc .bks{font-size:11.5px;color:#dbe2ff;margin-top:4px;line-height:1.6;position:relative;word-break:keep-all}
.bkc .bki{position:relative;margin-top:9px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:10px;padding:7px 11px;font-size:11.5px;font-weight:800}
.bkc .bkb{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#fff;color:#3730A3;font-size:12.5px;font-weight:900;border-radius:11px;padding:10px 17px;position:relative;box-shadow:0 4px 12px rgba(20,17,80,.3)}
.bkc:active{transform:scale(.985)}
.bkm{display:block;background:#fff;border:1px solid var(--bdr);border-left:5px solid #F2B23E;border-radius:14px;padding:13px 15px;text-decoration:none;color:var(--ink);box-shadow:0 3px 12px rgba(11,24,51,.06);margin-top:8px}
.bkm.ok{border-left-color:#18B26B}
.bkm-tp{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.bkm-st{font-size:10.5px;font-weight:900;color:#b45309;background:#FFF7ED;border-radius:100px;padding:3px 9px}
.bkm.ok .bkm-st{color:#0f766e;background:#ECFDF5}
.bkm-dt{margin-left:auto;font-size:11.5px;font-weight:900;color:var(--ink2);font-variant-numeric:tabular-nums}
.bkm-t{font-size:13.5px;font-weight:900;letter-spacing:-.01em}
.bkm-s{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.6;font-weight:700;word-break:keep-all}
.bkm-go{display:inline-block;margin-top:7px;font-size:11.5px;font-weight:900;color:var(--pri, #4F6EF7)}
.pmx-hd.bk{background:linear-gradient(135deg,#312e81,#4338ca 55%,#4F6EF7)}
.pmx-bank.bk{background:#EEF2FF;border-color:#C7D2FE}
.pmx-bank.bk .k{color:#4338CA}
.pmx-bank.bk .v{color:#1e1b4b}
.pmx-ok.bk{background:linear-gradient(135deg,#312e81,#4F6EF7);box-shadow:0 8px 20px -8px rgba(79,110,247,.65)}
.pmx-later{width:100%;margin-top:8px;padding:11px;border:none;background:none;color:var(--ink3);font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
/* 상품권/할인권 팝업 — 황금색 */
.pmx-hd.cp{background:linear-gradient(135deg,#6b4700,#b8860b 50%,#e6b422)}
.pmx-bank.cp{background:#FFFBEB;border-color:#FDE68A}
.pmx-bank.cp .k{color:#92400e}
.pmx-bank.cp .v{color:#4a3000}
.pmx-msg .am.cp{color:#8a6300}
.pmx-ok.cp{background:linear-gradient(135deg,#6b4700,#c9950b);box-shadow:0 8px 20px -8px rgba(184,134,11,.6)}
.pmx-more{margin-top:9px;font-size:11px;font-weight:800;color:#92400e;text-align:center}
/* 예약 확정 카드 안 : 매니지먼트 작업방문등록 안내 */
.bkvr{margin-top:9px;border-top:1px dashed var(--bdr);padding-top:9px}
.bkvr-t{font-size:11px;font-weight:900;color:#b45309;line-height:1.6;word-break:keep-all}
.bkvr-bx{margin-top:7px;background:#F7F9FF;border:1px solid #DCE4F5;border-radius:11px;padding:9px 11px}
.bkvr-h{font-size:10.5px;font-weight:900;color:#3730A3;margin-bottom:6px}
.bkvr-r{display:flex;gap:8px;font-size:11px;padding:2px 0;align-items:baseline}
.bkvr-r .k{flex:none;width:62px;font-weight:800;color:var(--ink3);font-size:10.5px}
.bkvr-r .v{font-weight:800;color:var(--ink);line-height:1.7;word-break:break-word}
.bkvr-r .v i{font-style:normal;color:var(--ink3);font-variant-numeric:tabular-nums;margin-left:5px;letter-spacing:.02em}
.bkvr-cp{width:100%;margin-top:8px;padding:9px;border:1px solid #C7D2FE;background:#EEF2FF;color:#3730A3;font-family:inherit;font-size:11.5px;font-weight:900;border-radius:10px;cursor:pointer}
.bkvr-cp:active{transform:scale(.985)}
.hp{display:block;margin-top:12px;padding:16px 18px;border-radius:16px;text-decoration:none;background:linear-gradient(125deg,#0B1833 0%,#1d3260 100%);color:#fff;box-shadow:0 8px 22px rgba(11,24,51,.28);position:relative;overflow:hidden}
.hp:before{content:'';position:absolute;right:-28px;top:-28px;width:110px;height:110px;border-radius:50%;background:rgba(79,110,247,.28)}
.hp .hpt{font-size:14.5px;font-weight:900;letter-spacing:-.01em;position:relative}
.hp .hps{font-size:11px;color:#b9c6e8;margin-top:4px;line-height:1.5;position:relative}
.hp .hpb{display:inline-flex;align-items:center;gap:6px;margin-top:11px;background:#fff;color:#0B1833;font-size:11.5px;font-weight:800;border-radius:10px;padding:8px 14px;position:relative}
.foot{padding:18px 14px 6px;text-align:center;font-size:10px;color:var(--ink3);line-height:1.7}
.foot b{color:var(--ink2)}
.empty-page{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink3);font-size:14px;padding:30px;text-align:center}
.spin{width:30px;height:30px;border:3px solid var(--bdr);border-top-color:var(--indigo);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ══ v3 섹션 허브 박스 (인보이스 / 점검보고서) ══ */
.hub{border-radius:19px;padding:16px 16px 15px;position:relative;box-shadow:0 9px 24px rgba(11,24,51,.24);color:#fff}
.hubbg{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.hubbg:before{content:'';position:absolute;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.1);top:-70px;right:-50px}

.a2hs:before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(79,110,247,.4),transparent 70%);top:-50px;right:-40px}

.a2hs-st{display:flex;align-items:baseline;gap:9px;font-size:12px;line-height:1.6;color:#dbe3f5;font-weight:700}
.a2hs-st .n{flex:none;width:17px;height:17px;border-radius:50%;background:linear-gradient(135deg,var(--indigo),var(--teal));color:#fff;font-size:10px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;transform:translateY(2px)}
/* 📱 설치 오버레이 — 브라우저로 넘어오자마자 스크롤 없이 바로 설치 */
.a2m-ov{position:fixed;inset:0;z-index:9600;display:none;align-items:flex-end;justify-content:center;
  background:rgba(7,12,26,.62);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);padding:14px}
.a2m-ov.on{display:flex}
.a2m{width:100%;max-width:440px;background:linear-gradient(150deg,#0B1833,#16264a 55%,#1d3a63);color:#fff;
  border-radius:22px;padding:20px 19px calc(18px + env(safe-area-inset-bottom));position:relative;overflow:hidden;
  box-shadow:0 30px 70px -22px rgba(4,10,24,.9);animation:a2mIn .3s cubic-bezier(.22,.8,.28,1)}
@keyframes a2mIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.a2m:before{content:'';position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(79,110,247,.42),transparent 70%);top:-70px;right:-55px}
.a2m>*{position:relative}
.a2m .x{position:absolute;top:-4px;right:-3px;width:32px;height:32px;border:none;border-radius:50%;background:rgba(255,255,255,.12);color:#c6d0e8;font-size:14px;cursor:pointer;font-family:inherit}

.a2m .t{font-size:17.5px;font-weight:900;letter-spacing:-.02em;line-height:1.35}
.a2m .s{font-size:12.5px;color:#aebadb;margin-top:6px;line-height:1.7;word-break:keep-all}
.a2m .a2hs-btn{margin-top:14px;font-size:15.5px;padding:15px;border-radius:14px}
.a2m .a2hs-how{margin-top:13px}
.a2m .a2hs-st{font-size:12.5px}
.a2m .later{display:block;width:100%;margin-top:9px;border:none;background:none;color:#8fa0c9;font-size:12px;font-weight:700;cursor:pointer;padding:9px;font-family:inherit}
@keyframes a2Pulse{0%{box-shadow:0 8px 18px -6px rgba(79,110,247,.55),0 0 0 0 rgba(79,110,247,.5)}70%{box-shadow:0 8px 18px -6px rgba(79,110,247,.55),0 0 0 13px rgba(79,110,247,0)}100%{box-shadow:0 8px 18px -6px rgba(79,110,247,.55),0 0 0 0 rgba(79,110,247,0)}}

.ccard.t-titanium{background:linear-gradient(135deg,#111d38,#263a63 55%,#3d5a9e)}
.ccard.t-special{background:linear-gradient(135deg,#5c1030,#a01e56 55%,#d63d84)}
.ccard.off{background:linear-gradient(135deg,#3a4150,#5a6274);filter:grayscale(.45);opacity:.85;box-shadow:0 5px 14px rgba(11,24,51,.15)}
.cw{position:relative;z-index:1}
.ctop{display:flex;align-items:center;gap:8px}
.ctier{font-size:10px;font-weight:900;letter-spacing:.1em;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 11px}
.cstat{margin-left:auto;font-size:9.5px;font-weight:900;border-radius:20px;padding:4px 10px;background:rgba(255,255,255,.93);color:#059669}
.cstat.off{color:#64748b}
.cnm{font-size:15px;font-weight:900;margin-top:9px;letter-spacing:-.01em}
.clb{font-size:9.5px;font-weight:800;opacity:.72;letter-spacing:.06em;margin-top:11px}
.cval{font-size:27px;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin-top:1px}
.cval small{font-size:14px;opacity:.75}
.cbar{height:8px;border-radius:6px;background:rgba(255,255,255,.2);margin-top:11px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),#8ee9dd)}
.cbl{display:flex;justify-content:space-between;font-size:10px;font-weight:800;opacity:.85;margin-top:6px}
.cmeta{display:flex;margin-top:13px;padding-top:11px;border-top:1px solid rgba(255,255,255,.18)}
.cmeta>div{flex:1;text-align:center}
.cmeta .k{font-size:9px;font-weight:700;opacity:.7}
.cmeta .v{font-size:12.5px;font-weight:900;margin-top:2px}
.cbtn{display:block;text-align:center;margin-top:12px;background:rgba(255,255,255,.95);color:#0B1833;font-size:11.5px;font-weight:900;border-radius:11px;padding:10px}
/* ══ v2 상품권 카드 ══ */
.vc2{display:block;text-decoration:none;color:#fff;border-radius:16px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(124,58,237,.3)}
.vc2:active{transform:scale(.99)}
.vc2.gift{background:linear-gradient(125deg,#7a5200,#b8860b 45%,#e0b03a 74%,#f7d76b);box-shadow:0 8px 22px rgba(184,134,11,.34)}
.vc2.disc{background:linear-gradient(120deg,#9a3412,#ea580c 60%,#fb923c);box-shadow:0 8px 22px rgba(234,88,12,.3)}
.vc2.off{background:linear-gradient(120deg,#3f4654,#606a7e);box-shadow:0 5px 14px rgba(11,24,51,.15);filter:grayscale(.35)}
.vc2:before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12);top:-60px;right:-40px}
.vtop2{position:relative;z-index:1;padding:14px 16px 12px}
.vkind{font-size:9.5px;font-weight:900;letter-spacing:.09em;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 10px}
.vstb{float:right;font-size:9.5px;font-weight:900;border-radius:20px;padding:4px 10px;background:rgba(255,255,255,.93);color:#059669}
.vstb.off{color:#64748b}
.vval2{font-size:29px;font-weight:900;letter-spacing:-.02em;margin-top:11px;line-height:1.15}
.vsub2{font-size:10.5px;opacity:.86;font-weight:700;margin-top:5px;line-height:1.5}
.vperf{position:relative;height:0;margin:0 16px;border-top:2px dashed rgba(255,255,255,.4);z-index:1}
.vperf:before,.vperf:after{content:'';position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.vperf:before{left:-26px}.vperf:after{right:-26px}
.vbot2{position:relative;z-index:1;padding:12px 16px 14px;display:flex;align-items:flex-end;gap:10px}
.vk{font-size:8.5px;font-weight:800;opacity:.68;letter-spacing:.05em}
.vv2{font-size:11.5px;font-weight:900;margin-top:3px;white-space:nowrap}
.vcode2{font-family:monospace;font-weight:800;font-size:11px;background:rgba(255,255,255,.17);border-radius:6px;padding:3px 8px;margin-top:2px;display:inline-block}
.dday{font-size:9px;font-weight:900;border-radius:6px;padding:2px 6px;margin-left:4px;background:rgba(255,255,255,.9);color:#5b21b6}
.vc2.disc .dday{color:#9a3412}
.vc2.gift .dday{color:#6b4700}
.dday.warn{background:#fff;color:#dc2626}
.vgo{margin-left:auto;font-size:10.5px;font-weight:900;background:rgba(255,255,255,.95);color:#3b1d7a;border-radius:9px;padding:8px 12px;white-space:nowrap;flex-shrink:0}
.vc2.disc .vgo{color:#9a3412}
.vc2.gift .vgo{color:#6b4700}
.vc2.off .vgo{color:#334155}
/* ═══ 💎 포인트 적립금 ═══ */
.ptc{border-radius:20px;overflow:hidden;background:linear-gradient(150deg,#0A1730,#122448 58%,#17325E);color:#fff;box-shadow:0 14px 30px rgba(11,24,51,.30)}
.ptc-hd{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.ptc-hd .ic{font-size:22px}
.ptc-hd .t{font-size:15px;font-weight:900}
.ptc-hd .s{font-size:9.5px;font-weight:800;letter-spacing:2px;opacity:.65}
.ptc-rule{margin-left:auto;font-size:10.5px;font-weight:900;background:rgba(201,164,76,.18);border:1px solid rgba(227,201,138,.42);color:#EDDCB0;border-radius:999px;padding:4px 10px;flex-shrink:0}
.ptc-bal{padding:6px 18px 14px}
.ptc-bal .k{font-size:11px;font-weight:800;opacity:.72;letter-spacing:.4px}
.ptc-bal .v{font-size:34px;font-weight:900;letter-spacing:-1px;line-height:1.15}
.ptc-bal .v small{font-size:18px;opacity:.85}
.ptc-emp{font-size:11px;font-weight:800;line-height:1.55;margin-top:6px;padding:7px 10px;border-radius:10px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2)}
.ptc-row{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.16)}
.ptc-row>div{background:rgba(255,255,255,.10);padding:10px 18px}
.ptc-row .k{font-size:10px;font-weight:800;opacity:.75}
.ptc-row .v{font-size:15px;font-weight:900;margin-top:2px}
.ptc-note{font-size:11px;line-height:1.55;padding:10px 18px;background:rgba(0,0,0,.14)}
.ptc-btn{width:100%;border:none;background:rgba(255,255,255,.10);color:#fff;font-weight:900;font-size:12px;padding:11px;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:inherit;border-top:1px solid rgba(255,255,255,.12)}
.ptc-btn .ar{font-size:9px;opacity:.7}
.ptc-ls{background:#fff;color:var(--ink)}
/* 첫 화면은 「제목 + 사용 가능 잔액」만 — 누적·안내·적립내역은 이 안에 접어 둔다 */
.ptc-more{display:none}
.ptc-more.open{display:block}
.ptc-btn .ar{transition:transform .18s}
.ptc-btn.open .ar{transform:rotate(180deg)}
/* 카드 안 제목 · 적립비율 배지 */
.ptc-hd2{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:#e2d6ff;letter-spacing:-.01em}
.ptc-pill{display:inline-block;margin-top:11px;font-size:10.5px;font-weight:900;border-radius:999px;padding:5px 12px;
  background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.27)}
.ptc-tip{font-size:11px;font-weight:800;line-height:1.55;margin-top:10px;padding:8px 11px;border-radius:11px;
  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);word-break:keep-all}
/* 펼친 내역 아래 「내역 닫기」 버튼 */
.ptc-cls{width:100%;background:#fff;border:1px solid var(--bdr);color:var(--ink2);font-family:inherit;font-size:12px;
  font-weight:900;letter-spacing:-.01em;border-radius:13px;padding:13px;margin-top:10px;display:none;align-items:center;
  justify-content:center;gap:7px;cursor:pointer;box-shadow:0 3px 12px rgba(11,24,51,.08)}
.ptc-cls .up{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;
  background:#6D28D9;color:#fff;font-size:7px}
.ptc-cls:active{transform:scale(.985)}
.ptsec.pto .ptc-cls{display:flex}
.ptr{display:flex;align-items:center;gap:10px;padding:11px 16px;border-top:1px solid var(--bdr)}
.ptr:first-child{border-top:none}
.ptr .sign{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0}
.ptr.earn .sign{background:#ECFDF5;color:#047857}
.ptr.use .sign{background:#FEF2F2;color:#DC2626}
.ptr .bx{flex:1;min-width:0}
.ptr .bx b{display:block;font-size:12.5px;font-weight:800}
.ptr .bx span{display:block;font-size:11px;color:var(--ink3);margin-top:1px}
.ptr .amt{font-weight:900;font-size:13.5px;flex-shrink:0}
.ptr.earn .amt{color:#047857}
.ptr.use .amt{color:#DC2626}
.ptr-none{padding:16px;text-align:center;font-size:12px;color:var(--ink3)}

/* ══════════════════════════════════════════════════════════
   2026-08 디자인 개편 — 자료·기능·정보 변경 없음, 표시만 개선
   ══════════════════════════════════════════════════════════ */
:root{--grn:#0E9E6E;--grn-bg:#E6F6EF;--gold2:#C9A44C}
body,.page{background:#F1F3F8}

/* ── 히어로: 떠 있는 라운드 네이비 카드 ── */
.hero{margin:calc(12px + env(safe-area-inset-top)) 12px 0;border-radius:22px;
  padding:20px 20px 60px;box-shadow:0 16px 38px -14px rgba(9,22,48,.5)}
.hh .mark{width:30px;height:30px;border-radius:9px}
.lang button{font-size:11px;padding:6px 14px;border-radius:16px}
.who{margin-top:24px}
.ava{width:58px;height:58px;font-size:21px;border:2px solid rgba(227,201,138,.5);
  background:rgba(255,255,255,.09);color:#F1D089}
.nm{font-size:21px}
.sub{color:#9AACD3;font-size:12px;margin-top:3px}
.mem{background:linear-gradient(120deg,rgba(201,164,76,.24),rgba(201,164,76,.08));
  border-color:rgba(201,164,76,.55);color:#F1D089;font-size:11.5px;padding:5px 13px}
.body{padding:0 13px calc(24px + env(safe-area-inset-bottom))}

/* ── 잔액(계약) 카드 ── */
.balcard{border-radius:20px;padding:20px 18px 17px;box-shadow:0 14px 34px -14px rgba(11,24,51,.18)}
.balcard .lb{font-size:10.5px;letter-spacing:.08em}
.balcard .val{font-size:33px}
.bar{height:8px;background:#E8EDF4;margin-top:14px}
.bar i{background:linear-gradient(90deg,#3BCB90,#0E9E6E)}
.bar-lb{font-size:10.5px;margin-top:6px}
.bar-lb b,.bar-lb span:last-child{color:var(--grn)}
.balrow{margin-top:15px;padding-top:14px}
.balrow div{border-left:1px solid var(--bdr)}
.balrow div:first-child{border-left:none}
.balrow .k{font-size:10px}
.balrow .v{font-size:14px;margin-top:2px}

/* ── 섹션 · 목록 카드 ── */
.sec{margin-top:20px}
.sh{font-size:15px;margin-bottom:10px}
.sh .n{font-size:10.5px;padding:3px 10px}
.card{border-radius:16px;padding:14px 15px;box-shadow:0 4px 18px rgba(11,24,51,.06);margin-bottom:10px}
.cico{width:42px;height:42px;border-radius:50%;font-size:18px}
.cm .t{font-size:13px}
.cm .d{font-size:11.5px;margin-top:3px}
.go{padding:8px 13px;border-radius:10px;font-size:11px}
.amt{font-size:13.5px}

/* ── 상품권: 골드 카드 ── */
.vcard{background:linear-gradient(115deg,#A5761E 0%,#C2922E 45%,#DFB254 100%);
  box-shadow:0 12px 28px rgba(176,134,44,.4);border-radius:17px;padding:16px 18px}
.vcard:before{background:rgba(255,255,255,.14)}
.vcard .vt{letter-spacing:.12em;opacity:.9}
.vcard .vv{font-size:23px}
.vcard .code{background:rgba(255,255,255,.2)}
.vcard.used{filter:grayscale(.55) brightness(.94)}

/* ── 액션 카드: 화이트 + 아이콘 배지 스타일 ── */
.rqc{background:#fff;color:var(--ink);box-shadow:0 6px 20px rgba(11,24,51,.08);border:1px solid var(--bdr)}
.rqc:before,.rqc:after{display:none}
.rqc .rqbd{background:var(--grn-bg);border-color:#BFE7D6;color:var(--grn)}
.rqc .rqt{color:var(--ink)}
.rqc .rqs{color:var(--ink3)}
.rqc .rqb{background:var(--grn-bg);color:var(--grn);box-shadow:none;width:100%;justify-content:center;border-radius:12px;padding:11px 16px}
.hp{background:#fff;color:var(--ink);box-shadow:0 6px 20px rgba(11,24,51,.08);border:1px solid var(--bdr)}
.hp:before{display:none}
.hpt{color:var(--ink)}
.hps{color:var(--ink3)}
.hpb{background:#EFF4FF;color:#1d4ed8;width:100%;justify-content:center;border-radius:12px;padding:11px 16px}

/* ── 하단 CTA ── */
.cta{margin-top:14px}
.cta a{border-radius:999px;padding:14px;font-size:13.5px}
.cta .wa{box-shadow:0 8px 20px rgba(34,197,94,.4)}

/* ── 계약 카드: 화이트 럭셔리 스타일 (등급색은 배지·포인트 컬러로 유지) ── */
.ccard,.ccard.t-gold,.ccard.t-silver,.ccard.t-diamond,.ccard.t-royal,.ccard.t-titanium,.ccard.t-special{
  background:#fff;color:var(--ink);border:1px solid var(--bdr);box-shadow:0 8px 26px rgba(11,24,51,.09)}
.ccard:before{display:none}
.ccard .ctier{background:#0B1833;color:#F1D089;letter-spacing:.12em}
.ccard.t-gold .ctier{background:linear-gradient(120deg,#8a6410,#c48f14);color:#fff}
.ccard.t-royal .ctier{background:linear-gradient(120deg,#4c2f9e,#7c4ddb);color:#fff}
.ccard.t-diamond .ctier{background:linear-gradient(120deg,#0f8a86,#16b6ac);color:#fff}
.ccard.t-titanium .ctier{background:linear-gradient(120deg,#263a63,#3d5a9e);color:#fff}
.ccard.t-special .ctier{background:linear-gradient(120deg,#a01e56,#d63d84);color:#fff}
.ccard .cstat{background:var(--grn-bg);color:var(--grn)}
.ccard .cstat.off{background:#F1F5F9;color:#64748b}
.ccard .cnm{font-size:16px}
.ccard .clb{opacity:1;color:var(--ink3)}
.ccard .cval{color:#0B1833;font-size:31px}
.ccard .cval small{opacity:.55}
.ccard .cbar{background:#E8EDF4}
.ccard .cbar i{background:linear-gradient(90deg,#3BCB90,#0E9E6E)}
.ccard .cbl{opacity:1;color:var(--ink2)}
.ccard .cbl span:last-child{color:var(--grn)}
.ccard .cmeta{border-top-color:var(--bdr)}
.ccard .cmeta .k{opacity:1;color:var(--ink3)}
.ccard .cmeta .v{color:var(--ink)}
.ccard .cbtn{background:var(--grn-bg);color:var(--grn)}
.ccard.off{background:#F6F8FB;filter:none;opacity:.9}

/* ── 인보이스 · 점검보고서 허브 카드: 화이트 스타일 ── */
.hub,.hub.iv,.hub.ip{background:#fff;color:var(--ink);border:1px solid var(--bdr);box-shadow:0 8px 26px rgba(11,24,51,.09)}
.hubbg{display:none}
.hub.iv .hubic{background:#EFF4FF;border-color:#D6E4FF}
.hub.ip .hubic{background:var(--grn-bg);border-color:#C7EBDC}
.hubtt{color:var(--ink)}
.hubts{opacity:1;color:var(--ink3)}
.hubst{background:#F5F7FB;border:1px solid var(--bdr)}
.hubb{background:#F7F9FC;border-color:var(--bdr)}
.hubb .k{opacity:1;color:var(--ink3)}
.hubb .v{color:var(--ink)}
.hubb .s{opacity:1;color:var(--ink3)}
.hubal{background:#FFF7ED;border:1px solid #FED7AA}
.hubal.bad{background:#FEF2F2;border-color:#FECACA}
.hub.iv .hubbtn{background:#EFF4FF;color:#1d4ed8;box-shadow:none}
.hub.iv .hubbtn .ar{background:#1d4ed8}
.hub.ip .hubbtn{background:var(--grn-bg);color:var(--grn);box-shadow:none}
.hub.ip .hubbtn .ar{background:var(--grn)}
/* ── 🛠️ 수리요청 처리내역 카드 ── */
.hub.mm .hubic{background:#FFF4E5;border-color:#FCD9A6}
.hub.mm .hubbtn{background:#FFF4E5;color:#B45309;box-shadow:none}
.hub.mm .hubbtn .ar{background:#B45309}
.hubls.mml .hubcap:before{background:#B45309}
.mmc{background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 4px 16px rgba(11,24,51,.07);overflow:hidden;display:flex}
.mmc .stripe.s-pend{background:linear-gradient(180deg,#fbbf24,#b45309)}
.mmc .stripe.s-cont{background:linear-gradient(180deg,#60a5fa,#2563eb)}
.mmc .stripe.s-done{background:linear-gradient(180deg,#34d399,#059669)}
.mmb{flex:1;min-width:0;padding:12px 13px}
.mmh{display:flex;align-items:flex-start;gap:9px}
.mmtile{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.mmtile.s-pend{background:var(--warn-bg)}.mmtile.s-cont{background:var(--pri-bg)}.mmtile.s-done{background:var(--ok-bg)}
.mmdt{font-size:12.5px;font-weight:900;letter-spacing:-.01em}
.mmwho{font-size:10.5px;color:var(--ink3);font-weight:700;margin-top:2px}
.mmst{font-size:10px;font-weight:900;border-radius:8px;padding:5px 10px;white-space:nowrap;flex-shrink:0;align-self:center}
.mmst.s-pend{background:var(--warn-bg);color:var(--warn)}
.mmst.s-cont{background:var(--pri-bg);color:var(--pri)}
.mmst.s-done{background:var(--ok-bg);color:var(--ok)}
.mmf{margin-top:10px;border-top:1px dashed var(--bdr);padding-top:10px}
.mmrow{display:flex;gap:8px;align-items:flex-start;padding:6px 0}
.mmk{flex:0 0 62px;font-size:10px;font-weight:900;color:var(--ink3);letter-spacing:.02em;padding-top:2px}
.mmv{flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--ink2);line-height:1.65;word-break:break-word}
.mmv.sym{background:#F7F9FC;border-radius:9px;padding:8px 10px;color:var(--ink)}
.mmv.res{background:var(--ok-bg);border-radius:9px;padding:8px 10px;color:#065F46;font-weight:800}
.mmv.wait{color:var(--ink3)}
.mmv .vd{display:inline-flex;align-items:center;gap:5px;background:var(--pri-bg);color:var(--pri);border-radius:8px;padding:4px 9px;font-size:11px;font-weight:900}
@media(max-width:400px){.mmk{flex:0 0 54px;font-size:9.5px}}

/* ── 전체 길이 압축: 한눈에 보이도록 여백·크기 축소 ── */
.hero{padding:16px 18px 50px;margin-bottom:0}
.who{margin-top:16px;gap:12px}
.ava{width:50px;height:50px;font-size:18px}
.nm{font-size:19px}
.mem{margin-top:6px;font-size:10.5px;padding:4px 11px}
.body{margin-top:-30px}
.sec{margin-top:12px}
.sh{font-size:14px;margin-bottom:7px}
.card{padding:12px 13px;margin-bottom:8px;border-radius:14px}
.cico{width:38px;height:38px;font-size:16px}

/* 계약 카드 압축 */
.balcard{padding:15px 15px 13px}
.ccard{padding:14px 15px 13px;margin-bottom:8px}
.ccard .cnm{margin-top:7px;font-size:15px}
.ccard .clb{margin-top:8px}
.ccard .cval{font-size:27px}
.ccard .cbar{margin-top:9px;height:7px}
.ccard .cmeta{margin-top:10px;padding-top:9px}
.ccard .cbtn{margin-top:10px;padding:9px}

/* 청구 안내 압축 */
.pyx{padding:13px 15px 12px}
.pyx-msg{margin-top:8px;font-size:12.5px;line-height:1.6}
.pyx-am{font-size:21px}
.pyx-bank{margin-top:9px;padding:9px 12px;gap:5px}

/* ══ 💳 회원권 잔액 + 💎 포인트 적립금 : 한 줄 요약 ══ */
.duo{display:grid;grid-template-columns:1.32fr 1fr;gap:9px;align-items:stretch;margin-top:12px}
.duo>*{min-width:0}
.duo>.sec{margin-top:0;display:flex;flex-direction:column}
.duo .ptc{flex:1;display:flex;flex-direction:column;border-radius:16px}
.duo .ptc-btn{margin-top:auto}
.duo .ptc-tip{display:none}
/* 내역을 펼치면 인보이스처럼 화면 전체 폭으로 */
.duo.exp{grid-template-columns:1fr}
.duo:not(.exp) .ptc-bal{padding:13px 14px 13px}
.duo:not(.exp) .ptc-bal .v{font-size:26px;margin-top:4px}
.duo:not(.exp) .ptc-bal .v small{font-size:14px}
.duo:not(.exp) .ptc-btn{font-size:11px;padding:11px 6px}
.duo:not(.exp) .ptc-emp{font-size:10px;padding:7px 9px;line-height:1.5;margin-top:9px}
/* 회원권 잔액 카드 (다크 네이비) */
.mbx{background:linear-gradient(140deg,#132043,#1c3162 58%,#25417f);border-radius:16px;padding:13px 14px 14px;color:#fff;
  display:flex;flex-direction:column;box-shadow:0 12px 28px -12px rgba(11,24,51,.55);text-decoration:none}
.mbx-t{display:flex;align-items:center;gap:7px}
.mbx-t .k{font-size:11.5px;font-weight:800;color:#bccbef;letter-spacing:-.01em}
.mbx-bd{margin-left:auto;font-size:9.5px;font-weight:900;border-radius:999px;padding:3px 9px;white-space:nowrap;
  background:linear-gradient(120deg,#F7DE96,#E0B453);color:#3d2c05}
.mbx-v{font-size:26px;font-weight:900;letter-spacing:-.6px;margin-top:5px;line-height:1.16;color:#fff}
.mbx-v small{font-size:14px;opacity:.72}
.mbx-l{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;font-weight:700;color:#c5d1f0;margin-top:10px}
.mbx-l b{color:#5BE3AE;font-weight:900}
.mbx-bar{height:7px;border-radius:6px;background:rgba(255,255,255,.17);margin-top:6px;overflow:hidden}
.mbx-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3BCB90,#0E9E6E)}
.mbx-go{margin-top:auto;padding-top:11px;font-size:10.5px;font-weight:800;color:#9fb6ee}
.mbx:active{transform:scale(.99)}
@media(max-width:330px){.duo{grid-template-columns:1fr}}

/* 💎 포인트 카드 압축 */
.ptc{border-radius:17px}
.ptc-hd{padding:12px 15px 8px}
.ptc-bal{padding:2px 15px 10px}
.ptc-note{font-size:10px;line-height:1.55}

/* ── 인보이스·점검보고서 2열 (내역을 펼치면 그 카드만 전체 폭) ── */
.hub2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.hub2>.sec{margin-top:0;min-width:0;display:flex;flex-direction:column}
.hub2 .hub{padding:12px 12px 11px;flex:1 0 auto}
.hub2 .hubic{width:36px;height:36px;border-radius:11px;font-size:17px}
.hub2 .hubtt{font-size:13.5px}
.hub2 .hubts{font-size:8px;letter-spacing:.08em}
.hub2 .hubt{gap:8px;flex-wrap:wrap}
.hub2 .hubst{margin-left:0;order:5;flex-basis:100%;align-self:auto;text-align:center;margin-top:7px}
.hub2 .hubg{flex-direction:column;gap:6px;margin-top:9px}
.hub2 .hubb{padding:8px 10px}
.hub2 .hubb .v{font-size:15.5px;margin-top:3px}
.hub2 .hubal{padding:8px 10px;font-size:10.5px;flex-wrap:wrap}
.hub2 .hubal .am{font-size:12px}
.hub2 .hubbtn{margin-top:9px;padding:10px 8px;font-size:11px}
.hub2>.sec:has(.hubls.open){grid-column:1/-1}
.hub2>.sec.wide{grid-column:1/-1}
.hub2.one{grid-template-columns:1fr}
@media(max-width:360px){.hub2{grid-template-columns:1fr}}

/* ── 상품권 압축 ── */
.vc2 .vtop2{padding:12px 15px 10px}
.vc2 .vbot2{padding:9px 15px 11px}

/* ── 의뢰·홈페이지 카드 2열 ── */
.act2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.act2 .rqc,.act2 .hp{margin-top:0;padding:13px 13px 12px;display:flex;flex-direction:column}
.act2 .rqt{font-size:13.5px}
.act2 .rqs,.act2 .hps{font-size:10.5px;line-height:1.5;flex:1}
.act2 .rqb,.act2 .hpb{margin-top:10px;padding:10px 8px;font-size:11px}
.act2 .rqbd{margin-bottom:6px}
.act2 .hpt{font-size:13.5px}
@media(max-width:360px){.act2{grid-template-columns:1fr}}

/* CTA · 설치 안내 · 푸터 압축 */
.cta{margin-top:11px}
.cta a{padding:13px;font-size:13px}

/* ── 기록이 없을 때의 빈 카드 (자리를 지켜 화면이 비어 보이지 않게) ── */
.hub.hubempty{background:#FBFCFE;border:1px dashed #D8E0EC;box-shadow:0 2px 10px rgba(11,24,51,.04);
  display:flex;flex-direction:column}
.hub.hubempty .hubw{flex:1;display:flex;flex-direction:column}
.hub.hubempty .hubic{opacity:.5}
.hub.hubempty .hubtt{color:var(--ink2)}
.hubst.mute{background:#F1F4F9;border:1px solid var(--bdr);color:var(--ink3)}
.hubnone{flex:1;margin-top:11px;padding:16px 10px;border-radius:13px;background:#F6F8FC;
  border:1px dashed #DEE5EF;text-align:center;display:flex;flex-direction:column;
  align-items:center;justify-content:center}
.hubnone .hne{font-size:22px;opacity:.35;line-height:1}
.hubnone .hnt{font-size:11.5px;font-weight:800;color:var(--ink2);margin-top:7px;word-break:keep-all}
.hubnone .hns{font-size:10px;font-weight:600;color:var(--ink3);margin-top:4px;line-height:1.5;word-break:keep-all}

/* ══════════ 📌 상단 고정 바로가기 메뉴 (sticky quick-nav) ══════════ */
.stnav{position:sticky;top:6px;z-index:55;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;
  background:rgba(255,255,255,.80);-webkit-backdrop-filter:saturate(160%) blur(14px);backdrop-filter:saturate(160%) blur(14px);
  border:1px solid rgba(227,232,240,.95);border-radius:18px;padding:6px;margin:0 0 13px;
  box-shadow:0 10px 28px rgba(11,24,51,.15);transition:top .26s cubic-bezier(.22,.61,.36,1)}
.stnav::-webkit-scrollbar{display:none}
.stn{flex:none;display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;font-family:inherit;
  font-size:11.5px;font-weight:800;letter-spacing:-.01em;color:#4b5563;background:transparent;
  border-radius:13px;padding:9px 12px;min-height:38px;white-space:nowrap;
  transition:background .18s,color .18s,box-shadow .18s,transform .12s}
.stn .ic{font-size:13px;line-height:1}
.stn .ct{font-size:9.5px;font-weight:900;min-width:16px;height:16px;padding:0 4px;border-radius:9px;
  background:#eef1f7;color:#6b7280;display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.stn:active{transform:scale(.95)}
.stn.on{background:linear-gradient(135deg,#0B1833,#17325E);color:#fff;box-shadow:0 6px 16px rgba(11,24,51,.32)}
.stn.on .ct{background:rgba(232,168,56,.92);color:#231603}

/* ══════════ 상단 축소 고정 헤더 + 하단 고정 액션바 ══════════ */
/* 스크롤을 내리면 나타나 고정되는 축소 헤더 — 고객명·등급·언어는 항상 노출 */
.mini{position:fixed;top:0;left:0;right:0;z-index:60;max-width:480px;margin:0 auto;
  background:rgba(11,24,51,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.10);
  padding:calc(8px + env(safe-area-inset-top)) 13px 8px;
  display:flex;align-items:center;gap:9px;
  transform:translateY(-115%);transition:transform .26s cubic-bezier(.22,.61,.36,1);
  box-shadow:0 6px 20px rgba(11,24,51,.32)}
.mini.show{transform:none}
.mini .mk{width:26px;height:26px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
  font-size:8.5px;font-weight:900;color:#E3C98A;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2)}
.mini .mi{flex:1;min-width:0}
.mini .mn{color:#fff;font-size:13px;font-weight:900;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mg{display:inline-flex;align-items:center;gap:4px;margin-top:3px;font-size:9.5px;font-weight:800;
  color:#f3cd7e;background:rgba(232,168,56,.14);border:1px solid rgba(232,168,56,.42);border-radius:20px;padding:1px 8px;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .ml{display:flex;gap:3px;flex:none}
.mini .ml button{border:none;cursor:pointer;font-family:inherit;font-size:9.5px;font-weight:800;
  padding:4px 9px;border-radius:12px;background:rgba(255,255,255,.12);color:#aebadb}
.mini .ml button.on{background:#fff;color:#0B1833}

/* 화면 맨 아래 항상 고정되는 액션 바 */
.fixbar{position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:480px;margin:0 auto;
  display:flex;gap:7px;padding:9px 11px calc(9px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--bdr);box-shadow:0 -6px 22px rgba(11,24,51,.13)}
.fb{display:flex;align-items:center;gap:7px;text-decoration:none;border-radius:14px;
  padding:10px;min-width:0;transition:transform .12s}
.fb .ic{font-size:16px;flex:none;line-height:1}
.fb .tx{min-width:0;display:flex;flex-direction:column;line-height:1.18}
.fb .tx b{font-size:12.5px;font-weight:900;letter-spacing:-.03em;white-space:nowrap}
.fb .tx i{font-style:normal;font-size:9px;font-weight:700;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.fb.rq{flex:1.16;background:linear-gradient(125deg,#0BB5A4,#0d9488 60%,#0f766e);color:#fff;
  box-shadow:0 6px 16px rgba(11,181,164,.36)}
.fb.rq .tx i{color:#d3faf4}
.fb.hp{flex:1;background:linear-gradient(125deg,#22345f,#0B1833 70%);color:#fff;
  box-shadow:0 6px 16px rgba(11,24,51,.32)}
.fb.hp .tx i{color:#a9bbdd}
.fb.wa{flex:none;width:50px;justify-content:center;flex-direction:column;gap:1px;padding:7px 4px;
  background:linear-gradient(145deg,#2ee06a,#1eb055);color:#fff;box-shadow:0 6px 16px rgba(34,197,94,.36)}
.fb.wa .ic{font-size:17px}
.fb.wa .wl{font-size:8.5px;font-weight:900;letter-spacing:-.02em}
.fb:active{transform:scale(.97)}
@media(max-width:372px){.fb .tx i{display:none}.fb .tx b{font-size:12px}.fb.wa{width:46px}}
/* 고정 바에 본문이 가리지 않도록 아래 여백 확보 */
.body{padding-bottom:calc(92px + env(safe-area-inset-bottom))!important}
/* ═══ 문서 뷰어 : 인보이스·점검보고서·계약서·상품권·견적서를 앱 안에서 열기 ═══
   새 탭으로 띄우면 카카오톡·왓츠앱 인앱 브라우저나 설치형 앱(PWA)에서
   「닫기」를 눌렀을 때 앱 전체가 함께 닫혀 버리므로, 이 화면 위에 겹쳐서 엽니다. */
#mv-wrap{position:fixed;inset:0;z-index:99999;background:#fff;display:none;flex-direction:column}
#mv-wrap.open{display:flex}
#mv-bar{flex-shrink:0;display:flex;align-items:center;gap:7px;
  padding:calc(9px + env(safe-area-inset-top)) 11px 9px;
  background:linear-gradient(120deg,#0B1833,#16264a);box-shadow:0 2px 12px rgba(11,24,51,.22)}
#mv-bar button{font-family:inherit;font-size:12.5px;font-weight:900;border-radius:9px;padding:8px 13px;
  cursor:pointer;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.13);color:#fff;white-space:nowrap}
#mv-bar #mv-back{background:#fff;color:#0B1833;border-color:#fff;display:none}
#mv-bar #mv-back.on{display:block}
#mv-bar #mv-x{background:#fff;color:#0B1833;border-color:#fff}
#mv-ttl{flex:1;min-width:0;font-size:12.5px;font-weight:900;color:#dbe4fb;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mv-body{flex:1;min-height:0;position:relative;background:#f4f6fb}
#mv-body iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:block;background:#fff}
#mv-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;color:#7b8698;background:#f4f6fb;z-index:2}
#mv-load.off{display:none}

/* ══════════════════════════════════════════════════════════════
   2026-08 입체감 개선 (Depth Layer)
   ─ 표시 전용입니다. 화면 구조·문구·기능·데이터는 하나도 바꾸지 않고
     그림자·표면 질감·여백·글자 크기만 다듬어 읽기 쉽게 만듭니다.
   ─ 규칙 : ① 접촉 그림자(가까운) + ② 확산 그림자(먼) 두 겹을 겹쳐
     카드가 바닥에서 실제로 떠 있는 것처럼 보이게 합니다.
   ══════════════════════════════════════════════════════════════ */
:root{
  --e1:0 1px 2px rgba(11,24,51,.09), 0 5px 12px -3px rgba(11,24,51,.14);
  --e2:0 1px 2px rgba(11,24,51,.10), 0 8px 16px -4px rgba(11,24,51,.16), 0 26px 44px -14px rgba(11,24,51,.34);
  --e3:0 2px 6px rgba(11,24,51,.16), 0 14px 26px -6px rgba(11,24,51,.24), 0 38px 68px -18px rgba(11,24,51,.48);
  --edark:0 3px 8px rgba(6,14,35,.34), 0 16px 30px -8px rgba(6,14,35,.46), 0 44px 80px -20px rgba(6,14,35,.78);
  --hl:inset 0 1.5px 0 rgba(255,255,255,1), inset 0 0 0 1px rgba(255,255,255,.6);
  --hld:inset 0 1.5px 0 rgba(255,255,255,.34);
  --line:rgba(19,32,67,.14);
}
/* ── 바닥 : 평평한 회색 대신 은은한 빛 그라데이션 ── */
body{background:#E7EBF4}
.page{background:
  radial-gradient(120% 55% at 82% 0%, rgba(79,110,247,.10), transparent 60%),
  radial-gradient(90% 45% at 0% 30%, rgba(11,181,164,.08), transparent 62%),
  linear-gradient(180deg,#EFF2F9 0%,#E7EBF4 55%,#E1E7F2 100%);
  box-shadow:0 0 70px rgba(11,24,51,.16)}

/* ── 흰 카드 : 위쪽이 밝은 미세 그라데이션 + 두 겹 그림자 + 윗면 하이라이트 ── */
.ccard,.ccard.t-gold,.ccard.t-silver,.ccard.t-diamond,.ccard.t-royal,.ccard.t-titanium,.ccard.t-special,
.hub,.hub.iv,.hub.ip,.ncard,.icard,.mmc,.balcard,.hubcls,.ecbtn,.ptc-cls,.ptc-ls{
  background-image:linear-gradient(180deg,#FFFFFF 0%,#F6F8FD 100%);
  border:1px solid var(--line);
  box-shadow:var(--e2), var(--hl)}
.ccard,.hub,.balcard{border-radius:18px}
.ncard,.icard,.mmc{border-radius:15px}
.ptc-ls{border:none;border-radius:0}

/* ── 컬러 카드(짙은 배경) : 더 깊은 그림자 + 윗면 하이라이트 ── */
.hero{box-shadow:var(--edark), var(--hld)}
.ptc,.mbx,.vc2,.a2hs{box-shadow:var(--e3), var(--hld)}
.pyx{box-shadow:0 1px 2px rgba(180,83,9,.07), 0 14px 30px -12px rgba(180,83,9,.30)}
.mbx{box-shadow:var(--edark), var(--hld)}

/* ── 안쪽 타일 : 살짝 파인 느낌(inset)으로 층을 하나 더 만든다 ── */
.hubb,.mmtile,.itile,.ntile{
  background-image:linear-gradient(180deg,#F3F6FC 0%,#FAFCFF 100%);
  border:1px solid rgba(19,32,67,.10);
  box-shadow:inset 0 2px 4px rgba(19,32,67,.09), inset 0 -1px 0 rgba(255,255,255,.9)}
.ptc-row>div{box-shadow:inset 0 1px 0 rgba(255,255,255,.13)}

/* ── 버튼 : 눌리는 느낌 ── */
.hubbtn,.hubcls,.ecbtn,.ptc-cls,.a2hs-btn,.fb,.cbtn,.vgo,.nbtn,.bkb,.bkm-go,.pmx-ok{
  transition:transform .14s ease, box-shadow .14s ease}
.hubbtn{box-shadow:0 1px 2px rgba(6,14,35,.16), 0 8px 18px -6px rgba(6,14,35,.34)}
.hubbtn:active,.hubcls:active,.ecbtn:active,.ptc-cls:active,.a2hs-btn:active,.fb:active{
  transform:translateY(2px) scale(.99);box-shadow:0 1px 2px rgba(11,24,51,.12)}
.ccard:active,.ncard:active,.icard:active,.vc2:active,.mbx:active{transform:translateY(2px) scale(.995);box-shadow:var(--e1)}
.ccard,.ncard,.icard,.vc2,.mbx{transition:transform .14s ease, box-shadow .14s ease}

/* ── 섹션 제목 : 왼쪽 액센트 바로 시작점을 분명히 ── */
.sh{position:relative;padding-left:11px;font-size:14.5px;letter-spacing:-.03em}
.sh:before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:4px;height:16px;border-radius:3px;background:linear-gradient(180deg,#C9A44C,#B98A16);
  box-shadow:0 2px 6px rgba(185,138,22,.45)}
.duo .sh{font-size:13px;padding-left:9px}

/* ── 금액·숫자 : 자릿수 정렬 + 또렷한 자간 ── */
.cval,.mbx-v,.ptc-bal .v,.pyx-am,.balcard .val,.vval2,.hubb .v,.nsum,.mmv,.amt{
  font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* ── 작은 글자 키워 가독성 확보 ── */
.hubb .k,.mmk,.bar-lb,.cbl,.mbx-l{font-size:11px}
.hubts{font-size:10.5px;letter-spacing:0}
.ptc-note{font-size:11.5px;line-height:1.7}
.foot{font-size:11.5px;line-height:1.85}
.ptr .bx b{font-size:13px}
.ptr .bx span{font-size:11px}

/* ── 구분선은 옅은 실선으로 통일 ── */
.cmeta,.balrow,.ci-actions{border-top-color:var(--line)!important}

/* ── 상단 축소 헤더 · 하단 고정바 : 유리질감 + 확실한 층 분리 ── */
.mini{backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  box-shadow:0 1px 0 rgba(255,255,255,.10), 0 10px 26px -10px rgba(6,14,35,.6)}
.fixbar{backdrop-filter:saturate(160%) blur(16px);-webkit-backdrop-filter:saturate(160%) blur(16px);
  box-shadow:0 -1px 0 rgba(255,255,255,.85), 0 -2px 0 var(--line), 0 -22px 44px -18px rgba(11,24,51,.45)}
.fb{box-shadow:0 2px 4px rgba(6,14,35,.20), 0 10px 20px -6px rgba(6,14,35,.42)}

/* ── 배지 · 상태 칩도 살짝 띄운다 ── */
.mem,.mbx-bd,.ctier,.cstat,.hubst,.sh .n,.ci-status,.ptc-pill,.ptc-rule{
  box-shadow:0 1px 2px rgba(11,24,51,.10), 0 3px 8px -3px rgba(11,24,51,.18)}
.ava{box-shadow:0 4px 10px rgba(6,14,35,.45), inset 0 1.5px 0 rgba(255,255,255,.35)}
.hubic{box-shadow:0 2px 6px rgba(11,24,51,.12), inset 0 1px 0 #fff}

/* ── 카드 사이 숨 쉴 공간 + 본문 줄간격 ── */
.sec{margin-top:15px}
.body{line-height:1.6}
.hub2,.duo{gap:10px}

/* ── 컴팩트 내역 카드 : 인보이스·점검보고서 내역 — 한 화면에 더 많이 ── */
.dcw.sm{margin-bottom:7px}
.ncard.nsm .nbody{padding:8px 10px 8px 9px}

/* ══ 📌 발송 메시지가 가리키는 섹션 강조 ═══════════════════════
   관리자가 「청구 안내」로 보내면 인보이스가, 「점검보고서」로 보내면
   점검보고서가 화면 가운데로 오면서 테두리가 파랑↔금색으로 깜빡입니다.
   깜빡임이 끝난 뒤에도 금색 테두리가 남아 있다가 화면을 한 번 누르면 사라집니다. */
@keyframes hiPulse{
  0%  {box-shadow:0 0 0 2px rgba(224,158,20,.85),0 12px 30px -12px rgba(224,158,20,.55)}
  35% {box-shadow:0 0 0 4px rgba(37,99,235,.85),0 0 30px 8px rgba(37,99,235,.45)}
  70% {box-shadow:0 0 0 2px rgba(224,158,20,.9),0 0 26px 6px rgba(224,158,20,.5)}
  100%{box-shadow:0 0 0 2px rgba(224,158,20,.85),0 12px 30px -12px rgba(224,158,20,.55)}
}
@keyframes hiChip{
  0%,100%{opacity:1;box-shadow:0 4px 12px -3px rgba(184,124,10,.7),inset 0 1px 0 rgba(255,255,255,.7)}
  50%{opacity:.72;box-shadow:0 3px 9px -3px rgba(37,99,235,.6),inset 0 1px 0 rgba(255,255,255,.7)}
}
.hi-focus{position:relative;z-index:3;border-radius:20px;
  box-shadow:0 0 0 2px rgba(224,158,20,.8),0 12px 30px -12px rgba(224,158,20,.5);
  animation:hiPulse 1.35s ease-in-out 6}
.hi-focus.done{animation:none}
/* 설치 안내 카드처럼 넘치는 부분을 잘라내는(overflow:hidden) 상자는
   배지가 위로 튀어나가면 잘려 보입니다. 그럴 때는 배지를 상자 안쪽에 두고
   그만큼 위 여백을 넓혀 글자와 겹치지 않게 합니다. */
.hi-focus.hi-inset{padding-top:38px}
.hi-chip.inset{top:11px}
/* 문서가 짧아 마지막 카드가 화면 가운데까지 올라오지 못할 때 쓰는 임시 여백 */
#hi-spacer{height:0;transition:height .35s ease}
.hi-chip{position:absolute;top:-13px;left:50%;transform:translateX(-50%);z-index:6;pointer-events:none;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;max-width:94%;
  font-size:11px;font-weight:900;letter-spacing:-.01em;color:#4A3200;
  background:linear-gradient(140deg,#FFD873,#E8A838);border-radius:999px;padding:5px 11px;
  box-shadow:0 4px 12px -3px rgba(184,124,10,.65),inset 0 1px 0 rgba(255,255,255,.7);
  animation:hiChip 1.35s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){
  .hi-focus{animation:none}.hi-chip{animation:none}
}

/* 문서 현황 행 — 바깥 껍데기(구 카드 스타일) 제거 */
.hub2 .sec{margin:0;background:none!important;border:none!important;box-shadow:none!important;padding:0!important;border-radius:0}
.hub2 .hub,.hub.mm{background:none!important;border-radius:0;padding:0!important;box-shadow:none!important;color:inherit}
#sec-mm,#sec-qt{background:none!important;border:none!important;box-shadow:none!important;padding:0!important;margin-top:8px}
.hub .hubbg{display:none}

/* ═══ 📄 내역·문서 팝업 (전체 화면 시트) ═══ */
.hubls.open{position:fixed!important;inset:0;z-index:260;display:block;margin:0!important;
  background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(10px + env(safe-area-inset-top)) 13px calc(20px + env(safe-area-inset-bottom));
  animation:hubSheet .24s cubic-bezier(.22,.8,.28,1)!important}
@keyframes hubSheet{from{opacity:0}to{opacity:1}}
body.popon .topbar,body.popon .fixbar,body.popon .qtiles{display:none!important}
.hubls.open .lshd{position:sticky;top:0;z-index:3;margin:-4px -3px 10px;padding:11px 12px;
  box-shadow:0 6px 16px -8px rgba(11,24,51,.35)}
.hubls.open .hubcls{margin-top:14px}
@media (prefers-reduced-motion:reduce){.hubls.open{animation:none!important}}

/* ═══ 🧭 2026-08-23 : 결제정보 팝업 · 요약카드 컴팩트 ═══ */
.bkov{position:fixed;inset:0;z-index:300;background:rgba(8,16,34,.56);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:20px}
.bkpop{width:100%;max-width:400px;animation:bkin .22s ease}
@keyframes bkin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.bkpop .bankc{box-shadow:0 8px 20px rgba(4,12,26,.35),0 30px 70px -18px rgba(4,12,26,.65)}
.bk-due{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FEF5F4;border:1px solid #F5C9C4;
  border-radius:11px;padding:9px 12px;margin:2px 0 10px;font-size:11.5px;font-weight:800;color:#B3564C}
.bk-due b{font-size:15px;font-weight:900;color:#DC2626;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.bk-x{width:100%;margin-top:8px;border:1px solid var(--bdr);background:#F6F8FC;color:#5A6478;cursor:pointer;font-family:inherit;
  font-size:12.5px;font-weight:800;border-radius:11px;padding:11px}
.bk-x:active{transform:translateY(1px)}
.bkpop .bk-r .v{word-break:keep-all}
.satt{margin-left:6px;font-size:9px;font-weight:800;color:#0f766e;background:#EAF6F3;border:1px solid #B8E0D8;border-radius:6px;padding:1px 5px;white-space:nowrap;vertical-align:1px}
/* 회원권 잔액 · 포인트 적립금 — 닫힌 상태 컴팩트 */
.duo:not(.exp) .ptc-emp{display:none!important}
.duo:not(.exp) .mbx{padding:11px 13px 12px}
.duo:not(.exp) .mbx-v{margin-top:3px}
.duo:not(.exp) .mbx-l{margin-top:7px}

// ══ 📱 설치 오버레이 : 「설치 안내 링크·외부 브라우저로 전환된 직후」 스크롤 없이 바로 설치 ══
//  · 카카오톡·삼성 인터넷에서 기본 브라우저로 넘어올 때 주소에 install=1 을 실어 보내고,
//    새로 열린 브라우저는 이 표시를 보고 설치 창구를 화면 위에 바로 띄웁니다.
//  · 앱 설치 안내 발송(f=ap)으로 열려도 똑같이 바로 띄웁니다.
function a2InstallSearch(){
  const q=new URLSearchParams(location.search);
  q.set('install','1');
  return '?'+q.toString();
}
function a2InstallUrl(){return location.origin+location.pathname+a2InstallSearch()+location.hash;}
function a2mClose(){
  const ov=document.getElementById('a2m-ov');
  if(ov){ov.classList.remove('on');document.body.style.overflow='';}
}
function a2mShow(){
  if(IS_APP)return;
  let done=false;try{done=localStorage.getItem('hhc_a2hs_done')==='1';}catch(e){}
  if(done)return;
  const L=T[LANG],en=(LANG==='en');
  let ov=document.getElementById('a2m-ov');
  if(!ov){
    ov=document.createElement('div');ov.id='a2m-ov';ov.className='a2m-ov';
    document.body.appendChild(ov);
    ov.addEventListener('click',e=>{if(e.target===ov)a2mClose();});
  }
  let body='';
  if(IS_KAKAO&&/^https?:$/.test(location.protocol)){
    // 카카오톡 안 — 기본 브라우저로 여는 버튼 하나만 크게
    const ext='kakaotalk://web/openExternal?url='+encodeURIComponent(a2InstallUrl());
    body='<a class="a2hs-btn pulse" style="display:block;text-align:center;text-decoration:none" href="'+esc(ext)+'">'+
      (IS_IOS?(en?'🌐 Open in Safari':'🌐 Safari에서 열기'):L.a2kBtn)+'</a>'+
      '<div class="a2hs-how"><div class="a2hs-st"><span class="n">1</span><span>'+L.a2k1+'</span></div>'+
      '<div class="a2hs-st"><span class="n">2</span><span>'+(en?'Tap Install on the screen that opens — done!':'열린 화면에서 설치 버튼만 누르면 완료!')+'</span></div></div>';
  }else if(IS_IOS){
    body='<div class="a2hs-how">'+
      '<div class="a2hs-st"><span class="n">1</span><span>'+L.a2i1+'</span></div>'+
      '<div class="a2hs-st"><span class="n">2</span><span>'+L.a2i2+'</span></div>'+
      '<div class="a2hs-st"><span class="n">3</span><span>'+L.a2i3+'</span></div></div>'+
      '<button type="button" class="a2hs-btn" id="a2m-ok">'+(en?'Got it':'확인했어요')+'</button>';
  }else if((IS_SAMSUNG||IS_INAPP)&&/^https?:$/.test(location.protocol)){
    const chr='intent://'+location.host+location.pathname+a2InstallSearch()+
      '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(a2InstallUrl())+';end';
    body='<a class="a2hs-btn pulse" style="display:block;text-align:center;text-decoration:none" href="'+esc(chr)+'">'+L.a2sBtn+'</a>'+
      '<div class="a2hs-how"><div class="a2hs-st"><span class="n">1</span><span>'+L.a2s1+'</span></div>'+
      '<div class="a2hs-st"><span class="n">2</span><span>'+L.a2s2+'</span></div></div>';
  }else{
    // Android Chrome 등 — 버튼 한 번이면 휴대폰 설치창이 뜹니다
    body='<button type="button" class="a2hs-btn pulse" id="a2m-install">'+L.a2Btn+'</button>'+
      '<div class="a2hs-go" style="margin-top:10px">'+L.a2go+'</div>'+
      '<div class="a2hs-how" id="a2m-how" style="display:none">'+
      '<div class="a2hs-st"><span class="n">1</span><span>'+L.a2a1+'</span></div>'+
      '<div class="a2hs-st"><span class="n">2</span><span>'+L.a2a2+'</span></div></div>';
  }
  ov.innerHTML='<div class="a2m">'+
    '<button type="button" class="x" id="a2m-x">✕</button>'+
    '<div class="ic">📱</div>'+
    '<div class="t">'+L.a2T+'</div>'+
    '<div class="s">'+L.a2S+'</div>'+body+
    '<button type="button" class="later" id="a2m-later">'+(en?'Maybe later':'다음에 할게요')+'</button></div>';
  ov.classList.add('on');
  document.body.style.overflow='hidden';
  ov.querySelector('#a2m-x').onclick=a2mClose;
  ov.querySelector('#a2m-later').onclick=a2mClose;
  const okB=ov.querySelector('#a2m-ok');
  if(okB)okB.onclick=a2mClose;
  const inst=ov.querySelector('#a2m-install');
  if(inst)inst.onclick=async function(){
    inst.disabled=true;
    // 설치 이벤트가 아직 도착 전이면 잠시(최대 3.5초) 기다립니다 — 페이지가 열리자마자 눌러도 동작하게
    let waited=0;
    while(!_a2hsEv&&waited<3500){await new Promise(r=>setTimeout(r,250));waited+=250;}
    if(!_a2hsEv){
      // 설치창을 지원하지 않는 환경 — 수동 안내를 펼칩니다
      const hw=ov.querySelector('#a2m-how');if(hw)hw.style.display='';
      inst.disabled=false;inst.classList.remove('pulse');
      return;
    }
    _a2hsEv.prompt();
    let ch=null;try{ch=await _a2hsEv.userChoice;}catch(e){}
    _a2hsEv=null;inst.disabled=false;
    if(ch&&ch.outcome==='accepted'){a2hsDone();a2mClose();}
  };
}

    const _s=JSON.parse(localStorage.getItem('hhc_my_last')||'null');

  }
}catch(e){}

//                  구형 바로가기 패키지로 판단해 설치를 차단하는 문제가 있었음)
// * Android : manifest.json 의 시작 주소(c= 없음)로 열려도 위의 localStorage 복원으로 자기 페이지 표시
// * iOS     : manifest 를 연결하지 않음 — 홈 화면 추가 시 현재 주소(c= 포함) 그대로 저장되는 방식이

(function(){
  if(!/^https?:$/.test(location.protocol))return;
  if(!IS_IOS){
    const l=document.createElement('link');l.rel='manifest';l.href='my-manifest.json';
    document.head.appendChild(l);
  }
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pn(p){p=String(p||'').replace(/[^0-9]/g,'');if(p.indexOf('60')===0)p=p.slice(2);return p.replace(/^0+/,'');}
function nn(n){return String(n||'').toLowerCase().replace(/\s+/g,'');}
function fmt(v){const n=parseFloat(v)||0;return n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmt0(v){const n=parseFloat(v)||0;return n.toLocaleString('en-MY',{maximumFractionDigits:0});}
function invTotal(inv){
  if(inv.grand!=null)return parseFloat(inv.grand)||0;
  if(inv.total!=null)return parseFloat(inv.total)||0;
  let t=0;(inv.items||[]).forEach(it=>{t+=(parseFloat(it.qty)||1)*(parseFloat(it.price)||0);});
  return t;
}
// 기결제(일부 결제) 합계 — paidAmount 우선, 없으면 payments[] 합산
function invPaid(inv){
  if(inv.paidAmount!=null)return parseFloat(inv.paidAmount)||0;
  let t=0;(inv.payments||[]).forEach(p=>{t+=parseFloat(p&&p.amt)||0;});
  return t;
}
// 실제 청구(잔여) 금액 = 총액 - 기결제
function invDue(inv){return Math.max(0,invTotal(inv)-invPaid(inv));}

function toEn(t){
  t=String(t||'');
  if(!/[\uAC00-\uD7A3]/.test(t))return t;      // 이미 영문이면 그대로
  for(var i=0;i<_RPK.length;i++){if(t.indexOf(_RPK[i])>=0)t=t.split(_RPK[i]).join(RP_EN[_RPK[i]]);}

  t=t.replace(/[\uAC00-\uD7A3]+/g,' ')
     .replace(/\s{2,}/g,' ')
     .replace(/\s+([,.])/g,'$1')
     .replace(/\s*·\s*/g,' · ')
     .replace(/^[\s·,]+|[\s·,]+$/g,'')
     .trim();
  return t;
}

function dparse(s){const m=String(s==null?'':s).match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d.getTime())?null:d;}
function dfmt(s){const d=dparse(s);return d?(d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate())):String(s==null?'':s);}
const WD_KO=['일','월','화','수','목','금','토'],WD_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

function today0(){const t=new Date();t.setHours(0,0,0,0);return t;}
// 경과 일수(양수=지난 날짜) / 남은 일수(양수=아직 유효)
function daysAgo(s){const d=dparse(s);if(!d)return null;return Math.round((today0()-d)/86400000);}
function daysLeft(s){const d=dparse(s);if(!d)return null;return Math.round((d-today0())/86400000);}
// ── 예약 시간 문자열 → 그날의 분 단위 시각 (파싱 실패 시 null) ──
//    지원 형식 : "09:00", "09:00 전후|Around 09:00", "Around 09:00", "오전 9시", "오후 2시 30분", "2:00 PM"
// ── 👑 회원 구분(관리자 자유 입력) 영문 변환 ──
//    예) "패키지 - 티타늄회원" → "Package - Titanium Member"
var MEM_EN=[['티타늄','Titanium'],['다이아몬드','Diamond'],['다이아','Diamond'],['플래티넘','Platinum'],
  ['플래티너','Platinum'],['스페셜','Special'],['로얄','Royal'],['골드','Gold'],['실버','Silver'],
  ['브론즈','Bronze'],['패키지','Package'],['회원권','Membership'],['정회원','Member'],['회원','Member'],
  ['기업','Business'],['법인','Corporate'],['일반','Standard'],['등급','Grade']];
function memLb(v){
  v=String(v==null?'':v);
  if(LANG!=='en'||!/[\uAC00-\uD7A3]/.test(v))return v;
  MEM_EN.forEach(function(p){v=v.split(p[0]).join(p[1]);});
  return v.replace(/([a-z])([A-Z])/g,'$1 $2')
          .replace(/\s{2,}/g,' ').replace(/(Package|Membership)\s*(Member)\b/,'$1').trim();
}
// ── 🕘 예약 시간 문구 영문 변환 : "09:00 전후" → "Around 09:00" ──
function bkTimeLb(t){
  t=String(t==null?'':t);
  if(LANG!=='en'||!t)return t;
  if(t.indexOf('|')>=0)return t.split('|')[1].trim()||t.split('|')[0].trim();
  var m=t.match(/^\s*(.+?)\s*전후\s*$/);
  if(m)return 'Around '+m[1];
  return t.replace(/오전\s*/g,'').replace(/오후\s*/g,'')
          .replace(/(\d{1,2})\s*시\s*(\d{1,2})\s*분/g,'$1:$2')
          .replace(/(\d{1,2})\s*시/g,'$1:00')
          .replace(/전후/g,'').trim();
}
function bkMinutes(t){
  t=String(t==null?'':t);
  if(!t)return null;
  const pm=/오후|PM|P\.M\./i.test(t), am=/오전|AM|A\.M\./i.test(t);
  let h=null,mi=0;
  const m1=t.match(/(\d{1,2})\s*:\s*(\d{2})/);
  if(m1){h=parseInt(m1[1],10);mi=parseInt(m1[2],10);}
  else{
    const m2=t.match(/(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/);
    if(m2){h=parseInt(m2[1],10);mi=m2[2]?parseInt(m2[2],10):0;}
  }
  if(h==null||isNaN(h)||isNaN(mi))return null;
  if(pm&&h<12)h+=12;
  if(am&&h===12)h=0;
  if(h>23||mi>59)return null;
  return h*60+mi;
}
// ── 확정 예약이 화면에서 사라지는 시각 ──
//    예약 시간이 있으면 그 시각 정각, 시간 정보가 없으면 예약일 자정(그날까지 표시)
function bkHideAt(x){
  const d=dparse(x&&x.booking_date);
  if(!d)return null;
  const t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0,0);
  const mm=bkMinutes(x&&x.booking_time);
  if(mm==null)t.setDate(t.getDate()+1);
  else t.setMinutes(mm);
  return t.getTime();
}

function balCalc(c){
  const paid=parseFloat(c.amount_paid)||0,bonus=(parseFloat(c.bonus_credit)||0)+(parseFloat(c.special_bonus_credit)||0);
  const total=paid+bonus;
  let h=[];try{h=typeof c.usage_history==='string'?JSON.parse(c.usage_history||'[]'):(c.usage_history||[]);}catch(e){}
  const used=h.reduce((s,u)=>s+(parseFloat(u.amount)||0),0);
  const disc=h.reduce((s,u)=>s+(parseFloat(u.discount)||0),0);
  const carry=h.reduce((s,u)=>s+(parseFloat(u.carryover)||0),0);
  const svcCnt=h.filter(u=>(parseFloat(u.amount)||0)>0).length;
  return {paid,bonus,total,netUsed:Math.max(0,used-disc-carry),remain:total-used+disc+carry,cnt:svcCnt};
}

// ═══ 💎 포인트 적립 (RM100 당 RM1) ═══
// 🧰 실비 항목(자재비용·설치자재비용·에어컨구매비용) 적립 제외 「시작일」
//    별도 상수를 두지 않고 「적립 적용시작일(settings/points · pt_start)」을 그대로 따른다.
//    → 관리자가 총괄 고객관리에서 📅 적용시작일을 바꾸면 제외 규칙 시점도 함께 움직인다.
//    → 시작일 이전 발행분은 애초에 적립 대상이 아니므로 과거 적립금은 영향받지 않는다.
function ptExclFrom(){return String((typeof DATA!=='undefined'&&DATA&&DATA.ptStart)||'');}
// 적립 기준액 : 세금·주차비용·최소청구·추가비용 제외 (품목 소계 − 전체 할인 − 상품/할인권)
// 실비 항목(자재비용·설치자재비용·에어컨구매비용)과 회원제상품 가입금액도 제외
// 패키지 회원은 회원적립잔액(creditUse) 차감 「전」 금액 기준
function ptBase(x,pkg){
  // 🧰 실비 항목 제외 규칙은 「적립 적용시작일」 이후 발행분에만 적용 (과거 인보이스 적립금 보존)
  const _pf=ptExclFrom();
  const _newRule = !_pf || String(x.date||'') >= _pf;
  let sub=0;(x.items||[]).forEach(it=>{
    const _c=String(it.cat||''),_s=String(it.subcat||''),_n=String(it.name||'');
    // 📦 package plan(회원제상품 · 가정용/매장용) 가입금액은 적립 대상에서 제외
    if(/^회원제상품/.test(_c)||/^회원제상품/.test(_s)||/package\s*plan/i.test(_n))return;
    // 🧰 자재비용 · 설치자재비용 · 에어컨구매(구입)비용
    if(_newRule){
      if(/자재/.test(_c)||/자재/.test(_s)||/(구매|구입)\s*비용/.test(_c)||/(구매|구입)\s*비용/.test(_s))return;
      if(/자재비/.test(_n)||/에어컨\s*(구매|구입)/.test(_n)||/material/i.test(_n))return;
    }
    const amt=(parseFloat(it.price)||0)*(parseFloat(it.qty)||1);
    const d=it.discType==='pct'?amt*((parseFloat(it.discVal)||0)/100):(parseFloat(it.discVal!=null?it.discVal:it.disc)||0);
    sub+=amt-d;
  });
  const dv=parseFloat(x.discVal)||0;
  const disc=x.discType==='pct'?dv/100*sub:dv;
  const credit=parseFloat(x.creditUse)||0;
  const voucher=parseFloat(x.voucherAmt)||0;
  const ptsUse=parseFloat(x.pointUse)||0;
  let b=sub-disc-voucher-ptsUse;
  if(!(pkg||credit>0))b-=credit;
  return Math.max(0,b);
}

let _cpPopShown=false;
function showCpPopup(){
  const live=((DATA&&DATA.coupons)||[]).filter(x=>{const dl=daysLeft(x.expiry);return x.status==='active'&&!(dl!=null&&dl<0);});
  if(_cpPopShown||!live.length){showPayPopup();return;}
  _cpPopShown=true;
  const L=T[LANG],en=(LANG==='en');
  // 만료가 임박한 순 → 상품권 우선
  live.sort((a,b)=>{
    const da=daysLeft(a.expiry),db=daysLeft(b.expiry);
    return (da==null?99999:da)-(db==null?99999:db);
  });
  const c=live.find(x=>x.type!=='discount')||live[0];
  const disc=(c.type==='discount');
  const dl=daysLeft(c.expiry);
  const lnk=BASE+'/coupon.html?id='+encodeURIComponent(c.__id)+(en?'&lang=en':'');
  const row=(k,v)=>'<div class="pmx-bk"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';
  let bk='';
  const kindTx=disc?(en?'Discount Coupon':'할인권'):(en?'Gift Voucher':'상품권');
  bk+=row(L.cpPopKind,kindTx);
  if(c.code)bk+=row('CODE','<span class="num">'+esc(c.code)+'</span>');
  if(c.expiry)bk+=row(L.expiry,esc(dfmt(c.expiry))+((dl!=null&&dl<=30)?' · D-'+dl:''));
  if(c.receiver)bk+=row(L.recv,esc(c.receiver));
  if(c.cond)bk+=row(L.cpPopCond,esc(c.cond));
  const more=live.length>1?'<div class="pmx-more">🎫 '+String(L.cpPopMore).replace('{n}',live.length-1)+'</div>':'';
  const ov=document.createElement('div');
  ov.className='pmx-ov';
  ov.innerHTML='<div class="pmx" role="alertdialog" aria-modal="true">'+
    '<div class="pmx-hd cp"><span class="ic">'+(disc?'🏷️':'🎁')+'</span><div><div class="t">'+(disc?L.cpPopTd:L.cpPopT)+'</div><div class="s">'+(disc?L.cpPopSd:L.cpPopS)+'</div></div></div>'+
    '<div class="pmx-bd">'+
    '<div class="pmx-msg">'+String(L.cpPopMsg).replace('{k}','<b>'+(disc?(en?'Discount Coupon':'할인권'):(en?'Gift Voucher':'상품권'))+'</b>')+
      '<div style="margin-top:9px"><span class="am cp">'+esc(c.value||'')+'</span></div></div>'+
    '<div class="pmx-bank cp">'+bk+'</div>'+
    more+
    '<a class="pmx-ok cp" id="cp-go" href="'+lnk+'" target="_blank" rel="noopener" style="display:block;text-align:center;text-decoration:none">'+(disc?L.cpPopGoD:L.cpPopGo)+' →</a>'+
    '<button type="button" class="pmx-later" id="cp-later">'+L.cpPopLater+'</button>'+
    '</div></div>';
  document.body.appendChild(ov);
  requestAnimationFrame(()=>ov.classList.add('on'));
  const close=()=>{ov.classList.remove('on');setTimeout(()=>{ov.remove();showPayPopup();},230);};
  ov.querySelector('#cp-later').onclick=close;
  ov.querySelector('#cp-go').addEventListener('click',()=>setTimeout(close,400));
}

// ── 예약 시각이 되면 화면을 새로 그려 확정 카드를 즉시 없앤다 ──
let _bkTimer=null;
function bkRerender(){
  if(!DATA)return;
  const y=window.scrollY;
  render();
  window.scrollTo(0,y);
}
function scheduleBkHide(){
  if(_bkTimer){clearTimeout(_bkTimer);_bkTimer=null;}
  if(!DATA)return;
  const now=Date.now();
  let next=null;
  (DATA.bookings||[]).forEach(x=>{
    if(x.status!=='confirmed')return;
    const at=bkHideAt(x);
    if(at!=null&&at>now&&(next==null||at<next))next=at;
  });
  if(next==null)return;
  const wait=Math.min(next-now+400,21600000);   // 최대 6시간마다 다시 확인
  _bkTimer=setTimeout(bkRerender,wait);
}
// 화면이 꺼져 있던 사이에 예약 시각이 지났다면 다시 열 때 바로 반영
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible'||!DATA)return;
  const now=Date.now();
  const stale=(DATA.bookings||[]).some(x=>{
    if(x.status!=='confirmed')return false;
    const at=bkHideAt(x);
    return at!=null&&at<=now;
  });
  if(stale)bkRerender();
});

function hiClear(){
  document.querySelectorAll('.hi-focus').forEach(function(el){el.classList.remove('hi-focus','done','hi-inset');});

  var sp=document.getElementById('hi-spacer');
  if(sp){sp.style.height='0px';setTimeout(function(){if(sp.parentNode)sp.parentNode.removeChild(sp);},420);}
}
function _hiOff(){
  hiClear();
  ['pointerdown','click','touchstart'].forEach(function(ev){window.removeEventListener(ev,_hiOff,true);});
}
function focusSection(){

  if(document.querySelector('.pmx-ov.on')){setTimeout(focusSection,600);return;}
  _hiDone=true;

    if(b&&!OPEN[FOCUS]){OPEN[FOCUS]=true;b.click();OPEN[FOCUS]=true;}
  }
  var _center=function(){
    var t=document.getElementById(id)||el;if(!t)return;
    var r=t.getBoundingClientRect();
    var y=r.top+window.scrollY-Math.max(60,(window.innerHeight-r.height)/2);
    if(y>0){
      // 설치 안내처럼 맨 아래에 있는 카드는 더 내릴 곳이 없어 가운데까지 오지 못합니다.
      // 부족한 만큼만 페이지 끝에 빈 여백을 두었다가, 강조가 끝나면 부드럽게 없앱니다.
      var max=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
      var gap=Math.ceil(y-max);
      if(gap>0){
        var sp=document.getElementById('hi-spacer');
        if(!sp){sp=document.createElement('div');sp.id='hi-spacer';document.body.appendChild(sp);}
        sp.style.height=((parseFloat(sp.style.height)||0)+gap)+'px';
      }
    }
    try{window.scrollTo({top:y<0?0:y,behavior:'smooth'});}catch(e){window.scrollTo(0,y<0?0:y);}
  };
  setTimeout(function(){
    var t=document.getElementById(id)||el;
    _center();
    setTimeout(_center,650);      // 내역이 펼쳐지며 높이가 바뀐 경우 한 번 더 맞춥니다
    t.classList.add('hi-focus');
    var chip=document.createElement('span');
    chip.className='hi-chip';
    chip.textContent=(FOCUS==='sv')
      ?(LANG==='en'?'\uD83D\uDCCC Request here':'\uD83D\uDCCC \uC5EC\uAE30\uC11C \uBC14\uB85C \uC758\uB8B0\uD558\uC138\uC694')
      :(LANG==='en'?'\uD83D\uDCCC Please check here':'\uD83D\uDCCC \uC5EC\uAE30\uB97C \uD655\uC778\uD574 \uC8FC\uC138\uC694');
    var _ovf='';try{_ovf=getComputedStyle(t).overflow;}catch(e){}
    if(_ovf==='hidden'||_ovf==='clip'){t.classList.add('hi-inset');chip.classList.add('inset');}
    t.appendChild(chip);
    // 깜빡임이 끝나면 금색 테두리만 남깁니다.
    setTimeout(function(){t.classList.add('done');},8300);
  },620);
  // 화면을 한 번 누르면 강조를 지웁니다 (20초가 지나면 저절로 사라집니다).
  setTimeout(function(){
    ['pointerdown','click','touchstart'].forEach(function(ev){window.addEventListener(ev,_hiOff,true);});
    setTimeout(_hiOff,20000);
  },1200);
}
