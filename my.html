<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Happy Home Care · 마이페이지</title>
<style>
:root{--bg:#F2F4F9;--ink:#1a2233;--ink2:#4b5563;--ink3:#8a94a6;--bdr:#e3e8f0;--pri:#2563eb;--pri-bg:#eff6ff;--ok:#059669;--ok-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fff7e6;--vio:#7c3aed;--vio-bg:#f5f3ff;
--navy:#0B1833;--teal:#0BB5A4;--indigo:#4F6EF7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.page{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);box-shadow:0 0 40px rgba(11,24,51,.08)}
/* hero */
.hero{background:linear-gradient(150deg,#0B1833 0%,#16264a 55%,#1d3a63 100%);padding:calc(18px + env(safe-area-inset-top)) 20px 56px;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(79,110,247,.35),transparent 70%);top:-80px;right:-60px}
.hero:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(11,181,164,.28),transparent 70%);bottom:-50px;left:-40px}
.hh{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
.hh .mark{width:27px;height:27px;border-radius:8px;background:linear-gradient(150deg,var(--indigo),var(--teal));display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff}
.hh b{color:#fff;font-size:13.5px;font-weight:800}
.lang{margin-left:auto;display:flex;gap:4px}
.lang button{border:none;cursor:pointer;font-family:inherit;font-size:10.5px;font-weight:800;padding:5px 11px;border-radius:13px;background:rgba(255,255,255,.12);color:#aebadb}
.lang button.on{background:#fff;color:#0B1833}
.who{position:relative;z-index:1;margin-top:22px;display:flex;align-items:center;gap:14px}
.ava{width:54px;height:54px;border-radius:50%;background:linear-gradient(150deg,var(--indigo),var(--teal));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:#fff;box-shadow:0 8px 20px rgba(79,110,247,.4);flex-shrink:0}
.nm{color:#fff;font-size:20px;font-weight:900;letter-spacing:-.01em}
.sub{color:#8fa0c9;font-size:11.5px;margin-top:2px}
.mem{display:inline-flex;align-items:center;gap:5px;margin-top:8px;background:linear-gradient(120deg,rgba(232,168,56,.18),rgba(232,168,56,.06));border:1px solid rgba(232,168,56,.45);color:#f3cd7e;font-size:11px;font-weight:800;border-radius:20px;padding:4px 12px}
.body{padding:0 15px calc(20px + env(safe-area-inset-bottom));margin-top:-34px;position:relative;z-index:2}
.body.nb>.sec:first-child{margin-top:0}
.body.nb>.sec:first-child>.sh{color:#fff}
.body.nb>.sec:first-child>.sh .n{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:#cfd9f0}
/* balance */
.balcard{background:#fff;border-radius:18px;padding:17px;box-shadow:0 10px 30px rgba(11,24,51,.10)}
.balcard .lb{font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:.06em}
.balcard .val{font-size:28px;font-weight:900;letter-spacing:-.02em;margin-top:2px}
.balcard .val small{font-size:14px;font-weight:800;color:var(--ink3)}
.bar{height:7px;border-radius:6px;background:#EEF1F7;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),var(--indigo));transition:width .6s}
.bar-lb{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);font-weight:700;margin-top:5px}
.balrow{display:flex;margin-top:13px;border-top:1px dashed var(--bdr);padding-top:12px}
.balrow div{flex:1;text-align:center}
.balrow .k{font-size:9.5px;color:var(--ink3);font-weight:700}
.balrow .v{font-size:13.5px;font-weight:900;margin-top:1px}
/* sections */
.sec{margin-top:17px}
.sh{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:900;margin-bottom:8px;padding:0 2px}
.sh .n{margin-left:auto;font-size:10px;font-weight:800;background:#fff;border:1px solid var(--bdr);color:var(--ink2);border-radius:10px;padding:2px 9px}
.card{background:#fff;border-radius:15px;padding:13px 14px;box-shadow:0 3px 14px rgba(11,24,51,.06);margin-bottom:9px;display:flex;gap:11px;align-items:center;text-decoration:none;color:inherit}
.card:active{transform:scale(.985)}
.cico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.cico.iv{background:var(--ok-bg)}.cico.ip{background:var(--warn-bg)}.cico.ct{background:var(--pri-bg)}
.cm{flex:1;min-width:0}
.cm .t{font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cm .d{font-size:11px;color:var(--ink3);margin-top:2px}
.chip{font-size:9px;font-weight:800;border-radius:5px;padding:2px 6px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.bad{background:#fef2f2;color:#dc2626}.chip.blue{background:var(--pri-bg);color:var(--pri)}.chip.vio{background:var(--vio-bg);color:var(--vio)}
.go{flex-shrink:0;font-size:10.5px;font-weight:800;color:var(--pri);background:var(--pri-bg);border-radius:8px;padding:7px 11px;white-space:nowrap}
.amt{font-size:13px;font-weight:900;white-space:nowrap}
/* voucher */
.vcard{display:block;text-decoration:none;background:linear-gradient(120deg,#4c2f8f,#7c3aed 60%,#a855f7);border-radius:15px;padding:15px 17px;color:#fff;box-shadow:0 8px 22px rgba(124,58,237,.35);position:relative;overflow:hidden;margin-bottom:9px}
.vcard:before{content:'';position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);top:-50px;right:-30px}
.vcard.used{filter:grayscale(.8);opacity:.72}
.vcard .stb{position:absolute;top:11px;right:13px;font-size:9px;font-weight:900;border-radius:12px;padding:3px 9px;background:rgba(255,255,255,.92);z-index:1}
.vcard .stb.ok{color:#059669}
.vcard .stb.used{color:#64748b}
.card.dim{opacity:.65;background:#f8fafc}
.vcard .vt{font-size:10px;font-weight:800;opacity:.8;letter-spacing:.08em}
.vcard .vv{font-size:21px;font-weight:900;margin-top:2px}
.vcard .vd{font-size:10.5px;opacity:.9;margin-top:7px;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}
.vcard .code{font-family:monospace;font-weight:700;background:rgba(255,255,255,.15);border-radius:6px;padding:2px 8px}
/* cta / foot */
.cta{display:flex;gap:8px;margin-top:20px}
.cta a{flex:1;text-align:center;font-size:12.5px;font-weight:800;border-radius:13px;padding:13px;text-decoration:none}
.cta .wa{background:#22c55e;color:#fff;box-shadow:0 6px 16px rgba(34,197,94,.35)}
.cta .rq{background:#fff;color:var(--ink2);border:1.5px solid var(--bdr)}
.hp{display:block;margin-top:14px;padding:16px 18px;border-radius:16px;text-decoration:none;background:linear-gradient(125deg,#0B1833 0%,#1d3260 100%);color:#fff;box-shadow:0 8px 22px rgba(11,24,51,.28);position:relative;overflow:hidden}
.hp:before{content:'';position:absolute;right:-28px;top:-28px;width:110px;height:110px;border-radius:50%;background:rgba(79,110,247,.28)}
.hp .hpt{font-size:14.5px;font-weight:900;letter-spacing:-.01em;position:relative}
.hp .hps{font-size:11px;color:#b9c6e8;margin-top:4px;line-height:1.5;position:relative}
.hp .hpb{display:inline-flex;align-items:center;gap:6px;margin-top:11px;background:#fff;color:#0B1833;font-size:11.5px;font-weight:800;border-radius:10px;padding:8px 14px;position:relative}
.foot{padding:18px 14px 6px;text-align:center;font-size:10px;color:var(--ink3);line-height:1.7}
.foot b{color:var(--ink2)}
.empty-page{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink3);font-size:14px;padding:30px;text-align:center}
.spin{width:30px;height:30px;border:3px solid var(--bdr);border-top-color:var(--indigo);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ══ v2 인보이스 카드 ══ */
.ncard{background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 4px 16px rgba(11,24,51,.07);overflow:hidden;display:flex;text-decoration:none;color:inherit}
.ncard:active{transform:scale(.99)}
.stripe{width:5px;flex-shrink:0}
.stripe.ok{background:linear-gradient(180deg,#34d399,#059669)}
.stripe.warn{background:linear-gradient(180deg,#fbbf24,#b45309)}
.stripe.bad{background:linear-gradient(180deg,#f87171,#dc2626)}
.nbody{flex:1;min-width:0;padding:12px 13px}
.nrow1{display:flex;align-items:flex-start;gap:9px;flex-wrap:wrap}
.ntile{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.ntile.ok{background:var(--ok-bg)}.ntile.warn{background:var(--warn-bg)}.ntile.bad{background:#fef2f2}
.nid{font-size:12.5px;font-weight:900;letter-spacing:-.01em;word-break:break-all;flex:1;min-width:0}
.ndate{font-size:10.5px;color:var(--ink3);font-weight:700;margin-top:2px}
.nst{font-size:10px;font-weight:900;border-radius:8px;padding:5px 10px;white-space:nowrap;flex-shrink:0;align-self:center}
.nst.ok{background:var(--ok-bg);color:var(--ok)}
.nst.warn{background:var(--warn-bg);color:var(--warn)}
.nst.bad{background:#fef2f2;color:#dc2626}
.nsum{margin-top:9px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink2);background:#F7F9FC;border-radius:9px;padding:7px 10px}
.nsum .dot{width:4px;height:4px;border-radius:50%;background:#a9b6cc;flex-shrink:0}
.nsum .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nfoot{display:flex;align-items:flex-end;gap:10px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--bdr)}
.nlb{font-size:9.5px;font-weight:800;color:var(--ink3);letter-spacing:.04em}
.nam{font-size:20px;font-weight:900;letter-spacing:-.02em;margin-top:1px;line-height:1.1}
.nam .cu{font-size:12px;color:var(--ink3);font-weight:800;margin-right:3px}
.nam.bad{color:#dc2626}.nam.bad .cu{color:#f87171}
.nbtn{margin-left:auto;font-size:11px;font-weight:900;color:#fff;background:var(--pri);border-radius:10px;padding:9px 14px;white-space:nowrap;box-shadow:0 4px 10px rgba(37,99,235,.28);flex-shrink:0}
/* ══ v2 점검보고서 카드 ══ */
.icard{background:#fff;border-radius:16px;margin-bottom:10px;box-shadow:0 4px 16px rgba(11,24,51,.07);padding:12px 13px;display:block;text-decoration:none;color:inherit}
.icard:active{transform:scale(.99)}
.ihd{display:flex;align-items:center;gap:10px}
.itile{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;color:#fff}
.itile.ac{background:linear-gradient(145deg,#38bdf8,#0284c7);box-shadow:0 4px 11px rgba(2,132,199,.3)}
.itile.wa{background:linear-gradient(145deg,#a78bfa,#7c3aed);box-shadow:0 4px 11px rgba(124,58,237,.3)}
.itile.ds{background:linear-gradient(145deg,#fbbf24,#d97706);box-shadow:0 4px 11px rgba(217,119,6,.3)}
.itile.in{background:linear-gradient(145deg,#34d399,#059669);box-shadow:0 4px 11px rgba(5,150,105,.3)}
.iname{font-size:13px;font-weight:900;letter-spacing:-.01em}
.iaddr{font-size:10.5px;color:var(--ink2);font-weight:700;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.idate{margin-left:auto;font-size:10px;font-weight:800;color:var(--ink2);background:#F1F4F9;border-radius:8px;padding:5px 9px;white-space:nowrap;text-align:center;line-height:1.35;flex-shrink:0}
.istats{display:flex;gap:6px;margin-top:11px}
.ist{flex:1;text-align:center;border-radius:10px;padding:7px 4px;background:#F7F9FC}
.ist .k{font-size:9px;font-weight:800;color:var(--ink3)}
.ist .v{font-size:14px;font-weight:900;margin-top:1px}
.ist.g .v{color:var(--ok)}.ist.r .v{color:#dc2626}.ist.b .v{color:var(--pri)}.ist.z .v{color:var(--ink3)}
.ifoot{display:flex;align-items:center;gap:6px;margin-top:11px;flex-wrap:wrap}
/* ══ v2 계약 카드 ══ */
.ccard{display:block;text-decoration:none;color:#fff;border-radius:17px;margin-bottom:10px;padding:15px 16px;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(11,24,51,.22)}
.ccard:active{transform:scale(.99)}
.ccard:before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.11);top:-60px;right:-40px}
.ccard.t-gold{background:linear-gradient(135deg,#4a3708,#8a6410 55%,#c48f14)}
.ccard.t-silver{background:linear-gradient(135deg,#2f3a4a,#4b5a70 55%,#6b7d96)}
.ccard.t-diamond{background:linear-gradient(135deg,#0d4f52,#0f8a86 55%,#16b6ac)}
.ccard.t-royal{background:linear-gradient(135deg,#2a1a5e,#4c2f9e 55%,#7c4ddb)}
.ccard.t-titanium{background:linear-gradient(135deg,#111d38,#263a63 55%,#3d5a9e)}
.ccard.t-special{background:linear-gradient(135deg,#5c1030,#a01e56 55%,#d63d84)}
.ccard.off{background:linear-gradient(135deg,#3a4150,#5a6274);filter:grayscale(.45);opacity:.85;box-shadow:0 5px 14px rgba(11,24,51,.15)}
.cw{position:relative;z-index:1}
.ctop{display:flex;align-items:center;gap:8px}
.ctier{font-size:10px;font-weight:900;letter-spacing:.1em;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 11px}
.cstat{margin-left:auto;font-size:9.5px;font-weight:900;border-radius:20px;padding:4px 10px;background:rgba(255,255,255,.93);color:#059669}
.cstat.off{color:#64748b}
.cnm{font-size:15px;font-weight:900;margin-top:9px;letter-spacing:-.01em}
.clb{font-size:9.5px;font-weight:800;opacity:.72;letter-spacing:.06em;margin-top:11px}
.cval{font-size:27px;font-weight:900;letter-spacing:-.02em;line-height:1.1;margin-top:1px}
.cval small{font-size:14px;opacity:.75}
.cbar{height:8px;border-radius:6px;background:rgba(255,255,255,.2);margin-top:11px;overflow:hidden}
.cbar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--teal),#8ee9dd)}
.cbl{display:flex;justify-content:space-between;font-size:10px;font-weight:800;opacity:.85;margin-top:6px}
.cmeta{display:flex;margin-top:13px;padding-top:11px;border-top:1px solid rgba(255,255,255,.18)}
.cmeta>div{flex:1;text-align:center}
.cmeta .k{font-size:9px;font-weight:700;opacity:.7}
.cmeta .v{font-size:12.5px;font-weight:900;margin-top:2px}
.cbtn{display:block;text-align:center;margin-top:12px;background:rgba(255,255,255,.95);color:#0B1833;font-size:11.5px;font-weight:900;border-radius:11px;padding:10px}
/* ══ v2 상품권 카드 ══ */
.vc2{display:block;text-decoration:none;color:#fff;border-radius:16px;margin-bottom:10px;position:relative;overflow:hidden;box-shadow:0 8px 22px rgba(124,58,237,.3)}
.vc2:active{transform:scale(.99)}
.vc2.gift{background:linear-gradient(120deg,#4c2f8f,#7c3aed 60%,#a855f7)}
.vc2.disc{background:linear-gradient(120deg,#9a3412,#ea580c 60%,#fb923c);box-shadow:0 8px 22px rgba(234,88,12,.3)}
.vc2.off{background:linear-gradient(120deg,#3f4654,#606a7e);box-shadow:0 5px 14px rgba(11,24,51,.15);filter:grayscale(.35)}
.vc2:before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.12);top:-60px;right:-40px}
.vtop2{position:relative;z-index:1;padding:14px 16px 12px}
.vkind{font-size:9.5px;font-weight:900;letter-spacing:.09em;background:rgba(255,255,255,.2);border-radius:20px;padding:4px 10px}
.vstb{float:right;font-size:9.5px;font-weight:900;border-radius:20px;padding:4px 10px;background:rgba(255,255,255,.93);color:#059669}
.vstb.off{color:#64748b}
.vval2{font-size:29px;font-weight:900;letter-spacing:-.02em;margin-top:11px;line-height:1.15}
.vsub2{font-size:10.5px;opacity:.86;font-weight:700;margin-top:5px;line-height:1.5}
.vperf{position:relative;height:0;margin:0 16px;border-top:2px dashed rgba(255,255,255,.4);z-index:1}
.vperf:before,.vperf:after{content:'';position:absolute;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.vperf:before{left:-26px}.vperf:after{right:-26px}
.vbot2{position:relative;z-index:1;padding:12px 16px 14px;display:flex;align-items:flex-end;gap:10px}
.vk{font-size:8.5px;font-weight:800;opacity:.68;letter-spacing:.05em}
.vv2{font-size:11.5px;font-weight:900;margin-top:3px;white-space:nowrap}
.vcode2{font-family:monospace;font-weight:800;font-size:11px;background:rgba(255,255,255,.17);border-radius:6px;padding:3px 8px;margin-top:2px;display:inline-block}
.dday{font-size:9px;font-weight:900;border-radius:6px;padding:2px 6px;margin-left:4px;background:rgba(255,255,255,.9);color:#5b21b6}
.vc2.disc .dday{color:#9a3412}
.dday.warn{background:#fff;color:#dc2626}
.vgo{margin-left:auto;font-size:10.5px;font-weight:900;background:rgba(255,255,255,.95);color:#3b1d7a;border-radius:9px;padding:8px 12px;white-space:nowrap;flex-shrink:0}
.vc2.disc .vgo{color:#9a3412}
.vc2.off .vgo{color:#334155}
</style>

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pn(p){p=String(p||'').replace(/[^0-9]/g,'');if(p.indexOf('60')===0)p=p.slice(2);return p.replace(/^0+/,'');}
function nn(n){return String(n||'').toLowerCase().replace(/\s+/g,'');}
function fmt(v){const n=parseFloat(v)||0;return n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmt0(v){const n=parseFloat(v)||0;return n.toLocaleString('en-MY',{maximumFractionDigits:0});}
function invTotal(inv){
  if(inv.grand!=null)return parseFloat(inv.grand)||0;
  if(inv.total!=null)return parseFloat(inv.total)||0;
  let t=0;(inv.items||[]).forEach(it=>{t+=(parseFloat(it.qty)||1)*(parseFloat(it.price)||0);});
  return t;
}
const PKG_LB={silver:'실버 Silver',royal:'로얄 Royal',gold:'골드 Gold',diamond:'다이아 Diamond',titanium:'티타늄 Titanium',special:'스페셜 Special'};
function pkgLb(pid){pid=String(pid||'');const biz=/-biz$/.test(pid);const b=PKG_LB[pid.replace(/-biz$/,'')]||pid;return b+(biz?' (Biz)':'');}
function inspPage(t){return t==='install'?'install.html':(t==='washer'?'washer.html':'inspect.html');}
function inspIco(t){return t==='install'?'🔩':(t==='washer'?'🧺':(t==='dispatch'?'🚗':'❄️'));}
function inspTile(t){return t==='install'?'in':(t==='washer'?'wa':(t==='dispatch'?'ds':'ac'));}
function p2(n){return String(n).length<2?'0'+n:String(n);}
// 날짜 문자열(2026-07-12 / 2026.07.12) → Date. 실패하면 null
function dparse(s){const m=String(s==null?'':s).match(/(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/);if(!m)return null;const d=new Date(+m[1],+m[2]-1,+m[3]);return isNaN(d.getTime())?null:d;}
function dfmt(s){const d=dparse(s);return d?(d.getFullYear()+'.'+p2(d.getMonth()+1)+'.'+p2(d.getDate())):String(s==null?'':s);}
const WD_KO=['일','월','화','수','목','금','토'],WD_EN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function wdLb(s){const d=dparse(s);if(!d)return '';return LANG==='ko'?(WD_KO[d.getDay()]+'요일'):WD_EN[d.getDay()];}
function today0(){const t=new Date();t.setHours(0,0,0,0);return t;}
// 경과 일수(양수=지난 날짜) / 남은 일수(양수=아직 유효)
function daysAgo(s){const d=dparse(s);if(!d)return null;return Math.round((today0()-d)/86400000);}
function daysLeft(s){const d=dparse(s);if(!d)return null;return Math.round((d-today0())/86400000);}
const TIER={silver:{ic:'🥈',nm:'SILVER'},royal:{ic:'💠',nm:'ROYAL'},gold:{ic:'👑',nm:'GOLD'},diamond:{ic:'💎',nm:'DIAMOND'},titanium:{ic:'🛡',nm:'TITANIUM'},special:{ic:'✨',nm:'SPECIAL'}};
function tierOf(pid){return String(pid==null?'':pid).replace(/-biz$/,'');}
function todayStr(){const d=new Date();return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');}

function balCalc(c){
  const paid=parseFloat(c.amount_paid)||0,bonus=(parseFloat(c.bonus_credit)||0)+(parseFloat(c.special_bonus_credit)||0);
  const total=paid+bonus;
  let h=[];try{h=typeof c.usage_history==='string'?JSON.parse(c.usage_history||'[]'):(c.usage_history||[]);}catch(e){}
  const used=h.reduce((s,u)=>s+(parseFloat(u.amount)||0),0);
  const disc=h.reduce((s,u)=>s+(parseFloat(u.discount)||0),0);
  const carry=h.reduce((s,u)=>s+(parseFloat(u.carryover)||0),0);
  const svcCnt=h.filter(u=>(parseFloat(u.amount)||0)>0).length;
  return {paid,bonus,total,netUsed:Math.max(0,used-disc-carry),remain:total-used+disc+carry,cnt:svcCnt};
}

  document.getElementById('l-en').onclick=()=>{LANG='en';render();};
}

(async()=>{
  try{
    if(!CID)throw new Error('no-id');
    await load();
    render();
  }catch(e){
    document.getElementById('page').innerHTML='<div class="empty-page"><div style="font-size:34px">🔎</div><div>'+T[LANG].notfound+'</div></div>';
  }
})();
</script>
</body>
</html>
