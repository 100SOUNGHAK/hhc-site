<style>

  --teal-700:#0b5f59;--teal-600:#0f766e;--teal-50:#eaf6f4;
  --gold-700:#8f6f28;--gold-600:#b08d3a;--gold-500:#c9a44c;--gold-300:#e3c98a;--gold-100:#f4e7c4;--gold-50:#fbf5e6;
  --ink-900:#161d27;--ink-700:#333d4b;--ink-600:#4d5866;--ink-400:#8891a0;
  --line:#e8ebf1;--soft:#f3f5f8;--paper:#fdfcf9;--ok:#0E9B63;--red:#DC2626;
  --e1:0 1px 2px rgba(11,24,51,.08),0 5px 12px -3px rgba(11,24,51,.12);

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;

/* 머리 */
.ev-hd{position:relative;background:linear-gradient(170deg,var(--navy-950),var(--navy-900) 60%,#12314f);color:#fff;

.ev-top{display:flex;align-items:center;gap:10px}
.ev-top .lg{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--gold-300);
  background:rgba(255,255,255,.08);border:1px solid rgba(227,201,138,.35)}
.ev-top .lg svg{width:20px;height:20px;display:block}
.ev-top .nm{min-width:0;font-size:13px;font-weight:800;line-height:1.25}
.ev-x{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:11px;border:0;cursor:pointer;font:inherit;
  background:#fff;color:var(--navy-900);font-size:12.5px;font-weight:900;white-space:nowrap;box-shadow:0 4px 12px -4px rgba(0,0,0,.5)}
.ev-x span{font-size:11px}
.ev-x:active{transform:translateY(1px)}
.ev-lg{flex:none;margin-left:auto;display:flex;gap:2px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px}
.ev-lg button{white-space:nowrap;border:0;background:none;color:#c9d6ea;font:inherit;font-size:12px;font-weight:800;border-radius:999px;padding:5px 11px;cursor:pointer}
.ev-lg button.on{background:#fff;color:var(--navy-900)}
.ev-hd h1{font-size:25px;font-weight:800;letter-spacing:-.04em;line-height:1.3;margin-top:20px;word-break:keep-all}
.ev-hd h1 em{font-style:normal;color:var(--gold-300)}

.gvb:before{content:'';position:absolute;inset:0;z-index:-1;border-radius:inherit;border-radius:inherit;opacity:.55;mix-blend-mode:soft-light;

.gvb .gv-wm{position:absolute;right:18px;top:50%;width:46%;max-width:150px;aspect-ratio:1;transform:translateY(-54%);z-index:-1;pointer-events:none}
.gvb .gv-wm svg{width:100%;height:100%;display:block}
.gvb .gv-wm g{fill:rgba(143,111,40,.16);filter:drop-shadow(0 1px 0 rgba(255,255,255,.65)) drop-shadow(0 -1px 0 rgba(110,82,24,.25))}

.gvb .gv-tp{display:flex;align-items:center;gap:9px}
.gvb .gv-tp svg{width:18px;height:18px;flex:none;display:block}
.gvb .gv-tp b{font-size:10.5px;font-weight:800;letter-spacing:.28em;white-space:nowrap}
.gvb .gv-tp .gv-st{margin-left:auto;flex:none;font-size:10px;font-weight:800;letter-spacing:.12em;color:rgba(15,37,64,.55);white-space:nowrap}
.gvb .gv-kd{margin-top:auto;padding-top:14px;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:17px;font-weight:500;color:#5b4515;line-height:1.2}
.gvb .gv-kd small{font-family:'Pretendard Variable',Pretendard,sans-serif;font-style:normal;font-size:11px;font-weight:700;letter-spacing:.2em;color:rgba(91,69,21,.75);margin-left:8px}
.gvb .gv-am{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;line-height:.95;color:#0f2540;white-space:nowrap;
  font-variant-numeric:lining-nums tabular-nums;font-feature-settings:'lnum' 1}
.gvb .gv-am .gv-cu{font-size:22px;letter-spacing:.12em;margin-right:6px}
.gvb .gv-am .gv-n{font-size:60px;letter-spacing:-.005em}
.gvb .gv-am .gv-pc{font-size:34px;margin-left:2px}
.gvb .gv-am.gv-sm .gv-n{font-size:46px}
.gvb .gv-cd{font-size:12px;font-weight:700;color:rgba(15,37,64,.72);margin-top:6px;word-break:keep-all}
.gvb .gv-bt{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:12px;padding-top:11px;border-top:1px solid rgba(15,37,64,.18)}
.gvb .gv-bt .gv-k{font-size:9px;font-weight:800;letter-spacing:.2em;color:rgba(15,37,64,.55);white-space:nowrap}
.gvb .gv-bt .gv-v{font-size:13px;font-weight:700;margin-top:2px;word-break:break-word}
.gvb .gv-bt .gv-v small{display:block;font-size:10px;font-weight:600;color:rgba(15,37,64,.55)}
.gvb .gv-bt .gv-r{text-align:right;flex:none;max-width:50%}
.gvb .gv-no{margin-top:9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;font-weight:700;letter-spacing:.14em;color:rgba(15,37,64,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.gvb.gv-off{filter:grayscale(.75) brightness(.97)}
.gvb .gv-sp{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;pointer-events:none}
.gvb .gv-sp span{font-family:'Noto Serif KR',Georgia,serif;font-size:28px;font-weight:700;letter-spacing:.1em;color:#0f2540;

.gvb.gv-ex .gv-sp span{color:#9E2420;border-color:rgba(158,36,32,.85)}
@media (max-width:360px){.gvb{padding:17px 18px 15px}.gvb .gv-am .gv-n{font-size:52px}.gvb .gv-am.gv-sm .gv-n{font-size:40px}.gvb .gv-tp b{letter-spacing:.22em}}

/* 카드 + 금액 고르기 (한 덩어리) */
.ev-buy{margin:-80px 16px 0;position:relative;z-index:2}
.ev-pick{margin-top:14px;background:#fff;border-radius:16px;padding:12px;box-shadow:var(--e1)}
.ev-chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--soft);border-radius:12px;padding:4px}
.ev-chips button{font:inherit;font-size:14.5px;font-weight:800;color:var(--ink-600);background:none;border:0;border-radius:9px;
  padding:9px 0;cursor:pointer;font-variant-numeric:tabular-nums;white-space:nowrap;transition:transform .14s,background .14s}
.ev-chips button:active{transform:scale(.96)}
.ev-chips button.on{background:var(--navy-900);color:#fff;box-shadow:0 4px 10px -4px rgba(15,37,64,.6)}
.ev-sum{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:12px 4px 2px;text-align:center}
.ev-sum .k{font-size:12.5px;font-weight:700;color:var(--ink-400)}
.ev-sum .v{font-size:21px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev-sum .ar{font-size:18px;color:var(--gold-600);font-weight:800}
.ev-sum .use .v{color:var(--navy-900)}
.ev-save{margin-top:10px;text-align:center;font-size:13.5px;font-weight:700;color:var(--ink-600)}
.ev-save b{color:var(--ok);font-weight:800}

/* 핵심 3가지 */
.ev-keys{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 16px 0;background:#fff;border-radius:16px;box-shadow:var(--e1)}
.ev-key{padding:14px 8px 13px;text-align:center}
.ev-key+.ev-key{border-left:1px solid var(--line)}
.ev-key .ic{display:block;font-size:20px;line-height:1}
.ev-key b{display:block;font-size:14px;font-weight:800;letter-spacing:-.03em;margin-top:7px;word-break:keep-all}
.ev-key span{display:block;font-size:12px;color:var(--ink-400);font-weight:600;margin-top:2px;line-height:1.4;word-break:keep-all}

/* 섹션 */
.ev-sec{padding:26px 16px 0}
.ev-sec>h2{font-size:17px;font-weight:800;letter-spacing:-.035em;padding:0 2px;margin-bottom:10px}

/* 3단계 */
.ev-flow{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;counter-reset:s}
.ev-fs{position:relative;background:#fff;border-radius:14px;padding:13px 10px 12px;box-shadow:var(--e1);counter-increment:s}
.ev-fs:before{content:counter(s);display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
  background:var(--navy-900);color:#fff;font-size:12px;font-weight:900}
.ev-fs b{display:block;font-size:14px;font-weight:800;letter-spacing:-.03em;margin-top:8px;line-height:1.35;word-break:keep-all}
.ev-fs span{display:block;font-size:12.5px;color:var(--ink-600);font-weight:500;margin-top:4px;line-height:1.5;word-break:keep-all}

/* 유의사항 */
.ev-terms{background:#fff;border-radius:14px;box-shadow:var(--e1);padding:4px 14px}
.ev-tm{display:flex;gap:10px;align-items:baseline;padding:10px 0;font-size:14px;color:var(--ink-700);font-weight:500;line-height:1.55;word-break:keep-all}
.ev-tm+.ev-tm{border-top:1px solid var(--line)}
.ev-tm i{flex:none;font-style:normal;font-size:11px;font-weight:900;color:var(--red);width:16px;height:16px;border-radius:50%;
  background:#fdeceb;display:inline-flex;align-items:center;justify-content:center;transform:translateY(-1px)}
.ev-tm b{font-weight:800;color:var(--ink-900)}

/* 할인권 차이 — 접어 두기 */
.ev-more{margin-top:10px;background:var(--soft);border-radius:14px}
.ev-more summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:13px 14px;font-size:14px;font-weight:800;color:var(--ink-700)}
.ev-more summary::-webkit-details-marker{display:none}
.ev-more summary:after{content:'+';margin-left:auto;font-size:18px;font-weight:600;color:var(--ink-400);line-height:1}
.ev-more[open] summary:after{content:'−'}
.ev-more table{width:100%;border-collapse:collapse;table-layout:fixed;margin:0 0 6px}
.ev-more th,.ev-more td{padding:9px 12px;text-align:left;vertical-align:top;font-size:13px;line-height:1.5;word-break:keep-all;border-top:1px solid #e3e7ee}
.ev-more thead th{font-size:12.5px;font-weight:800;color:var(--ink-400)}
.ev-more tbody th{font-weight:700;color:var(--ink-400);width:30%}
.ev-more td{font-weight:600;color:var(--ink-700)}
.ev-more td .x{color:var(--red);font-weight:800}

/* 푸터 · 하단바 */
.ev-ft{margin-top:26px;padding:0 20px 8px;text-align:center;font-size:12px;color:var(--ink-400);font-weight:600;line-height:1.8}
.ev-ft a{color:var(--navy-800);font-weight:800;text-decoration:none;white-space:nowrap}
.ev-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:520px;margin:0 auto;display:flex;gap:8px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(253,252,249,.94);backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  box-shadow:0 -1px 0 var(--line),0 -14px 32px -18px rgba(8,23,43,.35)}
.ev-bar a{display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;border-radius:13px;
  height:52px;font-size:15.5px;font-weight:800;letter-spacing:-.03em;transition:transform .14s;white-space:nowrap}
.ev-bar a:active{transform:translateY(2px)}
.ev-bar .wa{flex:1;min-width:0;color:#fff;background:linear-gradient(160deg,#14958a,var(--teal-700));
  box-shadow:0 1px 2px rgba(11,95,89,.3),0 10px 18px -8px rgba(11,95,89,.8)}
.ev-bar .wa small{font-weight:700;opacity:.85;font-size:13px}
.ev-bar .hm{flex:none;width:96px;color:var(--ink-700);background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}

@media (max-width:360px){
  .ev-hd h1{font-size:22px}
  .ev-chips button{font-size:13px}
  .ev-sum .v{font-size:19px}
  .ev-fs{padding:12px 8px}
  .ev-fs b{font-size:13.5px}
  .ev-bar .hm{width:80px}
  .ev-bar .wa small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.ev-bar,.ev-lg{display:none!important}.pg{box-shadow:none;padding-bottom:0}}

        '<div class="ev-lg"><button type="button" data-l="ko" class="'+(LANG==='ko'?'on':'')+'">한국어</button><button type="button" data-l="en" class="'+(LANG==='en'?'on':'')+'">EN</button></div>'+
        (FROM_SMART?'<button type="button" class="ev-x" id="evClose" aria-label="'+(LANG==='en'?'Close':'닫기')+'"><span>✕</span>'+(LANG==='en'?'Close':'닫기')+'</button>':'')+'</div>'+

    '</div>'+
    '<div class="ev-buy">'+
      '<div class="gvb" aria-hidden="true"><div class="gv-wm">'+WMSVG+'</div>'+
        '<div class="gv-tp gv-eg">'+HSVG+'<b>HAPPY HOME CARE</b><span class="gv-st">'+esc(L.smp)+'</span></div>'+
        '<div class="gv-kd gv-eg">Gift Voucher'+(LANG==='ko'?'<small>상품권</small>':'')+'</div>'+
        '<div class="gv-am gv-eg"><span class="gv-cu">RM</span><span class="gv-n" id="vAmt"></span></div>'+
        '<div class="gv-bt gv-eg"><div><div class="gv-k">'+esc(L.recvK)+'</div><div class="gv-v">'+esc(L.recv)+'</div></div>'+
          '<div class="gv-r"><div class="gv-k">'+esc(L.useK)+'</div><div class="gv-v">'+esc(L.use)+'</div></div></div>'+
      '</div>'+
      '<div class="ev-pick">'+
        '<div class="ev-chips" role="group">'+AMTS.map(function(a){return '<button type="button" data-a="'+a+'">RM '+fm(a)+'</button>';}).join('')+'</div>'+
        '<div class="ev-sum"><div><div class="k">'+esc(L.pay)+'</div><div class="v" id="sPay"></div></div><div class="ar">&rarr;</div>'+
          '<div class="use"><div class="k">'+esc(L.spend)+'</div><div class="v" id="sUse"></div></div></div>'+
        '<div class="ev-save" id="sSave"></div>'+
      '</div>'+
    '</div>'+
    '<div class="ev-keys">'+L.keys.map(function(k){return '<div class="ev-key"><span class="ic">'+k[0]+'</span><b>'+esc(k[1])+'</b><span>'+esc(k[2])+'</span></div>';}).join('')+'</div>'+
    '<div class="ev-sec"><h2>'+esc(L.flowH)+'</h2><div class="ev-flow">'+
      L.flow.map(function(f){return '<div class="ev-fs"><b>'+esc(f[0])+'</b><span>'+esc(f[1])+'</span></div>';}).join('')+'</div></div>'+
    '<div class="ev-sec"><h2>'+esc(L.tmH)+'</h2><div class="ev-terms">'+
      L.terms.map(function(t){return '<div class="ev-tm"><i>!</i><span>'+t+'</span></div>';}).join('')+'</div>'+
      '<details class="ev-more"><summary>'+esc(L.moreT)+'</summary><table><thead><tr>'+L.cmpH.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'+
        L.cmp.map(function(r){return '<tr><th>'+esc(r[0])+'</th><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>';}).join('')+'</tbody></table></details>'+

  document.getElementById('bar').innerHTML=
    '<a class="wa" id="waBtn" target="_blank" rel="noopener">'+
      '<svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.8-1.2.2-.6.2-1.1.1-1.2l-.4-.2Z"/></svg>'+
      '<span>'+esc(L.bWa)+'</span><small id="waAmt"></small></a>'+

  Array.prototype.forEach.call(document.querySelectorAll('.ev-lg button'),function(b){b.onclick=function(){setLang(b.getAttribute('data-l'));};});
  var xb=document.getElementById('evClose'); if(xb) xb.onclick=closeToSmart;
  Array.prototype.forEach.call(document.querySelectorAll('.ev-chips button'),function(b){b.onclick=function(){setAmt(+b.getAttribute('data-a'));};});
  setAmt(AMT);
}
function setAmt(a){
  AMT=a;var L=T[LANG],pay=a*(1-RATE);
  Array.prototype.forEach.call(document.querySelectorAll('.ev-chips button'),function(b){var on=+b.getAttribute('data-a')===a;b.className=on?'on':'';b.setAttribute('aria-pressed',on);});
  document.getElementById('vAmt').textContent=fm(a);
  document.getElementById('sPay').textContent='RM '+fm(pay);
  document.getElementById('sUse').textContent='RM '+fm(a);
  document.getElementById('sSave').innerHTML=esc(L.save).replace('{s}','<b>'+fm(a-pay)+'</b>').replace('RM <b>','<b>RM ');
  document.getElementById('waAmt').textContent='· RM '+fm(a);
  document.getElementById('waBtn').href='https://wa.me/'+WA_NO+'?text='+encodeURIComponent(L.waMsg(fm(a),fm(pay)));
}
/* 「더 저렴하게 이용하는 방법 안내」(/smart) 카드에서 열었을 때만 위에 「✕ 닫기」 → /smart 로 돌아가기 (2026-11-13) */
function closeToSmart(){
  if((document.referrer||'').indexOf('/smart')>-1&&history.length>1){history.back();return;}
  location.href='/smart'+(LANG==='en'?'?lang=en':'');
}
function setLang(l){
  if(LANG===l)return;LANG=l;
  try{var q=new URLSearchParams(location.search);if(l==='en')q.set('lang','en');else q.delete('lang');
    history.replaceState(null,'',location.pathname+(q.toString()?'?'+q.toString():''));}catch(e){}
  render();window.scrollTo(0,0);
}
render();
</script>
