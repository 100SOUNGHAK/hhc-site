<style>
:root{
  --navy-950:#08172b;--navy-900:#0f2540;--navy-800:#173a5e;
  --teal-800:#0b5f59;--teal-700:#0f766e;--teal-50:#eaf6f4;
  --gold-700:#8f6f28;--gold-600:#b08d3a;--gold-500:#c9a44c;--gold-300:#e3c98a;--gold-100:#f4e7c4;--gold-50:#fbf5e6;
  --ink-900:#161d27;--ink-700:#333d4b;--ink-600:#4d5866;--ink-400:#8891a0;
  --line:#ece6d8;--cream:#faf7f0;--paper:#fdfcf9;
  --ease:cubic-bezier(.22,.61,.36,1);
  --card:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:#eef0f4;color:var(--ink-900);line-height:1.6;font-size:15px;letter-spacing:-.01em;word-break:keep-all}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.pg{max-width:520px;margin:0 auto;background:var(--cream);min-height:100vh;overflow:hidden;box-shadow:0 0 60px rgba(8,23,43,.1)}

/* ── 히어로 ── */
.hp-hero{position:relative;overflow:hidden;color:#fff;text-align:center;
  padding:calc(16px + env(safe-area-inset-top)) 18px 26px;
  background:radial-gradient(90% 60% at 88% 0%,rgba(201,164,76,.22),transparent 62%),
             linear-gradient(170deg,var(--navy-950),var(--navy-900) 58%,#12314f)}
.hp-top{display:flex;align-items:center;gap:10px;text-align:left;margin-bottom:22px}
.hp-mark{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;color:var(--navy-900);
  background:linear-gradient(145deg,#f4e5b4,var(--gold-500));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 14px rgba(2,10,28,.3)}
.hp-mark svg{width:24px;height:24px}
.hp-nm{flex:1;min-width:0}
.hp-nm b{display:block;font-size:15px;font-weight:800;line-height:1.25}
.hp-nm span{display:block;font-size:8.5px;font-weight:700;letter-spacing:.06em;color:#a9b8cf;margin-top:2px;line-height:1.35}
.lgb{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);flex:none}
.lgb button{min-width:40px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;color:rgba(255,255,255,.72)}
.lgb button.on{background:#fff;color:var(--navy-900)}
.hp-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 15px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.04em;
  color:var(--gold-300);background:rgba(255,255,255,.07);border:1px solid rgba(227,201,138,.4)}
.hp-h1{margin-top:14px;font-size:clamp(30px,8.6vw,38px);line-height:1.22;font-weight:900;letter-spacing:-.035em}
.hp-h1 em{display:block;font-style:normal;color:var(--gold-300)}
.hp-lead{margin:12px auto 0;max-width:330px;font-size:14.5px;line-height:1.6;font-weight:600;color:#d3dcea}
.hp-rate{margin-top:20px;padding:18px 14px 15px;border-radius:20px;color:var(--navy-950);
  background:linear-gradient(145deg,#f6e8bc,var(--gold-300) 40%,var(--gold-500));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 4px rgba(4,12,26,.35),0 18px 34px -14px rgba(201,164,76,.55)}
.hp-rate .eq{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:4px 10px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hp-rate .a{font-size:clamp(19px,5.6vw,24px)}
.hp-rate .ar{font-size:22px;font-weight:900;color:var(--gold-700)}
.hp-rate .b{font-size:clamp(34px,10vw,44px);line-height:1}
.hp-rate .b small{font-size:clamp(15px,4.4vw,19px);margin-left:3px}
.hp-rate p{margin-top:8px;font-size:12.5px;font-weight:700;color:rgba(15,37,64,.75)}
.hp-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-top:16px}
.hp-chips span{display:inline-flex;align-items:center;gap:4px;padding:6px 9px;border-radius:999px;font-size:clamp(11px,3.15vw,12.5px);font-weight:800;white-space:nowrap;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#fff}

/* 히어로 요약 — 금액 3칸 */
.hp-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:20px}
.hp-sum div{padding:13px 6px 12px;border-radius:16px;text-align:center;color:var(--navy-950);
  background:linear-gradient(145deg,#f6e8bc,var(--gold-300) 45%,var(--gold-500));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 4px rgba(4,12,26,.35),0 14px 26px -14px rgba(201,164,76,.55)}
.hp-sum i{display:block;font-style:normal;font-size:18px;line-height:1}
.hp-sum small{display:block;margin-top:7px;font-size:clamp(10.5px,3vw,12px);font-weight:800;line-height:1.3;color:rgba(15,37,64,.78)}
.hp-sum b{display:block;margin-top:3px;font-size:clamp(17px,5vw,21px);font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── 본문 ── */
.hp-body{padding:28px 16px 30px}
.hp-sec+.hp-sec{margin-top:30px}
.hp-h2{display:flex;align-items:baseline;gap:9px;margin:0 2px 14px;font-size:20px;font-weight:900;letter-spacing:-.03em;color:var(--navy-900)}
.hp-h2 i{font-style:normal;font-size:13px;font-weight:800;color:var(--gold-600);font-variant-numeric:tabular-nums}
.fc{display:flex;gap:13px;align-items:flex-start;padding:16px 15px;border-radius:16px;background:#fff;box-shadow:var(--card)}
.fc+.fc{margin-top:10px}
.fc .ic{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--gold-50);border:1px solid rgba(201,164,76,.28)}
.fc .tx{flex:1;min-width:0}
.fc .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.fc b{font-size:16px;line-height:1.4;font-weight:850;color:var(--ink-900)}
.fc .am{flex:none;font-size:15px;font-weight:900;color:var(--navy-900);font-variant-numeric:tabular-nums;white-space:nowrap}
.fc p{margin-top:5px;font-size:13.5px;line-height:1.6;font-weight:550;color:var(--ink-600)}
.fc p strong{color:var(--ink-900);font-weight:850}
.ftab{border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--card)}
.ftab .cap{padding:12px 15px;font-size:12.5px;font-weight:800;color:var(--ink-600);background:var(--paper);border-bottom:1px solid var(--line)}
.ftab .r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px dashed #e3ddcf}
.ftab .r:last-child{border-bottom:none}
.ftab .k{font-size:14px;font-weight:700;color:var(--ink-700)}
.ftab .v{flex:none;padding:4px 11px;border-radius:999px;font-size:13.5px;font-weight:900;font-variant-numeric:tabular-nums;
  color:var(--teal-800);background:var(--teal-50);border:1px solid rgba(15,118,110,.2)}
.ftab .r.no .v{color:#b42318;background:#fef3f2;border-color:rgba(180,35,24,.2)}
.hp-pk{display:flex;gap:11px;align-items:flex-start;margin-top:14px;padding:15px 16px;border-radius:16px;background:var(--gold-50);border:1px solid rgba(201,164,76,.35)}
.hp-pk i{font-style:normal;font-size:19px;line-height:1.3}
.hp-pk p{font-size:13.5px;line-height:1.6;font-weight:650;color:var(--ink-700)}
.hp-pk strong{font-weight:850;color:var(--gold-700)}

/* ── 문의 ── */
.hp-ft{text-align:center;color:#fff;padding:26px 18px calc(30px + env(safe-area-inset-bottom));
  background:linear-gradient(170deg,var(--navy-900),var(--navy-950))}
.hp-ft .q{font-size:14px;font-weight:800;color:var(--gold-300)}
.hp-ft .tel{display:inline-block;margin-top:8px;font-size:clamp(26px,7.6vw,32px);font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#fff}
.hp-ft .ch{margin-top:4px;font-size:13px;font-weight:650;color:#b7c4d8}
.hp-ft .acts{display:flex;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.hp-ft .acts a{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:850;
  transition:transform .16s var(--ease)}
.hp-ft .acts a:active{transform:scale(.97)}
.hp-ft .wa{background:var(--teal-700);color:#fff;box-shadow:0 8px 18px -6px rgba(15,118,110,.6)}
.hp-ft .web{background:linear-gradient(145deg,#f4e5b4,var(--gold-500));color:var(--navy-950);box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.hp-ft .co{margin-top:18px;font-size:10.5px;font-weight:600;letter-spacing:.02em;color:#7f93b0}

@media (max-width:374px){.hp-nm span{letter-spacing:.04em;font-size:8.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.lgb{display:none}.pg{box-shadow:none}}

var T={
 ko:{

  pkg:'<strong>패키지 회원</strong>은 최소청구금액 · 주차비용 · 예약보증금이 <strong>모두 면제</strong>됩니다.',

         ['🅿️','Parking Fee','RM 10','<strong>RM 10</strong> is charged when paid parking is used (up to 2 hours). After 2 hours, <strong>RM 10 per hour</strong> is added.'],

 }

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

function render(){

})();
</script>

<!-- ── 전자명함에서 넘어온 방문자에게만 보이는 되돌아가기 버튼 ────────── -->
<style>
.hhcbk{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:9990;display:none;align-items:center;gap:8px;padding:11px 17px 11px 13px;border-radius:999px;
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:14px;font-weight:700;letter-spacing:-.01em;color:#fdfcf9;
  background:linear-gradient(150deg,#173a5e,#0f2540);border:1px solid rgba(227,201,138,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 6px rgba(4,12,26,.35),0 14px 28px -12px rgba(4,12,26,.8);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:transform .16s cubic-bezier(.22,.61,.36,1),background .16s cubic-bezier(.22,.61,.36,1)}
.hhcbk.on{display:inline-flex}
.hhcbk:active{transform:translateY(1px);background:linear-gradient(150deg,#1d4870,#122c4d)}
.hhcbk i{font-style:normal;color:#e3c98a;font-size:16px;line-height:1}
@media (prefers-reduced-motion:reduce){.hhcbk{transition:none}}
@media print{.hhcbk{display:none!important}}
</style>
<button type="button" class="hhcbk" id="hhcBackToCard"><i>&#8592;</i><span>명함으로</span></button>
<script>
(function(){
  try{
    var q = new URLSearchParams(location.search);
    var en = String(q.get('lang') || '').toLowerCase() === 'en';
    var fromCard = q.get('from') === 'card' || (document.referrer || '').indexOf('/namecard') > -1;
    if(!fromCard) return;

    var b = document.getElementById('hhcBackToCard');
    if(!b) return;
    b.querySelector('span').textContent = en ? 'Back to card' : '명함으로';
    b.setAttribute('aria-label', en ? 'Back to the digital name card' : '전자명함으로 돌아가기');
    b.classList.add('on');

    /* 화면 아래에 고정된 바(예약 제출 바 등)가 있으면 그만큼 위로 띄운다 */
    function lift(){
      var vh = window.innerHeight, max = 0;
      var els = document.querySelectorAll('body > *, body > * > *');
      for(var i = 0; i < els.length; i++){
        var el = els[i];
        if(el === b) continue;
        var cs = getComputedStyle(el);
        if(cs.position !== 'fixed' || cs.display === 'none' || cs.visibility === 'hidden') continue;
        var r = el.getBoundingClientRect();
        if(r.height > 0 && r.height < 170 && Math.abs(r.bottom - vh) < 6 && r.width > 120){
          if(r.height > max) max = r.height;
        }
      }
      b.style.bottom = 'calc(' + (14 + max) + 'px + env(safe-area-inset-bottom))';
    }
    lift();
    setTimeout(lift, 900);
    window.addEventListener('resize', lift);

    b.addEventListener('click', function(){
      if(history.length > 1){ history.back(); }
      else { location.href = '/namecard' + (en ? '?lang=en' : ''); }
    });
  }catch(e){}
})();
</script>
