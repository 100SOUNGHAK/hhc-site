:root{--n:#0E2350;--n0:#081530;--ink:#161D2B;--ink2:#566176;--ink3:#97A0B2;--line:#ECEEF3;--red:#D93636;--ok:#0E8F5C;--amb:#C2700B;--g:#C9A44C;--g3:#E3C98A;--paper:#FAF9F6}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:Pretendard,system-ui,sans-serif;color:var(--ink);letter-spacing:-.025em;-webkit-font-smoothing:antialiased;background:var(--n0)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit;text-align:left}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper)}
/* 위: 라운지 */
.lounge{position:relative;padding:calc(14px + env(safe-area-inset-top)) 18px 70px;color:#fff;overflow:hidden;
  background:radial-gradient(90% 60% at 100% 0%,rgba(201,164,76,.22),rgba(201,164,76,0) 60%),linear-gradient(180deg,#0E2350 0%,#081530 100%)}
.bar{display:flex;align-items:center;gap:10px}
.lg{width:30px;height:30px;padding:6px;border-radius:9px;border:1px solid rgba(227,201,138,.4)}
.bar b{flex:1;font-size:12px;font-weight:800;letter-spacing:.18em;color:var(--g3)}
.bell{position:relative;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;border:1px solid rgba(255,255,255,.2)}.bell i{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:#F87171}
.lng{display:flex;border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:2px}
.lng button{height:26px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:800;color:rgba(255,255,255,.6)}
.lng .on{background:var(--g3);color:var(--n)}
.wel{margin-top:22px}
.wel small{font-size:12.5px;color:rgba(255,255,255,.6);font-weight:700}
.wel h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:0}
.wel .nm{font-size:26px;font-weight:800;letter-spacing:-.04em;margin-top:2px}
.mcard{position:relative;margin-top:18px;border-radius:20px;height:200px;padding:18px 20px;overflow:hidden;
  background:url(mp-bg-member.jpg) 70% 50%/cover;box-shadow:inset 0 0 0 1px rgba(227,201,138,.35),0 30px 50px -24px rgba(0,0,0,.8);transform:perspective(900px) rotateX(4deg);transform-origin:50% 100%}
.mcard:before{content:'';position:absolute;inset:0;background:linear-gradient(95deg,rgba(8,21,48,.95) 0%,rgba(8,21,48,.75) 45%,rgba(8,21,48,.2) 100%)}
.mcard>*{position:relative}
.mcard .t{display:flex;justify-content:space-between;align-items:center}
.mcard .t span{font-size:11px;font-weight:800;letter-spacing:.2em;color:var(--g3)}
.mcard .t em{font-style:normal;font-size:11px;color:rgba(255,255,255,.6);font-weight:700}
.mcard .lb{font-size:11.5px;color:rgba(255,255,255,.65);font-weight:700;margin-top:28px}
.mcard .v{font-size:34px;font-weight:850;line-height:1.1;background:linear-gradient(180deg,#FFF6DC,#E3C98A 60%,#C9A44C);-webkit-background-clip:text;background-clip:text;color:transparent}
.mcard .v small{font-size:17px}
.mcard .pb{position:absolute;left:20px;right:20px;bottom:18px}
.mcard .pb .tr{height:4px;border-radius:9px;background:rgba(255,255,255,.18)}
.mcard .pb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#C9A44C,#F3DFA6)}
.mcard .pb div{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.7);font-weight:700;margin-top:7px}
/* 아래: 시트 */
.sheet{position:relative;margin-top:-44px;background:var(--paper);border-radius:28px 28px 0 0;padding:10px 16px calc(120px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px -10px rgba(0,0,0,.35)}
.grab{width:40px;height:5px;border-radius:9px;background:#D9DDE5;margin:0 auto 14px}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.qa button{font-size:11.5px!important;white-space:nowrap}
.qa .b{width:52px!important;height:52px!important;border-radius:17px!important}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:750;color:var(--ink2);text-align:center;position:relative}
.qa .b{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:#fff;color:var(--n);box-shadow:0 1px 2px rgba(11,24,51,.08),0 8px 18px -10px rgba(11,24,51,.3)}
.qa .b.r{color:var(--red)}
.qa .dot{position:absolute;top:-4px;right:calc(50% - 34px);min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--red);color:#fff;font-size:11px;font-weight:850;display:grid;place-items:center;box-shadow:0 0 0 2px var(--paper)}
.h{display:flex;justify-content:space-between;align-items:baseline;margin:28px 2px 12px}
.h h2{font-size:18px;font-weight:850;letter-spacing:-.04em}
.h small{font-size:12.5px;color:var(--ink3);font-weight:700}
.alert{display:flex;gap:12px;align-items:center;width:100%;padding:16px;border-radius:20px;background:#fff;box-shadow:inset 0 0 0 1px rgba(217,54,54,.18),0 12px 24px -16px rgba(217,54,54,.5)}
.alert .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#FDECEC;color:var(--red);flex:none}
.alert .tx{flex:1;min-width:0}
.alert small{display:block;font-size:11.5px;font-weight:800;color:var(--red)}
.alert b{display:block;font-size:20px;font-weight:850}
.alert .s{display:block;font-size:12px;color:var(--ink2)}
.alert .go{display:inline-flex;align-items:center;justify-content:center;line-height:1;white-space:nowrap;height:38px;padding:0 14px;border-radius:12px;background:var(--n);color:#fff;font-size:12.5px;font-weight:800;flex:none}
/* 케어: 사진 카드 가로 넘김 */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 14px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail.one{justify-content:center;overflow:visible}
.rail.one .cc{flex:0 0 min(260px,78%)}
.rail.one .cc .ph{height:120px}
.cc{flex:0 0 172px;scroll-snap-align:start;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 1px 2px rgba(11,24,51,.08),0 12px 22px -14px rgba(11,24,51,.4);text-align:left}
.cc .ph{height:96px;background:center/cover;position:relative}
.cc .ph:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.35))}
.cc .ph em{position:absolute;left:10px;top:10px;z-index:1;font-style:normal;font-size:10.5px;font-weight:850;padding:3px 8px;border-radius:999px;background:#fff}
.cc .bd{padding:11px 12px 13px}
.cc b{display:block;font-size:14.5px;font-weight:850}
.cc .l{display:block;font-size:13px;font-weight:850;margin-top:2px}
.cc small{display:block;font-size:11px;color:var(--ink3);font-weight:650}
.cc .tk{height:4px;border-radius:9px;background:var(--line);margin-top:9px;overflow:hidden}
.cc .tk i{display:block;height:100%;border-radius:9px}
.c-r{color:var(--red)}.c-a{color:var(--amb)}.c-o{color:var(--ok)}
/* 타임라인 */
.tl{position:relative;background:#fff;border-radius:22px;padding:6px 16px;box-shadow:0 1px 2px rgba(11,24,51,.06),0 12px 26px -18px rgba(11,24,51,.4)}
.ev{display:flex;gap:14px;width:100%;padding:14px 0;position:relative}
.ev:before{content:'';position:absolute;left:21px;top:0;bottom:0;width:2px;background:var(--line)}
.ev:first-child:before{top:50%}.ev:last-child:before{bottom:50%}
.ev .dt{position:relative;z-index:1;width:44px;flex:none;text-align:center;background:#fff}
.ev .dt b{display:block;font-size:18px;font-weight:850;line-height:1.1}
.ev .dt small{display:block;font-size:10.5px;color:var(--ink3);font-weight:800}
.ev .tx{flex:1;min-width:0}
.ev .tx b{display:block;font-size:14.5px;font-weight:800}
.ev .tx small{display:block;font-size:12px;color:var(--ink3);font-weight:650}
.ev .tg{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.ev .tg span{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;background:#F2F4F8;color:var(--n);display:inline-flex;align-items:center;gap:4px}
.ev .tg span.r{background:#FDECEC;color:var(--red)}.ev .tg span.a{background:#FDF3E1;color:var(--amb)}.ev .tg span.o{background:#E7F6EF;color:var(--ok)}
.pts{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;width:100%;padding:18px 16px;border-radius:20px;background:url(mp-bg-points.jpg) 80% 50%/cover;color:#fff;margin-top:12px;box-shadow:0 14px 26px -16px rgba(11,95,89,.8)}
.pts:before{content:'';position:absolute;inset:0;background:linear-gradient(95deg,rgba(6,58,54,.94) 0%,rgba(8,80,74,.7) 52%,rgba(8,80,74,.05) 100%)}
.pts>*{position:relative}
.pts .tx{flex:1}
.pts small{display:block;font-size:11.5px;color:rgba(255,255,255,.7);font-weight:700}
.pts b{display:block;font-size:22px;font-weight:850}
.pts .s{font-size:11.5px;color:rgba(255,255,255,.75)}
.coin{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF1C6,#E3C98A 30%,#B08D3A 72%);box-shadow:inset 0 0 0 4px rgba(255,255,255,.3)}
.ref{margin-top:12px;padding:18px;border-radius:22px;background:#fff;box-shadow:inset 0 0 0 1px rgba(201,164,76,.35);text-align:left;width:100%}
.ref small{font-size:11px;font-weight:850;letter-spacing:.16em;color:#9A7420}
.ref h3{font-size:18px;font-weight:850;line-height:1.35;margin-top:6px}
.ref h3 b{color:#9A7420}
.ref p{font-size:12px;color:var(--ink3);margin-top:4px;font-weight:600}
.foot{text-align:center;font-size:11.5px;color:var(--ink3);margin-top:22px}
.als{display:flex;flex-direction:column;gap:10px}
.alert.tl{box-shadow:inset 0 0 0 1px rgba(14,143,92,.18),0 12px 24px -16px rgba(14,143,92,.45)}.alert.tl .ic{background:#E7F6EF;color:var(--ok)}.alert.tl small{color:var(--ok)}
.alert.am{box-shadow:inset 0 0 0 1px rgba(194,112,11,.2),0 12px 24px -16px rgba(194,112,11,.45)}.alert.am .ic{background:#FDF3E1;color:var(--amb)}.alert.am small{color:var(--amb)}
.alert b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.alert.tl b,.alert.am b{font-size:16px}
.alert .go.ln{background:#EEF1F6;color:var(--n)}
.ev{cursor:pointer}.ev .dt small+b+small{font-size:9.5px}
.ev .tg span{cursor:pointer}
.tlm{display:block;width:100%;text-align:center;padding:12px 0 10px;font-size:12.5px;font-weight:800;color:var(--n);border-top:1px solid var(--line)}
.mcard.pc{background:url(mp-bg-points.jpg) 78% 50%/cover}
.mcard.pc:before{background:linear-gradient(95deg,rgba(6,58,54,.94) 0%,rgba(8,80,74,.72) 48%,rgba(8,80,74,.08) 100%)}
.mcard .up{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:800;color:#F3DFA6}
.lgd{display:flex;gap:14px;margin:-4px 4px 10px;font-size:11.5px;font-weight:750;color:var(--ink2)}
.lgd span{display:inline-flex;align-items:center;gap:6px}
.lgd i{width:10px;height:10px;border-radius:3px}
.lgd i.sv{background:#fff;box-shadow:inset 0 0 0 2px #C9D1E0}
.lgd i.rp{background:#FDF3E1;box-shadow:inset 0 0 0 2px #EBC98A}
.ev.rpr .dt{align-self:flex-start;background:#FDF3E1;border-radius:10px;padding:4px 0;position:relative}
.ev.rpr .dt small{color:#B7791F!important}
.ev.rpr .dt b{color:#9A5B06}
.ev.rpr .dt .wr{position:absolute;right:-5px;top:-5px;width:16px;height:16px;border-radius:50%;background:#fff;color:#C2700B;display:grid;place-items:center;box-shadow:0 0 0 1px #F0DDB8}
.ev.rpr .rk{display:inline-block;font-size:10px;font-weight:800;color:#B7791F;margin-bottom:1px}
.ev.rpr .rres{display:block;margin-top:3px;font-size:12px;font-weight:650;color:var(--ink2)}
.ev.rpr.up .rk:after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#F59E0B;margin-left:5px;vertical-align:1px}

/* ✨ 상단 회원권 · 포인트 카드 — 3D 금속 카드 (2026-11-18) */
.mstage{position:relative;margin-top:16px;padding-bottom:14px;perspective:1000px}
.mstage:after{content:'';position:absolute;left:12%;right:12%;bottom:0;height:22px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0));filter:blur(4px);z-index:0}
.mcard{margin-top:0!important;height:206px!important;border-radius:20px!important;z-index:1;transform-style:preserve-3d;
  transform:rotateX(var(--rx,7deg)) rotateY(var(--ry,0deg)) translateZ(0)!important;transition:transform .5s cubic-bezier(.22,.61,.36,1),box-shadow .5s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1.5px rgba(227,201,138,.65),
    0 1px 0 #E3C98A,0 2px 0 #C9A44C,0 3px 0 #B08D3A,0 4px 0 #8F6F28,0 5px 0 #6E5418,
    0 18px 26px -8px rgba(0,0,0,.65),0 40px 60px -24px rgba(0,0,0,.8),0 0 46px -8px rgba(227,201,138,.38)!important}
.mcard.pc{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 0 0 1.5px rgba(227,201,138,.6),
    0 1px 0 #E3C98A,0 2px 0 #C9A44C,0 3px 0 #B08D3A,0 4px 0 #8F6F28,0 5px 0 #6E5418,
    0 18px 26px -8px rgba(0,0,0,.6),0 40px 60px -24px rgba(0,0,0,.75),0 0 46px -8px rgba(126,224,195,.35)!important}
.mcard:active{--rx:2deg}
.mcard .shn{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;mix-blend-mode:screen;
  background:linear-gradient(112deg,rgba(255,255,255,0) 30%,rgba(255,240,200,.30) 45%,rgba(255,255,255,.08) 52%,rgba(255,255,255,0) 62%);background-size:280% 100%;background-position:var(--sx,130%) 0;animation:mcShn 6s ease-in-out infinite}
@keyframes mcShn{0%,60%{background-position:130% 0}100%{background-position:-60% 0}}
.mcard .glr{position:absolute;inset:0;z-index:2;pointer-events:none;border-radius:inherit;background:radial-gradient(120% 70% at var(--gx,20%) -10%,rgba(255,255,255,.22),rgba(255,255,255,0) 55%)}
.mcard .chip2{position:absolute;right:22px;top:62px;width:40px;height:30px;border-radius:7px;z-index:3;
  background:linear-gradient(135deg,#F6E3A8 0%,#C9A44C 45%,#E7CF8E 70%,#A9842F 100%);box-shadow:inset 0 0 0 1px rgba(90,60,0,.3),0 2px 4px rgba(0,0,0,.4)}
.mcard .chip2:before{content:'';position:absolute;inset:7px 10px;border:1px solid rgba(90,60,0,.35);border-radius:3px}
.mcard .v{filter:drop-shadow(0 1px 0 #7a5c17) drop-shadow(0 4px 6px rgba(0,0,0,.55))!important;font-size:36px!important}
.mcard .t span{text-shadow:0 1px 0 rgba(0,0,0,.6)}
.mcard>*:not(.shn):not(.glr):not(.chip2){position:relative;z-index:3}
.mcard>.pb{position:absolute!important}
@media (prefers-reduced-motion:reduce){.mcard{transform:none!important}.mcard .shn{animation:none}}
/* 엄지 영역: 아래 고정 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:10px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(250,249,246,0),var(--paper) 30%)}
.dock-in{max-width:448px;margin:0 auto;display:flex;gap:8px}
.dock .ib{width:52px;height:52px;border-radius:16px;background:#fff;display:grid;place-items:center;color:var(--n);box-shadow:0 1px 2px rgba(11,24,51,.08),0 8px 18px -10px rgba(11,24,51,.35);flex:none}
.dock .bk{flex:1;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:850;color:#3B2A06;
  background:linear-gradient(180deg,#F3DFA6,#C9A44C);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 12px 22px -10px rgba(140,100,20,.7)}
button:active{transform:scale(.97)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,8px);opacity:0;background:rgba(14,35,80,.94);color:#fff;font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:14px;transition:.22s;pointer-events:none;white-space:nowrap;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.mcard{transform:none}}

/* 기존 마이페이지 포인트 창(ptx) — 전체 화면으로 */
.ptx-ov{position:fixed;inset:0;z-index:120;display:flex;justify-content:center;background:rgba(8,20,45,.55);opacity:0;transition:opacity .22s}
.ptx-ov.on{opacity:1}
.ptx{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;overflow:hidden;background:#f4f7fb;transform:translateY(30px);transition:transform .32s cubic-bezier(.22,.8,.28,1);font-family:Pretendard,system-ui,sans-serif;color:#14192a;letter-spacing:-.02em}
.ptx-ov.on .ptx{transform:none}

(function(){const act=SX.act;SX.act=function(a,el){const k=String(a).split(':')[0];
  if(k==='go'&&el){const u=el.dataset.u;if(/request\.html|\/home/.test(u))location.href=u;else window.open(u,'_blank','noopener');return;}
  if(k==='nshare'&&el){const t=el.dataset.t||'';if(navigator.share){navigator.share({text:t}).catch(()=>{});}else{try{navigator.clipboard.writeText(t);}catch(e){}const o=document.getElementById('toast');o.textContent=LANG==='en'?'Message copied — paste it in KakaoTalk':'메시지를 복사했어요 — 카카오톡에 붙여 넣어 주세요';o.classList.add('on');setTimeout(()=>o.classList.remove('on'),1800);}return;}

/* 불러오기 — 캐시 먼저 그리고, 새 자료로 다시 그림 (3회 재시도) */
async function boot(){
  const app=document.getElementById('app');
  if(!CID){app.innerHTML='<div class="empty"><b>'+(LANG==='en'?'Please open the link we sent you.':'보내 드린 마이페이지 링크로 열어 주세요.')+'</b></div>';return;}
  const ck='hhc_myc_cache_'+CID;let cached=null;try{cached=JSON.parse(localStorage.getItem(ck)||'null');}catch(e){}
  const svcP=loadSvcKo();
  if(cached&&cached.j){buildFromApi(cached.j,cached.s||{});render();}else app.innerHTML='<div class="empty"><i class="spin"></i>'+(LANG==='en'?'Loading…':'불러오는 중…')+'</div>';
  let j=null;for(let i=0;i<3&&!j;i++){try{const r=await fetch('/api/my?c='+encodeURIComponent(CID)+'&v='+encodeURIComponent(VIS.join(',')),{cache:'no-store'});if(r.ok){const x=await r.json();if(x&&x.ok!==false)j=x;}}catch(e){}if(!j)await new Promise(r=>setTimeout(r,800));}
  if(!j){if(!cached)app.innerHTML='<div class="empty"><b>'+(LANG==='en'?'Could not load. Please try again.':'불러오지 못했어요. 잠시 후 다시 열어 주세요.')+'</b></div>';return;}
  const s=await svcP;try{localStorage.setItem(ck,JSON.stringify({j,s,t:Date.now()}));}catch(e){}
  buildFromApi(j,s);render();
}

  const nr=D.reports.find(r=>r.isNew&&r.op)||D.reports.find(r=>r.isNew);
  if(nr)al.push('<button class="alert tl" data-a="rp:'+D.reports.indexOf(nr)+'"><span class="ic">'+ic('i-doc',22)+'</span><span class="tx"><small>'+(en?'New report':'새 보고서')+'</small><b>'+nr[LANG]+'</b><span class="s">'+dd(nr.date)+' · '+(en?nr.sen:nr.sko)+'</span></span><span class="go ln">'+L.tView+'</span></button>');
  reps.forEach((r,i)=>{if(r.st!=='done'&&r.vd>=iso(TODAY))al.push('<button class="alert am" data-a="rep:'+i+'"><span class="ic">'+WR.replace(/24/g,'22')+'</span><span class="tx"><small>'+(en?'Repair visit scheduled':'수리 방문 예정')+'</small><b>'+dd(r.vd)+' '+r.vt+'</b><span class="s">'+(en?r.sym_en||r.sym:r.sym)+'</span></span><span class="go ln">'+L.tView+'</span></button>');});

  if(al.length)h+='<div class="h"><h2>'+(en?'Needs your attention':'확인이 필요해요')+'</h2></div><div class="als">'+al.join('')+'</div>';

    return '<button class="cc" data-a="care:'+r.k+'"><div class="ph" style="background-image:url('+(CIMG[r.k]||'mp-bg-care.jpg')+')"><em class="'+cl+'">'+L[r.st]+'</em></div><div class="bd"><b>'+r[LANG]+'</b><span class="l num '+cl+'">'+leftTx(r)+'</span><small>'+fill(L.lastS,{d:dd(r.last)})+'</small><div class="tk"><i style="width:'+r.rem+'%;background:'+col+'"></i></div></div></button>';}).join('')+'</div>';

  const ds2=Object.keys(byD).sort().reverse();
  const evs=ds2.map(k=>({k,t:'day'})).concat(reps.map((r,i)=>({k:r.vd||r.req,t:'rep',i}))).sort((a,b)=>b.k.localeCompare(a.k)||(a.t==='rep'?-1:1));
  const show=evs.slice(0,TLN);
  const bkFor=d=>(D.bookings||[]).find(b=>b.d===d);
  const repEv=e=>{const r=reps[e.i],d=pd(e.k),done=r.st==='done',up=!done&&e.k>=iso(TODAY);

      '<span class="tx"><span class="rk">'+(en?'REPAIR':'수리')+'</span><b>'+(en?r.sym_en||r.sym:r.sym)+'</b><small>'+(up?(en?'Visit ':'방문 예정 ')+dd(r.vd)+' '+r.vt:(en?'Visited ':'방문 ')+dd(r.vd||r.req)+(r.vt?' '+r.vt:''))+'</small>'+
      (done&&(r.res||r.res_en)?'<span class="rres">'+(en?'Result: ':'처리 결과 · ')+(en?r.res_en||r.res:r.res)+'</span>':'')+

  h+='<div class="h"><h2>'+(en?'Service history':'서비스 이력')+'</h2><small>'+(en?ds2.length+' visits':'방문 '+ds2.length+'회')+(reps.length?(en?' · '+reps.length+' repairs':' · 수리 '+reps.length+'건'):'')+'</small></div>'+

function mcTilt(){const m=document.querySelector('.mcard');if(!m||matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  m.onpointermove=e=>{const r=m.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;m.style.setProperty('--ry',(x*14).toFixed(2)+'deg');m.style.setProperty('--rx',(7-y*12).toFixed(2)+'deg');m.style.setProperty('--gx',((x+.5)*100).toFixed(0)+'%');m.style.setProperty('--sx',(100-(x+.5)*120).toFixed(0)+'%');};
  m.onpointerleave=()=>{['--ry','--rx','--gx','--sx'].forEach(k=>m.style.removeProperty(k));};
  if(window.DeviceOrientationEvent&&!mcTilt.o){mcTilt.o=1;addEventListener('deviceorientation',e=>{const k=document.querySelector('.mcard');if(!k||e.gamma==null)return;k.style.setProperty('--ry',Math.max(-10,Math.min(10,e.gamma/3)).toFixed(1)+'deg');k.style.setProperty('--gx',(50+Math.max(-40,Math.min(40,e.gamma))).toFixed(0)+'%');});}}
let PMPOS='care',TLN=2,IVN=4,SELM=false,SEL=[];
function bkTitle(it){const segs=String(it).split(/\),\s*/);const s0=segs[0];const nm=s0.split('(')[0];const m=s0.match(/\((\d+대)(?:\/([^)]*))?/g);const last=m?m[m.length-1].replace(/^\(/,''):'';const [cnt,meth]=last.split('/');return nm+(cnt&&/대/.test(cnt)?' '+cnt:'')+(meth?' · '+meth.split('·').pop().trim():'')+(segs.length>1?' 외 '+(segs.length-1)+'건':'');}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-more]')){e.stopPropagation();const y=scrollY;TLN=999;render();scrollTo(0,y);return;}
  if(e.target.closest('[data-less]')){e.stopPropagation();TLN=2;render();const h=[...document.querySelectorAll('.h h2')].find(x=>/서비스 이력|Service history/.test(x.textContent));if(h)scrollTo({top:h.getBoundingClientRect().top+scrollY-12});return;}
  if(e.target.closest('[data-goiv]')){e.stopPropagation();const el=document.getElementById('s-iv');if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-12,behavior:'smooth'});return;}
  if(e.target.closest('[data-ivmore]')){e.stopPropagation();IVN=99;render();return;}
  const sm=e.target.closest('[data-selm]');if(sm){e.stopPropagation();SELM=!SELM;SEL=[];const y=scrollY;render();scrollTo(0,y);return;}
  const pk=e.target.closest('[data-pick]');if(pk){e.stopPropagation();const n=pk.dataset.pick;SEL=SEL.includes(n)?SEL.filter(x=>x!==n):SEL.concat(n);const y=scrollY;render();scrollTo(0,y);return;}
},true);
document.addEventListener('click',e=>{const l=e.target.closest('[data-l]');if(l){LANG=l.dataset.l;render();return;}const a=e.target.closest('[data-a]');if(a){SX.setRet(null);SX.act(a.dataset.a,a);return;}if(e.target.closest('[data-t]'))toast();});
document.addEventListener('DOMContentLoaded',boot);
