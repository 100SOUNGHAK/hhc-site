<!-- ══════════════════════════════════════════════════════════════

       · 그림을 바꿔 올리면 아래 VER 숫자도 바꿉니다 (안 바꾸면 휴대폰에 예전 그림이 남음).
         고객관리 발송 때 함께 나가는 그림도 같은 파일입니다(customer-admin.html IMG_TPL.mvo).
       · 주소 끝에 ?lang=en 을 붙이면 영문으로 열립니다.
     ══════════════════════════════════════════════════════════════ -->

<style>
:root{
  --navy-950:#08172b;--navy-900:#0f2540;--navy-800:#173a5e;
  --teal-800:#0b5f59;--teal-700:#0f766e;
  --gold-700:#8f6f28;--gold-500:#c9a44c;--gold-300:#e3c98a;
  --ink-900:#161d27;--ink-600:#4d5866;--cream:#faf7f0;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:#eef0f4;color:var(--ink-900);line-height:1.6;font-size:15px;letter-spacing:-.01em;word-break:keep-all}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.pg{max-width:560px;margin:0 auto;background:var(--cream);min-height:100vh;box-shadow:0 0 60px rgba(8,23,43,.1);
  padding-bottom:calc(84px + env(safe-area-inset-bottom))}

/* 언어 전환 — 안내장 그림 위에 작게 띄움 */
.lgb{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:3;display:flex;gap:2px;padding:3px;border-radius:999px;
  background:rgba(8,23,43,.55);border:1px solid rgba(255,255,255,.2);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.lgb button{min-width:40px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;color:rgba(255,255,255,.75)}
.lgb button.on{background:#fff;color:var(--navy-900)}

/* 안내장 그림 */
.gd{position:relative;background:var(--navy-900)}
.gd img{display:block;width:100%;height:auto}
.gd .ld{position:absolute;inset:0;display:grid;place-items:center;min-height:60vh;font-size:13px;font-weight:700;color:#a9b8cf}
.gd.ok .ld{display:none}

/* 하단 고정 — 신청 · 문의 */
.cta{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(250,247,240,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid #ece6d8}
.cta .in{max-width:536px;margin:0 auto;display:grid;grid-template-columns:1.35fr 1fr;gap:8px}
.cta a{display:flex;align-items:center;justify-content:center;gap:6px;min-height:50px;border-radius:14px;font-size:15px;font-weight:850;letter-spacing:-.02em;
  transition:transform .14s var(--ease)}
.cta a:active{transform:scale(.97)}
.cta .rq{color:var(--navy-950);background:linear-gradient(145deg,#f4e5b4,var(--gold-500));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 18px -8px rgba(201,164,76,.7)}
.cta .wa{color:#fff;background:var(--teal-700);box-shadow:0 8px 18px -8px rgba(15,118,110,.7)}
.cta svg{width:18px;height:18px;flex:none}
@media (max-width:360px){.cta a{font-size:13.5px}}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.lgb,.cta{display:none}.pg{box-shadow:none;padding-bottom:0}}
</style>
</head>
<body>
<div class="pg" id="app">
  <div class="gd" id="gd">
    <div class="lgb" role="group" aria-label="Language"><button type="button" data-l="ko">한국어</button><button type="button" data-l="en">EN</button></div>
    <div class="ld" id="ld">불러오는 중…</div>
    <img id="pic" alt="">
  </div>
</div>
<div class="cta"><div class="in">
  <a class="rq" id="bRq" href="/request.html"></a>
  <a class="wa" id="bWa" href="#" target="_blank" rel="noopener"></a>
</div></div>

<script>
(function(){
var VER='20261116';   /* 안내장 그림을 바꿔 올리면 이 숫자도 바꿉니다 */
var TEL='60172472774';
var q=new URLSearchParams(location.search);
var LANG=(q.get('lang')||'ko').toLowerCase()==='en'?'en':'ko';
var T={
 ko:{title:'이사 나갈 때 꼭 필요한 서비스 2가지', alt:'이사 나갈 때 꼭 필요한 서비스 2가지 — 에어컨 기본세척 RM 80/대, 커튼 약식 스팀 살균 RM 350(콘도 1,000 sq ft 기준). 집 크기별 예상 비용: 1,000 sq ft RM 590, 1,500 sq ft RM 770, 2,000 sq ft RM 950.',
     ld:'불러오는 중…', fail:'안내장을 불러오지 못했습니다. 잠시 후 다시 열어 주세요.',
     rq:'이사 청소 신청하기', wa:'왓츠앱 문의', waMsg:'안녕하세요, 이사 나갈 때 에어컨 · 커튼 서비스 문의드립니다.'},
 en:{title:'Moving out? 2 services you\'ll need', alt:'Moving out? 2 services you\'ll need — basic air-con cleaning RM 80 per unit, express curtain steam sanitising RM 350 (condo 1,000 sq ft). Estimated cost: 1,000 sq ft RM 590, 1,500 sq ft RM 770, 2,000 sq ft RM 950.',
     ld:'Loading…', fail:'Could not load the guide. Please try again shortly.',
     rq:'Request move-out service', wa:'WhatsApp us', waMsg:'Hello, I\'d like to ask about air-con and curtain service for moving out.'}
};
var WA='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2Z"/></svg>';
if(q.get('pv')==='1'||q.get('embed')==='1') document.documentElement.classList.add('pv');

function render(){
  var L=T[LANG], en=LANG==='en';
  document.documentElement.lang=en?'en':'ko';
  document.title=L.title+' | Happy Home Care';
  document.querySelectorAll('[data-l]').forEach(function(b){ b.classList.toggle('on', b.dataset.l===LANG); });
  var gd=document.getElementById('gd'), pic=document.getElementById('pic'), ld=document.getElementById('ld');
  gd.classList.remove('ok'); ld.textContent=L.ld;
  pic.onload=function(){ gd.classList.add('ok'); };
  pic.onerror=function(){
    if(en && pic.src.indexOf('-en.png')>-1){ pic.src='guide-moveout.png?v='+VER; return; }   /* 영문 그림이 없으면 한국어 그림 */
    ld.textContent=L.fail;
  };
  pic.alt=L.alt;
  pic.src=(en?'guide-moveout-en.png':'guide-moveout.png')+'?v='+VER;
  var rq=document.getElementById('bRq');
  rq.textContent='🚚 '+L.rq;
  rq.href='/request.html'+(en?'?lang=en':'');
  var wa=document.getElementById('bWa');
  wa.innerHTML=WA+'<span>'+L.wa+'</span>';
  wa.href='https://wa.me/'+TEL+'?text='+encodeURIComponent(L.waMsg);
}
document.querySelectorAll('[data-l]').forEach(function(b){
  b.addEventListener('click',function(){
    if(LANG===b.dataset.l) return;
    LANG=b.dataset.l;
    try{var u=new URL(location.href); if(LANG==='en') u.searchParams.set('lang','en'); else u.searchParams.delete('lang'); history.replaceState(null,'',u);}catch(e){}
    render();
    var bk=document.querySelector('#hhcBackToCard span'); if(bk) bk.textContent=LANG==='en'?'Back to card':'명함으로';
  });
});
render();
})();
</script>

<!-- ── 전자명함에서 넘어온 방문자에게만 보이는 되돌아가기 버튼 (fees.html 과 같은 방식) ── -->
<style>
.hhcbk{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));
  z-index:9990;display:none;align-items:center;gap:8px;padding:11px 17px 11px 13px;border-radius:999px;
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  font-size:14px;font-weight:700;letter-spacing:-.01em;color:#fdfcf9;
  background:linear-gradient(150deg,#173a5e,#0f2540);border:1px solid rgba(227,201,138,.45);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 6px rgba(4,12,26,.35),0 14px 28px -12px rgba(4,12,26,.8);
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.hhcbk.on{display:inline-flex}
.hhcbk i{font-style:normal;color:#e3c98a;font-size:16px;line-height:1}
@media print{.hhcbk{display:none!important}}
</style>
<button type="button" class="hhcbk" id="hhcBackToCard"><i>&#8592;</i><span>명함으로</span></button>
<script>
(function(){
  try{
    var q = new URLSearchParams(location.search);
    if(q.get('pv') === '1' || q.get('embed') === '1') return;   /* 미리보기 창 안에서는 띄우지 않음 */
    var en = String(q.get('lang') || '').toLowerCase() === 'en';
    var fromCard = q.get('from') === 'card' || (document.referrer || '').indexOf('/namecard') > -1 || /\/nce?(\?|$)/.test(document.referrer || '');
    if(!fromCard) return;
    var b = document.getElementById('hhcBackToCard'); if(!b) return;
    b.querySelector('span').textContent = en ? 'Back to card' : '명함으로';
    b.setAttribute('aria-label', en ? 'Back to the digital name card' : '전자명함으로 돌아가기');
    b.classList.add('on');
    /* 하단 신청 바 위로 띄운다 */
    function lift(){ var c = document.querySelector('.cta'); var h = c ? c.getBoundingClientRect().height : 0;
      b.style.bottom = 'calc(' + (14 + h) + 'px + env(safe-area-inset-bottom))'; }
    lift(); setTimeout(lift, 600); window.addEventListener('resize', lift);
    b.addEventListener('click', function(){
      if(history.length > 1){ history.back(); }
      else { location.href = '/namecard' + (en ? '?lang=en' : ''); }
    });
  }catch(e){}
})();
</script>
</body>
</html>
