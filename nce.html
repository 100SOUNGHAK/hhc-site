<!-- ══════════════════════════════════════════════════════════════════
     전자명함 짧은 주소 (nce)

     왓츠앱·문자로 명함을 보낼 때 본문에 붙는 주소를 짧게 하려고 만든 파일입니다.
     주소가 길면 말풍선 안에서 두 줄로 감겨 지저분해 보입니다.
       · https://happyhomecare.com.my/namecard?me=0  → 42자 (두 줄)
       · https://happyhomecare.com.my/nce                → 32자 (한 줄)

     왓츠앱·카카오톡은 링크를 받으면 페이지의 자바스크립트를 실행하지 않고
     아래 og: 태그만 읽어 미리보기 카드를 만듭니다. 그래서 이 파일에도
     명함과 같은 사진·문구를 넣어 둡니다.
     받는 분이 누르면 곧바로 전자명함으로 넘어갑니다.

     ⚠️ 한 번만 올리면 되고, 명함 내용이 바뀌어도 수정할 필요가 없습니다.
        (내용은 모두 namecard.html 에 있습니다)
     ══════════════════════════════════════════════════════════════════ -->

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:
    radial-gradient(120% 65% at 82% -8%, rgba(201,164,76,.16), transparent 62%),
    radial-gradient(90% 55% at 8% 108%, rgba(32,77,120,.55), transparent 66%),
    linear-gradient(178deg,#0a1a30,#08172b 58%,#0a1c33);
  color:#eef2f8;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.wrap{max-width:340px}
.logo{width:64px;height:64px;margin:0 auto 18px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  color:#e3c98a;
  background:linear-gradient(158deg,rgba(255,255,255,.13),rgba(255,255,255,.04) 55%,rgba(255,255,255,.02));
  border:1px solid rgba(227,201,138,.34);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 3px 8px rgba(4,12,26,.4),0 16px 28px -14px rgba(4,12,26,.85)}
h1{font-size:18px;font-weight:800;letter-spacing:-.02em}
p{font-size:12.5px;font-weight:600;color:rgba(206,216,230,.8);margin-top:9px;line-height:1.7}
.sp{width:26px;height:26px;margin:20px auto 0;border:2.5px solid rgba(227,201,138,.28);
  border-top-color:#e3c98a;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation:none}}
a.go{display:inline-flex;align-items:center;justify-content:center;gap:7px;margin-top:20px;text-decoration:none;
  font-size:13.5px;font-weight:800;color:#20180a;background:linear-gradient(150deg,#e3c98a,#c9a44c);
  border-radius:12px;padding:12px 22px;box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}
.hhc-mark{width:1.35em;height:1.35em;max-width:82%;max-height:82%;flex:none;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><svg class="hhc-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g fill="currentColor"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg></div>
  <h1>Happy Home Care</h1>
  <p>Opening the digital name card…</p>
  <div class="sp"></div>
  <a class="go" id="go" href="namecard.html?lang=en#c">Open name card →</a>
</div>

<script>
/* 받은 주소의 값(card 등)을 그대로 넘겨 전자명함을 엽니다.
   #c = 고객 화면으로 열어라 (받는 분이 주인 화면을 보지 않도록) */
(function(){
  var q=new URLSearchParams(location.search);
  if(!q.get('lang'))q.set('lang','en');
  var s=q.toString();
  var url='namecard.html'+(s?'?'+s:'')+'#c';
  var a=document.getElementById('go');
  if(a)a.href=url;
  setTimeout(function(){location.replace(url);},600);
})();
</script>
</body>
</html>
