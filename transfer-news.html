.tn-slide{flex:0 0 100%;scroll-snap-align:center;padding:0 18px}
.tn-card{position:relative;aspect-ratio:4/5;border-radius:26px;overflow:hidden;padding:26px 24px;display:flex;flex-direction:column;

.tn-card h2{margin-top:8px;font-family:var(--sf);font-size:25px;font-weight:700;line-height:1.32;letter-spacing:-.04em;color:var(--navy-900);text-wrap:balance}
.tn-card h2 em{font-style:normal;color:var(--gold-600)}
.tn-card .lead{margin-top:8px;font-size:15px;color:var(--ink-600)}

     loading:'불러오는 중입니다…',errH:'안내를 열 수 없습니다',errP:'링크가 만료되었거나 잘못되었습니다. 왓츠앱으로 알려 주세요.',errNo:'아직 동의 전인 양도입니다. 동의 후 다시 안내해 드립니다.',
     all:'잔액 전부'},
   en:{brand:'HAPPY MEMBERSHIP',hint:'← Swipe through the cards →',
     inTitle:'Transfer agreed',outTitle:'Transferee agreed',
     i1k:'TRANSFER AGREED',i1h:function(n){return esc(n)+',<br><em>your transfer<br>is agreed</em>';},i1l:'Thank you for taking over this membership.',i1m:'Balance you receive',
     i2k:'NEXT STEPS',i2h:'What happens next',
     i2s:[['Agreed','You agreed to the transfer details.'],['Transfer contract','We confirm and prepare your new contract.'],['MY PAGE link','We send a link to your contract and balance on WhatsApp.'],['Start using it','Use the balance for services from the day you receive it.']],
     i3k:'YOUR BENEFITS',i3h:'Benefits<br><em>you take over</em>',i3n:'Free service quantities continue with what remains on the original contract.',
     i4k:'MY PAGE',i4h:'Manage everything<br><em>on MY PAGE</em>',
     i4l:[['💳','Balance & history','Check your balance and usage any time.'],['📅','Book a service','Request again with your past items in a tap.'],['🧾','Invoices & reports','See payments and inspection reports in one place.']],
     o1k:'TRANSFEREE AGREED',o1h:function(n){return esc(n)+'<br><em>has agreed to the transfer</em>';},o1l:function(t){return 'Agreed · '+t;},o1m:'Transfer amount',
     o2k:'NEXT STEPS',o2h:'What remains',
     o2s:[['Request received',''],['Transferee agreed','The recipient agreed.'],['Transfer contract','We prepare their new contract.'],['Settle & confirm','We deduct the amount and let you know.']],
     o2p:function(a,n){return a+' of '+n+' recipients agreed';},
     o3k:'PLEASE NOTE',o3h:'Good to know',
     o3l:[['⏳','Before processing','If you use services before we finish, your balance may change — please let us know.'],['🧾','Remaining balance','For a partial transfer, you keep using the rest as usual.'],['📲','Record','Once done, the transfer is recorded in your contract history.']],
     o4k:'THANK YOU',o4h:'Thank you for<br><em>being with us</em>',o4l:'We wish you good health and happiness in your new home.<br>Whenever you are back in Malaysia, we are here for you.',
     wa:'💬 Ask us',mb:'👑 Benefits',home:'🏠 Website',
     waIn:function(d){return 'Hello, I received the transfer-agreed notice. ('+d.to.name+' · '+(d.ref||'')+')';},
     waOut:function(d){return 'Hello, I received the notice that '+d.to.name+' agreed to the transfer. ('+(d.ref||'')+')';},
     when:function(iso){var x=new Date(iso);return isNaN(x)?'':x.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' '+String(x.getHours()).padStart(2,'0')+':'+String(x.getMinutes()).padStart(2,'0');},
     loading:'Loading…',errH:'This page cannot be opened',errP:'The link may have expired or be incorrect. Please message us on WhatsApp.',errNo:'This transfer has not been agreed yet. We will update you after it is agreed.',
     all:'Full balance'}
  };
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function rm(n){return 'RM '+(Number(n)||0).toLocaleString('en-MY',{maximumFractionDigits:2});}
  function L(){return T[S.lang];}
  var LOGO='<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#e3c98a"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M8 50 L50 22 L92 50 L84 58 L50 36 L16 58Z"/></g></svg>';
  function top(){var en=S.lang==='en';return '<div class="tn-top"><div class="tn-logo">'+LOGO+'</div><div><b>Happy Home Care</b><small>'+L().brand+'</small></div>'+
    '<div class="tn-lang" role="group" aria-label="Language"><button type="button" data-l="ko" class="'+(en?'':'on')+'">한국어</button><button type="button" data-l="en" class="'+(en?'on':'')+'">EN</button></div></div>';}
  function card(i,n,cls,body){return '<div class="tn-slide"><article class="tn-card '+(cls||'')+'" aria-label="'+(i+1)+'/'+n+'"><span class="pg num">'+(i+1)+' / '+n+'</span>'+body+
    '<div class="ft"><span>HAPPY HOME CARE</span><span>'+(S.d&&S.d.ref?esc(S.d.ref):'')+'</span></div></article></div>';}
  function steps(list,done){return '<ol class="tn-steps">'+list.map(function(s,i){return '<li data-n="'+(i+1)+'" class="'+(i<done?'ok':i===done?'now':'')+'"><b>'+s[0]+'</b>'+(s[1]?'<p>'+s[1]+'</p>':'')+'</li>';}).join('')+'</ol>';}
  function list(a){return '<ul class="tn-list">'+a.map(function(x){return '<li><div class="ic">'+x[0]+'</div><div><b>'+x[1]+'</b><p>'+x[2]+'</p></div></li>';}).join('')+'</ul>';}
  function slides(){
    var l=L(),d=S.d,en=S.lang==='en',c=d.contract||{},pk=PKG[c.pkg],amt=rm(d.amount);
    var bens=(c.benefits||[]).filter(function(k){return BEN[k];}).map(function(k){return BEN[k][en?1:0];}).filter(function(x,i,a){return a.indexOf(x)===i;});
    var more=Math.max(0,bens.length-6);bens=bens.slice(0,6);
    var out=[];
    if(W==='in'){
      out.push(['cover','<div class="tn-ok">✓</div><div class="kk" style="margin-top:18px">'+l.i1k+'</div><h2>'+l.i1h(d.to.name)+'</h2><p class="lead">'+l.i1l+'</p>'+
        '<div class="tn-mini"><small>'+l.i1m+(pk?' · '+esc(en?pk[1]:pk[0]):'')+'</small><b class="num">'+amt+'</b><span>'+esc(d.from)+' → '+esc(d.to.name)+'</span></div>']);
      out.push(['','<div class="kk">'+l.i2k+'</div><h2>'+l.i2h+'</h2>'+steps(l.i2s,1)]);
      if(bens.length)out.push(['','<div class="kk">'+l.i3k+'</div><h2>'+l.i3h+'</h2>'+(pk?'<div><span class="tn-tier">👑 '+esc(en?pk[1]:pk[0])+'</span></div>':'')+
        '<div class="tn-chips">'+bens.map(function(b){return '<span class="tn-chip"><i>✓</i>'+esc(b)+'</span>';}).join('')+(more?'<span class="tn-chip" style="background:var(--gold-50);color:var(--gold-700)">+'+more+(en?' more':'가지 더')+'</span>':'')+'</div><p class="lead" style="margin-top:auto;font-size:12.5px;color:var(--ink-400)">'+l.i3n+'</p>']);
      out.push(['','<div class="kk">'+l.i4k+'</div><h2>'+l.i4h+'</h2>'+list(l.i4l)]);
    }else{
      var n=d.people||1,a=Math.min(n,d.agreed_n||1);
      out.push(['cover','<div class="tn-ok">✓</div><div class="kk" style="margin-top:18px">'+l.o1k+'</div><h2>'+l.o1h(d.to.name)+'</h2><p class="lead">'+l.o1l(l.when(d.agreed_at))+'</p>'+
        '<div class="tn-mini"><small>'+l.o1m+'</small><b class="num">'+(d.amt_mode==='all'?l.all:amt)+'</b><span>'+esc(d.from)+' → '+esc(d.to.name)+'</span></div>']);
      out.push(['','<div class="kk">'+l.o2k+'</div><h2>'+l.o2h+'</h2>'+(n>1?'<div class="tn-prog"><small>'+l.o2p(a,n)+'</small><div class="bar"><i style="width:'+Math.round(a/n*100)+'%"></i></div></div>':'')+steps(l.o2s,2)]);
      out.push(['','<div class="kk">'+l.o3k+'</div><h2>'+l.o3h+'</h2>'+list(l.o3l)]);
      out.push(['cover','<div class="kk">'+l.o4k+'</div><h2>'+l.o4h+'</h2><div class="tn-thx"><div class="em">🌏✈️</div><p style="color:rgba(255,255,255,.75)">'+l.o4l+'</p></div>']);
    }
    return out;
  }
  function render(){
    var l=L(),en=S.lang==='en',app=document.getElementById('app');
    document.documentElement.lang=en?'en':'ko';document.title=(W==='in'?l.inTitle:l.outTitle)+' | Happy Home Care';
    if(!S.d){
      app.innerHTML=top()+(S.err?'<div class="tn-msg"><div class="ic">🔗</div><h3>'+l.errH+'</h3><p>'+(S.err==='no'?l.errNo:l.errP)+'</p></div>'+
        '<div class="tn-act" style="grid-template-columns:1fr"><a class="a1" href="https://wa.me/'+TEL+'" target="_blank" rel="noopener">'+l.wa+'</a></div>'
        :'<div class="tn-msg"><div class="tn-spin"></div><p style="margin-top:14px">'+l.loading+'</p></div>');
      return;
    }
    var sl=slides(),n=sl.length,d=S.d;
    app.innerHTML=top()+'<div class="tn-track" id="trk">'+sl.map(function(s,i){return card(i,n,s[0],s[1]);}).join('')+'</div>'+
      '<div class="tn-nav"><button type="button" class="ar" data-go="-1" aria-label="이전">‹</button><div class="tn-dots" id="dots">'+sl.map(function(_,i){return '<i class="'+(i===S.at?'on':'')+'"></i>';}).join('')+'</div>'+
      '<button type="button" class="ar" data-go="1" aria-label="다음">›</button></div><p class="tn-hint">'+l.hint+'</p>'+
      '<div class="tn-act"><a class="a1" target="_blank" rel="noopener" href="https://wa.me/'+TEL+'?text='+encodeURIComponent(W==='in'?l.waIn(d):l.waOut(d))+'">'+l.wa+'</a>'+
      (W==='in'?'<a class="a2" href="'+(en?'/membership-en.html':'/membership')+'">'+l.mb+'</a>':'<a class="a2" href="/home'+(en?'?lang=en':'')+'">'+l.home+'</a>')+'</div>';
    var trk=document.getElementById('trk');
    if(S.at)trk.scrollLeft=S.at*trk.clientWidth;
    trk.addEventListener('scroll',function(){var k=Math.round(trk.scrollLeft/Math.max(1,trk.clientWidth));if(k!==S.at){S.at=k;dots();}},{passive:true});
    dots();
  }
  function dots(){var ds=document.querySelectorAll('#dots i');ds.forEach(function(x,i){x.classList.toggle('on',i===S.at);});
    var bs=document.querySelectorAll('[data-go]');if(bs.length){bs[0].disabled=S.at<=0;bs[1].disabled=S.at>=ds.length-1;}}
  document.addEventListener('click',function(e){
    var b=e.target.closest('button[data-l]');if(b){S.lang=b.dataset.l;render();return;}
    var g=e.target.closest('[data-go]');if(g){var trk=document.getElementById('trk');var k=Math.max(0,Math.min(document.querySelectorAll('#dots i').length-1,S.at+(+g.dataset.go)));
      trk.scrollTo({left:k*trk.clientWidth,behavior:'smooth'});S.at=k;dots();}
  });
  document.addEventListener('keydown',function(e){var t=document.getElementById('trk');if(!t)return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){var bt=document.querySelector('[data-go="'+(e.key==='ArrowRight'?1:-1)+'"]');if(bt&&!bt.disabled)bt.click();}});
  render();
  var k=q.get('k')||(window.__PVK?'previewpreview1234':''),i=q.get('i')||'0';
  if(!/^[A-Za-z0-9]{16,40}$/.test(k)){S.err='bad';render();return;}
  fetch('/api/transfer?k='+encodeURIComponent(k)+'&i='+encodeURIComponent(i),{cache:'no-store'})
    .then(function(r){return r.json();})
    .then(function(j){if(!j||!j.ok)throw new Error('x');if(!LANG_SET)S.lang=j.lang==='en'?'en':'ko';
      if(!j.agreed_at){S.err='no';render();return;}S.d=j;render();})
    .catch(function(){S.err='load';render();});
})();
</script>
</body>
</html>
