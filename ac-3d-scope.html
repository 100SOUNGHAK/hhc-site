<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D로 보는 세척 종류별 분해 범위 · 해피홈케어</title>
<meta name="description" content="기본 · 약품 · 스팀살균 · 반분해 · 전체분해 — 어디까지 분해하고 어떻게 세척하는지 3D 영상으로 확인하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="3D로 보는 세척 종류별 분해 범위 | 해피홈케어">
<meta property="og:description" content="기본 · 약품 · 스팀살균 · 반분해 · 전체분해 — 어디까지 분해하고 어떻게 세척하는지 3D 영상으로 확인하세요.">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f2540'/%3E%3Cg fill='%23e3c98a' transform='translate(20 20) scale(0.6)'%3E%3Crect x='15' y='14' width='19' height='74' rx='3.5'/%3E%3Crect x='66' y='14' width='19' height='74' rx='3.5'/%3E%3Cpath d='M50 28 85 51v16L50 43 15 67V51Z'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--navy:#12284a;--teal:#0fa3a3;--gold:#c9a24a;--ink:#1d2733;--mute:#6b7785}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink)}
  body{background:radial-gradient(120% 90% at 40% 30%,#f4f6f8 0%,#e3e7eb 55%,#c9d0d7 100%)}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%}
  .hud{position:fixed;left:18px;top:16px;pointer-events:none}
  .rec{display:inline-flex;align-items:center;gap:8px;background:rgba(18,40,74,.92);color:#fff;
       font-size:12px;letter-spacing:.08em;padding:6px 10px;border-radius:6px}
  .rec i{width:8px;height:8px;border-radius:50%;background:#e5484d;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}
  .htitle{margin-top:10px}
  .hbtn{display:flex;gap:6px;align-items:center;margin-bottom:8px;pointer-events:auto}
  .pill{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;background:#fff;color:var(--navy);font-size:12px;font-weight:700;text-decoration:none;box-shadow:0 2px 8px rgba(18,40,74,.15)}
  .pill[hidden]{display:none}
  .lng{display:inline-flex;background:rgba(18,40,74,.9);border-radius:999px;padding:2px}
  .lng button{border:0;background:none;color:rgba(255,255,255,.7);font:700 11px "Noto Sans KR";padding:5px 10px;border-radius:999px;cursor:pointer}
  .lng button.on{background:var(--gold);color:var(--navy)}
  .sum .sf{display:none} body.mob .sum .lf{display:none} body.mob .sum .sf{display:inline}
  .tcard .e:empty,.panel .ph .e:empty,.callout .e:empty{display:none}
  .htitle b{display:block;font-size:18px;color:var(--navy)}
  .htitle span{font-size:12px;color:var(--mute)}

  /* service panel */
  .panel{position:fixed;right:16px;top:16px;width:300px;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);
         border-radius:12px;box-shadow:0 8px 26px rgba(18,40,74,.15);overflow:hidden;transition:opacity .3s}
  .panel .ph{background:var(--navy);color:#fff;padding:11px 14px}
  .panel .ph .no{font:700 11px ui-monospace,monospace;color:var(--gold);letter-spacing:.1em}
  .panel .ph .k{font-size:18px;font-weight:700;margin-top:2px}
  .panel .ph .e{font-size:12px;opacity:.75}
  .panel .sec{padding:10px 14px 4px}
  .panel .lb{font-size:11px;color:var(--mute);margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:11px;padding:3px 7px;border-radius:10px;background:#eef1f4;color:#a2abb5}
  .chip.in{background:var(--teal);color:#fff}
  .chip.in.cur{background:var(--gold);color:var(--navy);font-weight:700}
  .list{list-style:none;margin:0;padding:4px 14px 12px}
  .list li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.35;padding:5px 0;
           border-bottom:1px dashed #e3e7eb;opacity:.28;transition:opacity .3s}
  .list li:last-child{border-bottom:0}
  .list li.show{opacity:1}
  .list li .ck{flex:0 0 18px;height:18px;border-radius:50%;border:1.5px solid #c5ccd3;display:grid;place-items:center;
               font-size:11px;color:#fff;margin-top:1px;transition:background .25s,border-color .25s}
  .list li.done .ck{background:var(--teal);border-color:var(--teal)}
  .list li small{display:block;color:var(--mute);font-size:11px}
  .note{margin:0 14px 12px;padding:7px 9px;border-radius:7px;background:#fbf6e9;color:#7a6326;font-size:11.5px;line-height:1.4}
  /* 투명 패널 — 뒤의 3D 부품이 비쳐 보이고, 글자는 흰 테두리 빛으로 또렷하게 (2026-11-22) */
  .panel{background:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 26px rgba(18,40,74,.10)}
  .panel .ph{background:rgba(18,40,74,.80)}
  .panel .sec,.panel .list{text-shadow:0 0 2px #fff,0 0 5px #fff,0 0 9px rgba(255,255,255,.95)}
  .panel .lb{color:#3d4856;font-weight:600}
  .list li{color:#0f1c2b;font-weight:600;border-bottom-color:rgba(18,40,74,.18);opacity:.5}
  .list li.show{opacity:1}
  .list li .ck{background:rgba(255,255,255,.7)}
  .chip{background:rgba(255,255,255,.72);color:#6b7785;text-shadow:none}
  .note{background:rgba(251,246,233,.85)}

  /* title card */
  .tcard{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
         background:rgba(18,40,74,.94);color:#fff;border-radius:16px;padding:22px 34px;min-width:340px;
         box-shadow:0 18px 50px rgba(18,40,74,.35);transition:opacity .35s, transform .35s;opacity:0}
  .tcard .no{font:700 12px ui-monospace,monospace;color:var(--gold);letter-spacing:.18em}
  .tcard .k{font-size:30px;font-weight:700;margin:6px 0 2px}
  .tcard .e{font-size:14px;opacity:.75}
  .tcard .sc{margin-top:12px;font-size:13px;color:#bfe9e9}
  .tcard .sc b{color:var(--gold)}

  /* phase caption */
  /* 진행 단계 설명 — 남색 알약 + 단계 아이콘 · 단계 번호 (2026-11-27 크게 · 또렷하게) */
  .phase{position:fixed;left:50%;top:16px;transform:translateX(-50%);pointer-events:none;display:flex;align-items:center;gap:11px;
         background:rgba(18,40,74,.95);color:#fff;border-radius:999px;padding:7px 22px 7px 7px;white-space:nowrap;
         box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 4px rgba(4,12,26,.25),0 16px 30px -12px rgba(4,12,26,.55);transition:opacity .25s}
  .phase .pi{flex:0 0 42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:21px;line-height:1;background:var(--teal);
             box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 0 0 3px rgba(255,255,255,.12)}
  .phase .pi.chem{background:#7c5cc4} .phase .pi.steam{background:#d9534f} .phase .pi.air{background:#5b6b7c}
  .phase .pi.dis{background:#3c6aa8} .phase .pi.res{background:var(--gold)} .phase .pi.reasm{background:#3c6aa8} .phase .pi.run{background:#1f9d6a}
  .phase .pt{display:flex;flex-direction:column;line-height:1.2}
  .phase .pt small{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--gold)}
  .phase .pt small em{font-style:normal;color:rgba(255,255,255,.62);font-weight:500;margin-left:6px;letter-spacing:0}
  .phase .pt b{font-size:19px;font-weight:800;letter-spacing:-.01em}
  .phase.pop .pi{animation:phPop .45s cubic-bezier(.22,.61,.36,1)}
  .phase.pop .pt b{animation:phIn .35s ease-out}
  @keyframes phPop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:none}}
  @keyframes phIn{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.phase.pop .pi,.phase.pop .pt b{animation:none}}

  .callout{position:fixed;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%);transition:opacity .25s;white-space:nowrap}
  .callout .box{background:#fff;border-left:3px solid var(--gold);border-radius:6px;padding:6px 10px;box-shadow:0 6px 18px rgba(18,40,74,.18)}
  .callout .k{font-weight:700;font-size:14px;color:var(--navy)}
  .callout .e{font-size:11px;color:var(--mute)}
  .callout .stem{width:1.5px;height:22px;background:var(--gold);margin:0 auto}

  /* 🌡️ 작동 확인 온도 카드 — 흡입 → 토출 · 온도차 (2026-11-27 실사 3차) */
  .tmp{position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .3s;background:rgba(18,40,74,.95);color:#fff;border-radius:16px;padding:9px 18px 10px 16px;white-space:nowrap;
       box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 4px rgba(4,12,26,.25),0 16px 30px -12px rgba(4,12,26,.55)}
  .tmp .tmh{font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--gold);margin-bottom:3px}
  .tmp .tmb{display:flex;align-items:flex-end;gap:12px}
  .tmp .tmc small{display:block;font-size:11px;font-weight:500;color:rgba(255,255,255,.66);line-height:1.3}
  .tmp .tmc b{display:block;font-size:19px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:rgba(255,255,255,.86)}
  .tmp .tmc.out b{font-size:31px;font-weight:800;color:#bfe9e9}
  .tmp .tmb i{font-style:normal;font-size:16px;color:rgba(255,255,255,.5);padding-bottom:5px}
  .tmp .tmd{margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,.16);font-size:12.5px;font-weight:600;color:rgba(255,255,255,.8)}
  .tmp .tmd b{font-size:14px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;margin-left:2px}
  body.mob .tmp{padding:7px 14px 8px 13px;border-radius:14px}
  body.mob .tmp .tmc b{font-size:16px} body.mob .tmp .tmc.out b{font-size:26px}
  /* 🔎 세척 결과 카드 · 잔류 핀 (2026-11-24) */
  .rcard{position:fixed;left:18px;top:128px;width:290px;pointer-events:none;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s;
         background:rgba(255,255,255,.95);border-radius:14px;box-shadow:0 14px 40px rgba(18,40,74,.22);overflow:hidden}
  .rcard.on{opacity:1;transform:none}
  .rcard .rh{background:var(--navy);color:#fff;padding:9px 14px;display:flex;justify-content:space-between;align-items:center}
  .rcard .rh b{font:700 11px ui-monospace,monospace;letter-spacing:.14em;color:var(--gold)}
  .rcard .rh span{font-size:13px;font-weight:700}
  .rcard .rb{display:flex;gap:12px;align-items:center;padding:12px 14px 6px}
  .rcard .ring{position:relative;flex:0 0 86px;height:86px}
  .rcard .ring svg{width:86px;height:86px;transform:rotate(-90deg)}
  .rcard .ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1}
  .rcard .ring .num b{font-size:25px;font-weight:800;color:var(--navy)}
  .rcard .ring .num small{display:block;font-size:9.5px;color:var(--mute);margin-top:3px}
  .rcard .rd{font-size:12.5px;line-height:1.45;color:#1d2733;font-weight:500}
  .rcard ul{list-style:none;margin:0;padding:4px 14px 12px}
  .rcard li{display:flex;gap:7px;align-items:center;font-size:12px;padding:3px 0;color:#2a3645}
  /* ⚠ 남는 오염 — 빨간 상자로 따로 크게 (2026-11-27) */
  .rbad{margin:4px 12px 10px;border-radius:11px;background:#fdecec;box-shadow:inset 0 0 0 1.5px rgba(196,53,58,.35);padding:8px 10px 6px}
  .rbad .bh{font-size:12.5px;font-weight:800;color:#b42a30;margin-bottom:4px;display:flex;align-items:center;gap:6px}
  .rbad .bi{display:flex;align-items:flex-start;gap:7px;padding:4px 0;border-top:1px dashed rgba(196,53,58,.22)}
  .rbad .bi:first-of-type{border-top:0}
  .rbad .bi b{font-size:14px;font-weight:800;color:#1d2733;line-height:1.3}
  .lvb{flex:0 0 auto;font-size:11px;font-weight:800;color:#fff;border-radius:999px;padding:2px 8px;margin-top:1px;white-space:nowrap}
  .lvb.many{background:#d93a40} .lvb.some{background:#e07a1f} .lvb.trace{background:#b8941a}
  .rbad.clean{background:#e5f6f3;box-shadow:inset 0 0 0 1.5px rgba(15,163,163,.35)} .rbad.clean .bh{color:#0b7a7a;margin:0}
  .rok{padding:0 14px 12px;font-size:11.5px;color:#4d5866;line-height:1.5}
  .rok b{color:#0b8282;font-weight:700;margin-right:4px}
  body.mob .rbad{margin:2px 10px 8px;padding:6px 9px 4px}
  body.mob .rbad .bh{font-size:11.5px;margin-bottom:2px}
  body.mob .rbad .bi{padding:2px 0} body.mob .rbad .bi b{font-size:12.5px}
  body.mob .lvb{font-size:10px;padding:1px 7px}
  body.mob .rok{display:none}
  .rcard li i,.spot i{flex:0 0 9px;height:9px;border-radius:50%}
  .lv-many{background:#e5484d} .lv-some{background:#f08c2e} .lv-trace{background:#e3c34a} .lv-ok{background:var(--teal)}
  .spot{position:fixed;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;display:flex;align-items:center;gap:6px;transform:translate(-9px,-50%)}
  .spot i{width:12px;height:12px;flex-basis:12px;box-shadow:0 0 0 3px rgba(255,255,255,.9);animation:spP 1.3s ease-out infinite}
  .spot span{background:#fff;border-radius:6px;padding:4px 9px;font-size:12.5px;font-weight:700;color:var(--navy);box-shadow:0 6px 16px rgba(18,40,74,.2);border-left:3px solid currentColor}
  /* 잔류 핀 — 수준 배지 + 큰 점 + 퍼지는 빨간 고리 / 제거 핀은 작고 조용하게 (2026-11-27) */
  .spot.bad span{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;padding:5px 11px 5px 6px;border-left:0;border-radius:999px;
                 box-shadow:0 0 0 2px currentColor,0 8px 20px rgba(18,40,74,.28)}
  .spot.bad span .lvb{margin:0}
  .spot.bad span .nm{color:#1d2733}
  .spot .lvb,.rbad .lvb{color:#fff!important}
  .spot.bad i{width:18px;height:18px;flex-basis:18px;animation:spB 1.2s ease-out infinite}
  .spot.some.bad i{animation-name:spO} .spot.trace.bad i{animation-name:spY}
  @keyframes spB{0%{box-shadow:0 0 0 3px #fff,0 0 0 3px rgba(229,72,77,.75)}100%{box-shadow:0 0 0 3px #fff,0 0 0 22px rgba(229,72,77,0)}}
  @keyframes spO{0%{box-shadow:0 0 0 3px #fff,0 0 0 3px rgba(240,140,46,.75)}100%{box-shadow:0 0 0 3px #fff,0 0 0 20px rgba(240,140,46,0)}}
  @keyframes spY{0%{box-shadow:0 0 0 3px #fff,0 0 0 3px rgba(227,195,74,.8)}100%{box-shadow:0 0 0 3px #fff,0 0 0 18px rgba(227,195,74,0)}}
  .spot.ok span{font-size:11.5px;font-weight:600;padding:3px 8px;opacity:.9}
  .spot.ok i{width:10px;height:10px;flex-basis:10px}
  @media (prefers-reduced-motion:reduce){.spot i{animation:none!important}}
  .spot.many span{color:#c4353a} .spot.some span{color:#c26a12} .spot.trace span{color:#9a7d14} .spot.ok span{color:#0b8282}
  .spot span em{font-style:normal;color:#1d2733;font-weight:600}
  @keyframes spP{0%{box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 0 3px rgba(229,72,77,.5)}100%{box-shadow:0 0 0 3px rgba(255,255,255,.9),0 0 0 14px rgba(229,72,77,0)}}
  .spot.ok i{animation:none}
  .spot.flip{flex-direction:row-reverse;transform:translate(calc(-100% + 9px),-50%)}
  .spot.flip span{border-left:0;border-right:3px solid currentColor} .spot.bad.flip span{border-right:0}
  body.mob .rcard{left:8px;right:8px;top:auto;bottom:104px;width:auto}
  body.mob .rcard .rb{padding:8px 12px 2px}
  body.mob .rcard .ring{flex-basis:70px;height:70px} body.mob .rcard .ring svg{width:70px;height:70px}
  body.mob .rcard .ring .num b{font-size:18px;letter-spacing:-.04em}
  body.mob .rcard .rd{font-size:11.5px}
  body.mob .rcard ul{display:none}
  body.mob .spot span{font-size:11px;padding:3px 7px;white-space:normal;max-width:170px;line-height:1.3}
  body.mob .spot.bad span{font-size:12px;padding:4px 9px 4px 5px;gap:5px;max-width:200px}
  body.mob .spot.bad i{width:15px;height:15px;flex-basis:15px}
  body.mob .spot.bad span{white-space:nowrap;max-width:none;padding:4px 10px} body.mob .spot .lvb{display:none}
  body.mob .spot span em{display:block;font-size:10.5px}
  body.mob .spot span .dt{display:none}
  .sum .pc{color:var(--navy);font-size:13px;font-weight:800}

  /* summary */
  .sum{position:fixed;inset:0;display:grid;place-items:center;padding:10px 12px 130px;background:rgba(233,237,241,.72);backdrop-filter:blur(3px);
       opacity:0;pointer-events:none;transition:opacity .45s}
  .sum.on{opacity:1;pointer-events:auto}
  .sum .card{max-height:100%;background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(18,40,74,.25);width:min(860px,calc(100% - 24px));overflow:hidden auto}
  .sum .hd{background:var(--navy);color:#fff;padding:14px 18px}
  .sum .hd b{font-size:19px}
  .sum .hd span{display:block;font-size:12px;opacity:.75}
  .sum table{width:100%;border-collapse:collapse;font-size:13px}
  .sum th,.sum td{padding:8px 6px;text-align:center;border-bottom:1px solid #edf0f3}
  .sum th{font-size:12px;color:var(--navy);background:#f5f7f9;line-height:1.25}
  .sum th small,.sum td small{display:block;font-weight:400;color:var(--mute);font-size:10.5px}
  .sum td:first-child,.sum th:first-child{text-align:left;padding-left:16px}
  .sum .f{color:var(--teal);font-size:17px}
  .sum .p{color:var(--gold);font-size:17px}
  .sum .x{color:#c3cad1}
  .sum .d{color:var(--navy);font-size:15px}
  .sum tr.sep td{background:#f5f7f9;color:var(--navy);font-weight:700;font-size:12px;padding:6px 16px}
  .sum th,.sum td{padding:4px 6px}
  .sum td small{display:inline;margin-left:6px}
  .sum td:not(:first-child) small{display:block;margin:0}
  .sum .lg{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;font-size:12px;color:var(--mute)}
  .sum .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px 14px;font-size:11.5px;color:var(--mute)}
  .sum button{border:0;background:var(--teal);color:#fff;border-radius:8px;height:34px;padding:0 14px;font:500 13px "Noto Sans KR";cursor:pointer;white-space:nowrap}

  .bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(980px,calc(100% - 24px));
       background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:12px;box-shadow:0 8px 26px rgba(18,40,74,.15);padding:10px 12px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
  .tab{border-radius:8px;padding:6px 8px;background:#eef1f4;cursor:pointer;border:1px solid transparent;position:relative;overflow:hidden}
  .tab .n{font:700 10px ui-monospace,monospace;color:var(--mute)}
  .tab .k{font-size:13px;font-weight:700;color:var(--navy);line-height:1.2}
  .tab .e{font-size:10px;color:var(--mute)}
  .tab .ks{display:none}
  .smx{display:none}

// 광택 도장 판넬: 아주 미세한 오렌지필 요철 (노멀맵)
function noiseNormal(size, amp, blobs){
  const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d');
  x.fillStyle='#808080'; x.fillRect(0,0,size,size);
  for(let i=0;i<blobs;i++){ const cx=Math.random()*size, cy=Math.random()*size, r=2+Math.random()*6, v=Math.random()<.5?100:156;
    const g=x.createRadialGradient(cx,cy,0,cx,cy,r); g.addColorStop(0,`rgba(${v},${v},${v},.5)`); g.addColorStop(1,`rgba(${v},${v},${v},0)`); x.fillStyle=g; x.fillRect(cx-r,cy-r,r*2,r*2); }
  const hd = x.getImageData(0,0,size,size).data, out = x.createImageData(size,size), o = out.data;
  const H = (i,j)=>hd[(((j+size)%size)*size+((i+size)%size))*4]/255;
  for(let j=0;j<size;j++) for(let i=0;i<size;i++){ const dx=(H(i+1,j)-H(i-1,j))*amp, dy=(H(i,j+1)-H(i,j-1))*amp, l=Math.hypot(dx,dy,1), k=(j*size+i)*4;
    o[k]=(-dx/l*0.5+0.5)*255; o[k+1]=(-dy/l*0.5+0.5)*255; o[k+2]=(1/l*0.5+0.5)*255; o[k+3]=255; }
  x.putImageData(out,0,0); const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=8; return t;
}

const V2 = (x,y)=>new THREE.Vector2(x,y);
// extrude a profile drawn in (z,y) along the X axis, centred on x=0
function extrudeX(shape, L, bevel=0, curveSegments=24){
  const g = new THREE.ExtrudeGeometry(shape, {depth:L, bevelEnabled:bevel>0, bevelThickness:bevel, bevelSize:bevel*0.8, bevelSegments:4, curveSegments});
  g.rotateY(-Math.PI/2); g.translate(L/2,0,0);
  g.computeVertexNormals();
  return g;
}
function dedupe(pts){ return pts.filter((p,i)=> i===0 || p.distanceTo(pts[i-1])>1e-6); }
// band (strip of thickness t) along polyline, offset to the left-normal side when sign=+1
function bandShape(pts, t, sign=1){
  pts = dedupe(pts);
  const inner = pts.map((p,i)=>{
    const a = pts[Math.max(i-1,0)], b = pts[Math.min(i+1,pts.length-1)];
    let n;
    if(i>0 && i<pts.length-1){
      const t1 = p.clone().sub(a).normalize(), t2 = b.clone().sub(p).normalize();
      const n1 = V2(-t1.y,t1.x), n2 = V2(-t2.y,t2.x);
      n = n1.clone().add(n2).normalize();
      const d = Math.max(n.dot(n1), 0.35);
      n.multiplyScalar(1/d);
    } else {
      const tg = b.clone().sub(a).normalize(); n = V2(-tg.y,tg.x);
    }
    return p.clone().add(n.multiplyScalar(t*sign));
  });
  const s = new THREE.Shape(pts);
  inner.reverse().forEach(p=>s.lineTo(p.x,p.y));
  s.closePath();
  return s;
}
function mesh(geo, mat, parent){
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true;
  parent && parent.add(m); return m;
}
// 📐 모든 상자 부품 모서리를 실제 사출·판금처럼 살짝 둥글게 (모서리에 빛이 맺혀 실물감 ↑)
const RBOX = new Map();
function rbox(w,h,d){ const r = Math.min(0.0025, Math.min(w,h,d)*0.3), k = [w,h,d].map(v=>v.toFixed(5)).join();
  if(!RBOX.has(k)) RBOX.set(k, r < 0.0002 ? new THREE.BoxGeometry(w,h,d) : new RoundedBoxGeometry(w,h,d,2,r)); return RBOX.get(k); }
function box(w,h,d,mat,parent,x=0,y=0,z=0){ const m = mesh(rbox(w,h,d),mat,parent); m.position.set(x,y,z); return m; }
function cylX(r,len,mat,parent,x,y,z,seg=32){ const g=new THREE.CylinderGeometry(r,r,len,seg); g.rotateZ(Math.PI/2); const m=mesh(g,mat,parent); m.position.set(x,y,z); return m; }
function tube(points, r, mat, parent){ const c = new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p))); return mesh(new THREE.TubeGeometry(c, 48, r, 14, false), mat, parent); }

function makePart(cx,cy,cz){
  const outer = new THREE.Group(); outer.position.set(cx,cy,cz);
  const inner = new THREE.Group(); inner.position.set(-cx,-cy,-cz);
  outer.add(inner); unitGroup.add(outer);
  return {outer, inner, home:new THREE.Vector3(cx,cy,cz)};
}

  const n = Math.floor((X1-X0)/pitch);

  for(let i=0;i<n;i++){ mtx.makeTranslation(X0+i*pitch,0,0); fins.setMatrixAt(i,mtx); }
  fins.castShadow = fins.receiveShadow = true;
  evap.inner.add(fins);

  const sheetGeo = new THREE.ExtrudeGeometry(finShape,{depth:0.003,bevelEnabled:false}); sheetGeo.rotateY(-Math.PI/2);

  const tubes = [];

  const c = document.createElement('canvas'); c.width = c.height = 512; const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0,0,512,512);

  const R = Math.random;
  if(kind === 'mold'){                     // 검은 곰팡이 군락 (블로워 · 송풍통로 · 루버)
    // 실사형: 회색 먼지막 위에 작은 검은 곰팡이 점이 군데군데 퍼짐 (가운데 진하고 가장자리로 흩어짐)
    for(let i=0;i<18;i++) blot(R()*512,R()*512,60+R()*90,'150,148,138',.22);
    const gs = ()=> (R()+R()+R()-1.5)/1.5;
    for(let i=0;i<46;i++){ const cx=R()*512, cy=R()*512, sp=12+R()*34, n=60+R()*120|0;
      blot(cx,cy,sp*1.1,'60,66,58',.12);
      for(let k=0;k<n;k++){ const px=cx+gs()*sp*1.6, py=cy+gs()*sp*1.6, r=.6+R()*2.4; x.fillStyle=`rgba(${18+R()*20|0},${22+R()*22|0},${20+R()*14|0},${.55+R()*.4})`; x.beginPath(); x.arc(px,py,r,0,7); x.fill(); } }
    for(let i=0;i<5000;i++){ x.fillStyle=`rgba(40,44,40,${.15+R()*.35})`; x.fillRect(R()*512,R()*512,1,1); }
  } else if(kind === 'slime'){             // 물때 · 갈색 슬라임 + 곰팡이 점 (드레인판)
    x.fillStyle='rgba(185,160,115,.35)'; x.fillRect(0,0,512,512);
    for(let i=0;i<20;i++) blot(R()*512,R()*512,50+R()*90,'135,104,60',.3+R()*.2);
    const gs2 = ()=> (R()+R()+R()-1.5)/1.5;
    for(let i=0;i<34;i++){ const cx=R()*512, cy=R()*512, sp=10+R()*26; for(let k=0;k<70;k++){ x.fillStyle=`rgba(26,30,24,${.5+R()*.4})`; x.beginPath(); x.arc(cx+gs2()*sp*1.6, cy+gs2()*sp*1.6, .6+R()*2.2,0,7); x.fill(); } }
    x.strokeStyle='rgba(120,90,45,.35)'; x.lineWidth=6; for(let i=0;i<10;i++){ x.beginPath(); const y=R()*512; x.moveTo(0,y); x.bezierCurveTo(170,y+R()*40-20,340,y+R()*40-20,512,y); x.stroke(); }
  } else if(kind === 'dust'){              // 먼지 · 찌든 때 + 곰팡이 점 (에바포레이터)
    for(let i=0;i<50;i++) blot(R()*512,R()*512,30+R()*70,'105,94,72',.55+R()*.3);
    for(let i=0;i<5000;i++){ const v=90+R()*60|0; x.fillStyle=`rgba(${v},${v-8},${v-20},${.3+R()*.5})`; x.fillRect(R()*512,R()*512,1,2+R()*4); }
    for(let i=0;i<34;i++){ const cx=R()*512, cy=R()*512; for(let k=0;k<10;k++) blot(cx+(R()-.5)*45, cy+(R()-.5)*45, 3+R()*10,'30,36,28',.7); }
  } else {                                 // 케이스 — 누런 때 · 흐린 먼지 (가볍게)
    // 실사형: 전체가 고르게 누렇게 바램 + 아주 고운 먼지 + 흐르는 물때 자국 (동그란 얼룩 없음)
    x.fillStyle='rgba(226,214,186,.38)'; x.fillRect(0,0,512,512);
    for(let i=0;i<30;i++) blot(R()*512,R()*512,40+R()*70,'205,190,155',.10+R()*.08);
    for(let i=0;i<9000;i++){ const v=150+R()*50|0; x.fillStyle=`rgba(${v},${v-8},${v-24},${.08+R()*.18})`; x.fillRect(R()*512,R()*512,1,1); }
    x.lineCap='round'; for(let i=0;i<26;i++){ const sx=R()*512, sy=R()*512, len=40+R()*120; const g=x.createLinearGradient(sx,sy,sx,sy+len);
      g.addColorStop(0,'rgba(170,150,110,.22)'); g.addColorStop(1,'rgba(170,150,110,0)'); x.strokeStyle=g; x.lineWidth=2+R()*5; x.beginPath(); x.moveTo(sx,sy); x.lineTo(sx+(R()-.5)*6,sy+len); x.stroke(); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 4;
  return t;
}

function addGrime(mat, tex, k=1){
  mat.map = tex; mat.userData.dirt = {value:1}; const K = k.toFixed(2);

  };

function grimeReal(kind, rep){
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S; const x = c.getContext('2d'), R = Math.random;
  x.fillStyle = '#fff'; x.fillRect(0,0,S,S);
  const wrap = (cx, cy, r, fn)=>{ for(const ox of [-S,0,S]) for(const oy of [-S,0,S]){ const px = cx+ox, py = cy+oy; if(px > -r && px < S+r && py > -r && py < S+r) fn(px, py); } };
  const blot = (cx, cy, r, col, a, sq=1)=>wrap(cx, cy, r, (px,py)=>{ const g = x.createRadialGradient(px,py,0,px,py,r); g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(.5,`rgba(${col},${a*.7})`); g.addColorStop(1,`rgba(${col},0)`);
    x.save(); x.translate(px,py); x.scale(1,sq); x.translate(-px,-py); x.fillStyle = g; x.beginPath(); x.arc(px,py,r,0,7); x.fill(); x.restore(); });
  const gs = ()=> (R()+R()+R()-1.5)/1.5;
  const colony = (cx, cy, sp, n, col)=>{ for(let k=0;k<n;k++){ const px = cx+gs()*sp*1.7, py = cy+gs()*sp*1.7, r = .5+R()*R()*3.2;
    wrap(px, py, r, (qx,qy)=>{ x.fillStyle = `rgba(${col[0]+R()*18|0},${col[1]+R()*18|0},${col[2]+R()*12|0},${.5+R()*.45})`; x.beginPath(); x.arc(qx,qy,r,0,7); x.fill(); }); } };
  if(kind === 'slime'){                    // 드레인판 — 누런 물때 막 + 갈색 슬라임 띠 + 검은 곰팡이
    x.fillStyle = 'rgba(190,172,136,.26)'; x.fillRect(0,0,S,S);
    for(let i=0;i<40;i++) blot(R()*S, R()*S, 60+R()*150, R()<.5?'120,100,64':'140,122,84', .14+R()*.2, .8+R()*.5);
    for(let i=0;i<320;i++) blot(R()*S, R()*S, 6+R()*R()*54, R()<.55?'84,72,46':'58,58,42', .2+R()*.36, .75+R()*.6);
    for(let i=0;i<190;i++){ const sp = 3+R()*R()*50; colony(R()*S, R()*S, sp, 16+sp*6|0, [20,24,18]); }
    for(let i=0;i<18000;i++){ x.fillStyle = `rgba(62,54,36,${.06+R()*.22})`; x.fillRect(R()*S, R()*S, 1+R()*2, 1+R()*2); }
  } else if(kind === 'dust'){              // 에바포레이터 — 핀 사이에 낀 회색 먼지 뭉침 + 젖었다 마른 얼룩 + 곰팡이 점
    for(let i=0;i<70;i++) blot(R()*S, R()*S, 50+R()*150, R()<.5?'112,104,90':'92,86,76', .30+R()*.3, .5+R()*.6);
    for(let i=0;i<300;i++) blot(R()*S, R()*S, 6+R()*R()*44, R()<.35?'176,170,158':'70,66,58', .22+R()*.4, .6+R()*.8);   // 밝은 것 = 보풀처럼 뭉친 먼지
    for(let i=0;i<22000;i++){ const v = 96+R()*90|0; x.fillStyle = `rgba(${v},${v-5},${v-14},${.12+R()*.3})`; x.fillRect(R()*S, R()*S, 1, 2+R()*7); }
    for(let i=0;i<70;i++){ const sp = 4+R()*R()*34; colony(R()*S, R()*S, sp, 10+sp*4|0, [26,30,24]); }
  } else if(kind === 'mold'){              // 블로워 · 송풍통로 · 루버 — 회색 먼지막 위 검은 곰팡이 군락
    for(let i=0;i<50;i++) blot(R()*S, R()*S, 80+R()*170, '146,144,134', .16+R()*.16);
    for(let i=0;i<150;i++) blot(R()*S, R()*S, 8+R()*R()*50, '58,62,54', .10+R()*.22, .6+R()*.7);
    for(let i=0;i<170;i++){ const sp = 3+R()*R()*52; colony(R()*S, R()*S, sp, 16+sp*5|0, [18,22,20]); }
    for(let i=0;i<20000;i++){ x.fillStyle = `rgba(40,44,40,${.12+R()*.3})`; x.fillRect(R()*S, R()*S, 1, 1); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 8; return t;
}

function partOffset(def, u, full){

/* =============== camera =============== */
const A = {tx:0,ty:0,tz:0.11,az:-0.36,el:0.14,d:1.75}, AM = {tx:0,ty:0,tz:0.11,az:-0.3,el:0.12,d:2.6};
const tgt = new THREE.Vector3();
function mixCam(a,b,k){ const o={}; for(const key in a) o[key]=lerp(a[key],b[key],k); return o; }
function autoCamera(t){
  const A0 = MOBILE ? AM : A;
  let c = A0;
  const s = state.svc;
  if(state.sum){ c = {...A0, az:-0.2, d:A0.d*1.08}; }
  else if(s){
    const lt = state.lt;
    const ex = ease(clamp01((lt - TITLE + 0.3)/(s.exEnd - TITLE + 0.3)));
    const back = ease(clamp01((lt - s.reA)/REASM));
    c = mixCam(A0, MOBILE ? s.camM : s.cam, ex*(1-back));
    if(state.resW > 0){                                    // 🔎 결과 점검 카메라
      const rc = s.full ? (MOBILE ? {...s.camM, d:s.camM.d*0.97} : {...s.cam, d:s.cam.d*0.92})
                        : (MOBILE ? {tx:0,ty:0.16,tz:0.18,az:-0.18,el:0.24,d:3.0} : {tx:-0.02,ty:0.17,tz:0.18,az:0.30,el:0.26,d:2.45});
      c = mixCam(c, rc, state.resW);
    }
    if(state.temp && state.temp.a > 0){                    // 🌡️ 온도 측정 — 토출구 쪽으로 살짝 다가감(아래에 온도계·온도 카드 자리 확보)
      c = mixCam(c, {...A0, tx:-0.05, ty:MOBILE ? -0.02 : -0.085, tz:0.14, az:A0.az*0.8, d:A0.d*(MOBILE ? 0.84 : 0.9)}, state.temp.a); }
    if(state.cleanIdx>=0){
      const cl = s.clean[state.cleanIdx];
      const w = clamp01((lt-cl.a)/(cl.b-cl.a)), bump = Math.sin(w*Math.PI)*0.3;
      const bc = sprayState.box.getCenter(new THREE.Vector3());
      c = {...c, tx:lerp(c.tx,bc.x,bump), ty:lerp(c.ty,bc.y,bump), tz:lerp(c.tz,bc.z,bump), d:c.d*(1-bump*0.45)};
    }
    c.az += 0.035*Math.sin(t*0.35);
    if(REAL3 && !REDUCE && QS0.get('shake') !== '0'){     // 🎬 실사 3차 ⑧ 손으로 들고 찍은 듯한 아주 작은 흔들림 (동작 줄이기 설정이면 없음)
      c.az += 0.0032*Math.sin(t*1.7+1.3) + 0.0016*Math.sin(t*4.3);
      c.el += 0.0026*Math.sin(t*1.3+0.4) + 0.0013*Math.sin(t*3.7+2.0);

}

    $('rArc').setAttribute('stroke', R.pct>=100 ? '#0fa3a3' : R.pct>=85 ? '#22a383' : R.pct>=60 ? '#c9a24a' : '#e07a3f');
  }
  if(s.full && $('rfF')){ $('rfF').classList.toggle('on', state.face!==1); $('rfB').classList.toggle('on', state.face===1); }
  const k = ease(clamp01((ru-0.08)/0.4)), pct = Math.round(R.pct*k), C = 2*Math.PI*36;
  $('rP').textContent = pct+'%'; $('rArc').setAttribute('stroke-dasharray', `${C*pct/100} 999`);
  R.spots.forEach((sp,i)=>{
    const e = spotEls[i], when = s.full ? 'any' : sp[2];
    const [a,b] = when==='front' ? [0.16,0.40] : when==='back' ? [0.62,0.86] : [0.20,0.88];
    const vis = clamp01(Math.min((ru-a-i*0.02)/0.05, (b-ru)/0.05));
    ANCH[sp[0]].getWorldPosition(v); v.project(camera);
    const sx = (v.x*0.5+0.5)*innerWidth;
    e.style.left = sx+'px'; e.style.top = ((-v.y*0.5+0.5)*innerHeight)+'px';
    const lb = e.lastElementChild; lb.style.maxWidth = ''; lb.style.whiteSpace = '';
    e.classList.toggle('flip', sx + e.offsetWidth > innerWidth - 8 && sx - e.offsetWidth > 8);   // 화면 오른쪽 끝이면 글자를 왼쪽으로
    if(sx + e.offsetWidth > innerWidth - 8 && !e.classList.contains('flip')){   // 양쪽 다 모자라면 줄바꿈해서 화면 안에
      const room = Math.max(innerWidth - sx - 34, 90); lb.style.whiteSpace = 'normal'; lb.style.maxWidth = room+'px'; }
    const sy = (-v.y*0.5+0.5)*innerHeight, rTop = MOBILE ? rc.getBoundingClientRect().top - 14 : 1e9;   // 휴대폰: 결과 카드에 가려지는 핀은 숨김
    e.style.opacity = v.z<1 && sy < rTop ? vis : 0;
  });
}
// 🌡️ 온도 카드 — 온도계 옆(PC) / 온도계 아래 가운데(휴대폰), 아래 재생 막대를 가리지 않게
function updateTemp(){
  const el = $('tchip'), tp = state.temp;
  if(!tp || tp.a < 0.5){ el.style.opacity = 0; return; }
  if(!el.dataset.ok){ el.dataset.ok = '1';
    $('tmT').textContent = L('작동 확인 · 온도 측정 (예시)', 'Test run · temperature check (example)');
    $('tmInL').textContent = L('흡입', 'Intake'); $('tmOutL').textContent = L('토출', 'Outlet'); $('tmDL').textContent = L('온도차', 'Difference'); }
  $('tmIn').textContent = tp.tin.toFixed(1)+'°C'; $('tmOut').textContent = tp.tout.toFixed(1)+'°C';
  $('tmD').textContent = (tp.tin - tp.tout).toFixed(1)+'°C' + (tp.done ? ' ✓' : '');
  METER.anchor.getWorldPosition(v); v.project(camera);
  const sx = (v.x*0.5+0.5)*innerWidth, sy = (-v.y*0.5+0.5)*innerHeight, w = el.offsetWidth*UI, h = el.offsetHeight*UI;
  let x = MOBILE ? (innerWidth - w)/2 : sx + 52*UI, y = MOBILE ? sy + 40 : sy - h/2;
  x = Math.max(8, Math.min(x, innerWidth - w - 8));
  y = Math.max(8, Math.min(y, innerHeight - h - (MOBILE ? 174 : LAND ? 66 : 161*UI)));   // 재생 막대(휴대폰은 그 위 진행 설명글까지) 자리는 비움
  el.style.transform = `translate(${Math.round(x)}px,${Math.round(y)}px) scale(${UI})`; el.style.opacity = v.z < 1 ? 1 : 0;
}
const PH = {
  dis:['분해 중','Disassembling'], clean:['세척 중','Cleaning'], res:['남는 오염 확인','Checking leftover dirt'], reasm:['재조립','Reassembling'], run:['작동 확인 · 세척 완료','Test run · Done'],
};
const STAGE = { dis:{n:1,k:'분해',e:'Disassembly',ico:'🔧'}, clean:{n:2,k:'세척',e:'Cleaning',ico:'💧'}, res:{n:3,k:'결과 점검',e:'Result check',ico:'🔎'},
  reasm:{n:4,k:'재조립',e:'Reassembly',ico:'🔩'}, run:{n:5,k:'작동 확인',e:'Test run',ico:'✅'} };
const FXICO = {water:'💧', chem:'🧪', steam:'♨️', air:'🖌️'};
const FXNAME = {water:['고압물 세척','Pressure water rinse'], chem:['약품 분사','Chemical spray'], steam:['고압 스팀 살균','High-pressure steam'], air:['브러쉬 먼지 제거','Brush dusting']};
function updateUI(t){
  const s = state.svc;
  $('sum').classList.toggle('on', state.sum);
  $('panel').style.opacity = state.sum ? 0 : 1;
  $('hT').style.opacity = (MOBILE && s && state.phase !== 'title') ? 0 : 1;   // 휴대폰: 재생 중에는 화면 제목을 숨겨 3D 그림을 가리지 않게 (서비스 이름은 왼쪽 위에 계속 보임)
  SVC.forEach(x=>{
    x.tab.classList.toggle('on', x===s);
    x.tab.querySelector('.pg').style.width = (clamp01((t-x.t0)/x.len)*100)+'%';
  });
  if(!s){ $('tcard').style.opacity=0; $('phase').style.opacity=0; $('callout').style.opacity=0; updateResult(null); $('tchip').style.opacity = 0; return; }
  if(shownSvc !== s.i){ renderPanel(s); shownSvc = s.i; }
  const lt = state.lt;
  const tc = $('tcard');
  const tv = lt < TITLE-0.35 ? 1 : 0;
  tc.style.opacity = tv; tc.style.transform = `translate(-50%,-50%) scale(${tv?1:0.96})`;
  // chips
  document.querySelectorAll('#pChips .chip').forEach(ch=>ch.classList.toggle('cur', state.cur && P[ch.dataset.id]===state.cur));
  // checklist progress: spread over clean phase, last item on run
  const lis = [...document.querySelectorAll('#pList li')];
  lis.forEach((li,i)=>{
    const key = s.items[i][2]; let a, b;
    if(key==='dis'){ a = TITLE; b = s.exEnd; }
    else if(key==='res'){ a = s.rsA; b = s.rsA + RESL*0.55; }
    else if(key==='run'){ a = s.reA; b = s.reB + (REAL3 ? RUN*0.68 : 0.6); }
    else { const w = s.clean.filter(c=>c.fx===key); a = w.length? w[0].a : s.clA; b = w.length? w[w.length-1].b : s.clB; }
    li.classList.toggle('show', lt >= a - 0.05);
    li.classList.toggle('done', lt >= b - 0.05);
  });
  // phase caption
  const ph = $('phase');
  if(state.phase && state.phase!=='title'){
    const st = STAGE[state.phase] || STAGE.dis;
    let txt = PH[state.phase], ico = st.ico, cls = state.phase, cnt = '';
    if(state.phase==='clean' && state.cleanIdx>=0){ const c = s.clean[state.cleanIdx]; const f = FXNAME[c.fx];
      txt = [`${P[c.p].k} · ${f[0]}`, `${P[c.p].e} · ${f[1]}`]; ico = FXICO[c.fx] || ico; cls = c.fx;
      cnt = `${state.cleanIdx+1} / ${s.clean.length}`; }
    else if(state.phase==='res' && s.full){ txt = state.face===1 ? ['뒷면까지 완벽 제거 확인','Back side — spotless too'] : ['앞면 완벽 제거 확인','Front side — spotless']; }
    else if(state.phase==='dis' && state.cur){ txt = [`${state.cur.k} 분리`, `Removing ${state.cur.e}`];
      const k = s.slots.findIndex(sl=>P[sl.id]===state.cur); if(k>=0) cnt = `${k+1} / ${s.slots.length}`; }
    const tag = L(`${st.n}단계 · ${st.k}`, `STEP ${st.n} · ${st.e}`), main = L(txt[0], txt[1]);
    if(ph.dataset.k !== main){ ph.dataset.k = main;
      $('phI').textContent = ico; $('phI').className = 'pi '+cls;
      $('phTag').innerHTML = tag + (cnt ? `<em>${cnt}</em>` : ''); $('phTx').textContent = main;
      ph.classList.remove('pop'); void ph.offsetWidth; ph.classList.add('pop'); }
    ph.classList.toggle('inres', state.phase==='res');
    ph.style.opacity = 1;
  } else { ph.style.opacity = 0; ph.dataset.k = ''; }
  // callout on part being removed
  const co = $('callout');
  if(state.cur){
    $('coK').textContent = L(state.cur.k, state.cur.e); $('coE').textContent = '';
    const [x,y,ok] = screenOf(state.cur.part.outer, 0.03);
    co.style.left = x+'px'; co.style.top = y+'px'; co.style.opacity = ok?1:0;
  } else co.style.opacity = 0;
  updateResult(s);
  updateTemp();
  $('scrub').value = Math.round(t/T*1000);
  $('tlabel').textContent = Math.floor(t)+'s';
}

let time = 0, playing = true, speed = 1, auto = true;
$('play').onclick = ()=>{ playing=!playing; $('play').textContent = playing?'❚❚':'▶'; };
$('restart').onclick = $('again').onclick = ()=>{ time = 0; playing = true; $('play').textContent='❚❚'; };
// D. 결과만 보기 — 서비스별 결과 점검 장면 → 마지막 요약만 이어서 재생
const RES_WIN = ()=>SVC.map(s=>[s.t0 + s.rsA - 0.3, s.t0 + s.rsB + 0.2]);
function setResOnly(on){ resOnly = on; $('resOnly').classList.toggle('on', on);
  if(on){ const w = RES_WIN(); const cur = w.find(x=>time>=x[0] && time<x[1]); if(!cur){ const nx = w.find(x=>x[0] > time); time = nx ? nx[0] : w[0][0]; } playing = true; $('play').textContent='❚❚'; } }
function resOnlyStep(){
  if(!resOnly || time >= SUM_A) return;
  const w = RES_WIN(); if(w.some(x=>time>=x[0] && time<x[1])) return;
  const nx = w.find(x=>x[0] > time); time = nx ? nx[0] : SUM_A;
}
$('resOnly').onclick = ()=>setResOnly(!resOnly);
$('roL').textContent = L('🔎 결과만 보기','🔎 Results only'); $('roS').textContent = L('결과만','Results');
$('speed').onclick = ()=>{ speed = speed===1?2:speed===2?0.5:1; $('speed').textContent = speed+'×'; };
$('cam').onclick = ()=>{ auto = !auto; $('cam').classList.toggle('on',auto); };
controls.addEventListener('start', ()=>{ auto=false; $('cam').classList.remove('on'); });
$('scrub').addEventListener('input', e=>{ time = e.target.value/1000*T; });
addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); $('play').click(); } });

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(innerWidth, innerHeight);
  dof.uniforms.uPx.value.set(1/innerWidth, 1/innerHeight);
  lens.uniforms.uAsp.value = innerWidth/innerHeight;
  fxMats.forEach(m=>m.uniforms.uH.value = innerHeight*renderer.getPixelRatio());
  /* 🖥️📱 화면 맞춤 (2026-11-28) — 화면 종류를 정하고, 3D 그림은 「가려지지 않는 빈 자리」에 맞춰 크기·위치를 잡음(applyProj) */
  const W = innerWidth, H = innerHeight;
  MOBILE = W/H < 0.9 && W < 700;
  LAND = !MOBILE && H <= 540;
  NARROW = !MOBILE && !LAND && (W < 1180 || H < 680);
  UI = (MOBILE || LAND || NARROW) ? 1 : Math.max(1, Math.min(1.5, W/1440, H/800));
  const cl = document.body.classList;
  cl.toggle('mob', MOBILE); cl.toggle('land', LAND); cl.toggle('nar', NARROW); cl.toggle('short', MOBILE && H < 720);
  document.body.style.setProperty('--ui', UI.toFixed(3));
  applyProj();
}
// 3D 그림을 놓을 빈 자리(위 설명글 · 아래 재생 막대 · 오른쪽 패널 · 결과 카드를 뺀 곳)의 가운데에, 그 크기에 맞춰 그림.
// 기준 화면(PC 1366×768 · 휴대폰 390×844)에서는 예전과 같은 크기이고, 그보다 작거나 크면 비율대로 줄이거나 키움.
function applyProj(){
  const W = innerWidth, H = innerHeight; let z, dx, dy, kx0, ky0;
  if(MOBILE){
    kx0 = 730.9; ky0 = 860.8;
    z = Math.min(W/390, (H - 150)/630); dx = 0; dy = -75;
    const rw = state.resW || 0;
    if(rw > 0){                                             // 결과 카드가 올라오면 카드 위 공간에 부품이 다 보이게
      const top1 = 62, hs = H - 116 - $('rcard').offsetHeight - 10 - top1, need = (state.svc && state.svc.full) ? 630 : 400;
      z = lerp(z, Math.min(z, hs/need), rw); dy = lerp(dy, top1 + hs/2 - H/2, rw); }
  } else {
    kx0 = 1554.9; ky0 = 1339.2;
    const top0 = LAND ? 46 : (NARROW && W <= 860) ? 134 : 80*UI, bot = LAND ? 58 : 151*UI, side = (LAND || NARROW) ? 0 : 324*UI;
    z = Math.min((W - side)/(side ? 1042 : 1110), (H - top0 - bot)/537); dx = side ? -side*0.34 : W*0.02; dy = -(bot - top0)/2;   // 패널을 접은 화면은 왼쪽으로 뻗는 부품(외부케이스)까지 들어오게 조금 더 여유
    if((LAND || NARROW) && state.resW > 0){                 // 패널을 접은 화면: 왼쪽 결과 카드만큼 오른쪽으로 비켜서 (부품이 카드에 가리지 않게)
      dx += (LAND ? 118 : 135)*state.resW; if(NARROW) z = lerp(z, Math.min(z, (W - 300)/750), state.resW); }
  }
  z = Math.max(z, 0.2);
  const fullW = W + 2*Math.abs(dx), fullH = H + 2*Math.abs(dy), ky = ky0*z, kx = kx0*z;
  camera.fov = 2*Math.atan(fullH/(2*ky))*180/Math.PI; camera.aspect = (fullW/fullH)*(ky/kx);
  camera.setViewOffset(fullW, fullH, dx < 0 ? -2*dx : 0, dy < 0 ? -2*dy : 0, W, H);
}
addEventListener('resize', resize); resize();

let last = performance.now(), last0 = performance.now(), lastSvc = null;
function frame(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  if(playing){ time += dt*speed; if(time > T) time = 0; resOnlyStep(); }
  applyTime(time);
  if(auto) autoCamera(time); else controls.update();
  if(state.svc !== lastSvc){ clearFX(); lastSvc = state.svc; }
  if(playing){ emit(dt*speed); for(const f of Object.values(FX)) stepFX(f, dt*speed); }
  updateFocus(dt); draw(); adaptQuality(now - last0); last0 = now;
  updateUI(time);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__preview = (t)=>{
  playing=false; time=t;
  // simulate ~0.6s of particles leading up to t so stills show the spray
  clearFX();
  for(let k=0;k<70;k++){ applyTime(t-2.1+k*0.03); emit(0.03); for(const f of Object.values(FX)) stepFX(f,0.03); }
  applyTime(t); lastSvc = state.svc; if(auto) autoCamera(t); updateFocus(0); draw(); updateUI(t);
};
if(new URLSearchParams(location.search).has('fxhq')) window.__fx = {gtao, lens, dof, composer, renderer, wall, camera, controls, key, setQ:(q)=>{FXQ=q}, setAuto:(v)=>{auto=v}, redraw:()=>{ updateFocus(0); draw(); }};
window.__frame = (t)=>{ playing=false; time=t; clearFX(); applyTime(t); lastSvc = state.svc; if(auto) autoCamera(t); updateFocus(0); draw(); updateUI(t); };
window.__T = {T, SUM_A, svc: SVC.map(s=>({t0:s.t0, rsA:s.rsA, rsB:s.rsB, exEnd:s.exEnd, clA:s.clA, clB:s.clB, reB:s.reB, len:s.len, clean:s.clean.map(c=>({p:c.p,fx:c.fx,a:c.a,b:c.b}))}))};
</script>
