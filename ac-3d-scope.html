<style>
  :root{--navy:#12284a;--teal:#0fa3a3;--gold:#c9a24a;--ink:#1d2733;--mute:#6b7785}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:"Noto Sans KR",system-ui,sans-serif;color:var(--ink)}
  body{background:radial-gradient(120% 90% at 40% 30%,#f4f6f8 0%,#e3e7eb 55%,#c9d0d7 100%)}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%}
  .hud{position:fixed;left:18px;top:16px;pointer-events:none}
  .rec{display:inline-flex;align-items:center;gap:8px;background:rgba(18,40,74,.92);color:#fff;
       font-size:12px;letter-spacing:.08em;padding:6px 10px;border-radius:6px}
  .rec i{width:8px;height:8px;border-radius:50%;background:#e5484d;animation:blink 1s steps(2) infinite}
  @keyframes blink{50%{opacity:.15}}
  .htitle{margin-top:10px}
  .hbtn{display:flex;gap:6px;align-items:center;margin-bottom:8px;pointer-events:auto}
  .pill{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;background:#fff;color:var(--navy);font-size:12px;font-weight:700;text-decoration:none;box-shadow:0 2px 8px rgba(18,40,74,.15)}
  .lng{display:inline-flex;background:rgba(18,40,74,.9);border-radius:999px;padding:2px}
  .lng button{border:0;background:none;color:rgba(255,255,255,.7);font:700 11px "Noto Sans KR";padding:5px 10px;border-radius:999px;cursor:pointer}
  .lng button.on{background:var(--gold);color:var(--navy)}
  .sum .sf{display:none} body.mob .sum .lf{display:none} body.mob .sum .sf{display:inline}
  .tcard .e:empty,.panel .ph .e:empty,.callout .e:empty{display:none}
  .htitle b{display:block;font-size:18px;color:var(--navy)}
  .htitle span{font-size:12px;color:var(--mute)}

  /* service panel */
  .panel{position:fixed;right:16px;top:16px;width:300px;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);
         border-radius:12px;box-shadow:0 8px 26px rgba(18,40,74,.15);overflow:hidden;transition:opacity .3s}
  .panel .ph{background:var(--navy);color:#fff;padding:11px 14px}
  .panel .ph .no{font:700 11px ui-monospace,monospace;color:var(--gold);letter-spacing:.1em}
  .panel .ph .k{font-size:18px;font-weight:700;margin-top:2px}
  .panel .ph .e{font-size:12px;opacity:.75}
  .panel .sec{padding:10px 14px 4px}
  .panel .lb{font-size:11px;color:var(--mute);margin-bottom:6px}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chip{font-size:11px;padding:3px 7px;border-radius:10px;background:#eef1f4;color:#a2abb5}
  .chip.in{background:var(--teal);color:#fff}
  .chip.in.cur{background:var(--gold);color:var(--navy);font-weight:700}
  .list{list-style:none;margin:0;padding:4px 14px 12px}
  .list li{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.35;padding:5px 0;
           border-bottom:1px dashed #e3e7eb;opacity:.28;transition:opacity .3s}
  .list li:last-child{border-bottom:0}
  .list li.show{opacity:1}
  .list li .ck{flex:0 0 18px;height:18px;border-radius:50%;border:1.5px solid #c5ccd3;display:grid;place-items:center;
               font-size:11px;color:#fff;margin-top:1px;transition:background .25s,border-color .25s}
  .list li.done .ck{background:var(--teal);border-color:var(--teal)}
  .list li small{display:block;color:var(--mute);font-size:11px}
  .note{margin:0 14px 12px;padding:7px 9px;border-radius:7px;background:#fbf6e9;color:#7a6326;font-size:11.5px;line-height:1.4}
  /* 투명 패널 — 뒤의 3D 부품이 비쳐 보이고, 글자는 흰 테두리 빛으로 또렷하게 (2026-11-22) */
  .panel{background:rgba(255,255,255,.26);-webkit-backdrop-filter:blur(1.5px);backdrop-filter:blur(1.5px);border:1px solid rgba(255,255,255,.65);box-shadow:0 8px 26px rgba(18,40,74,.10)}
  .panel .ph{background:rgba(18,40,74,.80)}
  .panel .sec,.panel .list{text-shadow:0 0 2px #fff,0 0 5px #fff,0 0 9px rgba(255,255,255,.95)}
  .panel .lb{color:#3d4856;font-weight:600}
  .list li{color:#0f1c2b;font-weight:600;border-bottom-color:rgba(18,40,74,.18);opacity:.5}
  .list li.show{opacity:1}
  .list li .ck{background:rgba(255,255,255,.7)}
  .chip{background:rgba(255,255,255,.72);color:#6b7785;text-shadow:none}
  .note{background:rgba(251,246,233,.85)}

  /* title card */
  .tcard{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;
         background:rgba(18,40,74,.94);color:#fff;border-radius:16px;padding:22px 34px;min-width:340px;
         box-shadow:0 18px 50px rgba(18,40,74,.35);transition:opacity .35s, transform .35s;opacity:0}
  .tcard .no{font:700 12px ui-monospace,monospace;color:var(--gold);letter-spacing:.18em}
  .tcard .k{font-size:30px;font-weight:700;margin:6px 0 2px}
  .tcard .e{font-size:14px;opacity:.75}
  .tcard .sc{margin-top:12px;font-size:13px;color:#bfe9e9}
  .tcard .sc b{color:var(--gold)}

  /* phase caption */
  .phase{position:fixed;left:50%;top:84px;transform:translateX(-50%);pointer-events:none;background:#fff;
         border-left:3px solid var(--teal);border-radius:7px;padding:6px 12px;font-size:13px;color:var(--navy);
         box-shadow:0 6px 18px rgba(18,40,74,.14);transition:opacity .25s;white-space:nowrap}
  .phase small{color:var(--mute);margin-left:6px}

  .callout{position:fixed;left:0;top:0;pointer-events:none;transform:translate(-50%,-100%);transition:opacity .25s;white-space:nowrap}
  .callout .box{background:#fff;border-left:3px solid var(--gold);border-radius:6px;padding:6px 10px;box-shadow:0 6px 18px rgba(18,40,74,.18)}
  .callout .k{font-weight:700;font-size:14px;color:var(--navy)}
  .callout .e{font-size:11px;color:var(--mute)}
  .callout .stem{width:1.5px;height:22px;background:var(--gold);margin:0 auto}

  /* summary */
  .sum{position:fixed;inset:0;display:grid;place-items:center;padding:10px 12px 130px;background:rgba(233,237,241,.72);backdrop-filter:blur(3px);
       opacity:0;pointer-events:none;transition:opacity .45s}
  .sum.on{opacity:1;pointer-events:auto}
  .sum .card{max-height:100%;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 18px 50px rgba(18,40,74,.25);width:min(860px,calc(100% - 24px));overflow:hidden}
  .sum .hd{background:var(--navy);color:#fff;padding:14px 18px}
  .sum .hd b{font-size:19px}
  .sum .hd span{display:block;font-size:12px;opacity:.75}
  .sum table{width:100%;border-collapse:collapse;font-size:13px}
  .sum th,.sum td{padding:8px 6px;text-align:center;border-bottom:1px solid #edf0f3}
  .sum th{font-size:12px;color:var(--navy);background:#f5f7f9;line-height:1.25}
  .sum th small,.sum td small{display:block;font-weight:400;color:var(--mute);font-size:10.5px}
  .sum td:first-child,.sum th:first-child{text-align:left;padding-left:16px}
  .sum .f{color:var(--teal);font-size:17px}
  .sum .p{color:var(--gold);font-size:17px}
  .sum .x{color:#c3cad1}
  .sum .d{color:var(--navy);font-size:15px}
  .sum tr.sep td{background:#f5f7f9;color:var(--navy);font-weight:700;font-size:12px;padding:6px 16px}
  .sum th,.sum td{padding:4px 6px}
  .sum td small{display:inline;margin-left:6px}
  .sum td:not(:first-child) small{display:block;margin:0}
  .sum .lg{display:flex;gap:16px;flex-wrap:wrap;padding:10px 16px;font-size:12px;color:var(--mute)}
  .sum .ft{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 16px 14px;font-size:11.5px;color:var(--mute)}
  .sum button{border:0;background:var(--teal);color:#fff;border-radius:8px;height:34px;padding:0 14px;font:500 13px "Noto Sans KR";cursor:pointer;white-space:nowrap}

  .bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);width:min(980px,calc(100% - 24px));
       background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-radius:12px;box-shadow:0 8px 26px rgba(18,40,74,.15);padding:10px 12px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
  .tab{border-radius:8px;padding:6px 8px;background:#eef1f4;cursor:pointer;border:1px solid transparent;position:relative;overflow:hidden}
  .tab .n{font:700 10px ui-monospace,monospace;color:var(--mute)}
  .tab .k{font-size:13px;font-weight:700;color:var(--navy);line-height:1.2}
  .tab .e{font-size:10px;color:var(--mute)}
  .tab .ks{display:none}
  .smx{display:none}
  .tab .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--teal);width:0}
  .tab.on{background:#fff;border-color:var(--gold)}
  .tab.on .n{color:var(--gold)}
  .ctl{display:flex;align-items:center;gap:8px}
  .ctl button{border:0;background:var(--navy);color:#fff;border-radius:7px;height:30px;min-width:34px;padding:0 10px;font:500 12px "Noto Sans KR";cursor:pointer}
  .ctl button.alt{background:#e7ebef;color:var(--navy)}
  .ctl button.alt.on{background:var(--teal);color:#fff}
  .ctl input[type=range]{flex:1;accent-color:var(--teal)}
  .ctl .t{font:12px ui-monospace,monospace;color:var(--mute);width:58px;text-align:right}
  @media (min-width:1700px) and (min-height:900px){ .panel,.bar,.hud,.phase,.tcard,.sum .card,.callout{zoom:1.18} .bar{bottom:20px} }
  /* ---------- phone ---------- */
  body.mob .hud{left:12px;top:10px}
  body.mob .rec{font-size:10px;padding:4px 8px}
  body.mob .htitle{margin-top:6px}
  body.mob .htitle b{font-size:15px}
  body.mob .htitle span{display:none}
  body.mob .phase{top:auto;bottom:178px;font-size:12px;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;padding:5px 10px}
  body.mob .phase small{display:none}
  body.mob .panel{left:10px;right:auto;top:10px;width:auto;max-width:52%;border-radius:10px}
  body.mob .panel .ph{padding:6px 10px}
  body.mob .panel .ph .no{font-size:9.5px}
  body.mob .panel .ph .k{font-size:14px}
  body.mob .panel .ph .e{font-size:10px}
  body.mob .panel .list,body.mob .panel .note,body.mob .panel .sec{display:none}
  body.mob .hud{left:auto;right:12px;text-align:right}
  body.mob .hbtn{justify-content:flex-end}
  body.mob .htitle b{font-size:13px}
  body.mob .bar{bottom:10px;padding:8px;width:calc(100% - 16px)}
  body.mob .tabs{grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:6px}
  body.mob .tab{padding:6px 2px;text-align:center}
  body.mob .tab .n,body.mob .tab .k,body.mob .tab .e{display:none}
  body.mob .tab .ks{display:block;font-size:11.5px;font-weight:700;color:var(--navy);white-space:nowrap}
  body.mob .tab.on .ks{color:#8a6a1c}
  body.mob .ctl{gap:6px}
  body.mob .ctl .t{display:none}
  body.mob .ctl button{padding:0 8px;min-width:32px}
  body.mob .lgx{display:none} body.mob .smx{display:inline}
  body.mob .tcard{min-width:0;width:calc(100% - 40px);padding:16px;top:40%}
  body.mob .tcard .k{font-size:24px}
  body.mob .tcard .sc{font-size:12px}
  body.mob .callout .box{padding:4px 8px}
  body.mob .callout .k{font-size:12.5px}
  body.mob .sum{padding:8px 8px 116px}
  body.mob .sum .hd{padding:10px 12px}
  body.mob .sum .hd b{font-size:15px}
  body.mob .sum table{font-size:11px;table-layout:fixed}
  body.mob .sum th,body.mob .sum td{padding:4px 2px}
  body.mob .sum th{font-size:10px}
  body.mob .sum th small,body.mob .sum td small{display:none}
  body.mob .sum td:first-child,body.mob .sum th:first-child{padding-left:8px;width:30%}
  body.mob .sum .f,body.mob .sum .p{font-size:14px}
  body.mob .sum .lg{gap:6px 12px;padding:8px 10px;font-size:10.5px}
  body.mob .sum .ft{flex-direction:column;align-items:stretch;padding:0 10px 10px;font-size:10.5px}
  body.mob .sum button{height:36px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <div class="hbtn"><a id="back" class="pill" hidden></a><span class="lng"><button type="button" data-l="ko">한국어</button><button type="button" data-l="en">EN</button></span></div>
  <div class="rec"><i></i>TIMELAPSE</div>
  <div class="htitle"><b id="hT"></b></div>
</div>

<div class="panel" id="panel">
  <div class="ph"><div class="no" id="pNo"></div><div class="k" id="pK"></div><div class="e" id="pE"></div></div>
  <div class="sec"><div class="lb" id="pLb"></div><div class="chips" id="pChips"></div></div>
  <ul class="list" id="pList"></ul>
  <div class="note" id="pNote"></div>
</div>

<div class="tcard" id="tcard"><div class="no" id="tNo"></div><div class="k" id="tK"></div><div class="e" id="tE"></div><div class="sc" id="tSc"></div></div>
<div class="phase" id="phase" style="opacity:0"></div>
<div class="callout" id="callout" style="opacity:0"><div class="box"><div class="k" id="coK"></div><div class="e" id="coE"></div></div><div class="stem"></div></div>

<div class="sum" id="sum">
  <div class="card">
    <div class="hd"><b id="sT"></b><span id="sS"></span></div>
    <table id="sumTable"></table>
    <div class="lg" id="sLg"></div>
    <div class="ft"><span id="sF"></span><button id="again"></button></div>
  </div>
</div>

<div class="bar">
  <div class="tabs" id="tabs"></div>
  <div class="ctl">
    <button id="play">❚❚</button>
    <button id="restart" class="alt">↺</button>
    <input id="scrub" type="range" min="0" max="1000" value="0">
    <span class="t" id="tlabel">0s</span>
    <button id="speed" class="alt">1×</button>
    <button id="cam" class="alt on"><span class="lgx" id="camL"></span><span class="smx" id="camS"></span></button>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------- renderer / scene ---------------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.01, 50);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.minDistance = 0.6; controls.maxDistance = 6;

const key = new THREE.DirectionalLight(0xfff6ea, 2.6);
key.position.set(-1.4, 2.2, 2.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -1.6; key.shadow.camera.right = 1.6;
key.shadow.camera.top = 1.6; key.shadow.camera.bottom = -1.6;
key.shadow.camera.near = 0.5; key.shadow.camera.far = 8;
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.01;
key.shadow.radius = 6;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8c2cc, 0.35));

// invisible wall: only the shadow shows
const wall = new THREE.Mesh(new THREE.PlaneGeometry(8, 6), new THREE.ShadowMaterial({opacity:0.16}));
wall.position.z = 0; wall.receiveShadow = true;
scene.add(wall);

/* ---------------- procedural textures (실사 질감) ---------------- */
function cvTex(w, h, draw, {srgb=false, rep=[1,1]}={}){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); t.anisotropy = 4;
  return t;
}
// fine speckle for moulded ABS plastic (bump + roughness)
function speckle(x, w, h, base, amp, n){
  x.fillStyle = `rgb(${base},${base},${base})`; x.fillRect(0,0,w,h);
  for(let i=0;i<n;i++){ const v = base + (Math.random()-0.5)*amp; x.fillStyle = `rgba(${v|0},${v|0},${v|0},.8)`; x.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*1.5, 1+Math.random()*1.5); }
}
const TX = {
  abs:   cvTex(256,256,(x,w,h)=>speckle(x,w,h,128,70,9000), {rep:[24,24]}),
  absR:  cvTex(256,256,(x,w,h)=>speckle(x,w,h,150,60,7000), {rep:[24,24]}),
  foam:  cvTex(256,256,(x,w,h)=>{ x.fillStyle='#bbb'; x.fillRect(0,0,w,h);
           for(let i=0;i<900;i++){ const r=3+Math.random()*6, g=150+Math.random()*90|0; x.fillStyle=`rgb(${g},${g},${g})`; x.beginPath(); x.arc(Math.random()*w,Math.random()*h,r,0,7); x.fill(); } }, {rep:[30,3]}),
  mesh:  cvTex(64,64,(x,w,h)=>{ x.fillStyle='#000'; x.fillRect(0,0,w,h); x.fillStyle='#fff'; for(let i=0;i<w;i+=8){ x.fillRect(i,0,2,h); x.fillRect(0,i,w,2);} }, {rep:[90,30]}),
  plate: cvTex(512,144,(x,w,h)=>{ x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.fillStyle='#000';
           for(let i=0;i<14;i++) for(let j=0;j<3;j++){ x.beginPath(); x.ellipse(24+i*35, 34+j*38, 9, 4, 0, 0, 7); x.fill(); }
           [[60,118],[256,118],[452,118]].forEach(([cx,cy])=>{ x.beginPath(); x.arc(cx,cy,11,0,7); x.fill(); }); }),
  fin:   cvTex(16,128,(x,w,h)=>{ for(let y=0;y<h;y++){ const v = 128+60*Math.sin(y/h*Math.PI*16); x.fillStyle=`rgb(${v|0},${v|0},${v|0})`; x.fillRect(0,y,w,1);} }, {rep:[1,1]}),
};
function label(w, h, draw){ return cvTex(w, h, draw, {srgb:true}); }
const PCB_TX = label(512, 468, (x,w,h)=>{
  x.fillStyle='#1c6a43'; x.fillRect(0,0,w,h);

const V2 = (x,y)=>new THREE.Vector2(x,y);
// extrude a profile drawn in (z,y) along the X axis, centred on x=0
function extrudeX(shape, L, bevel=0, curveSegments=24){
  const g = new THREE.ExtrudeGeometry(shape, {depth:L, bevelEnabled:bevel>0, bevelThickness:bevel, bevelSize:bevel*0.8, bevelSegments:4, curveSegments});
  g.rotateY(-Math.PI/2); g.translate(L/2,0,0);
  g.computeVertexNormals();
  return g;
}
function dedupe(pts){ return pts.filter((p,i)=> i===0 || p.distanceTo(pts[i-1])>1e-6); }
// band (strip of thickness t) along polyline, offset to the left-normal side when sign=+1
function bandShape(pts, t, sign=1){
  pts = dedupe(pts);
  const inner = pts.map((p,i)=>{
    const a = pts[Math.max(i-1,0)], b = pts[Math.min(i+1,pts.length-1)];
    let n;
    if(i>0 && i<pts.length-1){
      const t1 = p.clone().sub(a).normalize(), t2 = b.clone().sub(p).normalize();
      const n1 = V2(-t1.y,t1.x), n2 = V2(-t2.y,t2.x);
      n = n1.clone().add(n2).normalize();
      const d = Math.max(n.dot(n1), 0.35);
      n.multiplyScalar(1/d);
    } else {
      const tg = b.clone().sub(a).normalize(); n = V2(-tg.y,tg.x);
    }
    return p.clone().add(n.multiplyScalar(t*sign));
  });
  const s = new THREE.Shape(pts);
  inner.reverse().forEach(p=>s.lineTo(p.x,p.y));
  s.closePath();
  return s;
}
function mesh(geo, mat, parent){
  const m = new THREE.Mesh(geo, mat); m.castShadow = true; m.receiveShadow = true;
  parent && parent.add(m); return m;
}
function box(w,h,d,mat,parent,x=0,y=0,z=0){ const m = mesh(new THREE.BoxGeometry(w,h,d),mat,parent); m.position.set(x,y,z); return m; }
function cylX(r,len,mat,parent,x,y,z,seg=32){ const g=new THREE.CylinderGeometry(r,r,len,seg); g.rotateZ(Math.PI/2); const m=mesh(g,mat,parent); m.position.set(x,y,z); return m; }
function tube(points, r, mat, parent){ const c = new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p))); return mesh(new THREE.TubeGeometry(c, 40, r, 8, false), mat, parent); }
// part = pivot group at its centre; geometry is added in assembled world coords to .inner
const unitGroup = new THREE.Group(); scene.add(unitGroup);   // whole indoor unit (moves off the plate first)
const unit = {outer:unitGroup, home:new THREE.Vector3(0,0,0)};
function makePart(cx,cy,cz){
  const outer = new THREE.Group(); outer.position.set(cx,cy,cz);
  const inner = new THREE.Group(); inner.position.set(-cx,-cy,-cz);
  outer.add(inner); unitGroup.add(outer);
  return {outer, inner, home:new THREE.Vector3(cx,cy,cz)};
}

const evap = makePart(-0.06, 0.03, 0.13);
{
  const path = [V2(0.186,-0.074), V2(0.206,0.054), V2(0.126,0.128), V2(0.036,0.086)];
  const finShape = bandShape(path, 0.024, 1);
  const finGeo = new THREE.ExtrudeGeometry(finShape,{depth:0.00035,bevelEnabled:false});
  finGeo.rotateY(-Math.PI/2);
  const X0 = -0.400, X1 = 0.282, pitch = 0.0034;
  const n = Math.floor((X1-X0)/pitch);
  const fins = new THREE.InstancedMesh(finGeo, M.fin, n);
  const mtx = new THREE.Matrix4();
  for(let i=0;i<n;i++){ mtx.makeTranslation(X0+i*pitch,0,0); fins.setMatrixAt(i,mtx); }
  fins.castShadow = fins.receiveShadow = true;
  evap.inner.add(fins);
  // tube sheets
  const sheetGeo = new THREE.ExtrudeGeometry(finShape,{depth:0.003,bevelEnabled:false}); sheetGeo.rotateY(-Math.PI/2);
  for(const x of [X0-0.002, X1+0.004]){ const m = mesh(sheetGeo,M.galv,evap.inner); m.position.x = x; }
  // copper hairpins
  const tubes = [];
  for(let s=0;s<3;s++){
    const a = path[s], b = path[s+1];
    const tg = b.clone().sub(a).normalize(), nn = V2(-tg.y,tg.x);
    const len = a.distanceTo(b), cnt = Math.max(3, Math.round(len/0.026));
    for(let k=0;k<cnt;k++){
      const p = a.clone().add(tg.clone().multiplyScalar(len*(k+0.5)/cnt));
      for(const off of [0.0065,0.0175]) tubes.push(p.clone().add(nn.clone().multiplyScalar(off)));
    }
  }
  const tl = X1-X0+0.02, tx = (X0+X1)/2;
  tubes.forEach(p=>cylX(0.0036,tl,M.copper,evap.inner,tx,p.y,p.x,12));
  function bend(p1,p2,xEnd,dir){
    const mid = p1.clone().add(p2).multiplyScalar(0.5);
    const R = p1.distanceTo(p2)/2;
    const g = new THREE.TorusGeometry(R,0.0036,8,16,Math.PI);
    const d = new THREE.Vector3(0,p2.y-p1.y,p2.x-p1.x).normalize();
    const out = new THREE.Vector3(dir,0,0);
    const zAx = new THREE.Vector3().crossVectors(d,out);
    const m = mesh(g,M.copper,evap.inner);
    m.matrixAutoUpdate = false;
    m.matrix.makeBasis(d,out,zAx).setPosition(xEnd,mid.y,mid.x);
  }
  for(let i=0;i+1<tubes.length;i+=2) bend(tubes[i],tubes[i+1],X0-0.012,-1);
  for(let i=1;i+1<tubes.length;i+=2) bend(tubes[i],tubes[i+1],X1+0.012,1);
  // refrigerant headers out of the right end
  tube([[X1+0.02,0.10,0.13],[X1+0.05,0.10,0.10],[X1+0.06,0.06,0.05],[X1+0.06,-0.10,0.035]],0.0045,M.copper,evap.inner);
  tube([[X1+0.02,-0.03,0.19],[X1+0.075,-0.03,0.15],[X1+0.08,-0.06,0.06],[X1+0.08,-0.10,0.04]],0.003,M.copper,evap.inner);
  for(const [x,z] of [[X1+0.06,0.035],[X1+0.08,0.04]]){ const g=new THREE.CylinderGeometry(0.008,0.008,0.016,6); const m=mesh(g,M.brass,evap.inner); m.position.set(x,-0.11,z); }
  // black foam insulation on the pipes leaving the coil
  tube([[X1+0.06,0.04,0.045],[X1+0.06,-0.02,0.038],[X1+0.06,-0.095,0.035]],0.0085,M.armaf,evap.inner);
  tube([[X1+0.08,-0.065,0.055],[X1+0.08,-0.095,0.04]],0.0068,M.armaf,evap.inner);
  // pipe temperature sensor (clip + lead)
  cylX(0.0045,0.012,M.copper,evap.inner,X1+0.03,0.10,0.122);
  tube([[X1+0.036,0.10,0.122],[X1+0.05,0.11,0.118],[X1+0.07,0.115,0.10]],0.0012,M.black,evap.inner);
  // capillary/distributor tubes
  for(let i=0;i<3;i++) tube([[X1+0.016,0.0+i*0.03,0.18-i*0.02],[X1+0.04,0.02+i*0.02,0.15],[X1+0.075,-0.03,0.15]],0.0016,M.copper,evap.inner);
}

function grimeTex(kind, rep){

  x.fillStyle = '#fff'; x.fillRect(0,0,512,512);
  const blot = (cx, cy, r, col, a)=>{ const g = x.createRadialGradient(cx,cy,0,cx,cy,r); g.addColorStop(0,`rgba(${col},${a})`); g.addColorStop(.55,`rgba(${col},${a*.75})`); g.addColorStop(1,`rgba(${col},0)`); x.fillStyle = g; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill(); };
  const R = Math.random;
  if(kind === 'mold'){                     // 검은 곰팡이 군락 (블로워 · 송풍통로 · 루버)
    for(let i=0;i<72;i++){ const cx=R()*512, cy=R()*512, n=10+R()*26|0;
      for(let k=0;k<n;k++) blot(cx+(R()-.5)*70, cy+(R()-.5)*70, 4+R()*16, R()<.7?'22,28,24':'46,58,40', .55+R()*.4); }
    for(let i=0;i<4200;i++){ x.fillStyle=`rgba(25,30,26,${.3+R()*.6})`; x.fillRect(R()*512,R()*512,1+R()*2.5,1+R()*2.5); }
    for(let i=0;i<14;i++) blot(R()*512,R()*512,40+R()*60,'110,100,80',.25);
  } else if(kind === 'slime'){             // 물때 · 갈색 슬라임 + 곰팡이 점 (드레인판)
    for(let i=0;i<32;i++) blot(R()*512,R()*512,40+R()*80,'140,105,52',.55+R()*.3);
    for(let i=0;i<48;i++){ const cx=R()*512, cy=R()*512; for(let k=0;k<12;k++) blot(cx+(R()-.5)*55, cy+(R()-.5)*55, 3+R()*11,'28,32,24',.65+R()*.3); }
    x.strokeStyle='rgba(120,90,45,.35)'; x.lineWidth=6; for(let i=0;i<10;i++){ x.beginPath(); const y=R()*512; x.moveTo(0,y); x.bezierCurveTo(170,y+R()*40-20,340,y+R()*40-20,512,y); x.stroke(); }
  } else if(kind === 'dust'){              // 먼지 · 찌든 때 + 곰팡이 점 (에바포레이터)
    for(let i=0;i<50;i++) blot(R()*512,R()*512,30+R()*70,'105,94,72',.55+R()*.3);
    for(let i=0;i<5000;i++){ const v=90+R()*60|0; x.fillStyle=`rgba(${v},${v-8},${v-20},${.3+R()*.5})`; x.fillRect(R()*512,R()*512,1,2+R()*4); }
    for(let i=0;i<34;i++){ const cx=R()*512, cy=R()*512; for(let k=0;k<10;k++) blot(cx+(R()-.5)*45, cy+(R()-.5)*45, 3+R()*10,'30,36,28',.7); }
  } else {                                 // 케이스 — 누런 때 · 흐린 먼지 (가볍게)
    for(let i=0;i<40;i++) blot(R()*512,R()*512,50+R()*90,'195,175,130',.45+R()*.25);
    for(let i=0;i<1800;i++){ x.fillStyle=`rgba(150,140,120,${.15+R()*.3})`; x.fillRect(R()*512,R()*512,1.5,1.5); }
    for(let i=0;i<16;i++){ const cx=R()*512, cy=R()*512; for(let k=0;k<8;k++) blot(cx+(R()-.5)*34, cy+(R()-.5)*34, 2+R()*7,'46,52,42',.6); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); t.anisotropy = 4;
  return t;
}

function stepFX(f, dt){
  let j = 0; const dr = Math.exp(-f.drag*dt);

    for(let k=0;k<3;k++){ const vv = f.vel[i*3+k]*(f.drag?dr:1); f.vel[j*3+k] = vv; f.pos[j*3+k] = f.pos[i*3+k] + vv*dt; }
    f.vel[j*3+1] += (f.rise + f.grav)*dt;
    f.age[j]=f.age[i]; f.life[j]=f.life[i]; f.tag[j]=f.tag[i]; f.aS[j]=f.aS[i]; f.aT[j]=Math.min(f.age[j]/f.life[j],1); j++;
  }
  f.n = j; const g = f.pts.geometry; g.setDrawRange(0,j);
  g.attributes.position.needsUpdate = g.attributes.aT.needsUpdate = g.attributes.aS.needsUpdate = true;
}

  const d2 = MOBILE ? ((full ? D2M_FULL : D2M_WALL)[id] || def.d2) : def.d2;
  const r = MOBILE ? ROTM[id] : def.r;
  const off = new THREE.Vector3(...def.d1).multiplyScalar(a).lerp(new THREE.Vector3(...d2), b);
  return {off, rot:r.map(x=>x*b)};
}
function chapterAt(t){
  for(const s of SVC) if(t >= s.t0 && t < s.t0 + s.len) return s;
  return null;
}
const state = {svc:null, lt:0, phase:'', cur:null, cleanIdx:-1, sum:false};

function applyTime(t){
  const s = chapterAt(t);
  state.svc = s; state.sum = t >= SUM_A;
  // reset all parts home
  Object.values(P).forEach(d=>{ d.part.outer.position.copy(d.part.home); d.part.outer.rotation.set(0,0,0); });
  Object.keys(DIRT).forEach(id=>{ setDirt(id, state.sum?0.0:1); setGlow(id, 0); }); state.sparkle = [];
  sprayState.on = false; gun.visible = false; brush.visible = false; state.cur = null; state.cleanIdx = -1;
  let flap = 0.75, led = 1;
  if(state.sum){ flap = 0.75; led = 1;
    Object.keys(DIRT).forEach(id=>setDirt(id,0));
    state.phase = 'sum'; return; }
  if(!s){ state.phase=''; return; }
  const lt = t - s.t0; state.lt = lt;

  // power: off during title, on during run
  const off = clamp01((lt-0.3)/1.0), on = clamp01((lt-s.reB)/0.9);
  flap = 0.75*(1-ease(off)) + 0.75*ease(on);
  led = (1-clamp01((lt-0.8)/0.3)) + clamp01((lt-s.reB)/0.3);
  flapPivot.rotation.x = flap; ledMat.emissiveIntensity = 1.2*clamp01(led);

  // reassembly factor
  const isFull = !!s.full;
  const reU = clamp01((lt - s.reA)/REASM);
  const reParts = ease(clamp01(isFull ? reU/0.62 : reU));
  const reUnit  = ease(clamp01(isFull ? (reU-0.55)/0.45 : 0));

  s.slots.forEach(sl=>{
    const def = P[sl.id];
    const u = clamp01((lt - sl.a)/sl.len);
    if(u>0 && u<1 && lt < s.exEnd) state.cur = def;
    const {off, rot} = partOffset(def, u, !!s.full);
    const k = 1 - (sl.id==='unit' ? reUnit : reParts);
    def.part.outer.position.copy(def.part.home).addScaledVector(off, k);
    def.part.outer.rotation.set(rot[0]*k, rot[1]*k, rot[2]*k);
  });

  // dirt
  const dirt = {front:1,drain:1,blower:1,evap:1,back:1};
  s.clean.forEach((c,j)=>{
    const pr = clamp01((lt - c.a)/(c.b - c.a));
    if(dirt[c.p]!==undefined) dirt[c.p] = Math.min(dirt[c.p], 1 - c.lvl*ease(pr));
    if(lt >= c.a && lt < c.b){ state.cleanIdx = j; }
  });
  Object.entries(dirt).forEach(([id,v])=>setDirt(id,v));

  // ✨ glow + sparkle once a part's cleaning is finished
  const done = {};
  s.clean.forEach(c=>{ const o = done[c.p] || (done[c.p] = {end:0, lvl:0}); o.end = Math.max(o.end, c.b); o.lvl = Math.max(o.lvl, c.lvl); });
  Object.entries(done).forEach(([id,o])=>{
    if(o.lvl < 0.8 || lt < o.end) return;
    const since = lt - o.end, fade = 1 - ease(reU);
    setGlow(id, (0.10 + 0.42*Math.exp(-since*2.4)) * fade);
    if(since < 1.5 && fade > 0.5) state.sparkle.push(id);
  });

  // phase name
  state.phase = lt < TITLE ? 'title' : lt < s.exEnd ? 'dis' : lt < s.clB ? 'clean' : lt < s.reB ? 'reasm' : 'run';

  // spray gun
  if(state.cleanIdx>=0){
    const c = s.clean[state.cleanIdx];
    scene.updateMatrixWorld(true);
    tmpB.setFromObject(P[c.p].part.outer);
    const w = clamp01((lt - c.a)/(c.b - c.a));
    const sweep = 0.5 - 0.5*Math.cos(w*Math.PI*2);          // there and back
    const x = lerp(tmpB.min.x+0.06, tmpB.max.x-0.06, sweep);
    const cy = (tmpB.min.y+tmpB.max.y)/2;
    sprayState.box.copy(tmpB);
    sprayState.aim.set(x, cy, tmpB.max.z);
    sprayState.nozzle.set(x+0.03, cy+0.10, tmpB.max.z+0.20);
    sprayState.fx = c.fx; sprayState.part = c.p; sprayState.w = w;
    sprayState.on = w>0.04 && w<0.96;
    if(c.fx==='air'){
      const cx=(tmpB.min.x+tmpB.max.x)/2, hw=(tmpB.max.x-tmpB.min.x)*0.32, hh=(tmpB.max.y-tmpB.min.y)*0.3;
      sprayState.tip.set(cx + Math.sin(lt*21)*hw*0.35 + (sweep-0.5)*hw, cy + Math.sin(lt*5.5)*hh, tmpB.max.z+0.002);
      brush.visible = true; brush.position.copy(sprayState.tip);
      brush.rotation.set(-0.55, 0.25 + Math.sin(lt*21)*0.12, 0);
    } else {
      gun.visible = true; gun.hose.visible = c.fx==='steam';
      gun.position.copy(sprayState.nozzle);
      gun.lookAt(sprayState.aim);
    }
  }
}

/* =============== camera =============== */
const A = {tx:0,ty:0,tz:0.11,az:-0.36,el:0.14,d:1.75}, AM = {tx:0,ty:0,tz:0.11,az:-0.3,el:0.12,d:2.6};
const tgt = new THREE.Vector3();
function mixCam(a,b,k){ const o={}; for(const key in a) o[key]=lerp(a[key],b[key],k); return o; }
function autoCamera(t){
  const A0 = MOBILE ? AM : A;
  let c = A0;
  const s = state.svc;
  if(state.sum){ c = {...A0, az:-0.2, d:A0.d*1.08}; }
  else if(s){
    const lt = state.lt;
    const ex = ease(clamp01((lt - TITLE + 0.3)/(s.exEnd - TITLE + 0.3)));
    const back = ease(clamp01((lt - s.reA)/REASM));
    c = mixCam(A0, MOBILE ? s.camM : s.cam, ex*(1-back));
    if(state.cleanIdx>=0){
      const cl = s.clean[state.cleanIdx];
      const w = clamp01((lt-cl.a)/(cl.b-cl.a)), bump = Math.sin(w*Math.PI)*0.3;
      const bc = sprayState.box.getCenter(new THREE.Vector3());
      c = {...c, tx:lerp(c.tx,bc.x,bump), ty:lerp(c.ty,bc.y,bump), tz:lerp(c.tz,bc.z,bump), d:c.d*(1-bump*0.45)};
    }
    c.az += 0.035*Math.sin(t*0.35);
  }
  tgt.set(c.tx,c.ty,c.tz);
  camera.position.set(Math.sin(c.az)*Math.cos(c.el), Math.sin(c.el), Math.cos(c.az)*Math.cos(c.el)).multiplyScalar(c.d).add(tgt);
  controls.target.copy(tgt); camera.lookAt(tgt);
}

applyStatic();
const $ = id=>document.getElementById(id);
const tabsEl = $('tabs');

// summary table
{
  const cols = SVC.map((s,i)=>`<th><span class="lf">${i+1}. ${L(s.k,s.e)}</span><span class="sf">${i+1}. ${L(s.short,s.shEn)}</span></th>`).join('');
  const rows = [

  const sym = {f:'<b class="f">●</b>', p:'<b class="p">◐</b>', x:'<b class="x">–</b>', d:`<b class="d">○</b><small>${L('브러쉬','Brush')}</small>`};

let shownSvc = -1;
function renderPanel(s){
  $('pNo').textContent = `SERVICE ${s.i+1} / 5`;
  $('pK').textContent = L(s.k, s.e); $('pE').textContent = '';
  $('pChips').innerHTML = CHIP_ORDER.map(id=>`<span class="chip ${s.scope.includes(id)?'in':''}" data-id="${id}">${L(P[id].k, P[id].e)}</span>`).join('');
  $('pList').innerHTML = s.items.map(it=>`<li><span class="ck">✓</span><span>${L(it[0], it[1])}</span></li>`).join('');
  $('pNote').textContent = KE(s.note)[EN?1:0];
  $('tNo').textContent = `SERVICE ${s.i+1}`;
  $('tK').textContent = L(s.k, s.e); $('tE').textContent = '';
  $('tSc').innerHTML = `${L('분해 범위','Scope')} · <b>${KE(s.scopeTxt)[EN?1:0]}</b>`;
}
const v = new THREE.Vector3(), b3 = new THREE.Box3();
function screenOf(obj, lift=0){
  b3.setFromObject(obj); b3.getCenter(v); v.y = b3.max.y + lift; v.project(camera);
  return [(v.x*0.5+0.5)*innerWidth, (-v.y*0.5+0.5)*innerHeight, v.z<1];
}
const PH = {
  dis:['분해 중','Disassembling'], clean:['세척 중','Cleaning'], reasm:['재조립','Reassembling'], run:['작동 확인 · 세척 완료','Test run · Done'],
};
const FXNAME = {water:['고압물 세척','Pressure water rinse'], chem:['약품 분사','Chemical spray'], steam:['고압 스팀 살균','High-pressure steam'], air:['브러쉬 먼지 제거','Brush dusting']};
function updateUI(t){
  const s = state.svc;
  $('sum').classList.toggle('on', state.sum);
  $('panel').style.opacity = state.sum ? 0 : 1;
  SVC.forEach(x=>{
    x.tab.classList.toggle('on', x===s);
    x.tab.querySelector('.pg').style.width = (clamp01((t-x.t0)/x.len)*100)+'%';
  });
  if(!s){ $('tcard').style.opacity=0; $('phase').style.opacity=0; $('callout').style.opacity=0; return; }
  if(shownSvc !== s.i){ renderPanel(s); shownSvc = s.i; }
  const lt = state.lt;
  const tc = $('tcard');
  const tv = lt < TITLE-0.35 ? 1 : 0;
  tc.style.opacity = tv; tc.style.transform = `translate(-50%,-50%) scale(${tv?1:0.96})`;
  // chips
  document.querySelectorAll('#pChips .chip').forEach(ch=>ch.classList.toggle('cur', state.cur && P[ch.dataset.id]===state.cur));
  // checklist progress: spread over clean phase, last item on run
  const lis = [...document.querySelectorAll('#pList li')];
  lis.forEach((li,i)=>{
    const key = s.items[i][2]; let a, b;
    if(key==='dis'){ a = TITLE; b = s.exEnd; }
    else if(key==='run'){ a = s.reA; b = s.reB + 0.6; }
    else { const w = s.clean.filter(c=>c.fx===key); a = w.length? w[0].a : s.clA; b = w.length? w[w.length-1].b : s.clB; }
    li.classList.toggle('show', lt >= a - 0.05);
    li.classList.toggle('done', lt >= b - 0.05);
  });
  // phase caption
  const ph = $('phase');
  if(state.phase && state.phase!=='title'){
    let txt = PH[state.phase];
    if(state.phase==='clean' && state.cleanIdx>=0){ const c = s.clean[state.cleanIdx]; const f = FXNAME[c.fx];
      txt = [`${P[c.p].k} · ${f[0]}`, `${P[c.p].e} · ${f[1]}`]; }
    ph.textContent = L(txt[0], txt[1]); ph.style.opacity = 1;
  } else ph.style.opacity = 0;
  // callout on part being removed
  const co = $('callout');
  if(state.cur){
    $('coK').textContent = L(state.cur.k, state.cur.e); $('coE').textContent = '';
    const [x,y,ok] = screenOf(state.cur.part.outer, 0.03);
    co.style.left = x+'px'; co.style.top = y+'px'; co.style.opacity = ok?1:0;
  } else co.style.opacity = 0;
  $('scrub').value = Math.round(t/T*1000);
  $('tlabel').textContent = Math.floor(t)+'s';
}

let time = 0, playing = true, speed = 1, auto = true;
$('play').onclick = ()=>{ playing=!playing; $('play').textContent = playing?'❚❚':'▶'; };
$('restart').onclick = $('again').onclick = ()=>{ time = 0; playing = true; $('play').textContent='❚❚'; };
$('speed').onclick = ()=>{ speed = speed===1?2:speed===2?0.5:1; $('speed').textContent = speed+'×'; };
$('cam').onclick = ()=>{ auto = !auto; $('cam').classList.toggle('on',auto); };
controls.addEventListener('start', ()=>{ auto=false; $('cam').classList.remove('on'); });
$('scrub').addEventListener('input', e=>{ time = e.target.value/1000*T; });
addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); $('play').click(); } });

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  fxMats.forEach(m=>m.uniforms.uH.value = innerHeight*renderer.getPixelRatio());
  camera.aspect = innerWidth/innerHeight;
  MOBILE = camera.aspect < 0.9;
  camera.fov = MOBILE ? 60 : 32;
  if(MOBILE){ const S = 150; camera.setViewOffset(innerWidth, innerHeight+S, 0, S, innerWidth, innerHeight); }
  else if(innerWidth > 760){ const S = 220; camera.setViewOffset(innerWidth+S, innerHeight, S, 0, innerWidth, innerHeight); }
  else camera.clearViewOffset();
  document.body.classList.toggle('mob', MOBILE);
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

let last = performance.now(), lastSvc = null;
function frame(now){
  const dt = Math.min((now-last)/1000, 0.05); last = now;
  if(playing){ time += dt*speed; if(time > T) time = 0; }
  applyTime(time);
  if(auto) autoCamera(time); else controls.update();
  if(state.svc !== lastSvc){ clearFX(); lastSvc = state.svc; }
  if(playing){ emit(dt*speed); for(const f of Object.values(FX)) stepFX(f, dt*speed); }
  renderer.render(scene, camera);
  updateUI(time);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__preview = (t)=>{
  playing=false; time=t;
  // simulate ~0.6s of particles leading up to t so stills show the spray
  clearFX();
  for(let k=0;k<70;k++){ applyTime(t-2.1+k*0.03); emit(0.03); for(const f of Object.values(FX)) stepFX(f,0.03); }
  applyTime(t); lastSvc = state.svc; if(auto) autoCamera(t); renderer.render(scene,camera); updateUI(t);
};
window.__T = {T, SUM_A, svc: SVC.map(s=>({t0:s.t0, exEnd:s.exEnd, clA:s.clA, clB:s.clB, reB:s.reB, len:s.len, clean:s.clean.map(c=>({p:c.p,fx:c.fx,a:c.a,b:c.b}))}))};
