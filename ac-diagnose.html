<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>에어컨 진단 가이드 · HHC</title>
<link rel="icon" href="/icon-admin-192.png">
<link rel="apple-touch-icon" href="/icon-admin-180.png">
<meta name="theme-color" content="#0F1C3F">
<style>
/* ═══ 에어컨 진단 가이드 (ac-diagnose.html) — 관리자·직원 화면 계열 (inspect-admin 토큰) ═══
   접두사 acd- 로 통일 — 다른 화면의 전역 클래스와 충돌하지 않게 합니다. */
:root{
  --navy:#0F1C3F;--navy2:#1b2f58;--teal:#0D9488;--teal-soft:#f0fdfb;--gold:#E8A838;
  --bg:#f0f2f8;--ink:#1a1a2e;--ink2:#5b6478;--ink3:#9ca3af;--line:#dde1ee;--soft:#f8f9fc;
  --ok:#10b981;--good:#0D9488;--warn:#f59e0b;--bad:#ef4444;
  --e1:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.16);
  --e2:0 1px 2px rgba(11,24,51,.10),0 8px 16px -4px rgba(11,24,51,.16),0 26px 44px -14px rgba(11,24,51,.34);
  --r:12px;--r-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;line-height:1.5;word-break:keep-all}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
.dim{color:var(--ink3)}

/* ── 상단바 ── */
#acd-top{position:sticky;top:0;z-index:60;background:linear-gradient(140deg,var(--navy),var(--navy2));color:#fff;
  display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  box-shadow:0 4px 16px -6px rgba(6,18,45,.7)}
#acd-top .mk{width:30px;height:30px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex:none}
#acd-top .mk svg{width:19px;height:19px;display:block}
#acd-top .tt{flex:1;min-width:0}
#acd-top .ti{font-size:15.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#acd-top .su{font-size:9px;font-weight:600;color:#8fa0c9;letter-spacing:.08em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#acd-top .lgb{display:flex;gap:3px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px;flex:none}
#acd-top .lgb button{border:none;background:none;color:#C6D5F5;font-size:11.5px;font-weight:800;border-radius:999px;padding:5px 10px}
#acd-top .lgb button.on{background:#fff;color:var(--navy)}

/* ── 본문 ── */
.acd-main{max-width:680px;margin:0 auto;padding:12px 12px calc(84px + env(safe-area-inset-bottom))}
.acd-card{background:#fff;border:0.5px solid #e0e0e8;border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--e1)}
.acd-chd{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700}
.acd-chd .n{width:22px;height:22px;border-radius:6px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.acd-cb{padding:14px}
.acd-fl{font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.02em;margin:12px 0 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.acd-fl:first-child{margin-top:0}
.acd-fl small{font-weight:600;color:var(--teal);font-size:11px}
.acd-hint{font-size:11.5px;color:var(--ink3);margin-top:5px;line-height:1.5}
.acd-note{font-size:12px;color:#5b6478;background:var(--soft);border-radius:var(--r-sm);padding:9px 11px;line-height:1.55;margin-top:8px}
.acd-note.brand{background:var(--teal-soft);color:#0f5f58}
input.acd-in{width:100%;padding:10px 11px;font-size:15px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--soft);color:var(--ink);outline:none;
  font-variant-numeric:tabular-nums}
input.acd-in:focus{border-color:var(--teal);background:#fff}
.acd-g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acd-g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acd-unit{position:relative}
.acd-unit input{padding-right:40px}
.acd-unit span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink3);font-weight:700;pointer-events:none}

/* 칩 (선택) */
.acd-chips{display:flex;flex-wrap:wrap;gap:7px}
.acd-chip{border:1.5px solid var(--line);background:#fff;color:#39415a;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;
  line-height:1.2;transition:transform .14s,background .14s,color .14s}
.acd-chip:active{transform:translateY(1px)}
.acd-chip.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 4px 12px -4px rgba(14,35,80,.5)}
/* 세그먼트 (단계 선택) */
.acd-segrow{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft)}
.acd-seg{flex:1;border:none;border-right:1px solid var(--line);background:none;padding:10px 4px;font-size:12.5px;font-weight:700;color:#39415a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.acd-seg:last-child{border-right:none}
.acd-seg.on{background:var(--navy);color:#fff}
.acd-vis{display:grid;gap:10px}
.acd-vis>div>.acd-fl{margin:0 0 5px}
/* 단위 토글 */
.acd-ut{display:inline-flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px}
.acd-ut button{border:none;background:none;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;color:var(--ink3)}
.acd-ut button.on{background:var(--navy);color:#fff}
/* 온도차 실시간 */
.acd-dt{margin-top:8px;font-size:13px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums}
.acd-dt.st-good{color:var(--good)}.acd-dt.st-ok{color:var(--ok)}.acd-dt.st-warn{color:#b45309}.acd-dt.st-bad{color:var(--bad)}
/* 코드 미리보기 */
.acd-cprev{margin-top:8px;border-radius:var(--r-sm);padding:0;font-size:13px;line-height:1.5}
.acd-cprev:not(:empty){padding:9px 11px}
.acd-cprev b{font-size:14px;font-variant-numeric:tabular-nums;margin-right:6px}
.acd-cprev small{display:block;color:var(--ink2);margin-top:2px;font-size:11.5px}
.acd-cprev.sev-crit{background:#FEF2F2;color:#7f1d1d}.acd-cprev.sev-warn{background:#FFFBEB;color:#78350f}.acd-cprev.sev-info{background:var(--soft);color:var(--ink2)}
.acd-cprev.sev-none{background:var(--soft);color:var(--ink2)}
.acd-sev{display:inline-block;font-style:normal;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px;background:#e5e7eb;color:#374151;white-space:nowrap}
.sev-crit .acd-sev,.acd-sev.sev-crit{background:var(--bad);color:#fff}
.sev-warn .acd-sev,.acd-sev.sev-warn{background:#F0B429;color:#3A2A00}
.sev-info .acd-sev,.acd-sev.sev-info{background:#e5e7eb;color:#374151}
/* 코드표 */
details.acd-more{margin-top:10px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
details.acd-more>summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--teal);background:var(--teal-soft);display:flex;justify-content:space-between;align-items:center}
details.acd-more>summary::-webkit-details-marker{display:none}
details.acd-more>summary:after{content:'›';font-size:16px;transform:rotate(90deg);transition:transform .15s}
details.acd-more[open]>summary:after{transform:rotate(-90deg)}
.acd-ct{width:100%;border-collapse:collapse;font-size:12px}
.acd-ct td{padding:7px 10px;border-top:1px solid #eef0f5;vertical-align:top;line-height:1.45}
.acd-ct td.cd{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;width:1%}
.acd-ct td.sv{white-space:nowrap;width:1%;text-align:right}
.acd-ct td.sv .acd-sev{margin-left:0}
.acd-ct small{display:block;color:var(--ink3);font-size:11px}
.acd-ct-wrap{max-height:360px;overflow:auto}
.acd-parts{padding:12px 12px 14px;background:#fff}
.acd-pt td{white-space:nowrap}

/* ── 결과 ── */
.acd-hero{background:linear-gradient(140deg,#0E2350,#16346E 65%,#1D4090);color:#fff;border-radius:16px;padding:16px 16px 14px;margin-bottom:12px;
  box-shadow:0 3px 8px rgba(6,18,45,.3),0 18px 34px -14px rgba(6,18,45,.7)}
.acd-hero-k{font-size:10px;font-weight:800;letter-spacing:.14em;color:#9FB6E8}
.acd-hero-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:8px}
.acd-hero-b{font-size:12px;color:#C6D5F5;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acd-hero-n{font-size:16px;font-weight:700;margin-top:10px;line-height:1.35;letter-spacing:-.01em;color:#DCE6FA}
.acd-hero-n b{color:#fff;font-weight:900}
.acd-hero-m{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.15);border-radius:11px;overflow:hidden;margin-top:13px}
.acd-hero-m>div{background:rgba(255,255,255,.06);padding:9px 8px;min-width:0}
.acd-hero-m .k2{font-size:9.5px;font-weight:800;color:#A9BEE9}
.acd-hero-m .v2{font-size:13px;font-weight:900;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.acd-pill{display:inline-block;font-size:11.5px;font-weight:900;border-radius:999px;padding:5px 12px;background:#e5e7eb;color:#374151}
.acd-pill.st-ok{background:var(--ok);color:#fff}.acd-pill.st-warn{background:#F0B429;color:#3A2A00}.acd-pill.st-bad{background:#F97316;color:#fff}.acd-pill.st-crit{background:var(--bad);color:#fff}
.acd-warnbox .acd-chd{background:#FFF8EC;color:#8A5A00}
.acd-ul{padding-left:18px;font-size:13.5px;line-height:1.55;margin:0}
.acd-ul li{margin:3px 0}
.acd-ul li.dim{color:var(--ink2)}
.acd-empty{padding:26px 14px;text-align:center;font-size:13.5px;color:var(--ink2);line-height:1.6}
.acd-code-big{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.acd-code-mean{font-size:15px;font-weight:700;margin-top:4px;color:var(--ink)}
.acd-kv{margin-top:10px;font-size:13.5px;line-height:1.55}
.acd-kv>b{display:block;font-size:11px;font-weight:800;color:var(--teal);letter-spacing:.02em;margin-bottom:2px}
.acd-kv ul,.acd-kv ol{padding-left:18px}
.acd-kv li{margin:2px 0}
/* 원인 목록 */
.acd-causes{padding:6px 8px 8px}
.acd-cause{border-radius:10px;border:1px solid transparent}
.acd-cause+.acd-cause{margin-top:2px}
.acd-cause[open]{background:var(--soft);border-color:#e8ebf3}
.acd-cause>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 8px}
.acd-cause>summary::-webkit-details-marker{display:none}
.acd-rank{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;font-variant-numeric:tabular-nums}
.acd-cause:nth-child(n+2) .acd-rank{background:#5b6478}
.acd-cn{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.acd-cn b{font-size:14px;font-weight:800;letter-spacing:-.01em;grid-column:1/3;line-height:1.3}
.acd-bar{height:5px;border-radius:999px;background:#e5e8f0;overflow:hidden}
.acd-bar i{display:block;height:100%;background:var(--teal);border-radius:999px}
.acd-cn small{font-size:10.5px;font-weight:800;white-space:nowrap}
.conf-high{color:var(--bad)}.conf-mid{color:#b45309}.conf-low{color:var(--ink3)}
.acd-chev{font-size:18px;color:#c3c8d4;transform:rotate(90deg);transition:transform .15s;flex:none;padding:0 2px}
.acd-cause[open] .acd-chev{transform:rotate(-90deg)}
.acd-cd{padding:0 10px 12px 42px}
.acd-svc{margin-top:10px;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--ink)}
.acd-svc b{color:var(--gold);font-weight:800;margin-right:4px}
.acd-cause.tag-clean .acd-svc{border-color:#b7e6dd;background:var(--teal-soft)}
/* 측정값 표 */
.acd-mt{width:100%;border-collapse:collapse;font-size:12.5px}
.acd-mt td{padding:8px 4px;border-top:1px solid #eef0f5;vertical-align:middle}
.acd-mt tr:first-child td{border-top:none}
.acd-mt .ml{font-weight:700}
.acd-mt .ms{font-size:11px;color:var(--ink3);margin-top:1px}
.acd-mt .mv{font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;font-size:13.5px}
.acd-mt .mr{font-size:11px;color:var(--ink3);text-align:right;max-width:120px;line-height:1.35}
.acd-mt .mst{width:22px;text-align:right}
.acd-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#d1d5db}
.acd-dot.st-good{background:var(--good)}.acd-dot.st-ok{background:var(--ok)}.acd-dot.st-warn{background:var(--warn)}.acd-dot.st-bad{background:var(--bad)}
.acd-copyrow{display:flex;justify-content:flex-end;margin:-4px 0 12px}
.acd-copyrow button{border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:800}
/* 참고 */
.acd-ref{padding:10px 0;border-top:1px solid #eef0f5;font-size:12.5px;line-height:1.55}
.acd-ref:first-child{border-top:none;padding-top:0}
.acd-ref b{display:block;font-size:12.5px;font-weight:800;margin-bottom:3px}
.acd-ref p{color:var(--ink2);margin-top:4px}
.acd-pt{border-collapse:collapse;margin-top:4px;font-size:12px;font-variant-numeric:tabular-nums}
.acd-pt th,.acd-pt td{padding:4px 10px 4px 0;text-align:left;font-weight:600}
.acd-pt th{color:var(--ink3);font-size:11px}
.acd-pt td:first-child{font-weight:800}
.acd-src{font-size:11px;color:var(--ink3);margin-top:10px;line-height:1.5}
details.acd-refbox>summary{list-style:none;cursor:pointer}
details.acd-refbox>summary::-webkit-details-marker{display:none}
details.acd-refbox>summary .acd-chd:after{content:'›';margin-left:auto;font-size:18px;transform:rotate(90deg);transition:transform .15s}
details.acd-refbox[open]>summary .acd-chd:after{transform:rotate(-90deg)}

/* ── 하단 고정 버튼바 ── */
#acd-bar{position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:680px;margin:0 auto;display:flex;gap:9px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);
  backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);
  border-top:1px solid var(--line);box-shadow:0 -14px 30px -16px rgba(14,35,80,.45)}
#acd-bar button{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14.5px;font-weight:900;border-radius:13px;padding:13px 8px;
  border:1.5px solid var(--navy);background:#fff;color:var(--navy);transition:transform .14s}
#acd-bar #btn-reset{flex:0 0 32%}
#acd-bar #btn-run{flex:1;background:linear-gradient(140deg,#0E2350,#1b2f58);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(14,35,80,.7)}
#acd-bar button:active{transform:translateY(2px)}

@media (max-width:820px){input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}}
@media (max-width:380px){.acd-g3{grid-template-columns:1fr 1fr}.acd-seg{font-size:11.5px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{#acd-top,#acd-bar,.acd-copyrow{display:none}.acd-main{padding:0}.acd-card,.acd-hero{break-inside:avoid;box-shadow:none}.acd-cause{break-inside:avoid}}
</style>
</head>
<body>

<div id="acd-top">
  <div class="mk"><svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#fff"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg></div>
  <div class="tt"><div class="ti" id="acd-title">에어컨 진단 가이드</div><div class="su" id="acd-sub">HAPPY HOME CARE · 현장 점검용</div></div>
  <div class="lgb"><button type="button" id="lg-ko" class="on">한국어</button><button type="button" id="lg-en">EN</button></div>
</div>

<main class="acd-main">

  <!-- 1 · 장비 정보 -->
  <section class="acd-card" id="sec-unit">
    <div class="acd-chd"><span class="n">1</span><span id="h-s1">장비 정보</span></div>
    <div class="acd-cb">
      <div class="acd-fl" id="l-brand">브랜드</div>
      <div class="acd-chips" id="c-brand"></div>
      <div id="york-row" style="display:none;margin-top:8px">
        <div class="acd-fl" id="l-york">York 계열</div>
        <div class="acd-chips"><button type="button" class="acd-chip" id="yk-new"></button><button type="button" class="acd-chip" id="yk-old"></button></div>
      </div>
      <div class="acd-note brand" id="brand-note" style="display:none"></div>
      <div class="acd-fl" id="l-model">모델명 (명판)</div>
      <input class="acd-in" id="in-model" type="text" autocapitalize="characters" autocomplete="off" spellcheck="false">
      <div class="acd-fl"><span id="l-hp">냉방능력</span><small id="hp-guess"></small></div>
      <div class="acd-chips" id="c-hp"></div>
      <div class="acd-g2" style="margin-top:12px">
        <div>
          <div class="acd-fl" style="margin-top:0" id="l-type">방식</div>
          <div class="acd-chips" id="c-type"></div>
        </div>
        <div>
          <div class="acd-fl" style="margin-top:0" id="l-ref">냉매</div>
          <div class="acd-chips" id="c-ref"></div>
        </div>
      </div>
      <div class="acd-hint" id="ref-hint"></div>
      <div class="acd-fl" id="l-rated">정격 전류 (명판, A)</div>
      <div class="acd-unit"><input class="acd-in" id="in-rated" type="number" inputmode="decimal" step="0.01" min="0"><span>A</span></div>
      <div class="acd-hint" id="rated-hint"></div>
    </div>
  </section>

  <!-- 2 · 증상 · 육안 -->
  <section class="acd-card" id="sec-sym">
    <div class="acd-chd"><span class="n">2</span><span id="h-s2">증상 · 육안 점검</span></div>
    <div class="acd-cb">
      <div class="acd-fl" id="l-sym">증상</div>
      <div class="acd-chips" id="c-sym"></div>
      <div class="acd-fl" style="margin-top:16px" id="l-visual">육안 점검</div>
      <div class="acd-vis">
        <div><div class="acd-fl" id="l-filter">필터 · 증발기</div><div class="acd-segrow" id="s-filter"></div></div>
        <div><div class="acd-fl" id="l-cond">실외기 응축기</div><div class="acd-segrow" id="s-cond"></div></div>
        <div><div class="acd-fl" id="l-odfan">실외 팬</div><div class="acd-segrow" id="s-odfan"></div></div>
      </div>
    </div>
  </section>

  <!-- 3 · 측정값 -->
  <section class="acd-card" id="sec-meas">

  lg:{ko:'실내기 표시부에 「CH」와 숫자가 번갈아 표시. LED만 있는 모델은 LED 점멸(첫 LED = 1의 자리, 둘째 = 10의 자리). CH61은 자동 해제 안 됨 → 3분 전원 리셋. 구형 비인버터의 C1·C5·C6 등 한 자리 코드는 뜻이 다름.',

  samsung:{ko:'2자리 표시부는 「E1」↔「21」 교대 = E121. 4자리 표시부는 「E121」. CF(필터)·Cl(자동청소)·dF(제상)는 고장 아님. 구형 비인버터의 E1/E5/E6/E7은 센서 코드.',
           en:'2-digit display alternates "E1" / "21" = E121; 4-digit shows "E121". CF, Cl, dF are indicators, not faults. Old non-inverter E1/E5/E6/E7 are sensor codes.'},
  midea:{ko:'7세그먼트에 E/F/P 코드 또는 신형 4자 코드(EH/EL/EC/PH/PL/PC). 표시부 없는 모델: 타이머 램프 꺼짐 = E, 켜짐 = F, 점멸 = P + 운전 램프 점멸 횟수. 괄호는 신형 코드.',

  gree:{ko:'온도 표시부에 코드 표시 (여러 개면 순환). 표시부 없는 모델은 램프 점멸 횟수(E1 = 1회 … E8 = 8회). H3·H5·U3 등은 압축기 정지 약 200초 후에 표시됨. Gree가 만든 Sharp 모델도 같은 코드.',

  york:{ko:'두 계열이 있음 — ① 2015년 이후 YWM3F/YWM5J (Johnson Controls, Haier 계열): 실내기 표시부에 E/F 숫자 코드. ② 2015년 이전 OYL(Daikin 계열) 모델: Daikin과 같은 코드(A5·U4 등)를 리모컨 CANCEL 5초로 조회. 코드 형태로 구분하세요.',
        en:'Two families — ① YWM3F/YWM5J from 2015 (Johnson Controls, Haier platform): E/F numeric codes on the indoor display. ② Pre-2015 OYL (Daikin platform): Daikin-style codes (A5, U4…) read via remote CANCEL 5 s. Tell them apart by code format.'},
  acson:{ko:'Daikin 계열(OYL·DAMA) — Daikin과 같은 코드·조회법(리모컨 CANCEL 5초). 구형 AWM(LED 표시) 모델은 E1~EE 별도 코드 — 표 하단 「구형」 항목 참조.',

  toshiba:{ko:'고장 시 실내기 램프 전체가 빠르게 점멸 + 삐 소리. 리모컨 CHECK(핀) → 「00」 → TIMER ▲/▼로 이동, 실내기가 연속 삐 소리를 내는 코드가 저장 코드. CLR로 소거(7F). 신형은 01-xx(실내)/02-xx(실외)/03-xx(압축기) 접두. 구형(SKV)은 코드 뜻이 다름.',

  sharp:{ko:'정지 상태에서 AUX(비상운전) 버튼 5초 이상 → 운전(적)·타이머(주황)·플라즈마(청/녹) 램프 점멸로 「주-부」 번호 표시. 전원을 끄면 이력이 사라지므로 차단기 내리기 전에 확인. Gree가 만든 Sharp(AY-X…RU 등)는 Gree 코드 사용.',

/* ── 냉매 포화 온도표 (°C → psig) 0~60°C, 5°C 간격 ─────────────────── */
var PT={
  R32:  [103.2,123.5,145.9,171.2,199.2,230.3,264.8,302.9,344.9,390.8,441.3,496.4,556.6],

};
/* psig → 포화온도(°C), 표 밖은 외삽 */
function satTemp(ref,psi){
  var t=PT[ref];if(!t||!(psi>0))return null;
  if(psi<=t[0])return 0-(t[0]-psi)/(t[1]-t[0])*5;
  for(var i=1;i<t.length;i++){if(psi<=t[i])return (i-1)*5+(psi-t[i-1])/(t[i]-t[i-1])*5;}
  var n=t.length-1;return n*5+(psi-t[n])/(t[n]-t[n-1])*5;
}

var TH_B=3950;
function thermR(r25,tC){return r25*Math.exp(TH_B*(1/(tC+273.15)-1/298.15));}

var HP_MAP={
  daikin:{25:'1.0',35:'1.5',50:'2.0',60:'2.5',71:'2.5',75:'3.0'},

};
function guessHP(brand,model){
  if(!model)return null;
  var m=String(model).toUpperCase();
  var map=brand==='daikin'?HP_MAP.daikin:HP_MAP.generic;
  var nums=m.match(/\d{2,3}/g)||[];
  for(var i=0;i<nums.length;i++){
    var n=parseInt(nums[i],10);
    if(map[n])return map[n];
    if(brand!=='daikin'&&nums[i].length===3&&HP_MAP.generic[parseInt(nums[i].slice(0,2),10)])return HP_MAP.generic[parseInt(nums[i].slice(0,2),10)];
  }
  return null;
}

var SYMS=['nocool','weakair','leak','ice','odoff','trip','hum','fanpush','tempctl','noise','smell','nopower','err'];
var HPS=['1.0','1.5','2.0','2.5','3.0'];
var REFS=['R32','R410A','R22'];

/* ── 상태 ─────────────────────────────────────────────────────────── */
var S=blank();
function blank(){return {lang:'ko',brand:null,yorkFam:'new',model:'',hp:null,type:null,ref:null,rated:'',
  sym:{},filter:null,cond:null,odfan:null,ta:'',tb:'',amb:'',lp:'',hpp:'',punit:'psi',cur:'',volt:'',code:'',capr:'',capm:'',thn:'10',thr:'',tht:'',shown:false};}
function tx(){return T[S.lang];}
function L(o){return o?(S.lang==='ko'?o.ko:o.en):'';}
function num(v){if(v===''||v==null)return null;var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function pick(str){/* '한글|영문' 표기 분리 */if(!str)return '';var p=String(str).split('|');return S.lang==='ko'?p[0]:(p[1]||p[0]);}

/* ── 에러코드 조회 ────────────────────────────────────────────────── */
function normCode(c){return String(c||'').toUpperCase().replace(/\s+/g,'');}
function findCode(brand,code){
  var q=normCode(code);if(!q||!brand)return null;
  var qs=[q];
  var m;
  if((m=q.match(/^CH(\d)$/)))qs.push('CH0'+m[1]);                 /* CH5 → CH05 */
  if((m=q.match(/^0[123]-?([0-9A-Z]{2})$/)))qs.push(m[1]);          /* Toshiba 02-1C → 1C */
  if((m=q.match(/^E(\d)-?(\d\d)$/)))qs.push('E'+m[1]+m[2]);       /* Samsung E1-21 → E121 */
  var tbl=codeTables(brand,S.yorkFam);
  for(var i=0;i<tbl.length;i++){
    var keys=String(tbl[i][0]).toUpperCase().split('/');
    for(var k=0;k<keys.length;k++){
      var key=keys[k].replace(/\s+/g,'');
      if(key.indexOf('~')>=0){                                      /* 범위 5-0 ~ 5-5 */
        var r=key.split('~'),a=r[0].match(/^(\d+)-(\d+)$/),b=r[1].match(/^(\d+)-(\d+)$/);
        for(var j=0;j<qs.length;j++){var x=qs[j].match(/^(\d+)-(\d+)$/);
          if(a&&b&&x&&x[1]===a[1]&&+x[2]>=+a[2]&&+x[2]<=+b[2])return tbl[i];}
        continue;
      }
      for(var j2=0;j2<qs.length;j2++){if(key===qs[j2])return tbl[i];}
    }
    var al=String(tbl[i][5]||'').match(/\(([A-Z]{2}\s?[0-9A-Z]{2})\)/i);   /* 별칭 (EH 00) 등 */
    if(al){var alk=al[1].toUpperCase().replace(/\s+/g,'');for(var j3=0;j3<qs.length;j3++){if(alk===qs[j3])return tbl[i];}}
  }
  return null;
}

/* ── 진단 엔진 ────────────────────────────────────────────────────── */
function diagnose(){
  var t=tx(),k=S.lang==='ko';
  var sc={},ev={},meas=[],warns=[],assum=[],notes=[];
  function add(id,p,why){sc[id]=(sc[id]||0)+p;if(why){ev[id]=ev[id]||[];if(ev[id].indexOf(why)<0)ev[id].push(why);}}
  function w(ko,en){return k?ko:en;}
  var hasAny=false;

  /* 온도차 */
  var ta=num(S.ta),tb=num(S.tb),dt=null,dtSt=null;
  if(ta!=null&&tb!=null){hasAny=true;dt=ta-tb;
    if(dt<0){warns.push(w('흡입온도가 토출온도보다 낮습니다 — 두 값이 바뀌지 않았는지 확인하세요.','Intake is colder than discharge — check the two values are not swapped.'));}
    else{
      dtSt=dt>=DT_REF.good?'good':dt>=DT_REF.ok?'ok':dt>=DT_REF.low?'warn':'bad';
      meas.push({label:t.dt,val:dt.toFixed(1)+' °C',range:t.dtRange,st:dtSt});
      var d=dt.toFixed(1);
      if(dtSt==='bad'){add('C1',2,w('온도차 '+d+'°C — 8°C 미만, 냉방 능력 크게 저하','ΔT '+d+' °C — below 8 °C, cooling capacity badly reduced'));add('C6',2,w('온도차 '+d+'°C — 압축기 미가동·압축 불량 가능','ΔT '+d+' °C — compressor may not be running / pumping'));add('C2',1,w('온도차 저하','Low ΔT'));add('C14',1,w('냉방 모드·설정온도 확인 필요','Check mode and set temperature'));}
      else if(dtSt==='warn'){add('C1',1,w('온도차 '+d+'°C — 12°C 미만','ΔT '+d+' °C — below 12 °C'));add('C4',1,w('온도차 '+d+'°C — 증발기 오염 시 능력 저하','ΔT '+d+' °C — dirty evaporator reduces capacity'));add('C2',1,w('온도차 저하','Low ΔT'));add('C15',1,w('온도차 저하 — 부하 과다 가능','Low ΔT — possible excess heat load'));}
      if(dt>=20){
        if((S.filter||0)>=1||S.sym.weakair||S.sym.ice){meas[meas.length-1].st='warn';add('C4',3,w('온도차 '+d+'°C로 과대 + 풍량 부족 징후 — 코일이 지나치게 차가움(결빙 위험)','ΔT '+d+' °C too high with low-airflow signs — coil too cold (icing risk)'));}
        else add('C4',1,w('온도차 '+d+'°C — 기준 이상, 풍량 확인 권장','ΔT '+d+' °C — above range, check airflow'));
      }
    }
  }else if(ta!=null||tb!=null){warns.push(w('흡입·토출 온도를 둘 다 입력해야 온도차를 판정합니다.','Enter both intake and discharge temperatures for ΔT.'));}

  /* 압력 */
  var lp=num(S.lp),hp=num(S.hpp);
  if(S.punit==='bar'){if(lp!=null)lp*=14.5038;if(hp!=null)hp*=14.5038;}
  var amb=num(S.amb),ambA=false;if(amb==null){amb=AMB_DEFAULT;ambA=true;}
  var lpC=null,hpC=null,evt=null,cdt=null,split=null;
  if(lp!=null||hp!=null){hasAny=true;
    if(!S.ref){warns.push(w('냉매 종류를 선택하면 압력을 판정할 수 있습니다.','Select the refrigerant to assess pressures.'));
      if(lp!=null)meas.push({label:t.lp,val:lp.toFixed(0)+' psi',range:t.na,st:null});
      if(hp!=null)meas.push({label:t.hpp,val:hp.toFixed(0)+' psi',range:t.na,st:null});
    }else{
      var R=REF[S.ref];
      if(lp!=null){evt=satTemp(S.ref,lp);
        lpC=lp<R.lo[0]?'low':lp>R.lo[1]?'high':'ok';
        var lpSt=lpC==='ok'?'ok':(lpC==='low'?(lp<R.lo[0]*0.85?'bad':'warn'):(lp>R.lo[1]*1.15?'bad':'warn'));
        meas.push({label:t.lp,val:lp.toFixed(0)+' psi',sub:w('증발온도 약 '+evt.toFixed(0)+'°C','evaporating ≈ '+evt.toFixed(0)+' °C'),range:R.lo[0]+'~'+R.lo[1]+' psi',st:lpSt});
      }
      if(hp!=null){cdt=satTemp(S.ref,hp);split=cdt-amb;var spS=(split>=0?'+':'−')+Math.abs(split).toFixed(0);
        if(ambA){hpC=hp<R.hi[0]?'low':hp>R.hi[1]?'high':'ok';assum.push(w('실외 온도 미입력 — 33°C로 가정하여 응축온도를 계산했습니다.','Outdoor temp not entered — 33 °C assumed for condensing temp.'));}
        else{hpC=split<6?'low':split>18?'high':'ok';}
        var hpSt=hpC==='ok'?'ok':(hpC==='high'?(split>24||hp>R.hi[1]*1.15?'bad':'warn'):'warn');
        meas.push({label:t.hpp,val:hp.toFixed(0)+' psi',sub:w('응축온도 약 '+cdt.toFixed(0)+'°C (외기 '+spS+'°C)','condensing ≈ '+cdt.toFixed(0)+' °C (ambient '+spS+' °C)'),range:R.hi[0]+'~'+R.hi[1]+' psi · '+w('외기 +6~18°C','ambient +6–18 °C'),st:hpSt});
      }
      var eq=(lp!=null&&hp!=null)&&((hp-lp)<0.35*(R.hi[0]-R.lo[1]));
      if(lpC&&hpC){
        if(eq){add('C6',5,w('저압·고압이 거의 같음(균압 '+lp.toFixed(0)+'/'+hp.toFixed(0)+' psi) — 압축기가 압축하지 않음','Suction and discharge nearly equal ('+lp.toFixed(0)+'/'+hp.toFixed(0)+' psi) — compressor not pumping'));}
        else if(lpC==='low'&&hpC==='low'){add('C1',4,w('저압·고압 모두 낮음 — 전형적인 냉매 부족 패턴','Both pressures low — classic refrigerant shortage pattern'));}
        else if(lpC==='low'){add('C5',3,w('저압만 낮고 고압은 정상·높음 — 냉매 회로 막힘 패턴','Low suction with normal/high head — restriction pattern'));add('C4',2,w('저압 낮음 — 실내 풍량 부족(필터·증발기 오염)도 저압을 낮춤','Low suction — poor indoor airflow also lowers suction'));if(hpC==='high')add('C5',1,w('고압까지 높음','Head also high'));}
        else if(lpC==='high'&&hpC==='high'){add('C3',3,w('저압·고압 모두 높음 — 과충전 패턴','Both pressures high — overcharge pattern'));add('C2',2,w('고압 높음 — 응축기 방열 상태 확인','High head — check condenser heat rejection'));add('C15',1,w('실내 부하 과다 시에도 저압 상승','High heat load also raises suction'));}
        else if(hpC==='high'){add('C2',4,w('고압만 높음(응축온도 외기 +'+split.toFixed(0)+'°C) — 응축기 오염·통풍·팬 불량 패턴','High head only (condensing ambient +'+split.toFixed(0)+' °C) — dirty condenser / airflow / fan'));add('C3',1,w('과충전도 고압을 높임','Overcharge also raises head'));}
        else if(lpC==='high'){add('C6',3,w('저압 높고 고압 낮음·정상 — 압축 불량 의심','High suction with low/normal head — weak compression'));add('C15',1,w('부하 과다 가능','Possible high load'));}
        else if(hpC==='low'){add('C1',2,w('고압 낮음 — 냉매 부족 가능','Low head — possible shortage'));add('C6',1,w('고압 낮음 — 압축기 능력 저하 가능','Low head — weak compressor possible'));}
        else notes.push(w('냉매 압력은 정상 범위입니다.','Refrigerant pressures are within normal range.'));
      }else if(lpC){
        if(lpC==='low'){add('C1',2,w('저압 낮음','Low suction'));add('C5',1,w('저압 낮음 — 막힘 가능','Low suction — restriction possible'));add('C4',1,w('저압 낮음 — 풍량 부족 가능','Low suction — low airflow possible'));}
        else if(lpC==='high'){add('C6',2,w('저압 높음 — 압축 불량 가능','High suction — weak compression possible'));add('C3',1,w('저압 높음 — 과충전 가능','High suction — overcharge possible'));add('C15',1,w('부하 과다 가능','High load possible'));}
        else notes.push(w('저압은 정상 범위입니다.','Suction pressure is within range.'));
      }else if(hpC){
        if(hpC==='high'){add('C2',3,w('고압 높음(응축온도 외기 +'+split.toFixed(0)+'°C)','High head (condensing ambient +'+split.toFixed(0)+' °C)'));add('C3',1,w('과충전 가능','Overcharge possible'));}
        else if(hpC==='low'){add('C1',2,w('고압 낮음','Low head'));add('C6',1,w('고압 낮음 — 압축기 능력 저하 가능','Low head — weak compressor possible'));}
        else notes.push(w('고압은 정상 범위입니다.','Head pressure is within range.'));
      }
      if(S.type==='inv'&&((lpC&&lpC!=='ok')||(hpC&&hpC!=='ok')))assum.push(w('인버터 기기: 압축기 속도에 따라 압력이 변합니다. 최대 냉방(설정 최저·강풍·15분↑)에서 측정한 값인지 확인하세요.','Inverter unit: pressures vary with compressor speed. Confirm readings were taken at maximum cooling.'));
    }
  }

  /* 전류 */
  var cur=num(S.cur),rated=num(S.rated),ratedA=false;
  var hpEff=S.hp||guessHP(S.brand,S.model);
  if(rated==null&&hpEff){rated=AMP_EST[S.type==='non'?'non':'inv'][hpEff];ratedA=true;}
  var ratio=null;
  if(cur!=null){hasAny=true;
    if(rated){ratio=cur/rated;var pc=Math.round(ratio*100);
      var cSt=ratio>=1.2?'bad':ratio>=1.1?'warn':ratio>=0.7?'ok':ratio>=0.4?'warn':'bad';
      meas.push({label:t.cur,val:cur.toFixed(1)+' A',sub:w('정격 '+rated.toFixed(1)+'A의 '+pc+'%'+(ratedA?' (추정 정격)':''),pc+' % of rated '+rated.toFixed(1)+' A'+(ratedA?' (estimated)':'')),range:w('정격의 70~110%','70–110 % of rated'),st:cSt});
      if(ratedA)assum.push(w('정격 전류 미입력 — '+hpEff+'HP '+(S.type==='non'?'일반형':'인버터')+' 기준 '+rated.toFixed(1)+'A로 추정했습니다. 명판 값을 입력하면 더 정확합니다.','Rated current not entered — estimated '+rated.toFixed(1)+' A for '+hpEff+' HP. Enter the nameplate value for accuracy.'));
      if(ratio>=1.2){add('C2',3,w('운전 전류 정격의 '+pc+'% — 과부하 운전(고압 상승)','Current '+pc+' % of rated — overload (high head)'));add('C7',1,w('저전압도 전류를 높임','Low voltage also raises current'));add('C6',1,w('과전류 — 압축기 노후 가능','Over-current — worn compressor possible'));add('C3',1,w('과충전도 전류를 높임','Overcharge also raises current'));}
      else if(ratio>=1.1){add('C2',1,w('운전 전류 정격의 '+pc+'% — 약간 높음','Current '+pc+' % of rated — slightly high'));}
      else if(ratio<0.4||cur<1){add('C6',3,w('운전 전류 정격의 '+pc+'% — 팬만 도는 수준, 압축기 미가동 의심','Current '+pc+' % of rated — fan-only level, compressor may not be running'));if(S.type==='non')add('C10',2,w('일반형 — 캐패시터 불량 시 압축기 기동 실패','Non-inverter — failed capacitor prevents start'));add('C9',1,w('압축기 미가동 — 제어·통신 가능','Compressor not running — control/communication possible'));add('C7',1,w('압축기 미가동 — 전원 확인','Compressor not running — check supply'));}
      else if(ratio<0.7){add('C1',2,w('운전 전류 정격의 '+pc+'% — 낮음, 냉매 부족 시 전류 감소','Current '+pc+' % of rated — low; shortage lowers current'));add('C6',1,w('전류 낮음 — 압축 능력 저하 가능','Low current — weak compression possible'));if(S.type==='inv')assum.push(w('인버터는 부하가 낮으면 전류가 낮게 나옵니다 — 최대 냉방 상태에서 재측정하세요.','Inverter current drops at low load — re-measure at maximum cooling.'));}
    }else{meas.push({label:t.cur,val:cur.toFixed(1)+' A',range:t.na,st:null});warns.push(w('정격 전류(명판) 또는 냉방능력(HP)을 입력하면 전류를 판정합니다.','Enter rated current or capacity (HP) to assess current.'));}
  }

  /* 전압 */
  var v=num(S.volt);
  if(v!=null){hasAny=true;
    var vSt=v<200?'bad':v<VOLT_REF.lo?'warn':v>265?'bad':v>VOLT_REF.hi?'warn':'ok';
    meas.push({label:t.volt,val:v.toFixed(0)+' V',range:VOLT_REF.lo+'~'+VOLT_REF.hi+' V',st:vSt});
    if(v<200)add('C7',5,w('전압 '+v.toFixed(0)+'V — 심한 저전압, 압축기 기동 불량·과전류·기판 보호 정지 원인','Voltage '+v.toFixed(0)+' V — severe low voltage'));
    else if(v<VOLT_REF.lo)add('C7',3,w('전압 '+v.toFixed(0)+'V — 허용 하한(216V) 미만','Voltage '+v.toFixed(0)+' V — below 216 V limit'));
    else if(v>265)add('C7',5,w('전압 '+v.toFixed(0)+'V — 심한 과전압','Voltage '+v.toFixed(0)+' V — severe over-voltage'));
    else if(v>VOLT_REF.hi)add('C7',3,w('전압 '+v.toFixed(0)+'V — 허용 상한(253V) 초과','Voltage '+v.toFixed(0)+' V — above 253 V limit'));
    else notes.push(w('전원 전압은 정상 범위입니다.','Supply voltage is within range.'));
  }

  /* 증상 */
  var sy=S.sym,sl=t.symList;
  function symEv(id){return w('증상: '+sl[id],'Symptom: '+sl[id]);}
  if(sy.nocool){hasAny=true;add('C1',1,symEv('nocool'));add('C4',1,symEv('nocool'));add('C2',1,symEv('nocool'));if(dt==null&&lp==null&&hp==null)add('C15',1,symEv('nocool'));}
  if(sy.weakair){hasAny=true;add('C4',3,symEv('weakair'));}
  if(sy.leak){hasAny=true;add('C8',4,symEv('leak'));add('C11',2,symEv('leak'));add('C4',1,w('물 샘 — 결빙 후 녹은 물일 수 있음','Dripping — may be melt from icing'));add('C1',1,w('물 샘 — 냉매 부족 결빙 가능','Dripping — icing from low charge possible'));}
  if(sy.ice){hasAny=true;add('C1',3,symEv('ice'));add('C4',3,symEv('ice'));add('C5',1,symEv('ice'));}
  if(sy.odoff){hasAny=true;add('C9',3,symEv('odoff'));add('C7',2,symEv('odoff'));add('C6',2,symEv('odoff'));if(S.type==='non')add('C10',2,symEv('odoff'));add('C14',2,w('실외기 정지 — 설정온도 도달·3분 지연·타이머일 수 있음','Outdoor off — may be set-point reached, 3-min delay or timer'));}
  if(sy.trip){hasAny=true;add('C2',3,symEv('trip'));add('C7',2,symEv('trip'));add('C6',2,symEv('trip'));if(S.type==='non')add('C10',1,symEv('trip'));add('C1',1,w('자주 꺼짐 — 토출 과열 보호 가능','Stopping — discharge overheat protection possible'));}
  if(sy.noise){hasAny=true;add('C13',4,symEv('noise'));add('C3',1,w('소음 — 액 복귀(과충전) 시 압축기 소음','Noise — liquid return (overcharge) noise'));add('C6',1,symEv('noise'));}
  if(sy.smell){hasAny=true;add('C12',4,symEv('smell'));add('C8',1,w('냄새 — 배수 트랩 건조 시 하수 냄새','Odour — sewer smell from dry drain trap'));}
  if(sy.nopower){hasAny=true;add('C7',3,symEv('nopower'));add('C9',3,symEv('nopower'));add('C14',2,w('리모컨 건전지·수신부 확인','Check remote batteries / receiver'));}

  if(sy.hum){hasAny=true;
    if(S.type==='inv'){add('C6',3,w('압축기 웅~ 후 정지 — 인버터 기기는 캐패시터가 없음: 압축기 권선·U·V·W 배선·IPM 점검','Hums then stops — inverter has no capacitor: check windings, U-V-W leads, IPM'));add('C7',1,symEv('hum'));}
    else{add('C10',4,w('압축기 웅~ 소리 후 정지 — 운전 캐패시터 불량의 전형 (기동 전류 급상승 후 0)','Compressor hums then stops — classic run-capacitor failure'));add('C6',2,w('웅~ 후 정지 — 압축기 구속(락)도 같은 증상','Hum then stop — a locked compressor gives the same sign'));add('C7',1,w('저전압도 기동 실패를 일으킴','Low voltage also causes start failure'));}}
  if(sy.fanpush){hasAny=true;
    if(S.type==='inv'){add('C2',2,w('실외 팬 밀면 돎 — DC 팬 모터·기판 팬 구동부 (인버터)','Fan runs only if pushed — DC fan motor / PCB fan driver (inverter)'));add('C9',1,symEv('fanpush'));}
    else{add('C10',4,w('실외 팬을 밀어야 돎 — 팬 캐패시터 불량의 전형','Fan runs only if pushed — classic fan-capacitor failure'));add('C2',2,w('팬 저속·정지 → 고압 상승·압축기 과열 트립','Slow/stopped fan → high head, compressor overheat trip'));}}
  if(sy.tempctl){hasAny=true;add('C16',3,w('온도 조절 안 됨·표시온도 오차 — 실온 센서 드리프트(값이 틀어짐)의 전형','Poor temp control / display off — classic room-sensor drift'));add('C14',1,w('센서 위치·직사광·리모컨 센서 설정도 확인','Also check sensor position, sunlight, remote sensor setting'));}

  /* 육안 */
  if(S.filter===2){hasAny=true;add('C4',3,w('필터·증발기 심한 오염','Filter / evaporator heavily soiled'));add('C12',1,w('오염 — 냄새·곰팡이','Soiling — odour / mould'));}
  else if(S.filter===1){hasAny=true;add('C4',1,w('필터·증발기 보통 오염','Filter / evaporator moderately soiled'));}
  if(S.cond===1){hasAny=true;add('C2',2,w('응축기 오염','Condenser dirty'));}
  else if(S.cond===2){hasAny=true;add('C2',3,w('실외기 통풍 불량·막힘','Outdoor airflow blocked'));}
  if(S.odfan==='slow'){hasAny=true;add('C2',3,w('실외 팬 느림·소음','Outdoor fan slow / noisy'));add('C13',1,w('실외 팬 소음','Outdoor fan noise'));}
  else if(S.odfan==='stop'){hasAny=true;add('C2',2,w('실외 팬 정지 — 고압 상승·보호 정지','Outdoor fan stopped — high head, protection stop'));if(S.type==='non')add('C10',2,w('실외 팬 정지 — 팬 캐패시터','Fan stopped — fan capacitor'));add('C9',1,w('실외 팬 정지 — 기판 팬 구동부','Fan stopped — PCB fan driver'));}

  /* 에러코드 */
  var codeRow=null,codeInfo=null;
  if(S.code){hasAny=true;codeRow=findCode(S.brand,S.code);
    if(codeRow){var fam=FAM[codeRow[3]]||FAM.other;
      codeInfo={code:codeRow[0],mean:k?codeRow[1]:codeRow[2],fam:fam,famKey:codeRow[3],sev:codeRow[4],note:pick(codeRow[5])};
      fam.m.forEach(function(p){add(p[0],p[1]+(codeRow[4]==='crit'?1:0),w('에러코드 '+codeRow[0]+' — '+codeRow[1],'Error code '+codeRow[0]+' — '+codeRow[2]));});
    }else if(S.brand){warns.push(w('에러코드 「'+S.code+'」는 '+brandName(S.brand)+' 코드표에 없습니다 — 표기(예: E1 21 → E121)·브랜드 계열을 확인하세요.','Code "'+S.code+'" is not in the '+brandName(S.brand)+' table — check the format (e.g. E1 21 → E121) and brand family.'));}
    else warns.push(w('브랜드를 선택하면 에러코드를 해석합니다.','Select a brand to interpret the error code.'));
  }

  /* 부품 측정 — 캐패시터 */
  var capr=num(S.capr),capm=num(S.capm);
  if(capr!=null&&capm!=null&&capr>0){hasAny=true;
    var dev=(capm-capr)/capr*100,ad=Math.abs(dev),cst=ad<=CAP_TOL?'ok':ad<=10?'warn':'bad';
    var dvS=(dev>=0?'+':'−')+ad.toFixed(1)+'%';
    meas.push({label:t.cap,val:capm.toFixed(1)+' µF',sub:w('표기 '+capr.toFixed(1)+'µF 대비 '+dvS,dvS+' vs rated '+capr.toFixed(1)+' µF'),range:'±'+CAP_TOL+'%',st:cst});
    if(cst==='bad')add('C10',5,w('캐패시터 측정 '+capm.toFixed(1)+'µF — 표기 대비 '+dvS+', 허용 ±'+CAP_TOL+'% 밖 (불량)','Capacitor '+capm.toFixed(1)+' µF — '+dvS+' vs rated, outside ±'+CAP_TOL+' %'));
    else if(cst==='warn')add('C10',2,w('캐패시터 '+dvS+' — 한계 근접, 교체 권장','Capacitor '+dvS+' — near limit, replace soon'));
    else notes.push(w('캐패시터 용량은 허용 범위입니다.','Capacitor is within tolerance.'));

  }else if(capr!=null||capm!=null){warns.push(w('캐패시터는 표기값과 측정값을 둘 다 입력해야 판정합니다.','Enter both rated and measured µF to assess the capacitor.'));}
  /* 부품 측정 — 써미스터 */
  var thr=num(S.thr),tht=num(S.tht),thn=parseFloat(S.thn||'10');

    if(tht==null){warns.push(w('써미스터는 측정 시 센서 온도를 함께 입력해야 판정합니다.','Enter the sensor temperature to assess the thermistor.'));meas.push({label:t.th,val:thr.toFixed(1)+' kΩ',range:t.na,st:null});}
    else{var exp_=thermR(thn,tht),tdev=(thr-exp_)/exp_*100,tad=Math.abs(tdev);

      meas.push({label:t.th,val:(thr>=thn*200?'OL':thr.toFixed(1)+' kΩ'),sub:thSub,range:'±15%',st:tst});
      if(thr<=0.05)add('C16',5,w('써미스터 0Ω — 단락','Thermistor 0 Ω — short circuit'));
      else if(thr>=thn*200)add('C16',5,w('써미스터 저항 무한대 — 단선','Thermistor open circuit'));
      else if(tst==='bad')add('C16',5,w('써미스터 '+thr.toFixed(1)+'kΩ — '+tht.toFixed(0)+'°C 예상 '+exp_.toFixed(1)+'kΩ 대비 '+tdS+' (드리프트 불량)','Thermistor '+thr.toFixed(1)+' kΩ — '+tdS+' vs expected '+exp_.toFixed(1)+' kΩ (drift)'));
      else if(tst==='warn')add('C16',2,w('써미스터 '+tdS+' — 기종 B값 차이일 수 있음, 매뉴얼 표로 재확인','Thermistor '+tdS+' — may be B-value difference, confirm with manual table'));
      else notes.push(w('써미스터 저항은 정상 범위입니다.','Thermistor resistance is within range.'));}
  }
  /* 센서 드리프트 추론 — 코드·증상은 있는데 측정값이 정상일 때 */
  if(sy.ice&&S.filter===0&&lpC==='ok'){add('C16',4,w('필터 깨끗·저압 정상인데 결빙 — 실내 코일 센서 드리프트 의심','Icing with clean filter and normal suction — suspect indoor coil sensor drift'));}
  if(codeInfo){
    if(codeInfo.famKey==='hp'&&hpC==='ok'&&(S.cond==null||S.cond===0)&&(S.odfan==null||S.odfan==='ok'||S.odfan==='na'))add('C16',5,w('고압 보호 코드인데 고압·응축기·팬이 정상 — 실외 코일 센서 의심','High-pressure code with normal head, condenser and fan — suspect outdoor coil sensor'));
    if(codeInfo.famKey==='freeze'&&lpC==='ok'&&S.filter===0)add('C16',5,w('동결 보호 코드인데 저압·필터 정상 — 실내 코일 센서 의심','Freeze-protection code with normal suction and clean filter — suspect indoor coil sensor'));
    if(codeInfo.famKey==='disc'&&lpC==='ok'&&hpC==='ok')add('C16',4,w('토출 과열 코드인데 압력 정상 — 토출 센서 이탈·드리프트 의심','Discharge-overheat code with normal pressures — suspect dislodged/drifted discharge sensor'));
  }

  /* 정렬 · 신뢰도 */
  var list=Object.keys(sc).map(function(id){return {id:id,score:sc[id],ev:ev[id]||[]};}).filter(function(x){return x.score>0;});
  list.sort(function(a,b){return b.score-a.score;});
  list=list.slice(0,5);
  list.forEach(function(x){x.conf=x.score>=7?'high':x.score>=4?'mid':'low';});

  /* 종합 상태 */
  var top=list[0],status='none';
  var judged=meas.some(function(m){return !!m.st;});
  if(hasAny&&(list.length||judged||codeInfo)){
    var measBad=meas.some(function(m){return m.st==='bad';}),measWarn=meas.some(function(m){return m.st==='warn';});
    if((codeInfo&&codeInfo.sev==='crit')||(top&&top.score>=7&&['C1','C6','C7','C5'].indexOf(top.id)>=0)||(v!=null&&(v<200||v>265)))status='crit';
    else if((top&&top.score>=5)||measBad)status='bad';
    else if((top&&top.score>=2)||measWarn||(codeInfo&&codeInfo.sev==='warn'))status='warn';
    else status='ok';
  }
  if(status!=='none'&&status!=='ok'&&(dtSt==='bad'||dtSt==='warn'||(lpC&&lpC!=='ok')||(hpC&&hpC!=='ok')))notes.unshift(t.measNote);
  return {status:status,list:list,meas:meas,warns:warns,assum:assum,notes:notes,code:codeInfo,hasAny:hasAny,
          dt:dt,lp:lp,hp:hp,ratio:ratio};
}

  if(ta!=null&&tb!=null){var d=ta-tb;var st=d<0?'bad':d>=DT_REF.good?'good':d>=DT_REF.ok?'ok':d>=DT_REF.low?'warn':'bad';
    dtEl.className='acd-dt st-'+st;dtEl.textContent=t.dt+' '+d.toFixed(1)+' °C';}
  else{dtEl.className='acd-dt';dtEl.textContent=t.dt+' —';}
  $('u-psi').classList.toggle('on',S.punit==='psi');$('u-bar').classList.toggle('on',S.punit==='bar');
  $('in-lp').placeholder=S.punit==='psi'?'psi':'bar';$('in-hpp').placeholder=S.punit==='psi'?'psi':'bar';
  /* 부품 측정 */
  $('l-parts').textContent=t.parts;$('l-cap').textContent=t.cap;$('l-capr').textContent=t.capR;$('l-capm').textContent=t.capM;
  $('l-th').textContent=t.th;$('l-thn').textContent=t.thN;$('l-thr').textContent=t.thM;$('l-tht').textContent=t.thT;$('th-hint').textContent=t.thHint;
  $('cap-hint').textContent=S.type==='inv'?t.capInv:'';
  chips($('c-thn'),TH_NOMS.map(function(n){return {id:n,label:n+' kΩ'};}),S.thn,function(id){S.thn=id;renderInputs();rerun();});
  var capr=num(S.capr),capm=num(S.capm),cl=$('cap-live');
  if(capr!=null&&capm!=null&&capr>0){var cd=(capm-capr)/capr*100,cad=Math.abs(cd);var cs=cad<=CAP_TOL?'ok':cad<=10?'warn':'bad';
    cl.className='acd-dt st-'+cs;cl.textContent=t.capLive+' '+(cd>=0?'+':'−')+cad.toFixed(1)+'%';}else{cl.className='acd-dt';cl.textContent='';}
  var thr=num(S.thr),tht=num(S.tht),tl=$('th-live');
  if(tht!=null){var ex=thermR(parseFloat(S.thn||'10'),tht);var txt=t.thLive+' '+ex.toFixed(1)+' kΩ';var ts='';
    if(thr!=null){var td=(thr-ex)/ex*100;ts=Math.abs(td)<=15?'ok':Math.abs(td)<=30?'warn':'bad';txt+=' · '+(td>=0?'+':'−')+Math.abs(td).toFixed(0)+'%';}
    tl.className='acd-dt'+(ts?' st-'+ts:'');tl.textContent=txt;}else{tl.className='acd-dt';tl.textContent='';}
  /* 코드 미리보기 · 코드표 */
  var cp=$('code-prev');
  if(S.code){var row=findCode(S.brand,S.code);
    if(row){var fam=FAM[row[3]]||FAM.other;
      cp.className='acd-cprev sev-'+row[4];
      cp.innerHTML='<b>'+esc(row[0])+'</b> <span>'+esc(S.lang==='ko'?row[1]:row[2])+'</span><i class="acd-sev">'+esc(t.sevL[row[4]])+'</i>'+
        (row[5]?'<small>'+esc(pick(row[5]))+'</small>':'');
    }else{cp.className='acd-cprev sev-none';cp.textContent=S.brand?t.codeNone:t.codeSel;}
  }else{cp.className='acd-cprev';cp.innerHTML='';}
  var tbl=S.brand?codeTables(S.brand,S.yorkFam):[];
  $('code-tbl-sum').textContent=t.codeTable+(tbl.length?' — '+brandName(S.brand)+' ('+tbl.length+')':'');
  var dl=$('code-list');dl.innerHTML=tbl.map(function(r){return '<option value="'+esc(String(r[0]).split(' / ')[0])+'">';}).join('');
  $('code-tbl').innerHTML=tbl.length?('<table class="acd-ct">'+tbl.map(function(r){return '<tr class="sev-'+r[4]+'"><td class="cd">'+esc(r[0])+'</td><td>'+esc(S.lang==='ko'?r[1]:r[2])+(r[5]?' <small>'+esc(pick(r[5]))+'</small>':'')+'</td><td class="sv"><i class="acd-sev">'+esc(t.sevL[r[4]])+'</i></td></tr>';}).join('')+'</table>'):'<p class="dim" style="padding:10px 14px">'+esc(t.codeSel)+'</p>';
}
function rerun(){if(S.shown)renderResult(true);}
function renderResult(keep){
  var t=tx(),k=S.lang==='ko',r=diagnose(),host=$('sec-res');
  S.shown=true;host.style.display='';
  if(!r.hasAny){host.innerHTML='<div class="acd-card"><div class="acd-empty">'+esc(t.noInput)+'</div></div>';return;}
  var h='';
  /* 히어로 */
  var top=r.list[0];
  var stats=[
    {k:'ΔT',v:r.dt!=null?r.dt.toFixed(1)+'°C':t.na},
    {k:k?'저압 / 고압':'Low / High',v:(r.lp!=null||r.hp!=null)?((r.lp!=null?r.lp.toFixed(0):'–')+' / '+(r.hp!=null?r.hp.toFixed(0):'–')+' psi'):t.na},
    {k:k?'전류':'Current',v:r.ratio!=null?Math.round(r.ratio*100)+'%':(num(S.cur)!=null?num(S.cur).toFixed(1)+' A':t.na)}
  ];
  h+='<div class="acd-hero st-'+r.status+'"><div class="acd-hero-k">'+esc(t.s4)+'</div>'+
     '<div class="acd-hero-row"><span class="acd-pill st-'+r.status+'">'+esc(t.status[r.status])+'</span>'+
     (S.brand?'<span class="acd-hero-b">'+esc(brandName(S.brand))+(S.model?' · '+esc(S.model):'')+((S.hp||guessHP(S.brand,S.model))?' · '+esc(S.hp||guessHP(S.brand,S.model))+'HP':'')+(S.ref?' · '+esc(S.ref):'')+'</span>':'')+'</div>'+
     '<div class="acd-hero-n">'+(top?esc(t.topCause)+': <b>'+esc(L(CAUSES[top.id]))+'</b>':esc(t.status[r.status]))+'</div>'+
     '<div class="acd-hero-m">'+stats.map(function(s){return '<div><div class="k2">'+esc(s.k)+'</div><div class="v2">'+esc(s.v)+'</div></div>';}).join('')+'</div></div>';
  /* 경고 · 가정 */
  if(r.warns.length||r.assum.length){
    h+='<div class="acd-card acd-warnbox"><div class="acd-chd">⚠️ '+esc(t.warnTitle)+'</div><ul class="acd-ul">'+r.warns.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+r.assum.map(function(x){return '<li class="dim">'+esc(x)+'</li>';}).join('')+'</ul></div>';
  }
  /* 에러코드 */
  if(r.code){var c=r.code;
    h+='<div class="acd-card"><div class="acd-chd">🔢 '+esc(t.codeTitle)+'<i class="acd-sev sev-'+c.sev+'">'+esc(t.sevL[c.sev])+'</i></div><div class="acd-cb">'+
       '<div class="acd-code-big">'+esc(c.code)+'</div><div class="acd-code-mean">'+esc(c.mean)+'</div>'+(c.note?'<div class="dim" style="margin-top:4px">'+esc(c.note)+'</div>':'')+
       '<div class="acd-kv"><b>'+esc(t.family)+'</b><span>'+esc(L(c.fam))+'</span></div>'+
       '<div class="acd-kv"><b>'+esc(t.commonCauses)+'</b><span>'+esc(L(c.fam.c))+'</span></div>'+
       '<div class="acd-kv"><b>'+esc(t.checks)+'</b><span>'+esc(L(c.fam.k))+'</span></div></div></div>';
  }
  /* 원인 목록 */
  if(r.list.length){
    h+='<div class="acd-card"><div class="acd-chd">🔍 '+esc(t.causes)+'</div><div class="acd-cb acd-causes">';
    var mx=Math.max(10,r.list[0].score);
    r.list.forEach(function(x,i){var C=CAUSES[x.id];
      h+='<details class="acd-cause tag-'+C.tag+'"'+(i===0?' open':'')+'><summary>'+
         '<span class="acd-rank">'+(i+1)+'</span><span class="acd-cn"><b>'+esc(L(C))+'</b>'+
         '<span class="acd-bar"><i style="width:'+Math.round(Math.min(100,x.score/mx*100))+'%"></i></span>'+
         '<small class="conf-'+x.conf+'">'+esc(t.conf[x.conf])+'</small></span><span class="acd-chev">›</span></summary>'+
         '<div class="acd-cd">'+
         '<div class="acd-kv"><b>'+esc(t.evidence)+'</b><ul>'+x.ev.map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul></div>'+
         '<div class="acd-kv"><b>'+esc(t.checks)+'</b><ol>'+L(C.chk).map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ol></div>'+
         '<div class="acd-kv"><b>'+esc(t.actions)+'</b><ul>'+L(C.act).map(function(e){return '<li>'+esc(e)+'</li>';}).join('')+'</ul></div>'+
         '<div class="acd-svc"><b>'+esc(t.svc)+'</b> '+esc(L(C.svc))+'</div>'+
         '</div></details>';
    });
    h+='</div></div>';
  }
  /* 측정값 판정 */
  if(r.meas.length){
    h+='<div class="acd-card"><div class="acd-chd">📏 '+esc(t.measTitle)+'</div><div class="acd-cb"><table class="acd-mt">'+
       r.meas.map(function(m){return '<tr><td><div class="ml">'+esc(m.label)+'</div>'+(m.sub?'<div class="ms">'+esc(m.sub)+'</div>':'')+'</td><td class="mv">'+esc(m.val)+'</td><td class="mr">'+esc(m.range)+'</td><td class="mst"><i class="acd-dot st-'+(m.st||'none')+'"></i></td></tr>';}).join('')+
       '</table>'+(r.notes.length?'<ul class="acd-ul dim" style="margin-top:8px">'+r.notes.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>':'')+'</div></div>';
  }else if(r.notes.length){h+='<div class="acd-card"><div class="acd-cb"><ul class="acd-ul dim">'+r.notes.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div></div>';}
  h+='<div class="acd-copyrow"><button type="button" id="btn-copy">📋 '+esc(t.copy)+'</button></div>';
  host.innerHTML=h;
  $('btn-copy').addEventListener('click',function(){copySummary(r);});
  if(!keep){var y=host.getBoundingClientRect().top+window.scrollY-70;window.scrollTo({top:y<0?0:y,behavior:'smooth'});}
}
function copySummary(r){
  var t=tx(),k=S.lang==='ko',lines=[t.sumHead];
  var unit=[S.brand?brandName(S.brand):'',S.model,S.hp?S.hp+'HP':'',S.type?(S.type==='inv'?t.inv:t.non):'',S.ref].filter(Boolean).join(' · ');
  if(unit)lines.push(unit);
  var syms=SYMS.filter(function(s){return S.sym[s];}).map(function(s){return t.symList[s];});
  if(syms.length)lines.push((k?'증상: ':'Symptoms: ')+syms.join(', '));
  r.meas.forEach(function(m){lines.push('· '+m.label+' '+m.val+(m.sub?' ('+m.sub+')':'')+(m.st?' ['+({good:k?'양호':'good',ok:k?'정상':'normal',warn:k?'주의':'caution',bad:k?'이상':'abnormal'})[m.st]+']':''));});
  if(r.code)lines.push((k?'에러코드 ':'Error code ')+r.code.code+' — '+r.code.mean);
  lines.push((k?'판정: ':'Status: ')+t.status[r.status]);
  r.list.forEach(function(x,i){lines.push((i+1)+'. '+L(CAUSES[x.id])+' ('+t.conf[x.conf]+')');});
  var txt=lines.join('\n');
  var done=function(){var b=$('btn-copy');if(b){b.textContent='✓ '+t.copied;setTimeout(function(){b.textContent='📋 '+t.copy;},1500);}};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){fallbackCopy(txt);done();});}
  else{fallbackCopy(txt);done();}
}
function fallbackCopy(txt){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}

function bindInputs(){
  var map={'in-model':'model','in-rated':'rated','in-ta':'ta','in-tb':'tb','in-amb':'amb','in-lp':'lp','in-hpp':'hpp','in-cur':'cur','in-volt':'volt','in-code':'code','in-capr':'capr','in-capm':'capm','in-thr':'thr','in-tht':'tht'};
  Object.keys(map).forEach(function(id){var el=$(id);el.addEventListener('input',function(){S[map[id]]=el.value.trim();if(id==='in-code'&&el.value.trim())S.sym.err=true;renderInputs();rerun();});});
  $('u-psi').addEventListener('click',function(){S.punit='psi';renderInputs();rerun();});
  $('u-bar').addEventListener('click',function(){S.punit='bar';renderInputs();rerun();});
  $('yk-new').addEventListener('click',function(){S.yorkFam='new';renderInputs();rerun();});
  $('yk-old').addEventListener('click',function(){S.yorkFam='old';renderInputs();rerun();});
  $('lg-ko').addEventListener('click',function(){S.lang='ko';renderAll();});
  $('lg-en').addEventListener('click',function(){S.lang='en';renderAll();});
  $('btn-run').addEventListener('click',function(){renderResult(false);});
  $('btn-reset').addEventListener('click',function(){var lang=S.lang;S=blank();S.lang=lang;
    Object.keys(map).forEach(function(id){$(id).value='';});$('sec-res').style.display='none';$('sec-res').innerHTML='';
    renderAll();window.scrollTo({top:0,behavior:'smooth'});});
}
function renderAll(){renderStatic();renderInputs();if(S.shown)renderResult(true);}
document.addEventListener('DOMContentLoaded',function(){bindInputs();renderAll();});

/* ══ 직원 허브(staffapp.html) 살아있음 감시 호환 — 데이터 로딩이 없으므로 즉시 준비 완료 ══
   허브 밖에서 단독으로 열었을 때는 아무 동작도 하지 않습니다. */
(function(){
  if(window.top===window.self)return;
  function post(m){try{window.parent.postMessage(m,'*');}catch(e){}}
  window.addEventListener('message',function(e){var d=e&&e.data;if(d&&d.hhcPing)post({hhcPong:1,ready:true});});
  post({hhcHello:1});post({hhcReady:1});
})();

</script>
