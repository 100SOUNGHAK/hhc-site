<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>에어컨 점검 · 진단 · HHC</title>
<link rel="icon" href="/icon-admin-192.png">
<link rel="apple-touch-icon" href="/icon-admin-180.png">
<meta name="theme-color" content="#0F1C3F">
<style>
/* ═══ 에어컨 점검·진단 프로그램 (ac-diagnose.html) — 관리자·직원 화면 계열 (inspect-admin 토큰) ═══
   접두사 acd- 로 통일. 빌드 도구 없음 · 파일 하나 = 화면 하나. */
:root{
  --navy:#0F1C3F;--navy2:#1b2f58;--teal:#0D9488;--teal-soft:#f0fdfb;--gold:#E8A838;
  --bg:#f0f2f8;--ink:#1a1a2e;--ink2:#5b6478;--ink3:#9ca3af;--line:#dde1ee;--soft:#f8f9fc;
  --ok:#10b981;--good:#0D9488;--warn:#f59e0b;--bad:#ef4444;
  --e1:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.16);
  --r:12px;--r-sm:9px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;word-break:keep-all}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
.dim{color:var(--ink3)}
/* ── 상단바 ── */
#acd-top{position:sticky;top:0;z-index:60;background:linear-gradient(140deg,var(--navy),var(--navy2));color:#fff;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;box-shadow:0 4px 16px -6px rgba(6,18,45,.7)}
#acd-top .mk{width:30px;height:30px;border-radius:8px;background:var(--teal);display:flex;align-items:center;justify-content:center;flex:none}
#acd-top .mk svg{width:19px;height:19px;display:block}
#acd-top .tt{flex:1;min-width:0}
#acd-top .ti{font-size:15.5px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#acd-top .su{font-size:9px;font-weight:600;color:#8fa0c9;letter-spacing:.08em;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#acd-top .lgb{display:flex;gap:3px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px;flex:none}
#acd-top .lgb button{border:none;background:none;color:#C6D5F5;font-size:11.5px;font-weight:800;border-radius:999px;padding:5px 10px}
#acd-top .lgb button.on{background:#fff;color:var(--navy)}
/* ── 본문 ── */
#app{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.acd-main{max-width:680px;margin:0 auto;padding:12px 12px 0}
#step-body{max-width:680px;margin:0 auto;padding:0 12px}
.acd-card{background:#fff;border:0.5px solid #e0e0e8;border-radius:var(--r);overflow:hidden;margin-bottom:12px;box-shadow:var(--e1)}
.acd-chd{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;min-height:42px}
.acd-chd .n{width:22px;height:22px;border-radius:6px;background:var(--teal);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex:none}
.acd-chd .acd-lnk{margin-left:auto}
.acd-cb{padding:14px}
.acd-fl{font-size:11px;font-weight:700;color:var(--ink2);letter-spacing:.02em;margin:12px 0 6px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.acd-fl:first-child,.acd-g2>div>.acd-fl,.acd-g3>div>.acd-fl,.acd-g3s>div>.acd-fl{margin-top:0}
.acd-fl small{font-weight:600;color:var(--teal);font-size:11px}
.acd-hint{font-size:11.5px;color:var(--ink3);margin-top:5px;line-height:1.5}
.acd-note{font-size:12px;color:#5b6478;background:var(--soft);border-radius:var(--r-sm);padding:9px 11px;line-height:1.55;margin-top:8px}
.acd-note.brand{background:var(--teal-soft);color:#0f5f58}
input.acd-in,textarea.acd-ta{width:100%;padding:10px 11px;font-size:15px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--soft);color:var(--ink);outline:none;font-variant-numeric:tabular-nums}
input.acd-in:focus,textarea.acd-ta:focus{border-color:var(--teal);background:#fff}
textarea.acd-ta{resize:vertical;line-height:1.55;font-size:14px}
.acd-g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acd-g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.acd-g3s{display:grid;grid-template-columns:1.6fr 1.1fr .9fr;gap:8px}
.acd-unit{position:relative}
.acd-unit input{padding-right:40px}
.acd-unit span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--ink3);font-weight:700;pointer-events:none}
/* 칩 · 세그먼트 */
.acd-chips{display:flex;flex-wrap:wrap;gap:7px}
.acd-chip{border:1.5px solid var(--line);background:#fff;color:#39415a;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;line-height:1.2;transition:transform .14s,background .14s,color .14s;text-align:left}
.acd-chip:active{transform:translateY(1px)}
.acd-chip.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 4px 12px -4px rgba(14,35,80,.5)}
.acd-segrow{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--soft)}
.acd-seg{flex:1;border:none;border-right:1px solid var(--line);background:none;padding:10px 4px;font-size:12.5px;font-weight:700;color:#39415a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.acd-seg:last-child{border-right:none}
.acd-seg.on{background:var(--navy);color:#fff}
.acd-seg.on.sem-ok,.acd-chip.on.sem-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.acd-seg.on.sem-warn,.acd-chip.on.sem-warn{background:#F0B429;border-color:#F0B429;color:#3A2A00}
.acd-seg.on.sem-bad,.acd-chip.on.sem-bad{background:var(--bad);border-color:var(--bad);color:#fff}
.acd-oprow{padding:9px 0;border-top:1px solid #eef0f5}
.acd-oprow .acd-chk-n{margin-bottom:6px}
.acd-oprow .acd-chip{padding:7px 11px;font-size:12.5px}
.acd-vis{display:grid;gap:10px}
.acd-vis>div>.acd-fl{margin:0 0 5px}
.acd-ut{display:inline-flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px;margin-left:auto}
.acd-ut button{border:none;background:none;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;color:var(--ink3)}
.acd-ut button.on{background:var(--navy);color:#fff}
.acd-dt{margin-top:8px;font-size:13px;font-weight:800;color:var(--ink3);font-variant-numeric:tabular-nums;line-height:1.5}
.acd-dt:empty{display:none}
.acd-dt.multi{font-size:12px;font-weight:700}
.acd-dt.st-good,.acd-dt .st-good{color:var(--good)}.acd-dt.st-ok,.acd-dt .st-ok{color:var(--ok)}.acd-dt.st-warn,.acd-dt .st-warn{color:#b45309}.acd-dt.st-bad,.acd-dt .st-bad{color:var(--bad)}
.acd-lnk{border:none;background:none;color:var(--teal);font-size:12.5px;font-weight:800;padding:4px 6px}
.acd-lnk.danger{color:var(--bad)}
.acd-lnk.light{color:#C6D5F5}
/* 현장 바 · 기기 탭 · 단계 */
.acd-sitebar{max-width:680px;margin:0 auto;padding:10px 12px 0}
.acd-unitrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px;align-items:center}
.acd-unitrow::-webkit-scrollbar{display:none}
.acd-utab{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:12.5px;font-weight:800;color:#39415a;white-space:nowrap}
.acd-utab.on{border-color:var(--navy);background:var(--navy);color:#fff}
.acd-utab.add{border-style:dashed;color:var(--teal);border-color:#9fd9d0;background:var(--teal-soft)}
.acd-biz{flex:0 0 auto;margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:800;color:var(--ink3)}
.acd-biz.on{background:var(--gold);border-color:var(--gold);color:#3d2c00}
.acd-steps{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:50;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:8px 12px;background:rgba(240,242,248,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:680px;margin:0 auto}
.acd-steps::-webkit-scrollbar{display:none}
.acd-step{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px 7px 7px;font-size:12px;font-weight:800;color:#39415a;white-space:nowrap}
.acd-step b{width:20px;height:20px;border-radius:50%;background:#e5e8f0;color:#5b6478;font-size:11px;display:flex;align-items:center;justify-content:center}
.acd-step.done b{background:var(--teal);color:#fff}
.acd-step.on{border-color:var(--navy);background:var(--navy);color:#fff}
.acd-step.on b{background:#fff;color:var(--navy)}
.acd-stepnav{max-width:680px;margin:0 auto;padding:2px 12px 16px;display:flex;justify-content:space-between;gap:9px}
.acd-stepnav button{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:13px;padding:12px 16px;font-size:14px;font-weight:900;transition:transform .14s}
.acd-stepnav button.prim{background:linear-gradient(140deg,#0E2350,#1b2f58);color:#fff;border-color:transparent;box-shadow:0 6px 16px -6px rgba(14,35,80,.7);flex:1;max-width:60%}
.acd-stepnav button:active{transform:translateY(2px)}
/* 문진 · 체크리스트 */
.acd-symg{margin-top:8px;padding-top:8px;border-top:1px solid #eef0f5}
.acd-symg:first-of-type{border-top:none;padding-top:0}
.acd-symg-t{font-size:11px;font-weight:800;color:var(--teal);margin:4px 0 6px;letter-spacing:.02em}
.acd-chkg{margin-top:12px}
.acd-chk{display:grid;grid-template-columns:1fr 168px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid #eef0f5}
.acd-chk-n b{display:block;font-size:13px;font-weight:700;line-height:1.3}
.acd-chk-n small{display:block;font-size:11px;color:var(--ink3);line-height:1.4;margin-top:2px}
.acd-chk .acd-segrow{border-radius:8px}
.acd-chk .acd-seg{padding:8px 3px;font-size:11.5px}
.acd-grp{margin-top:14px;padding-top:12px;border-top:1px solid #eef0f5}
.acd-grp:first-of-type,.acd-note+.acd-grp{border-top:none;padding-top:0;margin-top:0}
.acd-grp-t{display:flex;align-items:center;font-size:12.5px;font-weight:800;color:var(--ink);margin-bottom:8px}
.acd-ledrow{margin-top:12px}
.acd-ledbox{margin-top:8px;background:var(--soft);border-radius:var(--r-sm);padding:10px 11px}
.acd-ledbox .acd-kv{margin-top:0}
/* 코드 미리보기 · 코드표 */
.acd-cprev{margin-top:8px;border-radius:var(--r-sm);padding:0;font-size:13px;line-height:1.5}
.acd-cprev:not(:empty){padding:9px 11px}
.acd-cprev b{font-size:14px;font-variant-numeric:tabular-nums;margin-right:6px}
.acd-cprev small{display:block;color:var(--ink2);margin-top:2px;font-size:11.5px}
.acd-cprev.sev-crit{background:#FEF2F2;color:#7f1d1d}.acd-cprev.sev-warn{background:#FFFBEB;color:#78350f}.acd-cprev.sev-info,.acd-cprev.sev-none{background:#eef0f5;color:var(--ink2)}
.acd-sev{display:inline-block;font-style:normal;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px;background:#e5e7eb;color:#374151;white-space:nowrap}
.sev-crit .acd-sev,.acd-sev.sev-crit{background:var(--bad);color:#fff}
.sev-warn .acd-sev,.acd-sev.sev-warn{background:#F0B429;color:#3A2A00}
details.acd-more{margin-top:10px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:#fff}
details.acd-more>summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--teal);background:var(--teal-soft);display:flex;justify-content:space-between;align-items:center}
details.acd-more>summary::-webkit-details-marker{display:none}
details.acd-more>summary:after{content:'›';font-size:16px;transform:rotate(90deg);transition:transform .15s}
details.acd-more[open]>summary:after{transform:rotate(-90deg)}
.acd-ct{width:100%;border-collapse:collapse;font-size:12px}
.acd-ct td{padding:7px 10px;border-top:1px solid #eef0f5;vertical-align:top;line-height:1.45}
.acd-ct td.cd{font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums;width:1%}
.acd-ct td.sv{white-space:nowrap;width:1%;text-align:right}
.acd-ct td.sv .acd-sev{margin-left:0}
.acd-ct small{display:block;color:var(--ink3);font-size:11px;white-space:normal}
.acd-ct-wrap{max-height:360px;overflow:auto}
.acd-ct-wrap.tall{max-height:520px}
.acd-parts{padding:12px 12px 14px;background:#fff}
/* 결과 */
.acd-hero{background:linear-gradient(140deg,#0E2350,#16346E 65%,#1D4090);color:#fff;border-radius:16px;padding:16px 16px 14px;margin-bottom:12px;box-shadow:0 3px 8px rgba(6,18,45,.3),0 18px 34px -14px rgba(6,18,45,.7)}
.acd-hero-k{font-size:10px;font-weight:800;letter-spacing:.14em;color:#9FB6E8}
.acd-hero-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:8px}
.acd-hero-b{font-size:12px;color:#C6D5F5;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px}
.acd-hero-n{font-size:16px;font-weight:700;margin-top:10px;line-height:1.35;letter-spacing:-.01em;color:#DCE6FA}
.acd-hero-n b{color:#fff;font-weight:900}
.acd-hero-m{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.15);border-radius:11px;overflow:hidden;margin-top:13px}
.acd-hero-m.m4{grid-template-columns:repeat(4,1fr)}
.acd-hero-m>div{background:rgba(255,255,255,.06);padding:9px 8px;min-width:0}
.acd-hero-m .k2{font-size:9.5px;font-weight:800;color:#A9BEE9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acd-hero-m .v2{font-size:13px;font-weight:900;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.acd-pill{display:inline-block;font-size:11.5px;font-weight:900;border-radius:999px;padding:5px 12px;background:#e5e7eb;color:#374151}
.acd-pill.sm{font-size:10.5px;padding:3px 9px}
.acd-pill.st-ok{background:var(--ok);color:#fff}.acd-pill.st-warn{background:#F0B429;color:#3A2A00}.acd-pill.st-bad{background:#F97316;color:#fff}.acd-pill.st-crit{background:var(--bad);color:#fff}
.acd-warnbox .acd-chd{background:#FFF8EC;color:#8A5A00}
.acd-ul{padding-left:18px;font-size:13.5px;line-height:1.55;margin:0}
.acd-ul li{margin:3px 0}
.acd-ul li.dim{color:var(--ink2)}
.acd-empty{padding:26px 14px;text-align:center;font-size:13.5px;color:var(--ink2);line-height:1.6}
.acd-code-big{font-size:26px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.acd-code-mean{font-size:15px;font-weight:700;margin-top:4px;color:var(--ink)}
.acd-kv{margin-top:10px;font-size:13.5px;line-height:1.55}
.acd-kv>b{display:block;font-size:11px;font-weight:800;color:var(--teal);letter-spacing:.02em;margin-bottom:2px}
.acd-kv ul,.acd-kv ol{padding-left:18px}
.acd-kv li{margin:2px 0}
.acd-causes{padding:6px 8px 8px}
.acd-cause{border-radius:10px;border:1px solid transparent}
.acd-cause+.acd-cause{margin-top:2px}
.acd-cause[open]{background:var(--soft);border-color:#e8ebf3}
.acd-cause>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 8px}
.acd-cause>summary::-webkit-details-marker{display:none}
.acd-rank{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.acd-cause:nth-child(n+2) .acd-rank{background:#5b6478}
.acd-cn{flex:1;min-width:0;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.acd-cn b{font-size:14px;font-weight:800;letter-spacing:-.01em;grid-column:1/3;line-height:1.3}
.acd-bar{height:5px;border-radius:999px;background:#e5e8f0;overflow:hidden}
.acd-bar i{display:block;height:100%;background:var(--teal);border-radius:999px}
.acd-cn small{font-size:10.5px;font-weight:800;white-space:nowrap}
.conf-high{color:var(--bad)}.conf-mid{color:#b45309}.conf-low{color:var(--ink3)}
.acd-chev{font-size:18px;color:#c3c8d4;transform:rotate(90deg);transition:transform .15s;flex:none;padding:0 2px}
.acd-cause[open] .acd-chev{transform:rotate(-90deg)}
.acd-cd{padding:0 10px 12px 42px}
.acd-svc{margin-top:10px;font-size:12.5px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.acd-svc b{color:var(--gold);font-weight:800;margin-right:4px}
.acd-cause.tag-clean .acd-svc{border-color:#b7e6dd;background:var(--teal-soft)}
.acd-mt{width:100%;border-collapse:collapse;font-size:12.5px}
.acd-mt td{padding:8px 4px;border-top:1px solid #eef0f5;vertical-align:middle}
.acd-mt tr:first-child td{border-top:none}
.acd-mt tr.grp td{padding:9px 4px 3px;font-size:10.5px;font-weight:800;color:var(--teal);letter-spacing:.03em;border-top:none}
.acd-mt .ml{font-weight:700}
.acd-mt .ms{font-size:11px;color:var(--ink3);margin-top:1px}
.acd-mt .mv{font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;font-size:13.5px}
.acd-mt .mv.good{color:var(--good)}.acd-mt .mv.badt{color:var(--bad)}
.acd-mt .mv small{font-weight:700;color:var(--ink3)}
.acd-mt .mr{font-size:11px;color:var(--ink3);text-align:right;max-width:120px;line-height:1.35}
.acd-mt .mst{width:22px;text-align:right}
.acd-mt.cmp td{text-align:right}.acd-mt.cmp td.ml{text-align:left}
.acd-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#d1d5db;vertical-align:middle}
.acd-dot.st-good,.acd-dot.st-ok{background:var(--ok)}.acd-dot.st-warn{background:var(--warn)}.acd-dot.st-bad,.acd-dot.st-crit{background:var(--bad)}
.acd-rec{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid #eef0f5;cursor:pointer}
.acd-rec:first-of-type{border-top:none}
.acd-rec input{margin-top:4px;width:18px;height:18px;accent-color:var(--teal);flex:none}
.acd-rec-b{flex:1;min-width:0}
.acd-rec-b b{display:block;font-size:13.5px;font-weight:800;line-height:1.3}
.acd-rec-b small{display:block;font-size:11.5px;color:var(--ink2);line-height:1.45;margin-top:2px}
.acd-rec:not(.on) .acd-rec-b{opacity:.55}
.acd-rec-p{font-weight:900;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:13.5px}
.acd-rec-t{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;font-weight:700;color:var(--ink2)}
.acd-rec-t b{font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.acd-copyrow{display:flex;justify-content:flex-end;gap:8px;margin:-4px 0 12px;flex-wrap:wrap}
.acd-copyrow button,.acd-btns button{border:1.5px solid var(--line);background:#fff;color:var(--ink2);border-radius:999px;padding:9px 14px;font-size:12.5px;font-weight:800}
.acd-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acd-btns button.prim{background:#25D366;border-color:#25D366;color:#fff}
/* 기록 */
.acd-recrow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid #eef0f5}
.acd-recrow:first-of-type{border-top:none}
.acd-recrow.cur{background:var(--teal-soft);margin:0 -14px;padding:10px 14px;border-radius:0}
.acd-recrow-b{flex:1;min-width:0}
.acd-recrow-b b{display:block;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acd-recrow-b b em{font-style:normal;font-size:10px;color:var(--teal);margin-left:6px}
.acd-recrow-b small{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.acd-recrow-a{display:flex;gap:2px;flex:none}
/* 참고 */
.acd-ref{padding:10px 0;border-top:1px solid #eef0f5;font-size:12.5px;line-height:1.55}
.acd-ref:first-child{border-top:none;padding-top:0}
.acd-ref b{display:block;font-size:12.5px;font-weight:800;margin-bottom:3px}
.acd-ref p{color:var(--ink2);margin-top:4px}
.acd-pt{border-collapse:collapse;margin-top:4px;font-size:12px;font-variant-numeric:tabular-nums}
.acd-pt th,.acd-pt td{padding:4px 10px 4px 0;text-align:left;font-weight:600;vertical-align:top}
.acd-pt th{color:var(--ink3);font-size:11px}
.acd-pt td:first-child{font-weight:800;white-space:nowrap}
.acd-pt.wide{width:100%}
.acd-pt.wide td{padding:5px 8px 5px 0;border-top:1px solid #eef0f5;font-weight:600;color:var(--ink2)}
.acd-pt.wide td:first-child{color:var(--ink)}
details.acd-refbox>summary{list-style:none;cursor:pointer}
details.acd-refbox>summary::-webkit-details-marker{display:none}
details.acd-refbox>summary .acd-chd:after{content:'›';margin-left:auto;font-size:18px;transform:rotate(90deg);transition:transform .15s}
details.acd-refbox[open]>summary .acd-chd:after{transform:rotate(-90deg)}
/* 하단 탭 */
#acd-nav{position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);border-top:1px solid var(--line);box-shadow:0 -14px 30px -16px rgba(14,35,80,.45)}
#acd-nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:12px;font-size:11px;font-weight:800;color:var(--ink3)}
#acd-nav button i{font-style:normal;font-size:18px;line-height:1}
#acd-nav button.on{color:var(--navy);background:#eef1f8}
#acd-toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--navy);color:#fff;font-size:13px;font-weight:800;border-radius:999px;padding:9px 16px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:90;box-shadow:0 8px 24px -8px rgba(6,18,45,.7)}
#acd-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:820px){input:not([type=checkbox]):not([type=radio]),select,textarea{font-size:16px!important}}
@media (max-width:400px){.acd-g3{grid-template-columns:1fr 1fr}.acd-g3s{grid-template-columns:1fr 1fr}.acd-g3s>div:first-child{grid-column:1/3}.acd-chk{grid-template-columns:1fr 150px}.acd-seg{font-size:11.5px}.acd-hero-m.m4{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{#acd-top,#acd-nav,.acd-btns,.acd-copyrow,.acd-steps,.acd-stepnav,#acd-toast{display:none!important}#app{padding:0}.acd-card,.acd-hero{break-inside:avoid;box-shadow:none}body{background:#fff}}
</style>
</head>

  mhi:{ko:'유선 리모컨은 E코드 표시. 무선 리모컨 모델은 RUN(운전)·TIMER 램프 점멸 패턴으로 판독 (아래 [ ] 표기).',
       en:'Wired remote shows the E-code. Wireless-remote models show RUN / TIMER lamp patterns (in [ ] below).'},
  lg:{ko:'실내기 표시부에 「CH」와 숫자가 번갈아 표시. LED만 있는 모델은 LED 점멸(첫 LED = 1의 자리, 둘째 = 10의 자리). CH61은 자동 해제 안 됨 → 3분 전원 리셋. 구형 비인버터의 C1·C5·C6 등 한 자리 코드는 뜻이 다름.',
      en:'Display alternates "CH" and the number. LED-only units blink LEDs (1st = ones, 2nd = tens). CH61 does not self-clear → 3-min power reset. Old non-inverter single-character codes (C1, C5, C6…) have different meanings.'},
  samsung:{ko:'2자리 표시부는 「E1」↔「21」 교대 = E121. 4자리 표시부는 「E121」. CF(필터)·Cl(자동청소)·dF(제상)는 고장 아님. 구형 비인버터의 E1/E5/E6/E7은 센서 코드.',
           en:'2-digit display alternates "E1" / "21" = E121; 4-digit shows "E121". CF, Cl, dF are indicators, not faults. Old non-inverter E1/E5/E6/E7 are sensor codes.'},
  midea:{ko:'7세그먼트에 E/F/P 코드 또는 신형 4자 코드(EH/EL/EC/PH/PL/PC). 표시부 없는 모델: 타이머 램프 꺼짐 = E, 켜짐 = F, 점멸 = P + 운전 램프 점멸 횟수. 괄호는 신형 코드.',
         en:'7-segment shows E/F/P or new 4-char codes (EH/EL/EC/PH/PL/PC). No display: timer lamp OFF = E, ON = F, blinking = P, with run-lamp blink count. Brackets = new-format code.'},
  gree:{ko:'온도 표시부에 코드 표시 (여러 개면 순환). 표시부 없는 모델은 램프 점멸 횟수(E1 = 1회 … E8 = 8회). H3·H5·U3 등은 압축기 정지 약 200초 후에 표시됨. Gree가 만든 Sharp 모델도 같은 코드.',
        en:'Code shows in the temperature display (cycles if several). No display: lamp blink count (E1 = 1 … E8 = 8). H3, H5, U3 etc. appear ~200 s after the compressor stops. Gree-built Sharp models use the same codes.'},
  york:{ko:'두 계열이 있음 — ① 2015년 이후 YWM3F/YWM5J (Johnson Controls, Haier 계열): 실내기 표시부에 E/F 숫자 코드. ② 2015년 이전 OYL(Daikin 계열) 모델: Daikin과 같은 코드(A5·U4 등)를 리모컨 CANCEL 5초로 조회. 코드 형태로 구분하세요.',
        en:'Two families — ① YWM3F/YWM5J from 2015 (Johnson Controls, Haier platform): E/F numeric codes on the indoor display. ② Pre-2015 OYL (Daikin platform): Daikin-style codes (A5, U4…) read via remote CANCEL 5 s. Tell them apart by code format.'},
  acson:{ko:'Daikin 계열(OYL·DAMA) — Daikin과 같은 코드·조회법(리모컨 CANCEL 5초). 구형 AWM(LED 표시) 모델은 E1~EE 별도 코드 — 표 하단 「구형」 항목 참조.',
         en:'Daikin platform (OYL / DAMA) — same codes and remote CANCEL 5 s method. Old AWM (LED) models use a separate E1–EE set — see "legacy" entries.'},
  toshiba:{ko:'고장 시 실내기 램프 전체가 빠르게 점멸 + 삐 소리. 리모컨 CHECK(핀) → 「00」 → TIMER ▲/▼로 이동, 실내기가 연속 삐 소리를 내는 코드가 저장 코드. CLR로 소거(7F). 신형은 01-xx(실내)/02-xx(실외)/03-xx(압축기) 접두. 구형(SKV)은 코드 뜻이 다름.',
           en:'On a fault all indoor lamps flash fast + beep. Remote CHECK (pin) → "00" → step with TIMER ▲/▼; continuous beep = stored code. CLR clears (7F). Newer units prefix 01-xx indoor / 02-xx outdoor / 03-xx compressor. Older SKV models use a different map.'},
  sharp:{ko:'정지 상태에서 AUX(비상운전) 버튼 5초 이상 → 운전(적)·타이머(주황)·플라즈마(청/녹) 램프 점멸로 「주-부」 번호 표시. 전원을 끄면 이력이 사라지므로 차단기 내리기 전에 확인. Gree가 만든 Sharp(AY-X…RU 등)는 Gree 코드 사용.',
         en:'With the unit stopped hold AUX 5 s+ → Operation (red), Timer (orange), Plasmacluster (blue/green) lamps flash the "main-sub" number. Memory is lost on power-off — read before switching off the breaker. Gree-built Sharp (AY-X…RU) uses Gree codes.'},
  haier:{ko:'실내기 표시부에 E/F 숫자 코드. (York 2015년 이후 모델과 같은 표)',en:'E/F numeric codes on the indoor display (same table as York from 2015).'},
  other:{ko:'등록된 코드표가 없는 브랜드 — 증상·측정값으로 진단하세요. 코드가 있으면 제조사 매뉴얼을 확인하세요.',en:'No code table for this brand — diagnose from symptoms and measurements. Check the manufacturer manual for codes.'}

/* ── 냉매 포화 온도표 (°C → psig) 0~60°C, 5°C 간격 ─────────────────── */
var PT={
  R32:  [103.2,123.5,145.9,171.2,199.2,230.3,264.8,302.9,344.9,390.8,441.3,496.4,556.6],
  R410A:[101.1,120.6,142.7,167.3,194.8,225.1,258.7,295.7,336.3,380.9,429.6,482.7,540.6],
  R22:  [57.5, 70.0, 84.0, 99.7,117.3,136.7,158.2,181.8,207.7,236.1,267.0,300.7,337.3]
};
/* psig → 포화온도(°C), 표 밖은 외삽 */
function satTemp(ref,psi){
  var t=PT[ref];if(!t||!(psi>0))return null;
  if(psi<=t[0])return 0-(t[0]-psi)/(t[1]-t[0])*5;
  for(var i=1;i<t.length;i++){if(psi<=t[i])return (i-1)*5+(psi-t[i-1])/(t[i]-t[i-1])*5;}
  var n=t.length-1;return n*5+(psi-t[n])/(t[n]-t[n-1])*5;
}

function guessHP(brand,model){
  if(!model)return null;
  var m=String(model).toUpperCase();
  var map=brand==='daikin'?HP_MAP.daikin:HP_MAP.generic;
  var nums=m.match(/\d{2,3}/g)||[];
  for(var i=0;i<nums.length;i++){
    var n=parseInt(nums[i],10);
    if(map[n])return map[n];
    if(brand!=='daikin'&&nums[i].length===3&&HP_MAP.generic[parseInt(nums[i].slice(0,2),10)])return HP_MAP.generic[parseInt(nums[i].slice(0,2),10)];
  }
  return null;
}

 refcycle:{ko:'냉동 사이클 판정 (냉방 · 최대 운전)',en:'Refrigeration-cycle judgement (cooling · max load)',rows:[['과열도 SH|Superheat','인버터(EEV) 3~8°C · 일반형(모세관) 8~14°C · 1°C 이하 = 액 복귀 위험|Inverter (EEV) 3–8 °C · fixed orifice 8–14 °C · ≤1 °C = floodback risk'],['과냉도 SC|Subcooling','4~10°C (3 미만 부족 · 12 초과 과다)|4–10 °C (<3 low · >12 high)'],['토출관 온도|Discharge temp','60~95°C 정상 · 105°C 이상 과열 · 45°C 이하(압축기 운전 중) 액 복귀|60–95 °C normal · ≥105 °C overheat · ≤45 °C liquid return'],['압축비|Compression ratio','(고압+14.7)/(저압+14.7) = 2.5~4.0 정상 · 5 이상 = 고압 과다·저압 과소 · 2 미만 = 압축 불량|2.5–4.0 normal · ≥5 high head/low suction · <2 weak compression'],['조합|Matrix','SH↑ SC↓ = 냉매 부족 · SH↑ SC↑ = 막힘 · SH↓ SC↑ = 과충전 · SH↓ SC↓ = 압축 불량 · SH↓ 저압↓ ΔT↑ = 풍량 부족|SH↑ SC↓ shortage · SH↑ SC↑ restriction · SH↓ SC↑ overcharge · SH↓ SC↓ weak compressor · SH↓ suction↓ ΔT↑ low airflow']]}
};

</script>
<script>
/* ══════════════════════════════════════════════════════════════════
   진단 엔진 v2 — 기기 1대(unit)의 입력 → 판정 결과
   순수 함수: 화면(DOM)을 건드리지 않는다.
   ══════════════════════════════════════════════════════════════════ */
function numv(v){if(v===''||v==null)return null;var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;}
function pickL(str,lang){if(!str)return '';var p=String(str).split('|');return lang==='ko'?p[0]:(p[1]||p[0]);}
function LL(o,lang){return o?(lang==='ko'?o.ko:o.en):'';}
function hpOf(u){return u.hp||guessHP(u.brand,u.model);}
function brandNameOf(id,lang){var b=BRANDS.find(function(x){return x.id===id;});return b?pickL(b.name,lang):'';}
function typeName(id,lang){var t=TYPES.find(function(x){return x.id===id;});return t?LL(t,lang):'';}
function symLabel(id,lang){for(var g=0;g<SYMG.length;g++){var it=SYMG[g].items.find(function(x){return x[0]===id;});if(it)return lang==='ko'?it[1]:it[2];}return id;}
function normCodeV(c){return String(c||'').toUpperCase().replace(/\s+/g,'');}
function codeTablesOf(u){return codeTables(u.brand,u.yorkFam);}
function findCodeIn(tbl,code){
  var q=normCodeV(code);if(!q)return null;
  var qs=[q],m;
  if((m=q.match(/^CH(\d)$/)))qs.push('CH0'+m[1]);
  if((m=q.match(/^0[123]-?([0-9A-Z]{2})$/)))qs.push(m[1]);
  if((m=q.match(/^E(\d)-?(\d\d)$/)))qs.push('E'+m[1]+m[2]);
  if((m=q.match(/^E:?(\d\d)$/)))qs.push('E:'+m[1]);
  for(var i=0;i<tbl.length;i++){
    var keys=String(tbl[i][0]).toUpperCase().split('/');
    for(var k=0;k<keys.length;k++){
      var key=keys[k].replace(/\s+/g,'');
      if(key.indexOf('~')>=0){var r=key.split('~'),a=r[0].match(/^(\d+)-(\d+)$/),b=r[1].match(/^(\d+)-(\d+)$/);
        for(var j=0;j<qs.length;j++){var x=qs[j].match(/^(\d+)-(\d+)$/);if(a&&b&&x&&x[1]===a[1]&&+x[2]>=+a[2]&&+x[2]<=+b[2])return tbl[i];}
        continue;}
      for(var j2=0;j2<qs.length;j2++){if(key===qs[j2])return tbl[i];}
    }
    var al=String(tbl[i][5]||'').match(/\(([A-Z]{2}\s?[0-9A-Z]{2})\)/i);
    if(al){var alk=al[1].toUpperCase().replace(/\s+/g,'');for(var j3=0;j3<qs.length;j3++){if(alk===qs[j3])return tbl[i];}}
  }
  return null;
}
function findCodeU(u,code){return findCodeIn(codeTablesOf(u),code);}

/* 자유 입력 증상 → 증상 id */
function symFromText(txt){var out=[];if(!txt)return out;SYM_KW.forEach(function(p){if(p[0].test(txt)&&out.indexOf(p[1])<0)out.push(p[1]);});return out;}

/* 램프 점멸 → 코드/계열 해석 */
function blinkLookup(u,lang){
  var op=u.op||{};if(!op.led)return null;
  var key=u.brand==='york'?(u.yorkFam==='old'?'acson':'yorknew'):u.brand;
  var B=BLINK[key];var k=lang==='ko';
  if(!B)return {kind:'none',text:k?'이 브랜드의 램프 점멸표가 없습니다 — 제조사 매뉴얼을 확인하세요.':'No lamp-blink table for this brand — check the manufacturer manual.'};
  var res={kind:B.kind,text:LL(B,lang),code:null,fam:null,sev:null,mean:null};
  var cnt=parseInt(op.cnt,10),cnt2=parseInt(op.cnt2,10);
  function byCode(code){if(!code)return;var row=findCodeU(u,code);if(row){res.code=row[0];res.mean=k?row[1]:row[2];res.fam=row[3];res.sev=row[4];}else{res.code=code;}}
  if(B.kind==='count'){
    var mode=(B.modes.find(function(m){return m.id===op.mode2;})||B.modes[0]);res.mode=mode;
    if(!isNaN(cnt)||op.aux==='on'||op.aux==='cont'){
      var row=mode.tbl.find(function(r){
        if(r[0]==='*')return op.aux==='cont';
        if(r[0]==='0'&&op.aux==='on'&&mode.id==='runflash_timer')return true;
        if(/\+$/.test(r[0]))return !isNaN(cnt)&&cnt>=parseInt(r[0],10);
        return !isNaN(cnt)&&parseInt(r[0],10)===cnt;});
      if(row){res.match=row;res.fam=row[6];res.sev=row[7];res.mean=(k?row[4]:row[5])||null;
        if(row[3]){var cr=findCodeU(u,row[3]);if(cr){res.code=cr[0];if(!res.mean)res.mean=k?cr[1]:cr[2];res.fam=res.fam||cr[3];}else res.code=row[3];}
        if(!res.mean&&res.fam)res.mean=LL(FAM[res.fam],lang);}
      else if(!isNaN(cnt))res.nomatch=true;
    }
  }else if(B.kind==='midea'){
    if(!isNaN(cnt)&&op.aux){var code=(B.tbl[op.aux]||{})[cnt];if(code){byCode(code);}else res.nomatch=true;}
  }else if(B.kind==='gree'){
    if(!isNaN(cnt)&&op.lamp){var code2=(B.tbl[op.lamp]||{})[cnt];if(code2){byCode(code2);}else res.nomatch=true;}
  }else if(B.kind==='digits'){
    if(!isNaN(cnt)){if(op.mode2==='old'){var o=B.old.find(function(r){return parseInt(r[0],10)===cnt;});if(o)byCode(o[1]);else res.nomatch=true;}
      else{var tens=isNaN(cnt2)?0:cnt2;byCode('CH'+(tens*10+cnt<10?'0':'')+(tens*10+cnt));}}
  }else if(B.kind==='digits2'){
    if(!isNaN(cnt)&&!isNaN(cnt2))byCode('E:'+cnt+cnt2);
  }else if(B.kind==='block'||B.kind==='combo'){
    if(op.aux){var rb=B.tbl.find(function(r){return r[0]===op.aux;});if(rb){res.match=rb;res.fam=rb[6];res.sev=rb[7];res.mean=k?rb[4]:rb[5];if(rb[3])byCode(rb[3]);}}
  }
  return res;
}

/* ── 본 진단 ─────────────────────────────────────────────────────── */
function diagnoseUnit(u,lang){
  var k=lang==='ko';function w(ko,en){return k?ko:en;}
  var sc={},ev={},meas=[],warns=[],assum=[],notes=[],hasAny=false;
  function add(id,p,why){sc[id]=(sc[id]||0)+p;if(why){ev[id]=ev[id]||[];if(ev[id].indexOf(why)<0)ev[id].push(why);}}
  function M(o){meas.push(o);}
  var m=u.m||{},sy=u.sym||{},op=u.op||{},vis=u.vis||{};
  var inv=u.inv,type=u.type||'wall';
  var symText=symFromText(u.symText);symText.forEach(function(s){if(!sy[s])sy[s]=true;});
  var symList=Object.keys(sy).filter(function(s){return sy[s];});
  if(symList.length||(u.symText||'').trim())hasAny=true;

  /* ── 1. 공기측 ───────────────────────────────────────────────── */
  var ta=numv(m.ta),tb=numv(m.tb),dt=null,dtSt=null,rh=numv(m.rh);
  var dtAdj=0;if(rh!=null){dtAdj=rh>=75?-3:rh>=65?-2:rh>=55?-1:rh<=45?1:0;}
  var G=DT_REF.good+dtAdj,O=DT_REF.ok+dtAdj,Lw=DT_REF.low+dtAdj;
  if(ta!=null&&tb!=null){hasAny=true;dt=ta-tb;
    if(dt<0)warns.push(w('흡입온도가 토출온도보다 낮습니다 — 두 값이 바뀌지 않았는지 확인하세요.','Intake is colder than discharge — check the values are not swapped.'));
    else{dtSt=dt>=G?'good':dt>=O?'ok':dt>=Lw?'warn':'bad';
      M({g:'air',label:w('온도차 ΔT (흡입−토출)','ΔT (intake − discharge)'),val:dt.toFixed(1)+' °C',sub:rh!=null?w('실내 습도 '+rh.toFixed(0)+'% 보정 기준 '+(dtAdj?('('+(dtAdj>0?'+':'')+dtAdj+'°C)'):'(보정 없음)'),'RH '+rh.toFixed(0)+' % adjusted '+(dtAdj?('('+(dtAdj>0?'+':'')+dtAdj+' °C)'):'(none)')):null,range:'≥'+G+' · '+O+'~'+G+' · <'+O,st:dtSt});
      var d=dt.toFixed(1);
      if(dtSt==='bad'){add('C1',2,w('온도차 '+d+'°C — 매우 낮음, 냉방 능력 크게 저하','ΔT '+d+' °C — very low'));add('C6',2,w('온도차 '+d+'°C — 압축기 미가동·압축 불량 가능','ΔT '+d+' °C — compressor may not be pumping'));add('C2',1,w('온도차 저하','Low ΔT'));add('C14',1,w('냉방 모드·설정온도 확인','Check mode / set point'));}
      else if(dtSt==='warn'){add('C1',1,w('온도차 '+d+'°C — 기준 미달','ΔT '+d+' °C — below normal'));add('C4',1,w('온도차 '+d+'°C — 증발기 오염 시 저하','ΔT '+d+' °C — dirty evaporator lowers it'));add('C2',1,w('온도차 저하','Low ΔT'));add('C15',1,w('온도차 저하 — 부하 과다 가능','Low ΔT — possible high load'));}
      if(dt>=G+5){if((m.filter||0)>=1||sy.weakair||sy.ice){M({g:'air',label:w('온도차 과대','ΔT too high'),val:d+' °C',range:'<'+(G+5),st:'warn'});add('C4',3,w('온도차 '+d+'°C 과대 + 풍량 부족 징후 — 코일 과냉(결빙 위험)','ΔT '+d+' °C too high with low-airflow signs — coil too cold'));}
        else add('C4',1,w('온도차 '+d+'°C — 기준 이상, 풍량 확인','ΔT '+d+' °C — above range, check airflow'));}
    }
  }else if(ta!=null||tb!=null)warns.push(w('흡입·토출 온도를 둘 다 입력해야 온도차를 판정합니다.','Enter both intake and discharge temperatures.'));
  /* 토출 풍속 */
  var vel=numv(m.vel);
  if(vel!=null){hasAny=true;var VR=VEL_REF[type]||VEL_REF.wall;var vSt=vel<VR[0]*0.8?'bad':vel<VR[0]?'warn':vel>VR[1]?'warn':'ok';
    M({g:'air',label:w('토출 풍속 (강풍)','Discharge air velocity (high fan)'),val:vel.toFixed(1)+' m/s',range:VR[0]+'~'+VR[1]+' m/s',st:vSt});
    if(vSt==='bad')add('C4',4,w('토출 풍속 '+vel.toFixed(1)+'m/s — 매우 낮음: 블로워·필터·증발기 오염 또는 팬 모터','Velocity '+vel.toFixed(1)+' m/s — very low: blower/filter/coil dirt or fan motor'));
    else if(vSt==='warn'&&vel<VR[0])add('C4',2,w('토출 풍속 '+vel.toFixed(1)+'m/s — 낮음','Velocity '+vel.toFixed(1)+' m/s — low'));
    else if(vSt==='ok')notes.push(w('토출 풍속은 정상 범위입니다.','Air velocity is within range.'));}
  /* 증발기 온도 분포 */
  var evs=(m.ev||[]).map(numv).filter(function(x){return x!=null;});
  if(evs.length>=2){hasAny=true;var mx=Math.max.apply(null,evs),mn=Math.min.apply(null,evs),sp=mx-mn;var eSt=sp>6?'bad':sp>4?'warn':'ok';
    M({g:'air',label:w('증발기 표면 온도 편차','Evaporator surface spread'),val:sp.toFixed(1)+' °C',sub:w('최저 '+mn.toFixed(1)+' · 최고 '+mx.toFixed(1)+'°C','min '+mn.toFixed(1)+' · max '+mx.toFixed(1)+' °C'),range:'≤4 °C',st:eSt});
    if(eSt!=='ok'){add('C1',2,w('증발기 온도 편차 '+sp.toFixed(1)+'°C — 일부 회로만 차가움: 냉매 부족·분배 불량','Coil spread '+sp.toFixed(1)+' °C — only some circuits cold: shortage / distribution'));add('C4',2,w('증발기 온도 편차 — 부분 오염·막힘','Coil spread — partial dirt / blockage'));add('C5',1,w('분배기·모세관 부분 막힘 가능','Partial distributor / capillary restriction'));}
    if(mn<=0){add('C4',1,w('증발기 표면 0°C 이하 — 결빙 진행','Coil surface ≤ 0 °C — icing'));add('C1',1,w('증발기 표면 0°C 이하','Coil ≤ 0 °C'));}}

  /* ── 2. 냉매측 ───────────────────────────────────────────────── */
  var lp=numv(m.lp),hp=numv(m.hpp);if(m.punit==='bar'){if(lp!=null)lp*=14.5038;if(hp!=null)hp*=14.5038;}
  var amb=numv(m.amb),ambA=false;if(amb==null){amb=AMB_DEFAULT;ambA=true;}
  var lpC=null,hpC=null,evt=null,cdt=null,split=null,R=null;
  if(lp!=null||hp!=null){hasAny=true;
    if(!u.ref){warns.push(w('냉매 종류를 선택하면 압력·과열도·과냉도를 판정합니다.','Select the refrigerant to assess pressures, superheat and subcooling.'));
      if(lp!=null)M({g:'ref',label:w('저압','Low side'),val:lp.toFixed(0)+' psi',range:'—',st:null});if(hp!=null)M({g:'ref',label:w('고압','High side'),val:hp.toFixed(0)+' psi',range:'—',st:null});}
    else{R=REF[u.ref];
      if(lp!=null){evt=satTemp(u.ref,lp);lpC=lp<R.lo[0]?'low':lp>R.lo[1]?'high':'ok';
        var lpSt=lpC==='ok'?'ok':(lpC==='low'?(lp<R.lo[0]*0.85?'bad':'warn'):(lp>R.lo[1]*1.15?'bad':'warn'));
        M({g:'ref',label:w('저압 (흡입측)','Low side (suction)'),val:lp.toFixed(0)+' psi',sub:w('증발온도 약 '+evt.toFixed(0)+'°C','evaporating ≈ '+evt.toFixed(0)+' °C'),range:R.lo[0]+'~'+R.lo[1]+' psi',st:lpSt});}
      if(hp!=null){cdt=satTemp(u.ref,hp);split=cdt-amb;var spS=(split>=0?'+':'−')+Math.abs(split).toFixed(0);
        if(ambA){hpC=hp<R.hi[0]?'low':hp>R.hi[1]?'high':'ok';assum.push(w('실외 온도 미입력 — 33°C로 가정해 응축온도를 계산했습니다.','Outdoor temp not entered — 33 °C assumed.'));}
        else hpC=split<6?'low':split>18?'high':'ok';
        var hpSt=hpC==='ok'?'ok':(hpC==='high'?((split>24||hp>R.hi[1]*1.15)?'bad':'warn'):'warn');
        M({g:'ref',label:w('고압 (토출측)','High side (discharge)'),val:hp.toFixed(0)+' psi',sub:w('응축온도 약 '+cdt.toFixed(0)+'°C (외기 '+spS+'°C)','condensing ≈ '+cdt.toFixed(0)+' °C (ambient '+spS+' °C)'),range:R.hi[0]+'~'+R.hi[1]+' psi · '+w('외기 +6~18°C','ambient +6–18 °C'),st:hpSt});}
      var eq=(lp!=null&&hp!=null)&&((hp-lp)<0.35*(R.hi[0]-R.lo[1]));
      if(lp!=null&&hp!=null){var cr=(hp+14.7)/(lp+14.7);var crSt=cr<2?'bad':cr<2.5?'warn':cr<=4?'ok':cr<=5?'warn':'bad';
        M({g:'ref',label:w('압축비','Compression ratio'),val:cr.toFixed(2),range:'2.5~4.0',st:crSt});}
      if(lpC&&hpC){
        if(eq){add('C6',5,w('저압·고압 균압('+lp.toFixed(0)+'/'+hp.toFixed(0)+' psi) — 압축기가 압축하지 않음','Pressures equalised ('+lp.toFixed(0)+'/'+hp.toFixed(0)+' psi) — compressor not pumping'));}
        else if(lpC==='low'&&hpC==='low')add('C1',4,w('저압·고압 모두 낮음 — 냉매 부족 패턴','Both pressures low — shortage pattern'));
        else if(lpC==='low'){add('C5',3,w('저압만 낮고 고압 정상·높음 — 막힘 패턴','Low suction, normal/high head — restriction'));add('C4',2,w('저압 낮음 — 실내 풍량 부족도 원인','Low suction — low indoor airflow also'));if(hpC==='high')add('C5',1,w('고압까지 높음','Head also high'));}
        else if(lpC==='high'&&hpC==='high'){add('C3',3,w('저압·고압 모두 높음 — 과충전 패턴','Both high — overcharge'));add('C2',2,w('고압 높음 — 응축기 확인','High head — check condenser'));add('C15',1,w('부하 과다 시 저압 상승','High load raises suction'));}
        else if(hpC==='high'){add('C2',4,w('고압만 높음(응축온도 외기 '+((split>=0?'+':'−')+Math.abs(split).toFixed(0))+'°C) — 응축기 오염·통풍·팬','High head only — condenser / airflow / fan'));add('C3',1,w('과충전도 고압 상승','Overcharge also'));}
        else if(lpC==='high'){add('C6',3,w('저압 높고 고압 낮음·정상 — 압축 불량 의심','High suction, low/normal head — weak compression'));add('C15',1,w('부하 과다 가능','High load possible'));}

  }

  var list=Object.keys(sc).map(function(id){return {id:id,score:sc[id],ev:ev[id]||[]};}).filter(function(x){return x.score>0;});

  var top=list[0],status='none';var judged=meas.some(function(x){return !!x.st;});

  function rk(v,lo,hi,tol){if(v==null)return null;if(v>=lo&&v<=hi)return 2;if(v>=lo-tol&&v<=hi+tol)return 1;return 0;}
  function row(label,b,af,unit,fmt,rank){if(b==null&&af==null)return;var d=(b!=null&&af!=null)?af-b:null;var rb=rank?rank(b):null,ra=rank?rank(af):null;

  row(w('온도차 ΔT','ΔT'),(ta!=null&&tb!=null)?ta-tb:null,(ta2!=null&&tb2!=null)?ta2-tb2:null,' °C',f1,function(v){return v==null?null:v>=DT_REF.ok?2:v>=DT_REF.low?1:0;});

  row(w('고압','High side'),hp,hp2,' psi',f0,R?function(v){return rk(v,R.hi[0],R.hi[1],R.hi[0]*0.15);}:null);

  if(u.ref){var ts=numv(m.ts),ts2=numv(a.ts),tl=numv(m.tl),tl2=numv(a.tl);var shLo=u.inv==='non'?8:3,shHi=u.inv==='non'?14:8;
    if(lp!=null&&ts!=null&&lp2!=null&&ts2!=null)row(w('과열도','Superheat'),ts-satTemp(u.ref,lp),ts2-satTemp(u.ref,lp2),' °C',f1,function(v){return rk(v,shLo,shHi,3);});
    if(hp!=null&&tl!=null&&hp2!=null&&tl2!=null)row(w('과냉도','Subcooling'),satTemp(u.ref,hp)-tl,satTemp(u.ref,hp2)-tl2,' °C',f1,function(v){return rk(v,4,10,2);});}
  var st=null;
  if(ta2!=null&&tb2!=null){var d2=ta2-tb2;st=d2>=DT_REF.good?'good':d2>=DT_REF.ok?'ok':d2>=DT_REF.low?'warn':'bad';}

var SEM3={ok:'ok',warn:'warn',bad:'bad'},SEM_SOIL={0:'ok',1:'warn',2:'bad'};
function inH(bind,val,unitTxt,opt){opt=opt||{};var num=opt.type!=='text';

function fl(txt,extra){return '<div class="acd-fl">'+esc(txt)+(extra||'')+'</div>';}
function card(title,body,n,extra){return '<section class="acd-card '+(extra||'')+'"><div class="acd-chd">'+(n?'<span class="n">'+n+'</span>':'')+'<span>'+esc(title)+'</span></div><div class="acd-cb">'+body+'</div></section>';}

/* ── 전체 렌더 ─────────────────────────────────────────────────── */
function renderAll(){var t=tx();document.documentElement.lang=APP.lang;document.title=t.title+' · HHC';

function afterRender(){if(APP.view==='work'){liveUpdate();var sp=document.querySelector('.acd-steps .on');if(sp&&sp.scrollIntoView)sp.scrollIntoView({inline:'center',block:'nearest'});}}
function renderWork(){var t=tx(),s=site(),u=unit();

    '<div class="acd-g3s"><div>'+fl(t.site.name)+inH('site.name',s.name,'',{type:'text',ph:t.site.namePh})+'</div><div>'+fl(t.site.date)+'<input class="acd-in" data-bind="site.date" type="date" value="'+esc(s.date)+'"></div><div>'+fl(t.site.tech)+inH('site.tech',s.tech,'',{type:'text',ph:t.site.techPh})+'</div></div>'+
    '<div class="acd-unitrow">'+s.units.map(function(x,i){var r=diagnoseUnit(x,APP.lang);return '<button type="button" class="acd-utab'+(i===APP.unit?' on':'')+'" data-act="unit" data-id="'+i+'"><i class="acd-dot st-'+r.status+'"></i>'+esc(x.loc||(t.site.unit+' '+(i+1)))+'</button>';}).join('')+
    '<button type="button" class="acd-utab add" data-act="addUnit">'+esc(t.site.addUnit)+'</button>'+
    '<button type="button" class="acd-biz'+(s.biz?' on':'')+'" data-act="biz">'+esc(s.biz?t.site.biz:t.site.home)+'</button></div></div>';

  h+='<div id="step-body">'+renderStep(APP.step)+'</div>';
  h+='<div class="acd-stepnav">'+(APP.step>1?'<button type="button" class="sec" data-act="prev">‹ '+esc(t.prev)+'</button>':'<span></span>')+(APP.step<7?'<button type="button" class="prim" data-act="next">'+esc(APP.step===5?t.toResult:t.next)+' ›</button>':'')+'</div>';
  return h;}
function stepDone(u,n){var m=u.m||{};
  if(n===1)return !!(u.brand&&(u.hp||guessHP(u.brand,u.model)));
  if(n===2)return Object.keys(u.sym||{}).some(function(k){return u.sym[k];})||!!(u.symText||'').trim();
  if(n===3)return m.filter!=null||Object.keys(u.vis||{}).length>0;
  if(n===4)return !!(u.op&&(u.op.power||u.op.comp||u.op.code||u.op.led));
  if(n===5)return ['ta','lp','hpp','cur','volt','vel'].some(function(k){return m[k]!=='';});
  if(n===6)return diagnoseUnit(u,APP.lang).hasAny;
  if(n===7)return Object.keys((u.act||{}).done||{}).some(function(k){return u.act.done[k];});
  return false;}
function renderStep(n){switch(n){case 1:return stepUnit();case 2:return stepInterview();case 3:return stepVisual();case 4:return stepOps();case 5:return stepMeasure();case 6:return stepResult();case 7:return stepAfter();}return '';}

/* ── 1단계 · 기기 ────────────────────────────────────────────────── */
function stepUnit(){var t=tx(),u=unit(),g=guessHP(u.brand,u.model);
  var b='';

  b+=fl(t.u.brand)+chipsH(BRANDS.map(function(x){return {id:x.id,label:pk(x.name)};}),u.brand,'brand');
  if(u.brand==='york')b+=fl(t.u.york)+chipsH([{id:'new',label:t.u.yorkO[0]},{id:'old',label:t.u.yorkO[1]}],u.yorkFam,'yorkFam');
  var note=BRAND_NOTE[u.brand];if(note)b+='<div class="acd-note brand">'+esc(L(note))+'</div>';
  b+=fl(t.u.model)+inH('model',u.model,'',{type:'text',ph:t.u.modelPh,caps:true});
  b+=fl(t.u.hp,(g&&!u.hp)?'<small id="hp-guess">'+esc(t.u.guess)+': '+g+' HP</small>':'<small id="hp-guess"></small>')+chipsH(HPS.map(function(x){return {id:x,label:x+' HP'};}),u.hp||g,'hp');
  b+='<div class="acd-g2" style="margin-top:12px"><div>'+fl(t.u.inv)+chipsH([{id:'inv',label:t.u.invO[0]},{id:'non',label:t.u.invO[1]}],u.inv,'inv')+'</div><div>'+fl(t.u.ref)+chipsH(REFS.map(function(x){return {id:x,label:x};}),u.ref,'ref')+'</div></div><div class="acd-hint">'+esc(t.u.refHint)+'</div>';
  var hpE=u.hp||g,est=hpE?AMP_EST[u.inv==='non'?'non':'inv'][hpE]:null;
  b+='<div class="acd-g2" style="margin-top:12px"><div>'+fl(t.u.rated)+inH('rated',u.rated,'A',{step:'0.01'})+'<div class="acd-hint">'+esc(t.u.ratedEst)+(est&&!u.rated?' → '+est.toFixed(1)+' A':'')+'</div></div><div>'+fl(t.u.year)+inH('year',u.year,'',{step:'1',ph:t.u.yearPh})+'</div></div>';
  if(site().units.length>1)b+='<div style="margin-top:14px;text-align:right"><button type="button" class="acd-lnk danger" data-act="delUnit">🗑 '+esc(t.site.delUnit)+'</button></div>';
  return card(t.steps[0],b,1);}

/* ── 2단계 · 문진 ────────────────────────────────────────────────── */
function stepInterview(){var t=tx(),u=unit(),k=APP.lang==='ko';var b='';
  b+=fl(t.q.sym);

  var rec=symFromText(u.symText);

  b+='<div class="acd-g2" style="margin-top:12px"><div>'+fl(t.q.onset)+chipsH(ONSET.map(function(x){return {id:x[0],label:k?x[1]:x[2]};}),u.onset,'onset')+'</div><div>'+fl(t.q.freq)+chipsH(FREQ.map(function(x){return {id:x[0],label:k?x[1]:x[2]};}),u.freq,'freq')+'</div></div>';

/* ── 3단계 · 육안 · 안전 ─────────────────────────────────────────── */
function stepVisual(){var t=tx(),u=unit(),k=APP.lang==='ko',m=u.m;var b='';

function stepOps(){var t=tx(),u=unit(),k=APP.lang==='ko',op=u.op;var b='';

  /* PT표 */
  var temps=[];for(var c=0;c<=60;c+=5)temps.push(c);
  var pt='<div class="acd-ct-wrap"><table class="acd-pt wide"><tr><th>°C</th>'+REFS.map(function(r){return '<th>'+r+'</th>';}).join('')+'</tr>'+temps.map(function(c){var i=c/5;return '<tr><td>'+c+'</td>'+REFS.map(function(r){return '<td>'+PT[r][i].toFixed(0)+'</td>';}).join('')+'</tr>';}).join('')+'</table></div><p class="dim">'+esc(k?'게이지 압력(psig). 증발온도 = 저압의 포화온도, 응축온도 = 고압의 포화온도.':'Gauge pressure (psig). Evaporating temp = saturation of low side; condensing = saturation of high side.')+'</p>';
  h+=sec('pt',S.pt,pt);
  var th='<table class="acd-pt"><tr><th>°C</th>'+[0,10,20,25,30,35,40].map(function(c){return '<th>'+c+'</th>';}).join('')+'</tr>'+TH_NOMS.map(function(n){return '<tr><td>'+n+'kΩ</td>'+[0,10,20,25,30,35,40].map(function(c){var v=thermR(parseFloat(n),c);return '<td>'+(v>=100?v.toFixed(0):v.toFixed(1))+'</td>';}).join('')+'</tr>';}).join('')+'</table><p>'+esc(k?'NTC · B=3950 기준 · ±15% 정상. 단선 = OL, 단락 = 0Ω → 코드. 드리프트(값이 틀어짐)는 코드 없이 증상만: 실온 센서 → 온도 조절 이상, 실내 코일 센서 → 결빙 또는 동결 보호 오작동, 실외 코일·토출 센서 → 응축기·압력 정상인데 보호 코드. 손으로 쥐어 저항이 내려가는지 확인.':'NTC · B=3950 · ±15 % normal. Open = OL, short = 0 Ω → code. Drift gives symptoms only: room sensor → poor control; coil sensor → icing or false freeze protection; outdoor/discharge sensor → protection codes with normal pressures. Squeeze the sensor and watch resistance fall.')+'</p>';
  h+=sec('th',S.th,th);
  h+=sec('parts',S.parts,'<div class="acd-ref"><b>'+esc(k?'캐패시터 (일반형)':'Capacitor (non-inverter)')+'</b><p>'+esc(k?'표기 µF ±6% 밖 = 불량, 팽창·누액 = 측정 없이 교체. ① 운전 캐패시터: 실외 팬은 도는데 압축기가 웅~ 소리만 내다 정지·반복, 기동 전류 급상승 후 0. ② 팬 캐패시터: 실외 팬 정지·매우 느림·손으로 밀면 돎 → 고압 급상승·과열 트립. ③ 듀얼: 팬만 또는 압축기만 정지. 교체는 같은 µF, 같거나 높은 전압(370→450V 가능). 인버터에는 운전 캐패시터가 없음(기판 DC 콘덴서·IPM → CH23·U2·F90·P1 계열 코드).':'Outside ±6 % = bad; bulged/leaking = replace. ① run capacitor: fan runs, compressor hums then stops, start current spikes to zero. ② fan capacitor: fan stopped/very slow, runs if pushed → head spikes, overheat trip. ③ dual: fan or compressor only. Same µF, equal or higher voltage. Inverters have no run capacitor (DC-link / IPM → CH23, U2, F90, P1 codes).')+'</p></div>'+wr('comp'));
  h+=sec('work',S.work,wr('torque')+wr('vacuum')+wr('nitro')+wr('r32')+wr('pipe')+wr('elec'));
  /* 코드표 */
  var rb=REF_BRAND||'daikin';
  var codes=fl(t.ref.pick)+chipsH(BRANDS.filter(function(x){return x.tbl;}).map(function(x){return {id:x.id,label:pk(x.name)};}),rb,'refBrand');
  var note=BRAND_NOTE[rb];if(note)codes+='<div class="acd-note brand" style="margin-top:8px">'+esc(L(note))+'</div>';
  var tblr=codeTables(rb,'new');codes+='<div class="acd-ct-wrap tall" style="margin-top:8px">'+codeTableH(tblr)+'</div>';
  if(rb==='york')codes+='<div class="acd-hint">'+esc(k?'2015년 이전 OYL 계열은 Daikin 표를 보세요.':'For pre-2015 OYL units see the Daikin table.')+'</div>';
  h+=sec('codes',S.codes,codes);
  /* 램프 점멸 */
  var bk=rb==='york'?'yorknew':rb;var B=BLINK[bk];
  var bl=fl(t.ref.pick)+chipsH(BRANDS.filter(function(x){return BLINK[x.id==='york'?'yorknew':x.id];}).map(function(x){return {id:x.id,label:pk(x.name)};}),rb,'refBrand');
  if(B){bl+='<div class="acd-note" style="margin-top:8px">'+esc(L(B))+'</div>';
    if(B.kind==='count')B.modes.forEach(function(md){bl+='<div class="acd-symg-t" style="margin-top:10px">'+esc(L(md))+'</div><table class="acd-ct">'+md.tbl.map(function(r){var cr=r[3]?findCodeIn(codeTables(rb,'old'),r[3]):null;var mean=(k?r[4]:r[5])||(cr?(k?cr[1]:cr[2]):'');return '<tr class="sev-'+r[7]+'"><td class="cd">'+esc(r[0])+(r[1]?' <small>'+esc(k?r[1]:r[2])+'</small>':'')+'</td><td>'+(r[3]?'<b>'+esc(r[3])+'</b> ':'')+esc(mean)+'</td></tr>';}).join('')+'</table>';});
    if(B.kind==='block'||B.kind==='combo')bl+='<table class="acd-ct" style="margin-top:8px">'+B.tbl.map(function(r){return '<tr class="sev-'+r[7]+'"><td class="cd">'+esc(k?r[1]:r[2])+'</td><td>'+(r[3]?'<b>'+esc(r[3])+'</b> ':'')+esc(k?r[4]:r[5])+'</td></tr>';}).join('')+'</table>';
    if(B.kind==='midea'||B.kind==='gree'){bl+='<table class="acd-ct" style="margin-top:8px">';Object.keys(B.tbl).forEach(function(kk){var lbl=B.kind==='midea'?({off:t.o.mideaAux[0],on:t.o.mideaAux[1],flash:t.o.mideaAux[2]})[kk]:L(LAMPS[kk]);Object.keys(B.tbl[kk]).forEach(function(n){var cr=findCodeIn(codeTables(rb,'new'),B.tbl[kk][n]);bl+='<tr><td class="cd">'+esc(lbl)+' · '+n+(k?'회':'×')+'</td><td><b>'+esc(B.tbl[kk][n])+'</b> '+esc(cr?(k?cr[1]:cr[2]):'')+'</td></tr>';});});bl+='</table>';}
    if(B.kind==='digits'&&B.old)bl+='<table class="acd-ct" style="margin-top:8px">'+B.old.map(function(r){var cr=findCodeIn(CODES.lg,r[1]);return '<tr><td class="cd">'+r[0]+(k?'회':'×')+'</td><td><b>'+r[1]+'</b> '+esc(cr?(k?cr[1]:cr[2]):'')+'</td></tr>';}).join('')+'</table>';}
  h+=sec('blink',S.blink,bl);
  /* 가격표 */
  var pr='';[['home',k?'가정용':'Home'],['biz',k?'비즈니스 · 매장형':'Business']].forEach(function(p){var P=SVC[p[0]];pr+='<div class="acd-ref"><b>'+esc(p[1])+'</b><table class="acd-pt wide">'+TYPES.map(function(x){var o=P[x.id];return '<tr><td>'+esc(L(x))+'</td><td>'+Object.keys(o).map(function(kk){return L(SVC_NAME[kk])+' RM'+o[kk];}).join(' · ')+'</td></tr>';}).join('')+'<tr><td>'+esc(k?'실외기':'Outdoor')+'</td><td>'+Object.keys(P.outdoor).map(function(kk){return L(SVC_NAME['od_'+kk])+' RM'+P.outdoor[kk];}).join(' · ')+'</td></tr></table></div>';});
  var C=SVC.common;pr+='<div class="acd-ref"><b>'+esc(k?'점검 · 수리 (공통)':'Inspection · repair (common)')+'</b><table class="acd-pt wide"><tr><td>'+esc(k?'출장 점검 (지역별 A~D)':'Inspection visit (zone A–D)')+'</td><td>RM '+C.visit+'</td></tr><tr><td>'+esc(k?'수리 인건비 기본 / 일반 / 고급':'Repair labour basic / standard / advanced')+'</td><td>RM '+C.laborB+' / '+C.laborM+' / '+C.laborH+'</td></tr><tr><td>'+esc(L(SVC_NAME.vacuum))+'</td><td>RM '+C.vacuum+'</td></tr><tr><td>'+esc(L(SVC_NAME.leak))+'</td><td>RM '+C.leak+'</td></tr><tr><td>'+esc(L(SVC_NAME.gasTop))+' / '+esc(L(SVC_NAME.gasFull))+'</td><td>RM '+C.gasTop+' / '+C.gasFull+'</td></tr><tr><td>'+esc(k?'부품 교체 캐패시터 / 써미스터 (+실구입가)':'Parts: capacitor / thermistor (+ purchase)')+'</td><td>RM '+C.cap+' / '+C.th+'</td></tr><tr><td>'+esc(L(SVC_NAME.regular))+'</td><td>RM '+C.regular+'</td></tr></table><p class="dim">'+esc(k?'홈페이지 가격표(2026-09) 기준. 변경 시 파일 상단 SVC 값을 수정하세요.':'Per published price list (2026-09). Edit SVC at the top of the file to update.')+'</p></div>';
  h+=sec('price',S.price,pr);
  return h+'</div>';}

/* ── 실시간 갱신 (입력 중 재렌더 없이) ──────────────────────────── */
function liveUpdate(){var t=tx(),u=unit(),m=u.m,k=APP.lang==='ko';
  var el;
  if((el=$('dt-live'))){var ta=numv(m.ta),tb=numv(m.tb);if(ta!=null&&tb!=null){var d=ta-tb,st=d<0?'bad':d>=DT_REF.good?'good':d>=DT_REF.ok?'ok':d>=DT_REF.low?'warn':'bad';el.className='acd-dt '+stC(st);el.textContent=t.m.dt+' '+d.toFixed(1)+' °C';}else{el.className='acd-dt';el.textContent='';}}
  if((el=$('ev-live'))){var evs=(m.ev||[]).map(numv).filter(function(x){return x!=null;});if(evs.length>=2){var sp=Math.max.apply(null,evs)-Math.min.apply(null,evs);el.className='acd-dt '+stC(sp>6?'bad':sp>4?'warn':'ok');el.textContent=(k?'편차 ':'Spread ')+sp.toFixed(1)+' °C';}else{el.className='acd-dt';el.textContent='';}}
  if((el=$('ref-live'))){var r=diagnoseUnit(u,APP.lang);var parts=[];if(r.evt!=null)parts.push((k?'증발 ':'evap ')+r.evt.toFixed(1)+'°C');if(r.cdt!=null)parts.push((k?'응축 ':'cond ')+r.cdt.toFixed(1)+'°C');if(r.SH!=null)parts.push('SH '+r.SH.toFixed(1)+'°C');if(r.SC!=null)parts.push('SC '+r.SC.toFixed(1)+'°C');if(r.cr!=null)parts.push((k?'압축비 ':'CR ')+r.cr.toFixed(2));
    el.className='acd-dt'+(parts.length?' st-ok':'');el.textContent=parts.length?t.m.live+': '+parts.join(' · '):'';}
  if((el=$('elec-live'))){var r2=diagnoseUnit(u,APP.lang);var ms=r2.meas.filter(function(x){return x.g==='elec'&&x.st;});el.className='acd-dt multi';el.innerHTML=ms.map(function(x){return '<span class="'+stC(x.st)+'">'+esc(x.label)+' '+esc(x.val)+(x.sub?' ('+esc(x.sub)+')':'')+'</span>';}).join(' · ');}
  if((el=$('cap-live'))){var capr=numv(m.capr),capm=numv(m.capm);if(capr!=null&&capm!=null&&capr>0){var cd=(capm-capr)/capr*100,cad=Math.abs(cd);el.className='acd-dt '+stC(cad<=CAP_TOL?'ok':cad<=10?'warn':'bad');el.textContent=(k?'캐패시터 ':'Capacitor ')+(cd>=0?'+':'−')+cad.toFixed(1)+'%';}else{el.className='acd-dt';el.textContent='';}}
  if((el=$('th-live'))){var thr=numv(m.thr),tht=numv(m.tht);if(tht!=null){var ex=thermR(parseFloat(m.thn||'10'),tht);var txt=(k?'예상 ':'expected ')+ex.toFixed(1)+' kΩ',ts='';if(thr!=null){var td=(thr-ex)/ex*100;ts=Math.abs(td)<=15?'ok':Math.abs(td)<=30?'warn':'bad';txt+=' · '+(td>=0?'+':'−')+Math.abs(td).toFixed(0)+'%';}el.className='acd-dt '+(ts?stC(ts):'');el.textContent=txt;}else{el.className='acd-dt';el.textContent='';}}
  if((el=$('code-prev'))){var op=u.op;if(op.code){var row=findCodeU(u,op.code);if(row){el.className='acd-cprev sev-'+row[4];el.innerHTML='<b>'+esc(row[0])+'</b> <span>'+esc(k?row[1]:row[2])+'</span><i class="acd-sev">'+esc(t.r.sev[row[4]])+'</i>'+(row[5]?'<small>'+esc(pk(row[5]))+'</small>':'');}else{el.className='acd-cprev sev-none';el.textContent=u.brand?t.o.codeNone:t.o.codeSel;}}else{el.className='acd-cprev';el.innerHTML='';}}
  if((el=$('led-prev')))el.outerHTML='<div id="led-prev">'+ledPrevH(u)+'</div>';
  if((el=$('sym-recog'))){var rec=symFromText(u.symText);el.textContent=rec.length?t.q.recog+': '+rec.map(function(s){return symLabel(s,APP.lang);}).join(', '):'';}
  if((el=$('cmp-live')))el.innerHTML=cmpH(u);
  var hg=$('hp-guess');if(hg){var g=guessHP(u.brand,u.model);hg.textContent=(g&&!u.hp)?t.u.guess+': '+g+' HP':'';}
}
function toast(msg){var el=$('acd-toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('show');},1600);}
function copyText(txt,done){function fb(){var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);}
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,function(){fb();done();});else{fb();done();}}

/* ── 이벤트 ─────────────────────────────────────────────────────── */
function onClick(e){var b=e.target.closest('[data-act]');if(!b)return;var act=b.dataset.act,id=b.dataset.id,key=b.dataset.key,u=unit(),s=site(),t=tx();
  var rerender=true;
  switch(act){
    case 'nav':APP.view=id;break;
    case 'step':APP.step=parseInt(id,10);break;
    case 'prev':APP.step=Math.max(1,APP.step-1);window.scrollTo({top:0});break;
    case 'next':APP.step=Math.min(7,APP.step+1);window.scrollTo({top:0});break;
    case 'unit':APP.unit=parseInt(id,10);break;
    case 'addUnit':s.units.push(newUnit());APP.unit=s.units.length-1;APP.step=1;break;
    case 'delUnit':if(s.units.length>1&&confirm(t.site.delUnit+'?')){s.units.splice(APP.unit,1);APP.unit=Math.max(0,APP.unit-1);}break;
    case 'biz':s.biz=!s.biz;break;
    case 'type':u.type=id;break;
    case 'brand':u.brand=(u.brand===id)?null:id;break;
    case 'yorkFam':u.yorkFam=id;break;
    case 'hp':u.hp=(u.hp===id)?null:id;break;
    case 'inv':u.inv=(u.inv===id)?null:id;break;
    case 'ref':u.ref=(u.ref===id)?null:id;break;
    case 'sym':u.sym[id]=!u.sym[id];break;
    case 'onset':u.onset=(u.onset===id)?null:id;break;
    case 'freq':u.freq=(u.freq===id)?null:id;break;
    case 'ev':u.ev[id]=!u.ev[id];break;
    case 'req':u.req[id]=!u.req[id];break;
    case 'soil':var v=parseInt(id,10);u.m[key]=(u.m[key]===v)?null:v;break;
    case 'vis':u.vis[key]=(u.vis[key]===id)?null:id;if(u.vis[key]==null)delete u.vis[key];break;
    case 'op':u.op[key]=(u.op[key]===id)?null:id;break;
    case 'led':u.op.led=u.op.led?0:1;if(u.op.led)u.sym.err=true;break;
    case 'opmode2':u.op.mode2=id;break;
    case 'opaux':u.op.aux=(u.op.aux===id)?null:id;break;
    case 'oplamp':u.op.lamp=id;break;
    case 'punit':u.m.punit=id;break;
    case 'mseg':u.m[key]=(u.m[key]===id)?null:id;break;
    case 'thn':u.m.thn=id;break;
    case 'act':u.act.done[id]=!u.act.done[id];break;
    case 'rec':u.rec[id]=b.checked;break;
    case 'copyRep':copyText(reportText(s,APP.lang),function(){toast(t.r.copied);});rerender=false;break;
    case 'copyCus':copyText(customerText(s,APP.lang),function(){toast(t.r.copied);});rerender=false;break;
    case 'wa':window.open('https://wa.me/?text='+encodeURIComponent(customerText(s,APP.lang)),'_blank');rerender=false;break;
    case 'print':window.print();rerender=false;break;
    case 'gounit':APP.unit=parseInt(id,10);APP.view='work';APP.step=6;break;
    case 'newSite':APP.sites.push(newSite());APP.cur=APP.sites.length-1;APP.unit=0;APP.step=1;APP.view='work';break;
    case 'openSite':APP.cur=parseInt(id,10);APP.unit=0;APP.step=1;APP.view='work';break;
    case 'delSite':if(confirm(t.rec.confirm)){var di=parseInt(id,10);APP.sites.splice(di,1);if(APP.cur>=APP.sites.length)APP.cur=Math.max(0,APP.sites.length-1);else if(di<APP.cur)APP.cur--;APP.unit=0;}break;
    case 'refBrand':REF_BRAND=id;break;
    case 'lang':APP.lang=id;break;
    default:rerender=false;}
  if(rerender){renderAll();if(act==='nav'||act==='step'||act==='openSite'||act==='newSite'||act==='gounit')window.scrollTo({top:0});}
  else save();}
function onInput(e){var el=e.target;var bind=el.dataset.bind;if(!bind)return;var val=el.value;
  if(bind.indexOf('site.')===0)setP(site(),bind.slice(5),val);else{setP(unit(),bind,val.trim?val:val);if(bind==='op.code'&&val.trim())unit().sym.err=true;}
  liveUpdate();save();
  if(bind==='site.name'){var st=document.querySelector('.acd-utab.on');}
}
function onChange(e){var el=e.target;if(el.dataset.bind==='model'||el.dataset.bind==='loc'||el.dataset.bind==='site.name'){renderAll();}}
document.addEventListener('DOMContentLoaded',function(){load();
  document.body.addEventListener('click',onClick);document.body.addEventListener('input',onInput);document.body.addEventListener('change',onChange);
  renderAll();});

  window.addEventListener('message',function(e){var d=e&&e.data;if(d&&d.hhcPing)post({hhcPong:1,ready:true});});post({hhcHello:1});post({hhcReady:1});})();
