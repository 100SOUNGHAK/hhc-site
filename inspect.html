<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E2350">
<title>해피홈케어 점검 보고서 · Inspection Report</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="해피홈케어 Happy Home Care">
<meta property="og:title" content="해피홈케어 점검 보고서 · Inspection Report">
<meta property="og:description" content="점검 결과와 권장 조치, 현장 사진을 확인하세요. / View results, recommendations and photos.">
<meta property="og:image" content="https://happyhomecare.com.my/og-report.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>

:root{
  --n:#0E2350;--n2:#16346E;--n3:#0A1A3D;--bl:#2563EB;
  --ink:#14192A;--ink2:#5A6478;--ink3:#98A1B4;
  --line:#E4E9F2;--soft:#F6F8FC;--paper:#fdfcf9;
  --ok:#0E9B63;--ok-bg:#E7F6EF;
  --wn:#F0B429;--wn-t:#A36A00;--wn-bg:#FDF4DF;
  --red:#DC2626;--red-bg:#FDECEC;
  --gold:#C9A44C;--gold-d:#B98A16;--gold-l:#E3C98A;
  --cool:#2F86C9;
  --e1:0 1px 2px rgba(11,24,51,.09),0 5px 12px -3px rgba(11,24,51,.14);
  --e2:0 1px 2px rgba(11,24,51,.10),0 8px 16px -4px rgba(11,24,51,.16),0 26px 44px -14px rgba(11,24,51,.34);
  --e3:0 2px 6px rgba(11,24,51,.16),0 14px 26px -6px rgba(11,24,51,.24),0 38px 68px -18px rgba(11,24,51,.48);
  --card:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.16);
  --ease:cubic-bezier(.22,.61,.36,1);--spring:cubic-bezier(.2,1.2,.3,1);
  --barH:72px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:112px}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;background:#EEF1F7;color:var(--ink);font-size:16px;line-height:1.6;letter-spacing:-.012em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.serif{font-family:'Noto Serif KR',serif}

/* ── 상단바 ── */
#rp-top{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--n3),var(--n));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.rp-topin{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
.rp-logo{width:30px;height:30px;flex-shrink:0}
.rp-tt{flex:1;min-width:0;line-height:1.25}
.rp-tt b{display:block;font-size:15px;font-weight:700}
.rp-tt span{display:block;font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:.04em}
.rp-lang{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.rp-lang button{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:rgba(255,255,255,.6);transition:all .18s var(--ease)}
.rp-lang button.on{background:#fff;color:var(--n);box-shadow:0 1px 3px rgba(0,0,0,.3)}

/* ── 섹션 이동 탭 ── */
#rp-nav{position:sticky;top:calc(52px + env(safe-area-inset-top));z-index:45;background:rgba(238,241,247,.86);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid rgba(14,35,80,.06)}
.rp-navin{max-width:520px;margin:0 auto;display:flex;gap:6px;padding:9px 16px;overflow-x:auto;scrollbar-width:none;position:relative}
.rp-navin::-webkit-scrollbar{display:none}
.rp-navin button{flex-shrink:0;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink2);transition:color .18s,background .18s;position:relative;z-index:1}
.rp-navin button.on{color:#fff}
.rp-navpill{position:absolute;top:9px;height:calc(100% - 18px);border-radius:999px;background:var(--n);box-shadow:0 4px 10px -3px rgba(14,35,80,.45);transition:left .32s var(--ease),width .32s var(--ease);z-index:0}

.rp-wrap{max-width:520px;margin:0 auto;padding:16px 16px calc(var(--barH) + 28px + env(safe-area-inset-bottom))}
.rp-sec{margin-top:28px}
.rp-sh{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 2px 12px}
.rp-sh h2{font-size:19px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.rp-sh p{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.45}
.rp-sh .cnt{font-size:12px;font-weight:700;color:var(--ink3);white-space:nowrap}
.rp-card{background:#fff;border-radius:16px;box-shadow:var(--card)}

/* ── 상태 배지 ── */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;line-height:1.5}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.wn{background:var(--wn-bg);color:var(--wn-t)}
.pill.wn::before{background:var(--wn)}
.pill.bad{background:var(--red-bg);color:var(--red)}

/* ━━━ 히어로 ━━━ */
.rp-hero{position:relative;perspective:1100px}
.hero-card{position:relative;border-radius:22px;overflow:hidden;color:#fff;
  background:radial-gradient(120% 90% at 100% 0%,#244a8f 0%,rgba(36,74,143,0) 55%),linear-gradient(160deg,#16346E 0%,#0E2350 48%,#0A1A3D 100%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),var(--e3);
  transform-style:preserve-3d;transition:transform .5s var(--ease);will-change:transform}
.hero-card::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px circle at var(--mx,70%) var(--my,0%),rgba(255,255,255,.13),transparent 45%);transition:opacity .3s}
.hero-deco{position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:50%;border:1px solid rgba(201,164,76,.22);pointer-events:none}
.hero-deco.b{right:-30px;top:-30px;width:150px;height:150px;border-color:rgba(201,164,76,.12)}
.hero-in{position:relative;padding:20px 20px 0;transform:translateZ(30px)}
.hero-kick{font-size:10.5px;font-weight:800;letter-spacing:.24em;color:var(--gold)}
.hero-name{font-size:24px;font-weight:800;letter-spacing:-.035em;line-height:1.25;margin-top:6px}
.hero-addr{font-size:13.5px;color:rgba(255,255,255,.62);margin-top:3px}
.hero-main{display:flex;align-items:center;gap:18px;margin-top:20px}
/* 3D 점수 링 */
.ring{position:relative;width:128px;height:128px;flex-shrink:0;transform-style:preserve-3d;transform:translateZ(24px)}
.ring-disc{position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#2b56a3 0%,#132d63 52%,#0a1a3d 100%);box-shadow:inset 0 2px 3px rgba(255,255,255,.22),inset 0 -6px 14px rgba(0,0,0,.45),0 10px 22px -6px rgba(0,0,0,.55)}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:translateZ(16px)}
.ring-txt b{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.05em}
.ring-txt span{font-size:10px;font-weight:700;letter-spacing:.14em;color:rgba(255,255,255,.55);margin-top:4px}
.hero-verdict{flex:1;min-width:0}
.hero-vk{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.55)}
.hero-vt{font-size:22px;font-weight:800;letter-spacing:-.04em;line-height:1.25;margin-top:2px}
.hero-vt.ok{color:#6EE7B7}.hero-vt.wn{color:#FCD34D}.hero-vt.bad{color:#FCA5A5}
.hero-vs{font-size:13px;color:rgba(255,255,255,.72);margin-top:6px;line-height:1.5;word-break:keep-all}
/* 대수 타일 (유리 카드) */
.hero-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.htile{padding:11px 10px 10px;border-radius:14px;text-align:left;color:#fff;
  background:linear-gradient(158deg,rgba(255,255,255,.155),rgba(255,255,255,.05) 52%,rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 4px rgba(4,12,26,.3),0 14px 26px -16px rgba(4,12,26,.85);
  transition:transform .16s var(--ease),background .2s}
.htile:active{transform:scale(.96)}
.htile i{white-space:nowrap;display:flex;align-items:center;gap:5px;font-style:normal;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.7)}
.htile i::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.htile b{display:block;font-size:24px;font-weight:800;margin-top:3px;line-height:1.1}
.htile b small{font-size:12px;font-weight:600;color:rgba(255,255,255,.55);margin-left:2px}
.htile.dim{opacity:.45}
.hero-meta{display:grid;grid-template-columns:1fr 1fr 1fr;margin:18px -20px 0;background:rgba(0,0,0,.24);border-top:1px solid rgba(201,164,76,.22)}
.hero-meta div{padding:11px 14px 12px;min-width:0}
.hero-meta div+div{border-left:1px solid rgba(255,255,255,.08)}
.hero-meta span{display:block;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--gold-l);opacity:.85}
.hero-meta b{display:block;font-size:13px;font-weight:700;margin-top:2px;line-height:1.35;word-break:keep-all}

/* 기사 의견 */
.op{margin-top:14px;padding:18px 18px 16px;position:relative}
.op-h{display:flex;align-items:center;gap:10px}
.op-av{width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--n);font-size:15px;background:linear-gradient(145deg,#F5E7C2,#D9B866);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 8px -2px rgba(185,138,22,.5)}
.op-h b{display:block;font-size:15px;font-weight:700}
.op-h div span{display:block;font-size:12px;color:var(--ink3)}
.op-body{margin-top:12px;font-size:15px;line-height:1.72;color:#2A3246;word-break:keep-all;position:relative;overflow:hidden;transition:max-height .4s var(--ease)}
.op-body.clip{max-height:150px}
.op-body.clip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(transparent,#fff)}
.op-body h4{font-size:13px;font-weight:800;color:var(--n);margin:12px 0 3px;letter-spacing:-.01em}
.op-body h4:first-child{margin-top:0}
.op-body h5{font-size:13.5px;font-weight:800;color:var(--ink);margin:10px 0 2px}
.op-body ul{margin:2px 0 6px 0;padding-left:18px}
.op-body li{margin:2px 0}
.op-body li::marker{color:var(--gold-d)}
.uc-dt{flex-wrap:wrap}
.uc-dt em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--ok);background:var(--ok-bg);border-radius:6px;padding:1px 6px;margin-left:2px}
.uc-dt i{font-style:normal;font-size:11.5px;color:var(--ink3);text-decoration:line-through}
.ghost{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#fff;border:2px dashed #9AA6BC;z-index:1}
.tmp2{padding:6px 14px;margin-top:14px}
.tmp2 .tr{display:grid;grid-template-columns:62px 1fr 16px 1fr 1fr;align-items:center;gap:4px;padding:10px 0;text-align:center}
.tmp2 .tr+.tr{border-top:1px solid var(--line)}
.tmp2 .tr>span:first-child{font-size:11.5px;font-weight:800;color:var(--ink3);text-align:left}
.tmp2 .tr.af>span:first-child{color:var(--ok)}
.tmp2 b{font-size:18px;font-weight:800}
.tmp2 small{display:block;font-size:10.5px;color:var(--ink3);font-weight:700}
.tmp2 .ar{color:var(--ink3)}
.tmp2 .af .dt b{color:var(--ok)}
.ph .vtag{position:absolute;left:8px;bottom:8px;z-index:2;font-size:11px;font-weight:800;color:#fff;background:#7C3AED;border-radius:6px;padding:1px 7px}
.prob-h .vtag{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;color:#fff;background:#7C3AED;border-radius:6px;padding:0 6px;vertical-align:1px}
.cmp{font-size:12px;color:var(--ink3);margin:2px 0 4px 62px}
.cmp b{color:var(--ink2)}
.gg .ghost{width:10px;height:10px;margin:-5px 0 0 -5px}

.op-more{margin-top:6px;font-size:13.5px;font-weight:700;color:var(--bl);display:flex;align-items:center;gap:4px;padding:6px 0}

/* ━━━ 에어컨별 캐러셀 ━━━ */
.uc-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 16px 18px;margin:0 -16px;scrollbar-width:none;overscroll-behavior-x:contain}
.uc-track::-webkit-scrollbar{display:none}
.uc{flex:0 0 76%;scroll-snap-align:center;text-align:left;border-radius:20px;background:#fff;box-shadow:var(--e2);overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s;position:relative}
.uc:active{transform:scale(.975)}
.uc-stage{position:relative;height:150px;display:flex;align-items:flex-start;justify-content:center;padding-top:26px;overflow:hidden}
.uc-stage.ok{background:radial-gradient(120% 100% at 50% 0%,#E9F1FF 0%,#F4F8FF 60%,#fff 100%)}
.uc-stage.wn{background:radial-gradient(120% 100% at 50% 0%,#FFF3D6 0%,#FFF9EC 60%,#fff 100%)}
.uc-stage.bad{background:radial-gradient(120% 100% at 50% 0%,#FFE1E1 0%,#FFF2F2 60%,#fff 100%)}
.uc-stage .pill{position:absolute;top:12px;left:12px}
.uc-tag{position:absolute;top:12px;right:12px;font-size:11px;font-weight:800;color:var(--ink3);background:rgba(255,255,255,.8);border-radius:8px;padding:2px 7px;letter-spacing:.04em}
.uc-b{padding:4px 16px 16px}
.uc-b h3{font-size:18px;font-weight:800;letter-spacing:-.03em}
.uc-b .md{font-size:12.5px;color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc-dt{display:flex;align-items:baseline;gap:6px;margin-top:10px}
.uc-dt b{font-size:26px;font-weight:800;line-height:1}
.uc-dt span{font-size:12px;color:var(--ink2);font-weight:600}
.uc-iss{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13.5px;color:var(--ink2);line-height:1.45;display:flex;gap:7px;min-height:52px}
.uc-iss em{font-style:normal;font-weight:700}
.uc-iss .ic{flex-shrink:0;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;margin-top:1px}
.ic.ok{background:var(--ok)}.ic.wn{background:var(--wn)}.ic.bad{background:var(--red)}
.uc-go{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px;font-weight:700;color:var(--n)}
.uc-go i{width:28px;height:28px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-style:normal;transition:transform .2s}
.uc:hover .uc-go i{transform:translateX(3px)}
.uc-dots{display:flex;justify-content:center;gap:6px;margin-top:-4px}
.uc-dots i{width:6px;height:6px;border-radius:999px;background:#C9D1E0;transition:all .25s var(--ease)}
.uc-dots i.on{width:20px;background:var(--n)}

/* 3D 에어컨 */
.ac3d{position:relative;width:160px;height:100px;perspective:520px}
.ac-g{position:absolute;left:0;top:0;width:150px;height:44px;transform-style:preserve-3d;transform:rotateX(-16deg) rotateY(var(--ry,-22deg));transition:transform .35s var(--ease);margin-left:5px}
.ac-f,.ac-t,.ac-s,.ac-bt{position:absolute;backface-visibility:hidden}
.ac-f{inset:0;border-radius:10px 10px 14px 14px;background:linear-gradient(180deg,#FFFFFF 0%,#F2F5FA 55%,#DFE5EF 100%);box-shadow:inset 0 -1px 0 rgba(14,35,80,.12),inset 0 1px 0 #fff;transform:translateZ(13px)}
.ac-f::before{content:"";position:absolute;left:10px;right:10px;bottom:7px;height:7px;border-radius:5px;background:linear-gradient(180deg,#1B2540,#3A4560);box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}
.ac-f::after{content:"";position:absolute;right:13px;top:10px;width:6px;height:6px;border-radius:50%;background:var(--led);box-shadow:0 0 6px 1px var(--led),0 0 0 2px rgba(255,255,255,.9)}
.ac-t{left:0;top:0;width:150px;height:26px;border-radius:10px;background:linear-gradient(90deg,#E6EBF3,#F8FAFD);transform:rotateX(90deg) translateZ(13px)}
.ac-s{right:0;top:0;width:26px;height:44px;border-radius:8px 8px 10px 10px;background:linear-gradient(180deg,#D3DAE6,#B9C3D4);transform:rotateY(90deg) translateZ(137px)}
.ac-bt{left:0;top:0;width:150px;height:26px;background:#AEB8CA;transform:rotateX(-90deg) translateZ(31px)}
.ac-sh{position:absolute;left:22px;top:80px;width:116px;height:12px;border-radius:50%;background:radial-gradient(closest-side,rgba(14,35,80,.18),transparent);filter:blur(1px)}
.ac-air{position:absolute;left:28px;right:28px;top:48px;height:46px;display:flex;justify-content:space-between;pointer-events:none}
.ac-air i{width:3px;height:100%;border-radius:3px;background:linear-gradient(180deg,var(--air) 0%,transparent 100%);opacity:0;transform-origin:top;animation:airflow var(--spd,1.6s) var(--ease) infinite}
.ac-air i:nth-child(2){animation-delay:.25s}.ac-air i:nth-child(3){animation-delay:.5s}.ac-air i:nth-child(4){animation-delay:.12s}.ac-air i:nth-child(5){animation-delay:.38s}
@keyframes airflow{0%{opacity:0;transform:translateY(-4px) scaleY(.3)}35%{opacity:var(--ao,.85)}100%{opacity:0;transform:translateY(10px) scaleY(1)}}
.ac3d.ok{--led:#22C55E;--air:#5BA8F0}
.ac3d.wn{--led:#F0B429;--air:#8DBBE6;--spd:2.1s;--ao:.6}
.ac3d.bad{--led:#EF4444;--air:#E9A28E;--spd:2.8s;--ao:.45}
.ac3d.big{transform:scale(1.15);transform-origin:top center}

/* ━━━ 해야 할 일 ━━━ */
.seg{display:flex;background:#E2E7F0;border-radius:13px;padding:4px;position:relative;box-shadow:inset 0 1px 2px rgba(14,35,80,.08)}
.seg button{flex:1;padding:9px 4px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--ink2);position:relative;z-index:1;transition:color .2s;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{color:var(--ink)}
.seg button em{font-style:normal;font-size:11.5px;min-width:19px;height:19px;padding:0 5px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:rgba(14,35,80,.08);color:var(--ink2)}
.seg button.on em.u{background:var(--red);color:#fff}
.seg-pill{position:absolute;top:4px;bottom:4px;border-radius:10px;background:#fff;box-shadow:0 1px 2px rgba(14,35,80,.1),0 4px 10px -4px rgba(14,35,80,.25);transition:left .3s var(--ease),width .3s var(--ease)}
.todo-list{margin-top:12px;display:flex;flex-direction:column;gap:10px}
.todo{padding:15px 16px;display:flex;gap:13px;animation:rise .35s var(--ease) both}
.todo:nth-child(2){animation-delay:.05s}.todo:nth-child(3){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.todo-n{flex-shrink:0;width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 8px -3px rgba(0,0,0,.3)}
.todo-n.urgent{background:linear-gradient(160deg,#F05252,#C81E1E)}
.todo-n.regular{background:linear-gradient(160deg,#2C5AB0,#0E2350)}
.todo-n.review{background:linear-gradient(160deg,#D9B866,#B98A16)}
.todo-b{flex:1;min-width:0}
.todo-when{font-size:11.5px;font-weight:800;letter-spacing:.02em}
.todo-when.urgent{color:var(--red)}.todo-when.regular{color:var(--n2)}.todo-when.review{color:var(--gold-d)}
.todo-b h4{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.4;margin-top:1px;word-break:keep-all}
.todo-b p{font-size:14px;color:var(--ink2);margin-top:3px;line-height:1.55;word-break:keep-all}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--n);transition:transform .14s,background .15s}
.chip:active{transform:scale(.94);background:#E8EEF8}
.chip::after{content:"›";color:var(--ink3);font-weight:800}
.todo-cta{margin-top:12px;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:linear-gradient(150deg,#16346E,#0E2350);color:#fff;box-shadow:var(--e2);text-decoration:none;transition:transform .15s}
.todo-cta:active{transform:scale(.98)}
.todo-cta b{display:block;font-size:15px}
.todo-cta span{display:block;font-size:12.5px;color:rgba(255,255,255,.65)}
.todo-cta i{margin-left:auto;font-style:normal;width:36px;height:36px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 10px -2px rgba(37,211,102,.55)}
.empty{padding:22px 16px;text-align:center;color:var(--ink2);font-size:14px}

/* ━━━ 냉방 성능 ━━━ */
.cool{padding:16px}
.cool-lg{display:flex;gap:12px;font-size:12px;color:var(--ink2);font-weight:600;flex-wrap:wrap}
.cool-lg span{display:flex;align-items:center;gap:5px}
.cool-lg span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--c)}
.crow{display:grid;grid-template-columns:96px 1fr 54px;align-items:center;gap:10px;padding:11px 0;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.crow:last-of-type{border-bottom:0}
.crow:active{background:var(--soft)}
.crow .nm{font-size:14px;font-weight:700;line-height:1.25}
.crow .nm small{display:block;font-size:11px;color:var(--ink3);font-weight:600}
.ctrack{position:relative;height:14px;border-radius:999px;background:linear-gradient(90deg,#FDF1D8 0 60%,#E8F6EE 60% 75%,#CDEFDD 75% 100%);box-shadow:inset 0 1px 2px rgba(14,35,80,.12)}
.cfill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;width:0;transition:width 1s var(--ease);background:linear-gradient(90deg,rgba(47,134,201,.35),var(--cool))}
.cfill.wn{background:linear-gradient(90deg,rgba(240,180,41,.35),#E0A21A)}
.cfill.bad{background:linear-gradient(90deg,rgba(220,38,38,.3),#DC2626)}
.cfill::after{content:"";position:absolute;right:-3px;top:50%;width:18px;height:18px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px currentColor,0 3px 6px rgba(0,0,0,.25);color:var(--cool);transform:scale(.62)}
.cfill.wn::after{color:#E0A21A}.cfill.bad::after{color:var(--red)}
.crow .v{text-align:right;font-size:17px;font-weight:800}
.crow .v small{font-size:11px;font-weight:600;color:var(--ink3)}
.cscale{display:grid;grid-template-columns:96px 1fr 54px;gap:10px;font-size:10.5px;color:var(--ink3);font-weight:600;margin-top:4px}
.cscale div{position:relative;height:14px}
.cscale span{position:absolute;transform:translateX(-50%)}
.cool-note{margin-top:12px;padding:11px 13px;border-radius:12px;background:var(--soft);font-size:13px;color:var(--ink2);line-height:1.55;display:flex;gap:9px}
.cool-note b{color:var(--ink)}

/* ━━━ 점검 항목 ━━━ */
.ck-sum{display:flex;align-items:center;gap:16px;padding:16px}
.donut{width:84px;height:84px;border-radius:50%;flex-shrink:0;position:relative;background:conic-gradient(var(--red) 0 var(--a),var(--wn) var(--a) var(--b),var(--ok) var(--b) 100%);box-shadow:0 6px 14px -6px rgba(14,35,80,.4)}
.donut::after{content:"";position:absolute;inset:13px;border-radius:50%;background:#fff;box-shadow:inset 0 2px 4px rgba(14,35,80,.12)}
.donut b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:1;font-size:16px;font-weight:800;line-height:1}
.donut b small{font-size:10px;color:var(--ink3);font-weight:700;margin-top:2px}
.ck-flt{flex:1;display:flex;flex-direction:column;gap:6px}
.ck-flt button{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-radius:10px;font-size:13.5px;font-weight:700;color:var(--ink2);background:var(--soft);transition:all .18s var(--ease)}
.ck-flt button em{font-style:normal;font-weight:800}
.ck-flt button.on{background:var(--n);color:#fff;box-shadow:0 4px 10px -4px rgba(14,35,80,.5)}
.ck-list{margin-top:10px}
.ck-grp{margin-top:14px}
.ck-grp h5{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.04em;margin:0 4px 6px}
.ck-row{display:flex;gap:12px;padding:13px 14px;align-items:flex-start;border-bottom:1px solid var(--line);animation:rise .3s var(--ease) both}
.ck-row:last-child{border-bottom:0}
.ck-row .ic{width:22px;height:22px;font-size:12px;margin-top:1px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex-shrink:0}
.ck-row b{display:block;font-size:15px;font-weight:700;line-height:1.4}
.ck-row p{font-size:13.5px;color:var(--ink2);margin-top:1px;line-height:1.5}
.ck-row .chips{margin-top:6px}

/* 실외기 측정 (펼치기) */
.acc{margin-top:12px;overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;text-align:left}
.acc-h .ico{width:36px;height:36px;border-radius:11px;background:var(--soft);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.acc-h b{display:block;font-size:15px;font-weight:700}
.acc-h span{display:block;font-size:12.5px;color:var(--ink3)}
.acc-h .ar{margin-left:auto;transition:transform .3s var(--ease);color:var(--ink3)}
.acc.open .acc-h .ar{transform:rotate(180deg)}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-b>div{overflow:hidden}
.ms{padding:4px 16px 16px}
.ms-u{padding:14px 0;border-top:1px solid var(--line)}
.ms-uh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ms-uh b{font-size:15px}
.gg{display:grid;grid-template-columns:52px 1fr 70px;align-items:center;gap:10px;margin-top:8px;font-size:13px}
.gg .k{color:var(--ink2);font-weight:600}
.gg .t{position:relative;height:8px;border-radius:999px;background:#EDF0F5}
.gg .t .band{position:absolute;top:0;bottom:0;background:rgba(14,155,99,.22);border-radius:999px}
.gg .t .mk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--c),0 2px 4px rgba(0,0,0,.2)}
.gg .v{text-align:right;font-weight:800}
.gg .v small{font-weight:600;color:var(--ink3);font-size:10.5px;margin-left:2px}
.ms-memo{margin-top:10px;font-size:13px;color:var(--ink2);background:var(--soft);padding:8px 11px;border-radius:10px}

/* ━━━ 사진 ━━━ */
.ba-cap{font-size:13px;color:var(--ink2);margin:8px 4px 0}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.ph{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1;box-shadow:var(--e1);transition:transform .16s var(--ease)}

.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 10px 8px;font-size:12px;font-weight:600;color:#fff;text-align:left;line-height:1.35;background:linear-gradient(transparent,rgba(8,18,40,.82))}
.ph .pill{position:absolute;top:8px;left:8px;font-size:11px}

.pg3{grid-template-columns:repeat(3,1fr);gap:8px}
.pg3 .ph{border-radius:11px}
.ph .cap.top{bottom:auto;top:0;padding:7px 9px 18px;background:linear-gradient(rgba(8,18,40,.75),transparent)}
.ph em.ptag{display:none}
body.tags .ph{outline:2px dashed var(--gold);outline-offset:2px}
body.tags .ph em.ptag{display:block;position:absolute;top:6px;right:6px;z-index:2;font-style:normal;font-size:11px;font-weight:800;color:var(--n);background:var(--gold-l);border-radius:7px;padding:2px 7px;box-shadow:0 2px 6px rgba(0,0,0,.3);max-width:calc(100% - 12px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.tags .pg3 .ph em.ptag{font-size:10px;padding:1px 5px;right:4px;top:auto;bottom:4px}
.psub{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:20px 4px 10px;color:var(--ink)}
.psub small{font-size:12px;font-weight:700;color:var(--ink3)}
.prob{padding:14px;margin-bottom:10px}
.prob-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.prob-n{width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prob-h p{font-size:14px;line-height:1.5;color:var(--ink);font-weight:600}
.prob-h .chips{margin-top:5px}
.bar2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.ms-ph{margin-top:10px}
.ms-ph h6{font-size:11.5px;font-weight:800;color:var(--ink3);margin:0 0 6px;letter-spacing:.02em}
.uc-cam{position:absolute;right:12px;bottom:10px;font-size:11.5px;font-weight:800;color:var(--n);background:rgba(255,255,255,.88);border-radius:999px;padding:2px 9px;box-shadow:0 1px 3px rgba(14,35,80,.15)}
.sh-tph{margin-top:10px}
.pmap{margin-bottom:16px;padding:16px;border:1.5px dashed var(--gold);background:#FFFCF3}
.pmap-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pmap-h b{font-size:15px}
.pmap-h span{display:block;font-size:12px;color:var(--ink2);font-weight:500}
.pmap-tg{flex-shrink:0;font-size:12px;font-weight:800;padding:6px 11px;border-radius:999px;background:var(--n);color:#fff}
.pmap-tg.off{background:#E2E7F0;color:var(--ink2)}
.pmap ol{list-style:none;margin-top:10px}
.pmap li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0E6CC}
.pmap li i{font-style:normal;width:24px;height:24px;border-radius:7px;background:var(--gold-l);color:var(--n);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pmap li div{flex:1;min-width:0;line-height:1.35}
.pmap li b{display:block;font-size:14px}
.pmap li span{display:block;font-size:12px;color:var(--ink2)}
.pmap li button{flex-shrink:0;font-size:12.5px;font-weight:800;color:var(--n);padding:6px 11px;border-radius:9px;background:#fff;border:1px solid var(--line);box-shadow:var(--e1)}
.pflash{animation:pflash 1.6s var(--ease)}
@keyframes pflash{0%,100%{box-shadow:var(--e1)}25%,60%{box-shadow:0 0 0 4px var(--gold),0 8px 20px rgba(185,138,22,.45)}}
@media print{.pmap,.ph em.ptag{display:none!important}body.tags .ph{outline:0}}
.rp-foot{margin-top:30px;text-align:center;font-size:12px;color:var(--ink3);line-height:1.7}
.rp-foot b{color:var(--ink2)}
.rp-sign{display:inline-flex;align-items:center;gap:10px;margin-bottom:12px;padding:10px 16px;border-radius:14px;background:#fff;box-shadow:var(--card);text-align:left}
.rp-sign svg{width:34px;height:34px}

/* ━━━ 하단 버튼바 ━━━ */
#rp-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.82);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border-top:1px solid rgba(14,35,80,.08)}
.rp-barin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:52px 52px 1fr;gap:8px}
.rp-barin button,.rp-barin a{height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;font-weight:700;color:var(--ink2);background:var(--soft);border:1px solid var(--line);text-decoration:none;transition:transform .14s var(--ease)}
.rp-barin button:active,.rp-barin a:active{transform:scale(.95)}
.rp-barin .pri{flex-direction:row;gap:8px;font-size:15px;color:#fff;border:0;background:linear-gradient(160deg,#1D4185,#0E2350);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 18px -8px rgba(14,35,80,.7)}

/* ━━━ 바텀시트 ━━━ */
.sh-ov{position:fixed;inset:0;z-index:80;background:rgba(8,18,40,.5);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);backdrop-filter:blur(2px)}
.sh-ov.on{opacity:1;pointer-events:auto}
.sheet{visibility:hidden;position:fixed;left:0;right:0;bottom:0;z-index:81;max-width:520px;margin:0 auto;max-height:90vh;max-height:90dvh;background:#F4F6FA;border-radius:24px 24px 0 0;box-shadow:0 -20px 50px -10px rgba(8,18,40,.45);transform:translateY(105%);transition:transform .42s var(--spring);display:flex;flex-direction:column}
.sheet.on{transform:translateY(0);visibility:visible}
.sheet.drag{transition:none}
.sh-grab{padding:10px 0 4px;display:flex;justify-content:center;touch-action:none;cursor:grab}
.sh-grab i{width:40px;height:5px;border-radius:999px;background:#C5CDDB}
.sh-x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:var(--e1);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink2);z-index:2}
.sh-body{overflow-y:auto;padding:0 16px calc(24px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sh-head{text-align:center;padding:6px 0 4px;touch-action:none}
.sh-head .ac3d{margin:6px auto 4px}
.sh-head h3{font-size:22px;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.sh-head .md{font-size:13px;color:var(--ink3)}
.sh-head .pill{margin-top:8px}
.sh-nav{display:flex;justify-content:space-between;margin-top:-80px;margin-bottom:46px;pointer-events:none}
.sh-nav button{pointer-events:auto;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:var(--e1);color:var(--n);font-weight:800;font-size:16px}
.sh-nav button:disabled{opacity:.3}
.tmp{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:14px 16px;margin-top:14px}
.tmp div{text-align:center;flex:1}
.tmp span{display:block;font-size:11.5px;color:var(--ink3);font-weight:700}
.tmp b{font-size:21px;font-weight:800}
.tmp .ar{color:var(--ink3);flex:0 0 auto;font-size:18px}
.tmp .dt{background:var(--soft);border-radius:12px;padding:6px 4px}
.sh-sec{margin-top:16px}
.sh-sec h4{font-size:13px;font-weight:800;color:var(--ink2);margin:0 4px 8px;letter-spacing:.01em}
.sh-li{padding:4px 14px}
.sh-li .row{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.sh-li .row:last-child{border-bottom:0}
.sh-li .row .ic{width:20px;height:20px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;margin-top:2px}
.sh-li .row b{display:block;font-size:14.5px;font-weight:700;line-height:1.45}
.sh-li .row p{font-size:13px;color:var(--ink2);line-height:1.5}
.sh-li .row .tg{display:inline-block;margin-top:4px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:6px}
.tg.done{background:var(--ok-bg);color:var(--ok)}.tg.plan{background:#E8EEFB;color:var(--bl)}

.toast{position:fixed;left:50%;bottom:calc(var(--barH) + 24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:95;background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:11px 18px;border-radius:999px;box-shadow:var(--e2);opacity:0;transition:all .3s var(--spring);pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%,100%{box-shadow:var(--card)}30%{box-shadow:0 0 0 3px rgba(201,164,76,.85),var(--e2)}}

@media (min-width:600px){.uc{flex-basis:300px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}.ac-air i{opacity:.5}}
@media print{
  body{background:#fff}
  #rp-top,#rp-nav,#rp-bar,.sh-ov,.sheet,.toast,.op-more,.uc-dots,.seg{display:none!important}
  .rp-card,.uc,.hero-card,.todo,.ck-row,.ph{break-inside:avoid;box-shadow:none!important;border:1px solid #e4e9f2}
  .uc-track{flex-wrap:wrap;overflow:visible}.uc{flex-basis:47%}
  .op-body.clip{max-height:none}.op-body.clip::after{display:none}
  .acc-b{grid-template-rows:1fr}
  .hero-card{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{margin:12mm;size:A4}
}
/* ━━━ 보고서 3종 공통 추가 ━━━ */
.pv{margin-bottom:16px;padding:14px;border:1.5px dashed var(--gold);background:#FFFCF3}
.pv-h{font-size:13px;font-weight:800;color:var(--ink2);margin:0 2px 10px}
.pv-h span{font-weight:500;color:var(--ink3)}
.pv .seg button{font-size:12.5px;padding:9px 2px;letter-spacing:-.03em}
/* 3D 표지 배지 */
.emb{position:relative;width:118px;height:118px;flex-shrink:0;transform:translateZ(24px)}
.emb-ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 210deg,#F3DFA6,#C9A44C 40%,#8F6F28 60%,#E3C98A 85%,#F3DFA6);box-shadow:0 10px 22px -6px rgba(0,0,0,.55)}
.emb-disc{position:absolute;inset:9px;border-radius:50%;background:radial-gradient(circle at 34% 28%,#2b56a3 0%,#132d63 52%,#0a1a3d 100%);box-shadow:inset 0 2px 3px rgba(255,255,255,.22),inset 0 -6px 14px rgba(0,0,0,.45)}
.emb-ic{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.emb-ic svg{width:44px;height:44px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.emb-ic span{font-size:9.5px;font-weight:800;letter-spacing:.14em;color:var(--gold-l);margin-top:3px}
.emb.pop .emb-ic svg{animation:pop .7s var(--spring) .2s both}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.htile.tx b{font-size:15px;line-height:1.3;margin-top:5px;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
/* 진행 과정 (세로 단계) */
.flow{padding:6px 16px}
.fs{position:relative;display:flex;gap:14px;padding:14px 0}
.fs:not(:last-child)::before{content:"";position:absolute;left:17px;top:50px;bottom:-14px;width:2px;background:var(--line)}
.fs:not(:last-child)::after{content:"";position:absolute;left:17px;top:50px;width:2px;height:0;background:linear-gradient(var(--n2),var(--gold));transition:height .6s var(--ease)}
.flow.on .fs:not(:last-child)::after{height:calc(100% - 36px)}
.flow.on .fs:nth-child(2)::after{transition-delay:.25s}.flow.on .fs:nth-child(3)::after{transition-delay:.5s}
.fs-n{width:36px;height:36px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 5px 10px -4px rgba(14,35,80,.5);z-index:1}
.fs-n svg{width:19px;height:19px}
.fs-n.c1{background:linear-gradient(160deg,#F05252,#C81E1E)}
.fs-n.c2{background:linear-gradient(160deg,#F5B83A,#C98B0A)}
.fs-n.c3{background:linear-gradient(160deg,#2C5AB0,#0E2350)}
.fs-n.c4{background:linear-gradient(160deg,#18B57A,#0E7A50)}

IN_EN_WORD.sort(function(a,b){return b[0].length-a[0].length;});
function inHasKo(s){return /[가-힣]/.test(String(s==null?'':s));}
function inEnTx(s){
  var t=String(s==null?'':s).trim();
  if(!t)return '';
  if(!inHasKo(t))return t;
  if(IN_EN_PHRASE[t])return IN_EN_PHRASE[t];
  var v=t;
  v=v.replace(/(\d+)\s*호기/g,'Unit $1').replace(/(\d+)\s*대(?![가-힣])/g,function(m,q){return q+(q==='1'?' unit':' units');})
     .replace(/(\d+)\s*층/g,'$1F').replace(/(\d+)\s*개/g,'$1');
  // 「1호기 · 로비」처럼 구분자로 나뉜 문구는 조각마다 통째 사전을 먼저 봅니다
  v=v.split(/(\s*[·,/]\s*)/).map(function(seg){var k=seg.trim();return (k&&IN_EN_PHRASE[k])?seg.replace(k,IN_EN_PHRASE[k]):seg;}).join('');
  IN_EN_WORD.forEach(function(d){v=v.split(d[0]).join(d[1]);});
  v=v.replace(/\s{2,}/g,' ').trim();
  return inHasKo(v)?'':v;   // 반쪽 번역은 쓰지 않습니다
}

function inTrCacheLoad(){try{var o=JSON.parse(localStorage.getItem(IN_TR_KEY)||'{}');return (o&&typeof o==='object')?o:{};}catch(e){return {};}}
function inTrCacheSave(o){try{var ks=Object.keys(o);if(ks.length>400){ks.slice(0,ks.length-400).forEach(function(k){delete o[k];});}localStorage.setItem(IN_TR_KEY,JSON.stringify(o));}catch(e){}}

function tr(ko,en){
  if(LANG!=='en')return ko==null?'':String(ko);
  if(en&&!inHasKo(en))return String(en);
  if(!ko)return en?String(en):'';
  if(!inHasKo(ko))return String(ko);
  var d=inEnTx(ko);if(d)return d;
  if(TRC[ko])return TRC[ko];
  if(!TRQ[ko]){TRQ[ko]=1;
    fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=ko&tl=en&dt=t&q='+encodeURIComponent(ko))
      .then(function(r){return r.json();})
      .then(function(j){var s=(j&&j[0])?j[0].map(function(x){return x[0];}).join(''):'';if(!s||inHasKo(s))return;TRC[ko]=s;inTrCacheSave(TRC);
        if(LANG==='en'){clearTimeout(trTimer);trTimer=setTimeout(function(){render(true);},250);}})
      .catch(function(){});}
  return String(ko);
}

function buildUnits(d,ac){
  return ac.cu.map(function(c){
    var fx=(c.fix&&c.fix.on&&num(c.fix.a)!=null&&num(c.fix.b)!=null)?c.fix:null;
    var a=num(c.a),b=num(c.b),has=a!=null&&b!=null;
    var u={label:c.label||'',c:c,fx:fx,has:has||!!fx,dt0:has?a-b:null,iss:[],done:[],chk:[],msr:[],ph:[],lv:0};
    u.dt=fx?(num(fx.a)-num(fx.b)):u.dt0;
    u.dtLv=u.dt==null?0:(u.dt>=12?0:u.dt>=9?1:2);u.lv=u.dtLv;
    if(c.result==='bad'&&!fx)u.lv=Math.max(u.lv,2);
    function has_(x){return arr(x.units).indexOf(c.label)>=0;}
    arr(d.results).forEach(function(r){if(has_(r)){u.chk.push(r);u.lv=Math.max(u.lv,LVR[stOf(r.status)]);}});
    arr(d.defects).forEach(function(f){if(has_(f)){(f.status==='done'?u.done:u.iss).push(f);u.lv=Math.max(u.lv,f.status==='done'?1:((f.risk==='h'||f.risk==='vh')?2:1));}});
    ac.lk.forEach(function(l){if(l.label===c.label&&l.status==='bad')u.lv=2;});
    ac.ms.forEach(function(m){if(has_(m))u.msr.push(m);});
    arr(d.problemPhotos).forEach(function(p){if(has_(p))u.ph.push(p);});
    u.leak=ac.lk.filter(function(l){return l.label===c.label;});
    u.pc=u.c.photos.length+((fx&&arr(fx.aPhotos).length)||0)+u.leak.reduce(function(n,l){return n+arr(l.photos).length;},0)+u.msr.reduce(function(n,m){return n+m.photos.length+arr(m.fix&&m.fix.aPhotos).length;},0)+u.ph.reduce(function(n,p){return n+arr(p.photos).length;},0);

}

  h+=invoiceCard(d);
  var vib=bad.some(function(c){return c.key==='vibration';}),noi=bad.some(function(c){return c.key==='noise';});
  var stage='<div class="wm-stage"><div class="wm3d'+(vib&&!ST.pdf?' shake':'')+'" style="--led:'+(bad.length?'#EF4444':'#22C55E')+'"><div class="wm-f"><div class="wm-panel"><i></i><i></i><i class="led"></i></div><div class="wm-door"><i class="wm-drum"></i></div></div></div><i class="wm-sh"></i>'+
    (vib?'<span class="wm-call" style="left:6%;top:38%"><i style="background:var(--red)">✕</i>'+(LANG==='ko'?'진동':'Vibration')+'</span><i class="wm-wave" style="left:24%;top:62%"></i>':'')+
    (noi?'<span class="wm-call" style="right:6%;top:24%"><i style="background:var(--red)">✕</i>'+(LANG==='ko'?'소음':'Noise')+'</span><i class="wm-wave" style="right:22%;top:46%;animation-delay:.5s"></i>':'')+'</div>';
  var cg=cl.length?'<div class="cl">'+cl.map(function(c){var b=c.result==='bad';return '<div class="cl-i'+(b?' bad':'')+'"><span class="ic '+(b?'bad':'ok')+'">'+(b?'✕':'✓')+'</span><div><b>'+esc(LANG==='en'?(CHECK_EN[c.key]||tr(c.label)):c.label)+'</b><span>'+(b?t('clBad'):t('clOk'))+'</span></div></div>';}).join('')+'</div>':'';
  h+=sec('s-wm',t('nav').wm,t('wT'),cl.length?t('wS').replace('{n}',cl.length):'','<div class="rp-card">'+stage+cg+'</div>');
  if(pr.length)h+=sec('s-prob',t('nav').prob,t('prT'),t('prS'),pr.map(function(p,i){return '<div class="rp-card prob"><div class="prob-h"><span class="prob-n">'+(i+1)+'</span><div>'+(p.memo?'<p>'+esc(v(p,'memo'))+'</p>':'')+'</div></div>'+(arr(p.photos).length?'<div class="pg" style="margin-top:0">'+arr(p.photos).map(function(x){return ph(x);}).join('')+'</div>':'')+'</div>';}).join(''),pr.length+(LANG==='ko'?'건':''));
  else if(oldPh.length)h+=sec('s-prob',t('nav').prob,t('prT'),'',grid('wp',oldPh,6,''),oldPh.length+(LANG==='ko'?'장':''));
  /* 할 일: 의견 ③ 줄을 제품별로 */
  var rec=[],S=sections(op||''),Se=sections(opEn||'');
  S.forEach(function(s,si){if(!/조치|권고|권장/.test(s.h))return;var se=Se[si]||{li:[]};
    s.li.forEach(function(x,i){var tx=x.t,ty=/조속|즉시|시급/.test(tx)?'urgent':/교체|수리/.test(tx)?'regular':'review';var ex=se.li[i]||{};rec.push({type:ty,title:tx,title_en:ex.t||'',grp:x.g,grp_en:ex.g||''});});});
  if(rec.length){var save=T.ko.tabs.regular,saveE=T.en.tabs.regular;T.ko.tabs.regular='권장';T.en.tabs.regular='Advised';h+=todoSection(rec);T.ko.tabs.regular=save;T.en.tabs.regular=saveE;}
  h+=opCard(D,'s-op');
  var pb=pairs('wb',d.wBeforePhotos,d.wAfterPhotos,t('cBefore'),t('cAfter'),2),hp='';
  if(pb)hp+='<div class="psub" style="margin-top:0">'+t('pClean')+' <small>'+Math.max(arr(d.wBeforePhotos).length,arr(d.wAfterPhotos).length)+'</small></div>'+pb;
  if(arr(d.wEtcPhotos).length)hp+='<div class="psub"'+(hp?'':' style="margin-top:0"')+'>'+t('etc')+'</div>'+grid('we',d.wEtcPhotos,6,'pg3');
  hp+=videos(d.workVideos);
  if(hp)h+=sec('s-photo',t('nav').photo,t('pT'),'',hp);
  return h;
}

/* ══════════════ 그리기 ══════════════ */
function kindOf(d){if(!d.type&&(PAGE==='install'||PAGE==='washer'))return PAGE;if(d.type==='install')return 'install';if(d.type==='washer')return 'washer';if(d.type==='dispatch')return d.dispatchKind==='check'?'check':'repair';return 'inspect';}
function render(keep){
  var d=DATA;if(!d)return;
  KIND=kindOf(d);currentLang=LANG;
  document.documentElement.lang=LANG;
  var ttl=t('top')[KIND];document.getElementById('topT').textContent=ttl;
  document.title=(LANG==='ko'?'해피홈케어 ':'Happy Home Care ')+ttl+(d.client?' · '+d.client:'');
  ['bPdf','bShare','bAsk'].forEach(function(k){document.getElementById(k).textContent=t(k);});
  document.querySelectorAll('.rp-lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===LANG);});
  var y=window.scrollY;
  var h=KIND==='install'?rInstall(d):KIND==='washer'?rWasher(d):(KIND==='check'||KIND==='repair')?rDispatch(d):rInspect(d);
  h+='<footer class="rp-foot"><div class="rp-sign">'+LOGO+'<div><b>'+esc(d.engineer?v(d,'engineer'):(d.dispatchTech||t('team')))+'</b><br>Happy Home Care</div></div><br>'+t('foot')+'<br><b>HAPPY WORKS SERVICES SDN. BHD.</b><br>+60 17-417 2774</footer>';
  document.getElementById('app').innerHTML=h;
  document.getElementById('b-wa').href=wa();
  segPill();buildNav();bindAfter();drawQR();
  if(keep)window.scrollTo(0,y);
  if(ST.openIdx>=0&&U[ST.openIdx])openSheet(ST.openIdx);
}
function segPill(){var b=document.querySelector('#seg button.on'),p=document.getElementById('segp');if(b&&p){p.style.left=b.offsetLeft+'px';p.style.width=b.offsetWidth+'px';}}
function buildNav(){
  var ni=document.getElementById('navin');ni.querySelectorAll('button').forEach(function(b){b.remove();});
  [].forEach.call(document.querySelectorAll('#app [data-nav]'),function(e){var b=document.createElement('button');b.type='button';b.textContent=e.getAttribute('data-nav');b.dataset.s=e.id;b.onclick=function(){window.scrollTo({top:e.getBoundingClientRect().top+scrollY-110,behavior:reduce()?'auto':'smooth'});};ni.appendChild(b);});
  curSec=-1;spy();
}
var curSec=-1;
function spy(){
  var bs=[].slice.call(document.querySelectorAll('#navin button'));if(!bs.length)return;var idx=0;
  bs.forEach(function(b,i){var e=document.getElementById(b.dataset.s);if(e&&e.getBoundingClientRect().top<=150)idx=i;});
  if(window.innerHeight+window.scrollY>=document.body.scrollHeight-4)idx=bs.length-1;
  bs.forEach(function(b,i){b.classList.toggle('on',i===idx);});
  var b=bs[idx],p=document.getElementById('navpill');p.style.left=b.offsetLeft+'px';p.style.width=b.offsetWidth+'px';
  if(idx!==curSec){curSec=idx;var ni=document.getElementById('navin');ni.scrollTo({left:b.offsetLeft-ni.clientWidth/2+b.offsetWidth/2,behavior:'smooth'});}
}
window.addEventListener('scroll',function(){requestAnimationFrame(spy);},{passive:true});
window.addEventListener('resize',function(){spy();segPill();});
function reduce(){return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;}
var animDone=false;
function bindAfter(){
  /* 캐러셀 — 넘길 때 에어컨이 입체적으로 돌아갑니다 */
  var tr_=document.getElementById('uct');
  if(tr_&&!ST.pdf){var onScr=function(){var r=tr_.getBoundingClientRect(),cx=r.left+r.width/2,best=0,bd=1e9;
      [].forEach.call(tr_.querySelectorAll('.uc'),function(card,i){var cr=card.getBoundingClientRect(),off=(cr.left+cr.width/2-cx)/cr.width;var g=card.querySelector('.ac-g');if(g)g.style.setProperty('--ry',(-22+off*-34).toFixed(1)+'deg');if(Math.abs(off)<bd){bd=Math.abs(off);best=i;}});
      [].forEach.call(document.querySelectorAll('#ucd i'),function(x,i){x.classList.toggle('on',i===best);});};
    tr_.addEventListener('scroll',function(){requestAnimationFrame(onScr);},{passive:true});onScr();}
  /* 점수 · 막대 · 단계선 */
  var arc=document.getElementById('ringArc'),sn=document.getElementById('scoreN');
  if(arc&&!ST.pdf){if(animDone||reduce()){arc.style.transition='none';arc.style.strokeDashoffset=(351.9*(1-SCORE/100)).toFixed(1);sn.textContent=SCORE;}
    else{requestAnimationFrame(function(){arc.style.strokeDashoffset=(351.9*(1-SCORE/100)).toFixed(1);});var t0=performance.now();(function st(now){var k=Math.min(1,(now-t0)/1200);k=1-Math.pow(1-k,3);sn.textContent=Math.round(SCORE*k);if(k<1)requestAnimationFrame(st);})(t0);}}
  var targets=[].slice.call(document.querySelectorAll('#s-cool,#flow'));
  if(ST.pdf||animDone||!('IntersectionObserver' in window)){fillAll();}
  else{var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){fill(e.target);io.unobserve(e.target);}});},{threshold:.25});targets.forEach(function(x){io.observe(x);});}
  animDone=true;
  var hc=document.getElementById('hero');
  if(hc){hc.addEventListener('pointermove',function(e){if(e.pointerType!=='mouse'||ST.pdf)return;var r=hc.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;hc.style.transform='rotateX('+((.5-y)*7).toFixed(2)+'deg) rotateY('+((x-.5)*9).toFixed(2)+'deg)';hc.style.setProperty('--mx',x*100+'%');hc.style.setProperty('--my',y*100+'%');});
    hc.addEventListener('pointerleave',function(){hc.style.transform='';});}
}
function fill(el){if(el.id==='flow')el.classList.add('on');[].forEach.call(el.querySelectorAll('.cfill,.dtbar i'),function(f){f.style.width=f.dataset.w+'%';});}
function fillAll(){[].forEach.call(document.querySelectorAll('#s-cool,#flow'),fill);}

/* ── 누르기 ── */
document.getElementById('app').addEventListener('click',function(e){
  var z=e.target.closest('[data-z]');if(z&&!e.target.closest('a')){zoom(z.getAttribute('data-z'));return;}
  var c=e.target.closest('[data-u]');if(c){e.preventDefault();openSheet(+c.dataset.u);return;}
  var j=e.target.closest('[data-jump]');if(j){var i=U.findIndex(function(u){return u.lv===+j.dataset.jump;});if(i>=0)goUnit(i);return;}
  var tb=e.target.closest('[data-tab]');if(tb){ST.tab=tb.dataset.tab;render(true);return;}
  var f=e.target.closest('[data-f]');if(f){ST.issue=f.dataset.f;render(true);return;}
  var m=e.target.closest('[data-more]');if(m){var id=m.dataset.more,y0=m.getBoundingClientRect().top;ST.more[id]=!ST.more[id];render(true);if(!ST.more[id]){var n=document.querySelector('[data-more="'+id+'"]');if(n)window.scrollBy(0,n.getBoundingClientRect().top-y0);}return;}
  if(e.target.closest('#opm')){ST.opOpen=!ST.opOpen;document.getElementById('opb').classList.toggle('clip',!ST.opOpen);e.target.closest('#opm').textContent=ST.opOpen?t('less')+' ▴':t('more')+' ▾';return;}
  if(e.target.closest('#acch')){ST.accOpen=!document.getElementById('acc').classList.contains('open');document.getElementById('acc').classList.toggle('open',ST.accOpen);return;}
});
function goUnit(i){var tr_=document.getElementById('uct');if(!tr_)return;var c=tr_.children[i],s=document.getElementById('s-units');window.scrollTo({top:s.getBoundingClientRect().top+scrollY-110,behavior:'smooth'});setTimeout(function(){tr_.scrollTo({left:c.offsetLeft-(tr_.clientWidth-c.offsetWidth)/2,behavior:'smooth'});c.classList.add('flash');setTimeout(function(){c.classList.remove('flash');},1500);},350);}

/* ── 바텀시트 ── */
var sheet=document.getElementById('sheet'),ov=document.getElementById('shov');
function openSheet(i){
  var u=U[i];if(!u)return;ST.openIdx=i;
  var h='<div class="sh-head" id="shhead">'+acHTML(u.l,true)+'<h3>'+esc(unitName(u))+'</h3><div class="md">'+esc([unitTag(u),unitModel(u)].filter(Boolean).join(' · '))+'</div><span class="pill '+u.l+'">'+t('lv')[u.l]+'</span></div>'+
   (U.length>1?'<div class="sh-nav"><button type="button" data-nv="-1" '+(i?'':'disabled')+' aria-label="prev">‹</button><button type="button" data-nv="1" '+(i<U.length-1?'':'disabled')+' aria-label="next">›</button></div>':'')+unitDetail(u);
  var body=document.getElementById('shbody');body.innerHTML=h;body.scrollTop=0;
  sheet.classList.add('on');ov.classList.add('on');document.body.style.overflow='hidden';
}
function closeSheet(){sheet.classList.remove('on');ov.classList.remove('on');sheet.style.transform='';document.body.style.overflow='';ST.openIdx=-1;}
ov.onclick=closeSheet;document.getElementById('shx').onclick=closeSheet;
document.getElementById('shbody').addEventListener('click',function(e){var n=e.target.closest('[data-nv]');if(n){openSheet(ST.openIdx+(+n.dataset.nv));return;}var z=e.target.closest('[data-z]');if(z)zoom(z.getAttribute('data-z'));});
(function(){var y0=null,dy=0;
  function move(e){if(y0===null)return;dy=Math.max(0,e.clientY-y0);sheet.style.transform='translateY('+dy+'px)';}
  function end(){if(y0===null)return;sheet.classList.remove('drag');y0=null;if(dy>110)closeSheet();else sheet.style.transform='';}
  sheet.addEventListener('pointerdown',function(e){if(e.target.closest('button'))return;if(e.target.closest('#shgrab,#shhead')){y0=e.clientY;dy=0;sheet.classList.add('drag');}});
  window.addEventListener('pointermove',move);window.addEventListener('pointerup',end);window.addEventListener('pointercancel',end);
})();
(function(){var x0=null,y0=0,b=document.getElementById('shbody');
  b.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  b.addEventListener('touchend',function(e){if(x0===null)return;var dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;x0=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.6){var n=ST.openIdx+(dx<0?1:-1);if(n>=0&&n<U.length)openSheet(n);}},{passive:true});
})();

/* ── 사진 크게 보기 (누르면 닫힘) ── */
var zb=document.getElementById('zoom');
function zoom(src){document.getElementById('zimg').src=src;zb.classList.add('on');}
zb.addEventListener('click',function(){zb.classList.remove('on');});
document.addEventListener('keydown',function(e){if(e.key!=='Escape')return;if(zb.classList.contains('on'))zb.classList.remove('on');else if(ST.openIdx>=0)closeSheet();});

/* ── 하단 버튼 · 언어 ── */
function toast(m){var x=document.getElementById('toast');x.textContent=m;x.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){x.classList.remove('on');},2400);}
document.getElementById('b-pdf').onclick=function(){toast(t('printing'));setTimeout(function(){window.print();},400);};
document.getElementById('b-share').onclick=function(){var u=location.href;if(navigator.share){navigator.share({title:document.title,url:u}).catch(function(){});return;}
  try{navigator.clipboard.writeText(u).then(function(){toast(t('copied'));},function(){toast(u);});}catch(e){toast(u);}};
function setLang(l){if(l!=='ko'&&l!=='en')return;if(LANG===l)return;LANG=l;currentLang=l;
  try{var q=new URLSearchParams(location.search);q.set('lang',l);history.replaceState(null,'',location.pathname+'?'+q.toString()+location.hash);}catch(e){}
  render(true);try{window.dispatchEvent(new Event('hhc-lang-change'));}catch(e){}}
window.setLang=setLang;
document.querySelectorAll('.rp-lang button').forEach(function(b){b.onclick=function(){setLang(b.dataset.l);};});

/* ── PDF 공유(화면 캡처) · 인쇄용 문서 모드 ── */
window.hhcDocMode=function(on){
  ST.pdf=!!on;document.documentElement.classList.toggle('pdfdoc',ST.pdf);
  if(ST.pdf&&ST.openIdx>=0)closeSheet();
  render(false);return true;
};
var wasPdf=false;
window.addEventListener('beforeprint',function(){wasPdf=ST.pdf;if(!ST.pdf){ST.pdf=true;document.documentElement.classList.add('pdfdoc');render(true);}});
window.addEventListener('afterprint',function(){if(!wasPdf){ST.pdf=false;document.documentElement.classList.remove('pdfdoc');render(true);}});

/* ── 불러오기 ── */
window.renderReport=function(d){if(!d)return;window._reportData=d;DATA=d;render(false);};
function apiDoc(t_,id,_try){
  _try=_try||0;
  return fetch('/api/doc?t='+t_+'&id='+encodeURIComponent(id),{cache:'no-store'}).then(function(r){
    return r.json().catch(function(){return null;}).then(function(j){
      if(r.status===404||(j&&j.error==='not-found'))return null;
      if(!r.ok||!j||!j.ok){if(r.status>=500&&_try<2)return new Promise(function(res){setTimeout(res,800);}).then(function(){return apiDoc(t_,id,_try+1);});throw new Error((j&&j.error)||('http '+r.status));}
      var d=j.doc||{};delete d.__id;return d;
    });
  },function(e){if(_try<2)return new Promise(function(res){setTimeout(res,800);}).then(function(){return apiDoc(t_,id,_try+1);});throw e;});
}
function boot(){
  document.getElementById('topT').textContent=t('top')[PAGE];
  ['bPdf','bShare','bAsk'].forEach(function(k){document.getElementById(k).textContent=t(k);});
  document.querySelectorAll('.rp-lang button').forEach(function(b){b.classList.toggle('on',b.dataset.l===LANG);});
  if(!RID){window.renderReport(window.getSampleData());return;}
  var app=document.getElementById('app');
  app.innerHTML='<div class="rp-load"><i></i><span>'+t('loading')+'</span></div>';
  apiDoc('inspection',RID).then(function(d){
    if(!d){app.innerHTML='<div class="rp-card empty" style="margin-top:40px">'+t('notFound')+'</div>';return;}
    window.renderReport(d);
  }).catch(function(){app.innerHTML='<div class="rp-card empty" style="margin-top:40px">'+t('notFound')+'</div>';});
}

boot();
</script>
