<!--

  · 모든 발송 메시지를 한 화면에서: 왓츠앱으로 받는 모습 · 카카오톡 카드 · 링크를 누르면 열리는 안내장
  · 문구는 따로 적어 두지 않습니다. 총괄 고객관리(customer-admin.html)를 화면 밖에 숨겨 열고,
    발송 창을 「미리보기 모드」(caSendModal(idx,{snap:true}))로 띄워 실제로 나가는 문구 · 카드를 그대로 읽습니다.
    → 발송 창 문구를 고치면 여기도 저절로 같아집니다.
  · 발송 · 복사 · 저장 · 짧은 주소 만들기를 하지 않습니다 (고객 마스터 미등록 고객은 고를 수 없음)
  · 카카오 카드 규칙: customer-admin.html kkCardSpec (kkShareMsg · kkSend 와 같은 규칙)

<script type="module" src="/hhc-auth.js"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--n:#0E2350;--n2:#16346E;--bl:#2563EB;--ink:#14192A;--ink2:#5A6478;--ink3:#98A1B4;--line:#E4E9F2;--soft:#F6F8FC;--ok:#0E9B63;--red:#DC2626;--gold:#B98A16;
  --e1:0 1px 2px rgba(11,24,51,.09),0 5px 12px -3px rgba(11,24,51,.14);--e2:0 1px 2px rgba(11,24,51,.10),0 8px 16px -4px rgba(11,24,51,.16),0 26px 44px -14px rgba(11,24,51,.34)}
body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;background:#EEF1F6;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;background:linear-gradient(120deg,var(--n),var(--n2));color:#fff;flex-wrap:wrap}
.top h1{font-size:17px;font-weight:800;letter-spacing:-.02em}.top h1 small{display:block;font-size:11.5px;font-weight:500;opacity:.65;margin-top:1px}
.top .sp{flex:1}
.pill{display:flex;background:rgba(255,255,255,.14);border-radius:99px;padding:3px}.pill button{padding:6px 13px;border-radius:99px;font-size:12.5px;font-weight:800;color:rgba(255,255,255,.75)}.pill button.on{background:#fff;color:var(--n)}
.cpick{position:relative}
.cpick>button{display:flex;align-items:center;gap:6px;font-size:13px;padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;max-width:260px}
.cpick>button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdrop{position:absolute;right:0;top:calc(100% + 6px);width:300px;max-height:420px;overflow:auto;background:#fff;color:var(--ink);border-radius:14px;box-shadow:var(--e2);padding:8px;display:none;z-index:30}
.cdrop.on{display:block}.cdrop input{width:100%;padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);font-size:14px;margin-bottom:6px}
.cdrop button{display:flex;width:100%;text-align:left;padding:8px 10px;border-radius:9px;font-size:13.5px;font-weight:650;gap:6px}.cdrop button:hover{background:var(--soft)}.cdrop button small{margin-left:auto;color:var(--ink3);font-weight:600}
.wrap{display:grid;grid-template-columns:290px 1fr;min-height:calc(100vh - 58px)}
.side{background:#fff;border-right:1px solid var(--line);padding:12px 10px 40px;overflow:auto;max-height:calc(100vh - 58px);position:sticky;top:58px}
.srch{width:100%;padding:10px 12px;border-radius:11px;border:1.5px solid var(--line);font-size:14px;margin-bottom:4px;background:var(--soft)}
.grp{margin:14px 6px 5px;font-size:11.5px;font-weight:800;color:var(--ink3);display:flex;justify-content:space-between}
.it{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:9px 10px;border-radius:11px;font-size:14px;font-weight:650}
.it:hover{background:var(--soft)}.it.on{background:var(--n);color:#fff}
.it .k{margin-left:auto;display:flex;gap:3px;flex:none}.it .k i{font-style:normal;font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:#EEF1F6;color:var(--ink2)}
.it .k i.au{background:#FFF4D6;color:#92600A}.it .k i.no{background:transparent;color:var(--ink3)}
.it.on .k i{background:rgba(255,255,255,.18);color:#fff}
.it.dim{color:var(--ink3)}
.main{padding:20px 24px 60px;min-width:0}
.hd h2{font-size:23px;font-weight:850;letter-spacing:-.03em}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.meta span{font-size:12px;font-weight:700;padding:5px 10px;border-radius:99px;background:#fff;box-shadow:var(--e1);color:var(--ink2)}.meta span b{color:var(--n)}
.meta span.au{background:#FFF4D6;color:#92600A;box-shadow:none}.meta span.no{background:#FDECEC;color:var(--red);box-shadow:none}.meta span.sp{background:#E9F7F0;color:#0B6B47;box-shadow:none}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:18px;align-items:start}
.col h3{font-size:13px;font-weight:800;color:var(--ink2);margin:0 0 8px 4px}
.phone{border-radius:28px;padding:10px;background:#0b1020;box-shadow:var(--e2)}
.scr{border-radius:20px;overflow:hidden;height:620px;position:relative;background:#fff}
.wa{background:#EFE7DD;height:100%;display:flex;flex-direction:column}
.wa .bar{background:#075E54;color:#fff;padding:12px 14px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px}.wa .bar i{width:30px;height:30px;border-radius:50%;background:#cfd8dc;display:block;flex:none}
.wa .bd{flex:1;overflow:auto;padding:12px 10px}
.bub{margin-left:auto;max-width:94%;background:#DCF8C6;border-radius:10px 2px 10px 10px;padding:5px 5px 6px;box-shadow:0 1px .5px rgba(0,0,0,.13);font-size:13.5px;line-height:1.45}
.bub .lp{background:rgba(0,0,0,.05);border-radius:7px;overflow:hidden;margin-bottom:6px}.bub .lp img{display:block;width:100%;aspect-ratio:1200/630;object-fit:cover;background:#ccc}
.bub .lp div{padding:6px 8px}.bub .lp b{display:block;font-size:12.5px}.bub .lp small{font-size:11px;color:#667}
.bub .tx{padding:0 4px;white-space:pre-wrap;overflow-wrap:anywhere}.bub .tx a{color:#027EB5}
.bub .tm{text-align:right;font-size:10.5px;color:#667;padding:0 4px}
.kk{background:#B2C7DA;height:100%;display:flex;flex-direction:column}
.kk .bar{background:#A9BDD0;padding:12px 14px;font-weight:700;font-size:14px;color:#222}
.kk .bd{flex:1;overflow:auto;padding:14px 12px}
.kc{margin-left:auto;width:88%;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.1)}
.kc img{display:block;width:100%;aspect-ratio:1200/630;object-fit:cover;background:#ddd}
.kc .t{padding:11px 12px 0;font-size:14px;font-weight:700;line-height:1.4;white-space:pre-line}
.kc .d{padding:4px 12px 12px;font-size:13px;color:#555;line-height:1.45;white-space:pre-line;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.kc.tx .d{padding-top:12px;color:#222;-webkit-line-clamp:unset;display:block}
.kc .bt span{display:block;padding:11px;text-align:center;font-size:13.5px;font-weight:600;border-top:1px solid #eee}
.kc .ft{padding:7px 12px;font-size:11px;color:#999;border-top:1px solid #eee}
.kk .note{margin:10px 6px 0;font-size:11.5px;color:#2c3a4a;line-height:1.45}
.pgw{height:100%;position:relative}.pgw iframe{border:0;width:100%;height:100%;display:block}
.pgw .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink3);font-size:13px;text-align:center;padding:20px}
.lnk{display:flex;gap:6px;margin:8px 4px 0;font-size:12px;color:var(--ink2);font-weight:600;word-break:break-all}
.lnk a{color:var(--bl);flex:none}
.tool{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.tool button{padding:11px 16px;border-radius:12px;background:#fff;box-shadow:var(--e1);font-size:13.5px;font-weight:800;color:var(--n)}
.tool button.dis{color:var(--ink3);box-shadow:none;background:#E7EBF2;cursor:default}
.tip{margin-top:10px;font-size:12.5px;color:var(--ink2);line-height:1.6}
.load{display:grid;place-items:center;min-height:60vh;color:var(--ink2);font-size:14px;text-align:center;line-height:1.7}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid #D5DCE8;border-top-color:var(--n);animation:r 1s linear infinite;margin:0 auto 12px}@keyframes r{to{transform:rotate(360deg)}}
.oth{background:#fff;border-radius:16px;box-shadow:var(--e1);padding:16px 18px;margin-top:16px;font-size:14px;line-height:1.7}
.oth b{color:var(--n)}
#ca{position:fixed;left:-3000px;top:0;width:1200px;height:900px;border:0;visibility:hidden}
@media (max-width:1150px){.cols{grid-template-columns:1fr 1fr}.cols .col:nth-child(3){grid-column:1/-1;max-width:430px}}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr}.side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:10px}
  #list{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}.side .grp,.srch{display:none}.it{flex:none;width:auto;white-space:nowrap}.it .k{display:none}
  .main{padding:14px 12px 50px}.cols{grid-template-columns:1fr}.cols .col:nth-child(3){max-width:none}
  .cdrop{right:auto;left:0}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div class="top"><h1>📨 발송 메시지 관리실<small>보내지 않고 고객이 받는 모습 그대로 · 보기 전용</small></h1><span class="sp"></span>
  <div class="cpick"><button type="button" id="cbtn">👤 <span id="cname">고객 불러오는 중…</span> ▾</button><div class="cdrop" id="cdrop"><input id="cq" placeholder="🔍 고객 이름 · 전화번호"><div id="clist"></div></div></div>
  <div class="pill" id="lang"><button data-l="ko" class="on">한국어</button><button data-l="en">EN</button></div></div>
<div class="wrap">
  <aside class="side"><input class="srch" id="q" placeholder="🔍 메시지 찾기 (예: 확정, 명함)"><div id="list"></div></aside>
  <main class="main" id="main"><div class="load"><div><div class="spin"></div>총괄 고객관리 자료를 불러오는 중입니다…<br><small>처음 한 번은 10초쯤 걸릴 수 있어요</small></div></div></main>
</div>
<iframe id="ca" title="총괄 고객관리 (숨김)" src="/customer-admin.html?mc=1" aria-hidden="true" tabindex="-1"></iframe>
<script>
(function(){
  var LANG='ko',CUR='',C=null,CI=-1,ENT=[],RES=null;
  var $=function(id){return document.getElementById(id);};
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function W(){try{return $('ca').contentWindow;}catch(e){return null;}}
  // 다른 화면에서 보내는 안내 — 다음 단계에서 미리보기를 붙입니다 (지금은 어디서 보내는지만)
  var OTHER=[
    ['🧾','인보이스 발송','예약관리 › 🧾 인보이스'],
    ['📨','의뢰서 보내기','의뢰관리 › 📨 의뢰서 보내기'],
    ['🔧','점검보고서 발송','점검보고서 화면 › 발송'],
    ['🎫','상품권 · 할인권 발송','상품·할인권 화면 › 발송'],
    ['🔁','양도 · 전환 처리 안내','양도·전환 화면 › 발송'],
    ['📝','수리 결과 · 메모 안내','메모장 › 발송'],
    ['📑','계약서 · 이용내역 발송','계약 화면 › 발송']
  ];
  // 🔔 방문 안내 8종 (2026-11-25) — 문구는 공통 파일(HHCMsg.visitMsg) · 숨긴 고객관리의 caVisitPreview 로 그 고객 최근 확정 예약 기준
  var VIS=[['pre','📅','사전 안내 (7일 전 · 3일 전)','d'],['tomorrow','🌙','내일 방문','d'],['today','☀️','당일 안내','d'],
    ['move','🚗','이동 중','f'],['early','⏰','이른 방문','f'],['arrive','🏢','가드하우스 도착','f'],['delayT','⏳','지연 (교통)','f'],['delayW','🛠','지연 (작업)','f']];
  var VIS_IMG={tomorrow:'remind-tmr',today:'remind-today',move:'onway',early:'onway',arrive:'arrive',delayT:'delay',delayW:'delayw'};
  function lb(t){var x=C&&C.tpls.find(function(o){return o.t===t;});return x?x.lb:t;}
  function list(){
    var q=($('q').value||'').trim(),h='';if(!C){$('list').innerHTML='';return;}
    var seen={};
    function row(t){var o=C.tpls.find(function(x){return x.t===t;});if(!o)return '';seen[t]=1;if(q&&o.lb.indexOf(q)<0)return '';
      var no=o.need&&!o.n,au=C.auto===t;
      return '<button class="it'+(CUR===t?' on':'')+'" data-t="'+t+'">'+esc(o.lb)+'<span class="k">'+(au?'<i class="au">🎯 자동</i>':'')+(no?'<i class="no">자료 없음</i>':(o.n?'<i>'+o.n+'건</i>':''))+'</span></button>';}
    var _ord=['📅','💰','📄','🌿','📢','📘'];
    (C.groups||[]).slice().sort(function(a,b){var x=_ord.indexOf(Array.from(a.g)[0]),y=_ord.indexOf(Array.from(b.g)[0]);return (x<0?9:x)-(y<0?9:y);}).forEach(function(g){var r=g.ts.map(row).join('');if(r)h+='<div class="grp"><span>'+esc(g.g)+'</span><span>'+g.ts.length+'</span></div>'+r;});
    var rest=C.tpls.filter(function(o){return !seen[o.t];}).map(function(o){return row(o.t);}).join('');
    if(rest)h+='<div class="grp"><span>🧩 그 밖에 (발송 창 목록에 안 보이는 것)</span></div>'+rest;
    var vv=VIS.filter(function(v){return !q||v[2].indexOf(q)>=0;});
    if(vv.length)h+='<div class="grp"><span>🔔 방문 안내</span><span>'+VIS.length+'</span></div>'+vv.map(function(v){return '<button class="it'+(CUR==='v:'+v[0]?' on':'')+'" data-v="'+v[0]+'">'+v[1]+' '+esc(v[2])+'<span class="k"><i>'+(v[3]==='d'?'진행 현황':'스케줄')+'</i></span></button>';}).join('');
    var oth=OTHER.filter(function(o){return !q||o[1].indexOf(q)>=0;});
    if(oth.length)h+='<div class="grp"><span>🧰 다른 화면에서 보내는 안내</span><span>'+OTHER.length+'</span></div>'+oth.map(function(o,i){return '<button class="it dim" data-o="'+OTHER.indexOf(o)+'">'+o[0]+' '+esc(o[1])+'</button>';}).join('');
    $('list').innerHTML=h;
  }
  // 긴 주소는 실제 발송 때 짧은 주소로 바뀌어 나가므로 그 모양으로 보여 줍니다
  function shortLook(u){return (u.length>40&&/happyhomecare\.com\.my\//.test(u)&&!/\/r(\.html)?\?k=/.test(u))?'https://happyhomecare.com.my/r?k=••••':u;}
  function waHtml(t){return esc(t).replace(/\*([^*\n]+)\*/g,'<b>$1</b>').replace(/(https?:\/\/[^\s<]+)/g,function(u){return '<a>'+shortLook(u)+'</a>';});}
  function show(){
    if(!C||!CUR)return;var en=LANG==='en',r,err='';
    try{C.set(CUR,en);r=C.read();}catch(e){err=String(e&&e.message||e);}
    var o=C.tpls.find(function(x){return x.t===CUR;})||{},no=o.need&&!o.n,nm=C.name;
    var h='<div class="hd"><h2>'+esc(o.lb||CUR)+'</h2><div class="meta"><span>📍 <b>총괄 고객관리 › 📤 마이페이지 발송 › '+esc(o.lb||CUR)+'</b></span>'+
      (C.auto===CUR?'<span class="au">🎯 지금 이 고객에게 자동으로 골라지는 안내'+(C.why?' · '+esc(C.why):'')+'</span>':'')+
      (no?'<span class="no">이 고객은 자료가 없어 실제로는 보낼 수 없어요 · 다른 고객을 골라 보세요</span>':(o.n?'<span>📂 이 고객 자료 '+o.n+'건 중 최근 것</span>':''))+
      (r&&r.special?'<span class="sp">'+esc(r.special)+'</span>':'')+'</div></div>';
    if(err){h+='<div class="oth">⚠️ 이 고객 자료로는 미리보기를 만들 수 없어요. 다른 고객을 골라 보세요.<br><small style="color:var(--ink3)">'+esc(err)+'</small></div>';$('main').innerHTML=h;return;}
    $('main').innerHTML=h+cols(r,nm);RES=r;after(r);
  }
  function render3(title,from,note,r){
    var h='<div class="hd"><h2>'+esc(title)+'</h2><div class="meta"><span>📍 <b>'+esc(from)+'</b></span>'+(note?'<span class="sp">'+esc(note)+'</span>':'')+'</div></div>';
    $('main').innerHTML=h+cols(r,C?C.name:'');RES=r;after(r);
  }
  function cols(r,nm){
    var k=r.kk||{},lp=k.img,h='';
    h+='<div class="cols">';
    h+='<div class="col"><h3>💬 왓츠앱으로 받는 모습</h3><div class="phone"><div class="scr"><div class="wa"><div class="bar"><i></i>'+esc(nm)+'</div><div class="bd"><div class="bub">'+
       (lp?'<div class="lp"><img src="'+esc(lp)+'" alt="" loading="lazy"><div><b>'+esc(k.t||'')+'</b><small>happyhomecare.com.my</small></div></div>':'')+
       '<div class="tx">'+waHtml(r.wa)+'</div><div class="tm">✓✓</div></div></div></div></div></div></div>';
    h+='<div class="col"><h3>💛 카카오톡 카드</h3><div class="phone"><div class="scr"><div class="kk"><div class="bar">'+esc(nm)+'</div><div class="bd"><div class="kc'+(k.kind==='img'?'':' tx')+'">'+
       (k.kind==='img'?'<img src="'+esc(k.img)+'" alt="" loading="lazy"><div class="t">'+esc(k.t)+'</div>':'')+'<div class="d">'+esc(k.d)+'</div>'+
       '<div class="bt">'+(k.btns||[]).map(function(b){return '<span>'+esc(b)+'</span>';}).join('')+'</div><div class="ft">Happy Home Care</div></div>'+
       (k.kind!=='img'?'<p class="note">ⓘ 그림이 없는 글 카드로 나갑니다 (최대 200자)</p>':'')+'</div></div></div></div></div>';
    h+='<div class="col"><h3>📄 링크를 누르면 열리는 화면</h3><div class="phone"><div class="scr"><div class="pgw"><div class="ph">불러오는 중…</div><iframe id="pgf" title="안내장 미리보기" loading="lazy"></iframe></div></div></div>'+
       '<div class="lnk"><span>🔗</span><span style="flex:1">'+esc(r.link)+'</span><a href="'+esc(r.link)+'" target="_blank" rel="noopener">새 창 ↗</a></div></div>';
    h+='</div><div class="tool"><button type="button" id="cp">📋 왓츠앱 문구 복사</button><button class="dis" disabled>✏️ 문구 수정 (2단계)</button><button class="dis" disabled>🙈 숨기기 (3단계)</button><button class="dis" disabled>➕ 새 안내 추가 (3단계)</button></div>'+
      '<p class="tip">이 화면은 보기 전용이에요. 발송 · 저장을 하지 않습니다. 문구는 실제 발송 창에서 그대로 읽어 오므로, 발송 창 문구를 고치면 여기도 저절로 같아집니다.<br>링크 주소는 실제 발송 때 짧은 주소(happyhomecare.com.my/r?k=…)로 바뀌어 나갑니다.</p>';
    return h;
  }
  function after(r){
    var f=$('pgf');f.onload=function(){var p=f.previousElementSibling;if(p)p.remove();};f.src=r.link;
    $('cp').onclick=function(){var t=String(r.wa).replace(/\*/g,'');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){$('cp').textContent='✓ 복사됨';},function(){prompt('복사해서 쓰세요',t);});};
  }
  function showVisit(k){
    var v=VIS.find(function(x){return x[0]===k;}),en=LANG==='en',w=W(),r=null;
    try{r=w.caVisitPreview(C&&C.mid||CI,k,en);}catch(e){}
    if(!r){$('main').innerHTML='<div class="oth">⚠️ 미리보기를 만들 수 없어요. 새로고침해 주세요.</div>';return;}
    var M=w.HHCMsg,kk,img,md=(/^\d{4}-(\d{2})-(\d{2})/.exec(r.date||'')||[]).slice(1).join('');
    if(v[3]==='d'){kk=M.visitKk(k,en,r.date,r.time);img=k==='pre'?(md?'d/'+md:'remind'):VIS_IMG[k];}
    else{var m=/\*([^*\n]+)\*/.exec(r.wa)||[];var ls=r.wa.split('\n').filter(function(x){return x&&!/^(안녕하세요|Hello)/.test(x)&&!/\*/.test(x)&&!/👉 https?:/.test(x)&&!/📞/.test(x);});kk={t:m[1]||v[2],d:ls.slice(0,2).join('\n')};img=VIS_IMG[k];}
    var imgU='https://happyhomecare.com.my/og-'+img+(en?'-en':'')+'.jpg';
    var R0={wa:r.wa,link:r.link,kk:{kind:'img',img:imgU,t:kk.t,d:kk.d,btns:[en?'Check progress':'진행 안내 보기']},special:''};
    var from=v[3]==='d'?'진행 현황 · 🔔 방문 안내 보낼 고객 · 스케줄 · 예약관리 방문 안내':'스케줄 › 일정 › 💬 방문 안내 (휴대폰 위치 · 구글맵 시간)';
    var note=(r.booking?'':'이 고객은 확정 예약이 없어 예시 날짜로 보여 줍니다 · ')+(v[3]==='f'?'분 · 지역은 예시 (실제는 보낼 때 계산)':(k==='pre'?'7일 전 · 3일 전 모두 이 문구':''));
    render3(v[1]+' '+v[2],from,note,R0);
  }
  function showOther(i){var o=OTHER[i];CUR='';list();
    $('main').innerHTML='<div class="hd"><h2>'+o[0]+' '+esc(o[1])+'</h2><div class="meta"><span>📍 <b>'+esc(o[2])+'</b></span></div></div>'+
      '<div class="oth">이 안내는 <b>'+esc(o[2].split(' › ')[0])+'</b> 화면에서 따로 보냅니다.<br>미리보기(왓츠앱 · 카카오톡 · 안내장)는 <b>다음 단계</b>에서 이 화면에 붙입니다.</div>';}
  function pickCust(i){
    if(C)try{C.close();}catch(_){}
    C=null;CI=i;var e=ENT.find(function(x){return x.i===i;})||{name:'',mid:''};$('cname').textContent=e?e.name:'—';
    try{localStorage.setItem('hhc_mc_cust',e&&e.mid||'');}catch(_){}
    $('main').innerHTML='<div class="load"><div><div class="spin"></div>'+esc(e.name)+' 고객 자료로 준비하는 중…</div></div>';
    Promise.resolve(W().caSendModal(i,{snap:true})).then(function(c){
      if(!c){$('main').innerHTML='<div class="oth">이 고객은 고객 마스터에 없어 미리볼 수 없어요. 다른 고객을 골라 주세요.</div>';return;}
      C=c;if(!CUR||!C.tpls.some(function(o){return o.t===CUR;}))CUR=C.auto||C.tpls[0].t;list();show();
    }).catch(function(err){$('main').innerHTML='<div class="oth">⚠️ 준비하지 못했어요: '+esc(err&&err.message||err)+'</div>';});
  }
  function custList(){
    var q=($('cq').value||'').trim().toLowerCase();
    $('clist').innerHTML=ENT.filter(function(e){return !q||e.name.toLowerCase().indexOf(q)>=0||e.ph.replace(/\D/g,'').indexOf(q.replace(/\D/g,'')||'§')>=0;}).slice(0,60)
      .map(function(e){return '<button type="button" data-i="'+e.i+'">'+esc(e.name)+'<small>'+e.n+'건</small></button>';}).join('')||'<p style="padding:10px;color:var(--ink3);font-size:13px">찾는 고객이 없어요</p>';
  }
  function boot(){
    var w=W();if(!w||typeof w._entries!=='function'||typeof w.caSendModal!=='function')return false;
    var es=w._entries()||[];if(!es.length)return false;
    ENT=es.map(function(e,i){var d=e.docs||{},n=0;for(var k in d)n+=(d[k]||[]).length;return {i:i,name:e.name||'',ph:e.phone||'',mid:e.master&&e.master.__id||'',n:n};})
      .filter(function(e){return e.mid&&e.name;}).sort(function(a,b){return b.n-a.n;});
    if(!ENT.length)return false;
    var last='';try{last=localStorage.getItem('hhc_mc_cust')||'';}catch(_){}
    var pick=ENT.find(function(e){return e.mid===last;})||ENT[0];
    custList();pickCust(pick.i);return true;
  }
  var tries=0;(function wait(){if(boot())return;if(++tries>120){$('main').innerHTML='<div class="oth">⚠️ 총괄 고객관리 자료를 불러오지 못했어요. 로그인 상태를 확인하고 새로고침해 주세요.</div>';return;}setTimeout(wait,500);})();
  $('list').addEventListener('click',function(e){var b=e.target.closest('.it');if(!b)return;if(b.dataset.o!=null){showOther(+b.dataset.o);return;}if(b.dataset.v){CUR='v:'+b.dataset.v;list();showVisit(b.dataset.v);if(innerWidth<760)window.scrollTo({top:0,behavior:'smooth'});return;}CUR=b.dataset.t;list();show();if(innerWidth<760)window.scrollTo({top:0,behavior:'smooth'});});
  $('lang').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;LANG=b.dataset.l;[].forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});if(/^v:/.test(CUR))showVisit(CUR.slice(2));else show();});
  $('q').addEventListener('input',list);
  $('cbtn').addEventListener('click',function(e){e.stopPropagation();$('cdrop').classList.toggle('on');if($('cdrop').classList.contains('on'))$('cq').focus();});
  $('cq').addEventListener('input',custList);
  $('clist').addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(!b)return;$('cdrop').classList.remove('on');pickCust(+b.dataset.i);});
  document.addEventListener('click',function(e){if(!e.target.closest('.cpick'))$('cdrop').classList.remove('on');});
})();
</script>
</body>
</html>
