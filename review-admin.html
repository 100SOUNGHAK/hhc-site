<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HHC 리뷰 관리</title>
<style>
:root{
  --navy:#0B1833; --navy2:#1b2f58; --pri:#2563EB; --pri-bg:#EFF6FF;
  --ink:#14192A; --ink2:#5A6478; --ink3:#98A1B4;
  --bdr:#E4E9F2; --bg:#F6F8FC;
  --ok:#0E9B63; --ok-bg:#ECFDF5; --warn:#B45309; --warn-bg:#FFF7ED;
  --bad:#DC2626; --bad-bg:#FEF2F2; --gold:#B98A16; --gold-bg:#FEF9EC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--ink);padding:14px;max-width:1060px;margin:0 auto}

/* ── 상단 헤더 ── */
.hdr{background:linear-gradient(120deg,#0B1833,#1b2f58);border-radius:14px;padding:14px 18px;
  box-shadow:0 3px 8px rgba(6,18,45,.25),0 14px 30px -14px rgba(6,18,45,.6);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:#fff}
.hdr h1{font-size:17px;font-weight:900;letter-spacing:-.01em}
.hdr .hs{font-size:11px;font-weight:700;color:#B9C7E2}
.hdr .sp{flex:1}
.fb-dot{width:8px;height:8px;border-radius:50%;background:#64748b;flex:none}
.fb-dot.on{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.8)}
.btn{font-family:inherit;font-size:12px;font-weight:800;border-radius:10px;padding:9px 14px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;transition:background .14s}
.btn:hover{background:rgba(255,255,255,.2)}

/* ── 요약 카드 ── */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.st{background:#fff;border:1.5px solid var(--bdr);border-radius:12px;padding:11px 14px;
  display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(14,35,80,.05)}
.st .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.st.blue .ic{background:var(--pri-bg)}.st.gold .ic{background:var(--gold-bg)}
.st.green .ic{background:var(--ok-bg)}.st.warn .ic{background:var(--warn-bg)}
.st b{font-size:17px;font-weight:900;display:block;line-height:1.15;font-variant-numeric:tabular-nums}
.st span{font-size:10.5px;font-weight:800;color:var(--ink3)}

/* 별점 분포 */
.dist{background:#fff;border:1.5px solid var(--bdr);border-radius:12px;padding:12px 15px;margin-bottom:12px}
.dist .t{font-size:12px;font-weight:900;margin-bottom:9px}
.drow{display:flex;align-items:center;gap:9px;padding:2.5px 0;font-size:11.5px;font-weight:800;color:var(--ink2)}
.drow .lb{width:34px;color:var(--gold);letter-spacing:-.04em;white-space:nowrap}
.drow .bar{flex:1;height:9px;border-radius:99px;background:#EEF1F7;overflow:hidden}
.drow .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#E3C98A,#C9A44C)}
.drow .n{width:30px;text-align:right;font-variant-numeric:tabular-nums}

/* ── 검색 · 필터 ── */
.panel{background:#fff;border:1.5px solid var(--bdr);border-radius:13px;padding:12px;box-shadow:0 1px 2px rgba(14,35,80,.05)}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.frow input{flex:1;min-width:180px;font-family:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--bdr);
  border-radius:10px;padding:10px 13px;background:var(--bg)}
.frow input:focus{outline:none;border-color:var(--pri);background:#fff}
.chip{font-family:inherit;font-size:11.5px;font-weight:800;border:1.5px solid var(--bdr);background:#fff;
  color:var(--ink2);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap;transition:all .14s}
.chip:hover{border-color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ── 리뷰 카드 ── */
.rv{border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:#fff;
  box-shadow:0 1px 2px rgba(14,35,80,.04)}
.rv:hover{border-color:#C9D4E8}
.r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r1 .nm{font-size:13.5px;font-weight:900;letter-spacing:-.01em}
.r1 .stars{color:var(--gold);font-size:13px;letter-spacing:1px;white-space:nowrap}
.r1 .dt{font-size:11px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.r1 .lk{font-size:10.5px;font-weight:800;color:var(--pri);background:var(--pri-bg);border-radius:99px;padding:3px 9px}
.r1 .del{margin-left:auto;font-family:inherit;font-size:11px;font-weight:800;color:var(--bad);
  background:#fff;border:1.5px solid #FECACA;border-radius:9px;padding:6px 11px;cursor:pointer;transition:background .14s}
.r1 .del:hover{background:var(--bad-bg)}
.rtx{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--ink2);line-height:1.75;word-break:break-word;white-space:pre-wrap}
.rph{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.rph img{width:74px;height:74px;object-fit:cover;border-radius:9px;border:1px solid var(--bdr);cursor:pointer}
.empty{text-align:center;padding:44px 10px;color:var(--ink3);font-size:13px;font-weight:700;line-height:1.8}
.more{width:100%;font-family:inherit;font-size:12.5px;font-weight:800;color:var(--ink2);background:var(--bg);
  border:1.5px solid var(--bdr);border-radius:10px;padding:11px;cursor:pointer;margin-top:4px}
.more:hover{border-color:var(--navy);color:var(--navy)}

/* 관리 버튼 줄 */
.racts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--bdr)}
.ra{font-family:inherit;font-size:11.5px;font-weight:800;border-radius:9px;padding:7px 11px;cursor:pointer;
  border:1.5px solid var(--bdr);background:#fff;color:var(--ink2);transition:background .14s,border-color .14s;white-space:nowrap}
.ra:hover{border-color:var(--navy);color:var(--navy)}
.ra.rep{color:#1D4ED8;border-color:#BFD3FB;background:var(--pri-bg)}
.ra.hid{color:var(--warn);border-color:#FBD38D;background:var(--warn-bg)}
.ra.pub{color:var(--ok);border-color:#A7E3C6;background:var(--ok-bg)}
.ra.del{color:var(--bad);border-color:#FECACA;margin-left:auto}
.ra.del:hover{background:var(--bad-bg);border-color:var(--bad)}
.rv.hidden{background:#F8F9FB;border-style:dashed}
.rv.hidden .rtx,.rv.hidden .rph{opacity:.55}
.pill{font-size:10px;font-weight:900;border-radius:99px;padding:3px 8px}
.pill.h{background:#FFF1D6;color:#9A5B00}
.pill.e{background:#EEF1F7;color:var(--ink2)}
/* 사장님 답글 */
.rrep{margin-top:9px;background:var(--pri-bg);border:1px solid #D6E4FD;border-radius:10px;padding:9px 11px}
.rrep .h{font-size:10.5px;font-weight:900;color:#1D4ED8;margin-bottom:3px}
.rrep .t{font-size:12px;font-weight:600;color:var(--ink);line-height:1.65;white-space:pre-wrap;word-break:break-word}

/* 수정 · 답글 창 */
.mask{position:fixed;inset:0;background:rgba(8,14,28,.55);z-index:150;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.mdl{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  box-shadow:0 -10px 40px rgba(6,18,45,.35);padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.mask{align-items:center}.mdl{border-radius:18px}}
.mdl .mh{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mdl .mh b{font-size:15px;font-weight:900;flex:1}
.mdl .mh button{width:32px;height:32px;border-radius:50%;border:none;background:var(--bg);font-size:14px;cursor:pointer}
.fl{font-size:11px;font-weight:900;color:var(--ink2);margin:11px 0 5px}
.fi{width:100%;font-family:inherit;font-size:13.5px;font-weight:600;border:1.5px solid var(--bdr);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink)}
.fi:focus{outline:none;border-color:var(--pri)}
textarea.fi{min-height:110px;resize:vertical;line-height:1.65}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.spk{display:flex;gap:4px;font-size:26px;line-height:1}
.spk span{cursor:pointer;color:#D9DEE8}.spk span.on{color:var(--gold)}
.eph{display:flex;gap:7px;flex-wrap:wrap}
.eph div{position:relative}
.eph img{width:72px;height:72px;object-fit:cover;border-radius:9px;border:1px solid var(--bdr);display:block}
.eph div.gone img{opacity:.25}
.eph button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:7px;border:none;background:rgba(15,23,42,.7);color:#fff;font-size:11px;cursor:pointer}
.qrep{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.qrep button{font-family:inherit;font-size:11px;font-weight:700;border:1px solid var(--bdr);background:var(--bg);color:var(--ink2);border-radius:99px;padding:5px 10px;cursor:pointer}
.mf{display:flex;gap:8px;margin-top:16px}
.mf button{flex:1;font-family:inherit;font-size:13.5px;font-weight:900;border-radius:11px;padding:12px;cursor:pointer;border:1.5px solid var(--bdr);background:#fff;color:var(--ink2)}
.mf button.p{background:var(--navy);border-color:var(--navy);color:#fff}
.mf button.d{flex:0 0 auto;color:var(--bad);border-color:#FECACA}
.hint{font-size:10.5px;color:var(--ink3);margin-top:5px;line-height:1.5}

/* 사진 확대 */
#lb{position:fixed;inset:0;background:rgba(8,14,28,.88);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:90vh;border-radius:12px}
#lb .x{position:fixed;top:14px;right:16px;width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.15);color:#fff;font-size:16px;font-weight:900}

/* 알림 */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0B1833;color:#fff;
  font-size:12.5px;font-weight:800;border-radius:11px;padding:12px 20px;z-index:300;display:none;
  box-shadow:0 10px 26px rgba(6,18,45,.4);max-width:88vw;text-align:center}

@media(max-width:640px){
  body{padding:10px}
  .stats{grid-template-columns:repeat(3,1fr)}
  .st{padding:10px 10px;gap:7px}.st .ic{width:30px;height:30px;font-size:15px}
  .rv{padding:11px 12px}
  .r1 .del{flex-basis:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* HHC 로고 마크 */
.ra-logo{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;
  background:linear-gradient(150deg,#173a5e,#0f2540);
  box-shadow:0 2px 4px rgba(10,26,48,.18),0 8px 18px -10px rgba(10,26,48,.6)}
.hhc-mark{width:1.35em;height:1.35em;max-width:82%;max-height:82%;flex:none;display:block}
</style>
</head>
<body>

<div class="hdr">
  <span class="ra-logo"><svg class="hhc-mark" viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg></span>
  <div><h1>리뷰 관리</h1><span class="hs">홈페이지에 공개되는 고객 리뷰를 확인하고 관리하세요</span></div>
  <span class="fb-dot" id="fb-dot"></span>
  <span class="sp"></span>
  <button class="btn" onclick="window.open('home.html#reviews','_blank')">🏠 홈페이지에서 보기</button>
</div>

<div class="stats" id="stats"></div>
<div class="dist" id="dist" style="display:none"></div>

<div class="panel">
  <div class="frow">
    <input id="q" placeholder="🔍 이름 · 내용 검색" oninput="paint()">
    <button class="chip on" data-f="all" onclick="setF('all')">전체</button>
    <button class="chip" data-f="5" onclick="setF('5')">★5</button>
    <button class="chip" data-f="4" onclick="setF('4')">★4</button>
    <button class="chip" data-f="3" onclick="setF('3')">★3 이하</button>
    <button class="chip" data-f="photo" onclick="setF('photo')">📷 사진 리뷰</button>
    <button class="chip" data-f="norep" onclick="setF('norep')">💬 답글 없음</button>
    <button class="chip" data-f="hidden" onclick="setF('hidden')">🙈 숨김</button>
  </div>
  <div id="list"><div class="empty">리뷰를 불러오는 중입니다…</div></div>
</div>

<div id="lb" onclick="this.classList.remove('on')"><button class="x">✕</button><img id="lb-img" src="" alt=""></div>
<div id="toast"></div>

<!-- ✏️ 리뷰 수정 · 💬 답글 -->
<div class="mask" id="ed-mask" onclick="if(event.target===this)edClose()">
  <div class="mdl">
    <div class="mh"><b id="ed-ttl">리뷰 수정</b><button onclick="edClose()" aria-label="닫기">✕</button></div>
    <div id="ed-body"></div>
    <div class="mf" id="ed-foot"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, deleteDoc, updateDoc, deleteField, onSnapshot, initializeFirestore, persistentLocalCache, persistentMultipleTabManager } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
// ⚡ 빠른 열기 : 데이터베이스 내용을 이 기기 안에 저장해 둡니다(IndexedDB).
//    다음부터는 저장된 내용으로 화면을 먼저 그리고, 서버에서는 바뀐 부분만 받아 옵니다.
//    (관리자 앱의 여러 화면이 같은 저장소를 함께 쓰므로 multi-tab 모드 · 저장소를 못 쓰는 환경에서는 예전 방식으로 동작)
function hhcFastDb(app){
  try{return initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager(),cacheSizeBytes:150*1024*1024}),experimentalAutoDetectLongPolling:true});}
  catch(e){return getFirestore(app);}
}

import { getStorage, ref, deleteObject } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';

const FIREBASE_CFG={
  apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",
  authDomain:"happywork-packageplan.firebaseapp.com",
  projectId:"happywork-packageplan",
  storageBucket:"happywork-packageplan.firebasestorage.app",
  messagingSenderId:"101289103022",
  appId:"1:101289103022:web:d81aca7f3747dd26df673f"
};
let db=null,storage=null;
let ALL=[];            // 전체 리뷰
let curF='all';        // 별점 필터
let showN=20;          // 더보기 단위

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600);}

/* ── 목록 그리기 ─────────────────────────────── */
function stars(n){n=Math.max(1,Math.min(5,parseInt(n,10)||5));return '★'.repeat(n)+'☆'.repeat(5-n);}
function dfmt(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));return m?(m[1]+'.'+m[2]+'.'+m[3]):'';}

function renderStats(){
  const n=ALL.length;
  const avg=n?(ALL.reduce((a,x)=>a+(parseInt(x.rating,10)||0),0)/n):0;
  const ym=new Date().toISOString().slice(0,7);
  const mon=ALL.filter(x=>String(x.created_at||'').slice(0,7)===ym).length;
  const ph=ALL.filter(x=>(x.photos||[]).length>0).length;
  $('stats').innerHTML=
    '<div class="st blue"><span class="ic">💬</span><div><b>'+n+'</b><span>전체 리뷰</span></div></div>'+
    '<div class="st gold"><span class="ic">⭐</span><div><b>'+(n?avg.toFixed(1):'-')+'</b><span>평균 별점</span></div></div>'+
    '<div class="st green"><span class="ic">📅</span><div><b>'+mon+'</b><span>이번 달</span></div></div>'+
    '<div class="st warn"><span class="ic">📷</span><div><b>'+ph+'</b><span>사진 리뷰</span></div></div>';
  const nr=ALL.filter(x=>!x.hidden&&!String(x.admin_reply||'').trim()).length,hd=ALL.filter(x=>x.hidden).length;
  $('stats').insertAdjacentHTML('beforeend',
    '<div class="st blue" style="cursor:pointer" onclick="setF(\'norep\')"><span class="ic">💬</span><div><b>'+nr+'</b><span>답글 대기</span></div></div>'+
    '<div class="st warn" style="cursor:pointer" onclick="setF(\'hidden\')"><span class="ic">🙈</span><div><b>'+hd+'</b><span>숨긴 리뷰</span></div></div>');
  // 별점 분포
  const d=$('dist');
  if(!n){d.style.display='none';return;}
  d.style.display='block';
  let h='<div class="t">별점 분포</div>';
  for(let s=5;s>=1;s--){
    const c=ALL.filter(x=>(parseInt(x.rating,10)||0)===s).length;
    const pct=n?Math.round(c/n*100):0;
    h+='<div class="drow"><span class="lb">★ '+s+'</span><span class="bar"><i style="width:'+pct+'%"></i></span><span class="n">'+c+'</span></div>';
  }
  d.innerHTML=h;
}

window.setF=function(f){
  curF=f;showN=20;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===f));
  paint();
};
window.paint=function(){
  const q=($('q').value||'').trim().toLowerCase();
  let list=ALL.slice();
  if(curF==='5')list=list.filter(x=>(parseInt(x.rating,10)||0)===5);
  else if(curF==='4')list=list.filter(x=>(parseInt(x.rating,10)||0)===4);
  else if(curF==='3')list=list.filter(x=>(parseInt(x.rating,10)||0)<=3);
  else if(curF==='photo')list=list.filter(x=>(x.photos||[]).length>0);
  else if(curF==='norep')list=list.filter(x=>!String(x.admin_reply||'').trim());
  else if(curF==='hidden')list=list.filter(x=>!!x.hidden);
  if(q)list=list.filter(x=>(String(x.name||'')+' '+String(x.text||'')).toLowerCase().includes(q));
  const host=$('list');
  if(!list.length){
    host.innerHTML='<div class="empty">'+(ALL.length?'조건에 맞는 리뷰가 없습니다.':'아직 등록된 리뷰가 없습니다.<br>고객 마이페이지·홈페이지에서 리뷰를 남기면 여기에 표시됩니다.')+'</div>';
    return;
  }
  host.innerHTML=list.slice(0,showN).map(x=>{
    const phs=(x.photos||[]).map(p=>'<img src="'+esc(p.url)+'" loading="lazy" alt="리뷰 사진" onclick="lbOpen(this.src)">').join('');
    const id=esc(x.__id),rep=String(x.admin_reply||'').trim();
    return '<div class="rv'+(x.hidden?' hidden':'')+'">'+
      '<div class="r1"><span class="nm">'+esc(x.name||'(이름 없음)')+'</span>'+
      '<span class="stars" title="'+(parseInt(x.rating,10)||0)+'점">'+stars(x.rating)+'</span>'+
      '<span class="dt">'+dfmt(x.created_at)+'</span>'+
      ((x.likes|0)>0?'<span class="lk">👍 '+(x.likes|0)+'</span>':'')+
      (x.hidden?'<span class="pill h">🙈 홈페이지 숨김</span>':'')+
      (x.edited_at?'<span class="pill e">✏️ 수정됨</span>':'')+'</div>'+
      (x.text?'<div class="rtx">'+esc(x.text)+'</div>':'')+
      (phs?'<div class="rph">'+phs+'</div>':'')+
      (rep?'<div class="rrep"><div class="h">🏠 사장님 답글'+(x.admin_reply_at?' · '+dfmt(x.admin_reply_at):'')+'</div><div class="t">'+esc(rep)+'</div></div>':'')+
      '<div class="racts">'+
        '<button class="ra rep" onclick="repOpen(\''+id+'\')">💬 '+(rep?'답글 수정':'답글 달기')+'</button>'+
        '<button class="ra" onclick="edOpen(\''+id+'\')">✏️ 수정</button>'+
        (x.hidden?'<button class="ra pub" onclick="setHidden(\''+id+'\',false)">👁 다시 공개</button>'
                 :'<button class="ra hid" onclick="setHidden(\''+id+'\',true)">🙈 숨기기</button>')+
        '<button class="ra del" onclick="delRv(\''+id+'\')">🗑 삭제</button>'+
      '</div></div>';
  }).join('')+(list.length>showN
    ?'<button class="more" onclick="showN+=20;paint()">리뷰 더보기 ('+(list.length-showN)+'건 남음)</button>':'');
};
window.showN=showN;
Object.defineProperty(window,'showN',{get:()=>showN,set:v=>{showN=v;}});
window.lbOpen=function(src){$('lb-img').src=src;$('lb').classList.add('on');};

/* ── 삭제 (사진도 함께 정리) ─────────────────── */
window.delRv=async function(id){
  const x=ALL.find(r=>r.__id===id);if(!x)return;
  if(!db){toast('Firebase 연결 중입니다');return;}
  const nm=x.name||'(이름 없음)';
  if(!confirm('「'+nm+'」 님의 리뷰를 삭제할까요?\n\n· 홈페이지 리뷰 목록에서 즉시 사라집니다.\n· 삭제한 리뷰는 되돌릴 수 없습니다.'+((x.photos||[]).length?'\n· 첨부된 사진 '+(x.photos||[]).length+'장도 함께 삭제됩니다.':'')))return;
  try{
    await deleteDoc(doc(db,'reviews',id));
    (x.photos||[]).forEach(p=>{ if(p&&p.path){ try{deleteObject(ref(storage,p.path)).catch(()=>{});}catch(e){} } });
    toast('🗑 리뷰가 삭제되었습니다');
  }catch(e){toast('삭제 실패: '+e.message);}
};

/* ── 🙈 숨기기 · 👁 다시 공개 ───────────────────── */
window.setHidden=async function(id,on){
  const x=ALL.find(r=>r.__id===id);if(!x)return;
  if(!db){toast('Firebase 연결 중입니다');return;}
  if(on&&!confirm('「'+(x.name||'(이름 없음)')+'」 님의 리뷰를 홈페이지에서 숨길까요?\n\n· 리뷰는 지워지지 않고 이 화면에 남습니다.\n· 언제든 「다시 공개」로 되돌릴 수 있습니다.'))return;
  try{
    await updateDoc(doc(db,'reviews',id),on?{hidden:true,hidden_at:new Date().toISOString()}:{hidden:deleteField(),hidden_at:deleteField()});
    toast(on?'🙈 홈페이지에서 숨겼습니다':'👁 홈페이지에 다시 공개했습니다');
  }catch(e){toast('저장 실패: '+e.message);}
};

/* ── 💬 사장님 답글 (홈페이지 리뷰 아래 「🏠 사장님 답글」로 표시) ── */
const REP_Q=[
  '소중한 리뷰 감사합니다! 앞으로도 꼼꼼하게 관리해 드리겠습니다 😊',
  '만족하셨다니 정말 기쁩니다. 다음 방문 때도 정성껏 작업하겠습니다!',
  '불편을 드려 죄송합니다. 바로 연락드려 확인하겠습니다.',
  'Thank you so much for your kind review! We look forward to serving you again.'
];
let EDID=null,ED_RATE=5,ED_PH=[];
window.edClose=function(){$('ed-mask').classList.remove('on');EDID=null;};
window.repOpen=function(id){
  const x=ALL.find(r=>r.__id===id);if(!x)return;EDID=id;
  const rep=String(x.admin_reply||'');
  $('ed-ttl').textContent='💬 사장님 답글';
  $('ed-body').innerHTML=
    '<div class="rv" style="margin:0 0 4px;background:var(--bg)"><div class="r1"><span class="nm">'+esc(x.name||'(이름 없음)')+'</span><span class="stars">'+stars(x.rating)+'</span></div>'+
      (x.text?'<div class="rtx" style="max-height:120px;overflow:auto">'+esc(x.text)+'</div>':'')+'</div>'+
    '<div class="fl">답글 내용</div><textarea class="fi" id="ed-rep" placeholder="고객에게 보일 답글을 적어 주세요">'+esc(rep)+'</textarea>'+
    '<div class="qrep">'+REP_Q.map((q,i)=>'<button type="button" onclick="repQ('+i+')">'+esc(q.length>18?q.slice(0,18)+'…':q)+'</button>').join('')+'</div>'+
    '<div class="hint">저장하면 홈페이지 리뷰 아래에 「🏠 사장님 답글」로 바로 표시됩니다.</div>';
  $('ed-foot').innerHTML=(rep?'<button class="d" onclick="repDel()">🗑 답글 삭제</button>':'')+
    '<button onclick="edClose()">취소</button><button class="p" onclick="repSave()">💾 답글 저장</button>';
  $('ed-mask').classList.add('on');
  setTimeout(()=>{const t=$('ed-rep');if(t)t.focus();},60);
};
window.repQ=function(i){const t=$('ed-rep');if(!t)return;t.value=(t.value.trim()?t.value.trim()+'\n':'')+REP_Q[i];t.focus();};
window.repSave=async function(){
  const v=($('ed-rep').value||'').trim();
  if(!v){toast('답글 내용을 입력해 주세요');return;}
  try{
    await updateDoc(doc(db,'reviews',EDID),{admin_reply:v,admin_reply_at:new Date().toISOString()});
    edClose();toast('💬 답글을 저장했습니다 — 홈페이지에 바로 표시됩니다');
  }catch(e){toast('저장 실패: '+e.message);}
};
window.repDel=async function(){
  if(!confirm('답글을 삭제할까요?'))return;
  try{await updateDoc(doc(db,'reviews',EDID),{admin_reply:deleteField(),admin_reply_at:deleteField()});edClose();toast('답글을 삭제했습니다');}
  catch(e){toast('삭제 실패: '+e.message);}
};

/* ── ✏️ 리뷰 수정 (이름 · 별점 · 날짜 · 내용 · 사진) ── */
function spk(){return [1,2,3,4,5].map(n=>'<span data-n="'+n+'" class="'+(n<=ED_RATE?'on':'')+'" onclick="edRate('+n+')">★</span>').join('');}
window.edRate=function(n){ED_RATE=n;const e=$('ed-spk');if(e)e.innerHTML=spk();};
function ephHtml(){return ED_PH.map((p,i)=>'<div class="'+(p.gone?'gone':'')+'"><img src="'+esc(p.url)+'" alt=""><button type="button" onclick="edPh('+i+')" title="'+(p.gone?'되살리기':'삭제')+'">'+(p.gone?'↺':'✕')+'</button></div>').join('');}
window.edPh=function(i){if(ED_PH[i]){ED_PH[i].gone=!ED_PH[i].gone;$('ed-eph').innerHTML=ephHtml();}};
window.edOpen=function(id){
  const x=ALL.find(r=>r.__id===id);if(!x)return;EDID=id;
  ED_RATE=Math.max(1,Math.min(5,parseInt(x.rating,10)||5));
  ED_PH=(x.photos||[]).map(p=>Object.assign({},(p&&typeof p==='object')?p:{url:p},{gone:false}));
  $('ed-ttl').textContent='✏️ 리뷰 수정';
  $('ed-body').innerHTML=
    '<div class="f2"><div><div class="fl">이름</div><input class="fi" id="ed-nm" value="'+esc(x.name||'')+'"></div>'+
    '<div><div class="fl">작성일</div><input class="fi" type="date" id="ed-dt" value="'+esc(String(x.created_at||'').slice(0,10))+'"></div></div>'+
    '<div class="fl">별점</div><div class="spk" id="ed-spk">'+spk()+'</div>'+
    '<div class="fl">내용</div><textarea class="fi" id="ed-tx">'+esc(x.text||'')+'</textarea>'+
    (ED_PH.length?'<div class="fl">사진 <span style="font-weight:700;color:var(--ink3)">— ✕를 누르면 저장할 때 지워집니다</span></div><div class="eph" id="ed-eph">'+ephHtml()+'</div>':'')+
    '<div class="hint">오타 · 개인정보(전화번호 · 주소 등) 가리기 같은 정리에 사용해 주세요. 수정한 리뷰에는 이 화면에서만 「✏️ 수정됨」이 표시됩니다.</div>';
  $('ed-foot').innerHTML='<button onclick="edClose()">취소</button><button class="p" onclick="edSave()">💾 저장</button>';
  $('ed-mask').classList.add('on');
};
window.edSave=async function(){
  const x=ALL.find(r=>r.__id===EDID);if(!x)return;
  const nm=($('ed-nm').value||'').trim(),tx=($('ed-tx').value||'').trim(),dt=$('ed-dt').value||'';
  if(!nm){toast('이름을 입력해 주세요');return;}
  if(!tx&&!ED_PH.some(p=>!p.gone)){toast('내용을 입력해 주세요');return;}
  const upd={name:nm,text:tx,rating:ED_RATE,edited_at:new Date().toISOString()};
  // 작성일을 바꾼 경우에만 날짜를 고칩니다 (시각은 그대로 둡니다)
  const old=String(x.created_at||'');
  if(dt&&dt!==old.slice(0,10))upd.created_at=dt+(old.length>10?old.slice(10):'T09:00:00.000Z');
  const gone=ED_PH.filter(p=>p.gone);
  if(gone.length)upd.photos=ED_PH.filter(p=>!p.gone).map(p=>{const o=Object.assign({},p);delete o.gone;return o;});
  try{
    await updateDoc(doc(db,'reviews',EDID),upd);
    gone.forEach(p=>{if(p&&p.path){try{deleteObject(ref(storage,p.path)).catch(()=>{});}catch(e){}}});
    edClose();toast('✏️ 리뷰를 수정했습니다');
  }catch(e){toast('저장 실패: '+e.message);}
};

/* ── 실시간 구독 ─────────────────────────────── */
try{
  const app=initializeApp(FIREBASE_CFG);
  db=hhcFastDb(app);storage=getStorage(app);
  onSnapshot(collection(db,'reviews'),snap=>{
    window.__hhcReady&&window.__hhcReady();
    ALL=snap.docs.map(d=>{const x=d.data()||{};x.__id=d.id;return x;})
      .sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
    $('fb-dot').classList.add('on');
    renderStats();paint();
  },err=>{
    console.warn(err);
    $('list').innerHTML='<div class="empty">리뷰를 불러오지 못했습니다.<br>'+esc(err.message)+'</div>';
  });
}catch(e){
  $('list').innerHTML='<div class="empty">Firebase 연결에 실패했습니다.<br>'+esc(e.message)+'</div>';
}
</script>
<script>
/* ══ 허브(staffapp.html) 안에서 열렸을 때 「화면 살아있음」 신호 ══════════════
   · 열리자마자 hhcHello, 데이터가 처음 도착하면 hhcReady 를 허브로 보냅니다.
   · 15초 안에 데이터가 오지 않으면(앱을 켠 직후 통신이 걸린 상태) 스스로 새로고침 — 최대 2회.
     그래도 안 되면 허브에 hhcStuck 을 알려 「다시 불러오기」 안내를 띄우게 합니다.
   · 허브가 hhcPing 을 보내면 현재 상태(hhcPong)로 답합니다.
   ※ 허브 밖에서 단독으로 열었을 때는 아무 동작도 하지 않습니다. */
(function(){
  if(window.top===window.self)return;
  var ready=false,KEY='hhc_wd:'+location.pathname,n=0;
  try{n=parseInt(sessionStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  function post(m){try{window.parent.postMessage(m,'*');}catch(e){}}
  window.__hhcReady=function(){if(ready)return;ready=true;try{sessionStorage.removeItem(KEY);}catch(e){}post({hhcReady:1});};
  window.addEventListener('message',function(e){var d=e&&e.data;if(d&&d.hhcPing)post({hhcPong:1,ready:ready});});
  post({hhcHello:1});
  // 데이터가 늦어도 화면을 스스로 새로고침하지 않습니다 (보고 있던 화면·입력 중인 내용 보존).
  // 40초 뒤에도 첫 데이터가 없으면 허브에 알려 「다시 불러오기」 띠만 보여 줍니다.
  setTimeout(function(){
    if(ready)return;
    if(navigator.onLine===false||document.visibilityState!=='visible'){post({hhcStuck:1,soft:1});return;}
    post({hhcStuck:1});
  },40000);
})();
</script>
