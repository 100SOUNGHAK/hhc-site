/* 🧾 서비스 요금표 팝업 — home.html 의 요금표와 같은 내용 · 같은 모양 (pt.css) */
/* ═══ HHC 서비스 요금표 (pt-) — 배너 → 품목 → 서비스별 가격 ═══ */
.pt-root{--pn:#0f2540;--pn9:#08172b;--pt7:#0b5f59;--pt6:#0f766e;--pg5:#c9a44c;--pg3:#e3c98a;--pg1:#f4e7c4;--pg05:#fbf5e6;
  --pink:#161d27;--pink6:#4d5866;--pink4:#8891a0;--pline:#ece6d8;--ppaper:#fdfcf9;--pr:#c0392b;
  --pe1:0 1px 2px rgba(8,23,43,.10),0 6px 14px -6px rgba(8,23,43,.28);
  --pe2:0 1px 2px rgba(8,23,43,.12),0 10px 22px -8px rgba(8,23,43,.38),0 30px 60px -24px rgba(8,23,43,.55);
  position:relative;color:var(--pink);font-variant-numeric:tabular-nums;scroll-margin-top:90px}
.pt-root *{box-sizing:border-box}

.pt-stage{animation:ptIn .22s cubic-bezier(.22,.61,.36,1)}

.pt-ban .ph:before{content:'';position:absolute;inset:0;background:linear-gradient(90deg,var(--pn9) 0%,rgba(8,23,43,.55) 30%,rgba(8,23,43,0) 65%)}
.pt-ban .tx{position:relative;z-index:1;padding:34px 30px 30px 34px;display:flex;flex-direction:column;gap:14px;

  background:linear-gradient(158deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.14);

  function L(a){return a?(S.lang==='en'?(a[1]!=null?a[1]:a[0]):a[0]):'';}
  function N(o){return S.lang==='en'?o.en:o.ko;}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function rm(n){n=Math.round(n*100)/100;return 'RM '+(n%1?n.toFixed(2):n.toLocaleString('en-MY'));}
  function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  /* 할인 찾기 : 상시 할인(pct) → 월별 프로모션(이벤트관리) */
  function disc(s){
    if(s.p==null)return null;
    var best=null,t=today();
    PROMO.forEach(function(r){
      if(!s.ck||r.it!==s.ck[0]||r.m!==s.ck[1]||(r.q||1)>1)return;
      if(r.from&&t<r.from)return;if(r.to&&t>=r.to)return;
      var fin=r.kind?(r.kind==='pct'?s.p*(100-(+r.val||0))/100:(r.kind==='off'?s.p-(+r.val||0):+r.val))
                    :(r.pct?s.p*(100-r.pct)/100:s.p-(+r.off||0));
      var pc=r.kind?(r.kind==='pct'?+r.val:0):r.pct;
      if(fin>=0&&fin<s.p&&(!best||fin<best.fin))best={fin:fin,nm:(S.lang==='en'?(r.nm_en||r.nm):r.nm)||'',pct:pc};
    });
    if(!best&&s.pct&&!PROMO_SET)best={fin:s.p*(100-s.pct)/100,pct:s.pct,always:1};
    return best;
  }

    return lo;

    mod.addEventListener('click',onClick);
  }

    ensureMod();
    if(!mod.classList.contains('on')){
      lastFocus=document.activeElement;
      mod.classList.add('on');lock(true);
      /* pricecard: 뒤로가기 기록을 만들지 않습니다 */
      setTimeout(function(){try{mod.querySelector('.pt-msh').focus({preventScroll:true});}catch(e){}},30);
    }
  }
  function closeMod(fromPop){
    if(!mod||!mod.classList.contains('on'))return;
    mod.classList.remove('on');lock(false);S.stage='ban';
    // 뒤로가기 기록을 정리합니다 (닫기 버튼으로 닫았을 때)
    if(!fromPop&&pushed){pushed=false;try{if(history.state&&history.state.hhcPt)history.back();}catch(e){}}
    pushed=false;
    try{if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});}catch(e){}

  }

  function svcHTML(s,it){

    var tag=s.tag?'<span class="tg'+(s.tag==='hot'?' hot':'')+'">'+esc(L(TG[s.tag]))+'</span>':'';
    var lv='';
    if(s.lv){var f='';for(var i=1;i<=4;i++)f+='<u'+(i<=s.lv?' class="f"':'')+'></u>';
      lv='<div class="lv"><i>'+f+'</i>'+(en?['Light','Standard','Deep','Full'][s.lv-1]:['가벼운 관리','표준 관리','깊은 관리','완전 분해'][s.lv-1])+'</div>';}
    var p;
    if(s.p==null)p='<b class="q">'+esc(L(s.pq))+'</b>';
    else{
      var us=u?'<small>/'+esc(u)+'</small>':'';
      var fr=s.from?(en?'<small> ~</small>':'<small> ~</small>'):'';
      p=d?('<span class="dc">'+(d.pct?d.pct+'%'+(en?' off':' 할인'):(en?'Sale':'특가'))+'</span><b>'+rm(d.fin)+us+fr+'</b><s>'+rm(s.p)+'</s>')
         :('<b>'+rm(s.p)+us+fr+'</b>');
    }
    var tb='';
    if(s.tb)tb='<div class="pt-tb">'+s.tb.map(function(r){return '<div><span>'+esc(en?r[1]:r[0])+'</span><b>'+rm(r[2])+'</b></div>';}).join('')+'</div>';
    return '<div class="pt-sv"><div class="x"><b>'+esc(N(s))+'</b>'+tag+(s.d?'<p>'+esc(L(s.d))+'</p>':'')+lv+'</div><div class="p">'+p+'</div>'+tb+'</div>';
  }
  function ctaHTML(kind){
    var en=S.lang==='en',calc=!!document.getElementById('calcBox');
    return '<div class="pt-cta '+kind+(calc?'':' one')+'"><a class="a1" data-book="1" href="'+(window.PT_BOOK_URL||'request.html')+(en?'?lang=en':'')+'">'+(en?'Book now':'예약 신청하기')+'</a>'+
      (calc?'<a class="a2" href="#calcBox" data-calc="1">'+(en?'Estimate':'견적 계산기')+'</a>':'')+'</div>';
  }
  function detHTML(){
    var en=S.lang==='en',it=BYK[S.k];if(!it)return itemsHTML();
    var ty=it.types[S.t]||it.types[0],list=svcs(it);
    var ps=list.filter(function(s){return s.p!=null;}).map(function(s){var d=disc(s);return d?d.fin:s.p;});
    var mx=[];list.forEach(function(s){if(s.tb)s.tb.forEach(function(r){mx.push(r[2]);});else if(s.p!=null)mx.push(s.p);});
    var lo=ps.length?Math.min.apply(null,ps):null,hi=mx.length?Math.max.apply(null,mx):null;
    var u0=list[0]&&(list[0].u||it.u),uu=(u0&&U[u0]&&list.every(function(s){return (s.u||it.u)===u0;}))?' / '+L(U[u0]):'';
    var sameU=list.every(function(s){return (s.u||it.u)===u0;});
    var loS=null;list.forEach(function(s){if(s.p==null)return;var d=disc(s),v=d?d.fin:s.p;if(loS==null||v<(loS.v))loS={v:v,s:s};});
    var rg=lo==null?esc(L(list[0].pq)):(!sameU&&loS?(rm(lo)+'<small> / '+esc(unitOf(loS.s,it))+'</small>'+(en?' <small>from</small>':'<small> 부터</small>')):(lo===hi?rm(lo):rm(lo)+' ~ '+rm(hi)));
    var hasBiz=!!ty.biz;
    var notes=[].concat(it.nt||[],ty.nt||[]);
    if(S.biz&&hasBiz)notes=[].concat(ty.bnt||[],it.bnt||[]);
    var side='<div class="pt-side">'+
      (PQ[it.k]?PQ_DEFS+'<div class="phx">'+PQ[(PQT[it.k]&&PQT[it.k][S.t])||it.k]+'</div>':'<div class="hic">'+it.ic+'</div>')+
      '<h4>'+esc(N(it))+(it.types.length>1?' · '+esc(N(ty)):'')+'<small>'+(S.biz&&hasBiz?(en?'Business & commercial':'매장 · 사무실 요금'):(en?'Home service':'가정용 요금'))+'</small></h4>'+
      '<p class="ds">'+esc(L(it.ds))+'</p>'+
      '<div class="rg"><span>'+(en?'Price':'가격')+'</span><b>'+rg+'</b><i>'+esc(uu)+'</i></div>'+
      (hasBiz?'<div class="pt-seg"><button type="button" data-biz="0" class="'+(S.biz?'':'on')+'">🏠 '+(en?'Home':'가정용')+'</button><button type="button" data-biz="1" class="'+(S.biz?'on':'')+'">🏢 '+(en?'Business':'매장 · 사무실')+'</button></div>':'')+
      ctaHTML('d')+'</div>';
    var main='<div class="pt-main">';
    if(it.types.length>1){
      main+='<div class="pt-types" style="--n:'+it.types.length+'">'+it.types.map(function(t,i){return '<button type="button" data-t="'+i+'" class="'+(i===S.t?'on':'')+'">'+esc(t.sh?L(t.sh):N(t))+'</button>';}).join('')+'</div>';
    }
    main+='<div class="pt-cap"><b>'+(en?'Services & prices':'서비스별 가격')+'</b>'+(list.length>1?(en?list.length+' options':list.length+'가지'):'')+'</div>';
    main+=list.map(function(s){return svcHTML(s,it);}).join('');
    if(notes.length)main+='<div class="pt-nt">'+notes.map(function(n){return '<div><i>ℹ︎</i><span>'+esc(L(n))+'</span></div>';}).join('')+'</div>';
    main+=ctaHTML('m');
    var others=ITEMS.filter(function(x){return x.k!==it.k;});
    main+='<div class="pt-more"><div class="h">'+(en?'Other items':'다른 품목')+'</div><div class="r">'+
      others.map(function(x){return '<button type="button" data-go="det" data-k="'+x.k+'">'+x.ic+' '+esc(N(x))+'</button>';}).join('')+'</div></div>';
    main+='</div>';
    return '<div class="pt-stage"><div class="pt-det">'+side+main+'</div></div>';
  }
  function topHTML(){
    var en=S.lang==='en',it=S.stage==='det'?BYK[S.k]:null;
    return (it?'<button type="button" class="pt-bk" data-go="items"><b>‹</b>'+(en?'All items':'품목 목록')+'</button>':'<span class="pt-mic">📋</span>')+
      '<div class="t"><b>'+(it?it.ic+' '+esc(N(it)):(en?'Service price list':'서비스 요금표'))+'</b>'+
      '<span>'+(it?(en?'Prices by service':'서비스별 가격 · 안내'):(en?'Which item?':'어떤 품목인가요?'))+'</span></div>'+
      '<button type="button" class="pt-x" data-close="1" aria-label="'+(en?'Close':'닫기')+'"><span>✕</span>'+(en?'Close':'닫기')+'</button>';
  }
  function render(){
    if(root)root.innerHTML=banHTML();
    if(mod&&isOpen()){
      mod.setAttribute('aria-label',S.lang==='en'?'Service price list':'서비스 요금표');
      mTop.innerHTML=topHTML();
      mBody.innerHTML=S.stage==='det'?detHTML():itemsHTML();
    }
  }
  function onClick(e){
    var t=e.target.closest?e.target:null;if(!t)return;
    var ty=t.closest('[data-ty]');if(ty&&mod&&mod.contains(ty)){e.preventDefault();go('det',ty.getAttribute('data-k'));S.t=+ty.getAttribute('data-ty');render();return;}
    var b=t.closest('[data-go],[data-t],[data-biz],[data-calc],[data-close],[data-book]');if(!b||!((root&&root.contains(b))||(mod&&mod.contains(b))))return;
    if(b.hasAttribute('data-book')&&typeof window.PT_BOOK==='function'){e.preventDefault();closeMod(false);window.PT_BOOK();return;}
    if(b.hasAttribute('data-close')){closeMod(false);return;}
    if(b.hasAttribute('data-calc')){   // 견적 계산기 (홈페이지에 있으면 팝업을 닫고 열어 줍니다)
      var cb=document.getElementById('calcBox');if(!cb)return;
      e.preventDefault();closeMod(false);var tg=document.getElementById('calcToggle');
      if(tg&&tg.getAttribute('aria-expanded')!=='true')tg.click();
      cb.scrollIntoView({behavior:'smooth',block:'start'});return;
    }
    if(b.hasAttribute('data-t')){S.t=+b.getAttribute('data-t');render();return;}
    if(b.hasAttribute('data-biz')){S.biz=b.getAttribute('data-biz')==='1';render();return;}
    go(b.getAttribute('data-go'),b.getAttribute('data-k'));
  }
  window.HHCPriceTable={
    mount:function(el,lang){S.lang=lang==='en'?'en':'ko';el.addEventListener('click',onClick);mount(el);},
    init:function(lang){S.lang=lang==='en'?'en':'ko';},   // 배너 없이 팝업만 쓰는 화면(전자명함 등)
    setLang:function(lang){S.lang=lang==='en'?'en':'ko';render();},
    open:function(k){go(k?'det':'items',k||null);},
    close:function(){closeMod(false);},
    items:ITEMS
  };
  /* 월별 프로모션 · 상시 혜택 — 견적 계산기와 같은 할인 행을 받아 가격 옆에 할인가를 보여 줍니다 */
  window.__ptPromo=function(rows){PROMO=(rows||[]).slice();PROMO_SET=true;render();};
})();

</script>
<script>
(function(){
  var q=new URLSearchParams(location.search), en=q.get('lang')==='en', k=q.get('k')||null;
  if(en){
    document.documentElement.lang='en';
    document.getElementById('pcT').textContent='Price list closed';
    document.getElementById('pcP').textContent='Close this window to go back to the post.';
    document.getElementById('pcRe').textContent='📋 View price list again';
    document.getElementById('pcTs').innerHTML='Tap the <b>✕ at the top</b> or your phone\'s <b>Back</b><br>to return to the post';
  }
  window.PT_BOOK_URL='/request';
  if(!window.HHCPriceTable)return;
  var back=document.getElementById('pcBack');
  function show(){
    back.classList.remove('on');
    HHCPriceTable.init(en?'en':'ko');
    HHCPriceTable.open(k&&HHCPriceTable.items.some(function(x){return x.k===k;})?k:null);
  }
  /* 닫기 → 원래 글(썸네일 카드)로 돌아가기 (2026-11-22 수정)
     · 같은 창에서 열렸으면(이전 화면 있음) 뒤로 가서 글로 돌아갑니다.
     · 카페 앱이 새 창으로 열었으면 창을 닫지 않습니다(창 닫기는 앱 전체가 종료되는 경우가 있어 쓰지 않음).
       대신 요금표를 그대로 두고, 위쪽 ✕ 또는 휴대폰 뒤로가기로 닫으라고 짧게 안내합니다. */
  var toastT=null;
  function hint(){
    var t=document.getElementById('pcToast');
    t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},4200);
  }
  window.__pcLeave=function(){
    if(history.length>1){back.classList.add('on');history.back();return;}
    var r=document.referrer||'';
    if(/cafe\.naver\.com\/.+\/\d+|articleid=\d+|ArticleRead|\/articles\/\d+/i.test(r)){back.classList.add('on');location.replace(r);return;}
    setTimeout(function(){show();hint();},0);   // 요금표는 다시 띄워 두고 안내
  };
  if(history.length<=1&&!/cafe\.naver\.com\/.+\/\d+|articleid=\d+|ArticleRead|\/articles\/\d+/i.test(document.referrer||''))document.body.classList.add('pc-nw');
  document.getElementById('pcRe').addEventListener('click',show);
  show();

  /* 이달의 특가 · 상시 혜택 할인 — 전자명함과 같은 값으로 가격 옆에 표시 */
  function val(v){ if(!v) return null;
    if('stringValue' in v) return v.stringValue; if('integerValue' in v) return +v.integerValue; if('doubleValue' in v) return v.doubleValue;
    if('booleanValue' in v) return v.booleanValue; if('arrayValue' in v) return (v.arrayValue.values||[]).map(val);
    if('mapValue' in v){ var o = {}, f = v.mapValue.fields || {}; for(var kk in f) o[kk] = val(f[kk]); return o; } return null; }
  try{
    fetch('https://firestore.googleapis.com/v1/projects/happywork-packageplan/databases/(default)/documents/promos?pageSize=60&key=AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00')
    .then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if(!j || !j.documents) return;
      var d = new Date(), t = d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2);
      try{ if(window.__ptPromo){
        var nx = function(s){ var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); if(!m) return null; var x = new Date(+m[1], +m[2]-1, +m[3]+1);
          return x.getFullYear() + '-' + ('0'+(x.getMonth()+1)).slice(-2) + '-' + ('0'+x.getDate()).slice(-2); };
        var rows = [];
        j.documents.forEach(function(x){
          var o = val({mapValue:{fields:x.fields||{}}}); if(!o) return;
          if(/\/_always$/.test(x.name || '')){
            (o.items || []).forEach(function(a){ if(a && a.on !== false && a.calc && a.calc.it)
              rows.push({ it:a.calc.it, m:a.calc.m, q:a.calc.q || 1, kind:a.calc.kind, val:a.calc.val, nm:a.t_ko || '', nm_en:a.t_en || a.t_ko || '' }); });
            return;
          }
          if(o.status !== 'live' || !(o.from <= t && t <= o.to)) return;
          var mo = +String(o.month || o.from || '').slice(5, 7);
          (o.items || []).forEach(function(r){ if(r && r.it)
            rows.push({ it:r.it, m:r.m, q:r.q || 1, kind:r.kind, val:r.val, from:o.from, to:nx(o.to),
              nm:o.title_ko || (mo + '월 한정 특별가'), nm_en:o.title_en || o.title_ko || '' }); });
        });
        window.__ptPromo(rows);
      } }catch(e){}
    }).catch(function(){});
  }catch(e){}
})();
</script>
</body>
</html>
