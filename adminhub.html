<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>HHC 관리자</title>
<style>
:root{--navy:#0B1833;--navy2:#1b2f58;--gold:#C9A44C;--bg:#f0f2f8;--bdr:rgba(15,23,41,.09);
  --ink:#14192A;--ink2:#5A6478;--ink3:#98A1B4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);overflow:hidden}
.shell{display:flex;flex-direction:column;height:100%}

/* ── 상단 브랜드 바 ── */
.top{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;
  padding:10px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.top .logo{width:32px;height:32px;background:linear-gradient(150deg,#4F6EF7,#22c1a3);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;
  box-shadow:0 3px 10px rgba(79,110,247,.4)}
.top .tt{font-size:15px;font-weight:800;letter-spacing:-.01em}
.top .tt span{display:block;font-size:9px;font-weight:500;color:#8fa0c9;letter-spacing:.06em;margin-top:1px}
.top .cur{margin-left:auto;font-size:11px;color:#c9d4ee;background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12);padding:5px 12px;border-radius:16px;font-weight:600;white-space:nowrap}

/* ══ 메뉴 — 1줄: 큰 갈래 5개 · 2줄: 그 갈래의 화면들 ══
   눌러야 열리는 드롭다운 대신, 선택한 갈래의 화면을 항상 두 번째 줄에 펼쳐 둡니다.
   지금 어디에 있고 무엇을 더 볼 수 있는지 한눈에 보입니다. */
.nav{background:#fff;border-bottom:1px solid var(--bdr);flex-shrink:0;
  box-shadow:0 2px 12px rgba(15,23,41,.06);position:relative;z-index:50}
.g-row{display:flex;gap:6px;padding:10px 12px 8px;overflow-x:auto;scrollbar-width:none}
.g-row::-webkit-scrollbar{display:none}
.gb{display:flex;align-items:center;gap:8px;flex-shrink:0;min-width:96px;justify-content:center;
  padding:11px 16px;border-radius:13px;border:1.5px solid transparent;background:transparent;
  color:var(--ink2);font-size:14.5px;font-weight:900;font-family:inherit;cursor:pointer;
  transition:background .16s,color .16s;white-space:nowrap;letter-spacing:-.02em}
.gb .ic{font-size:19px;line-height:1}
.gb:hover{background:#f2f4fa;border-color:var(--bdr)}
.gb.on{background:linear-gradient(140deg,#0E2350,#1b2f58);color:#fff;
  box-shadow:0 3px 7px rgba(6,18,45,.25),0 10px 22px -10px rgba(6,18,45,.6)}
.gb .n{font-size:10px;font-weight:900;min-width:17px;height:17px;padding:0 5px;border-radius:99px;
  display:inline-flex;align-items:center;justify-content:center;background:#EEF1F7;color:var(--ink2)}
.gb.on .n{background:rgba(255,255,255,.18);color:#fff}
/* 2줄: 화면 선택 */
.s-row{display:flex;gap:6px;align-items:center;padding:0 12px 10px;overflow-x:auto;scrollbar-width:none}
.s-row::-webkit-scrollbar{display:none}
.sb{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;padding:9px 15px;border-radius:999px;
  border:1.5px solid var(--bdr);background:#fff;color:var(--ink2);font-size:13px;font-weight:800;
  font-family:inherit;cursor:pointer;transition:all .14s;white-space:nowrap;letter-spacing:-.01em}
.sb .ic{font-size:14px;line-height:1}
.sb:hover{border-color:#0E2350;color:#0E2350}
.sb.on{background:#0E2350;border-color:#0E2350;color:#fff;box-shadow:0 4px 12px -4px rgba(14,35,80,.5)}
.sb:active{transform:translateY(1px)}
/* 화면이 하나뿐인 갈래(고객)는 2줄 알약도 하나만 나옵니다 — 그대로 둡니다 */

/* ── 컨텐츠 ── */
.stage{flex:1;position:relative;background:var(--bg)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:var(--bg);z-index:3;transition:opacity .25s;color:#5b6478;font-size:12.5px}
.loading.off{opacity:0;pointer-events:none}
.spin{width:28px;height:28px;border:3px solid #d5dae8;border-top-color:#0E2350;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:560px){
  .gb{min-width:auto;padding:10px 13px;font-size:13.5px}
  .sb{padding:8px 12px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){.gb,.sb{transition:none}.spin{animation-duration:1.6s}}
</style>
</head>
<body>
<div class="shell">

  <div class="top">
    <div class="logo">HHC</div>
    <div class="tt">Happy Home Care<span>ADMIN CONSOLE</span></div>
    <div class="cur" id="cur-name"></div>
  </div>

  <div class="nav">
    <div class="g-row" id="grow"></div>
    <div class="s-row" id="srow"></div>
  </div>

  <div class="stage">
    <div class="loading" id="loading"><div class="spin"></div><div id="load-txt">불러오는 중...</div></div>
    <iframe id="frame" src="about:blank" allow="clipboard-write; clipboard-read"></iframe>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// 메뉴 구성 — 갈래(1줄) 안에 화면(2줄)이 있습니다.
//  · 화면 src 파일명이 서버의 실제 파일명과 다르면 여기만 수정하세요.
//  · 화면 id 는 예전 주소(#invoice 등)·저장된 탭과 그대로 호환됩니다.
// ═══════════════════════════════════════════════════════════
var MENU=[
  {gid:'g-cust',  gname:'고객', gicon:'👥', items:[
    {id:'customers',name:'고객관리',   icon:'👥', src:'customer-admin.html'}
  ]},
  {gid:'g-plan',  gname:'일정', gicon:'📅', items:[
    {id:'schedule', name:'스케줄',     icon:'📅', src:'schedule.html'},
    {id:'memo',     name:'메모장',     icon:'📝', src:'memo-admin.html'}
  ]},
  {gid:'g-book',  gname:'예약', gicon:'🗓️', items:[
    {id:'request',  name:'의뢰관리',   icon:'📥', src:'request-admin.html'},
    {id:'booking',  name:'예약관리',   icon:'🗓️', src:'booking-admin.html'}
  ]},
  {gid:'g-bill',  gname:'청구', gicon:'💳', items:[
    {id:'invoice',  name:'인보이스',   icon:'💳', src:'hhc-invoice.html'},
    {id:'inspect',  name:'점검보고서', icon:'🔧', src:'inspect-admin.html'},
    {id:'contract', name:'계약',       icon:'📑', src:'admin.html'},
    {id:'coupon',   name:'상품·할인권', icon:'🎫', src:'coupon-admin.html'},
    {id:'quote',    name:'견적서',     icon:'🧾', src:'quote-admin.html'}
  ]},
  {gid:'g-etc',   gname:'기타', gicon:'📂', items:[
    {id:'expense',  name:'비용청구',   icon:'💰', src:'expense-admin.html'},
    {id:'homepage', name:'홈페이지',   icon:'🏠', src:'home.html'},
    {id:'reviews',  name:'리뷰관리',   icon:'⭐', src:'review-admin.html'}
  ]}
];
var FLAT=[];
MENU.forEach(function(g){ g.items.forEach(function(c){ c._g=g.gid; FLAT.push(c); }); });
var LS_KEY='hhc_hub_tab';          // 마지막으로 본 화면
var LS_GLAST='hhc_hub_glast';      // 갈래별 마지막 화면 {gid:tabId}
var cur=null;
function gid(id){return document.getElementById(id);}
function gOf(tabId){var t=FLAT.find(function(x){return x.id===tabId;});return t?t._g:MENU[0].gid;}
function glast(){try{return JSON.parse(localStorage.getItem(LS_GLAST)||'{}')||{};}catch(e){return {};}}

/* 1줄 — 갈래 */
function buildGroups(){
  var host=gid('grow');host.innerHTML='';
  MENU.forEach(function(g){
    var b=document.createElement('button');
    b.className='gb';b.id='gb-'+g.gid;
    b.innerHTML='<span class="ic">'+g.gicon+'</span>'+g.gname+
      (g.items.length>1?'<span class="n">'+g.items.length+'</span>':'');
    b.onclick=function(){
      // 갈래를 누르면 그 갈래에서 마지막으로 봤던 화면(없으면 첫 화면)을 바로 엽니다
      var last=glast()[g.gid];
      var t=g.items.find(function(c){return c.id===last;})||g.items[0];
      go(t.id);
    };
    host.appendChild(b);
  });
}
/* 2줄 — 선택한 갈래의 화면들 */
function buildSubs(gidSel){
  var g=MENU.find(function(x){return x.gid===gidSel;})||MENU[0];
  var host=gid('srow');host.innerHTML='';
  g.items.forEach(function(c){
    var b=document.createElement('button');
    b.className='sb';b.id='sb-'+c.id;
    b.innerHTML='<span class="ic">'+c.icon+'</span>'+c.name;
    b.onclick=function(){go(c.id);};
    host.appendChild(b);
  });
}

function go(id,replace){
  var m=FLAT.find(function(x){return x.id===id;})||FLAT[0];
  if(cur===m.id)return;
  cur=m.id;
  var g=MENU.find(function(x){return x.gid===m._g;});
  // 1줄 활성
  MENU.forEach(function(x){
    var el=gid('gb-'+x.gid);
    if(el)el.classList.toggle('on',x.gid===m._g);
  });
  // 2줄 다시 그리고 활성 표시
  buildSubs(m._g);
  FLAT.forEach(function(x){
    var el=gid('sb-'+x.id);
    if(el)el.classList.toggle('on',x.id===m.id);
  });
  gid('cur-name').textContent=g.gname+' · '+m.name;
  document.title='HHC 관리자 · '+m.name;
  var ld=gid('loading');
  ld.classList.remove('off');
  gid('load-txt').textContent=m.name+' 불러오는 중...';
  gid('frame').src=m.src;
  try{
    localStorage.setItem(LS_KEY,m.id);
    var gl=glast();gl[m._g]=m.id;
    localStorage.setItem(LS_GLAST,JSON.stringify(gl));
  }catch(e){}
  if(!replace){try{history.replaceState(null,'','#'+m.id);}catch(e){}}
  var el2=gid('sb-'+m.id);
  if(el2&&el2.scrollIntoView)el2.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  var el3=gid('gb-'+m._g);
  if(el3&&el3.scrollIntoView)el3.scrollIntoView({inline:'nearest',block:'nearest',behavior:'smooth'});
}
gid('frame').addEventListener('load',function(){
  if(gid('frame').src!=='about:blank')gid('loading').classList.add('off');
});
setInterval(function(){
  var ld=gid('loading');
  if(!ld.classList.contains('off')&&gid('frame').src!=='about:blank'){
    if(!ld._t)ld._t=Date.now();
    else if(Date.now()-ld._t>8000){ld.classList.add('off');ld._t=null;}
  }else ld._t=null;
},1000);

// ── 👤 다른 화면에서 「고객상세」 요청이 오면 고객관리 탭으로 전환해서 연다 ──
//    (메모장·스케줄·인보이스 등이 postMessage({hhcOpenCustomer:'<연락처|이름>'}) 를 보냄)
window.addEventListener('message',function(e){
  var d=e&&e.data;
  if(!d||!d.hhcOpenCustomer)return;
  try{if(e.source&&e.source.postMessage)e.source.postMessage({hhcOpenCustomerOk:1},'*');}catch(err){}
  var key=String(d.hhcOpenCustomer);
  var url='customer-admin.html?open='+encodeURIComponent(key);
  var f=gid('frame');
  if(cur==='customers'){
    var ok=false;
    var ack=function(ev){if(ev&&ev.data&&ev.data.hhcOpenCustomerDone){ok=true;window.removeEventListener('message',ack);}};
    window.addEventListener('message',ack);
    try{f.contentWindow.postMessage({hhcOpenCustomer:key},'*');}catch(x){}
    setTimeout(function(){window.removeEventListener('message',ack);if(!ok)f.src=url;},600);
  }else{
    go('customers');
    f.src=url;
  }
});

buildGroups();
var start=(location.hash||'').replace('#','');
if(!FLAT.some(function(m){return m.id===start;})){
  try{start=localStorage.getItem(LS_KEY)||'';}catch(e){start='';}
}
if(!FLAT.some(function(m){return m.id===start;}))start=FLAT[0].id;
go(start,true);
window.addEventListener('hashchange',function(){
  var h=(location.hash||'').replace('#','');
  if(FLAT.some(function(m){return m.id===h}))go(h,true);
});
</script>
</body>
</html>
