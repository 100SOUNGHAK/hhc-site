<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>HHC 관리자</title>
<style>
:root{--navy:#0F1729;--navy2:#1d2b4f;--indigo:#4F6EF7;--teal:#22c1a3;--gold:#E8A838;--bg:#f0f2f8;--bdr:rgba(15,23,41,.08)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:var(--bg);overflow:hidden}
.shell{display:flex;flex-direction:column;height:100%}

/* ── 상단 브랜드 바 ── */
.top{background:linear-gradient(120deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:11px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.top .logo{width:32px;height:32px;background:linear-gradient(150deg,var(--indigo),var(--teal));border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;box-shadow:0 3px 10px rgba(79,110,247,.4)}
.top .tt{font-size:15px;font-weight:800;letter-spacing:-.01em}
.top .tt span{display:block;font-size:9px;font-weight:500;color:#8fa0c9;letter-spacing:.06em;margin-top:1px}
.top .cur{margin-left:auto;font-size:11px;color:#c9d4ee;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);padding:5px 12px;border-radius:16px;font-weight:600;white-space:nowrap}

/* ── 메뉴 바 : 아이콘 + 라벨 세로형 · 크게 ── */
.nav{background:#fff;border-bottom:1px solid var(--bdr);flex-shrink:0;box-shadow:0 2px 12px rgba(15,23,41,.06);position:relative;z-index:50}
.nav-in{display:flex;gap:6px;padding:9px 12px;overflow-x:auto;overflow-y:visible;scrollbar-width:none;-ms-overflow-style:none}
.nav-in::-webkit-scrollbar{display:none}
.nw{position:relative;flex-shrink:0}
.ni{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:76px;padding:9px 12px 8px;
  border-radius:14px;border:1.5px solid transparent;background:transparent;color:#39415a;
  font-size:12px;font-weight:800;font-family:inherit;cursor:pointer;transition:all .16s;white-space:nowrap;position:relative;letter-spacing:-.02em}
.ni .ic{font-size:21px;line-height:1}
.ni:hover{background:#f2f4fa;border-color:var(--bdr)}
.ni.on{background:linear-gradient(120deg,var(--indigo),#3a56d4);color:#fff;box-shadow:0 5px 16px rgba(79,110,247,.4)}
.ni .new{position:absolute;top:1px;right:3px;font-size:7.5px;font-weight:800;background:var(--gold);color:#3d2c00;padding:1px 5px;border-radius:7px;letter-spacing:.02em}
.ni .cv{font-size:8px;margin-top:-1px;opacity:.6}
.ni.on .cv{opacity:.9}
/* 그룹 버튼: 하위 메뉴가 활성일 때 표시 */
.ni.gp-on{background:#EEF2FF;border-color:#C3CFFB;color:#2b3fae}

/* 드롭다운 하위 메뉴 */
.dd{position:fixed;z-index:120;background:#fff;border:1.5px solid var(--bdr);
  border-radius:14px;box-shadow:0 16px 44px -10px rgba(15,23,41,.28);padding:6px;min-width:176px;display:none}
.dd.open{display:block}
.dd button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:none;background:none;
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:800;color:#39415a;padding:10px 12px;border-radius:10px;letter-spacing:-.02em}
.dd button:hover{background:#f2f4fa}
.dd button.on{background:linear-gradient(120deg,var(--indigo),#3a56d4);color:#fff}
.dd button .ic{font-size:16px;width:20px;text-align:center}
.dd button .new{margin-left:auto;font-size:7.5px;font-weight:800;background:var(--gold);color:#3d2c00;padding:1px 5px;border-radius:7px}

/* ── 컨텐츠 ── */
.stage{flex:1;position:relative;background:var(--bg)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:var(--bg)}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--bg);z-index:3;transition:opacity .25s;color:#5b6478;font-size:12.5px}
.loading.off{opacity:0;pointer-events:none}
.spin{width:28px;height:28px;border:3px solid #d5dae8;border-top-color:var(--indigo);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="shell">

  <div class="top">
    <div class="logo">HHC</div>
    <div class="tt">Happy Home Care<span>ADMIN CONSOLE</span></div>
    <div class="cur" id="cur-name">스케줄</div>
  </div>

  <div class="nav"><div class="nav-in" id="nav"></div></div>

  <div class="stage">
    <div class="loading" id="loading"><div class="spin"></div><div id="load-txt">불러오는 중...</div></div>
    <iframe id="frame" src="about:blank" allow="clipboard-write; clipboard-read"></iframe>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// 메뉴 구성 — src 파일명이 서버의 실제 파일명과 다르면 여기만 수정하세요
//  · group 이 있는 항목은 클릭 시 하위 메뉴가 열립니다
// ═══════════════════════════════════════════════════════════
var MENU=[
  {id:'customers',name:'고객관리',   icon:'👥', src:'customer-admin.html', isNew:true},
  {id:'memo',     name:'메모장',     icon:'📝', src:'memo-admin.html'},
  {id:'schedule', name:'스케줄',     icon:'📅', src:'schedule.html'},
  {id:'grp-rq',   name:'의뢰 예약',  icon:'🗂️', group:[
    {id:'request',  name:'의뢰관리',   icon:'📥', src:'request-admin.html'},
    {id:'booking',  name:'예약관리',   icon:'🗓️', src:'booking-admin.html'}
  ]},
  {id:'grp-svc',  name:'서비스비용', icon:'💼', group:[
    {id:'invoice',  name:'인보이스',   icon:'💳', src:'hhc-invoice.html'},
    {id:'inspect',  name:'점검보고서', icon:'🔧', src:'inspect-admin.html'},
    {id:'contract', name:'계약',       icon:'📑', src:'admin.html'},
    {id:'coupon',   name:'상품권·할인권', icon:'🎫', src:'coupon-admin.html', isNew:true},
    {id:'quote',    name:'견적서',     icon:'🧾', src:'quote-admin.html'}
  ]},
  {id:'expense',  name:'비용청구',   icon:'💰', src:'expense-admin.html'}
];
// 모든 탭(하위 포함) 평탄화 — 기존 해시·저장 탭 id 와 호환
var FLAT=[];
MENU.forEach(function(m){ if(m.group)m.group.forEach(function(c){c._parent=m.id;FLAT.push(c);}); else FLAT.push(m); });
var LS_KEY='hhc_hub_tab';
var cur=null;

function gid(id){return document.getElementById(id);}

function build(){
  var host=gid('nav');
  MENU.forEach(function(m){
    var wrap=document.createElement('div');wrap.className='nw';
    var b=document.createElement('button');
    b.className='ni';b.id='ni-'+m.id;
    b.innerHTML='<span class="ic">'+m.icon+'</span>'+m.name+
      (m.group?'<span class="cv">▼</span>':'')+
      (m.isNew?'<span class="new">NEW</span>':'');
    wrap.appendChild(b);
    if(m.group){
      var dd=document.createElement('div');dd.className='dd';dd.id='dd-'+m.id;
      m.group.forEach(function(c){
        var cb=document.createElement('button');cb.id='ni-'+c.id;
        cb.innerHTML='<span class="ic">'+c.icon+'</span>'+c.name+(c.isNew?'<span class="new">NEW</span>':'');
        cb.onclick=function(ev){ev.stopPropagation();closeDD();go(c.id);};
        dd.appendChild(cb);
      });
      wrap.appendChild(dd);
      b.onclick=function(ev){
        ev.stopPropagation();
        var open=dd.classList.contains('open');
        closeDD();
        if(!open){
          // 가로 스크롤 메뉴 바에 잘리지 않도록 화면 기준 고정 위치로 띄운다
          var r=b.getBoundingClientRect();
          dd.classList.add('open');
          var w=dd.offsetWidth||176;
          var x=Math.min(r.left,window.innerWidth-w-8);
          dd.style.left=(x<8?8:x)+'px';
          dd.style.top=(r.bottom+6)+'px';
        }
      };
    }else{
      b.onclick=function(){closeDD();go(m.id);};
    }
    host.appendChild(wrap);
  });
  document.addEventListener('click',closeDD);
  gid('nav').addEventListener('scroll',closeDD);
  window.addEventListener('resize',closeDD);
}
function closeDD(){document.querySelectorAll('.dd.open').forEach(function(d){d.classList.remove('open');});}

function go(id,replace){
  var m=FLAT.find(function(x){return x.id===id;})||FLAT[0];
  if(cur===m.id)return;
  cur=m.id;
  // 활성 표시: 하위 탭 + 상위 그룹 버튼
  FLAT.forEach(function(x){
    var el=gid('ni-'+x.id);
    if(el)el.classList.toggle('on',x.id===m.id);
  });
  MENU.forEach(function(x){
    var el=gid('ni-'+x.id);if(!el)return;
    if(x.group){
      var hit=x.group.some(function(c){return c.id===m.id;});
      el.classList.toggle('gp-on',hit);
      el.classList.remove('on');
    }
  });
  gid('cur-name').textContent=m.name;
  document.title='HHC 관리자 · '+m.name;
  var ld=gid('loading');
  ld.classList.remove('off');
  gid('load-txt').textContent=m.name+' 불러오는 중...';
  var f=gid('frame');
  f.src=m.src;
  try{localStorage.setItem(LS_KEY,m.id);}catch(e){}
  if(!replace){try{history.replaceState(null,'','#'+m.id);}catch(e){}}
  var el2=gid('ni-'+(m._parent||m.id));
  if(el2&&el2.scrollIntoView)el2.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
}
gid('frame').addEventListener('load',function(){
  if(gid('frame').src!=='about:blank')gid('loading').classList.add('off');
});
setInterval(function(){
  var ld=gid('loading');
  if(!ld.classList.contains('off')&&gid('frame').src!=='about:blank'){
    if(!ld._t)ld._t=Date.now();
    else if(Date.now()-ld._t>8000){ld.classList.add('off');ld._t=null;}
  }else ld._t=null;
},1000);

// ── 👤 다른 화면에서 「고객상세」 요청이 오면 고객관리 탭으로 전환해서 연다 ──
//    (메모장·스케줄·인보이스 등이 postMessage({hhcOpenCustomer:'<연락처|이름>'}) 를 보냄)
window.addEventListener('message',function(e){
  var d=e&&e.data;
  if(!d||!d.hhcOpenCustomer)return;
  try{if(e.source&&e.source.postMessage)e.source.postMessage({hhcOpenCustomerOk:1},'*');}catch(err){}
  var key=String(d.hhcOpenCustomer);
  var url='customer-admin.html?open='+encodeURIComponent(key);
  var f=gid('frame');
  if(cur==='customers'){
    // 이미 고객관리 화면 → 화면을 다시 불러오지 않고 메시지로만 해당 고객을 연다
    var ok=false;
    var ack=function(ev){if(ev&&ev.data&&ev.data.hhcOpenCustomerDone){ok=true;window.removeEventListener('message',ack);}};
    window.addEventListener('message',ack);
    try{f.contentWindow.postMessage({hhcOpenCustomer:key},'*');}catch(x){}
    setTimeout(function(){window.removeEventListener('message',ack);if(!ok)f.src=url;},600);
  }else{
    go('customers');
    f.src=url;   // 탭 전환 직후 해당 고객 주소로 바로 연다
  }
});

build();
var start=(location.hash||'').replace('#','');
if(!FLAT.some(function(m){return m.id===start;})){
  try{start=localStorage.getItem(LS_KEY)||'';}catch(e){start='';}
}
if(!FLAT.some(function(m){return m.id===start;}))start=FLAT[0].id;
go(start,true);
window.addEventListener('hashchange',function(){
  var h=(location.hash||'').replace('#','');
  if(FLAT.some(function(m){return m.id===h}))go(h,true);
});
</script>
</body>
</html>
