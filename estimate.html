<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>간편 견적 계산기 — Happy Home Care</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1833;--teal:#0BB5A4;--teal-lt:#E1F5EE;--teal-dk:#085048;
  --w:#fff;--g:#F5F7FB;--ln:#E8ECF4;--tx:#0F1C3F;--tx2:#4A5578;--tx3:#8693B5;
  --amber:#D97706;--amber-bg:#FEF3C7;
}
html,body{height:100%}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:var(--g);color:var(--tx)}
.hdr{background:var(--navy);padding:16px;position:sticky;top:0;z-index:50}
.hdr-row{display:flex;align-items:center;gap:10px;max-width:640px;margin:0 auto}
.logo{width:32px;height:32px;background:var(--teal);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0}
.hdr-ttl{font-size:14px;font-weight:700;color:#fff}
.hdr-sub{font-size:10.5px;color:rgba(255,255,255,.45)}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 120px}
.notice{background:var(--teal-lt);border:0.5px solid rgba(11,181,164,.25);border-radius:10px;padding:11px 13px;font-size:12px;color:var(--teal-dk);line-height:1.6;margin-bottom:14px}
.subcat-hdr{font-size:11px;font-weight:700;color:var(--tx3);letter-spacing:.04em;text-transform:uppercase;margin:14px 0 6px}
.item-row{display:flex;align-items:center;gap:10px;background:var(--w);border:0.5px solid var(--ln);border-radius:10px;padding:11px 13px;margin-bottom:7px}
.item-name{font-size:13.5px;font-weight:600;color:var(--tx)}
.item-price{font-size:11.5px;color:var(--tx3);margin-top:2px}
.qty-box{display:flex;align-items:center;gap:8px;flex-shrink:0}
.qty-btn{width:28px;height:28px;border-radius:8px;border:1px solid var(--ln);background:var(--g);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.qty-btn:active{background:var(--teal-lt);border-color:var(--teal)}
.qty-val{width:22px;text-align:center;font-size:13.5px;font-weight:700}

.bar{position:fixed;bottom:0;left:0;right:0;background:var(--w);border-top:0.5px solid var(--ln);padding:12px 14px;z-index:60;box-shadow:0 -4px 16px rgba(15,28,63,.06)}
.bar-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar-info{flex:1}
.bar-cnt{font-size:11px;color:var(--tx3)}
.bar-total{font-size:17px;font-weight:800;color:var(--navy)}
.bar-btn{padding:11px 20px;border-radius:10px;border:none;background:var(--teal);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.bar-btn:disabled{background:var(--ln);color:var(--tx3);cursor:not-allowed}

.sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:flex-end;justify-content:center}
.sheet-ov.open{display:flex}
.sheet{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding:20px}
.sheet-handle{width:36px;height:4px;background:var(--ln);border-radius:2px;margin:0 auto 16px}
.q-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.q-ttl{font-size:16px;font-weight:800;color:var(--navy)}
.q-date{font-size:11px;color:var(--tx3);margin-bottom:14px}
.q-line{display:flex;justify-content:space-between;padding:9px 0;border-bottom:0.5px solid var(--ln);font-size:13px}
.q-line-name{color:var(--tx)}
.q-line-sub{font-size:11px;color:var(--tx3);margin-top:1px}
.q-line-amt{font-weight:700;color:var(--tx);flex-shrink:0;padding-left:10px}
.q-total-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0 4px;margin-top:6px}
.q-total-lbl{font-size:13px;font-weight:600;color:var(--tx2)}
.q-total-val{font-size:22px;font-weight:800;color:var(--teal-dk)}
.q-disclaimer{background:var(--amber-bg);color:#92600A;font-size:11px;line-height:1.7;border-radius:8px;padding:10px 12px;margin-top:14px}
.q-actions{display:flex;gap:8px;margin-top:16px}
.q-btn{flex:1;padding:11px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit}
.q-btn-wa{background:#25D366;color:#fff}
.q-btn-kakao{background:#FEE500;color:#3A1D1D}
.q-btn-reset{width:100%;margin-top:8px;padding:10px;border-radius:10px;background:none;border:1px solid var(--ln);color:var(--tx2);font-size:12.5px;cursor:pointer;font-family:inherit}
.copy-ok{display:none;text-align:center;padding:8px;background:var(--teal-lt);color:var(--teal-dk);border-radius:8px;font-size:11.5px;font-weight:600;margin-top:8px}
.empty-q{text-align:center;padding:30px 0;color:var(--tx3);font-size:13px}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-row">
    <div class="logo">H</div>
    <div style="flex:1">
      <div class="hdr-ttl">간편 견적 계산기</div>
      <div class="hdr-sub">Happy Home Care</div>
    </div>
    <div style="display:flex;background:rgba(255,255,255,.08);border-radius:20px;padding:2px">
      <button id="lang-ko-btn" onclick="setLang('ko')" style="padding:5px 11px;border-radius:16px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;background:#0BB5A4;color:#fff">한글</button>
      <button id="lang-en-btn" onclick="setLang('en')" style="padding:5px 11px;border-radius:16px;border:none;font-size:11px;font-weight:500;cursor:pointer;font-family:inherit;background:transparent;color:rgba(255,255,255,.5)">English</button>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="notice" id="notice-txt">📋 원하시는 서비스 품목과 수량을 선택하시면, 참고용 예상 견적을 바로 확인하실 수 있어요. 정확한 방문 견적은 현장 상태에 따라 달라질 수 있습니다.</div>

  <div id="cat-body"></div>
</div>

<div class="bar">
  <div class="bar-inner">
    <div class="bar-info">
      <div class="bar-cnt" id="bar-cnt">선택된 품목 없음</div>
      <div class="bar-total" id="bar-total">RM 0</div>
    </div>
    <button class="bar-btn" id="bar-btn" onclick="openQuote()" disabled>견적서 보기</button>
  </div>
</div>

<div class="sheet-ov" id="sheet-ov" onclick="if(event.target===this)closeQuote()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="q-hdr"><div class="q-ttl" id="q-ttl-txt">예상 견적서</div></div>
    <div class="q-date" id="q-date"></div>
    <div id="q-lines"></div>
    <div class="q-total-row">
      <div class="q-total-lbl" id="q-total-lbl">예상 총액</div>
      <div class="q-total-val" id="q-total"></div>
    </div>
    <div class="q-disclaimer" id="q-disclaimer-txt">⚠️ 본 견적은 참고용 예상 금액이며, 실제 현장 상태(오염도·접근성·자재 필요 여부 등)에 따라 변동될 수 있습니다. 정확한 견적은 방문 확인 후 안내드립니다.</div>
    <div class="q-actions">
      <button class="q-btn q-btn-wa" id="q-btn-wa-txt" onclick="shareWA()">💬 WhatsApp 문의</button>
      <button class="q-btn q-btn-kakao" id="q-btn-kakao-txt" onclick="shareKakao()">📋 카카오 복사</button>
    </div>
    <div class="copy-ok" id="copy-ok">✓ 복사되었습니다! 카카오톡에 붙여넣기 하세요</div>
    <button class="q-btn-reset" id="q-btn-reset-txt" onclick="closeQuote()">닫기</button>
  </div>
</div>

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getFirestore,collection,onSnapshot} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const FIREBASE_CFG={
  apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",
  authDomain:"happywork-packageplan.firebaseapp.com",
  projectId:"happywork-packageplan",
  storageBucket:"happywork-packageplan.firebasestorage.app",
  messagingSenderId:"101289103022",
  appId:"1:101289103022:web:d81aca7f3747dd26df673f"
};

// 인보이스 시스템과 동일한 기본 단가표 (Firestore 연결 실패 시 대비용 기본값)
const DEF_SVC=[
  {id:'ds1',cat:'청소',subcat:'에어컨(가정용)',name:'기본청소',price:80,unit:'대',order:0},
  {id:'ds2',cat:'청소',subcat:'에어컨(가정용)',name:'화학청소',price:120,unit:'대',order:1},
  {id:'ds3',cat:'청소',subcat:'에어컨(가정용)',name:'스팀청소',price:150,unit:'대',order:2},
  {id:'ds7',cat:'청소',subcat:'세탁기',name:'통돌이 세탁기 청소',price:120,unit:'대',order:6},
  {id:'ds8',cat:'청소',subcat:'세탁기',name:'드럼 세탁기 청소',price:150,unit:'대',order:7},
  {id:'ds9',cat:'청소',subcat:'매트리스',name:'싱글 매트리스 청소',price:80,unit:'개',order:8},
  {id:'ds10',cat:'청소',subcat:'매트리스',name:'퀸/킹 매트리스 청소',price:120,unit:'개',order:9},
  {id:'ds11',cat:'청소',subcat:'쇼파',name:'쇼파 I타입 청소',price:100,unit:'세트',order:10},
  {id:'ds12',cat:'청소',subcat:'쇼파',name:'쇼파 L타입 청소',price:150,unit:'세트',order:11},
  {id:'ds13',cat:'청소',subcat:'커튼',name:'커튼 청소 (수거포함)',price:50,unit:'장',order:12},
  {id:'ds14',cat:'청소',subcat:'기타제품',name:'냉장고 청소',price:100,unit:'대',order:13},
  {id:'ds15',cat:'청소',subcat:'기타제품',name:'오븐 청소',price:80,unit:'대',order:14},
];

let services=DEF_SVC.slice();
let quote={}; // { svcId: {name,price,unit,qty} }
let curLang='ko';
let trSeq=0;
window._trCache=window._trCache||{};

// 특정 용어는 자동번역 대신 지정된 한글 용어로 고정
const EN_TO_KO_OVERRIDE={
  'chemical cleaning':'화학 세척',
  'semi-overhaul cleaning':'반분해세척',
  'overhaul cleaning':'전체분해세척',
  'professional collection laundry':'전문수거세탁'
};
// 자동번역 결과가 어색한 경우 보정
const KO_FIX={
  '드라이석션클리닝':'건식세탁',
  '웨트스팀클리닝':'습식살균세탁',
  '온사이드 스팀클리닝':'현장스팀세탁',
  '세탁기(탑로드형)':'세탁기(통돌이)',
  '세탁기(전 투입형)':'세탁기(드럼)',
  '(10kg 추가시 또는 그 일부당)':'(10kg 이내 추가시마다)',
  '(5kg 추가시 또는 그 일부당)':'(5kg 이내 추가시마다)'
};
function fixKo(t){return KO_FIX[t]!==undefined?KO_FIX[t]:t;}
function findOverride(text,srcLang,targetLang){
  if(srcLang==='en'&&targetLang==='ko')return EN_TO_KO_OVERRIDE[(text||'').trim().toLowerCase()];
  return undefined;
}

function autoTr(text,srcLang,applyFn){
  const targetLang=curLang;
  if(targetLang===srcLang){applyFn(targetLang==='ko'?fixKo(text||''):(text||''));return;}
  if(!text){applyFn('');return;}
  const key=srcLang+'|'+targetLang+'|'+text;
  if(window._trCache[key]){applyFn(window._trCache[key]);return;}
  const ov=findOverride(text,srcLang,targetLang);
  if(ov){window._trCache[key]=ov;applyFn(ov);return;}
  fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+srcLang+'&tl='+targetLang+'&dt=t&q='+encodeURIComponent(text))
    .then(r=>r.json())
    .then(j=>{
      let tr=(j&&j[0])?j[0].map(seg=>seg[0]).join(''):text;
      if(targetLang==='ko')tr=fixKo(tr);
      window._trCache[key]=tr;
      if(curLang===targetLang)applyFn(tr);
    }).catch(()=>{});
}
function trSpan(text,srcLang){
  const id='tr'+(trSeq++);
  const targetLang=curLang;
  let placeholder=text||'';
  if(targetLang===srcLang){
    placeholder=targetLang==='ko'?fixKo(placeholder):placeholder;
  }else{
    const key=srcLang+'|'+targetLang+'|'+text;
    if(window._trCache[key])placeholder=window._trCache[key];
    else{
      const ov=findOverride(text,srcLang,targetLang);
      if(ov)placeholder=ov;
    }
  }
  autoTr(text,srcLang,v=>{const el=document.getElementById(id);if(el)el.textContent=v;});
  return '<span id="'+id+'">'+placeholder+'</span>';
}
function trCached(text,srcLang){
  if(curLang===srcLang)return curLang==='ko'?fixKo(text||''):(text||'');
  const key=srcLang+'|'+curLang+'|'+text;
  if(window._trCache[key])return window._trCache[key];
  const ov=findOverride(text,srcLang,curLang);
  return ov||text||'';
}

// 고정 UI 문구 (한글 원본 → 영어 직접 지정, API 호출 없이 즉시/안정적으로 전환)
const UI_EN={
  notice:'📋 Select the items and quantity you need to see an estimated quote right away. The actual on-site quote may vary depending on the condition of the site.',
  barBtn:'View Quote',
  barCntEmpty:'No items selected',
  qTtl:'Estimated Quote',
  qTotalLbl:'Estimated Total',
  disclaimer:'⚠️ This is an estimated reference amount only, and may vary depending on actual site conditions (contamination level, accessibility, materials needed, etc). An accurate quote will be provided after an on-site visit.',
  waLabel:'💬 WhatsApp Inquiry',
  kakaoLabel:'📋 Copy for KakaoTalk',
  closeLabel:'Close',
  emptyMsg:'No items registered in this category'
};
const UI_KO={
  notice:'📋 원하시는 서비스 품목과 수량을 선택하시면, 참고용 예상 견적을 바로 확인하실 수 있어요. 정확한 방문 견적은 현장 상태에 따라 달라질 수 있습니다.',
  barBtn:'견적서 보기',
  barCntEmpty:'선택된 품목 없음',
  qTtl:'예상 견적서',
  qTotalLbl:'예상 총액',
  disclaimer:'⚠️ 본 견적은 참고용 예상 금액이며, 실제 현장 상태(오염도·접근성·자재 필요 여부 등)에 따라 변동될 수 있습니다. 정확한 견적은 방문 확인 후 안내드립니다.',
  waLabel:'💬 WhatsApp 문의',
  kakaoLabel:'📋 카카오 복사',
  closeLabel:'닫기',
  emptyMsg:'이 카테고리엔 등록된 품목이 없습니다'
};
function ui(key){return curLang==='en'?UI_EN[key]:UI_KO[key];}

function applyStaticUI(){
  const notice=document.getElementById('notice-txt');if(notice)notice.textContent=ui('notice');
  const barBtn=document.getElementById('bar-btn');if(barBtn)barBtn.textContent=ui('barBtn');
  const qTtl=document.getElementById('q-ttl-txt');if(qTtl)qTtl.textContent=ui('qTtl');
  const qTotalLbl=document.getElementById('q-total-lbl');if(qTotalLbl)qTotalLbl.textContent=ui('qTotalLbl');
  const disc=document.getElementById('q-disclaimer-txt');if(disc)disc.textContent=ui('disclaimer');
  const wa=document.getElementById('q-btn-wa-txt');if(wa)wa.textContent=ui('waLabel');
  const kakao=document.getElementById('q-btn-kakao-txt');if(kakao)kakao.textContent=ui('kakaoLabel');
  const close=document.getElementById('q-btn-reset-txt');if(close)close.textContent=ui('closeLabel');
  renderBar();
}

window.setLang=function(lang){
  curLang=lang;
  document.getElementById('lang-ko-btn').style.cssText='padding:5px 11px;border-radius:16px;border:none;font-size:11px;cursor:pointer;font-family:inherit;'+(lang==='ko'?'font-weight:700;background:#0BB5A4;color:#fff':'font-weight:500;background:transparent;color:rgba(255,255,255,.5)');
  document.getElementById('lang-en-btn').style.cssText='padding:5px 11px;border-radius:16px;border:none;font-size:11px;cursor:pointer;font-family:inherit;'+(lang==='en'?'font-weight:700;background:#0BB5A4;color:#fff':'font-weight:500;background:transparent;color:rgba(255,255,255,.5)');
  applyStaticUI();
  renderBody();
};

function fmt(n){return 'RM '+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});}

function renderBody(){
  const body=document.getElementById('cat-body');
  const items=services.filter(s=>s.cat==='청소'&&s.subcat!=='에어컨(매장용)').sort((a,b)=>(a.order||0)-(b.order||0));
  const bySubcat={};
  items.forEach(s=>{
    const key=s.subcat||'기타';
    if(!bySubcat[key])bySubcat[key]=[];
    bySubcat[key].push(s);
  });
  const subKeys=Object.keys(bySubcat).sort((a,b)=>{
    const aMisc=a.indexOf('기타')>-1;
    const bMisc=b.indexOf('기타')>-1;
    if(aMisc&&!bMisc)return 1;
    if(bMisc&&!aMisc)return -1;
    return 0;
  });
  let html='';
  subKeys.forEach(sub=>{
    html+=`<div class="subcat-hdr">${trSpan(sub,'ko')}</div>`;
    bySubcat[sub].forEach(s=>{
      const q=quote[s.id]?quote[s.id].qty:0;
      html+=`<div class="item-row">
        <div style="flex:1">
          <div class="item-name">${trSpan(s.name,'en')}</div>
          <div class="item-price">${fmt(s.price)} / ${s.unit||'건'}</div>
        </div>
        <div class="qty-box">
          <button class="qty-btn" onclick="changeQty('${s.id}',-1)">−</button>
          <div class="qty-val">${q}</div>
          <button class="qty-btn" onclick="changeQty('${s.id}',1)">+</button>
        </div>
      </div>`;
    });
  });
  body.innerHTML=html||'<div class="empty-q">'+ui('emptyMsg')+'</div>';
}

window.changeQty=function(id,delta){
  const svc=services.find(s=>s.id===id);
  if(!svc)return;
  const cur=quote[id]?quote[id].qty:0;
  const next=Math.max(0,cur+delta);
  if(next===0)delete quote[id];
  else quote[id]={name:svc.name,unit:svc.unit,price:svc.price,qty:next};
  renderBody();
  renderBar();
};

function renderBar(){
  const items=Object.values(quote);
  const cnt=items.reduce((s,i)=>s+i.qty,0);
  const total=items.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('bar-cnt').textContent=cnt?(curLang==='en'?`${cnt} item(s) selected`:`선택된 품목 ${cnt}개`):ui('barCntEmpty');
  document.getElementById('bar-total').textContent=fmt(total);
  document.getElementById('bar-btn').disabled=cnt===0;
}

window.openQuote=function(){
  const items=Object.values(quote);
  if(!items.length)return;
  const now=new Date();
  document.getElementById('q-date').textContent=now.toLocaleDateString('ko-KR')+' 기준 예상 견적';
  document.getElementById('q-lines').innerHTML=items.map(i=>{
    const amt=i.price*i.qty;
    return `<div class="q-line">
      <div>
        <div class="q-line-name">${trSpan(i.name,'en')}</div>
        <div class="q-line-sub">${fmt(i.price)} × ${i.qty}${i.unit||''}</div>
      </div>
      <div class="q-line-amt">${fmt(amt)}</div>
    </div>`;
  }).join('');
  const total=items.reduce((s,i)=>s+i.price*i.qty,0);
  document.getElementById('q-total').textContent=fmt(total);
  document.getElementById('sheet-ov').classList.add('open');
};
window.closeQuote=function(){document.getElementById('sheet-ov').classList.remove('open');};

function buildMsg(){
  const items=Object.values(quote);
  const now=new Date();
  let lines=['[HHC 예상 견적서]',now.toLocaleDateString('ko-KR'),''];
  items.forEach(i=>{lines.push(`• ${trCached(i.name,'en')} ${fmt(i.price)} × ${i.qty}${i.unit||''} = ${fmt(i.price*i.qty)}`);});
  const total=items.reduce((s,i)=>s+i.price*i.qty,0);
  lines.push('');
  lines.push(`예상 총액: ${fmt(total)}`);
  lines.push('');
  lines.push('※ 참고용 예상 금액이며, 실제 현장 상태에 따라 변동될 수 있습니다.');
  lines.push('');
  lines.push('HAPPY WORKS SERVICES SDN.BHD.');
  lines.push('📞 +60172472774');
  return lines.join('\n');
}

window.shareWA=function(){window.open('https://wa.me/?text='+encodeURIComponent(buildMsg()),'_blank');};
window.shareKakao=function(){
  navigator.clipboard.writeText(buildMsg()).then(()=>{
    const ok=document.getElementById('copy-ok');
    ok.style.display='block';setTimeout(()=>ok.style.display='none',3000);
  }).catch(()=>prompt('복사:',buildMsg()));
};

applyStaticUI();renderBody();renderBar();

try{
  const app=initializeApp(FIREBASE_CFG);
  const db=getFirestore(app);
  onSnapshot(collection(db,'services'),snap=>{
    if(snap.docs.length){
      const all=snap.docs.map(d=>Object.assign({id:d.id},d.data()));
      const cleaning=all.filter(s=>s.cat==='청소');
      if(cleaning.length){
        services=cleaning;
        services.sort((a,b)=>(a.order||0)-(b.order||0));
        renderBody();
      }
    }
  },()=>{ /* 오프라인 시 기본 단가표 유지 */ });
}catch(e){console.warn('Firebase 연결 실패, 기본 단가표 사용:',e.message);}
</script>
