<style>
:root{
  --navy-950:#08172b;--navy-900:#0f2540;--navy-800:#173a5e;
  --teal-700:#0b5f59;--teal-600:#0f766e;--teal-50:#eaf6f4;
  --gold-700:#8f6f28;--gold-600:#b08d3a;--gold-500:#c9a44c;--gold-300:#e3c98a;--gold-100:#f4e7c4;--gold-50:#fbf5e6;
  --ink-900:#161d27;--ink-700:#333d4b;--ink-600:#4d5866;--ink-400:#8891a0;
  --line:#e6e9ef;--paper:#f5f6f9;
  --barH:76px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:var(--paper);color:var(--ink-900);line-height:1.6;font-size:15px;letter-spacing:-.01em}
.pg{max-width:520px;margin:0 auto;background:#fff;min-height:100vh;
  box-shadow:0 0 60px rgba(8,23,43,.1);overflow:hidden;
  padding-bottom:calc(var(--barH) + 16px + env(safe-area-inset-bottom))}

/* ── 언어 전환 ── */
.hero .lgb{position:absolute;top:calc(11px + env(safe-area-inset-top));right:14px;z-index:6;
  display:flex;gap:3px;background:rgba(255,255,255,.16);border-radius:999px;padding:2px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.lgb button{border:none;background:none;color:#c9d6ea;font-family:inherit;font-size:11px;font-weight:800;
  border-radius:999px;padding:4px 10px;cursor:pointer;letter-spacing:0}
.lgb button.on{background:#fff;color:var(--navy-900)}

/* ── 10주년 이벤트 카드 (히어로와 01 멤버십 등급 사이) ── */
.evt{margin:12px 14px 1px;border-radius:15px;text-align:center;padding:13px 14px 15px;line-height:1.4;
  background:
    radial-gradient(420px 58px at 50% 0%, rgba(255,248,224,.6), transparent 72%),
    linear-gradient(100deg,#7d6020,var(--gold-600) 26%,var(--gold-500) 55%,#ecd9a4 88%,var(--gold-300));
  box-shadow:0 2px 5px rgba(143,111,40,.25),0 12px 26px -11px rgba(143,111,40,.65),
    inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(92,68,16,.25)}
.evt .row1{display:flex;align-items:center;justify-content:center;gap:8px}
.evt .tg{display:inline-flex;align-items:center;background:var(--navy-900);color:var(--gold-300);
  border-radius:999px;padding:4px 12px;font-size:11.5px;font-weight:900;letter-spacing:-.01em;
  box-shadow:0 3px 8px -2px rgba(15,37,64,.6),inset 0 1px 0 rgba(255,255,255,.14)}
.evt .lim{display:inline-block;font-size:11px;font-weight:900;color:#4d3a0e;
  background:rgba(255,255,255,.42);border:1.5px solid rgba(92,68,16,.4);border-radius:999px;padding:2px 10px}
.evt .row2{margin-top:7px;font-size:16.5px;font-weight:900;letter-spacing:-.03em;color:#241b03;
  word-break:keep-all}
.evt .row2 b{font-weight:900;color:#12234a;
  background:linear-gradient(transparent 56%, rgba(255,255,255,.62) 56%);
  padding:0 3px;border-radius:4px;text-shadow:0 1px 0 rgba(255,255,255,.35)}

/* ── 히어로 (첫 화면에 등급이 모두 들어가도록 압축) ── */
.hero{position:relative;background:linear-gradient(168deg,var(--navy-950),var(--navy-900) 55%,#12314f);
  color:#fff;padding:14px 18px 15px;overflow:hidden}
.hero:before{content:'';position:absolute;width:260px;height:260px;right:-110px;top:-120px;border-radius:50%;
  background:radial-gradient(circle,rgba(201,164,76,.26),transparent 68%)}
.hero>*{position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.brand .lg{width:31px;height:31px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:Georgia,serif;font-size:17px;font-weight:700;color:var(--gold-300);
  background:rgba(255,255,255,.08);border:1px solid rgba(227,201,138,.35)}
.brand .nm{font-size:12.5px;font-weight:800;line-height:1.25}
.brand .nm span{display:block;font-size:8px;font-weight:600;color:#8ba3c4;letter-spacing:.08em;margin-top:1px}
.hero h1{font-size:21px;font-weight:800;letter-spacing:-.035em;line-height:1.3}
.hero h1 em{font-style:normal;color:var(--gold-300)}
.hero p{font-size:11.5px;color:#b9cae0;margin-top:7px;line-height:1.6;font-weight:500;word-break:keep-all}
.facts{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.facts span{font-size:10px;font-weight:800;color:var(--gold-300);background:rgba(227,201,138,.13);
  border:1px solid rgba(227,201,138,.3);border-radius:999px;padding:4px 9px;white-space:nowrap}

/* ── 등급 목록 (압축형 · 첫 화면용) ── */
.tsec{padding:11px 14px 4px}
.thd{display:flex;align-items:baseline;gap:7px;margin-bottom:8px;padding:0 2px}
.thd .n{font-family:Georgia,serif;font-size:12px;font-weight:700;color:var(--gold-600);flex:none}
.thd h2{font-size:15.5px;font-weight:800;letter-spacing:-.03em}
.thd .s{font-size:10px;color:var(--ink-400);font-weight:700;margin-left:auto;flex:none}
.tiers{display:flex;flex-direction:column;gap:6px}
.trw{position:relative;display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:8px;
  border:1px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;
  box-shadow:0 1px 2px rgba(8,23,43,.05)}
.trw .l{min-width:0}
.trw .nm{font-size:13.5px;font-weight:900;letter-spacing:-.025em;line-height:1.25;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.trw .bn{display:block;font-size:9.5px;font-weight:800;color:var(--teal-600);margin-top:2px;white-space:nowrap}
.trw .pay{text-align:right;flex:none}
.trw .pay .k{font-size:8.5px;font-weight:800;color:var(--ink-400)}
.trw .pay .v{font-size:12.5px;font-weight:800;letter-spacing:-.02em;color:var(--ink-700);margin-top:1px;white-space:nowrap}
.trw .ar{font-size:12px;color:var(--ink-400);font-weight:800}
.trw .use{text-align:right;flex:none;min-width:86px}
.trw .use .k{font-size:8.5px;font-weight:800;color:var(--ink-400)}
.trw .use .v{font-size:16px;font-weight:900;letter-spacing:-.04em;color:var(--navy-900);white-space:nowrap}
.trw .use .v small{font-size:10px;font-weight:800;color:var(--ink-400);margin-right:2px}
.trw.pop{border-color:var(--gold-300);background:linear-gradient(120deg,var(--gold-50),#fff 55%);
  box-shadow:0 1px 2px rgba(143,111,40,.1),0 8px 18px -12px rgba(143,111,40,.7)}
.trw.pop .use .v{color:var(--gold-700)}
.trw.top1{border-color:#c3cede;background:linear-gradient(120deg,#f4f7fb,#fff 55%)}
.trw.top1 .use .v{color:var(--navy-800)}
.trw .evb{display:block;font-size:9.5px;font-weight:900;color:#dc2626;margin-top:2px;white-space:nowrap}
.trw .use .v.old{font-size:10.5px;font-weight:800;color:var(--ink-400);text-decoration:line-through;
  text-decoration-thickness:1.5px}
.trw .use .v.old small{font-size:8.5px}
.trw .use .v.nw{color:#dc2626!important;margin-top:1px}
.trw .pb{position:absolute;top:-7px;left:11px;font-size:8px;font-weight:900;letter-spacing:.07em;
  background:linear-gradient(100deg,var(--gold-600),var(--gold-500));color:#fff;border-radius:999px;padding:2px 7px;
  box-shadow:0 3px 7px -2px rgba(143,111,40,.7)}
.tnote{font-size:10px;color:var(--ink-400);font-weight:700;text-align:center;margin-top:9px;
  padding:7px 10px;background:var(--paper);border-radius:9px;line-height:1.55;word-break:keep-all}

/* ── 공통 섹션 ── */
.sec{padding:22px 16px 0;scroll-margin-top:8px}
.sh{display:flex;align-items:baseline;gap:8px;margin-bottom:12px;padding:0 2px}
.sh .n{font-family:Georgia,serif;font-size:13px;font-weight:700;color:var(--gold-600);flex:none}
.sh h2{font-size:17px;font-weight:800;letter-spacing:-.03em}
.sh .s{font-size:10.5px;color:var(--ink-400);font-weight:700;margin-left:auto;flex:none}

/* ── 혜택 ── */
.bens{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ben{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px 12px 13px;
  box-shadow:0 1px 2px rgba(8,23,43,.04)}
.ben .ic{width:29px;height:29px;border-radius:9px;background:var(--teal-50);display:flex;align-items:center;
  justify-content:center;font-size:14px;margin-bottom:8px}
.ben b{display:block;font-size:12.5px;font-weight:800;letter-spacing:-.02em;line-height:1.4;word-break:keep-all}
.ben span{display:block;font-size:10.5px;color:var(--ink-600);font-weight:600;margin-top:4px;line-height:1.55;word-break:keep-all}

/* 등급별 상세 혜택 */
.tb{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}
.tbr{padding:11px 13px;border-top:1px solid var(--line)}
.tbr:first-child{border-top:none}
.tbr .h{display:flex;align-items:center;gap:7px}
.tbr .h b{font-size:12.5px;font-weight:900;letter-spacing:-.02em}
.tbr .h .a{margin-left:auto;font-size:11px;font-weight:900;color:var(--navy-800);white-space:nowrap}
.tbr ul{margin-top:6px}
.tbr li{list-style:none;font-size:10.5px;color:var(--ink-600);font-weight:600;line-height:1.65;
  padding-left:12px;position:relative;word-break:keep-all}
.tbr li:before{content:'·';position:absolute;left:3px;color:var(--gold-600);font-weight:900}
.tbr.g{background:linear-gradient(120deg,var(--gold-50),#fff 60%)}
.tbr.g .h .a{color:var(--gold-700)}

.gold-note{margin-top:9px;background:linear-gradient(150deg,var(--gold-50),#fff);border:1px solid var(--gold-100);
  border-radius:13px;padding:12px 14px}
.gold-note b{display:block;font-size:12px;font-weight:900;color:var(--gold-700);margin-bottom:6px}
.gold-note li{list-style:none;font-size:11px;color:var(--ink-700);font-weight:600;line-height:1.7;
  padding-left:13px;position:relative;word-break:keep-all}
.gold-note li:before{content:'✓';position:absolute;left:0;color:var(--gold-600);font-weight:900}

/* ── 이용 방법 ── */
.steps{display:flex;flex-direction:column}
.step{display:flex;gap:12px;padding:10px 0;position:relative}
.step:not(:last-child):after{content:'';position:absolute;left:14px;top:33px;bottom:-2px;width:1.5px;background:var(--line)}
.step .no{width:29px;height:29px;border-radius:50%;flex:none;background:var(--navy-900);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;position:relative;z-index:1}
.step b{display:block;font-size:13px;font-weight:800;letter-spacing:-.02em}
.step span{display:block;font-size:11.5px;color:var(--ink-600);font-weight:600;margin-top:3px;line-height:1.6;word-break:keep-all}

/* ── 안내문 ── */
.note{margin:20px 16px 0;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.note p{font-size:10.5px;color:var(--ink-600);font-weight:600;line-height:1.75;padding-left:12px;
  position:relative;word-break:keep-all}
.note p+p{margin-top:5px}
.note p:before{content:'※';position:absolute;left:0;color:var(--ink-400)}

/* ── 푸터 ── */
.ft{margin-top:20px;background:var(--navy-900);color:#fff;padding:20px 20px 22px;text-align:center}
.ft .t{font-size:15px;font-weight:800;letter-spacing:-.03em}
.ft .s{font-size:11.5px;color:#9fb2ca;font-weight:600;margin-top:6px;line-height:1.7;word-break:keep-all}
.ft .co{font-size:10px;color:#7d92ad;font-weight:600;margin-top:14px;padding-top:13px;
  border-top:1px solid rgba(255,255,255,.12);line-height:1.7}
.ft a{color:var(--gold-300);text-decoration:none;font-weight:800}

/* ── 하단 고정바 (4버튼) ── */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:520px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
  padding:9px 10px calc(9px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.94);backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-top:1px solid var(--line);box-shadow:0 -14px 32px -16px rgba(8,23,43,.4)}
.bar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  text-decoration:none;border-radius:12px;padding:8px 2px 9px;min-width:0;
  font-size:11px;font-weight:800;letter-spacing:-.03em;line-height:1.15;text-align:center;
  border:1.5px solid var(--line);background:#fff;color:var(--ink-700);transition:transform .14s}
.bar a .i{font-size:15px;line-height:1}
.bar a:active{transform:translateY(2px)}
.bar a.wa{border-color:var(--teal-600);color:var(--teal-700)}
.bar a.go{background:linear-gradient(140deg,var(--navy-800),var(--navy-950));color:#fff;border-color:transparent;
  box-shadow:0 7px 16px -7px rgba(15,37,64,.9)}

/* 세로가 짧은 화면 — 내용은 그대로 두고 여백만 줄여 등급 5개를 모두 보이게 합니다 */
@media (max-height:680px){
  .evt{margin:9px 14px 0;padding:10px 12px 12px}
  .evt .row2{font-size:15px;margin-top:5px}
  .hero{padding:11px 18px 12px}
  .brand{margin-bottom:8px}
  .hero h1{font-size:19.5px}
  .hero p{margin-top:5px;font-size:11px}
  .facts{margin-top:7px}
  .facts span{padding:3px 8px}
  .tsec{padding:9px 14px 4px}
  .trw{padding:7px 12px}
  .tiers{gap:5px}
}
@media (max-width:340px){
  .bar a{font-size:10px}
  .trw .use{min-width:76px}
  .bens{grid-template-columns:1fr}
}
@media print{
  .bar,.lgb{display:none!important}
  .pg{box-shadow:none;max-width:100%;padding-bottom:0}
  .trw,.ben,.gold-note,.tb{break-inside:avoid;page-break-inside:avoid;box-shadow:none}
}

/* HHC 로고 마크 — 자리의 글자색을 그대로 물려받는다 */
.hhc-mark{width:1.35em;height:1.35em;max-width:82%;max-height:82%;flex:none;display:block}


/* ══ 요금 안내장 전용 ══ */
.kick{font-size:9.5px;font-weight:800;letter-spacing:.2em;color:var(--gold-300);text-transform:uppercase;margin-bottom:6px}
.hero h1 .t2{display:block}
/* 품목 카테고리 카드 */
.cat{margin:0 14px;background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden;
  box-shadow:0 1px 2px rgba(8,23,43,.05),0 10px 22px -16px rgba(8,23,43,.35)}
.cat .hd{padding:14px 15px 12px;background:linear-gradient(160deg,#f7f9fc,#fff)}
.cat .en{font-size:9px;font-weight:800;letter-spacing:.16em;color:var(--gold-600);text-transform:uppercase}
.cat .ttl{font-size:16.5px;font-weight:900;letter-spacing:-.03em;margin-top:3px;line-height:1.3}
.cat .desc{font-size:11px;font-weight:600;color:var(--ink-600);margin-top:5px;line-height:1.6;word-break:keep-all}
.cat .std{margin-top:10px;display:flex;align-items:center;gap:10px;border-radius:11px;padding:9px 12px;
  background:linear-gradient(120deg,var(--navy-900),var(--navy-800));color:#fff}
.cat .std .k{font-size:8.5px;font-weight:800;letter-spacing:.14em;color:var(--gold-300)}
.cat .std .v{font-size:19px;font-weight:900;letter-spacing:-.04em;line-height:1;margin-top:2px}
.cat .std .u{margin-left:auto;font-size:10.5px;font-weight:700;color:#b9cae0;text-align:right;line-height:1.35;word-break:keep-all}
.cat .warn{margin-top:8px;font-size:10.5px;font-weight:700;color:#8a4b0f;background:#fff6e8;border:1px solid #f4dcb6;
  border-radius:9px;padding:7px 10px;line-height:1.55;word-break:keep-all}
.cat .warn:before{content:'\26A0  ';font-size:11px}
.row{display:flex;align-items:center;gap:10px;padding:11px 15px;border-top:1px solid var(--line)}
.row .l{flex:1;min-width:0}
.row .nm{font-size:13px;font-weight:800;letter-spacing:-.02em;line-height:1.35;word-break:keep-all}
.row .nm .tag{display:inline-block;vertical-align:1px;margin-left:5px;font-size:8.5px;font-weight:900;letter-spacing:.02em;
  color:#fff;background:var(--teal-600);border-radius:999px;padding:2px 6px}
.row .nm .tag.hot{background:var(--gold-600)}
.row .nm small{display:block;font-size:10px;font-weight:600;color:var(--ink-400);margin-top:1px}
.row .ds{font-size:10.5px;font-weight:600;color:var(--ink-600);margin-top:2px;line-height:1.5;word-break:keep-all}

<button type="button" class="hhcbk" id="hhcBackToCard"><i>&#8592;</i><span>명함으로</span></button>
<script>
(function(){
  try{
    var q = new URLSearchParams(location.search);
    var en = String(q.get('lang') || '').toLowerCase() === 'en';
    var fromCard = q.get('from') === 'card' || (document.referrer || '').indexOf('/namecard') > -1;
    if(!fromCard) return;

    var b = document.getElementById('hhcBackToCard');
    if(!b) return;
    b.querySelector('span').textContent = en ? 'Back to card' : '명함으로';
    b.setAttribute('aria-label', en ? 'Back to the digital name card' : '전자명함으로 돌아가기');
    b.classList.add('on');

    /* 화면 아래에 고정된 바(예약 제출 바 등)가 있으면 그만큼 위로 띄운다 */
    function lift(){
      var vh = window.innerHeight, max = 0;
      var els = document.querySelectorAll('body > *, body > * > *');
      for(var i = 0; i < els.length; i++){
        var el = els[i];
        if(el === b) continue;
        var cs = getComputedStyle(el);
        if(cs.position !== 'fixed' || cs.display === 'none' || cs.visibility === 'hidden') continue;
        var r = el.getBoundingClientRect();
        if(r.height > 0 && r.height < 170 && Math.abs(r.bottom - vh) < 6 && r.width > 120){
          if(r.height > max) max = r.height;
        }
      }
      b.style.bottom = 'calc(' + (14 + max) + 'px + env(safe-area-inset-bottom))';
    }
    lift();
    setTimeout(lift, 900);
    window.addEventListener('resize', lift);

    b.addEventListener('click', function(){
      if(history.length > 1){ history.back(); }
      else { location.href = '/namecard' + (en ? '?lang=en' : ''); }
    });
  }catch(e){}
})();
</script>
