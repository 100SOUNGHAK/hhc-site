  var MARK='<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg>';
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  /* 방문 예정일 : ?d=YYYY-MM-DD (&t=10:00 · 오전 등 자유 형식) */
  function dateOnly(){
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(D);if(!m)return '';
    var dt=new Date(+m[1],+m[2]-1,+m[3]),L=T[LANG],w=L.wd[dt.getDay()];
    return LANG==='en'?(w+', '+(+m[3])+' '+MON[+m[2]-1]+' '+m[1]):((+m[1])+'년 '+(+m[2])+'월 '+(+m[3])+'일 ('+w+')');
  }
  function ddTxt(){
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(D);if(!m)return '';
    var n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),k=Math.round((new Date(+m[1],+m[2]-1,+m[3])-t0)/86400000),L=T[LANG];
    if(k<0)return '';return k===0?L.dday[0]:(k===1?L.dday[1]:L.dday[2]+k);
  }
  function bkHTML(){
    if(!BK)return '';
    var L=T[LANG],dd=ddTxt(),dt=dateOnly();
    var CK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12.5l4 4L18 8" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return '<section class="wp-bk"><div class="hd"><span class="ck">'+CK+'</span><span class="tx"><b>'+esc(L.bkT)+'</b><span>'+esc(L.bkS)+'</span></span>'+(dd?'<span class="dd">'+esc(dd)+'</span>':'')+'</div>'+
      '<div class="bd">'+
        (NM?'<div class="r"><span class="k">👤 '+esc(L.bkNm)+'</span><span class="v">'+esc(NM)+'</span></div>':'')+
        (dt?'<div class="r"><span class="k">📅 '+esc(L.bkD)+'</span><span class="v">'+esc(dt)+(TM?'<em>'+esc(TM)+'</em>':'')+'</span></div>':'')+
        (IT?'<div class="r"><span class="k">🔧 '+esc(L.bkIt)+'</span><span class="v">'+IT.split(/\n/).filter(Boolean).map(function(x){return '<span class="it">'+esc(x.replace(/^[*•·\-]\s*/,''))+'</span>';}).join('')+'</span></div>':'')+
        '<div class="r"><span class="k">📌 '+esc(L.bkSt)+'</span><span class="v"><span class="ok">'+CK+esc(L.bkOk)+'</span></span></div>'+
      '</div></section>';
  }
  function whenTxt(){
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(D);if(!m)return '';
    var dt=new Date(+m[1],+m[2]-1,+m[3]),L=T[LANG],w=L.wd[dt.getDay()];
    var s=LANG==='en'?(w+', '+(+m[3])+' '+MON[+m[2]-1]+' '+m[1]):((+m[2])+'월 '+(+m[3])+'일 ('+w+')');
    return s+(TM?' · '+TM:'');
  }
  function regText(){
    var L=T[LANG],w=whenTxt();
    return L.txtH+'\n────────────────\n'+(w?L.txtW+': '+w+'\n':'')+
      '🏢 '+L.co+': '+VISIT.company+'\n'+
      '🚗 '+L.car+': '+VISIT.cars.join(', ')+'\n'+
      '👷 '+L.st+':\n'+VISIT.staff.map(function(s){return '  • '+s[0]+'  '+s[1];}).join('\n')+'\n────────────────';
  }
  function render(){
    var L=T[LANG],w=whenTxt();
    document.documentElement.lang=LANG;document.title=L.title;
    document.getElementById('wp').innerHTML=
      '<header class="wp-top"><span class="lg">'+MARK+'</span><span class="nm">Happy Home Care<small>HAPPY WORKS SERVICES SDN. BHD.</small></span>'+
        '<span class="wp-lang"><button type="button" data-lg="ko" class="'+(LANG==='ko'?'on':'')+'">한국어</button><button type="button" data-lg="en" class="'+(LANG==='en'?'on':'')+'">EN</button></span></header>'+
      bkHTML()+
      '<section class="wp-hero"><span class="lb"><i>WORK PERMIT</i>'+esc(L.lb)+'</span><h1>'+L.h1+'</h1><p>'+esc(L.p)+'</p>'+
        '<div class="wp-when"'+(w&&!BK?'':' hidden')+'><span class="ic">📅</span><span><small>'+esc(L.when)+'</small><b>'+esc(w)+'</b></span></div></section>'+
      '<section class="wp-card" id="reg"><div class="wp-ch"><span class="ic">📋</span><b>'+esc(L.cardT)+'</b><span>'+esc(L.cardS)+'</span></div>'+
        '<div class="wp-row"><span class="k">🏢 '+esc(L.co)+'</span><span class="v">'+esc(VISIT.company)+'</span><button type="button" class="wp-cp1" data-cp="co">'+esc(L.cp1)+'</button></div>'+
        '<div class="wp-row"><span class="k">🚗 '+esc(L.car)+'</span><span class="v">'+VISIT.cars.map(function(c){return '<span class="car">'+esc(c)+'</span>';}).join('')+'</span><button type="button" class="wp-cp1" data-cp="car">'+esc(L.cp1)+'</button></div>'+
        '<div class="wp-row col"><div class="hd"><span class="k">👷 '+esc(L.st)+' <small>'+VISIT.staff.length+esc(L.stN||'')+'</small></span><button type="button" class="wp-cp1" data-cp="st">'+esc(L.cp1)+'</button></div>'+
          '<ul class="wp-staff">'+VISIT.staff.map(function(s,i){return '<li><i>'+(i+1)+'</i><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></li>';}).join('')+'</ul></div>'+
        '<div class="wp-acts"><button type="button" class="cp" data-cp="all">'+esc(L.cpAll)+'</button>'+
          '<a class="wa" href="https://wa.me/?text='+encodeURIComponent(regText())+'" target="_blank" rel="noopener">'+esc(L.wa)+'</a>'+
          '<p class="hint">'+esc(L.hint)+'</p></div></section>'+
      '<div class="wp-sh">'+esc(L.howT)+'<i></i></div>'+
      '<div class="wp-steps">'+L.steps.map(function(s,i){return '<div class="wp-st"><span class="no">'+(i+1)+'</span><span><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></span></div>';}).join('')+'</div>'+
      '<div class="wp-nt">'+L.nt.map(function(n){return '<div><i>※</i><span>'+esc(n)+'</span></div>';}).join('')+'</div>'+
      '<div class="wp-bot"><a href="'+WA+'?text='+encodeURIComponent(LANG==='en'?'Hello, I have a question about the work permit registration.':'안녕하세요. 작업방문등록 관련 문의드립니다.')+'" target="_blank" rel="noopener">'+esc(L.ask)+'</a>'+
        '<a href="'+HOME+(LANG==='en'?'?lang=en':'')+'">'+esc(L.home)+'</a></div>'+
      '<footer class="wp-foot"><b>HAPPY WORKS SERVICES SDN. BHD. (1278908-M)</b>129 BJ Jayaone, 46200 Petaling Jaya, Selangor · +60 17-247 2774</footer>';
  }
  var tt=null;
  function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},2400);}
  function copy(txt){
    var L=T[LANG];
    function fb(){try{var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;left:-9999px;top:0';
      document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();toast(ok?L.copied:L.copyFail);}catch(e){toast(L.copyFail);}}
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){toast(L.copied);},fb);return;}}catch(e){}
    fb();
  }
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('[data-lg],[data-cp]');if(!b)return;
    if(b.hasAttribute('data-lg')){
      LANG=b.getAttribute('data-lg');
      try{var u=new URL(location.href);if(LANG==='en')u.searchParams.set('lang','en');else u.searchParams.delete('lang');history.replaceState(null,'',u.toString());}catch(err){}
      render();return;
    }
    var k=b.getAttribute('data-cp'),L=T[LANG];
    copy(k==='co'?VISIT.company:k==='car'?VISIT.cars.join(', '):k==='st'?VISIT.staff.map(function(s){return s[0]+'  '+s[1];}).join('\n'):regText());
  });
  render();
})();
</script>
</body>
</html>
