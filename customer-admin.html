<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script src="/hhc-ev.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HHC 총괄 고객관리</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1a2233;--ink2:#4b5563;--ink3:#8a94a6;--bdr:#e3e8f0;--pri:#2563eb;--pri-bg:#eff6ff;--ok:#059669;--ok-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fff7e6;--bad:#dc2626;--bad-bg:#fef2f2;--vio:#7c3aed;--vio-bg:#f5f3ff;--gold:#a16207;--gold-bg:#fef9c3}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding:16px 14px 80px}
.wrap{max-width:1080px;margin:0 auto}
.hdr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hdr h1{font-size:19px;font-weight:900}
.fb-dot{width:9px;height:9px;border-radius:50%;background:#d1d5db}
.fb-dot.on{background:#34d399}
.hdr .sp{flex:1}
.btn{border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:800;border-radius:10px;padding:10px 16px;background:#fff;border:1.5px solid var(--bdr);color:var(--ink2)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{font-size:11px;padding:6px 11px;border-radius:8px}
.search-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#q{flex:1;min-width:220px;border:1.5px solid var(--bdr);border-radius:10px;padding:10px 13px;font-size:13px;font-family:inherit;background:#fff}
#q:focus{outline:none;border-color:var(--pri)}
#sortby{border:1.5px solid var(--bdr);border-radius:10px;padding:10px 11px;font-size:12.5px;font-weight:700;font-family:inherit;background:#fff;color:var(--ink);cursor:pointer}
#sortby:focus{outline:none;border-color:var(--pri)}
.lk-warn{background:var(--warn-bg);border:1.5px solid #fbbf24;border-radius:10px;padding:10px 12px;font-size:12px;color:#92400e;line-height:1.65;margin:10px 0}
.lk-keep{display:flex;gap:9px;align-items:flex-start;background:var(--bg);border:1.5px solid var(--bdr);border-radius:10px;padding:11px 12px;margin-bottom:4px;cursor:pointer}
.lk-keep input{margin-top:2px;width:16px;height:16px;flex:none;accent-color:var(--pri)}
.lk-keep b{display:block;font-size:12.5px;color:var(--ink)}
.lk-keep span{display:block;font-size:11px;color:var(--ink3);line-height:1.5;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.st{background:#fff;border:1px solid var(--bdr);border-radius:10px;padding:8px 14px;font-size:11px;color:var(--ink2);font-weight:700}
.st b{display:block;font-size:17px;color:var(--ink);font-weight:900}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{cursor:pointer;font-size:11.5px;font-weight:800;border-radius:20px;padding:6px 13px;background:#fff;border:1.5px solid var(--bdr);color:var(--ink2);user-select:none}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.mergebar{background:var(--warn-bg);border:1.5px dashed #f0c36d;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--warn);font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.mergebar .mb{margin-left:auto;display:flex;gap:6px}
.crow{background:#fff;border:1.5px solid var(--bdr);border-radius:12px;padding:12px 14px;margin-bottom:9px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--pri-bg);color:var(--pri);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cnm{font-size:14.5px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.alias{font-size:11px;font-weight:700;color:var(--ink3)}
.cph{font-size:12px;color:var(--ink2);margin-top:2px}
.srcs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.src{font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px}
.src.ct{background:var(--pri-bg);color:var(--pri)}.src.iv{background:var(--ok-bg);color:var(--ok)}.src.ip{background:var(--warn-bg);color:var(--warn)}.src.cp{background:var(--vio-bg);color:var(--vio)}.src.bk{background:#e0f2fe;color:#0369a1}.src.rq{background:#fce7f3;color:#be185d}.src.qt{background:#f1f5f9;color:#475569}.src.sc{background:var(--gold-bg);color:var(--gold)}
.pill{font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.blue{background:var(--pri-bg);color:var(--pri)}.pill.vio{background:var(--vio-bg);color:var(--vio)}.pill.gold{background:var(--gold-bg);color:var(--gold)}.pill.jt{background:#EEF2FB;color:#1A2F5E}
.balc-jt{margin-top:8px;font-size:11.5px;line-height:1.55;color:#1A2F5E;background:#EEF2FB;border-radius:8px;padding:6px 9px}.balc-jt b{font-weight:800}
.cbtns{display:flex;flex-direction:column;gap:5px}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:40px 0}
/* 상세 드로어 */
#drawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:900;display:none}
#drawer-mask.open{display:block}
#drawer{position:fixed;top:0;right:-720px;width:min(700px,100vw);height:100vh;background:var(--bg);z-index:901;transition:right .25s;overflow-y:auto;padding:16px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
#drawer.open{right:0}
.dhead{display:flex;gap:13px;align-items:center;flex-wrap:wrap;background:#fff;border:1.5px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:12px}
.dhead .avatar{width:52px;height:52px;font-size:18px}
.dinfo b{font-size:17px;font-weight:900}
.tagrow{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.dbtns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.dcard{background:#fff;border:1.5px solid var(--bdr);border-radius:12px;overflow:hidden;margin-bottom:12px}
.dcard-h{padding:10px 13px;font-size:12.5px;font-weight:900;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:6px}
.dcard-h .cnt{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--bg);border-radius:10px;padding:2px 8px;color:var(--ink2)}
.drow{padding:9px 13px;border-bottom:1px solid #f1f4f9;font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drow:last-child{border-bottom:none}
/* 상품권 · 견적서 · 기타 기록 — 종류·내용·상태가 한눈에 (2026-11-16) */
.cxr{display:grid;grid-template-columns:40px 1fr auto;gap:2px 11px;padding:11px 13px;border-bottom:1px solid #f1f4f9;align-items:start}
.cxr:last-child{border-bottom:none}
.cxr.dim{background:#FAFBFD}.cxr.dim .cxt,.cxr.dim .cxv{color:#8a94a6}.cxr.dim .cxi{filter:grayscale(.85);opacity:.7}
.cxr.hid{display:none}
.cxi{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;grid-row:span 3}
.k-gift{background:linear-gradient(150deg,#FFF4D6,#FBE3A3)}.k-disc{background:linear-gradient(150deg,#F3EEFF,#E2D6FF)}
.k-qt{background:linear-gradient(150deg,#EAF2FF,#D3E3FF)}.k-rq{background:linear-gradient(150deg,#E4F7F4,#C8EDE6)}
.k-bk{background:linear-gradient(150deg,#ECEEFF,#D9DDFB)}.k-sc{background:linear-gradient(150deg,#F1F3F7,#E2E6EE)}
.cxk{font-size:10px;font-weight:800;display:flex;gap:5px;align-items:center;flex-wrap:wrap;grid-column:2}
.cxk .t{border-radius:4px;padding:1px 6px}
.t-gift{background:#FEF3C7;color:#92600A}.t-disc{background:#EDE4FF;color:#6B3FB8}.t-qt{background:#DBEAFE;color:#1D4ED8}
.t-rq{background:#D5F2EC;color:#0B6B5E}.t-bk{background:#E0E4FF;color:#3D52A0}.t-sc{background:#E9EDF3;color:#4B5563}
.cxk .no{color:var(--ink3);font-weight:700;font-family:ui-monospace,Menlo,monospace;font-size:10px}
.cxt{font-size:14px;font-weight:900;color:#0F1C3F;line-height:1.35;grid-column:2;word-break:break-word}
.cxs{font-size:11.5px;color:var(--ink2);line-height:1.5;grid-column:2;word-break:break-word}
.cxs .ar{color:var(--ink3);margin:0 3px}.cxs b{color:var(--ink)}
.cxs .cd{display:inline-block;background:#F6F7FA;border-radius:5px;padding:0 6px;color:var(--ink3);font-size:10.5px;margin-top:3px}
.cxrt{grid-column:3;grid-row:1/span 3;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.cxv{font-size:15px;font-weight:900;color:#0F1C3F;font-variant-numeric:tabular-nums;white-space:nowrap}
.cxst{font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 9px;white-space:nowrap}
.s-ok{background:#ECFDF5;color:#047857}.s-soon{background:#FFF7ED;color:#C2410C}.s-off{background:#F1F5F9;color:#64748B}.s-new{background:#FEF2F2;color:#B91C1C}
.s-blue{background:#EFF6FF;color:#1D4ED8}.s-vio{background:#F5F3FF;color:#6D28D9}
.cxd{font-size:10.5px;color:var(--ink3);white-space:nowrap}
.cxa{grid-column:2/4;display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;align-items:center}
.cxa .open-btn{margin-left:0}
.cxa .open-btn.cx-resch{background:#0FB5A4;color:#fff}   /* 🗓️ 예약 일정 수정 (2026-11-23) */
.cx-sum{display:flex;gap:6px;padding:10px 13px;border-bottom:1px solid #f1f4f9;flex-wrap:wrap}
.cx-sum span{font-size:11px;font-weight:800;border-radius:8px;padding:4px 9px;background:#F6F8FC;color:var(--ink2)}.cx-sum span b{color:#0F1C3F}
.cx-tab{display:flex;gap:5px;padding:9px 12px;border-bottom:1px solid var(--bdr);background:#fff;flex-wrap:wrap}
.cx-tab button{border:1.5px solid var(--bdr);background:#fff;border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:800;color:var(--ink2);cursor:pointer;font-family:inherit}
.cx-tab button b{font-weight:900;margin-left:3px;color:var(--ink3)}
.cx-tab button.on{background:#0F1C3F;border-color:#0F1C3F;color:#fff}.cx-tab button.on b{color:#C9A24B}
.drow .id{font-weight:800}
.drow .m{color:var(--ink3);font-size:11px}
.drow.unpub{background:#FFFBEB}
.pill.unp{background:#FEF3C7;color:#92400E;border:1px solid #FCD34D}
.rb.pub{background:#047857;color:#fff;font-size:11px;padding:4px 11px;border-radius:7px;box-shadow:0 2px 0 #065F46}
.rb.pub:active{transform:translateY(1px);box-shadow:none}
.drow .iv-it{flex-basis:100%;font-size:12.5px;font-weight:800;color:#0F1C3F;line-height:1.4;margin:-2px 0 -1px}
.open-btn{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--pri);background:var(--pri-bg);border-radius:6px;padding:3px 9px;white-space:nowrap;text-decoration:none}
.dnone{padding:14px;font-size:12px;color:var(--ink3);text-align:center}
.rb{border:none;cursor:pointer;font-family:inherit;font-size:10.5px;font-weight:800;border-radius:6px;padding:3px 8px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.rb.del{background:var(--bad-bg);color:var(--bad)}
.rb.hd{background:var(--pri-bg);color:var(--pri);font-size:10.5px;padding:4px 10px;border-radius:7px}
.lk-row{border:1.5px solid var(--bdr);border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lk-row:hover{border-color:var(--pri);background:var(--pri-bg)}
.lk-row.mine{opacity:.5;cursor:default}
.lk-row .own{margin-left:auto;font-size:10px;color:var(--ink3);font-weight:700}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mini .mc{background:#fff;border:1px solid var(--bdr);border-radius:10px;padding:9px;text-align:center;font-size:10.5px;color:var(--ink3);font-weight:700}
.mini .mc b{display:block;font-size:15px;color:var(--ink);font-weight:900}
/* 문서 뷰어 오버레이 */
#dv-wrap{position:fixed;inset:0;z-index:1200;background:#fff;display:none;flex-direction:column}
#dv-wrap.open{display:flex}
#dv-bar{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:9px 12px;background:linear-gradient(120deg,#0B1833,#16264a);box-shadow:0 2px 10px rgba(11,24,51,.18)}
#dv-bar button,#dv-bar a{font-family:inherit;font-size:12px;font-weight:800;border-radius:8px;padding:6px 12px;cursor:pointer;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:#fff;text-decoration:none;white-space:nowrap}
#dv-bar #dv-back{background:#fff;color:#0B1833;border-color:#fff}
#dv-ttl{flex:1;min-width:0;font-size:12.5px;font-weight:800;color:#dbe4fb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dv-body{flex:1;min-height:0;position:relative}
#dv-body iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:block;background:#fff}
@media(max-width:560px){#dv-new{display:none}#dv-bar #dv-x{padding:6px 10px}}
/* 모달 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:950;display:none;align-items:center;justify-content:center;padding:16px}
.mask.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:440px;width:100%;box-shadow:0 18px 60px rgba(0,0,0,.3);overflow:hidden;max-height:92vh;overflow-y:auto}
.modal-h{padding:13px 16px;font-size:14px;font-weight:900;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:7px}
.modal-h .x{margin-left:auto;cursor:pointer;border:none;background:none;font-size:16px;color:var(--ink3)}
.modal-b{padding:14px 16px}
.fl{font-size:11px;font-weight:800;color:var(--ink2);margin:10px 0 4px}
.fi{width:100%;border:1.5px solid var(--bdr);border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;background:#fff}
.fi:focus{outline:none;border-color:var(--pri)}
select.fi{appearance:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end}
.cmp{display:grid;grid-template-columns:1fr 22px 1fr;gap:6px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;text-align:center}
.cmp small{display:block;font-size:10px;color:var(--ink3);font-weight:700;margin-bottom:2px}
.cmp b{font-size:12.5px}
.prop-row{border:1px solid #f1f4f9;border-radius:8px;margin-bottom:5px;padding:8px 12px;font-size:12px;display:flex;gap:8px;align-items:center}
.prop-row .m{color:var(--ink3);margin-left:auto}
.pc-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--bdr);border-radius:11px;padding:11px 13px;margin-bottom:8px;cursor:pointer;background:#fff;font-family:inherit}
.pc-opt:hover{border-color:var(--pri);background:var(--pri-bg)}
.pc-opt b{display:block;font-size:13px;color:var(--ink)}
.pc-opt span{display:block;font-size:11px;color:var(--ink3);line-height:1.5;margin-top:2px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;font-size:12.5px;font-weight:700;border-radius:10px;padding:10px 18px;z-index:9999;display:none}
.loading{text-align:center;color:var(--ink3);font-size:13px;padding:50px 0}
@media(max-width:600px){.crow{grid-template-columns:38px 1fr}.cbtns{grid-column:1/-1;flex-direction:row}.mini{grid-template-columns:repeat(2,1fr)}}
/* ═══ 💎 포인트 ═══ */
/* 포인트 적립금 — 패키지 잔액 카드와 같은 남색 계열, 숫자만 금색으로 살립니다
   (보라 그라데이션은 어느 화면에서나 흔한 모양이라 브랜드 색으로 바꿨습니다) */
.ptcard{border-radius:16px;overflow:hidden;margin-bottom:12px;color:#fff;
  background:linear-gradient(135deg,#12203A 0%,#1E3358 55%,#2A4470 100%);
  box-shadow:0 2px 6px rgba(6,18,45,.3),0 14px 30px -12px rgba(6,18,45,.7)}
.ptcard .pt-top{display:flex;align-items:center;gap:9px;padding:14px 16px 4px}
.ptcard .pt-t{font-size:12.5px;font-weight:900;letter-spacing:.4px;opacity:.92}
.ptcard .pt-rule{font-size:10px;font-weight:900;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 9px}
.ptcard .pt-adj-btn{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;font-weight:900;font-size:12px;padding:8px 12px;cursor:pointer;font-family:inherit}
.ptcard .pt-adj-btn:hover{background:rgba(255,255,255,.24)}
.ptcard .pt-use-btn{margin-left:6px;background:linear-gradient(140deg,#E3C98A,#C9A44C);color:#3A2A00;border:none;border-radius:10px;font-weight:900;font-size:12px;padding:8px 14px;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px -4px rgba(201,164,76,.8)}
.ptcard .pt-use-btn:disabled{opacity:.5;cursor:not-allowed}
.ptcard .pt-bal{padding:2px 16px 12px}
.ptcard .pt-bal .k{font-size:10.5px;font-weight:800;opacity:.75;letter-spacing:.5px}
.ptcard .pt-bal .v{font-size:29px;font-weight:900;letter-spacing:-.035em;line-height:1.15;color:#F0DDAE;font-variant-numeric:tabular-nums}
.ptcard .pt-bal .v small{font-size:15px;opacity:.85}
.ptcard .pt-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:rgba(255,255,255,.14)}
.ptcard .pt-c{background:rgba(255,255,255,.09);padding:9px 12px;text-align:center}
.ptcard .pt-c .k{font-size:10px;font-weight:800;opacity:.78}
.ptcard .pt-c .v{font-size:13px;font-weight:900;margin-top:2px}
.pt-hist .ph{display:flex;align-items:center;gap:8px;padding:8px 13px;border-top:1px solid var(--bdr);font-size:12px}
.pt-hist .ph:first-of-type{border-top:none}
.pt-hist .ph .sign{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;flex-shrink:0}
.pt-hist .ph.earn .sign{background:#ECFDF5;color:#047857}
.pt-hist .ph.use .sign{background:#FEF2F2;color:#DC2626}
.pt-hist .ph b{font-weight:800;white-space:nowrap}
.pt-hist .ph .m{color:var(--ink2);font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-hist .ph .amt{margin-left:auto;font-weight:900;flex-shrink:0}
.pt-hist .ph.earn .amt{color:#047857}
.pt-hist .ph.use .amt{color:#DC2626}
.pill.pt{background:#F5F3FF;color:#6D28D9}
.pill.c3{background:#ECFDF5;color:#047857;border:1px solid #A7F3D0}
.pill.c6{background:#FFF7ED;color:#C2410C;border:1px solid #FDBA74}
.pill.cdone{background:#F1F5F9;color:#64748B;border:1px solid #E2E8F0}
/* 💳 미수금 표시 — 청구중 / 연체중 */
.pill.bl{background:#FFFBEB;color:#92600A;border:1px solid #FCD34D}
.pill.od{background:#FEF2F2;color:#B91C1C;border:1px solid #FCA5A5}
.pill.od b,.pill.bl b{font-weight:800;font-variant-numeric:tabular-nums}
.ptcard .pt-cfg{font-size:10px;font-weight:900;background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:3px 9px;cursor:pointer;font-family:inherit}
.ptcard .pt-cfg:hover{background:rgba(255,255,255,.22)}
.pt-hx{width:100%;background:none;border:none;cursor:pointer;font-family:inherit;text-align:left}
.pt-hx .tg{margin-left:8px;font-size:11px;font-weight:900;color:#0E2350;flex-shrink:0}
.pt-ls{display:none}
.pt-ls.open{display:block}

/* ══════════════════════════════════════════════════════════
   2026-08 디자인 개편 — 기능·데이터 로직은 변경 없음, 표시만 개선
   ══════════════════════════════════════════════════════════ */
body{background:#eef1f6}
.wrap{max-width:1150px}

/* ── 좌측 고정 메뉴 (독립 실행 시에만 — 관리자 허브 iframe 안에서는 자동 숨김) ── */
#sb{display:none}
html.sa #sb{display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;width:206px;z-index:40;
  background:linear-gradient(175deg,#0B1833 0%,#122448 100%);padding:16px 12px;overflow-y:auto}
html.sa body{padding-left:222px}
#sb .bd{color:#fff;font-weight:900;font-size:14px;letter-spacing:.02em;padding:6px 10px 2px}
#sb .bs{color:#8FA3C8;font-size:9.5px;font-weight:800;letter-spacing:.14em;padding:0 10px 14px;
  border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
#sb a,#sb .cur{display:flex;align-items:center;gap:9px;color:#B9C7E2;font-size:12.5px;font-weight:800;
  text-decoration:none;padding:9px 11px;border-radius:9px;margin-bottom:2px}
#sb a:hover{background:rgba(255,255,255,.07);color:#fff}
#sb .cur{background:var(--pri);color:#fff}
#sb .ic{width:18px;text-align:center;font-size:13px}
#sb .sb-g{display:block;font-size:9px;font-weight:900;letter-spacing:.14em;color:#6E82AC;
  padding:11px 11px 4px;margin-top:2px}
@media(max-width:1099px){html.sa #sb{display:none}html.sa body{padding-left:14px}}

/* ── 상단 헤더 ── */
.hdr{background:linear-gradient(120deg,#0B1833,#1b2f58);border-radius:14px;padding:14px 18px;
  box-shadow:0 6px 18px rgba(11,24,51,.15)}
.hdr .ht{display:flex;flex-direction:column;gap:2px}
.hdr h1{color:#fff}
.hdr .hs{font-size:11px;color:#9FB2D6;font-weight:700}
.hdr .btn{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.26);color:#fff}
.hdr .btn.p{background:var(--pri);border-color:var(--pri)}

/* ── 색상별 요약 카드 ── */
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.st{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--bdr);
  border-radius:12px;padding:10px 12px;transition:.14s}
.st.ck{cursor:pointer}
.st.ck:hover{border-color:#bfd3f5;box-shadow:0 3px 10px rgba(37,99,235,.09)}
.st.on{border-color:var(--pri);box-shadow:0 0 0 2.5px var(--pri-bg)}
.st .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:15px;flex:none}
.st .tx{min-width:0}
.st .tx b{display:block;font-size:16.5px;font-weight:900;color:var(--ink);line-height:1.15}
.st .tx span{font-size:10.5px;font-weight:800;color:var(--ink3);white-space:nowrap}
.st.blue .ic{background:var(--pri-bg)}.st.green .ic{background:var(--ok-bg)}.st.gold .ic{background:var(--gold-bg)}
.st.vio .ic{background:var(--vio-bg)}.st.red .ic{background:var(--bad-bg)}.st.gray .ic{background:#f1f5f9}
.st.care3 .ic{background:#ECFDF5}.st.care6 .ic{background:#FFF7ED}
.st.care3.on{border-color:#059669;box-shadow:0 0 0 2.5px #D1FAE5}
.st.care6.on{border-color:#EA580C;box-shadow:0 0 0 2.5px #FFEDD5}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:540px){
  .stats{grid-template-columns:repeat(3,1fr);gap:6px}
  .st{gap:6px;padding:8px 7px;border-radius:10px;border-width:1.2px}
  .st .ic{width:26px;height:26px;border-radius:8px;font-size:12.5px}
  .st .tx b{font-size:14.5px;line-height:1.1}
  .st .tx span{font-size:9.5px;white-space:normal;word-break:keep-all;line-height:1.2}
}
@media(max-width:370px){
  .stats{gap:5px}
  .st{gap:5px;padding:7px 5px}
  .st .ic{width:23px;height:23px;border-radius:7px;font-size:11.5px}
  .st .tx b{font-size:13.5px}
  .st .tx span{font-size:9px}
}

/* ── 검색 · 필터 · 정렬 통합 패널 ── */
.panel{background:#fff;border:1.5px solid var(--bdr);border-radius:13px;padding:11px 12px;margin-bottom:12px}
.panel .search-row{margin-bottom:0}
.panel #q{background:var(--bg);border-color:transparent}
.panel #q:focus{background:#fff;border-color:var(--pri)}
.panel .chips{margin-bottom:2px}

/* ── 간결한 목록형 행 ── */
.crow{grid-template-columns:38px minmax(190px,1.15fr) 1fr auto;padding:9px 12px;margin-bottom:7px;
  border-radius:11px;gap:11px;transition:.14s}
.crow:hover{border-color:#bfd3f5;box-shadow:0 3px 12px rgba(37,99,235,.09)}
.crow.inact{opacity:.62;background:#f8fafc}
.crow.inact .avatar{filter:grayscale(1)}
.crow .avatar{width:38px;height:38px;font-size:13.5px}
.crow .cnm{font-size:13.5px}
.crow .cph{margin-top:3px}
.csrcs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center;min-width:0}
.cact{display:flex;gap:6px;align-items:center}
.btn.dtl{white-space:nowrap;padding:8px 17px;border-radius:9px;font-size:12px;box-shadow:0 2px 8px rgba(37,99,235,.25)}
.btn.mor{padding:8px 11px;border-radius:9px;font-size:14px;line-height:1;color:var(--ink3)}
.pill.mut{background:#f1f5f9;color:#64748b}
.pill.locy{background:#ECFDF5;color:#047857;border:1px solid #A7F3D0}.pill.locn{background:#fff;color:#94A3B8;border:1px dashed #CBD5E1}
/* 🔔 고객 앱 알림 — 목록 배지 · 상세 한 줄 · 기기 현황 · 이력 (2026-11-19) */
.pill.pny{background:#EEF2FF;color:#0E2350;border:1px solid #C7D2FE}
.pill.pnx{background:#FEF2F2;color:#B91C1C;border:1px solid #FECACA}
.hdr .btn.pnl-hb{position:relative;font-size:15px}.hdr .btn.pnl-hb .rft{font-size:13px}
.dpn{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;margin-top:8px;padding:9px 11px;border-radius:11px;background:#F5F7FC;border:1px solid #E3E8F2;font-size:12px}
.dpn-t{font-weight:700;color:var(--ink2)}.dpn-t b{color:#0E2350}.dpn-t .off{color:var(--ink3)}
.dpn-l{display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px;color:var(--ink3);font-weight:700;font-size:11px}
.dpn button{margin-left:auto;border:1px solid #C9D3E6;background:#fff;color:#0E2350;font-weight:800;font-size:11.5px;border-radius:8px;padding:5px 10px;cursor:pointer}
#ca-pn-mask{z-index:1200}
.modal.pnm{max-width:520px}
.pnm-msg{background:#0E2350;color:#fff;border-radius:12px;padding:11px 13px;font-size:12.5px;line-height:1.55;margin-bottom:6px}
.pnm-msg .k{font-size:10.5px;font-weight:800;color:#E3C98A;letter-spacing:.04em;margin-bottom:3px}
.pnm-msg b{display:block;font-size:13px}
.pnm-go{display:flex;gap:8px;margin:8px 0 2px}.pnm-go .btn{padding:11px 14px;font-size:13.5px}.pnm-go .btn.p{flex:1}
.pnm-h{font-size:12.5px;font-weight:900;color:#0E2350;margin:14px 0 4px}
.pnm-h.sub{color:var(--warn)}.pnm-h small{display:block;font-size:10.5px;font-weight:600;color:var(--ink3);margin-top:2px}
.pnm-emp{font-size:12px;color:var(--ink3);line-height:1.65;padding:10px 4px;text-align:center}
.pnm-nt{font-size:10.5px;color:var(--ink3);line-height:1.6;margin-top:12px;padding-top:10px;border-top:1px dashed var(--bdr)}
.pnd{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid #EEF1F6}
.pnd:first-of-type{border-top:0}.pnd.adm{opacity:.75}
.pnd-ic{width:34px;height:34px;border-radius:10px;background:#EEF2FF;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.pnd.adm .pnd-ic{background:#FFF7E6}
.pnd-m{flex:1;min-width:0}
.pnd-n{font-size:13px;font-weight:800;color:var(--ink);display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.pnd-how{font-size:10.5px;font-weight:800;color:#0BB5A4;background:#E6F8F5;border-radius:5px;padding:1px 6px}
.pnd-s{font-size:11px;color:var(--ink3);font-weight:600;margin-top:3px;line-height:1.7}
.pnd-s .pill{font-size:10px;padding:1px 6px}
.pnd-x{border:1px solid #F1D1D1;background:#fff;border-radius:9px;width:34px;height:34px;cursor:pointer;flex-shrink:0;font-size:14px}
.pno{padding:10px 11px;border:1px solid #E7EBF3;border-radius:11px;margin-top:7px;background:#fff}
.pno.bad{border-color:#FECACA;background:#FFFBFB}
.pno-c{font-size:13px;font-weight:900;margin-bottom:2px}.pno-c a{color:#0E2350;text-decoration:none}
.pno-h{display:flex;gap:8px;align-items:center;font-size:11px;font-weight:800;color:var(--ink3)}
.pno-v{color:#8F6F28}
.pno-b{font-size:12px;color:var(--ink2);line-height:1.5;margin-top:4px;word-break:keep-all}.pno-b b{color:var(--ink)}
.pno-r{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin-top:7px}
.pno-r .pill{font-size:10.5px;padding:2px 7px;border-radius:999px}
.pno-r button{border:1px solid #C9D3E6;background:#fff;color:#0E2350;font-weight:800;font-size:11px;border-radius:8px;padding:4px 9px;cursor:pointer}
.pno-r button:first-of-type{margin-left:auto}
.pnl-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.pnl-sum div{background:#F5F7FC;border-radius:11px;padding:9px 4px;text-align:center}
.pnl-sum b{display:block;font-size:18px;color:#0E2350;font-weight:900}
.pnl-sum span{font-size:10.5px;color:var(--ink3);font-weight:700}
.pnl-sum .bad{background:#FEF2F2}.pnl-sum .bad b{color:#B91C1C}
.pnl-f{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.pnl-f button{border:1px solid #D6DDEA;background:#fff;color:var(--ink2);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:800;cursor:pointer}
.pnl-f button.on{background:#0E2350;border-color:#0E2350;color:#fff}
/* 📞 연락 경로 표시 (W=WhatsApp · K=카카오톡 · O=기타) — 관리 화면 전용 · 표시만 하는 배지 */
.chb{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;margin-left:6px;
     border-radius:6px;border:1.5px solid transparent;font-size:10.5px;font-weight:900;line-height:1;
     cursor:pointer;vertical-align:middle;padding:0;font-family:inherit;letter-spacing:0;flex-shrink:0}
.chb.w{background:#22c55e;border-color:#22c55e;color:#fff}
.chb.k{background:#FEE500;border-color:#F5DC00;color:#3C1E1E}
.chb.o{background:#64748b;border-color:#64748b;color:#fff}
.chb.n{background:#fff;border-color:#cbd5e1;border-style:dashed;color:#cbd5e1;font-size:11px}
.chb.n:hover{border-color:var(--pri);color:var(--pri)}
.cnm .chb{margin-left:0}
.alias.lk{color:#5B21B6}
.src.dt{background:#f3f4f6;color:#6b7280}
@media(max-width:760px){
  .crow{grid-template-columns:38px 1fr auto}
  .crow .avatar{grid-row:1}
  .cmain{grid-column:2;grid-row:1}
  .cact{grid-column:3;grid-row:1}
  .csrcs{grid-column:1/-1;justify-content:flex-start}
}

/* ── 행 더보기(⋮) 메뉴 ── */
#rowmenu{position:fixed;z-index:1000;background:#fff;border:1.5px solid var(--bdr);border-radius:12px;
  box-shadow:0 14px 44px rgba(15,23,42,.2);padding:6px;min-width:188px}
#rowmenu a,#rowmenu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:none;
  background:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:800;color:var(--ink);
  padding:9px 11px;border-radius:8px;text-decoration:none}
#rowmenu a:hover,#rowmenu button:hover{background:var(--bg)}
#rowmenu .sep{height:1px;background:var(--bdr);margin:5px 4px}
#rowmenu .dgr{color:var(--bad)}
#rowmenu .dgr:hover{background:var(--bad-bg)}
#rowmenu i{font-style:normal;width:17px;text-align:center}

/* ── 상세 드로어 개선 ── */
.dhead{background:linear-gradient(120deg,#0B1833,#1b2f58);border-color:#0B1833;color:#fff}
.dhead .dinfo b{color:#fff}
.dhead .cph{color:#B9C7E2}
.dhead .avatar{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(201,164,76,.5)}
.dbg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;width:100%;background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 9px}
.dbg-t{font-size:9.5px;font-weight:800;color:#8FA3C8;letter-spacing:.08em;flex:0 0 auto;width:52px}
/* 섹션 카드 — 겹친 그림자로 깊이를 만들고, 헤더는 눌러서 접고 펼칩니다 */
.dcard{box-shadow:0 1px 2px rgba(14,35,80,.05),0 6px 16px -8px rgba(14,35,80,.16)}
.dcard-h{background:#F7F9FD;padding:12px 14px;font-size:13.5px;letter-spacing:-.01em}
.dcard-h .chv{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
  border-radius:7px;background:#E7EDF7;color:#41506B;font-size:10px;flex:none;transition:background .14s}
.dcard-h:hover .chv{background:#D7E1F1}
.dcard-h .cnt{font-size:11px;background:#fff;border:1px solid var(--bdr);color:var(--ink2);padding:3px 9px;
  font-variant-numeric:tabular-nums}
.dcard-h .rb.hd{background:#fff;border:1px solid var(--bdr);color:var(--ink2);font-weight:800}
.dcard-h .rb.hd:hover{border-color:#0E2350;color:#0E2350}
.drow{padding:11px 14px;gap:9px;font-size:12.5px}
.drow:hover{background:#FBFCFE}
.drow .id{font-weight:900;color:var(--ink);letter-spacing:-.01em}
.drow .m{font-size:11.5px;color:var(--ink2);font-weight:700}
.dnone{padding:18px 14px;font-weight:700}

/* ── 페이지 이동 ── */
.pager{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--bdr);
  border-radius:11px;padding:9px 13px;margin-top:4px;flex-wrap:wrap}
.pager .pcnt{font-size:12px;font-weight:700;color:var(--ink2)}
.pager .psp{flex:1}
.pager .psz{border:1.5px solid var(--bdr);border-radius:8px;padding:6px 9px;font-size:11.5px;font-weight:800;
  font-family:inherit;background:#fff;cursor:pointer}
.pbtn{border:1.5px solid var(--bdr);background:#fff;border-radius:8px;padding:6px 12px;font-size:11.5px;
  font-weight:800;font-family:inherit;cursor:pointer;color:var(--ink2)}
.pbtn:disabled{opacity:.4;cursor:default}

/* ══ 📦 패키지 잔액 현황 카드 (상세보기) ══ */
.balc{border-radius:16px;overflow:hidden;margin-bottom:12px;color:#fff;
  background:linear-gradient(135deg,#0B1833 0%,#173463 55%,#22508F 100%);
  box-shadow:0 10px 26px rgba(11,24,51,.28)}
.balc-hd{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.balc-hd .ic{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.26);display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.balc-hd .t{font-size:13.5px;font-weight:900;letter-spacing:-.01em}
.balc-hd .s{font-size:9px;font-weight:800;letter-spacing:.14em;opacity:.6;margin-top:1px}
.balc-n{margin-left:auto;font-size:10px;font-weight:900;background:rgba(255,255,255,.15);
  border:1px solid rgba(255,255,255,.26);border-radius:999px;padding:4px 10px;white-space:nowrap}
.balc-sum{padding:6px 16px 13px}
.balc-sum .k{font-size:10px;font-weight:800;opacity:.72;letter-spacing:.03em}
.balc-sum .v{font-size:27px;font-weight:900;letter-spacing:-.03em;line-height:1.15;margin-top:2px}
.balc-bar{height:7px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:10px}
.balc-bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#3BCB90,#8EE9C4);transition:width .5s}
.balc-bar.sm{height:5px;margin-top:7px}
.balc-bl{display:flex;justify-content:space-between;font-size:10px;font-weight:800;opacity:.85;margin-top:5px}
.balc-list{background:rgba(255,255,255,.07);border-top:1px solid rgba(255,255,255,.12)}
.balc-r{padding:11px 16px;border-top:1px solid rgba(255,255,255,.09)}
.balc-r:first-child{border-top:none}
.balc-r.off{opacity:.55}
.balc-r1{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.balc-r1 b{font-size:12.5px;font-weight:900}
.balc-r1 .pill{font-size:9.5px}
.balc-rv{margin-left:auto;font-size:14.5px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.balc-r2{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:10px;font-weight:700;opacity:.8;margin-top:6px}
.balc-sum .k .balc-pk{font-size:12px;font-weight:900;opacity:1;margin-left:6px;letter-spacing:-.01em}
.balc-sum .k .pill{opacity:1;margin-left:5px;vertical-align:1px}
.balc-r2.solo{margin-top:11px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14)}
.balc-lb{font-size:9.5px;font-weight:900;letter-spacing:.06em;opacity:.62;padding:9px 16px 0}
.balc-go{margin-left:auto;font-size:10px;font-weight:900;color:#0B1833;background:rgba(255,255,255,.94);
  border-radius:7px;padding:4px 10px;text-decoration:none;white-space:nowrap;opacity:1}
.balc-go:hover{background:#fff}

/* ══════════════════════════════════════════════════════════
   상세보기(드로어) — 한눈에 보고 바로 조작하기
   · 색은 남색(주) · 회색(중립) · 금색(강조) 세 갈래만 씁니다.
   · 강조(금색)는 「고객 발송」 버튼 하나뿐입니다. 나머지는 조용하게.
   · 간격은 8의 배수(8 · 12 · 16)로 맞춥니다.
   ══════════════════════════════════════════════════════════ */
/* 헤더 오른쪽 위 닫기 */
.dcls{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.20);color:#DCE6F7;
  font-family:inherit;font-size:14px;font-weight:900;line-height:1;transition:background .14s}
.dcls:hover{background:rgba(255,255,255,.22);color:#fff}
/* 주 동작 3개 */
.dbtns{width:100%;margin-left:0;display:block}
.dact{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.dab{display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font-family:inherit;
  font-size:13.5px;font-weight:900;letter-spacing:-.01em;border-radius:12px;padding:12px 8px;
  color:#fff;background:rgba(255,255,255,.10);border:1.5px solid rgba(255,255,255,.24);
  transition:background .14s,transform .14s}
.dab span{font-size:14px;line-height:1}
.dab:hover{background:rgba(255,255,255,.20)}
.dab:active{transform:translateY(2px)}
.dab.prim{background:linear-gradient(140deg,#E3C98A,#C9A44C 60%,#B08D3A);border-color:transparent;color:#3A2A00;
  box-shadow:0 3px 8px rgba(90,64,0,.28),0 10px 22px -8px rgba(201,164,76,.75)}
.dab.prim:hover{background:linear-gradient(140deg,#EBD69F,#D0AC58 60%,#B99741)}
/* 보조 동작 — 만들기 · 관리 */

<script>

window.caQrCard=function(o){
  o=o||{};
  var name=String(o.name||'').trim(), url=String(o.url||''), en=!!o.en;
  var W=760,H=1080,S=(o.scale||2);
  var cv=document.createElement('canvas');
  cv.width=W*S; cv.height=H*S;
  var x=cv.getContext('2d'); x.scale(S,S);
  var NAVY='#0F2540',NAVY2='#08172B',GOLD='#C9A44C',INK='#12203A',GRAY='#6B7688';
  var F="'Pretendard Variable',Pretendard,-apple-system,'Malgun Gothic','Apple SD Gothic Neo',sans-serif";
  function rr(cx,y,w,h,r){x.beginPath();x.moveTo(cx+r,y);x.arcTo(cx+w,y,cx+w,y+h,r);x.arcTo(cx+w,y+h,cx,y+h,r);x.arcTo(cx,y+h,cx,y,r);x.arcTo(cx,y,cx+w,y,r);x.closePath();}
  function ls(v){try{x.letterSpacing=v;}catch(e){}}

  x.fillStyle='#fff'; x.fillRect(0,0,W,H);

  x.fillStyle=GOLD; x.font="700 36px Georgia,'Times New Roman',serif";
  x.textAlign='center'; x.textBaseline='middle'; x.fillText('H',81,78);

  x.textAlign='left'; x.textBaseline='alphabetic';
  x.fillStyle='#fff'; x.font='800 30px '+F; ls('-.4px');
  x.fillText('Happy HomeCare',132,74);
  ls('2.6px'); x.fillStyle='rgba(255,255,255,.55)'; x.font='700 12px '+F;
  x.fillText('BY HAPPY WORKS SERVICES',133,96);

  ls('3.4px'); x.fillStyle=GOLD; x.font='800 14px '+F;
  x.fillText(en?'CUSTOMER MY PAGE':'MY PAGE · 고객 전용 페이지',50,160); ls('0px');

  /* ── 고객명 ── */
  x.textAlign='center';
  x.fillStyle=GRAY; x.font='700 17px '+F;
  x.fillText(en?'This QR belongs to':'아래 고객님 전용 QR 코드입니다',W/2,262);

  var nm=en?name:(name+' 고객님');
  var fs=46; x.font='900 '+fs+'px '+F;
  while(x.measureText(nm).width>W-110&&fs>24){fs-=2;x.font='900 '+fs+'px '+F;}
  ls('-1px'); x.fillStyle=INK; x.fillText(nm,W/2,320); ls('0px');

  rr(W/2-92,344,184,3,2); x.fillStyle=GOLD; x.fill();

  /* ── QR ── */
  var FR=396, FX=(W-FR)/2, FY=386;
  rr(FX,FY,FR,FR,26); x.fillStyle='#fff'; x.fill();
  x.strokeStyle='#E3E8F0'; x.lineWidth=2; x.stroke();
  rr(FX+6,FY+6,FR-12,FR-12,21); x.strokeStyle='rgba(15,37,64,.10)'; x.lineWidth=1; x.stroke();

  var q=qrcode(0,'H'); q.addData(url); q.make();
  var n=q.getModuleCount(), QS=FR-72, cell=QS/n, QX=FX+36, QY=FY+36;
  x.fillStyle='#0B1B31';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++){
    if(q.isDark(r,c)) x.fillRect(Math.floor(QX+c*cell),Math.floor(QY+r*cell),Math.ceil(cell),Math.ceil(cell));
  }
  /* 중앙 로고 */
  var LS=64, LX=QX+QS/2-LS/2, LY=QY+QS/2-LS/2;
  rr(LX-7,LY-7,LS+14,LS+14,17); x.fillStyle='#fff'; x.fill();
  rr(LX,LY,LS,LS,13); x.fillStyle=NAVY; x.fill();
  x.fillStyle=GOLD; x.font="700 34px Georgia,serif"; x.textBaseline='middle';
  x.fillText('H',LX+LS/2,LY+LS/2+1); x.textBaseline='alphabetic';

  /* ── 안내 ── */
  x.fillStyle=INK; x.font='800 22px '+F;
  x.fillText(en?'Scan with your phone camera':'휴대폰 카메라로 스캔해 주세요',W/2,846);
  x.fillStyle=GRAY; x.font='600 16px '+F;
  x.fillText(en?'Your invoices, reports, points and booking — all in one page.'
               :'인보이스 · 점검보고서 · 적립포인트 · 예약을 한 번에 확인하실 수 있습니다.',W/2,878);

  /* ── 하단 ── */
  rr(0,H-128,W,128,0); x.fillStyle='#F6F4EF'; x.fill();
  x.fillStyle='#E3DFD4'; x.fillRect(0,H-128,W,1.5);
  x.fillStyle=INK; x.font='800 19px '+F;
  x.fillText('+60 17-247 2774   ·   KakaoTalk  2472774',W/2,H-76);
  ls('1.4px'); x.fillStyle=GRAY; x.font='700 12px '+F;
  x.fillText('HAPPY WORKS SERVICES SDN. BHD.   201801016892 (1278908-M)',W/2,H-44); ls('0px');
  return cv;
};

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, getDocs, onSnapshot, query, where, orderBy, limit, initializeFirestore, persistentLocalCache, persistentMultipleTabManager } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
// ⚡ 빠른 열기 : 데이터베이스 내용을 이 기기 안에 저장해 둡니다(IndexedDB).
//    다음부터는 저장된 내용으로 화면을 먼저 그리고, 서버에서는 바뀐 부분만 받아 옵니다.
//    (관리자 앱의 여러 화면이 같은 저장소를 함께 쓰므로 multi-tab 모드 · 저장소를 못 쓰는 환경에서는 예전 방식으로 동작)
function hhcFastDb(app){
  try{return initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager(),cacheSizeBytes:150*1024*1024}),experimentalAutoDetectLongPolling:true});}
  catch(e){return getFirestore(app);}
}

// ── 🔗 발송 주소 단축 ────────────────────────────────────────────
// 메시지에 들어가는 긴 happyhomecare 주소를 짧은 주소(/r?k=키)로 바꿉니다.
// 인보이스·계약서에서 이미 쓰던 단축 저장소(shorts · r.html)를 그대로 씁니다.
//  · 같은 주소는 항상 같은 키를 재사용합니다 (저장소에서 먼저 찾음)
//  · 새 키는 4자리로 만들고, 이미 쓰는 키와 겹치면 자릿수를 늘려 다시 만듭니다
//  · 단축에 실패하면 원래 주소를 그대로 보냅니다 (발송이 막히는 일은 없음)
const HHC_SHORT_BASE='https://happyhomecare.com.my/r?k=';
const _hhcShortCache={};
async function hhcShortUrl(url){
  url=String(url||'');
  if(_hhcShortCache[url])return _hhcShortCache[url];
  if(url.length<=40)return url;                                   // 이미 짧은 주소
  if(!/^https:\/\/(www\.)?happyhomecare\.com\.my\//.test(url))return url;
  if(/\/r(\.html)?\?k=/.test(url))return url;                     // 이미 단축된 주소
  try{
    const col=collection(db,'shorts');
    const ex=await getDocs(query(col,where('url','==',url)));
    let key='';
    if(!ex.empty){key=ex.docs[0].data().key;}
    else{
      for(let n=4;n<=8&&!key;n++){
        const k=Math.random().toString(36).slice(2,2+n);
        if(k.length<n)continue;
        const dup=await getDocs(query(col,where('key','==',k)));
        if(dup.empty){await addDoc(col,{key:k,url:url,created:new Date().toISOString()});key=k;}
      }
      if(!key)return url;
    }
    // ⚡ 만든 짧은 주소를 미리 한 번 열어 둡니다 — 왓츠앱 미리보기가 빨리 떠서 큰 그림으로 붙습니다 (2026-11-21)
    {const _s=HHC_SHORT_BASE+key;try{fetch(_s,{mode:'no-cors',credentials:'omit'}).catch(()=>{});}catch(_){}return (_hhcShortCache[url]=_s);}
  }catch(e){return url;}
}
// 이미 단축해 둔 주소만 즉시 치환 (미리보기용 · 통신 없음)
function hhcShortSync(text){
  text=String(text==null?'':text);
  for(const k in _hhcShortCache)text=text.split(k).join(_hhcShortCache[k]);
  return text;
}
// 문구 전체에서 긴 주소를 찾아 모두 짧은 주소로 (실패한 주소는 원문 유지)
async function hhcShortLinks(text){
  text=String(text==null?'':text);
  const found=text.match(/https:\/\/(?:www\.)?happyhomecare\.com\.my\/[^\s'"<>)\]]+/g)||[];
  const uniq=found.filter((u,i)=>found.indexOf(u)===i);
  for(const u of uniq){
    const s=await hhcShortUrl(u);
    if(s!==u)text=text.split(u).join(s);
  }
  return text;
}
// 다른 스크립트 블록(window.* 핸들러)에서도 쓸 수 있게 공개
try{window.hhcShortUrl=hhcShortUrl;window.hhcShortLinks=hhcShortLinks;}catch(_e){}



const BASE='https://happyhomecare.com.my';

// ═══════════════ 카카오톡 공유 (Kakao Share SDK) ═══════════════

];

let _kkLoad=null;
async function kkKey(force){
  if(KAKAO_KEY&&!force)return KAKAO_KEY;
  if(!KAKAO_KEY&&db){
    try{
      const d=await getDoc(doc(db,'settings','kakao'));
      const v=d&&d.exists&&d.exists()?(d.data()||{}).jsKey:'';
      if(v){KAKAO_KEY=v;try{localStorage.setItem('hhc_kakao_key',v);}catch(_){}}
    }catch(_){}
  }
  if(KAKAO_KEY&&!force)return KAKAO_KEY;
  const v=prompt('카카오 JavaScript 키를 입력하세요.\n\ndevelopers.kakao.com → 내 애플리케이션 → 앱 키 → JavaScript 키\n(처음 한 번만 입력하면 계속 사용됩니다)',KAKAO_KEY||'');

}
// 🪟 카카오 공유를 실행할 창 : 관리자 허브 안(iframe)이면 최상위 창을 씁니다.

  }catch(_){}
  return window;
}
function kkLoad(){

  W.__hhcKkLoad=new Promise((res,rej)=>{

      W.document.head.appendChild(sc);

  });

}
// 카카오 「텍스트형」 카드 본문
//  · 피드형 카드는 제목 2줄 + 설명 2줄(합쳐 4줄)까지만 보여 주고 나머지를 잘라내는
//    카카오 고정 사양이라, 안내문이 늘 앞부분만 보였습니다.
//  · 텍스트형 템플릿은 최대 200자를 그대로 모두 표시하므로 이쪽을 사용합니다.
//  · 링크 줄은 아래 「마이페이지 열기」 버튼이 대신하므로 본문에서 걷어내
//    한 글자라도 더 안내 내용이 들어가게 합니다.
// ═══ 본문 간략화 (왓츠앱 · 카카오톡 공용) ═══════════════════
// 발송 문구에서 「🏠 마이페이지 소개」 같은 긴 설명 구간과 구분선을 걷어내
// 실제 안내 내용만 남깁니다.
//  · dropLink=true  (카카오톡) : 주소 줄과 그 짝인 제목 줄까지 지웁니다.
//                                → 카드의 「마이페이지 열기」 버튼이 대신합니다.
//  · dropLink=false (왓츠앱)   : 주소는 눌러서 열 수 있어야 하므로 그대로 남깁니다.
function msgSlim(m,dropLink){
  let t=String(m||'');
  if(dropLink){
    t=t.replace(/^.*https?:\/\/\S+.*$/gm,'')      // 링크가 들어간 줄 통째로 제거
       .replace(/^\s*📱\s*(MY ?PAGE|My Page|마이페이지)\s*$/gim,'')   // 주소 줄과 짝인 제목 줄
       .replace(/^\s*👑\s*(MEMBERSHIP|멤버십 안내장)\s*$/gim,'')      // 안내장 주소 줄과 짝인 제목 줄
       .replace(/^\s*🔁\s*(TRANSFER · E-VOUCHER|양도 · 상품권 전환 안내)\s*$/gim,'')   // 양도 · 전환 안내장 제목 줄 (2026-11-23)
       .replace(/^\s*🪪\s*(WORK PERMIT GUIDE|Work permit guide|작업방문등록 안내장)\s*$/gim,'')   // 작업방문등록 안내장 제목 줄
       .replace(/^\s*🎁\s*(GIFT ?VOUCHER|전자상품권 안내)\s*$/gim,'')   // 전자상품권 안내장 제목 줄
       .replace(/^\s*💎\s*(REWARD ?POINTS|적립포인트 안내)\s*$/gim,'')  // 적립포인트 안내장 제목 줄
       .replace(/^\s*📝\s*(SERVICE REQUEST FORM|의뢰 요청서 작성)\s*$/gim,''); // 요청서 주소 줄과 짝인 제목 줄
  }
  t=t.replace(/^\s*[-=─━_·]{3,}\s*$/gm,'')        // 구분선 줄 제거
     .replace(/[ \t]+$/gm,'')
     .trim();
  // 「🏠 마이페이지 소개」 구간은 안내 내용이 아니라 설명이라 걷어냅니다.
  // (단 '* 신청 품목' 처럼 별표로 시작하는 실제 정보 줄은 남깁니다)
  const L=t.split('\n');
  const i=L.findIndex(x=>/^🏠/.test(x.trim()));
  if(i>=0){
    let j=i;
    for(let k=i;k<L.length;k++){
      const ln=L[k].trim();
      if(k>i&&/^(감사|Thank|Happy Home Care|📞|고객님의 소중한)/.test(ln)){j=k-1;break;}
      // 📱 MY PAGE 줄 : 카카오는 함께 지우고, 왓츠앱은 주소 안내로 남깁니다
      if(/^📱/.test(ln)){j=dropLink?k:(k-1);break;}
      j=k;
    }
    if(j>=i){
      const keep=L.slice(i,j+1).filter(x=>/^[*•]/.test(x.trim()));
      L.splice(i,j-i+1);
      keep.reverse().forEach(x=>L.splice(i,0,x));
    }
    t=L.join('\n');
  }
  return t.replace(/\n{3,}/g,'\n\n').trim();
}
// ── 🔗 발송 직전 링크 점검 : 옛 주소가 섞여 있으면 정식 주소로 바꿉니다 ──
//    (예전에 저장해 둔 링크가 문구에 그대로 들어오는 경우를 막습니다)
function hhcFixLinks(t){
  return String(t==null?'':t)
    .replace(/https?:\/\/(?:www\.)?hhc-3p8\.pages\.dev/gi,'https://happyhomecare.com.my')
    .replace(/https?:\/\/www\.happyhomecare\.com\.my/gi,'https://happyhomecare.com.my')
    .replace(/https?:\/\/(?:www\.)?happyhomecare\.my/gi,'https://happyhomecare.com.my');
}
// 💬 왓츠앱 본문 — 카카오톡과 같은 간략한 내용 + 주소 (길이 제한 없음)
function waText(m){return hhcFixLinks(msgSlim(m,false));}
// 품목 여러 줄(「… × 4대」)을 「첫 품목 외 N건」 한 줄로 — 카카오 200자 대응
function kkItemsShort(t){
  const Ls=String(t||'').split('\n'),isIt=x=>/\s×\s*(\d+\s*(대|units?)|-)\s*$/.test(x.trim());
  const ix=[];Ls.forEach((x,i)=>{if(isIt(x))ix.push(i);});
  if(ix.length<2)return String(t||'');
  const en=/\bunits?\s*$/.test(Ls[ix[0]].trim()),n=ix.length-1;
  Ls[ix[0]]=Ls[ix[0]].replace(/\s+$/,'')+(en?(' + '+n+' more'):(' 외 '+n+'건'));
  for(let k=ix.length-1;k>=1;k--)Ls.splice(ix[k],1);
  return Ls.join('\n');
}
// 💛 카카오톡은 왓츠앱 굵은 글씨(*…*)를 지원하지 않으므로 별표를 뗍니다
function kkPlain(t){return String(t==null?'':t).replace(/\*([^*\n]+)\*/g,'$1');}
function kkText(m,feed){
  let t=kkPlain(hhcFixLinks(msgSlim(m,true)));
  if(feed){
    // 🖼 사진 카드 : 카카오는 「제목 + 설명」을 합쳐 4줄까지만 보여줍니다.
    //    카드에 사진과 버튼이 이미 있으므로 주소 안내줄·회사 서명은 빼고,
    //    안내 문구 4줄을 그대로 살립니다. (글자 수 제한은 없습니다)
    t=t.split('\n').filter(x=>!(
        /^\s*[\u{1F300}-\u{1FAFF}\u2600-\u27BF]?\s*(전자명함|MY ?PAGE|DIGITAL NAME CARD|MEMBERSHIP|멤버십 안내장|GIFT VOUCHER|전자상품권 안내|REWARD POINTS|적립포인트 안내|WORK PERMIT GUIDE|작업방문등록 안내장|TRANSFER · E-VOUCHER|양도 · 상품권 전환 안내)\s*$/iu.test(x) ||
        /📞\s*\+?\s*60[\s-]*17[\s-]*247[\s-]*2774/.test(x) ||
        /^\s*Happy Home Care\s*$/i.test(x)
      )).join('\n');
    return t.split('\n').filter(x=>x.trim()).slice(0,4).join('\n');
  }
  const MAX=195;                                  // 카카오 제한 200자 — 여유
  const len=x=>Array.from(x).length;
  // ⓪ 품목이 여러 줄(「… × 4대」)이라 넘치면 「첫 품목 외 N건」 한 줄로 줄입니다. (왓츠앱은 전체 목록)
  if(len(t)>MAX)t=kkItemsShort(t);
  // 200자를 넘을 때 빼는 순서 (안내 내용을 최대한 살립니다)
  //  ① 맨 끝 회사명·연락처 서명(Happy Home Care 📞 +60 17-247 2774) — 가장 먼저 뗍니다.
  //     카카오 카드에는 「마이페이지 열기」 버튼이 있고, 마이페이지에도 같은 연락처가 있습니다.
  //  ② MY PAGE 설치 안내 줄   ③ 인사말   ④ MY PAGE 안내 줄   ⑤ [3개월 주기] 꼬리표   ⑥ 본문 끝을 줄임
  if(len(t)>MAX){
    t=t.split('\n').filter(x=>!(
        /📞\s*\+?\s*60[\s-]*17[\s-]*247[\s-]*2774/.test(x) ||   // 연락처 줄
        /^\s*Happy Home Care\s*$/i.test(x)                        // 회사명 단독 줄
      )).join('\n').replace(/\n{3,}/g,'\n\n').trim();
  }
  if(len(t)>MAX){
    t=t.split('\n').filter(x=>!/MY ?PAGE ?설치하시면|Once you install MY ?PAGE/i.test(x))
       .join('\n').replace(/\n{3,}/g,'\n\n').trim();
  }
  // ③ 그래도 넘치면 인사말 줄을 뺍니다 (정보량이 가장 적은 줄)
  if(len(t)>MAX){
    t=t.split('\n').filter(x=>!/^\s*(안녕하세요|Hello)\s*[,\s]/.test(x))
       .join('\n').replace(/\n{3,}/g,'\n\n').trim();
  }
  // ④ 「[결제 계좌 정보 및 상세 내역]은 · 아래 MY PAGE 에서 확인」 안내 줄을 뺍니다.
  //    카카오 카드에는 「마이페이지 열기」 버튼이 붙어 있어 같은 내용을 이미 전달합니다.
  //    (영문은 같은 뜻이라도 글자 수가 길어 이 단계가 없으면 문장 끝이 잘립니다)
  if(len(t)>MAX){
    t=t.split('\n').filter(x=>!(
        /\[\s*전용\s*MY ?PAGE\s*\]/i.test(x) ||                     // 아래 고객님 [전용 MY PAGE] 에서…
        /personal\s*\[\s*MY ?PAGE\s*\]/i.test(x) ||                  // are available on your personal [MY PAGE]…
        /^\s*\[[^\]]*(계좌|내역|breakdown|details|information)[^\]]*\]\s*(은|는)?\s*$/i.test(x)
      )).join('\n').replace(/\n{3,}/g,'\n\n').trim();
  }
  // ⑤ 정기관리 안내의 「[3개월 주기]」 같은 꼬리표를 뗍니다.
  //    머리글에 이미 「· 3개월」이 있어 뜻은 그대로 남습니다.
  if(len(t)>MAX){
    t=t.replace(/\s*\[\s*\d+\s*(개월\s*주기|months?)\s*\]/gi,'')
       .replace(/[ \t]+$/gm,'').replace(/\n{3,}/g,'\n\n').trim();
  }
  if(len(t)>MAX)t=Array.from(t).slice(0,MAX-1).join('').replace(/\s+\S*$/,'')+'…';
  return t;
}
async function kkSend(title,desc,url,en,btn,img,btn2){

    //    카카오 카드에 버튼을 하나 더 붙입니다 — 카카오는 버튼 2개까지 지원합니다. 할 일 버튼을 앞에 둡니다.

      //    제목을 따로 지정하지 않으면 안내 문구의 첫 줄이 제목(굵은 글씨)이 되고
      //    나머지 줄이 그 아래 본문으로 들어갑니다 (합쳐서 4줄까지 보입니다).
      // 카카오 카드는 「제목 + 본문」을 합쳐 4줄까지만 보여주고 나머지는 「…」으로 자른다.
      // img.t/img.d 로 카드 전용 짧은 문구를 직접 넘기면 잘리지 않는다.

// 발송 버튼 공통 처리 (전체 메시지를 먼저 클립보드에 복사 + 안내 표시 → 그 다음 카카오톡 공유창 열기)
// 순서가 중요합니다: 공유창을 먼저 열면 화면이 곧바로 카카오톡 앱으로 전환되어
// 안내 문구가 뜰 틈도 없이 화면이 넘어가 버립니다. 그래서 안내부터 띄운 뒤 공유를 시작합니다.
// 💛 카카오 카드 두 번째 버튼 — 본문의 「이름 👉 주소」 줄 가운데 마이페이지(카드 기본 버튼)가 아닌 주소를 찾습니다.

function kkExtraBtn(message,url,en){
  const main=[url,_hhcShortCache[url]].filter(Boolean);
  const L=String(message||'').split('\n');
  for(const ln of L){
    const m=/^(.*?)\s*\u{1F449}\s*(https?:\/\/\S+)\s*$/u.exec(ln.trim());
    if(!m||main.indexOf(m[2])>=0)continue;
    const lb=m[1];

          :/비용|fee/i.test(lb)?(en?'Check my fee':'우리 집 비용 확인')
          :Array.from(lb.replace(/[^\p{L}\p{N}\s·()]/gu,'').trim()).slice(0,14).join('');

}
// 📨 메시지 관리실 미리보기용 — 카카오 공유창에 실제로 들어갈 카드 모양을 계산만 합니다 (발송 · 복사 없음, 2026-11-25)

//    → 시작일 이전 발행분은 애초에 적립 대상이 아니므로 과거 적립금은 영향받지 않는다.
function ptExclFrom(){return String(PT_START||'');}
let REF_RAW={};   // 🤝 추천 보상 설정 (settings/points 의 ref_* — refCfg() 로 읽음)

let PT_START='';   // 📅 적립 적용시작일 (YYYY-MM-DD · 빈값=전체 기간) — settings/points 에 저장, 발행일 기준
// 적립 기준액 : 총 청구금액에서 세금·주차비용·최소청구·추가비용 제외
//             실비 항목(자재비용·설치자재비용·에어컨구매비용)과 회원제상품 가입금액도 제외
//             = 품목 소계(품목별 할인 반영) − 전체 할인 − 상품/할인권
// 패키지 회원(회원적립잔액 사용 포함)은 회원적립잔액(creditUse) 차감 「전」 금액 기준
function ptBase(x,pkg){
  // 🧰 실비 항목 제외 규칙은 「적립 적용시작일」 이후 발행분에만 적용 (과거 인보이스 적립금 보존)
  const _pf=ptExclFrom();
  const _newRule = !_pf || String(x.date||'') >= _pf;
  let sub=0;(x.items||[]).forEach(it=>{
    const _c=String(it.cat||''),_s=String(it.subcat||''),_n=String(it.name||'');
    // 📦 package plan(회원제상품 · 가정용/매장용) 가입금액은 적립 대상에서 제외
    if(/^회원제상품/.test(_c)||/^회원제상품/.test(_s)||/package\s*plan/i.test(_n))return;
    // 🧰 자재비용 · 설치자재비용 · 에어컨구매(구입)비용
    if(_newRule){
      if(/자재/.test(_c)||/자재/.test(_s)||/(구매|구입)\s*비용/.test(_c)||/(구매|구입)\s*비용/.test(_s))return;
      if(/자재비/.test(_n)||/에어컨\s*(구매|구입)/.test(_n)||/material/i.test(_n))return;
    }
    const amt=(parseFloat(it.price)||0)*(parseFloat(it.qty)||1);
    const d=it.discType==='pct'?amt*((parseFloat(it.discVal)||0)/100):(parseFloat(it.discVal!=null?it.discVal:it.disc)||0);
    sub+=amt-d;
  });
  const dv=parseFloat(x.discVal)||0;

  const voucher=parseFloat(x.voucherAmt)||0;
  const ptsUse=parseFloat(x.pointUse)||0;   // 💎 해피포인트로 결제한 금액은 적립 제외
  // ✏️ 요금조정 「직접입력 조정」 중 차감(−)한 금액도 할인으로 보고 적립 기준액에서 뺀다 (추가(+)는 추가비용처럼 제외)
  const adjDisc=(x.adjusts||[]).reduce((a,j)=>a+(((parseFloat(j&&j.sign)||1)<0)?Math.abs(parseFloat(j&&j.amt)||0):0),0);
  let b=sub-disc-voucher-ptsUse-adjDisc;
  if(!(pkg||credit>0))b-=credit;   // 패키지(또는 적립잔액 사용) 건은 차감 전 금액
  return Math.max(0,b);
}
function ptEarn(base){return Math.floor((parseFloat(base)||0)/100);}   // RM100 → RM1
// 고객별 포인트 집계 : 「결제완료」 인보이스에서 적립 · 고객 마스터 pt_used 에서 사용 차감
function ptCalc(e){
  const pkg=isPkg(e);
  const ovr=(e.master&&e.master.pt_ovr)||{};   // ✏️ 인보이스별 적립액 수동 수정값
  const earnRows=e.docs.invoices.filter(x=>x.status==='paid'&&!(PT_START&&String(x.date||'')<PT_START)).map(x=>{
    const b=ptBase(x,pkg);
    const auto=ptEarn(b);
    const ov=ovr[x.__id];
    const manual=(ov!=null&&ov!=='');
    return {date:x.date||'',id:x.id||x.__id,did:x.__id,base:b,auto:auto,ovr:manual,pts:manual?Math.max(0,Math.floor(parseFloat(ov)||0)):auto};
  }).filter(r=>r.pts>0||r.ovr).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const useRows=((e.master&&e.master.pt_used)||[]).map((u,i)=>({i,date:u.date||'',memo:u.memo||'',pts:Math.floor(parseFloat(u.amount)||0)}))
    .filter(r=>r.pts>0).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  // 인보이스 「요금조정 > 💎 해피포인트 사용」 칸으로 차감된 사용액 (작성중 인보이스 제외)
  const invUseRows=e.docs.invoices.filter(x=>x.status!=='draft'&&(parseFloat(x.pointUse)||0)>0)
    .map(x=>({date:x.date||'',memo:'인보이스 '+(x.id||x.__id)+' 결제 차감',pts:Math.floor(parseFloat(x.pointUse)||0)}))
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  // ✏️ 적립 조정 (수동 +/−)
  const adjRows=((e.master&&e.master.pt_adj)||[]).map((u,i)=>({i,date:u.date||'',memo:u.memo||'',pts:Math.round(parseFloat(u.amount)||0)}))
    .filter(r=>r.pts!==0).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const adjPlus=adjRows.filter(r=>r.pts>0).reduce((a,r)=>a+r.pts,0);
  const adjMinus=adjRows.filter(r=>r.pts<0).reduce((a,r)=>a-r.pts,0);
  const earn=earnRows.reduce((a,r)=>a+r.pts,0)+adjPlus;
  const used=useRows.reduce((a,r)=>a+r.pts,0)+invUseRows.reduce((a,r)=>a+r.pts,0)+adjMinus;
  return {earn,used,bal:earn-used,earnRows,useRows,invUseRows,adjRows,pkg};
}

function newEntry(name,phone){

    docs:{contracts:[],invoices:[],inspections:[],coupons:[],requests:[],bookings:[],schedules:[],quotes:[],memos:[]}};
}
// ── 고객 1명을 가리키는 고정 키 ──
// 마스터(고객마스터에 등록된 고객)는 문서 ID를, 아니면 이름+연락처 조합을 씁니다.
// 문서에 이 키(ca_link)가 저장돼 있으면 고객명·연락처가 달라도 그 고객에게 붙습니다.
function entryKey(e){
  if(e&&e.master&&e.master.__id)return 'm:'+e.master.__id;
  return 'k:'+nn(e&&e.name)+'#'+pn(e&&e.phone);
}
// ── 문서 「중복 연결」 ──────────────────────────────────
//  · ca_link  (기존·1명)   = 이 문서의 소속 고객 자체를 바꾸는 「이관 연결」
//  · ca_links (신규·여러명) = 원래 고객은 그대로 두고 추가로 함께 보여줄 고객들
function docExtraKeys(x){const a=(x&&x.ca_links);return Array.isArray(a)?a.filter(Boolean):[];}
// 🔓 자동 연결 해제 : 이름·연락처가 같아도 이 고객에게는 붙이지 않도록 지정한 목록
//    (문서 내용은 전혀 바뀌지 않고 ca_off 표시만 붙습니다)
function docOffKeys(x){const a=(x&&x.ca_off);return Array.isArray(a)?a.filter(Boolean):[];}
function entryKeys(e){
  if(!e)return [];
  const a=[entryKey(e),'k:'+nn(e.name)+'#'+pn(e.phone)];
  return a.filter(function(v,i){return v&&a.indexOf(v)===i;});
}
function docOffFor(x,e){
  const ks=docOffKeys(x); if(!ks.length||!e)return false;
  return entryKeys(e).some(function(k){return ks.indexOf(k)>=0;});
}
function docLinkedTo(x,key){return !!key&&((x&&x.ca_link===key)||docExtraKeys(x).indexOf(key)>=0);}
function buildEntries(){
  entries=[];const byP={},byN={};
  const pending=[];   // ca_link(수동 연결)가 지정된 문서 — 모든 고객이 만들어진 뒤에 붙입니다
  const idxName=(e,s)=>{const k=nn(s);if(k&&!byN[k])byN[k]=e;};
  RAW.customers.forEach(m=>{
    const e=newEntry(m.name,m.phone);
    e.master=m;e.aliases=m.aliases||[];e.member=m.member||'';e.email=m.email||'';e.addr=m.addr||'';e.memo=m.memo||'';
    e.loc=(m.loc&&isFinite(m.loc.lat)&&isFinite(m.loc.lng))?m.loc:null;   // 📍 방문 위치 (customers.loc)
    e.inactive=!!m.ca_inactive;   // ⏸ 비활성 고객 (기본 목록에서 숨김)
    e.ch=CH_OK(m.ca_ch);          // 📞 연락 경로 표시 (W · K · O · 없음)
    e.careLog=Array.isArray(m.care_log)?m.care_log.slice():[];   // 🌿 정기관리 안내 발송 이력
    // 👑 회원 구분을 「정보 수정」에서 직접 지정했는지 여부
    //    지정했다면 계약서·인보이스에 적힌 옛 등급이 이 값을 덮어쓰지 않습니다.
    //    (이 표시가 없으면 예전처럼 문서에서 등급을 끌어와 보여 줍니다)
    e.memberFixed=!!m.ca_member_set;
    entries.push(e);
    const k=pn(m.phone);if(k&&!byP[k])byP[k]=e;
    idxName(e,m.name);(m.aliases||[]).forEach(a=>idxName(e,a));
  });
  function attach(coll,x,name,phone){
    // 수동 연결된 문서는 뒤로 미룹니다 (반환값은 임시 객체 — 목록에 넣지 않습니다)
    if(x.ca_link){pending.push({coll,x,name,phone});return newEntry(name,phone);}
    const pk=pn(phone),nk=nn(name);
    let e=(pk&&byP[pk])||(nk&&byN[nk])||null;
    // 🔓 이 고객에서 자동연결을 해제한 문서 → 붙이지 않고 별도 항목으로 떼어 둡니다
    if(e&&docOffFor(x,e)){
      const d=newEntry(name,phone); d.detached=true; entries.push(d);
      d.docs[coll].push(x); return d;
    }
    if(!e){
      e=newEntry(name,phone);entries.push(e);
      if(pk)byP[pk]=e;if(nk&&!byN[nk])byN[nk]=e;
    }else{
      if(!pn(e.phone)&&pn(phone).length>=6)e.phone=phone;   // 문서의 번호는 완전한 번호(숫자 6자리 이상)일 때만 물려받습니다
      if(name&&nn(e.name)!==nk&&!e.aliases.some(a=>nn(a)===nk)&&!(e.master&&(e.master.aliases||[]).some(a=>nn(a)===nk)))
        if(nk&&nn(e.name)!==nk)e.aliases=e.aliases.concat([name]);
    }
    e.docs[coll].push(x);
    return e;
  }
  RAW.contracts.forEach(x=>{const e=attach('contracts',x,x.name,x.phone);if(!e.member&&!e.memberFixed&&x.package_id)e.member='패키지 - '+pkgLabel(x.package_id);});
  RAW.invoices.forEach(x=>{const c=x.customer||{};const e=attach('invoices',x,c.name,c.phone);if(!e.member&&!e.memberFixed&&c.member)e.member=c.member;});
  RAW.inspections.forEach(x=>attach('inspections',x,x.client,x.phone));
  RAW.bookings.forEach(x=>attach('bookings',x,x.customer_name,x.customer_phone));
  RAW.schedules.forEach(x=>{if(x.customer_name||x.customer_phone)attach('schedules',x,x.customer_name,x.customer_phone);});
  RAW.requests.forEach(x=>attach('requests',x,reqName(x),x.phone));
  RAW.quotes.forEach(x=>attach('quotes',x,x.client,x.phone));
  // 메모장(수리요청)은 고객명이 비어 있고 콘도명만 있는 경우가 많습니다 → 콘도명으로도 붙입니다
  RAW.memos.forEach(x=>{const _mn=x.name||x.condo||'';if(_mn||x.phone)attach('memos',x,_mn,x.phone);});
  // 상품권: 이름으로만 매칭 (연락처 없음)
  RAW.coupons.forEach(x=>{
    if(x.ca_link){pending.push({coll:'coupons',x,name:x.name||x.receiver,phone:''});return;}
    const k1=nn(x.name),k2=nn(x.receiver);
    let e=(k1&&byN[k1])||(k2&&byN[k2])||null;
    if(e&&docOffFor(x,e)){const d=newEntry(x.name||x.receiver,'');d.detached=true;entries.push(d);d.docs.coupons.push(x);return;}
    if(!e){e=newEntry(x.name||x.receiver,'');entries.push(e);if(k1&&!byN[k1])byN[k1]=e;}
    e.docs.coupons.push(x);
  });
  // ── 수동 연결(ca_link) 반영 : 고객명·연락처가 달라도 지정한 고객에게 붙입니다 ──
  if(pending.length){
    const byL={};
    entries.forEach(e=>{
      byL[entryKey(e)]=e;
      // 연결 당시 미등록이던 고객이 나중에 고객마스터에 등록돼도
      // 기존 연결이 끊기지 않도록 이름+연락처 키도 함께 인식합니다.
      const alt='k:'+nn(e.name)+'#'+pn(e.phone);
      if(byL[alt]===undefined)byL[alt]=e;
    });
    // 예전 임시 키(k:이름#번호)로 저장된 연결도 살려 냅니다.
    //  고객마스터가 생기면 키가 m:<문서id> 로 바뀌는데, 그 전에 저장된 연결이
    //  끊기면 같은 고객이 목록에 하나 더 생깁니다.
    const _oldKey=k=>{
      const m2=/^k:([^#]*)#(.*)$/.exec(String(k||''));
      if(!m2)return null;
      const kn=m2[1],kp=m2[2];
      let f=null;
      if(kp&&kp.length>=6)f=entries.find(x=>pn(x.phone)===kp)||null;
      if(!f&&kn)f=entries.find(x=>nn(x.name)===kn||(x.aliases||[]).some(a=>nn(a)===kn)||(x.master&&(x.master.aliases||[]).some(a=>nn(a)===kn)))||null;
      return f;
    };
    pending.forEach(it=>{
      let e=byL[it.x.ca_link]||_oldKey(it.x.ca_link);
      if(!e){
        // 연결 대상 고객이 사라진 경우 → 원래 이름·연락처 기준으로 되돌립니다
        const pk=pn(it.phone),nk=nn(it.name);
        e=(pk&&byP[pk])||(nk&&byN[nk])||null;
        if(!e){
          e=newEntry(it.name,it.phone);entries.push(e);
          if(pk)byP[pk]=e;if(nk&&!byN[nk])byN[nk]=e;
          byL[entryKey(e)]=e;
        }
      }else{
        // 문서에 적힌 이름이 다르면 「연결 문서명」으로 따로 기록해 검색이 되게 합니다.
        // (고객마스터의 별칭에는 넣지 않습니다 → 일괄 변경 대상에서 계속 제외됩니다)
        const nk=nn(it.name);
        if(nk&&nn(e.name)!==nk&&!e.aliases.some(a=>nn(a)===nk)&&!e.linkNames.some(a=>nn(a)===nk))
          e.linkNames=e.linkNames.concat([it.name]);
      }
      e.docs[it.coll].push(it.x);
      if(it.coll==='contracts'&&!e.member&&!e.memberFixed&&it.x.package_id)e.member='패키지 - '+pkgLabel(it.x.package_id);
      if(it.coll==='invoices'&&!e.member&&!e.memberFixed&&it.x.customer&&it.x.customer.member)e.member=it.x.customer.member;
    });
  }
  // ── 중복 연결(ca_links) 반영 : 원래 고객은 그대로 두고 추가 고객에게도 함께 표시 ──
  (function(){
    const COLLS=['contracts','invoices','inspections','bookings','schedules','requests','quotes','coupons'];
    const ex=[];

        const arr=e.docs[it.coll];if(!arr||arr.indexOf(it.x)>=0)return;
        arr.push(it.x);
        const on=docOwnerName(it.coll,it.x),nk=nn(on);
        if(nk&&nn(e.name)!==nk&&!e.aliases.some(a=>nn(a)===nk)&&!e.linkNames.some(a=>nn(a)===nk))
          e.linkNames=e.linkNames.concat([on]);
        if(it.coll==='contracts'&&!e.member&&!e.memberFixed&&it.x.package_id)e.member='패키지 - '+pkgLabel(it.x.package_id);
        if(it.coll==='invoices'&&!e.member&&!e.memberFixed&&it.x.customer&&it.x.customer.member)e.member=it.x.customer.member;
      });
    });
  })();
  entries.forEach(e=>{e.ts=entryTime(e);});
  sortEntries();
  // 병합 제안: 이름(또는 별칭)이 같은 서로 다른 항목
  mergeSug=[];
  const nameMap={};
  entries.forEach(e=>{
    const keys=[nn(e.name)].concat(e.aliases.map(nn)).filter(Boolean);
    keys.forEach(k=>{(nameMap[k]=nameMap[k]||[]).push(e);});
  });
  const seen=new Set();
  Object.keys(nameMap).forEach(k=>{
    const arr=[...new Set(nameMap[k])];
    if(arr.length>1){
      const pair=arr.slice(0,2);
      if(mgDismiss[mgPairKey(pair[0],pair[1])])return;   // 이미 「다른 고객」 처리한 쌍
      const key=arr.map(e=>entries.indexOf(e)).sort().join('-');
      if(!seen.has(key)){seen.add(key);mergeSug.push(pair);}
    }
  });
}
// ── 문서 1건의 「작성 시각」 : created_at 계열이 있으면 그것을, 없으면 날짜 필드를 사용 ──
function docTS(coll,x){
  const c=x.created_at||x.createdAt||x.created||x.updated_at||'';
  if(c)return String(c);
  if(coll==='contracts')return String(x.contract_date||'');
  if(coll==='bookings')return String(x.booking_date||'');
  if(coll==='coupons')return String(x.issuedAt||'');
  if(coll==='quotes')return String(x.issueDate||x.date||'');
  return String(x.date||'');
}
// 고객 1명의 「최근 작성」 = 고객 등록 시각과 모든 문서 작성 시각 중 가장 최신 값
function entryTime(e){
  let t=String((e.master&&(e.master.created_at||e.master.createdAt))||'');
  Object.keys(e.docs).forEach(coll=>{
    e.docs[coll].forEach(x=>{const v=docTS(coll,x);if(v>t)t=v;});
  });
  return t;
}
function sortEntries(){
  const byName=(a,b)=>(a.name||'').localeCompare(b.name||'','ko');
  if(curSort==='recent')      entries.sort((a,b)=>String(b.ts||'').localeCompare(String(a.ts||''))||byName(a,b));
  else if(curSort==='oldest') entries.sort((a,b)=>{
    const at=String(a.ts||''),bt=String(b.ts||'');
    if(!at&&!bt)return byName(a,b);
    if(!at)return 1;          // 작성 시각을 알 수 없는 건은 항상 뒤로
    if(!bt)return -1;
    return at.localeCompare(bt)||byName(a,b);
  });
  else if(curSort==='docs')   entries.sort((a,b)=>(docCount(b)-docCount(a))||byName(a,b));
  else                        entries.sort(byName);
  // 🌿 「청소 후 3개월 · 6개월」 목록에서만 — 경과 개월 수 순서
  //    (마지막 에어컨 관리일로 비교하므로 같은 개월 수 안에서도 날짜까지 정확히 정렬됩니다)
  if(caCareFilter()&&curCareSort){
    const hi=curCareSort==='moHi';
    entries.sort((a,b)=>{
      const da=careLastAc(a),dbb=careLastAc(b);
      if(!da&&!dbb)return byName(a,b);
      if(!da)return 1;            // 관리일을 알 수 없는 고객은 항상 뒤로
      if(!dbb)return -1;
      return (hi?da.localeCompare(dbb):dbb.localeCompare(da))||byName(a,b);
    });
  }
}
// 정렬 목록 — 「청소 후 3개월 · 6개월」을 골랐을 때만 「경과 많은순 · 적은순」이 나타납니다
//  · 경과 정렬은 따로 기억하므로, 다른 목록으로 돌아가면 원래 정렬(이름순 등)이 그대로 적용됩니다

function caBal(c){
  const paid=parseFloat(c.amount_paid)||0;
  const bonus=(parseFloat(c.bonus_credit)||0)+(parseFloat(c.special_bonus_credit)||0);
  const total=paid+bonus;
  let h=[];try{h=typeof c.usage_history==='string'?JSON.parse(c.usage_history||'[]'):(c.usage_history||[]);}catch(_){h=[];}
  const used=h.reduce((a,u)=>a+(parseFloat(u.amount)||0),0);
  const disc=h.reduce((a,u)=>a+(parseFloat(u.discount)||0),0);
  const carry=h.reduce((a,u)=>a+(parseFloat(u.carryover)||0),0);
  const cnt=h.filter(u=>(parseFloat(u.amount)||0)>0).length;
  return {paid,bonus,total,netUsed:Math.max(0,used-disc-carry),remain:total-used+disc+carry,cnt,rows:h};
}

  const seq=parseInt(x.joint_seq)||1;
  return {n:jm.length||1,seq,others:jm.filter(m=>(parseInt(m.seq)||0)!==seq).map(m=>String(m.name||'')),
    alloc:x.joint_alloc!=null?parseFloat(x.joint_alloc)||0:null,paid:x.joint_paid!=null?parseFloat(x.joint_paid)||0:null,bonus:(parseFloat(x.joint_bonus)||0)+(parseFloat(x.joint_spec)||0)};
}

const CARE_AC=/에어컨|벽걸이|천정|천장|카세트|스탠드|매립|덕트|실외기|FCU|air[- ]?con|cassette|ceiling(?!\s*fan)|wall[- ]?mount|duct|outdoor/i;

const CARE_CLEAN=/세척|청소|세탁(?!기)|살균|스팀|약품|wash(?!er|ing\s*machine)|clean|steam|overhaul|chemical|saniti|laundry/i;
const CARE_NOT=/출장점검|점검|수리|repair|inspect|냉매|refrigerant|가스|\bgas\b|설치|install|부품|\bparts?\b|교체|replace|진공|vacuum|구매|구입|판매|purchase|\bbuy|\bsale|렌탈|rental/i;
function careCleanIt(it){
  const t=String((it&&it.cat)||'')+' '+String((it&&it.subcat)||'')+' '+String((it&&it.name)||'');
  return CARE_CLEAN.test(t)&&!CARE_NOT.test(t);

}
// 같은 청소분(마지막 에어컨 인보이스) 이후에 그 주기의 안내를 이미 보냈는지 찾습니다.

function careSentOf(e,k,since){
  const L=(e&&e.careLog)||[];
  for(let i=0;i<L.length;i++){
    const r=L[i];

    return r;

}

function careDateTxt(v,en){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||''));
  if(!m)return '';
  const y=m[1],mo=parseInt(m[2],10),d=parseInt(m[3],10);
  return en?(d+' '+CARE_MN[mo-1]+' '+y):(y+'년 '+mo+'월 '+d+'일');
}
// 마지막 관리일부터 오늘까지 지난 개월 수 — careDue 와 같은 기준(같은 날짜가 되어야 한 달)
function careMonths(v){
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||''));
  if(!m)return 0;
  const t=new Date();
  let mo=(t.getFullYear()-parseInt(m[1],10))*12+(t.getMonth()+1-parseInt(m[2],10));
  if(t.getDate()<parseInt(m[3],10))mo--;
  return Math.max(0,mo);
}
let _careFontP=null;
function careFont(){
  if(_careFontP)return _careFontP;
  _careFontP=(async()=>{
    try{
      if(!window.FontFace||!document.fonts)return false;
      const src='https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/woff2/Pretendard-';
      const fs=[new FontFace('HHCPret','url('+src+'Bold.woff2)',{weight:'700'}),
                new FontFace('HHCPret','url('+src+'ExtraBold.woff2)',{weight:'800'}),
                new FontFace('HHCPret','url('+src+'Black.woff2)',{weight:'900'})];
      await Promise.race([Promise.all(fs.map(f=>f.load())),new Promise((_,r)=>setTimeout(()=>r(0),3500))]);
      fs.forEach(f=>document.fonts.add(f));
      return true;
    }catch(_){return false;}   // 글꼴을 못 받으면 기기 기본 글꼴로 그립니다
  })();
  return _careFontP;
}

function careDue(e){
  const ds=((e.docs&&e.docs.invoices)||[]).filter(x=>x.status!=='draft'&&careAcInv(x))
    .map(x=>String(x.date||'').slice(0,10)).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x)).sort();
  if(!ds.length)return null;
  const last=ds[ds.length-1];
  const t=new Date(),y=parseInt(last.slice(0,4),10),m=parseInt(last.slice(5,7),10),d=parseInt(last.slice(8,10),10);
  let mo=(t.getFullYear()-y)*12+(t.getMonth()+1-m);
  if(t.getDate()<d)mo--;                          // 같은 날짜가 되어야 한 달로 셉니다
  // 「청소 후 3개월 경과」 = 에어컨 청소 서비스일 기준 3개월 「초과」 (2026-11-23) — 딱 3개월 되는 날은 아직 제외

  if(mo===3&&t.getDate()===d)return null;

  if(!k)return null;
  return {k:k,last:last,mo:mo,sent:careSentOf(e,k,last)};
}

//  · 결제되지 않고 남은 금액(invDue)이 있는 인보이스만 셉니다
//  · 「연체」로 표시한 인보이스 + 만기일이 지난 「청구중」 인보이스 = 연체중
function billStat(e){
  const t=caToday();
  let bn=0,ba=0,on=0,oa=0,minDue='';
  ((e.docs&&e.docs.invoices)||[]).forEach(x=>{
    const st=String(x.status||'billing');
    if(st!=='billing'&&st!=='overdue')return;      // 작성중·결제완료는 제외
    const due=invDue(x);
    if(due<=0.005)return;
    const dd=String(x.due||'');
    const late=(st==='overdue')||(/^\d{4}-\d{2}-\d{2}$/.test(dd)&&dd<t);
    if(late){on++;oa+=due;if(!minDue||(dd&&dd<minDue))minDue=dd;}
    else{bn++;ba+=due;}
  });
  return {bn:bn,ba:ba,on:on,oa:oa,minDue:minDue};
}

  const _jc=(e.docs&&e.docs.contracts||[]).find(x=>x.joint_id&&x.status!=='ended');
  return memberBadge0(e)+(_jc?caJtPill(_jc):'');
}
function memberBadge0(e){
  if(isVVIP(e))return '<span class="pill gold mvv">👑 VVIP</span>';
  if(/^패키지/.test(e.member||''))return '<span class="pill blue mpk">📦 '+esc(e.member)+'</span>';
  if(e.member)return '<span class="pill blue">👑 '+esc(e.member)+'</span>';
  if(e.memberFixed)return '';        // 「(없음)」으로 직접 지정한 고객
  if(e.docs.contracts.length)return '<span class="pill blue mpk">📦 패키지(계약)</span>';
  return '';
}
function renderList(){
  caSortOpts();
  sortEntries();
  const qRaw=document.getElementById('q').value.trim();
  const q=sn(qRaw);
  const qNum=qRaw.replace(/[^0-9]/g,'');
  let list=entries.filter(e=>{
    // 「전체」에서 검색할 때는 ⏸ 비활성 고객도 함께 찾습니다 (검색어가 없으면 기존처럼 숨김)
    const _inSrch=curFilter==='all'&&!!(q||qNum)&&e.inactive;
    if(!_inSrch&&!passFilter(e))return false;
    if(!q&&!qNum)return true;
    if(q&&sn(e.name).includes(q))return true;
    if(q&&e.aliases.some(a=>sn(a).includes(q)))return true;
    if(q&&(e.linkNames||[]).some(a=>sn(a).includes(q)))return true;
    if(q&&sn(e.addr).includes(q))return true;
    const qPn=pn(qRaw);
    if(qPn.length>=3&&pn(e.phone).includes(qPn))return true;
    if(qNum.length>=4&&String(e.phone||'').replace(/[^0-9]/g,'').includes(qNum))return true;
    return false;
  });
  // 👥 공동계약 구분에서는 같은 계약끼리 붙여서(계약서번호 → 순번)
  if(curFilter==='joint'){const K=e=>{const c=caJtOf(e);return c?String(c.contract_no||c.joint_id)+'|'+('00'+(parseInt(c.joint_seq)||0)).slice(-3):'~';};list=list.slice().sort((a,b)=>K(a).localeCompare(K(b)));}
  // 🌿 청소 후 3개월 경과 — 위 칸(앱 알림 · 전체 WhatsApp · 연락 경로 탭) + 선택한 탭 고객만 (2026-11-23)
  const _care=curFilter==='care',_careAll=_care?list:null;
  if(_care)list=list.filter(e=>caCareGrp(e)===caCareTab);
  const host=document.getElementById('list');
  // ── 지금 보고 있는 구분 · 검색 결과 안내 줄 ──
  const _flb=(FILTERS.find(f=>f[0]===curFilter)||['','전체'])[1].replace(/^[^\w가-힣]+\s*/,'');
  const _rh=(curFilter!=='all'||qRaw)?'<div class="rh"><span><b>'+esc(curFilter==='all'?'검색 결과':_flb)+'</b> '+(_care?_careAll.length:list.length)+'명'+
    (qRaw?' · 「'+esc(qRaw)+'」':'')+'</span><button type="button" onclick="caResetView()">전체 보기 ✕</button></div>':'';
  if(!list.length&&_care&&_careAll.length){host.innerHTML=_rh+caCarePanel(_careAll)+'<div class="empty"><b>이 탭에는 고객이 없습니다</b>다른 연락 경로 탭을 눌러 보세요</div>';return;}
  if(!list.length){host.innerHTML=_rh+'<div class="empty"><b>해당하는 고객이 없습니다</b>'+
    (qRaw?'검색어를 줄이거나 연락처 끝 4자리로 찾아 보세요':(curFilter!=='all'?'처리할 고객이 없습니다 — 좋은 상태예요':'＋ 신규 고객으로 첫 고객을 등록하세요'))+'</div>';return;}
  // ── 페이지 나누기 (표시만 나눔 — 데이터·필터·정렬 로직은 기존 그대로) ──
  const sig=curFilter+'|'+q+'|'+qNum;
  if(sig!==caPageSig){caPageSig=sig;caPage=1;}
  const per=caPageSize>0?caPageSize:list.length;
  const pages=Math.max(1,Math.ceil(list.length/per));
  if(caPage>pages)caPage=pages;
  const view=list.slice((caPage-1)*per,(caPage-1)*per+per);
  host.innerHTML=_rh+(_care?caCarePanel(_careAll):'')+view.map(e=>{
    const idx=entries.indexOf(e);
    const init=(e.name||'?').trim().charAt(0).toUpperCase();
    // 문서 개수 — 색 배지 대신 조용한 숫자 줄 (상태는 위쪽 배지가 알려 줍니다)
    const srcs=SRC_DEF.filter(s=>e.docs[s[0]].length).map(s=>'<span class="dc">'+s[1]+' <b>'+e.docs[s[0]].length+'</b></span>').join('');
    const _pt=ptCalc(e);   // 💎 포인트 잔액 배지
    // 아바타 색 = 회원 구분 (VVIP 금색 · 패키지 청록 · 등급 남색 · 일반 회색)
    const tier=e.inactive?'t0':(isVVIP(e)?'tv':(isPkg(e)?'tp':(e.member?'tm':'tn')));
    const badges=billBadge(e)+careBadge(e)+memberBadge(e)+pnBadge(e)+
      (e.loc?'<span class="pill locy" title="방문 위치 등록됨'+(e.loc.name?' · '+esc(e.loc.name):'')+'">📍 위치 등록</span>'
            :'<span class="pill locn" title="방문 위치 미등록 — 상세 › 📍 방문 위치 등록">📍 위치 미등록</span>')+
      (_pt.bal>0?'<span class="pill pt">💎 RM '+_pt.bal.toLocaleString()+'</span>':'')+
      (e.inactive?'<span class="pill mut">⏸ 비활성</span>':'')+
      (e.detached?'<span class="pill det" title="이 고객에서 자동연결을 해제한 문서입니다. 상세보기 ⋮ 메뉴에서 복구하거나 다른 고객에게 연결할 수 있습니다.">🔓 연결 해제된 문서</span>':(e.master?'':'<span class="pill vio">미등록</span>'));
    const phone=phBad(e)?'<b class="phx">'+esc(e.phone)+'</b> <span class="pill warn">번호 수정 필요</span>':
      (pn(e.phone)?esc(e.phone):'<span class="phn">연락처 없음</span> <span class="pill warn">보완 필요</span>');
    return '<div class="crow '+tier+(e.inactive?' inact':'')+'" onclick="caRowOpen(event,'+idx+')">'+
      '<div class="avatar">'+esc(init)+'</div>'+
      '<div class="cmain"><div class="cnm">'+(_care?caCareChk(e):'')+'<span class="nm">'+esc(e.name||'(이름 없음)')+'</span>'+chBadge(e,idx)+'</div>'+
      '<div class="cph">'+phone+(e.addr?'<span class="ad"> · '+esc(e.addr)+'</span>':'')+
        (e.aliases.length?'<span class="alias"> · 별칭 '+esc(e.aliases.join(', '))+'</span>':'')+
        ((e.linkNames||[]).length?'<span class="alias lk"> · 🔗 '+esc(e.linkNames.join(', '))+'</span>':'')+'</div>'+
      (badges?'<div class="cbg">'+badges+'</div>':'')+'</div>'+
      '<div class="csrcs">'+(srcs||'<span class="dc none">기록 없음</span>')+
        (e.ts?'<span class="dc dt">'+esc(String(e.ts).slice(0,10))+'</span>':'')+'</div>'+
      '<div class="cact"><button class="btn sm p dtl" onclick="openDrawer('+idx+')">상세 ›</button>'+
        '<button class="btn sm mor" onclick="caRowMenu(event,this,'+idx+')" title="더보기 메뉴" aria-label="더보기 메뉴">⋮</button></div>'+
      ((curFilter==='care3'||curFilter==='care6')?careRowSend(e,idx):'')+
      (_care?caCareRow(e,idx):'')+
      '</div>';
  }).join('')+pagerHTML(list.length,pages)+(_care?caCareFoot(_careAll):'');
}

const CA_FOLD_DEF={invoices:1,inspections:1,contracts:1,coupons:1,quotes:1,etc:1};
const CA_FOLD=(function(){
  // 저장된 상태에 없는 항목은 기본값(접힘)을 따른다 — 이전 버전 사용자도 새 기본값 적용
  try{return Object.assign({},CA_FOLD_DEF,JSON.parse(localStorage.getItem('hhc_ca_fold')||'null')||{});}
  catch(e){return Object.assign({},CA_FOLD_DEF);}
})();
function caFold(k){return !!CA_FOLD[k];}
window.caToggleFold=function(hd){
  const card=hd.closest('.dcard'); if(!card)return;
  if(card.closest('#dz-sheet'))return;   // 전체 팝업 안에서는 항상 펼친 상태로 둡니다
  const k=card.dataset.fold; if(!k)return;
  const now=!card.classList.contains('fold');
  card.classList.toggle('fold',now);
  CA_FOLD[k]=now?1:0;
  try{localStorage.setItem('hhc_ca_fold',JSON.stringify(CA_FOLD));}catch(e){}
};
// 요약 칩 → 해당 카드로 이동 (접혀 있으면 펼치고 이동)
window.caGoCard=function(k){
  const card=document.querySelector('#drawer .dcard[data-fold="'+k+'"]');
  if(!card){toast('해당 기록이 없습니다');return;}
  if(card.classList.contains('fold')){card.classList.remove('fold');CA_FOLD[k]=0;

function caGlance(e){
  const T=caToday();
  const unpaid=e.docs.invoices.filter(x=>x.status==='billing'||x.status==='overdue');
  const due=unpaid.reduce((a,x)=>a+invDue(x),0), od=unpaid.some(x=>x.status==='overdue');
  const live=e.docs.contracts.filter(x=>x.status!=='ended');
  const rem=live.reduce((a,x)=>a+caBal(x).remain,0);
  let pt=null;try{pt=ptCalc(e);}catch(_){}
  // 다음 방문 — 확정·신청 예약과 메모장 방문일 중 오늘 이후 가장 빠른 것
  const nx=[];
  e.docs.bookings.forEach(x=>{const d=String(x.booking_date||'');if(d&&d>=T&&x.status!=='cancelled'&&x.status!=='canceled')
    nx.push({d,t:String(x.booking_time||'').split('|')[0].trim(),w:String(x.booking_items||'').trim()||'예약',go:"caGoCard('etc')"});});
  (e.docs.memos||[]).forEach(x=>{const d=String(x.visit_date||'');if(d&&d>=T&&x.status!=='done')
    nx.push({d,t:String(x.visit_time||''),w:x.kind==='curtain'?'커튼 재설치':(String(x.symptom||'').split('\n')[0]||'수리 방문'),go:"caGoCard('memos')"});});
  nx.sort((a,b)=>(a.d+a.t).localeCompare(b.d+b.t));
  const n0=nx[0];
  const dd=n0?Math.round((new Date(n0.d+'T00:00:00')-new Date(T+'T00:00:00'))/864e5):0;
