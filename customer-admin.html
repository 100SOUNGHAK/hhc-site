<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HHC 총괄 고객관리</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1a2233;--ink2:#4b5563;--ink3:#8a94a6;--bdr:#e3e8f0;--pri:#2563eb;--pri-bg:#eff6ff;--ok:#059669;--ok-bg:#ecfdf5;--warn:#b45309;--warn-bg:#fff7e6;--bad:#dc2626;--bad-bg:#fef2f2;--vio:#7c3aed;--vio-bg:#f5f3ff;--gold:#a16207;--gold-bg:#fef9c3}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;background:var(--bg);color:var(--ink);padding:16px 14px 80px}
.wrap{max-width:1080px;margin:0 auto}
.hdr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hdr h1{font-size:19px;font-weight:900}
.fb-dot{width:9px;height:9px;border-radius:50%;background:#d1d5db}
.fb-dot.on{background:#34d399}
.hdr .sp{flex:1}
.btn{border:none;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:800;border-radius:10px;padding:10px 16px;background:#fff;border:1.5px solid var(--bdr);color:var(--ink2)}
.btn.p{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.sm{font-size:11px;padding:6px 11px;border-radius:8px}
.search-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
#q{flex:1;min-width:220px;border:1.5px solid var(--bdr);border-radius:10px;padding:10px 13px;font-size:13px;font-family:inherit;background:#fff}
#q:focus{outline:none;border-color:var(--pri)}
#sortby{border:1.5px solid var(--bdr);border-radius:10px;padding:10px 11px;font-size:12.5px;font-weight:700;font-family:inherit;background:#fff;color:var(--ink);cursor:pointer}
#sortby:focus{outline:none;border-color:var(--pri)}
.lk-warn{background:var(--warn-bg);border:1.5px solid #fbbf24;border-radius:10px;padding:10px 12px;font-size:12px;color:#92400e;line-height:1.65;margin:10px 0}
.lk-keep{display:flex;gap:9px;align-items:flex-start;background:var(--bg);border:1.5px solid var(--bdr);border-radius:10px;padding:11px 12px;margin-bottom:4px;cursor:pointer}
.lk-keep input{margin-top:2px;width:16px;height:16px;flex:none;accent-color:var(--pri)}
.lk-keep b{display:block;font-size:12.5px;color:var(--ink)}
.lk-keep span{display:block;font-size:11px;color:var(--ink3);line-height:1.5;margin-top:2px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.st{background:#fff;border:1px solid var(--bdr);border-radius:10px;padding:8px 14px;font-size:11px;color:var(--ink2);font-weight:700}
.st b{display:block;font-size:17px;color:var(--ink);font-weight:900}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{cursor:pointer;font-size:11.5px;font-weight:800;border-radius:20px;padding:6px 13px;background:#fff;border:1.5px solid var(--bdr);color:var(--ink2);user-select:none}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.mergebar{background:var(--warn-bg);border:1.5px dashed #f0c36d;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--warn);font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.mergebar .mb{margin-left:auto;display:flex;gap:6px}
.crow{background:#fff;border:1.5px solid var(--bdr);border-radius:12px;padding:12px 14px;margin-bottom:9px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--pri-bg);color:var(--pri);font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.cnm{font-size:14.5px;font-weight:900;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.alias{font-size:11px;font-weight:700;color:var(--ink3)}
.cph{font-size:12px;color:var(--ink2);margin-top:2px}
.srcs{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.src{font-size:10px;font-weight:800;border-radius:5px;padding:2px 6px}
.src.ct{background:var(--pri-bg);color:var(--pri)}.src.iv{background:var(--ok-bg);color:var(--ok)}.src.ip{background:var(--warn-bg);color:var(--warn)}.src.cp{background:var(--vio-bg);color:var(--vio)}.src.bk{background:#e0f2fe;color:#0369a1}.src.rq{background:#fce7f3;color:#be185d}.src.qt{background:#f1f5f9;color:#475569}.src.sc{background:var(--gold-bg);color:var(--gold)}
.pill{font-size:10px;font-weight:800;border-radius:5px;padding:2px 7px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.blue{background:var(--pri-bg);color:var(--pri)}.pill.vio{background:var(--vio-bg);color:var(--vio)}.pill.gold{background:var(--gold-bg);color:var(--gold)}
.cbtns{display:flex;flex-direction:column;gap:5px}
.empty{text-align:center;color:var(--ink3);font-size:13px;padding:40px 0}
/* 상세 드로어 */
#drawer-mask{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:900;display:none}
#drawer-mask.open{display:block}
#drawer{position:fixed;top:0;right:-720px;width:min(700px,100vw);height:100vh;background:var(--bg);z-index:901;transition:right .25s;overflow-y:auto;padding:16px;box-shadow:-8px 0 30px rgba(0,0,0,.15)}
#drawer.open{right:0}
.dhead{display:flex;gap:13px;align-items:center;flex-wrap:wrap;background:#fff;border:1.5px solid var(--bdr);border-radius:12px;padding:14px;margin-bottom:12px}
.dhead .avatar{width:52px;height:52px;font-size:18px}
.dinfo b{font-size:17px;font-weight:900}
.tagrow{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.dbtns{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.dcard{background:#fff;border:1.5px solid var(--bdr);border-radius:12px;overflow:hidden;margin-bottom:12px}
.dcard-h{padding:10px 13px;font-size:12.5px;font-weight:900;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:6px}
.dcard-h .cnt{margin-left:auto;font-size:10.5px;font-weight:800;background:var(--bg);border-radius:10px;padding:2px 8px;color:var(--ink2)}
.drow{padding:9px 13px;border-bottom:1px solid #f1f4f9;font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.drow:last-child{border-bottom:none}
.drow .id{font-weight:800}
.drow .m{color:var(--ink3);font-size:11px}
.open-btn{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--pri);background:var(--pri-bg);border-radius:6px;padding:3px 9px;white-space:nowrap;text-decoration:none}
.dnone{padding:14px;font-size:12px;color:var(--ink3);text-align:center}
.rb{border:none;cursor:pointer;font-family:inherit;font-size:10.5px;font-weight:800;border-radius:6px;padding:3px 8px;background:var(--bg);color:var(--ink2);white-space:nowrap}
.rb.del{background:var(--bad-bg);color:var(--bad)}
.rb.hd{background:var(--pri-bg);color:var(--pri);font-size:10.5px;padding:4px 10px;border-radius:7px}
.lk-row{border:1.5px solid var(--bdr);border-radius:10px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font-size:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lk-row:hover{border-color:var(--pri);background:var(--pri-bg)}
.lk-row.mine{opacity:.5;cursor:default}
.lk-row .own{margin-left:auto;font-size:10px;color:var(--ink3);font-weight:700}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mini .mc{background:#fff;border:1px solid var(--bdr);border-radius:10px;padding:9px;text-align:center;font-size:10.5px;color:var(--ink3);font-weight:700}
.mini .mc b{display:block;font-size:15px;color:var(--ink);font-weight:900}
/* 문서 뷰어 오버레이 */
#dv-wrap{position:fixed;inset:0;z-index:1200;background:#fff;display:none;flex-direction:column}
#dv-wrap.open{display:flex}
#dv-bar{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:9px 12px;background:linear-gradient(120deg,#0B1833,#16264a);box-shadow:0 2px 10px rgba(11,24,51,.18)}
#dv-bar button,#dv-bar a{font-family:inherit;font-size:12px;font-weight:800;border-radius:8px;padding:6px 12px;cursor:pointer;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:#fff;text-decoration:none;white-space:nowrap}
#dv-bar #dv-back{background:#fff;color:#0B1833;border-color:#fff}
#dv-ttl{flex:1;min-width:0;font-size:12.5px;font-weight:800;color:#dbe4fb;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dv-body{flex:1;min-height:0;position:relative}
#dv-body iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:block;background:#fff}
@media(max-width:560px){#dv-new{display:none}#dv-bar #dv-x{padding:6px 10px}}
/* 모달 */
.mask{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:950;display:none;align-items:center;justify-content:center;padding:16px}
.mask.open{display:flex}
.modal{background:#fff;border-radius:14px;max-width:440px;width:100%;box-shadow:0 18px 60px rgba(0,0,0,.3);overflow:hidden;max-height:92vh;overflow-y:auto}
.modal-h{padding:13px 16px;font-size:14px;font-weight:900;border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:7px}
.modal-h .x{margin-left:auto;cursor:pointer;border:none;background:none;font-size:16px;color:var(--ink3)}
.modal-b{padding:14px 16px}
.fl{font-size:11px;font-weight:800;color:var(--ink2);margin:10px 0 4px}
.fi{width:100%;border:1.5px solid var(--bdr);border-radius:9px;padding:9px 12px;font-size:13px;font-family:inherit;background:#fff}
.fi:focus{outline:none;border-color:var(--pri)}
select.fi{appearance:auto}
.modal-f{padding:12px 16px;border-top:1px solid var(--bdr);display:flex;gap:8px;justify-content:flex-end}
.cmp{display:grid;grid-template-columns:1fr 22px 1fr;gap:6px;align-items:center;background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:12px;text-align:center}
.cmp small{display:block;font-size:10px;color:var(--ink3);font-weight:700;margin-bottom:2px}
.cmp b{font-size:12.5px}
.prop-row{border:1px solid #f1f4f9;border-radius:8px;margin-bottom:5px;padding:8px 12px;font-size:12px;display:flex;gap:8px;align-items:center}
.prop-row .m{color:var(--ink3);margin-left:auto}
.pc-opt{display:block;width:100%;text-align:left;border:1.5px solid var(--bdr);border-radius:11px;padding:11px 13px;margin-bottom:8px;cursor:pointer;background:#fff;font-family:inherit}
.pc-opt:hover{border-color:var(--pri);background:var(--pri-bg)}
.pc-opt b{display:block;font-size:13px;color:var(--ink)}
.pc-opt span{display:block;font-size:11px;color:var(--ink3);line-height:1.5;margin-top:2px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;font-size:12.5px;font-weight:700;border-radius:10px;padding:10px 18px;z-index:9999;display:none}
.loading{text-align:center;color:var(--ink3);font-size:13px;padding:50px 0}
@media(max-width:600px){.crow{grid-template-columns:38px 1fr}.cbtns{grid-column:1/-1;flex-direction:row}.mini{grid-template-columns:repeat(2,1fr)}}
/* ═══ 💎 포인트 ═══ */
.ptcard{border-radius:16px;overflow:hidden;margin-bottom:12px;background:linear-gradient(135deg,#4C1D95,#6D28D9 55%,#7C3AED);color:#fff;box-shadow:0 10px 26px rgba(109,40,217,.28)}
.ptcard .pt-top{display:flex;align-items:center;gap:9px;padding:14px 16px 4px}
.ptcard .pt-t{font-size:12.5px;font-weight:900;letter-spacing:.4px;opacity:.92}
.ptcard .pt-rule{font-size:10px;font-weight:900;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:3px 9px}
.ptcard .pt-adj-btn{margin-left:auto;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:10px;font-weight:900;font-size:12px;padding:8px 12px;cursor:pointer;font-family:inherit}
.ptcard .pt-adj-btn:hover{background:rgba(255,255,255,.24)}
.ptcard .pt-use-btn{margin-left:6px;background:#fff;color:#5B21B6;border:none;border-radius:10px;font-weight:900;font-size:12px;padding:8px 14px;cursor:pointer;font-family:inherit;box-shadow:0 3px 8px rgba(0,0,0,.18)}
.ptcard .pt-use-btn:disabled{opacity:.5;cursor:not-allowed}
.ptcard .pt-bal{padding:2px 16px 12px}
.ptcard .pt-bal .k{font-size:10.5px;font-weight:800;opacity:.75;letter-spacing:.5px}
.ptcard .pt-bal .v{font-size:29px;font-weight:900;letter-spacing:-.5px;line-height:1.15}
.ptcard .pt-bal .v small{font-size:15px;opacity:.85}
.ptcard .pt-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1px;background:rgba(255,255,255,.14)}
.ptcard .pt-c{background:rgba(255,255,255,.09);padding:9px 12px;text-align:center}
.ptcard .pt-c .k{font-size:10px;font-weight:800;opacity:.78}
.ptcard .pt-c .v{font-size:13px;font-weight:900;margin-top:2px}
.pt-hist .ph{display:flex;align-items:center;gap:8px;padding:8px 13px;border-top:1px solid var(--bdr);font-size:12px}
.pt-hist .ph:first-of-type{border-top:none}
.pt-hist .ph .sign{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;flex-shrink:0}
.pt-hist .ph.earn .sign{background:#ECFDF5;color:#047857}
.pt-hist .ph.use .sign{background:#FEF2F2;color:#DC2626}
.pt-hist .ph b{font-weight:800;white-space:nowrap}
.pt-hist .ph .m{color:var(--ink2);font-size:11px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-hist .ph .amt{margin-left:auto;font-weight:900;flex-shrink:0}
.pt-hist .ph.earn .amt{color:#047857}
.pt-hist .ph.use .amt{color:#DC2626}
.pill.pt{background:#F5F3FF;color:#6D28D9}
.ptcard .pt-cfg{font-size:10px;font-weight:900;background:rgba(255,255,255,.12);border:1px dashed rgba(255,255,255,.45);color:#fff;border-radius:999px;padding:3px 9px;cursor:pointer;font-family:inherit}
.ptcard .pt-cfg:hover{background:rgba(255,255,255,.22)}
.pt-hx{width:100%;background:none;border:none;cursor:pointer;font-family:inherit;text-align:left}
.pt-hx .tg{margin-left:8px;font-size:11px;font-weight:900;color:#6D28D9;flex-shrink:0}
.pt-ls{display:none}
.pt-ls.open{display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>👥 총괄 고객관리</h1><span class="fb-dot" id="fb-dot"></span>
    <span class="sp"></span>
    <button class="btn" onclick="loadAll(true)">🔄 새로고침</button>
    <button class="btn p" onclick="openNewModal()">＋ 신규 고객</button>
  </div>
  <div class="search-row">
    <input id="q" placeholder="🔍 이름 · 연락처 · 별칭 · 콘도명 검색" oninput="renderList()">
    <select id="sortby" onchange="setSort(this.value)" title="정렬 기준">
      <option value="name">🔤 이름순 (가나다)</option>
      <option value="recent">🕘 최근 작성순</option>
      <option value="oldest">📜 오래된 순</option>
      <option value="docs">📄 기록 많은순</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>
  <div class="chips" id="chips"></div>
  <div id="merge-host"></div>
  <div id="list"><div class="loading">불러오는 중...</div></div>
</div>

<!-- 상세 드로어 -->
<div id="drawer-mask" onclick="closeDrawer()"></div>
<div id="drawer"></div>

<!-- 문서 뷰어 오버레이 — 닫으면 고객 상세 화면으로 복귀 -->
<div id="dv-wrap">
  <div id="dv-bar">
    <button id="dv-back" onclick="caViewClose()">← 뒤로</button>
    <span id="dv-ttl">문서</span>
    <a id="dv-new" href="#" target="_blank" rel="noopener">↗ 새 탭</a>
    <button id="dv-x" onclick="caViewClose()">✕ 닫기</button>
  </div>
  <div id="dv-body"></div>
</div>

<!-- 신규/수정 모달 -->
<div class="mask" id="edit-mask">
  <div class="modal">
    <div class="modal-h"><span id="em-title">＋ 신규 고객</span><button class="x" onclick="closeEdit()">✕</button></div>
    <div class="modal-b">
      <div class="fl">고객명 *</div><input class="fi" id="em-name" placeholder="예: 김철수">
      <div class="fl">연락처</div><input class="fi" id="em-phone" placeholder="+60 12-345 6789">
      <div class="fl">별칭 (쉼표로 구분 — 다른 프로그램에 다른 이름으로 저장된 경우)</div><input class="fi" id="em-alias" placeholder="예: Mr. Kim, 김철수 사장님">
      <div class="fl">회원 구분</div><select class="fi" id="em-member"></select>
      <div class="fl">이메일</div><input class="fi" id="em-email" placeholder="선택사항">
      <div class="fl">주소</div><input class="fi" id="em-addr" placeholder="선택사항">
      <div class="fl">메모</div><input class="fi" id="em-memo" placeholder="선택사항">
    </div>
    <div class="modal-f"><button class="btn" onclick="closeEdit()">취소</button><button class="btn p" id="em-save" onclick="saveEdit()">저장</button></div>
  </div>
</div>

<!-- 일괄 변경 확인 모달 -->
<div class="mask" id="prop-mask">
  <div class="modal">
    <div class="modal-h">✏️ 변경 확인 — 전 프로그램 반영<button class="x" onclick="closeProp()">✕</button></div>
    <div class="modal-b" id="prop-body"></div>
    <div class="modal-f"><button class="btn" onclick="closeProp()">취소</button><button class="btn p" id="prop-go">변경 실행</button></div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, getDocs, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const BASE='https://hhc-3p8.pages.dev';
const MEMBER_TIERS=['','VVIP','패키지 - 실버회원','패키지 - 티타늄회원','패키지 - 다이아회원','패키지 - 골드회원','패키지 - 로얄회원','패키지(사업) - 티타늄회원','패키지(사업) - 다이아회원','패키지(사업) - 골드회원','패키지(사업) - 로얄회원'];
const PKG_LABEL={silver:'실버',royal:'로얄',gold:'골드',diamond:'다이아',titanium:'티타늄',special:'스페셜해피홈'};
let db=null;
let RAW={customers:[],contracts:[],invoices:[],inspections:[],coupons:[],requests:[],bookings:[],schedules:[],quotes:[]};
let entries=[],mergeSug=[],curFilter='all',editTarget=null,drawerKey=null;
// 정렬 기준 (name | recent | oldest | docs) — 마지막 선택을 기억합니다
let curSort=(function(){try{return localStorage.getItem('hhc_ca_sort')||'name';}catch(e){return 'name';}})();
// 「다른 고객입니다」로 처리한 병합 제안은 저장해 두고 다시 제안하지 않는다
const MG_DISMISS_KEY='hhc_ca_merge_dismiss';
let mgDismiss={};
try{mgDismiss=JSON.parse(localStorage.getItem(MG_DISMISS_KEY)||'{}')||{};}catch(e){mgDismiss={};}
function mgSig(e){return nn(e.name)+'#'+pn(e.phone);}
function mgPairKey(a,b){return [mgSig(a),mgSig(b)].sort().join('|');}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pn(p){p=String(p||'').replace(/[^0-9]/g,'');if(p.indexOf('60')===0)p=p.slice(2);return p.replace(/^0+/,'');}
function nn(n){return String(n||'').toLowerCase().replace(/\s+/g,'');}
// 의뢰(request) 고객명 = 콘도명 + 동호수 (예: "THE PARK" + "D-31-07" → "THE PARK D-31-07")
// 구버전 문서는 condo 하나에 "콘도명 (동호수)" 형태로 저장돼 있어 괄호를 풀어 같은 형식으로 맞춘다.
function reqName(x){
  const n=String((x&&x.condo_name)||'').trim();
  const u=String((x&&x.condo_unit)||'').trim();
  if(n&&u)return (nn(n).indexOf(nn(u))>=0)?n:(n+' '+u);
  if(n)return n;
  const c=String((x&&x.condo)||'').trim();
  return c.replace(/\s*\(\s*(.+?)\s*\)\s*$/,' $1').trim();
}
// 검색 전용 정규화 — 대소문자·공백·특수문자를 모두 무시 (예: "THE PARK-2" ↔ "THE PARK2" ↔ "the park 2")
function sn(n){return String(n||'').toLowerCase().replace(/[^0-9a-z가-힣]/g,'');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600);}
function fmtRM(v){const n=parseFloat(v)||0;return 'RM '+n.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});}
function caToday(){const d=new Date(),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
// 견적 합계 — 기본 합계 + 고객이 선택한 에어컨 옵션 금액
function qtTotal(x){const b=parseFloat(x&&x.baseTotal)||0;const c=(x&&x.customerChoice&&parseFloat(x.customerChoice.price))||0;return b+c;}
// ═══ 💎 포인트 적립 (RM100 당 RM1) ═══
let PT_START='';   // 📅 적립 적용시작일 (YYYY-MM-DD · 빈값=전체 기간) — settings/points 에 저장, 발행일 기준
// 적립 기준액 : 총 청구금액에서 세금·주차비용·최소청구·추가비용 제외
//             = 품목 소계(품목별 할인 반영) − 전체 할인 − 상품/할인권
// 패키지 회원(회원적립잔액 사용 포함)은 회원적립잔액(creditUse) 차감 「전」 금액 기준
function ptBase(x,pkg){
  let sub=0;(x.items||[]).forEach(it=>{
    const amt=(parseFloat(it.price)||0)*(parseFloat(it.qty)||1);
    const d=it.discType==='pct'?amt*((parseFloat(it.discVal)||0)/100):(parseFloat(it.discVal!=null?it.discVal:it.disc)||0);
    sub+=amt-d;
  });
  const dv=parseFloat(x.discVal)||0;
  const disc=x.discType==='pct'?dv/100*sub:dv;
  const credit=parseFloat(x.creditUse)||0;
  const voucher=parseFloat(x.voucherAmt)||0;
  const ptsUse=parseFloat(x.pointUse)||0;   // 💎 해피포인트로 결제한 금액은 적립 제외
  let b=sub-disc-voucher-ptsUse;
  if(!(pkg||credit>0))b-=credit;   // 패키지(또는 적립잔액 사용) 건은 차감 전 금액
  return Math.max(0,b);
}
function ptEarn(base){return Math.floor((parseFloat(base)||0)/100);}   // RM100 → RM1
// 고객별 포인트 집계 : 「결제완료」 인보이스에서 적립 · 고객 마스터 pt_used 에서 사용 차감
function ptCalc(e){
  const pkg=isPkg(e);
  const earnRows=e.docs.invoices.filter(x=>x.status==='paid'&&!(PT_START&&String(x.date||'')<PT_START)).map(x=>{
    const b=ptBase(x,pkg);return {date:x.date||'',id:x.id||x.__id,base:b,pts:ptEarn(b)};
  }).filter(r=>r.pts>0).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const useRows=((e.master&&e.master.pt_used)||[]).map((u,i)=>({i,date:u.date||'',memo:u.memo||'',pts:Math.floor(parseFloat(u.amount)||0)}))
    .filter(r=>r.pts>0).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  // 인보이스 「요금조정 > 💎 해피포인트 사용」 칸으로 차감된 사용액 (작성중 인보이스 제외)
  const invUseRows=e.docs.invoices.filter(x=>x.status!=='draft'&&(parseFloat(x.pointUse)||0)>0)
    .map(x=>({date:x.date||'',memo:'인보이스 '+(x.id||x.__id)+' 결제 차감',pts:Math.floor(parseFloat(x.pointUse)||0)}))
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  // ✏️ 적립 조정 (수동 +/−)
  const adjRows=((e.master&&e.master.pt_adj)||[]).map((u,i)=>({i,date:u.date||'',memo:u.memo||'',pts:Math.round(parseFloat(u.amount)||0)}))
    .filter(r=>r.pts!==0).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const adjPlus=adjRows.filter(r=>r.pts>0).reduce((a,r)=>a+r.pts,0);
  const adjMinus=adjRows.filter(r=>r.pts<0).reduce((a,r)=>a-r.pts,0);
  const earn=earnRows.reduce((a,r)=>a+r.pts,0)+adjPlus;
  const used=useRows.reduce((a,r)=>a+r.pts,0)+invUseRows.reduce((a,r)=>a+r.pts,0)+adjMinus;
  return {earn,used,bal:earn-used,earnRows,useRows,invUseRows,adjRows,pkg};
}

function invTotal(inv){
  if(inv.grand!=null)return parseFloat(inv.grand)||0;
  if(inv.total!=null)return parseFloat(inv.total)||0;
  let t=0;(inv.items||[]).forEach(it=>{t+=(parseFloat(it.qty)||1)*(parseFloat(it.price)||0);});
  return t;
}
// 기결제(일부 결제) 합계 — paidAmount 우선, 없으면 payments[] 합산
function invPaid(inv){
  if(inv.paidAmount!=null)return parseFloat(inv.paidAmount)||0;
  let t=0;(inv.payments||[]).forEach(p=>{t+=parseFloat(p&&p.amt)||0;});
  return t;
}
// 실제 청구(잔여) 금액 = 총액 - 기결제
function invDue(inv){return Math.max(0,invTotal(inv)-invPaid(inv));}
const INV_ST={paid:['결제완료','ok'],billing:['청구중','warn'],overdue:['연체','bad'],draft:['작성중','blue']};
function inspPage(t){return t==='install'?'install.html':(t==='washer'?'washer.html':'inspect.html');}
function inspLabel(t){return t==='install'?'🔩 설치':(t==='washer'?'🧺 세탁기':(t==='dispatch'?'🚗 출장':'🔍 점검'));}
function pkgLabel(pid){
  if(!pid)return '';
  const biz=/-biz$/.test(pid);
  const base=PKG_LABEL[pid.replace(/-biz$/,'')]||pid;
  return base+(biz?'(사업)':'');
}

function newEntry(name,phone){
  return {master:null,name:name||'',phone:phone||'',aliases:[],linkNames:[],member:'',email:'',addr:'',memo:'',inactive:false,
    docs:{contracts:[],invoices:[],inspections:[],coupons:[],requests:[],bookings:[],schedules:[],quotes:[]}};
}
// ── 고객 1명을 가리키는 고정 키 ──
// 마스터(고객마스터에 등록된 고객)는 문서 ID를, 아니면 이름+연락처 조합을 씁니다.
// 문서에 이 키(ca_link)가 저장돼 있으면 고객명·연락처가 달라도 그 고객에게 붙습니다.
function entryKey(e){
  if(e&&e.master&&e.master.__id)return 'm:'+e.master.__id;
  return 'k:'+nn(e&&e.name)+'#'+pn(e&&e.phone);
}
// ── 문서 「중복 연결」 ──────────────────────────────────
//  · ca_link  (기존·1명)   = 이 문서의 소속 고객 자체를 바꾸는 「이관 연결」
//  · ca_links (신규·여러명) = 원래 고객은 그대로 두고 추가로 함께 보여줄 고객들
function docExtraKeys(x){const a=(x&&x.ca_links);return Array.isArray(a)?a.filter(Boolean):[];}
function docLinkedTo(x,key){return !!key&&((x&&x.ca_link===key)||docExtraKeys(x).indexOf(key)>=0);}
function buildEntries(){
  entries=[];const byP={},byN={};
  const pending=[];   // ca_link(수동 연결)가 지정된 문서 — 모든 고객이 만들어진 뒤에 붙입니다
  const idxName=(e,s)=>{const k=nn(s);if(k&&!byN[k])byN[k]=e;};
  RAW.customers.forEach(m=>{
    const e=newEntry(m.name,m.phone);
    e.master=m;e.aliases=m.aliases||[];e.member=m.member||'';e.email=m.email||'';e.addr=m.addr||'';e.memo=m.memo||'';
    e.inactive=!!m.ca_inactive;   // ⏸ 비활성 고객 (기본 목록에서 숨김)
    entries.push(e);
    const k=pn(m.phone);if(k&&!byP[k])byP[k]=e;
    idxName(e,m.name);(m.aliases||[]).forEach(a=>idxName(e,a));
  });
  function attach(coll,x,name,phone){
    // 수동 연결된 문서는 뒤로 미룹니다 (반환값은 임시 객체 — 목록에 넣지 않습니다)
    if(x.ca_link){pending.push({coll,x,name,phone});return newEntry(name,phone);}
    const pk=pn(phone),nk=nn(name);
    let e=(pk&&byP[pk])||(nk&&byN[nk])||null;
    if(!e){
      e=newEntry(name,phone);entries.push(e);
      if(pk)byP[pk]=e;if(nk&&!byN[nk])byN[nk]=e;
    }else{
      if(!e.phone&&phone)e.phone=phone;
      if(name&&nn(e.name)!==nk&&!e.aliases.some(a=>nn(a)===nk)&&!(e.master&&(e.master.aliases||[]).some(a=>nn(a)===nk)))
        if(nk&&nn(e.name)!==nk)e.aliases=e.aliases.concat([name]);
    }
    e.docs[coll].push(x);
    return e;
  }
  RAW.contracts.forEach(x=>{const e=attach('contracts',x,x.name,x.phone);if(!e.member&&x.package_id)e.member='패키지 - '+pkgLabel(x.package_id);});
  RAW.invoices.forEach(x=>{const c=x.customer||{};const e=attach('invoices',x,c.name,c.phone);if(!e.member&&c.member)e.member=c.member;});
  RAW.inspections.forEach(x=>attach('inspections',x,x.client,x.phone));
  RAW.bookings.forEach(x=>attach('bookings',x,x.customer_name,x.customer_phone));
  RAW.schedules.forEach(x=>{if(x.customer_name||x.customer_phone)attach('schedules',x,x.customer_name,x.customer_phone);});
  RAW.requests.forEach(x=>attach('requests',x,reqName(x),x.phone));
  RAW.quotes.forEach(x=>attach('quotes',x,x.client,x.phone));
  // 상품권: 이름으로만 매칭 (연락처 없음)
  RAW.coupons.forEach(x=>{
    if(x.ca_link){pending.push({coll:'coupons',x,name:x.name||x.receiver,phone:''});return;}
    const k1=nn(x.name),k2=nn(x.receiver);
    let e=(k1&&byN[k1])||(k2&&byN[k2])||null;
    if(!e){e=newEntry(x.name||x.receiver,'');entries.push(e);if(k1&&!byN[k1])byN[k1]=e;}
    e.docs.coupons.push(x);
  });
  // ── 수동 연결(ca_link) 반영 : 고객명·연락처가 달라도 지정한 고객에게 붙입니다 ──
  if(pending.length){
    const byL={};
    entries.forEach(e=>{
      byL[entryKey(e)]=e;
      // 연결 당시 미등록이던 고객이 나중에 고객마스터에 등록돼도
      // 기존 연결이 끊기지 않도록 이름+연락처 키도 함께 인식합니다.
      const alt='k:'+nn(e.name)+'#'+pn(e.phone);
      if(byL[alt]===undefined)byL[alt]=e;
    });
    pending.forEach(it=>{
      let e=byL[it.x.ca_link];
      if(!e){
        // 연결 대상 고객이 사라진 경우 → 원래 이름·연락처 기준으로 되돌립니다
        const pk=pn(it.phone),nk=nn(it.name);
        e=(pk&&byP[pk])||(nk&&byN[nk])||null;
        if(!e){
          e=newEntry(it.name,it.phone);entries.push(e);
          if(pk)byP[pk]=e;if(nk&&!byN[nk])byN[nk]=e;
          byL[entryKey(e)]=e;
        }
      }else{
        // 문서에 적힌 이름이 다르면 「연결 문서명」으로 따로 기록해 검색이 되게 합니다.
        // (고객마스터의 별칭에는 넣지 않습니다 → 일괄 변경 대상에서 계속 제외됩니다)
        const nk=nn(it.name);
        if(nk&&nn(e.name)!==nk&&!e.aliases.some(a=>nn(a)===nk)&&!e.linkNames.some(a=>nn(a)===nk))
          e.linkNames=e.linkNames.concat([it.name]);
      }
      e.docs[it.coll].push(it.x);
      if(it.coll==='contracts'&&!e.member&&it.x.package_id)e.member='패키지 - '+pkgLabel(it.x.package_id);
      if(it.coll==='invoices'&&!e.member&&it.x.customer&&it.x.customer.member)e.member=it.x.customer.member;
    });
  }
  // ── 중복 연결(ca_links) 반영 : 원래 고객은 그대로 두고 추가 고객에게도 함께 표시 ──
  (function(){
    const COLLS=['contracts','invoices','inspections','bookings','schedules','requests','quotes','coupons'];
    const ex=[];
    COLLS.forEach(c=>{(RAW[c]||[]).forEach(x=>{if(docExtraKeys(x).length)ex.push({coll:c,x:x});});});
    if(!ex.length)return;
    const byL2={};
    entries.forEach(e=>{
      byL2[entryKey(e)]=e;
      const alt='k:'+nn(e.name)+'#'+pn(e.phone);
      if(byL2[alt]===undefined)byL2[alt]=e;
    });
    ex.forEach(it=>{
      docExtraKeys(it.x).forEach(k=>{
        const e=byL2[k];if(!e)return;
        const arr=e.docs[it.coll];if(!arr||arr.indexOf(it.x)>=0)return;
        arr.push(it.x);
        const on=docOwnerName(it.coll,it.x),nk=nn(on);
        if(nk&&nn(e.name)!==nk&&!e.aliases.some(a=>nn(a)===nk)&&!e.linkNames.some(a=>nn(a)===nk))
          e.linkNames=e.linkNames.concat([on]);
        if(it.coll==='contracts'&&!e.member&&it.x.package_id)e.member='패키지 - '+pkgLabel(it.x.package_id);
        if(it.coll==='invoices'&&!e.member&&it.x.customer&&it.x.customer.member)e.member=it.x.customer.member;
      });
    });
  })();
  entries.forEach(e=>{e.ts=entryTime(e);});
  sortEntries();
  // 병합 제안: 이름(또는 별칭)이 같은 서로 다른 항목
  mergeSug=[];
  const nameMap={};
  entries.forEach(e=>{
    const keys=[nn(e.name)].concat(e.aliases.map(nn)).filter(Boolean);
    keys.forEach(k=>{(nameMap[k]=nameMap[k]||[]).push(e);});
  });
  const seen=new Set();
  Object.keys(nameMap).forEach(k=>{
    const arr=[...new Set(nameMap[k])];
    if(arr.length>1){
      const pair=arr.slice(0,2);
      if(mgDismiss[mgPairKey(pair[0],pair[1])])return;   // 이미 「다른 고객」 처리한 쌍
      const key=arr.map(e=>entries.indexOf(e)).sort().join('-');
      if(!seen.has(key)){seen.add(key);mergeSug.push(pair);}
    }
  });
}
// ── 문서 1건의 「작성 시각」 : created_at 계열이 있으면 그것을, 없으면 날짜 필드를 사용 ──
function docTS(coll,x){
  const c=x.created_at||x.createdAt||x.created||x.updated_at||'';
  if(c)return String(c);
  if(coll==='contracts')return String(x.contract_date||'');
  if(coll==='bookings')return String(x.booking_date||'');
  if(coll==='coupons')return String(x.issuedAt||'');
  if(coll==='quotes')return String(x.issueDate||x.date||'');
  return String(x.date||'');
}
// 고객 1명의 「최근 작성」 = 고객 등록 시각과 모든 문서 작성 시각 중 가장 최신 값
function entryTime(e){
  let t=String((e.master&&(e.master.created_at||e.master.createdAt))||'');
  Object.keys(e.docs).forEach(coll=>{
    e.docs[coll].forEach(x=>{const v=docTS(coll,x);if(v>t)t=v;});
  });
  return t;
}
function sortEntries(){
  const byName=(a,b)=>(a.name||'').localeCompare(b.name||'','ko');
  if(curSort==='recent')      entries.sort((a,b)=>String(b.ts||'').localeCompare(String(a.ts||''))||byName(a,b));
  else if(curSort==='oldest') entries.sort((a,b)=>{
    const at=String(a.ts||''),bt=String(b.ts||'');
    if(!at&&!bt)return byName(a,b);
    if(!at)return 1;          // 작성 시각을 알 수 없는 건은 항상 뒤로
    if(!bt)return -1;
    return at.localeCompare(bt)||byName(a,b);
  });
  else if(curSort==='docs')   entries.sort((a,b)=>(docCount(b)-docCount(a))||byName(a,b));
  else                        entries.sort(byName);
}
window.setSort=function(v){
  curSort=v;try{localStorage.setItem('hhc_ca_sort',v);}catch(e){}
  sortEntries();renderList();
};
function docCount(e){return Object.values(e.docs).reduce((a,arr)=>a+arr.length,0);}
function isPkg(e){return /^패키지/.test(e.member||'')||e.docs.contracts.length>0;}
function isVVIP(e){return (e.member||'').toUpperCase()==='VVIP';}

// ═══ 렌더 ═══
const SRC_DEF=[['contracts','계약','ct'],['invoices','인보이스','iv'],['inspections','점검','ip'],['coupons','상품권','cp'],['bookings','예약','bk'],['requests','의뢰','rq'],['quotes','견적','qt'],['schedules','스케줄','sc']];
function renderAll(){renderStats();renderChips();renderMerge();renderList();}
function renderStats(){
  const act=entries.filter(e=>!e.inactive);      // 통계는 활성 고객 기준
  const total=act.length;
  const pkg=act.filter(isPkg).length;
  const vvip=act.filter(isVVIP).length;
  const noph=act.filter(e=>!pn(e.phone)).length;
  const inact=entries.length-total;
  document.getElementById('stats').innerHTML=
    '<div class="st"><b>'+total+'</b>전체 고객</div>'+
    '<div class="st"><b>'+pkg+'</b>📦 패키지</div>'+
    '<div class="st"><b>'+vvip+'</b>👑 VVIP</div>'+
    '<div class="st"><b>'+mergeSug.length+'</b>병합 제안</div>'+
    '<div class="st"><b>'+noph+'</b>연락처 없음</div>'+
    '<div class="st" style="cursor:pointer;color:#64748b" onclick="setFilter(\'inactive\')"><b>'+inact+'</b>⏸ 비활성</div>';
}
const FILTERS=[['all','전체'],['contract','📑 계약'],['package','📦 패키지'],['vvip','👑 VVIP'],['invoice','💳 인보이스'],['inspect','🔧 점검'],['coupon','🎫 상품권'],['quote','🧾 견적'],['nophone','연락처 없음'],['inactive','⏸ 비활성']];
function renderChips(){
  document.getElementById('chips').innerHTML=FILTERS.map(f=>
    '<span class="chip'+(curFilter===f[0]?' on':'')+'" onclick="setFilter(\''+f[0]+'\')">'+f[1]+'</span>').join('');
}
window.setFilter=function(f){curFilter=f;renderChips();renderList();};
function passFilter(e){
  // ⏸ 비활성 고객은 「⏸ 비활성」 목록에서만 보입니다
  if(curFilter==='inactive')return !!e.inactive;
  if(e.inactive)return false;
  switch(curFilter){
    case 'contract':return e.docs.contracts.length>0;
    case 'package':return isPkg(e);
    case 'vvip':return isVVIP(e);
    case 'invoice':return e.docs.invoices.length>0;
    case 'inspect':return e.docs.inspections.length>0;
    case 'coupon':return e.docs.coupons.length>0;
    case 'quote':return e.docs.quotes.length>0;
    case 'nophone':return !pn(e.phone);
    default:return true;
  }
}
function renderMerge(){
  const host=document.getElementById('merge-host');
  if(!mergeSug.length){host.innerHTML='';return;}
  host.innerHTML=mergeSug.slice(0,3).map((pair,i)=>{
    const [a,b]=pair;
    return '<div class="mergebar">⚠️ <b>'+esc(a.name)+'</b>'+(pn(a.phone)?' ('+esc(a.phone)+')':'')+' 과 <b>'+esc(b.name)+'</b>'+(pn(b.phone)?' ('+esc(b.phone)+')':'')+' — 같은 고객인가요?'+
      '<span class="mb"><button class="btn sm" onclick="dismissMerge('+i+')">다른 고객</button><button class="btn sm p" onclick="doMerge('+i+')">🔗 병합</button></span></div>';
  }).join('');
}
window.dismissMerge=function(i){
  const pair=mergeSug[i];
  if(pair){
    mgDismiss[mgPairKey(pair[0],pair[1])]=1;
    try{localStorage.setItem(MG_DISMISS_KEY,JSON.stringify(mgDismiss));}catch(e){}
  }
  mergeSug.splice(i,1);renderMerge();renderStats();
  toast('✓ 다른 고객으로 기억했습니다 — 다시 제안하지 않습니다');
};
function memberBadge(e){
  if(isVVIP(e))return '<span class="pill gold">👑 VVIP</span>';
  if(/^패키지/.test(e.member||''))return '<span class="pill blue">📦 '+esc(e.member)+'</span>';
  if(e.docs.contracts.length)return '<span class="pill blue">📦 패키지(계약)</span>';
  return '';
}
function renderList(){
  sortEntries();
  const qRaw=document.getElementById('q').value.trim();
  const q=sn(qRaw);
  const qNum=qRaw.replace(/[^0-9]/g,'');
  const list=entries.filter(e=>{
    if(!passFilter(e))return false;
    if(!q&&!qNum)return true;
    if(q&&sn(e.name).includes(q))return true;
    if(q&&e.aliases.some(a=>sn(a).includes(q)))return true;
    if(q&&(e.linkNames||[]).some(a=>sn(a).includes(q)))return true;
    if(q&&sn(e.addr).includes(q))return true;
    const qPn=pn(qRaw);
    if(qPn.length>=3&&pn(e.phone).includes(qPn))return true;
    if(qNum.length>=4&&String(e.phone||'').replace(/[^0-9]/g,'').includes(qNum))return true;
    return false;
  });
  const host=document.getElementById('list');
  if(!list.length){host.innerHTML='<div class="empty">표시할 고객이 없습니다.</div>';return;}
  host.innerHTML=list.map(e=>{
    const idx=entries.indexOf(e);
    const init=(e.name||'?').trim().charAt(0).toUpperCase();
    const srcs=SRC_DEF.filter(s=>e.docs[s[0]].length).map(s=>'<span class="src '+s[2]+'">'+s[1]+' '+e.docs[s[0]].length+'</span>').join('');
    const _pt=ptCalc(e);   // 💎 포인트 잔액 배지
    return '<div class="crow"'+(e.inactive?' style="opacity:.64;background:#f8fafc"':'')+'>'+
      '<div class="avatar"'+(e.inactive?' style="filter:grayscale(1)"':'')+'>'+esc(init)+'</div>'+
      '<div><div class="cnm">'+esc(e.name||'(이름 없음)')+(e.aliases.length?'<span class="alias">별칭: '+esc(e.aliases.join(', '))+'</span>':'')+((e.linkNames||[]).length?'<span class="alias" style="background:#f5f3ff;color:#5B21B6">🔗 '+esc(e.linkNames.join(', '))+'</span>':'')+memberBadge(e)+(_pt.bal>0?'<span class="pill pt">💎 RM '+_pt.bal.toLocaleString()+'</span>':'')+(e.inactive?'<span class="pill" style="background:#f1f5f9;color:#64748b">⏸ 비활성</span>':'')+(e.master?'':'<span class="pill vio">미등록</span>')+'</div>'+
      '<div class="cph">📞 '+(pn(e.phone)?esc(e.phone):'연락처 없음 <span class="pill warn">보완 필요</span>')+(e.addr?' · '+esc(e.addr):'')+'</div>'+
      '<div class="srcs">'+(srcs||'<span class="src qt">기록 없음</span>')+(e.ts?'<span class="src" style="background:#f3f4f6;color:#6b7280">🕘 '+esc(String(e.ts).slice(0,10))+'</span>':'')+'</div></div>'+
      '<div class="cbtns"><button class="btn sm p" onclick="openDrawer('+idx+')">상세 보기</button><button class="btn sm" onclick="openEditModal('+idx+')">✏️ 수정</button>'+
        (e.inactive
          ?'<button class="btn sm" style="color:#047857;border-color:#6EE7B7;background:#ECFDF5" onclick="caToggleInactive('+idx+')">▶️ 활성 복구</button>'
          :'<button class="btn sm" style="color:#64748b" onclick="caToggleInactive('+idx+')">⏸ 비활성</button>')+
        (e.master?'<button class="btn sm" style="color:var(--bad);border-color:#fca5a5" onclick="caDelCustomer('+idx+')">✕ 삭제</button>':'')+'</div>'+
      '</div>';
  }).join('');
}

    return '<div class="drow"'+(qtExp?' style="opacity:.6;background:#f8fafc"':'')+'><span class="id">'+esc(x.qno||'견적')+'</span>'+
      (qtExp?'<span class="pill" style="background:#f1f5f9;color:#64748b">⏹ 기한 만료</span>':'<span class="pill ok">✅ 유효</span>')+
      '<span class="pill blue">'+fmtRM(qtTotal(x))+'</span>'+
      '<span class="m">'+esc(x.issueDate||'')+(x.subject?' · '+esc(x.subject):'')+(x.validUntil?' · 유효 ~'+esc(x.validUntil):'')+'</span>'+
      '<a class="open-btn" target="_blank" rel="noopener" data-t="🧾 견적서 '+esc(x.qno||'')+'" href="'+BASE+'/quote.html?id='+encodeURIComponent(x.__id)+'" onclick="return caView(this.href,this.dataset.t,event)">↗ 열기</a>'+rowBtns('quotes',x.__id)+'</div>';
  }).join(''):'<div class="dnone">견적서 없음</div>';
  h+='</div>';
  // 요약
  h+='<div class="mini">'+
    '<div class="mc"><b>'+e.docs.requests.length+'</b>📥 의뢰</div>'+
    '<div class="mc"><b>'+e.docs.bookings.length+'</b>🗓️ 예약</div>'+
    '<div class="mc"><b>'+e.docs.schedules.length+'</b>📅 스케줄</div></div>';
  // 기타 기록 — 의뢰·예약·스케줄도 항목별 삭제 가능
  const etcRows=[];
  [['requests','📥'],['bookings','🗓️'],['schedules','📅']].forEach(pair=>{
    e.docs[pair[0]].forEach(x=>etcRows.push({coll:pair[0],ic:pair[1],x}));
  });
  if(etcRows.length){
    h+='<div class="dcard"><div class="dcard-h">📂 기타 기록 (의뢰·예약·스케줄)<span class="cnt">'+etcRows.length+'건</span></div>';
    h+=etcRows.map(r=>'<div class="drow"><span class="id">'+r.ic+'</span><span class="m">'+esc(docSummary(r.coll,r.x))+'</span>'+
      '<button class="rb del" style="margin-left:auto" onclick="caDocDel(\''+r.coll+'\',\''+r.x.__id+'\')">✕ 삭제</button></div>').join('');
    h+='</div>';
  }
  d.innerHTML=h;

  d.classList.add('open');
};

// ═══ 문서 뷰어 오버레이 ═══
// 인보이스·점검보고서·계약서·상품권을 앱 안에서 열고, 닫으면 고객 상세 화면으로 그대로 복귀한다.
let dvOpen=false, dvPushed=false;
window.caView=function(url,title,ev){
  if(ev&&(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.button===1))return true; // 새 탭으로 열기는 그대로 허용
  const w=document.getElementById('dv-wrap');if(!w)return true;
  document.getElementById('dv-ttl').textContent=title||'문서';
  const nb=document.getElementById('dv-new');if(nb)nb.href=url;
  // iframe은 열 때마다 새로 만든다 — src 교체는 브라우저 히스토리를 오염시켜 뒤로가기가 어긋난다.
  const host=document.getElementById('dv-body');
  host.innerHTML='';
  const f=document.createElement('iframe');
  f.id='dv-frame';
  f.setAttribute('title','문서 보기');
  f.setAttribute('allow','clipboard-write; clipboard-read');
  f.onload=function(){
    // 문서 페이지가 스스로 창을 닫으려 하면(×·뒤로) 앱이 아니라 오버레이만 닫히도록 가로챈다.
    try{
      const cw=f.contentWindow;
      cw.close=function(){window.caViewClose();};
      cw.history.back=function(){window.caViewClose();};
      cw.addEventListener('keydown',function(k){if(k.key==='Escape')window.caViewClose();});
    }catch(_){ }
  };
  f.src=url;
  host.appendChild(f);
  w.classList.add('open');
  dvOpen=true;
  document.body.style.overflow='hidden';
  try{history.pushState({dv:1},'');dvPushed=true;}catch(_){dvPushed=false;}
  return false;
};
window.caViewClose=function(fromPop){
  const w=document.getElementById('dv-wrap');
  if(!w||!w.classList.contains('open'))return;
  w.classList.remove('open');
  const host=document.getElementById('dv-body');
  if(host)host.innerHTML='';
  dvOpen=false;
  document.body.style.overflow='';
  if(!fromPop&&dvPushed){dvPushed=false;try{history.back();}catch(_){ }}
  else dvPushed=false;
};
window.addEventListener('popstate',function(){if(dvOpen)window.caViewClose(true);});
document.addEventListener('keydown',function(k){if(k.key==='Escape'&&dvOpen)window.caViewClose();});

window.saveEdit=async function(){
  const name=document.getElementById('em-name').value.trim();
  const phone=document.getElementById('em-phone').value.trim();
  const member=document.getElementById('em-member').value;
  const aliases=document.getElementById('em-alias').value.split(',').map(x=>x.trim()).filter(Boolean);
  const email=document.getElementById('em-email').value.trim();
  const addr=document.getElementById('em-addr').value.trim();
  const memo=document.getElementById('em-memo').value.trim();
  if(!name){toast('고객명을 입력해주세요');return;}
  if(!db){toast('Firebase 연결 중입니다');return;}
  const now=new Date().toISOString();
  // ── 신규 등록 ──
  if(!editTarget){
    const typedPN=pn(phone);
    const nameHit=caFindByName(name);
    if(nameHit&&typedPN&&pn(nameHit.phone)&&pn(nameHit.phone)!==typedPN){
      const choice=await caPhoneConfirm(nameHit,phone);
      if(!choice)return;
      if(choice.action==='use_existing'){
        toast('기존 고객 정보를 그대로 사용합니다: '+nameHit.name);
        closeEdit();return;
      }
      if(choice.action==='use_new'){
        await applyEdit(nameHit,{name:nameHit.name,phone,member:nameHit.member||'',email:nameHit.email||'',addr:nameHit.addr||'',memo:nameHit.memo||'',aliases:nameHit.aliases||[]},true);
        return;
      }
      // action==='separate' → 동명이인, 아래에서 신규 등록을 계속 진행
    }
    const dup=entries.find(x=>pn(phone)&&pn(x.phone)===pn(phone));
    if(dup&&!confirm('같은 연락처의 고객('+dup.name+')이 이미 있습니다. 그래도 새로 등록할까요?'))return;
    try{
      await addDoc(collection(db,'customers'),{id:'c'+Date.now(),name,phone,member,email,addr,memo,aliases,created_at:now,updated_at:now});
      toast('✓ 신규 고객이 등록되었습니다');
      closeEdit();loadAll(true);
    }catch(err){toast('등록 실패: '+err.message);}
    return;
  }
  // ── 수정 ──
  const e=editTarget;
  const oldName=e.name,oldPhone=e.phone;
  const nameChanged=name!==oldName,phoneChanged=pn(phone)!==pn(e.phone)&&pn(oldPhone);
  if((nameChanged||phoneChanged)&&docCount(e)>0){
    showPropModal(e,{name,phone,member,email,addr,memo,aliases});
    return;
  }
  await applyEdit(e,{name,phone,member,email,addr,memo,aliases},false);
};
async function applyEdit(e,v,propagate){
  const now=new Date().toISOString();
  try{
    let als=(v.aliases!=null)?v.aliases.slice():(e.master&&e.master.aliases||e.aliases||[]).slice();
    if(v.name!==e.name&&e.name&&!als.some(a=>nn(a)===nn(e.name)))als.push(e.name);
    als=als.filter(a=>nn(a)!==nn(v.name));
    if(e.master&&e.master.__id){
      await updateDoc(doc(db,'customers',e.master.__id),{name:v.name,phone:v.phone,member:v.member,email:v.email,addr:v.addr,memo:v.memo,aliases:als,updated_at:now});
    }else{
      await addDoc(collection(db,'customers'),{id:'c'+Date.now(),name:v.name,phone:v.phone,member:v.member,email:v.email,addr:v.addr,memo:v.memo,aliases:als,created_at:now,updated_at:now});
    }
    if(propagate)await propagateDocs(e,v);
    toast('✓ 저장되었습니다'+(propagate?' — 전 프로그램 반영 완료':''));
    closeEdit();closeProp();closeDrawer();loadAll(true);
  }catch(err){toast('저장 실패: '+err.message);}
}
// 전파 대상 정의: [컬렉션, 라벨, 매칭(문서,이름셋,pn), 변경필드(이름변경,번호변경)]
function propPlan(e,v){
  const names=[nn(e.name)].concat(e.aliases.map(nn)).filter(Boolean);
  const op=pn(e.phone);
  // 🔗 수동 연결(ca_link)된 문서는 고객명·연락처를 「그대로 유지」하기로 한 문서이므로
  //    고객 정보를 수정해도 일괄 변경 대상에서 제외합니다.
  const notLinked=x=>!x.ca_link;
  const hitP=x=>op&&pn(x)===op;
  const hitN=s=>names.includes(nn(s));
  const nameChanged=v.name!==e.name, phoneChanged=pn(v.phone)!==pn(e.phone);
  const plan=[];
  const add=(coll,label,docs,upd)=>{if(docs.length)plan.push({coll,label,docs,upd});};
  add('contracts','📑 계약서',RAW.contracts.filter(x=>notLinked(x)&&(hitP(x.phone)||hitN(x.name))),
    x=>{const u={};if(nameChanged)u.name=v.name;if(phoneChanged||!pn(x.phone))u.phone=v.phone;return u;});
  add('invoices','💳 인보이스',RAW.invoices.filter(x=>{if(!notLinked(x))return false;const c=x.customer||{};return hitP(c.phone)||hitN(c.name);}),
    x=>{const u={};if(nameChanged)u['customer.name']=v.name;if(phoneChanged||!pn((x.customer||{}).phone))u['customer.phone']=v.phone;return u;});
  add('inspections','🔧 점검보고서',RAW.inspections.filter(x=>notLinked(x)&&(hitP(x.phone)||hitN(x.client))),
    x=>{const u={};if(nameChanged)u.client=v.name;if(phoneChanged||!pn(x.phone))u.phone=v.phone;return u;});
  add('bookings','🗓️ 예약',RAW.bookings.filter(x=>notLinked(x)&&(hitP(x.customer_phone)||hitN(x.customer_name))),
    x=>{const u={};if(nameChanged)u.customer_name=v.name;if(phoneChanged||!pn(x.customer_phone))u.customer_phone=v.phone;return u;});
  add('schedules','📅 스케줄',RAW.schedules.filter(x=>notLinked(x)&&(hitP(x.customer_phone)||hitN(x.customer_name))),
    x=>{const u={};if(nameChanged)u.customer_name=v.name;if(phoneChanged||!pn(x.customer_phone))u.customer_phone=v.phone;return u;});
  add('requests','📥 의뢰',RAW.requests.filter(x=>notLinked(x)&&hitP(x.phone)),
    x=>{const u={};if(phoneChanged)u.phone=v.phone;return u;});
  add('quotes','🧾 견적서',RAW.quotes.filter(x=>notLinked(x)&&(hitP(x.phone)||hitN(x.client))),
    x=>{const u={};if(nameChanged)u.client=v.name;if(phoneChanged||!pn(x.phone))u.phone=v.phone;return u;});
  add('coupons','🎫 상품권',RAW.coupons.filter(x=>notLinked(x)&&(hitN(x.name)||hitN(x.receiver))),
    x=>{const u={};if(nameChanged){if(hitN(x.name))u.name=v.name;if(hitN(x.receiver))u.receiver=v.name;}return u;});
  return plan.filter(p=>p.docs.some(x=>Object.keys(p.upd(x)).length));
}
let curProp=null;
function showPropModal(e,v){
  const plan=propPlan(e,v);
  curProp={e,v,plan};
  const total=plan.reduce((a,p)=>a+p.docs.length,0);
  let h='';
  if(pn(v.phone)!==pn(e.phone))h+='<div class="cmp"><div><small>현재 연락처</small><b>'+esc(e.phone||'(없음)')+'</b></div><div>→</div><div><small>변경</small><b style="color:var(--pri)">'+esc(v.phone||'(없음)')+'</b></div></div>';
  if(v.name!==e.name)h+='<div class="cmp"><div><small>현재 이름</small><b>'+esc(e.name)+'</b></div><div>→</div><div><small>변경</small><b style="color:var(--pri)">'+esc(v.name)+'</b></div></div>';
  h+='<p style="font-size:12.5px;color:var(--ink2);line-height:1.7;margin-bottom:11px">아래 문서가 함께 변경됩니다.<br><span style="font-size:11.5px;color:var(--ink3)">🔗 수동으로 연결한 문서는 원본 고객명·연락처를 유지하기 위해 제외됩니다.</span></p>';
  h+=plan.map(p=>'<div class="prop-row"><span class="id">'+p.label+'</span><span class="m">'+p.docs.length+'건</span></div>').join('')||'<div class="dnone">변경 대상 문서 없음</div>';
  document.getElementById('prop-body').innerHTML=h;
  document.getElementById('prop-go').textContent='총 '+total+'건 변경 실행';
  document.getElementById('prop-mask').classList.add('open');
}
window.closeProp=function(){document.getElementById('prop-mask').classList.remove('open');curProp=null;};
document.getElementById('prop-go').addEventListener('click',async()=>{
  if(!curProp)return;
  const btn=document.getElementById('prop-go');btn.disabled=true;btn.textContent='변경 중...';
  await applyEdit(curProp.e,curProp.v,true);
  btn.disabled=false;
});
async function propagateDocs(e,v){
  const plan=propPlan(e,v);
  for(const p of plan){
    for(const x of p.docs){
      const u=p.upd(x);
      if(!Object.keys(u).length)continue;
      try{await updateDoc(doc(db,p.coll,x.__id),u);}catch(err){console.warn(p.coll,x.__id,err.message);}
    }
  }
}

// ═══ 신규 고객 등록 시 동일 인물(다른 연락처) 검사 ═══
// 이름(별칭 포함)이 일치하는 고객이 이미 있고 연락처가 다르면 확인 팝업을 띄워
// 어떤 번호를 쓸지 선택하게 한다. "새 번호로 변경"을 고르면 계약서·인보이스·
// 점검보고서·예약·의뢰·견적·상품권 등 전 프로그램의 이 고객 기록에 즉시 반영된다.
function caFindByName(nm){
  const k=nn(nm);if(!k)return null;
  return entries.find(x=>nn(x.name)===k||(x.aliases||[]).some(a=>nn(a)===k))||null;
}
function caPhoneConfirm(m,typedPhone){
  return new Promise(res=>{
    const mk=genericModal('📞 연락처가 서로 다릅니다',
      '<p style="font-size:12.5px;color:var(--ink2);line-height:1.7;margin-bottom:11px"><b>'+esc(m.name)+'</b> 고객은 이미 다른 연락처로 등록되어 있습니다. 어떻게 할까요?</p>'+
      '<div class="cmp"><div><small>기존 연락처</small><b>'+esc(m.phone||'(없음)')+'</b></div><div>→</div><div><small>지금 입력한 연락처</small><b style="color:var(--pri)">'+esc(typedPhone)+'</b></div></div>'+
      '<button type="button" class="pc-opt" data-a="use_existing"><b>기존 번호 사용</b><span>지금 입력한 번호 대신 '+esc(m.phone||'')+' 를 그대로 씁니다.</span></button>'+
      '<button type="button" class="pc-opt" data-a="use_new"><b>새 번호로 변경 — 모든 프로그램 반영</b><span>계약서·인보이스·점검보고서·예약·의뢰·견적·상품권의 이 고객 기록이 모두 새 번호로 업데이트됩니다.</span></button>'+
      '<button type="button" class="pc-opt" data-a="separate"><b>다른 고객으로 저장</b><span>동명이인입니다. 연결하지 않고 별도 고객으로 등록합니다.</span></button>',
      '<button class="btn" data-a="cancel">저장 취소</button>');
    mk.addEventListener('click',ev=>{
      const b=ev.target.closest('[data-a]');if(!b)return;
      const a=b.dataset.a;mk.remove();
      res(a==='cancel'?null:{action:a});
    });
  });
}

// ── ⏸ 비활성 전환 / ▶️ 활성 복구 ──
window.caToggleInactive=async function(idx){
  const e=entries[idx];if(!e)return;
  if(!db){toast('Firebase 연결 중입니다');return;}
  const on=!e.inactive;   // true → 비활성으로 전환
  if(on&&!confirm('「'+e.name+'」 고객을 비활성으로 변경할까요?\n\n· 기본 목록·통계에서 숨겨지고 「⏸ 비활성」 목록에서만 보입니다.\n· 인보이스·계약서·점검보고서·견적서 등 문서는 그대로 보관됩니다.\n· 언제든지 「▶️ 활성 복구」로 되돌릴 수 있습니다.'))return;
  try{
    let mid=e.master&&e.master.__id;
    // 문서에서 자동 집계된 고객이면 먼저 고객 마스터에 등록합니다
    if(!mid){
      const now=new Date().toISOString();
      const ref=await addDoc(collection(db,'customers'),{id:'c'+Date.now(),name:e.name,phone:e.phone||'',member:e.member||'',email:'',addr:e.addr||'',memo:'',aliases:e.aliases||[],created_at:now,updated_at:now});
      mid=ref.id;
      toast('👥 고객 마스터에 자동 등록되었습니다');
    }

// ═══ 고객 마이페이지 발송 ═══
window.caSendModal=async function(idx){
  const e=entries[idx];if(!e)return;
  let mid=e.master&&e.master.__id;
  // 마스터 미등록 고객이면 자동 등록 후 발송
  if(!mid){
    try{
      const now=new Date().toISOString();
      const ref=await addDoc(collection(db,'customers'),{id:'c'+Date.now(),name:e.name,phone:e.phone||'',member:e.member||'',email:'',addr:e.addr||'',memo:'',aliases:e.aliases||[],created_at:now,updated_at:now});
      mid=ref.id;
      e.master={__id:mid,name:e.name,phone:e.phone,aliases:e.aliases||[]};
      toast('👥 고객 마스터에 자동 등록되었습니다');
    }catch(err){toast('고객 등록 실패: '+err.message);return;}
  }
  const D=e.docs||{};
  const CNT={iv:(D.invoices||[]).length,ip:(D.inspections||[]).length,ct:(D.contracts||[]).length,cp:(D.coupons||[]).length};
  // 작성 대기중인 예약 신청서 (예약등록에서 고객 링크만 만들고 고객이 아직 작성 전인 건)
  // → 마이페이지 상단에 예약 신청 화면이 표시되므로, 발송 템플릿도 자동으로 「예약 신청 안내」를 고른다
  const BKP=(D.bookings||[]).filter(x=>x.status==='waiting');
  const _td=new Date();
  const _p2=n=>String(n).padStart(2,'0');
  const _tdy=_td.getFullYear()+'-'+_p2(_td.getMonth()+1)+'-'+_p2(_td.getDate());
  // 확정된 예약 (「예약 확정 안내」 발송용) — 아직 방문 전인 예약을 먼저, 그다음 최근 방문 순
  const BKC=(D.bookings||[]).filter(x=>x.status==='confirmed').sort((a,b)=>{
    const da=String(a.booking_date||''),db2=String(b.booking_date||'');
    const fa=(da>=_tdy)?0:1,fb=(db2>=_tdy)?0:1;
    if(fa!==fb)return fa-fb;
    return fa===0?da.localeCompare(db2):db2.localeCompare(da);
  });
  // 「오전 9시」·「14:00」·「09:00|11:00」 등 자유형식 방문시간 → 분 단위 (시간 미정이면 그날 마지막까지 유효)
  const _nowMin=_td.getHours()*60+_td.getMinutes();
  const _bkMin=v=>{
    const raw=String(v==null?'':v).trim();if(!raw)return 1439;
    const t=raw.indexOf('|')>=0?(raw.split('|')[0]||raw):raw;
    const pm=/오후|저녁|p\.?m\.?/i.test(t), am=/오전|아침|a\.?m\.?/i.test(t);
    let m=t.match(/(\d{1,2})\s*[:시]\s*(\d{1,2})?/);
    if(!m){const d=t.match(/(\d{1,2})/);if(!d)return 1439;m=[null,d[1],null];}
    let h=parseInt(m[1],10)||0;const mi=parseInt(m[2]||'0',10)||0;
    if(pm&&h<12)h+=12;if(am&&h===12)h=0;
    return h*60+mi;
  };
  // 아직 방문 시간이 지나지 않은 확정 예약 — 방문 시간이 지나면 「예약 확정 안내」는 자동으로 사라집니다
  const BKCU=BKC.filter(x=>{
    const d=String(x.booking_date||'');
    if(!d)return false;
    if(d>_tdy)return true;
    if(d<_tdy)return false;
    return _bkMin(x.booking_time)>_nowMin;
  });
  // 접수된 서비스 의뢰 (「의뢰 접수 안내」 발송용) — 최근 접수 순
  // 접수 이후에 예약이 확정된 의뢰는 이미 처리된 건이므로 목록에서 제외합니다
  const _rqDone=rd=>{
    if(!BKC.length)return false;
    if(!rd)return true;
    return BKC.some(b=>String(b.booking_date||'')>=rd||String(b.created_at||'').slice(0,10)>=rd);
  };
  const RQP=(D.requests||[]).slice()
    .filter(x=>!_rqDone(String(x.submitted_at||x.created_at||'').slice(0,10)))
    .sort((a,b)=>String(b.submitted_at||b.created_at||'').localeCompare(String(a.submitted_at||a.created_at||'')));
  // 발송 가능한 쿠폰 — 사용/만료되지 않은 것만, 최근 발급 순
  const _cpSort=a=>a.slice().sort((x,y)=>String(y.createdAt||y.issuedAt||'').localeCompare(String(x.createdAt||x.issuedAt||'')));
  const _cpLive=(D.coupons||[]).filter(x=>String(x.status||'active')!=='used'&&!(x.expiry&&String(x.expiry)<_tdy));
  const CPG=_cpSort(_cpLive.filter(x=>x.type!=='discount'));   // 상품권
  const CPD=_cpSort(_cpLive.filter(x=>x.type==='discount'));   // 할인권
  // 점검보고서 · 계약서 발송용 — 최근 순
  const IPS=(D.inspections||[]).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const CTS=(D.contracts||[]).slice().sort((a,b)=>String(b.contract_date||'').localeCompare(String(a.contract_date||'')));
  // 견적서 발송용 — 최근 작성 순 (기한이 지난 견적서도 다시 보낼 수 있도록 모두 포함)
  const QTS=(D.quotes||[]).slice().sort((a,b)=>String(b.issueDate||'').localeCompare(String(a.issueDate||'')));
  const state={iv:CNT.iv>0,ip:CNT.ip>0,ct:CNT.ct>0,cp:CNT.cp>0,en:false,tpl:BKP.length?'bk':(BKCU.length?'bkc':'basic'),
    cpi:{cpg:0,cpd:0,ins:0,ct:0,qt:0},
    payDate:_td.getFullYear()+'-'+_p2(_td.getMonth()+1)+'-'+_p2(_td.getDate())};
  const _cpSpan=(CPG.length&&CPD.length)?'':'grid-column:1/-1;';
  const _icSpan=(IPS.length&&CTS.length)?'':'grid-column:1/-1;';
  const OPT=[['iv','💳','인보이스','건'],['ip','🔧','점검보고서','건'],['ct','📑','계약서 · 잔액','건'],['cp','🎫','상품권','장']];
  const mk=genericModal('📤 마이페이지 발송 — '+esc(e.name),

  function ctBal(c){
    const paid=parseFloat(c.amount_paid)||0;
    const bonus=(parseFloat(c.bonus_credit)||0)+(parseFloat(c.special_bonus_credit)||0);
    const total=paid+bonus;
    let h=[];try{h=typeof c.usage_history==='string'?JSON.parse(c.usage_history||'[]'):(c.usage_history||[]);}catch(_){h=[];}
    const used=h.reduce((a,u)=>a+(parseFloat(u.amount)||0),0);
    const disc=h.reduce((a,u)=>a+(parseFloat(u.discount)||0),0);
    const carry=h.reduce((a,u)=>a+(parseFloat(u.carryover)||0),0);
    const cnt=h.filter(u=>(parseFloat(u.amount)||0)>0).length;
    return {paid:paid,bonus:bonus,total:total,remain:total-used+disc+carry,cnt:cnt};
  }

      if(/^[1-9]\u{FE0F}?\u{20E3}/u.test(t))return '<div style="background:var(--pri-bg);border-left:4px solid var(--pri);border-radius:8px;padding:7px 11px;margin:7px 0 4px;font-size:13px;font-weight:900;color:var(--pri);letter-spacing:-.01em">'+esc(t)+'</div>';

      if(t.indexOf('🍎')===0||t.indexOf('🤖')===0)return '<div style="font-weight:900;font-size:13px;margin-top:4px">'+esc(t)+'</div>';
      if(t.indexOf('📱')===0||t.indexOf('🏠')===0)x='<span style="font-weight:800">'+x+'</span>';

// ═══ 문서 연결 · 수정 · 삭제 ═══
const COLL_LB={invoices:'💳 인보이스',inspections:'🔧 점검보고서',contracts:'📑 계약서',coupons:'🎫 상품권',requests:'📥 의뢰',bookings:'🗓️ 예약',quotes:'🧾 견적서',schedules:'📅 스케줄'};
function docOwnerName(coll,x){
  if(coll==='invoices')return (x.customer&&x.customer.name)||'';
  if(coll==='inspections')return x.client||'';
  if(coll==='contracts')return x.name||'';
  return x.name||x.receiver||'';
}
function docOwnerPhone(coll,x){
  if(coll==='invoices')return (x.customer&&x.customer.phone)||'';
  if(coll==='inspections')return x.phone||'';
  if(coll==='contracts')return x.phone||'';
  return '';
}
function docSummary(coll,x){
  if(coll==='invoices')return (x.id||x.__id)+' · '+(x.date||'')+' · '+fmtRM(invTotal(x));
  if(coll==='inspections')return inspLabel(x.type)+' · '+(x.date||'')+(x.addr?' · '+x.addr:'');
  if(coll==='contracts')return (pkgLabel(x.package_id)||'패키지')+' · '+(x.contract_date||'')+' · 납입 '+fmtRM(x.amount_paid);
  if(coll==='coupons')return (x.code||'')+' · '+(x.value||'')+(x.expiry?' · ~'+x.expiry:'');
  if(coll==='requests')return (reqName(x)||'의뢰')+' · '+String(x.created_at||'').slice(0,10);
  if(coll==='bookings')return (x.customer_name||'예약')+' · '+(x.booking_date||x.created_at&&String(x.created_at).slice(0,10)||'')+(x.status?' · '+x.status:'');
  if(coll==='quotes')return (x.qno||'견적')+' · '+(x.client||'')+' · '+(x.issueDate||'');
  return (x.title||x.customer_name||'일정')+' · '+(x.date||'');
}
// 문서 종류별 「고객명 필드」 이름 — 이름을 바꿀 때만 사용
function ownerNameKey(coll){
  if(coll==='invoices')return 'customer.name';
  if(coll==='inspections'||coll==='quotes')return 'client';
  if(coll==='bookings'||coll==='schedules')return 'customer_name';
  return 'name';   // contracts, coupons, requests
}
// 문서 종류별 「연락처 필드」 이름 — 상품권(coupons)은 연락처가 없음
function ownerPhoneKey(coll){
  if(coll==='invoices')return 'customer.phone';
  if(coll==='bookings'||coll==='schedules')return 'customer_phone';
  if(coll==='coupons')return '';
  return 'phone';  // inspections, contracts, quotes, requests
}
// 연결 시 실제로 쓸 필드
//  · 기본  : ca_link(고객 지정표)만 저장 → 문서의 고객명·연락처는 100% 그대로 유지
//  · 옵션1 : 고객명도 이 고객으로 변경
//  · 옵션2 : 연락처도 이 고객 것으로 변경
function linkFieldsFor(coll,e,renameToo,rephoneToo){
  const f={ca_link:entryKey(e),ca_link_name:e.name||'',ca_link_at:new Date().toISOString()};
  if(renameToo)f[ownerNameKey(coll)]=e.name;
  const pk=ownerPhoneKey(coll);
  if(rephoneToo&&pk)f[pk]=e.phone||'';
  return f;
}
function genericModal(title,bodyHTML,footHTML){
  const old=document.getElementById('ca-doc-mask');if(old)old.remove();
  const mk=document.createElement('div');mk.id='ca-doc-mask';mk.className='mask open';
  mk.innerHTML='<div class="modal"><div class="modal-h">'+title+'<button class="x" onclick="document.getElementById(\'ca-doc-mask\').remove()">✕</button></div>'+
    '<div class="modal-b">'+bodyHTML+'</div>'+(footHTML?'<div class="modal-f">'+footHTML+'</div>':'')+'</div>';
  mk.addEventListener('click',ev=>{if(ev.target===mk)mk.remove();});
  document.body.appendChild(mk);
  return mk;
}
// ── + 연결: 다른/미지정 고객의 문서를 이 고객에게 연결(이관) ──
window.caDocLink=function(coll,idx){
  const e=entries[idx];if(!e)return;
  const myN=nn(e.name),myKeys=[myN].concat(e.aliases.map(nn)),myP=pn(e.phone);
  const myKey=entryKey(e);
  const mine=x=>{
    if(docExtraKeys(x).indexOf(myKey)>=0)return true;   // 이미 중복 연결된 문서
    if(x.ca_link)return x.ca_link===myKey;      // 수동 연결이 우선입니다
    const on=nn(docOwnerName(coll,x)),op=pn(docOwnerPhone(coll,x));
    return (myP&&op===myP)||(on&&myKeys.includes(on));
  };
  const mk=genericModal(COLL_LB[coll]+' 연결 — '+esc(e.name),
    '<p style="font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:10px">문서를 선택하면 이 고객(<b>'+esc(e.name)+'</b>)에게 연결됩니다.<br>📌 고객명·연락처가 <b>서로 달라도 그대로 유지한 채</b> 연결됩니다.<br>🔗 <b>이미 다른 고객에게 연결된 문서도 그대로 선택</b>할 수 있으며, 기본값인 「중복 연결」을 고르면 <b>기존 고객은 그대로 두고</b> 이 고객에게도 함께 표시됩니다.</p>'+
    '<input class="fi" id="ca-lk-q" placeholder="🔍 검색 (번호·이름·날짜)" style="margin-bottom:10px">'+
    '<div id="ca-lk-list" style="max-height:46vh;overflow-y:auto"></div>');
  const listEl=mk.querySelector('#ca-lk-list'),qEl=mk.querySelector('#ca-lk-q');
  function draw(){
    const q=(qEl.value||'').toLowerCase().replace(/\s+/g,'');
    const rows=RAW[coll].filter(x=>{
      if(!q)return true;
      return (docSummary(coll,x)+docOwnerName(coll,x)+(docOwnerPhone(coll,x)||'')).toLowerCase().replace(/\s+/g,'').includes(q);
    }).slice(0,80);
    listEl.innerHTML=rows.length?rows.map(x=>{
      const isMine=mine(x);
      const own=docOwnerName(coll,x);
      const dupN=docExtraKeys(x).length;
      const tag=(x.ca_link?'<span class="own" style="color:#5B21B6">➡️ 이관됨</span>':'')+(dupN?'<span class="own" style="color:#92400E">🔗 중복 '+dupN+'</span>':'');
      return '<div class="lk-row'+(isMine?' mine':'')+'" data-id="'+esc(x.__id)+'" data-mine="'+(isMine?'1':'')+'">'+
        '<span style="font-weight:800">'+esc(docSummary(coll,x))+'</span>'+tag+
        '<span class="own">'+(isMine?'이미 이 고객':esc(own||'(고객 미지정)'))+'</span></div>';
    }).join(''):'<div class="dnone">문서가 없습니다</div>';
  }
  draw();
  qEl.addEventListener('input',draw);
  listEl.addEventListener('click',ev=>{
    const el=ev.target.closest('.lk-row');if(!el||el.dataset.mine)return;
    const x=RAW[coll].find(d=>d.__id===el.dataset.id);if(!x)return;
    caLinkConfirm(coll,x,e,()=>{mk.remove();});
  });
};
// ── 연결 확인 모달 ──────────────────────────────────────────────
// 고객명·연락처가 서로 달라도 「그대로 유지」한 채 연결됩니다.
// 문서에 ca_link(고객 지정표)를 저장하는 방식이라 원본 양식이 전혀 바뀌지 않습니다.
// 이름/연락처가 다르면 ⚠️ 경고 안내문만 보여주고, 필요할 때만 수동으로 바꿉니다.
function caLinkConfirm(coll,x,e,onDone){
  const own=docOwnerName(coll,x);
  const ownP=docOwnerPhone(coll,x);
  const pk=ownerPhoneKey(coll);
  const nameDiff=own&&nn(own)!==nn(e.name)&&!e.aliases.some(a=>nn(a)===nn(own));
  const phoneDiff=!!(pk&&pn(ownP)&&pn(e.phone)&&pn(ownP)!==pn(e.phone));
  const noPhone=!!(pk&&pn(ownP)&&!pn(e.phone));

  let warn='';
  if(nameDiff||phoneDiff||noPhone){
    warn='<div class="lk-warn">⚠️ <b>고객 정보가 서로 다릅니다.</b><br>'+
      (nameDiff?'· 고객명 — 문서 <b>'+esc(own)+'</b> / 연결할 고객 <b>'+esc(e.name)+'</b><br>':'')+
      (phoneDiff?'· 연락처 — 문서 <b>'+esc(ownP)+'</b> / 연결할 고객 <b>'+esc(e.phone)+'</b><br>':'')+
      (noPhone?'· 연락처 — 문서 <b>'+esc(ownP)+'</b> / 연결할 고객 <b>등록 없음</b><br>':'')+
      '<span style="display:block;margin-top:6px">그래도 <b>문서의 고객명·연락처는 그대로 둔 채</b> 이 고객에게 연결됩니다. '+
      '인보이스·점검보고서·계약서에 인쇄되는 내용은 전혀 바뀌지 않습니다.</span></div>';
  }

  const mk2=genericModal('🔗 문서 연결 확인',
    '<div style="font-size:12px;color:var(--ink2);line-height:1.7;margin-bottom:11px">아래 문서를 <b style="color:var(--ink)">'+esc(e.name)+'</b> 고객에게 연결합니다.</div>'+
    '<div style="background:var(--bg);border:1px solid var(--bdr);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:800;color:var(--ink);margin-bottom:11px">'+COLL_LB[coll]+'<br><span style="font-weight:700;color:var(--ink2)">'+esc(docSummary(coll,x))+'</span>'+
      (own||ownP?'<br><span style="font-weight:700;color:var(--ink3);font-size:11px">문서에 적힌 정보 — '+esc(own||'(이름 없음)')+(ownP?' · '+esc(ownP):'')+'</span>':'')+'</div>'+
    warn+
    '<div style="font-size:11px;font-weight:800;color:var(--ink3);margin:2px 0 6px">연결 방식</div>'+
    '<label class="lk-keep"><input type="radio" name="lkmode" value="dup" checked><span><b>🔗 중복 연결 — 기존 고객은 그대로 두고 이 고객에게도 함께 표시</b><span>인보이스·계약서·점검보고서·상품권을 여러 고객에게 동시에 보여줄 때 사용합니다. 원래 고객의 목록·마이페이지에서도 그대로 보입니다.</span></span></label>'+
    '<label class="lk-keep"><input type="radio" name="lkmode" value="move"><span><b>➡️ 이관 연결 — 이 문서를 이 고객 소속으로 옮김</b><span>기존 고객의 목록에서는 사라지고 이 고객에게만 표시됩니다. (기존 방식)</span></span></label>'+
    '<div id="lk-opt" style="display:none">'+
    '<div style="font-size:11.5px;color:var(--ink3);line-height:1.6;margin:8px 0 8px">아래 항목은 <b>필요할 때만</b> 선택하세요. 선택하지 않으면 원본 그대로 유지됩니다.</div>'+
    '<label class="lk-keep"><input type="checkbox" id="lk-rename"><span><b>문서의 고객명도 「'+esc(e.name)+'」(으)로 변경</b><span>체크하지 않으면 문서에 적힌 이름'+(own?' 「'+esc(own)+'」':'')+'이 그대로 유지됩니다.</span></span></label>'+
    (pk?'<label class="lk-keep"><input type="checkbox" id="lk-rephone"><span><b>문서의 연락처도 「'+esc(e.phone||'(없음)')+'」(으)로 변경</b><span>체크하지 않으면 문서에 적힌 연락처'+(ownP?' 「'+esc(ownP)+'」':'')+'가 그대로 유지됩니다.</span></span></label>':'')+
    '</div>',
    '<button class="btn" onclick="document.getElementById(\'ca-doc-mask\').remove()">취소</button><button class="btn p" id="lk-go">연결하기</button>');

  const _mode=()=>{const r=mk2.querySelector('input[name="lkmode"]:checked');return r?r.value:'dup';};
  const _optBox=mk2.querySelector('#lk-opt');
  const _syncMode=()=>{if(_optBox)_optBox.style.display=(_mode()==='move')?'block':'none';};
  Array.prototype.forEach.call(mk2.querySelectorAll('input[name="lkmode"]'),r=>r.addEventListener('change',_syncMode));
  _syncMode();

  mk2.querySelector('#lk-go').addEventListener('click',async()=>{
    const mode=_mode();
    const cb=mk2.querySelector('#lk-rename'),cp=mk2.querySelector('#lk-rephone');
    const renameToo=(mode==='move')&&!!(cb&&cb.checked), rephoneToo=(mode==='move')&&!!(cp&&cp.checked);
    const btn=mk2.querySelector('#lk-go');btn.disabled=true;btn.textContent='연결 중...';
    let f;
    if(mode==='dup'){
      const key=entryKey(e);
      const ks=docExtraKeys(x).slice();
      if(ks.indexOf(key)<0)ks.push(key);
      f={ca_links:ks,ca_links_at:new Date().toISOString()};
    }else{
      f=linkFieldsFor(coll,e,renameToo,rephoneToo);
      // 이관 대상 고객이 중복 연결에도 들어 있으면 중복 쪽에서 빼 준다 (중복 표시 방지)
      const ks=docExtraKeys(x).filter(k=>k!==entryKey(e));
      if(docExtraKeys(x).length!==ks.length)f.ca_links=ks;
    }
    try{
      await updateDoc(doc(db,coll,x.__id),f);
      mk2.remove();if(onDone)onDone();
      if(mode==='dup')toast('✓ 중복 연결되었습니다 — 기존 고객에도 그대로 표시됩니다');
      else{
        const chg=[renameToo?'고객명':'',rephoneToo?'연락처':''].filter(Boolean).join('·');
        toast(chg?'✓ 이관 연결되었습니다 ('+chg+' 변경)':'✓ 이관 연결되었습니다 — 문서 내용은 그대로 유지');
      }
      closeDrawer();loadAll(true);
    }catch(err){btn.disabled=false;btn.textContent='연결하기';toast('연결 실패: '+err.message);}
  });
}
// ── 🔗 수동 연결 해제 ────────────────────────────────
//  idx(고객 인덱스)가 있고 그 고객이 「중복 연결」 대상이면 그 고객만 빼고,
//  아니면 기존처럼 이관 연결(ca_link)을 해제해 원래 고객명·연락처 기준으로 되돌립니다.
window.caDocUnlink=async function(coll,id,idx){
  const x=RAW[coll].find(d=>d.__id===id);if(!x)return;
  const e=(idx===undefined||idx===null)?null:entries[idx];
  const key=e?entryKey(e):'';
  const isDup=!!(key&&docExtraKeys(x).indexOf(key)>=0);
  const msgQ=isDup
    ?('이 '+COLL_LB[coll]+' 문서를 「'+(e.name||'')+'」 고객에서만 연결 해제할까요?\n\n'+docSummary(coll,x)+'\n\n원래 고객과 다른 중복 연결 고객에게는 그대로 남아 있습니다.')
    :('이 '+COLL_LB[coll]+' 문서의 수동 연결을 해제할까요?\n\n'+docSummary(coll,x)+'\n\n해제하면 문서에 적힌 고객명·연락처 기준으로 다시 분류됩니다.');
  if(!confirm(msgQ))return;
  try{
    if(isDup)await updateDoc(doc(db,coll,id),{ca_links:docExtraKeys(x).filter(k=>k!==key)});
    else await updateDoc(doc(db,coll,id),{ca_link:'',ca_link_name:''});
    toast('✓ 연결이 해제되었습니다');closeDrawer();loadAll(true);
  }catch(err){toast('해제 실패: '+err.message);}
};

// ── 🔗 연결 관리 : 이 고객에게 연결된 문서를 한눈에 보고 선택 해제 (F27-c) ──
window.caLinkManage=function(idx){
  const e=entries[idx];if(!e)return;
  const key=entryKey(e);
  const COLLS=['invoices','inspections','contracts','coupons','requests','bookings','quotes','schedules'];
  const rows=[];
  COLLS.forEach(coll=>{
    (RAW[coll]||[]).forEach(x=>{
      const dup=docExtraKeys(x).indexOf(key)>=0;
      const mov=(x.ca_link===key);
      if(dup||mov)rows.push({coll:coll,x:x,mode:dup?'dup':'move'});
    });
  });
  const body=rows.length
    ?('<p style="font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:10px">「<b>'+esc(e.name)+'</b>」 고객에게 <b>수동 연결</b>된 문서 '+rows.length+'건입니다.<br>해제할 항목을 선택한 뒤 아래 버튼을 누르세요.<br>🔗 <b>중복 연결</b>은 이 고객에서만 빠지고 원래 고객에는 그대로 남습니다. ➡️ <b>이관 연결</b>을 해제하면 문서에 적힌 고객명·연락처 기준으로 다시 분류됩니다.</p>'+
       '<div style="display:flex;gap:7px;margin-bottom:9px"><button class="btn sm" id="lkm-all">전체 선택</button><button class="btn sm" id="lkm-none">선택 해제</button></div>'+
       '<div style="max-height:46vh;overflow-y:auto">'+
       rows.map((r,i)=>'<label class="lk-keep"><input type="checkbox" class="lkm-cb" data-i="'+i+'"><span><b>'+
         (r.mode==='dup'?'<i style="font-style:normal;color:#92400E">🔗 중복 연결</i>':'<i style="font-style:normal;color:#5B21B6">➡️ 이관 연결</i>')+' · '+COLL_LB[r.coll]+'</b>'+
         '<span>'+esc(docSummary(r.coll,r.x))+(docOwnerName(r.coll,r.x)?' · 문서상 고객 「'+esc(docOwnerName(r.coll,r.x))+'」':'')+'</span></span></label>').join('')+
       '</div>')
    :'<div class="dnone">이 고객에게 수동으로 연결된 문서가 없습니다.<br><span style="font-size:11px">문서 목록의 「+ 연결」 버튼으로 연결할 수 있습니다.</span></div>';
  const mk=genericModal('🔗 연결 관리 — '+esc(e.name),body,
    rows.length?'<button class="btn" onclick="document.getElementById(\'ca-doc-mask\').remove()">닫기</button><button class="btn p" id="lkm-go" style="background:var(--bad);border-color:var(--bad)">선택 항목 연결 해제</button>':'<button class="btn" onclick="document.getElementById(\'ca-doc-mask\').remove()">닫기</button>');
  if(!rows.length)return;
  const cbs=()=>Array.prototype.slice.call(mk.querySelectorAll('.lkm-cb'));
  mk.querySelector('#lkm-all').addEventListener('click',()=>cbs().forEach(c=>{c.checked=true;}));
  mk.querySelector('#lkm-none').addEventListener('click',()=>cbs().forEach(c=>{c.checked=false;}));
  mk.querySelector('#lkm-go').addEventListener('click',async()=>{
    const pick=cbs().filter(c=>c.checked).map(c=>rows[parseInt(c.dataset.i,10)]);
    if(!pick.length){toast('해제할 항목을 선택하세요');return;}
    if(!confirm('선택한 '+pick.length+'건의 연결을 해제할까요?'))return;
    const btn=mk.querySelector('#lkm-go');btn.disabled=true;btn.textContent='해제 중...';
    let ok=0,ng=0;
    for(const r of pick){
      try{
        if(r.mode==='dup')await updateDoc(doc(db,r.coll,r.x.__id),{ca_links:docExtraKeys(r.x).filter(k=>k!==key)});
        else await updateDoc(doc(db,r.coll,r.x.__id),{ca_link:'',ca_link_name:''});
        ok++;
      }catch(err){ng++;}
    }
    mk.remove();
    toast(ng?('✓ '+ok+'건 해제 · '+ng+'건 실패'):('✓ '+ok+'건 연결이 해제되었습니다'));
    closeDrawer();loadAll(true);
  });
};
// ── ✏️ 수정: 종류별 핵심 필드 편집 ──
window.caDocEdit=function(coll,id){
  const x=RAW[coll].find(d=>d.__id===id);if(!x)return;
  let body='',fields=[];
  const fi=(k,lb,v,ph)=>{fields.push(k);return '<div class="fl">'+lb+'</div><input class="fi" id="ca-f-'+k+'" value="'+esc(v||'')+'"'+(ph?' placeholder="'+ph+'"':'')+'>';};
  const sel=(k,lb,v,opts)=>{fields.push(k);return '<div class="fl">'+lb+'</div><select class="fi" id="ca-f-'+k+'">'+opts.map(o=>'<option value="'+o[0]+'"'+(v===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>';};
  if(coll==='invoices'){
    body=fi('cname','고객명',(x.customer&&x.customer.name)||'')+fi('cphone','연락처',(x.customer&&x.customer.phone)||'')+
      fi('date','날짜',x.date||'','YYYY-MM-DD')+sel('status','상태',x.status||'billing',[['draft','작성중'],['billing','청구중'],['paid','결제완료'],['overdue','연체']]);
  }else if(coll==='inspections'){
    body=fi('client','고객명',x.client||'')+fi('phone','연락처',x.phone||'')+fi('date','날짜',x.date||'','YYYY-MM-DD')+
      sel('type','종류',x.type||'inspect',[['inspect','점검'],['dispatch','출장'],['install','설치'],['washer','세탁기']])+fi('addr','주소',x.addr||'');
  }else if(coll==='contracts'){
    body=fi('name','계약자명',x.name||'')+fi('phone','연락처',x.phone||'')+fi('contract_date','계약일',x.contract_date||'','YYYY-MM-DD')+
      sel('status','계약 상태',(x.status==='ended')?'ended':'active',[['active','✅ 유효'],['ended','⏹ 종료']]);
  }else if(coll==='quotes'){
    body=fi('client','고객명',x.client||'')+fi('phone','연락처',x.phone||'')+fi('subject','제목/현장',x.subject||'')+
      fi('issueDate','작성일',x.issueDate||'','YYYY-MM-DD')+fi('validUntil','유효기한',x.validUntil||'','YYYY-MM-DD');
  }else{
    body=fi('name','구매고객명',x.name||'')+fi('receiver','받는분 (선택)',x.receiver||'')+fi('value','금액/할인',x.value||'')+
      fi('expiry','유효기간',x.expiry||'','YYYY-MM-DD')+sel('status','상태',x.status||'active',[['active','사용가능'],['used','사용완료'],['void','취소']]);
  }
  const mk=genericModal('✏️ '+COLL_LB[coll]+' 수정',body,
    '<button class="btn" onclick="document.getElementById(\'ca-doc-mask\').remove()">취소</button><button class="btn p" id="ca-doc-save">저장</button>');
  mk.querySelector('#ca-doc-save').addEventListener('click',async()=>{
    const v={};fields.forEach(k=>{v[k]=mk.querySelector('#ca-f-'+k).value.trim();});
    let upd={};
    if(coll==='invoices')upd={'customer.name':v.cname,'customer.phone':v.cphone,date:v.date,status:v.status};
    else if(coll==='inspections')upd={client:v.client,phone:v.phone,date:v.date,type:v.type,addr:v.addr};
    else if(coll==='contracts')upd={name:v.name,phone:v.phone,contract_date:v.contract_date,status:v.status};
    else if(coll==='quotes')upd={client:v.client,phone:v.phone,subject:v.subject,issueDate:v.issueDate,validUntil:v.validUntil};
    else upd={name:v.name,receiver:v.receiver,value:v.value,expiry:v.expiry,status:v.status};
    try{
      await updateDoc(doc(db,coll,id),upd);
      mk.remove();toast('✓ 수정되었습니다');closeDrawer();loadAll(true);
    }catch(err){toast('수정 실패: '+err.message);}
  });
};
// ── ✕ 삭제 ──
window.caDocDel=async function(coll,id){
  const x=RAW[coll].find(d=>d.__id===id);if(!x)return;
  if(!confirm(COLL_LB[coll]+' 문서를 삭제할까요?\n\n'+docSummary(coll,x)+'\n\n⚠ 삭제하면 되돌릴 수 없습니다.'))return;
  try{
    await deleteDoc(doc(db,coll,id));
    toast('✓ 삭제되었습니다');closeDrawer();loadAll(true);
  }catch(err){toast('삭제 실패: '+err.message);}
};

// ═══ 병합 ═══
window.doMerge=async function(i){
  const pair=mergeSug[i];if(!pair)return;
  let [a,b]=pair;
  // 마스터+연락처 있는 쪽을 기준으로
  if((b.master&&pn(b.phone))&&!(a.master&&pn(a.phone)))[a,b]=[b,a];
  else if(pn(b.phone)&&!pn(a.phone))[a,b]=[b,a];
  if(!confirm('"'+b.name+'" 을(를) "'+a.name+'" 고객에 병합할까요?\n'+b.name+' 은(는) 별칭으로 저장되고 모든 기록이 합쳐집니다.'))return;
  const now=new Date().toISOString();
  try{
    const aliases=[...new Set((a.master&&a.master.aliases||a.aliases||[]).concat([b.name]).concat(b.aliases||[]))].filter(x=>nn(x)!==nn(a.name));
    if(a.master&&a.master.__id){
      const upd={aliases,updated_at:now};
      if(!pn(a.phone)&&pn(b.phone))upd.phone=b.phone;
      if(!a.member&&b.member)upd.member=b.member;
      await updateDoc(doc(db,'customers',a.master.__id),upd);
    }else{
      await addDoc(collection(db,'customers'),{id:'c'+Date.now(),name:a.name,phone:a.phone||b.phone||'',member:a.member||b.member||'',email:a.email||'',addr:a.addr||'',memo:'',aliases,created_at:now,updated_at:now});
    }
    if(b.master&&b.master.__id)await deleteDoc(doc(db,'customers',b.master.__id));
    toast('✓ 병합되었습니다');
    loadAll(true);
  }catch(err){toast('병합 실패: '+err.message);}
};
