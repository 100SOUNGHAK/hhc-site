// ═══ 문서 뷰어 오버레이 ═══
// 인보이스·점검보고서·계약서·상품권을 앱 안에서 열고, 닫으면 고객 상세 화면으로 그대로 복귀한다.
//  · 문서 안에서 또 다른 문서를 「↗ 새 탭」으로 여는 링크도 모두 이 오버레이 안에서 열어
//    모바일(카카오·왓츠앱 인앱 브라우저, 설치형 앱)에서 닫을 때 프로그램 전체가 닫히는 것을 막는다.
//  · 「← 뒤로」는 오버레이 안에서 거쳐온 문서로 돌아가고, 첫 문서에서는 오버레이를 닫는다.
let dvOpen=false, dvPushed=false, dvStack=[];
function dvInternal(href){
  if(!href)return false;
  if(/^(tel:|mailto:|sms:|javascript:|blob:|data:)/i.test(href))return false;
  if(String(href).charAt(0)==='#')return false;
  let u;try{u=new URL(href,location.href);}catch(_){return false;}
  if(u.protocol!=='http:'&&u.protocol!=='https:')return false;
  if(u.origin===location.origin)return true;
  return /(^|\.)hhc-3p8\.pages\.dev$/i.test(u.hostname) || /(^|\.)happyhomecare\.com\.my$/i.test(u.hostname);
}
function dvTitleOf(url){
  const f=String(url).split('?')[0].split('#')[0].split('/').pop().toLowerCase();
  const M={'hhc-invoice.html':'🧾 인보이스','hhcinvoice.html':'🧾 인보이스',
    'inspect.html':'🔧 점검 보고서','inspect-admin.html':'🔧 점검 보고서','inspectadmin.html':'🔧 점검 보고서',
    'install.html':'🔩 설치 보고서','washer.html':'🧺 세탁기 보고서','hood.html':'🍳 주방후드 보고서','fabric.html':'🛋️ 작업 보고서',
    'admin.html':'📑 계약서 · 이용내역','coupon.html':'🎫 상품권','coupon-admin.html':'🎫 상품권','couponadmin.html':'🎫 상품권',
    'quote.html':'🧾 견적서','quote-admin.html':'🧾 견적서','quoteadmin.html':'🧾 견적서',
    'booking.html':'📅 예약 확인','request.html':'📝 서비스 의뢰','my.html':'📱 고객 마이페이지',
    'request-admin.html':'📥 의뢰관리','requestadmin.html':'📥 의뢰관리',
    'booking-admin.html':'🗓️ 예약관리','bookingadmin.html':'🗓️ 예약관리',
    'schedule.html':'📅 스케줄 캘린더'};
  return M[f]||'📄 문서';
}
function dvPaint(){
  const t=dvStack.length?dvStack[dvStack.length-1]:null;
  const te=document.getElementById('dv-ttl');if(te)te.textContent=t?t.t:'문서';
  const nb=document.getElementById('dv-new');if(nb&&t)nb.href=t.u;
  const bk=document.getElementById('dv-back');
  if(bk)bk.textContent=dvStack.length>1?'← 뒤로':'← 닫기';
}
function dvLoad(url){
  // iframe은 열 때마다 새로 만든다 — src 교체는 브라우저 히스토리를 오염시켜 뒤로가기가 어긋난다.
  const host=document.getElementById('dv-body');
  host.innerHTML='';
  const f=document.createElement('iframe');
  f.id='dv-frame';
  f.setAttribute('title','문서 보기');
  f.setAttribute('allow','clipboard-write; clipboard-read');
  f.onload=function(){dvHook(f);};
  f.src=url;
  host.appendChild(f);
}
// 문서 페이지가 스스로 창을 닫거나 새 탭을 열려고 하면 가로채서 오버레이 안에서만 처리한다
function dvHook(f){
  let cw;try{cw=f.contentWindow;}catch(_){return;}
  if(!cw)return;
  try{cw.close=function(){window.caViewClose();};}catch(_){}
  try{cw.history.back=function(){window.caViewBack();};}catch(_){}
  try{cw.open=function(u){ if(dvInternal(u)){dvPush(String(u));return null;} try{return window.open(u,'_blank','noopener');}catch(_){return null;} };}catch(_){}
  try{
    cw.document.addEventListener('click',function(ev){
      const a=ev.target&&ev.target.closest?ev.target.closest('a[href]'):null;
      if(!a)return;
      const href=a.getAttribute('href')||'';
      if(!dvInternal(href))return;          // 전화·왓츠앱 등 외부 링크는 그대로
      if(a.target!=='_blank')return;        // 같은 화면 안에서의 이동은 그대로
      ev.preventDefault();ev.stopPropagation();
      dvPush(a.href);
    },true);
    cw.document.addEventListener('keydown',function(k){if(k.key==='Escape')window.caViewClose();});
  }catch(_){}
}
function dvPush(url){dvStack.push({u:url,t:dvTitleOf(url)});dvPaint();dvLoad(url);}
window.caView=function(url,title,ev){
  if(ev&&(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.button===1))return true; // 새 탭으로 열기는 그대로 허용
  const w=document.getElementById('dv-wrap');if(!w)return true;
  dvStack=[{u:url,t:title||dvTitleOf(url)}];
  dvPaint();dvLoad(url);
  w.classList.add('open');
  dvOpen=true;
  document.body.style.overflow='hidden';
  try{history.pushState({dv:1},'');dvPushed=true;}catch(_){dvPushed=false;}
  return false;
};
window.caViewBack=function(){
  if(dvStack.length>1){dvStack.pop();dvPaint();dvLoad(dvStack[dvStack.length-1].u);}
  else window.caViewClose();
};
window.caViewClose=function(fromPop){
  const w=document.getElementById('dv-wrap');
  if(!w||!w.classList.contains('open'))return;
  w.classList.remove('open');
  const host=document.getElementById('dv-body');
  if(host)host.innerHTML='';
  dvOpen=false;dvStack=[];
  document.body.style.overflow='';
  // 남겨 둔 기록은 우리가 만든 것이 확실할 때만 되돌린다.
  // (문서가 기록을 더 쌓았는데 무리하게 뒤로 가면 프로그램 밖으로 나가 버린다)
  if(!fromPop&&dvPushed){dvPushed=false;try{if(history.state&&history.state.dv)history.back();}catch(_){ }}
  else dvPushed=false;
};
// 문서 화면이 top.close() 등으로 프로그램 창 자체를 닫으려는 경우에도 오버레이만 닫는다
(function(){
  const _close=window.close;
  window.close=function(){
    if(dvOpen){window.caViewClose();return;}
    try{_close.call(window);}catch(_){ }
  };
})();
window.addEventListener('popstate',function(){if(dvOpen)window.caViewClose(true);});
document.addEventListener('keydown',function(k){if(k.key==='Escape'&&dvOpen)window.caViewClose();});
// 혹시 빠뜨린 「새 탭」 링크가 있어도 우리 사이트 주소면 뷰어로 돌린다 (모바일 안전장치)
document.addEventListener('click',function(ev){
  if(ev.defaultPrevented)return;
  if(ev.metaKey||ev.ctrlKey||ev.shiftKey||ev.button===1)return;   // PC의 새 탭 열기는 그대로 허용
  const a=ev.target&&ev.target.closest?ev.target.closest('a[href]'):null;
  if(!a||a.getAttribute('target')!=='_blank')return;
  if(a.id==='dv-new')return;                                       // 뷰어 상단의 「↗ 새 탭」은 그대로
  if(/caView/.test(a.getAttribute('onclick')||''))return;          // 이미 뷰어로 열리는 링크
  const href=a.getAttribute('href')||'';
  if(!dvInternal(href))return;                                     // 전화·왓츠앱 등 외부는 그대로
  ev.preventDefault();
  window.caView(a.href,'');
},true);

    const typedPN=pn(phone);
    const nameHit=caFindByName(name);
    if(nameHit&&typedPN&&pn(nameHit.phone)&&pn(nameHit.phone)!==typedPN){
      const choice=await caPhoneConfirm(nameHit,phone);
      if(!choice)return;
      if(choice.action==='use_existing'){
        toast('기존 고객 정보를 그대로 사용합니다: '+nameHit.name);
        closeEdit();return;
      }
      if(choice.action==='use_new'){
        await applyEdit(nameHit,{name:nameHit.name,phone,member:nameHit.member||'',email:nameHit.email||'',addr:nameHit.addr||'',memo:nameHit.memo||'',aliases:nameHit.aliases||[]},true);
        return;
      }
      // action==='separate' → 동명이인, 아래에서 신규 등록을 계속 진행
    }
    // 이름·연락처·별칭이 겹치는 고객이 있으면 자동으로 합치지 않고 물어봅니다
    const _hits=caDupFind({name,phone,aliases},null);
    if(_hits.length){
      const _ch=await caDupAsk(_hits,{name,phone,aliases},true);
      if(!_ch)return;
      if(_ch.action==='merge'){
        const t=_ch.target;
        const mAls=[...new Set((t.aliases||[]).concat(aliases,[t.name,name]))]
          .filter(a=>a&&nn(a)!==nn(name));
        try{
          await updateDoc(doc(db,'customers',t.__id),{name,phone:phone||t.phone||'',member:member||t.member||'',
            ca_member_set:true,email:email||t.email||'',addr:addr||t.addr||'',memo:memo||t.memo||'',
            aliases:mAls,updated_at:now});
          toast('✓ 「'+t.name+'」 고객과 합쳤습니다');
          closeEdit();loadAll(true);
        }catch(err){toast('합치기 실패: '+err.message);}
        return;
      }
      // 'separate' → 그대로 새 고객으로 등록
    }
    try{
      await addDoc(collection(db,'customers'),{id:'c'+Date.now(),name,phone,member,ca_member_set:true,email,addr,memo,aliases,created_at:now,updated_at:now});
      toast('✓ 신규 고객이 등록되었습니다');
      closeEdit();loadAll(true);
    }catch(err){toast('등록 실패: '+err.message);}
    return;
  }
  // ── 수정 ──
  const e=editTarget;
  const oldName=e.name,oldPhone=e.phone;
  // 연락처 변경 판정 — 「+60」처럼 불완전한 번호를 지우는 것은 문서 반영 대상이 아닙니다
  const nameChanged=name!==oldName,phoneChanged=pn(phone)!==pn(e.phone)&&pn(oldPhone).length>=6;
  // 별칭을 지우면 그 이름으로 된 문서가 떨어져 나가므로, 함께 바꿀지 확인합니다
  const keepK=aliases.map(nn);
  const aliasRemoved=(e.aliases||[]).some(a=>nn(a)&&nn(a)!==nn(name)&&keepK.indexOf(nn(a))<0);
  // 🔎 바꾼 정보가 다른 고객과 겹치면 자동으로 합치지 않고 먼저 물어봅니다
  let _keepApart=false;
  if(nameChanged||phoneChanged||aliases.length!==(e.aliases||[]).length||
     aliases.some(a=>!(e.aliases||[]).some(z=>nn(z)===nn(a)))){
    const _hits=caDupFind({name,phone,aliases},e.master);
    if(_hits.length){
      const _ch=await caDupAsk(_hits,{name,phone,aliases},false);
      if(!_ch)return;
      if(_ch.action==='merge'){
        const t=_ch.target;
        const mAls=[...new Set((t.aliases||[]).concat(aliases,e.aliases||[],[t.name,e.name,name]))]
          .filter(a=>a&&nn(a)!==nn(name));
        try{
          await updateDoc(doc(db,'customers',t.__id),{name,phone:phone||t.phone||'',member:member||t.member||'',
            ca_member_set:true,email:email||t.email||'',addr:addr||t.addr||'',memo:memo||t.memo||'',
            aliases:mAls,updated_at:now});
          if(e.master&&e.master.__id&&e.master.__id!==t.__id){
            await caRekey('m:'+e.master.__id,'m:'+t.__id);
            await deleteDoc(doc(db,'customers',e.master.__id));
          }
          toast('✓ 「'+t.name+'」 고객과 합쳤습니다');
          closeEdit();closeDrawer();loadAll(true);
        }catch(err){toast('합치기 실패: '+err.message);}
        return;
      }
      _keepApart=true;   // 따로 두기 → 아래에서 자동 합치기를 막습니다
    }
  }
  if((nameChanged||phoneChanged||aliasRemoved)&&docCount(e)>0){
    const _pl=propPlan(e,{name,phone,member,email,addr,memo,aliases});
    if(_pl.length){showPropModal(e,{name,phone,member,email,addr,memo,aliases},_keepApart);return;}
  }
  await applyEdit(e,{name,phone,member,email,addr,memo,aliases},false,_keepApart);
};
// 🔑 연결 키 갈아끼우기
//  고객마스터가 없던 고객은 이름·연락처로 만든 임시 키(k:이름#번호)로 문서와 연결돼 있습니다.
//  정보를 수정하면 고객마스터가 새로 만들어지면서 키가 m:<문서id> 로 바뀌는데,
//  이때 예전 키를 그대로 두면 연결·해제·중복연결이 모두 끊겨
//  같은 고객이 목록에 하나 더 생깁니다. 그래서 예전 키를 새 키로 바꿔 줍니다.
// 이 고객과 같은 사람인 고객마스터 문서가 이미 있는지 찾습니다 (연락처 → 이름·별칭 순)
function caFindMaster(e,v){
  const list=RAW.customers||[];
  const keys=[v&&v.name,e&&e.name].concat(e&&e.aliases||[]).map(nn).filter(Boolean);
  const ps=[v&&v.phone,e&&e.phone].map(pn).filter(x=>x&&x.length>=6);
  for(const p of ps){const m=list.find(c=>pn(c.phone)===p);if(m)return m;}
  for(const k of keys){
    const m=list.find(c=>nn(c.name)===k||(c.aliases||[]).some(a=>nn(a)===k));
    if(m)return m;
  }
  return null;
}
async function caRekey(oldKey,newKey){
  if(!oldKey||!newKey||oldKey===newKey)return 0;
  const COLLS=['contracts','invoices','inspections','bookings','schedules','requests','quotes','coupons','memos'];
  let n=0;
  for(const coll of COLLS){
    for(const x of (RAW[coll]||[])){
      const upd={};
      if(x.ca_link===oldKey)upd.ca_link=newKey;
      const lk=docExtraKeys(x);
      if(lk.indexOf(oldKey)>=0)upd.ca_links=lk.map(k=>k===oldKey?newKey:k);
      const off=docOffKeys(x);
      if(off.indexOf(oldKey)>=0)upd.ca_off=off.map(k=>k===oldKey?newKey:k);
      if(!Object.keys(upd).length)continue;
      try{await updateDoc(doc(db,coll,x.__id),upd);Object.assign(x,upd);n++;}catch(err){console.warn('rekey',coll,x.__id,err.message);}
    }
  }
  return n;
}
async function applyEdit(e,v,propagate,keepApart){
  const now=new Date().toISOString();
  try{
    let als=(v.aliases!=null)?v.aliases.slice():(e.master&&e.master.aliases||e.aliases||[]).slice();
    // 예전 이름은 「문서를 함께 바꾸지 않을 때만」 별칭으로 남깁니다.
    //  문서까지 새 이름으로 바꿨다면 예전 이름을 남길 이유가 없어, 별칭이 지저분해지지 않습니다.
    if(!propagate&&v.name!==e.name&&e.name&&!als.some(a=>nn(a)===nn(e.name)))als.push(e.name);
    als=als.filter(a=>nn(a)!==nn(v.name));
    const oldKey=entryKey(e);
    if(e.master&&e.master.__id){
      await updateDoc(doc(db,'customers',e.master.__id),{name:v.name,phone:v.phone,member:v.member,ca_member_set:true,email:v.email,addr:v.addr,memo:v.memo,aliases:als,updated_at:now});
    }else{
      // 같은 고객의 고객마스터가 이미 있는지 한 번 더 확인합니다.
      //  (다른 프로그램에서 방금 만들어졌거나, 별칭으로만 이어져 있던 경우
      //   그대로 새로 만들면 목록에 같은 고객이 하나 더 생깁니다)
      // 「따로 두기」를 고르셨으면 기존 고객으로 흡수하지 않고 새로 만듭니다
      const _ex=keepApart?null:caFindMaster(e,v);
      if(_ex&&_ex.__id){
        const mergedAls=als.slice();
        [_ex.name].concat(_ex.aliases||[]).forEach(a=>{
          if(a&&nn(a)!==nn(v.name)&&!mergedAls.some(z=>nn(z)===nn(a)))mergedAls.push(a);
        });
        await updateDoc(doc(db,'customers',_ex.__id),{name:v.name,phone:v.phone,member:v.member,ca_member_set:true,email:v.email,addr:v.addr,memo:v.memo,aliases:mergedAls,updated_at:now});
        await caRekey(oldKey,'m:'+_ex.__id);
      }else{
        const ref=await addDoc(collection(db,'customers'),{id:'c'+Date.now(),name:v.name,phone:v.phone,member:v.member,ca_member_set:true,email:v.email,addr:v.addr,memo:v.memo,aliases:als,created_at:now,updated_at:now});
        // 고객마스터가 새로 생기면 연결 키가 바뀌므로 문서의 예전 키를 함께 고쳐 줍니다
        if(ref&&ref.id)await caRekey(oldKey,'m:'+ref.id);
      }
    }
    if(propagate)await propagateDocs(e,v);
    toast('✓ 저장되었습니다'+(propagate?' — 전 프로그램 반영 완료':''));
    closeEdit();closeProp();loadAll(true);
  }catch(err){toast('저장 실패: '+err.message);}
}
// 전파 대상 정의: [컬렉션, 라벨, 매칭(문서,이름셋,pn), 변경필드(이름변경,번호변경)]
function propPlan(e,v){
  const op=pn(e.phone).length>=6?pn(e.phone):'';   // 불완전한 번호(「+60」 등)로는 문서를 찾지 않습니다
  const removing=!pn(v.phone);                    // 연락처를 지우는 경우
  // 연락처를 지울 때는 고객마스터에 직접 적힌 이름·별칭만 씁니다.
  //  (문서에서 자동으로 딸려 온 별칭은 「같은 번호」 때문에 붙은 다른 고객 이름일 수 있습니다)
  const names=(removing&&e.master
    ?[nn(e.master.name)].concat((e.master.aliases||[]).map(nn))
    :[nn(e.name)].concat(e.aliases.map(nn))).filter(Boolean);
  // 🔗 수동 연결(ca_link)된 문서는 고객명·연락처를 「그대로 유지」하기로 한 문서이므로
  //    고객 정보를 수정해도 일괄 변경 대상에서 제외합니다.
  const notLinked=x=>!x.ca_link;
  const hitP0=x=>!!op&&pn(x)===op;
  const hitN=s=>names.includes(nn(s));
  // 연락처를 지울 때는 「번호만 같은 문서」(다른 고객 문서일 수 있음)는 건드리지 않고,
  // 이 고객 이름으로 된 문서에 잘못 적힌 그 번호만 지웁니다.
  const hitP=x=>removing?false:hitP0(x);
  const nameChanged=v.name!==e.name, phoneChanged=pn(v.phone)!==pn(e.phone)&&!!op;
  // 문서 연락처 갱신 규칙: 새 번호가 있으면 기존 규칙대로, 지우는 경우엔 옛 번호가 적힌 문서만 비웁니다
  const phUpd=(cur)=>removing?hitP0(cur):(phoneChanged||!pn(cur));
  // 📌 「낡은 이름」 판정 : 새 고객명도 아니고, 남겨 두는 별칭도 아닌 이름
  //    (별칭을 지우면 그 이름으로 된 문서가 떨어져 나가 목록에 항목이 하나 더 생깁니다.
  //     그래서 지워진 별칭으로 된 문서는 새 고객명으로 함께 바꿔 줍니다)
  const keepAls=(v.aliases||[]).map(nn).filter(Boolean);
  const staleName=t=>{const k=nn(t);if(!k)return false;if(k===nn(v.name))return false;return keepAls.indexOf(k)<0;};
  // 의뢰는 「콘도명 + 동호수」가 합쳐져 고객명이 됩니다 → 새 이름을 두 칸에 알맞게 나눠 담습니다
  const rqSplit=x=>{
    const nm=String(v.name||'').trim();
    const cn=String(x.condo_name||x.condo||'').trim();
    if(cn&&nm.length>cn.length&&nm.toLowerCase().indexOf(cn.toLowerCase())===0)
      return {condo_name:cn,condo:cn,condo_unit:nm.slice(cn.length).trim()};
    return {condo_name:nm,condo:nm,condo_unit:''};
  };
  const plan=[];
  const add=(coll,label,docs,upd)=>{docs=docs.filter(x=>Object.keys(upd(x)).length);if(docs.length)plan.push({coll,label,docs,upd});};   // 실제로 바뀌는 문서만 셉니다
  add('contracts','📑 계약서',RAW.contracts.filter(x=>notLinked(x)&&(hitP(x.phone)||hitN(x.name))),
    x=>{const u={};if(staleName(x.name))u.name=v.name;if(phUpd(x.phone))u.phone=v.phone;return u;});
  add('invoices','💳 인보이스',RAW.invoices.filter(x=>{if(!notLinked(x))return false;const c=x.customer||{};return hitP(c.phone)||hitN(c.name);}),
    x=>{const u={};if(staleName((x.customer||{}).name))u['customer.name']=v.name;if(phUpd((x.customer||{}).phone))u['customer.phone']=v.phone;return u;});
  add('inspections','🔧 점검보고서',RAW.inspections.filter(x=>notLinked(x)&&(hitP(x.phone)||hitN(x.client))),
    x=>{const u={};if(staleName(x.client))u.client=v.name;if(phUpd(x.phone))u.phone=v.phone;return u;});
  add('bookings','🗓️ 예약',RAW.bookings.filter(x=>notLinked(x)&&(hitP(x.customer_phone)||hitN(x.customer_name))),
    x=>{const u={};if(staleName(x.customer_name))u.customer_name=v.name;if(phUpd(x.customer_phone))u.customer_phone=v.phone;return u;});
  add('schedules','📅 스케줄',RAW.schedules.filter(x=>notLinked(x)&&(hitP(x.customer_phone)||hitN(x.customer_name))),
    x=>{const u={};if(staleName(x.customer_name))u.customer_name=v.name;if(phUpd(x.customer_phone))u.customer_phone=v.phone;return u;});
  add('requests','📥 의뢰',RAW.requests.filter(x=>notLinked(x)&&(hitP(x.phone)||hitN(reqName(x)))),
    x=>{const u={};if(staleName(reqName(x)))Object.assign(u,rqSplit(x));if(phUpd(x.phone))u.phone=v.phone;return u;});
  add('quotes','🧾 견적서',RAW.quotes.filter(x=>notLinked(x)&&(hitP(x.phone)||hitN(x.client))),
    x=>{const u={};if(staleName(x.client))u.client=v.name;if(phUpd(x.phone))u.phone=v.phone;return u;});
  add('memos','📝 메모장',RAW.memos.filter(x=>notLinked(x)&&(hitP(x.phone)||hitN(x.name)||hitN(x.condo))),
    x=>{const u={};if(x.name&&staleName(x.name))u.name=v.name;if(x.condo&&staleName(x.condo))u.condo=v.name;if(phUpd(x.phone))u.phone=v.phone;return u;});
  add('coupons','🎫 상품권',RAW.coupons.filter(x=>notLinked(x)&&(hitN(x.name)||hitN(x.receiver))),
    x=>{const u={};if(staleName(x.name))u.name=v.name;if(staleName(x.receiver))u.receiver=v.name;return u;});
  return plan.filter(p=>p.docs.some(x=>Object.keys(p.upd(x)).length));
}
let curProp=null;
function showPropModal(e,v,keepApart){
  const plan=propPlan(e,v);
  curProp={e,v,plan,keepApart:!!keepApart};
  const total=plan.reduce((a,p)=>a+p.docs.length,0);
  let h='';
  if(pn(v.phone)!==pn(e.phone))h+='<div class="cmp"><div><small>현재 연락처</small><b>'+esc(e.phone||'(없음)')+'</b></div><div>→</div><div><small>변경</small><b style="color:var(--pri)">'+esc(v.phone||'(없음)')+'</b></div></div>';
  if(v.name!==e.name)h+='<div class="cmp"><div><small>현재 이름</small><b>'+esc(e.name)+'</b></div><div>→</div><div><small>변경</small><b style="color:var(--pri)">'+esc(v.name)+'</b></div></div>';
  h+='<p style="font-size:12.5px;color:var(--ink2);line-height:1.7;margin-bottom:11px">'+(!pn(v.phone)&&pn(e.phone)?'이 고객 이름으로 된 문서 중 <b>'+esc(e.phone)+'</b> 이 적힌 문서에서 번호를 지웁니다. 번호만 같은 다른 고객 문서는 건드리지 않습니다.':'아래 문서가 함께 변경됩니다.')+'<br><span style="font-size:11.5px;color:var(--ink3)">🔗 수동으로 연결한 문서는 원본 고객명·연락처를 유지하기 위해 제외됩니다.</span></p>';
  h+=plan.map(p=>'<div class="prop-row"><span class="id">'+p.label+'</span><span class="m">'+p.docs.length+'건</span></div>').join('')||'<div class="dnone">변경 대상 문서 없음</div>';
  document.getElementById('prop-body').innerHTML=h;
  document.getElementById('prop-go').textContent='총 '+total+'건 변경 실행';
  document.getElementById('prop-mask').classList.add('open');
}
window.closeProp=function(){document.getElementById('prop-mask').classList.remove('open');curProp=null;};
document.getElementById('prop-go').addEventListener('click',async()=>{
  if(!curProp)return;
  const btn=document.getElementById('prop-go');btn.disabled=true;btn.textContent='변경 중...';
  await applyEdit(curProp.e,curProp.v,true,curProp.keepApart);
  btn.disabled=false;
});
async function propagateDocs(e,v){
  // 확인창에서 보여 준 계획을 그대로 실행합니다 (그 사이 고객마스터가 바뀌어도 대상이 늘어나지 않도록)
  const plan=(curProp&&curProp.e===e&&curProp.plan)?curProp.plan:propPlan(e,v);
  for(const p of plan){
    for(const x of p.docs){
      const u=p.upd(x);
      if(!Object.keys(u).length)continue;
      try{await updateDoc(doc(db,p.coll,x.__id),u);}catch(err){console.warn(p.coll,x.__id,err.message);}
    }
  }
}

// ═══ 신규 고객 등록 시 동일 인물(다른 연락처) 검사 ═══
// 이름(별칭 포함)이 일치하는 고객이 이미 있고 연락처가 다르면 확인 팝업을 띄워
// 어떤 번호를 쓸지 선택하게 한다. "새 번호로 변경"을 고르면 계약서·인보이스·
// 점검보고서·예약·의뢰·견적·상품권 등 전 프로그램의 이 고객 기록에 즉시 반영된다.
function caFindByName(nm){
  const k=nn(nm);if(!k)return null;
  return entries.find(x=>nn(x.name)===k||(x.aliases||[]).some(a=>nn(a)===k))||null;
}
// ── 🔎 입력한 이름·연락처·별칭이 「다른 고객」과 겹치는지 확인 ──
//    self : 지금 수정 중인 고객마스터(자기 자신은 제외)
function caJosa(w){
  const c=String(w||'').trim().slice(-1);
  const k=c.charCodeAt(0);
  if(!(k>=0xAC00&&k<=0xD7A3))return '이(가)';
  return ((k-0xAC00)%28)?'이':'가';
}
function caDupFind(v,self){

//  추천 링크(/nc?ref=코드)로 들어온 의뢰서(requests.ref_by = 추천인 고객 문서 ID)를 모아

//  · 신규 판정: 같은 고객(전화번호로 묶인 항목)에게 추천 신청일 이전의 서비스 기록이 없을 것
//      서비스 기록 = 인보이스(작성중 제외) · 점검/설치보고서 · 계약서 · 작업완료 예약  (견적서·의뢰만 = 신규)
//  · 확인 필요: 다른 고객의 서비스 기록 주소에 같은 동호수 + 콘도명이 있으면 → 대표님이 「신규로 인정」/「제외」
//  · 본인 추천 · 이미 지급한 고객의 다른 신청 = 자동 제외
//  · 지급: 추천인·신규 고객의 pt_adj(적립 조정)에 넣고, 의뢰서에 ref_status:'paid' 기록 (두 번 지급 안 됨)
//  같은 규칙의 서버 쪽: functions/api/_lib/ref.js (설정 기본값 · 1차 판정)
const REF_DEF={on:true,pts:10,newOn:true,newPts:5};
function refCfg(){
  const p=REF_RAW||{},num=(v,d)=>{const n=parseFloat(v);return isFinite(n)&&n>=0?Math.round(n):d;};
  return {on:p.ref_on!==false,pts:num(p.ref_pts,REF_DEF.pts),newOn:p.ref_new_on!==false,newPts:num(p.ref_new_pts,REF_DEF.newPts)};
}
function crfCN(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9가-힣]/g,'');}
// 이 고객 항목에 「d 날짜 이전」 서비스 기록이 있는가 (d 빈값 = 날짜 무관)
function crfSvcBefore(e,d){
  const lt=v=>!d||(String(v||'').slice(0,10)&&String(v||'').slice(0,10)<d);
  return e.docs.invoices.some(x=>x.status!=='draft'&&lt(x.date))
      || e.docs.inspections.some(x=>lt(x.date))
      || e.docs.contracts.some(x=>lt(x.contract_date||x.created_at))
      || e.docs.bookings.some(x=>x.status==='done'&&lt(x.booking_date||x.date));
}
function crfAddrHay(e){
  const a=[e.addr,e.master&&e.master.addr];
  e.docs.invoices.forEach(x=>{a.push(x.customer&&x.customer.addr);});
  e.docs.inspections.forEach(x=>{a.push(x.address,x.addr,x.condo);});
  e.docs.requests.forEach(x=>{a.push(x.condo_name+' '+x.condo_unit,x.condo);});
  e.docs.bookings.forEach(x=>{a.push(x.address,x.customer_address,x.condo);});
  return crfCN(a.filter(Boolean).join(' '));
}
function crfRows(){
  const out=[];const C=refCfg();
  const byId={};entries.forEach(e=>{if(e.master&&e.master.__id)byId[e.master.__id]=e;});
  (RAW.requests||[]).forEach(x=>{
    if(!x.ref_by)return;
    const e=entries.find(en=>en.docs.requests.indexOf(x)>=0);if(!e)return;
    const rf=byId[x.ref_by]||null;
    const d=String(x.submitted_at||'').slice(0,10);
    const r={x,e,rf,d,idx:entries.indexOf(e),rfIdx:rf?entries.indexOf(rf):-1,inv:null,st:'',why:''};
    const firstInv=e.docs.invoices.filter(v=>v.status!=='draft'&&String(v.date||'')>=d).sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')))[0]||null;
    r.inv=firstInv;
    if(x.ref_status==='paid'){r.st='paid';}
    else if(x.ref_status==='excluded'){r.st='excluded';r.why='대표님이 제외';}
    else if(!rf){r.st='excluded';r.why='추천인 고객을 찾을 수 없음';}
    else if(x.ref_new==='self'||rf===e){r.st='excluded';r.why='본인 추천';}
    else if(e.docs.requests.some(o=>o!==x&&o.ref_status==='paid')){r.st='excluded';r.why='이미 추천 보상을 받은 고객';}
    else if(x.ref_status!=='approved'&&crfSvcBefore(e,d)){r.st='excluded';r.why='기존 고객 (신청 전 서비스 기록)';}
    else{
      let chk='';
      if(x.ref_status!=='approved'){
        const u=crfCN(x.condo_unit),w=String(x.condo_name||'').toUpperCase().split(/[^A-Z0-9가-힣]+/).filter(t=>t.length>=4).map(crfCN);
        if(u.length>=3&&w.length){
          const o=entries.find(en=>en!==e&&crfSvcBefore(en,d)&&(h=>h.indexOf(u)>=0&&w.some(t=>h.indexOf(t)>=0))(crfAddrHay(en)));
          if(o)chk='같은 동호수 서비스 기록 — '+(o.name||'이름 없음')+(o.phone?' ('+o.phone+')':'');
        }
      }
      if(chk){r.st='check';r.why=chk;}
      else if(firstInv&&firstInv.status==='paid'){r.st='ready';}
      else{r.st='wait';r.why=firstInv?('인보이스 '+(firstInv.id||'')+' 결제 전'):'인보이스 발행 전';}
    }
    out.push(r);
  });
  const RK={ready:0,check:1,wait:2,paid:3,excluded:4};
  // 같은 고객이 여러 번 신청한 경우: 진행 중인 줄이 있으면 그 외의 「대기」 줄은 하나만
  return out.sort((a,b)=>(RK[a.st]-RK[b.st])||String(b.x.submitted_at||'').localeCompare(String(a.x.submitted_at||'')))
    .filter((r,i,arr)=>!(r.st==='wait'||r.st==='ready'||r.st==='check')||arr.findIndex(q=>q.e===r.e&&(q.st==='wait'||q.st==='ready'||q.st==='check'))===i);
}

window.caRefPay=async function(id){
  if(!db){toast('Firebase 연결 중입니다');return;}
  const C=refCfg();
  const r=crfRows().find(v=>v.x.__id===id);
  if(!r||r.st!=='ready'){toast('지급 대상이 아닙니다 — 새로고침 후 다시 확인해 주세요');return;}
  const nw=C.newOn&&C.newPts>0;
  if(!confirm('추천 보상을 지급할까요?\n\n· 추천인 '+(r.rf.name||'')+' → 해피포인트 RM '+C.pts+(nw?'\n· 신규 고객 '+(r.e.name||'')+' → 해피포인트 RM '+C.newPts:'')+'\n\n지급하면 두 분의 마이페이지 포인트에 바로 반영됩니다.'))return;
  const now=new Date().toISOString(),today=caToday();
  try{
    // 두 번 지급 막기 — 저장 직전에 의뢰서 상태를 다시 읽습니다
    const fresh=await getDoc(doc(db,'requests',id));
    if(fresh.exists()&&(fresh.data()||{}).ref_status==='paid'){toast('이미 지급된 건입니다');loadAll(true);return;}
    const addPt=async(e,amt,memo)=>{
      let mid=e.master&&e.master.__id,list=((e.master&&e.master.pt_adj)||[]).slice();
      if(!mid){
        const ref=await addDoc(collection(db,'customers'),{id:'c'+Date.now(),name:e.name,phone:e.phone||'',member:e.member||'',email:'',addr:e.addr||'',memo:'',aliases:e.aliases||[],created_at:now,updated_at:now});
        mid=ref.id;
      }else{
        const md=await getDoc(doc(db,'customers',mid));list=((md.exists()&&md.data().pt_adj)||[]).slice();
      }
      list.push({amount:amt,date:today,memo:memo,at:now,ref:id});
      await updateDoc(doc(db,'customers',mid),{pt_adj:list,updated_at:now});
    };
    await addPt(r.rf,C.pts,'추천 보상 · '+(r.e.name||''));
    if(nw)await addPt(r.e,C.newPts,'추천 신규 고객 혜택 · 추천인 '+(r.rf.name||''));
    await updateDoc(doc(db,'requests',id),{ref_status:'paid',ref_paid_at:now,ref_paid_pts:C.pts,ref_new_pts:nw?C.newPts:0,ref_cust_name:r.e.name||'',ref_inv:(r.inv&&(r.inv.id||r.inv.__id))||''});
    toast('🤝 추천 보상이 지급되었습니다');
    const mk=document.getElementById('ca-doc-mask');if(mk)mk.remove();
    await loadAll(true);
    caRefOpen();
  }catch(err){toast('지급 실패: '+err.message);}
};

// ══ ⚡ 포인트 처리 창 하나로 (2026-11-16) ═══════════════════════════════════
//  · 💎 사용 · ➕ 적립 추가 · ➖ 적립 차감을 같은 창에서 — 위 탭으로 바꿈, 처리 후 잔액을 바로 보여 줌
//  · ⭐ 자주 쓰는 메모: 종류별로 settings/points 의 pt_memos 에 저장 → 눌러서 바로 입력 (모든 기기 공통)
//  · 수정: 내역 줄을 누르면 같은 창이 「수정」으로 열림 (ui = pt_used 또는 pt_adj 의 순번)
const PT_MEMO_DEF={use:['서비스 결제 시 차감'],plus:['지인 추천 보상','이벤트 보너스 적립','리뷰 작성 보상','과거 이용분 보상','감사 보상 적립'],minus:['착오 적립 정정']};
function ptMemosOf(v){
  const o={};['use','plus','minus'].forEach(k=>{
    const a=v&&Array.isArray(v[k])?v[k]:null;
    o[k]=(a||PT_MEMO_DEF[k]).map(x=>String(x||'').trim()).filter(Boolean).slice(0,30);
  });return o;
}
const PT_OPM={use:{t:'💎 포인트 사용',lb:'사용 금액',memo:'예: 에어컨 청소 결제 시 차감',go:'사용 처리',sign:-1},
  plus:{t:'➕ 적립 추가',lb:'추가 금액',memo:'예: 지인 추천 보상',go:'적립 추가',sign:1},
  minus:{t:'➖ 적립 차감',lb:'차감 금액',memo:'예: 착오 적립 정정',go:'적립 차감',sign:-1}};
window.caPtOp=function(idx,mode,ei){
  const e=entries[idx];if(!e)return;
  if(!PT_MEMOS)PT_MEMOS=ptMemosOf(REF_RAW&&REF_RAW.pt_memos);
  const PT=ptCalc(e),edit=ei!=null;
  let cur=null;
  if(edit){
    cur=(mode==='use'?(e.master&&e.master.pt_used):(e.master&&e.master.pt_adj))||[];cur=cur[ei];
    if(!cur){toast('내역을 찾을 수 없습니다');return;}
  }
  // 수정할 때는 그 줄만큼 되돌린 잔액을 기준으로 계산합니다
  const curAmt=cur?Math.abs(Math.round(parseFloat(cur.amount)||0)):0;
  const base=edit?(PT.bal+(mode==='plus'?-curAmt:curAmt)):PT.bal;
  const st={mode:mode,manage:false};
  const seg=['use','plus','minus'].map(k=>{
    const off=edit&&((mode==='use')!==(k==='use'));   // 수정: 사용 ↔ 조정 은 서로 바꿀 수 없음
    const off2=!edit&&k==='use'&&PT.bal<10;
    return '<button type="button" class="pos '+k+'" data-k="'+k+'"'+((off||off2)?' disabled':'')+'>'+PT_OPM[k].t+'</button>';
  }).join('');
  const mk=genericModal((edit?'✏️ 포인트 내역 수정':'💎 포인트 처리')+' — '+esc(e.name),
    '<div class="po">'+
    '<div class="po-seg">'+seg+'</div>'+
    '<div class="po-bal"><div><small>'+(edit?'이 내역 빼고':'현재 잔액')+'</small><b>RM '+base.toLocaleString()+'</b></div><i>→</i><div class="af"><small>처리 후 잔액</small><b id="po-af">RM '+base.toLocaleString()+'</b></div></div>'+
    '<div class="fl" id="po-lb"></div>'+
    '<div class="po-amt"><span>RM</span><input id="po-amt" type="number" inputmode="numeric" min="1" step="1" placeholder="0" value="'+(edit?curAmt:'')+'"></div>'+
    '<div class="po-chips" id="po-qa"></div>'+
    '<div class="fl po-mh"><span>메모</span><button type="button" class="po-mg" id="po-mg">⚙️ 자주 쓰는 메모 편집</button></div>'+
    '<div class="po-memo"><input class="fi" id="po-memo" value="'+esc(cur&&cur.memo||'')+'"><button type="button" class="po-star" id="po-star" title="이 메모를 자주 쓰는 메모로 저장">⭐ 저장</button></div>'+
    '<div class="po-chips fav" id="po-fav"></div>'+
    '<div class="fl">날짜</div>'+
    '<div class="po-date"><input class="fi" id="po-date" type="date" value="'+esc(cur&&cur.date||caToday())+'"><button type="button" class="rb" data-d="0">오늘</button><button type="button" class="rb" data-d="-1">어제</button></div>'+
    '<p class="po-note" id="po-note"></p>'+
    '</div>',
    '<button class="btn" onclick="document.getElementById(\'ca-doc-mask\').remove()">취소</button><button class="btn p" id="po-go"></button>');
  mk.querySelector('.modal').classList.add('po-modal');
  const $=id=>mk.querySelector('#'+id);
  const amtEl=$('po-amt'),memoEl=$('po-memo');
  const amt=()=>Math.floor(parseFloat(amtEl.value)||0);
  const paint=()=>{
    const M=PT_OPM[st.mode],a=amt(),af=base+M.sign*a;
    mk.querySelectorAll('.pos').forEach(b=>b.classList.toggle('on',b.dataset.k===st.mode));
    mk.querySelector('.po').dataset.m=st.mode;
    $('po-lb').textContent=M.lb;
    memoEl.placeholder=M.memo;
    const afEl=$('po-af');afEl.textContent='RM '+af.toLocaleString();afEl.classList.toggle('neg',af<0);
    const go=$('po-go');go.textContent=(edit?'✏️ 수정 저장':(a>0?M.go.replace(/^/,'RM '+a+' '):M.go));
    go.disabled=a<=0||(st.mode==='use'&&a>base);
    $('po-note').textContent=st.mode==='use'?(a>base?'⚠️ 잔액(RM '+base+')보다 많이 사용할 수 없습니다':'💡 적립금이 RM 10 이상이면 금액 제한 없이 사용할 수 있습니다 · 내역의 ✕로 언제든 취소(잔액 복구)'):
      (st.mode==='plus'?'💡 고객 마이페이지 내역에 메모가 그대로 보입니다 (예: 「지인 추천 보상」)':'💡 차감 내역도 고객 마이페이지에 메모와 함께 보입니다');
    // 빠른 금액
    const qa=st.mode==='use'?[5,10,20].filter(v=>v<base).concat(base>0?[base]:[]):[5,10,20,50];
    $('po-qa').innerHTML=qa.map(v=>'<button type="button" class="pc'+(a===v?' on':'')+'" data-v="'+v+'">'+(st.mode==='use'&&v===base?'전액 RM '+v:'RM '+v)+'</button>').join('');
    // 자주 쓰는 메모
    const L=PT_MEMOS[st.mode]||[],mv=memoEl.value.trim();
    $('po-fav').innerHTML=(L.length?L.map((t,i)=>'<button type="button" class="pc m'+(mv===t?' on':'')+'" data-i="'+i+'">'+esc(t)+(st.manage?'<em data-x="'+i+'" title="삭제">✕</em>':'')+'</button>').join(''):
      '<span class="po-empty">저장된 메모가 없습니다 — 메모를 쓰고 「⭐ 저장」을 누르세요</span>');
    $('po-fav').classList.toggle('mng',st.manage);
    $('po-mg').textContent=st.manage?'✓ 편집 끝':'⚙️ 자주 쓰는 메모 편집';
    const has=mv&&L.indexOf(mv)>=0;
    $('po-star').disabled=!mv||has;$('po-star').textContent=has?'⭐ 저장됨':'⭐ 저장';
  };
  const saveMemos=async()=>{
    if(!db){toast('Firebase 연결 중입니다');return false;}
    try{await setDoc(doc(db,'settings','points'),{pt_memos:PT_MEMOS,updated_at:new Date().toISOString()},{merge:true});
      if(REF_RAW)REF_RAW.pt_memos=PT_MEMOS;return true;}
    catch(err){toast('메모 저장 실패: '+err.message);return false;}
  };
  mk.querySelectorAll('.pos').forEach(b=>b.onclick=()=>{if(b.disabled)return;st.mode=b.dataset.k;paint();amtEl.focus();});
  amtEl.oninput=paint;memoEl.oninput=paint;
  $('po-qa').onclick=ev=>{const b=ev.target.closest('[data-v]');if(!b)return;amtEl.value=b.dataset.v;paint();};
  $('po-fav').onclick=async ev=>{
    const x=ev.target.closest('[data-x]');
    if(x){ev.stopPropagation();const L=PT_MEMOS[st.mode].slice(),t=L[+x.dataset.x];
      if(!confirm('「'+t+'」 메모를 자주 쓰는 메모에서 지울까요?'))return;
      L.splice(+x.dataset.x,1);PT_MEMOS[st.mode]=L;paint();if(await saveMemos())toast('🗑 자주 쓰는 메모에서 지웠습니다');return;}
    const b=ev.target.closest('[data-i]');if(!b||st.manage)return;
    memoEl.value=PT_MEMOS[st.mode][+b.dataset.i]||'';paint();if(!amt())amtEl.focus();
  };
  $('po-mg').onclick=()=>{st.manage=!st.manage;paint();};
  $('po-star').onclick=async()=>{
    const t=memoEl.value.trim();if(!t)return;
    const L=PT_MEMOS[st.mode].slice();if(L.indexOf(t)>=0)return;
    if(L.length>=30){toast('자주 쓰는 메모는 종류별 30개까지 저장됩니다');return;}

    if(await saveMemos())toast('⭐ 「'+t+'」을(를) '+PT_OPM[st.mode].t.replace(/^\S+\s/,'')+' 자주 쓰는 메모에 저장했습니다');
  };
  mk.querySelector('.po-date').onclick=ev=>{const b=ev.target.closest('[data-d]');if(!b)return;

window.caSendModal=async function(idx,opt){   // opt = {tpl:'cmp',amt,memo} — 포인트 적립 추가 직후 적립 안내 (2026-11-17)

  }
  const D=e.docs||{};
  const CNT={iv:(D.invoices||[]).length,ip:(D.inspections||[]).length,ct:(D.contracts||[]).length,cp:(D.coupons||[]).length};
  // 작성 대기중인 예약 신청서 (예약등록에서 고객 링크만 만들고 고객이 아직 작성 전인 건)
  // → 마이페이지 상단에 예약 신청 화면이 표시되므로, 발송 템플릿도 자동으로 「예약 신청 안내」를 고른다
  const _msT=v=>{if(!v)return 0;if(typeof v.toMillis==='function')return v.toMillis();if(typeof v==='object'&&v.seconds!=null)return v.seconds*1000;const t=Date.parse(String(v));return isNaN(t)?0:t;};
  //  (2026-11-25) 가장 최근에 만든 신청서가 [0] — 예전에는 저장 순서 그대로라 오래된 대기 신청서가 먼저 잡혔습니다
  const BKP=(D.bookings||[]).filter(x=>x.status==='waiting').sort((a,b)=>_msT(b.unconfirmed_at||b.created_at)-_msT(a.unconfirmed_at||a.created_at));
  // 🆕 고객이 신청서를 작성해 확정을 기다리는 예약 (중복 생성 방지 안내용)
  const BKB=(D.bookings||[]).filter(x=>x.status==='booked');
  const _td=new Date();
  const _p2=n=>String(n).padStart(2,'0');
  const _tdy=_td.getFullYear()+'-'+_p2(_td.getMonth()+1)+'-'+_p2(_td.getDate());
  // 확정된 예약 (「예약 확정 안내」 발송용) — 아직 방문 전인 예약을 먼저, 그다음 최근 방문 순
  const BKC=(D.bookings||[]).filter(x=>x.status==='confirmed').sort((a,b)=>{
    const da=String(a.booking_date||''),db2=String(b.booking_date||'');

    if(fa!==fb)return fa-fb;
    return fa===0?da.localeCompare(db2):db2.localeCompare(da);
  });
  // 「오전 9시」·「14:00」·「09:00|11:00」 등 자유형식 방문시간 → 분 단위 (시간 미정이면 그날 마지막까지 유효)

  }).sort((a,b)=>(_msT(b.confirmed_at||b.updated_at||b.created_at)-_msT(a.confirmed_at||a.updated_at||a.created_at))||String(a.booking_date||'').localeCompare(String(b.booking_date||'')));
  //  (2026-11-25) 방문 전 확정 예약이 여러 건이면 「가장 최근에 확정한 예약」이 [0] — 예약 확정 안내가 방금 확정한 건을 보냅니다
  // 접수된 서비스 의뢰 (「의뢰 접수 안내」 발송용) — 최근 접수 순

  //  (2026-11-09 수정) 예전에는 날짜만 비교해서, 오늘·미래 날짜로 확정된 예약이 하나라도 있으면
  //  그 날짜까지 새로 들어온 의뢰가 모두 숨겨져 「의뢰 접수」 버튼이 꺼졌습니다.

    if(k&&/\d{4}\.\s/.test(sv)){
      let h=parseInt(k[5]||'0',10);if(k[4]==='오후'&&h<12)h+=12;if(k[4]==='오전'&&h===12)h=0;
      return new Date(+k[1],+k[2]-1,+k[3],h,parseInt(k[6]||'0',10)).getTime();

  const _rqDone=x=>{
    const at=_ms(x.submitted_at||x.created_at);

  };
  const RQP=(D.requests||[]).slice()
    .filter(x=>!_rqDone(x))
    .sort((a,b)=>_ms(b.submitted_at||b.created_at)-_ms(a.submitted_at||a.created_at));
  // 발송 가능한 쿠폰 — 사용/만료되지 않은 것만, 최근 발급 순

  // 🚗 점검·출장 방문 안내용 메모 — 방문 예정일이 잡힌 건만, 방문일이 가까운 순
  //    (방문이 끝난 건은 방문일 다음 날부터 목록에서 빠집니다)
  const MMV=(D.memos||[]).filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(String(x.visit_date||''))&&String(x.visit_date)>=_tdy)
    .sort((a,b)=>String(a.visit_date||'').localeCompare(String(b.visit_date||'')));
  // 인보이스·점검보고서는 기록이 아직 없어도 기본 노출 — 고객 화면에서 「내역 없음」 안내 카드로
  // 자리를 지켜 주므로 한쪽만 남아 빈 자리가 생기지 않습니다. (필요하면 아래에서 해제 가능)
  // 🎯 발송 창을 열 때 처음 골라 둘 안내 — 「이 고객에게 가장 최근에 일어난 일」 하나 (2026-11-25 전면 재작성)
  //   후보(각각 그 일이 일어난 시각) 중 가장 늦은 것을 고릅니다. 오래된 일은 후보에서 뺍니다.
  //    📥 의뢰 접수   : 예약으로 넘기지 않은 의뢰 · 접수 7일 이내            — 시각 = 접수 시각
  //    📅 예약 신청   : 고객 작성 대기 신청서 · 만든 지 14일 이내             — 시각 = 신청서 만든(대기로 돌린) 시각

  // 미리보기 전용 렌더러 (실제 발송 텍스트는 msg() 원문 그대로 사용)
  function msgHtml(txt){
    // 들여 쓴 이어지는 줄(「      (따로 하실 일은 없습니다)」)은 윗줄과 한 덩어리로 그립니다
    const _L=[];String(txt).split('\n').forEach(ln=>{if(/^ {4,}\S/.test(ln)&&_L.length)_L[_L.length-1]+='\n'+ln.trim();else _L.push(ln);});
    return _L.map(ln=>{
      const t=ln.trim();
      if(!t)return '<div style="height:8px"></div>';
      if(/^[-━]{5,}$/.test(t))return '<div style="border-top:1px dashed #d3dbe8;margin:9px 0"></div>';
      if(t.indexOf('\u{1F449}')===0)return '<div style="background:#fff7e6;border:1px solid #f4cf8a;border-radius:10px;padding:8px 11px;margin:6px 0 2px;font-size:12.5px;font-weight:800;color:#9a3412;line-height:1.6">'+esc(t).replace(/\n/g,'<br>')+'</div>';
      if(t.indexOf('🔗')===0)return '<div style="background:var(--pri-bg);border:1px solid #cfe0ff;border-radius:9px;padding:8px 10px;margin:4px 0;font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--pri);font-weight:700;word-break:break-all">'+esc(t)+'</div>';
      if(t.charAt(0)==='*'||t.charAt(0)==='•')return '<div style="display:flex;gap:7px;padding:2px 0 2px 3px"><span style="color:var(--pri);font-weight:900">●</span><span style="font-weight:800">'+esc(t.replace(/^[*•]\s*/,''))+'</span></div>';
      if(/^https?:\/\//.test(t))return '<div style="background:var(--pri-bg);border:1px solid #cfe0ff;border-radius:9px;padding:8px 10px;margin:4px 0;font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--pri);font-weight:700;word-break:break-all">'+esc(t)+'</div>';
      // 「이름 👉 주소」 링크 줄 — 이름은 굵게, 주소는 파란 상자
      const _lm=/^(.*?)\s*\u{1F449}\s*(https?:\/\/\S+)\s*$/u.exec(t);
      if(_lm)return '<div style="margin:5px 0 3px"><div style="font-weight:900;font-size:12px;color:var(--ink)">'+esc(_lm[1].replace(/\*/g,''))+'</div><div style="background:var(--pri-bg);border:1px solid #cfe0ff;border-radius:9px;padding:7px 10px;margin-top:3px;font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--pri);font-weight:700;word-break:break-all">'+esc(_lm[2])+'</div></div>';
      let x=esc(t).replace(/(RM\s?[\d,]+(?:\.\d+)?|[\d,]+링깃)/g,'<b style="color:#c2410c;font-size:14.5px;font-weight:900;letter-spacing:-.01em">$1</b>');
      // *제목* — 왓츠앱 굵은 글씨 (미리보기도 굵고 조금 크게)
      x=x.replace(/\*([^*]+)\*/g,'<b style="font-size:14px;font-weight:900;color:var(--ink)">$1</b>');
      if(/^[1-9]\u{FE0F}?\u{20E3}/u.test(t))return '<div style="background:var(--pri-bg);border-left:4px solid var(--pri);border-radius:8px;padding:7px 11px;margin:7px 0 4px;font-size:13px;font-weight:900;color:var(--pri);letter-spacing:-.01em">'+esc(t)+'</div>';
      if(/^[①②③④⑤]/.test(t))return '<div style="padding:2px 0 2px 12px;font-weight:700;color:var(--ink2)">'+esc(t)+'</div>';
      if(t.indexOf('🍎')===0||t.indexOf('🤖')===0)return '<div style="font-weight:900;font-size:13px;margin-top:4px">'+esc(t)+'</div>';
      if(t.indexOf('📱')===0||t.indexOf('🏠')===0)x='<span style="font-weight:800">'+x+'</span>';
      return '<div>'+x.replace(/\n/g,'<br>')+'</div>';
    }).join('');
  }

// ── 상품권 · 견적서 · 기타 기록 표시 도우미 (2026-11-16)
function cxDays(a,b){const x=new Date(String(a).slice(0,10)+'T00:00:00'),y=new Date(String(b).slice(0,10)+'T00:00:00');return Math.round((x-y)/864e5);}
function cxKd(d){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(d||''));if(!m)return String(d||'');const w=new Date(+m[1],+m[2]-1,+m[3]).getDay();return (+m[2])+'월 '+(+m[3])+'일 ('+'일월화수목금토'[w]+')';}
function cxCpState(x,t){
  if(x.status==='used')return {c:'s-off',t:'✔ 사용완료',s:x.usedAt?String(x.usedAt).slice(0,10)+' 사용':'',dim:1};
  if(x.status&&x.status!=='active')return {c:'s-off',t:String(x.status),s:'',dim:1};
  if(x.expiry&&String(x.expiry)<t)return {c:'s-off',t:'⏹ 기한 만료',s:'~'+x.expiry,dim:1};
  const d=x.expiry?cxDays(x.expiry,t):null;
  if(d!==null&&d<=30)return {c:'s-soon',t:'⏳ 만료 임박',s:'D-'+d+' · ~'+x.expiry};
  return {c:'s-ok',t:'✅ 사용 가능',s:x.expiry?'D-'+d+' · ~'+x.expiry:'기한 없음'};
}
function cxQtItems(x){const it=Array.isArray(x.items)?x.items.filter(i=>i&&i.name):[];if(!it.length)return '';const f=it[0];return f.name+(f.qty?' '+f.qty+(f.unit||''):'')+(it.length>1?' 외 '+(it.length-1)+'건':'');}
function cxQtState(x,t){
  if(x.customerChoice)return {c:'s-vio',t:'✓ 고객 선택'};
  if(x.validUntil&&String(x.validUntil)<t)return {c:'s-off',t:'⏹ 기한 만료',dim:1};
  const d=x.validUntil?cxDays(x.validUntil,t):null;
  return d!==null&&d<=7?{c:'s-soon',t:'⏳ D-'+d}:{c:'s-ok',t:'✅ 유효'+(d!==null?' · D-'+d:'')};
}
function cxRqItems(x){let a=[];try{a=typeof x.items==='string'?JSON.parse(x.items||'[]'):(x.items||[]);}catch(_){a=[];}
  if(!Array.isArray(a))return '';return a.map(i=>((i.cat?i.cat+' ':'')+(i.svc||i.name||'')+(i.qty&&String(i.qty)!=='1'?' ×'+i.qty:'')).trim()).filter(Boolean).join(', ');}
function cxRqState(x){
  if(x.status==='excluded')return {c:'s-off',t:'제외',dim:1};
  if(x.converted_to_booking||x.converted_booking_id)return {c:'s-blue',t:'→ 예약 전환됨',dim:1};
  if(x.status==='completed'||x.status==='paid')return {c:'s-ok',t:'처리완료'};
  return {c:'s-new',t:'🔔 새 의뢰'};
}
function cxBkState(x,t){
  const d=String(x.booking_date||'');
  if(x.status==='confirmed'&&d&&d<t)return {c:'s-off',t:'✔ 작업완료',dim:1};
  if(x.status==='confirmed')return {c:'s-ok',t:'✅ 확정'};
  if(x.status==='booked')return {c:'s-blue',t:'📝 신청완료'};
  if(x.status==='waiting'||!x.status)return {c:'s-soon',t:'⏳ 대기중'};
  return {c:'s-off',t:String(x.status),dim:1};
}

  if(coll==='inspections')return inspLabel(x.type,x)+' · '+(x.date||'')+(x.addr?' · '+x.addr:'');

//  · 옵션2 : 연락처도 이 고객 것으로 변경

// ═══ 📅 스케줄 캘린더 자동 반영 ═══════════════════════════════
// memo-admin.html 의 syncSchedule 과 똑같은 규칙입니다. 어느 화면에서 고쳐도
// 방문 예정일이 캘린더(schedules · type:'repair')에 같은 방식으로 반영되도록
// 두 화면의 동작을 맞춰 둡니다. (메모 문서의 schedule_id 로 1:1 관리)
function caSchedTitle(m){
  const who=String(m.condo||'').trim(), nm=String(m.name||'').trim();
  const ct=(m.kind==='curtain');
  // 고객명이 콘도명과 같거나(총괄 고객관리 이름이 콘도·호수인 고객) 서로 포함되면 한 번만 표시
  const _n=x=>x.toLowerCase().replace(/\s+/g,' ');
  const dup=who&&nm&&(_n(who).includes(_n(nm))||_n(nm).includes(_n(who)));
  const base=dup?(nm.length>who.length?nm:who):who&&nm?(who+' ('+nm+')'):(who||nm||(ct?'커튼 재설치':'수리 방문'));
  return (ct?'🧺 커튼 재설치 · ':'🛠 ')+base;
}
function caSchedMemo(m){
  const ct=(m.kind==='curtain');
  return [
    ct?'🔧 커튼 세탁 · 재설치 방문':(m.symptom?'🔧 '+m.symptom:''),
    (ct&&m.req_date)?('🧺 수거일: '+m.req_date):'',
    (ct&&m.wash_date)?('🧼 세탁 완료 예정: '+m.wash_date):'',
    m.phone?'📞 '+m.phone:'',
    m.memo?'📝 '+m.memo:'',
    ct?'※ 메모장(커튼세탁)에서 자동 등록된 일정입니다.'
       :'※ 메모장(수리요청)에서 자동 등록된 일정입니다.'
  ].filter(Boolean).join('\n');
}
async function caSyncSchedule(memoId,d,prevSchedId){
  if(!db||!memoId)return prevSchedId||'';
  const sid=prevSchedId||'';
  const now=new Date().toISOString();
  try{
    if(!d.visit_date){                       // 방문 예정일이 없어짐 → 캘린더에서 제거
      if(sid){
        try{await deleteDoc(doc(db,'schedules',sid));}catch(e){}
        await updateDoc(doc(db,'memos',memoId),{schedule_id:''});
      }
      return '';
    }
    const fields={
      date:d.visit_date,
      title:caSchedTitle(d),
      time_s:d.visit_time||'',
      time_e:'',
      type:'repair',
      memo:caSchedMemo(d),
      memo_id:memoId,
      customer_name:d.name||d.condo||'',
      customer_phone:d.phone||'',
      updated_at:now
    };
    if(sid){
      try{await updateDoc(doc(db,'schedules',sid),fields);return sid;}
      catch(e){/* 캘린더에서 이미 지워진 경우 → 아래에서 새로 만듭니다 */}
    }
    fields.created_at=now;
    const r=await addDoc(collection(db,'schedules'),fields);
    await updateDoc(doc(db,'memos',memoId),{schedule_id:r.id});
    return r.id;
  }catch(e){
    toast('⚠ 캘린더 반영 실패: '+e.message);
    return sid;
  }
}

  return BASE+'/memo-admin.html?'+u.toString();
}
function caMemoRpReady(x){return !!(x&&x.kind!=='curtain'&&(String(x.result||'').trim()||(x.result_photos||[]).length));}
function caMemoActs(idx,x){
  const id=esc(x.__id),ct=x.kind==='curtain';
  const last=(x.sent_log||[]).slice(-1)[0];
  const lastTx=last?('📤 '+esc(String(last.at||'').slice(0,16).replace('T',' '))+' · '+
    (ct?('①②③④'.charAt(Math.max(0,Math.min(3,(last.tpl||1)-1)))+' 안내')
       :((last.tpl===5||last.tpl===6)?'📄 결과 보고서':(last.tpl===2?'②예정시각':(last.tpl===3?'③작업방문등록':'①즉시'))))+' 발송'):'';
  return (lastTx?'<div class="mr-log">'+lastTx+'</div>':'')+
    '<div class="mr-acts">'+
      (x.status==='done'?'':'<button type="button" class="ma s" onclick="caMemoSend(\''+id+'\')">💬 '+(ct?'안내 발송':'방문확인 발송')+'</button>')+

      (x.status==='done'

        :'<button type="button" class="ma ok" onclick="caMemoStatus('+idx+',\''+id+'\',\'done\')">✅ 완료</button>')+
      '<button type="button" class="ma del" onclick="caMemoDel('+idx+',\''+id+'\')">🗑</button>'+

      : (prevSchedId?'✓ 저장 — 방문 예정일이 없어 캘린더에서 제거했습니다':(mid?'✓ 메모가 수정되었습니다':'✓ 메모가 등록되었습니다')));

function genericModal(title,bodyHTML,footHTML){
  const old=document.getElementById('ca-doc-mask');if(old)old.remove();
  const mk=document.createElement('div');mk.id='ca-doc-mask';mk.className='mask open';
  mk.innerHTML='<div class="modal"><div class="modal-h">'+title+'<button class="x" onclick="document.getElementById(\'ca-doc-mask\').remove()">✕</button></div>'+
    '<div class="modal-b">'+bodyHTML+'</div>'+(footHTML?'<div class="modal-f">'+footHTML+'</div>':'')+'</div>';
  mk.addEventListener('click',ev=>{if(ev.target===mk)mk.remove();});
  document.body.appendChild(mk);
  return mk;
}
// ── + 연결: 다른/미지정 고객의 문서를 이 고객에게 연결(이관) ──
window.caDocLink=function(coll,idx){
  const e=entries[idx];if(!e)return;
  const myN=nn(e.name),myKeys=[myN].concat(e.aliases.map(nn)),myP=pn(e.phone);
  const myKey=entryKey(e);
  const mine=x=>{
    if(docExtraKeys(x).indexOf(myKey)>=0)return true;   // 이미 중복 연결된 문서
    if(docOffFor(x,e))return false;             // 🔓 이 고객에서 해제한 문서는 「연결 안 됨」으로 봅니다
    if(x.ca_link)return x.ca_link===myKey;      // 수동 연결이 우선입니다
    const on=nn(docOwnerName(coll,x)),op=pn(docOwnerPhone(coll,x));
    return (myP&&op===myP)||(on&&myKeys.includes(on));
  };
  const mk=genericModal(COLL_LB[coll]+' 연결 — '+esc(e.name),
    '<p style="font-size:12px;color:var(--ink2);line-height:1.6;margin-bottom:10px">문서를 선택하면 이 고객(<b>'+esc(e.name)+'</b>)에게 연결됩니다.<br>📌 고객명·연락처가 <b>서로 달라도 그대로 유지한 채</b> 연결됩니다.<br>🔗 <b>이미 다른 고객에게 연결된 문서도 그대로 선택</b>할 수 있으며, 기본값인 「중복 연결」을 고르면 <b>기존 고객은 그대로 두고</b> 이 고객에게도 함께 표시됩니다.</p>'+
    '<input class="fi" id="ca-lk-q" placeholder="🔍 검색 (번호·이름·날짜)" style="margin-bottom:10px">'+
    '<div id="ca-lk-list" style="max-height:46vh;overflow-y:auto"></div>');
  const listEl=mk.querySelector('#ca-lk-list'),qEl=mk.querySelector('#ca-lk-q');
  function draw(){
    const q=(qEl.value||'').toLowerCase().replace(/\s+/g,'');
    const rows=RAW[coll].filter(x=>{
      if(!q)return true;
      return (docSummary(coll,x)+docOwnerName(coll,x)+(docOwnerPhone(coll,x)||'')).toLowerCase().replace(/\s+/g,'').includes(q);
    }).slice(0,80);
    listEl.innerHTML=rows.length?rows.map(x=>{
      const isMine=mine(x);
      const own=docOwnerName(coll,x);
      const dupN=docExtraKeys(x).length;
      const tag=(x.ca_link?'<span class="own" style="color:#5B21B6">➡️ 이관됨</span>':'')+(dupN?'<span class="own" style="color:#92400E">🔗 중복 '+dupN+'</span>':'');
      return '<div class="lk-row'+(isMine?' mine':'')+'" data-id="'+esc(x.__id)+'" data-mine="'+(isMine?'1':'')+'">'+
        '<span style="font-weight:800">'+esc(docSummary(coll,x))+'</span>'+tag+
        '<span class="own">'+(isMine?'이미 이 고객':esc(own||'(고객 미지정)'))+'</span></div>';
    }).join(''):'<div class="dnone">문서가 없습니다</div>';
  }
  draw();
  qEl.addEventListener('input',draw);
  listEl.addEventListener('click',ev=>{
    const el=ev.target.closest('.lk-row');if(!el||el.dataset.mine)return;
    const x=RAW[coll].find(d=>d.__id===el.dataset.id);if(!x)return;
    caLinkConfirm(coll,x,e,()=>{mk.remove();});
  });
};
// ── 연결 확인 모달 ──────────────────────────────────────────────
// 고객명·연락처가 서로 달라도 「그대로 유지」한 채 연결됩니다.
// 문서에 ca_link(고객 지정표)를 저장하는 방식이라 원본 양식이 전혀 바뀌지 않습니다.
// 이름/연락처가 다르면 ⚠️ 경고 안내문만 보여주고, 필요할 때만 수동으로 바꿉니다.
function caLinkConfirm(coll,x,e,onDone){
  const own=docOwnerName(coll,x);
  const ownP=docOwnerPhone(coll,x);
  const pk=ownerPhoneKey(coll);
  const nameDiff=own&&nn(own)!==nn(e.name)&&!e.aliases.some(a=>nn(a)===nn(own));
  const phoneDiff=!!(pk&&pn(ownP)&&pn(e.phone)&&pn(ownP)!==pn(e.phone));
  const noPhone=!!(pk&&pn(ownP)&&!pn(e.phone));

  let warn='';
  if(nameDiff||phoneDiff||noPhone){
    warn='<div class="lk-warn">⚠️ <b>고객 정보가 서로 다릅니다.</b><br>'+
      (nameDiff?'· 고객명 — 문서 <b>'+esc(own)+'</b> / 연결할 고객 <b>'+esc(e.name)+'</b><br>':'')+
      (phoneDiff?'· 연락처 — 문서 <b>'+esc(ownP)+'</b> / 연결할 고객 <b>'+esc(e.phone)+'</b><br>':'')+
      (noPhone?'· 연락처 — 문서 <b>'+esc(ownP)+'</b> / 연결할 고객 <b>등록 없음</b><br>':'')+
      '<span style="display:block;margin-top:6px">그래도 <b>문서의 고객명·연락처는 그대로 둔 채</b> 이 고객에게 연결됩니다. '+
      '인보이스·점검보고서·계약서에 인쇄되는 내용은 전혀 바뀌지 않습니다.</span></div>';
  }

  const mk2=genericModal('🔗 문서 연결 확인',
    '<div style="font-size:12px;color:var(--ink2);line-height:1.7;margin-bottom:11px">아래 문서를 <b style="color:var(--ink)">'+esc(e.name)+'</b> 고객에게 연결합니다.</div>'+
    '<div style="background:var(--bg);border:1px solid var(--bdr);border-radius:10px;padding:10px 12px;font-size:12px;font-weight:800;color:var(--ink);margin-bottom:11px">'+COLL_LB[coll]+'<br><span style="font-weight:700;color:var(--ink2)">'+esc(docSummary(coll,x))+'</span>'+
      (own||ownP?'<br><span style="font-weight:700;color:var(--ink3);font-size:11px">문서에 적힌 정보 — '+esc(own||'(이름 없음)')+(ownP?' · '+esc(ownP):'')+'</span>':'')+'</div>'+
    warn+
    '<div style="font-size:11px;font-weight:800;color:var(--ink3);margin:2px 0 6px">연결 방식</div>'+
    '<label class="lk-keep"><input type="radio" name="lkmode" value="dup" checked><span><b>🔗 중복 연결 — 기존 고객은 그대로 두고 이 고객에게도 함께 표시</b><span>인보이스·계약서·점검보고서·상품권을 여러 고객에게 동시에 보여줄 때 사용합니다. 원래 고객의 목록·마이페이지에서도 그대로 보입니다.</span></span></label>'+
    '<label class="lk-keep"><input type="radio" name="lkmode" value="move"><span><b>➡️ 이관 연결 — 이 문서를 이 고객 소속으로 옮김</b><span>기존 고객의 목록에서는 사라지고 이 고객에게만 표시됩니다. (기존 방식)</span></span></label>'+
    '<div id="lk-opt" style="display:none">'+
    '<div style="font-size:11.5px;color:var(--ink3);line-height:1.6;margin:8px 0 8px">아래 항목은 <b>필요할 때만</b> 선택하세요. 선택하지 않으면 원본 그대로 유지됩니다.</div>'+
    '<label class="lk-keep"><input type="checkbox" id="lk-rename"><span><b>문서의 고객명도 「'+esc(e.name)+'」(으)로 변경</b><span>체크하지 않으면 문서에 적힌 이름'+(own?' 「'+esc(own)+'」':'')+'이 그대로 유지됩니다.</span></span></label>'+
    (pk?'<label class="lk-keep"><input type="checkbox" id="lk-rephone"><span><b>문서의 연락처도 「'+esc(e.phone||'(없음)')+'」(으)로 변경</b><span>체크하지 않으면 문서에 적힌 연락처'+(ownP?' 「'+esc(ownP)+'」':'')+'가 그대로 유지됩니다.</span></span></label>':'')+
    '</div>',
    '<button class="btn" onclick="document.getElementById(\'ca-doc-mask\').remove()">취소</button><button class="btn p" id="lk-go">연결하기</button>');

  const _mode=()=>{const r=mk2.querySelector('input[name="lkmode"]:checked');return r?r.value:'dup';};
  const _optBox=mk2.querySelector('#lk-opt');
  const _syncMode=()=>{if(_optBox)_optBox.style.display=(_mode()==='move')?'block':'none';};
  Array.prototype.forEach.call(mk2.querySelectorAll('input[name="lkmode"]'),r=>r.addEventListener('change',_syncMode));
  _syncMode();

  mk2.querySelector('#lk-go').addEventListener('click',async()=>{
    const mode=_mode();
    const cb=mk2.querySelector('#lk-rename'),cp=mk2.querySelector('#lk-rephone');
    const renameToo=(mode==='move')&&!!(cb&&cb.checked), rephoneToo=(mode==='move')&&!!(cp&&cp.checked);
    const btn=mk2.querySelector('#lk-go');btn.disabled=true;btn.textContent='연결 중...';
    let f;
    if(mode==='dup'){
      const key=entryKey(e);
      const ks=docExtraKeys(x).slice();
      if(ks.indexOf(key)<0)ks.push(key);
      f={ca_links:ks,ca_links_at:new Date().toISOString()};
      // 이 고객에서 자동연결을 해제해 둔 문서라면 해제 표시를 지웁니다
      const off=docOffKeys(x).filter(k=>entryKeys(e).indexOf(k)<0);
      if(off.length!==docOffKeys(x).length)f.ca_off=off;
    }else{
      f=linkFieldsFor(coll,e,renameToo,rephoneToo);
      // 이관 대상 고객이 중복 연결에도 들어 있으면 중복 쪽에서 빼 준다 (중복 표시 방지)
      const ks=docExtraKeys(x).filter(k=>k!==entryKey(e));
      if(docExtraKeys(x).length!==ks.length)f.ca_links=ks;
    }
    try{
      await updateDoc(doc(db,coll,x.__id),f);
      mk2.remove();if(onDone)onDone();
      if(mode==='dup')toast('✓ 중복 연결되었습니다 — 기존 고객에도 그대로 표시됩니다');
      else{
        const chg=[renameToo?'고객명':'',rephoneToo?'연락처':''].filter(Boolean).join('·');
        toast(chg?'✓ 이관 연결되었습니다 ('+chg+' 변경)':'✓ 이관 연결되었습니다 — 문서 내용은 그대로 유지');
      }
      loadAll(true);
    }catch(err){btn.disabled=false;btn.textContent='연결하기';toast('연결 실패: '+err.message);}
  });
}
// ── 🔗 수동 연결 해제 ────────────────────────────────
//  idx(고객 인덱스)가 있고 그 고객이 「중복 연결」 대상이면 그 고객만 빼고,
//  아니면 기존처럼 이관 연결(ca_link)을 해제해 원래 고객명·연락처 기준으로 되돌립니다.
window.caDocUnlink=async function(coll,id,idx){
  const x=RAW[coll].find(d=>d.__id===id);if(!x)return;
  const e=(idx===undefined||idx===null)?null:entries[idx];
  const key=e?entryKey(e):'';
  const isDup=!!(key&&docExtraKeys(x).indexOf(key)>=0);
  const msgQ=isDup
    ?('이 '+COLL_LB[coll]+' 문서를 「'+(e.name||'')+'」 고객에서만 연결 해제할까요?\n\n'+docSummary(coll,x)+'\n\n원래 고객과 다른 중복 연결 고객에게는 그대로 남아 있습니다.')
    :('이 '+COLL_LB[coll]+' 문서의 수동 연결을 해제할까요?\n\n'+docSummary(coll,x)+'\n\n해제하면 문서에 적힌 고객명·연락처 기준으로 다시 분류됩니다.');
  if(!confirm(msgQ))return;
  try{
    if(isDup)await updateDoc(doc(db,coll,id),{ca_links:docExtraKeys(x).filter(k=>k!==key)});
    else await updateDoc(doc(db,coll,id),{ca_link:'',ca_link_name:''});
    toast('✓ 연결이 해제되었습니다');loadAll(true);
  }catch(err){toast('해제 실패: '+err.message);}
};

// ── 🔓 자동연결 해제 : 이름·연락처가 같아서 자동으로 붙은 문서를 이 고객에서 떼어냅니다 ──
//     문서 자체는 지워지지 않고, 목록에 「🔓 연결 해제된 문서」 항목으로 따로 남습니다.
//     다른 고객에게 「+ 연결」로 붙이거나, ⋮ 메뉴에서 복구할 수 있습니다.
window.caDocDetach=async function(coll,id,idx){
  const x=RAW[coll].find(d=>d.__id===id);if(!x)return;
  const e=entries[idx];if(!e)return;
  if(!confirm('이 '+COLL_LB[coll]+' 문서를 「'+(e.name||'')+'」 고객에서 떼어낼까요?\n\n'+docSummary(coll,x)+
    '\n\n· 문서는 삭제되지 않습니다.\n· 목록에 「🔓 연결 해제된 문서」로 따로 표시되며, 다른 고객에게 연결하거나 되돌릴 수 있습니다.'))return;
  try{
    const ks=docOffKeys(x).slice();
    entryKeys(e).forEach(k=>{if(ks.indexOf(k)<0)ks.push(k);});
    await updateDoc(doc(db,coll,id),{ca_off:ks});
    toast('🔓 이 고객에서 연결이 해제되었습니다');
    await caAskDropAlias(e,docOwnerName(coll,x));
    loadAll(true);
  }catch(err){toast('해제 실패: '+err.message);}
};
// ── 🏷 별칭 정리 : 자동연결을 해제한 문서의 고객명이 이 고객의 「별칭」으로 등록돼 있으면 지울지 묻습니다 ──
//    (별칭이 남아 있으면 같은 이름으로 새로 만든 문서가 또 이 고객에게 자동으로 붙습니다)
async function caAskDropAlias(e,docName){
  try{
    const m=e&&e.master;if(!m||!m.__id)return;
    const dn=nn(docName);if(!dn)return;
    if(dn===nn(m.name))return;                       // 대표 이름은 건드리지 않습니다
    const al=(m.aliases||[]).filter(Boolean);
    if(!al.some(a=>nn(a)===dn))return;
    if(!confirm('「'+docName+'」 이(가) 이 고객의 별칭으로 등록돼 있습니다.\n\n별칭을 그대로 두면 같은 이름으로 새로 만든 문서가 다시 이 고객에게 자동으로 붙습니다.\n별칭에서 「'+docName+'」 을(를) 지울까요?'))return;
    const next=al.filter(a=>nn(a)!==dn);
    await updateDoc(doc(db,'customers',m.__id),{aliases:next,updated_at:new Date().toISOString()});
    e.master.aliases=next;
    toast('🏷 별칭에서 「'+docName+'」 을(를) 지웠습니다');
  }catch(err){toast('별칭 정리 실패: '+err.message);}
}
// ── ↩️ 자동연결 복구 : 떼어냈던 문서를 다시 이름·연락처 기준으로 붙입니다 ──
window.caDocReattach=async function(coll,id,idx){
  const x=RAW[coll].find(d=>d.__id===id);if(!x)return;
  if(!confirm('이 '+COLL_LB[coll]+' 문서의 자동연결을 복구할까요?\n\n'+docSummary(coll,x)+
    '\n\n문서에 적힌 고객명·연락처와 일치하는 고객에게 다시 표시됩니다.'))return;
  try{
    await updateDoc(doc(db,coll,id),{ca_off:[]});
    toast('↩️ 자동연결이 복구되었습니다');
    loadAll(true);
  }catch(err){toast('복구 실패: '+err.message);}
};

// ── 🔗 연결 관리 : 이 고객에게 연결된 문서를 한눈에 보고 선택 해제 (F27-c) ──
window.caLinkManage=function(idx){
  const e=entries[idx];if(!e)return;
  const key=entryKey(e);
  const COLLS=['invoices','inspections','contracts','coupons','requests','bookings','quotes','schedules'];
  const rows=[];
  COLLS.forEach(coll=>{
    (RAW[coll]||[]).forEach(x=>{
      const dup=docExtraKeys(x).indexOf(key)>=0;
      const mov=(x.ca_link===key);
      if(dup||mov)rows.push({coll:coll,x:x,mode:dup?'dup':'move'});
    });
  });
  // 🔓 이름·연락처(별칭 포함)가 같아서 자동으로 붙은 문서 — 여기서 바로 떼어낼 수 있습니다
  //    문서에 적힌 고객명이 이 고객의 대표 이름과 다른 문서(별칭으로 붙은 문서)를 맨 위에 올려 줍니다
  const mineN=nn(e.name),auto=[];
  COLLS.forEach(coll=>{
    (((e.docs&&e.docs[coll])||[])).forEach(x=>{
      if(!x||!x.__id)return;
      if(x.ca_link||docExtraKeys(x).indexOf(key)>=0)return;   // 수동 연결은 위에서 이미 담았습니다
      if(rows.some(r=>r.coll===coll&&r.x&&r.x.__id===x.__id))return;
      const on=nn(docOwnerName(coll,x));
      auto.push({coll:coll,x:x,mode:'auto',other:!!(on&&on!==mineN)});
    });
  });
  auto.sort((a,b)=>(a.other?0:1)-(b.other?0:1));
  auto.forEach(r=>rows.push(r));
  const othN=rows.filter(r=>r.other).length;
  const body=rows.length

// 📅 예약·메모를 지우면 캘린더에 자동 등록된 일정도 함께 지웁니다.
//    (예전에는 문서만 지워져 스케줄 캘린더에 일정이 남아 있었습니다)
function caLinkedSchedules(coll,id,x){
  const out=[];
  (RAW.schedules||[]).forEach(function(s2){
    if(!s2||!s2.__id)return;
    if(coll==='bookings'){
      if(s2.booking_id===id){out.push(s2.__id);return;}
      // booking_id 가 없던 시절에 만들어진 옛 일정 — 같은 고객·같은 날짜의 「예약 자동등록」만
      if(String(s2.type||'')!=='booking'||s2.booking_id)return;
      const nm=String((x&&x.customer_name)||'').trim();
      const dt=String((x&&x.booking_date)||'').slice(0,10);
      if(!nm||!dt)return;
      if(String(s2.date||'').slice(0,10)!==dt)return;
      if(String(s2.customer_name||'').trim()===nm||String(s2.title||'').indexOf(nm)>=0)out.push(s2.__id);
    }else if(coll==='memos'){
      if(s2.memo_id===id||(x&&x.schedule_id&&s2.__id===x.schedule_id))out.push(s2.__id);
    }
  });
  return [...new Set(out)];
}
window.caDocDel=async function(coll,id){
  const x=RAW[coll].find(d=>d.__id===id);if(!x)return;
  const sch=caLinkedSchedules(coll,id,x);
  if(!confirm(COLL_LB[coll]+' 문서를 삭제할까요?\n\n'+docSummary(coll,x)+
    (sch.length?'\n\n· 캘린더에 자동 등록된 일정 '+sch.length+'건도 함께 삭제됩니다.':'')+
    '\n\n⚠ 삭제하면 되돌릴 수 없습니다.'))return;
  try{
    await deleteDoc(doc(db,coll,id));
    for(const sid of sch){try{await deleteDoc(doc(db,'schedules',sid));}catch(_){}}
    toast(sch.length?('✓ 삭제되었습니다 (캘린더 일정 '+sch.length+'건 포함)'):'✓ 삭제되었습니다');
    loadAll(true);
  }catch(err){toast('삭제 실패: '+err.message);}
};

// 「어느 고객으로 합칠지」를 먼저 고르게 하고, 고른 고객(기준)에 다음을 모읍니다.
//  · 상대 고객의 이름·별칭 → 기준 고객의 별칭
//  · 상대 고객에게 달려 있던 모든 문서 → ca_link 로 기준 고객에 직접 연결
//    (이름·연락처가 달라도 확실히 따라오므로 「병합했는데 그대로」가 생기지 않습니다)
//  · 남은 고객마스터 문서 정리
function mgLabel(e){

}
window.openMergePick=function(i){
  const pair=mergeSug[i]; if(!pair)return;
  const [a,b]=pair;
  const bg=document.getElementById('mgpick-mask');
  document.getElementById('mgpick-body').innerHTML=
    '<p class="mgp-q">두 항목을 하나로 합칩니다.<br><b>어느 고객 이름으로 남길지</b> 골라 주세요.</p>'+
    '<button type="button" class="mgp-opt" onclick="doMergeInto('+i+',0)">'+mgLabel(a)+'</button>'+
    '<button type="button" class="mgp-opt" onclick="doMergeInto('+i+',1)">'+mgLabel(b)+'</button>'+
    '<p class="mgp-n">고르지 않은 쪽의 이름은 <b>별칭</b>으로 저장되고, 그 고객의 문서·내역은 모두 기준 고객으로 옮겨집니다.</p>';
  bg.classList.add('open');
};
window.closeMergePick=function(){
  const bg=document.getElementById('mgpick-mask'); if(bg)bg.classList.remove('open');
};
window.doMergeInto=async function(i,t){
  const pair=mergeSug[i]; if(!pair)return;
  const a=pair[t?1:0], b=pair[t?0:1];      // a = 기준(남길 고객), b = 흡수될 고객
  closeMergePick();
  const now=new Date().toISOString();
  const _al=e=>[].concat((e.master&&e.master.aliases)||[],e.aliases||[],e.linkNames||[]);
  const aliases=[...new Set(_al(a).concat([b.name]).concat(_al(b)))]
    .filter(x=>x&&nn(x)!==nn(a.name));
  try{
    toast('병합 중입니다…');
    let aid=a.master&&a.master.__id;
    if(aid){
      const upd={aliases,updated_at:now};
      if(!pn(a.phone)&&pn(b.phone))upd.phone=b.phone;
      if(!a.member&&b.member)upd.member=b.member;
      await updateDoc(doc(db,'customers',aid),upd);
    }else if(b.master&&b.master.__id){
      // 기준 쪽에는 고객등록이 없고 상대 쪽에만 있는 경우
      //  → 상대의 고객마스터를 지우지 않고 「이름만 기준 이름으로」 바꿔 재사용합니다.
      //    (다른 문서가 그 고객을 ca_link 로 가리키고 있어도 연결이 끊기지 않습니다)
      aid=b.master.__id;
      await updateDoc(doc(db,'customers',aid),{
        name:a.name,phone:pn(a.phone)?a.phone:(b.phone||''),
        member:a.member||b.member||'',aliases,updated_at:now});
    }else{
      const ref=await addDoc(collection(db,'customers'),{
        id:'c'+Date.now(),name:a.name,phone:a.phone||b.phone||'',
        member:a.member||b.member||'',email:a.email||'',addr:a.addr||'',memo:'',
        aliases,created_at:now,updated_at:now});
      aid=ref.id;
    }
    // 상대 고객의 문서를 기준 고객으로 직접 연결 (이름이 달라도 확실히 따라옵니다)
    const key='m:'+aid;
    const jobs=[];
    Object.keys(b.docs||{}).forEach(coll=>{
      (b.docs[coll]||[]).forEach(x=>{
        if(!x||!x.__id||x.ca_link===key)return;
        jobs.push(updateDoc(doc(db,coll,x.__id),{ca_link:key,ca_link_name:a.name}));
      });
    });
    if(jobs.length)await Promise.all(jobs);
    // 남은 고객마스터 정리 (재사용한 경우는 건너뜁니다)
    if(b.master&&b.master.__id&&b.master.__id!==aid)await deleteDoc(doc(db,'customers',b.master.__id));
    // 같은 쌍이 다시 제안되지 않도록 기억해 둡니다
    try{mgDismiss[mgPairKey(a,b)]=1;localStorage.setItem(MG_DISMISS_KEY,JSON.stringify(mgDismiss));}catch(e){}
    toast('✓ 「'+a.name+'」 (으)로 병합되었습니다'+(jobs.length?(' · 문서 '+jobs.length+'건 이동'):''));
    loadAll(true);
  }catch(err){toast('병합 실패: '+(err&&err.message||err));}
};

// ═══ 📎 연계 문서 생성 (인보이스 · 점검보고서 · 계약서 이용내역) ═══
// ── 「예약성 기록」 모으기 ────────────────────────────────
// 예약관리(bookings) + 일정캘린더에서 직접 추가한 예약 일정(schedules · type=reserve)을
// 한 가지 모양으로 합쳐 최신순으로 돌려줍니다. 세 개의 생성 버튼이 모두 이 목록을 씁니다.
function caBkSrcs(e){
  if(!e)return [];
  const out=[];
  (e.docs.bookings||[]).forEach(b=>out.push({
    kind:'예약',
    date:b.booking_date||String(b.created_at||'').slice(0,10),
    time:b.booking_time||'',
    addr:b.customer_address||'',
    items:String(b.booking_items||''),
    struct:b.booking_items_struct||b.prefill_items_struct||'',
    memo:b.booking_memo||b.request_memo||'',
    confirmed:b.status==='confirmed'
  }));
  (e.docs.schedules||[]).forEach(x=>{
    if(x.booking_id)return;                                   // 예약에서 자동 생성된 일정 — 원본이 이미 목록에 있음
    if(x.type!=='reserve'&&!x.booking_items&&!x.booking_items_struct)return;   // 예약 성격이 아닌 일반 일정은 제외
    out.push({
      kind:'캘린더 예약',
      date:x.booking_date||x.date||'',
      time:x.booking_time||x.time_s||'',
      addr:x.customer_address||'',
      items:String(x.booking_items||''),
      struct:x.booking_items_struct||'',
      memo:x.request_memo||'',
      confirmed:true                                          // 관리자가 직접 넣은 일정 = 확정건으로 취급
    });
  });
  return out.filter(o=>o.date||o.items||o.struct)
            .sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
}
// 가장 적합한 예약성 기록 1건 (확정 우선 → 최신순)
function caBestSrc(e){const a=caBkSrcs(e);return a.find(x=>x.confirmed)||a[0]||null;}
// 예약성 기록에서 주소 보완 (고객 마스터에 주소가 없을 때)
function caAddrOf(e){
  if(e&&e.addr)return e.addr;
  const s=caBkSrcs(e).find(x=>x.addr);
  return s?s.addr:'';
}
// 🧾 인보이스 생성 — 고객정보 + 최근 예약(확정 우선)·의뢰 품목을 인보이스로 전달
//    hhc-invoice.html 의 기존 예약전환 파이프라인(localStorage hhc_transfer_invoice + ?from=booking)을 그대로 사용
// 🎫 상품권 생성 — 상품권 관리 화면을 구매고객명이 채워진 상태로 연다
window.caMakeCoupon=function(idx){

// ═══ 📅 일정캘린더 · 의뢰관리 · 예약목록 등에서 특정 고객 상세를 바로 여는 기능 ═══
// ① 주소로 진입 : customer-admin.html?open=<연락처|이름>
// ② 관리자 허브 안에서 메시지로 요청 : postMessage({hhcOpenCustomer:'<연락처|이름>'})
//    → 화면을 새로 불러오지 않고 그 자리에서 해당 고객 상세만 엽니다.
// 기호·공백을 모두 뺀 비교키 — 「RESIDENSI22 A-18-03」 ↔ 「residensi22a1803」
function caKey(s){return String(s==null?'':s).toLowerCase().replace(/[^0-9a-z가-힣]/g,'');}
// 글자가 섞여 있으면 연락처가 아닙니다 (예: RESIDENSI22 A-18-09 → 숫자만 뽑으면 221809)
function caPhoneish(s){return !/[a-zA-Z가-힣]/.test(String(s==null?'':s));}
function caAllNames(e){return [e.name].concat(e.aliases||[],e.linkNames||[]).filter(Boolean);}
// 연락처 → 이름 완전일치 → 기호무시 → 부분포함 순으로 찾습니다.
// key 는 「연락처|고객명」처럼 두 가지를 함께 받을 수 있습니다.
function caFindByKey(k){
  const cands=String(k||'').split('|').map(s=>s.trim()).filter(Boolean);
  if(!cands.length)return -1;
  for(const c of cands){                       // ① 연락처
    if(!caPhoneish(c))continue;
    const kp=pn(c);
    if(kp.length>=6){const i=entries.findIndex(e=>pn(e.phone)===kp);if(i>=0)return i;}
  }
  for(const c of cands){                       // ② 이름·별칭 완전일치
    const kn=nn(c);if(!kn)continue;
    const i=entries.findIndex(e=>caAllNames(e).some(a=>nn(a)===kn));
    if(i>=0)return i;
  }
  for(const c of cands){                       // ③ 기호·공백 무시
    const kk=caKey(c);if(kk.length<3)continue;
    const i=entries.findIndex(e=>caAllNames(e).some(a=>caKey(a)===kk));
    if(i>=0)return i;
  }
  // ④ 부분 포함 — 연락처가 함께 넘어왔는데 그 연락처의 고객이 없으면 「아직 등록되지 않은 고객」입니다.
  //    이때 이름 일부만 겹치는 고객(같은 콘도의 다른 호수 등)을 열면 엉뚱한 고객 상세로 연결되므로 찾지 않습니다.
  const hasPhone=cands.some(c=>caPhoneish(c)&&pn(c).length>=6);
  if(hasPhone)return -1;
  for(const c of cands){
    const kk=caKey(c);if(kk.length<8)continue;
    //    찾는 이름이 고객명 「안에」 들어 있을 때만 (RESIDENSI 22 → RESIDENSI 22 A-18-03). 그 반대(콘도명만 등록된 고객이
    //    동호수까지 적힌 이름에 걸리는 경우)는 다른 고객일 수 있어 열지 않습니다.
    const i=entries.findIndex(e=>caAllNames(e).some(a=>{const q=caKey(a);return q.length>=8&&q.indexOf(kk)>=0;}));
    if(i>=0)return i;
  }
  return -1;
}
// 못 찾았을 때 — 비슷한 고객을 보여주고, 없으면 새 고객으로 등록할 수 있게 합니다
function caSplitKey(k){
  const parts=String(k||'').split('|').map(s=>s.trim()).filter(Boolean);
  let ph='',nm='';
  const names=[];
  parts.forEach(p=>{ if(caPhoneish(p)&&pn(p).length>=6){if(!ph)ph=p;} else names.push(p); });
  // ****** 처럼 뜻 없는 값은 이름으로 쓰지 않습니다 (글자·숫자가 가장 많은 값을 고릅니다)
  names.sort((a,b)=>caKey(b).length-caKey(a).length);
  nm=names.find(x=>caKey(x).length>0)||'';
  if(!nm&&!ph)nm=String(k||'').trim();
  return {phone:ph,name:nm};
}
function caNearby(nm){
  const kk=caKey(nm);
  if(kk.length<3)return [];
  const head=kk.slice(0,Math.min(5,kk.length));
  const out=[];
  entries.forEach((e,i)=>{
    const hit=caAllNames(e).some(a=>{const q=caKey(a);return q&&(q.indexOf(head)===0||head.indexOf(q.slice(0,5))===0||q.indexOf(kk)>=0||kk.indexOf(q)>=0);});
    if(hit)out.push({e:e,i:i});
  });
  return out.slice(0,6);
}
window.caNotFound=function(k){

    '<div style="padding:14px 16px">'+

      '<div><b>고객명</b> · '+esc(t.name||'—')+'</div><div><b>연락처</b> · '+esc(t.phone||'등록 안 됨')+'</div></div>'+
    (rows?'<div style="font-size:10.5px;font-weight:800;color:#8a94a6;margin-bottom:6px">비슷한 고객이 있습니다 — 눌러서 여세요</div>'+rows+'<div style="height:8px"></div>':'')+
    '<button type="button" class="canf-opt canf-new" data-a="new"><b>＋ 새 고객으로 등록하고 열기</b><span>위 정보로 고객 마스터에 등록한 뒤 상세를 엽니다.</span></button>'+
    '</div><div style="padding:11px 16px;border-top:1px solid #e5e9f2;text-align:right">'+
    '<button type="button" style="font-size:12px;font-weight:700;border:1.5px solid #e5e9f2;background:#fff;border-radius:9px;padding:7px 14px;cursor:pointer;color:#4b5563" data-a="cancel">닫기</button>'+
    '</div></div>';
  if(!document.getElementById('canf-css')){
    const st=document.createElement('style');st.id='canf-css';
    st.textContent='.canf-opt{display:block;width:100%;text-align:left;border:1.5px solid #e5e9f2;border-radius:11px;padding:10px 13px;margin-bottom:7px;cursor:pointer;background:#fff;font-family:inherit}.canf-opt:hover{border-color:#2563eb;background:#eff6ff}.canf-opt b{display:block;font-size:13px;color:#111827}.canf-opt span{display:block;font-size:11px;color:#8a94a6;margin-top:2px}.canf-new{border-color:#1d4ed8;background:#eff6ff}.canf-new b{color:#1d4ed8}';
    document.head.appendChild(st);
  }
  document.body.appendChild(mk);
  mk.addEventListener('click',async function(ev){
    const b=ev.target.closest?ev.target.closest('[data-i],[data-a]'):null;
    if(!b){if(ev.target===mk)mk.remove();return;}
    if(b.dataset.i!==undefined){mk.remove();openDrawer(parseInt(b.dataset.i,10));return;}
    const a=b.getAttribute('data-a');
    if(a==='cancel'){mk.remove();return;}
    if(a==='new'){
      mk.remove();
      try{
        const now=new Date().toISOString();
        await addDoc(collection(db,'customers'),{id:'c'+Date.now(),name:t.name||t.phone||'새 고객',phone:t.phone||'',member:'',email:'',addr:'',memo:'',aliases:[],created_at:now,updated_at:now});
        toast('✓ 새 고객으로 등록했습니다 — 잠시 후 상세가 열립니다');
        _pendingOpen=k;
      }catch(e){toast('등록 실패: '+e.message);}
    }
  });
};
let _pendingOpen='';
window.caOpenByKey=function(k){
  k=String(k||'').trim();
  if(!k)return false;
  if(!entries.length){_pendingOpen=k;return true;}   // 아직 목록 로딩 전이면 불러온 뒤 연다

  return false;
};

}

<script>
/* ══ 허브(staffapp.html) 안에서 열렸을 때 「화면 살아있음」 신호 ══════════════
   · 열리자마자 hhcHello, 데이터가 처음 도착하면 hhcReady 를 허브로 보냅니다.
   · 15초 안에 데이터가 오지 않으면(앱을 켠 직후 통신이 걸린 상태) 스스로 새로고침 — 최대 2회.
     그래도 안 되면 허브에 hhcStuck 을 알려 「다시 불러오기」 안내를 띄우게 합니다.
   · 허브가 hhcPing 을 보내면 현재 상태(hhcPong)로 답합니다.
   ※ 허브 밖에서 단독으로 열었을 때는 아무 동작도 하지 않습니다. */
(function(){
  if(window.top===window.self)return;
  var ready=false,KEY='hhc_wd:'+location.pathname,n=0;
  try{n=parseInt(sessionStorage.getItem(KEY)||'0',10)||0;}catch(e){}
  function post(m){try{window.parent.postMessage(m,'*');}catch(e){}}
  window.__hhcReady=function(){if(ready)return;ready=true;try{sessionStorage.removeItem(KEY);}catch(e){}post({hhcReady:1});};
  window.addEventListener('message',function(e){var d=e&&e.data;if(d&&d.hhcPing)post({hhcPong:1,ready:ready});});
  post({hhcHello:1});
  // 데이터가 늦어도 화면을 스스로 새로고침하지 않습니다 (보고 있던 화면·입력 중인 내용 보존).
  // 40초 뒤에도 첫 데이터가 없으면 허브에 알려 「다시 불러오기」 띠만 보여 줍니다.
  setTimeout(function(){
    if(ready)return;
    if(navigator.onLine===false||document.visibilityState!=='visible'){post({hhcStuck:1,soft:1});return;}
    post({hhcStuck:1});
  },40000);
})();
</script>
