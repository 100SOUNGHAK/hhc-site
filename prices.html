<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서비스별 가격 한눈에 | 해피홈케어</title>
<meta name="description" content="에어컨 · 세탁기 · 건조기 · 쇼파 · 매트리스 · 커튼 서비스 가격과 간편 견적을 바로 확인하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="서비스별 가격 한눈에 | 해피홈케어">
<meta property="og:description" content="에어컨 · 세탁기 · 건조기 · 쇼파 · 매트리스 · 커튼 가격과 간편 견적을 바로 확인하세요.">
<meta property="og:image" content="https://happyhomecare.com.my/og-prices.jpg">
<meta name="theme-color" content="#0f2540">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f2540;color:#e3c98a;
  font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;font-size:15px;font-weight:700;text-align:center}
a{color:#fff}
</style>
<script>
/* 커뮤니티 배너 링크용 짧은 주소 — 홈페이지 「가격정보」 화면을 바로 엽니다
   /prices → /home?open=pricing   ·   /prices?lang=en → 영문 */
(function(){
  var en = /[?&]lang=en(&|$)/i.test(location.search);
  location.replace('/home?open=pricing' + (en ? '&lang=en' : ''));
})();
</script>
</head>
<body>
<p>가격정보로 이동하는 중…<br><br><a href="/home?open=pricing">바로 이동하기</a></p>
</body>
</html>
