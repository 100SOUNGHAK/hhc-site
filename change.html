body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#e9ebf0;color:var(--ink);line-height:1.55;font-size:16px;letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased}

.hero{color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 24px;border-radius:0 0 30px 30px;background:radial-gradient(120% 70% at 50% 0%,#1d4573 0%,var(--n8) 55%,var(--n9) 100%)}

.sub{margin:8px auto 0;max-width:340px;text-align:center;font-size:15px;color:rgba(255,255,255,.76);text-wrap:balance}

/* 일정 바뀜 표시 (히어로 안) */

.sw.one{grid-template-columns:1fr;max-width:220px}
.dt{border-radius:18px;padding:11px 8px 12px;text-align:center;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.dt small{display:block;font-size:11.5px;font-weight:800;color:rgba(255,255,255,.6)}
.dt b{display:block;margin-top:3px;font-size:20px;font-weight:900;letter-spacing:-.03em;line-height:1.2}
.dt span{display:block;margin-top:2px;font-size:13.5px;font-weight:700;color:rgba(255,255,255,.75)}
.dt.old b,.dt.old span{text-decoration:line-through;text-decoration-color:rgba(255,120,120,.9);text-decoration-thickness:2px;color:rgba(255,255,255,.55)}
.dt.new{background:linear-gradient(150deg,rgba(255,255,255,.2),rgba(255,255,255,.08));box-shadow:inset 0 0 0 1.5px var(--g3),0 14px 26px -14px rgba(0,0,0,.6)}

.dt.wait{box-shadow:inset 0 0 0 1.5px dashed rgba(227,201,138,.7);background:rgba(227,201,138,.1)}

.ar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--g3);color:var(--n9);font-weight:900;font-size:15px}

.why .e{flex:none;font-size:18px;line-height:1.3}
.why b{color:#fff}

.dock .in{max-width:536px;margin:0 auto;display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.dock a,.dock button{display:flex;align-items:center;justify-content:center;gap:5px;min-height:52px;border-radius:14px;font-size:15.5px;font-weight:850;white-space:nowrap}

@media (prefers-reduced-motion:no-preference){.dt.new{animation:pop .5s var(--ease) both .15s}@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.spin{width:34px;height:34px;margin:0 auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--n8);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.dock[hidden]{display:none}
.its{margin:0;padding:0;list-style:none;text-align:right}

    r_head:'일정 변경 시 보증금 환급 (방문 예정일 기준)',
    r1:'2주 넘게 남았을 때',r2:'3일 ~ 2주 남았을 때',r3:'3일 이내',r4:'1일 이내',r_me:'지금',
    rl1:'예약보증금(RM 320)은 2주 이후 일정을 예약할 때 받습니다.',
    rl2:'예약을 취소하시면 보증금은 환불되지 않습니다.',
    rl3:'당사 사정으로 취소 · 변경할 때는 공제 없이 전액 돌려드리거나 새 일정에 그대로 적용합니다.',
    rl4:'멤버십 골드 이상 회원은 예약보증금이 면제됩니다.',
    d_unit:'일',d_half:'1일 이내',hon:' 고객님',
    wa:'💬 왓츠앱 문의',my:'🏠 마이페이지',home:'🏠 홈페이지',
    waT:function(x){return '안녕하세요, 예약 변경 · 취소 안내 관련 문의드립니다.'+x;},
    loading:'예약 안내를 불러오는 중…',errH:'안내를 열 수 없습니다',errP:'링크가 잘못되었거나 만료되었습니다. 왓츠앱으로 문의해 주시면 다시 보내 드리겠습니다.',
    ft:'해피홈케어 · HAPPY WORKS SERVICES SDN. BHD. · +60 17-247 2774'
  },en:{
    kick_change:'Booking change notice',kick_cancel:'Booking cancellation notice',
    h_set:'Your booking has been rescheduled',h_wait:'We are checking your new date',h_pick:'Please choose a new date',h_cancel:'Your booking has been cancelled',
    s_cust_change:'We have changed the date as you requested.',s_cust_cancel:'We have cancelled the booking as you requested.',
    s_co_change:'We are sorry to reschedule due to our circumstances.',s_co_cancel:'We are sorry to cancel due to our circumstances.',
    old:'Previous',nu:'New date',nuw:'Your chosen date',pick:'New date',pickb:'Choosing',cxd:'Cancelled',
    why_cust:'Processed at <b>your request</b>.',why_co:'Processed due to <b>our circumstances</b>. We sincerely apologise for the inconvenience.',
    c_detail:'Booking details',k_name:'Name',k_place:'Location',k_items:'Service',k_date:'Visit',k_state:'Status',
    st_set:'Confirmed',st_wait:'Being confirmed',st_pick:'Awaiting your new date',st_cx:'Cancelled',
    c_dep:'Booking deposit',dep_paid:'Deposit',dep_rate:'Refund rate',dep_keep:'Deducted',dep_back:'Refund to you',dep_carry:'Applied to the new date',
    dep_p_change:'Change requested {n} before the visit date',dep_p_cancel:'The deposit is not refundable when a booking is cancelled.',dep_p_co:'As this is due to us, your full deposit is kept with no deduction.',
    dep_none:'No deposit was taken for this booking. Nothing to settle.',dep_ex:'Membership (Gold and above) is exempt from the booking deposit. Nothing to settle.',
    tg_back:'Refund',tg_none:'N/A',tg_no:'Non-refundable',tg_full:'Full',
    back_how:'💳 Please send your bank, account name and account number on WhatsApp and we will transfer it.',
    carry_how:'✅ Your RM {a} deposit is applied to the new date. Nothing else to do.',
    co_back_how:'💳 Your RM {a} deposit will be refunded in full. Please send your bank details on WhatsApp.',
    c_next:'What to do next',
    nx_set:'Your new date is confirmed. Please re-register the work visit with your condo management for the new date.',
    nx_wait:'We will confirm your chosen date shortly. You can still pick another date.',
    nx_pick:'Tap the button below to choose a date and time that suits you.',
    nx_cancel:'Whenever you need us again, just send us a request.',
    b_set:'📍 Booking details · work permit',b_wait:'📍 View progress',b_pick:'📅 Choose a new date',b_again:'📥 Request again',
    sorry_t:'Our sincere apologies again',sorry_s:'We will prepare even more carefully for the new date. Please let us know anytime if anything is inconvenient.',
    sorry_cx:'We hope to make it up to you with even better service next time. Please let us know anytime if anything is inconvenient.',
    c_rule:'Cancellation & change policy',rule_s:'Applies to bookings with a deposit',open:'Show',close:'Hide',
    r_head:'Deposit refund on date change (from the visit date)',
    r1:'More than 2 weeks before',r2:'3 days – 2 weeks before',r3:'Within 3 days',r4:'Within 1 day',r_me:'Now',
    rl1:'A RM 320 deposit is taken for bookings more than 2 weeks ahead.',
    rl2:'The deposit is not refundable if you cancel the booking.',
    rl3:'If we cancel or change for our own reasons, the deposit is refunded in full or applied to the new date.',
    rl4:'Gold members and above are exempt from the deposit.',
    d_unit:'days',d_half:'within 1 day',hon:'',
    wa:'💬 WhatsApp us',my:'🏠 MY PAGE',home:'🏠 Home',
    waT:function(x){return 'Hello, I have a question about my booking change / cancellation notice.'+x;},
    loading:'Loading your booking notice…',errH:'This notice cannot be opened',errP:'The link may be wrong or expired. Message us on WhatsApp and we will send it again.',
    ft:'Happy Home Care · HAPPY WORKS SERVICES SDN. BHD. · +60 17-247 2774'
  }};
  function L(){return T[S.lang];}
  function en(){return S.lang==='en';}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmt(s,o){return s.replace(/\{(\w+)\}/g,function(_,k){return o[k];});}
  var W=[['일','Sun'],['월','Mon'],['화','Tue'],['수','Wed'],['목','Thu'],['금','Fri'],['토','Sat']],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function ymdD(s){var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(s||''));return m?new Date(+m[1],m[2]-1,+m[3]):null;}
  function fD(s){var t=ymdD(s);if(!t)return '';return en()?W[t.getDay()][1]+', '+t.getDate()+' '+MN[t.getMonth()]:(t.getMonth()+1)+'월 '+t.getDate()+'일 ('+W[t.getDay()][0]+')';}
  /* 시간 글자 — 「09:00 전후|Around 09:00」 (go.html fT 와 같은 규칙) */
  function fT(t){t=String(t||'');if(!t)return '';if(t.indexOf('|')>=0){var p=t.split('|');return en()?(p[1]||p[0]):(p[0]||t);}
    return en()?(t.replace('전후','').trim().replace(/^(\d{2}:\d{2})$/,'Around $1')||t):t;}
  function myToday(){return new Date(Date.now()+8*3600e3).toISOString().slice(0,10);}

  /* 보증금 규정 — 방문 예정일까지 남은 일수 */
  var RATE=[70,40,20,0];
  function tier(d){if(d>14)return 0;if(d>=3)return 1;if(d>1)return 2;return 3;}
  function lead(){if(DD!=null)return DD;var a=ymdD(OD),b=ymdD(myToday());return a&&b?Math.round((a-b)/864e5):0;}
  function daysTxt(n){return n<=1?L().d_half:(en()?n+' '+L().d_unit:n+L().d_unit);}

  /* 지금 예약 상태 → 새 일정 */
  function state(){
    if(KIND==='cancel')return 'cancel';
    var b=S.bk;if(!b)return 'pick';
    var st=String(b.status||'');
    if(st==='confirmed'&&b.booking_date)return 'set';
    if(st==='booked'&&b.booking_date)return 'wait';
    return 'pick';
  }
  function goUrl(){return '/go?j=b:'+encodeURIComponent(BID)+(CID?'&c='+encodeURIComponent(CID):'')+(en()?'&lang=en':'');}
  function myUrl(){return CID?(en()?'/my-en.html':'/my.html')+'?c='+encodeURIComponent(CID)+'&lang='+S.lang:'/home'+(en()?'?lang=en':'');}
  function items(){var b=S.bk||{};var a=String(b.booking_items||'').split(/\n|,\s*/).map(function(x){return x.trim();}).filter(Boolean);
    if(en()&&M&&M.sEnIt)a=a.map(M.sEnIt);return a;}
  function oldD(){return OD||(S.bk&&S.bk.resched_from&&S.bk.resched_from.date)||'';}
  function oldT(){return OT||(S.bk&&S.bk.resched_from&&S.bk.resched_from.time)||'';}
  function waUrl(){var x='';if(oldD())x+='\n· '+(en()?'Previous date: ':'기존 일정: ')+fD(oldD())+' '+fT(oldT());var b=S.bk||{};if(b.customer_name)x+='\n· '+(en()?'Name: ':'예약자: ')+b.customer_name;
    return 'https://wa.me/'+TEL+'?text='+encodeURIComponent(L().waT(x));}

  function depBox(){
    var t=L(),a=AMT;
    if(DEP==='none')return {tag:'<span class="tg">'+t.tg_none+'</span>',body:'<div class="note">'+t.dep_none+'</div>'};
    if(DEP==='ex')return {tag:'<span class="tg ok">'+t.tg_none+'</span>',body:'<div class="note ok">👑 '+t.dep_ex+'</div>'};
    if(WHO==='co'){var carry=KIND==='change';
      return {tag:'<span class="tg ok">'+t.tg_full+'</span>',body:'<div class="dep num"><div class="l"><span>'+t.dep_paid+'</span><b>RM '+a+'</b></div>'+
        '<div class="l"><span>'+t.dep_keep+'</span><b>RM 0</b></div><hr><div class="tot"><span>'+(carry?t.dep_carry:t.dep_back)+'</span><b><small>RM</small>'+a+'</b></div>'+
        '<p>'+t.dep_p_co+'</p></div><div class="note ok">'+fmt(carry?t.carry_how:t.co_back_how,{a:a})+'</div>'};}
    if(KIND==='cancel')return {tag:'<span class="tg no">'+t.tg_no+'</span>',body:'<div class="dep num"><div class="l"><span>'+t.dep_paid+'</span><b>RM '+a+'</b></div>'+
        '<div class="l mn"><span>'+t.dep_keep+'</span><b>− RM '+a+'</b></div><hr><div class="tot"><span>'+t.dep_back+'</span><b><small>RM</small>0</b></div><p>'+t.dep_p_cancel+'</p></div>'};
    var n=lead(),r=RATE[tier(n)],back=Math.round(a*r/100);
    return {tag:'<span class="tg'+(r?'':' no')+'">'+t.tg_back+' '+r+'%</span>',body:'<div class="dep num"><div class="l"><span>'+t.dep_paid+'</span><b>RM '+a+'</b></div>'+
      '<div class="l"><span>'+t.dep_rate+'</span><b>'+r+'%</b></div><div class="l mn"><span>'+t.dep_keep+'</span><b>− RM '+(a-back)+'</b></div><hr>'+
      '<div class="tot"><span>'+t.dep_back+'</span><b><small>RM</small>'+back+'</b></div><p>'+fmt(t.dep_p_change,{n:daysTxt(n)})+'</p></div>'+
      (back?'<div class="note">'+t.back_how+'</div>':'')};
  }

  var ruleOpen=false;
  function langBtns(){return '<div class="lang"><button data-l="ko" class="'+(en()?'':'on')+'">한국어</button><button data-l="en" class="'+(en()?'on':'')+'">EN</button></div>';}
  function brand(){return '<div class="brand"><div class="logo"><svg viewBox="0 0 100 100" fill="#e3c98a"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M8 50 L50 22 L92 50 L84 58 L50 36 L16 58Z"/></svg></div>'+
    '<div><b>'+(en()?'Happy Home Care':'해피홈케어')+'</b><small>HAPPY WORKS SERVICES</small></div>'+langBtns()+'</div>';}
  function bind(){
    [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.onclick=function(){S.lang=b.getAttribute('data-l');try{localStorage.setItem('hhc_chg_lang',S.lang);}catch(e){}render();};});
    var rf=document.getElementById('rf');if(rf)rf.onclick=function(){ruleOpen=!ruleOpen;render();};
  }
  function render(){
    var t=L(),app=document.getElementById('app'),dock=document.getElementById('dock');
    document.documentElement.lang=S.lang;
    document.title=(en()?'Booking change notice':'예약 변경 · 취소 안내')+' | '+(en()?'Happy Home Care':'해피홈케어');
    if(!S.ok){
      app.innerHTML=S.err
        ?'<header class="hero" style="padding-bottom:18px">'+brand()+'</header><div class="msgb" style="padding-top:60px"><div class="ic">🔗</div><h3>'+t.errH+'</h3><p>'+t.errP+'</p></div>'
        :'<div class="msgb"><div class="spin"></div><p>'+t.loading+'</p></div>';
      if(S.err){dock.hidden=false;document.getElementById('dockin').innerHTML='<a class="a" href="'+waUrl()+'" target="_blank" rel="noopener">'+t.wa+'</a><a class="b" href="'+myUrl()+'">'+(CID?t.my:t.home)+'</a>';bind();}
      return;
    }
    var st=state(),ch=KIND==='change',co=WHO==='co',b=S.bk||{};
    var h1=st==='cancel'?t.h_cancel:st==='set'?t.h_set:st==='wait'?t.h_wait:t.h_pick;
    var od=oldD(),ot=oldT();
    var oldBox='<div class="dt old'+(ch?'':' cx')+'"><small>'+(ch?t.old:t.cxd)+'</small><b>'+(fD(od)||'—')+'</b><span>'+esc(fT(ot)||' ')+'</span></div>';
    var newBox=st==='pick'?'<div class="dt wait"><small>'+t.pick+'</small><b>'+t.pickb+'</b><span>…</span></div>'
      :'<div class="dt new"><small>'+(st==='wait'?t.nuw:t.nu)+'</small><b>'+fD(b.booking_date)+'</b><span>'+esc(fT(b.booking_time)||' ')+'</span></div>';
    var sw=ch?'<div class="sw">'+oldBox+'<div class="ar">→</div>'+newBox+'</div>':'<div class="sw one">'+oldBox+'</div>';
    var D=depBox();
    var n=lead(),me=(!co&&ch&&DEP==='paid')?tier(n):-1;
    var rows=[t.r1,t.r2,t.r3,t.r4].map(function(x,i){return '<div class="rr'+(RATE[i]?'':' z')+(i===me?' me':'')+'"><span>'+x+'</span>'+(i===me?'<i class="me-t" style="font-style:normal">'+t.r_me+'</i>':'')+'<b>'+RATE[i]+'%</b></div>';}).join('');
    var stTxt=st==='cancel'?t.st_cx:st==='set'?t.st_set:st==='wait'?t.st_wait:t.st_pick;
    var stCol=st==='cancel'?'var(--red)':st==='set'?'var(--ok)':'var(--g7)';
    var dateVal=st==='cancel'?'<s>'+fD(od)+' '+esc(fT(ot))+'</s>':st==='pick'?(od?'<s>'+fD(od)+'</s>':'')+t.pickb:(od?'<s>'+fD(od)+'</s>':'')+fD(b.booking_date)+' '+esc(fT(b.booking_time));
    var it=items();
    var kv='';
    if(b.customer_name)kv+='<span>'+t.k_name+'</span><b>'+esc(b.customer_name)+(en()?'':t.hon)+'</b>';
    if(b.customer_address&&b.customer_address!==b.customer_name)kv+='<span>'+t.k_place+'</span><b>'+esc(b.customer_address)+'</b>';
    if(it.length)kv+='<span>'+t.k_items+'</span><b>'+it.map(esc).join('<br>')+'</b>';
    kv+='<span>'+t.k_date+'</span><b>'+dateVal+'</b><span>'+t.k_state+'</span><b style="color:'+stCol+'">'+stTxt+'</b>';
    var nx=st==='cancel'?t.nx_cancel:st==='set'?t.nx_set:st==='wait'?t.nx_wait:t.nx_pick;
    var nxBtn=st==='cancel'?'<a class="pbtn" href="/request.html'+(en()?'?lang=en':'')+'">'+t.b_again+'</a>'
      :BID?'<a class="pbtn" href="'+goUrl()+'">'+(st==='set'?t.b_set:st==='wait'?t.b_wait:t.b_pick)+'</a>':'';
    app.innerHTML='<header class="hero">'+brand()+
      '<div class="kick">'+(ch?t.kick_change:t.kick_cancel)+'</div><h1 class="h1">'+h1+'</h1><p class="sub">'+t['s_'+WHO+'_'+KIND]+'</p>'+sw+
      '<div class="why"><span class="e">'+(co?'🙏':'🗓️')+'</span><span>'+(co?t.why_co:t.why_cust)+'</span></div></header>'+
      '<section class="sec">'+
      '<div class="card"><div class="ct">📋 '+t.c_detail+'</div><div class="kv">'+kv+'</div></div>'+
      '<div class="card"><div class="ct">💰 '+t.c_dep+D.tag+'</div>'+D.body+'</div>'+
      '<div class="card"><div class="ct">👉 '+t.c_next+'</div><div class="note" style="background:#f3f0e8">'+nx+'</div>'+nxBtn+
        (co?'<div class="sorry"><b>'+t.sorry_t+'</b><span>'+(ch?t.sorry_s:t.sorry_cx)+'</span></div>':'')+'</div>'+
      (DEP==='paid'?'<div class="card'+(ruleOpen?'':' shut')+'"><button class="fold" id="rf"><span class="ct" style="flex:1">📜 '+t.c_rule+'</span><span class="cv">'+(ruleOpen?t.close+' ▲':t.open+' ▼')+'</span></button>'+
        '<div class="cs">'+t.rule_s+'</div><div class="fb"><div class="cs" style="margin-top:12px;font-weight:800;color:var(--ink6)">'+t.r_head+'</div><div class="rt num">'+rows+'</div>'+
        '<ul class="rl"><li>'+t.rl1+'</li><li>'+t.rl2+'</li><li>'+t.rl3+'</li><li>'+t.rl4+'</li></ul></div></div>':'')+
      '</section><div class="foot">'+t.ft+'</div>';
    dock.hidden=false;
    document.getElementById('dockin').innerHTML='<a class="a" href="'+waUrl()+'" target="_blank" rel="noopener">'+t.wa+'</a><a class="b" href="'+myUrl()+'">'+(CID?t.my:t.home)+'</a>';
    bind();
  }

  function getJ(u,n){return fetch(u,{cache:'no-store'}).then(function(r){if(r.status>=500)throw new Error('5xx');return r.json();})
    .catch(function(e){if((n||0)<2)return new Promise(function(res){setTimeout(res,800);}).then(function(){return getJ(u,(n||0)+1);});throw e;});}
  function load(){
    if(!BID&&!OD){S.err=true;render();return;}
    if(!BID){S.ok=true;render();return;}
    getJ('/api/booking?id='+encodeURIComponent(BID)).then(function(j){
      if(j&&j.ok&&j.doc)S.bk=j.doc;
      if(!S.bk&&!OD){S.err=true;}else S.ok=true;   // 예약을 지웠어도(취소) 주소의 기존 일정으로 엽니다
      render();
    }).catch(function(){if(OD){S.ok=true;}else S.err=true;render();});
  }
  render();load();
  // 다른 창에서 날짜를 고르고 돌아오면 새 일정 다시 읽기
  document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.ok&&BID&&KIND==='change')getJ('/api/booking?id='+encodeURIComponent(BID)).then(function(j){if(j&&j.ok&&j.doc){S.bk=j.doc;render();}}).catch(function(){});});
})();
</script>
