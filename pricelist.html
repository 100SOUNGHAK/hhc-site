<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서비스 요금표 | 해피홈케어</title>
<meta name="description" content="에어컨 · 세탁기 · 건조기 · 주방후드 · 냉장고 · 매트리스 · 쇼파 · 커튼 — 품목을 누르면 서비스별 가격과 안내가 나옵니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="서비스 요금표 | 해피홈케어">
<meta property="og:description" content="품목을 누르면 서비스별 가격과 안내가 나옵니다.">
<meta property="og:image" content="https://happyhomecare.com.my/og-prices.jpg">
<meta name="theme-color" content="#0f2540">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0f2540;color:#e3c98a;
  font-family:"Pretendard","Noto Sans KR",system-ui,sans-serif;font-size:15px;font-weight:700;text-align:center}
a{color:#fff}
</style>
<script>
/* 커뮤니티 링크용 짧은 주소 — 홈페이지 「서비스 요금표」(품목 선택 화면)를 바로 엽니다
   /pricelist → /home?open=pt   ·   /pricelist?lang=en → 영문   ·   /pricelist?k=ac → 에어컨 가격 바로 */
(function(){
  var q=new URLSearchParams(location.search), u='/home?open=pt';
  if(q.get('lang')==='en') u+='&lang=en';
  if(q.get('k')) u+='&k='+encodeURIComponent(q.get('k'));
  location.replace(u);
})();
</script>
</head>
<body>
<p>서비스 요금표로 이동하는 중…<br><br><a href="/home?open=pt">바로 이동하기</a></p>
</body>
</html>
