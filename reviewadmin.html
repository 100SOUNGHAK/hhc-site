<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>리뷰 관리 · Happy Home Care</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1633;--navy2:#16234A;
  --teal:#0FB5A4;--teal-lt:#E4FBF6;--teal-dk:#0A6B60;
  --gold:#c9a44c;--gold-lt:#f7f1e2;
  --white:#fff;--surface:#F4F7FC;--surface2:#EBF0F8;
  --border:#DCE3EF;--text:#101B33;--text2:#48546F;--text3:#8390AC;
  --red:#E5484D;--red-bg:#FEECEC;
  --radius-sm:9px;--radius:12px;--radius-lg:16px;--radius-xl:22px;
  --shadow:0 1px 3px rgba(15,28,63,.05),0 6px 20px -10px rgba(15,28,63,.16);
  --shadow-lg:0 20px 44px -18px rgba(15,28,63,.30);
}
body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--surface);color:var(--text);font-size:15px;line-height:1.6;min-height:100vh;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
input,textarea,button{font-family:inherit;font-size:15px}

/* HEADER */
.header{background:linear-gradient(120deg,var(--navy),var(--navy2));position:sticky;top:0;z-index:100;box-shadow:0 4px 22px -6px rgba(0,0,0,.35)}
.header-inner{max-width:1000px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px}
.logo-badge{width:36px;height:36px;background:var(--teal);border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;color:#fff;flex-shrink:0;box-shadow:0 4px 12px -2px rgba(15,181,164,.5)}
.logo-name{font-weight:700;font-size:14.5px;color:#fff;line-height:1.2}
.logo-sub{font-size:9.5px;color:rgba(255,255,255,.45)}
.btn-logout{margin-left:auto;background:none;border:none;color:rgba(255,255,255,.55);font-size:12.5px;cursor:pointer;padding:6px 8px;font-weight:600}
.btn-logout:hover{color:#fff}

/* LOGIN */
.login-wrap{max-width:410px;margin:72px auto;padding:0 20px}
.login-card{background:var(--white);border-radius:var(--radius-xl);border:1px solid var(--border);box-shadow:var(--shadow-lg);overflow:hidden}
.login-head{background:linear-gradient(120deg,var(--navy),var(--navy2));padding:26px 30px}
.login-head-badge{font-size:10px;color:rgba(255,255,255,.55);letter-spacing:.1em;margin-bottom:6px;font-weight:600}
.login-head-title{font-size:21px;font-weight:800;color:#fff;margin-bottom:3px;letter-spacing:-.02em}
.login-head-sub{font-size:12px;color:rgba(255,255,255,.5)}
.login-body{padding:26px 30px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.field-label{font-size:11px;font-weight:800;color:var(--text3);letter-spacing:.04em;text-transform:uppercase}
.field-input{width:100%;padding:12px 14px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-sm);color:var(--text);outline:none;transition:.15s}
.field-input:focus{border-color:var(--teal);background:var(--white);box-shadow:0 0 0 4px rgba(15,181,164,.12)}
.btn-primary{width:100%;padding:13px;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border:none;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;transition:all .18s;margin-top:5px}
.btn-primary:hover{filter:brightness(1.12)}
.err-msg{background:var(--red-bg);color:var(--red);padding:10px 13px;border-radius:var(--radius-sm);font-size:12.5px;font-weight:600;margin-top:9px;display:none}

/* APP */
.app-body{max-width:1000px;margin:0 auto;padding:24px 20px 60px;display:none}
.app-body.active{display:block}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.toolbar h1{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.stat-pill{background:var(--white);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:700;color:var(--text2);box-shadow:var(--shadow)}
.search-input{flex:1;min-width:180px;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--white);outline:none}
.search-input:focus{border-color:var(--teal)}

.rv-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
.rv-card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.rv-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(145deg,var(--navy),var(--teal));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.rv-name{font-size:14.5px;font-weight:700;color:var(--navy)}
.rv-meta{font-size:11.5px;color:var(--text3);margin-top:1px}
.rv-stars{color:var(--gold);font-size:13px;letter-spacing:1px;margin-left:auto;white-space:nowrap}
.rv-text{font-size:14px;color:var(--text2);line-height:1.65;margin:8px 0 12px;white-space:pre-line;word-break:break-word}
.rv-photos{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.rv-photos img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--border);cursor:pointer}
.rv-likes{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:5px;margin-bottom:12px}
.rv-likes svg{width:14px;height:14px}

.rv-reply-existing{background:var(--gold-lt);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 13px;margin-bottom:10px}
.rv-reply-existing-head{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:3px}
.rv-reply-existing-text{font-size:13px;color:var(--text2);line-height:1.6;white-space:pre-line}

.rv-actions{display:flex;gap:8px;border-top:1px solid var(--surface2);padding-top:12px;margin-top:2px}
.rv-btn{padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--text2);transition:all .15s}
.rv-btn:hover{border-color:var(--teal);color:var(--teal-dk)}
.rv-btn.danger:hover{border-color:var(--red);color:var(--red);background:var(--red-bg)}
.rv-reply-form{display:none;margin-top:10px}
.rv-reply-form.open{display:block}
.rv-reply-form textarea{width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;font-size:13.5px;resize:vertical;background:var(--surface);outline:none}
.rv-reply-form textarea:focus{border-color:var(--teal);background:var(--white)}
.rv-reply-form-btns{display:flex;gap:8px;margin-top:8px}
.rv-btn.save{background:var(--navy);color:#fff;border-color:var(--navy)}
.rv-btn.save:hover{background:var(--teal-dk);border-color:var(--teal-dk);color:#fff}

.rv-empty{text-align:center;padding:60px 20px;color:var(--text3);background:var(--white);border:1px dashed var(--border);border-radius:var(--radius-lg)}

/* confirm modal */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(11,22,51,.5);z-index:999;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.modal-ov.open{display:flex}
.modal-box{background:var(--white);border-radius:var(--radius-xl);padding:26px;max-width:340px;width:100%;box-shadow:var(--shadow-lg)}
.modal-title{font-size:16px;font-weight:800;color:var(--text);margin-bottom:8px}
.modal-msg{font-size:13.5px;color:var(--text2);line-height:1.6;margin-bottom:20px}
.modal-btns{display:flex;gap:8px}
.modal-btns button{flex:1;padding:11px;border-radius:10px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--white);color:var(--text2)}
.modal-btns .danger{background:var(--red);color:#fff;border-color:var(--red)}

/* lightbox */
.rv-lightbox{position:fixed;inset:0;background:rgba(8,20,38,.9);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
.rv-lightbox.show{display:flex}
.rv-lightbox img{max-width:min(90vw,720px);max-height:86vh;border-radius:12px}
.rv-lightbox-close{position:absolute;top:20px;right:24px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:20px;cursor:pointer}

@media(max-width:480px){
  .rv-card{padding:16px}
  .toolbar{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen" style="display:none">
  <div class="header">
    <div class="header-inner">
      <div class="logo-badge">HHC</div>
      <div><div class="logo-name">Happy Home Care</div><div class="logo-sub">리뷰 관리 시스템</div></div>
    </div>
  </div>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-head">
        <div class="login-head-badge">관리자 전용</div>
        <div class="login-head-title">리뷰 관리 시스템</div>
        <div class="login-head-sub">비밀번호를 입력하여 로그인하세요</div>
      </div>
      <div class="login-body">
        <div class="field">
          <label class="field-label">비밀번호</label>
          <input class="field-input" id="login-pw" type="password" placeholder="비밀번호 입력">
        </div>
        <button class="btn-primary" id="btn-login">로그인</button>
        <div class="err-msg" id="login-err">비밀번호가 틀렸습니다.</div>
      </div>
    </div>
  </div>
</div>

<!-- MAIN -->
<header class="header" id="app-header" style="display:none">
  <div class="header-inner">
    <div class="logo-badge">HHC</div>
    <div><div class="logo-name">Happy Home Care</div><div class="logo-sub">리뷰 관리 시스템</div></div>
    <button class="btn-logout" id="btn-logout">로그아웃</button>
  </div>
</header>

<div class="app-body" id="app-body">
  <div class="toolbar">
    <h1>고객 리뷰 관리</h1>
    <span class="stat-pill" id="statPill">0개 리뷰 · 평균 0.0</span>
    <input type="text" class="search-input" id="searchInput" placeholder="이름 또는 리뷰 내용으로 검색">
  </div>
  <div id="reviewList">
    <div class="rv-empty">불러오는 중입니다…</div>
  </div>
</div>

<!-- 삭제 확인 모달 -->
<div class="modal-ov" id="confirmModal">
  <div class="modal-box">
    <div class="modal-title">리뷰를 삭제할까요?</div>
    <div class="modal-msg">삭제하면 리뷰 내용과 첨부 사진이 모두 사라지며 되돌릴 수 없습니다.</div>
    <div class="modal-btns">
      <button id="confirmCancel">취소</button>
      <button class="danger" id="confirmDelete">삭제</button>
    </div>
  </div>
</div>

<!-- 사진 확대보기 -->
<div id="rvLightbox" class="rv-lightbox" onclick="closeLightbox()">
  <button type="button" class="rv-lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="rvLightboxImg" src="" alt="">
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getStorage, ref, deleteObject } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';

const FIREBASE_CFG={
  apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",
  authDomain:"happywork-packageplan.firebaseapp.com",
  projectId:"happywork-packageplan",
  storageBucket:"happywork-packageplan.firebasestorage.app",
  messagingSenderId:"101289103022",
  appId:"1:101289103022:web:d81aca7f3747dd26df673f"
};
const ADMIN_PW='hhc_review_admin_pw';
const ADMIN_AUTH='hhc_review_admin_auth';

let db=null,storage=null,unsub=null;
let allReviews=[];
let searchTerm='';
let deletePendingId=null;

function checkAuth(){return localStorage.getItem(ADMIN_AUTH)==='1';}
function setAuth(v){if(v)localStorage.setItem(ADMIN_AUTH,'1');else localStorage.removeItem(ADMIN_AUTH);}

function showScreen(id){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app-header').style.display='none';
  document.getElementById('app-body').classList.remove('active');
  if(id==='login'){document.getElementById('login-screen').style.display='block';}
  else if(id==='app'){
    document.getElementById('app-header').style.display='block';
    document.getElementById('app-body').classList.add('active');
  }
}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function starStr(n){
  n=Math.max(0,Math.min(5,Math.round(n||0)));
  return '★★★★★☆☆☆☆☆'.slice(5-n,10-n);
}
function fmtDate(iso){
  if(!iso)return '';
  var d=new Date(iso);
  if(isNaN(d.getTime()))return '';
  var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return y+'.'+m+'.'+day;
}
function initials(name){
  var t=(name||'').trim();
  return t?t.charAt(0).toUpperCase():'?';
}

async function connectFirebase(){
  try{
    const app=initializeApp(FIREBASE_CFG);
    db=getFirestore(app);
    storage=getStorage(app);
    const q=query(collection(db,'reviews'),orderBy('created_at','desc'));
    unsub=onSnapshot(q,function(snap){
      allReviews=snap.docs.map(function(d){return Object.assign({},d.data(),{__id:d.id});});
      renderList();
    },function(err){
      console.error('reviews load error:',err);
      document.getElementById('reviewList').innerHTML='<div class="rv-empty">리뷰를 불러오지 못했습니다: '+esc(err.message)+'</div>';
    });
    return true;
  }catch(e){console.error(e);return false;}
}

function renderList(){
  var listEl=document.getElementById('reviewList');
  var filtered=allReviews.filter(function(r){
    if(!searchTerm)return true;
    var s=searchTerm.toLowerCase();
    return (r.name||'').toLowerCase().indexOf(s)!==-1 || (r.text||'').toLowerCase().indexOf(s)!==-1;
  });
  var avg=allReviews.length?(allReviews.reduce(function(s,r){return s+(parseFloat(r.rating)||0);},0)/allReviews.length):0;
  document.getElementById('statPill').textContent=allReviews.length+'개 리뷰 · 평균 '+avg.toFixed(1);

  if(!filtered.length){
    listEl.innerHTML='<div class="rv-empty">'+(allReviews.length?'검색 결과가 없습니다.':'아직 등록된 리뷰가 없습니다.')+'</div>';
    return;
  }
  listEl.innerHTML=filtered.map(function(r){
    var photosHtml=(r.photos&&r.photos.length)?('<div class="rv-photos">'+r.photos.map(function(p){
      var url=(p&&typeof p==='object')?p.url:p;
      return '<img src="'+esc(url)+'" onclick="window.rvOpenLightbox(\''+esc(url)+'\')">';
    }).join('')+'</div>'):'';
    var replyHtml=r.admin_reply?(
      '<div class="rv-reply-existing">'+
        '<div class="rv-reply-existing-head">🏠 사장님 답글'+(r.admin_reply_at?' · '+fmtDate(r.admin_reply_at):'')+'</div>'+
        '<div class="rv-reply-existing-text">'+esc(r.admin_reply)+'</div>'+
      '</div>'
    ):'';
    var replyBtnLabel=r.admin_reply?'답변 수정':'답변 작성';
    return '<div class="rv-card" data-id="'+r.__id+'">'+
      '<div class="rv-card-top">'+
        '<div class="rv-avatar">'+esc(initials(r.name))+'</div>'+
        '<div><div class="rv-name">'+esc(r.name||'고객')+'</div><div class="rv-meta">'+fmtDate(r.created_at)+'</div></div>'+
        '<div class="rv-stars">'+starStr(r.rating)+'</div>'+
      '</div>'+
      '<p class="rv-text">'+esc(r.text||'')+'</p>'+
      photosHtml+
      '<div class="rv-likes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 8.6c0 4.6-8.8 10.1-8.8 10.1S3.2 13.2 3.2 8.6a4.8 4.8 0 0 1 8.8-2.6 4.8 4.8 0 0 1 8.8 2.6z"/></svg> 좋아요 '+(r.likes||0)+'개</div>'+
      replyHtml+
      '<div class="rv-actions">'+
        '<button type="button" class="rv-btn" onclick="window.rvToggleReplyForm(\''+r.__id+'\')">'+replyBtnLabel+'</button>'+
        '<button type="button" class="rv-btn danger" onclick="window.rvConfirmDelete(\''+r.__id+'\')">삭제</button>'+
      '</div>'+
      '<div class="rv-reply-form" id="rf-'+r.__id+'">'+
        '<textarea rows="3" id="rf-text-'+r.__id+'" placeholder="고객님께 남길 답변을 입력해주세요.">'+esc(r.admin_reply||'')+'</textarea>'+
        '<div class="rv-reply-form-btns">'+
          '<button type="button" class="rv-btn save" onclick="window.rvSaveReply(\''+r.__id+'\')">저장</button>'+
          '<button type="button" class="rv-btn" onclick="window.rvToggleReplyForm(\''+r.__id+'\')">취소</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

window.rvToggleReplyForm=function(id){
  var form=document.getElementById('rf-'+id);
  if(!form)return;
  form.classList.toggle('open');
};

window.rvSaveReply=async function(id){
  var ta=document.getElementById('rf-text-'+id);
  if(!ta)return;
  var text=ta.value.trim();
  try{
    await updateDoc(doc(db,'reviews',id),{
      admin_reply:text,
      admin_reply_at:new Date().toISOString()
    });
    var form=document.getElementById('rf-'+id);
    if(form)form.classList.remove('open');
  }catch(e){
    alert('답변 저장 실패: '+e.message);
  }
};

window.rvConfirmDelete=function(id){
  deletePendingId=id;
  document.getElementById('confirmModal').classList.add('open');
};

document.getElementById('confirmCancel').addEventListener('click',function(){
  deletePendingId=null;
  document.getElementById('confirmModal').classList.remove('open');
});

document.getElementById('confirmDelete').addEventListener('click',async function(){
  if(!deletePendingId)return;
  var id=deletePendingId;
  document.getElementById('confirmModal').classList.remove('open');
  deletePendingId=null;
  try{
    var r=allReviews.find(function(x){return x.__id===id;});
    if(r&&r.photos&&r.photos.length){
      for(var i=0;i<r.photos.length;i++){
        var p=r.photos[i];
        var path=(p&&typeof p==='object')?p.path:null;
        if(path){
          try{await deleteObject(ref(storage,path));}catch(e){console.warn('사진 삭제 실패(무시):',e&&e.message);}
        }
      }
    }
    await deleteDoc(doc(db,'reviews',id));
  }catch(e){
    alert('리뷰 삭제 실패: '+e.message);
  }
});

window.rvOpenLightbox=function(url){
  document.getElementById('rvLightboxImg').src=url;
  document.getElementById('rvLightbox').classList.add('show');
};
window.closeLightbox=function(){
  document.getElementById('rvLightbox').classList.remove('show');
  document.getElementById('rvLightboxImg').src='';
};

document.getElementById('searchInput').addEventListener('input',function(e){
  searchTerm=e.target.value.trim();
  renderList();
});

// ── INIT ──
(async()=>{
  if(checkAuth()){
    const ok=await connectFirebase();
    if(ok)showScreen('app');else showScreen('login');
  }else{
    showScreen('login');
  }
})();

// ── LOGIN ──
document.getElementById('btn-login').addEventListener('click',async()=>{
  const pw=document.getElementById('login-pw').value.trim();
  const saved=localStorage.getItem(ADMIN_PW);
  const err=document.getElementById('login-err');
  if(!saved){
    if(!pw||pw.length<4){err.textContent='비밀번호는 4자리 이상이어야 합니다.';err.style.display='block';return;}
    localStorage.setItem(ADMIN_PW,pw);
  }else if(pw!==saved){err.textContent='비밀번호가 틀렸습니다.';err.style.display='block';return;}
  err.style.display='none';
  const ok=await connectFirebase();
  if(ok){setAuth(true);showScreen('app');}
  else{err.textContent='Firebase 연결 실패. 인터넷을 확인해주세요.';err.style.display='block';}
});
document.getElementById('login-pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('btn-login').click();});
document.getElementById('btn-logout').addEventListener('click',()=>{setAuth(false);if(unsub)unsub();showScreen('login');});
</script>
</body>
</html>
