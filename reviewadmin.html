<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HHC 리뷰 관리</title>
<style>
:root{
  --navy:#0B1833; --navy2:#1b2f58; --pri:#2563EB; --pri-bg:#EFF6FF;
  --ink:#14192A; --ink2:#5A6478; --ink3:#98A1B4;
  --bdr:#E4E9F2; --bg:#F6F8FC;
  --ok:#0E9B63; --ok-bg:#ECFDF5; --warn:#B45309; --warn-bg:#FFF7ED;
  --bad:#DC2626; --bad-bg:#FEF2F2; --gold:#B98A16; --gold-bg:#FEF9EC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;
  background:var(--bg);color:var(--ink);padding:14px;max-width:1060px;margin:0 auto}

/* ── 상단 헤더 ── */
.hdr{background:linear-gradient(120deg,#0B1833,#1b2f58);border-radius:14px;padding:14px 18px;
  box-shadow:0 3px 8px rgba(6,18,45,.25),0 14px 30px -14px rgba(6,18,45,.6);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;color:#fff}
.hdr h1{font-size:17px;font-weight:900;letter-spacing:-.01em}
.hdr .hs{font-size:11px;font-weight:700;color:#B9C7E2}
.hdr .sp{flex:1}
.fb-dot{width:8px;height:8px;border-radius:50%;background:#64748b;flex:none}
.fb-dot.on{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.8)}
.btn{font-family:inherit;font-size:12px;font-weight:800;border-radius:10px;padding:9px 14px;cursor:pointer;
  border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;transition:background .14s}
.btn:hover{background:rgba(255,255,255,.2)}

/* ── 요약 카드 ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st{background:#fff;border:1.5px solid var(--bdr);border-radius:12px;padding:11px 14px;
  display:flex;align-items:center;gap:10px;box-shadow:0 1px 2px rgba(14,35,80,.05)}
.st .ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.st.blue .ic{background:var(--pri-bg)}.st.gold .ic{background:var(--gold-bg)}
.st.green .ic{background:var(--ok-bg)}.st.warn .ic{background:var(--warn-bg)}
.st b{font-size:17px;font-weight:900;display:block;line-height:1.15;font-variant-numeric:tabular-nums}
.st span{font-size:10.5px;font-weight:800;color:var(--ink3)}

/* 별점 분포 */
.dist{background:#fff;border:1.5px solid var(--bdr);border-radius:12px;padding:12px 15px;margin-bottom:12px}
.dist .t{font-size:12px;font-weight:900;margin-bottom:9px}
.drow{display:flex;align-items:center;gap:9px;padding:2.5px 0;font-size:11.5px;font-weight:800;color:var(--ink2)}
.drow .lb{width:34px;color:var(--gold);letter-spacing:-.04em;white-space:nowrap}
.drow .bar{flex:1;height:9px;border-radius:99px;background:#EEF1F7;overflow:hidden}
.drow .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#E3C98A,#C9A44C)}
.drow .n{width:30px;text-align:right;font-variant-numeric:tabular-nums}

/* ── 검색 · 필터 ── */
.panel{background:#fff;border:1.5px solid var(--bdr);border-radius:13px;padding:12px;box-shadow:0 1px 2px rgba(14,35,80,.05)}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.frow input{flex:1;min-width:180px;font-family:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--bdr);
  border-radius:10px;padding:10px 13px;background:var(--bg)}
.frow input:focus{outline:none;border-color:var(--pri);background:#fff}
.chip{font-family:inherit;font-size:11.5px;font-weight:800;border:1.5px solid var(--bdr);background:#fff;
  color:var(--ink2);border-radius:999px;padding:7px 13px;cursor:pointer;white-space:nowrap;transition:all .14s}
.chip:hover{border-color:var(--navy)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ── 리뷰 카드 ── */
.rv{border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:#fff;
  box-shadow:0 1px 2px rgba(14,35,80,.04)}
.rv:hover{border-color:#C9D4E8}
.r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.r1 .nm{font-size:13.5px;font-weight:900;letter-spacing:-.01em}
.r1 .stars{color:var(--gold);font-size:13px;letter-spacing:1px;white-space:nowrap}
.r1 .dt{font-size:11px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums}
.r1 .lk{font-size:10.5px;font-weight:800;color:var(--pri);background:var(--pri-bg);border-radius:99px;padding:3px 9px}
.r1 .del{margin-left:auto;font-family:inherit;font-size:11px;font-weight:800;color:var(--bad);
  background:#fff;border:1.5px solid #FECACA;border-radius:9px;padding:6px 11px;cursor:pointer;transition:background .14s}
.r1 .del:hover{background:var(--bad-bg)}
.rtx{margin-top:8px;font-size:12.5px;font-weight:600;color:var(--ink2);line-height:1.75;word-break:break-word;white-space:pre-wrap}
.rph{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.rph img{width:74px;height:74px;object-fit:cover;border-radius:9px;border:1px solid var(--bdr);cursor:pointer}
.empty{text-align:center;padding:44px 10px;color:var(--ink3);font-size:13px;font-weight:700;line-height:1.8}
.more{width:100%;font-family:inherit;font-size:12.5px;font-weight:800;color:var(--ink2);background:var(--bg);
  border:1.5px solid var(--bdr);border-radius:10px;padding:11px;cursor:pointer;margin-top:4px}
.more:hover{border-color:var(--navy);color:var(--navy)}

/* 사진 확대 */
#lb{position:fixed;inset:0;background:rgba(8,14,28,.88);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
#lb.on{display:flex}
#lb img{max-width:94vw;max-height:90vh;border-radius:12px}
#lb .x{position:fixed;top:14px;right:16px;width:38px;height:38px;border-radius:50%;border:none;cursor:pointer;
  background:rgba(255,255,255,.15);color:#fff;font-size:16px;font-weight:900}

/* 알림 */
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#0B1833;color:#fff;
  font-size:12.5px;font-weight:800;border-radius:11px;padding:12px 20px;z-index:300;display:none;
  box-shadow:0 10px 26px rgba(6,18,45,.4);max-width:88vw;text-align:center}

@media(max-width:640px){
  body{padding:10px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .rv{padding:11px 12px}
  .r1 .del{flex-basis:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* HHC 로고 마크 */
.ra-logo{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;
  background:linear-gradient(150deg,#173a5e,#0f2540);
  box-shadow:0 2px 4px rgba(10,26,48,.18),0 8px 18px -10px rgba(10,26,48,.6)}
.hhc-mark{width:1.35em;height:1.35em;max-width:82%;max-height:82%;flex:none;display:block}
</style>
</head>
<body>

<div class="hdr">
  <span class="ra-logo"><svg class="hhc-mark" viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg></span>
  <div><h1>리뷰 관리</h1><span class="hs">홈페이지에 공개되는 고객 리뷰를 확인하고 관리하세요</span></div>
  <span class="fb-dot" id="fb-dot"></span>
  <span class="sp"></span>
  <button class="btn" onclick="window.open('home.html#reviews','_blank')">🏠 홈페이지에서 보기</button>
</div>

<div class="stats" id="stats"></div>
<div class="dist" id="dist" style="display:none"></div>

<div class="panel">
  <div class="frow">
    <input id="q" placeholder="🔍 이름 · 내용 검색" oninput="paint()">
    <button class="chip on" data-f="all" onclick="setF('all')">전체</button>
    <button class="chip" data-f="5" onclick="setF('5')">★5</button>
    <button class="chip" data-f="4" onclick="setF('4')">★4</button>
    <button class="chip" data-f="3" onclick="setF('3')">★3 이하</button>
    <button class="chip" data-f="photo" onclick="setF('photo')">📷 사진 리뷰</button>
  </div>
  <div id="list"><div class="empty">리뷰를 불러오는 중입니다…</div></div>
</div>

<div id="lb" onclick="this.classList.remove('on')"><button class="x">✕</button><img id="lb-img" src="" alt=""></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, doc, deleteDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { getStorage, ref, deleteObject } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js';

const FIREBASE_CFG={
  apiKey:"AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00",
  authDomain:"happywork-packageplan.firebaseapp.com",
  projectId:"happywork-packageplan",
  storageBucket:"happywork-packageplan.firebasestorage.app",
  messagingSenderId:"101289103022",
  appId:"1:101289103022:web:d81aca7f3747dd26df673f"
};
let db=null,storage=null;
let ALL=[];            // 전체 리뷰
let curF='all';        // 별점 필터
let showN=20;          // 더보기 단위

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600);}

/* ── 목록 그리기 ─────────────────────────────── */
function stars(n){n=Math.max(1,Math.min(5,parseInt(n,10)||5));return '★'.repeat(n)+'☆'.repeat(5-n);}
function dfmt(iso){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||''));return m?(m[1]+'.'+m[2]+'.'+m[3]):'';}

function renderStats(){
  const n=ALL.length;
  const avg=n?(ALL.reduce((a,x)=>a+(parseInt(x.rating,10)||0),0)/n):0;
  const ym=new Date().toISOString().slice(0,7);
  const mon=ALL.filter(x=>String(x.created_at||'').slice(0,7)===ym).length;
  const ph=ALL.filter(x=>(x.photos||[]).length>0).length;
  $('stats').innerHTML=
    '<div class="st blue"><span class="ic">💬</span><div><b>'+n+'</b><span>전체 리뷰</span></div></div>'+
    '<div class="st gold"><span class="ic">⭐</span><div><b>'+(n?avg.toFixed(1):'-')+'</b><span>평균 별점</span></div></div>'+
    '<div class="st green"><span class="ic">📅</span><div><b>'+mon+'</b><span>이번 달</span></div></div>'+
    '<div class="st warn"><span class="ic">📷</span><div><b>'+ph+'</b><span>사진 리뷰</span></div></div>';
  // 별점 분포
  const d=$('dist');
  if(!n){d.style.display='none';return;}
  d.style.display='block';
  let h='<div class="t">별점 분포</div>';
  for(let s=5;s>=1;s--){
    const c=ALL.filter(x=>(parseInt(x.rating,10)||0)===s).length;
    const pct=n?Math.round(c/n*100):0;
    h+='<div class="drow"><span class="lb">★ '+s+'</span><span class="bar"><i style="width:'+pct+'%"></i></span><span class="n">'+c+'</span></div>';
  }
  d.innerHTML=h;
}

window.setF=function(f){
  curF=f;showN=20;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===f));
  paint();
};
window.paint=function(){
  const q=($('q').value||'').trim().toLowerCase();
  let list=ALL.slice();
  if(curF==='5')list=list.filter(x=>(parseInt(x.rating,10)||0)===5);
  else if(curF==='4')list=list.filter(x=>(parseInt(x.rating,10)||0)===4);
  else if(curF==='3')list=list.filter(x=>(parseInt(x.rating,10)||0)<=3);
  else if(curF==='photo')list=list.filter(x=>(x.photos||[]).length>0);
  if(q)list=list.filter(x=>(String(x.name||'')+' '+String(x.text||'')).toLowerCase().includes(q));
  const host=$('list');
  if(!list.length){
    host.innerHTML='<div class="empty">'+(ALL.length?'조건에 맞는 리뷰가 없습니다.':'아직 등록된 리뷰가 없습니다.<br>고객 마이페이지·홈페이지에서 리뷰를 남기면 여기에 표시됩니다.')+'</div>';
    return;
  }
  host.innerHTML=list.slice(0,showN).map(x=>{
    const phs=(x.photos||[]).map(p=>'<img src="'+esc(p.url)+'" loading="lazy" alt="리뷰 사진" onclick="lbOpen(this.src)">').join('');
    return '<div class="rv">'+
      '<div class="r1"><span class="nm">'+esc(x.name||'(이름 없음)')+'</span>'+
      '<span class="stars" title="'+(parseInt(x.rating,10)||0)+'점">'+stars(x.rating)+'</span>'+
      '<span class="dt">'+dfmt(x.created_at)+'</span>'+
      ((x.likes|0)>0?'<span class="lk">👍 '+(x.likes|0)+'</span>':'')+
      '<button class="del" onclick="delRv(\''+esc(x.__id)+'\')">🗑 삭제</button></div>'+
      (x.text?'<div class="rtx">'+esc(x.text)+'</div>':'')+
      (phs?'<div class="rph">'+phs+'</div>':'')+
      '</div>';
  }).join('')+(list.length>showN
    ?'<button class="more" onclick="showN+=20;paint()">리뷰 더보기 ('+(list.length-showN)+'건 남음)</button>':'');
};
window.showN=showN;
Object.defineProperty(window,'showN',{get:()=>showN,set:v=>{showN=v;}});
window.lbOpen=function(src){$('lb-img').src=src;$('lb').classList.add('on');};

/* ── 삭제 (사진도 함께 정리) ─────────────────── */
window.delRv=async function(id){
  const x=ALL.find(r=>r.__id===id);if(!x)return;
  if(!db){toast('Firebase 연결 중입니다');return;}
  const nm=x.name||'(이름 없음)';
  if(!confirm('「'+nm+'」 님의 리뷰를 삭제할까요?\n\n· 홈페이지 리뷰 목록에서 즉시 사라집니다.\n· 삭제한 리뷰는 되돌릴 수 없습니다.'+((x.photos||[]).length?'\n· 첨부된 사진 '+(x.photos||[]).length+'장도 함께 삭제됩니다.':'')))return;
  try{
    await deleteDoc(doc(db,'reviews',id));
    (x.photos||[]).forEach(p=>{ if(p&&p.path){ try{deleteObject(ref(storage,p.path)).catch(()=>{});}catch(e){} } });
    toast('🗑 리뷰가 삭제되었습니다');
  }catch(e){toast('삭제 실패: '+e.message);}
};

/* ── 실시간 구독 ─────────────────────────────── */
try{
  const app=initializeApp(FIREBASE_CFG);
  db=getFirestore(app);storage=getStorage(app);
  onSnapshot(collection(db,'reviews'),snap=>{
    ALL=snap.docs.map(d=>{const x=d.data()||{};x.__id=d.id;return x;})
      .sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
    $('fb-dot').classList.add('on');
    renderStats();paint();
  },err=>{
    console.warn(err);
    $('list').innerHTML='<div class="empty">리뷰를 불러오지 못했습니다.<br>'+esc(err.message)+'</div>';
  });
}catch(e){
  $('list').innerHTML='<div class="empty">Firebase 연결에 실패했습니다.<br>'+esc(e.message)+'</div>';
}
</script>
</body>
</html>
