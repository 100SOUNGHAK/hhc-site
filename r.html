<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Happy Home Care</title>
<!-- 왓츠앱·카카오톡·문자는 링크를 받으면 자바스크립트를 실행하지 않고 아래 태그만
     읽어 미리보기 카드를 만듭니다. 단축 주소(/r?k=)로 보내는 모든 링크의 공통 카드입니다. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Happy Home Care">
<meta property="og:title" content="Happy Home Care">
<meta property="og:description" content="Aircon &amp; Appliance Care · 에어컨·가전 세척·설치·유지관리">
<meta property="og:image" content="https://happyhomecare.com.my/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:title" content="Happy Home Care">
<meta name="twitter:description" content="Aircon &amp; Appliance Care · 에어컨·가전 세척·설치·유지관리">
<meta name="twitter:image" content="https://happyhomecare.com.my/icon-512.png">
<meta name="robots" content="noindex">
<!-- 주소 조회를 빠르게: 조회 서버와 미리 연결해 둡니다 -->
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<style>
body{font-family:-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f4f6fb;color:#0f172a;flex-direction:column;gap:16px}
.spinner{width:36px;height:36px;border:3px solid #e2e8f0;border-top-color:#4F6EF7;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
p{font-size:14px;color:#6b7280}
a{color:#4F6EF7;font-size:13px}
</style>
</head>
<body>
<div class="spinner" id="spin"></div>
<p id="msg">잠시 후 이동합니다...</p>
<p id="err" style="display:none;color:#ef4444"></p>
<a id="direct" style="display:none" href="#">직접 이동하기</a>
<button id="retry" style="display:none;font-family:inherit;font-size:13.5px;font-weight:700;color:#fff;background:#0E2350;border:none;border-radius:10px;padding:11px 22px;cursor:pointer">🔄 다시 시도</button>
<a id="wa" style="display:none" href="https://wa.me/60172472774" target="_blank" rel="noopener">💬 문의하기 (WhatsApp)</a>

<script>
/* ── 단축주소(/r?k=) 이동 페이지 ─────────────────────────────────────
   [2026-08-30 개선]
   · 예전에는 Firebase 프로그램 전체(수백 KB)를 내려받은 뒤에야 주소를 조회해
     느렸고, 내려받기가 한 번이라도 실패하면 재시도 없이 "링크를 찾을 수 없습니다"가
     떠서 링크가 안 열리는 것처럼 보였습니다.
   · 지금은 프로그램 없이 조회 요청 딱 1건만 보내 바로 이동합니다 (수 배 빠름).
   · 통신이 순간적으로 끊겨도 0.6초 간격으로 2번 더 자동 재시도하고,
     그래도 안 되면 「다시 시도」 버튼과 문의 버튼을 보여줍니다.
   · 한 번 연 주소는 이 휴대폰에 기억해 두어, 같은 링크를 다시 열면 즉시 이동합니다. */
var FB_KEY="AIzaSyAxAaB-CtySH2_ZHJKidwjbhn8ava6rM00";
var Q_URL="https://firestore.googleapis.com/v1/projects/happywork-packageplan/databases/(default)/documents:runQuery?key="+FB_KEY;

function show(id,on){var el=document.getElementById(id);if(el)el.style.display=on?'':'none';}
function fail(text,canRetry){
  show('spin',false);show('msg',false);
  var err=document.getElementById('err');err.textContent=text;err.style.display='block';
  show('retry',canRetry);show('wa',true);
}

// 조회 요청 1건 (7초 안에 응답이 없으면 실패로 보고 재시도)
function lookup(key){
  var ctrl=(typeof AbortController!=='undefined')?new AbortController():null;
  var timer=ctrl?setTimeout(function(){ctrl.abort();},7000):null;
  var body={structuredQuery:{
    from:[{collectionId:'shorts'}],
    where:{fieldFilter:{field:{fieldPath:'key'},op:'EQUAL',value:{stringValue:key}}},
    limit:1}};
  return fetch(Q_URL,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body),signal:ctrl?ctrl.signal:undefined})
  .then(function(r){
    if(!r.ok)throw new Error('http '+r.status);
    return r.json();
  }).then(function(arr){
    if(timer)clearTimeout(timer);
    for(var i=0;i<(arr||[]).length;i++){
      var d=arr[i]&&arr[i].document;
      if(d&&d.fields&&d.fields.url&&d.fields.url.stringValue)return d.fields.url.stringValue;
    }
    return null;   // 조회는 성공했지만 등록된 주소가 없음
  }).catch(function(e){if(timer)clearTimeout(timer);throw e;});
}

function go(url,key){
  try{localStorage.setItem('hhc_r_'+key,url);}catch(e){}
  var a=document.getElementById('direct');
  a.href=url;a.style.display='block';
  window.location.replace(url);
}

function run(){
  show('err',false);show('retry',false);show('wa',false);
  show('spin',true);show('msg',true);
  var key=new URLSearchParams(window.location.search).get('k');
  if(!key){fail('링크를 찾을 수 없습니다. 받으신 링크를 다시 확인해 주세요.',false);return;}
  // 이 휴대폰에서 연 적 있는 링크는 조회 없이 즉시 이동
  var cached=null;try{cached=localStorage.getItem('hhc_r_'+key);}catch(e){}
  if(cached){go(cached,key);return;}
  var tries=0;
  (function attempt(){
    lookup(key).then(function(url){
      if(url===null){fail('링크를 찾을 수 없습니다. 받으신 링크를 다시 확인해 주세요.',false);return;}
      go(url,key);
    }).catch(function(){
      tries++;
      if(tries<3){setTimeout(attempt,600);return;}
      fail('연결이 원활하지 않아 페이지를 열지 못했습니다.\n인터넷 연결을 확인한 뒤 다시 시도해 주세요.',true);
    });
  })();
}
document.getElementById('retry').addEventListener('click',run);
run();
</script>
</body>
</html>
