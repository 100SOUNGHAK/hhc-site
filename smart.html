<style>
:root{
  --navy-950:#08172b;--navy-900:#0f2540;--navy-800:#173a5e;
  --teal-700:#0b5f59;--teal-600:#0f766e;--teal-400:#5fd0c3;
  --gold-700:#8f6f28;--gold-600:#b08d3a;--gold-500:#c9a44c;--gold-300:#e3c98a;--gold-50:#fbf5e6;
  --ink-900:#161d27;--ink-700:#333d4b;--ink-600:#4d5866;--ink-400:#8891a0;
  --line:#e8e2d4;--paper:#fdfcf9;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:var(--paper);color:var(--ink-900);line-height:1.5;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.num{font-family:'Cormorant Garamond',Georgia,serif;font-feature-settings:'lnum';font-variant-numeric:lining-nums tabular-nums}
.sm-wrap{max-width:880px;margin:0 auto;padding-bottom:calc(32px + env(safe-area-inset-bottom))}

/* 머리 */
.sm-hd{position:relative;overflow:hidden;background:linear-gradient(165deg,var(--navy-900),var(--navy-950));
  padding:calc(28px + env(safe-area-inset-top)) 56px 120px;color:#fff}
.sm-hd .c1,.sm-hd .c2{position:absolute;border-radius:50%;border:1px solid rgba(201,164,76,.2);pointer-events:none}
.sm-hd .c1{right:-140px;top:-160px;width:440px;height:440px}
.sm-hd .c2{right:-60px;top:-80px;width:280px;height:280px;border-color:rgba(201,164,76,.12)}
.sm-br{position:relative;display:flex;align-items:center;gap:10px}
.sm-br b{min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:12px;font-weight:800;color:var(--gold-300);letter-spacing:.2em;white-space:nowrap}
.sm-lg{flex:none;margin-left:auto;display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px}
.sm-lg button{white-space:nowrap;border:0;background:none;color:#c9d6ea;font:inherit;font-size:12px;font-weight:800;border-radius:999px;padding:5px 11px;cursor:pointer}
.sm-lg button.on{background:var(--gold-300);color:var(--navy-900)}
.sm-hd h1{position:relative;margin-top:40px;font-family:'Noto Serif KR',serif;font-weight:900;font-size:60px;line-height:1.2;letter-spacing:-.03em;word-break:keep-all}
.sm-hd h1 em{font-style:normal;color:var(--gold-300)}
.sm-hd p{position:relative;margin-top:16px;font-size:19px;color:rgba(255,255,255,.75);word-break:keep-all;max-width:560px}
.sm-st{position:absolute;right:56px;top:118px;width:164px;height:164px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f3e6c2,var(--gold-500) 60%,#a07f30);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform:rotate(8deg);color:var(--navy-900);
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.25),inset 0 0 0 7px rgba(15,37,64,.25),0 14px 30px -8px rgba(0,0,0,.5)}
.sm-st small{margin-top:4px;font-size:11px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--navy-900);border-radius:999px;padding:3px 9px;white-space:nowrap}
.sm-st b{font-size:17px;font-weight:800}
.sm-st .num{font-size:54px;font-weight:700;line-height:.95}

/* 카드 두 장 */
.sm-cards{position:relative;margin-top:-80px;padding:0 56px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.sm-cd{display:flex;flex-direction:column;gap:24px;border-radius:24px;padding:32px 28px 24px;
  transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.sm-cd:active{transform:translateY(2px) scale(.995)}
.sm-cd.v{background:#fff;box-shadow:0 2px 6px rgba(11,24,51,.10),0 14px 26px -6px rgba(11,24,51,.16),0 38px 68px -18px rgba(11,24,51,.30)}
.sm-cd.m{background:linear-gradient(165deg,var(--navy-800),var(--navy-900));color:#fff;
  box-shadow:0 0 0 2px var(--gold-500),0 2px 6px rgba(11,24,51,.16),0 14px 26px -6px rgba(11,24,51,.24),0 38px 68px -18px rgba(11,24,51,.44)}
@media (hover:hover){.sm-cd:hover{transform:translateY(-3px)}}
.sm-tg{font-size:14px;font-weight:700}
.sm-cd.v .sm-tg{color:var(--gold-700)} .sm-cd.m .sm-tg{color:var(--teal-400)}
.sm-tt{margin-top:6px;font-family:'Noto Serif KR',serif;font-size:28px;font-weight:700;color:var(--navy-900)}
.sm-cd.m .sm-tt{color:#fff}
.sm-big{display:flex;align-items:flex-end;gap:12px;white-space:nowrap;flex-wrap:wrap}
.sm-big .num{font-size:92px;font-weight:700;line-height:.9}
.sm-cd.v .sm-big .num{color:var(--gold-600)} .sm-cd.m .sm-big .num{color:var(--gold-300)}
.sm-big .lb{font-size:20px;font-weight:700;color:var(--ink-700);padding-bottom:6px}
.sm-big .bx{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-bottom:6px}
.sm-big .bx small{font-size:14px;font-weight:700;color:rgba(255,255,255,.75)}
.sm-bonus{font-size:20px;font-weight:800;letter-spacing:.16em;color:var(--navy-900);border-radius:8px;padding:6px 12px 6px 14px;
  background:linear-gradient(135deg,#f3e6c2,var(--gold-500) 55%,var(--gold-600));box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 14px -6px rgba(0,0,0,.5)}
.sm-vis{height:236px;display:flex;align-items:center;justify-content:center}
.gv{width:300px;max-width:100%;aspect-ratio:1.586;border-radius:16px;padding:20px 22px;transform:rotate(-4deg);color:var(--navy-900);
  background:linear-gradient(135deg,#f1e2b6 0%,#d8b765 38%,#f3e6c2 62%,#b9923e 100%);display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 6px rgba(11,24,51,.16),0 14px 26px -6px rgba(11,24,51,.22),0 30px 50px -18px rgba(11,24,51,.32)}
.gv .t{display:flex;justify-content:space-between;align-items:center}
.gv .t b{font-size:11px;font-weight:800;letter-spacing:.2em}
.gv .num{font-size:46px;font-weight:700;line-height:1}
.gv .p{align-self:flex-start;font-size:13px;font-weight:700;background:rgba(15,37,64,.12);border-radius:999px;padding:4px 10px}
.sm-ch{display:flex;flex-direction:column;justify-content:flex-end;gap:12px;height:236px}
.sm-lgd{display:flex;gap:16px;font-size:12px;color:rgba(255,255,255,.7)}
.sm-lgd span{display:flex;align-items:center;gap:6px}
.sm-lgd i{width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.3)}
.sm-lgd i.g{background:var(--gold-500)}
.sm-bars{display:flex;align-items:flex-end;gap:8px}
.sm-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.sm-bar .num{font-size:21px;font-weight:700;color:#fff}
.sm-bar.top .num{color:var(--gold-300)}
.sm-bar .st{width:100%;display:flex;flex-direction:column}
.sm-bar .up{border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--gold-300),var(--gold-600))}
.sm-bar .dn{border-radius:0 0 3px 3px;background:rgba(255,255,255,.18)}
.sm-bar .st.solo .dn{border-radius:8px 8px 3px 3px}
.sm-bar .nm{font-size:12px;color:rgba(255,255,255,.7);height:30px;text-align:center;line-height:1.25;word-break:keep-all}
.sm-ul{list-style:none;display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:20px}
.sm-cd.m .sm-ul{border-color:rgba(255,255,255,.14)}
.sm-ul li{display:flex;gap:10px;align-items:center;font-size:17px;color:var(--ink-700)}
.sm-cd.m .sm-ul li{color:#fff}
.sm-ul svg{flex:none}
.sm-rc{margin-top:auto;border-radius:14px;padding:14px 16px;font-size:16px}
.sm-cd.v .sm-rc{background:var(--gold-50);color:var(--gold-700)}
.sm-cd.m .sm-rc{background:rgba(255,255,255,.08);color:var(--gold-300)}
.sm-go{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:13px;font-size:16px;font-weight:800}
.sm-cd.v .sm-go{background:var(--navy-900);color:#fff}
.sm-cd.m .sm-go{background:linear-gradient(135deg,#f3e6c2,var(--gold-500) 55%,var(--gold-600));color:var(--navy-900)}
.sm-go b{font-size:20px;line-height:1}

/* 해피포인트 (가입 없이 자동) + 「가입 후 혜택」 구분 — 2026-11-15 */
.sm-pt{grid-column:1/-1;position:relative;overflow:hidden;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:22px 28px;
  border-radius:24px;padding:26px 28px;background:#fff;color:var(--ink-900);
  box-shadow:0 0 0 2px var(--teal-600),0 2px 6px rgba(11,24,51,.10),0 14px 26px -6px rgba(11,24,51,.16),0 38px 68px -18px rgba(11,24,51,.30);
  transition:transform .16s var(--ease)}
.sm-pt:active{transform:translateY(2px) scale(.995)}
@media (hover:hover){.sm-pt:hover{transform:translateY(-3px)}}
.sm-pt .sm-tg{color:var(--teal-600)}
.sm-pt .free{display:inline-block;margin-left:6px;font-size:12px;font-weight:800;color:#fff;background:var(--teal-600);border-radius:999px;padding:3px 9px;vertical-align:2px}
.sm-pt .big{display:flex;align-items:flex-end;gap:10px;white-space:nowrap}
.sm-pt .big .num{font-size:84px;font-weight:700;line-height:.9;color:var(--teal-600)}
.sm-pt .big .lb{font-size:18px;font-weight:800;color:var(--ink-700);padding-bottom:6px}
.sm-pt .ex{margin-top:8px;font-size:15px;font-weight:700;color:var(--ink-600)}
.sm-pt .ex b{color:var(--navy-900)}
.sm-pt .chips{display:flex;flex-wrap:wrap;gap:8px}
.sm-pt .chips span{font-size:14px;font-weight:700;color:var(--teal-700);background:#e9f6f4;border-radius:999px;padding:7px 12px;white-space:nowrap}
.sm-pt .pn{grid-column:1/-1;font-size:13.5px;color:var(--ink-600);border-top:1px solid var(--line);padding-top:14px;word-break:keep-all}
.sm-pt .sm-go{background:var(--teal-600);color:#fff;padding:0 20px;white-space:nowrap}
.sm-mb{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin-top:8px;font-size:15px;font-weight:800;color:var(--navy-900)}
.sm-mb::before,.sm-mb::after{content:'';flex:1;height:1px;background:var(--line)}
.sm-mb span{display:inline-flex;align-items:center;gap:8px}
.sm-mb small{font-size:12px;font-weight:800;color:var(--gold-700);background:var(--gold-50);border:1px solid #efe0b8;border-radius:999px;padding:3px 9px}

/* 해피포인트 안내장 그림 팝업 (한국어) */
.sm-pv{position:fixed;inset:0;z-index:9995;display:none;background:rgba(6,15,30,.86);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:calc(64px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom))}
.sm-pv.on{display:block}
.sm-pv img{display:block;width:100%;max-width:600px;height:auto;margin:0 auto;border-radius:18px;box-shadow:0 24px 60px -16px rgba(0,0,0,.7)}
.sm-pv .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.25);
  background:rgba(15,37,64,.9);color:#fff;font:inherit;font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sm-pv .more{display:block;width:max-content;max-width:100%;margin:18px auto 0;color:var(--gold-300);font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
html.pv-lock,html.pv-lock body{overflow:hidden}

/* 신뢰 띠 · 문의 */
.sm-tr{margin:32px 56px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:#fff;border-radius:16px;padding:18px 8px;
  box-shadow:0 1px 2px rgba(11,24,51,.08),0 8px 18px -8px rgba(14,35,80,.16)}
.sm-tr div{display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700;color:var(--navy-900);text-align:left;padding:0 6px}
.sm-tr div+div{border-left:1px solid var(--line)}
.sm-ft{margin:48px 56px 0;display:flex;justify-content:space-between;align-items:center;gap:20px}
.sm-ft h2{font-size:22px;font-weight:800;color:var(--navy-900);word-break:keep-all}
.sm-ft .u{font-size:15px;color:var(--ink-400)}
.sm-wa{flex:none;display:inline-flex;align-items:center;gap:10px;background:var(--teal-600);color:#fff;border-radius:999px;padding:14px 24px;font-size:18px;font-weight:700;
  box-shadow:0 1px 2px rgba(11,24,51,.10),0 8px 16px -4px rgba(15,118,110,.35);transition:transform .16s var(--ease)}
.sm-wa:active{transform:translateY(1px)}
.sm-nt{margin:20px 56px 0;font-size:13px;line-height:1.6;color:var(--ink-400);word-break:keep-all}

/* 휴대폰 */
@media (max-width:720px){
  .sm-hd{padding:calc(20px + env(safe-area-inset-top)) 20px 92px}
  .sm-br b{font-size:10px;letter-spacing:.14em}
  .sm-hd h1{margin-top:28px;font-size:clamp(30px,8.6vw,44px)}
  .sm-hd p{font-size:16px;margin-top:12px;max-width:none}
  .sm-st{position:relative;right:auto;top:auto;width:auto;height:auto;margin-top:16px;display:inline-flex;flex-direction:row;align-items:center;gap:8px;
    padding:8px 16px 8px 14px;border-radius:999px;transform:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 8px 18px -8px rgba(0,0,0,.6)}
  .sm-st small{margin-top:0;font-size:11px} .sm-st b{font-size:14px} .sm-st .num{font-size:26px;line-height:1}
  .sm-cards{grid-template-columns:1fr;padding:0 16px;margin-top:-64px;gap:16px}
  .sm-cd{padding:26px 22px 20px;gap:20px}
  .sm-big .num{font-size:80px}
  .sm-vis,.sm-ch{height:auto}
  .sm-vis{padding:8px 0}
  .sm-ch{gap:12px}
  .sm-pt{grid-template-columns:1fr;gap:16px;padding:24px 22px 20px}
  .sm-pt .big .num{font-size:72px}
  .sm-pt .sm-go{min-height:48px}
  .sm-tr{margin:24px 16px 0;grid-template-columns:1fr;padding:6px 16px}
  .sm-tr div{justify-content:flex-start;padding:12px 0}
  .sm-tr div+div{border-left:0;border-top:1px solid var(--line)}
  .sm-ft{margin:32px 16px 0;flex-direction:column;align-items:stretch}
  .sm-wa{justify-content:center}
  .sm-nt{margin:16px 16px 0}
}
@media (max-width:370px){ .sm-big .num{font-size:68px} .sm-bar .num{font-size:18px} .sm-bar .nm{font-size:11px} }

/* 명함에서 왔을 때만 보이는 되돌아가기 버튼 (membership.html 과 같은 모양) */
.hhcbk{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom));z-index:9990;display:none;align-items:center;gap:8px;
  padding:11px 17px 11px 13px;border-radius:999px;border:1px solid rgba(227,201,138,.35);color:#fff;font:inherit;font-size:13.5px;font-weight:800;
  background:linear-gradient(150deg,#173a5e,#0f2540);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 6px rgba(4,12,26,.35),0 14px 28px -12px rgba(4,12,26,.8);
  cursor:pointer;transition:transform .16s var(--ease)}
.hhcbk.on{display:inline-flex}
body.bk .sm-wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.hhcbk:active{transform:translateY(1px)}
.hhcbk i{font-style:normal;color:var(--gold-300);font-size:16px;line-height:1}
@media (prefers-reduced-motion:reduce){.sm-cd,.sm-wa,.hhcbk{transition:none}}
@media print{.hhcbk,.sm-lg{display:none!important}}

/* ═══ 💳 3D 회원카드 (2026-11-20) — membership.html 의 .mb-* 카드 스타일을 그대로 가져왔습니다. 카드 모양을 바꾸면 함께 고쳐 주세요 ═══ */
.mb-scene{position:relative;height:250px;margin-top:18px;perspective:1000px;touch-action:pan-y}
.mb-card{position:absolute;left:50%;top:14px;width:min(320px,84vw);aspect-ratio:1.586;margin-left:calc(min(320px,84vw) / -2);border-radius:20px;
  transform-style:preserve-3d;transform:rotateX(var(--rx,8deg)) rotateY(var(--ry,-12deg));transition:transform .5s cubic-bezier(.22,.61,.36,1),background .45s;
  padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.25),0 2px 3px rgba(0,0,0,.25),0 22px 40px -12px rgba(0,0,0,.55),0 50px 80px -30px rgba(0,0,0,.6)}
.mb-card.drag{transition:transform .08s linear}

        '<div class="dn" style="height:' + Math.round(t.b * k) + 'px"></div></div>' +
        '<span class="nm">' + t[L] + '</span></div>';
    });
    return h;

  document.getElementById('goP').addEventListener('click', function(e){
    if(lang === 'en') return;
    e.preventDefault();
    pv.scrollTop = 0; pv.classList.add('on'); document.documentElement.classList.add('pv-lock');
    try{ history.pushState({smPv:1}, ''); }catch(err){}
  });
  function pvBack(){ if(history.state && history.state.smPv){ history.back(); } else pvClose(); }
  document.getElementById('smPvX').addEventListener('click', pvBack);
  pv.addEventListener('click', function(e){ if(e.target === pv) pvBack(); });
  window.addEventListener('popstate', pvClose);
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && pv.classList.contains('on')) pvBack(); });
  [].forEach.call(document.querySelectorAll('[data-lg]'), function(b){

      lang = b.getAttribute('data-lg');
      try{ var u = new URL(location.href); if(lang === 'en') u.searchParams.set('lang', 'en'); else u.searchParams.delete('lang'); history.replaceState(null, '', u); }catch(e){}
      render();
    });
  });
  render();
  window.__smRender = function(){ evSync(); render(); };

  if(fromCard){
    var b = document.getElementById('hhcBackToCard');

    b.addEventListener('click', function(){
      if(history.length > 1) history.back();
      else location.href = '/namecard' + (lang === 'en' ? '?lang=en' : '');

<script>
/* 💳 회원제 패키지 3D 카드 — 3초마다 등급 순환 + 천천히 회전 · 빛줄기 (membership.html 과 같은 카드) */
(function(){
  var cd=document.getElementById('smCard'),ln=document.getElementById('smMcl');if(!cd||!ln)return;
  /* 무상적립 배수 — 관리자 프로모션 설정(hhc-ev.js)을 따름. 이벤트가 끝나면 1 */
  function MX(){var e=window.HHCEv?HHCEv.get():{on:true,mult:2};return e.on?(+e.mult||2):1;}
  var K=[['royal','Royal','로얄',2500,250],['gold','Gold','골드',5000,750],['diamond','Diamond','다이아몬드',10000,2000],['titanium','Titanium','티타늄',20000,5000],['special','Special Happy Home','스페셜 해피홈',50000,15000]];
  var MARK='<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="currentColor"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg>';
  var CHIP='<svg viewBox="0 0 46 36" aria-hidden="true"><defs><linearGradient id="smChipG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4cf"/><stop offset=".45" stop-color="#d9b867"/><stop offset="1" stop-color="#9c7a2c"/></linearGradient></defs><rect x=".5" y=".5" width="45" height="35" rx="6" fill="url(#smChipG)" stroke="rgba(0,0,0,.35)"/><g fill="none" stroke="rgba(70,50,10,.55)" stroke-width="1"><path d="M15 .5v11c0 2-1 3-3 3H.5M31 .5v11c0 2 1 3 3 3h11.5M15 35.5v-11c0-2-1-3-3-3H.5M31 35.5v-11c0-2 1-3 3-3h11.5"/><rect x="15" y="11" width="16" height="14" rx="3"/><path d="M23 .5V11M23 25v10.5"/></g></svg>';
  var NFC='<svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 8.5a5 5 0 0 1 0 7"/><path d="M11.5 6a9 9 0 0 1 0 12"/><path d="M15 3.5a13 13 0 0 1 0 17"/></g></svg>';
  var i=1,L=document.documentElement.lang==='en'?'en':'ko',touchT=0,flipT=0;
  function rm(n){return 'RM '+Number(n).toLocaleString('en-MY');}
  function draw(){
    var t=K[i],b=t[4]*MX(),u=t[3]+b,d=Math.floor(b/u*100),en=L==='en';
    cd.className='mb-card t-'+t[0];
    cd.innerHTML='<span class="edge" aria-hidden="true"></span><span class="glare" aria-hidden="true"></span>'+
      '<div class="r1"><span class="br"><span class="mk">'+MARK+'</span><span class="bn">HAPPY HOME CARE<small>PREMIUM MEMBERSHIP</small></span></span><b class="tn">'+(t[0]==='special'?'SPECIAL':t[1].toUpperCase())+'</b></div>'+
      '<div class="r2"><span class="chip">'+CHIP+'</span><span class="nfc">'+NFC+'</span><span class="holo" aria-hidden="true"></span></div>'+
      '<div class="r3"><small>'+(en?'SPENDING LIMIT':'이용 한도')+'</small><span class="am">'+rm(u)+'</span></div>'+
      '<div class="r4"><span class="nm emb">'+(en?'YOUR NAME':'HONG GILDONG')+'</span><span class="vt"><small>VALID<br>THRU</small><b class="emb">∞</b></span></div>';
    ln.innerHTML=(en?t[1]+' · pay <b>'+rm(t[3])+'</b> → use <b>'+rm(u)+'</b><br><span class="dc">'+d+'% off every service, always</span>'
                    :t[2]+' · <b>'+rm(t[3])+'</b> 납부 → <b>'+rm(u)+'</b> 사용<br><span class="dc">모든 서비스 '+d+'% 상시할인 효과</span>');
  }
  function next(){i=(i+1)%K.length;draw();flipT=performance.now();cd.classList.remove('idle');cd.style.setProperty('--ry','180deg');
    var tgt=Math.sin((performance.now()+700)/10000*Math.PI*2)*24;requestAnimationFrame(function(){requestAnimationFrame(function(){cd.style.setProperty('--ry',tgt.toFixed(2)+'deg');});});}
  function idle(now){
    if(now-touchT>1400&&now-flipT>700&&!document.hidden){
      var k=now/10000*Math.PI*2,ry=Math.sin(k)*24,rx=7+Math.sin(k*.5+1)*3;
      cd.classList.add('idle');cd.style.setProperty('--ry',ry.toFixed(2)+'deg');cd.style.setProperty('--rx',rx.toFixed(2)+'deg');
      cd.style.setProperty('--mx',(50-ry*2.6).toFixed(1)+'%');cd.style.setProperty('--my',(18+Math.cos(k)*10).toFixed(1)+'%');
    }
    requestAnimationFrame(idle);
  }
  var sc=cd.parentNode;
  sc.addEventListener('pointermove',function(e){touchT=performance.now();cd.classList.remove('idle');cd.classList.add('drag');
    var r=sc.getBoundingClientRect(),px=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),py=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
    cd.style.setProperty('--ry',((px-.5)*34).toFixed(1)+'deg');cd.style.setProperty('--rx',((.5-py)*24).toFixed(1)+'deg');cd.style.setProperty('--mx',(px*100).toFixed(0)+'%');cd.style.setProperty('--my',(py*100).toFixed(0)+'%');});
  sc.addEventListener('pointerleave',function(){touchT=performance.now();cd.classList.remove('drag');});
  window.SMC={lang:function(l){L=l==='en'?'en':'ko';draw();}};
  /* 🎉 이벤트 설정이 바뀌어 있으면 카드와 위 안내 문구를 다시 그림 */
  if(window.HHCEv)HHCEv.on(function(){draw();if(window.__smRender)window.__smRender();});
  draw();requestAnimationFrame(idle);
  setInterval(function(){if(performance.now()-touchT>3000&&!document.hidden)next();},3200);
})();
</script>
