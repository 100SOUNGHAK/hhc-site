name = "hhc-site"
   main = "worker.js"
   compatibility_date = "2026-07-04"

   [[kv_namespaces]]
   binding = "HHC_KV"
   id = "2130ee8869714250801339b817c4bc16"

   [triggers]
   crons = ["*/15 * * * *"]

# 2026-11-09: Worker 실행 로그(Observability) 켬 — 대시보드에서 켠 설정이 재배포 때 꺼지지 않도록 저장소에도 기록
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
