name = "hhc-site"
   main = "worker.js"
   compatibility_date = "2026-07-04"

   [[kv_namespaces]]
   binding = "HHC_KV"
   id = "2130ee8869714250801339b817c4bc16"

   [triggers]
   crons = ["*/15 * * * *", "0 0 * * *", "0 1 * * *", "0 9 * * *"]   # 15분마다 동기화 · 08:00(MYT) 방문 안내(내일·오늘) · 09:00(MYT) 결제 기한 알림 · 17:00(MYT) 방문 안내(7일 전·3일 전)

# 2026-11-09: Worker 실행 로그(Observability) 켬 — 대시보드에서 켠 설정이 재배포 때 꺼지지 않도록 저장소에도 기록
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
