<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Happy Home Care · 계약서 / 이용내역</title>
<style>
:root{
  --navy:#0F1C3F; --navy-2:#1A2F5E; --indigo:#3D52A0; --violet:#7091E6;
  --sky:#8697C4; --lav:#ADBBDA; --lav-lt:#EDE8F5;
  --ink:#0F1C3F; --ink-2:#43507A; --ink-3:#8693B5;
  --line:#E1E6F1; --line-2:#EEF1F8; --card:#fff; --bg:#EDF0F7; --soft:#F5F7FC;
  --ok:#0E9E6E; --ok-bg:#E7F7EF; --ok-bd:#B6E7CE;
  --red:#D6433F; --red-bg:#FBE7E7; --amber:#C67C0A; --amber-bg:#FBF1DC;
  --gold:#C9A227;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR','Inter',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.01em;font-size:16px;line-height:1.65}
h1,h2,.syne{font-family:'Inter','Noto Sans KR',sans-serif}
@keyframes spin{to{transform:rotate(360deg)}}
@media print{
  body{background:#fff}
  .top-bar,.bottom-actionbar{display:none!important}
  .sec,.cover,.hero-bal,.rpt-footer{break-inside:avoid;box-shadow:none!important}
  tr,.ben-item,.tl-item{break-inside:avoid}
  @page{margin:11mm;size:A4}
}
.top-bar{background:rgba(255,255,255,.9);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 16px;position:sticky;top:0;z-index:100}
.top-brand{display:flex;align-items:center;gap:9px;font-size:13.5px;font-weight:700;color:var(--navy)}
.top-logo{width:28px;height:28px;background:linear-gradient(160deg,var(--indigo),var(--navy));border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff}
.lang-wrap{display:flex;gap:6px}
.lang-btn{padding:7px 15px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink-3);transition:all .15s}
.lang-btn.on{background:var(--navy);color:#fff;border-color:var(--navy)}

.page{max-width:760px;margin:0 auto;padding:16px 16px 96px}

/* 커버 */
.cover{background:radial-gradient(120% 120% at 88% -10%,#26407A 0%,var(--navy) 55%);border-radius:22px;overflow:hidden;margin:16px auto 14px;position:relative;box-shadow:0 22px 54px -24px rgba(15,28,63,.55)}
.cover::before{content:'';position:absolute;top:-70px;right:-55px;width:250px;height:250px;border-radius:50%;border:46px solid rgba(112,145,230,.12)}
.cv-top{padding:30px 28px 26px;position:relative;z-index:1}
.cv-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}
.cv-logo{width:44px;height:44px;background:linear-gradient(160deg,var(--violet),var(--indigo));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;box-shadow:0 6px 16px -6px rgba(112,145,230,.7)}
.cv-brand-name{font-size:13px;color:rgba(255,255,255,.8);line-height:1.5;font-weight:700}
.cv-brand-name span{color:rgba(255,255,255,.42);font-weight:500;font-size:10px}
.cv-tag{font-size:11px;color:var(--violet);letter-spacing:.2em;text-transform:uppercase;font-weight:700;margin-bottom:12px;display:block}
.cv-h1{font-size:31px;font-weight:800;color:#fff;line-height:1.2;letter-spacing:-.02em}
.cv-div{display:flex;align-items:center;gap:10px;margin:18px 0 16px}
.cv-dot{width:7px;height:7px;border-radius:50%;background:var(--violet)}
.cv-line{flex:1;height:1px;background:linear-gradient(90deg,rgba(112,145,230,.5),rgba(112,145,230,0))}
.cv-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.cv-cell{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:13px;padding:12px 15px}
.cv-cell-wide{grid-column:span 2}
.cv-lbl{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px;font-weight:600}
.cv-val{font-size:15px;font-weight:700;color:#fff}
.cv-foot{background:rgba(0,0,0,.22);padding:14px 28px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid rgba(255,255,255,.06);position:relative;z-index:1}
.cv-foot-l{font-size:12px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.06em}
.cv-foot-r{font-size:10px;color:rgba(255,255,255,.35);letter-spacing:.14em;font-weight:600}

/* 잔액 HERO */
.hero-bal{border-radius:22px;overflow:hidden;margin-bottom:14px;background:linear-gradient(150deg,var(--indigo),var(--navy));color:#fff;box-shadow:0 18px 40px -22px rgba(15,28,63,.6);position:relative}
.hero-bal::after{content:'';position:absolute;bottom:-40px;right:-30px;width:180px;height:180px;border-radius:50%;background:rgba(112,145,230,.14)}
.hb-top{padding:24px 24px 20px;position:relative;z-index:1}
.hb-eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);margin-bottom:8px}
.hb-val{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1}
.hb-val small{font-size:20px;font-weight:700;color:rgba(255,255,255,.6);margin-right:4px}
.hb-bar-wrap{margin-top:18px}
.hb-bar{height:14px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14)}
.hb-bar-fill{height:100%;background:linear-gradient(90deg,#37E0C4,#7DB0FF);border-radius:8px;box-shadow:0 0 12px rgba(125,176,255,.65);min-width:10px;transition:width .4s}
.hb-bar-cap{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(255,255,255,.72);margin-top:8px;font-weight:600}
.hb-stats{display:grid;grid-template-columns:repeat(4,1fr);background:rgba(0,0,0,.16);position:relative;z-index:1}
.hb-stat{padding:14px 6px;text-align:center;border-right:1px solid rgba(255,255,255,.07)}
.hb-stat:last-child{border-right:none}
.hb-stat-lbl{font-size:10.5px;color:rgba(255,255,255,.55);margin-bottom:5px;font-weight:600}
.hb-stat-val{font-size:14px;font-weight:700}
.hb-neg{color:#FFB4B0}.hb-pos{color:#9EE9C6}.hb-acc{color:#A9C0FF}

/* 공통 카드 */
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,28,60,.03),0 12px 28px -22px rgba(16,28,60,.22)}
.sec-hdr{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.sec-num{width:30px;height:30px;border-radius:9px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--violet);flex-shrink:0}
.sec-title{font-size:16px;font-weight:700;color:var(--ink);flex:1;letter-spacing:-.01em}
.sec-body{padding:16px 18px}

.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{background:var(--soft);border:1px solid var(--line-2);border-radius:11px;padding:12px 14px}
.info-lbl{font-size:10.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px;font-weight:600}
.info-val{font-size:15px;font-weight:700;color:var(--ink)}

/* 패키지 */
.pkg-banner{background:linear-gradient(135deg,var(--indigo),var(--navy));border-radius:14px;padding:16px 18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.pkg-lbl{font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:.08em;text-transform:uppercase;font-weight:600;margin-bottom:5px}
.pkg-name{font-size:19px;font-weight:800;color:#fff}
.pkg-crown{font-size:26px}
.amt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px}
.amt-c{border-radius:12px;padding:13px 12px;text-align:center;border:1px solid var(--line)}
.amt-c.paid{background:var(--soft)}
.amt-c.bonus{background:var(--ok-bg);border-color:var(--ok-bd)}
.amt-c.spec{background:#F3EFFB;border-color:#DBCEF2}
.amt-lbl{font-size:10.5px;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.amt-val{font-size:16px;font-weight:800;color:var(--ink);font-family:'Inter',sans-serif}
.total-chip{display:flex;align-items:center;justify-content:space-between;background:var(--navy);border-radius:12px;padding:14px 18px}
.total-chip-lbl{font-size:12px;color:rgba(255,255,255,.6);font-weight:600}
.total-chip-val{font-size:20px;font-weight:800;color:#fff;font-family:'Inter',sans-serif}

.svc-box{background:var(--soft);border-left:4px solid var(--indigo);border-radius:0 12px 12px 0;padding:14px 16px;font-size:13.5px;color:var(--ink-2);line-height:1.8}
.clause{font-size:13.5px;color:var(--ink-2);line-height:1.85}
.terms-box{background:#FFFBEB;border:1px solid #F3E4B8;border-radius:12px;padding:14px 16px;font-size:13.5px;color:#6B4E12;line-height:1.75;white-space:pre-wrap}

/* 혜택 */
.ben-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.ben-item:last-child{border-bottom:none}
.ben-chk{width:26px;height:26px;border-radius:8px;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;font-weight:800}
.ben-title{font-size:14px;font-weight:700;color:var(--ink);line-height:1.4}
.ben-desc{font-size:12.5px;color:var(--ink-3);line-height:1.6;margin-top:3px}

/* 이용내역 타임라인 */
.tl-hdr{display:grid;grid-template-columns:84px 1fr 96px 100px;gap:8px;padding:11px 16px;background:var(--soft);border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}
.tl-hdr .r{text-align:right}
.tl-item{display:grid;grid-template-columns:84px 1fr 96px 100px;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line-2);align-items:center}
.tl-item:last-child{border-bottom:none}
.tl-date{font-size:12px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.tl-desc{font-size:13.5px;color:var(--ink);line-height:1.45}
.tl-desc-en{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.tl-amt{font-size:14px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-family:'Inter',sans-serif}
.tl-amt.use{color:var(--red)}
.tl-bal{font-size:13px;font-weight:700;text-align:right;color:var(--navy);font-variant-numeric:tabular-nums;font-family:'Inter',sans-serif}
.tl-empty{padding:34px 18px;text-align:center;color:var(--ink-3);font-size:14px}
.tl-mobile-only{display:none}

/* 안내 박스 */
.note-box{background:var(--lav-lt);border-radius:12px;padding:14px 16px;font-size:12.5px;color:var(--indigo);line-height:1.7;display:flex;gap:10px}
.note-box b{color:var(--navy)}

.rpt-footer{background:var(--navy);border-radius:18px;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.footer-co{font-size:11.5px;color:rgba(255,255,255,.62);line-height:1.75}
.stamp{text-align:center;padding:16px;color:var(--ink-3);font-size:12px;line-height:1.7}

.bottom-actionbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:11px 14px calc(11px + env(safe-area-inset-bottom));display:flex;gap:9px;z-index:200;box-shadow:0 -4px 16px rgba(15,28,63,.08);max-width:760px;margin:0 auto}
.bottom-actionbar button{flex:1;padding:13px;border-radius:12px;border:none;font-size:14.5px;font-weight:700;cursor:pointer}
.ba-print{background:var(--soft);color:var(--navy)}
.ba-pdf{background:var(--navy);color:#fff}

@media(max-width:560px){
  .hb-stats{grid-template-columns:repeat(2,1fr)}
  .hb-stat:nth-child(2){border-right:none}
  .amt-grid{grid-template-columns:1fr}
  .tl-hdr{display:none}
  .tl-item{grid-template-columns:1fr auto;grid-template-areas:"date amt" "desc bal";row-gap:4px}
  .tl-date{grid-area:date}.tl-amt{grid-area:amt}.tl-desc{grid-area:desc}
  .tl-bal{grid-area:bal;font-size:11.5px}.tl-bal::before{content:'잔액 ';color:var(--ink-3);font-weight:500}
}
</style>
</head>
<body>

<div class="top-bar">
  <div class="top-brand"><div class="top-logo">HHC</div><span id="brand-name">Happy Home Care</span></div>
  <div class="lang-wrap">
    <button class="lang-btn on" id="lang-ko" onclick="setLang('ko')">한국어</button>
    <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="page" id="page"></div>

<div class="bottom-actionbar">
  <button class="ba-print" onclick="window.print()" id="btn-print">🖨️ <span id="lbl-print">인쇄</span></button>
  <button class="ba-pdf" onclick="window.print()" id="btn-pdf">⬇️ <span id="lbl-pdf">PDF 저장</span></button>
</div>

  {key:"repair20",ko:"수리 인건비 20% 할인",en:"20% Off Repair Labor",dko:"에어컨 수리·설치 인건비 20% 할인",den:"20% off labor for AC repair & install"},

];

  "에어컨 및 전 품목 세척서비스 (당사 취급하는), 설치 & 수리 서비스 (인건비; 기계·부품·자재비 별도)\nAir-conditioning & all cleaning services, installation & repair services (labour only; machinery, parts & materials charged separately)",
  "에어컨 세척서비스 (당사 취급하는), 설치 & 수리 서비스 (인건비; 기계·부품·자재비 별도)\nAir-conditioning cleaning only, installation & repair services (labour only; machinery, parts & materials charged separately)"
];

var fmt=function(n){return parseFloat(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});};
var currentLang='ko';
var currentMode='all';
var reportData=null;

var TXT={

function computeBalance(c){
  var paid=parseFloat(c.amount_paid)||0, bonus=parseFloat(c.bonus_credit)||0, spec=parseFloat(c.special_bonus_credit)||0;
  var total=paid+bonus+spec;
  var h=typeof c.usage_history==='string'?JSON.parse(c.usage_history||'[]'):(c.usage_history||[]);
  var used=h.reduce(function(s,u){return s+(parseFloat(u.amount)||0);},0);
  var disc=h.reduce(function(s,u){return s+(parseFloat(u.discount)||0);},0);
  var carry=h.reduce(function(s,u){return s+(parseFloat(u.carryover)||0);},0);
  var remain=total-used+disc+carry;
  return {paid:paid,bonus:bonus,spec:spec,total:total,used:used,disc:disc,carry:carry,remain:remain,history:h};
}

function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];});}
