<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Happy Home Care · 계약서 / 이용내역</title>
<script>
/* ── 예전 주소 연결용 (2026-11-09) ─────────────────────────────────
   이 파일은 화면이 아니라 「길 안내」입니다.
   예전에 고객에게 보낸 계약서 링크(/customer?id=…&mode=…&lang=…)를
   새 고객용 계약서 화면 admin.html?view=… 으로 그대로 넘겨 줍니다.
   (id → view 로 이름만 바뀌고 mode · lang 은 그대로 전달)
   ※ 계약서 화면·문구는 admin.html 하나만 관리하시면 됩니다.
   ────────────────────────────────────────────────────────────── */
(function(){
  var p=new URLSearchParams(location.search), id=p.get('id');
  window.__HHC_GO=id
    ? 'admin.html?view='+encodeURIComponent(id)+'&mode='+encodeURIComponent(p.get('mode')||'all')+'&lang='+((p.get('lang')==='en')?'en':'ko')
    : 'home';
  location.replace(window.__HHC_GO);
})();
</script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  font-family:'Pretendard','Apple SD Gothic Neo',-apple-system,system-ui,sans-serif;
  background:#F6F8FC;color:#5A6478;text-align:center;padding:24px}
.b{background:#fff;border:1px solid #E4E9F2;border-radius:16px;padding:26px 28px;
  box-shadow:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.16)}
.t{font-size:15px;font-weight:800;color:#14192A;margin-bottom:6px}
.s{font-size:13px;line-height:1.7}
a{display:inline-block;margin-top:14px;background:#0E2350;color:#fff;text-decoration:none;
  font-size:13.5px;font-weight:800;border-radius:12px;padding:11px 20px}
</style>
</head>
<body>
<div class="b">
  <div class="t">계약서를 여는 중입니다…</div>
  <div class="s">잠시만 기다려 주세요.<br>Opening your contract…</div>
  <a href="home" id="go">계속하기 / Continue →</a>
</div>
<script>
try{document.getElementById('go').href=window.__HHC_GO||'home';}catch(e){}
</script>
</body>
</html>
