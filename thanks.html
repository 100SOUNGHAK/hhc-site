  --gold-700:#8f6f28;--gold-600:#b08d3a;--gold-500:#c9a44c;--gold-300:#e3c98a;--gold-50:#fbf5e6;

  --line:#e8e2d4;--paper:#fdfcf9;--cream:#f6f2e9;

  --ease:cubic-bezier(.22,.61,.36,1);
  --e1:0 1px 2px rgba(11,24,51,.09),0 5px 12px -3px rgba(11,24,51,.14);

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:#e9ebf0;color:var(--ink-900);line-height:1.6;font-size:16px;letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.tk{max-width:560px;margin:0 auto;background:var(--cream);min-height:100vh;box-shadow:0 0 60px rgba(8,23,43,.1);
  padding-bottom:calc(92px + env(safe-area-inset-bottom));overflow:hidden}
.num{font-variant-numeric:tabular-nums}
/* 히어로 */
.tk-hero{position:relative;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 20px 28px;border-radius:0 0 32px 32px;
  background:radial-gradient(120% 70% at 50% 0%,#1d4573 0%,var(--navy-900) 55%,var(--navy-950) 100%)}
.tk-top{display:flex;align-items:center;gap:10px}
.tk-logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(227,201,138,.35)}
.tk-logo svg{width:22px;height:22px}
.tk-brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.tk-brand small{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--gold-300)}
.tk-lang{margin-left:auto;display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.tk-lang button{min-width:44px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;color:rgba(255,255,255,.7)}
.tk-lang button.on{background:#fff;color:var(--navy-900)}
.tk-kick{margin-top:24px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--gold-300)}
.tk-h1{margin-top:8px;text-align:center;font-family:var(--sf);font-weight:700;font-size:26px;line-height:1.4;letter-spacing:-.04em;text-wrap:balance}
.tk-h1 em{font-style:normal;color:var(--gold-300)}
.tk-sub{margin:10px auto 0;max-width:340px;text-align:center;font-size:15px;color:rgba(255,255,255,.74)}
/* 청구 카드 (남색 판 위 유리 카드) */
.tk-bill{margin:22px auto 0;max-width:360px;padding:18px 20px;border-radius:20px;
  background:linear-gradient(158deg,rgba(255,255,255,.155),rgba(255,255,255,.05) 52%,rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.16);

.tk-bill .r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tk-bill .lb{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:rgba(255,255,255,.66)}
.tk-bill .am{margin-top:2px;font-family:var(--cg);font-feature-settings:'lnum';font-size:40px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.tk-bill .am small{font-size:22px;margin-right:4px;color:var(--gold-300)}
.tk-bill .ln{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);font-size:14px;color:rgba(255,255,255,.82)}
.tk-bill .ln b{color:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:850;white-space:nowrap}
.pill.due{background:rgba(240,180,41,.18);color:#ffd77a;border:1px solid rgba(240,180,41,.45)}
.pill.od{background:rgba(220,38,38,.2);color:#ffb4b4;border:1px solid rgba(248,113,113,.5)}
.pill.ok{background:rgba(14,155,99,.2);color:#8ff0c4;border:1px solid rgba(52,211,153,.45)}
@media (prefers-reduced-motion:no-preference){.tk-bill{animation:tkIn .7s var(--ease) both}}
@keyframes tkIn{from{opacity:0;transform:translateY(18px)}}
/* 본문 */
.tk-sec{padding:28px 16px 0}
.tk-sh{padding:0 4px 12px}
.tk-sh h2{font-size:21px;font-weight:850;letter-spacing:-.035em;line-height:1.35}
.tk-sh p{margin-top:2px;font-size:14px;color:var(--ink-400)}
.tk-box{background:var(--paper);border-radius:24px;padding:20px;box-shadow:var(--e2)}
/* 문서 바로 보기 */
.tk-docs{background:var(--paper);border-radius:24px;padding:8px;box-shadow:var(--e2)}
.tk-doc{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;padding:12px;border-radius:17px;transition:background .15s var(--ease),transform .14s var(--ease)}
.tk-doc+.tk-doc{margin-top:2px}
.tk-doc:active{transform:scale(.98);background:var(--gold-50)}
@media (hover:hover){.tk-doc:hover{background:#f7f3ea}}
.tk-doc .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:22px;background:var(--gold-50);box-shadow:inset 0 0 0 1px rgba(201,164,76,.25)}
.tk-doc.my .ic{background:linear-gradient(145deg,var(--navy-800),var(--navy-950));box-shadow:none}
.tk-doc b{display:block;font-size:16px;font-weight:850;letter-spacing:-.025em;line-height:1.35}
.tk-doc small{display:block;font-size:13.5px;color:var(--ink-400);font-weight:600;line-height:1.4}
.tk-doc .go{font-size:13px;font-weight:850;color:var(--navy-900);padding:7px 12px;border-radius:999px;background:#eef0f5;white-space:nowrap}
.tk-doc.inv .go{background:linear-gradient(145deg,#f4e5b4,var(--gold-500));color:var(--navy-950)}
/* 청구 내용 */
.tk-it{list-style:none;margin-bottom:14px}
.tk-it li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.tk-it li:first-child{border-top:0;padding-top:0}
.tk-it li span{color:var(--ink-700);overflow-wrap:anywhere}
.tk-it li em{font-style:normal;color:var(--ink-400);font-weight:700;margin-left:4px;white-space:nowrap}
.tk-it li b{white-space:nowrap;font-weight:750;color:var(--ink-600)}
.tk-it .more{color:var(--ink-400);font-size:13.5px}
.tk-kv{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:15px;padding-top:14px;border-top:1.5px solid var(--navy-900)}
.tk-kv span{color:var(--ink-400);font-weight:700}
.tk-kv b{text-align:right;font-weight:800;overflow-wrap:anywhere}
.tk-kv .m{color:var(--teal-700)}
.tk-kv .big{font-size:22px;color:var(--navy-900);letter-spacing:-.02em}
.tk-kv .big.ok{color:var(--ok)}
.tk-kv .lbb{color:var(--ink-900);font-weight:850;align-self:center}
.tk-kv hr{grid-column:1/-1;border:0;border-top:1px dashed var(--line);margin:2px 0}
.tk-pay{margin-top:18px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:15px;font-size:16px;font-weight:850;
  color:#fff;background:linear-gradient(145deg,var(--navy-800),var(--navy-950));box-shadow:0 10px 20px -10px rgba(8,23,43,.75);transition:transform .14s var(--ease)}
.tk-pay:active{transform:scale(.97)}
.tk-note{margin-top:12px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--gold-50);font-size:14px;line-height:1.55;color:var(--ink-700)}
.tk-note.ok{background:#e9f7f0}
/* 감사 편지 */
.tk-letter{background:linear-gradient(160deg,#fff,var(--gold-50));border:1.5px solid var(--gold-300)}
.tk-letter p{font-family:var(--sf);font-size:16px;line-height:1.85;color:var(--ink-700)}
.tk-letter .sg{margin-top:14px;text-align:right;font-size:14px;color:var(--ink-600)}
.tk-letter .sg b{display:block;font-family:var(--sf);font-size:17px;color:var(--navy-900)}
.tk-ft{padding:22px 20px 8px;text-align:center;font-size:12px;color:var(--ink-400)}

.tk-msg{padding:110px 28px 40px;text-align:center}
.tk-msg .ic{width:76px;height:76px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--paper);box-shadow:var(--e1)}
.tk-msg h3{margin-top:18px;font-size:20px;font-weight:850}
.tk-msg p{margin-top:8px;font-size:15px;color:var(--ink-600)}
.tk-spin{width:34px;height:34px;margin:0 auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--navy-900);animation:tkRot .9s linear infinite}
@keyframes tkRot{to{transform:rotate(360deg)}}
/* 하단 */
.tk-dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(246,242,233,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid #e6dfcf}
.tk-dock .in{max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px}
.tk-dock a{display:flex;align-items:center;justify-content:center;gap:5px;min-height:52px;border-radius:14px;font-size:15px;font-weight:850;letter-spacing:-.02em;transition:transform .14s var(--ease);white-space:nowrap}
.tk-dock a:active{transform:scale(.97)}
.tk-dock [hidden]{display:none!important}
.tk-dock .iv{color:var(--navy-950);background:linear-gradient(145deg,#f4e5b4,var(--gold-500));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 18px -8px rgba(201,164,76,.7)}
.tk-dock .rp{color:var(--navy-900);background:#fff;border:1.5px solid var(--gold-300)}
.tk-dock .mp{color:#fff;background:linear-gradient(145deg,var(--navy-800),var(--navy-950));box-shadow:0 8px 18px -8px rgba(8,23,43,.7)}
.tk-dock .qa{color:var(--ink-700);background:#ece7da}
@media (max-width:370px){.tk-h1{font-size:22.5px}.tk-bill .am{font-size:34px}.tk-dock a{font-size:13.5px}.tk-doc{gap:11px}.tk-doc .go{padding:6px 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.tk-dock,.tk-lang,.tk-pay{display:none}.tk{box-shadow:none;padding-bottom:0}.tk-box,.tk-docs{break-inside:avoid}}

     loading:'안내 내용을 불러오는 중입니다…',errH:'안내장을 열 수 없습니다',errP:'링크가 잘못되었거나 인보이스를 찾지 못했습니다. 왓츠앱으로 알려 주시면 다시 보내 드립니다.',errWa:'💬 왓츠앱으로 문의',
     ft:'HAPPY WORKS SERVICES SDN. BHD. (1278908-M) · 해피홈케어'},
   en:{title:'Thank you for your service',brand:'THANK YOU',kick:'THANK YOU · SERVICE COMPLETED',

     sub:'Your bill, invoice and work report — all in one place.',

     paidLn:function(d){return d?'Payment confirmed on <b>'+d+'</b> · thank you':'Payment confirmed · thank you';},

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function n(v){return parseFloat(v)||0;}
  function rm(v){return 'RM '+(Number(v)||0).toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function L(){return T[S.lang];}
  function en(){return S.lang==='en';}
  function ymd(d){var m=String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return m?new Date(+m[1],m[2]-1,+m[3]):null;}
  function fmtD(d){var x=ymd(d);if(!x)return esc(d||'');
    return en()?x.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):x.getFullYear()+'년 '+(x.getMonth()+1)+'월 '+x.getDate()+'일';}
  function myToday(){var t=new Date(Date.now()+8*3600e3);return new Date(t.getUTCFullYear(),t.getUTCMonth(),t.getUTCDate());}   // 말레이시아 날짜
  function daysTo(d){var x=ymd(d);return x?Math.round((x-myToday())/864e5):null;}
  function invUrl(){return '/hhc-invoice.html?view='+encodeURIComponent((S.inv&&(S.inv.id||S.inv.__id))||ID||'demo')+'&lang='+S.lang;}

  /* 품목 이름 — 항목설정(services)의 한글/영문 이름 → 저장된 이름 (앞의 관리 코드는 뺌) */
  function strip(v){v=String(v==null?'':v);var o=v.replace(/^\s*HHC[A-Z]{0,4}\d{2,6}(?:[.\-]\d+)*\s*[-:|·]?\s*/,'').trim();return o||v;}
  function itName(li){
    var raw=String(li.name||'—'),sv=null;
    for(var i=0;i<S.svc.length;i++){if(S.svc[i].id&&li.svcId&&S.svc[i].id===li.svcId){sv=S.svc[i];break;}}
    if(!en())return strip((sv&&sv.name_ko)||raw.split(' · ')[0]);
    var e=(sv&&sv.name_en)||(raw.indexOf(' · ')>0?raw.split(' · ').slice(1).join(' · '):'')||li.name_en||'';
    if(!e&&!/[가-힣]/.test(raw))e=raw;
    if(!e||/[가-힣]/.test(e)){var c='';for(var j=0;j<CAT.length;j++){if(CAT[j][0].test(raw)){c=CAT[j][1];break;}}e=c?c+' service':'Service';}
    e=strip(e);
    var km=raw.match(/^\s*(?:HHC\S*\s+)?\[([^\]]{1,40})\]/);   // 한글 이름의 [꼬리표] → 영어로 붙임
    if(km&&!/^\s*\[/.test(e)){var tg=TAG[km[1].trim()]||'';if(!tg){for(var k=0;k<CAT.length;k++){if(CAT[k][0].test(km[1])){tg=CAT[k][1];break;}}}if(tg)e='['+tg+'] '+e;}
    return e;
  }
  var TAG={'벽걸이형 에어컨':'Wall-Mounted AC','카세트형 에어컨':'Cassette AC','실외기 에어컨':'Outdoor Unit','매립형 에어컨':'Ducted AC','매립 덕트형 에어컨':'Ducted AC','천정형 에어컨':'Ceiling AC','스탠드형 에어컨':'Floor-Standing AC'};
  /* 금액 — 인보이스 화면이 저장한 합계(_t) 우선 */
  function money(v){
    var t=v._t||{},items=v.items||[];
    var grand=t.grand!=null?n(t.grand):(v.total!=null?n(v.total):items.reduce(function(a,li){return a+n(li.price)*(n(li.qty)||1);},0));
    var paid=v.paidAmount!=null?n(v.paidAmount):(v.payments||[]).reduce(function(a,p){return a+n(p&&p.amt);},0);
    var credit=n(t.credit!=null?t.credit:v.creditUse),voucher=n(t.voucher!=null?t.voucher:v.voucherAmt),pts=n(t.pts!=null?t.pts:v.pointUse);
    var disc=Math.max(0,n(t.discTotal)-n(t.itemDisc));
    var due=Math.max(0,Math.round((grand-paid)*100)/100);
    var st=String(v.status||'billing');
    var isPaid=st==='paid'||(grand>0.005?due<=0.005:true);
    var byCredit=credit>0.005&&grand<=0.005;
    var dd=daysTo(v.due);
    var key=byCredit?'cr':(isPaid?'ok':(paid>0.005?'pt':(dd!==null&&dd<0?'od':(st==='overdue'?'od':'due'))));
    var gross=grand+disc+credit+voucher+pts;
    var pays=v.payments||[];var pdate=v.paidDate||(pays.length?(pays[pays.length-1].date||''):'');
    return {grand:grand,paid:paid,due:due,credit:credit,voucher:voucher,pts:pts,disc:disc,gross:gross,key:key,dd:dd,pdate:pdate};
  }
  var LOGO='<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="#e3c98a"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M8 50 L50 22 L92 50 L84 58 L50 36 L16 58Z"/></g></svg>';
  function top(){return '<div class="tk-top"><div class="tk-logo">'+LOGO+'</div><div class="tk-brand"><b>Happy Home Care</b><small>'+L().brand+'</small></div>'+
    '<div class="tk-lang" role="group" aria-label="Language"><button type="button" data-l="ko" class="'+(en()?'':'on')+'">한국어</button><button type="button" data-l="en" class="'+(en()?'on':'')+'">EN</button></div></div>';}
  function dockSet(btns){
    var d=document.getElementById('dock'),i=document.getElementById('dockIn');
    i.innerHTML=btns.map(function(b){return '<a class="'+b[0]+'" href="'+b[2]+'"'+(b[3]?' target="_blank" rel="noopener"':'')+'>'+b[1]+'</a>';}).join('');
    i.style.setProperty('--n',btns.length);d.hidden=!btns.length;
  }
  function render(){
    var l=L(),v=S.inv;
    document.documentElement.lang=S.lang;document.title=l.title+' | Happy Home Care';
    if(!v){
      document.getElementById('app').innerHTML='<header class="tk-hero" style="padding-bottom:18px">'+top()+'</header>'+
        (S.err?'<div class="tk-msg"><div class="ic">🔗</div><h3>'+l.errH+'</h3><p>'+l.errP+'</p></div>':'<div class="tk-msg"><div class="tk-spin"></div><p>'+l.loading+'</p></div>');
      dockSet(S.err?[['qa',l.errWa,'https://wa.me/'+TEL,1]]:[]);
      return;
    }
    var M=money(v),cu=v.customer||{},nm=cu.name||(en()?'Customer':'고객');
    var stTxt={due:l.stDue,od:l.stOd,ok:l.stOk,cr:l.stCr,pt:l.stPt}[M.key],stCls={due:'due',od:'od',ok:'ok',cr:'ok',pt:'due'}[M.key];
    var settled=(M.key==='ok'||M.key==='cr');
    var heroAmt=M.key==='cr'?M.credit:(M.key==='ok'?M.grand:M.due);
    var heroLb=M.key==='cr'?l.crLb:(M.key==='ok'?l.paidLb:l.toPay);
    var heroLn=M.key==='cr'?l.crLn:(M.key==='ok'?l.paidLn(M.pdate?fmtD(M.pdate):''):(M.dd!==null?l.dueLn(fmtD(v.due),M.dd):''));
    var amtTxt=rm(heroAmt).replace(/^RM\s/,'');
    /* 보고서 */
    var reps=S.rp;
    var docs='<a class="tk-doc inv" href="'+invUrl()+'"><div class="ic">🧾</div><div><b>'+l.dInv+'</b><small class="num">'+esc(v.id||'')+(v.id?' · ':'')+'<span style="white-space:nowrap">'+rm(M.grand)+'</span></small></div><span class="go">'+l.open+'</span></a>'+
      reps.map(function(r){var ty=RTY[r.type]||RTY.inspect;
        return '<a class="tk-doc" href="'+repUrl(r)+'"><div class="ic">'+ty[0]+'</div><div><b>'+esc(en()?ty[2]:ty[1])+'</b><small class="num">'+(r.date?fmtD(r.date):l.dRep)+'</small></div><span class="go">'+l.open+'</span></a>';}).join('')+
      (CID?'<a class="tk-doc my" href="'+myUrl()+'"><div class="ic">🏠</div><div><b>'+l.dMy+'</b><small>'+l.dMyS+'</small></div><span class="go">'+l.open+'</span></a>':'');
    /* 품목 */
    var items=(v.items||[]).filter(function(li){return li&&(li.name||n(li.price));}),shown=items.slice(0,6);
    var itHtml=items.length?'<ul class="tk-it">'+shown.map(function(li){var qn=n(li.qty)||1;
        return '<li><span>'+esc(itName(li))+(qn!==1?'<em>× '+qn+'</em>':'')+'</span><b class="num">'+rm(n(li.price)*qn)+'</b></li>';}).join('')+
      (items.length>6?'<li class="more">'+l.more(items.length-6)+'</li>':'')+'</ul>':'';
    var kv='';
    var hasDed=M.disc>0.005||M.credit>0.005||M.voucher>0.005||M.pts>0.005||(M.paid>0.005&&!settled);
    if(hasDed){
      kv+='<span>'+l.kSvc+'</span><b class="num">'+rm(M.gross)+'</b>';
      if(M.disc>0.005)kv+='<span>'+l.kDisc+'</span><b class="num m">− '+rm(M.disc)+'</b>';
      if(M.credit>0.005)kv+='<span>'+l.kCr+'</span><b class="num m">− '+rm(M.credit)+'</b>';
      if(M.voucher>0.005)kv+='<span>'+l.kVc+'</span><b class="num m">− '+rm(M.voucher)+'</b>';
      if(M.pts>0.005)kv+='<span>'+l.kPts+'</span><b class="num m">− '+rm(M.pts)+'</b>';
      if(M.paid>0.005&&!settled)kv+='<span>'+l.kPaid+'</span><b class="num m">− '+rm(M.paid)+'</b>';
      kv+='<hr>';
    }
    kv+='<span class="lbb">'+(settled?l.kNetOk:l.kNet)+'</span><b class="num big'+(settled?' ok':'')+'">'+rm(settled?M.grand:M.due)+'</b>';
    if(!settled&&v.due)kv+='<span>'+l.kDue+'</span><b class="num">'+fmtD(v.due)+'</b>';
    var payBtn=(!settled&&M.due>0.005)?'<a class="tk-pay" href="/pay?amt='+M.due+(en()?'&lang=en':'')+'">'+l.pay+'</a><div class="tk-note"><span>🧾</span><span>'+l.payNote+'</span></div>'
      :'<div class="tk-note ok"><span>✅</span><span>'+l.okNote+'</span></div>';
    document.getElementById('app').innerHTML=
     '<header class="tk-hero">'+top()+
       '<div class="tk-kick">'+l.kick+'</div><h1 class="tk-h1">'+l.h1(nm)+'</h1><p class="tk-sub">'+l.sub+'</p>'+
       '<div class="tk-bill"><div class="r1"><span class="lb">'+heroLb+'</span><span class="pill '+stCls+'">'+(settled?'✓ ':'')+stTxt+'</span></div>'+
         '<div class="am num"><small>RM</small>'+amtTxt+'</div>'+(heroLn?'<div class="ln">'+heroLn+'</div>':'')+'</div>'+
     '</header>'+
     '<section class="tk-sec"><div class="tk-sh"><h2>'+l.docH+'</h2><p>'+l.docP+'</p></div><div class="tk-docs">'+docs+'</div></section>'+
     '<section class="tk-sec"><div class="tk-sh"><h2>'+l.bH+'</h2>'+(v.date?'<p>'+l.bP(fmtD(v.date))+'</p>':'')+'</div><div class="tk-box">'+itHtml+
       '<div class="tk-kv"'+(itHtml?'':' style="border-top:0;padding-top:0"')+'>'+kv+'</div>'+payBtn+'</div></section>'+
     '<section class="tk-sec"><div class="tk-box tk-letter"><p>'+l.lt(reps.length>0)+'</p><div class="sg">'+l.sg1+'<b>'+l.sg2+'</b></div></div></section>'+
     '<footer class="tk-ft">'+l.ft+'</footer>';
    var b=[['iv',l.bInv,invUrl()]];
    if(reps.length)b.push(['rp',l.bRep,repUrl(reps[0])]);
    if(CID)b.push(['mp',l.bMy,myUrl()]);
    if(b.length<3)b.push(['qa',l.bQ,'https://wa.me/'+TEL+'?text='+encodeURIComponent(l.wa(v)),1]);
    dockSet(b);
  }
  document.addEventListener('click',function(e){var b=e.target.closest('button[data-l]');if(b){S.lang=b.dataset.l;render();}});
  render();
  if(DEMO){
    if(!CID&&q.get('nc')!=='1')CID='demo1234';
    var paid=q.get('paid')==='1';
    S.inv={id:'HHC2026112501',date:'2026-11-25',due:'2026-12-02',status:paid?'paid':'billing',paidDate:paid?'2026-11-25':'',
      customer:{name:'Kim Minsu',addr:'Desa ParkCity · The Westside One A-12-3'},
      items:[{name:'[벽걸이형 에어컨] 반분해 세척 · SEMI-DISMANTLE CLEANING',qty:3,price:180},{name:'[실외기 에어컨] 실외기 세척 · OUTDOOR UNIT CLEANING',qty:1,price:120},{name:'주차비 · Parking',qty:1,price:10}],
      _t:{grand:paid?670:670,discTotal:0,itemDisc:0,credit:0,voucher:0,pts:0},paidAmount:paid?670:0,payments:paid?[{amt:670,date:'2026-11-25'}]:[]};
    S.rp=q.get('nr')==='1'?[]:[{type:'inspect',_id:'demoRep1',date:'2026-11-25'}];
    render();return;
  }
  if(!ID||ID.length>200){S.err='bad';render();return;}
  var tries=0;
  (function load(){
    fetch('/api/doc?t=invoice&id='+encodeURIComponent(ID),{cache:'no-store'})
      .then(function(r){if(r.status>=500)throw new Error('5xx');return r.json();})
      .then(function(j){if(!j||!j.ok||!j.doc)throw new Error('nf');
        S.inv=j.doc;S.svc=j.services||[];
        var api=(j.insp||[]).map(function(x){return {type:x.type||'inspect',_id:x._id,date:x.date||''};});
        if(q.get('r')==='-')S.rp=[];   // 연결 보고서가 아직 확정 전 — 보고서 칸 없이
        else if(RQ.length){S.rp=RQ.map(function(r){var a=api.filter(function(x){return x._id===r._id;})[0];return a||r;});}
        else S.rp=api;
        S.rp.sort(function(a,z){return String(z.date||'').localeCompare(String(a.date||''));});
        render();})
      .catch(function(e){if(e.message==='5xx'&&tries++<2){setTimeout(load,800);return;}S.err='load';render();});
  })();
})();
