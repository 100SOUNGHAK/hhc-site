<title>작업 완료 감사 안내 | Happy Home Care</title>

<!-- ══════════════════════════════════════════════════════════════
     🙏 작업 완료 감사 · 청구 안내장 (/thanks) — 2026-11-25
       · 작업이 끝난 뒤 고객에게 보내는 안내장 — 감사 인사 · 청구 내용 · 인보이스/보고서 바로 보기 · MY PAGE
       · 주소: /thanks?i=인보이스 문서ID&c=고객 번호[&r=종류:보고서ID,…][&lang=en]   (미리보기: ?demo=1 · &paid=1 · &nr=1)
         - i= : GET /api/doc?t=invoice&id= (인보이스 화면과 같은 창구) — 새 서버 코드 없음
         - r= : 관리자 발송 창이 「확정된」 연결 보고서만 골라 붙임. 없으면 인보이스에 연결된 보고서(insp) 전부
         - c= : 있으면 「🏠 MY PAGE」 버튼 (/my.html?c= · 영문 /my-en.html?c=)
       · 화면: 감사 인사 + 결제하실 금액 → 인보이스 · 보고서 바로 보기 → 결제 계좌(남은 금액 있을 때, 복사) → 마이페이지 설명 · 홈 화면 설치(→ my.html?f=ap)
       · 계좌: 인보이스에 고른 입금 계좌(bankInfo) → 없으면 /api/pay 첫 계좌 → 없으면 MAYBANK 기본값(pay.html 과 같음)
       · 금액 계산은 인보이스 화면(hhc-invoice.html)이 저장해 둔 합계(_t)를 그대로 씁니다. (2026-11-25 청구 상세 표는 빼고 단순화)
     ══════════════════════════════════════════════════════════════ -->

<style>
:root{
  --navy-950:#08172b;--navy-900:#0f2540;--navy-800:#173a5e;
  --teal-700:#0b5f59;--teal-600:#0f766e;
  --gold-700:#8f6f28;--gold-600:#b08d3a;--gold-500:#c9a44c;--gold-300:#e3c98a;--gold-50:#fbf5e6;
  --ink-900:#161d27;--ink-700:#333d4b;--ink-600:#4d5866;--ink-400:#8891a0;
  --line:#e8e2d4;--paper:#fdfcf9;--cream:#f6f2e9;
  --ok:#0E9B63;--red:#DC2626;--warn:#F0B429;
  --ease:cubic-bezier(.22,.61,.36,1);
  --e1:0 1px 2px rgba(11,24,51,.09),0 5px 12px -3px rgba(11,24,51,.14);
  --e2:0 1px 2px rgba(11,24,51,.10),0 8px 16px -4px rgba(11,24,51,.16),0 26px 44px -14px rgba(11,24,51,.34);
  --sf:'Noto Serif KR',serif;--cg:'Cormorant Garamond',serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:#e9ebf0;color:var(--ink-900);line-height:1.6;font-size:16px;letter-spacing:-.01em;word-break:keep-all;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
.tk{max-width:560px;margin:0 auto;background:var(--cream);min-height:100vh;box-shadow:0 0 60px rgba(8,23,43,.1);
  padding-bottom:calc(92px + env(safe-area-inset-bottom));overflow:hidden}
.num{font-variant-numeric:tabular-nums}
/* 히어로 */
.tk-hero{position:relative;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 20px 28px;border-radius:0 0 32px 32px;
  background:radial-gradient(120% 70% at 50% 0%,#1d4573 0%,var(--navy-900) 55%,var(--navy-950) 100%)}
.tk-top{display:flex;align-items:center;gap:10px}
.tk-logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(227,201,138,.35)}
.tk-logo svg{width:22px;height:22px}
.tk-brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.2}
.tk-brand small{font-size:10.5px;font-weight:700;letter-spacing:.14em;color:var(--gold-300)}
:lang(ko) .tk-brand small{font-size:11.5px;letter-spacing:.06em}
:lang(ko) .tk-kick{letter-spacing:.12em}
.tk-lang{margin-left:auto;display:flex;padding:3px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16)}
.tk-lang button{min-width:44px;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:800;color:rgba(255,255,255,.7)}
.tk-lang button.on{background:#fff;color:var(--navy-900)}
.tk-kick{margin-top:24px;text-align:center;font-size:12px;font-weight:800;letter-spacing:.2em;color:var(--gold-300)}
.tk-h1{margin-top:8px;text-align:center;font-family:var(--sf);font-weight:700;font-size:26px;line-height:1.4;letter-spacing:-.04em;text-wrap:balance}
.tk-h1 em{font-style:normal;color:var(--gold-300)}
.tk-sub{margin:10px auto 0;max-width:340px;text-align:center;font-size:15px;color:rgba(255,255,255,.74)}
/* 청구 카드 (남색 판 위 유리 카드) */
.tk-bill{margin:22px auto 0;max-width:360px;padding:18px 20px;border-radius:20px;
  background:linear-gradient(158deg,rgba(255,255,255,.155),rgba(255,255,255,.05) 52%,rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 2px 4px rgba(4,12,26,.35),0 20px 36px -18px rgba(4,12,26,.85)}
.tk-bill .r1{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tk-bill .lb{font-size:12.5px;font-weight:800;letter-spacing:.04em;color:rgba(255,255,255,.66)}
.tk-bill .am{margin-top:2px;font-family:var(--cg);font-feature-settings:'lnum';font-size:40px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.tk-bill .am small{font-size:22px;margin-right:4px;color:var(--gold-300)}
.tk-bill .ln{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);font-size:14px;color:rgba(255,255,255,.82)}
.tk-bill .ln b{color:#fff}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:850;white-space:nowrap}
.pill.due{background:rgba(240,180,41,.18);color:#ffd77a;border:1px solid rgba(240,180,41,.45)}
.pill.od{background:rgba(220,38,38,.2);color:#ffb4b4;border:1px solid rgba(248,113,113,.5)}
.pill.ok{background:rgba(14,155,99,.2);color:#8ff0c4;border:1px solid rgba(52,211,153,.45)}
@media (prefers-reduced-motion:no-preference){.tk-bill{animation:tkIn .7s var(--ease) both}}
@keyframes tkIn{from{opacity:0;transform:translateY(18px)}}
/* 본문 */
.tk-sec{padding:28px 16px 0}
.tk-sh{padding:0 4px 12px}
.tk-sh h2{font-size:21px;font-weight:850;letter-spacing:-.035em;line-height:1.35}
.tk-sh p{margin-top:2px;font-size:14px;color:var(--ink-400)}
.tk-box{background:var(--paper);border-radius:24px;padding:20px;box-shadow:var(--e2)}
/* 문서 바로 보기 */
.tk-docs{background:var(--paper);border-radius:24px;padding:8px;box-shadow:var(--e2)}
.tk-doc{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:14px;padding:12px;border-radius:17px;transition:background .15s var(--ease),transform .14s var(--ease)}
.tk-doc+.tk-doc{margin-top:2px}
.tk-doc:active{transform:scale(.98);background:var(--gold-50)}
@media (hover:hover){.tk-doc:hover{background:#f7f3ea}}
.tk-doc .ic{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;font-size:22px;background:var(--gold-50);box-shadow:inset 0 0 0 1px rgba(201,164,76,.25)}
.tk-doc.my .ic{background:linear-gradient(145deg,var(--navy-800),var(--navy-950));box-shadow:none}
.tk-doc b{display:block;font-size:16px;font-weight:850;letter-spacing:-.025em;line-height:1.35}
.tk-doc small{display:block;font-size:13.5px;color:var(--ink-400);font-weight:600;line-height:1.4}
.tk-doc .go{font-size:13px;font-weight:850;color:var(--navy-900);padding:7px 12px;border-radius:999px;background:#eef0f5;white-space:nowrap}
.tk-doc.inv .go{background:linear-gradient(145deg,#f4e5b4,var(--gold-500));color:var(--navy-950)}
/* 결제 계좌 */
.tk-bank{display:flex;align-items:center;gap:12px}
.tk-bank .lg{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:12px;font-weight:900;letter-spacing:.02em;color:#fff;background:linear-gradient(145deg,#f2b705,#c98a00);text-shadow:0 1px 1px rgba(0,0,0,.2)}
.tk-bank b{display:block;font-size:16.5px;font-weight:850;letter-spacing:-.02em}
.tk-bank small{display:block;font-size:13.5px;color:var(--ink-400);font-weight:650;overflow-wrap:anywhere}
.tk-acc{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 14px 16px;border-radius:16px;background:#f3f0e8}
.tk-acc span{display:block;font-size:12.5px;font-weight:750;color:var(--ink-400)}
.tk-acc b{display:block;font-size:22px;font-weight:850;letter-spacing:.02em;color:var(--navy-900);white-space:nowrap}
.tk-acc.am b{font-size:20px;letter-spacing:-.01em}
.tk-acc+.tk-acc{margin-top:8px}
.tk-cp{flex:none;min-height:44px;padding:0 16px;border-radius:12px;font-size:14.5px;font-weight:850;color:#fff;background:var(--navy-900);transition:transform .14s var(--ease)}
.tk-cp:active{transform:scale(.95)}
.tk-cp.ok{background:var(--ok)}
.tk-note{margin-top:12px;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--gold-50);font-size:14.5px;line-height:1.55;color:var(--ink-700)}
/* 마이페이지 — 남색 판 + 휴대폰 그림(알림이 내려옴) + 기능 말풍선 + 홈 화면 아이콘 */
.tk-mp{position:relative;overflow:hidden;border-radius:26px;padding:24px 18px 20px;color:#fff;
  background:radial-gradient(120% 80% at 50% 0%,#1d4573 0%,var(--navy-900) 55%,var(--navy-950) 100%);box-shadow:var(--e2)}
.tk-mp .kk{text-align:center;font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--gold-300)}
.tk-mp h3{margin-top:6px;text-align:center;font-size:23px;font-weight:850;letter-spacing:-.04em;line-height:1.35;text-wrap:balance}
.tk-mp h3 em{font-style:normal;color:var(--gold-300)}
.tk-mp .ld{margin:6px auto 0;max-width:300px;text-align:center;font-size:14.5px;color:rgba(255,255,255,.74)}
/* 무대 */
.mp-stage{position:relative;height:330px;margin:18px auto 0;max-width:330px}
.mp-ph{position:absolute;left:50%;top:6px;width:168px;height:318px;margin-left:-84px;border-radius:28px;padding:7px;background:#05101f;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.14),0 2px 4px rgba(0,0,0,.4),0 30px 44px -18px rgba(0,0,0,.9)}
.mp-sc{position:relative;height:100%;border-radius:22px;overflow:hidden;background:#f6f2e9}
.mp-hd{height:92px;padding:16px 10px 0;background:linear-gradient(160deg,#1d4573,var(--navy-950))}
.mp-hd small{display:block;font-size:7.5px;font-weight:800;letter-spacing:.12em;color:var(--gold-300)}
.mp-hd b{display:block;margin-top:1px;font-size:11.5px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-cd{margin:-34px 9px 0;position:relative;height:62px;border-radius:10px;padding:8px 9px;color:var(--navy-950);
  background:linear-gradient(135deg,#f6e7b8,var(--gold-500) 60%,#a9852f);box-shadow:0 6px 12px -6px rgba(0,0,0,.5)}
.mp-cd small{display:block;font-size:6.5px;font-weight:900;letter-spacing:.1em;opacity:.75}
.mp-cd b{display:block;margin-top:9px;font-size:9px;font-weight:850}
.mp-gr{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:9px 9px 0}
.mp-gr span{height:30px;border-radius:8px;background:#fff;display:grid;place-items:center;font-size:12px;box-shadow:0 1px 2px rgba(11,24,51,.1)}
.mp-ls{margin:8px 9px 0;padding:7px;border-radius:9px;background:#fff;box-shadow:0 1px 2px rgba(11,24,51,.1)}
.mp-ls i{display:block;height:6px;border-radius:3px;background:#e6e1d6}
.mp-ls i+i{margin-top:5px;width:62%}
.mp-ls em{display:inline-block;margin-bottom:5px;padding:1px 6px;border-radius:999px;font-style:normal;font-size:7px;font-weight:850;color:#fff;background:var(--teal-600)}
.mp-bt{position:absolute;left:9px;right:9px;bottom:9px;height:24px;border-radius:8px;background:var(--navy-900);color:#fff;font-size:8.5px;font-weight:850;display:grid;place-items:center}
/* 알림 */
.mp-nt{position:absolute;left:6px;right:6px;top:8px;z-index:2;display:flex;gap:6px;align-items:center;padding:7px 8px;border-radius:11px;color:var(--ink-900);
  background:rgba(255,255,255,.96);box-shadow:0 8px 16px -6px rgba(0,0,0,.45)}
.mp-nt i{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:11px;background:var(--navy-900)}
.mp-nt b{display:block;font-size:8px;font-weight:850;line-height:1.2}
.mp-nt span{display:block;font-size:8px;line-height:1.3;color:var(--ink-600)}
/* 기능 말풍선 */
.mp-tg{position:absolute;z-index:3;display:flex;align-items:center;gap:6px;padding:8px 11px;border-radius:13px;font-size:13px;font-weight:800;line-height:1.25;white-space:nowrap;color:var(--navy-950);
  background:#fff;box-shadow:0 2px 3px rgba(4,12,26,.3),0 14px 22px -10px rgba(4,12,26,.8)}
.mp-tg i{font-style:normal;font-size:16px}
.mp-tg.t1{left:0;top:58px}.mp-tg.t2{right:0;top:118px}.mp-tg.t3{left:0;top:186px}.mp-tg.t4{right:0;top:246px}
@media (prefers-reduced-motion:no-preference){
  .mp-nt{animation:mpNt 7s 1s var(--ease) infinite both}
  .mp-tg{animation:mpTg .55s var(--ease) both}.mp-tg.t2{animation-delay:.12s}.mp-tg.t3{animation-delay:.24s}.mp-tg.t4{animation-delay:.36s}
  .mp-hi{animation:mpHi 2.4s ease-in-out infinite}
}
@keyframes mpNt{0%{transform:translateY(-130%);opacity:0}8%,46%{transform:none;opacity:1}54%,100%{transform:translateY(-130%);opacity:0}}
@keyframes mpTg{from{opacity:0;transform:scale(.85)}}
@keyframes mpHi{0%,100%{box-shadow:0 0 0 0 rgba(227,201,138,.55),0 8px 16px -6px rgba(0,0,0,.6)}50%{box-shadow:0 0 0 9px rgba(227,201,138,0),0 8px 16px -6px rgba(0,0,0,.6)}}
/* 설치 */
.mp-in{margin-top:18px;padding:16px;border-radius:20px;background:linear-gradient(158deg,rgba(255,255,255,.13),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.15)}
.mp-in>b{display:block;font-size:17px;font-weight:850;letter-spacing:-.025em}
.mp-in>p{margin-top:3px;font-size:14px;color:rgba(255,255,255,.75);line-height:1.5}
.mp-in>p b{color:#fff}
.mp-hs{margin-top:14px;display:flex;justify-content:center;align-items:flex-start;gap:12px}
.mp-hs span{width:42px;text-align:center;font-size:10px;font-weight:700;color:rgba(255,255,255,.55);line-height:1.2}
.mp-hs span i{display:block;width:42px;height:42px;margin-bottom:5px;border-radius:12px;background:rgba(255,255,255,.12)}
.mp-hs span.me{width:56px;color:#fff;font-size:11px;font-weight:850}
.mp-hs span.me i{width:52px;height:52px;margin:-5px auto 5px;border-radius:15px;display:grid;place-items:center;background:var(--navy-900);border:1.5px solid var(--gold-300)}
.mp-hs span.me svg{width:28px;height:28px}
.mp-st{list-style:none;margin-top:14px;display:grid;gap:6px;counter-reset:m}
.mp-st li{display:flex;gap:10px;align-items:center;font-size:14.5px;font-weight:700;color:rgba(255,255,255,.9)}
.mp-st li::before{counter-increment:m;content:counter(m);flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:900;color:var(--navy-950);background:var(--gold-300)}
.mp-go{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:15px;font-size:16.5px;font-weight:850;color:var(--navy-950);
  background:linear-gradient(145deg,#f4e5b4,var(--gold-500));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 10px 20px -10px rgba(201,164,76,.9);transition:transform .14s var(--ease)}
.mp-go:active{transform:scale(.97)}
.mp-alt{display:block;margin-top:12px;text-align:center;font-size:14px;font-weight:750;color:var(--gold-300);text-decoration:underline;text-underline-offset:3px}
@media (max-width:370px){.mp-tg{font-size:12px;padding:7px 9px}.mp-tg i{font-size:14px}.tk-mp h3{font-size:21px}}
.tk-toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));z-index:30;transform:translate(-50%,16px);opacity:0;padding:11px 18px;border-radius:12px;background:var(--navy-950);color:#fff;font-size:14.5px;font-weight:700;transition:.2s;pointer-events:none;white-space:nowrap}
.tk-toast.on{opacity:1;transform:translate(-50%,0)}
/* 감사 편지 */
.tk-letter{background:linear-gradient(160deg,#fff,var(--gold-50));border:1.5px solid var(--gold-300)}
.tk-letter p{font-family:var(--sf);font-size:16px;line-height:1.85;color:var(--ink-700)}
.tk-letter .sg{margin-top:14px;text-align:right;font-size:14px;color:var(--ink-600)}
.tk-letter .sg b{display:block;font-family:var(--sf);font-size:17px;color:var(--navy-900)}
.tk-ft{padding:22px 20px 8px;text-align:center;font-size:12px;color:var(--ink-400)}
/* 불러오는 중 · 오류 */
.tk-msg{padding:110px 28px 40px;text-align:center}
.tk-msg .ic{width:76px;height:76px;margin:0 auto;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--paper);box-shadow:var(--e1)}
.tk-msg h3{margin-top:18px;font-size:20px;font-weight:850}
.tk-msg p{margin-top:8px;font-size:15px;color:var(--ink-600)}
.tk-spin{width:34px;height:34px;margin:0 auto;border-radius:50%;border:3px solid var(--line);border-top-color:var(--navy-900);animation:tkRot .9s linear infinite}
@keyframes tkRot{to{transform:rotate(360deg)}}
/* 하단 */
.tk-dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(246,242,233,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid #e6dfcf}
.tk-dock .in{max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:8px}
.tk-dock a{display:flex;align-items:center;justify-content:center;gap:5px;min-height:52px;border-radius:14px;font-size:15px;font-weight:850;letter-spacing:-.02em;transition:transform .14s var(--ease);white-space:nowrap}
.tk-dock a:active{transform:scale(.97)}
.tk-dock [hidden]{display:none!important}
.tk-dock .iv{color:var(--navy-950);background:linear-gradient(145deg,#f4e5b4,var(--gold-500));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 18px -8px rgba(201,164,76,.7)}
.tk-dock .rp{color:var(--navy-900);background:#fff;border:1.5px solid var(--gold-300)}
.tk-dock .mp{color:#fff;background:linear-gradient(145deg,var(--navy-800),var(--navy-950));box-shadow:0 8px 18px -8px rgba(8,23,43,.7)}
.tk-dock .qa{color:var(--ink-700);background:#ece7da}
@media (max-width:370px){.tk-h1{font-size:22.5px}.tk-bill .am{font-size:34px}.tk-dock a{font-size:13.5px}.tk-doc{gap:11px}.tk-doc .go{padding:6px 10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.tk-dock,.tk-lang,.tk-pay{display:none}.tk{box-shadow:none;padding-bottom:0}.tk-box,.tk-docs{break-inside:avoid}}
