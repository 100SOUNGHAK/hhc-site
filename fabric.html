:root{
  --n:#0E2350;--n2:#16346E;--n3:#0A1A3D;--bl:#2563EB;
  --ink:#14192A;--ink2:#5A6478;--ink3:#98A1B4;
  --line:#E4E9F2;--soft:#F6F8FC;
  --gold:#C9A44C;--gold-d:#8f6f28;--gold-l:#E3C98A;--gold-50:#fbf5e6;
  --e1:0 1px 2px rgba(11,24,51,.09),0 5px 12px -3px rgba(11,24,51,.14);
  --card:0 1px 2px rgba(14,35,80,.06),0 8px 18px -8px rgba(14,35,80,.16);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;background:#EEF1F7;color:var(--ink);font-size:16px;line-height:1.6;letter-spacing:-.012em;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* 상단바 (점검보고서와 같은 모양) */
#rp-top{position:sticky;top:0;z-index:50;background:linear-gradient(180deg,var(--n3),var(--n));color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.rp-topin{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:10px}
.rp-logo{width:30px;height:30px;flex-shrink:0}
.rp-tt{flex:1;min-width:0;line-height:1.25}
.rp-tt b{display:block;font-size:15px;font-weight:700}
.rp-tt span{display:block;font-size:10.5px;color:rgba(255,255,255,.55);letter-spacing:.04em}
.rp-lang{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px;box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.rp-lang button{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;color:rgba(255,255,255,.6);transition:all .18s var(--ease)}
.rp-lang button.on{background:#fff;color:var(--n);box-shadow:0 1px 3px rgba(0,0,0,.3)}

.fr{max-width:520px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}

/* 히어로 */
.fr-hero{position:relative;overflow:hidden;background:linear-gradient(140deg,var(--n),var(--n2) 65%,#1D4090);color:#fff;border-radius:16px;
  padding:16px 16px 14px;margin-bottom:12px;box-shadow:0 3px 8px rgba(6,18,45,.3),0 18px 34px -14px rgba(6,18,45,.7)}
.fr-hero:after{content:'';position:absolute;right:-60px;top:-70px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(201,164,76,.22),rgba(201,164,76,0) 70%);pointer-events:none}
.fr-hero .k{font-size:10px;font-weight:800;letter-spacing:.14em;color:#9FB6E8}
.fr-hero .n{display:flex;align-items:center;gap:9px;font-size:21px;font-weight:900;letter-spacing:-.03em;margin-top:5px;line-height:1.25}
.fr-hero .n i{font-style:normal;font-size:24px}
.fr-hero .sv{display:inline-flex;margin-top:9px;font-size:12px;font-weight:900;color:#3A2A00;background:linear-gradient(140deg,var(--gold-l),var(--gold));
  border-radius:999px;padding:5px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.55)}
.fr-hero .mx{position:relative;z-index:1;display:flex;align-items:baseline;gap:6px;margin-top:14px}
.fr-hero .mx span{font-size:11.5px;font-weight:800;color:#A9BEE9;margin-right:4px}
.fr-hero .mx b{font-size:30px;font-weight:900;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}
.fr-hero .mx small{font-size:13px;font-weight:900;color:var(--gold-l)}
.fr-hero .m{position:relative;z-index:1;display:grid;grid-template-columns:.85fr 1fr 1.25fr;gap:1px;background:rgba(255,255,255,.15);border-radius:11px;overflow:hidden;margin-top:13px}
.fr-hero .m>div{background:rgba(255,255,255,.06);padding:9px;min-width:0}
.fr-hero .m .k2{font-size:9.5px;font-weight:800;color:#A9BEE9}
.fr-hero .m .v2{font-size:12px;font-weight:900;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 카드 */
.fr-card{background:#fff;border-radius:14px;margin-bottom:12px;overflow:hidden;box-shadow:var(--card)}
.fr-hd{display:flex;align-items:center;gap:8px;padding:14px 16px 0;font-size:14px;font-weight:900;letter-spacing:-.02em}
.fr-hd .st{margin-left:auto;font-size:11px;font-weight:800;color:var(--ink3)}
.fr-bd{padding:12px 16px 16px}
.fr-desc p{font-size:15px;line-height:1.75;font-weight:500;color:#333d4b}
.fr-flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:13px}
.fr-flow span{font-size:12px;font-weight:800;color:var(--n);background:#EEF2FA;border-radius:999px;padding:6px 11px}
.fr-flow i{font-style:normal;color:var(--ink3);font-size:11px;font-weight:900}
.fr-tip{display:flex;gap:8px;margin-top:13px;padding:11px 12px;border-radius:11px;background:var(--gold-50);font-size:13.5px;line-height:1.6;font-weight:600;color:#5c4a1c}
.fr-tip b{flex:none}

/* 사진 */
.fr-ph{display:grid;grid-template-columns:1fr 1fr;gap:14px 10px;align-items:start}
.fr-ph.one{grid-template-columns:1fr}
.fr-ph figure{margin:0;cursor:zoom-in}
.fr-ph .im{position:relative;aspect-ratio:4/5;border-radius:12px;overflow:hidden;background:#E9EEF6;box-shadow:var(--e1)}
.fr-ph.one .im{aspect-ratio:4/3}
.fr-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.fr-ph .no{position:absolute;left:8px;top:8px;font-size:10.5px;font-weight:900;color:#fff;background:rgba(14,35,80,.82);border-radius:999px;padding:4px 9px;letter-spacing:.04em}
.fr-ph figcaption{font-size:13px;font-weight:800;color:var(--ink);margin-top:7px;line-height:1.4}
.fr-empty{padding:24px 14px;text-align:center;border-radius:12px;background:#FAFBFE;border:1.5px dashed #D6DEEB;font-size:13.5px;font-weight:700;color:var(--ink2)}
.fr-foot{text-align:center;font-size:11px;font-weight:600;color:var(--ink3);line-height:1.7;padding:6px 0 4px}
.fr-load{display:flex;flex-direction:column;align-items:center;gap:12px;padding:80px 0;color:var(--ink2);font-size:14px;font-weight:600}
.fr-load i{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--n);animation:frSpin .8s linear infinite}
@keyframes frSpin{to{transform:rotate(360deg)}}

/* 크게 보기 */
#zoom{position:fixed;inset:0;z-index:90;background:rgba(6,12,26,.92);display:none;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#zoom.on{display:flex}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}

/* 하단바 (점검보고서와 같은 모양) */
#rp-bar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.82);backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);border-top:1px solid rgba(14,35,80,.08)}
.rp-barin{max-width:520px;margin:0 auto;display:grid;grid-template-columns:52px 52px 1fr;gap:8px}
.rp-barin button,.rp-barin a{height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10.5px;font-weight:700;color:var(--ink2);background:var(--soft);border:1px solid var(--line);text-decoration:none;transition:transform .14s var(--ease)}
.rp-barin button:active,.rp-barin a:active{transform:scale(.95)}
.rp-barin .pri{flex-direction:row;gap:8px;font-size:15px;color:#fff;border:0;background:linear-gradient(160deg,#1D4185,#0E2350);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 8px 18px -8px rgba(14,35,80,.7)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);z-index:95;background:rgba(20,25,42,.92);color:#fff;font-size:13px;font-weight:700;padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:all .2s}
#toast.on{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{#rp-top,#rp-bar,#toast,#zoom{display:none!important}body{background:#fff}.fr{padding:0}.fr-card,.fr-ph figure,.fr-hero{break-inside:avoid}
  .fr-hero{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>

  document.title=it[L]+t('suffix')+' · Happy Home Care';
  var mx='';
  if(svk==='pickup'&&num(d.fbWeight)>0)mx='<div class="mx"><span>'+t('weight')+'</span><b>'+fmt(num(d.fbWeight))+'</b><small>'+t('kgU')+'</small></div>';
  if(svk==='onsite'&&num(d.fbTotalSq)>0)mx='<div class="mx"><span>'+t('size')+'</span><b>'+fmt(r10(num(d.fbTotalSq)))+'</b><small>'+t('sqU')+'</small></div>';
  var ps=(d.fbPhotos||[]).map(okUrl).filter(Boolean),isW=svk==='pickup';
  var ph=!ps.length?'<div class="fr-empty">'+t('empty')+'</div>':
    '<div class="fr-ph'+(ps.length===1?' one':'')+'">'+ps.map(function(u,i){
      return '<figure data-z="'+esc(u)+'"><div class="im"><img src="'+esc(u)+'" alt="" loading="lazy"><span class="no">'+(isW?'#'+(i+1):'STEP '+(i+1))+'</span></div></figure>';}).join('')+'</div>';
  app.innerHTML=
   '<section class="fr-hero"><div class="k">'+t('kicker')+'</div>'+
     '<div class="n"><i>'+it.ic+'</i><span>'+esc(it[L]+t('suffix'))+'</span></div>'+
     '<div class="sv">'+esc(sv[L])+'</div>'+mx+
     '<div class="m"><div><div class="k2">'+t('date')+'</div><div class="v2">'+esc(dot(d.date)||'—')+'</div></div>'+
       '<div><div class="k2">'+t('client')+'</div><div class="v2">'+esc(d.client||'—')+'</div></div>'+
       '<div><div class="k2">'+t('place')+'</div><div class="v2">'+esc(d.addr||'—')+'</div></div></div></section>'+
   '<section class="fr-card"><div class="fr-hd">'+t('about')+'</div><div class="fr-bd fr-desc"><p>'+(ko?sv.dko:sv.den)+'</p>'+
     '<div class="fr-flow">'+(ko?sv.fko:sv.fen).map(function(f,i){return (i?'<i>→</i>':'')+'<span>'+f+'</span>';}).join('')+'</div>'+
     '<div class="fr-tip"><b>💡</b><span>'+(ko?sv.tko:sv.ten)+'</span></div></div></section>'+
   '<section class="fr-card"><div class="fr-hd"><span>'+(isW?t('wPhotos'):t('photos'))+'</span><span class="st">'+(ps.length?ps.length+' '+t('cnt'):'')+'</span></div><div class="fr-bd">'+ph+'</div></section>'+
   '<div class="fr-foot">'+t('foot')+'</div>';
}

/* 크게 보기 · 하단 버튼 · 언어 */
var zb=document.getElementById('zoom');
document.addEventListener('click',function(e){var f=e.target.closest&&e.target.closest('figure[data-z]');if(f){document.getElementById('zimg').src=f.dataset.z;zb.classList.add('on');}});
zb.addEventListener('click',function(){zb.classList.remove('on');});
document.addEventListener('keydown',function(e){if(e.key==='Escape')zb.classList.remove('on');});
function toast(m){var x=document.getElementById('toast');x.textContent=m;x.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){x.classList.remove('on');},2400);}
document.getElementById('b-pdf').onclick=function(){toast(t('printing'));setTimeout(function(){window.print();},400);};
document.getElementById('b-share').onclick=function(){/* 공유 받는 사람에게는 항상 영어(2026-11-23) */var u=location.href;try{var uq=new URL(location.href);uq.searchParams.set('lang','en');u=uq.toString();}catch(e){}var tt='Happy Home Care Report';if(navigator.share){navigator.share({title:tt,url:u}).catch(function(){});return;}
  try{navigator.clipboard.writeText(u).then(function(){toast(t('copied'));},function(){toast(u);});}catch(e){toast(u);}};
function setLang(l){if(l!=='ko'&&l!=='en'||LANG===l)return;LANG=l;
  try{var q=new URLSearchParams(location.search);q.set('lang',l);history.replaceState(null,'',location.pathname+'?'+q.toString()+location.hash);}catch(e){}
  render();}
document.querySelectorAll('.rp-lang button').forEach(function(b){b.onclick=function(){setLang(b.dataset.l);};});

/* 불러오기 */
window.renderReport=function(d){if(!d)return;DATA=d;render();};
function apiDoc(id,_try){
  _try=_try||0;
  return fetch('/api/doc?t=inspection&id='+encodeURIComponent(id),{cache:'no-store'}).then(function(r){
    return r.json().catch(function(){return null;}).then(function(j){
      if(r.status===404||(j&&j.error==='not-found'))return null;
      if(!r.ok||!j||!j.ok){if(r.status>=500&&_try<2)return new Promise(function(res){setTimeout(res,800);}).then(function(){return apiDoc(id,_try+1);});throw new Error((j&&j.error)||('http '+r.status));}
      var d=j.doc||{};delete d.__id;return d;
    });
  },function(e){if(_try<2)return new Promise(function(res){setTimeout(res,800);}).then(function(){return apiDoc(id,_try+1);});throw e;});
}
var SAMPLE={type:'fabric',client:'홍길동',date:'2026-11-15',addr:'Mont Kiara · A-12-3',fbItem:'curtain',fbSvc:'onsite',
  fbRooms:[{room:'거실',w:12,h:9,sq:108},{room:'방1',w:6,h:7.5,sq:45}],fbTotalSq:153,fbPhotos:['cur-step1.jpg','cur-step2.jpg','cur-step3.jpg']};
function boot(){
  render();
  var app=document.getElementById('app');
  if(params.get('preview')==='1'){
    /* 관리자 작성 화면의 「고객 화면 미리보기」 — 저장 전 내용을 같은 사이트의 부모 창에서 받아 그립니다 */
    app.innerHTML='<div class="fr-load"><i></i><span>'+t('loading')+'</span></div>';
    window.addEventListener('message',function(e){if(e.origin!==location.origin||!e.data||!e.data.hhcPreview)return;window.renderReport(e.data.hhcPreview);});
    try{window.parent.postMessage({hhcPreviewReady:1},location.origin);}catch(e){}
    return;
  }
  if(!RID){window.renderReport(SAMPLE);return;}
  app.innerHTML='<div class="fr-load"><i></i><span>'+t('loading')+'</span></div>';
  apiDoc(RID).then(function(d){
    if(!d){app.innerHTML='<div class="fr-card fr-bd" style="margin-top:40px;text-align:center">'+t('notFound')+'</div>';return;}
    window.renderReport(d);
  }).catch(function(){app.innerHTML='<div class="fr-card fr-bd" style="margin-top:40px;text-align:center">'+t('notFound')+'</div>';});
}
boot();
</script>
