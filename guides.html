<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>작업 사진으로 보는 서비스 과정 | 해피홈케어</title>
<meta name="description" content="에어컨 · 세탁기 · 건조기 · 쇼파 · 매트리스 · 커튼, 어떻게 청소하는지 작업 사진으로 확인하세요.">
<meta property="og:type" content="website">
<meta property="og:title" content="작업 사진으로 보는 서비스 과정 | 해피홈케어">
<meta property="og:description" content="에어컨 · 세탁기 · 건조기 · 쇼파 · 매트리스 · 커튼 서비스 과정을 사진으로 확인하세요.">
<meta property="og:image" content="https://happyhomecare.com.my/og-guides.jpg">
<meta name="theme-color" content="#0f2540">
<style>
:root{--navy-950:#08172b;--navy-900:#0f2540;--navy-800:#173a5e;--teal-700:#0b5f59;--teal-600:#0f766e;--gold-700:#8f6f28;--gold-600:#b08d3a;--gold-500:#c9a44c;--gold-300:#e3c98a;--gold-50:#fbf5e6;--ink-900:#161d27;--ink-600:#4d5866;--ink-400:#8891a0;--line:#e8e2d4;--paper:#fdfcf9;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink-900);font-family:"Pretendard","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
.wrap{max-width:560px;margin:0 auto}
/* hero */
.hero{position:relative;background:linear-gradient(160deg,#143358,var(--navy-950) 72%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 22px 100px;overflow:hidden}
.hero:before{content:"";position:absolute;right:-80px;top:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(227,201,138,.16),rgba(227,201,138,0) 68%)}
.top{position:relative;display:flex;align-items:center;justify-content:space-between}
.br{display:flex;align-items:center;gap:10px}
.lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,#e3c98a,#b08d3a);display:grid;place-items:center;color:var(--navy-950);font-weight:900;font-size:18px}
.br b{display:block;font-size:15.5px;font-weight:800;letter-spacing:-.02em}
.br small{display:block;font-size:9px;color:rgba(255,255,255,.55);letter-spacing:.1em;margin-top:1px}
.lang{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px}
.lang button{padding:6px 13px;border-radius:999px;font-size:12px;font-weight:800;color:rgba(255,255,255,.7);min-height:30px}
.lang button.on{background:linear-gradient(135deg,#e3c98a,#c9a44c);color:#2a1f08}
.kick{position:relative;display:inline-flex;align-items:center;gap:8px;margin-top:30px;font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--gold-300)}
.kick i{width:22px;height:1px;background:var(--gold-500)}
h1{position:relative;font-size:27px;line-height:1.28;font-weight:900;letter-spacing:-.045em;margin-top:10px}
h1 span{color:var(--gold-300)}
.sub{position:relative;font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.78);margin-top:10px;letter-spacing:-.015em}
/* body */
main{position:relative;margin-top:-84px;padding:0 18px 40px}
.sec{margin-top:26px}
.sec:first-child{margin-top:0}
.sh{display:flex;align-items:center;gap:9px;margin:0 2px 12px}
.sh i{width:4px;height:17px;border-radius:2px;background:linear-gradient(180deg,var(--gold-300),var(--gold-600))}
.sh h2{font-size:17px;font-weight:900;letter-spacing:-.035em;color:var(--navy-900)}
.sec:first-child .sh h2{color:#fff}.sec:first-child .sh i{background:var(--gold-300)}
.gr{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
.cd{position:relative;display:block;text-align:left;width:100%;cursor:pointer;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 1px 2px rgba(15,37,64,.07),0 12px 22px -12px rgba(15,37,64,.38);transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.cd:active{transform:scale(.985)}
.th{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(160deg,var(--navy-800),var(--navy-950))}
.th img{position:absolute;left:0;top:0;width:100%;height:auto;display:block}
.th:after{content:"";position:absolute;inset:auto 0 0 0;height:42%;background:linear-gradient(0deg,rgba(8,23,43,.5),rgba(8,23,43,0))}
.tag{position:absolute;left:9px;top:9px;z-index:1;font-size:10px;font-weight:900;letter-spacing:.04em;color:#2a1f08;background:linear-gradient(135deg,#e3c98a,#c9a44c);padding:3px 8px;border-radius:999px}
.cb{padding:11px 13px 13px}
.cb b{display:block;font-size:14.5px;font-weight:800;letter-spacing:-.035em;color:var(--navy-900);line-height:1.3;word-break:keep-all}
.cb span{display:block;margin-top:5px;font-size:12px;font-weight:700;color:var(--teal-600);letter-spacing:-.02em}
.gr .cd:last-child:nth-child(odd){grid-column:1/-1}
.gr .cd:last-child:nth-child(odd) .th{aspect-ratio:16/7}
/* cta */
.cta{margin-top:30px;border-radius:22px;padding:20px 20px;background:linear-gradient(160deg,var(--navy-900),var(--navy-950));color:#fff;box-shadow:0 2px 4px rgba(8,23,43,.25),0 18px 30px -16px rgba(8,23,43,.7);text-align:center}
.cta p{font-size:15.5px;font-weight:800;letter-spacing:-.03em;line-height:1.45}
.cta p span{color:var(--gold-300)}
.cta a{display:inline-block;margin-top:14px;padding:13px 24px;border-radius:14px;font-size:15px;font-weight:900;letter-spacing:-.02em;color:#2a1f08;background:linear-gradient(135deg,#e3c98a,#c9a44c 60%,#b08d3a);box-shadow:0 8px 16px -8px rgba(0,0,0,.6)}
.cta a:active{transform:scale(.98)}
.cta small{display:block;margin-top:10px;font-size:11.5px;color:rgba(255,255,255,.6);letter-spacing:.01em}
.foot{margin-top:22px;text-align:center;font-size:11px;color:var(--ink-400);line-height:1.6}
/* viewer */
#vw{position:fixed;inset:0;z-index:50;background:#08172b;display:none;flex-direction:column}
#vw.on{display:flex}
.vh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px 18px;color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}
.vh .tt{flex:1;min-width:0}
.vh .tt small{display:block;font-size:10.5px;font-weight:800;letter-spacing:.1em;color:var(--gold-300)}
.vh .tt b{display:block;font-size:16px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.vx{flex:none;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.1);display:grid;place-items:center}
.vx svg{width:20px;height:20px}
.vs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 24px}
.vs .fr{max-width:560px;margin:0 auto;border-radius:16px;overflow:hidden;background:#fff;box-shadow:0 20px 40px -16px rgba(0,0,0,.7);min-height:260px;position:relative}
.vs img{display:block;width:100%;height:auto}
.vs .ld{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--ink-400);background:#fff}
.vs .nt{max-width:560px;margin:10px auto 0;font-size:12px;color:rgba(255,255,255,.7);text-align:center;line-height:1.5}
.vb{display:grid;grid-template-columns:48px 1fr 1fr 48px;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1);background:rgba(8,23,43,.98)}
.vb button,.vb a{min-height:48px;border-radius:14px;display:grid;place-items:center;font-size:13.5px;font-weight:800;letter-spacing:-.02em;color:#fff;background:rgba(255,255,255,.1)}
.vb svg{width:20px;height:20px}
.vb .gold{color:#2a1f08;background:linear-gradient(135deg,#e3c98a,#c9a44c 60%,#b08d3a)}
.vb button:disabled{opacity:.3}
.vb button:active,.vb a:active{transform:scale(.97)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:#fff;color:var(--navy-900);font-size:13px;font-weight:800;padding:10px 16px;border-radius:999px;box-shadow:0 12px 24px -10px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:359px){.gr{gap:9px}.cb b{font-size:13.5px}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap">
 <header class="hero">
  <div class="top">
   <div class="br"><div class="lg">H</div><div><b id="tBrand">해피홈케어</b><small>HAPPY WORKS SERVICES SDN. BHD.</small></div></div>
   <div class="lang" role="group" aria-label="Language"><button id="bKo" class="on" type="button">한국어</button><button id="bEn" type="button">EN</button></div>
  </div>
  <div class="kick"><i></i>SERVICE GUIDE</div>
  <h1 id="tH1"></h1>
  <p class="sub" id="tSub"></p>
 </header>
 <main id="main"></main>
</div>

<div id="vw" role="dialog" aria-modal="true" aria-labelledby="vT">
 <div class="vh"><div class="tt"><small id="vK"></small><b id="vT"></b></div>
  <button class="vx" id="vClose" type="button" aria-label="닫기"><svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 4l12 12M16 4 4 16"/></svg></button></div>
 <div class="vs" id="vS"><div class="fr"><div class="ld" id="vL"></div><img id="vI" alt=""></div><div class="nt" id="vN"></div></div>
 <div class="vb">
  <button id="vPrev" type="button" aria-label="이전"><svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4 6.500 10l6 6"/></svg></button>
  <button id="vCopy" type="button"></button>
  <a id="vWa" class="gold" target="_blank" rel="noopener"></a>
  <button id="vNext" type="button" aria-label="다음"><svg viewBox="0 0 20 20" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7.500 4l6 6-6 6"/></svg></button>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var WA='60172472774';
  var GROUPS=[
    {id:'ac',ko:'에어컨 세척',en:'Aircon cleaning'},
    {id:'ap',ko:'가전 · 패브릭',en:'Appliances & fabric'},
    {id:'cu',ko:'커튼',en:'Curtains'},
    {id:'cr',ko:'관리 안내',en:'Care guide'}
  ];
  /* file: 한국어 안내장, fileEn: 영문 안내장(있는 것만) */
  var ITEMS=[
    {k:'basic',g:'ac',file:'guide-ac-basic.png',ko:'에어컨 기본 세척',en:'Aircon – basic cleaning'},
    {k:'chem',g:'ac',file:'guide-ac-chemical.png',ko:'에어컨 약품 세척',en:'Aircon – chemical cleaning'},
    {k:'steam',g:'ac',file:'guide-ac-steam.png',ko:'에어컨 스팀 살균 세척',en:'Aircon – steam sterilising'},
    {k:'full',g:'ac',file:'guide-ac-full.png',ko:'에어컨 전체 분해 세척',en:'Aircon – full disassembly'},
    {k:'wash',g:'ap',file:'guide-washer.jpg',ko:'세탁기 · 건조기 분해 세척',en:'Washer & dryer deep cleaning'},
    {k:'fab',g:'ap',file:'guide-fabric.png',ko:'쇼파 · 매트리스 세탁',en:'Sofa & mattress cleaning'},
    {k:'cur',g:'cu',file:'guide-curtain.png',ko:'커튼 현장 세탁',en:'Curtain – on-site cleaning'},
    {k:'curSt',g:'cu',file:'guide-curtain-steam.png',ko:'커튼 약식 스팀살균',en:'Curtain – quick steam sterilising'},
    {k:'curPk',g:'cu',file:'guide-curtain-pickup.png',fileEn:'guide-curtain-pickup-en.png',ko:'커튼 전문 수거세탁',en:'Curtain – pick-up laundry'},
    {k:'care',g:'cr',file:'guide-care.png',fileEn:'guide-care-en.png',ko:'에어컨 청소 주기 안내',en:'Aircon cleaning cycle'}
  ];
  var ALIAS={ac:'basic',svc:null,all:null,curtain:'cur',aircon:'basic',washer:'wash',fabric:'fab',cycle:'care'};
  var T={
    ko:{h1:'작업 사진으로 보는 <span>서비스 과정</span>',sub:'궁금한 서비스를 눌러 실제 작업 과정을 확인하세요.',view:'작업 과정 보기 ›',ph:'GUIDE',close:'닫기',copy:'링크 복사',copied:'링크를 복사했습니다',wa:'WhatsApp 문의',load:'불러오는 중…',err:'이미지를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.',koOnly:'한국어 안내장',noEn:'이 서비스의 영문 안내장은 준비 중입니다. 한국어 안내장을 보여드립니다.',ctaP:'<span>견적 · 예약</span>이 궁금하시면<br>편하게 문의해 주세요.',ctaB:'WhatsApp으로 문의하기',foot:'HAPPY WORKS SERVICES SDN. BHD. · Petaling Jaya',waMsg:'안녕하세요, 해피홈케어 서비스 문의드립니다.',waMsgOne:function(t){return '안녕하세요, 해피홈케어 “'+t+'” 서비스 문의드립니다.'},prev:'이전',next:'다음'},
    en:{h1:'See our service <span>process in photos</span>',sub:'Tap a service to see how the work is done.',view:'View the process ›',ph:'GUIDE',close:'Close',copy:'Copy link',copied:'Link copied',wa:'WhatsApp us',load:'Loading…',err:'Could not load the image. Please try again shortly.',koOnly:'KO',noEn:'An English flyer for this service is coming soon. Showing the Korean version.',ctaP:'Questions about <span>quotes or booking</span>?<br>Just message us.',ctaB:'Chat on WhatsApp',foot:'HAPPY WORKS SERVICES SDN. BHD. · Petaling Jaya',waMsg:'Hello, I have a question about Happy Home Care services.',waMsgOne:function(t){return 'Hello, I have a question about your "'+t+'" service.'},prev:'Previous',next:'Next'}
  };
  /* 주소에서 먼저 읽는다(replaceState로 지워지기 전에) */
  var qs=new URLSearchParams(location.search);
  var lang=qs.get('lang')==='en'?'en':'ko';
  var g0=qs.get('g');
  var cur=-1;
  var $=function(id){return document.getElementById(id)};
  function imgOf(it){return (lang==='en'&&it.fileEn)?it.fileEn:it.file}
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function render(){
    var t=T[lang];
    document.documentElement.lang=lang;
    document.title=lang==='en'?'See our service process in photos | Happy Home Care':'작업 사진으로 보는 서비스 과정 | 해피홈케어';
    $('tBrand').textContent=lang==='en'?'Happy Home Care':'해피홈케어';
    $('tH1').innerHTML=t.h1; $('tSub').textContent=t.sub;
    $('bKo').classList.toggle('on',lang==='ko'); $('bEn').classList.toggle('on',lang==='en');
    var h='';
    GROUPS.forEach(function(gr,gi){
      var list=ITEMS.filter(function(i){return i.g===gr.id});
      if(!list.length)return;
      h+='<section class="sec"><div class="sh"><i></i><h2>'+esc(gr[lang])+'</h2></div><div class="gr">';
      list.forEach(function(it){
        var idx=ITEMS.indexOf(it);
        var tag=(lang==='en'&&!it.fileEn)?'<span class="tag">'+t.koOnly+'</span>':'';
        h+='<div class="cd" role="button" tabindex="0" data-i="'+idx+'"><div class="th">'+tag+'<img src="'+imgOf(it)+'" alt="" loading="lazy" decoding="async"></div><div class="cb"><b>'+esc(it[lang])+'</b><span>'+t.view+'</span></div></div>';
      });
      h+='</div></section>';
    });
    h+='<div class="cta"><p>'+t.ctaP+'</p><a href="https://wa.me/'+WA+'?text='+encodeURIComponent(t.waMsg)+'" target="_blank" rel="noopener">'+t.ctaB+'</a><small>+60 17-247 2774</small></div><div class="foot">'+t.foot+'</div>';
    $('main').innerHTML=h;
    if(cur>=0)fillViewer();
  }
  function urlFor(k){
    var u=location.pathname+'?g='+k+(lang==='en'?'&lang=en':'');return u;
  }
  function fullUrl(k){return location.origin+urlFor(k)}
  function fillViewer(){
    var t=T[lang],it=ITEMS[cur];
    $('vK').textContent='SERVICE GUIDE · '+(cur+1)+' / '+ITEMS.length;
    $('vT').textContent=it[lang];
    $('vClose').setAttribute('aria-label',t.close);
    $('vPrev').setAttribute('aria-label',t.prev);$('vNext').setAttribute('aria-label',t.next);
    $('vCopy').textContent=t.copy;
    var wa=$('vWa');wa.textContent=t.wa;wa.href='https://wa.me/'+WA+'?text='+encodeURIComponent(t.waMsgOne(it[lang]));
    $('vPrev').disabled=cur===0;$('vNext').disabled=cur===ITEMS.length-1;
    var im=$('vI'),ld=$('vL');
    ld.style.display='grid';ld.textContent=t.load;im.style.visibility='hidden';
    im.onload=function(){ld.style.display='none';im.style.visibility='visible'};
    im.onerror=function(){ld.textContent=t.err};
    im.alt=it[lang];
    im.src=imgOf(it);
    $('vN').textContent=(lang==='en'&&!it.fileEn)?t.noEn:'';
    $('vS').scrollTop=0;
  }
  function openV(i,push){
    cur=i;$('vw').classList.add('on');document.body.style.overflow='hidden';
    fillViewer();
    try{history.replaceState(null,'',urlFor(ITEMS[i].k))}catch(e){}
    $('vClose').focus();
  }
  function closeV(){
    cur=-1;$('vw').classList.remove('on');document.body.style.overflow='';
    try{history.replaceState(null,'',location.pathname+(lang==='en'?'?lang=en':''))}catch(e){}
  }
  function toast(m){var e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove('on')},1800)}
  function copy(txt){
    if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(txt)}
    return new Promise(function(res,rej){try{var a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);res()}catch(e){rej(e)}});
  }
  $('main').addEventListener('click',function(e){var b=e.target.closest('.cd');if(b)openV(+b.getAttribute('data-i'))});
  $('main').addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var b=e.target.closest('.cd');if(b){e.preventDefault();openV(+b.getAttribute('data-i'))}});
  $('vClose').addEventListener('click',closeV);
  $('vPrev').addEventListener('click',function(){if(cur>0)openV(cur-1)});
  $('vNext').addEventListener('click',function(){if(cur<ITEMS.length-1)openV(cur+1)});
  $('vCopy').addEventListener('click',function(){copy(fullUrl(ITEMS[cur].k)).then(function(){toast(T[lang].copied)},function(){toast(fullUrl(ITEMS[cur].k))})});
  $('bKo').addEventListener('click',function(){setLang('ko')});
  $('bEn').addEventListener('click',function(){setLang('en')});
  function setLang(l){if(l===lang)return;lang=l;render();if(cur>=0){try{history.replaceState(null,'',urlFor(ITEMS[cur].k))}catch(e){}}else{try{history.replaceState(null,'',location.pathname+(lang==='en'?'?lang=en':''))}catch(e){}}}
  document.addEventListener('keydown',function(e){
    if(cur<0)return;
    if(e.key==='Escape')closeV();
    else if(e.key==='ArrowLeft'&&cur>0)openV(cur-1);
    else if(e.key==='ArrowRight'&&cur<ITEMS.length-1)openV(cur+1);
  });
  render();
  if(g0){
    var key=ALIAS.hasOwnProperty(g0)?ALIAS[g0]:g0, found=-1;
    if(key)ITEMS.forEach(function(it,i){if(it.k===key)found=i});
    if(found>=0)openV(found);
  }
})();
</script>
</body>
</html>
