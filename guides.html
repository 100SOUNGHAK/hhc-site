      h+='<a class="cd cd3" href="'+v.u+'?from=guides'+(lang==='en'?'&lang=en':'')+'"><div class="th"><span class="tag">3D</span><img class="ph" src="'+v.th+'?v='+VER+'" alt="" loading="lazy" decoding="async"><span class="play"></span><div class="cap"><span>'+esc(v.cap[lang==='en'?1:0])+'</span></div></div><div class="cb"><b>'+esc(v[lang])+'</b><span class="go3">'+t.d3v+'</span></div></a>';
    });
    h+='</div></section>';
    GROUPS.forEach(function(gr,gi){
      var list=ITEMS.filter(function(i){return i.g===gr.id});
      if(!list.length)return;
      h+='<section class="sec"><div class="sh"><i></i><h2>'+esc(gr[lang])+'</h2></div><div class="gr">';
      list.forEach(function(it){
        var idx=ITEMS.indexOf(it);
        var tag=((lang==='en'&&!it.fileEn)?'<span class="tag">'+t.koOnly+'</span>':'')+(it.vid?'<span class="vtg">'+t.vvid+'</span>':'');
        var pic=it.ph?'<img class="ph" src="'+it.ph+'?v='+VER+'" alt="" loading="lazy" decoding="async"'+(it.pos?' style="--pos:'+it.pos+(it.z?';transform:scale('+it.z+');transform-origin:'+it.pos:'')+'"':'')+'><div class="cap"><span>'+esc(it.cap[lang==='en'?1:0])+'</span></div>':'<img src="'+imgOf(it)+'" alt="" loading="lazy" decoding="async">';
        h+='<div class="cd" role="button" tabindex="0" data-i="'+idx+'"><div class="th">'+tag+pic+'</div><div class="cb"><b>'+esc(it[lang])+'</b><span>'+t.view+'</span></div></div>';
      });
      h+='</div></section>';
    });
    h+='<div class="cta"><p>'+t.ctaP+'</p><a href="https://wa.me/'+WA+'?text='+encodeURIComponent(t.waMsg)+'" target="_blank" rel="noopener">'+t.ctaB+'</a><small>+60 17-247 2774</small></div><div class="foot">'+t.foot+'</div>';
    $('main').innerHTML=h;
    if(cur>=0)fillViewer();
  }
  function urlFor(k){
    var u=location.pathname+'?g='+k+(lang==='en'?'&lang=en':'');return u;
  }
  function fullUrl(k){return location.origin+urlFor(k)}
  function fillViewer(){
    var t=T[lang],it=ITEMS[cur];
    $('vK').textContent='SERVICE GUIDE · '+(cur+1)+' / '+ITEMS.length;
    $('vT').textContent=it[lang];
    $('vClose').setAttribute('aria-label',t.close);
    $('vPrev').setAttribute('aria-label',t.prev);$('vNext').setAttribute('aria-label',t.next);
    $('vCopy').textContent=t.copy;
    var wa=$('vWa');wa.textContent=t.wa;wa.href='https://wa.me/'+WA+'?text='+encodeURIComponent(t.waMsgOne(it[lang]));
    $('vPrev').disabled=cur===0;$('vNext').disabled=cur===ITEMS.length-1;
    var im=$('vI'),ld=$('vL');
    ld.style.display='grid';ld.textContent=t.load;im.style.visibility='hidden';
    im.onload=function(){ld.style.display='none';im.style.visibility='visible'};
    im.onerror=function(){ld.textContent=t.err};
    im.alt=it[lang];
    im.src=imgOf(it);
    $('vN').textContent=(lang==='en'&&!it.fileEn)?t.noEn:'';
    var vi=vidIdx(it.vid);$('vGo').hidden=vi<0;if(vi>=0){var V=VIDS[vi];$('vGoK').textContent=t.vgoK;$('vGoP').textContent=t.vgoP;$('vGoT').textContent=t.vgo;$('vGoD').textContent=t.vst(V.ch.length)+' · '+fmt(V.d);$('vGoI').src=V.poster+'?v='+VER;var wi=vi,wt=it;if(im.complete&&im.naturalWidth)warmV(wi);else im.addEventListener('load',function(){if(ITEMS[cur]===wt)warmV(wi)},{once:true})}
    $('vS').scrollTop=0;
  }
  function openV(i,push){
    cur=i;$('vw').classList.add('on');document.body.style.overflow='hidden';
    fillViewer();
    try{history.replaceState(null,'',urlFor(ITEMS[i].k))}catch(e){}
    $('vClose').focus();
  }
  function closeV(){
    cur=-1;$('vw').classList.remove('on');document.body.style.overflow='';
    try{history.replaceState(null,'',location.pathname+(lang==='en'?'?lang=en':''))}catch(e){}
  }
  function toast(m){var e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(function(){e.classList.remove('on')},1800)}
  function copy(txt){
    if(navigator.clipboard&&navigator.clipboard.writeText){return navigator.clipboard.writeText(txt)}
    return new Promise(function(res,rej){try{var a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');document.body.removeChild(a);res()}catch(e){rej(e)}});
  }
  $('main').addEventListener('click',function(e){var b=e.target.closest('.cd');if(b&&!b.classList.contains('cd3'))openV(+b.getAttribute('data-i'))});
  $('main').addEventListener('keydown',function(e){if(e.key!=='Enter'&&e.key!==' ')return;var b=e.target.closest('.cd');if(b&&!b.classList.contains('cd3')){e.preventDefault();openV(+b.getAttribute('data-i'))}});
  $('vClose').addEventListener('click',closeV);
  $('vPrev').addEventListener('click',function(){if(cur>0)openV(cur-1)});
  $('vNext').addEventListener('click',function(){if(cur<ITEMS.length-1)openV(cur+1)});
  $('vCopy').addEventListener('click',function(){copy(fullUrl(ITEMS[cur].k)).then(function(){toast(T[lang].copied)},function(){toast(fullUrl(ITEMS[cur].k))})});
  $('bKo').addEventListener('click',function(){setLang('ko')});
  $('bEn').addEventListener('click',function(){setLang('en')});
  function setLang(l){if(l===lang)return;lang=l;render();if(pv>=0){var tt=E.currentTime||0,pl=!E.paused;E.src=srcOf(VIDS[pv])+'?v='+VER;E.addEventListener('loadedmetadata',function f(){E.removeEventListener('loadedmetadata',f);try{E.currentTime=tt}catch(e){}if(pl)E.play()});fillP();return}if(cur>=0){try{history.replaceState(null,'',urlFor(ITEMS[cur].k))}catch(e){}}else{try{history.replaceState(null,'',location.pathname+(lang==='en'?'?lang=en':''))}catch(e){}}}
  document.addEventListener('keydown',function(e){
    if(cur<0)return;
    if(e.key==='Escape')closeV();
    else if(e.key==='ArrowLeft'&&cur>0)openV(cur-1);
    else if(e.key==='ArrowRight'&&cur<ITEMS.length-1)openV(cur+1);
  });
  /* ───── 🎬 영상 플레이어 ───── */
  /* 🌐 영어 화면이면 영어 자막 영상(-en.mp4) (2026-11-23) */
  /* ⚡ 2026-11-23 영상 빨리 시작 — 안내를 여는 순간 그 영상을 미리 받아 둠 */
  function warmV(i){if(i<0||!E||pv>=0)return;var v=VIDS[i],u=srcOf(v)+'?v='+VER;if(E.getAttribute('src')===u)return;E.preload='metadata';E.poster=v.poster+'?v='+VER;E.src=u}
  function srcOf(v){return lang==='en'?v.src.replace(/\.mp4$/,'-en.mp4'):v.src}
  function fmt(x){x=Math.round(x);return Math.floor(x/60)+':'+('0'+x%60).slice(-2)}
  function vidIdx(k){if(!k)return -1;for(var i=0;i<VIDS.length;i++)if(VIDS[i].k===k)return i;return -1}
  var pv=-1,E=$('pE'),iT,retV=-1,retY=0;   /* retV: 안내장에서 「영상으로 보기」로 왔으면 닫을 때 그 안내장으로 돌아감 (2026-11-23) */
  function chAt(v,x){var c=-1;v.ch.forEach(function(q,i){if(x>=q[0]-.05)c=i});return c}
  function flash(pa){var i=$('pI');i.classList.toggle('pa',!!pa);i.classList.add('on');clearTimeout(iT);iT=setTimeout(function(){i.classList.remove('on')},pa?100000:550)}
  function fillP(){
    var t=T[lang],v=VIDS[pv],L=lang==='en'?1:0;
    $('pK').textContent=t.vk+' · '+(pv+1)+' / '+VIDS.length;
    $('pT').textContent=v[lang];
    $('pCopy').textContent=t.copy;
    var wa=$('pWa');wa.textContent=t.wa;wa.href='https://wa.me/'+WA+'?text='+encodeURIComponent(t.waMsgOne(v[lang]));
    $('pPrev').disabled=pv===0;$('pNext').disabled=pv===VIDS.length-1;
    var b='',c='';
    v.ch.forEach(function(q,i){b+='<button type="button" data-c="'+i+'" aria-label="STEP '+(i+1)+'"><i></i></button>';c+='<button type="button" data-c="'+i+'"><i>'+(i+1)+'</i>'+esc(q[1+L])+'</button>'});
    $('pB').innerHTML=b;$('pC').innerHTML=c;
    $('pXs').textContent=t.vend;
    $('pXn').textContent=pv<VIDS.length-1?t.vnext(VIDS[pv+1][lang]):t.vfirst;
    $('pXr').textContent=t.vagain;
    tick();
  }
  function tick(){
    if(pv<0)return;var v=VIDS[pv],x=E.currentTime||0,c=chAt(v,x);
    var bs=$('pB').children,cs=$('pC').children;
    for(var i=0;i<bs.length;i++){
      var s0=v.ch[i][0],s1=i<v.ch.length-1?v.ch[i+1][0]:(E.duration||v.d)-1.5;
      var f=x<=s0?0:x>=s1?1:(x-s0)/(s1-s0);
      bs[i].firstChild.style.width=(f*100)+'%';
      cs[i].classList.toggle('on',i===c);cs[i].classList.toggle('dn',i<c);
    }
    if(c!==tick.c){tick.c=c;if(c>=0){var el=cs[c],box=$('pC');box.scrollTo({left:el.offsetLeft-box.clientWidth/2+el.offsetWidth/2,behavior:'smooth'})}}
  }
  function openP(i){
    pv=i;tick.c=-2;var v=VIDS[i];
    $('vp').classList.add('on');document.body.style.overflow='hidden';
    $('pX').classList.remove('on');
    var u=srcOf(v)+'?v='+VER;E.poster=v.poster+'?v='+VER;E.preload='auto';if(E.getAttribute('src')!==u)E.src=u;try{E.currentTime=0}catch(e){}
    fillP();
    var p=E.play();if(p&&p.catch)p.catch(function(){flash(true)});
    try{history.replaceState(null,'',location.pathname+'?v='+v.k+(lang==='en'?'&lang=en':''))}catch(e){}
  }
  function closeP(){
    pv=-1;E.pause();E.removeAttribute('src');E.load();
    $('vp').classList.remove('on');document.body.style.overflow='';
    try{history.replaceState(null,'',location.pathname+(lang==='en'?'?lang=en':''))}catch(e){}
    if(retV>=0){var r=retV,y=retY;retV=-1;openV(r);$('vS').scrollTop=y;}
  }
  function seekCh(c){var v=VIDS[pv];E.currentTime=v.ch[c][0]+.05;$('pX').classList.remove('on');E.play();tick()}
  E.addEventListener('timeupdate',tick);
  E.addEventListener('play',function(){$('pI').classList.remove('on')});
  E.addEventListener('ended',function(){$('pX').classList.add('on')});
  $('pV').addEventListener('click',function(e){if(e.target.closest('.vpe'))return;if(E.paused){E.play();flash(false)}else{E.pause();flash(true)}});
  $('pB').addEventListener('click',function(e){var b=e.target.closest('button');if(b)seekCh(+b.getAttribute('data-c'))});
  $('pC').addEventListener('click',function(e){var b=e.target.closest('button');if(b)seekCh(+b.getAttribute('data-c'))});
  $('pXr').addEventListener('click',function(){seekCh(0);E.currentTime=0});
  $('pXn').addEventListener('click',function(){openP(pv<VIDS.length-1?pv+1:0)});
  $('pClose').addEventListener('click',closeP);
  $('pPrev').addEventListener('click',function(){if(pv>0)openP(pv-1)});
  $('pNext').addEventListener('click',function(){if(pv<VIDS.length-1)openP(pv+1)});
  $('pCopy').addEventListener('click',function(){var u=location.origin+location.pathname+'?v='+VIDS[pv].k+(lang==='en'?'&lang=en':'');copy(u).then(function(){toast(T[lang].copied)},function(){toast(u)})});
  $('main').addEventListener('click',function(e){var b=e.target.closest('.vrc');if(b)openP(+b.getAttribute('data-v'))});
  $('vGo').addEventListener('pointerdown',function(){warmV(vidIdx(ITEMS[cur].vid))});
  $('vGo').addEventListener('click',function(){var i=vidIdx(ITEMS[cur].vid);retV=cur;retY=$('vS').scrollTop;closeV();openP(i)});
  document.addEventListener('keydown',function(e){
    if(pv<0)return;
    if(e.key==='Escape')closeP();
    else if(e.key===' '){e.preventDefault();$('pV').click()}
    else if(e.key==='ArrowLeft'&&pv>0)openP(pv-1);
    else if(e.key==='ArrowRight'&&pv<VIDS.length-1)openP(pv+1);
  });
  var v0=qs.get('v');
  render();
  if(v0&&vidIdx(v0)>=0)openP(vidIdx(v0));
  if(g0){
    var key=ALIAS.hasOwnProperty(g0)?ALIAS[g0]:g0, found=-1;
    if(key)ITEMS.forEach(function(it,i){if(it.k===key)found=i});
    if(found>=0)openV(found);
  }
})();
</script>
