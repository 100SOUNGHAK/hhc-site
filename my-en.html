<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Home Care · MY PAGE</title>

<!-- ══════════════════════════════════════════════════════════════════
     영문 전용 링크 미리보기 페이지 (English link-preview bridge)

     왓츠앱·카카오톡 등은 링크를 받으면 페이지의 자바스크립트를 실행하지 않고
     아래 og: 태그만 읽어 미리보기 카드를 만듭니다. 그래서 my.html 하나로는
     언어에 따라 다른 카드를 만들 수 없습니다.
       · 영어로 발송할 때만 이 주소(my-en.html)를 보내면 카드가 100% 영어로 나오고,
       · 고객이 링크를 누르면 아래 스크립트가 곧바로 원래 마이페이지(my.html)로 넘겨줍니다.

     ⚠️ 이 파일은 한 번만 올리면 되고, 마이페이지 내용이 바뀌어도 수정할 필요가 없습니다.
        (내용은 모두 my.html 에 있습니다)
     ══════════════════════════════════════════════════════════════════ -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Happy Home Care">
<meta property="og:title" content="Happy Home Care · MY PAGE">
<meta property="og:description" content="Invoices · Inspection reports · Contract balance · Vouchers — check anytime.">
<meta property="og:image" content="https://hhc-3p8.pages.dev/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:url" content="https://hhc-3p8.pages.dev/my-en.html">
<meta property="og:locale" content="en_MY">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Happy Home Care · MY PAGE">
<meta name="twitter:description" content="Invoices · Inspection reports · Contract balance · Vouchers — check anytime.">
<meta name="twitter:image" content="https://hhc-3p8.pages.dev/icon-512.png">
<meta name="robots" content="noindex">
<link rel="icon" href="icon-512.png">

<!-- 스크립트가 막혀 있어도 넘어가도록 하는 예비 장치 (0.6초 뒤 이동) -->
<noscript><meta http-equiv="refresh" content="0;url=my.html"></noscript>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  background:linear-gradient(160deg,#0E2350,#16346E 60%,#1D4090);color:#fff;
  display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.wrap{max-width:340px}
.logo{width:64px;height:64px;margin:0 auto 18px;border-radius:19px;display:flex;align-items:center;justify-content:center;
  font-size:16px;font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(155deg,#3B6FE8,#1B3FA8 60%,#122A6E);
  box-shadow:0 3px 6px rgba(6,18,45,.5),0 14px 26px -10px rgba(6,18,45,.85),
    inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.3)}
h1{font-size:18px;font-weight:900;letter-spacing:-.02em}
p{font-size:12.5px;font-weight:700;color:#B9CBEF;margin-top:9px;line-height:1.7}
.sp{width:26px;height:26px;margin:20px auto 0;border:2.5px solid rgba(255,255,255,.28);
  border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
a.go{display:inline-flex;align-items:center;justify-content:center;gap:7px;margin-top:20px;text-decoration:none;
  font-size:13.5px;font-weight:900;color:#0E2350;background:#fff;border-radius:12px;padding:12px 22px;
  box-shadow:0 6px 16px -6px rgba(0,0,0,.5)}

/* HHC 로고 마크 — 자리의 글자색을 그대로 물려받는다 */
.hhc-mark{width:1.35em;height:1.35em;max-width:82%;max-height:82%;flex:none;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><svg class="hhc-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false"><g fill="currentColor"><rect x="15" y="14" width="19" height="74" rx="3.5"/><rect x="66" y="14" width="19" height="74" rx="3.5"/><path d="M50 28 85 51v16L50 43 15 67V51Z"/></g></svg></div>
  <h1>Happy Home Care</h1>
  <p>Opening your MY PAGE…</p>
  <div class="sp"></div>
  <a class="go" id="go" href="my.html">Open MY PAGE →</a>
</div>

<script>
/* 받은 주소의 값(c · v · lang 등)을 그대로 넘겨 마이페이지를 엽니다.
   lang 이 없으면 영어(en)로 엽니다 — 이 페이지는 영문 발송 전용이기 때문입니다. */
(function(){
  var q=new URLSearchParams(location.search);
  if(!q.get('lang'))q.set('lang','en');
  var url='my.html?'+q.toString();
  var a=document.getElementById('go');
  if(a)a.href=url;
  try{location.replace(url);}catch(e){location.href=url;}
})();
</script>
</body>
</html>
